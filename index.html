うどよい。透明なアセテートで作る箱は中身が見えるため、贈り物の見せ方としても楽しい。箱の色や飾りを変えれば、誕生日や季節の行事にも合わせやすい。\n箱を作るときは、折り線をすべて折ってから貼ると、形がきれいに仕上がる。両面テープはすぐに付くため、接着剤よりも扱いやすい。箱の色を変えれば、誕生日や季節の行事にも合わせやすい。\n【ポイント・注意点】箱の紙は67ポンドの滑らかなカードストックが向いており、色が中まで通っているものを選ぶと折り目が白くならない。グリッター紙や鏡面紙は折る部分には向かないため、飾りとして使うのがよい。小さくしすぎるとタブが細くなってテープが貼りにくくなる。Joyにはスコア機能がないため、切った後に定規で折り目を付けるとよい。","2026-11-12","Celebration Warehouse","http://www.celebrationwarehouse.com/blogs/idea-boards/how-to-make-a-gift-box-with-cricut"],["間違えた種類も直せる！Design Spaceの新機能","Design Spaceでプロジェクトの種類を間違えても、最初から作り直さずに変更できるようになった新機能を紹介する記事。デスクトップ版10.10で追加され、10.11は11月9日に配信された。キャンバスのプレビュー画面から種類を選び直すだけで済み、切り替え後はサイズや素材、操作を再確認することが勧められている。公式のリリースノートにも載っているデスクトップ版の新機能だ。","\n【概要】Design Spaceでプロジェクトの種類を間違えても、最初から作り直さずに変更できるようになった新機能を紹介する記事である。デスクトップ版10.10で追加され、10.11は11月9日に配信された。キャンバスのプレビュー画面から種類を選び直すだけで済み、切り替え後はサイズや素材、操作を再確認することが勧められている。\n【背景】プロジェクトを作り始めてから種類の間違いに気付くと、これまでは作り直しが必要で手間がかかっていた。種類ごとに扱える素材や操作が違うため、途中で気付くと作業が止まってしまう。この新機能は、そうしたやり直しをなくすためのものだ。\n【詳細】使い方は、まずDesign Spaceを最新版に更新する。次にキャンバスでプロジェクトのプレビューを開き、そこで本来必要な種類を選び直す。選び直した後は、サイズや素材、操作が種類ごとに違う扱いになるため、作る前に確かめ直すことが大切だ。公式のリリースノートにも、この変更がデスクトップ版の新機能として載っている。\nこの変更はデスクトップ版のリリースノートにも載っており、公式の新機能として紹介されている。種類を変えた後は、サイズや素材、操作が種類ごとに違う扱いになるため、作る前に確かめ直すことが大切だ。間違えたまま作り進めてしまうと、材料を無駄にすることもある。まずはプレビュー画面で種類を確認する習慣をつけると安心だ。作り直しの手間が減れば、新しい作品への挑戦もしやすくなる。\nプレビュー画面から選び直すだけなので、操作自体は難しくない。それでも切り替え後は、作る前に設定を確認する習慣が大切だ。\n【ポイント・注意点】この機能はデスクトップ版の話で、モバイルアプリはアプリストアを通じた独自の更新のタイミングになる。種類を変えた後は、素材設定やサイズが変わっていることがあるため、必ず作る前に確認すること。関連する記事では、プリントして切るステッカーの位置ずれや、アイロン用ビニールの反転、圧力の調整など、基本的な困りごとの対処法も紹介されている。","2026-11-11","Inkember Creations","https://inkembercreations.com/tips/cricut/cutting-machines/change-project-type-without-starting-over"],["20日間毎日届く！クリスマスクラフトの無料企画","20日間毎日新しいクリスマス作品が届く、無料のオンラインイベント「クリスマスクラフトカウントダウン」を紹介する記事。11月11日から20日間、毎日メールで新しいプロジェクトが届き、カットファイルは公開から24時間だけ無料でダウンロードできる。SVGやDXF、EPS、PNG形式で、CricutのほかSilhouetteやBrotherの機械でも使える。参加者向けの企画もあり、JoyやJoy 2用に小さくできる作品もある。","\n【概要】20日間毎日新しいクリスマス作品が届く、無料のオンラインイベント「クリスマスクラフトカウントダウン」を紹介する記事である。11月11日から20日間、毎日メールで新しいプロジェクトが届き、カットファイルは公開から24時間だけ無料でダウンロードできる。SVGやDXF、EPS、PNG形式で、CricutのほかSilhouetteやBrotherの機械でも使える。\n【背景】クリスマスの準備は、毎日少しずつ進めると楽しいものだ。20日間続くイベントなら、毎日の楽しみとして新しい作品に取り組める。無料で参加でき、作り方の動画も残るため、自分のペースで作れるのも魅力になっている。\n【詳細】参加は無料で、メールアドレスを登録すると、11月11日から20日間、毎日新しいプロジェクトの案内が届く。カットファイルは公開から24時間だけ無料で、過ぎると有料になる。チュートリアルと動画は24時間を過ぎても無料で見られる。ファイルはSVG、DXF、EPS、PNGの4形式で、20作品のうち14作品はJoyやJoy 2用に小さくできる。\nイベントでは毎日のプロジェクトのほか、参加者同士で作る楽しみや、賞品がもらえる企画も用意されている。ファイルはSVG、DXF、EPS、PNGの4形式で、色付きのカードストックや接着剤、フォームパッドなどがあれば作れる作品が多い。JoyやJoy 2用に小さくできる作品も14点あるため、手持ちの機械に合わせて楽しめる。毎日届くメールを楽しみにしながら、少しずつクリスマスの準備を進められる。\nカットファイルは公開から24時間だけ無料なので、毎日のメールを見逃さないことが大切だ。チュートリアルと動画は残るため、後からでも作り方を確認できる。\n【ポイント・注意点】無料でダウンロードできるのは公開から24時間だけなので、毎日のメールを見逃さないことが大切だ。ダウンロードしたファイルは自分のパソコンや携帯に保存すれば期限はない。逃した場合は個別に購入するか、有料のバンドルでまとめて手に入れる方法がある。多くの作品でスコア線が必要になるため、スコアツールがない人は代わりの方法を学べる案内も用意されている。","2026-11-11","Craft with Sarah","https://craftwithsarah.lpages.co/christmas26"]],"uv":[["エプソン、UAEでUVフラットベッド「SC-V4000」を訴求","エプソンは2026年11月17日付の発表で、UAEの印刷事業者向けにUVフラットベッド機SC-V4000を中心とするSureColorシリーズを訴求した。10色UVインクと点字印刷を備え、販促物や美術品、アクセシブルなサインまでを1台でこなす。UAEのカスタム印刷市場は2030年に8億6070万ドルへ成長する見通しで、利益率が伸び悩む印刷会社の多角化を後押しする狙いだ。","\n【概要】\nエプソンは2026年11月17日付の発表で、UAEの印刷サービス事業者向けにSureColorシリーズのUVフラットベッド機とエコソルベント機を訴求した。中心となるSC-V4000は販促物や美術品、点字サインまでを1台でこなす直接印刷機で、10色UVインクと最大7.8インチの印刷可能高さを備える。UAEのカスタム印刷市場は2030年に8億6070万ドルへ成長する見通しで、利益率が頭打ちの印刷会社にとって多角化の受け皿になるとしている。\n【背景】\nエプソンはUAEのカスタム印刷市場について、2024年の5億6580万ドルから2030年には8億6070万ドルへ拡大するとの調査会社の見通しを紹介した。一方で商業印刷会社の72％超が利益率の横ばいや低下に直面しているとし、コスト上昇が背景にあると指摘。印刷の買い手の90％超が複数のニーズを1社にまとめる「ワンストップ」を好むとして、多角化は選択肢ではなく必須だと訴えた。やり直しや廃棄による損失が年間売上高の10～20％に及ぶ場合もあるという。\n【詳細】\nSC-V4000は硬質素材への直接印刷に対応するUVフラットベッド機で、カスタマイズした販促品や質感のある高級仕上げ、ファインアート作品を想定する。赤・グレー・白・ニスを含む10色のUVインクセットを搭載し、点字印刷機能を内蔵することでアクセシブルなサインも内製できるという。エプソンはあわせて、11色のUltraChrome GS3インクを使う大型機SC-S9100と、6色インクで量産向けのSC-S8100も紹介。SC-S9100は前機種SC-S80600と比べて生産性が10％向上したとし、両機ともユーザーが交換できるプリントヘッドを備える。\n【ポイント・注意点】\nSC-V4000の強みは販促物から美術品、点字サインまで幅広い用途を1台でまかなえる点にある。ただし発表はUAE市場向けのもので、日本での価格や発売時期は示されていない。生産性の数値はメーカーの主張であり、実際の速度は素材や設定で変わる。導入を検討する際は、対応素材や点字印刷の運用、保守体制を販売店に確認しておきたい。","2026-11-17","Stocks Breaking","https://www.stocksbreaking.com/epson-outlines-surecolor-uv-flatbed/"],["Inkera、卓上フルカラーUV 3Dプリンター「C1」を発表","新興メーカーのInkeraは、卓上型のフルカラーUV 3Dプリンター「C1」を発表した。ドイツで開かれるFormnext 2026で初公開され、造形サイズは200×150×120ミリと机上に置ける大きさながら、8チャンネルのマテリアルジェットで1000万色以上の表現をうたう。発売は2027年第1四半期を予定し、価格と予約方法は後日発表される。8チャンネルで色と素材を重ね、ガラスのような表現や水溶性サポート材による細部の再現も可能だ。","\n【概要】\n新興メーカーのInkeraは、卓上型のフルカラーUV 3Dプリンター「C1」を発表した。ドイツ・フランクフルトで開かれるFormnext 2026で初公開される。造形サイズは200×150×120ミリと机上に置ける大きさながら、8チャンネルのマテリアルジェットで1000万色以上の表現をうたう。発売は2027年第1四半期を予定し、価格と予約方法は後日発表される。\n【背景】\nフルカラーのジェット造形はこれまで業務用が中心で、価格や大きさ、運用の複雑さが個人や小規模チームの壁になっていた。InkeraはプリントヘッドやUV硬化、インクの流動特性、動作制御、スライサー、サポート材までを一体で設計し直すことで、卓上サイズへの小型化を図ったという。狙うのはクリエイターやデザイナー、教育現場、小規模な製品チームがアイデアをその場で色付きの立体物にできる環境だ。\n【詳細】\nC1はCMYK・白・透明・サポート材・スポットカラーの8チャンネルで色と素材を同時に積層する。透明材によるガラスのような表現や光沢、細部の再現が可能で、サポート材は水溶性のため顔や文字、細かい造形を傷めにくいという。8番目の「スポットカラー」は混色では出しにくい色を専用チャンネルで再現し、プリントごとの色ぶれを抑える。フィギュアやキャラクターモデル、贈答品、教材、試作品などの用途を想定している。展示では色と造形を一体化させることで塗装の手間を省ける点も訴求点になる。\n【ポイント・注意点】\n1000万色超と卓上サイズの組み合わせは魅力的だが、価格が未発表のため導入コストはまだ判断できない。発売は2027年第1四半期予定で、実機の造形品質や色の安定性は展示会での確認が欠かせない。Formnext 2026ではホール12.1のブースB11で展示される。購入を検討する場合は、対応する造形材料やソフトウェアの扱いもあわせて確かめたい。なお同社はフルカラー技術の開発に特化した新興企業で、製品の第一弾がこのC1になる。今後の展開にも注目したい。","2026-11-17","WCIA","https://www.wcia.com/business/press-releases/cision/20261117CN98052/inkera-brings-full-color-3d-printing-to-the-desktop-with-the-c1/"],["ミマキ、フルカラー3Dプリンター「3DUJ-553MkII」を発表","ミマキはUV硬化インクジェット方式のフルカラー3Dプリンター「3DUJ-553MkII」を発表した。色域は前機種の約1.4倍に広がり、1000万色以上の再現とともに木目や革、炭素繊維、大理石調の質感も表現できる。内部を埋める専用の充填インクで造形コストを抑え、連続印刷を自動化する新機能も備えた。発売は2027年春を予定している。世界初公開は11月17日からのFormnext 2026だ。","\n【概要】\nミマキはUV硬化インクジェット方式のフルカラー3Dプリンター「3DUJ-553MkII」を発表した。色域は前機種の約1.4倍に広がり、1000万色以上の再現とともに木目や革、炭素繊維、大理石調の質感も表現できる。内部を埋める専用の充填インクで造形コストを抑え、連続印刷を自動化する新機能も備えた。世界初公開は11月17日から始まるFormnext 2026で、発売は2027年春を予定している。\n【背景】\nフルカラー3Dプリントはフィギュアや商品モックアップの試作で需要が広がる一方、色の再現範囲と造形コストが用途拡大の壁になっていた。ミマキは前機種3DUJ-553の「1000万色以上」という特長をさらに磨き、ブランドカラーやキャラクターの色指定など色の正確さが求められる用途に応える。生成AIを含む3Dデータ生成技術の進化も追い風に、3Dプリントの活用範囲はさらに広がると見ている。\n【詳細】\n色域の拡大により、鮮やかな色から深みのある色合い、微妙なグラデーションまでをより正確に再現できるという。新たに開発した充填インクは造形物の内部構造専用の低価格インクで、従来は内部までカラーインクを使っていた分を置き換える。内部体積の大きい造形物ほどコスト削減の効果が大きく、大型モデルやインテリア装飾品の商品化もしやすくなる。新機能「スマートリレー」は次のジョブを事前に設定しておくと、造形が終わった後にベッド後方の空きを使って自動で次の印刷を始める。木目や革、炭素繊維、大理石調といった素材感の再現は、製品モックアップで最終製品の仕上がりを具体的に共有したい場面に役立つという。\n【ポイント・注意点】\n価格はまだ発表されておらず、発売は2027年春と先の話だ。色域約1.4倍という数値はミマキ社内の条件による比較で、実物の色味は展示会やサンプルで確認したい。8月に始めたクラウドソフト「Mimaki 3D Print Prep Pro ver2」と組み合わせ、データ準備から印刷までを支援する体制も整えつつある。","2026-11-17","ミマキ","https://mimaki.com/news/product/entry-471549.html"],["eufyMake E1とxTool Omni、卓上UVプリンター徹底比較","卓上UVプリンターの2強とされるeufyMake E1とxTool O1 Omniを、同じ条件で比べた比較記事が公開された。両機ともエプソンF1080ヘッドを搭載し、印刷面積は330×420ミリで同じだが、価格はE1が1799ドル、Omniが2249ドルと差がある。結論として、硬質素材中心なら実績のあるE1、布への印刷が必要ならOmniのファブリック版が向くとしている。","\n【概要】\n卓上UVプリンターの2強とされるeufyMake E1とxTool O1 Omniを、同じ条件で比べた比較記事が公開された。両機ともエプソンF1080ヘッドを搭載し、印刷面積は330×420ミリで同じだが、価格はE1が1799ドル、Omniが2249ドルと差がある。結論として、硬質素材中心なら実績のあるE1、布への印刷が必要ならOmniのファブリック版が向くとしている。\n【背景】\nE1は2025年4月のクラウドファンディングを経て1年以上販売されており、ユーザーの声や消耗品の入手経路が整ってきた。一方Omniは2026年7月に予約が始まり、8月から出荷されたばかりの新顔だ。同じヘッドを積む2機種だけに、差がつくのはソフトや運用の作り込みだとして、記事はシングルヘッド同士の公平な比較にこだわり、デュアルヘッド版だけの機能は区別して扱っている。\n【詳細】\n速度面ではE1が2026年9月のソフト更新で双方向印刷に対応し、往復とも印刷するため理論上は最大2倍速くなった。Omniは片方向印刷のままだという。白インクはE1が硬質用と柔軟用を1台で切り替えられるのに対し、Omniのシングルヘッド版はどちらか一方のみ。セットアップはE1が自動充填、Omniは手動での呼び水作業が必要になる。大きさはE1が20キロ、Omniは約41キロと倍近く違う。立体感はOmniが最大7ミリとE1の5ミリを上回る。記事はまた、OmniのロールフィーダーはUV DTFとセットでしか買えず、単体では購入できない点も指摘している。アクセサリー類は両機ともロータリーやラミネーター、ロール対応がそろう。\n【ポイント・注意点】\n両機ともヘッドの定格寿命は公表されておらず、長期の耐久性は未知数だ。Omniのデュアルヘッド版はヘッド交換が2個分になる点も見逃せない。4-in-1の看板はファブリック版だけの話で、シングル版とデュアル版はUV専用だ。版ごとにできることが違い、後から変更できないため、購入前に用途を絞って版を選ぶことが大切だ。","2026-11-16","Technology Org","https://www.technology.org/2026/11/16/eufymake-e1-vs-xtool-omni-which-desktop-uv-printer-should-you-actually-buy/"],["2026年の卓上UVプリンター5選、用途別に比較","米国のガジェット情報サイトThe Gadgeteerが、2026年に買える卓上UVプリンター5機種を比較した。総合1位はxTool O1 Omni、初めての1台にはeufyMake E1、小物専用にはProcolored V4を挙げ、クラウドファンディング組のMorphoとHeyGears G1Xも注目機として紹介する。価格と仕様はすべてメーカーの公式ページで確認したとしており、3機種がブラックフライデーで値下げ中だという。","\n【概要】\n米国のガジェット情報サイトThe Gadgeteerが、2026年に買える卓上UVプリンター5機種を比較した。総合1位はxTool O1 Omni、初めての1台にはeufyMake E1、小物専用にはProcolored V4を挙げ、クラウドファンディング組のMorphoとHeyGears G1Xも「注目機」として紹介する。価格と仕様はすべてメーカーの公式ページで確認したとしており、3機種がブラックフライデーで値下げ中だという。\n【背景】\n卓上UVプリンターはかつて1万ドル超の業務用フラットベッドが主流だったが、2000ドル台の卓上機が登場し、木材やアクリル、ガラス、金属、布に直接印刷できる身近な道具になった。記事は用途と予算で選ぶための指針を示すもので、3機種はすぐ買える市販品、2機種はまだ出荷前のクラウドファンディング機と明確に分けている。\n【詳細】\nO1 Omniは2,249ドル（定価2,499ドル）で、UV印刷とUV DTFに加え、布用版ではDTGとDTFもこなす。E1は1,999ドル（定価2,409ドル）で、330×420ミリのベッドと最大5ミリの立体テクスチャが特長だ。Procolored V4は2,299ドルで印刷面積120×170ミリと小さいが、スマホケースなど小物に特化する。Morphoはレイトプレッジ2,159ドル、G1Xは早期割引3,299ドルで、いずれも出荷前だ。O1 Omniは大型ベッドで最大150ミリまでの立体物に対応し、蛍光インクを使うデュアルヘッド版も選べる。E1は300種類以上の素材に対応し、ロータリーで円筒物にも印刷できる。G1XはDTGとDTFを内蔵し、樹脂ステーションを追加すればフルカラー3D印刷にも拡張できる。\n【ポイント・注意点】\nクラウドファンディングの2機種は「今月中に事業で使いたいなら上位3機種へ」と釘を刺している。E1は専用カートリッジ式でサードパーティー製インクを使うと保証対象外になる点、O1 Omniは版によってできることが違い後から変更できない点にも注意が必要だ。価格はブラックフライデー期間のもので、購入時に再確認したい。","2026-11-14","The Gadgeteer","https://the-gadgeteer.com/2026/11/14/the-5-best-desktop-uv-printers-to-buy-in-2026/"],["LONGER、デュアルヘッド卓上UVプリンター「ePrint」","LONGERは、エプソンF1080プリントヘッドを2基搭載した卓上UVプリンター「ePrint」を、ブラックフライデー2026の目玉として紹介した。12のインクチャンネルでフルカラー印刷と最大15ミリの立体レリーフに対応し、300種類以上の素材に印刷できるという。セール価格はシングルUV版が1,899ドルで、クーポン併用で1,766.07ドルまで下がる。セール期間は12月2日まで。","\n【概要】\nLONGERは、エプソンF1080プリントヘッドを2基搭載した卓上UVプリンター「ePrint」を、ブラックフライデー2026の目玉として紹介した。12のインクチャンネルでフルカラー印刷と最大15ミリの立体レリーフに対応し、300種類以上の素材に印刷できるという。セール価格はシングルUV版が1,899ドルで、クーポン併用で1,766.07ドルまで下がる。セール期間は12月2日まで。\n【背景】\nLONGERは2016年創業の卓上造形機器メーカーで、レーザー彫刻機や3Dプリンターを手がけてきた。ePrintはそのUV印刷部門の新製品で、従来の平面印刷を超えた立体的な表現を小さな工房でも扱えるようにする狙いがある。家庭や小規模工房で「つくる」道具が、造形・彫刻・UV印刷と広がる流れの中で、UV印刷が表面加飾を担う位置づけだ。\n【詳細】\nePrintは2基のF1080ヘッドと12チャンネルのインク構成で、色・白インク・ニスを重ねて立体的な質感を作る。最大15ミリのレリーフ印刷が可能で、段差10ミリまでの面にも対応するという。木材やアクリル、革、金属、ガラスなど300種類以上の素材に対応し、AIソフト「LONGERStudio」が背景除去や画像調整、レイアウトを支援する。ブラックフライデーではデュアルUV版が2,499ドル、UV＋DT版が2,699ドルで、クーポンでさらに割引になる。製品はシングルUV、デュアルUV、UV＋DTの3構成で、価格帯は1,899ドルから2,699ドルまで分かれる。版ごとにできることが違うため、用途に合わせた選択が必要だ。\n【ポイント・注意点】\n「世界初のデュアルヘッド個人向けUVプリンター」といううたい文句はメーカー側の表現で、速度が単ヘッド機の6倍という主張も含め、独立した検証はまだない。価格はクーポン併用時のもので、適用条件を確認したい。クラウドファンディングを経て出荷が始まったばかりの製品でもあり、実機の評価やサポート体制を見極めてから検討するのが無難だ。","2026-11-14","Armchair Arcade","https://armchairarcade.com/perspectives/2026/11/13/desktop-manufacturing-maker-workshop/"],["xTool O1 Omni実機レビュー、41kgの実力と注意点","カナダのCGMagazineがxTool O1 Omniの実機レビューを公開した。約41キロの大型ボディに330×420ミリのベッドを備え、木材やアクリル、金属、ガラス、陶器など幅広い素材にきれいに印刷できたという。プリントヘッド搭載のCISスキャナーによる位置合わせは実測で0.5ミリ以内に収まり、DTGとDTFの布印刷も試せた。ソフトの細かな不具合はあるものの、総合的には完成度の高い1台と評価している。","\n【概要】\nカナダのCGMagazineがxTool O1 Omniの実機レビューを公開した。約41キロの大型ボディに330×420ミリのベッドを備え、木材やアクリル、金属、ガラス、陶器など幅広い素材にきれいに印刷できたという。プリントヘッド搭載のCISスキャナーによる位置合わせは実測で0.5ミリ以内に収まり、DTGとDTFの布印刷も試せた。ソフトの細かな不具合はあるものの、総合的には「完成度の高い1台」と評価している。\n【背景】\nO1 Omniは2026年に登場したxToolのUVプリンターで、UV印刷に加えてUV DTFやDTG、DTFまでを1台にまとめた「4-in-1」が売りだ。レビューでは布印刷対応の版をテストし、壁アート用のUV印刷からTシャツ作りまでを同じ機械で試した。eufyMake E1と比べると一回り大きく重いが、その分だけ対応範囲が広いという位置づけだ。\n【詳細】\nセットアップは2人での持ち上げが必須で、置き場所には頑丈な作業台が要る。折りたたみ式の半透明カバーはUV光を遮りつつ作業を見守れる。位置合わせはカメラではなくヘッド搭載のCISスキャナーで行い、メーカー公称の誤差±0.2ミリに対し実測は0.5ミリ以内だった。xTool Studioは無料で、アートの取り込みからインク層の配置、印刷までを一括管理する。DTFの品質は同誌が試したK13 Liteと同等で、DTGは古着風の仕上がりになったという。アクリルへの印刷では色と白を重ねた設定で、細かい文字や複雑な図柄もきれいに出たという。木製キャンバスへの印刷でも色が鮮やかに出て、ソフトの自動マスク機能が意図しない場所への印刷を防いでくれた。\n【ポイント・注意点】\nガラスや金属、アクリルには密着促進剤が必須で、鏡は反射したUV光がノズル内でインクを固めるため印刷できない。プリントヘッドの白インク切り替えや色の保存など、ソフトの未整備な部分も残る。布印刷は前処理とヒートプレスが別途必要で、月産数百枚のTシャツには専用機の方が向く。版選びを誤ると後から変更できない点にも注意したい。","2026-11-13","CGMagazine","https://www.cgmagonline.com/review/hardware/xtool-o1-omni-uv-resin-printer/"],["eufyMake E1ブラックフライデー、バンドル価格を整理","DTF DatabaseがeufyMake E1のブラックフライデー価格をまとめた。最終セールは11月11日から30日で、基本バンドルが1,799ドル（定価2,409ドル）、ロータリーやラミネーター、ロール・トゥ・フィルム付きのデラックスプラスが2,699ドル（定価3,709ドル）。各アタッチメントも2割引きで、メール登録者向けのクーポンも用意される。UV DTFステッカーやカップラップ作りに向く構成だ。","\n【概要】\nDTF DatabaseがeufyMake E1のブラックフライデー価格をまとめた。最終セールは11月11日から30日で、基本バンドルが1,799ドル（定価2,409ドル）、ロータリーやラミネーター、ロール・トゥ・フィルム付きのデラックスプラスが2,699ドル（定価3,709ドル）。各アタッチメントも2割引きで、メール登録者向けのクーポンも用意される。UV DTFステッカーやカップラップ作りに向く構成だ。\n【背景】\neufyMakeは10月27日から11月10日の早期セールでは1,999ドルに200ドル相当のギフト付きで販売し、11月11日から最終セールに切り替えた。価格保証は同一セール期間内に限られ、早期に買った人は最終価格への調整を受けられない。記事は価格表を公式ページで11月13日に確認したとしており、Tシャツ店が硬質グッズに手を広げる際の判断材料として整理している。\n【詳細】\nロータリーアタッチメントは320ドル、UV DTFラミネーターは320ドル、ロール・トゥ・フィルムは400ドルで、いずれも定価から2割引きだ。eufyMake Care（ヘッド補償プラン）は299.99ドル。メール登録者には12月31日まで有効な100ドル・40ドル・20ドルのクーポンが配られる。E1の印刷面積は330×420ミリ、解像度は最大1440dpiで、インクはCMYK・白・グロス・柔軟白を使う。ロール・トゥ・フィルムは幅100～305ミリ、最長10メートルまで連続印刷できる。インクの定期購入では最大33％の割引があり、週末のフラッシュセールでは素材や部品が9.90ドルで出る回もあるという。\n【ポイント・注意点】\n公式ページにはロール・トゥ・フィルムが「近日公開」と表示されたまま販売もされている矛盾があり、出荷時期の確認が必要だ。E1は硬質物専用で、Tシャツへの転写はできない点も押さえておきたい。インクは100ミリリットル29.99ドルで、賞味期限は15か月。セールは11月30日までだが、在庫や配送時期は購入前に確かめたい。","2026-11-13","DTF Database","https://dtfdatabase.com/blog/eufymake-e1-black-friday-2026-uv-dtf-bundle-prices/"],["UV DTFとビニール、タンブラー装飾はどちらが得か","文具大手Averyが、タンブラー装飾の方法としてUV DTF転写とビニール（カット・印刷）のどちらが向くかを比べたガイドを11月13日に更新した。UV DTFはフルカラーの細かいデザインを切り抜きやカス取りなしで貼れ、縁のない「印刷したような」仕上がりになるのが強みだ。Averyは自社で転写を印刷して届けるサービスも紹介し、機械を買わずに始める道も示している。","\n【概要】\n文具大手Averyが、タンブラー装飾の方法としてUV DTF転写とビニール（カット・印刷）のどちらが向くかを比べたガイドを11月13日に更新した。UV DTFはフルカラーの細かいデザインを切り抜きやカス取りなしで貼れ、縁のない「印刷したような」仕上がりになるのが強みだ。Averyは自社で転写を印刷して届けるサービスも紹介し、機械を買わずに始める道も示している。\n【背景】\nカスタムタンブラーはクラフト市やネット通販で人気の商品だが、作り方で手間と仕上がりが大きく変わる。カットビニールは単色でカス取りに時間がかかり、印刷ビニールは手軽だが台紙が残るステッカー仕上げになる。UV DTFはその中間で、複雑な多色デザインを手間なく再現できるとして、小規模販売での採用が広がっている。記事は、売るための商品作りでは「作れること」と「十分な数を効率よく作れること」は別だと指摘する。手間のかかる方法は1個の贈り物には向いても、販売では時間コストが利益を圧迫する。\n【詳細】\nUV DTFはUV硬化インクでフィルムに印刷し、ラミネートした転写を貼る仕組みで、裏紙をはがして貼り、上のフィルムをはがすだけ。熱も待ち時間も要らない。光沢のある盛り上がった立体感があり、タンブラーやグラス、スマホケース、キーホルダー、イヤホンケースなど滑らかな硬質面に使える。耐水性と耐UV性があり、手洗いできる。デザインの再現性が高く、同じ転写から同じ商品を繰り返し作りやすい。AveryではAmazon経由でカスタム転写を注文でき、サイズを選んでデザインをアップロードし、数量を指定すると印刷して届けてくれる。タンブラーのほか、リビー風グラスやスタンレー風タンブラー、マグ、水筒、キーホルダーなど幅広い小物に使える。\n【ポイント・注意点】\nUV DTFは硬質面専用で、布には向かない。転写の耐久性は正しく硬化された場合の話で、食器洗い機の高温洗浄は避けるのが無難だ。機械を買う場合は数千ドル規模の投資になるため、まずAveryのような印刷代行で売れ行きを試す手もある。版権のあるロゴやキャラクターの使用は避け、販売先の規約も確認しておきたい。","2026-11-13","Avery","https://www.avery.com/blog/uv-dtf-vs-vinyl/"],["eufyMake E1、累計400万プリント達成と進化の1年","AnkerのeufyMakeは、UVプリンターE1の累計プリント数が400万回を超えたと発表した。2025年のクラウドファンディングでは1万7822人の支援を集め、プラットフォーム史上最大規模の調達となった製品だ。この1年は無償のソフト更新を重ね、双方向印刷で印刷時間をほぼ半分にするなど使い勝手を磨いてきた。ブラックフライデーでは基本バンドルが1,799ドルまで値下がりする。","\n【概要】\nAnkerのeufyMakeは、UVプリンターE1の累計プリント数が400万回を超えたと発表した。2025年のクラウドファンディングでは1万7822人の支援を集め、プラットフォーム史上最大規模の調達となった製品だ。この1年は無償のソフト更新を重ね、双方向印刷で印刷時間をほぼ半分にするなど使い勝手を磨いてきた。ブラックフライデーでは基本バンドルが1,799ドルまで値下がりする。\n【背景】\nE1は「世界初の個人向け3DテクスチャUVプリンター」をうたう卓上機で、DIY愛好家やハンドメイド作家、小規模事業者に広がった。400万回のプリントは製品チームにとって最大の入力情報で、利用者の声や不具合報告、ライブでの質疑をもとにソフトを更新してきたという。発売から1年の節目に、実績と進化をまとめて示した形だ。\n【詳細】\nこの1年の更新では、往復とも印刷する双方向印刷で多くのモードの印刷時間がほぼ半分になった。素材選びから配置まで案内する対話式デザイン機能や、AIテンプレートのスキルマーケット、治具のレイアウトを保存して量産するジグ印刷も加わった。保湿モードは3種から選べ、印刷前のプレビューで時間とインク量を確認できる。オフライン印刷にも対応し、CMYKGインクの賞味期限は12か月から15か月に延びた。本体は最大5ミリの立体テクスチャと最大1440dpi、300種類以上の素材に対応する。ソフト更新は既存ユーザーにも無償で提供され、双方向印刷やジグ印刷、保湿モード、印刷プレビュー、オフライン対応などが含まれる。インクは5色CMYKGで、賞味期限が15か月に延びたことで在庫の無駄も減る。\n【ポイント・注意点】\n400万回はメーカー発表の累計で、販売台数そのものではない。双方向印刷の「ほぼ半分」は社内テストによるもので、モードによって効果は変わる。ブラックフライデー価格は11月11日から30日の米国向けで、欧州や英国、カナダ、豪州では内容が異なる。購入時は地域の価格とセール期間を確認したい。","2026-11-12","EIN Presswire","https://www.einpresswire.com/article-print/956308906/eufymake-uv-printer-e1-marks-4-million-real-world-prints-and-a-year-of-ongoing-improvements"],["英デザイン誌がeufyMake E1を実機検証、賞トロフィーに","英国のデザイン誌Design Weekが、eufyMake E1の実機レビューを公開した。開梱から1時間ほどでスマホケースを印刷でき、木材への印刷は「本当に良い」仕上がりだったという。筆者はこの体験から、長く見送っていたDesign Week Awardsの復活を決意。トロフィーを自前で刷ることで、1万5000ポンドの先行投資リスクを避けられると考えた。価格は英国で1,599～2,149ポンド。","\n【概要】\n英国のデザイン誌Design Weekが、eufyMake E1の実機レビューを公開した。開梱から1時間ほどでスマホケースを印刷でき、木材への印刷は「本当に良い」仕上がりだったという。筆者はこの体験から、長く見送っていたDesign Week Awardsの復活を決意。トロフィーを自前で刷ることで、1万5000ポンドの先行投資リスクを避けられると考えた。価格は英国で1,599～2,149ポンド。\n【背景】\n2.5DのテクスチャUV印刷はこれまで高額な業務用機の領域で、小さなスタジオには手が届かなかった。E1は卓上サイズで立体感のある印刷ができるため、デザイン誌の編集部でも試用が始まった。レビューでは賞のトロフィー作りを題材に、実務での使い勝手とコストを検証している。\n【詳細】\n木材の薄板には白インク1層の下地だけで鮮やかに印刷でき、AIが画像から筆致の深さを推定して油絵の凹凸も再現できたという。ボールへの印刷は自動位置合わせで直径60ミリまで、手動なら100ミリまで対応し、20ミリ幅のロゴを鮮明に刷るには直径52ミリ以上が必要と計算している。ロータリーではステンレスボトルに下地処理なしではインクがはがれやすく、缶への印刷は白インクを重ねるためコストがかさんだ。プリントヘッドは549ポンドの消耗品で、8か月ごとの交換が目安だ。ソフトはeufyMake Studioで、AIが画像から深さマップを作って筆致を再現したり、ZBrushで作った3Dモデルから深さマップを書き出して読み込んだりもできる。ベッドは330×420ミリで、カメラによる位置合わせでは高さ60ミリまで、手動なら100～130ミリまで対応する。\n【ポイント・注意点】\n黒アクリルは熱で反って密着が外れるなど、素材ごとの癖がある。A4全面の立体印刷はインク代が7～13ポンドと高く、年1000枚なら1枚あたり4ポンドの上乗せを見込むよう助言している。インクのにおいや月1回の清掃も運用コストだ。商売にするなら失敗しても困らない素材から始め、顧客の持ち込み品への印刷は破損リスクの合意を取っておきたい。","2026-11-12","Design Week","https://www.designweek.co.uk/design-review-how-the-eufymake-e1-uv-printer-inspired-the-return-of-the-design-week-awards/"],["ProcoloredのDTF・UVプリンター、保証と返品を検証","レビューサイトLucius Reviewsが、ProcoloredのDTF・UV DTF・UVフラットベッド機をまとめて検証した。F13Xが新機種として発売中で、K13 Liteは2,499ドル、ブラックフライデーの早期セールでは最大1,400ドル引きになるという。保証は12か月で、プリントヘッドは6か月以内の無償交換が1回付く。ただしインクを入れた後の返品はできず、報告期限は受領から7日と厳しい。","\n【概要】\nレビューサイトLucius Reviewsが、ProcoloredのDTF・UV DTF・UVフラットベッド機をまとめて検証した。F13Xが新機種として発売中で、K13 Liteは2,499ドル、ブラックフライデーの早期セールでは最大1,400ドル引きになるという。保証は12か月で、プリントヘッドは6か月以内の無償交換が1回付く。ただしインクを入れた後の返品はできず、報告期限は受領から7日と厳しい。\n【背景】\nProcoloredはDTFを中心にUV DTFやUVフラットベッド、DTGまでをそろえるメーカーで、機種はK・F・Pシリーズに分かれる。公式サイトではF13Xを新着、F13を売れ筋として推している。レビューは公式の仕様やFAQ、配送・保証条件を横断して確認し、購入前に知っておくべき条件を整理した。\n【詳細】\nUVプリンターは木材や金属、アクリルなど平らな硬質素材ほぼ全般に対応するとされる。DTF転写はカップや木板には付かず、UV DTFステッカーは衣類に不向きと明記されている。RIPソフトはFAQではmacOS非対応とされる一方、P13やF13XにはmacOS用ダウンロードが用意されており、機種ごとの確認が必要だ。配送はDHLやFedExで3～7営業日、多くの国で送料無料だが関税や付加価値税は別途かかる。技術サポートは12か月無料だ。機種の重量はVF13 Proが50キロ、V11 Proが70キロと大型で、F13Xは30.3キロ、K13 Liteは18キロと幅がある。サイトで確認できた価格帯は小物から7,223.60ドルまでと広く、消耗品や炉、ヒートプレスの費用も含めた総コストで見る必要がある。\n【ポイント・注意点】\n返品は「未使用・元の梱包・7日以内」の条件を満たす場合のみで、インクを入れた時点で返品不可になる。保証を受けるには純正インクの使用と納品後の登録が必須で、サードパーティー製インクは保証に影響する。価格や在庫は変動するため、購入前に公式ページで最新条件を確認し、消耗品や炉、ヒートプレスの費用も含めた総コストで判断したい。","2026-11-11","Lucius Reviews","https://www.luciusreviews.com/reviews/procolored-review"]],"risk":[["冬に増える3歳未満のやけど・誤飲 NITEが注意喚起","3歳未満の子どもの屋内事故をめぐり、製品評価技術基盤機構（NITE）が注意喚起を出した。2020年から2024年の5年間に届いた事故は47件で、約8割の38件が屋内で発生。家電の蒸気や熱湯によるやけどと、おもちゃによるケガ・誤飲が目立ち、冬から春にかけて多い傾向がある。2025年12月25日から3歳未満向け玩具の新規制も始まる。家庭での見守りと環境づくりの両方が大切だとしている。","\n【概要】NITEは、3歳未満の子どもが屋内で遭う事故への注意を呼びかけた。2020〜2024年の5年間に47件の事故が報告され、約8割が屋内での発生だった。目立つのは家電の蒸気・熱湯によるやけどと、おもちゃによるケガや誤飲で、冬から春に多い。\n【背景】3歳未満は「指で物をつかむ」「つかまり立ちする」など運動機能が伸びる時期で、できることが増えるほど思わぬ事故の場面も増える。加湿器や電気ケトルなど蒸気や熱湯を扱う家電の使用が増え、屋内で遊ぶ時間が長くなる冬〜春は特に注意が必要だ。2025年12月25日からは消費生活用製品安全法の改正法が施行され、3歳未満向け玩具への新たな規制が始まる。\n【詳細】NITEの集計では、47件のうち屋内発生が38件。やけどや窒息・誤飲は、つかまり立ちや一人歩きができるようになる3歳未満の時期に集中する傾向が見られた。最も多い場面は「家電の蒸気・熱湯に触れてやけど」で、保護者がその場にいないときに多く起きていた。一方「おもちゃでケガ・誤飲」は、見守っていても対処が間に合わないケースがあるという。東京都のアンケートでは、3歳の子どもの口の直径はおよそ4センチで、トイレットペーパーの芯とほぼ同じ大きさとされ、それより小さな物は飲み込む危険がある。NITEは製品事故の情報を集めて原因を調べ、再発防止に役立てている。今回の注意喚起では、事故の再現イメージを使った動画も公開し、家庭での対策を分かりやすく伝えている。\n【ポイント・注意点】やけどの恐れがある製品は子どもの手の届かない場所に置き、床置きの製品には柵を設けるなど、目を離したときも安全な環境づくりを心がける。おもちゃは使う前に対象年齢と注意事項を確認し、鋭利な部分や外れやすい部品がないかこまめに点検する。遊んだ後のおもちゃや小さな部品は、子どもの手の届かない高い場所や鍵のかかる場所に保管する。年末年始の帰省先など慣れない場所でも同じ注意が必要だ。年末年始は実家など慣れない場所に行く機会も増えるため、出かける前に子どもの手の届く範囲を改めて確認しておくと安心だ。","2026-11-18","NITE（製品評価技術基盤機構）","https://home.kingsoft.jp/news/pr/prwire/202512150984.html"],["米国で先天性はしかが数十年ぶりに出現 13例報告","米国で、妊娠中に母親から胎児へはしかウイルスが伝わる「先天性はしか」が数十年ぶりに確認され、医師らが警戒を強めている。2025年初めから9月末までに13例が米疾病対策センター（CDC）に報告された。背景にはワクチン接種率の低下があり、米国は2000年以来の「はしか排除国」の地位を失う見通しだ。妊娠前のMMRワクチン接種が最大の予防策とされる。米国の幼稚園児の接種率は92.4%にとどまる。","\n【概要】米国で、母親から胎児へはしかが伝わる「先天性はしか」が数十年ぶりに報告され、医師らが警戒を呼びかけている。2025年1月から9月末までに13例がCDCに報告された。妊娠中の感染は112例に上り、ほとんどが未接種か接種歴不明だった。\n【背景】はしかは非常に感染力が強く、かつては多くの子どもがかかっていたが、ワクチンの普及で抑え込まれてきた。米国は2000年にはしか排除の地位を得たが、近年は接種率の低下で流行が再燃。過去2年間で7,500例超の患者が出ており、米州保健機関は排除国の地位の喪失を正式に発表する見通しだ。ワクチン未接種のまま妊娠適齢期を迎えた女性が増えたことが、先天性はしかの出現につながったとみられる。\n【詳細】先天性はしかは、妊娠中の感染が胎児に及ぶもので、発熱や黄疸、発疹のほか、肺炎や脳炎、数年後に発症しほぼ致命的となる亜急性硬化性全脳炎（SSPE）の恐れもある。分娩直前に感染した場合、25〜30%の赤ちゃんが感染するとされる。米国の幼稚園児のMMR接種率は2025〜26年度で92.4%で、流行を防ぐ目安の95%を下回る地域が多い。生後12〜15か月で1回目を打つのが通常で、流行地域では生後6か月から接種できる。先天性はしかの子どもはSSPEのリスクが高く、発症までの期間も短い可能性があるという。米国小児科学会の指針はすでに医師らに届けられている。\n【ポイント・注意点】最大の予防は妊娠前のMMRワクチン接種で、抗体が胎盤を通じて赤ちゃんにも伝わる。MMRは妊娠中には接種できないため、妊娠を考えている人は事前の接種歴の確認が大切だ。妊娠中に未接種で感染者と接触した場合は、6日以内に抗体製剤を投与することで感染や重症化を抑えられる場合がある。乳児は接種できる月齢までワクチンに頼れないため、周囲の大人の接種が赤ちゃんを守ることにつながる。妊娠を考えている人は、かかりつけ医でMMRの接種歴を確認し、必要なら妊娠前に接種を済ませておくことが大切だ。周囲の人がワクチンで守る「集団免疫」が、赤ちゃんを守る大切な盾になる。","2026-11-17","MedicalXpress","https://medicalxpress.com/news/2026-11-doctors-babies-born-measles.html"],["韓国でノロウイルスが5年で2.6倍 0〜6歳で急増","韓国でノロウイルス感染者が5年間で約2.6倍に増え、0〜6歳の幼児が感染の中心になっていると韓国疾病管理庁（KDCA）が警告した。2026年の報告はこれまでに1万754人で、2021年の4,082人の約2.6倍。0〜6歳は2,431人から4,601人へ89%増えた。保育園・幼稚園での集団発生が多く、人から人への感染が9割近くを占めるという。韓国疾病管理庁は保育施設の衛生管理の強化を呼びかけている。","\n【概要】韓国でノロウイルス感染者が5年間で約2.6倍に増え、幼児を中心に集団発生が続いている。2026年の報告数は1万754人で、2021年の4,082人から大幅に増加。0〜6歳の患者は4,601人と2021年比で89%増え、保育施設での人から人への感染が主な経路とされる。\n【背景】ノロウイルスは冬に流行する急性胃腸炎の主な原因で、少量のウイルスでも感染し、零下20度でも生き残るほど抵抗力が強い。乳幼児は免疫が弱く、繰り返す嘔吐や下痢で体内の水分を急速に失い、脱水が進むと心臓や腎臓に影響が出ることもある。症状が消えてからも最長2週間は便からウイルスが出るため、回復後も注意が必要だ。\n【詳細】KDCAの集計では、2026年のノロウイルス報告は1万754人。2023〜2025年の保育施設での集団発生では、88.5%が人から人への感染だった。専門家は、貝類の摂取が少ない乳幼児で感染が増えていることから、給食の食材の流通や調理の過程での汚染が疑われると指摘する。感染力は発症から2〜5日後が最も強いとされる。予防には食品を中心温度85度で1分以上加熱すること、手洗いや調理器具の消毒が挙げられている。KDCAは予防の啓発とともに、感染経路や消毒方法を説明する動画を作り、保育施設の職員研修などに活用する方針だ。関連省庁と連携して教材を広める計画もある。\n【ポイント・注意点】家庭では食事の前とトイレの後の手洗いを徹底し、保育施設ではおもちゃや共用部分の消毒をこまめに行う。症状が出た子どもは無理に登園させず、受診して診断を受ける。脱水がひどい場合は点滴などの治療が必要になる。下痢を止める薬は毒素の排出を妨げるため、できるだけ避ける。症状が治まっても2週間ほどは便からの排出が続くため、排泄後の手洗いとトイレの消毒を続けることが大切だ。保育施設では、おもちゃやドアノブなど子どもが触れる場所の消毒をこまめに行い、体調の悪い子どもの登園を控えるよう保護者に呼びかけることも大切だ。保育施設では、嘔吐物の処理の際にも手袋やマスクを使い、消毒を徹底することが大切だ。","2026-11-17","MoneyToday","https://www.mt.co.kr/en/thebio/2026/11/17/2026111716165986759"],["人気のスクイーズ玩具に注意喚起 偽物と加熱の危険","米国で人気のスクイーズ玩具をめぐり、消費者団体U.S. PIRGが2026年の「Trouble in Toyland」報告書で注意を呼びかけた。偽物や粗悪品が有毒な鉛を含んだり、小さな部品が外れて窒息の危険があったりするほか、電子レンジで加熱する危険な遊び方も広がっている。過去2か月半でスクイーズ玩具のリコールが少なくとも7件出ている。購入前のリコール確認と、偽物の見分け方が大切だという。","\n【概要】米国で人気のスクイーズ玩具について、消費者団体U.S. PIRGが11月17日に発表した報告書で注意を呼びかけた。偽物や粗悪品による有毒物質や窒息の危険、電子レンジで加熱する危険な遊び方が問題になっている。過去2か月半で少なくとも7件のリコールが出た。\n【背景】スクイーズ玩具は5〜15ドル程度の手頃な価格で広まり、年末商戦の人気商品になっている。人気に便乗した偽物が増え、正規品とそっくりに見えても米国の安全基準を満たしていないものが多い。米消費者製品安全委員会（CPSC）はリコールを強制する権限がなく、企業が応じなければ警告を出すしかない仕組みだ。\n【詳細】報告書によると、偽物は有毒な鉛を含んだり、作りが粗く小さな部品が外れて窒息の恐れがあったりする。膨らむ水ビーズ入りの製品は、飲み込むと体内で大きく膨らみ、窒息や腸閉塞の危険がある。電子レンジで加熱して弾力や色の変化を楽しむ動画も広がっているが、CPSCは8月に「危険であり、決して試みてはいけない」と警告。加熱した玩具が破裂し、中の熱いゲル状の物質が顔や手にかかって重いやけどを負った事例もある。7歳の女児が後部座席で玩具が顔の前で破裂し、救急搬送されたという報告も紹介されている。玩具業界団体も11月初めに声明を出し、偽物は安全基準に適合しているか検査されていない可能性が高いと注意した。見た目が似ていても破れやすく、中の詰め物が漏れ出す恐れがあるという。\n【ポイント・注意点】購入前にrecalls.gov（リコール情報サイト）で対象製品でないか確認し、製造元や安全表示のないもの、強い化学臭や油っぽさ、漏れがあるものは買わない。信頼できる販売店で買い、年末の贈り物でも偽物に注意する。スクイーズ玩具は電子レンジで温めたり、車内や直射日光の当たる場所に置いたりしない。加熱すると破裂して中身が飛び出し、皮膚に付着してやけどを悪化させる恐れがある。破損した玩具はすぐに処分する。贈り物にするときも、信頼できる販売店で買い、包装や表示を確認する習慣をつけると安心だ。","2026-11-17","Detroit Free Press","https://www.freep.com/story/money/personal-finance/susan-tompor/2026/11/17/toy-safety-watchdogs-issue-holiday-shopping-warnings-whats-on-list/92808105007/"],["石川県内5校で集団風邪 108人が発熱などの症状","石川県は17日、県内5校でインフルエンザとみられる集団風邪が発生したと発表した。金市工高、志賀中、小松市矢田野小、加賀市山中小、かほく市七塚小で、計108人が発熱などの症状を訴え、学年閉鎖や学級閉鎖の措置が取られた。今シーズンの集団風邪の累計は68校、1,471人となった。県内では11月に入って発生が相次いでいる。県内の学校では11月に入って集団風邪の発生が続いている。","\n【概要】石川県は11月17日、県内5校でインフルエンザとみられる集団風邪が発生したと発表した。計108人が発熱などの症状を訴え、学年閉鎖や学級閉鎖となった。今シーズンの累計は68校、1,471人に達した。\n【背景】インフルエンザは例年12月から3月に流行のピークを迎えるが、今シーズンは8月末に流行入りが発表されるなど早い立ち上がりとなった。全国的にも10月下旬の患者報告が前年を上回り、学校での集団発生が各地で相次いでいる。県内では11月に入っても小中高校での発生が続いている。\n【詳細】今回発表されたのは金市工高、志賀中、小松市矢田野小、加賀市山中小、かほく市七塚小の5校。計108人が発熱などの症状を訴えた。県は学年閉鎖や学級閉鎖の措置を取ったとしている。県内では11月13日にも中能登町の鹿島小で80人が症状を訴える集団風邪が起き、11月10日にも5校で81人の発生が発表されるなど、11月に入って発生が続いている。今シーズンの集団風邪の累計は68校、患者は1,471人となった。石川県内では11月9日にも2校で6人の集団風邪が発表されており、11月に入ってからの発生が続いている。学校での集団発生は、地域の流行の広がりを示す目安にもなる。県の発表によると、5校のうち高校1校、中学校1校、小学校3校で、学年閉鎖や学級閉鎖の措置が取られた。\n【ポイント・注意点】発熱やせきなどの症状があるときは無理に登校せず、早めに受診して休養を取る。家庭では手洗い・うがいを徹底し、部屋の換気と適度な湿度を保つ。インフルエンザのワクチンは効果が出るまで約2週間かかるため、流行の本格化の前に接種を済ませることが望ましい。13歳未満は2回接種が基本で、2回目を12月中旬までに終えるのが目安とされる。学校からの連絡を確認し、閉鎖の期間中は外出を控え、体調の変化に注意する。家庭では、子どもが帰宅したら手洗い・うがいをさせ、十分な睡眠と食事で体調を整えることも大切だ。学校から学級閉鎖の連絡があった場合は、期間中の外出を控え、家庭で静かに過ごさせることが大切だ。","2026-11-17","北國新聞","https://www.hokkoku.co.jp/articles/-/2292988"],["名古屋市で新たに4施設が学級・学年閉鎖 インフルで","名古屋市は11月17日、市内の学校施設で新たに4施設が集団かぜ（インフルエンザ様疾患）による学級・学年閉鎖の措置を取ったと発表した。庄内小学校、村雲小学校、名古屋経済大学高蔵中学校、船方小学校で、患者数は計52人。今シーズンの累計は230施設に達し、小学校の学級閉鎖が129件と最も多い。市は毎日の判明分を公表し、今シーズンの累計を集計している。市は毎日の判明分を公表している。","\n【概要】名古屋市は11月17日、市内の学校施設で新たに4施設が集団かぜによる学級・学年閉鎖の措置を取ったと発表した。患者は計52人で、庄内小、村雲小、名古屋経済大学高蔵中、船方小が対象となった。今シーズンの累計は230施設に上る。\n【背景】名古屋市では2026年8月31日から始まる今シーズン、保育園から高校までの集団かぜによる措置を集計し、毎日の判明分を公表している。全国的にもインフルエンザの流行が早く始まり、学校での集団発生が各地で続いている。市内では小学校の学級閉鎖が特に多く、累計129件に達している。\n【詳細】17日に判明したのは、西区の市立庄内小学校4年3組（在籍33人、患者16人、学級閉鎖11月18〜20日）、昭和区の市立村雲小学校2年2組（在籍23人、患者13人、学級閉鎖11月17〜19日）、瑞穂区の名古屋経済大学高蔵中学校2年（58人、患者12人、学年閉鎖11月17〜18日）、熱田区の市立船方小学校4年2組（在籍32人、患者11人、学級閉鎖11月18〜19日）の4施設。患者数は計52人。今シーズンの累計は、休校5、学年閉鎖19、学級閉鎖206の計230施設で、小学校が129件と最も多い。11月の検体からはA/H1pdm09ウイルス遺伝子が検出されている。名古屋市の集計では、今シーズンの措置のうち学級閉鎖が206件と最も多く、学年閉鎖が19件、休校が5件となっている。施設別では小学校の129件が最も多く、次いで中学校が52件となっている。\n【ポイント・注意点】子どもに発熱やせきなどの症状が出たら、無理に登校させず早めに受診する。学校から閉鎖の連絡があったら、期間中は外出を控えて自宅で休養させる。家庭では手洗い・うがい、こまめな換気、加湿を心がける。インフルエンザワクチンは接種から効果が出るまで約2週間かかるため、流行が本格化する前に受けるのが望ましい。きょうだいがいる家庭では、タオルの共用を避けるなど家庭内での感染対策も意識したい。閉鎖の期間中は、きょうだいがいる家庭でもタオルや食器の共用を避け、家庭内での感染を防ぐ工夫をしたい。","2026-11-17","名古屋市","https://www.city.nagoya.jp/kenkofukushi/eisei/1015269/1015388/1015389/1015390.html"],["知育玩具の偽物に有害な難燃剤 子どもの脳への影響も","フィリピンの環境団体エコウェイスト連合は17日、偽物のルービックキューブなど知育玩具の一部から、廃棄家電のリサイクルプラスチック由来とみられる有害な臭素系難燃剤が検出されたと発表した。調べた10個のうち5個から臭素やアンチモンが高濃度で検出され、鉛も確認された。子どもの知能低下や注意散漫などにつながる恐れがあるという。団体は玩具への有害化学物質の使用禁止と成分表示の義務化を求めている。","\n【概要】フィリピンの環境団体エコウェイスト連合は11月17日、偽物のルービックキューブなど知育玩具の一部から有害な臭素系難燃剤が検出されたと発表した。調べた10個のうち5個から高濃度の臭素やアンチモンが見つかり、鉛も検出された。子どもの健康への影響が懸念される。\n【背景】臭素系難燃剤（BFR）はテレビやパソコンなどの家電のプラスチックに使われてきた物質で、廃棄家電のリサイクルプラスチックを通じて玩具に混入することがある。BFRへの曝露はホルモンかく乱や肥満、がん、心臓・生殖・脳の障害と関連するとされ、子どもの場合は知能の低下、協調性の低下、衝動性の増加、注意散漫、学習困難につながる恐れがある。曝露は口からの摂取、吸入、皮膚からの吸収で起こる。\n【詳細】調査では、マニラのビノンド地区で25〜100ペソで売られていた無認可・無表示の偽物ルービックキューブ10個を検査。5個から臭素112〜5,666ppm、アンチモン52〜1,525ppmが検出され、鉛も34〜128ppm確認された。2016年の国際調査でも、10個中4個から高濃度のポリ臭化ジフェニルエーテル（PBDE）が検出され、うち1個は16か国47検体の中で最も高い値を示した。PBDEの一種は2009年に、別の種類は2017年にストックホルム条約で禁止されている。同団体は過去にも、クリスマス飾りやハロウィーン玩具、水彩絵の具のパレットなどからも高濃度の臭素やアンチモンを検出しており、廃棄家電由来のプラスチックが幅広い日用品に使われている可能性を指摘している。\n【ポイント・注意点】玩具を買うときは正規品を選び、表示のない安価な偽物を避ける。黒いプラスチックの部品を使った無名ブランドの玩具には特に注意する。子どもが口に入れる玩具は、購入前ににおいや作りの粗さを確認し、欠けや割れがあれば使わない。古い玩具を譲り受けるときも製造元や安全基準の表示を確認する。団体は玩具への有害化学物質の使用禁止と、成分表示の義務化を求めている。子どもが口に入れる玩具は、正規品でも使用前に割れや欠けがないか確認し、古くなったものは早めに交換する。","2026-11-17","EcoWaste Coalition","http://ecowastecoalition.blogspot.com/2026/11/ecowaste-coalition-finds-hazardous.html"],["デリーの大気汚染で子どもの体調不良相次ぐ 授業も混乱","インドの首都デリーでは、大気汚染が「悪い」から「非常に悪い」の状態が続き、子どもたちの体調不良が相次いでいる。鼻づまりやせき、のどの感染症、だるさを訴える子が多く、5年生までの授業はハイブリッド形式となり、オンラインと対面の切り替えや連絡の不十分さが保護者の負担になっていると地元メディアが伝えた。学校からの連絡が不十分で、保護者は翌日の授業形態をSNSで確認する状況だという。","\n【概要】インドの首都デリーで大気汚染が続き、子どもたちの体調不良が相次いでいる。鼻づまりやせき、のどの感染症、だるさを訴える子が多く、5年生まではハイブリッド授業が続いている。授業形態の変更や学校からの連絡不足も保護者の悩みになっている。\n【背景】デリーでは毎年この時期、大気汚染が悪化し、ディワリ（ヒンドゥー教の祭り）の前後には学校の通常授業が実施されないことも多い。デリー教育局は11月6日、5年生までの授業をハイブリッド形式で行うよう指示。対面とオンラインの切り替えが頻繁に起き、保護者は翌日の授業形態をSNSのグループメッセージで確認する状況だという。\n【詳細】地元メディアの取材では、複数の保護者が子どもの鼻づまり、繰り返すせきや風邪、のどの感染症、体力の低下を訴えた。ある母親は、登校時にN95マスクを着けさせ、免疫力や体力を保つための食事を持たせていると話した。ハイブリッド授業については、共働きの家庭で在宅の手配が難しく、予定が立てにくいという声が多い。6年生以上の授業でもオンライン化による進度の遅れや試験準備への不安が出ている。デリー保護者協会の会長は、学校に対し休校や授業時間、対面・オンラインの決定を少なくとも48時間前に伝えるよう求めている。デリーでは毎年この時期に大気汚染が悪化し、学校の授業が混乱することが繰り返されている。保護者団体は、学校が休校や授業時間、対面・オンラインの決定を少なくとも48時間前に伝えるよう求めている。\n【ポイント・注意点】大気汚染がひどい日は、子どもの外出を控え、屋外での運動を避ける。外出時は子ども用のマスクを着用させ、帰宅後は手洗い・うがいをする。せきやのどの痛みが長引くときは早めに受診する。室内では空気清浄機の活用やこまめな換気を心がけ、加湿で空気の乾燥を防ぐ。学校からの連絡は毎日確認し、体調が悪い日は無理に登校させず、オンライン授業の時間割を事前に把握しておくことが大切だ。大気汚染の情報は毎朝確認し、汚染がひどい日は子どもの外出を控え、室内での遊びに切り替えるなどの工夫が大切だ。","2026-11-17","The New Indian Express","https://www.newindianexpress.com/cities/delhi/2026/Nov/17/delhis-poor-air-quality-and-hybrid-classes-add-to-parents-worries-over-childrens-health-and-studies"],["米CPSCが乳幼児用品4製品に警告・リコール 窒息や落下の恐れ","米消費者製品安全委員会（CPSC）は11月12日、乳幼児向け製品4件について警告とリコールを発表した。プレイヤード用マットレス約1万3,278個とスリングキャリーは使用中止の警告で、返金はない。SHEINのガラガラ・歯固めセット約2,657個とラジコンカー約294台はリコールとなり、返金を受けられる。いずれも窒息や落下、ボタン電池の誤飲の恐れがある。対象製品はすぐに使用をやめ、処分することが求められる。","\n【概要】米消費者製品安全委員会（CPSC）は11月12日、乳幼児向け製品4件について警告とリコールを発表した。プレイヤード用マットレスとスリングは使用中止の警告、SHEINのガラガラ・歯固めセットとラジコンカーはリコールとなった。窒息や落下、ボタン電池の誤飲の恐れがある。\n【背景】CPSCは製品の安全基準違反が見つかっても、リコールを強制する権限がない。企業がリコールに応じない場合、CPSCは消費者へ直接警告を出すしかない。今回の4件はいずれも連邦の安全基準を満たしておらず、けがの報告はなかったものの、過去に同じような危険で子どもが亡くなった例があるため警告が出された。\n【詳細】Mommy & Meのプレイヤード用マットレス（型番MNM-PNPMAT-WHT、約1万3,278個）は、対応するプレイヤード以外で使うと隙間ができ、赤ちゃんが挟まって窒息する恐れがある。Bamboraのスリングは拘束用のストラップが外れて赤ちゃんが落下する恐れがある。SHEINのガラガラ・歯固めセット（約2,657個）は紫とオレンジのつまみが外れて窒息の危険がある。Kakgoldのラジコンカー（約294台）はリモコンのボタン電池が簡単に取り出せ、誤飲の恐れがある。マットレスとスリングは返金がなく、処分するしかない。なお警告は対応するプレイヤード専用の場合には適用されない。2025年10月にも別のメーカーのプレイヤード用マットレス約1万5,000個がリコールされており、汎用マットレスの問題が繰り返されている。\n【ポイント・注意点】対象製品を持っている場合はすぐに使用をやめ、処分する。スリングは誰かが再利用しないよう布を半分に切ってから捨てる。マットレスは対応するプレイヤード専用品以外を使わない。寝る場所は固く平らな面にし、敷くのはフィットしたシーツだけにする。ボタン電池を飲み込んだ疑いがあるときはすぐに救急外来を受診する。おもちゃのリモコンは電池ぶたがネジで固定されているか確認し、簡単に開くものはテープで留めるか交換する。プレゼントやお下がりでもらった製品も対象になるため、受け取った際は型番やリコール情報を確認する。","2026-11-13","TeachToddler","https://teachtoddler.com/blog/play-yard-mattress-sling-rattle-warnings-november-2026"],["韓国でインフルワクチン不足 子どもの無料接種にも影響","韓国でインフルエンザワクチンの供給不足が長引き、国の無料接種の対象となる子どもも接種先を探すのに苦労している。9月から不足が指摘され、11月に入っても在庫切れで受け付けを停止する医療機関がある。11月10日時点で子どもの接種率は57.9%にとどまり、対象の子の4割以上が1回目をまだ受けていない。疾病管理庁は、無料接種の対象者は専用サイトで接種可能な医療機関を検索できると案内している。","\n【概要】韓国でインフルエンザワクチンの供給不足が長引き、無料接種の対象となる子どもも接種先が見つからない状況が続いている。11月10日時点で子どもの接種率は57.9%にとどまり、対象の子の4割以上が1回目の接種を受けていない。\n【背景】韓国では9月からワクチン不足が指摘され、11月に入っても在庫切れを理由に接種の受け付けを止める医療機関がある。背景には、インフルエンザの流行が早く始まったことや、供給量が前シーズンより減ったことがあるとみられる。2026〜27年シーズンは世界保健機関が推奨するワクチン株がすべて変更され、B型の標準品の供給も遅れたことで、生産の成功率がやや低下したという。\n【詳細】韓国疾病管理庁によると、供給量は前シーズンより10〜15%減り、生産量は約2,600万回分から約2,240万回分になった。オンラインコミュニティーには「生後8か月の子どもの2回目の接種に行ったら、無料接種用の在庫がなく、有料で受けるよう案内された」といった投稿が寄せられている。大韓小児青少年病院協会は10月28日、無料接種用の小児ワクチンが不足し、接種できない事例が出ているとして保健当局に対策を求めた。疾病管理庁は、無料接種の対象者はウェブサイト「予防接種ヘルパー」で接種可能な医療機関を検索できると案内している。韓国では前シーズン、全体の約15%のワクチンが出荷されずに残ったという。疾病管理庁は今シーズンも市場に流通する分はあるとし、医療機関ごとの在庫量の差が一部の品切れにつながっていると説明している。\n【ポイント・注意点】接種を予定している家庭は、事前に医療機関に在庫があるか問い合わせてから出かける。無料接種の対象者は「予防接種ヘルパー」で受けられる場所を探す。子どもは1回目から2回目まで3〜4週間あけるのが基本で、流行のピークに備えて早めの接種が望ましい。接種が遅れそうなときは、かかりつけ医に相談して代替の医療機関を探す。家庭では手洗い・うがいや換気を徹底し、発熱などの症状が出たら早めに受診する。接種を急ぐあまり、体調の悪い日に無理に受けるのは避け、体調の良い日を選んで受けるようにしたい。","2026-11-13","KOREA WAVE","https://news.infoseek.co.jp/article/koreawave_3662257/"],["車内置き去りを防ぐ「たすけてブーブー」 クラクションでSOS","子どもの車内閉じ込め事故を防ぐ啓発活動「たすけてブーブー」の安全教室が11月9日、東京・葛飾区の幼稚園で開かれた。子ども自身がクラクションを鳴らして助けを求める方法を広める活動で、発起人の絵本作家やまざきひろしさんが参加した園児146人に読み聞かせやクラクション体験を行った。全国1,000園への絵本配布も進めている。全国1,000園の幼稚園・保育園に向けて、絵本やリーフレットの配布も進めている。","\n【概要】子どもの車内閉じ込め事故を防ぐ「たすけてブーブー」の安全教室が11月9日、東京・葛飾区の幼稚園で開かれた。子どもがクラクションを鳴らして助けを求める方法を広める活動で、園児146人が絵本の読み聞かせやクラクション体験に参加した。\n【背景】幼稚園の送迎バスなどで子どもが車内に取り残される事故が繰り返し発生していることを受け、2025年6月に始動したプロジェクトだ。子ども自身がクラクションを鳴らしてSOSを出せるようにすることが目的で、発起人のやまざきひろしさんは絵本『ぶたすけのラッパ』を作って活動を始めた。9月の静岡、10月の大阪と名古屋に続き、東京での開催は4回目となる。\n【詳細】この日の安全教室では、やまざきさんが絵本の読み聞かせを行い、園児たちが実際にクラクションを鳴らす体験をした。終了後、やまざきさんは「子どもたちが皆楽しそうにクラクションを体験されていたのが印象的だった」と振り返った。活動の理由について「車に閉じ込められたときに子どもたちがSOSを出せるようなことをしたいなと、絵本を作りました」と説明。「幼稚園、保育園、ご家庭で毎回声掛けされていることが大事」と呼びかけた。周囲の大人にも、クラクションが鳴ったときに「もしかしたら子どもが車内にいるかもしれない」と気付いてもらえるよう理解を広げたいとしている。やまざきさんは、クラクションが鳴ったときに「もしかしたら子どもが車内にいるかもしれない」と周囲の大人が気付けるよう、理解を広げる活動も続けていきたいと話している。\n【ポイント・注意点】家庭でも「車に閉じ込められたらクラクションを鳴らす」ことを繰り返し声かけし、実際に車の中でクラクションの鳴らし方を練習しておく。送迎バスの乗降時は人数確認を徹底し、車内点検を習慣化する。子どもを車内に残して離れないことを基本とし、短時間でも置き去りにしない。周囲の大人は、駐車中の車からクラクションが鳴ったら子どもが閉じ込められている可能性を考え、様子を確認する。絵本やリーフレットを活用して、子ども自身が助けを求める方法を身につけられるよう家庭でも話し合うことが大切だ。","2026-11-09","TRILL","https://trilltrill.jp/articles/5172513"],["子どもが誤飲したときの対応 吐かせずまず様子を確認","子どもが薬や洗剤、たばこ、ボタン電池などを誤って飲み込んだときの対応を、こども家庭庁と日本中毒情報センターの情報をもとにまとめた記事が公開された。まず呼吸と意識を確かめ、家庭で無理に吐かせないこと、物によって水や牛乳を飲ませてよいかが違うこと、ボタン電池や磁石は症状がなくても急いで受診することがポイントだ。中毒110番は365日24時間対応で、情報提供料は無料だ。","\n【概要】子どもが薬や洗剤、たばこ、ボタン電池などを誤飲したときの対応をまとめた記事が公開された。こども家庭庁と日本中毒情報センターの情報をもとに、まず呼吸と意識を確かめ、家庭で無理に吐かせないこと、物ごとの受診の目安を解説している。\n【背景】はいはいやつかまり立ちで動ける範囲が広がると、子どもは手に取った物を何でも口に入れて確かめる。こども家庭庁の「こどもの事故防止ハンドブック」では、医薬品・洗剤・化粧品やたばこの誤飲は0〜3歳くらい、ボタン電池・吸水ボール・磁石の誤飲は0〜5歳くらいに注意したい事故として挙げられている。2025年には3歳以下の誤飲事故が1,300件を超えたという。\n【詳細】飲み込んだかもしれないと気づいたら、大きな声を出さず、まず呼吸と意識を確かめる。苦しそうな呼吸や顔色の青白さ、けいれん、ぐったりしているときは救急車を呼ぶ。のどに詰まって息ができないときは119番通報を頼み、背部叩打法などの手当てを始める。家庭で吐かせることは勧められず、吐いた物が気管に入る危険がある。灯油や漂白剤、防虫剤は吐かせると悪化するため絶対に吐かせてはいけない。漂白剤や洗剤などは牛乳か水を無理なく飲める量まで飲ませて薄める一方、たばこや灯油は水も牛乳も飲ませない。ボタン電池や磁石、鋭い物、薬は症状がなくても急いで受診する。\n【ポイント・注意点】中毒110番（大阪072-727-2499、つくば029-852-9999）は365日24時間対応で、情報提供料は無料。受診するかどうか迷うときは子ども医療電話相談（#8000）も利用できる。飲んだ物と同じ製品や容器、薬ならお薬手帳を持って受診する。予防として、薬・洗剤・たばこ・ボタン電池は子どもの目に触れず手の届かない場所にしまう。3歳の子どもの口の直径はおよそ4センチで、それより小さな物は飲み込む危険があるため、床や低い棚に小さな物を置かない。祖父母宅では薬の誤飲の相談が多いため、帰省前に薬の置き場所を伝えておく。受診の目安に迷ったときは、自己判断せず中毒110番や#8000に相談することが大切だ。","2026-11-09","育児の時間","https://media-ikuji.printemps.tokyo/articles/kodomo-goin-taiou"]],"dev":[["騒音下の聞き取り能力、日本初の発達標準値を確立","同志社大学と北陸先端科学技術大学院大学の研究チームが、年長児から小学6年生714人を対象に、騒がしい環境で聞きたい音声を聞き分ける「選択的聴取能力」の発達標準値を日本語環境として初めて確立した。2種類の聴覚課題を15分程度で実施でき、学年が上がるほど成績が向上し個人差が収束することなどが確認された。聞き取りに困難を抱える子どもの早期発見につながると期待される。","\n【概要】同志社大学と北陸先端科学技術大学院大学の研究チームが、年長児から小学6年生714人を対象に、騒がしい環境での「選択的聴取能力」の発達標準値を日本語環境で初めて確立した。2種類の課題を15分程度で実施でき、聞き取りに困難を抱える子どもの早期発見が期待される。\n【背景】教室や体育館など騒がしい場所で先生や友人の声を聞き取る力は、学校生活に欠かせない。この能力は基礎的な聴覚機能とは異なり、16歳になっても成人より劣ることが先行研究で報告されている。日本では「聞こえているのに聞き取れない」聞き取り困難症への関心が高まっているが、年齢ごとの標準値がなく、支援が必要な子どもを定量的に特定することが難しかった。\n【詳細】研究では、認定こども園・幼稚園・保育所・小学校に在籍する年長児から小学6年生714名のデータを分析した。使った課題は、ターゲット音声と多数話者の混合会話が同時に流れる中で聞き取る「聴覚的図と地課題」と、左右の耳に異なる単語を同時に提示して両方聞き取る「競合語課題」の2種類。両課題とも学年が上がるにつれて正答率が向上し、個人差が収束することが確認された。競合語課題では低学年で右耳の正答率が高い「右耳優位性」が見られたが、小学4年生以降は差がなくなった。2課題の正答率には中程度の正の相関（r=.535）があった。先行研究では、選択的聴取能力は16歳になっても成人より劣ることが報告されている。今回の標準値は、学年や提示する耳ごとの平均正答率と標準偏差をもとに作られた。\n【ポイント・注意点】この標準値を使うことで、同学年の平均より著しく低い成績の子どもを早期に特定し、座席配置の工夫や視覚情報の併用、音響環境の改善などの配慮につなげられる。研究成果は日本音響学会誌82巻7号（2026年7月1日刊行）に掲載される。家庭で「聞き取りにくい様子」が気になるときは、まず耳鼻科や学校の先生に相談する。騒がしい場所での指示は、短く区切って伝え、視覚的な手がかりを添えると伝わりやすい。","2026-11-18","StartHome（同志社大学ほか）","https://home.kingsoft.jp/news/pr/atpress/610531.html"],["妊娠中のオメガ3、子の認知発達と関連 5〜15歳を追跡","妊娠中の母親のオメガ3脂肪酸の量と、子どもの認知発達の関係を調べた研究が欧州疫学雑誌に発表された。スペインの716組の母子を対象に、へその緒の血中のオメガ3を測り、5歳から15歳まで追跡。植物由来のALAは幼児期の注意力と、DHAは思春期まで続く認知機能の良さと関連していた。EPAには有意な関連が見られなかった。研究はスペインの母子コホートのデータを用いたものだ。","\n【概要】妊娠中の母親のオメガ3脂肪酸の量と、子どもの認知発達の関係を調べた研究が発表された。スペインの716組の母子を追跡した結果、植物由来のALAは幼児期の注意力と、DHAは思春期まで続く認知機能の良さと関連していた。\n【背景】妊娠中は胎児の脳が急速に発達する時期で、母親の栄養が子どもの発達に影響すると考えられている。オメガ3脂肪酸の研究はこれまで魚由来のDHAやEPAが中心で、植物由来のALAはあまり調べられてこなかった。今回の研究は、へその緒の血中のALAの割合と子どもの認知発達の経過を調べた初めてのものだという。\n【詳細】スペインのINMAプロジェクトのデータを用い、716組の母子を対象に、へその緒の血漿中のALA、DHA、EPAを測定。子どもの認知発達を5歳から15歳まで複数回評価し、注意力、ワーキングメモリ、流動性知能に注目した。その結果、ALAの割合が高い子どもは、追跡期間全体で不注意が少なく、5歳と7歳ごろには流動性知能も良い傾向があった。ただし、この利点は思春期になると逆転する傾向が見られた。DHAの割合が高い子どもは、不注意の少なさとワーキングメモリの良さが思春期まで続いた。EPAには有意な関連は見られなかった。研究チームは、ALAの働きが幼児期に目立ち、思春期には逆転する傾向が見られた点について、年齢によって脂肪酸の役割が変わる可能性を示唆している。DHAの利点は思春期まで続くことが確認された。\n【ポイント・注意点】研究は関連を示すもので、オメガ3が直接発達を良くしたことを証明するものではない。ALAは体内で作れない必須脂肪酸で、クルミや亜麻仁、チアシード、植物油などに含まれる。28グラムのクルミには2.5グラムのALAが含まれる。DHAやEPAは主に脂肪の多い魚に含まれる。特定の食品に偏らず、さまざまなオメガ3源を含むバランスの良い食事が大切だ。サプリメントの利用は医師に相談する。妊娠中の食事については、かかりつけの医師や管理栄養士に相談し、自分に合った食生活を考えることが大切だ。","2026-11-17","The Tribune","https://www.tribuneindia.com/news/business/new-and-novel-study-links-prenatal-omega-3-fatty-acid-levels-to-childrens-cognitive-development-through-adolescence/"],["幼い子も「良い子に見られたい」 道徳心の起源を分析","ライプツィヒ大学の研究チームが、幼い子どもにも「良い子に見られたい」という人間特有の願いがあるとする分析を発表した。過去2年間にわたる行動研究の分析から、子どもは自分の集団の規範を守り、集団をひいきにし、集団の行動に責任を感じることが分かった。論文は英王立協会の紀要に掲載された。人間の協力は、特定の相手との協力から集団全体との協力へと2段階で発達するという。","\n【概要】ライプツィヒ大学の研究チームが、幼い子どもにも「良い子に見られたい」という人間特有の願いがあるとする分析を発表した。子どもは自分の集団の規範を守り、集団をひいきにし、集団の行動に責任を感じるという。論文は英王立協会の紀要に掲載された。\n【背景】人間は集団の中で協力しながら生きてきた。社会的アイデンティティとは、自分を集団の一員として見ることだが、その進化的な起源はあまり研究されてこなかった。ライプツィヒ大学のレオン・リー博士とセバスチャン・グリュナイゼン准教授は、過去2年間、類人猿と人間の子どもを比べた比較研究や、子どもの行動を調べた発達研究を分析してきた。\n【詳細】分析の結果、子どもは自分の集団の社会規範を尊重し、自分の集団を他の集団より好むことが示された。ごく幼い子どもでも、集団の他のメンバーと共有する知識を意識し、集団の行動に対して責任を感じるという。人間の協力は2段階で発達する。まず直接知っている特定の相手と協力できるようになり、次に会ったことのないメンバーを含む集団全体と「協力」できるようになる。研究チームは、最も初期の集団は自分の文化集団であり、社会的アイデンティティの最も早い形は「規範を守る良い一員として自分を見ること」だったと主張している。研究チームは、社会的アイデンティティの研究がこれまで心理的な側面から多くなされてきたのに対し、進化的な起源はあまり注目されてこなかったと指摘している。今回の分析は、比較研究と発達研究の両方を対象に行われた。\n【ポイント・注意点】子どもが集団の規範に従うのは、本当に規範を内面化しているからか、それとも良い評判を保ちたいという戦略的な動機からかは、さらに研究が必要だと研究者は指摘する。家庭では、子どもが「良い子」と認められたい気持ちを大切にし、ルールを守れたことを具体的に褒めることが効果的だ。集団をひいきにする傾向は自然な発達の一部だが、他の集団への偏見につながらないよう、多様な人との関わりを大切にしたい。子どもが集団のルールを守れたときは、結果だけでなく「みんなのために行動できたね」と過程を褒めると、規範への理解が深まる。","2026-11-16","phys.org","https://phys.org/news/2026-11-analysis-young-children-morally-good.html"],["乳児の発達評価、遠隔でも対面と同等 UCデービスの研究","米カリフォルニア大学デービス校の研究チームが開発した、乳児の発達を遠隔で評価するツール「TEDI」が、対面の標準的な評価と同等の結果を出すことが分かった。生後6〜18か月の乳児111人を対象に検証し、論文は『Journal of Clinical Child and Adolescent Psychology』に掲載された。地方や支援の届きにくい地域での発達モニタリングの拡大が期待される。","\n【概要】米カリフォルニア大学デービス校が開発した、乳児の発達を遠隔で評価するツール「TEDI」が、対面の標準的な評価と同等の結果を出すことが分かった。生後6〜18か月の乳児111人を対象に検証され、地方などでの発達モニタリングの拡大が期待される。\n【背景】新型コロナ禍で発達評価の遠隔化が進んだが、自宅での評価と研究室での対面評価を同じ乳児で比べた研究はほとんどなかった。TEDIは、自閉症やADHDなどの発達の違いが出やすい乳児を早期に見つけるためのツールで、診断がつく前の乳児期に焦点を当てている点が特徴だ。\n【詳細】研究では、自閉症の家族歴がある33人、ADHDの家族歴がある51人、どちらもない27人の計111人の乳児を対象に、対面評価と遠隔のTEDIを1か月以内に実施した。評価は生後6か月または9か月、12か月、18か月のいずれかで行われた。TEDIは60分間で、家庭に小さなおもちゃのキットを届け、検査者がビデオ通話で保護者にいないいないばあやシャボン玉、歌などの活動を指示しながら、理解する言葉や伝え方、遊び、問題解決、自閉症やADHDに関連する行動を評価する。結果は対面評価と広く一致し、遠隔でも妥当で信頼できるデータが得られることが示された。TEDIは、診断がつく前の乳児期に焦点を当てている点が特徴で、自閉症のきょうだいやADHDの家族歴があるなど、発達の違いが出やすい乳児を早期に見つけることを目指している。\n【ポイント・注意点】遠隔評価は通院が難しい家庭や地方の家庭にとって大きな助けになる。研究では、多くの家庭が「自宅では赤ちゃんが普段の様子を見せてくれた」と答えたという。ただし、遠隔がすべての家庭に適しているわけではなく、対面のほうが良い場合もある。発達の心配があるときは、かかりつけの小児科医に相談し、地域の支援機関につながることが大切だ。研究チームはスペイン語話者の家庭向けの版も検証中で、保護者へのコーチングと組み合わせた研究も始めている。乳児の発達には個人差が大きいため、1回の評価だけで判断せず、継続して様子を見ることが大切だ。","2026-11-16","MedicalXpress","https://medicalxpress.com/news/2026-11-telehealth-tool-yields-infant-scores.html"],["自閉症の原因遺伝子、健常なコピーを活性化する新手法","米カリフォルニア大学ロサンゼルス校の研究チームが、自閉症と強く関連する遺伝子の片方のコピーが壊れた場合に、残る健常なコピーの働きを高めることで細胞を正常に近づける手法を、ヒトの脳細胞モデルで示した。成果は『Nature Neuroscience』に掲載された。臨床応用にはまだ時間がかかるが、新たな治療の方向性を示すものだ。効果は変異を持つ細胞にだけ現れ、健常な細胞には影響がなかった。","\n【概要】米カリフォルニア大学ロサンゼルス校の研究チームが、自閉症と関連する遺伝子の片方のコピーが壊れた場合に、残る健常なコピーの働きを高めて細胞を正常に近づける手法を、ヒトの脳細胞モデルで示した。成果は『Nature Neuroscience』に掲載された。\n【背景】自閉症は遺伝の影響が大きく、遺伝リスクの約15%は親から受け継いだものではなく、子どもで初めて生じた新たな変異によるものだ。こうした変異の多くは2つある遺伝子コピーのうち1つを壊す。残る1つのコピーだけでは遺伝子の産物が足りず、脳の発達が変わってしまう。現在の治療の多くは症状への対処で、根本の生物学に働きかけるものは少ない。\n【詳細】研究チームは自閉症と強く関連するCHD8とSCN2Aという2つの遺伝子に注目した。CHD8は脳の発達に関わる他の遺伝子を調節し、SCN2Aは神経細胞が電気信号を出すために欠かせない。研究では遺伝子そのものを置き換えたり編集したりするのではなく、改変したCRISPRを使い、遺伝子の働きを調節する「エンハンサー」と呼ばれる部分を狙って健常なコピーの活性を高めた。CHD8のモデルでは脳オルガノイドの異常な過成長が抑えられ、細胞の成熟が進んだ。SCN2Aのモデルでは神経細胞の電気活動の多くが回復した。効果は変異を持つ細胞にだけ現れ、健常な細胞や隣の遺伝子には影響がなかった。研究チームは、エンハンサーを狙うことで遺伝子の働きを自然な発達のリズムに合わせ、過剰な発現を避けることを意図したと説明している。\n【ポイント・注意点】この研究は実験室の細胞モデルでの概念実証で、治療として使える段階ではない。脳へ安全に届ける方法や、発達のどの時期に働きかけるのが良いかの検証が今後の課題だ。治療の時期も重要で、発達の窓が閉じた後にも効果があるかは分かっていない。片方のコピーが壊れるタイプの遺伝子変異は他の神経発達症にも見られるため、同じ考え方が広く応用できる可能性がある。研究者は「臨床まではまだ遠いが、明確な方向性が得られた」と話している。","2026-11-16","MedicalXpress","https://medicalxpress.com/news/2026-11-approach-autism-conditions-faulty-gene.html"],["乳児期の逆境と関係性の支え、後の発達への影響を調査","オーストラリアの研究チームが、妊娠中から生後12か月までの発達リスクと、その後の子どもの発達との関係を調べた。トラウマ治療サービスを受けた子どもの記録56件を分析した結果、早期の発達リスクが高い子どもは、8歳以降の不安や怒り、トラウマ症状などが強く出る傾向があった。養育者との安定した関係が緩和要因になることが示唆された。支援のポイントは、子どもに合わせた関係性を中心とした関わりだという。","\n【概要】オーストラリアの研究チームが、妊娠中から生後12か月までの発達リスクと、その後の子どもの発達の関係を調べた。トラウマ治療サービスを受けた56人の記録を分析した結果、早期の発達リスクが高い子どもは8歳以降の不安や怒り、トラウマ症状が強い傾向があった。\n【背景】虐待やネグレクトなど早期の逆境が、子どもの発達や健康に長く影響することは知られている。一方で、養育者との安定した温かい関係が逆境の影響を和らげる「関係性の健康」の役割も注目されている。ただ、早期の関係性の違いが、同じような逆境を経験した子どもの発達の違いにどう関わるかは十分に分かっていなかった。\n【詳細】研究は、オーストラリア・ビクトリア州のトラウマ治療サービス「Take Two」で支援を受けた子どもの臨床記録56件を分析した。50件を量的に、6件を質的に調べた。子どもたちは紹介時の平均年齢11.5歳で、2012年5月から2022年9月の記録が対象。量的な分析では、8歳以降の時点で、不安、怒り・攻撃性、トラウマによる過覚醒、集中力、仲間関係、セルフケア、家庭生活などに有意な違いが見られた。質的な分析では「逆境と発達」「内なる資源」「一貫したつながり」「共に取り組むこと」という4つのテーマが浮かび上がった。研究は、発達リスクと関係性の健康を別々の要素として評価する「NMT」と呼ばれる枠組みを用いた。Take Twoは2004年の開始以来、約1万3,000件の支援を行ってきたという。\n【ポイント・注意点】早期の発達リスクが高い子どもほど、関係性や行動、注意の幅広い領域で不調が出やすいことが示された。支援のポイントは、子ども一人ひとりに合わせた関係性を中心とした関わりで、養育者や地域の支えを強めることだ。研究は小規模で探索的なもので、記録の分析に基づくため、因果関係を断定することはできない。家庭でできることとして、子どもとの安定した関わりや、困ったときに相談できる支援機関とのつながりを大切にしたい。家庭では、子どもとの日々の関わりを大切にし、困ったときに相談できる人や機関とのつながりを持っておくことが支えになる。","2026-11-16","MDPI","https://www.mdpi.com/2227-9067/13/11/1592"],["算数が苦手な子、方略の切り替えに脳の違い スタンフォード大","米スタンフォード大学の研究チームが、算数が苦手な子どもは計算そのものだけでなく、解き方の「方略」を選んで切り替える過程に脳の違いがあることを突き止めた。8〜10歳の子ども68人を調べた研究で、発達性算数障害のある子は方略の切り替えが遅く、難しさの変化への対応も弱かった。成果は『JNeurosci』に掲載された。脳の活動にも特徴的なパターンが見られ、実行機能の脳活動が成績を予測した。","\n【概要】米スタンフォード大学の研究チームが、算数が苦手な子どもは計算そのものだけでなく、解き方の「方略」を選んで切り替える過程に脳の違いがあることを突き止めた。8〜10歳の子ども68人を調べた研究で、算数障害のある子は方略の切り替えが遅く、難しさの変化への対応も弱かった。\n【背景】発達性算数障害は、練習や指導を受けても算数の問題解決が難しい状態が続くもので、その背景にある思考の仕組みは十分に分かっていなかった。計算問題を解くには、数を知っているだけでなく、どの方法が最も効率的かを判断する力が必要だ。問題が難しくなるほど、方法を切り替える判断が重要になる。\n【詳細】研究では8〜10歳の子ども68人を対象に、算数の問題にどう取り組むか、さまざまな方略をどれだけ効果的に使えるか、脳の活動と成績の関係を調べた。その結果、発達性算数障害のある子どもは、方略の切り替えに時間がかかり、問題の難しさが変わったときの対応が弱かった。さらに、時間がたっても効率的な方略を選ぶ力が伸びにくかった。脳の活動にも特徴的なパターンが見られ、実行機能に関わる脳活動が算数の成績を予測することも分かった。成果は神経科学誌『JNeurosci』に掲載された。研究では、問題が難しくなるほど、解き方を切り替える判断が重要になることが示された。算数障害のある子どもは、他の子どもと比べて効率的な方略を選ぶ力が時間とともに伸びにくかったという。\n【ポイント・注意点】算数のつまずきは「計算ができない」だけでなく「解き方を選ぶ力」の問題でもあることが示された。家庭では、子どもが一つの方法にこだわっているときに「別のやり方もあるよ」と声をかけ、解き方を一緒に考えることが役立つ。間違えたときは答えの正誤だけでなく、どの方法を選んだかを振り返るとよい。つまずきが長く続く場合は、学校の先生や専門家に相談し、子どもの特性に合った支援を検討する。家庭では、計算の練習だけでなく、複数の解き方を試す遊びやパズルを取り入れると、方略を選ぶ力の育ちにつながる。","2026-11-16","The Sentinel","https://www.sentinelassam.com/more-news/entertainment/this-surprising-brain-difference-may-explain-why-some-kids-struggle-with-math-study"],["AIに「幼少期」を与えると言葉を学ぶ プリンストン大","米プリンストン大学の研究チームが、1人の子どもが日常で聞いた言葉だけをAIに学習させる実験で、言葉の音や単語を子どもと同じように学べることを示した。15家庭で生後から約3歳まで記録した「最初の1,000日プロジェクト」のデータを使い、成果は『Science』に掲載された。睡眠中の記憶の「再生」にあたる仕組みが学習の鍵だった。子どもごとの発達の速さの違いも、学習の仕組みの違いで再現できた。","\n【概要】米プリンストン大学の研究チームが、1人の子どもが日常で聞いた言葉だけをAIに学ばせる実験で、子どもと同じように言葉の音や単語を学べることを示した。15家庭で生後から約3歳まで記録したデータを使い、成果は『Science』に掲載された。\n【背景】赤ちゃんは文法を学ばず、インターネットの膨大な文章も読まないのに、数年で数千の言葉を理解する。どうやってそれができるのかは、長年の謎だった。研究の障害は、子どもが実際に何を聞いて育つのか、ほぼ完全な記録がなかったことだ。プリンストン大学の「最初の1,000日プロジェクト」では、15家庭にカメラとマイクを置き、生後から約3歳まで起きている時間のほとんどを記録した。\n【詳細】研究チームは8人の子どもの音声データを使い、子どもごとにAIの学習モデルを作った。モデルは最初は何も知らず、文字も見せられず、音の流れから言葉の構造を見つけなければならなかった。最初は学習が進まず、2歳相当になっても言葉を一つも覚えられなかった。そこで、睡眠中に脳がその日の経験を繰り返す「再生」にあたる仕組みを加え、毎日の終わりに最近聞いた音声を少しだけ振り返らせたところ、学習が大きく進んだ。2歳相当までに数千の単語を学べるようになり、8家庭すべてで成功した。子どもごとの発達の速さの違いも、再生の量など3つの要素を変えることで再現できた。研究チームは、3年分の録音をまとめて与えるのではなく、1日ずつ順に聞かせることが子どもの学び方に近づく鍵だったと説明している。\n【ポイント・注意点】このモデルは子どもそのものではなく、体の動きや社会的な動機、言葉の意味はまだ持っていない。それでも、子どもの実際の経験を与えて学ばせることで、言語の学び方の理論を検証できる新しい方法が示された。家庭では、赤ちゃんに話しかける量や、絵本の読み聞かせ、歌などの日常のやり取りが言葉の発達の土台になる。画面の音声ではなく、生の声でのやり取りが大切だという研究の示唆も覚えておきたい。家庭での声かけが、言葉の育ちの土台になる。","2026-11-13","MedicalXpress","https://medicalxpress.com/news/2026-11-ai-childhood-insights-language.html"],["思春期の精神診断、本人と保護者の報告は大きく食い違う","米カリフォルニア大学サンディエゴ校の研究チームが、9〜17歳の子ども1万1,868人と保護者を対象に、精神疾患の診断について本人と保護者の報告がどれだけ食い違うかを調べた。診断が報告された場合、65〜98%は本人か保護者のどちらか一方だけの報告だった。うつや自殺念慮は本人が、素行障害や不安は保護者が報告しやすい傾向があった。一致度は年齢とともに改善したが、限られたままだった。","\n【概要】米カリフォルニア大学サンディエゴ校の研究チームが、9〜17歳の子ども1万1,868人と保護者を対象に、精神疾患の診断について本人と保護者の報告の食い違いを調べた。診断が報告された場合、65〜98%はどちらか一方だけの報告で、うつや自殺念慮は本人が、素行障害や不安は保護者が報告しやすい傾向があった。\n【背景】子どもの精神科の評価では、本人と保護者の両方から話を聞くのが一般的だが、両者の報告が大きく異なることがある。これまでの研究はうつや不安など限られた疾患を対象にしていた。今回の研究は、米国最大規模の子どもの脳と行動の長期研究「ABCD研究」のデータを使い、幅広い診断と発達段階にわたって食い違いを調べた初めてのものだ。\n【詳細】研究では、9〜17歳の子どもと保護者に同じ診断の質問を別々の面接で聞き、DSM-5に基づく診断をそれぞれの報告から導き出して比較した。結果、診断が報告された場合、65〜98%は本人か保護者のどちらか一方だけの報告だった。子どもは大うつ病や睡眠の問題、薬物使用、自殺念慮や自殺未遂、自傷行為を報告しやすく、年齢が上がるほど保護者よりうつを報告する割合が高くなった。保護者は素行障害や摂食障害、全般性不安や社交不安を報告しやすく、この差は若い年齢で最も大きく、年齢とともに縮まった。一致度は発達とともに改善したが、限られたままだった。成果は『JAMA Psychiatry』に2026年11月11日に掲載された。\n【ポイント・注意点】自殺念慮や自傷、薬物使用、睡眠の問題は、保護者が気づいていないことが多いため、本人の話を直接聞くことが大切だ。家庭では、子どもが自分の気持ちを話しやすい雰囲気を作り、「何か困っていることはない？」と定期的に声をかける。子どもが話した内容を否定せず、まずは受け止める。心配なサインが見られたら、学校の相談室や小児科、児童精神科などの専門機関に早めに相談する。診断は本人と保護者の両方の情報を合わせて判断するものだ。子どもが自分の気持ちを話せるよう、日ごろから「今日どうだった？」と声をかけ、話を聞く時間を大切にしたい。","2026-11-13","News-Medical","https://www.news-medical.net/news/20261113/Youth-and-caregivers-disagree-on-adolescent-psychiatric-diagnosis.aspx"],["妊娠中のコロナワクチン、子の神経発達に影響なし","妊娠中または妊娠直前に新型コロナウイルスのmRNAワクチンを接種した母親から生まれた子どもは、接種しなかった母親の子どもと比べて、生後18〜30か月時点の神経発達に差がないことが分かった。米デューク大学などの研究チームが434人の子どもを対象に前向きコホート研究で検証し、成果は『JAMA Pediatrics』に2026年11月2日に掲載された。研究は米国立小児保健・人間発達研究所の助成を受けた。","\n【概要】妊娠中または妊娠直前に新型コロナウイルスのmRNAワクチンを接種した母親から生まれた子どもは、生後18〜30か月時点の神経発達に差がないことが分かった。米デューク大学などの研究チームが434人の子どもを対象に検証し、成果は『JAMA Pediatrics』に掲載された。\n【背景】妊娠中の新型コロナワクチン接種の短期的な安全性は示されていたが、子宮内で曝露した子どもの長期的な神経発達への影響についてはエビデンスが乏しかった。妊娠中の感染は重症化のリスクがあり、ワクチン接種が推奨されている一方で、子どもの発達への影響を心配する声もあった。\n【詳細】研究は米国の母体胎児医学ユニットネットワークによる前向き多施設コホート研究で、2024年5月から2025年3月に実施された。生後18〜30か月の子ども434人を対象に、年齢・発達段階質問票第3版（ASQ-3）でコミュニケーション、粗大運動、微細運動、問題解決、個人・社会の5領域を評価したほか、子どもの行動チェックリストや自閉症のスクリーニング、乳幼児の行動質問票も確認した。その結果、曝露群と非曝露群でASQ-3の合計スコアは同等で、神経発達への影響は認められなかった。研究は米国立小児保健・人間発達研究所の助成を受けた。研究では、子どもの行動チェックリストや自閉症のスクリーニング、乳幼児の行動質問票も確認したが、いずれも曝露群と非曝露群で大きな差は見られなかった。\n【ポイント・注意点】この結果は、妊娠中または妊娠直前のmRNAワクチン接種が、子どもの神経発達に悪影響を与えないことを支持するものだ。研究は434人という規模で、対象は生後18〜30か月までであり、より長期の影響については今後の追跡が必要だ。妊娠中のワクチン接種については、かかりつけの産婦人科医に相談し、自身の状況に合った判断をすることが大切だ。妊娠中の感染予防には、手洗いや換気などの基本的な対策も引き続き心がけたい。妊娠中のワクチン接種を迷うときは、ネットの情報だけで判断せず、かかりつけの医師に相談するのが安心だ。","2026-11-11","Medical Tribune","https://www.medical-tribune.co.jp/news/articles/?blogid=7&entryid=621198"],["週1回以上の公園通い、子どもの心の健康を高める","英エクセター大学の研究チームが、週に1回以上公園や遊び場に行く子どもは、心の健康や社会性の発達が良い傾向があることを明らかにした。英国の長期追跡研究「Children of the 90s」の4,219人を対象に分析し、成果は『Epidemiology and Community Health』に掲載された。公園通いが週1回未満の子と比べ、メンタルヘルスの評価が平均16.5%良かった。","\n【概要】英エクセター大学の研究チームが、週に1回以上公園や遊び場に行く子どもは、心の健康や社会性の発達が良い傾向があることを明らかにした。英国の長期追跡研究の4,219人を分析した結果、週1回未満の子どもと比べてメンタルヘルスの評価が平均16.5%良かった。\n【背景】公園は多くの家庭にとって無料または低コストで利用できる場所だ。外遊びが子どもの心身の発達に良いことは知られているが、公園通いの頻度と社会性・情緒の発達の関係を長期にわたって調べた研究は少なかった。今回の研究は、同じ子どもを長年追跡する英国の「Children of the 90s」のデータを使った。\n【詳細】研究では4〜11歳の子どもを対象に、生まれてから11歳までの公園通いの頻度と社会性・情緒の発達を調べた。週に1回以上公園に行っていた子どもは、週1回未満の子どもと比べて、メンタルヘルスの評価が平均16.5%良かった。社会経済的な状況や家庭の逆境といった要因を考慮しても、この傾向は残った。公園に行く頻度が高い時期には、社会性・情緒の発達も良い傾向が見られた。裕福な家庭の子どもは幼い頃に公園に行く頻度が高かったが、年齢が上がるとその傾向は変わり、恵まれない家庭の子どもがより頻繁に公園に行くようになった。研究では、公園に行く頻度が高い時期には社会性・情緒の発達も良い傾向が見られた。公園は体を動かす場であると同時に、想像力豊かな遊びを通じて自信や自立心を育てる場でもあるという。\n【ポイント・注意点】公園通いは、体を動かす機会や想像力豊かな遊びを通じて、自信や自立心を育てる。週1回以上を目安に、近くの公園や遊び場に連れて行く習慣をつけるのがおすすめだ。公園の質も大切で、安全で、行きやすく、どの家庭にも歓迎される場所であることが求められる。データは英国の特定の長期研究に基づくため、他の地域や多様なコミュニティーにも当てはまるかは今後の検証が必要だ。天気が悪い日は無理をせず、屋内での遊びと組み合わせる。天気の良い日は、近くの公園に足を運ぶ習慣をつけるとよい。","2026-11-10","MedicalXpress","https://medicalxpress.com/news/2026-11-week-children-mental-health.html"],["画面時間は一律に悪くない？ 30研究のレビューが示す条件","米ジョージア大学の研究チームが、30件の研究をレビューした結果、子どもの画面時間は一律に悪いわけではなく、見る内容や年齢、親が一緒に見るかどうかで影響が変わることが分かった。『ダニエル・タイガー』などの番組は社会性を支え、『セサミストリート』などは文字や音の認識と関連していた。成果は『Journal of Evidence-Based Social Work』に掲載された。","\n【概要】米ジョージア大学の研究チームが、30件の研究をレビューした結果、子どもの画面時間は一律に悪いわけではなく、見る内容や年齢、親が一緒に見るかどうかで影響が変わることが分かった。番組によっては社会性や文字の認識を支えるものもあった。\n【背景】「画面時間はすべて悪い」という考え方が保護者の間では一般的だが、研究チームはそれが単純ではないことを示した。レビューは低所得家庭の子どもに焦点を当てたもので、画面時間の影響を年齢や内容、親の関わり方と合わせて調べた。多くの研究はテレビを対象にしていたが、現代の端末は持ち運びでき、アルゴリズムで次々と動画が勧められる点が異なる。\n【詳細】レビューでは、『ダニエル・タイガー』のような向社会的な番組は共感や思いやりなどの価値観を支え、『セサミストリート』『Between the Lions』『SuperWhy!』は文字や音の認識の向上と関連していた。一方で、暴力的な内容を見ると身体的な攻撃性が出ることがあるという。画面時間が長いと、読書や外遊び、家族との時間が削られ、夜のメディア利用は睡眠の問題と関連していた。乳幼児では、画面時間が長いほど言語発達が弱く、語彙が少ないなどの懸念があった。親が一緒に見て話す「コ・ビューイング」は、子どもが内容を理解する助けになるという。レビューは低所得家庭の子どもに焦点を当てたもので、画面時間の影響を年齢や内容、親の関わり方と合わせて調べた。現代の端末は持ち運びでき、次々と動画が勧められる点がテレビ時代とは異なるという。\n【ポイント・注意点】大切なのは時間の長さだけでなく「何を見るか」「誰と見るか」だ。子どもと一緒に番組を見て、見た内容について話す習慣をつける。暴力的な内容は避け、年齢に合った番組を選ぶ。乳幼児は対面での遊びや会話から言葉を学ぶため、画面時間は控えめにし、2〜5歳は1日1時間未満が目安とされる。夜の画面利用は睡眠に影響するため、寝る前の時間は画面を避ける。家庭の事情はさまざまで、無理のないルール作りが大切だ。","2026-11-09","Good Men Project","https://goodmenproject.com/featured-content/all-screen-time-may-not-be-bad-for-children/"]]};

  document.getElementById('catName').textContent=c.name;
  document.getElementById('catDesc').textContent=c.desc||"";
  document.getElementById('catCount').textContent="ジャンル "+(catIdx+1)+" / "+cats.length;
  document.getElementById('catDots').innerHTML=cats.map((x,i)=>'<button class="dot'+(i===catIdx?' active':'')+'" data-cat="'+i+'" aria-label="'+x.name+'へ移動"></button>').join('');
  document.querySelectorAll('#catDots .dot').forEach(d=>{d.onclick=()=>{const n=+d.dataset.cat; if(n!==catIdx){const dd=n>catIdx?'down':'up'; catIdx=n; renderStage(dd);}}});
      const slot=document.getElementById('cardSlot');
  if(!items.length){
    slot.innerHTML='<article class="card"><div class="empty"><div class="big">✦</div><p><b>'+c.name+'</b> は追加されたばかりの項目で、まだ記事がありません。</p><p>毎日の更新でこの項目の記事が集まると、ここに表示されます。<br>上スワイプで他のジャンルへ移動できます。</p></div></article>';
    document.getElementById('artDots').innerHTML=""; document.getElementById('artCount').textContent="0 / 0"; return;
  }
  const it=items[ai], a=it.a, old=isOld(a[3]);
  slot.innerHTML='<article class="card'+(old?' old':'')+(dir?' anim-'+dir:'')+'">'
    +'<img class="ph" src="'+IMGS[c.img]+'" alt="'+c.name+'のイメージイラスト">'
    +'<div class="cbody"><div class="meta"><span class="badge'+(old?' oldb':'')+'">'+(old?'少し前':'NEW')+'</span><span>'+a[3]+'</span><span>'+(ai+1)+' / '+items.length+'</span></div>'
    +'<h3>'+a[0]+'</h3><p class="sum">'+a[1]+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="openArticle(\''+c.id+'\','+it.oi+')">和訳全文を読む</button>'
    +'<button class="btn ghost" onclick="quickMemo(\''+c.id+'\','+it.oi+',this)">メモ保存</button>'
    +'<button class="btn ghost" onclick="shareArticle(\''+c.id+'\','+it.oi+')">共有</button></div>'
    +'<div class="src">出典：'+a[4]+'<br><a href="'+a[5]+'" target="_blank" rel="noopener">原文を開く</a></div></div></article>';
  document.getElementById('artDots').innerHTML=items.map((x,i)=>'<span class="dot'+(i===ai?' active':'')+'"></span>').join('');
  document.getElementById('artCount').textContent="記事 "+(ai+1)+" / "+items.length;
  requestAnimationFrame(fitCard);
}

function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;
  const sum=card.querySelector('.sum'), h3=card.querySelector('h3'), ph=card.querySelector('.ph');
  let ss=14, hs=Math.min(21, Math.max(17, window.innerWidth*0.044)), phh=ph?Math.round(ph.getBoundingClientRect().height):0; const ph0=phh;
  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }
    if(hs>13){ hs-=0.5; if(h3) h3.style.fontSize=hs+'px'; continue; }
    break;
  }
}
window.addEventListener('resize', fitCard);
function nextArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i>=n-1)return;artIdxMap[curCat().id]=i+1;renderStage('next')}
function prevArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i<=0)return;artIdxMap[curCat().id]=i-1;renderStage('prev')}
function nextCat(){if(catIdx>=cats.length-1)return;catIdx++;renderStage('down')}
function prevCat(){if(catIdx<=0)return;catIdx--;renderStage('up')}
/* ===== スワイプ操作（スクロールではなくスワイプで移動） ===== */
const stage=document.getElementById('stage');
let sx=null, sy=null, swipedAt=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;
  swipedAt=Date.now();
  if(Math.abs(dx)>Math.abs(dy)){ dx<0?nextArt():prevArt(); } else { dy<0?nextCat():prevCat(); }
});
stage.addEventListener('click',e=>{ if(Date.now()-swipedAt<120){e.stopPropagation();e.preventDefault();} },true);
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')nextArt(); else if(e.key==='ArrowLeft')prevArt();
  else if(e.key==='ArrowDown'){e.preventDefault();nextCat();} else if(e.key==='ArrowUp'){e.preventDefault();prevCat();}
});
/* ===== 項目の追加 ===== */
document.getElementById('addCatBtn').onclick=()=>{document.getElementById('newCatName').value="";document.getElementById('newCatDesc').value="";document.getElementById('addDlg').showModal()};
document.getElementById('addCatSave').onclick=()=>{
  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast("項目名を入力してください");return}
  const desc=document.getElementById('newCatDesc').value.trim()||"追加された項目";
  const id='custom-'+Date.now();
  extraCats.push({id:id,name:name,desc:desc,img:'hero'}); DATA[id]=[];
  cats=allCats(); catIdx=cats.length-1;
  document.getElementById('addDlg').close(); renderStage('down');
  toast("項目「"+name+"」を追加しました");
};
/* ===== 記事ダイアログ・メモ・共有 ===== */
function openArticle(cat,idx){
const c=allCats().find(x=>x.id==cat); const a=DATA[cat][idx];
document.getElementById('dlgIn').innerHTML=`<img src="${IMGS[c.img]}" alt=""><div class="meta" style="margin-top:10px"><span>${c.name}</span><span>${a[3]}</span></div><h3>${a[0]}</h3><p class="sum" style="font-size:14px">${a[1]}</p><div class="full">${a[2]}</div>
<p class="src" style="margin-top:12px">出典：${a[4]} — <a href="${a[5]}" target="_blank" rel="noopener">${a[5]}</a></p>
<div class="memoBox"><label style="font-weight:800;font-size:14px">ひとことメモ</label><textarea id="memoText" placeholder="気づいたこと、作りたいもの、家族への共有メモなど"></textarea>
<div class="actions"><button class="btn primary" onclick="saveMemo('${cat}',${idx})">このメモを保存</button><button class="btn ghost" onclick="shareArticle('${cat}',${idx})">iPhoneで共有</button><button class="btn ghost" onclick="document.getElementById('dlg').close()">閉じる</button></div></div>`;
document.getElementById('dlg').showModal();
}
function quickMemo(cat,idx,btn){const a=DATA[cat][idx];memos.unshift({cat,title:a[0],note:"",date:a[3]});updateMemoUI();btn.textContent="保存しました";btn.classList.add('saved');toast("メモに保存しました（このページを開いている間）")}
function saveMemo(cat,idx){const a=DATA[cat][idx];const note=document.getElementById('memoText').value.trim();memos.unshift({cat,title:a[0],note,date:a[3]});updateMemoUI();toast("メモを保存しました");document.getElementById('dlg').close()}
function updateMemoUI(){document.getElementById('memoCount').textContent=memos.length;const area=document.getElementById('memoList');
if(!memos.length){area.innerHTML='<p class="sum">まだメモがありません。記事の「メモ保存」をタップしてください。</p>';return}
area.innerHTML=memos.map(m=>`<div class="memoItem"><b style="font-size:14px">${m.title}</b><div style="font-size:13px;color:var(--muted)">${m.note||"（ひとことメモなし）"} ・ ${m.date}</div></div>`).join('')}
function exportMemos(){if(!memos.length){toast("まだメモがありません");return}const txt="MAI topic メモ — 2026-11-10\n\n"+memos.map((m,i)=>`${i+1}. ${m.title}\n${m.note||""}\n`).join("\n");const b=new Blob([txt],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="mai-topic-memo-2026-11-10.txt";a.click();URL.revokeObjectURL(u)}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}} try{await navigator.clipboard.writeText(text);toast("コピーしました — メモアプリなどに貼り付けできます")}catch(e){toast("共有できませんでした")}}
function shareArticle(cat,idx){const a=DATA[cat][idx];shareText(a[0],`${a[0]}\n\n${a[1]}\n\n出典：${a[4]} ${a[5]}`)}
function shareMemos(){if(!memos.length){toast("まだメモがありません");return}shareText("MAI topic メモ",memos.map(m=>`・${m.title} ${m.note}`).join("\n"))}
document.getElementById('sharePage').onclick=()=>shareText("MAI topic","MAI topic — 2026年11月18日朝版（全"+cats.length+"ジャンル）");
document.getElementById('memoBtn').onclick=()=>{updateMemoUI();document.getElementById('memoDlg').showModal()};
updateMemoUI();
renderStage();
</script>

try {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
} catch (e) {}
</script>
