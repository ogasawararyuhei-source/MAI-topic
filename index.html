、必要に応じて型定義ファイルで、register.tsxは596行、テストは212行。どちらも他のパネルの分を含む行数だ。\n【詳細】\nデスクトップには12種類の部品があり、Svgはあるが画像を表示するImageはない。逆にターミナルにはImageがあってSvgがない。そこでアルバムのジャケットを64×64のSVGの色セルによるモザイクとして描いた。SVGには131,072文字の上限があり、ある1曲では約29,000文字になった。4ビットカラー版でサイズを減らし、3ビットの代替手段も用意したが、こちらは検証していない。runという名前の変数がAPIの関数runとぶつかり、7件のテストがすべて失敗したため、名前を変えて解消した。\n【ポイント・注意点】\n歌詞ボタンにはmacOSのアクセシビリティの許可が必要で、ないとエラー-1719になる。パネルが一度消えたことがあり、原因は分かっていない。ユーザーのskillsフォルダに置くと動いたが、これは公式の読み込み方法ではなく、公式には--plugin-dirかマーケットプレイス経由で入れる。Claude Codeのデスクトップを、作業の傍らで使う道具に広げる例として興味深い。作り方そのものをClaudeに任せた点も、modの作りやすさを示している。","2026-11-24","Qiita","https://qiita.com/saitoko/items/91437debec28ca9ecf4c"],["セッションの目的を表示するClaude Codeのmod「session-compass」","Claude Codeのプロンプト欄の上に、そのセッションで何をしているかを1行で表示するmod「session-compass」を作ったZennの記事。要約はhaikuモデルで最初と直近の依頼から作り、4つのボタンで最初や前後、最新の位置に移動できる。出力ブロックの折りたたみ機能や設定項目、インストール方法に加え、折りたたみなどには全画面表示が必要な点も紹介している。","\n【概要】\nClaude Codeのプロンプトの上に帯を追加し、そのセッションが何をしているかを表示するプラグイン（mod）「session-compass」を紹介した記事である。帯の左側にはこれまでの依頼内容を1行で要約して表示し、右側には最初へ移動する⏫、前の🔼、次の🔽、最新の⏬の4つのボタンが並ぶ。Claude Code本体の機能ではなく、後から追加するプラグインとして公開されている。\n【背景】\n長いセッションや再開したセッションでは、何の作業をしていたか見失いやすい。要約はhaikuモデルで、最初のプロンプトと直近最大8件のプロンプトから作る。前回の要約を最大200文字渡して、要約に連続性を持たせている。/clearや/configのような引数のないスラッシュコマンドは、プロンプトとして数えない。\n【詳細】\n設定のsummaryModeは既定がautoでプロンプトのたびに作り直し、manualにすると🔁を押したときだけ作り直す。navTargetは既定のallでユーザーの依頼とClaudeの返答の両方を移動し、promptsにするとユーザーの依頼だけを移動する。⏫と⏬はセッションの記録ファイルを読むため、長いセッションや再開したセッションでも遠くまで飛べ、飛んだ先の行には▌の印が付く。出力ブロックは開いているとき▼、たたむと▶が表示され、クリックで個別に切り替えられる。📖で全ブロックをたたむと📕に変わり、📕で全部を開き直す。ツールの呼び出しと結果はプラグインではたためず、Claude Code自身のctrl+oで扱う。\n【ポイント・注意点】\nインストールは、/plugin marketplace addでimahiro-t/session-compassを追加した後、/plugin installでsession-compassを入れる。折りたたみと▌の強調表示には全画面表示が必要で、設定は後から/configで変えられる。既定のままなら、プロンプトのたびに要約が更新される。長時間のセッションを続ける人ほど、作業の現在地を見失わないための工夫として役立ちそうだ。","2026-11-24","Zenn","https://zenn.dev/kubell/articles/claude-code-mods-session-compass"],["Anthropic公式、PRのレビューから承認までを担うClaude Shipを発表","Anthropicが2026年11月23日、プルリクエストのレビュー、修正、承認を担うツール群「Claude Ship」をベータ版で発表した。一般提供中のCode Reviewに、CIの失敗や競合に対応するPR Stewardと、方針ファイルに沿って承認するClaude Approvalsを組み合わせる。Claude Codeでは/shipコマンドで一連の流れを始められる。対象プランや課金、使えない条件も示された。","\n【概要】\nAnthropicは2026年11月23日、プルリクエスト（PR）のレビュー、修正、承認を担うツール群「Claude Ship」をベータ版として発表した。目標は「チームが書くのと同じ速さでコードを出荷する」こと。一般提供中のCode Reviewに、ベータ版のPR StewardとClaude Approvalsの2つのエージェントを組み合わせる。\n【背景】\nClaude Codeチームでは、6月から9月にかけてマージされたPRが2倍以上に増え、取り消された変更の割合は40%以上下がったという。Code Reviewは、PRをコードベース全体と照らして複数の観点で確認し、自らの指摘を検証して分類したうえでPRに投稿する。深さはリポジトリごとにQuick、Standard、Deepから選べる。\n【詳細】\nPR Stewardは、失敗したCIのチェック、マージの競合、レビューの指摘に対応するが、PRの承認やマージはしない設計だ。プッシュのたびに何を変えたか、どう戻せるかをコメントし、開発者は@claudeで指示を出し、@claude stopで止められる。Claude Approvalsは、チームがリポジトリ内にファイルとして書いた承認方針に従い、定型的な変更は自ら承認し、それ以外は人の承認を求める。Anthropicは、必須のブランチ保護チェックにする前に観察のみのモードで動かすよう勧めている。Claude Codeで/shipを実行すると、変更をプッシュしてPRを開き、レビューや失敗したチェックへの対応までClaudeが進める。この機能はClaude Codeとデスクトップアプリに順次提供されている。\n【ポイント・注意点】\n対象はTeamとEnterpriseプランで、GitHubのリポジトリのみ。課金はトークン単位で、管理者はCode ReviewとPR Stewardに支出上限を設けられる。Claude Approvalsに基本料金はないが、分類器の利用は課金される。ゼロデータ保持、HIPAA構成、顧客管理の暗号鍵を使う組織では利用できない。","2026-11-23","Claude（Anthropic公式）","https://claude.com/resources/articles/introducing-claude-ship"],["Anthropic、企業向けにコーディングエージェントの安全対策ガイド","Anthropicが2026年11月23日、企業がコーディングエージェントを安全に導入するためのガイドを公開した。エージェントのリスクを「理解でき、範囲が限られた」ものにすることを目標に、評価のための6つの問いを示す。プロンプトインジェクションへの耐性や自動モードの効果を示す数値のほか、権限ルール、フック、サンドボックスの設定と試験導入の進め方を解説している。","\n【概要】\nAnthropicは2026年11月23日、企業がコーディングエージェントを安全に使うためのガイドを公開した。目標は、エージェントによるリスクを「理解でき、範囲が限られた」ものにすること（副CISOのJason Clinton氏）。どのコーディングエージェントにも使える、評価のための6つの問いを提案している。\n【背景】\nClaude Codeに標準化したSalesforceでは、開発者1人あたりのマージされたPRが79%増え、インシデントの総数は5%減ったという。エージェントに任せる範囲が広がるほど、どこまで任せるかの線引きが重要になる。ガイドはそのための具体的な設定と数値を示している。\n【詳細】\n本番の安全策を外したClaude Codeの試験では、現行モデルは悪意ある依頼の81〜85%を拒み、用途が二面的なものや無害な依頼の98〜100%をこなした。Gray Swanの間接プロンプトインジェクションの指標では、検知を切った状態でOpus 5.5が1.0%、Fable 5.2が4.1%だった。検知を入れると、Fable 5.2への攻撃の成功率は89.8%から28.2%に、Opus 5.5では54.6%から11.1%に下がった。2026年8月の有償テスター1,053人の調査では、人による確認が危険なコマンドを見抜けたのは13.6%で、自動モードは89%を止めた。自動モードは全プランの対話セッションで既定となり、ヘッドレス実行、Agent SDK、HIPAA構成では手動が既定だ。\n【ポイント・注意点】\n権限ルールは拒否、確認、許可の順に評価されるため、許可のルールで拒否を上書きすることはできない。失敗やタイムアウトしたフックは既定で呼び出しを通すため、必ず守らせたいルールにはonFailureでblockを指定するよう勧める。サンドボックスはmacOS、Linux、WSL2で動き、ネイティブのWindowsでは動かない。試験導入は機密性の低いリポジトリで始め、2週間は方針を変えずに運用し、その後に分類器の拒否やサンドボックスによる阻止を見直すよう助言している。","2026-11-23","Claude（Anthropic公式）","https://claude.com/resources/articles/enterprise-guide-to-securing-coding-agents"]],"cnc":[["シーメンスの設計AIエージェント、有償ライセンスが3倍超に","シーメンスは11月24日、エンジニアリング向けAIエージェント「Eigen Engineering Agent」の有償ライセンス数が2026年7月から10月の間に3倍以上へ伸びたと発表した。利用国は30カ国を超え、化学・製薬・水処理・エネルギーといったプロセス産業へ対象を広げる。TIA Portalの操作画面の移行支援や、制御コードの動作検証の機能も加えた。選んだ作業で最大60％の時間短縮を見込むが、効果は案件の条件で変わるとしている。","\n【概要】独シーメンスは2026年11月24日、エンジニアリング向けAIエージェント「Eigen Engineering Agent」が発売から7カ月で次の段階に入ったと発表した。有償ライセンスは2026年7月から10月の間に3倍以上に増え、利用は30カ国を超えた。7月に中国、11月にインドでも提供を始めている。\n【背景】Eigenは2026年4月、工場自動化向けの設計ツールTIA Portal用として登場した。制御プログラムの作成や確認といった設計作業をAIに手伝わせ、技術者の負担を減らすのが狙いだ。今回の発表は、ニュルンベルクで開かれる展示会SPS 2026に合わせたものとなる。\n【詳細】新たに化学、製薬、水処理、エネルギーなどのプロセス産業へ対象を広げ、数万の現場で使われるという分散制御システムSIMATIC PCS 7上で、設計作業の計画・実行・検証ができるようにした。TIA Portalでは、SIMATIC HMIのComfort PanelからUnified Panelへ操作画面を移す作業の手間を減らす。コンパイルだけでは見つからない、制御コードが意図どおりに動くかの検証にも対応した。この検証機能は導入期間中は無料で、有償版は「今後数カ月」で提供する予定だ。安全分野でも、技術者が示した安全要件からフェイルセーフのロジックを作る支援を予定する。利用企業としては、設計作業を2倍速く終えられたとするオーストリアのANDRITZ Metalsのほか、中国のCASMT、米国のPrism Systemsが挙がっている。\n【ポイント・注意点】時間短縮は選んだ作業で最大60％とされるが、実際の効果は案件の複雑さ、範囲、技術者の経験、標準化の度合いで変わるとシーメンス自身が断っている。エージェントは設計作業だけを支援し、稼働中の設備には介入しない。安全機能の責任は引き続き技術者が負い、データの所有権も顧客に残る。フィロミン氏は、エージェントが「すでに技術者の機械の自動化を手伝っている」と述べている。CNCの現場で直接使う道具ではないが、機械の制御設計にAIエージェントが入り込む流れを示す動きだ。","2026-11-24","Siemens","https://press.siemens.com/global/en/pressrelease/siemens-eigen-engineering-agent-reaches-next-milestone-strong-growth-and-expansion-new"],["シーメンス、プロセス産業の制御設計にAIエージェントを投入","シーメンスは11月24日、AIエージェント「Eigen Engineering Agent」をプロセス産業向けに広げた新版を発表した。化学や製薬などで使われる分散制御システムSIMATIC PCS 7のバージョン10以降に対応し、既存の制御ロジックの説明や確認、設計データからの制御モジュール作成を受け持つ。特定の作業で約20〜60％の時間短縮を見込むが、結果はすべて技術者が確認し承認する前提だ。","\n【概要】シーメンスは2026年11月24日、エンジニアリング向けAIエージェントの新版「Eigen Engineering Agent for Process Industries」を発表した。化学、製薬、石油・ガスなどで使われる分散制御システム（DCS）SIMATIC PCS 7向けで、バージョン10以降のプラントで利用できる。展示会SPS 2026で披露する。\n【背景】Eigenは2026年4月に工場自動化向けのTIA Portal用として始まった。プロセス産業では、長年使われてきた制御ロジックの理解や改修に手間がかかる。同社のレベッカ・ファンヘネヒテン氏は、Eigenによって設計の知識を「チームのすべての技術者が使えるようにする」と述べている。\n【詳細】発売時点の機能は、CFCと呼ぶ制御ロジックの理解と開発の支援、そして設計リストから制御モジュールの型（CMT）を作ることだ。変更を反映する前に、エージェントは結果を設計データや顧客の標準と照らし合わせ、信号アドレスを確かめ、抜けている接続を指摘する。Eigenは稼働中のプラントとは切り離して動き、既存のPCS 7ライセンスとは別のサブスクリプションとして販売する。時間短縮の見込みは特定の作業で約20〜60％。初期の試験利用企業には独BASFが含まれ、同社のトビアス・ゲルバー博士は、より身軽で機動的なプラントにつながると話している。データ・AI担当役員のヴァシ・フィロミン氏は、AIエージェントの最大の機会はチームや部門の間の引き継ぎにあると語った。\n【ポイント・注意点】削減幅はプロジェクトの複雑さ、範囲、専門性、標準化の度合いによって変わるとされる。AIが作った結果はすべて技術者が確認・承認する前提で、勝手に設備を書き換えるものではない。次世代のDCSとしてはPCS neoも挙げられている。導入する場合は、既存のPCS 7ライセンスとは別にサブスクリプション契約が必要になる。工作機械の話ではないが、「AIが案を出し、人が承認する」という設計支援の形は、CNCのプログラミング支援とも共通する考え方だ。","2026-11-24","Siemens","https://press.siemens.com/global/en/pressrelease/siemens-brings-agentic-ai-process-industry-engineering"],["AXYZ、断熱金属パネルを縦置きで削るCNC「VERTEX IMP」","カナダのCNCルーターメーカーAXYZは11月24日、発泡材を薄い鋼板で挟んだ断熱金属パネル向けの縦型CNC切削機「VERTEX IMP」を発表した。向かい合う2本のスピンドルで表と裏の鋼板を同時に加工し、長い工具で芯材を貫く必要をなくした。従来の切断方法より最大10倍速いとうたい、厚さ4・6・8インチ、長さ40フィートまでのパネルに対応する。発表にAI機能への言及はない。","\n【概要】カナダ・オンタリオ州のAXYZは2026年11月24日、断熱金属パネル（IMP）の加工に特化した縦型CNC切削機「VERTEX IMP」を発表した。発泡材の芯を薄い鋼板で挟んだパネルを立てた状態で送り込み、開口部などを加工する。\n【背景】断熱金属パネルは表裏が鋼板、中が発泡材という構造のため、片側から長い工具を通して切ると扱いにくい。AXYZはオンタリオ州ウォーターダウンに拠点を置くCNCルーティングシステムのメーカーで、建材加工の手間を減らす装置として本機を位置付けている。両面の鋼板を同時に削り、そのあとで芯の発泡材を取り除くという、パネルの構造に合わせた工程が売りだ。\n【詳細】最大の特徴は向かい合う2本のスピンドルだ。外側の鋼板2面を同時に加工するため、芯材を貫く長い工具が要らない。両側に自動工具交換装置を持ち、ローラーでパネルを機械的に押さえ、切りくずは囲いの中で回収する。手順は、パネルを縦に載せて両面の鋼板を削り、スピンドルを発泡材除去用の工具に切り替える流れだ。発泡材を取り除くときは中央のウェブを残して切り抜き部分が外れないようにし、後工程で取り外す。対象は厚さ4・6・8インチ、幅48インチまで、長さ40フィートまでのパネル。真空吸着、スポイルボード、ガスケット、テーブル面の再研削は不要で、表面に凹凸や不ぞろいがあってもローラーで対応できるという。用途にはドアや窓の開口、電気ボックスの切り欠き、空調の貫通穴、角やL字の切断、端部や独自形状の加工が挙がっている。\n【ポイント・注意点】「従来の切断方法より最大10倍速い」という数字は用途によって変わるとされ、メーカーの主張である。価格は公表されておらず、AIの機能も含まれていない。寸法、表面の形状、工具はメーカーと相談して決められる。粉じんは両方の切削位置の近くで局所的に吸い込む。素材の形状や長さの違いには、専用の取り付け具とモジュール式の材料台で対応する。問い合わせ先として電話番号とメールアドレスが公開されている。CNC加工が建材の分野にも広がっている例として押さえておきたい。","2026-11-24","FinancialContent（GlobeNewswire）","https://www.financialcontent.com/article/gnwcq-2026-11-24-axyz-introduces-vertex-imp-a-vertical-cnc-machine-for-insulated-metal-panel-processing"],["Xlaserlab、家庭工房向けの3in1レーザー溶接機「X1 Lite」","香港のXlaserlabは11月24日、溶接・切断・表面クリーニングを1台でこなすレーザー装置「X1 Lite」を11月26日に発売すると発表した。精密作業向けの約0.3kgのペンと多機能トーチを使い分け、100種類以上の材料プリセットを備える。連続出力は500W。初めてレーザー溶接を使う工房や作り手を想定するが、クラス4のレーザーのため厳重な安全対策が欠かせない。","\n【概要】香港のレーザー機器メーカーXlaserlabは2026年11月24日、家庭の工房向けの3in1レーザー装置「X1 Lite」を11月26日に発売すると発表した。レーザー溶接、切断、表面クリーニングに1台で対応し、レーザー溶接が初めての作り手を主な対象にしている。\n【背景】Xlaserlabは溶接、切断、クリーニング、彫刻用のレーザー機器を開発している。X1 Liteは「1台の機械で、2通りの溶接」をコンセプトに、精密な作業と大きめの板金作業を1台でまかなえるようにした。金属を扱う作業ごとに道具と出発点となる設定を選べるようにして、経験の少ない人でも始めやすくしている。仕様やキットの選択肢は製品ページで確認できる。\n【詳細】構成は精密用の「ペン」と多機能の「トーチ」の2本立てだ。ペンは約0.3kgで、小さな部品の精密溶接や細かな切断、装飾品、補修に向く。パルススポット溶接モードは、材料、継ぎ手の設計、手順の条件が合えばシールドガスなしでも使える。トーチは溶接、切断、表面クリーニングに対応し、板金の組み立て、装飾構造物、金属の修復に使う。クリーニング時の走査幅は最大150mm。連続出力は500Wで、軟鋼なら材料の状態、合わせ、設定が適切な場合に板厚2.5mmまで溶接できるとしている。100種類以上の材料プリセットがあり、作業ごとに道具と初期パラメーターを選べる。公式の開封動画や金属加工の作例動画も用意されている。問い合わせ先の担当者名とウェブサイトxlaserlab.comも記載されている。\n【ポイント・注意点】ペンは一部のキットにしか付属しないため、購入時に構成の確認が必要だ。X1 Liteはクラス4のレーザー機器で、管理された作業場所、波長に合った保護メガネ、十分な排煙、防火対策、操作者の訓練、反射光への対策が求められる。価格は発表に記載がなく、AI機能への言及もない。シールドガスなしの溶接や板厚2.5mmといった数値は、いずれも条件付きの値である。家庭工房で金属加工の幅を広げる道具になりうるが、安全面のハードルは高いと考えておきたい。","2026-11-24","The Manila Times（Plentisoft）","https://manilatimes.net/2026/11/24/tmt-newswire/plentisoft/xlaserlab-announces-x1-lite-a-3-in-1-laser-welder-for-home-workshops/2476783"],["Akebonoの米ブレーキ工場のCNC設備、2027年2月に一括競売","産業資産の売却を手がける米AssetBuiltは11月24日、Akebonoの自動車用ブレーキ製造事業で使われた米ケンタッキー州エリザベスタウンの設備を、2027年2月2〜3日にウェブ中継方式で競売にかけると発表した。ファナックのROBODRILL、CHIRONの立形マシニングセンター、ジェイテクトの横形マシニングセンターなどが並ぶ。航空宇宙や一般金属加工にも転用できるとしている。","\n【概要】産業資産のアドバイザリーと売却を手がける米AssetBuiltは2026年11月24日、Akebonoの自動車用ブレーキ製造事業で使われてきた機械設備を競売にかけると発表した。対象は米ケンタッキー州エリザベスタウンの拠点の設備で、2027年2月2日と3日の2日間、米東部時間の午前10時から世界向けのウェブ中継方式で実施する。\n【背景】AssetBuiltは自動車、航空宇宙、EV・電池、エネルギーなどの分野で設備の処分を支援している。今回は、量産工場のCNC設備がまとまって中古市場に出る例となる。買い手には、早めにカタログを確認し、事前に登録するよう呼びかけている。\n【詳細】主な出品は、ファナックのROBODRILLマシニングセンター、CHIRONの立形マシニングセンター、MURATAのCNC旋削設備、ジェイテクトの横形マシニングセンター、中村留の機械だ。ほかにNACHIやAmerican Broachの機械、ファナックの産業用ロボット、Edgewater Automationのシステム、HexagonとWenzelの三次元測定機も並ぶ。ブレーキ関連では、キャリパーの組立ステーション、電動パーキングブレーキ（EPB）の組立設備、トルクと漏れの自動試験装置、ピストンとドラムの製造設備がある。分類としては、ブローチ加工と金属加工、トランスファーマシン、プレスと成形、ツールルームの機械、マテハン、保全設備まで含む。リリースは、多くの設備が航空宇宙、防衛、一般金属加工、産業オートメーションにも使えるとしている。CEOのTara Shaikh氏と、事業開発担当副社長のJake Freedlander氏のコメントも載っている。\n【ポイント・注意点】最低落札価格やロット数は示されておらず、AIに関する記述もない。下見は予約制で、カタログの確認、事前登録、下見の予約を勧めている。量産向けのCNC機や測定機をまとめて調達できる機会として、設備を増やしたい加工工場には参考になる。中古設備は状態の確認が欠かせないため、下見を活用したい。","2026-11-24","The Manila Times（GlobeNewswire）","https://www.manilatimes.net/2026/11/24/tmt-newswire/globenewswire/assetbuilt-announces-major-two-day-global-auction-of-akebono-automotive-brake-manufacturing-equipment-in-kentucky/2477145"],["シーメンス、SPS 2026で産業AIの「測れる成果」を前面に","IIoT Worldは11月23日、シーメンスが11月24〜26日の展示会SPS 2026で産業AIの導入成果を示すと伝えた。会場では消費財ラインを模したポップアップ工場を動かし、AIの画像検査、デジタルツイン、データ処理、無人搬送車を組み合わせて、再プログラムなしで生産内容を変える。エルランゲン工場ではAI外観検査で品質の誤判定を60％減らしたという。シーメンス提供のスポンサー記事だ。","\n【概要】産業IoTメディアのIIoT Worldは2026年11月23日、シーメンスのオートメーション部門でマーケティングを担うマーカス・ブリーツェ副社長へのインタビューを掲載した。シーメンスはニュルンベルクで11月24〜26日に開かれるSPS 2026の11号館で、産業AIを生産に使った顧客の成果を示すという。\n【背景】製造ラインで品種を切り替えるには、通常は再プログラミングと停止時間が必要になる。記事は、AIのデモを見せる段階から、測れる成果を示す段階へ移ったことを強調している。シーメンスは前年のSPSで産業AIによる性能の飛躍を示しており、今年はその実績を顧客の事例で見せる構成だ。\n【詳細】目玉は消費財の生産ラインを模したポップアップ工場だ。製品をリアルタイムで見分けて品質を検査するAIビジョン、CES 2026で初公開した製品・生産・サプライチェーンのモデルをつなぐDigital Twin Composer、データを処理して文脈を付けるRapidMiner、自律的な構内物流を担うAGVによるフィジカルAIを組み合わせ、再プログラミングなしで生産内容を変えられるとする。顧客の成果としては、シーメンスのエルランゲン工場でAI外観検査が品質の誤判定を60％減らした例を挙げた。会場とデジタル配信では130人以上が講演し、Evonik、P&G、Contiweb、Eigen Engineering Agentのパネルが予定されている。Eigenは2026年4月に一般提供となり、19カ国の100社以上で試験され、TIA Portal V19〜V21に組み込まれた。手作業より最大5倍速く設計作業をこなすとされる。\n【ポイント・注意点】記事は「Sponsored by Siemens」と明記されたスポンサー記事で、AIツールで要約し編集部が確認したとの注記もある。数値はシーメンス側の主張だ。EUサイバーレジリエンス法（CRA）にも触れ、報告義務は2026年9月11日に始まり、完全な適用は2027年12月とされる。違反すれば最大1500万ユーロの罰金とEU市場からの排除がありうるという。","2026-11-23","IIoT World","https://www.iiot-world.com/smart-manufacturing/sps-2026-industrial-ai-value/"],["深圳の加工会社YPMFG、複雑部品は5軸で段取りを減らせと解説","中国・深圳の加工サービス会社YPMFGは11月23日、5軸CNC加工の利点と限界を解説するリリースを出した。3軸機では3〜5回の段取りが要る部品も、5軸機なら1〜2回で済む場合があるとし、斜めの油穴や深いポケット底のアンダーカット、ねじれた羽根面などに向くと説明する。一方で、CAMのポスト処理、剛性、費用、検査計画という4つのハードルも挙げ、5軸が向かない部品も示した。","\n【概要】中国・広東省深圳のYPMFGは2026年11月23日、「複雑な部品は段取りを変えるより機械を変えるべき」と題して、5軸CNC加工を解説するリリースを公開した。自社の5軸加工サービスの紹介を兼ねた、教育的な内容になっている。\n【背景】3軸機では、斜めの油穴、深いポケットの底のアンダーカット、ねじれた羽根面、横から近づく必要がある空洞などに工具が届かない。部品をつかみ直す段取りが増えれば、そのぶん手間もかかる。同社は、前面、背面、側面の加工が必要な部品は、3軸設備では3〜5回の段取りになると指摘している。\n【詳細】5軸機は回転軸を2つ加えて工具の向きを制御でき、部品を1回固定するだけで加工できる。工具を横や斜めから当てられる、複数の面の形状を1回の段取りで削れる、ボールエンドミルやラジアスエンドミルを自由曲面に沿わせて一定の切削速度で動かせる、といった利点を挙げる。3軸で3〜5回の段取りが要る部品でも、5軸なら1〜2回で済む場合があるという。一方でハードルは4つある。CAMのポストプロセッサーを機械の構造に合わせる必要があること、突き出しの長い工具や極端な傾斜角では剛性の補正が要ること、時間単価が高いこと、検査計画を加工と並行して設計する必要があることだ。代表的な部品として、インペラーやブリスク、ロボット関節と減速機のハウジング、ドローンのジンバル台、自動車のターボハウジングと吸気マニホールド、インプラントや手術器具の部品を挙げた。\n【ポイント・注意点】同社は、工具、治具、検査がそろえば±0.01mmは日常的に出せるとし、5軸の総コストが必ず高いわけではないと説明する。一方で、一方向からだけ削る部品や単純な旋削軸では5軸は不向きだとも書いている。依頼はSTEP形式が望ましく、無料のDFMレビューと24時間以内の見積もりに対応する。急ぎの試作は1日で用意でき、最小発注数はなく1個から受ける。工場はISO 9001:2015とIATF 16949の認証を持ち、三次元測定機で検査して自動車部品はロットを追跡できるという。AI機能の話は含まれない。","2026-11-23","The Manila Times（Plentisoft）","https://manilatimes.net/2026/11/23/tmt-newswire/plentisoft/ypmfg-5-axis-cnc-machining-why-complex-parts-should-change-machines-instead-of-changing-setups/2476065"],["ゴムマリ、過去図面から類似案件を探すPoCを30万円から提供","東京のゴムマリは11月22日、自社の過去図面から似た案件を見つけられるかを本格導入前に確かめる「類似図面検索」のフィージビリティPoCを始めた。図面、工程表、加工プログラムを案件ごとに1行へまとめ、寸法や形状、材質、工程の近さで検索できるようにする。図面と工程表はAIが読み取り、人が確認する。料金は30万円から、期間は2〜3週間が目安で、本格導入は月額制のAIエージェントとして提供する。","\n【概要】ゴムマリ株式会社（東京都、代表・村山雄太氏）は2026年11月22日、「類似図面検索」のフィージビリティPoC（概念実証）の提供を始めた。本格導入の前に、顧客の手元にある過去の図面から似た案件を見つけられるかを確かめるサービスだ。候補は一致の根拠を添えて示し、顧客が確認した結果をもとに条件を調整して、目標に照らした検索結果を報告する。\n【背景】同社が引用した調査（New Innovationsが2025年6月30日に公表、製造業従事者200人が対象）では、図面検索の課題として「図面にひもづく情報が確認できない」が34.0％で最も多く、「似た図面が見つからない」も27.0％あった。設計業務が特定の人の経験に頼っていると答えた人は、「よくある」「ときどきある」を合わせて85.5％にのぼった。\n【詳細】顧客はメールや共有フォルダーなど普段の方法で、過去案件のフォルダーをそのまま渡す。ゴムマリは図面、工程表、加工プログラムを案件ごとに1行の表にまとめ、寸法、形状の特徴、材質、工程の近さで検索できるようにする。表はNotionなど顧客が選んだツールに置き、ツールがなければExcelを使う。図面と工程表はAIが読み取り、別部品の工程表が紛れ込んでいないかは人が確かめて確認リストに載せる。成果物は統合した表、一致の理由を付けた類似案件の候補リスト、検証レポートだ。スキャンしたPDFはページ単位で扱い、CADのDXFがあれば読み取れる値が増える。参考事例として、過去約700案件、約2万ファイルを持つ大手メーカーの例を挙げている。\n【ポイント・注意点】料金は30万円から、期間は2〜3週間が目安だが、案件数、図面や工程表の形式、使うシステムによって変わる。PoC後の本格導入は月額制のAIエージェントとして提供し、価格は示していない。参考事例では約40案件に元資料がなく、推測せずに保留した。サンプル80件のPDFのうち約7割が画像だけのスキャンで、約8,000ページあったという。料金は配信日時点のもので、変更の可能性があるとしている。","2026-11-22","RBB TODAY（PR TIMES）","https://www.rbbtoday.com/release/prtimes2-today/20261122/1408467.html"],["三菱電機「Serendie Automation」、人型ロボとCNCの連携を検証","MONOistは11月20日、三菱電機が11月18日の「FA Serendie Days」で示した新ブランド「Serendie Automation」の具体像を伝えた。CNC工作機械とヒューマノイドが材料の取り扱いや機械間の搬送、機械への着脱を分担する検証を進め、2026年度から自社工場でヒューマノイドの導入を始める計画だという。ロボットをサービスとして売るRaaSの構想も紹介した。","\n【概要】MONOistは2026年11月20日、三菱電機が11月18日の「FA Serendie Days」で発表した新ブランド「Serendie Automation」について、展示や構想を紹介する後編記事を掲載した。ヒューマノイドからAIビジョンまで、具体的な取り組みを取り上げている。\n【背景】三菱電機はFA事業の新しいソリューションブランドとしてSerendie Automationを立ち上げた。AIエージェントやフィジカルAIを使い、人手不足などの操業課題に対応する狙いがある。前編ではブランドの全体像を扱い、後編では会場で示した具体例に焦点を当てている。工作機械と人型ロボット、ロボットのソフトウエアという3つの切り口から、AIを工場の現場に入れる道筋を示した形だ。\n【詳細】ヒューマノイドとフィジカルAIについては、CNC工作機械とヒューマノイドが協力する一連の検証を進めている。対象の作業は、材料の取り扱い、機械間の搬送、機械への材料の着脱などだ。三菱電機は2026年度から自社工場でヒューマノイドの導入を始める計画だが、ヒューマノイドの機体を自社で供給する予定はなく、外部の製品を使う。もう一つの柱がRobotics as a Service（RaaS）だ。ロボットをハードウエアとして売るのではなくサービスとして提供し、画像認識や動作のプログラムをアプリとして販売するモデルを示した。デモでは3台のカメラとAIを使ったシステムにより、事前に位置を教えなくてもロボットがリアルタイムに自分の位置を補正した。アプリはSDKで作る。\n【ポイント・注意点】同社の担当者は、画像認識とリアルタイム処理は現時点ではローカル環境で動かしており、将来はフィジカルAIによってより柔軟な設計ができる可能性があると話している。記事には価格、導入件数、デモの性能値は載っておらず、展示は構想や検証の段階のものが中心だ。CNC工作機械とヒューマノイドの組み合わせは、工作機械向けのCNCも手がける三菱電機らしい取り組みだ。実用化がどこまで進むかに注目したい。","2026-11-20","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/20/news045.html"],["Hymson、AIデータセンター向けサーバーラック板金を一貫自動化","Hymson Laser Machineryは11月20日、AIサーバーキャビネットの製造に向けた板金加工の自動化ラインを発表した。コイル材の巻き戻しからレーザー切断、曲げ、溶接、寸法検査、組立までを1本のラインでつなぐ。米ラスベガスのFABTECH 2026で世界初公開したという。AIデータセンターの建設拡大を受け、寸法精度と安定した量産の両立を狙う。価格は示していない。","\n【概要】Hymson Laser Machineryは2026年11月20日、AIデータセンター向けの板金加工ソリューションを発表した。AIサーバーを収めるキャビネットの製造を対象に、キャビネットの加工、寸法検査、自動組立を1本の生産ラインにまとめ、コイル材の投入から完成品までをつなぐ。米ラスベガスのFABTECH 2026で世界初公開したという。\n【背景】リリースによると、AIデータセンターの建設が進むにつれ、キャビネットメーカーには寸法精度と安定した量産が求められている。レーザー切断、曲げ、溶接を別々の機械で行うと、工程間で部品を運ぶたびに遅れが生じるという問題意識がある。\n【詳細】ラインはコイル材の巻き戻しとレベリングから始まり、レーザー切断に進む。切断した部品はロボットが取り出して仕分け、パンチング、インテリジェント曲げ、圧入リベット止めを経る。サブアセンブリの溶接のあとに最終組立の溶接を行う。溶接ステーションは側板用、底板・天板用、最終組立用に分かれ、自動組立の前に寸法検査を入れる。切断から曲げ、溶接、検査、組立までを自動搬送でつなぎ、人手による受け渡しを減らして連続生産を支える。精密なレーザー切断、曲げと溶接、寸法検査によって、穴位置の精度、成形品質、溶接の安定性を確保するとしている。構成は柔軟で、キャビネットの寸法や構造、加工条件の違いに合わせて素早く段取りを替えられる。複数の仕様を扱う案件では、工程とレイアウトを個別に調整できるという。Hymson Laser MachineryはHymson Laser Machinery Groupの子会社で、レーザー切断と溶接を自動ラインに組み込んだ実績があるとしている。欧州、北米、アジアの拠点網で、地域ごとの納入、技術支援、アフターサービスに対応する。\n【ポイント・注意点】対象は新たに自動ラインを計画するAIサーバーキャビネットメーカーと、さまざまな仕様の注文を受ける板金加工会社だ。1仕様の連続生産にも、仕様ごとのバッチ生産にも対応する。価格、加工速度、設備寸法は示されておらず、ライン構成は案件ごとに決まる。ここでの「AI」は加工機の機能ではなく、需要側のAIデータセンターを指す点に注意したい。","2026-11-20","The Manila Times（GlobeNewswire）","https://www.manilatimes.net/2026/11/20/tmt-newswire/globenewswire/hymson-laser-machinery-introduces-automated-sheet-metal-solutions-for-ai-data-centers/2475179"],["三菱電機、e-F@ctoryの次へ AIが改善を回す工場を構想","MONOistは11月19日、三菱電機が11月18日の「FA Serendie Days」で発表したFAソリューションの新ブランド「Serendie Automation」を伝えた。2003年に始めたe-F@ctoryを土台に最新のAIを組み合わせ、AIエージェントとフィジカルAIで現場の仕事の一部を担わせる。自然言語の指示からプログラムを作る「MELSOFT Copilot（仮称）」も近く公開する予定だ。","\n【概要】MONOistは2026年11月19日、三菱電機のFA事業の新ブランド「Serendie Automation」を解説する前編記事を掲載した。同ブランドは11月18日の「FA Serendie Days」で発表された。工場のデータ活用を進めてきたe-F@ctoryを土台に、最新のAI技術を組み合わせる。記事は、データの活用からAIが主体となる改善へという流れで、新ブランドを位置付けている。\n【背景】e-F@ctoryは2003年に始まった取り組みで、工場のデータを使って現場全体の仕事を改善する考え方だ。三菱電機FAシステム事業本部の幹部は、新ブランドについて人手不足などの操業課題に対応するためのものだと説明し、AIが仕事の一部を担えるようにAIエージェントとフィジカルAIを開発していると述べた。\n【詳細】記事で紹介されたAIエージェントは、工場の現場スタッフを支える存在だ。判断し、行動し、結果を評価し、学習するというサイクルを回し、改善を続けることを目指す。開発中のAIツール「MELSOFT Copilot（仮称）」は近く公開する予定で、自然言語の指示からプログラムを生成する。生成したプログラムは、ロジックシミュレーターのMELSOFT Mirrorと3DシミュレーターのMELSOFT Geminiで確かめ、検証結果をCopilotに戻してプログラムの精度を高める。狙いはリードタイムの短縮だ。フィジカルAIについて同幹部は、ヒューマノイドを思い浮かべる人が多いが三菱電機の考えは異なり、工場の現場の物理的な作業や設備そのものにAIを使うことだと説明した。\n【ポイント・注意点】記事に価格は載っておらず、MELSOFT Copilotの公開時期も「近く」とされるだけだ。AIが作ったプログラムを2種類のシミュレーターで検証してから使う流れは、生成AIの誤りを現場に持ち込まないための工夫といえる。CNCや制御のプログラムづくりにAIをどう組み込むかを考えるうえで、参考になる設計だ。後編ではヒューマノイドとCNC工作機械の連携などを扱っている。","2026-11-19","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/19/news045.html"],["ロックウェル、自然言語で制御プログラムを作るAI基盤を発表","MONOistは11月19日、米ロックウェル・オートメーションが11月16〜19日にボストンで開いたAutomation Fair 2026の基調講演を伝えた。ブレイク・モレットCEOは、AIの最大の役割は複雑さを単純にすることだと語った。自然言語の指示を受けたAIエージェントが、制御プログラムやHMI画面の作成の多くを自動化する新基盤「FactoryTalk Conductor」も発表した。","\n【概要】MONOistは2026年11月19日、米ロックウェル・オートメーションの年次イベント「Automation Fair 2026」での基調講演を報じた。イベントは11月16〜19日にボストンで開かれ、ブレイク・モレットCEOがAIを軸にした人間中心の自律化の構想を示した。\n【背景】モレット氏は、製造業がコスト、安全、機能のトレードオフに加え、需要やエネルギー、供給の急な変化にさらされていると指摘した。そのうえで、AIの最大の役割は複雑さを単純にすることだと述べた。作業者が複雑なワークフローを組んで調整するのではなく、システムに話しかければ応えてもらえるようにすべきだという。\n【詳細】モレット氏は、自律化は人を工程から外すためではなく、人がプラントを動かすのを助けるものだと説明した。鉱山分野では、資源大手のBHPと自律操業に取り組んでいるという。同社のシンガポール工場は2026年に世界経済フォーラムのGlobal Lighthouse Networkに選ばれ、従業員1人当たりの生産性が30％以上上がり、リードタイムを約60％短くしたという。講演では、産業向けのAIネイティブなオーケストレーション基盤「FactoryTalk Conductor」を発表した。作業者が自然言語で指示すると、AIエージェントがAIモデルやロックウェルの既存コンポーネントと連携して動く。制御プログラムやHMI（操作画面）の作成の多くを自動化でき、アプリケーションの運用と保守の全体でAIを使えるという。米ウィスコンシン州に新工場を建てる計画もあり、2027年初めの着工を見込む。\n【ポイント・注意点】FactoryTalk Conductorの価格や提供時期は記事に書かれていない。生産性などの数値はロックウェル側の発表によるもので、第三者の測定ではない。モレット氏はウィスコンシンの新工場を同社にとって最も野心的な計画と呼んでいる。工作機械そのものの話ではないが、制御ソフトの作成をAIエージェントに任せる流れは、三菱電機やシーメンスの動きとも重なる。","2026-11-19","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/19/news026.html"],["Aliencell、AI画像機能付きの卓上レーザー彫刻機「E1」を訴求","3Dプリント用ソフトCHITUBOXの姉妹ブランドAliencellは11月19日、卓上レーザー彫刻・切断機「E1」を紹介するリリースを出した。正方形のビームを作るLBS技術、素材に応じた仕上がりの事前表示、AI支援の画像機能や材料設定の推奨を備えた専用ソフトが特徴だ。価格は499.99ドルで、ブラックフライデーは449.99ドル。年末の名入れギフトや小規模事業者を狙う。","\n【概要】AliencellはGlobeNewswireを通じて2026年11月19日、卓上レーザー彫刻・切断機「E1」を紹介するリリースを出した。年末の名入れギフト作り、メイカー、小規模事業者に向けて、作業の手間を減らす設計を前面に出している。\n【背景】Aliencellは、3Dプリント用ソフトで知られるCHITUBOXの姉妹ブランドだ。卓上レーザー機は趣味だけでなく、小物の名入れ販売など小さな商売にも使われている。今回のリリースは、その需要が高まる年末商戦に合わせたものだ。リリースは、位置合わせ、仕上がりの確認、設定選びといった手間を減らす工夫を中心に打ち出している。\n【詳細】E1はLBSと呼ぶビーム整形技術を使い、10Wダイオードモジュールのスポットは0.03×0.03mmの円ではなく正方形になる。「True-to-Result Preview」は、加工前に素材に応じた仕上がりの見込みを表示する。専用ソフトAliencell Spaceはデザイン素材、フォント、QRコードの作成機能、AI支援の画像機能、材料設定の推奨を備える。前面の800万画素カメラで素材の位置合わせを助け、1.9インチのフルカラー液晶で状態と案内を表示する。作業範囲は12×12インチで、LightBurnにも対応する。最大加速度は2万mm/s²、彫刻速度は最大600mm/s。Smart Fillで量産彫刻のレイアウトを簡単にする。レーザーヘッドは細部向けの10Wダイオード、切断・彫刻向けの20Wダイオード、金属・樹脂向けの3W赤外線を交換して使える。表面に追従するロータリーも用意し、タンブラー用に30度傾けられる。\n【ポイント・注意点】価格は499.99ドル、ブラックフライデー価格は449.99ドル。購入構成によってはヘッドが別売りの場合がある。仕上がりは素材、設定、図案で変わり、初心者は説明書を読み、換気を確かめ、経験の浅い人の作業を見守るよう求めている。AI機能の具体的な中身はリリースに詳しく書かれていない。販売は公式ストアとAmazonで行い、米国拠点のアフターサービスが付く。","2026-11-19","The Manila Times（GlobeNewswire）","https://www.manilatimes.net/2026/11/19/tmt-newswire/globenewswire/aliencell-champions-an-engineering-approach-to-smarter-desktop-laser-engraving/2474099"],["CNC加工サービス市場、2032年に99.8億ドルへ 年8.16%成長予測","グローバルインフォメーションは11月19日、CNC加工サービスの世界市場に関する調査レポートの販売を案内した。市場規模は2025年の57億6,000万ドルから、2026年に62億4,000万ドル、2032年に99億8,000万ドルへ伸び、年平均成長率は8.16％と予測する。AIはCNCの作業全体にわたる実用的な層になりつつあるが、加工の専門知識を置き換えるものではないとしている。","\n【概要】市場調査レポートを扱う株式会社グローバルインフォメーション（川崎市）は2026年11月19日、調査レポート「CNC加工サービス市場：世界市場予測、2026年～2032年」の販売を発表した。市場は2032年まで年平均8.16％で伸びると予測している。\n【背景】リリースのFAQによると、業界はデジタル化された生産とサプライチェーンの強靱さという2つの流れに形づくられている。多軸加工、自動工具管理、工程内検査、デジタル作業指示、生産のネットワーク監視が広がっているという。レポートでは、自動化の導入やAIの役割も主要な論点として扱われている。\n【詳細】世界のCNC加工サービス市場は2025年に57億6,000万ドルで、2026年に62億4,000万ドル、2032年に99億8,000万ドルになる見込みだ。レポートは地域別、グループ別、国別の分析に加え、生産要件、自動化の導入、品質とコンプライアンスへの期待、人材の能力、地域ごとの製造構造、人工知能の役割に関する根拠を扱う。目次には「人工知能の累積的影響、2026年」の章があり、サービスの種類、材料、機械の種類、最終用途産業、地域、競合、企業プロファイルの各章も並ぶ。AIについては、CNCのワークフロー全体にわたる実用的な層になりつつあるが、加工の専門知識を置き換えるものではないとの見方を示す。地域別では、北米はリショアリング、中南米は自動車、欧州は高度なエンジニアリング、中東はエネルギーの多角化、アフリカは鉱業が特徴で、アジア太平洋は多様だとしている。\n【ポイント・注意点】これはレポートを扱う会社による販売告知で、予測値は調査会社独自のものだ。第三者による検証は示されていない。レポートの価格や調査方法の詳細はリリースに書かれていない。AIを「専門知識の代わり」ではなく「作業の層」と位置づける見方は、現場の加工者にとっても受け入れやすい整理だろう。市場の伸びを示す数字は、CNC加工の受託を考える人の目安になる。リリースは、リンク先の内容の適法性は保証しないとも記している。","2026-11-19","ドリームニュース","https://www.dreamnews.jp/press/0000369234"],["LONGER、AI画像ソフト付きのレーザー彫刻機などを最大48%引き","卓上ものづくり機器メーカーのLONGERは11月18日、UVプリンター、レーザー彫刻機、3Dプリンターをそろえた製品群と、ブラックフライデーの値引きを発表した。値引きは最大48％で、米東部時間の2026年11月3日から12月2日まで世界で実施する。付属ソフト「LongerStudio AI」は、背景除去、画像の配置、テキストからのロゴ生成などのAI機能を備える。","\n【概要】卓上のものづくり機器を手がけるLONGERは2026年11月18日、UV印刷、レーザー彫刻、3Dプリントの3分野をそろえた製品群を紹介するリリースを出した。あわせて、対象製品を最大48％引きにするブラックフライデーのセールも案内した。\n【背景】名入れグッズや少量生産の小物づくりでは、印刷、彫刻、造形を組み合わせる場面が多い。LONGERはこれらを卓上機でまかなえる製品群として打ち出し、デザイン作業を助けるAIソフトも用意している。用途としては、名入れギフト、アクリルの看板、装飾パネル、オリジナルのアクセサリー、限定グッズ、少量生産を挙げている。\n【詳細】UVプリンター「ePrint」のデュアルヘッド版は、エプソンF1080ヘッドを2基、インクチャネルを12備え、ホワイト、カラー、ニスに対応する。単ヘッドのePrint SEと比べ、2D印刷は最大2倍、3Dテクスチャー印刷は最大6倍速いという。盛り上げは最大15mm、高低差10mmまでの表面に印刷でき、300種類以上の素材に対応する。付属ソフト「LongerStudio AI」は、背景除去、画像レイアウト、色調整、工程シミュレーション、スタイルの変化、テキストからのロゴ生成、レイヤー処理を備える。レーザー彫刻機は、Ray5、高出力で切断向けのB1、携帯型のNano、囲い付きでクラス1の安全設計とKlipperベースの制御を持つRay7Sをそろえる。セール価格の例として、Ray5 10Wは329.99ドルが239.99ドルになり、クーポン適用後は227.99ドル。Ray7s 40Wは1129.99ドルが849.99ドルで、クーポン後は798.99ドルとなる。\n【ポイント・注意点】セール期間は米東部時間の2026年11月3日から12月2日で、対象地域は世界。追加クーポン、条件を満たした注文へのプレゼント、タイムセールもあるが、製品ごとの対象可否や条件は異なる。性能値はLONGERの主張で、特殊効果は素材と構成によって変わる。AIは主に画像やデザインの下ごしらえに使われ、加工そのものを自動で決める機能ではない。","2026-11-18","The Manila Times（GlobeNewswire）","https://www.manilatimes.net/2026/11/18/tmt-newswire/globenewswire/longer-brings-laser-engraving-3d-printing-and-advanced-uv-printing-together-in-its-expanded-desktop-creative-manufacturing-lineup/2472920"],["Creality、AIツール5種付きの2波長レーザー彫刻機「Falcon T1C」","中国Crealityは11月18日、15Wの青色ダイオードと5.5Wの赤外線を1台に積んだ小型レーザー彫刻機「Falcon T1C」を発表し、予約を始めた。ガルバノ方式で最大6,500mm/sの走査速度をうたう。専用ソフトFalcon Design SpaceにはAIによる輪郭トレースや背景除去など5つのAIツールを用意した。米国の予約価格は1,199ドルからで、世界での本格発売は12月中旬の予定だ。","\n【概要】3Dプリンターで知られる中国Crealityは、PR Newswireを通じて2026年11月18日、小型の2波長レーザー彫刻機「Falcon T1C」の発売予定を発表した。名入れ商品の事業者、工房の運営者、クリエイティブなメイカーを主な対象とし、「Built Small. Made to Perform.」を掲げる。\n【背景】名入れ商品のビジネスでは、木や革、金属など素材ごとに異なるレーザーを使い分ける必要がある。T1Cは2種類のレーザーを1台にまとめ、自宅のスタジオや小さな工房、イベント出店にも持ち込みやすい一体型の軽量設計にした。\n【詳細】15Wの青色ダイオードレーザーは木、竹、革、濃い色のアクリルの彫刻向けで、5.5Wの赤外線レーザーは金属への精密なマーキングなどに使う。高速ガルバノ方式で、指定の画像彫刻モードでは最大6,500mm/sで走査できる。独自のPixelFlow技術は、ガルバノの動きとレーザー出力を連動させ、実験室条件で画像処理の効率を従来比最大8倍に高めたという。スポット径は青色が0.06×0.05mm、赤外線が0.03×0.03mm。ソフトのプリセットレイヤーにより、モジュールの付け替えや位置の再調整が要らない。クラウドのデザインライブラリーMakerMuseとCraftSeekも使え、初級から上級までの講座「Creality Falcon Academy」も用意する。ワンタッチのオートフォーカス、手動フォーカス、カメラによる位置合わせに対応する。作業範囲は120×120mmで、別売りの延長ベッドを使うと120×480mmになる。Falcon Design Spaceには、AI輪郭トレース、AI背景除去、スマートフィル、AIフィルターなど5つのAIツールがある。\n【ポイント・注意点】米国の価格は、単体版が希望小売価格1,699ドルで、50ドルの予約金を払うと予約価格1,199ドル。空気清浄機AP1S付きは1,859ドルで、予約価格は1,259ドルとなる。価格は地域で変わる。世界での本格発売は2026年12月中旬の予定。速度や効率の数値は、指定条件や実験室条件でのものだ。","2026-11-18","The Manila Times（PR Newswire）","https://www.manilatimes.net/2026/11/18/tmt-newswire/pr-newswire/creality-unveils-falcon-t1c-the-next-generation-compact-dual-laser-engraver-built-to-empower-personalization-businesses/2472399"],["Mastercam Copilot、話しかけてCNC工程を作る範囲と限界","MachineToolNews.aiは11月18日、Mastercamのシニアアプリケーションエンジニア、ジェシー・トリンク氏へのインタビューを掲載した。CAM内のAIアシスタント「Mastercam Copilot」は、文字や音声の指示から機械グループや加工工程を作り、送りや回転数を調整できる。一方で、形状の選択や工具経路の検証はしない。人による確認や実機での試し削りの代わりにはならないとしている。","\n【概要】AIと工作機械の専門メディアMachineToolNews.aiは2026年11月18日、「Conversational CNC Programming: The View from Mastercam」を公開した。Mastercamに13年勤めるシニアアプリケーションエンジニアのジェシー・トリンク氏が、CAMソフトに組み込まれたAIアシスタント「Mastercam Copilot」について答えている。\n【背景】CNCのプログラミングは経験に頼る部分が大きく、CAMメーカー各社がAIによる支援を進めている。Mastercamは対話でCAMを操作できるようにし、定型作業の手間を減らそうとしている。人材育成の面では、Mastercam University、無料のLearning Edition、Project MFGやSkillsUSAとの連携も紹介されている。\n【詳細】Copilotは、文字や音声による自然言語の指示から、対応する機械グループや加工工程を作れる。例として「デフォルトの機械でミルの機械グループを作り、輪郭加工と2Dハイスピード加工を入れて」という指示が挙がっている。対応するミル、旋盤、ルーターの加工では主な送り速度と主軸回転数を調整でき、変更はすべてユーザーの承認を待ち、元に戻せる。複数の手順を自動化する簡単なスクリプトも作れるほか、技術情報や関連する学習動画も探せる。ファイルを開いたときや選んだ段階でプログラムを点検し、クーラント設定の誤り、ワーク座標のずれ、工具の刃長を超える切り込み深さなどを指摘する。\n【ポイント・注意点】Copilotは形状の選択、ステップオーバーの設定、切削条件の決定、工具経路の検証はしない。工具経路やファイル、大量の形状を削除することもできず、これは意図した安全策だという。指摘機能は、人のレビュー、シミュレーション、実機での確認の代わりにはならない。送りや回転数が材料、工具、機械に合っているかも判断しない。生産性の向上幅について、Mastercamは数値を示していない。今後は文脈に応じた自動化、送り・回転数の推奨、Sandvikの製品群との連携を開発の重点に挙げている。","2026-11-18","MachineToolNews.ai","https://machinetoolnews.ai/conversational-cnc-programming-mastercam/"],["イプロスAI-産業World、図面AIや類似形状検索の出展社を紹介","イプロスは11月18日、12月9〜10日に東京国際フォーラムで開く「イプロスAI-産業World 2026」のうち、設計・開発の効率化に関する注目出展社を紹介した。3D CADデータから似た部品を探すシステム、設計図面に特化したAI、図面から見積もりを作るAIエージェントなどが並ぶ。AI・DXの企業100社以上が出展し、セミナーは50本以上を予定している。入場は事前登録制で無料だ。","\n【概要】株式会社イプロスは2026年11月18日、「イプロスAI-産業World 2026」で設計・開発の効率化に役立つ製品を出す注目企業を紹介した。展示会は12月9〜10日に東京国際フォーラムで開かれ、事前登録をすれば入場は無料だ。\n【背景】展示会は、製造業向けのAI・DX展と建設業向けのAI・DX展（いずれも第1回）、フィジカルAI・ロボットの特別ゾーンの3つで構成する。AI・DXのソリューション企業100社以上が出展し、セミナーは50本以上を予定している。図面や設計データの活用は、加工の見積もりや段取りにも直結する分野だ。主催はイプロスで、PLMジャパンやプラント・建築設計のサンウェルも出展する。\n【詳細】スマートスケープは、品番やファイル名がなくても3D CADデータから似た形状の部品を探す「SS4M」を出す。RCIエージェンシーは、検索、抽出、数量拾い、検図、図面比較ができる設計図面特化のAIを紹介する。LIGHTzの「blooplinter」はAI検図、過去不具合の検索、形状差分の確認、類似形状検索を備え、自動車部品のTier1企業で検証工数を70％減らしたという。伊藤忠テクノソリューションズは3DWorks、3DEXPERIENCE、AI設計機能を持つSOLIDWORKSを、PTCジャパンはCreoやWindchillなどを出展する。STAR UPの「ARCHAIVE」は、類似図面検索、差分検出、見積もりエンジン、BOM管理、生成AIエージェントをそろえる。セミナーでは、日本語の指示から3DデータとBOMを作る取り組みや、図面から見積もりを作るAIエージェントも取り上げる。\n【ポイント・注意点】紹介されたのは出展社の一部で、製品の価格は示されていない。「70％削減」は出展企業側の数字だ。ブースを予約するとAmazonギフトカードがもらえるキャンペーンもあるが、カードは会期後に送られ、配布は2027年1月15日までとなる。加工の受託で図面の読み取りや見積もりに手間がかかっている現場には、比較検討の場になりそうだ。","2026-11-18","PR TIMES","https://prtimes.jp/main/html/rd/p/000000237.000001332.html"]],"cricut":[["感謝祭のセンターピース12案、クリカットで食卓を演出","Cricut公式ブログが、感謝祭の食卓を彩る手作りセンターピースのアイデア12案を公開した。ビニールで「Give Thanks」と入れた木製フラワーボックス、紙のリンゴかご、3Dパンプキンとパイの箱、メタリックベラムのランタン、ゲストが感謝の言葉を書き込む「感謝の木」などを、素朴・ブルー＆ホワイト・カボチャ・低予算・子ども向けのテーマ別に整理。いずれもカッティングマシンとLightGripまたはStandardGripマットで作れる。","\n【概要】Cricut公式ブログは2026年11月24日、「12 DIY Thanksgiving Centerpiece Ideas for Every Table」を公開した。筆者はBeth Baty氏。感謝祭のテーブル中央に置く飾りを、Cricutのカッティングマシンで手作りするアイデアを12案まとめている。多くの案はDesign Spaceの既存プロジェクトをもとにしており、材料欄にはどの案にも対応するLightGripまたはStandardGripマットとマシンが挙げられている。\n\n【背景】感謝祭は家族や友人が食卓を囲む行事だ。記事は、伝統的なセンターピースは豊穣の角（コルヌコピア）だとFAQで触れつつ、紙やビニール、木製ブランクを使って手軽に自作する方法を提案している。\n\n【詳細】素朴・ファームハウス系では、白の永久ビニールで「Give Thanks」と入れた木製フラワーボックス、「Fall Canvas Texture Ceramic Vase」のデザインでドングリを飾った陶器の花瓶、「3D Apple Basket」で作る紙のリンゴかご、黒や茶とオレンジのビニールで文字を入れた木製サインを紹介。ブルー＆ホワイト系では、ガラス花瓶に濃紺とブロンズの葉を吊るす案や、クリーム・濃紺・セージなどのカードストックで作る紙の花のアレンジ（フローラルフォーム、18ゲージのワイヤー、白いキャンドルを併用）がある。カボチャ・ドングリ系では、「Fall Centerpiece」のトレー、メタリックベラムで作るドングリと松ぼっくりのランタン、「3D Pumpkins」「Pumpkin Pie Box」を金のメタリックポスターボードで作る案。低予算向けにはLEDキャンドルを紙で巻く案と、Print Then Cutで作るホログラムのキャンドル用ステッカー、子ども向けには紙のカエデの葉に感謝を書いて枝に貼る「感謝の木」が挙がっている。\n\n【ポイント・注意点】高さは「12インチ以下」が目安とされ、向かいの人の顔が隠れない配慮が示されている。紙のリンゴかごは生花の水がカードストックに触れないよう小さな花瓶を別に入れること、紙の近くでは電池式やLEDのキャンドルを使うこと、ステッカーを貼るガラスのボーティブは事前に洗って乾かすことが注意点として挙げられている。記事に価格の記載はない。","2026-11-24","Cricut Blog","https://cricut.com/blog/showstopping-diy-thanksgiving-table-centerpieces/"],["ツリー型ギフトボックスの無料SVG、星窓に金の箔紙を","Gilded Storkが、ピラミッド形のクリスマスツリー型ギフトボックスを作る無料SVGとクリカット向けの作り方を公開した。緑のカードストックで本体を作り、星形の窓の裏に金の箔カードストックを貼り、4本のリボンを穴に通して蝶結びにすると箱が閉じる仕組み。Design Spaceで折り線をカットからスコアに変えるのが要点だ。小さな贈り物やお菓子を入れるラッピングに向く。データはニュースレター登録でパスワードを得るライブラリで配布されている。","\n【概要】ペーパークラフト系ブログのGilded Storkは2026年11月23日、「DIY Christmas Tree Gift Box with Cricut (Free SVG)」を公開した。ピラミッド形のクリスマスツリーをかたどったギフトボックスで、小さな贈り物やお菓子を入れる用途を想定している。カードストックで本体を作り、リボンで口を閉じる構造になっている。\n\n【背景】年末に向けて、手作りの小箱でプレゼントを包むアイデアの需要が高まる時期だ。カッティングマシンなら、折り線と窓抜きのある立体の箱を正確に切り出せる。Gilded Storkはこの時期、クリスマス向けの箱やカードの無料SVGを続けて公開しており、本記事もその一つ。\n\n【詳細】材料として挙げられているのは、緑のカードストック、星形の窓に使う金の箔カードストック、リボン4本、のり、スコアリングスタイラス、カッティングマットだ。手順は、まずSVGをDesign Spaceにアップロードし、折り線の設定を「カット」から「スコア」に変更してから切り出す。次に、金の箔カードストックの三角形を星形の窓の裏側に貼り付ける。その後、ツリーの4面それぞれにある穴にリボンを1本ずつ通し、箱の内側で結び目を作って抜けないようにする。最後に4本のリボンの端をまとめて蝶結びにすると、箱が閉じてツリーの形になる。窓から金色がのぞくことで、星が光っているように見えるデザインだ。\n\n【ポイント・注意点】折り線をスコアに変え忘れると、折るべき線が切れてしまうので注意したい。記事には完成サイズや素材ごとのカット設定、刃の指定は書かれていないため、使用する紙の厚みに合わせて自分で調整する必要がある。SVGはGilded Storkの「Design Files Library」で無料配布されており、利用にはニュースレター登録で届くパスワードが必要。SVGの利用条件について詳しい記載はなく、ページ内の画像は著作権で保護され、無断使用は不可とされている。","2026-11-23","Gilded Stork","https://gildedstork.com/christmas-tree-gift-box-cricut/"],["「Everything Is Fine」の無料SVG、皮肉の効いた冬の一枚","Crafty Crafterが、クリスマス向けのユーモアデザイン「Everything is Fine」の無料SVGを公開した。セーター、マグ、トートバッグ、エプロン、窓用デカール、メタリックのオーナメントなどへの使用を想定。金や銀のメタリックEasyWeed HTV、マグ用の光沢永久ビニール、転写シート、ミニヒートプレスの使用を勧めている。Cricut Joy、Maker、Exploreに対応し、HTVでは反転が必要。利用は個人用途に限られる。","\n【概要】無料SVG配布サイトのCrafty Crafterは2026年11月23日、「Everything Is Fine SVG for Cricut – Free Christmas Cut File」を公開した。「Everything is Fine（すべて順調）」という文字を使ったクリスマス向けのユーモアデザインで、慌ただしい年末の気分を皮肉っぽく表現している。\n\n【背景】ホリデーシーズンには、定番の「Merry Christmas」だけでなく、ひねりのある言葉を入れたシャツやマグも人気がある。同サイトは11月に入りクリスマス関連の無料カットファイルをほぼ毎日公開しており、本作もそのシリーズの一つだ。データはGoogle Driveのリンクから入手する形式になっている。\n\n【詳細】記事が提案する用途は、クリスマスセーター、マグ、トートバッグ、エプロン、窓やドアのデカール、メタリックのオーナメントなど。素材としては、布ものには金または銀のメタリックEasyWeed HTV（熱転写ビニール）、マグには光沢のある永久ビニール、ほかに転写シートとミニヒートプレスが挙げられている。作り方の説明では、HTVでカットする場合はデザインを反転（ミラー）させるよう指示しており、Cricut Joy、Maker、Exploreで使えるとしている。サイト共通の説明として、SVGファイルの不具合をチェックするツール「SVG Doctor」の案内もある。\n\n【ポイント・注意点】サイトのFAQによると、SVGは個人利用のみ無料で、作った実物は贈り物にしたり販売したりできるが、デジタルファイル自体の再販や再配布は禁止されている。ページには完成サイズや詳細なカット設定の記載はないため、貼る物の大きさに合わせて拡大縮小し、素材のメーカーが示す温度や時間に従って圧着したい。HTVの反転を忘れると文字が裏返しになるので、カット前の確認が欠かせない。メタリックHTVを選べば、シンプルな文字デザインでも季節らしい華やかさが出る。","2026-11-23","Crafty Crafter","https://crafty-crafter.club/christmas/everything-is-fine-svg-for-cricut/"],["Cricut公式の初心者ガイド、機種選びから最初の一作まで","Cricut公式ブログ（英国版）が、初めてクリカットを使う人向けのガイドを公開した。Design Spaceの対応環境と初期設定の手順、作りたい物ごとの必要な道具の一覧、最初の作品としてのビニールステッカーの6ステップ、Joy・Explore・Makerなど機種の違い、ヒートプレスの種類、AI機能、マットのサイズまでを網羅。ChromebookやLinuxでは使えないことや、ステッカーや紙にはヒートプレスが不要なことも明記している。","\n【概要】Cricut公式ブログの英国版は2026年11月22日、「How to Get Started with Cricut: A Beginner's Guide」を公開した。初めてCricutのマシンを手にした人に向けて、セットアップ、必要な道具、最初の作品、機種の選び方、Design Space、サポート窓口までを一通り解説している。同じ内容の記事はオーストラリア版ブログにも掲載されている。\n\n【背景】カッティングマシンは本体だけでなくマットや刃、ビニールなど周辺の道具も多いため、何から始めればよいか迷う初心者向けに、公式が基本をまとめた形だ。\n\n【詳細】Design Spaceは対応するWindowsとMac、iOS、Androidで使えるが、ChromebookとLinuxには対応しない。初期設定はcricut.com/setupにアクセスし、アカウントを作成またはログインして機種を選び、アップデートと試し切りを済ませる流れ。記事の表では、ビニールステッカーには粘着ビニール、必要に応じたマット、ウィーダー、転写シート、スクレーパーが必要で、アイロン接着のトートやTシャツにはヒートプレスと耐熱マットが要ると整理している。最初の作品にはビニールステッカーを勧め、採寸とデザイン、カット準備、カット、カス取り、転写、貼り付けの6ステップを示す。機種はJoyシリーズ、Exploreシリーズ、Makerシリーズのほか、印刷ステッカー用のStickerPixを紹介。Design Spaceは無料で、Cricut Accessは任意の有料サブスクリプション、AI Project Designerは無料ユーザーにも一度だけAIクレジットが付与されるという。\n\n【ポイント・注意点】小さなデザインにはJoy 2やJoy Xtra、大きな作品にはExploreやMakerが向くとされる。マットはExploreとMakerが30.5×30.5cmまたは30.5×61cm、Joyが11.4×16.5cm、Joy Xtraが21.6×30.5cm。Maker 5は厚さ3mmまでの対応素材を切断・彫刻できる。屋内には再剥離ビニール、屋外には永久ビニールが適する。ステッカーやビニール、紙の作品にはヒートプレスは不要だ。記事に価格の記載はない。","2026-11-22","Cricut Blog UK","https://cricut.com/blog/gb/how-to-get-started-with-cricut/"],["家の形のクリスマスギフトボックス、窓に光を灯す無料SVG","Gilded Storkが、家の形をしたクリスマス用ギフトボックスの無料SVGとクリカットでの作り方を公開した。丈夫さを出すため白いポスターボードを本体に使い、窓の裏には金の箔カードストックを貼る。窓を開けたままにしてライトを入れるアレンジも提案。屋根の両側にある3つの穴にリボンを通して結ぶと箱が閉じる。折り線をカットからスコアに変更するのが要点で、データはニュースレター登録で入れるライブラリで配布されている。","\n【概要】Gilded Storkは2026年11月22日、「DIY Cricut Christmas House Gift Box (Free SVG)」を公開した。クリスマスの家並みを思わせる家の形のギフトボックスで、窓から金色がのぞくデザインになっている。プレゼント用の小箱としても、飾りとしても使える作品だ。\n\n【背景】同ブログはこの時期、クリスマス向けのペーパークラフトの無料SVGを続けて公開しており、翌日にはツリー型のギフトボックスも掲載している。立体の箱は折りしろや差し込みタブが多く手で切るのは手間がかかるが、カッティングマシンを使えば正確に切り出せる。\n\n【詳細】必要なものは、カッティングマシン、ポスターボード、金の箔カードストック、リボン、のり、StandardGripマット。本体に白いポスターボードを使うのは、箱としての丈夫さを確保するためだと説明している。手順は、SVGをアップロードし、折り線を「カット」から「スコア」に変更してから切り出す。壁はスコア線に沿って折り、側面のタブを内側に差し込んで組み立てる。床はタブに合わせて少しずつ回り込むように取り付ける。窓の裏には金の箔カードストックを貼るが、窓を開けたままにして中にライトを入れる方法も紹介されている。仕上げに、屋根の両側にある3つの穴にリボンを1本ずつ通し、端を結んで蝶結びにすると箱が閉じる。中に薄紙（ティッシュペーパー）を入れるアレンジにも触れている。\n\n【ポイント・注意点】ライトを入れる場合は、窓の裏に箔紙を貼らずに開けておく必要がある。記事には完成サイズやマシンのカット設定は書かれていないため、ポスターボードの厚みに合わせて素材設定を選び、必要なら試し切りをするとよい。SVGはGilded Storkの「Design Files Library」から入手でき、ニュースレター登録で届くパスワードが必要だ。ライセンス条件の詳しい記載はない。ツリー型の箱と並べれば、統一感のあるクリスマスの贈り物になる。","2026-11-22","Gilded Stork","https://gildedstork.com/cricut-christmas-house-gift-box/"],["ツリーに乗る妖精の無料SVG、靴下やマグの装飾に","Crafty Crafterが、クリスマスツリーに乗ったいたずらっぽい妖精（エルフ）を描いた無料SVGを公開した。緑の靴下に赤のグリッターHTV、陶器のマグに永久ビニール、アクリルの重ねオーナメント、黒Tシャツに白HTVのサイン、ペンで描くカードストックのギフトタグ、アイロン接着のエプロンなど幅広い作例を提案。ファイルは解凍してアップロードし、HTVでは反転させて使う。Silhouette Studioでも利用でき、個人利用向けとして配布されている。","\n【概要】Crafty Crafterは2026年11月22日、「Elf Christmas Tree SVG for Cricut – Free Holiday Cut File」を公開した。クリスマスツリーに乗った茶目っ気のあるエルフ（妖精）をモチーフにしたカットファイルで、クリカットなどのカッティングマシンで使える無料データとして配布されている。\n\n【背景】エルフはクリスマスの定番キャラクターで、子ども向けの小物や家族おそろいのシャツなど、季節の手作りに取り入れやすい題材だ。同サイトは11月に入り、クリスマス関連の無料SVGを連日公開しており、本作もその一つ。データはGoogle Driveのリンクから入手する。\n\n【詳細】記事が挙げる作例は幅広い。緑のクリスマスストッキング（靴下）に赤のグリッターHTV（熱転写ビニール）を貼る案、陶器のマグに永久ビニールを貼る案、アクリル板を重ねたオーナメント、黒いTシャツに白いHTVでサイン風に入れる案、ペンプロッター機能で描くカードストックのギフトタグ、アイロン接着で仕上げるエプロンなどだ。作り方としては、ダウンロードしたファイルを解凍してからDesign Spaceにアップロードし、HTVに切る場合はデザインを反転（ミラー）させ、貼る物に合わせてサイズを調整するよう説明している。CricutだけでなくSilhouette Studioでも使えるとしている。\n\n【ポイント・注意点】サイトのFAQでは、SVGは個人利用に限り無料で、作った実物は贈ったり販売したりできるが、デジタルファイル自体の再販・再配布はできないと定めている。ページに完成サイズや詳しいカット設定の記載はないため、素材ごとの推奨設定や圧着条件は各メーカーの案内を確認したい。グリッターHTVを使う場合も、細かい部分のカス取りを丁寧に行うと仕上がりがよい。作例の多さから、家族や友人向けの小物をまとめて作るのにも使いやすいデザインといえる。ファイルの不具合が気になる場合は、サイトが案内する「SVG Doctor」で確認できる。","2026-11-22","Crafty Crafter","https://crafty-crafter.club/christmas/elf-christmas-tree-svg-for-cricut/"],["クリカットで封筒の宛名書き、無料のA7封筒データ付き","Jennifer Makerが、クリカットのペン機能で封筒の宛名を書く方法と、無料の装飾A7封筒データ（デザイン#851）を公開した。完成サイズは横7.25×縦5.25インチで、誕生日・クリスマス・雪の結晶の3柄をスコアあり・なしの2版で用意。65ポンドのカードストック、細字0.4mmペンやグリッターゲルペンを使い、宛名は45、住所は26のサイズに設定するなど具体的な数値を示す。差出人住所は180度回転させるのがコツだ。","\n【概要】クラフト系ブログのJennifer Makerは2026年11月21日、「How to Address Envelopes With a Cricut: Make Writing Easy!」を公開した（ページには最終更新日として11月21日と22日が表示されている）。クリカットのペン機能で封筒に宛名を書く方法を、無料の装飾A7封筒データ（デザイン#851）とともに解説している。\n\n【背景】年末はクリスマスカードや年賀状など、封筒の宛名を書く機会が増える。手書きの手間を省きつつ、きれいな文字で仕上げたい人に向けた内容だ。\n\n【詳細】封筒の完成サイズは横7.25×縦5.25インチ。誕生日、クリスマス、雪の結晶の3デザインがあり、それぞれスコア線ありとなしの版を用意、SVG・DXF・PDF形式で配布される。材料は12×12インチ・65ポンドの白いカードストック、緑のStandardGripマット、Fine Point 0.4mmペン、0.8mmのグリッターゲルペン、1.0mmのゲルペン。素材設定はMedium Cardstock（80ポンド、216gsm）で圧力を「More」にする。筆者はCricut Maker 4を使用しているが、Maker、Explore、Ventureのどれでも作れるという。スコア版にはスコアリングスタイラスかスコアリングホイールが必要。Design Spaceではファイルのグループを解除してパーツを「Pen」に設定し、宛名の文字サイズを45、住所を26とする。差出人住所はJM Tallフォントで50/30とし、180度回転させる。ペンの文字が正しいパーツに描かれるよう「Attach」を使う。組み立ては線に沿って折り、側面のタブを本体に貼ってから底のフラップを貼る。\n\n【ポイント・注意点】ペンは事前に裏紙で試し書きすること、マシンから下ろす前に角を持ち上げて切れているか確認すること、細い一筆書き系のフォントを使うことが勧められている。濡れる恐れがある場合は透明のマットテープで保護するとよい。宛名のフォントは有料のDear Agatha 2で、無料の代替としてBaldiveが紹介されている。無料データの入手にはニュースレター登録と資料ライブラリのパスワードが必要だ。","2026-11-21","Jennifer Maker","https://jennifermaker.com/how-to-address-envelopes-with-a-cricut/"],["暖炉が飛び出すクリスマスのポップアップカード無料SVG","Gilded Storkが、カードを開くと暖炉と薪、炎が立ち上がるクリスマスのポップアップカードの無料SVGとクリカットでの作り方を公開した。白・茶・赤・緑・銀のグリッター・金の箔カードストックを使い、Design Spaceで暖炉と薪の縦線をカットからスコアに変えるのが重要な設定。組み立て後は額縁風の鏡やリース、緑の飾り、2つの靴下、リボンで装飾する。外側にはリースのペン描きデザインを合わせる提案もある。","\n【概要】Gilded Storkは2026年11月21日、「DIY Christmas Fireplace Pop-Up Card – Free SVG for Cricut」を公開した。カードを開くと暖炉と薪、炎が立体的に起き上がるポップアップ式のクリスマスカードで、無料SVGとクリカットでの作り方を紹介している。\n\n【背景】ポップアップカードは折り線と切り込みの位置が正確でないとうまく立ち上がらないため、カッティングマシンと相性がよい作品だ。同ブログはクリスマスに向けて、カードや箱など紙ものの無料データを続けて公開している。\n\n【詳細】材料は、白・茶・赤・緑・銀のグリッター・金の箔の各カードストック、強力な両面テープ、スティックのり、StandardGripマット、スコアリングスタイラスまたはスコアリングホイール。最も重要な設定として、Design Spaceで暖炉と薪の縦の線を「カット」から「スコア」に変更してから切り出すよう説明している。組み立ては、まずマントル（暖炉の棚）のスコア線を折り、炎のパーツを外側のカードの裏側に取り付ける。次に薪を両面テープで貼り、組み上げたパーツの上にマントルをのりで貼り付ける。最後に、額縁風の鏡とリース、緑の飾り、2つの靴下、リボンで暖炉を装飾すると完成だ。封筒は筆者のショップで扱うものを、カードの外側には同ブログのリースのペン描きデザインを合わせる案も紹介されている。\n\n【ポイント・注意点】縦線をスコアに変え忘れると、ポップアップ部分が切り離されて立ち上がらなくなるので注意が必要だ。記事には完成サイズやライセンスの詳しい記載はない。多色のカードストックを使うため、色ごとにマットを分けて切ることになる。グリッターや箔のカードストックは表面が硬く、のりがつきにくい場合があるので、強力な両面テープの使用が勧められている点も押さえておきたい。組み立ての順番を守れば、開いたときに暖炉がきれいに立ち上がる。SVGは同ブログの「Design Files Library」から入手できる。","2026-11-21","Gilded Stork","https://gildedstork.com/diy-christmas-fireplace-pop-up-card-free-svg-for-cricut/"],["「Santa Disagrees」の無料SVG、ユーモアのある冬の文字入れ","Crafty Crafterが、「Santa Disagrees（サンタは反対）」という文字を入れたユーモアのあるサンタのデザインを無料SVGとして公開した。セーター、マグ、トートバッグ、金属製オーナメント、ドアや窓のデカール、ワインボトルのラベルなどへの活用を提案。黒Tシャツには白のHTV、陶器のマグには光沢のある永久ビニールを勧め、ミニヒートプレスも挙げる。HTVでは反転が必要で、Silhouette Studioでも使える。個人利用向けの配布だ。","\n【概要】Crafty Crafterは2026年11月21日、「Santa Disagrees SVG for Cricut – Free Christmas Cut File」を公開した。サンタクロースのイラストに「Santa Disagrees（サンタは反対しています）」という文字を組み合わせた、ひねりのあるクリスマスデザインだ。\n\n【背景】「いい子にしていた？」というサンタの定番ネタを逆手に取ったようなユーモアデザインは、大人向けのホリデーグッズで人気がある。同サイトは11月に入り、こうしたクリスマス関連の無料カットファイルを連日公開している。ダウンロードはGoogle Driveのリンクから行う。\n\n【詳細】記事が提案する用途は、セーター、マグ、トートバッグ、金属製のオーナメント、ドアや窓のデカール、ワインボトルのラベルなど。素材は、黒いTシャツに白いHTV（熱転写ビニール）を貼る組み合わせ、陶器のマグには光沢のある永久ビニールを勧めている。布ものの圧着にはミニヒートプレスの使用を挙げている。作り方の説明では、HTVでカットする場合はデザインを反転（ミラー）させるよう指示しており、Cricutだけでなく、Silhouette Studioでもファイルを使えるとしている。記事内で筆者は、このファイルは個人利用のためのものだと明記している。\n\n【ポイント・注意点】サイトのFAQでは、無料SVGは個人利用に限られる一方、作った実物を贈ったり販売したりすることは認めており、デジタルファイルの再販・再配布は禁止としている。ページには完成サイズやカット設定の記載がないため、貼る物に合わせて拡大縮小し、素材ごとの推奨条件で切ること。ワインボトルや窓など曲面やガラスに貼る場合は、表面の汚れを落としてから貼るときれいに仕上がる。ファイルに問題がある場合は、サイトが案内する「SVG Doctor」で確認できる。友人へのちょっとしたギフトや、ホームパーティーの小物作りに向くデザインだ。白黒のシンプルな配色なら、1色カットで手早く仕上げられる。","2026-11-21","Crafty Crafter","https://crafty-crafter.club/christmas/santa-disagrees-svg-for-cricut/"],["家並みが広がるアコーディオン式カード、無料SVGで","Gilded Storkが、タウンハウスが並ぶクリスマスの街並みをアコーディオン折りにしたカードの無料SVGとクリカットでの作り方を公開した。金の箔紙を含む4色のカードストックを使い、背景は12×12インチの紙2枚を中央の建物でつなぐ構成。背景、窓の裏の金箔、前面の建物、装飾の4層で組み立てる。折りたたむと一般的なレターサイズの封筒に収まる。縦線をスコアに変えて背景に「Attach」するのが設定の要点だ。","\n【概要】Gilded Storkは2026年11月20日、「Free Christmas Village Card SVG – Cricut Accordion Card Tutorial」を公開した。タウンハウスが横一列に並ぶクリスマスの街並みを、アコーディオン（蛇腹）状に折りたたむカードで、無料SVGと作り方を紹介している。\n\n【背景】アコーディオンカードは広げると横長の情景になり、立てて飾ることもできるため、クリスマスの飾りを兼ねたカードとして人気がある。同ブログはクリスマスに向けてカードや箱の無料データを連日公開しており、本作はその一つだ。\n\n【詳細】使うのは金の箔を含む4色のカードストックで、背景は12×12インチの紙2枚を中央の建物部分でつなぎ合わせる構成になっている。カードは背景、窓の裏に貼る金の箔、前面の建物、装飾の4層で構成される。Design Spaceでは縦の線をスコア線に変更し、背景パーツに「Attach」してから切り出す。材料としてはテープのりまたはスティックのり、細かいグリッター、グリッターグルー、Cricutが挙げられている。組み立ては、まず木のパーツを金の箔に貼り、各建物を金の箔と木を前面の層で挟むようにして組む。続いてつなぎの建物を組み立て、最後にアコーディオン状に折る。仕上げにリースやリボン、グリッターを加える。折りたたむと一般的なレターサイズの封筒に入る大きさになる。\n\n【ポイント・注意点】グリッターグルーやのりは、乾いてから折りたたむよう注意が促されている。乾く前に折ると、パーツ同士がくっついたり、グリッターがはがれたりするおそれがある。12×12インチの紙を2枚使うため、マットも大判の12×12インチが必要になる。SVGは「Design Files Library」で入手でき、ニュースレター登録で届くパスワードが必要。ライセンス条件の詳しい記載はない。同ブログの暖炉のポップアップカードなどと組み合わせれば、統一感のあるクリスマスの紙ものがそろう。","2026-11-20","Gilded Stork","https://gildedstork.com/free-christmas-village-card-svg-cricut/"],["LED回路で光るクリスマスカード、クリカットで作る方法","Jennifer Makerが、LEDの回路を組み込んで光らせる手作りカードの作り方と無料データ（デザイン#850）を公開した。雪の結晶と冬のクマ、星付きのクリスマスツリーの2種類で、折ると5×7インチになる。Chibitronicsのシール型LEDと導電性の布テープで回路を作り、Design Spaceでは回路の目安線をペンで描かせる。テープのプラスとマイナスを接触させないことなど、回路作りの注意点も詳しい。","\n【概要】Jennifer Makerは2026年11月20日、「How to Make a DIY Light-Up Card With an LED Circuit」を公開した（ページには最終更新日として11月20日と22日が表示）。LEDの電子回路を紙に組み込み、カードの一部を光らせる作品で、無料データ（デザイン#850）とともに作り方を解説している。\n\n【背景】カッティングマシンで切る紙のカードに、シール型のLEDや導電性テープを組み合わせると、光るカードを手作りできる。クリスマスシーズンに一味違う贈り物を作りたい人向けの内容だ。\n\n【詳細】デザインは、雪の結晶と冬のクマ、星を頂いたクリスマスツリーの2種類で、それぞれスコア線ありとなしの版をSVG・DXF・PDFで用意。カードは折ると5×7インチで、台紙は7×10インチ、表面は7×5インチ。材料は8.5×11または12×12インチの65ポンドのカードストック5〜7枚、Chibitronicsの「Launchpad」LEDライト3〜7個とバッテリー（またはLEDs Intro Kit）、幅4mmのChibitronics導電性布テープ、Bearly Artのり、1/8インチのフォーム両面テープ、3/16インチのZotsグルードット。素材設定はMedium Cardstock（80ポンド）とHeavy Cardstock（100ポンド）、Glitter Cardstockをいずれも圧力「More」で、Premium Fine-Point Bladeと緑のStandardGripマットを使う。Design Spaceでは回路の目安線と文字をFine Point 0.4mmペンで描くよう設定する。組み立ては、スコア線を折り、バッテリーとLEDをグルードットで固定し、目安線に沿って導電テープを貼り、スイッチをフォームで取り付け、表面をフォームで縁取りして貼る。\n\n【ポイント・注意点】テープのプラス側とマイナス側の経路を接触させないこと、ライトやバッテリーの接続部には導電テープをもう一層重ねること、屋内では導電性塗料を避けることが勧められている。最終的に貼り合わせる前に必ず点灯を確認するのが大切だ。フォントはクマにThat Girl（無料の代替はJM Penwriting）、ツリーにJM Tallを使っている。","2026-11-20","Jennifer Maker","https://jennifermaker.com/light-up-card/"],["クリカットやレーザー機も並ぶ2026年版ホリデーギフトガイド","クラフト系ブログSustain My Craft Habitが、2026年のホリデーギフトガイドを公開した。25ドル以下、26〜50ドル、50〜100ドル、100ドル超の価格帯別に、Cricut Maker 4のバンドルやCricut Joy Xtra、xTool X1レーザー、HTVRONT A100ヒートプレス、ラベルプリンターなどを紹介。xTool製品は記事中のコードで50ドル引きになるとしている。クラフト道具を贈り物に検討する人の参考になる。","\n【概要】クラフト系ブログのSustain My Craft Habitは2026年11月20日、「2026 Holiday Gift Guide: Creative Christmas Gift Ideas for Everyone on Your List!」を公開した。クラフト好きな人への贈り物を中心に、カッティングマシンやレーザー加工機、ヒートプレスなどを価格帯別にまとめたギフトガイドだ。\n\n【背景】年末のギフトシーズンには、カッティングマシンや周辺機器を贈り物として検討する人も多い。同ブログはクリカットやレーザー加工機を使った作品づくりを多く発信しており、その経験をもとに道具を選んでいる。\n\n【詳細】ガイドは25ドル以下、26〜50ドル、50〜100ドル、100ドル超の4つの価格帯に分けて構成されている。紹介されているのは、筆者らの「Creative Habit Craft Boxes」、xTool X1レーザー、HTVRONT A100ヒートプレス、Munbynのサーマルラベルプリンター、Cricut Maker 4のバンドル、Cricut Joy Xtra、Nelkoのラベルプリンター、レーザーで切り出した名入れオーナメント、筆者らによる全28レッスンのオンライン講座「Sewing with Success」など。xTool製品については、記事に掲載されたコード「XTOOLGIFT50」を使うと、xToolのマシンが50ドル引きになると案内している。カッティングマシンでは、大きな作品や多様な素材に向くMaker 4のバンドルと、コンパクトなJoy Xtraの両方が挙がっており、贈る相手の作りたい物に合わせて選べる構成だ。\n\n【ポイント・注意点】記事にはアフィリエイトリンクが含まれることが明記されている。作り方を解説する記事ではないため、材料や手順の情報はない。掲載された割引コードの有効期限や対象条件は変わる可能性があるため、購入前に販売元のページで確認したい。カッティングマシンを贈る場合は、マットや刃、ビニールなどの消耗品も一緒に用意すると、受け取った人がすぐに作品づくりを始められる。","2026-11-20","Sustain My Craft Habit","https://sustainmycrafthabit.com/holiday-gift-guide/"],["「Comfy Cozy」のパフビニールでふっくら文字のパーカー","The Crafty Blog Stalkerが、無料SVG「Comfy Cozy」と白いパフ（発泡）熱転写ビニールで、文字がふっくら盛り上がるパーカーを作る方法を公開した。デザインは幅11.5×高さ7.86インチに調整し、290°Fで10秒、中程度の圧力でプレス。キャリアは熱いうちにはがし、さらに5秒プレスする。所要時間45分、費用の目安は30ドルで、初心者向けとされている。パフビニールを何度もプレスしないことなど注意点も示す。","\n【概要】The Crafty Blog Stalkerは2026年11月20日、「Comfy Cozy Sweatshirt with Puff Vinyl and Free SVG」を公開した。太い文字と星を組み合わせた無料SVG「Comfy Cozy」を、加熱すると膨らむパフ熱転写ビニールでパーカーに貼り、立体感のある仕上がりにする作り方だ。難易度は初心者向け、所要時間は45分、費用の目安は30ドルとされている。\n\n【背景】パフビニールは圧着時の熱で表面がふくらみ、プリントのような立体感が出る素材として人気がある。寒い季節に向けた「くつろぎ」系の文字デザインは、冬物の手作りに合う。\n\n【詳細】筆者はデザインを、大きめのパーカーに合わせて幅11.5×高さ7.86インチに調整した（最初は12インチ版も試した）。材料はベージュのパーカー、Make Marketの白いパフ熱転写ビニール、StandardGripマット、定規、カス取りツール、ヒートプレス（HTVRONT Auto Heat Press 2）。手順は、ビニールを約8.5インチ分切り、アイロン接着用の反転（Mirror）をオンにし、素材が合えば「Puff Iron-On」を選んでカット、文字の内側まで丁寧にカス取りする。プレスでは、まず生地を5秒予熱し、デザインをパーカーの上端から約3〜3.5インチ下の中央にキャリアを上にして置き、クッキングシートをかぶせて290°Fで10秒、中程度の圧力でプレスする（筆者のプレスでは約130）。キャリアは熱いうちにはがし、さらに5秒プレスし、必要に応じて裏側からも5秒プレスする。\n\n【ポイント・注意点】ビニールのメーカーの指示に従うこと、縫い目やフードがプレスに挟まらないようにすること、デザインを反転させること、パフビニールを何度もプレスしないことが注意点として挙げられている。筆者の作品では、フードが邪魔になって1文字にしわが寄ったという。記事にはほかの作者による冬向けの無料SVG9点も紹介されている。","2026-11-20","The Crafty Blog Stalker","https://thecraftyblogstalker.com/comfy-cozy-sweatshirt-cricut/"],["感謝祭の食卓小物、席札やランチョンマットをクリカットで","Cricut公式ブログが、感謝祭のテーブルを整えるための席札、ランチョンマット、テーブルランナーなどの作り方をまとめた。テーブルセッティングの6段階の順序を示したうえで、Design Spaceで名前をペン描きにした席札、子どもが塗り絵できる紙のマット、アイロン接着やステンシルで作るランナー、葉のナプキンリングやグラスタグを紹介。素材ごとの使い分けや、食器の縁にビニールを貼らないといった注意点も示す。","\n【概要】Cricut公式ブログは2026年11月19日、「Thanksgiving Table Decor: Place Cards, Placemats, and Runners to Make with Cricut」を公開した。筆者はBeth Baty氏。感謝祭の食卓を、席札やランチョンマット、テーブルランナーなどの手作り小物で整える方法を、Cricutのプロジェクト例とともに紹介している。\n\n【背景】感謝祭は大人数で食卓を囲む行事で、席札やおそろいの小物があるとテーブル全体に統一感が出る。記事はテーブルセッティングの順序として、ランナーまたはテーブルクロス、ランチョンマットと皿、カトラリーとナプキン、グラスとグラスタグ、席札、センターピースの6段階を示している。\n\n【詳細】席札は、Design Spaceでカードの形と名前を作り、名前を「Draw（ペン描き）」に設定してカードに「Attach」する。折りたたみ式にする場合はスコア線を加える。「Pumpkin Place Cards」「Personalized Turkey Place Cards」などのプロジェクトが紹介されている。ランチョンマットは、布製ならアイロン接着のデザインを縁寄りに配置し、紙製ならCricutのペンで子ども向けの塗り絵マットにできる。FAQでは大人用の布マットの目安を12×18インチの長方形としている。ランナーは「Give Thanks」の文字などをアイロン接着で入れ、カット前に反転（Mirror）をオンにし、Cricut Heat Guideの設定に従う。カットしたステンシルと布用塗料で描く方法もある。ナプキンリングやグラスタグは余ったカードストックで作れる。\n\n【ポイント・注意点】素材の使い分けとして、折りたたむ席札や紙のナプキンリングにはカードストック、布にはアイロン接着、グラスには永久ビニールと転写シートを使う。グラスに貼るビニールは縁より下の、飲食物が触れない位置にすること。木製ブランクにはビニールかアイロン接着を使い、薄い木材のカットや彫刻にはCricut Makerが必要だ。ステンシルで描く場合は端切れで試すよう勧めている。記事に価格の記載はない。","2026-11-19","Cricut Blog","https://cricut.com/blog/thanksgiving-crafts-with-cricut/"],["クリカットのペンで描くリースの無料SVG、カードや封筒に","Gilded Storkが、クリカットのペン機能で描くクリスマスリースの無料SVGを公開した。3つのファイルを別々のレイヤーとして読み込み、操作を「Pen」にして色ごとに異なるペンを割り当てると、重ねる紙を増やさずにカードや封筒に細かな装飾を加えられる。筆者はダラーストアで買った安価なゲルペンのグリップをずらし、ペンホルダーに装着して使用。封筒の内側に貼るライナーへの活用も提案している。","\n【概要】Gilded Storkは2026年11月19日、「Free Christmas Wreath SVG for Cricut Pens」を公開した。カッティングマシンで切るのではなく、Cricutのペン機能で描くことを前提にしたクリスマスリースのデザインで、無料SVGとして配布している。\n\n【背景】カードや封筒の装飾は、色紙を重ねて貼る方法だと手間も厚みも増える。ペン描き用のデザインなら、紙の枚数を増やさずに細かな模様を加えられる。同ブログはクリスマスに向けて紙ものの無料データを連日公開しており、暖炉のポップアップカードの外側にこのリースを合わせる提案もしている。\n\n【詳細】デザインは3つのファイルで構成されている。それぞれをDesign Spaceにアップロードしてレイヤーとし、操作を「Pen」に設定したうえで、レイヤーごとに異なる色のペンを割り当てる。こうすることで、葉や実、リボンなどを色分けして描ける。筆者はダラーストア（日本の100円ショップに相当）で買った安価なゲルペンを使い、ゴムのグリップ部分を上にずらしてCricutのペンホルダーに収まるようにしたという。活用例として、クリスマスカードや封筒のほか、封筒の内側に貼るライナーへの描画が挙げられている。記事に掲載された封筒は、筆者がEtsyで販売する「Cards and Envelopes SVG Bundle」に含まれる「Lily」というデザインだ。\n\n【ポイント・注意点】記事にはペンの太さの指定やライセンス条件の記載はない。市販のゲルペンを使う場合、ペン先の高さがずれるとかすれたり紙を傷つけたりすることがあるため、本番の前に裏紙で試し描きをすると安心だ。SVGはGilded Storkの「Design Files Library」から入手でき、利用にはニュースレター登録で届くパスワードが必要。紙を重ねる工程がないぶん手軽で、クリスマスカードをまとめて作りたい人に向くデザインだ。色の組み合わせを変えれば、同じデータでも印象の違うカードが作れる。","2026-11-19","Gilded Stork","https://gildedstork.com/free-christmas-wreath-svg-for-cricut-pens/"],["「Wish You Nothing But」の無料SVG、上品なカードや小物に","Crafty Crafterが、「Wish You Nothing But」という言葉をあしらったミニマルなデザインの無料SVGを公開した。伝統的な英国風のクリスマスカードやインテリアに合うとし、クリーム色のカードストックに金の永久ビニールを貼ったギフトタグ、リネンのクッションへのHTV、深い赤と白で仕上げる黒Tシャツ、アクリルのオーナメント、紙アートなどを提案。Design Spaceでは「Cut Image」で読み込み、縦横比を固定して使う。","\n【概要】Crafty Crafterは2026年11月19日、「Wish You Nothing But SVG for Cricut – Free Christmas Cut」を公開した。「Wish You Nothing But」というフレーズを使ったミニマルなデザインで、クリカットなどのカッティングマシン向けに無料配布されている。\n\n【背景】同サイトはユーモア系からレトロ系までクリスマス関連の無料カットファイルを連日公開している。本作はその中でも落ち着いた雰囲気のデザインで、記事では伝統的な英国風のクリスマスカードやホームデコに向くと説明している。ダウンロードはGoogle Driveのリンクから行う。\n\n【詳細】提案されている作例は、クリーム色のカードストックに金の永久ビニールを貼ったギフトタグ、リネンのクッションへのHTV（熱転写ビニール）、マグ、深い赤と白で文字を入れる黒いTシャツ、アクリルのオーナメントにメタリックビニールを貼る案、シャドーボックスに入れるカードストックのアートなど。作り方では、Design Spaceにアップロードする際に「Cut Image」を選び、サイズ変更時には縦横比を固定しておくよう説明している。CricutだけでなくSilhouette Studioでも利用でき、ファイルは個人利用向けとされている。\n\n【ポイント・注意点】サイトのFAQによると、無料SVGは個人利用に限られるが、作った実物を贈ったり販売したりすることは認められており、デジタルファイル自体の再販や再配布は禁止されている。ページに完成サイズや具体的なカット設定の記載はないため、素材ごとに推奨される設定で切り、必要に応じて試し切りをするとよい。縦横比を固定せずに拡大縮小すると文字が間延びしてしまうため、記事の指示どおりロックしておくのがきれいに仕上げるコツだ。金や銀のメタリック素材と組み合わせると、シンプルな文字でも上品な印象になる。ギフトタグやカードなら少量の端材でも作れるため、余ったビニールやカードストックの活用にも向いている。","2026-11-19","Crafty Crafter","https://crafty-crafter.club/christmas/wish-you-nothing-but-svg-for-cricut/"],["フェルトのカボチャ型ナプキンリング、感謝祭の食卓に","Sustain My Craft Habitが、感謝祭の食卓に使えるフェルト製のカボチャ型ナプキンリングの作り方を公開した。クリカットで切る場合は12×12インチの転写シートをマットに貼ってフェルトを押し付け、ロータリーブレードを使う。筆者らはxTool P2レーザーでSVGを使って切ったという。手で切るための型紙PDFも用意。フェルトを重ねて外周だけを接着し、約3インチのゴムを裏に付けてリングにする。6〜8個のセットを贈り物にする提案もある。","\n【概要】クラフト系ブログのSustain My Craft Habitは2026年11月19日、「DIY Thanksgiving Felt Napkin Rings: Easy Pumpkin Table Decor」を公開した。フェルトを重ねてカボチャの形にしたナプキンリングの作り方で、カッティングマシン、レーザー加工機、手作業のいずれでも作れるよう解説している。\n\n【背景】感謝祭のテーブルでは、ナプキンリングのような小物が季節感を添える。フェルトは柔らかく扱いやすい素材だが、手で同じ形を何枚も切るのは手間がかかるため、マシンでのカットが役立つ。\n\n【詳細】材料は「Pumpkin Napkin Ring Printable Pattern」（筆者らのショップで販売するPDF）、好きな色のフェルト、幅1/4インチのゴム、ホットグルー、布用はさみ。クリカットで切る場合は、12×12インチの転写シートをマットにテープで留め、その上にフェルトを押し付けて固定し、Design Spaceでロータリーブレードを装着して素材に「felt, acrylic」を選ぶ手順が示されている。筆者ら自身はSVGファイルを使い、xTool P2レーザーで切ったという。手で切る場合は、印刷した型紙の実線に沿って切る。組み立ては、土台の形の上にフェルトのパーツを重ね、外周だけにのりを付けて貼る。裏側に約3インチのゴムを貼ってリング状にすれば完成。フリル状にしたフェルトの帯を加えるアレンジもある。\n\n【ポイント・注意点】色はオレンジ、クリーム、セージ、マスタード、テラコッタなどが提案されている。のりは外周だけに付けるという手順を守り、パーツ全面に塗らないようにしたい。ホットグルーを使うため、やけどにも気を付けたい。6個または8個をセットにしてリボンで束ね、贈り物にするアイデアも紹介されている。記事にSVGのライセンス条件は書かれておらず、SVGファイルはリソースライブラリで案内されている。型紙PDFは有料である点にも注意したい。","2026-11-19","Sustain My Craft Habit","https://sustainmycrafthabit.com/diy-thanksgiving-felt-napkin-rings/"],["自宅でビニールTシャツを作るのに必要な道具（Silhouette）","Silhouette Americaの公式ブログが、自宅でビニールを使ったTシャツを作るのに必要な道具をまとめた。対応するカッティングマシン、熱転写ビニール（HTV）、合った刃、必要に応じたマット、カス取りツール、ヒートプレスかメーカーが認めるアイロン、Silhouette Studio、無地のシャツなどを解説。衣類には粘着ビニールではなくHTVを使うことを強調し、初心者向けと上級者向けの道具構成や、よくある失敗も紹介している。","\n【概要】カッティングマシン「Silhouette」シリーズを手がけるSilhouette Americaは2026年11月18日、公式ブログで「What Tools Do You Need to Make Vinyl Shirts at Home?」を公開した。自宅でビニールを使ったオリジナルTシャツを作るために、どんな道具をそろえればよいかを解説している。\n\n【背景】Tシャツづくりはカッティングマシンの代表的な用途の一つだが、ビニールの種類や圧着の道具など選択肢が多く、初心者が迷いやすい。記事は特定の機種を「最良」とはせず、機種によってカット幅や対応ツール、素材の対応範囲が異なると説明している。\n\n【詳細】必要な道具として、対応するSilhouetteのカッティングマシン、熱転写ビニール（HTV）、素材に合った刃、構成によって必要なカッティングマット、カス取りツール、ヒートプレスまたはメーカーが認める家庭用アイロン、Silhouette Studio、無地のシャツ、圧着用の付属品を挙げる。衣類には粘着ビニールではなくHTVを使うことを強調。HTVにはスムース、グリッター、フロック、メタリック、ストレッチなどの種類があり、それぞれ刃の深さや圧着温度が異なる場合がある。機種とHTVの組み合わせによっては、裏紙を利用してマットなしで切れる。フック型のカス取りツールは「e」や「a」などの小さな文字に便利だという。Silhouette Studio Basicは無料で、通常のHTVでは反転が必要。手順の概要として、デザインから反転、試し切り、カットとカス取り、メーカーの指示に従った圧着、指定の段階でのキャリアはがしまでの7段階を示している。\n\n【ポイント・注意点】アイロンが使えるかはHTVメーカーの承認次第で、ヒートプレスの方が熱と圧力が安定する。よくある失敗として、粘着ビニールを買ってしまうこと、合わない刃を選ぶこと、どのHTVもアイロンで使えると思い込むこと、試し切りを省くことを挙げる。初心者はマシン、合った刃、標準的なスムースHTV1本から始めるとよいという。温度や時間の具体的な数値は示さず、メーカーの指示に従うよう求めている。","2026-11-18","Silhouette America Blog","https://www.silhouetteamerica.com/blog/post/tools-needed-to-make-vinyl-shirts-at-home"],["ビニールでオリジナルTシャツを作る手順（Silhouette）","Silhouette Americaの公式ブログが、熱転写ビニール（HTV）で自宅でオリジナルTシャツを作る手順を9段階で解説した。Silhouette Studioでのデザインから、サイズ調整と反転、刃とマットの準備、試し切り、カス取り、シャツの準備、圧着、キャリアのはがし方、多色デザインの重ね方まで説明。生地や色の組み合わせによるHTVの選び方や洗濯時の注意も示し、温度や時間は一般的な数値ではなくHTVの説明書に従うよう求めている。","\n【概要】Silhouette Americaは2026年11月18日、公式ブログで「How to Make Custom Vinyl T-shirts at Home Step by Step」を公開した。Silhouette Studioでデザインし、Silhouetteのマシンで熱転写ビニール（HTV）を切り、カス取りしてヒートプレスかメーカーが認めるアイロンで圧着するという流れを、段階ごとに解説している。\n\n【背景】HTVは熱で接着するのりが付いたビニールで、通常は透明なキャリアシートが付いており、正しい温度・圧力・時間で圧着しないと定着しない。記事は最初の作品には単色のシンプルなデザインを勧めている。\n\n【詳細】材料は、マシン、素材に合った刃、必要に応じたマット、HTV、Silhouette Studio、清潔なシャツ、カス取りツール、ヒートプレスかアイロン、保護シートやクッキングシート、耐熱性のかたい台。HTV選びでは、綿・ポリエステル・混紡で反応が違うこと、濃い生地には明るいHTVが映えやすいこと、薄手や化繊の生地は低温が必要な場合があることを挙げる。手順は、1.Silhouette Studioでデザイン（例としてDesign StoreのDesign ID D-1292795「Born to Shine」）、2.サイズ調整と反転、3.刃・マット・素材の準備、4.試し切り（通常のHTVはキスカット）、5.カス取り、6.シャツの準備（必要に応じて数秒の予熱、キャリアを上にして縫い目やボタンを避けて配置）、7.HTVの説明書の温度・圧力・時間で圧着、8.指示どおりホット・ウォーム・コールドのいずれかでキャリアをはがす、9.多色デザインは色ごとに切り、位置を合わせて1色ずつ圧着し、先に貼った層をカバーシートで保護する。\n\n【ポイント・注意点】記事は一般的な数値に頼らず、HTV自体の説明書に従うよう警告している。とても小さい文字や複雑な文字はカス取りが難しい。洗濯は初回まで推奨期間を空け、裏返して高温や強い洗剤を避ける。メーカーが安全とする場合を除き、デザインの上に直接アイロンをかけないことも注意点だ。","2026-11-18","Silhouette America Blog","https://www.silhouetteamerica.com/blog/post/how-to-make-custom-vinyl-t-shirts-at-home"],["年末商戦向け、小規模ショップの包装アイデア（Silhouette）","Silhouette Americaの公式ブログが、ハンドメイド販売などの小規模ビジネス向けに、ホリデーシーズンの包装アイデアをまとめた。マーケットのブースの看板と色やフォント、季節のモチーフをそろえ、タグ、ステッカー、お礼カード、ラベルに統一感を持たせる方法を提案。カードストックやステッカー用紙、粘着ビニール、Print & Cutの使い分けや、まとめて量産する際の試し切りの重要性、よくある失敗も解説している。","\n【概要】Silhouette Americaは2026年11月18日、公式ブログで「Small Business Packaging Ideas for the Holidays」を公開した。ハンドメイド作品などを販売する小規模ビジネス向けに、カッティングマシンを使ってホリデーシーズンの包装をそろえるアイデアを紹介している。\n\n【背景】年末はクリスマスマーケットやオンライン販売で贈答用の注文が増える時期で、包装の見た目がお店の印象を左右する。記事は、ブースの看板と同じ色やフォント、季節のモチーフをタグやステッカー、お礼カード、ラベルにも繰り返す「包装のシステム」を作ることを勧めている。\n\n【詳細】見た目の基本は、メインカラー1色とアクセントカラー1色、季節のモチーフ1つ、店名用の目立つフォント1種と商品情報用の読みやすいフォント1種。タグは長方形、スカラップの円、アーチ、ミニバナーなどの形から選び、中厚のカードストックで切るか、Print & Cutでロゴや取り扱い説明、QRコードを入れる。麻ひもやリボン、ゴム、小さな安全ピンで付け、商品の種類ごとにまとめて作る。ステッカーは、屋内の包装や短期間の使用には印刷用ステッカー用紙、柔軟性や耐久性が必要なら印刷用ビニール、瓶やボトルなどかたい容器でシンプルなデザインなら粘着ビニールが向く。同封物としては、お礼カード、手入れ方法のカード、再注文用のQRコードカード、ギフトメッセージを挙げる。\n\n【ポイント・注意点】Print & Cutでは、トンボ（位置合わせマーク）の周囲を空け、マークをくっきり印刷し、マシンの調整を疑う前に照明や反射を確認するよう助言している。量産時は、Sendパネルで素材設定を選び、マットの有無や素材の向き、ツールがファイルと合っているか確認し、ステッカー用紙やカードストックの厚さ、ビニールの仕上げ、刃を変えたら試し切りをする。厚いカードストックが切れない場合は、刃の深さを大きく変える前に力を上げるか、もう1回通すとよい。よくある失敗として、フォントの使いすぎ、パーツごとに色を変えること、ラベルに情報を詰め込みすぎること、試し切りなしでシート全体を切ることを挙げている。","2026-11-18","Silhouette America Blog","https://www.silhouetteamerica.com/blog/post/small-business-packaging-ideas-for-the-holidays"]],"uv":[["英Eye on Display、UVフラットベッド選びの購入ガイドを公開","英国のサイン・ディスプレイ業界メディアEye on Displayは2026年11月24日、UVフラットベッドプリンターの選び方をまとめた購入ガイドを公開した。LEDランプによる硬化の仕組み、A3卓上機から約3.2×2mの生産機までのベッドサイズ、点字やテクスチャ表現、ロングドロップ印刷などを整理し、サプライヤーに確認すべき15の質問を提示。ミマキ、エプソン、ムトーなど各社の対応機種の仕様も紹介している。","\n【概要】英国のサイン・ディスプレイ専門メディアEye on Displayが、2026年11月24日付で「How to choose a UV flatbed printer」と題した購入ガイドを公開した。UVフラットベッドの基本から機種選定の勘所、主要メーカーの対応機種までを一つの記事にまとめた内容で、導入を検討する印刷会社やサインショップ向けの実務的な資料となっている。\n【背景】UVフラットベッドはLEDランプでインクを硬化させる方式で、フォーレックス、アクリル、木材、ガラス、金属といった硬質素材に直接印刷できる。ガイドによると、生産機では厚さ約50mmまでの素材に対応する。ベッドサイズはA3の卓上機から約90×60cmのコンパクト機、約2.5×1.3mの中型機、約3.2×2mの生産機まで幅広く、用途と設置スペースに応じた選択が求められる。\n【詳細】ガイドは点字のドット高を0.5mm（AAF基準）とし、テクスチャ表現は5mm、ロングドロップ印刷は約20mmに達すると説明している。サプライヤーに確認すべき15の質問も挙げた。紹介機種は、Dlican DLI-3325 Pro（3.3×2.5mベッド、Ricoh Gen 6ヘッド2〜36基、1,800dpi）、SinoColor FB-0906（900×600mm、最大2,400dpi）、ミマキJFX220-2515（2,500×1,500mm、CMYKで42m²/h）、ミマキUJF200-3042／6042（最大250mmの立体物）、ムトーXpertJet 1462UF、エプソンSureColor V7000（10色UltraChrome UV）、InkTec JETRIX LXa7-R（最大146m²/h）など多岐にわたる。\n【ポイント・注意点】ベッドサイズ、対応厚、速度、点字やテクスチャなどの表現力を軸に比較できる構成で、機種選定の初期段階で全体像をつかむのに役立つ。一方、掲載機種は同誌のパートナー企業の製品が中心で、価格情報は示されていない。実際の導入時は記事の質問リストを活用し、各販売店に見積もりや保守条件を個別に確認することが重要だ。","2026-11-24","Eye on Display","https://www.eyeondisplay.com/how-to-choose-a-uv-flatbed-printer/"],["NUtec、ミマキUV機向けの互換ハイブリッドインクを発売","南アフリカのNUtec Digital Inkは、ミマキのLUS・ELSインクセットを使う一部プリンター向けに、UV硬化型ハイブリッドインク「Ruby R15-ELS-MI」を発売した。LED-UV硬化に最適化し、UJV、UCJV、JFX、UJFの各シリーズの一部に対応する。CMYKにライトシアン、ライトマゼンタ、白、クリアニスをそろえ、1リットルボトルで供給。運用コストの低減を狙う代替インクで、切り替え前には互換性の確認を求めている。","\n【概要】南アフリカ・ケープタウンに拠点を置くNUtec Digital Inkは、ミマキ製プリンターの一部機種で使えるUV硬化型ハイブリッドインク「Ruby R15-ELS-MI」の発売を発表した。ミマキのLUS・ELSインクセットを使う機種を対象とした、コスト重視の代替インクという位置づけだ。TEXINTELが2026年11月24日に報じた。\n【背景】UVプリンターの運用では、インク代がランニングコストの大きな部分を占める。複数の機種を併用する印刷会社では、インクの調達や在庫管理の手間も課題になる。NUtecは、1種類のインクを複数の印刷プラットフォームで共用できるようにすることで、調達と在庫管理を簡素化できる点を打ち出している。\n【詳細】Ruby R15-ELS-MIはLED-UV硬化に最適化されており、ミマキのロールtoロール機、ハイブリッド機、フラットベッド機のうち、UJV、UCJV、JFX、UJFの各シリーズの一部に対応する。色はCMYK、ライトシアン、ライトマゼンタ、ホワイト、クリアニスで、透明・着色素材への印刷や装飾仕上げにも使える。対応メディアはCorrex、PVC板、アルミ、アクリル、板紙、粘着ビニール、PVCバナー、メッシュなど。密着が難しい素材向けに、ジェット可能な専用プライマーも用意する。SVHCやCMRを含まない処方で、1リットルボトルで供給され、一部の構成向けにはすぐ使えるICCプロファイルもある。NUtecのIDS保証プログラムの対象となる。同社のDarren Claassens氏は、既存のミマキ機を最大限に活用しながらコストを抑えられる点を強調した。\n【ポイント・注意点】設備を入れ替えずにインクコストを見直せる選択肢として注目される。ただしNUtecは、切り替える前にプリンター、チップ、インクの互換性を販売店に確認するよう求めている。対応は「一部の機種」に限られるため、自社の機種と構成が対象かどうかを事前に確かめ、テスト印刷で仕上がりを確認したうえで導入を判断したい。","2026-11-24","TEXINTEL","https://texintel.com/press-room/nutec-11-26-p-nutec-nutec-digital-ink-launches-multi-platform-hybrid-ink-for-mimaki-uv-printers"],["京都ステッカー、アプリで作るUVDTFステッカーの入稿条件を解説","京都ステッカーは2026年11月24日、スマホやPCのアプリでUVDTFステッカーのデザインを作り、入稿する際のコツをまとめた記事を公開した。対応形式はPNGとJPG、推奨解像度は300DPI以上。CMYK＋白インクで印刷するため、金・銀やメタリックは色味での表現になるなど、仕上がりに関わる仕様と、見積もりから決済までオンラインで完結するWEB見積もりの流れを紹介している。","\n【概要】京都ステッカーは、2026年11月24日付のブログで、アプリを使ってUVDTFステッカーのデザインを作成・入稿する際のコツと条件を解説した。対応するファイル形式、推奨解像度、色表現の制約、WEB見積もりシステムの使い方、貼り付け後の定着期間などを一つの記事にまとめている。\n【背景】UVDTFステッカーは、UV（紫外線）硬化型インクで透明PETフィルムに印刷するステッカーで、UVプリンターを持たない個人や小規模事業者でもオリジナルグッズを作りやすい。一方、スマホアプリなどでデザインを作る利用者が増えると、データ形式や解像度の不備によって、仕上がりが想定と違うといった問題も起こりやすくなる。\n【詳細】記事によると、同社のUVDTFステッカーで受け付ける入稿データはPNGとJPGの2形式で、アプリから書き出す際にはこれらを選ぶ必要がある。写真やグラデーションをきれいに再現するため、推奨解像度は300DPI以上とされ、低解像度の画像をそのまま使うと仕上がりが粗くなる場合がある。印刷はCMYK＋ホワイトインクで行うため、金・銀インク、メタリック、箔押し、鏡面表現には対応しない。アプリで金色や銀色を使っても、実際にはデータ上の金色風・銀色風の色として出力される。白インクに対応しているので、透明や暗色の素材に貼っても鮮やかに発色し、フチなしで直接印刷したような立体感のある仕上がりになるという。オンラインでは、画像をアップロードして料金を確認でき、見積もりから入稿・決済まで完結するWEB見積もりシステムを用意している。記事では、貼り付け後の定着期間についても確認できるようにしている。\n【ポイント・注意点】アプリで作ったデザインは、仕上がりを左右する入稿データの準備段階でつまずかないことが重要で、、書き出し時のファイル形式と解像度の確認が第一歩になる。メタリック系の色を多用したデザインは、画面上の印象と実際の仕上がりが異なる可能性があるため注意が必要だ。詳しい入稿ルールは同社の入稿ガイドを確認しながら作成することが勧められている。","2026-11-24","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/24/24258/"],["UV DTFの接着テスト、量産前に実物のブランクで確かめる手順","UV印刷の情報サイトUV Print Advisorは2026年11月24日、UV DTF転写を顧客の注文に使う前に、実際に使うブランク品で接着性を確かめるテスト手順を公開した。品番や仕上げ、ロット、組み合わせるフィルムを記録し、1サンプルごとに変える条件を一つに絞り、角や細い文字の浮きを斜めの光で点検するなど、再現性のある検証方法を3段階に分けて示している。","\n【概要】UV印刷の実務情報を扱うUV Print Advisorは、2026年11月24日付で「UV DTF Adhesion Test: Check Your Blanks Before a Batch」を公開した。UV DTF転写を顧客向けのまとまった注文に使う前に、実際に使うブランク品（無地の商品）で接着テストを行う手順を解説している。\n【背景】記事は、似た名前で販売されているブランク品でも、コーティングが異なる場合があると指摘している。見た目が同じ商品でも、ロットや仕上げが違えば転写フィルムの密着性が変わりうるため、量産前の確認が欠かせない。UV DTFは貼るだけで装飾できる手軽さが魅力だが、剥がれなどの品質トラブルは販売後の問題につながりやすい。\n【詳細】手順は3段階で構成される。まず、対象のブランクとフィルムを正確に定義する。品番、仕上げ、ロット、組み合わせるフィルムを記録し、食品接触面や繰り返しの洗浄に関する制限も含めて、フィルムと素材のサプライヤーの施工・取り扱い指示に従う。次に、サンプルごとに変える条件を一つに絞る。サプライヤーの指示どおりに作った基準サンプルにラベルを付け、残りのブランクでは下処理の方法や曲面上のデザイン位置などを一つずつ変える。取り扱い、圧力、時間は一定に保つ。最後に、斜めからの光の下で角、細い文字、継ぎ目に浮きがないかを点検し、用途とサプライヤーの指針に合った取り扱い・洗浄テストだけを行う。結果は各サンプルとも同じ間隔で記録する。\n【ポイント・注意点】記事は、あるロットのブランクで合格しても、一般的な耐久性を保証するものではないと明記している。また、記事はAIの支援で作成し一次情報と照合したもので、実機による試験結果ではないと断っている。機種ごとの指示が一般的な指針より優先される点にも注意したい。小ロットの受注でも、ブランクの仕入れ先やロットが変わるたびに同じ手順で確認し、記録を残しておくことが品質の安定につながる。顧客に耐久性を説明する際も、記録した条件の範囲内にとどめるのが無難だ。","2026-11-24","UV Print Advisor","https://uvprintadvisor.com/learn/uv-dtf-adhesion-test"],["英Signs Express、ミマキJFX200-2513 EXへ更新投資","英国のサイン会社Signs Express Central Lancashire and Southportは、6年間使ったUV LEDフラットベッドを、同じプラットフォームの新機ミマキ「JFX200-2513 EX」に置き換えた。HP機やミマキJFX220-2515とも比較したが、設置面積や、異形の板にテンプレートなしで印刷できる点を評価した。インクは硬化後に最大170％伸びるLUS 120に変更した。2026年11月23日の報道。","\n【概要】英国のサイン会社Signs Express Central Lancashire and Southportは、ミマキのUV LEDフラットベッドプリンター「JFX200-2513 EX」を導入した。供給はCMYUKで、6年間使ってきた同じプラットフォームの旧機を置き換える更新投資となる。Eye on Displayが2026年11月23日に伝えた。\n【背景】同社は計画的な設備更新を進めており、過去2年間の設備投資で工場内の機械のほぼすべてを入れ替え、事業を50.41％成長させたという。今回の導入もこの更新計画の一環で、印刷品質、速度、稼働の安定性を維持する狙いがある。\n【詳細】選定にあたっては、HPの大型フラットベッドや、ミマキの次世代機JFX220-2515も比較した。最終的に、設置スペースの制約、作業の慣れ、型抜きした板に位置合わせ用のテンプレートなしで直接印刷できる点が決め手になった。マネージングディレクターのMatt Rutlidge氏は、HP機は設置面積が大きく、異形の板に印刷する際にはテンプレートが必要だったと説明した。同社のフラットベッドは通常1日8時間稼働しているという。インクはミマキの柔軟性インクLUS 120（CMYK、白、クリア）に切り替えた。硬化後に最大170％伸びても割れず、熱成形や曲げ加工に対応し、8パスで目標品質を得られるためインク消費も抑えられる。発注は、以前に故障したGraphtecプロッターを24時間以内に交換してくれたCMYUKのSue Hayward氏を通じて行った。\n【ポイント・注意点】最新機種ではなく実績のある同一プラットフォームを選び、日々の生産を止めずに更新した点が特徴だ。設置面積や既存ワークフローとの相性、販売店のサポート体制が機種選定で重視されたことがわかる。インクの変更で加工用途の幅も広げており、ハードとインクを合わせて見直す設備更新の参考事例といえる。なお同支店は建設、教育、イベント分野の顧客を抱え、安全標識やラベルから3Dグラフィック、家具まで幅広く手がけている。","2026-11-23","Eye on Display","https://www.eyeondisplay.com/signs-express-central-lancashire-adds-mimaki-jfx200-2513-ex/"],["英CPS、3.2m両面UV機Hapondの導入パートナーを募集","英国のChina Print Supplies UK Ltdは、3.2m幅のUVプリンター2台を一体化したHapond UP3321Dについて、導入事例となるショーケースパートナーを1社募集すると発表した。希望小売価格11万5,000ポンド（税別）の機械を7万5,000ポンド（税別）で提供し、代わりに12か月で3回のビデオ取材や稼働映像の提供を求める。両面バナーをワンパスで生産でき、計6.4m分の印刷能力を持つ。","\n【概要】英国のChina Print Supplies UK Ltdは、3.2m幅のUVプリンターを2台組み合わせたHapond UP3321Dについて、英国の印刷会社1社をショーケースパートナーとして募集すると発表した。パートナーは希望小売価格11万5,000ポンド（税別）の機械を7万5,000ポンド（税別）で導入でき、差額は4万ポンドになる。TEXINTELが2026年11月23日に報じた。\n【背景】大判UV印刷で両面バナーやバックリット素材を作る際には、素材の再装填や位置合わせが必要になり、手間がかかる。同社は、生産能力と効率を高めつつ、大判UV印刷に伴う運用負担を減らすことで、業界の革新を支援したいとしている。\n【詳細】UP3321Dは3.2mのUVプリンター2台を1台に統合した機械で、両面バナーやバックリット素材をワンパスで生産でき、素材の再装填や再位置合わせが要らない。2つの別のジョブを同時に走らせることもでき、1人のオペレーターで6.4m分のUV印刷能力を確保できるという。値引きの見返りとして、パートナーは12か月の間に同社のビデオインタビューに3回応じるほか、稼働中の写真や動画、完成品の事例を提供し、同社のマーケティングで使うことを認める必要がある。その代わりに同社は、パートナーの事業や制作物を自社の顧客や業界誌に向けて紹介する。応募を希望する企業には、申請手続きと条件について問い合わせるよう呼びかけている。\n【ポイント・注意点】大幅な値引きと引き換えに、導入事例としての情報発信に協力する仕組みだ。導入側は初期費用を抑えながら全国的な知名度も得られる一方、1年間の取材協力や制作物の公開が条件になる。顧客案件の守秘義務との兼ね合いを事前に確認しておく必要がある。募集は1社のみである点にも留意したい。同社は、エンジニアリング主導で機械の設置や設定、生産体制全体のサポートまで手がけるとしており、導入後の支援体制もあわせて確認しておきたい。両面印刷の需要が多い事業者ほど、メリットは大きいとみられる。","2026-11-23","TEXINTEL","https://texintel.com/press-room/chinaprintsupplies-11-26-ph-china-print-supplies-uk-ltd-seeks-uk-showcase-partner-for-hapond-up3321d-offering-40000-saving"],["ローランドDG、ブランド刷新でDrum B2B賞を3部門受賞","ローランド ディー.ジー.は、2026年4月に世界展開したブランド刷新と「Make Your Mark」キャンペーンで、The Drum B2B Awards 2026の3部門を受賞した。米マイアミの授賞式で、写真・イラスト部門と企業ポジショニング部門で銀賞、ブランドポジショニング部門で銅賞を獲得。ハード、ソフト、サプライ品、サービスを含む総合ソリューション企業としての打ち出しや、顧客の制作物を中心に据えた表現が評価された。","\n【概要】UVプリンターなどデジタル印刷機器を手がけるローランド ディー.ジー.（Roland DG）は、グローバルブランドの刷新と「Make Your Mark」キャンペーンで、The Drum B2B Awards 2026の3部門を受賞した。米フロリダ州マイアミでの授賞式で発表され、TEXINTELが2026年11月23日に報じた。\n【背景】Make Your Markは2026年4月に世界展開された。ブランドメッセージ、ビジュアルアイデンティティ、クリエイティブの基盤を一新したもので、40年以上にわたる同社の技術力と、世界の顧客の成長への意欲の両方を表現する狙いがある。単なる見た目の変更ではなく、ハードウェア、ソフトウェア、サプライ品、サービスを含む総合ソリューションを軸に事業を打ち出す戦略的な転換と位置づけられている。\n【詳細】受賞はPhotography & Illustration部門の銀賞、Corporate Positioning部門の銀賞、Brand Positioning部門の銅賞の3つ。写真や色彩、実際の制作物を豊かに使い、顧客とその作品をコミュニケーションの中心に据えた表現が評価された。グローバルマーケティング担当VPのDan Wilson氏は、優れた作品づくりは技術そのもの以上に、制作物がもたらす自信と影響力にあるという顧客の声をもとにキャンペーンを構築したと説明した。3部門での評価は、同社の伝統に忠実でありながら変化し続ける事業を語るブランド基盤づくりの成果だと述べている。キャンペーンは今後も世界各地の市場で展開が続く。\n【ポイント・注意点】製品発表ではなくブランド面のニュースだが、UVプリンター大手が技術の紹介から、顧客の制作物を前面に出す発信へと軸足を移していることを示している。導入検討者にとっては、機器単体ではなくソフトやサービスを含めた総合提案が今後さらに強まる可能性を読み取れる。製品の仕様や価格に関する発表は含まれていない点に注意したい。","2026-11-23","TEXINTEL","https://texintel.com/press-room/roland-11-26-ph-roland-dgs-make-your-mark-global-brand-refresh-wins-three-drum-b2b-awards"],["南アの新興Lianova Signs、UV印刷と受注自動化で参入","南アフリカ・ケープタウンで新しい看板会社Lianova Signsが始動した。UVロールtoロール印刷、フラットベッド印刷、カッティングを提供し、ウェブでの問い合わせ、見積もり、データ入稿、オンライン校正から生産キューへの自動投入、進捗通知までの自動化を掲げる。書籍印刷会社Print on Demandも経営するTertius van Eeden氏が設立した。Sign Africaが2026年11月23日に紹介した。","\n【概要】南アフリカ・ケープタウンで、新しい看板会社Lianova Signsが事業を始めた。UVロールtoロール印刷、フラットベッド印刷、カッティングを手がけ、問い合わせから生産までの自動化を特徴に掲げる。創業者は印刷業界での経験を持つTertius van Eeden氏で、Sign Africaが2026年11月23日に紹介した。\n【背景】van Eeden氏は書籍印刷会社Print on Demandも経営しており、その経験を大判・看板市場に広げるためにLianova Signsを設立した。同社は、確実な納期、安定した品質、わかりやすい発注体験という看板市場のニーズに応えることを目指している。\n【詳細】同氏は、ウェブサイトからの問い合わせ、見積もり依頼、データのアップロード、オンラインでの校正承認まで、顧客とのやり取り全体を自動化できると考えている。顧客が承認し、注文の条件が満たされると、ジョブが自動的に生産キューに入り、顧客には進捗が通知される仕組みを目指す。設立にあたっては、手作業での引き継ぎや繰り返しの事務作業が工程を遅らせている箇所を洗い出したという。ウェブサイト、受注管理、生産ワークフローをつなぐことで情報を効率よく流し、スタッフが質の高い仕事に集中できるようにするのが狙いだ。同氏は、自動化によって品質の安定、避けられるミスの削減、顧客に対する透明性の向上も期待できるとし、問い合わせから生産・納品まで追跡できるワークフローを目標に掲げている。顧客が進捗を問い合わせる手間や遅れを減らすことも目指す。\n【ポイント・注意点】UVプリンターの性能そのものより、受注から生産までの流れをデジタルでつなぐ点に重点を置いた参入事例だ。短納期が求められる看板やUV印刷の分野では、機械への投資と並んで業務フローの設計が競争力を左右することを示している。導入した機種名や台数は記事では明らかにされていない。今後、自動化の仕組みが実際の納期や品質にどう結びつくかが注目される。小規模な事業者が新規参入する際の一つのモデルとして参考になりそうだ。","2026-11-23","Sign Africa","https://www.signafrica.com/lianova-signs-brings-an-automation-led-approach-to-signage/"],["京都ステッカー、UVDTFステッカーの食洗機耐久と貼り方を解説","京都ステッカーは2026年11月23日、UVDTFステッカーの耐久性と食洗機への対応を解説する記事を公開した。同社のテストでは、食器に貼って家庭用食洗機で100回程度洗っても剥がれなかったとし、スキージーでしっかり密着させ、貼付後は最低24〜72時間の定着期間を置くよう呼びかけている。ガラスや金属などの対応素材や、CMYK＋白インクによる印刷仕様も紹介した。","\n【概要】ステッカー製作の京都ステッカーは、2026年11月23日付のブログで、UVDTFステッカーの耐久性と食洗機への対応、剥がれにくい貼り方を解説した。グラスやお弁当箱などにオリジナルデザインを貼りたい利用者に向けて、同社テストの結果と施工の注意点をまとめている。\n【背景】UVDTFステッカーは、UV（紫外線）硬化型インクで透明PETフィルムに印刷したステッカーだ。UVプリンターで対象物に直接印刷しなくても、貼るだけでフルカラーの装飾ができる。食器や水筒など洗う機会が多いものに使う場合、耐久性は利用者にとって大きな関心事になる。\n【詳細】記事によると、UV硬化インクを使うため水・擦れ・紫外線に強く、屋外での使用や食洗機での洗浄にも耐える。同社のテストでは、食器類に貼って家庭用食洗機で100回程度洗浄しても剥がれず、食洗機の熱にも問題なく耐えたという。施工は台紙を剥がして貼り、転写シートを剥がすだけで、UVプリンターなどの特別な機材は要らない。剥がれにくくするには、スキージーなどで対象物にしっかり密着させ、貼った後すぐに洗わずに最低24〜72時間の定着期間を置くことが大切だとしている。印刷はCMYK＋ホワイトインクで行い、白インクにより透明や暗色の素材でも鮮やかに発色する。フチなしの仕上がりで直接印刷したような立体感が出る一方、金・銀インク、メタリック、箔押し、鏡面表現には対応しない。貼付できる素材はガラス、金属、プラスチック、木材、陶器で、コップやボトルなどの緩やかな曲面なら問題なく貼れるという。\n【ポイント・注意点】100回の洗浄はあくまで同社テストでの実績で、デザインによっては剥がれる場合があると明記されている。販売用グッズに使う場合は、事前の試し貼りが推奨されている。急な曲面への適性は記事では扱われていないため、形状によっては個別に確認したい。洗浄を前提とする食器類に使う場合は、定着期間を十分に取ってから使い始めることが、剥がれを防ぐうえで基本になる。詳しい貼り方は、同社の関連記事でも紹介されている。","2026-11-23","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/23/24181/"],["Allprintheads週報、11月16〜22日の印刷機とヘッドの動き","プリントヘッド販売の米Allprintheadsは2026年11月22日、11月16〜22日の印刷業界ニュースをまとめた週報を公開した。ミマキのUV硬化フルカラー3Dプリンター、Dantexの大型デジタルハイブリッド・ラベル機、DominoのK300への白インク追加などを、各機械がプリントヘッドに何を求めるかという視点で整理。UV対応ヘッドEpson I3200-U1やRicoh GEN5 MH5420も紹介している。","\n【概要】プリントヘッドの販売を手がける米Allprintheadsは、2026年11月22日付で週報「What Moved in Print This Week（November 16–22, 2026）」を公開した。4つの機械、1つのインク、1つの展示会を取り上げ、それぞれの機械がプリントヘッドに何を求めているかという共通の視点でまとめている。\n【背景】UVインクジェットを含むデジタル印刷機の性能は、搭載するヘッドの特性に大きく左右される。ヘッド販売事業者による週報は、新製品や導入事例を部品や保守の目線で読み解く点に特徴があり、機械の選定や交換部品の手配を考える現場にとって参考になる情報源となっている。\n【詳細】今週の主な項目は次のとおり。ミマキは11月17日、ドイツ・フランクフルトのFormnext 2026でフルカラー3Dプリンター3DUJ-553MkIIを公開し、従来機より約1.4倍広い色域をうたった。英Dantexは同社最大のデジタルハイブリッド機PicoJet 1200 DRSを米ウィスコンシン州のTailored Label Productsに供給し、2026年11月下旬に設置する予定。Dominoは11月19日、K300に白インクを追加し、黒、白、黒と白の構成を用意した。関連オプションとしてプラズマ前処理、UV LED硬化、Rシリーズの検査システムが挙げられている。このほか、上海でのITMA ASIA + CITMEの開幕、Siegwerkの水性インクAQUAGEN、Vomelaの新施設なども扱った。記事内では、UV対応ヘッドEpson I3200-U1（1,390ドル）やUV・溶剤対応のRicoh GEN5 MH5420も商品として紹介されている。\n【ポイント・注意点】週報はヘッド販売会社の視点でまとめられており、自社商品への誘導も含まれる。各ニュースの詳細は、記事に記載されたMimaki EuropeやPrintIndustry.news、Label & Narrow Webなどの一次情報で確認するのが望ましい。","2026-11-22","Allprintheads","https://www.allprintheads.com/blogs/news/allprintheads-industry-news-what-moved-in-print-this-week-november-16-22-2026"],["Agfa、刷新したJeti Tauro H3300 HSの最初の導入先が決定","Agfaは、刷新したエントリー向けハイブリッド大判機「Jeti Tauro H3300 HS」の最初の導入顧客が、カナダの店舗ディスプレイ専門会社Protagon Display Incに決まったと発表した。上位機の技術を6列構成のハイブリッド基盤に取り入れ、4色と7色の構成を用意。メディアガイドの再設計や前後からの操作、IoTによる遠隔診断にも対応する。Sign Africaが2026年11月20日に報じた。","\n【概要】Agfaは、刷新した「Jeti Tauro H3300 HS」の最初の導入顧客として、カナダの店舗ディスプレイ専門会社Protagon Display Incが投資を決めたと発表した。Sign Africaが2026年11月20日に報じた。\n【背景】H3300 HSは、世界のTauroユーザーからの意見を受けて開発された。Tauroファミリー全体の技術と運用ノウハウを、Agfaの6列構成のハイブリッドプラットフォームに取り込み、成長を目指す印刷会社にとって導入しやすく拡張性の高い入り口になるとしている。Tauroファミリーのエントリーモデルという位置づけで、上位機と同じプラットフォーム、インクシステム、サービス体制をとる。\n【詳細】構成は4色と7色から選べる。7色版は上位機Jeti Tauro UHS・XUHSから受け継いだ完全ミラー型のシャトル構成を採用し、上位機並みの画質と安定性をエントリー機にもたらすという。安定したインク供給により、AgfaのAsanti HDR印刷モードで力強い発色が得られる。運用面では、メディアガイドを再設計して装填を容易にし、2台目のモニターで機械の前後どちらからでも操作できるようにした。Tauroの自動化エコシステムと互換性があり、生産量の増加に合わせて自動化の範囲を広げられる。IoTにも対応し、Agfaのサービス部門が遠隔でより速く正確に問題を診断できる。Protagon Display IncのVictor Amarosi社長は、機動性、安定性、管理性を高めるために選んだと説明した。AgfaのDieter Jancart氏は、世界で500台以上のTauroを導入してきた経験から、顧客が最も重視するのは信頼性、安定性、長期的な価値だと述べた。\n【ポイント・注意点】上位機の技術を引き継ぎながら導入のハードルを下げたモデルで、成長段階にある看板・ディスプレイ事業者が段階的に設備を拡張する選択肢となる。価格や生産速度は記事では示されていないため、検討する際は代理店への確認が必要だ。","2026-11-20","Sign Africa","https://www.signafrica.com/agfa-announces-debut-installation-of-renewed-printer/"],["オリジナルプリント.jp、UV印刷対応のポーチ4種を発売","イメージ・マジックが運営する「オリジナルプリント.jp」は2026年11月19日、オリジナルデザインをプリントできる「オーロラPVCポーチ（S・M）」と「ぬいぐるみポーチ（S・M）」の計4商品を発売した。印刷はUV硬化インクジェット方式で、白引きの有無を選べる。1点から注文でき、価格は1点あたり税込236円から（プリント代別）。推し活やイベント物販、ノベルティ需要を狙う。","\n【概要】株式会社イメージ・マジック（東京都文京区）が運営するオンデマンドプリントサービス「オリジナルプリント.jp」は、オリジナルデザインをプリントできる新商品として「オーロラPVCポーチ（S・M）」と「ぬいぐるみポーチ（S・M）」の計4商品を、2026年11月19日に発売した。11月20日にPR TIMESで発表した。\n【背景】オリジナルプリント.jpは、Tシャツやバッグ、マグカップなど2,500種類以上のアイテムからオリジナルグッズを作れるサービスで、1点からの小ロットから法人向けの大量生産まで対応している。イメージ・マジックは1995年の創業以来、「必要なものを必要な分だけ作る」を掲げてオンデマンドプリントの事業を展開してきた。\n【詳細】オーロラPVCポーチは、見る角度で表情が変わる光沢のあるオーロラ素材を使ったPVCポーチ。中身がうっすら透けるクリア素材で、展示会やイベントのノベルティ、物販用グッズとしての活用を想定する。Sサイズはコスメやイヤホンなどの小物向け、Mサイズはペンやメモ帳、充電ケーブルの収納に向く。ぬいぐるみポーチは付属のカラビナを付け替えて縦・横どちらでも使え、全9色から推し色を選べる。前面はクリア素材で、Sサイズにはミニサイズのぬいぐるみ1〜2体、Mサイズにはキャラクターやアイドルのぬいぐるみが収まる。印刷方法はUV硬化インクジェットプリントで、白引きありと白引きなしから選べる。価格は1点あたり税込236円から（オーロラPVCポーチSの例、プリント代別）。注文は商品ページの「デザインツール」から行い、専門ソフトがなくてもプレビューを見ながらデータを作れる。\n【ポイント・注意点】UVインクジェットの強みである小ロット・多品種への対応を、推し活やイベント物販の需要に結びつけた商品展開だ。表示価格はプリント代を含まないため、実際の費用はデザインツールで確認する必要がある。問い合わせ窓口の対応時間は平日10時から17時で、土日祝日と同社指定の休業日は対象外となる。","2026-11-20","PR TIMES","https://prtimes.jp/main/html/rd/p/000000195.000085001.html"],["京都ステッカー、UVDTFでグッズを売る人向けに料金と仕様を公開","京都ステッカーは2026年11月20日、UVDTFステッカーを使ったオリジナルグッズ販売向けに、料金と仕様をまとめた記事を公開した。50mm角10枚で1,080円〜、100mm角100枚で18,000円〜（いずれも税別）などの参考価格を示し、通常プランは決済後2〜4営業日以内に発送する。食洗機で100回程度洗っても剥がれなかったテスト実績や、PNG・JPGの入稿条件も紹介している。","\n【概要】京都ステッカーは、2026年11月20日付のブログで、UVDTFステッカーを使ってオリジナルグッズを販売したい人向けに、料金と仕様を解説した。対象物に直接印刷する機材がなくてもグッズを作れる方法として、耐久性、入稿データの条件、サイズ・枚数別の参考価格、納期プランなどを紹介している。\n【背景】グラスやジョッキ、スマホケースなどにフルカラーで印刷するには、従来はUVプリンターで直接印刷する必要があった。UVDTFステッカーはUV硬化型インクで透明PETフィルムに印刷したもので、貼り付けるだけでグッズが完成するため、機材投資なしで小ロット販売を始めたい人の選択肢になっている。\n【詳細】記事によると、ガラス、金属、プラスチック、木材、陶器などに貼付でき、コップやボトルの緩やかな曲面にも対応する。UV硬化インクにより水・擦れ・紫外線に強く、同社テストでは家庭用食洗機で100回程度洗っても剥がれなかったという。印刷はCMYK＋ホワイトインクで、金・銀、メタリック、箔押し、鏡面表現には対応しない。参考価格（税別）は、50mm×50mmが10枚1,080円〜、50枚4,200円〜、100枚7,200円〜、100mm×100mmが10枚2,700円〜、50枚10,500円〜、100枚18,000円〜。税別1万円以上で送料無料となり、製作実績の掲載許可で10％割引になるプランもある。納期は、通常プランで決済後2〜4営業日以内の発送、有料の特急プランで1〜2営業日以内の発送。入稿はPNG・JPGで、推奨解像度は300DPI以上。\n【ポイント・注意点】1枚から注文でき、販売前の試作にも使いやすい。ただし、デザインによっては剥がれる場合があり、貼付後は24〜72時間以上の定着期間が必要とされる。販売用に使う場合は事前の試し貼りが勧められている。送料無料の条件や実績掲載による割引を活用すれば、少量でもコストを抑えて販売を始めやすい。急ぎの場合は特急プランを使えるが、繁忙期は納期が前後する場合があるため、事前の確認が勧められている。","2026-11-20","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/20/24063/"],["LONGER、卓上UV機ePrintなどのブラックフライデー販促を発表","卓上製造機器のLONGERは2026年11月19日、UV印刷とレーザー彫刻を軸に製品群を広げるとともに、ブラックフライデー2026キャンペーンで対象のUVプリンター、レーザー彫刻機、3Dプリンターを最大48％割引すると発表した。中核の卓上UVプリンターePrintは、Epson F1080ヘッド2基と12のインクチャンネルを備え、最大15mmのフルカラー3Dレリーフ印刷に対応する。","\n【概要】卓上製造機器メーカーのLONGERは、2026年11月19日に香港発で配信したプレスリリースで、UV印刷とレーザー彫刻の技術を軸に製品群を広げるとともに、ブラックフライデー2026キャンペーンで対象のUVプリンター、レーザー彫刻機、3Dプリンターを最大48％割引すると発表した。\n【背景】デザインツールや卓上加工機が身近になり、個人のクリエイターや小規模事業者が製品を開発・製造する機会が広がっている。かつて工業生産向けだった技術が小さな工房やスタジオ向けに転用されつつあり、LONGERはUV印刷、レーザー彫刻、3Dプリントを組み合わせ、試作から加工、加飾までを支える構成を打ち出している。\n【詳細】中核となる卓上UVプリンターePrintは、Epson F1080プリントヘッド2基と12のインクチャンネルを備え、フルカラー、白インク、ニスに対応する。同社によると、デュアルヘッド構成はシングルヘッドのePrint SEと比べ、2D印刷で最大2倍、3Dテクスチャ印刷で6倍の速度になる。最大15mmの盛り上がりを持つフルカラー3Dレリーフ印刷ができ、最大10mmの表面の高低差に対応し、300種類以上の素材を扱えるという。オープンインクシステムを採用し、画像編集や背景除去、レイアウト準備を支援するLONGERStudio AIソフトも用意する。レーザー彫刻ではRay5、高出力のB1、携帯向けのNano、Class 1の密閉設計を採ったRay7Sの各シリーズを展開し、3DプリンターではLK5 ProとLK10シリーズを持つ。\n【ポイント・注意点】UVプリンターとレーザー加工を組み合わせれば、看板や雑貨の切り出しから加飾までを小規模にこなせる点を訴求している。ただし本リリースは有料配信のプレスリリースで、性能値は同社の発表に基づく。最大48％の割引は対象製品に限られ、個別の価格は記事では示されていないため、購入前に公式ストアで確認が必要だ。対応素材についても、互換性のある素材での使用が前提とされている。","2026-11-19","Webdisclosure.com","https://www.webdisclosure.com/press-release/longer-expands-its-desktop-manufacturing-portfolio-as-black-friday-2026-promotion-offers-up-to-48-savings-myBgjcpYUV5"],["豪NEON、ミマキJFX600を追加導入しEC包装の生産を増強","オーストラリアのNEON e-Commerce Packagingは、ミマキの大判フラットベッドUVインクジェットプリンター「JFX600」をもう1台導入した。パーソナライズされた包装、短い生産ロット、短納期への需要拡大に応えるため、デジタル生産能力を高める。創業者のSean Downs氏は、2027年半ばごろにもさらなる設備投資を検討していると明らかにした。豪業界誌Print21が2026年11月18日に報じた。","\n【概要】オーストラリアのEコマース包装会社NEON e-Commerce Packagingは、ミマキの大判フラットベッドUVインクジェットプリンター「JFX600」を追加導入した。デジタル生産設備への継続的な投資の最新段階と位置づけ、オーストラリアとニュージーランドの顧客の需要拡大に応える。豪印刷業界誌Print21が2026年11月18日に伝えた。\n【背景】EC向け包装の市場では、パーソナライズされた包装、短い生産ロット、より速い納期、より高度な包装ソリューションを求める声が強まっている。NEONはこうした需要に応えるため、デジタル製造能力の強化を進めてきた。\n【詳細】創業者のSean Downs氏は、JFX600の追加はEC包装市場の方向性を反映した判断だと説明した。顧客はより多くのパーソナライズ、より短いロット、より速い納期、より洗練された包装を求めており、JFX600によってこうした仕事をより多く引き受ける能力と自信が得られたという。今回の追加投資で、品質と柔軟性を保ちながら生産能力を大きく引き上げられるとしている。同氏はこの投資をより広い投資計画の一部と位置づけ、2027年半ばごろにさらなる設備投資を検討していることも明らかにした。同社はデジタル生産設備、自動化、製造技術への追加投資を2027年にも計画しており、既存ブランドから新興のEC事業者まで対応できる、拡張性のある生産基盤の構築を目指している。記事はJFX600を、厳しい環境でも高速・高品質な印刷ができる大判フラットベッドUVインクジェットプリンターと紹介している。\n【ポイント・注意点】看板用途のイメージが強い大判UVフラットベッドが、包装の短ロット生産に活用されている事例だ。記事は、デジタルフラットベッド技術が包装事業者の従来型の生産モデルからの脱却を後押ししていると指摘している。生産量などの具体的な数値は記事では明らかにされていない。同社が掲げる2027年の追加投資の中身も、今後の注目点となる。オーストラリアとニュージーランドでの事業拡大がどこまで進むかもあわせて見ておきたい。","2026-11-18","Print21","https://print21.com.au/neons-second-mimaki-jfx600-boosts-production-capacity/"],["米AAkron Line、InkcupsのUV立体物印刷機X5-Tで増産","北米で販促品を手がけるAAkron Lineは、Inkcupsのフラットベッド型ダイレクト・トゥ・オブジェクト（DTO）プリンター「X5-T High Throw」を導入し、商品の幅と生産速度を高めた。最大25％の曲面や凹凸のある面に印刷でき、この1台で1日約4,000〜5,000個を生産。現在は商品の約40％をこの機械で印刷している。WhatTheyThinkが2026年11月18日に掲載した。","\n【概要】北米に複数の拠点を持つ家族経営の販促品サプライヤーAAkron Lineは、Inkcupsのフラットベッド型ダイレクト・トゥ・オブジェクト（DTO）プリンター「X5-T High Throw」を導入した。曲面や不規則な形の商品にも印刷できるようになり、商品ラインアップと短納期対応を強化した。WhatTheyThinkが2026年11月18日に掲載した。\n【背景】AAkron Lineは900点を超える商品を扱い、以前からInkcupsのDTO技術で販促品を加飾してきた。消耗品の調達から始まった両社の関係は、円筒形・フラットベッド型のDTO機の導入へと広がり、24時間納期の注文にも対応できるようになった。2026年初めには、より速い生産サイクルと複雑な曲面形状への対応を求めて、新たなDTO機を探し始めた。\n【詳細】X5-T High Throwは、ヘッドを素材に近づける必要がある従来の大型UVフラットベッドと異なり、最大25％の曲面、凹面、凹凸のある面に印刷できる。取っ手付きのマグ、段付きのドリンクウェア、ストレスボール、スポーツ用品などに高品質なグラフィックを印刷できるという。機械は2026年4月にテネシー州の工場に設置され、それ以降、この1台だけで1日約4,000〜5,000個を生産している。現在、同社商品の約40％がX5-T High Throwで、さらに約40％がHelix円筒形DTOプリンターで印刷されている。同工場のJustin Wilkins氏は、DTOなら転写やホイルを待つ時間がなく、データを準備してRIP処理し、印刷して梱包・出荷するだけだと説明した。設置とトレーニングは約2日で、実際の顧客注文を使って行ったという。\n【ポイント・注意点】曲面に対応するDTO機が、販促品の大量・短納期生産を支えている事例だ。同社は2027年に創業60年を迎える。記事はInkcups側が発表したプレスリリースで、生産数は導入企業の担当者による推計値である点に留意したい。","2026-11-18","WhatTheyThink","https://whattheythink.com/news/132503-aakron-line-expands-product-offering-accelerates-production-inkcups-x5-t-high-throw/"],["Excelitas、産業用UV LED硬化装置OmniCure AC7+を発表","米Excelitasは、産業用のUV LEDエリア硬化装置「OmniCure AC7+シリーズ」を発表した。従来のAC7に比べて照射強度を最大40％高め、ピーク照射強度は7.5W/cm²超、長手方向の均一性は±5％より良好。150mmと300mmの硬化幅を用意し、ディスプレイ、タッチパネル、光学フィルム、医療機器、半導体ウエハーテープの処理などに向ける。WhatTheyThinkが2026年11月18日に掲載した。","\n【概要】米ペンシルベニア州ピッツバーグのExcelitasは、UV LEDエリア硬化プラットフォームの新製品「OmniCure AC7+シリーズ」の発売を発表した。既存のAC7を基に、照射強度、均一性、熱管理、接続性、プロセス制御を強化した次世代機で、WhatTheyThinkが2026年11月18日に掲載した。\n【背景】製造現場では、生産性の向上とともに、硬化品質の安定性や長期的な稼働の信頼性が求められている。本製品はプリンターではないが、UV印刷と同じくUV LEDの光で材料を硬化させる装置であり、UV硬化技術の進化を示す動きとして位置づけられる。\n【詳細】AC7+は150mmと300mmの硬化幅を用意し、ピーク照射強度は7.5W/cm²超、長手方向の均一性は±5％より良好だという。従来のAC7と比べた主な改良点は、照射強度を最大40％高めて硬化速度と生産量を向上させたこと、LEDモジュール単位の制御で均一性を最適化できること、RS485通信と拡張可能なマルチヘッド構成でほぼあらゆる硬化幅に対応できること、熱管理とVOCフィルターの改善で出力の安定性を高めたことなど。オプションの保護窓と長寿命LEDで保守の手間を減らし、既存のAC7設備との後方互換性も確保した。UV光源を止めずに稼働中に均一性を調整でき、複数ヘッドのバランス調整や不規則な形状の素材の硬化にも対応する。用途はディスプレイ、タッチパネル、光学フィルム、医療機器、半導体ウエハーテープの処理などを想定している。製品管理ディレクターのPeter Cop氏は、生産性と工程の一貫性の両立を求める製造業の要求に応えるものだと述べた。\n【ポイント・注意点】本製品はUVプリンターそのものではなく、産業用の硬化装置だ。UV LEDの高出力化や均一性制御の進歩は、UV硬化を使う加工全般の生産性に関わる動向として押さえておきたい。既存のAC7からの置き換えを検討する場合は、後方互換性により既存設備を生かしながら性能を高められる点が利点となる。","2026-11-18","WhatTheyThink","https://whattheythink.com/news/132512-excelitas-introduces-omnicure-ac7-series-uv-led-curing-systems-delivering-higher-performance-advanced-process-control-enhanced-reliability/"]],"risk":[["子どもの心肺蘇生、人工呼吸を伴う方法が大幅減　約2万7千人を解析（熊本大・岡山大）","熊本大学と岡山大学の研究グループは、全国の小児院外心停止患者2万6,785人の記録（2005〜2023年）を解析し、居合わせた人による胸骨圧迫のみの心肺蘇生の割合が14.6％から55.1％に増えた一方、人工呼吸を伴う心肺蘇生は41.7％から10.4％に減ったと発表した。人工呼吸を伴う蘇生を受けた子どもは30日後に脳機能が保たれている割合が高く、研究グループは小児に特化した蘇生教育の強化を求めている。","\n【概要】熊本大学と岡山大学は2026年11月24日、子どもの院外心停止に対して居合わせた人（バイスタンダー）が行う心肺蘇生の内容が、約20年間で大きく変化していたとする研究成果を発表した。全国の小児院外心停止患者2万6,785人の記録を解析したもので、人工呼吸を伴う心肺蘇生が大幅に減少していることが明らかになった。論文は米医学誌『JAMA Network Open』に2026年11月19日にオンライン掲載された。【背景】成人の心停止では、一般の人が救命処置に踏み出しやすいよう、胸骨圧迫のみの心肺蘇生が広く推奨されている。一方、子どもの心停止は呼吸の問題や窒息が原因となることが多く、国際的なガイドラインでは胸骨圧迫に人工呼吸を組み合わせる方法が推奨されている。こうした違いが実際の救命の現場でどう反映されているかが、今回の研究の焦点となった。【詳細】研究グループは2005年から2023年までの全国データを用い、患者背景を調整して解析した。その結果、胸骨圧迫のみの心肺蘇生を受けた割合は14.6％から55.1％に増加した一方、人工呼吸を伴う心肺蘇生は41.7％から10.4％に減少していた。また、心肺蘇生が全く行われない割合は2013年ごろから約35％で横ばいが続いていた。さらに、人工呼吸を伴う心肺蘇生を受けた子どもは、胸骨圧迫のみの場合と比べて、30日後に脳機能が良好に保たれている割合が高かった。研究には岡山大学の救命救急・災害医学や疫学・衛生学の研究者に加え、米フィラデルフィア小児病院の研究者も参加した。【ポイント・注意点】研究グループは、今回の結果が小児の心停止における人工呼吸の重要性を改めて示すものだとし、胸骨圧迫のみの心肺蘇生の普及を進めつつ、子どもに特化した心肺蘇生教育を強化する必要があると提言している。保護者や保育・教育関係者は、子どもの心停止は窒息など呼吸の問題から起こりやすいことを理解し、救命講習などで小児の心肺蘇生の方法を学んでおくことが望ましい。いざという時には119番通報とAEDの手配を行い、できる範囲で速やかに心肺蘇生を始めることが大切だ。","2026-11-24","岡山大学（プレスリリース）","https://www.okayama-u.ac.jp/tp/release/release_id1643.html"],["ネットの依存的使用が続くと思春期の抑うつ・不安リスク上昇　改善で軽減の可能性","国立精神・神経医療研究センター、東京都医学総合研究所、東京大学などの国際研究グループは、東京ティーンコホートの子ども3,171人の追跡データを解析し、12歳と14歳の両時点でインターネットの依存的な使用の傾向が強かった子どもは、16歳時点で抑うつ症状が約1.7倍、不安症状が約2.1倍起こりやすいことを示した。一方、依存的な使用が途中で改善した場合は、リスクが軽減される可能性も示された。","\n【概要】国立精神・神経医療研究センター精神保健研究所の成田瑞室長、東京都医学総合研究所の西田淳志センター長、東京大学病院精神神経科の笠井清登教授らの国際研究グループは、インターネットの依存的な使用が続いた子どもは、16歳時点で抑うつや不安などのメンタルヘルス不調のリスクが高いことを示した。依存的な使用が途中で改善した場合には、リスクが軽くなる可能性も示された。成果は国際学術誌『Epidemiology and Psychiatric Sciences』に2026年11月20日にオンライン掲載された。【背景】インターネットの依存的な使用は思春期にしばしば見られる問題で、メンタルヘルス不調との関連はこれまでも報告されてきた。ただし両者は成長とともに変化し、互いに影響し合う複雑な関係にある。そこで研究グループは、依存的な使用が続いた場合と改善した場合で、その後のリスクがどう異なるかを統計的な因果推論の手法で調べた。ここでいう依存的な使用とは、ネット利用で学業や家族・友人関係、睡眠などに支障が出る、使い始めるとやめられないといった状態を指す。【詳細】研究では、東京都世田谷区・三鷹市・調布市の子ども3,171人を対象とした「東京ティーンコホート」の追跡データを用いた。保護者への質問票で12歳と14歳時点の依存的な使用の程度を3段階に分け、年齢や性別、家庭環境などの影響を取り除いて分析した。その結果、両時点で傾向が強かった子どもは、両時点で弱かった子どもと比べ、16歳時点の抑うつ症状が約1.7倍、不安症状が約2.1倍、感情面の不調が約2.2倍、行動面の問題が約3.2倍起こりやすかった。傾向が強いまま続いた場合、女子の方が男子より抑うつ症状のリスクが大きく上昇する傾向もみられた。一方、12歳で強かった傾向が14歳で弱くなっていた場合は、強いまま続いた場合に比べてリスクが低い傾向だった。【ポイント・注意点】研究グループは、親や教員など周囲の大人が子どものネット利用に伴う困りごとに早く気づき、改善に向けて適切に支えることが重要だとしている。家庭では、利用時間だけでなく睡眠や学業、人間関係への影響に目を向け、子どもと話し合いながら使い方のルールを考えることが望ましい。どのような支援が改善や心の健康につながるかは、今後の研究課題とされている。","2026-11-24","国立精神・神経医療研究センター／東京都医学総合研究所／東京大学（プレスリリース）","https://www.h.u-tokyo.ac.jp/press/__icsFiles/afieldfile/2026/11/20/release_20261120.pdf"],["0.04％アトロピン点眼、近視と外斜視を合併する小児の進行を抑制　中国の比較試験","近視と間欠性外斜視を合併する6〜12歳の小児264人を対象に、0.01％、0.02％、0.04％のアトロピン点眼を比較した中国の無作為化比較試験「AMIXT2」で、0.04％群の12カ月時点の屈折変化は−0.18Dと最も小さく、眼軸長の伸びも0.15mmと最小だった。南京医科大学第一附属病院のZijin Wang氏らが米医学誌『JAMA Ophthalmology』に発表し、メディカルトリビューンが報じた。","\n【概要】近視と間欠性外斜視を合併する小児に対し、0.04％の低濃度アトロピン点眼が、0.01％や0.02％と比べて近視の進行と眼軸長の伸びをより抑えたとする臨床試験の結果を、医療専門メディアのメディカルトリビューンが2026年11月24日に報じた。中国・南京医科大学第一附属病院のZijin Wang氏らによる無作為化比較試験「AMIXT2」の結果で、米医学誌『JAMA Ophthalmology』に2026年11月19日にオンライン掲載された。【背景】低濃度アトロピン点眼は、子どもの近視の進行を抑える方法として研究が進められており、メディカルトリビューンも0.04％アトロピンの近視抑制効果を関連記事で取り上げている。今回の試験は、近視に間欠性外斜視（IXT）という目の位置のずれを合併する子どもを対象に、3種類の濃度を直接比較した点が特徴となっている。【詳細】試験の対象は、近視と間欠性外斜視を合併する6〜12歳の小児264人。参加者を0.01％、0.02％、0.04％のアトロピン点眼の各群に割り付けて比較した。調節麻痺下で測定した等価球面度数の12カ月時点の変化は、0.01％群が−0.43D、0.02％群が−0.35D、0.04％群が−0.18Dで、0.04％群の近視の進行が最も小さかった。眼軸長の伸びも、0.01％群が0.31mm、0.02％群が0.25mm、0.04％群が0.15mmで、0.04％群が最も小さかった。今回の3群の比較では、濃度が高いほど近視の進行と眼軸長の伸びが小さいという結果だった。なお、記事の公開部分では、安全性や副作用に関するデータは示されていない。【ポイント・注意点】今回の結果は中国の小児を対象とした12カ月間の試験に基づくもので、日本の子どもにそのまま当てはまるかどうかや、より長期の効果・安全性については慎重に見ていく必要がある。アトロピン点眼の使用や濃度の選択は、眼科医の診察を受けたうえで判断することが大切だ。保護者は、子どもが見えにくそうにしている、目の位置がずれることがあるといった様子に気づいたら、早めに眼科を受診したい。日頃から屋外で過ごす時間を確保し、近くを見続ける作業の合間に目を休ませるなど、目の健康に配慮した生活習慣も心がけたい。","2026-11-24","メディカルトリビューン","https://medical-tribune.co.jp/news/articles/?blogid=7&entryid=622559"],["小中高生の自殺、1〜10月で490人と最多ペース　こども家庭庁が総合戦略で対策強化","こども家庭庁は2026年11月20日、同年1〜10月の小中高生の自殺者数が暫定値で490人と前年同期より37人多く、過去最多だった2025年を上回るペースだと明らかにした。同日の関係省庁連絡会議では緊急強化プランの取り組み状況を確認。自殺未遂歴のある子どもなどハイリスク層の早期把握と継続支援を柱とする「こども・若者の自殺対策総合戦略」を掲げ、全自治体での協議会の機能化を目指す。","\n【概要】こども家庭庁は2026年11月20日、同年1〜10月の小中高生の自殺者数が暫定値で490人に上ったと明らかにした。前年同期より37人多く、年間で過去最多だった2025年を上回るペースで推移している。教育ニュースサイト「リシード」が11月24日に報じた。同日開かれた「こどもの自殺対策に関する関係省庁連絡会議」（第11回）では、「こどもの自殺対策緊急強化プラン」の取り組み状況が確認された。【背景】2026年4月に施行された改正自殺対策基本法により、自治体は関係機関が情報を共有し、子どもの自殺防止に向けた支援を調整する協議会を設置できるようになった。こども家庭庁は「こども・若者の自殺対策総合戦略」を、「こどもの命と安全を徹底して守る」大臣プロジェクト2026の第1弾と位置づける。戦略では、自殺未遂歴のある子どもなどリスクの高い子ども・若者を早期に把握し、関係機関が連携して継続的に支援することを最優先とし、全都道府県・市町村で協議会が機能することを目標に掲げる。【詳細】国の施策として、全47都道府県の知事と面会する「大臣キャラバン」、自治体への説明・訪問、好事例を集約したウェブサイト、自治体への財政支援、相談支援へのICTやAIの活用検討などが盛り込まれた。学校では、1人1台端末を使った日々の心の健康観察、相談へのアクセス改善、スクールカウンセラーやスクールソーシャルワーカーの配置拡充、電話・SNS相談体制などが挙げられた。医療機関・学校・市町村で使う情報共有シートや、多職種の専門家による「自殺危機対応チーム」も計画されている。47都道府県と20政令市の計67自治体のうち、11月1日時点で協議会を設置済みは7自治体、2026年度中に設置予定（準備会含む）は19、検討中は25だった。【ポイント・注意点】子どもの異変は家庭や学校など身近な場所で最初に表れることが多い。保護者や教職員は、表情や睡眠、食欲、言動の変化などに気を配り、気になる様子があれば一人で抱え込まず、学校や相談窓口、医療機関につなぐことが大切だ。子ども自身が安心して相談できる雰囲気づくりも欠かせない。","2026-11-24","リシード（ReseEd）","https://reseed.resemom.jp/article/2026/11/24/14615.html"],["19歳以下への抗菌飲み薬の処方、約6割減　成育医療研究センターなどが分析","国立成育医療研究センターなどの研究チームは、公的医療保険の処方データ約4億800万件を分析し、2011〜2022年度に19歳以下への飲み薬の抗菌薬の使用量が58.6％減少したと明らかにした。耐性菌のリスクが低く世界保健機関（WHO）が優先使用を推奨する「Access」に分類される薬の割合は11.2％から19.0％に増えたが、WHOの以前の目標60％には届いていない。15〜19歳では減少幅が小さかった。","\n【概要】国立成育医療研究センターなどの研究チームは、19歳以下の子どもや若者に処方される飲み薬の抗菌薬（抗生物質）の使用量が、2011年度から2022年度にかけて58.6％減少したとする調査結果をまとめた。日本経済新聞（共同通信配信）が2026年11月24日に報じた。公的医療保険の処方データ約4億800万件を用いた分析で、同センターの大久保祐輔氏は、減少幅は世界的に見ても大きいとしている。【背景】抗菌薬の使い過ぎは、薬が効きにくい薬剤耐性（AMR）菌を生む要因となる。日本では2016年に抗菌薬の使用削減を盛り込んだ行動計画が策定され、国を挙げた対策が進められてきた。研究チームは、こうした薬剤耐性対策に加え、新型コロナウイルス禍で感染症が減ったことも使用量減少の背景にあるとみている
