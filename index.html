LAUDE.md（25,259バイト）では入力トークンが259,783だった。短いCLAUDE.md（234バイト）では142,506で、約45%減った。短いCLAUDE.mdに除外の設定と指示の絞り込みを加えると116,476で、約55%減った。推定の費用は、短い場合で約48%、絞り込みを加えた場合で約50%減っている。ただし、除外の設定の効果は示せなかった。拒否されたコマンドの切り替えでターンが増えたことも報告している。【ポイント・注意点】測定はclaude v2.1.327の1つのモデルで、課題は小さなバグ修正1種類だけ、各条件3回なので、傾向の目安にとどまる。最初は作業フォルダの位置が悪く、CLAUDE.mdが読み込まれていない無効な測定があったことも正直に書いている。エージェントを多く並べる人は、まず指示書の長さを見直す価値がありそうだ。ルールで縛るだけでなく、毎回読み込まれる指示書そのものを短くすることが、消費を減らす手として数字で示された形だ。測定の失敗まで書いている点は、同じ測定を試す人の役に立つ。","2026-11-19","Zenn","https://zenn.dev/oaoage/articles/claude-code-subagents-token-saving"],["Claude Code v2.1.328、mcp_toolフックのonFailureと/code-review","DevelopersIOがClaude Code v2.1.328の主な変更を解説した。記事の分類では144件の変更がある。mcp_toolフックにonFailureのblockを指定できるようになり、呼び出しが失敗したら操作を止められる。/code-reviewはほとんどのモデルでバグとCLAUDE.mdの違反だけを報告するようになり、再利用や簡素化の指摘は/simplifyに分かれた。auto modeの対象の変化にも触れている。","\n【概要】DevelopersIO（クラスメソッド）が、Claude Code v2.1.328の主な変更を解説する記事を公開した。記事本文はv2.1.328の公開日を2026年11月18日としている。記事の分類では変更は144件で、修正が91件、改善が24件、新機能が12件、性能が7件、セキュリティが6件、破壊的な変更や既定の動きの変更が4件だ。【背景】Claude Codeのフックは、危ない操作を止める守りとして使われることが多い。ただ、フックの呼び出し自体が失敗したときに操作が通ってしまうと、守りにならない。【詳細】今回、mcp_toolフックにonFailureとしてblockを指定できるようになった。フックの呼び出しが失敗すると、その操作を止める。指定しない場合の動きは変わらない。/code-reviewは、ほとんどのモデルでバグとCLAUDE.mdへの違反だけを報告するようになった。再利用や簡素化の指摘は/simplifyで行う。それぞれの指摘には、Important、Pre-existing、Nitのいずれかの印が付く。claude.ai 名前 の形で書いたdeniedMcpServersの項目は、クラウドのセッションとself-hosted runnerにも適用されるようになった。新しい環境変数CLAUDE_CODE_DISABLE_DEFERRED_TOOL_RESUMEも加わった。【ポイント・注意点】BedrockなどでOpus 4.6やSonnet 4.6を使う対話のセッションは、auto modeで始まるようになった。記事は、執筆時点の公式ドキュメントではSonnet 5以降などが対象と書かれており、4.6は含まれていないと指摘している。また、Code ModeではUserPromptSubmitフックがスクリプトの出力に対して実行されなくなった。出力を隠したい場合は、PostToolUseとupdatedToolOutputを使うよう記事は案内している。フックで守りを固めている人は確かめておきたい変更だ。","2026-11-19","DevelopersIO","https://dev.classmethod.jp/articles/20261119-cc-updates-v2-1-328/"]],"cnc":[["3D設計とレーザー加工を1本に、無料アプリ「DabbleCAD」","DJMcNewgent氏がGitHubで公開した無料のデスクトップアプリ「DabbleCAD」は、3D設計、レーザー加工、レリーフ彫刻用の深度マップ作成という3つの機能を、1つのデザインとしてまとめて扱える。GRBL互換のレーザーカッターへUSBで直接送れるほか、G-codeの書き出しやプラズマ切断機向けの出力にも対応する。アカウントは不要で、データは手元だけに保存される。ライセンスはApache-2.0、11月21日時点の最新版は1.3.0。","\n【概要】FabSceneが2026年11月21日に紹介したデスクトップアプリ「DabbleCAD」は、DJMcNewgent氏がGitHubで公開している。3D設計、レーザー加工、深度マップ作成の3機能を1つのデザインとして保存できる。Windows、Mac、Linux向けに無料で配布され、ライセンスはApache-2.0。\n【背景】個人の工作では、立体の設計、レーザーカッターの加工データ、彫刻用の高さデータを別々のソフトで作ることが多い。DabbleCADはこれを1本のアプリにまとめ、クラウドやアカウントに頼らずに手元で完結させることを狙っている。\n【詳細】3D設計では、60種類以上の図形や文字を作業面に置き、伸ばしたり回したり、一部を穴に変えたりして部品にまとめる。ねじ山付きのボルトとナット、ちょうつがい、ふた付きの箱などをミリ単位で生成できる。書き出しの前には、閉じていない形状、薄い壁、急な張り出し、造形範囲の超過を確認でき、STLや3MFで書き出すか、スライサーへ直接送れる。レーザー加工では線、曲線、文字、画像を描き、30色のレイヤーごとに速度、出力、加工回数を設定する。GRBL互換機へUSBで送るほか、G-codeとして書き出せる。LightBurnのプロジェクトファイルを開く機能や、寸法と板厚から指組み箱の部品を作る機能、プラズマ切断機向けのG-code出力もある。深度マップ機能は、3Dモデルや画像からレリーフ彫刻用の高さ画像を作る。データは手元のコンピューターに保存され、クラウドとの同期はない。通信は起動時に新しい版の有無をGitHubへ問い合わせるときだけで、設定で止められる。\n【ポイント・注意点】記事にはAIの利用についての記述はなく、CNC・レーザー向けのデータづくりを手元で一本化するツールとして読むのがよい。開発者の署名やAppleの公証を受けていないため、初回起動時にOSの警告が出る。作者は、ダウンロードしたファイルをチェックサムで確かめたうえで、このアプリだけを許可するよう案内している。11月21日時点の最新版は1.3.0。","2026-11-21","FabScene","https://fabscene.com/new/make/dabblecad-offline-3d-design-laser-depth-map-app/"],["Makera、鋼も削れるとうたう卓上CNC「A1S」を予約開始","Makeraは卓上CNCフライス盤「A1S」を発表し、2026年11月18日に予約を始めた。出力600W、最大毎分2万4000回転のスピンドルを積み、アルミや真ちゅうに加えて、条件を整えれば鋼も削れるとうたう。予約価格は標準版2599ドル（約42万円）、通常価格は3299ドル（約53万円）。付属ソフト「Makera Studio」は、材料を指定すると加工条件と刃物の動きを自動で作る。出荷は2027年1月から。","\n【概要】Makeraは卓上CNCフライス盤「A1S」を発表し、2026年11月18日に予約の受け付けを始めた。FabSceneが11月20日に報じた。予約価格は標準版が2599ドル（約42万円）、通常価格は3299ドル（約53万円）で、2027年1月に同社工場から出荷を始める。\n【背景】A1Sは、従来機「Carvera Air」のダイカスト製の本体を受け継ぎ、構造と可動部を強化した機種。対象として、研究室、メイカースペース、製品設計チーム、少量生産の事業者を挙げている。11月17日にドイツで開かれた展示会「Formnext 2026」の告知で披露された。\n【詳細】スピンドルの出力は600W、最大回転数は毎分2万4000回。アルミ、真ちゅう、銅の加工に合わせて設計し、条件を整えれば鋼も削れるとうたう。木材、樹脂、炭素繊維、FR4にも対応する。構成は2種類あり、標準版は工具を手で付け替え、「A1S ATC」は12本の工具を自動で交換する。作業範囲は標準版が300×200×130mm、ATC版が300×150×130mm。内蔵カメラで材料の位置を見つけ、プローブで高さと傾きを測る。全軸にボールねじを使い、分解能は0.01mm、スピンドルの振れは0.01mm未満。動作音は70dB未満、外形は500×450×450mm、重さは約40kg。ソフト「Makera Studio」は、材料を指定すると加工条件と刃物の動きを自動で作る。接続はUSBとWi-Fi。オプションは、1回の給油で40時間使えるMQL（最少量潤滑、599ドル）、4軸モジュール（499ドル）、出力5Wのレーザーモジュール（149ドル）。\n【ポイント・注意点】記事にはAIの利用についての記述はない。「鋼も削れる」はメーカーの主張で、条件を整えることが前提とされている。MQLを使うにはエアコンプレッサーが別に必要。ATC版を選ぶと作業範囲のY方向が200mmから150mmに狭くなる点も確認しておきたい。予約は同社の通販サイトで受け付けている。","2026-11-20","FabScene","https://fabscene.com/new/news/makera-a1s-desktop-cnc-600w-spindle-preorder/"],["STLを寸法の変えられるCADに戻す「mesh2cad」、MCP対応","Emir Mrkaljević氏がMITライセンスで公開したPythonツール「mesh2cad」は、単純な機械部品のSTLに平面や円柱などの基本形状を当てはめ、面を選んで編集できるSTEPの立体に戻す。寸法を名前付きの数値で持つCadQuery、OpenSCAD、FreeCADのスクリプトも書き出す。Prusaの印刷部品6点で検証し、6点すべてを変換できた。AIアシスタントから呼べるMCPサーバーとしても動く。","\n【概要】FabSceneが2026年11月20日に紹介した「mesh2cad」は、三角形の集まりであるSTLを、寸法を変えられるCADデータへ戻すツール。作者はEmir Mrkaljević氏で、PythonパッケージとしてMITライセンスで公開されている。「pip install mesh2cad」で導入できる。\n【背景】ネットで配られる部品の多くはSTL形式で、穴の径や板の厚さを後から変えるのは難しい。mesh2cadは、STEP形式の立体と、寸法を数値で持つスクリプトを作ることで、STLの部品を設計データとして手直しできるようにする。\n【詳細】読み込んだSTLに平面や円柱などの基本形状を当てはめ、面を選んで編集できるSTEPの立体を作る。同時に、CadQuery、OpenSCAD、FreeCADの3種類のスクリプトを書き出す。変換後の穴は1つの円柱の面になり、スクリプトの冒頭に「hole_1_d」などの名前で寸法が並ぶ。「hole_1_d=8」と指定すれば、穴径8mmで作り直せる。3種類のスクリプトは同じ名前を使い、OpenSCAD形式はThingiverseやPrintablesのカスタマイザーで編集できるという。対象は板、ブラケット、箱などの単純な部品と、穴、円周上のボルト穴、長穴、皿穴、角の丸み。検証では、Prusa Researchの「Original Prusa i3 MK3S」の印刷部品6点をすべて変換できた。三角形が最も多い部品（5608面）では、ずれが最大0.22mm、体積誤差が0.39％、処理時間は12.4秒だった。AIアシスタントから呼び出せるMCPサーバーとしても動く。\n【ポイント・注意点】形が合わない場合は無理に面を作らない。元のメッシュとのずれが許容差の4倍か0.1mmの大きい方を超えるか、体積誤差が1％を超えると、スクリプトを書き出さずに理由を示して終わる。人の顔や彫刻のような自由曲面は対象外。変換は手元のパソコンで行われ、データはどこにもアップロードされない。","2026-11-20","FabScene","https://fabscene.com/new/make/mesh2cad-stl-to-step-cadquery-openscad-freecad-parametric/"],["ロックウェル、Emulate3DにOmniverse統合　工場規模で検証","Rockwell Automationは2026年11月19日、シミュレーションソフト「Emulate3D」にNVIDIAのOmniverse、RTX、OpenUSDの技術を統合すると発表した。機械やシステム単体の検証にとどまらず、工場全体の可視化と仮想試運転を支援し、設備を入れる前に問題を見つけられるようにする。決定論的なシミュレーション結果を、AIを使った設計や運用の判断にも活用できるとしている。フィジカルAIタイムズが11月20日に伝えた。","\n【概要】Rockwell Automationは2026年11月19日、シミュレーションソフト「Emulate3D」に、NVIDIA Omniverse、NVIDIA RTX、OpenUSDの技術を統合すると発表した。フィジカルAIタイムズが、Automation Magazineの記事をもとに11月20日に伝えた。\n【背景】Emulate3Dは、機械やシステムの動きをシミュレーションし、制御プログラムを試すためのソフト。製造の現場では、設備を実際に据え付ける前に、仮想の環境で動作を確かめる「仮想試運転」が広がっている。今回の統合は、その対象を個別の機械から、より複雑な工場全体の環境へ広げることを目指している。\n【詳細】Emulate3Dが持つシミュレーションと制御テストの機能に、OmniverseとRTXによる描画、OpenUSDを組み合わせ、工場規模の可視化と仮想試運転を支援する。製造事業者は、設計の初期段階で生産環境をモデル化してテストや最適化を行い、設備を導入する前に問題を見つけられる。Rockwell Automationは、決定論的な結果が得られるシミュレーションを、AIによる設計や運用の判断にも使え、試運転のリスクを下げるのに役立つと説明している。GE Appliancesの先進製造シミュレーションの担当者は、仮想環境でアイデアを早い段階で評価・検証できれば、設計判断の材料が増え、導入への確信を高められるとの見方を示した。関連企業としてTISとNVIDIAが挙げられている。発表文は、個別の機械やシステムだけでなく、より複雑な工場全体の環境を扱うことを目指すとしている。\n【ポイント・注意点】記事は、AIモデルの性能や導入実績は示されておらず、AIは学習や判断の検証に使える基盤として位置づけられていると解説している。発表日のほかに数値の記載はない。CNCや工作機械を含むセルや工場を、据え付け前にどこまで仮想で詰められるかが注目点になる。なお、記事はAutomation Magazineの記事を日本語でまとめたもの。","2026-11-20","フィジカルAIタイムズ","https://physical-ai-times.com/news/66f6a31b5b25/"],["パトライト、苦情情報と熟練者の知見をつなぐ品質AIを運用","パトライトは、20年以上ためてきた苦情・問い合わせの情報と、社内の有識者の知識を自然言語で引ける「PATLITE Quality Link System」を2026年4月に社内で運用し始めた。内田洋行の「Mµgen」を基に、GPTを採用して社内のVPN内で動かす。新製品の設計、ライン設計、品質問題の原因究明に使い、AIの回答はそのまま採用せず人が判断する。フィジカルAIタイムズが11月20日に伝えた。","\n【概要】パトライトは、社内の苦情・問い合わせ情報と、有識者の知識や経験を活用する「PATLITE Quality Link System」を、2026年4月に社内で運用し始めた。品質本部が中心になって構築した。フィジカルAIタイムズが、オートメーション新聞WEBの記事をもとに11月20日に伝えた。\n【背景】同社が20年以上蓄積してきた苦情や問い合わせの情報は部署ごとに分かれ、人の手で扱うには量が多かった。そこで自然言語で質問できる仕組みにした。構想は2023年末に始まり、2024年に概念実証を始め、約2年の検討を経て運用に至った。画像検査の自動化ではなく、過去の顧客情報や熟練者の経験を、設計・生産・品質保証の判断に結び付けることに主眼を置いている。\n【詳細】システムは内田洋行の「Mµgen」を基に構築し、日本語処理の安定性などを考えてGPTを採用した。社内ネットワークのプライベートVPN内で運用し、インターネット検索の機能は外して、社内データを優先して答える構成にした。生産、営業、営業企画などの課長クラス以上やリーダー層、実務担当者が、新製品の設計、ライン設計、品質問題の原因究明などに使う。構築時には、セル結合や画像を含むExcelの読み取り、元データの誤字、新旧情報の混在が課題になり、事実と異なる回答が生じた。そのため、AIの回答をそのまま採用せず、人が判断する運用にしている。社内の用語やルールを理解させる辞書データの追加も進める。品質本部は有識者による定例会を1年以上続け、若手が質問する「教えて！えらい人」も設けて、知識をAIが参照できる文章としてためている。\n【ポイント・注意点】今後は画像、図面、音声への対応を方針として挙げているが、実現済みのものではない。記事は、元データの品質やExcelの構造が回答の精度に影響する点に触れている。加工や設計の現場で、過去の不具合の知識をAIで引く仕組みをつくる際の参考になる事例といえる。記事はオートメーション新聞WEBの記事を日本語でまとめたもの。","2026-11-20","フィジカルAIタイムズ","https://physical-ai-times.com/news/cc4db1e712ae/"],["AWS、ロボットセルの設計をAIで数時間に　コード生成まで","AWSの「Physical AI Production Designer」は、AIエージェントが製品のPLMデータとロボットや治具のモデルから生産セルを組み立て、ロボットとPLCのコードを生成して仮想コントローラ上で検証する。協力メーカーで最大8週間かかっていたセルのプログラミングを、数時間に縮めることを目指す。スループット10％以上の向上などの数字は供給側の試算で、量産での実測は公表されていない。","\n【概要】MachineToolNews.aiは2026年11月19日、AWSの「Physical AI Production Designer」を紹介した。AIエージェントが生産計画を立て、ロボットとPLCのコードを生成し、仮想コントローラ上で検証することで、ロボットセルのプログラミングを数週間から数時間に縮めることを狙う。\n【背景】協力している世界的なメーカーでは、1つのロボットセルのプログラミングに最大8週間かかっていたという。工作機械への部品の出し入れなどを担うロボットセルの立ち上げは、多くの工場で時間のかかる工程になっている。\n【詳細】製品のPLMデータ（部品の形、材料、製造工程）と、ロボットのモデル、治具、エンドエフェクタから仮想の生産セルを作る。AIエージェントが、ロボットへの作業の割り当て、動作の順序、インターロックの要否を決め、結果をロボット用のプログラムとPLCのコードに変換する。コードはエンジニアが確認して承認する。生成したコードは仮想コントローラにつないだ物理ベースのモデル上で動かし、衝突や通信を実機の前に確かめる。繰り返しの量産作業には決まった動きのプログラムを、製品の変更や部品位置のばらつきが多い用途には学習済みの制御方式を使う。後者でも認証済みの安全機能は安全PLCに残す。既存のコントローラを置き換える必要はなく、IEC 61131-3のPLCプログラミング、ロボット各社のコード、PROFINET、OPC UAに対応する。実装例としてKUKA WorkVisual、CODESYS、NVIDIA Isaac Simが挙がっている。\n【ポイント・注意点】協力メーカーの見積もりでは、計画の期間が24カ月から15カ月に縮み、スループット改善で1工場あたり約5000万ユーロの価値があるとされる。ただし、これらは供給側の推定で、根拠や量産での実測は公表されていない。標準的な価格も示されていない。記事は、投資の前に試験導入の結果や統合費用を確かめるよう求めている。","2026-11-19","MachineToolNews.ai","https://machinetoolnews.ai/aws-physical-ai-production-designer/"],["三菱電機が描くAI主体の自律型工場、制御プログラムもAIで","三菱電機は2026年11月18日の「FA Serendie Days」で、FA事業の新ブランド「Serendie Automation」を展開すると発表した。MONOistの前編記事は、2003年からの「e-F@ctory」の次の段階として、AIエージェントとフィジカルAIを柱に据える狙いを紹介する。AIで制御プログラムを作る「MELSOFT Copilot（仮称）」を近く発売する予定で、作ったプログラムはシミュレーターで検証して精度を高める流れを示した。","\n【概要】三菱電機は2026年11月18日に「FA Serendie Days」を開き、FA事業の新しいソリューションブランド「Serendie Automation（セレンディ オートメーション）」を展開すると発表した。MONOistは11月19日、同社FAシステム事業本部の説明をもとに前編記事を掲載した。\n【背景】同社は2003年から、FAとITを統合する「e-F@ctory」を展開し、工場内の情報通信の連携やデータ活用による現場の改善を進めてきた。担当者は、これまでのデータを使った改善を、人が関わりながら自律的に改善を進める段階へ広げる必要があると説明し、その次の一歩としてSerendie Automationを位置づけた。これまでのe-F@ctoryは人が判断して改善する仕組みだったが、次の段階ではAIが主体となって改善を進める工場を描いている。\n【詳細】記事が挙げる主要な技術は2つある。1つは、生産現場の運用やスタッフの業務を支え、判断、実行、結果からの学習というサイクルを回す「AIエージェント」。もう1つは、ロボットや装置の動きを支え、変化に応じた自律的な動作を実現する「フィジカルAI」。3つ目の要素は後編で扱うとしている。開発中のAI支援ツールとして、AIで制御プログラムを作る「MELSOFT Copilot（仮称）」を挙げ、近く発売する予定だとした。作ったプログラムはロジックシミュレーター「MELSOFT Mirror」で検証し、3Dシミュレーター「MELSOFT Gemini」で現場での確認などを行う。その結果をCopilotに戻すことで、プログラムの精度を高める流れを紹介している。\n【ポイント・注意点】MELSOFT Copilotは仮称で、発売時期は「近く」とされるにとどまる。AIが作った制御プログラムを、2種類のシミュレーターで確かめてから現場に出す流れが示された点が要点になる。三菱電機はCNCも手がけており、工作機械まわりの設備でこうした流れがどう使われるかが今後の注目点だ。","2026-11-19","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/19/news045.html"],["コマツ油機開発センター、設計知識7500件を生成AIで活用へ","コマツ油機開発センターは、熟練設計者の知識をためて共有するナレッジデータを整え、2022年に本格運用を始めた。登録数は約7500件、関連する技術資料は約1万1000件にのぼり、設計時の検索や過去の不具合の確認に使っている。このデータを土台に生成AIの活用にも取り組む。フィジカルAIタイムズがMONOistの記事をもとに11月19日に伝えた。生成AIの具体的な機能や効果の数値は示されていない。","\n【概要】コマツ油機開発センターは、熟練設計者の知識をためて共有するナレッジデータを整え、2022年に本格運用を始めた。ためたデータは設計時の検索や過去の不具合の確認に使われ、生成AIの活用にも取り組んでいる。フィジカルAIタイムズが、MONOistの記事をもとに2026年11月19日に伝えた。\n【背景】設計の現場では、熟練者の知識をどう引き継ぐかが課題になっている。同センターは2020年ごろにナレッジデータの構築を始め、2021年に基本的な枠組みを整えた。熟練設計者を中心に約3年かけて設計の知識を整理・登録し、2022年に本格運用に入った。登録したナレッジは、設計変更のときの注意点や、過去の不具合への対応例を探す場面で使われている。生成AIの利用は、こうしてためたデータを基盤として進められている。\n【詳細】現在の登録数は約7500件、関連する技術資料のファイルは約1万1000件にのぼる。ナレッジには機能、構造、不具合などのタグを付け、関連する製品や技術資料へのリンク、評価の情報を結び付けている。設計者は、過去の不具合と設計標準を関連付けて確かめられ、設計変更のときの注意点や過去の対応例を探すのに使う。利用者からは、必要な知識を探しやすくなったこと、経験の浅い設計者も過去の事例を参照できることが評価されている。データの整備はExcelで始まり、その後、コマツ社内のOffice 365の環境に合わせて、プログレス・テクノロジーズの支援を受けて検索と登録の仕組みを作った。検索にはPower BIなどを使っている。\n【ポイント・注意点】ためたデータを基盤に生成AIの利用にも取り組んでいるが、記事では生成AIの具体的な機能や導入効果の数値は示されていない。記事は、生成AIを単独で入れるのではなく、熟練者の知識を分類し、設計標準や不具合、関連資料とつながったデータとしてためている点を特徴として挙げている。また、確認できるのはナレッジ基盤の運用と利用者の評価までで、生成AIの実装範囲や生産性向上の量は確かめられないとも指摘している。","2026-11-19","フィジカルAIタイムズ","https://physical-ai-times.com/news/cbdfe89c02b7/"],["三菱電機、FA新ブランド発表　AIで「自律操業」目指す","三菱電機は2026年11月18日、FAシステム事業の新ブランド「Serendie Automation」を立ち上げると発表した。AIと制御技術をつなぎ、製造業の経営課題を解く「自律操業ソリューション」を目指す。工場運営を支えるAIエージェント、機械やロボットの動きを支えるフィジカルAI、データ共創基盤「Serendie Automation MAPs」の3要素で構成する。パートナー制度も「Serendie Automation Partners」に改めた。","\n【概要】三菱電機は2026年11月18日、FAシステム事業の新たなソリューションブランド「Serendie Automation（セレンディ オートメーション）」を立ち上げると発表した。ビジネス+IT（Seizo Trend）が同日に報じた。AIと制御技術をつなぎ、製造業の経営課題を解く「自律操業ソリューション」の実現を目指す。\n【背景】同社は2003年に発表したFA-IT統合ソリューション「e-F@ctory」で培ったFA機器と制御技術、FAとITの連携、現場改善の知見を受け継ぎ、デジタル基盤「Serendie」を使って進化させるとしている。背景には、労働力不足、熟練技能の継承、需要変動への対応、脱炭素化など、製造業の課題が複雑になっていることがある。\n【詳細】ブランドは3つの要素で構成する。1つ目は、工場の運営やスタッフの業務を支える「AIエージェント」。2つ目は、環境の変化に応じた機械やロボットの動作を支える「フィジカルAI」。3つ目は、データをAI活用へ導く「Serendie Automation MAPs」で、データ共創基盤としてブランドの中核に位置づける。MAPsは、AIアプリケーションの提供、ユーザーとベンダーの共創、データ基盤の構築の場になるという。パートナー制度も改め、これまでの「e-F@ctory Alliance」は「Serendie Automation Partners」に変わる。「AI・テクノロジー」「ソリューション」「インテグレーション」の3つのカテゴリーを設ける。同社は2026年7月にも、ソニーセミコンダクタソリューションズと、製造現場の自動化・無人化を支援する新会社の設立を発表していた。\n【ポイント・注意点】今後はグローバルスローガン「Automating the World」のもと、関連する製品やソリューション、導入後の継続的な改善支援を広げるとしている。記事は会員限定で、2030年度の売上目標などを扱う後半は無料部分に含まれない。同社のCNCや工作機械向けの具体的な展開は、今後の発表を待つ必要がある。","2026-11-18","ビジネス+IT（Seizo Trend）","https://www.sbbit.jp/article/st/188552"],["Google、ロボットアームをAIで立ち上げ制御するプラグイン","Googleは2026年11月17日、開発ツール「Google Antigravity」向けに「Robotics」プラグインを公開した。安価な6軸アーム「SO-ARM101」など3機種を対象に、USB接続からドライバー導入、校正、シミュレーター「MuJoCo」での試行、Geminiの空間認識を使った制御までをAIエージェントに任せる。開発者ブログの例では、立ち上げが約10分で終わった。コードはApache License 2.0で公開されている。","\n【概要】Googleは2026年11月17日、開発ツール「Google Antigravity」向けの「Robotics」プラグインを公開した。ロボットアームの立ち上げから制御までをAIエージェントに任せる。FabSceneが11月18日に報じた。コードはGitHubでApache License 2.0のもとで公開されている。\n【背景】対応するのは、安価な6軸アーム「SO-ARM101」、I2RTの「YAM」、Frankaの双腕セル「FR3 Duo」の3機種。プラグインはGeminiが使う「スキル」の集まりで、前の週に発表されたモデル「Gemini 4 Hydrogen」の利用を想定している。\n【詳細】役割は4つある。1つ目は立ち上げで、USB接続からドライバーの導入、カメラの検出、アームの校正、安全な動作の確認までを行う。2つ目は、物理シミュレーター「MuJoCo」で仮想の作業場を作り、実機の前に試すこと。3つ目は、Geminiの空間認識で物体を見つけ、つかみ方を決め、カメラの映像を見ながら制御すること。4つ目は、コントローラーとシミュレーションをまとめたアプリケーションの作成。開発者ブログの例では、YAMと深度カメラをノートパソコンにつないで立ち上げを頼むと、約10分で導入から校正、試し動作まで終わった。ベルトコンベヤーを流れる菓子をアームで箱に仕分ける作業をMuJoCoで確かめ、実機で約1時間、安定して動かせたという。同社によると、Hydrogenは6軸アームで飲み物を注ぐなど8つの作業の外部評価で58点を取り、Gemini 4 Argonと同じ程度の成績を、より低いトークン単価で出した。\n【ポイント・注意点】Antigravityは有料の「Google AI Pro」または「Google AI Ultra」の契約者が使える。プラグインは設定画面から入れられるほか、GitHubから取得できる。画像認識を呼ぶスキルにはGemini APIのキーが要る。READMEは、ロボットが人にけがをさせたり機器を壊したりするおそれがあるとして、そばを離れず、すぐ電源を切れるようにすることを求めている。","2026-11-18","FabScene","https://fabscene.com/new/news/google-antigravity-robotics-plugin-so-arm101-mujoco/"],["オープンソースの卓上ミル「Piccola CNC」、Kickstarter開始","ドイツのInMachinesによるオープンソースの3軸卓上ミル「Piccola CNC」が、2026年11月17日にKickstarterで公開された。公開当日の時点で37人が計5万8199ユーロを支援した。機種はBasic、Pro、Ultimateの3種類で、小売価格は1499〜2499ユーロ。切削範囲は150×150×70mmで、アルミや真ちゅう、PCBを削れる。キャンペーンは12月15日まで、納品は2027年7月の見込み。","\n【概要】ドイツのInMachinesが手がけるオープンソースの3軸卓上ミル「Piccola CNC」が、2026年11月17日にKickstarterで公開された。Makers101が報酬の価格や未確定の点をまとめている。公開当日の太平洋時間14時55分の時点で、37人が計5万8199ユーロを支援した。\n【背景】卓上CNCのクラウドファンディングは増えており、記事も比較対象としてToolDance X1（1500W、2999ドル）やNestWorks C500（約6000ドル）に触れている。Piccola CNCは、小さな切削範囲とオープンソースのソフト構成で入門層を狙う機種といえる。\n【詳細】機種は3種類。Basicは100W・24Vのブラシ付きモーターで毎分2万回転、枠がむき出しの構造で、小売は1499ユーロ。Proは200W・48Vで毎分1万2000回転、扉と連動して止まる安全機能とLED照明付きの全面カバーを備え、小売は1999ユーロ。Ultimateは200W・48Vのブラシレスで、XYの原点検出、中心検出、3Dスキャン機能を加え、小売は2499ユーロ。共通の仕様は、切削範囲150×150×70mm、ベルト駆動の1204ボールねじ、ER11コレット、最大送り毎分2000mm、USB-CとWi-Fiの接続。加工対象はアルミ、真ちゅう、銅、PCBのほか、木材とプラスチック。ソフトはCAMと機械制御を一体化し、PCBにはEasyTrace5000、2D・3D・ロータリー加工にはKiri:Motoを使う。どちらもオープンソース。Founder Editionは全機種で計40台に限られる。\n【ポイント・注意点】記事にはAI機能の記載はない。繰り返し精度などの数値はメーカーの主張で、CEマークなどの認証は最終段階、米国の認証は進行中とされる。キャンペーンは2026年12月15日まで、納品は2027年7月の見込みで、到着時期は変わりうる。Early Birdの報酬は1091ユーロからで、VATと送料は別。","2026-11-17","Makers101","https://makers101.com/piccola-cnc-kickstarter/"],["KiCadを同時編集できる派生版「Junction」、AIがMCPで提案","基板設計ソフト「KiCad」の派生版「Junction」は、複数人が同じ回路図や基板を同時に編集できるツールだ。作者はNathan氏で、ライセンスはKiCadと同じGPL-3.0。KiCad 6〜10のプロジェクトを開け、デスクトップ版とブラウザー版がある。サーバーはAIアプリから操作する規格「MCP」に対応し、ClaudeやChatGPTが設計を読んで変更を提案できる。提案を採るかどうかは人が決める。","\n【概要】FabSceneが2026年11月17日に紹介した「Junction」は、オープンソースの基板設計ソフト「KiCad」の派生版で、複数人が同じ回路図や基板を同時に編集できる。作者はNathan氏（GitHubアカウント名notaroomba）で、ライセンスはKiCadと同じGPL-3.0。\n【背景】作者はHacker Newsへの投稿で、友人と基板を作るために自作したと説明している。READMEによると、KiCadの外部連携では、プラグインが変更を相手に送れず画面にも描けないため、派生版という形にした。2026年8月30日に「KiCad Collaborative」の名前で1.0.0を公開し、11月13日の2.0.0で今の名前に変えた。\n【詳細】JunctionはKiCadのソースを元に、回路図と基板のエディターに共同編集の機能を組み込んだ。同じプロジェクトを開いた人同士で、名前付きのカーソル、選んでいる部品、描きかけの配線が互いに見え、確定した編集はすぐ全員に反映される。部品に固定するコメントや、30日前までさかのぼれる履歴もある。macOS、Windows、Linux向けのデスクトップアプリと、インストール不要のブラウザー版があり、GitHubアカウントでサインインする。ファイルはKiCad形式のまま、KiCad 6〜10のプロジェクトを開ける。デスクトップ版は接続が切れても作業を続けられる。編集がぶつかったときは、サーバーが1件ずつ受け付けて番号を振り、その順で反映する。AIとの連携では、サーバーがMCPに対応し、ClaudeやChatGPTなどが設計中のプロジェクトを読んで変更を提案できる。\n【ポイント・注意点】作者は、AIが作った基板には人の確認が必要で、デモ動画の基板は発注も通電もしていないと断っている。同じ部品の同じ項目を同時に書き換えた場合は後の値が残る。インストーラーはGitHubの「JunctionEDA/junction」で公開され、自分でサーバーを立てて使うこともできる。基板を自作のCNCで削る人にとっても、設計の段階でAIの提案を受ける道になる。","2026-11-17","FabScene","https://fabscene.com/new/make/junction-kicad-fork-real-time-collaboration-browser-mcp/"],["Formnext 2026初日、新型金属機やAIとAMの議論","Engineering.comは2026年11月17日、ドイツで開かれたFormnext 2026の初日をライブ配信から振り返った。Nikon SLM Solutionsは量産向けの金属3Dプリンター「MACHX」シリーズを、Stratasysは造形容積34.2リットルの「H550」を発表した。パネルでは、2026年上半期に米国への金属造形機の輸入が64％増えたとの報告があり、RenishawからはAIとAMは競合でなく整合するとの見方が出た。","\n【概要】Engineering.comのIan Wright氏は2026年11月17日、Formnext 2026の初日を、現地ではなくライブ配信で追った記事を掲載した。Industry & Application Stageの配信をもとに、製品発表とパネルの議論をまとめている。\n【背景】Formnextは積層造形（AM）を中心とする製造技術の展示会。記事は、聞けなかったTechnology Stageの講演も紹介しており、その中にはOnshapeのDavid Nguyen氏による「Text-to-Code-to-CAD」や、3D Systemsのchuck Hull氏らによる3Dプリンティングの40年史が含まれる。\n【詳細】Nikon SLM Solutionsは、量産向けの金属3Dプリンター「MACHX」シリーズを発表した。造形サイズはMACHX 450が450×450×450mm、450Cが450×600×450mm、450Eが450×450×1000mm。450Eはロケットエンジンの燃焼室のような背の高い部品向けとされる。レーザーは最大8kWで、複数台を1つの生産セルとして動かせるという。StratasysはSAF方式の新機種「H550」を発表した。造形容積は34.2リットル、長軸は450mmで、同等の方式と比べて総所有コストを最大30％下げられると主張する。自動の粉末処理装置「PowderEase T2」は、1台で同じ材料のH550を最大6台まで支え、1回の造形あたりのオペレーター作業は30分未満とされる。パネルでは、Wohlers AssociatesのMahdi Jamshid氏が、2026年上半期の米国への金属造形機の輸入が64％増え、樹脂機の輸入の77％が中国からだと報告した。\n【ポイント・注意点】RenishawのRainer Lotz氏は、AIとAMは競合ではなく整合的だとの見方を示した。英国MTCの登壇者は、英国のサプライチェーンに「鶏と卵」の問題があると述べた。記事は配信をもとにした報告で、筆者は現地にいなかった。コスト削減などはメーカーの主張で、Pitchnextの優勝者は後日発表とされている。","2026-11-17","Engineering.com","https://www.engineering.com/formnext-2026-day-1-recap/"]],"cricut":[["Cricutのペンで封筒に宛名書き、A7封筒も自作","Jennifer Makerが、Cricutのペン機能で手作りの封筒に宛名を書く手順を公開した。無料のデザイン#851には誕生日・クリスマス・雪の結晶の3柄があり、折り筋の刻みの有無で2版、ほかのカッターや手切り用のDXF・PDF版もある。仕上がりはA7サイズの7.25×5.25インチ。12×12インチの65ポンド白カードストック1枚で作れ、費用の目安は1ドル、所要時間は準備10分と作業15分、難易度は「やさしい」としている。","\n【概要】クラフトブログJennifer Makerが、Cricutで装飾封筒を切り抜き、同じ機械のペンで宛名と差出人を書き込む方法を紹介した。手書きが苦手でも、筆記体の宛名をきれいにそろえられるという趣旨の記事だ。\n【背景】カッターマシンには刃の代わりにペンを付けて線を描く機能がある。年末のカードや招待状が増える時期で、封筒づくりと宛名書きを1台でこなす使い方を、作例と型紙付きで示している。\n【詳細】使うのは無料のデザイン#851で、メールで登録する素材集から入手する。誕生日、クリスマス、雪の結晶の3柄があり、折り筋を刻む版と刻まない版、ほかのカッターや手切り用のDXF版・PDF版が入っている。仕上がりはA7の7.25×5.25インチ。雪の結晶のファイルは11.92×11.45インチで、土台と三角の側面2枚を切ってから貼り合わせる。材料は12×12インチの65ポンド白カードストック1枚、緑のStandardGripマット、Fine Pointの0.4mmペン、0.8mmのラメ入りゲルペン、1.0mmのゲルペン、精密のりなど。機械はMaker系（筆者はMaker 4）のほか、ExploreやVentureでもよい。文字は宛名をサイズ45、住所を26にし、有料の筆記体フォントDear Agatha 2を使った。無料の代わりにBaldiveを挙げている。差出人には無料のJM Tallを50と30で使う。設定はカードストックの「Medium（80ポンド／216gsm）」に圧を強めの「More」、カットはPremium Fine-Point Blade、ペンはクランプAに差す。\n【ポイント・注意点】組み立てでは点線か刻んだ筋で折り、スクレーパーで折り目をはっきりさせてから、側面のつまみと底のふたをのりで留める。よくある質問では、水性マーカーはにじむことがあると注意し、宛名の上に透明のつや消しテープを貼る方法を勧めている。費用の目安は1ドル、所要時間は準備10分と作業15分、難易度は「やさしい」。筆記体フォントを無料の代わりに変えると、見た目の印象も変わる。","2026-11-21","Jennifer Maker","https://jennifermaker.com/how-to-address-envelopes-with-a-cricut/"],["印刷して切るだけ、Cricutでメモ帳を自作","Angie Holdenが、CricutのPrint Then Cut（印刷してから切る機能）でメモ帳を作る手順を紹介した。Canvaの無料テンプレートでアーチ形の表紙を作り、PNGで取り込んで幅4インチにそろえると、8.5×11インチの紙に2枚並ぶ。30枚つづりなら印刷は15枚。切った紙と台紙を重ねてクランプで挟み、綴じ用の接着剤を塗ると、市販品のように1枚ずつはがせるという。初代Cricut Joyでは作れない。","\n【概要】The Country Chic CottageのAngie Holdenが、Cricutで印刷と切り抜きを組み合わせ、オリジナルのメモ帳を作る方法を公開した。アーチ形の上辺に「From the Desk of」と入れたデザインで、贈り物にも向く小物だ。\n【背景】Print Then Cutは、家庭用プリンターで印刷した紙をCricutが読み取って輪郭どおりに切る機能だ。初代Cricut Joyを除く機種で使える。筆者は、Explore Air 2のような古い機種は色付きの紙だと位置合わせの印を読みにくいことがある、と書いている。\n【詳細】材料はCricut、プリンター、コピー用紙より厚い紙、ブレイヤー（ローラー）、メモ帳用の綴じ剤、クランプ、使い捨てのはけ、チップボードかクラフトボード。まずリンク先の無料テンプレートを使ってCanvaでデザインし、PNGで書き出す。次にDesign Spaceの白紙のキャンバスに取り込み、背景をクリックして消し、種類は「Flat Graphic」を選ぶ。縦横比を固定したまま幅4インチにすると、8.5×11インチの紙に2枚入る。印刷では部数を2にし、1枚目のマットに1つ移して回転させ、背景に色があるので「Bleed（塗り足し）」をオンにする。30枚つづりなら印刷は15枚。切るときは細字用の刃を使い、紙は矢印を左上にしてマットに置く。筆者は紙を丸めないよう、紙ではなくマットのほうを曲げてはがす。台紙はデザインを複製して通常のカットに切り替え、クラフトボードの設定で切る。\n【ポイント・注意点】組み立てでは、紙と台紙を重ねて上下を板で挟み、綴じる辺を少し出してクランプで留める。まっすぐな辺に綴じ剤を薄めから中くらいの厚さで塗り、台紙と全ページにかかるようにして、乾くまで挟んでおく。綴じ剤はすぐ乾くので、少量で足りるという。アーチ形の上辺でははがしにくいので、筆者は左の辺で綴じた。できあがりは、市販のメモ帳のようにめくって1枚ずつ切り取れる。価格は書かれていない。","2026-11-20","The Country Chic Cottage","https://www.thecountrychiccottage.net/custom-notepads-with-cricut/"],["ハンドメイド品をEtsyで売る、店の開き方入門","Angie Holdenが、手作り品やデジタル商品をEtsyで売りたい人向けに、店の開き方をまとめた。Etsyは買い手が最初から集まり、出品がGoogleの検索にも出やすい。一方で手数料が高めで競争が激しく、筆者は「EtsyにはAIが多い」とも書く。出品には加工していない実物写真が少なくとも1枚必要だとし、価格には材料や包装、手間、手数料を含めるよう勧める。最初は5〜10品の出品から始めるのがよいという。","\n【概要】The Country Chic CottageのAngie Holdenが、Etsyで店を始めるための初心者向けガイドを公開した。カッターマシンの操作手順はないが、Tシャツなど自作の品を売りたい人に向けた実務の手引きになっている。\n【背景】カッターマシンやレーザーで作った品を売る人は多い。筆者はまず、Etsyが手作りの商売に合うかどうかを考えるよう勧める。長所は、最初から買い手がいること、Etsy自身が宣伝してくれること、出品がGoogleの検索に出やすいこと。短所は、手数料が高めなこと、競争が激しいこと、店の売れ行きがEtsy内の検索に左右されることだ。「EtsyにはAIが多い」とも指摘している。\n【詳細】売れる種類として、手作りの品、デジタル商品、クラフト材料、ビンテージ品を挙げる。オリジナルTシャツを例に、作り置きの在庫と受注生産の違い、送料と包装も説明している。開店の手順は、アカウントを作って「Sell on Etsy」を押し、言語・国・通貨を選び、使えて幅を狭めすぎない店名を決め、支払い・税・住所に加えて、送料・返品・発送までの日数の方針を入れる。出品について筆者は、記事の時点で、本物の背景に実物が写った加工なしの写真が少なくとも1枚必要だと書く。タイトルとタグと説明には、つかみ、品物の由来、使い方、手入れを入れるとよい。価格には材料、包装、インク、ラベル、テープ、作業時間、Etsyの手数料を含める。手数料は出品料、取引手数料、決済手数料の3種を挙げているが、金額は書いていない。\n【ポイント・注意点】最初は5〜10品の出品から始め、メール読者やSNSのフォロワーに知らせ、店のトップページの見た目もそろえるよう勧める。よくある失敗は、安すぎる値付け、写真の質の低さ、検索対策をしないこと、方針が分かりにくいこと。記事には2ページの無料の販売計画表と、有料のキーワード調査ツールへのリンクがある。ツールには無料の試用期間と20%の割引コードが付く。手数料の金額は自分で確かめてから値付けしたい。","2026-11-20","The Country Chic Cottage","https://www.thecountrychiccottage.net/start-an-etsy-store/"],["「Comfy Cozy」文字のパーカー、無料SVGと発泡ビニール","The Crafty Blog Stalkerが、「Comfy Cozy」の文字を発泡するアイロン転写ビニールでパーカーに付ける作り方を、無料SVG付きで紹介した。図案は幅11.5インチ・高さ7.86インチにし、首元から3〜3.5インチ下に置く。290°Fの中圧で10秒押し、熱いうちに台紙をはがして、クッキングシート越しにさらに5秒押す。難易度は初心者向け、費用の目安は30ドル、所要時間は45分としている。","\n【概要】クラフトブログThe Crafty Blog Stalkerが、無料のSVG「Comfy Cozy」を使い、発泡するアイロン転写ビニール（パフビニール）でパーカーに立体的な文字を付ける手順を公開した。難易度は初心者向け、費用の目安は30ドル、所要時間は45分。\n【背景】パフビニールは、熱を加えると膨らんで立体的な仕上がりになる転写材だ。寒い季節向けの服に文字を入れる作例として、図案の大きさや置く位置、プレスの温度と時間まで数字で示している。\n【詳細】使ったのはベージュのLサイズのパーカーと、Make Marketのパフビニール。道具はCricutのカッター、StandardGripマット、定規、カス取りの道具、HTVRONT Auto Heat Press 2。無料のSVGをCricut Design Spaceに取り込み、最初は幅12インチで試したが、最終的に幅11.5インチ・高さ7.86インチにした。ビニールは約8.5インチ分を使う。図案はパーカーの首元から3〜3.5インチ下に置く。切る前に「Mirror（左右反転）」をオンにし、材料の設定は、ビニールに合えば「Puff Iron-On」を選ぶ。服をまず5秒予熱し、290°Fの中圧（HTVRONTでは約130）で10秒押す。熱いうちに台紙をはがし、クッキングシートをかぶせてさらに5秒押す。\n【ポイント・注意点】裏から5秒押す工程は任意としているが、コツの項では、パフビニールは2回以上押さないよう書いており、記事の中で書き方がそろっていない。フードや縫い目、ポケットはプレス機の板の外に出すこと。ビニールはメーカーごとに性質が違うので、使う製品の説明に従うよう勧めている。記事の最後には、ほかの作者による「冬のぬくもり」系の無料SVG9点へのリンクもある。\nなお、図案は最初に試した幅12インチから少し小さくして、幅11.5インチに落ち着いた。パーカーの大きさによって合う幅は変わるので、型紙を当てて位置と大きさを確かめてから切ると失敗が少ない。","2026-11-20","The Crafty Blog Stalker","https://thecraftyblogstalker.com/comfy-cozy-sweatshirt-cricut/"],["細い線が映える「Festive Cheer」の無料SVG","Crafty Crafterが、クリスマス向けの無料カットファイル「Festive Cheer」を配布した。細い線を生かした簡潔な図案で、基本のカス取りに慣れた人向けとしている。厚手カードストックのタグ、黒いTシャツへの白の転写ビニール、マグへの光沢ビニールなど6つの使い方を挙げる。Cricut Joy・Maker・Exploreのほか、Silhouette Studioでも使える。個人の手作りには無料で登録も不要だが、データの再販と再配布は禁止。","\n【概要】無料のSVG配布サイトCrafty Crafterが、クリスマス向けのカットファイル「Festive Cheer」を公開した。細い線と整った形の簡潔な図案で、転写ビニールやカードストックで切るとシャープに仕上がるとしている。\n【背景】線が細い図案は、切ったあとの不要部分を取り除く「カス取り」の手間が増える。サイトはこのファイルを、基本のカス取りに慣れた人向けと位置づけている。年末に向けて、同サイトはクリスマス柄の無料SVGを続けて出している。\n【詳細】使い方の例は6つ。厚手カードストックのギフトタグを麻ひもで結ぶ、黒いTシャツに白の転写ビニール、陶器のマグに光沢の永久ビニール、木のオーナメントにステンシル用ビニール、クッションカバーにフロッキー転写ビニール、ワイングラスに耐水の永久接着ビニール。オーナメント用の材料にはアクリルの素材、ラメの転写ビニール、転写テープ、重ね貼り用の道具を、衣類用にはアイロン転写ビニール、耐熱テープ、小型のヒートプレス、綿の無地の服を挙げる。手順は、ダウンロードしたファイルを解凍し、Cricut Design Spaceで「Upload Image」から.svgを選んで追加し、大きさを変え、転写ビニールなら左右反転し、マットを入れて画面の指示に従う。ダウンロードは見本画像からGoogleドライブのファイルへつながっている。\n【ポイント・注意点】よくある質問では、Cricut Joy・Maker・Exploreで使え、ベクター形式なので拡大縮小しても荒れないと説明する。Silhouette Studioでも使える。利用条件は、個人の手作りなら無料で登録も不要。手作りの品を贈るのはよいが、データそのものの再販や再配布はできない。サイトは、自前の点検ツール「SVG Doctor」でファイルを確かめるよう勧めている。寸法やファイルの大きさは書かれていない。線が細いので、小さく縮めすぎるとカス取りがさらに難しくなる点に気を付けたい。初めてなら、大きめの寸法で試すとよい。","2026-11-20","Crafty Crafter","https://crafty-crafter.club/christmas/festive-cheer-svg-for-cricut/"],["Cricutのシール印刷機、初の値下げとセール一覧","Popular Scienceが、Amazonのブラックフライデーで値下げされたCricut製品をまとめた。10月にレビューしたシール用の印刷・カット機「StickerPix Print + Cut」は、基本セットが299ドルから249ドルになった。4×7インチのシートに印刷し、刃で台紙を残して切る。ほかにMaker 4が579ドルから474ドル、Joy Xtraが179ドルから129ドルなど。終了日は書かれていない。","\n【概要】米Popular ScienceのStan Horaczekが、Amazonのブラックフライデーで安くなったCricut製品を紹介した。中心は、筆者が10月にレビューし、その後もたくさんのシールを作ってきたというシール用の印刷・カット機「StickerPix Print + Cut」だ。記事は、この機種が初めて値下げされたと伝えている。\n【背景】StickerPix Print + Cutは4×7インチのシートに印刷し、刃で台紙を残して切る（キスカット）機械だ。筆者は、準備が10分かからず、食洗機にかけても残ったシールがあったと書く。一方で、Cricut純正の紙とインクのパックしか使えない。同誌の「PopSci Proven」賞を受けている。\n【詳細】価格はAmazon、元の値段はかっこ内。StickerPix Print + Cutの基本セットは249ドル（299ドル）。刃がなく、切り込み済みのシートを使い、4×6の写真も刷れるStickerPix Printは119ドル（169ドル）。カッターはJoy Xtraが129ドル（179ドル）、Joy 2の上位セット（コーラル／ブルー）が146ドル（209ドル）、Maker 4が474ドル（579ドル）。Explore 5の基本セットはデジタル素材付きが199ドル（249ドル）、虹色の素材見本付きが219.99ドル（299.99ドル）。Cricutによると、Explore 5は前の機種より30%小さい。熱プレスは、EasyPress Miniのラズベリー色が39ドル（49.99ドル）、6×3の同機が49ドル（69ドル）、AutoPress 2の12×12が199ドル（249ドル）。材料では、13インチ×5フィートの赤のSmart Permanent Vinylが6.99ドル（9.99ドル）、ビニールのシール用紙25枚が9.09ドル（12.99ドル）、黒のValue Cardstockが6ドル（11.99ドル）。\n【ポイント・注意点】セールの終了日は書かれておらず、筆者は「今のうちに買いそろえて」と勧める。StickerPixは純正の消耗品しか使えないので、本体価格に加えて紙とインクの費用も考えておきたい。価格は掲載時点のもので、変わることがある。","2026-11-20","Popular Science","https://www.popsci.com/gear/cricut-sticker-cutting-machine-supplies-black-friday-amazon-deals/"],["Silhouette Studioで写真の背景を消す2つの方法","Silhouette Schoolが、ほかのアプリを使わずにSilhouette Studioだけで写真の背景を消す2つの方法を解説した。1つ目は、トレース機能でしきい値を調節して人物の輪郭を拾い、「Trace and Detach」で切り離す方法で、白い壁と茶色の髪のように色の差がはっきりした写真に向く。2つ目は、曲線を描く道具で被写体を手で囲み、「Crop」で外側を消す方法で、背景が込み入った写真に向く。顔の大きな切り抜きやシール作りに使える。","\n【概要】Silhouette製品の解説ブログSilhouette Schoolが、Silhouette Studio（記事の対象はV4.4）で写真の背景を消す2つの方法を紹介した。筆者は、顔を大きく切り抜いて棒に付ける応援用の飾りに使っていて、写真ブースの小道具やオリジナルシールにも向くとしている。\n【背景】カッターで写真の人物を切り抜くには、背景を消して輪郭の切り線を作る必要がある。別の画像アプリを行き来せずに、Studioの中で済ませる方法として、写真の性質に応じた2つのやり方を並べている。\n【詳細】1つ目はトレースで切り離す方法。トレースの画面を開き、しきい値のバーを動かして、残したい範囲が塗りつぶされ、外側に黄色が出ない状態にする。外に黄色が残ると、余計な切り線が増える。白い壁に茶色の髪のように、色の差がはっきりした写真に向く。「Trace and Detach」を押すと、なぞった範囲の周りに切り線ができて切り抜かれ、不要な背景を引き離せる。作例では頭部だけをなぞった。2つ目は曲線を描く方法で、背景が込み入っていたり、色の差が小さかったりする写真に使う。「Draw a Curved Shape」の道具で被写体の縁を点を打ちながら囲み、出発点に戻ると線が閉じる。描いた線と画像を選び、「Modify」の画面で「Crop」を押すと、線の外側が消える。画像をダブルクリックすると点を直せる。筆者はあごの近くの点を動かして、黒い縁を取り除いた。\n【ポイント・注意点】髪、あご、耳の周りは特に丁寧に囲むよう勧めている。背景を消してからレーザーで切り、UVプリンターで刷るまでの流れは、YouTubeの動画で見られる。記事には有料講座Silhouette Uの案内があり、コード「YOUTUBE」で50%引きになる。アフィリエイトのリンクを含む。記事のURLには「2026/04」とあるが、ページに表示された日付は11月19日だ。色の差がはっきりした写真なら1つ目、込み入った写真なら2つ目、と使い分けるとよい。","2026-11-19","Silhouette School","https://www.silhouetteschoolblog.com/2026/04/how-to-remove-background-in-silhouette.html"],["感謝祭の食卓をCricutで、席札・マット・ランナー","Cricut公式ブログが、感謝祭の食卓を6つの段階で整えながら、各段階で作れる小物を紹介した。席札はカードストックを切り、名前を「Draw（描く）」にしてカードの形に結び付け、折る場合は折り筋の線を足す。布のマットやテーブルランナーにはアイロン転写の文字やステンシルを使い、子ども用には塗り絵のマットをペンで描く。大人用の布マットは12×18インチから始めるのがよいという。","\n【概要】Cricut公式ブログのBeth Batyが、感謝祭の食卓づくりを順を追って説明し、それぞれの段階でCricutで作れる小物を紹介した。席札、ランチョンマット、テーブルランナーが中心で、仕上げ方の例としてクラシックな素朴風、ファームハウス風、青と白の3つを挙げている。\n【背景】食卓の準備は6段階。ランナーかテーブルクロス、マットと皿、皿とカトラリーの配置（ナイフの刃は皿側に向ける）、グラスとグラスタグ、席札、センターピースの順だ。それぞれに手作りの品を足していく流れになっている。\n【詳細】席札はカードストックを切る。Design Spaceで名前を「Draw」に設定してカードの形に結び付け（Attach）、二つ折りなら「Score（折り筋）」の線を足す。マットは布にアイロン転写ビニールで飾るか、紙で切る。子どもの席には、対応するCricutのペンで描いた塗り絵のマットを用意し、機械が描ける範囲に収まる大きさにする。テーブルランナーにはアイロン転写の文字を付けるか、切ったステンシルと布用絵の具で柄を入れる。絵の具は端切れで試してから塗る。ナプキンの帯とグラスタグは、余ったカードストックで切れる。グラスに永久ビニールを貼るときは、口の縁より下にし、食べ物が触れる面を避ける。材料にはカードストック、アイロン転写ビニール、永久ビニール、市販の木の素材を挙げる。薄い木を切ったり彫ったりするにはCricut Makerが必要だとしている。\n【ポイント・注意点】アイロン転写ビニールは、切る前に左右反転をオンにすること。熱の設定はここには書かず、Cricut Heat Guideを見るよう案内している。よくある質問では、大人用の布マットは12×18インチから始め、紙のマットは機械の切れる範囲と描ける範囲を確かめるよう勧める。機械と刃はMaker、Explore、Joy、Joy Xtraと、細字用の刃と回転刃を挙げ、ピンクの布用マットは回転刃専用だとしている。余った材料も小物に回せる。","2026-11-19","Cricut","https://cricut.com/blog/thanksgiving-crafts-with-cricut/"],["xTool OmniのUV印刷、1回の作業でインク方式を重ねる","Silhouette Schoolが、UVプリンターxTool O1 Omniで、図案の層ごとに違うインク方式を選んで重ね、自分なりの刷り方を作る方法を解説した。公式には対応していないが、回避策で可能だという。作例はタイルのコースターで、白→カラー→ニスの方式に、複製した層のつや出しニス2層を重ねてつやを強めた。透明アクリルの表と裏に別の絵柄を刷る方法にも触れている。","\n【概要】Silhouette Schoolが、xToolの平台型UVプリンターO1 Omniと専用ソフトxTool Studioで、1回の作業の中で層ごとにインク方式を変えて重ねる方法を紹介した。公式には対応していないが、回避策で実現できるとしている。\n【背景】Omniでは層ごとにインクの方式を選べる。基本は3つある。白や薄い色の素材には「カラーのみ」。透明か濃い色の素材には、先に白を刷る「白＋カラー」。透明アクリルの裏に刷って表から見るときは、順番を逆にした「カラー＋白」。盛り上げ印刷の「白→カラー→ニス」は、つや出しニスで泡が出るのを防ぐのに役立つ。ただしこの方式では層の数を変えられないので、筆者は層を重ねて対応した。\n【詳細】作例は、陶器のタイルに刷るクリスマス柄のスペイン風タイルのコースター。図案はSo Fontsyのもの。手順は、UV平台のモードで台を読み取り、画像を取り込んで素材の上で大きさを合わせる（スマートマスクは任意）。層を選んで盛り上げの「白＋カラー＋ニス（光沢）」にし、出てくる注意の表示は無視する。次に画像を複製し、複製した方だけを「ニス（光沢）」の2層にする。こうすると、決まった方式より強いつやが出る。透明アクリルの表と裏に別の柄を刷る場合は、インクの順番が逆の2つのカラー層の間に白を挟み、位置をぴったり合わせて刷る。\n【ポイント・注意点】置く位置の型やグループ化のやり方は、Silhouette Uの動画（宿題50.2）で解説しているという。続編として、アクリルのレーザー切断、両面刷りの設定、まとめての名入れの3回シリーズを予定している。価格は書かれておらず、記事にはOmniへのアフィリエイトのリンクとその旨の表示がある。公式に対応していない使い方なので、試し刷りで仕上がりを確かめてから本番に進みたい。\n層を重ねる考え方は、つや出し以外にも応用できる。決まった方式で層の数を変えられないときに、複製した層で補うという発想で、両面刷りも同じ仕組みの延長にある。","2026-11-18","Silhouette School","https://www.silhouetteschoolblog.com/2026/11/how-to-print-different-uv-ink-modes-in.html"],["北極風レトロなサンタのラベル、無料のSVG","Crafty Crafterが、赤と白でまとめたレトロ調の「North Pole」ラベルの無料SVGを配布した。Cricut Joy・Maker・Exploreで使え、ベクター形式なので大きさを変えても荒れない。Silhouette Studioは上位版ならSVGをそのまま、標準版ではDXF版を使う。カードストックのタグ、黒Tシャツへの白の転写ビニール、マグのデカールなどを作例に挙げる。個人の手作り用で、データの再販と再配布はできない。","\n【概要】無料のSVG配布サイトCrafty Crafterが、ビンテージ風の「North Pole（北極）」ラベルのカットファイルを公開した。赤と白の配色でサンタの世界観をまとめた図案で、ベクター形式のSVGで配布している。\n【背景】同サイトは、クリスマスに向けて無料のSVGを続けて出している。ラベル型の図案は、タグや封筒、缶など、贈り物まわりの小物に貼りやすいのが利点だ。今回はレトロ調の一枚で、紙と永久ビニールの両方について材料の例を細かく挙げている。\n【詳細】ダウンロードは見本画像からGoogleドライブのファイルへつながる。よくある質問では、個人の手作りなら無料で、登録は不要。Cricut Joy・Maker・Exploreで使え、ベクター形式なので大きさを変えても画質が落ちないという。手順は、フォルダーを解凍してから取り込むこと。Design Spaceで「Upload」を押してSVGを選び、大きさを変える。アイロン転写ビニールでは、「Make It」の前に左右反転する。Silhouette Studioは、上位版のDesigner EditionならSVGをそのまま読み込め、標準版ではDXF版を使う。紙で作る場合の材料は、80ポンドの厚手カードストック、精密切り用のマット、ボーンフォルダー、粘着の強い転写テープ。永久ビニールなら、Oracal 651の粘着ビニール、転写テープ、こすって圧着するスクレーパー、アルコールのふき取りシート。\n【ポイント・注意点】作例には、重ね貼りのカードストックのギフトタグ、黒いTシャツや帆布の袋への白の転写ビニール、マグへの光沢の永久ビニールのデカール、クリスマスの封筒、クッキー缶のラベル、木のオーナメントの裏飾りを挙げる。利用条件は個人の使用に限られる。手作りの品を贈るのはよいが、データそのものの再販や再配布はできない。ファイルや材料の価格は書かれていない。\n紙のタグと永久ビニールのデカールでは、そろえる材料がまったく違う。作りたい品を先に決めてから、記事の材料の一覧を見て準備するとむだがない。Silhouetteの標準版を使う人は、DXF版を選ぶのを忘れないようにしたい。","2026-11-18","Crafty Crafter","https://crafty-crafter.club/christmas/santa-retro-label-svg-for-cricut/"],["自宅でビニールのTシャツを作るのに要る道具","Silhouette America公式ブログが、自宅でビニールのTシャツを作るのに必要な道具をまとめた。対応するSilhouetteのカッター、アイロン転写ビニール、刃、必要ならカットマット、カス取りの道具、ヒートプレスかメーカーが認める家庭用アイロン、Silhouette Studio、無地のシャツなどだ。服には粘着式ではなく転写ビニールを使うこと、端切れで試し切りすることを強調し、作業の流れを7段階で示している。","\n【概要】Silhouette Americaの公式ブログが、自宅でビニールを使ったTシャツを作るときに必要な道具と材料を一覧にし、それぞれの役割を説明した。初めての人がそろえる物を決めるための入門記事だ。\n【背景】記事がまず強調するのは、服には粘着式のビニールではなく、アイロン転写ビニール（HTV）を使うことだ。HTVは熱と圧で布に付く。挙げている道具は、対応するSilhouetteのカッター、HTV、合う刃、方式によって必要なカットマット、カス取りの道具、ヒートプレスかメーカーが認める家庭用アイロン、Silhouette Studio、無地のシャツ、プレス用の小物だ。\n【詳細】カッターはHTVから図案を切り出す。切れる幅や使える道具は機種で違うので、公式の対応表を確かめるよう案内している。HTVには、なめらか、ラメ、フロッキー、メタリック、伸びる素材などがあり、それぞれ刃の深さや温度の設定が違うことがある。本番の前に、端切れで試し切りをする。機種とHTVの組み合わせによっては、マットなしで切れる。フック型のカス取り道具は、「e」や「a」のような小さな文字に向く。Silhouette Studioの基本版は無料で、一般的なHTVの図案に必要な左右反転もできる。作業は7段階で、図案を作る、HTVを選ぶ、左右反転する、試し切りする、切ってカスを取る、HTVメーカーの説明どおりに熱を加える、決められた時点で台紙をはがす、の順だ。\n【ポイント・注意点】よくある質問では、ヒートプレスは必ずしも要らず、一般的なHTVならプリンターも要らないとする。初心者はまず、カッター、合う刃、なめらかなHTVを1巻そろえるよう勧めている。具体的な温度や時間、価格は書かれていないので、使うHTVの説明書で確かめる必要がある。\n記事の中には、手順を詳しく説明する別の記事「How to Make Custom Vinyl T-Shirts at Home Step by Step」へのリンクの置き場所があるが、まだ公開されていない。道具の一覧としてはこの記事で足り、作り方の細部は使う機械とHTVの説明に従う形になる。","2026-11-18","Silhouette America","https://www.silhouetteamerica.com/blog/post/tools-needed-to-make-vinyl-shirts-at-home"],["カッター・レーザー・熱プレスの年末セール一覧","Color Me Craftyが、カッターマシン、レーザー、ヒートプレス、ビニールなどのブラックフライデーのセールをまとめた。xToolは11月2日〜12月4日で、11月19日から一部のレーザーが20%引き。OMTechは一部のレーザーが最大60%引き、Heat Press Nationは全品最大70%引き。SilhouetteのセットはWebで最大45%引き、Cricutは会員向けにさらに10%引き。xToolの新しいカッターC1はセールの対象外。","\n【概要】クラフトブログColor Me CraftyのJamela Payneが、2026年のブラックフライデーのクラフト用品のセールをまとめた。筆者が「自分なら本当に買う」ものに絞ったとし、ページは随時更新するという。\n【背景】年末はカッターやレーザー、ヒートプレスを安く買える時期で、メーカーごとに期間や割引の形が違う。記事は、カッター、レーザー、熱プレス、ビニール、ソフトの分野ごとに、期間と割引の条件を並べている。\n【詳細】カッターでは、11月11日に出たxToolのカラーカッターC1は、xToolのブラックフライデーの値引きの対象外。Cricutの年末セールはMaker 3、Joy Xtra、Ventureのセットが対象で、終了日と価格は書かれていない。Cricut Accessの会員は、さらに10%引きになる。Silhouetteのセットは最大45%引きで、終了日の記載はない。レーザーでは、OMTechが11月1日〜27日に一部の機種を最大60%引き。xToolのセールは11月2日〜12月4日で、11月19日からは木曜の限定セールで一部のレーザーが20%引きになり、60日間の価格保証も付く。熱プレスでは、xToolのWonderPressのセットが同じ期間に値引きされる。HTVRontは11月2日〜26日、Heat Press Nationは11月13日〜12月7日に全品最大70%引きで、地上便の送料が無料。ビニールでは、HTVRontが11月2日〜26日に転写ビニールのロールを3つ買うと1つ無料にし、中身が分からないお楽しみ箱も出す。Siserは、コードPRINTABLE20とSPECIALTY20で20%引き。ソフトでは、Adobe Creative Cloud Proが新規の人に限り、初年度57%引き（11月13日〜27日）。\n【ポイント・注意点】Amazon、Best Buy、Walmartなどの大手はリンクだけで、価格は載っていない。終了日がない割引もあるので、買う前に各店のページで条件を確かめたい。新製品のC1のように、セールの対象から外れる機種もある。","2026-11-17","Color Me Crafty","https://colormecrafty.net/black-friday-craft-deals/"],["昇華タンブラーの型紙、ソフトなしで素早く印刷","Silhouette Schoolが、できあがったタンブラーの型紙を、デザインソフトを使わずに昇華プリンターで刷る方法を紹介した。筆者はBrother SP-1で、20オンスのストレート型タンブラーの巻き紙を約2分で刷れたという。紙は8.5×11インチの縦向きにし、用紙の種類は転写用、左右反転は2つある設定のうち片方だけをオンにする。型紙のストレート型と先細り型の取り違えにも注意を促している。","\n【概要】Silhouette Schoolが、昇華転写用のタンブラーの型紙を、デザインソフトを通さずに直接印刷する手順を紹介した。筆者は、Brother SP-1の昇華プリンターで、20オンスのストレート型タンブラーの巻き紙を約2分で刷れたという。\n【背景】昇華転写は、専用インクで刷った紙を熱で素材に移す方法だ。完成した型紙のファイルを持っていても、毎回デザインソフトで開いて刷る人は多い。記事は、ファイルをそのまま印刷する近道を示している。\n【詳細】手順は、型紙のファイルを開き（ダブルクリックでプレビュー）、「ファイル」から「印刷」を選び、昇華プリンターを指定する。細かい設定はプリンター付属のソフトで行う。まず型紙を確かめる。多くのファイルにはストレート型と先細り型の2種類があり、先細り型をストレート型のタンブラーに刷ると白いすき間が出る。用紙は8.5×11インチの縦向きにして、型紙が上下に長く入るようにする。用紙はプリンターに自動で選ばせず、種類を転写用（昇華転写紙）、画質を標準にする（下書きでもよい）。レイアウトでは画像を左右反転するが、反転の設定が2つある場合は片方だけをオンにする。両方オンにすると打ち消し合うからだ。透かしの設定もオフにしてから印刷する。\n【ポイント・注意点】背の高いタンブラーや太いタンブラーには、端まで刷れるフチなし印刷が使えるプリンターもある。その方法はSilhouette Uの動画で解説していて、一部は試し見できる。秋の柄の巻き紙はSo Fontsyのもの。Silhouette Uにある、昇華の原価と値付けを計算する無料のツールにもリンクしている。型紙やプリンターの価格は書かれておらず、Brother SP-1はアフィリエイトのリンクだ。\n失敗しやすいのは、型紙の種類の取り違えと、左右反転の二重がけの2点だ。どちらも刷ってから気付くと紙とインクがむだになる。印刷を押す前に、タンブラーの形と反転の設定を見直す習慣を付けるとよい。用紙を自動で選ばせない点も、仕上がりを左右する設定として覚えておきたい。","2026-11-16","Silhouette School","https://www.silhouetteschoolblog.com/2026/11/the-fastest-way-to-print-sublimation.html"],["トナカイ形のクリスマスツリー、無料SVGを配布","Crafty Crafterが、トナカイとクリスマスツリーを組み合わせた無料のSVGを配布した。線がすっきりしていてカス取りしやすく、森の雰囲気に合う図案だという。黒いTシャツへの白の転写ビニール、アクリルのオーナメント、おそろいのパジャマの金色の転写など6つの使い方を挙げる。取り込んだあとグループを解くと色を変えられる。個人の手作りには無料で登録も不要、データの再販と再配布は禁止。","\n【概要】無料のSVG配布サイトCrafty Crafterが、トナカイとクリスマスツリーを組み合わせた図案のカットファイルを公開した。線がすっきりしていてカス取りがしやすく、森の素朴な雰囲気に合うと紹介している。\n【背景】同サイトは、11月に入ってクリスマス柄の無料SVGを毎日のように出している。この図案は単色でも重ね貼りでも使え、服、雑貨、オーナメントまで幅広い作例を挙げている。\n【詳細】使い方の例は6つ。黒いTシャツに白の転写ビニール、アクリルのオーナメントの素材に永久接着ビニール、おそろいのパジャマに金色のメタリックのアイロン転写、陶器のマグやギフトボックスに光沢の永久ビニール、木の飾り板に緑と茶色のビニールの重ね貼り、綿のティータオルに転写ビニール。材料には、ラメの転写ビニールか永久ビニール、透明か色付きのアクリルの素材、転写テープ、重ね貼り用の道具、上質なアイロン転写ビニール、耐熱テープ、小型のヒートプレス、綿100%の無地の品を挙げる。手順は、取り込む前に解凍し、.svgをDesign Spaceに取り込んでグループを解き、色を変える。材料に合わせて大きさを決め、転写ビニールなら左右反転し、入れた材料に合う切り設定を確かめる。ダウンロードは見本画像からGoogleドライブのファイルへつながる。\n【ポイント・注意点】Silhouette Studioでも使え、よくある質問では、Cricut Joy・Maker・Exploreで使え、ベクター形式で拡大縮小できると説明する。利用条件は、個人の手作りなら無料で、登録は不要。手作りの品を贈るのはよいが、データそのものの再販や再配布はできない。サイトは点検ツール「SVG Doctor」でファイルを確かめるよう勧めている。寸法やファイルの大きさ、価格は書かれていない。\n重ね貼りで使う場合は、グループを解いてから色ごとに材料を分けて切ることになる。緑と茶色の2色で木の飾り板を作る作例のように、色の数だけビニールを用意しておくと作業が進めやすい。","2026-11-15","Crafty Crafter","https://crafty-crafter.club/christmas/reindeer-christmas-tree-svg/"],["Cricutで木を切る、機種と刃の選び方とオーナメント","Jennifer Makerが、Cricutで木を切るときの機種と刃の選び方を、名入れの木のオーナメントを作りながら解説した。MakerならKnife Bladeで厚さ1/16インチのバルサ材を、Maker・Explore・VentureならDeep Point Bladeで木のつき板を切れる。写真はPrint Then Cutで印刷して重ねる。費用の目安は5〜10ドル、所要時間は30分。筆者は、バスウッド材はこの図案には向きにくいとしている。","\n【概要】Jennifer Makerが、Cricutで木を切るときにどの機種とどの刃を使うかを、写真入りの木のオーナメントを作りながら解説した。図案は無料のデザイン#848で、長方形、丸、四角の3つの形がある。チュートリアルの動画は、オンラインの催し「Merry Maker Mingle 2026」の一部として11月15日に公開された。\n【背景】木はカッターで切る材料の中でも硬く、機種と刃の組み合わせで切れるかどうかが決まる。記事は材料ごとに機種と刃を分けて示している。厚さ1/16インチ（12×6インチ）のバルサ材は、MakerにKnife BladeとDrive Housingを付けて切る。12×12インチのCricutの木のつき板は、Maker・Explore・VentureでDeep Point Bladeを使う。筆者は、この図案にはバスウッド材は確実さに欠けるとしている。\n【詳細】SVGは小さくしないよう勧める。つり下げ用の穴が、刃で切れる大きさを保てなくなるからだ。写真はガイドの形に入れ、「Slice」で切り取り、8.5×11インチの写真用紙（半光沢か光沢）にPrint Then Cutで刷る。文字にはFarm Dream、Cailyn Bloom、Beachwood、Brenson Charlotteを挙げ、それぞれ無料の代わりも示している。材料は黒・白・赤の永久ビニール、転写テープ、幅2/5インチのリボン約6インチ。マットは木には紫のStrongGrip、ビニールには緑のStandardGripを使う。設定は、バルサが「Balsa - 3/32\"（2.4mm）」で圧は既定、つき板が「Natural Wood Veneer」で圧を強めの「More」、ビニールが「Value Vinyl」で「More」。バルサはマットの3インチと9インチの目盛りの間に置き、刃の調整はコピー用紙に7本の線を切って行う。\n【ポイント・注意点】仕上がりの大きさは、丸が3.5×4.035インチ、四角が3×3.84インチ、長方形が3×5.83インチ。費用の目安は5〜10ドル、準備10分と作業20分の計30分で、難易度は中くらい。木は厚さや種類で切れ方が大きく変わるので、まず刃の調整を済ませてから本番に入るとよい。","2026-11-15","Jennifer Maker","https://jennifermaker.com/cutting-wood-with-cricut/"]],"uv":[["京都ステッカー、UVDTFステッカーを曲面に貼るコツと定着期間を解説","京都ステッカーは2026年11月21日、UVDTFステッカーの貼り方を解説する記事を公開した。カップやボトルなどゆるやかな曲面に貼るときは、中央から外側へスキージーで空気を押し出すのがコツだという。貼った後は最低でも24〜72時間の定着期間を置くよう求めている。自社テストでは家庭用食洗機で約100回洗っても剥がれなかったとする一方、デザインで結果が変わるため試し貼りを勧めている。料金は50×50mm・10枚で1,080円〜（税抜）。","\n【概要】京都ステッカーは2026年11月21日、自社ブログでUVDTFステッカーの貼り方を解説する記事を公開した。UVDTFステッカーは、UV硬化インクで透明なPETフィルムに印刷したステッカーで、台紙をはがして貼り、転写シートをはがすだけで、対象物に直接印刷したような仕上がりになる。記事では特に、コップやボトルのような曲面に貼るときのコツと、貼った後に置く定着期間を詳しく取り上げている。\n【背景】UVプリンターを持っていなくても、UVプリントのような見た目を手軽に得られる方法としてUVDTFが広がっている。ただ、貼り方を誤ると気泡が入ったり、早く洗いすぎて剥がれたりする失敗が起きやすい。京都ステッカーは同じ週にUVDTFの耐久性や素材、注文方法についての記事も続けて公開しており、今回の記事は実際に貼る段階の注意点をまとめたものといえる。\n【詳細】手順は、①台紙をはがして位置を決める、②スキージーでしっかり圧着する、③転写シートをゆっくりはがす、の3段階。曲面に貼る場合は、中央から外側へ向けてスキージーで空気を押し出すのがコツだという。貼れる素材はガラス、金属、プラスチック、木材、陶器で、ゆるやかな曲面なら対応する。記事は「最低でも24時間～72時間の定着期間を置いてください」としており、自社テストでは家庭用食洗機で約100回洗っても剥がれなかったとしている。料金の目安（税抜）は、50×50mmで10枚1,080円〜、50枚4,200円〜、100枚7,200円〜、100×100mmで10枚2,700円〜、50枚10,500円〜、100枚18,000円〜。標準配送は入金後2〜4営業日で無料、特急は1〜2営業日で有料。1万円（税抜）以上で送料無料、制作事例の掲載を許可すると10%引きになる。\n【ポイント・注意点】印刷はCMYKと白インクで、金・銀インクやメタリック、箔押し、鏡面仕上げには対応していない。入稿データは300DPI以上のPNGまたはJPGが求められる。食洗機での結果はデザインによって変わるため、記事でも試し貼りを勧めている。最低注文は1枚からで、ウェブの見積もりシステムで料金を確かめてから注文できる。","2026-11-21","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/21/24106/"],["京都ステッカー、UVDTFステッカーの耐久性と剥がれない貼り方を解説","京都ステッカーは2026年11月21日、UVDTFステッカーの耐久性と食洗機への対応、剥がれにくい貼り方をまとめた記事を公開した。耐水・耐摩耗・耐UV性があるとし、自社テストでは食器に貼ったステッカーが家庭用食洗機で約100回洗っても剥がれなかったという。一方、一度定着すると貼り直しが難しく、はがし方の専用ガイドもないため、一時的な用途には向かないと注意している。個人でも1枚から注文できる。","\n【概要】京都ステッカーは2026年11月21日、UVDTFステッカーの耐久性と食洗機への対応、剥がれないための貼り方を解説する記事を公開した。UVDTFステッカーは、UV硬化インクで透明なPETフィルムに印刷したもので、食器やボトルに貼っても直接印刷したような見た目になる。記事は「どれくらい長持ちするのか」「洗っても大丈夫か」という利用者の疑問に答える内容になっている。\n【背景】マグカップやタンブラー、子どもの水筒などに貼る用途では、毎日の洗浄に耐えられるかが選ぶうえでの大きなポイントになる。京都ステッカーはUVDTFステッカーを自社で製作しており、11月17日以降、注文方法や素材、活用事例などの記事を続けて公開している。今回はその中で耐久性に焦点を当てた。\n【詳細】記事によると、UV硬化インクで印刷されたUVDTFステッカーは耐水性、耐摩耗性、耐UV性を備える。自社テストでは、食器に貼ったステッカーが家庭用食洗機で約100回洗っても剥がれず、食洗機程度の熱にも耐えたという。剥がれにくくする貼り方として、①台紙をはがして貼る、②スキージーでしっかり押さえる、③転写シートをゆっくりはがす、④少なくとも24〜72時間は洗わない、という手順を示した。また、一度定着すると非常に強く密着し、位置を直すのは難しいと説明。専用のはがし方ガイドはないため、貼る位置を慎重に決めるよう呼びかけている。素材はガラス、金属、プラスチック、木材、陶器で、ゆるやかな曲面にも対応する。料金（税抜）は50×50mmの10枚で1,080円〜、100×100mmの100枚で18,000円〜など。\n【ポイント・注意点】耐久性の結果はデザインによって変わるため、記事でも事前の試し貼りを勧めている。強く密着する性質上、後で剥がしたい一時的な用途には向かない。印刷はCMYKと白インクで、金・銀インクやメタリック、箔押し、鏡面には対応していない。入稿は300DPI以上のPNGかJPGで、ウェブ見積もりは24時間使え、PDFでダウンロードできる。納期はデザイン確定後の入金から数える。","2026-11-21","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/21/24102/"],["LONGERの卓上UV機ePrint、年末の名入れギフト副業向けに提案","Digital Trendsは2026年11月20日、LONGERの卓上UVプリンター「ePrint」を、年末の名入れギフト作りを副業にする道具として紹介するパートナー記事を掲載した。印刷範囲は310×420mm、最大1440DPIで、立体表現は最大15mm。12月2日までのブラックフライデー価格はシングルUVが1,899ドル、デュアルUVが2,499ドルなど。アクリルの記念品を39.90ドルで売る場合の原価の内訳例も示している。","\n【概要】米テックメディアのDigital Trendsは2026年11月20日、LONGERの卓上UVプリンター「ePrint」を取り上げたパートナー記事を掲載した。スマホケースや写真入りプレート、オーナメント、パーティー用の看板など、一点ものの名入れギフトを年末商戦向けに作り、副業にできる道具として紹介している。\n【背景】これまでUVプリンターは業務用が中心で、記事によればプロ向けのフラットベッド機には6万ドル前後かそれ以上のものもある。これはePrintのデュアルUV機（2,499ドル）の20倍を超える価格だという。卓上機の登場で、個人や小さな工房でも一点ものの印刷ができるようになってきた。\n【詳細】ePrintはUVインクを紫外線で硬化させる方式で、フルカラーに加え、素材によっては白インク、光沢や盛り上げのためのニスも使える。対応するワークフローでは最大15mmの立体表現ができる。印刷範囲は310×420mm、解像度は最大1440DPI。デュアルUVモデルはエプソンF1080ヘッドを2基、12のインクチャンネルを備え、LONGERによるとシングルヘッド機の2倍の速さでカラー印刷できる。オープンインク方式で、互換性のある他社インクも使える。構成はシングルUV、デュアルUV、転写や衣類への印刷を加えたUV＋DTの3種類。12月2日までのブラックフライデー価格は、シングルUVが1,899ドル（通常2,499ドル）、デュアルUVが2,499ドル（同3,299ドル）、UV＋DT DTFコンボが2,699ドル（同3,299ドル）。段階的なクーポンで最大20%の値引きもある。記事は収益例として、アクリルの記念品を39.90ドルで売る場合を挙げ、原価を素材7ドル、インクと試し刷り2ドル、作業6ドル、梱包と手数料5ドルと試算している。\n【ポイント・注意点】この記事はPRNEWSが提供する有料のパートナーコンテンツで、編集部の独立したレビューではない。記事中の採算の試算は数字どうしが完全には合っておらず、自分の条件で計算し直す必要がある。他社インクの使用や換気、日々の手入れなど、運用面の負担も確かめておきたい。","2026-11-20","Digital Trends","https://www.digitaltrends.com/partner-content/this-holiday-season-longer-eprint-could-turn-personalized-gifts-into-a-side-hustle/"],["オリジナルプリント.jp、UV印刷で1点から作れるポーチ4種を発売","イメージ・マジックが運営するオリジナルプリント.jpは2026年11月20日、スマホで1点から作れる「オーロラPVCポーチ」と「ぬいぐるみポーチ」の各S・Mサイズ、計4種の販売を11月19日に始めたと発表した。印刷はすべてUV硬化インクジェットで、白引きありとなしを選べる。価格は1点税込236円から（別途印刷代）。展示会のノベルティやイベント物販、推し活グッズ向けとしている。","\n【概要】株式会社イメージ・マジックは2026年11月20日、運営するオンデマンド印刷サービス「オリジナルプリント.jp」で、ポーチ4種の販売を11月19日に始めたと発表した。「オーロラPVCポーチ」と「ぬいぐるみポーチ」のSとMの各サイズで、どれもUV硬化インクジェットプリントでオリジナルデザインを印刷できる。スマホから1点から注文できる。\n【背景】オリジナルプリント.jpは2,500種類以上のアイテムを扱うオンデマンド印刷サービス。推し活や販促向けに、小ロットで作れるグッズを増やしている。展示会のノベルティやイベントの物販など、少ない数でオリジナル品を作りたい需要に応える狙いがある。\n【詳細】印刷方式はUV硬化インクジェットプリントで、白インクで下地を作る「白引きあり」と「白引きなし」を選べる。価格は1点税込236円から（印刷代は別）で、例としてオーロラPVCポーチ（S）を挙げている。最小注文数は1点。商品ページの「デザインツール」から画像をアップロードして作り、専用ソフトは不要で、仕上がりのプレビューも確認できる。オーロラPVCポーチは両面フルカラー印刷に対応し、見る角度で変わるオーロラ光沢のある透明素材を使う。Sサイズは化粧品やイヤホン入れ、Mサイズはスリムな形で、持ち手は白か黒。ぬいぐるみポーチはスモークブルーなど全9色で、取り外せるカラビナで縦にも横にも付けられ、前面は透明。Sサイズはガチャのフィギュアやミニぬいぐるみ1〜2体、Mサイズはもっと大きなぬいぐるみが入る。用途は展示会のノベルティ、イベント物販、推し活グッズなどを想定している。\n【ポイント・注意点】表示価格は本体の価格で、印刷代は別にかかる点に注意したい。透明素材に色をはっきり出したいときは、白引きを選ぶかどうかで仕上がりが変わる。注文はスマホからでもでき、専用ソフトを用意する必要はない。使っているUVプリンターの機種などは公表されていない。問い合わせ窓口は平日10時から17時で、土日祝日と会社の休業日は休み。同社は東証グロース上場（証券コード7793）。","2026-11-20","PR TIMES（イメージ・マジック）","https://prtimes.jp/main/html/rd/p/000000195.000085001.html"],["オリジナルプリント.jp、UV印刷のアクリルコースター14種を発売","イメージ・マジックのオリジナルプリント.jpは2026年11月20日、スマホで1点から作れるフルカラーの「アクリルコースター」14種を発売したと発表した。水玉ラメや蓄光、ミラーなど7種類の特殊アクリル素材に、四角と丸の2形状を組み合わせた。印刷はUV硬化インクジェット（白引きあり）で、価格は印刷代込みで1点税込1,078円から。クリエイターグッズや企業の販促品向けの大口注文にも応じる。","\n【概要】株式会社イメージ・マジックは2026年11月20日、オンデマンド印刷サービス「オリジナルプリント.jp」で、フルカラーの「アクリルコースター」14種の販売を始めたと発表した。7種類の特殊アクリル素材と、四角・丸の2つの形を組み合わせたラインアップで、イラストや写真、ロゴをUV硬化インクジェットで印刷する。スマホから1点から注文できる。\n【背景】同社は同じ日にUV印刷によるポーチ4種の発売も発表しており、推し活や販促向けの小ロットグッズを続けて増やしている。キラキラした素材や光る素材を使ったグッズは見栄えがよく、クリエイターやアーティストの物販、企業のノベルティなど幅広い用途が見込まれる。\n【詳細】素材は、水玉ラメ、ゴールドラメ、スパークルホログラム（十字の星のような輝き）、シルバーホログラム、蓄光、ミラー、ホログラムの7種類。それぞれに四角と丸があり、合計14種になる。印刷はUV硬化インクジェットプリントで白引きあり。価格は印刷代込みで1点税込1,078円から。最小注文数は1点で、クリエイターグッズ、アーティストグッズ、企業の販促品などの大口注文も受け付ける。商品は1点ずつOPP袋で個包装され、大口注文はおよそ1週間で発送する。注文は、ブラウザ上の「デザインツール」でレイアウトを確かめながら作る方法と、Illustratorなどで作った完全データを入稿する方法がある。問い合わせ窓口は平日10時から17時で、土日祝日と会社の休業日は休みとなる。\n【ポイント・注意点】発売日の表記はリリース本文が11月16日（月）、仕様欄が11月19日（木）と食い違っているため、正確な日付は公式ページで確かめたい。四角・丸それぞれの寸法はリリースには書かれていない。価格には印刷代が含まれているため、1点だけ作る場合でも費用がわかりやすい。ミラーや蓄光のような特殊素材では、デザインの置き方で見え方が変わることがあるため、デザインツールのプレビューで仕上がりをよく確認してから注文するとよい。大口で作る場合は、発送までのおよそ1週間を見込んでおく必要がある。","2026-11-20","PR TIMES（イメージ・マジック）","https://prtimes.jp/main/html/rd/p/000000199.000085001.html"],["京都ステッカー、UVDTFで推し活グッズを自作 1枚からの料金と仕様","京都ステッカーは2026年11月19日、UVDTFステッカーで推し活グッズを自作する方法と料金・仕様をまとめた記事を公開した。UV硬化インクで透明PETフィルムに印刷し、貼って転写シートをはがすだけで、UVプリンターがなくてもスマホケースやタンブラーに直接印刷したような仕上がりになると紹介。白インクで透明アクリルや暗い色の品にも映える。料金は50×50mm・10枚1,080円〜（税抜）で、1枚から注文できる。","\n【概要】京都ステッカーは2026年11月19日、UVDTFステッカーを使って推し活グッズを自作する方法を紹介する記事を公開した。記事はUVDTFを「次世代のステッカー」と呼び、UVプリンターを持っていなくても、スマホケースやタンブラーなどに直接印刷したような仕上がりのグッズが作れると説明している。\n【背景】推し活では、好きなキャラクターやアーティストのデザインを身の回りの品に入れたいという需要が大きい。ただ、UVプリンターを自分で買うのは費用がかかる。転写するだけで使えるUVDTFステッカーなら、1枚から気軽に試せる。京都ステッカーは自社でUVDTFステッカーを製作しており、この週は用途別の記事を続けて出している。\n【詳細】UVDTFステッカーは、UV硬化インクで透明なPETフィルムに印刷したもので、台紙をはがして押し付け、転写フィルムをはがすだけで貼れる。フルカラーでフチなし、白インクを使えるため、透明なアクリルや暗い色の品にも映える。貼れる素材はガラス、金属、プラスチック、木材、陶器で、カップやボトル、タンブラー、マグカップのようなゆるやかな円筒面にも対応する。おすすめの品としてスマホケース、パソコン、文房具、タンブラー、マグカップを挙げる。耐水・耐摩耗・耐UV性があり屋外でも使えるとし、自社テストではしっかり圧着して24〜72時間置いた後、家庭用食洗機で約100回洗えたという。料金（税抜）は50×50mmが10枚1,080円〜、50枚4,200円〜、100枚7,200円〜、100×100mmが10枚2,700円〜、50枚10,500円〜、100枚18,000円〜。ウェブ見積もりは24時間使え、PDFでダウンロードできる。\n【ポイント・注意点】印刷はCMYKと白で、金・銀やメタリック、箔、鏡面には対応せず、金や銀は色味での再現になる。入稿データは300DPI以上のPNGかJPG。デザインによっては剥がれることがあるとしており、試し貼りが勧められている。最低注文は1枚からなので、まず少数で仕上がりを確かめてから枚数を増やすこともできる。","2026-11-19","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/19/24006/"],["京都ステッカー、UVDTFとカッティングステッカーの違いと選び方","京都ステッカーは2026年11月19日、UVDTFステッカーとカッティングステッカーの違いと選び方を解説する記事を公開した。どちらも1枚から注文できるが、入稿できるデータ形式や仕様が異なる。UVDTFはUV硬化インクで透明PETフィルムに印刷し、CMYKと白インクでフチなしのフルカラー表現ができる。カッティングステッカーは見積もりシステムがIllustrator（AI）形式の入稿に対応したと伝えている。","\n【概要】京都ステッカーは2026年11月19日、UVDTFステッカーとカッティングステッカーの違いと選び方を説明する記事を公開した。どちらも1枚から注文できるが、入稿できるデータの形式や仕様が違うため、作りたいものに合わせて選ぶ必要がある。記事の大部分はUVDTFステッカーの説明にあてられている。\n【背景】カッティングステッカーは、シートを文字やロゴの形に切り抜いて作るステッカー。一方、UVDTFステッカーは、UVプリンターで対象物に直接印刷する方法の代わりとして紹介されている方式で、写真やグラデーションもそのまま表現できる。両者は見た目も作り方も異なるため、違いを知っておくことが注文の失敗を防ぐことにつながる。\n【詳細】UVDTFステッカーは、UV硬化インクで透明なPETフィルムに印刷したもので、台紙をはがして貼り、転写シートをはがすだけで使え、UVプリンターは不要。CMYKと白インクで印刷し、フチなしで仕上がる。金・銀インクやメタリック、箔、鏡面仕上げには対応しない。貼れる素材はガラス、金属、プラスチック、木材、陶器で、ゆるやかな曲面にも貼れる。使用例としてビールグラス、マグカップ、ヘルメット、工具などを挙げている。耐水・耐摩耗・耐UV性があり屋外にも使えるとし、自社テストでは圧着後24〜72時間置いてから家庭用食洗機で約100回洗えたという。入稿は300DPI以上のPNGかJPG。料金（税抜）は50×50mmの10枚で1,080円〜、100×100mmの100枚で18,000円〜など。標準配送は2〜4営業日で無料、特急は1〜2営業日で有料。カッティングステッカーについては、見積もりシステムがAdobe Illustrator（AI）形式の入稿に対応したことを伝えている。\n【ポイント・注意点】記事にはカッティングステッカーの料金や細かい仕様は載っておらず、別の記事「カッティングステッカー製作前の確認事項と依頼条件」を参照する形になっている。そのため、この記事だけで両者の費用を比べることはできない。写真やグラデーションを入れたい場合は、フルカラーで印刷できるUVDTFが候補になると考えられる。","2026-11-19","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/19/23930/"],["Joto Imaging、小規模事業者向けUV DTFプリンターの選び方を解説","米Joto Imaging Suppliesは2026年11月19日、小規模事業者向けのUV DTFプリンターの選び方を解説する記事を公開した。最適な機種は速度ではなく受注内容や設置場所、運用費で決まると主張。卓上A3機、ロール式の生産機、UV DTFモードを持つ複合UV機の3つに分け、Uninet 3000 UV DTF、xTool O1 Omni、Procolored VF13 Pro Panda、eufyMake E1の4機種を比べている。","\n【概要】米国の印刷資材販売会社Joto Imaging Suppliesは2026年11月19日、小規模事業者向けにUV DTFプリンターの選び方を解説する記事を公開した。筆者はJuan Yepes氏。記事は、最適な機種はカタログ上の印刷速度ではなく、店の受注の中身、床面積、ランニングコストで決まると主張している。\n【背景】UV DTFは、フィルムに印刷したデザインを硬い素材に転写する方式で、タンブラーやボトルなどの装飾に使われている。卓上機から生産機まで選択肢が増えたことで、自分の店に合う機種を選ぶのが難しくなっている。\n【詳細】記事は機種を3つのグループに分ける。幅約12〜13インチでエプソンXP600クラスのヘッドを使う卓上A3機、印刷・ニス・ラミネートを1回で行うロール式の生産機、UV DTFモードを持つ複合UVプリンターだ。比較表には4機種が並ぶ。Uninet 3000 UV DTF（17インチ）はロール式でラミネートを内蔵し、CMYK、ライトシアン、ライトマゼンタ、白、ニスの8チャンネルを3ヘッドで使う。幅17インチ（420mm）、最大1440dpiで、Uninetによると8パス・1440dpiで1時間あたり最大50平方フィートを印刷でき、一般的な120Vコンセントで動く。xTool O1 OmniはUV、DTG、DTF、UV DTFの4役をこなし、720×1440dpi、最大7mmの盛り上げ印刷に対応するが、UV DTFにはラミネーターLM1が要る。Procolored VF13 Pro PandaはエプソンXP600ヘッドを2基積んだA3+の卓上機でラミネートを内蔵。eufyMake E1はUV DTF転写とフラットベッド印刷ができるコンパクトなA3機とされている。直接印刷の選択肢として、厚さ5.91インチまでの素材に印刷できるMutoh XpertJet 461UFも紹介している。\n【ポイント・注意点】記事は、よくある失敗として、稼働率より速さで選ぶこと、ラミネーターを忘れること、換気の計画を立てないこと（UVインクにはにおいがある）、需要を確かめる前に買うことを挙げる。A・Bフィルム、インク、消耗品であるヘッド、日々のノズルチェックなどの費用も考える必要がある。初心者はラミネート内蔵の卓上A3機から始められ、ヒートプレスは不要だという。","2026-11-19","Joto Imaging Supplies","https://jotoimagingsupplies.com/blogs/blogs/best-uv-dtf-printer-for-small-business"],["ミマキ、UV硬化インクジェット方式のフルカラー3Dプリンタ新機種","MONOistは2026年11月19日、ミマキエンジニアリングが11月17日に発表したUV硬化インクジェット方式のフルカラー3Dプリンタ「3DUJ-553MkII」を報じた。色の表現領域は従来機の約1.4倍で、造形物の内部に低コストの新インフィルインクを使って費用を抑える。次のジョブを予約できる「スマートリレー」機能も備え、最大造形サイズは508×508×305mm。ドイツのFormnext 2026で世界初公開し、2027年に発売する予定。","\n【概要】製造業向けメディアのMONOistは2026年11月19日、ミマキエンジニアリングが11月17日に発表したフルカラー3Dプリンタ「3DUJ-553MkII」について報じた。UVプリンターと同じUV硬化インクジェット方式で、インクの滴を吹き付けて紫外線で固め、層を重ねて立体を作る。ドイツ・フランクフルトの「Formnext 2026」で世界初公開され、2027年に発売が予定されている。\n【背景】前の機種「3DUJ-553」は1,000万色以上を再現できるのが特長だった。ミマキは看板や産業用のUVインクジェットプリンターを手がけるメーカーで、同じ技術を立体造形にも使っている。新機種では色の表現力を高めつつ、造形にかかる費用を下げることを狙った。\n【詳細】色の表現領域は、同社が定めた条件での色域体積で比べて、従来機の約1.4倍に広がった。これまで造形物の内部にもカラーインクを使っていたが、新たに開発した低コストの「インフィルインク」を内部に使い、外側はフルカラーのまま材料費を下げる。内部の体積が大きい造形物ほど効果が大きいという。新機能「スマートリレー」では、次のジョブを予約しておくと、今のジョブが終わったあとに造形テーブルの空いた場所で自動的に次の造形を始める。この場合の造形サイズは空き領域の広さによって決まる。最大造形サイズは508×508×305mm。木目や革、カーボン、大理石などの質感を表現したサンプルも示し、フィギュアやアート作品、インテリアなどへの活用を見込む。3Dデータ用ソフト「Mimaki 3D Print prep Pro ver2」は2026年8月にウェブサービスとして提供が始まっている。\n【ポイント・注意点】平面に印刷するUVプリンターではなく、UV硬化インクジェット技術を使った3Dプリンタである点に注意したい。価格は記事では明らかにされていない。色域の比較はメーカーが定めた条件によるもので、第三者による検証ではない。発売時期は、ミマキのプレスリリースでは2027年春とされている。","2026-11-19","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/19/news018.html"],["2,500ドル未満の卓上UV機LONGER ePrintを検証する分析記事","BriefGlanceは2026年11月18日、LONGERの卓上UVプリンター「ePrint」を分析する記事を掲載した。ブラックフライデー価格はシングルヘッド機1,766.07ドル、デュアルヘッド機2,299.08ドル。エプソンF1080ヘッド2基と12インク、最大15mmの立体表現をうたう一方、他社インクのリスクや白インクの手入れ、VOCなど安全面の課題も指摘する。ローランドDGやミマキの業務用機は1万5,000ドルから4万ドル超だという。","\n【概要】ニュースサイトBriefGlanceは2026年11月18日、Charles Anderson氏による分析記事「The Anderson Analysis」で、LONGERの卓上UVプリンター「ePrint」を取り上げた。2,500ドルを切る卓上UV機が、業務用に近い立体のレリーフ表現をどこまで実現できるのかを検証する内容だ。\n【背景】LONGERは入門向けのFDM方式3Dプリンターやレーザー加工機で知られ、レーザー機のRay5、Ray7、密閉型のRay7s、3DプリンターのLK5 Proなどをそろえる。記事によると、比較対象となるローランドDGやミマキのUVフラットベッド機は1万5,000ドルから4万ドル超で、ePrintはその価格帯を大きく下回る。\n【詳細】ブラックフライデー2026の価格は、シングルヘッドのePrintが1,766.07ドル、デュアルヘッド機が2,299.08ドル。デュアルヘッド機はエプソンF1080ヘッド2基と、白・CMYK・ニスなど12のインクチャンネルを持つ。LONGERは、シングルヘッドのePrint SEより2D印刷で最大2倍、3Dテクスチャで最大6倍速いとしている。立体表現は最大15mm、表面の高低差は最大10mmまで対応するとうたう。想定する用途は、刺しゅう風の表現、点字の案内表示、凹凸のあるキャンバスアート、触って楽しめるグッズなど。ソフトのLongerStudio AIは背景除去やレイヤー処理、文字からロゴを作る機能を持ち、絵柄を白・カラー・ニスの版に分ける。\n【ポイント・注意点】筆者はいくつかの懸念も挙げる。オープンインク方式はコストを下げるが、他社インクではヘッドの損傷、密着不良、硬化不足の恐れがある。白インクは常にかくはんが必要で、F1080ヘッドは毎日の清掃やキャップ部の手入れを怠ると詰まりが戻らなくなる。UVインクは感作性のある化学物質でVOCも出るため、屋外への排気やニトリル手袋、UVカットの眼鏡を勧めている。自動の輪郭検出が苦手な場面もあり、上級者は専門ソフトが必要になる可能性がある。総じて、手頃な入り口だが、手入れと安全のコストを見込むべきだとしている。","2026-11-18","BriefGlance","https://briefglance.com/articles/the-micro-factory-reality-check-can-longers-sub-2500-uv-printer-deliver-industrial-3d-relief"],["ME-Q、UV印刷で名入れできる職人塗装のグラデーションルームキー","株式会社MAWが運営するオリジナルグッズ作成サービス「ME-Q」は2026年11月18日、国内の職人が一点ずつ手作業で塗装する「グラデーションルームキー」を発売した。和歌山県の紀州黒江塗の技術を応用した2色グラデーションのアクリル製キーホルダーに、UVインクジェット印刷で写真や名前を1個から入れられる。価格は片面印刷で1個税込1,480円から。1〜49個なら約5営業日で届ける。","\n【概要】大阪の株式会社MAWは2026年11月18日、運営するオリジナルグッズ作成サービス「ME-Q」で、「グラデーションルームキー」を発売したと発表した。ホテルの鍵のような形をした透明アクリルのキーホルダーで、国内の職人が一点ずつ手作業で2色のグラデーションを塗る。写真やイラスト、名前、ロゴをUVインクジェット印刷で1個から入れられる。片面・両面のフルカラー印刷を選べ、白インクにも対応する。\n【背景】ME-Qは、推し活グッズや同人グッズ、企業のノベルティなど、小ロットのオリジナルグッズ作りに応えるサービス。今回の商品は、和歌山県の伝統工芸である紀州黒江塗の技術を応用した手塗りの塗装と、UV印刷による名入れを組み合わせた点が特徴だ。\n【詳細】印刷はUVインクジェット印刷（CMYK出力）で、片面か両面のフルカラーを選べる。白インクや白引きにも対応する。サイズは幅14×高さ100×奥行き14mm（チェーンを除く）。色はピンク/ラベンダー、ミント/アイスブルー、アンバー/コーラルピンク、バイオレット/ブラックの4種類で、ゴールドのボールチェーンが付属する。価格（税込）は片面印刷が1個1,480円から、両面印刷が1,780円からで、数量に応じた割引がある。納期は1〜49個で約5営業日（土日祝を除く）。期間限定で、専用の台紙を付けて透明の袋に入れて届ける特典もあるが、予告なく終わる場合がある。用途として推し活グッズ、同人グッズ、誕生日やイベントの記念品、企業のノベルティを想定している。\n【ポイント・注意点】透明アクリルに写真を印刷する場合は、白引きを使うかどうかで見え方が大きく変わるので、注文時に確かめたい。片面と両面で価格が300円違うため、デザインを両面に入れるかどうかも費用に影響する。台紙の特典は期間限定で予告なく終わる場合があるため、希望する人は早めの注文が必要だ。数量に応じた割引があるため、まとめて作る場合は商品ページで単価を確かめたい。50個以上の納期も商品ページで確認したい。","2026-11-18","PR TIMES（MAW）","https://prtimes.jp/main/html/rd/p/000000416.000072705.html"],["Beric、販促品へのUV印刷の活用法と機種選びの要点を解説","UVプリンターメーカーのBericは2026年11月18日、販促品にUV印刷を使う方法を解説するブログ記事を公開した。スマホケース、ペン、USBメモリ、キーホルダー、ドリンクウェアへの印刷を取り上げ、白インクや段取りのいらない小ロットに強い点を利点に挙げる。一部の未処理プラスチックにはプライマーが必要で、量産前に密着と耐久性を試すよう勧める。機種選びでは印刷サイズや高さ、インク構成、ロータリーの有無を確認するよう説く。","\n【概要】UVプリンターを製造するBericは2026年11月18日、自社ブログで販促品（プロモーション用品）にUV印刷を使う方法を解説する記事を公開した。UVインクは紫外線ですぐに硬化するため、平らな面や、プリンターの設定によってはゆるやかな曲面にも細かな絵柄を印刷できると説明している。\n【背景】企業のノベルティや記念品では、ロゴや名前を入れた品を少ない数で作りたいという需要が多い。記事は、従来のような段取りなしで小ロットを作れることをUV印刷の利点の一つに挙げており、販促品の分野での使い方を整理している。スマホケースから飲み物の容器まで、販促によく使われる品ごとに印刷のポイントをまとめた。\n【詳細】記事が取り上げる品目は5つある。プラスチックやTPUのスマホケースとアクセサリーは、暗い色や透明な面に白インクを使う。ペンやノート、卓上小物などの事務用品にはロゴを入れる。USBメモリなどの電子機器では狭い面に小さな文字を印刷する。アクリル、プラスチック、コーティングした金属のキーホルダーや小物は小ロットに向く。ドリンクウェアは平らな面や専用設計の面に印刷でき、円筒形にはロータリー装置が必要になる場合がある。利点として、対象物への直接印刷、フルカラー、白インク、従来の段取りがいらない小ロット、速い硬化を挙げる。機種選びでは、最大の印刷サイズと対象物の高さ、対応素材、CMYK・白・ニスのインク構成、ロータリー対応、ヘッドと手入れの必要性、1日の生産量を確認するよう勧め、卓上機は小さな工房、大判機は多い生産量に向くとしている。ページにはCH06 Pro、A5〜A2のUVフラットベッド機、A4のUVフィルムプリンターなど同社の製品名が並ぶ。\n【ポイント・注意点】アクリルやコーティング金属は印刷しやすい一方、未処理のプラスチックの一部はプライマーが必要で、量産の前に密着性と耐久性を試すよう記事は勧めている。メーカーのブログのため、自社製品への誘導を含む点に注意したい。記事に具体的な数値の仕様は載っておらず、機種を比べる際は各製品の仕様表を別に確かめる必要がある。","2026-11-18","Beric","https://bericprinter.com/uv-printing-on-promotional-products/"],["京都ステッカー、UVDTFステッカーが貼れる素材と非対応表現を一覧","京都ステッカーは2026年11月18日、UVDTFステッカーが貼れる素材と、対応していない表現をまとめた一覧記事を公開した。ガラス、金属、プラスチック、木材、陶器に貼れ、カップやボトルのようなゆるやかな曲面にも対応する。一方、金・銀インクやメタリック、箔押し、鏡面仕上げには対応しない。工事用ヘルメットの社名ロゴや工具の識別ラベルといった業務での使い方も紹介している。","\n【概要】京都ステッカーは2026年11月18日、UVDTFステッカーが貼れる素材と、対応していない表現の条件をまとめた一覧記事を公開した。注文する前に、自分の作りたいものが実現できるかを確かめられる参考資料という位置づけだ。\n【背景】UVDTFステッカーは、UV硬化インクで透明なPETフィルムに印刷し、対象物に転写するステッカー。UVプリンターで直接印刷したような見た目になるのが特長だが、どんな素材に貼れるのか、金色や銀色は出せるのかといった点は、注文前に確かめておきたいポイントになる。\n【詳細】貼れる素材はガラス、金属、プラスチック、木材、陶器。カップやボトルのようなゆるやかな曲面にも貼れ、白インクを使うため透明や暗い色の素材でも色が鮮やかに出る。フチなしで仕上がり、UVで硬化したインクは耐水性、耐候性、耐摩耗性、耐UV性があるとしている。対応していないのは、金・銀インク、メタリック仕上げ、箔押し、鏡面仕上げ。データで金や銀に見える色を指定することはできるが、特殊インクではない。使用例として、スマホケース、タンブラー、マグカップ、パソコン、文房具、子どもの水筒や弁当箱の名前ラベル、写真やメッセージ入りのグラス、店のロゴ入りビールグラスやジョッキ、店舗の窓やドアを挙げる。この記事ではさらに、工事用ヘルメットの社名ロゴや、工具・機材の識別ラベルといった業務での使い方も紹介している。食洗機については、貼った直後に洗わず、スキージーでしっかり押さえて24〜72時間置くよう求め、自社テストでは家庭用食洗機で約100回洗えたとしている。\n【ポイント・注意点】料金（税抜）は50×50mmで10枚1,080円〜、100×100mmで100枚18,000円〜。標準配送は2〜4営業日で無料、特急は1〜2営業日で有料、1万円以上で送料無料、事例掲載の許可で10%引き。最低注文は1枚からで、ウェブ見積もりは24時間使える。金属のような光沢や箔の輝きを出したい場合は、この方式では再現できない点に注意が必要だ。","2026-11-18","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/18/23841/"],["京都ステッカー、UVDTFステッカーのグッズ活用事例を紹介","京都ステッカーは2026年11月18日、UVDTFステッカーを使ったオリジナルグッズの活用事例を紹介する記事を公開した。飲食店のビールグラスやジョッキへのロゴ、店舗の窓の装飾、無地のスマホケースやパソコンへのデザイン、子どもの水筒の名前ラベル、写真入りのグラスの贈り物などを挙げる。UVプリンターがなくても貼るだけで直接印刷のような仕上がりになり、1枚から注文できる。","\n【概要】京都ステッカーは2026年11月18日、UVDTFステッカーでおしゃれなオリジナルグッズを作る活用事例を紹介する記事を公開した。お店での使い方から、個人の持ち物、贈り物まで、場面ごとにどんな品に使えるかを具体的に示している。\n【背景】UVDTFステッカーは、UV硬化インクで透明なPETフィルムに印刷したステッカーで、はがして貼るだけで使える。UVプリンターがなくても、対象物に直接印刷したような見た目のグッズを1枚から作れるため、店舗や個人の小さな需要に向いている。京都ステッカーは自社で製作しており、この週に関連記事を続けて出している。\n【詳細】記事が挙げる活用事例は3つに分かれる。飲食店や店舗では、ビールグラスやジョッキ、タンブラー、マグカップへのロゴ入れや、窓やドアの装飾に使える。個人の持ち物では、無地のスマホケースやパソコン、文房具に好きなデザインを入れられる。名前ラベルや贈り物では、子どもの通園・通学用の水筒や弁当箱の名前シール、写真やメッセージを入れたグラスを記念品やプレゼントにする使い方を紹介している。仕上がりはフチなしで、対象物に直接印刷したように見えるという。フルカラーで写真やグラデーションも再現でき、白インクで透明や暗い色の素材でも色が鮮やかに出る。料金（税抜）は50×50mmが10枚1,080円〜、50枚4,200円〜、100枚7,200円〜、100×100mmが10枚2,700円〜、50枚10,500円〜、100枚18,000円〜。標準配送は2〜4営業日で無料、特急は1〜2営業日で有料。1万円以上で送料無料、事例掲載の許可で10%引きになる。\n【ポイント・注意点】印刷はCMYKと白インクで、金・銀インク、メタリック、箔、鏡面には対応しない。食洗機については自社テストで約100回の洗浄に耐えたとする一方、デザインによっては剥がれる場合があるため試し貼りを勧めている。貼った後はスキージーで押さえ、24〜72時間置いてから洗うよう案内している。最低注文は1枚からで、入稿データは300DPI以上のPNGかJPGが求められる。","2026-11-18","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/18/23855/"],["新興Inkera、UV材料噴射式のフルカラー卓上3Dプリンター「C1」","3DPrinting.comは2026年11月17日、新興企業Inkeraが初の製品「Inkera C1」をFormnext 2026で発表したと報じた。インクの滴を吹き付けて紫外線で層ごとに硬化させるUVマテリアルジェッティング方式で、造形サイズは200×150×120mm。CMYK、白、透明、サポート材、特色の8チャンネルで1,000万色以上を表現する。水溶性サポートを使い、2027年第1四半期に発売予定で、価格は未定。","\n【概要】3Dプリンター専門メディアの3DPrinting.comは2026年11月17日、新興のフルカラー造形メーカーInkeraが、初めての製品「Inkera C1」をドイツの展示会Formnext 2026で発表したと報じた。これまで主に業務用の機械に限られていたフルカラー造形を、机の上で使えるようにすることを目指した卓上機だ。\n【背景】UVプリンターで使われるインクジェットと紫外線硬化の技術は、平面への印刷だけでなく立体造形にも応用されている。同じ週のFormnextでは、ミマキもUV硬化インクジェット方式のフルカラー3Dプリンタの新機種を発表しており、フルカラー造形への関心が高まっている。\n【詳細】C1はUVマテリアルジェッティング方式を採用する。ヘッドから液体の材料を滴として吹き付け、紫外線で層ごとに硬化させるため、色は後から塗るのではなく造形物そのものの一部になる。造形サイズは200×150×120mm。CMYK、白、透明、サポート材、特色の8チャンネルを持ち、1,000万色以上を表現できる。特色チャンネルは、混ぜて作りにくい色を毎回安定して再現するためのもの。サポート材は水に溶けるタイプで、顔や文字、細かな縁を守る。仕上げは不透明、ガラスのような透明感、光沢を選べる。Inkeraは、ヘッド、UV硬化、インクの流動特性、動き、スライス、サポートをすべて連動させ、どの高さでも色と形がずれないようにする必要があると説明している。想定ユーザーはクリエイター、デザイナー、スタジオ、教育関係者、小さな製品開発チームで、フィギュアや贈り物、授業の課題、試作品などに使う。展示はホール12.1のB11ブース。\n【ポイント・注意点】価格は未発表で、商用販売は2027年第1四半期の予定。予約の受け付けも今後案内するとしている。平面に印刷するUVプリンターではなく3Dプリンターだが、UV硬化インクジェット技術の新しい使い道として注目される。性能はメーカーの発表によるもので、実機での検証はこれからだ。","2026-11-17","3DPrinting.com","https://3dprinting.com/news/inkera-brings-full-color-uv-material-jetting-3d-printing-to-the-desktop-with-the-c1/"],["京都ステッカー、UVDTFステッカーの注文方法とウェブ見積もり手順","京都ステッカーは2026年11月17日、UVDTFステッカーの注文方法とウェブ見積もりの手順を説明する記事を公開した。画像をアップロードし、サイズ・枚数・オプションを選ぶと料金がわかる仕組みで、24時間使え、見積書はPDFでダウンロードできる。料金の目安は50×50mmの10枚で1,080円〜（税抜）。自社製作のため費用を抑えられるとし、1枚から大口まで注文を受け付けている。","\n【概要】京都ステッカーは2026年11月17日、UVDTFステッカーの注文方法と、ウェブでの見積もりの手順を解説する記事を公開した。UVDTFステッカーは、UV硬化インクで透明なPETフィルムに印刷したもので、ガラスやスマホケースなどに台紙をはがして貼り、転写シートをはがすだけで使える。\n【背景】オリジナルのステッカーを頼むとき、料金がいくらになるのか、どう入稿すればよいのかがわかりにくいと、注文をためらう人も多い。京都ステッカーは自社で製作しているため費用を抑えられるとしており、1枚から大口まで受け付けている。ウェブの見積もりシステムで、注文前に料金を確かめられるようにしている。\n【詳細】注文の手順は、①画像をアップロードする、②サイズ・枚数・オプションを選ぶ、③見積もりを確認する、の3段階。見積もりシステムは24時間使え、見積書はPDFでダウンロードできる。注文と支払いもそのまま進められ、入稿データはスタッフが確認する。料金の目安（税抜）は、50×50mmで10枚1,080円〜、50枚4,200円〜、100枚7,200円〜、100×100mmで10枚2,700円〜、50枚10,500円〜、100枚18,000円〜。データの種類や個別カットなどのオプションで料金は変わる。入稿データは300DPI以上のPNGかJPGで、印刷はCMYKと白インク。金・銀インク、メタリック、箔押し、鏡面仕上げには対応せず、金や銀は色味として印刷される。納期は、標準配送（無料）が入金後2〜4営業日で発送、特急配送（有料）が1〜2営業日。1万円（税抜）以上で送料無料、制作事例の掲載を許可すると10%引きになる。\n【ポイント・注意点】納期はデザインが確定し、入金が済んだ時点から数えるため、急ぎの場合は早めの入稿が必要だ。混み合う時期は納期が延びることもある。ゆるやかな曲面のカップやボトルにも貼れ、自社テストでは家庭用食洗機で約100回洗えたとしているが、貼った後は24〜72時間置いてから洗うよう案内している。最低注文は1枚から。","2026-11-17","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/17/23800/"],["京都ステッカー、アプリでのUVDTFデザイン作成のコツと入稿仕様","京都ステッカーは2026年11月17日、スマホやタブレットのアプリでUVDTFステッカーのデザインを作るコツと入稿仕様をまとめた記事を公開した。写真やグラデーションをきれいに出すため300DPI以上のPNGかJPGで書き出すよう勧め、アプリで選んだ金・銀などのメタリック色は色味での再現になると注意している。質感を確かめる無料サンプルも頼める。料金は50×50mmの10枚で1,080円〜（税抜）。","\n【概要】京都ステッカーは2026年11月17日、スマートフォンやタブレットのアプリでUVDTFステッカーのデザインを作るときのコツと、入稿の仕様をまとめた記事を公開した。パソコンのデザインソフトを使わない人でも、オリジナルのステッカーを作れるよう注意点を示している。\n【背景】最近はスマホのアプリで手軽にイラストやロゴを作る人が増えている。ただ、印刷用のデータには解像度や形式などの条件があり、画面で見たとおりに仕上がらないこともある。京都ステッカーは、UV硬化インクで透明なPETフィルムに印刷するUVDTFステッカーを自社で製作しており、入稿前のつまずきを減らす狙いがある。\n【詳細】記事では特定のアプリ名は挙げていないが、Canvaについての別記事へのリンクを載せている。データは、写真やグラデーションをきれいに再現するため300DPI以上のPNGかJPGで書き出すよう勧め、使っているアプリがその形式で書き出せるかを事前に確かめるよう呼びかけている。アプリで金や銀などのメタリック色を選んでも、印刷では色味として再現されるだけで、特殊インクにはならない。印刷はCMYKと白インクで、フチなしで仕上がる。金・銀、メタリック、箔、鏡面仕上げには対応していない。貼れる素材はガラス、金属、プラスチック、木材、陶器で、ゆるやかな曲面のカップやボトルにも貼れる。耐水・耐摩耗・耐UV性があり、屋外でも使えるという。質感や手触りを確かめるための無料サンプルも頼める。料金（税抜）は50×50mmで10枚1,080円〜、100×100mmで100枚18,000円〜など。最低注文は1枚から。\n【ポイント・注意点】食洗機については、FAQで自社テストの約100回の洗浄に耐えた結果を示す一方、食洗機への対応は検証中とも記しており、表記が分かれている。気になる場合は無料サンプルで試すとよい。貼った後はスキージーでしっかり押さえ、24〜72時間置いてから洗うよう案内している。見積もりはPDFでダウンロードでき、標準配送は2〜4営業日で無料。","2026-11-17","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/17/23792/"],["LONGER ePrint、20種類以上の表現技法で卓上カスタム制作を拡張","3Dnativesは2026年11月16日、LONGERの卓上UVフラットベッドプリンター「ePrint」を紹介する記事を掲載した。2つのヘッドと12のインクチャンネルで、100万色以上、最大1,440dpiをうたい、印刷範囲は310×420mm。刺しゅう風、木や石の質感、最大15mmのレリーフなど20種類以上の表現技法を挙げる。デュアルUVと、DTFやDTGもこなすUV+DTFの2構成がある。","\n【概要】3Dプリンター専門メディアの3Dnatives（英語版）は2026年11月16日、LONGERの卓上UVフラットベッドプリンター「ePrint」を紹介する記事を掲載した。フルカラー印刷と立体のレリーフ表現、20種類以上の表現技法を1台でこなす機械として、メイカーや小さな工房、ネット販売者に向けて取り上げている。\n【背景】LONGERは約10年にわたってレーザー加工機と3Dプリンターを作ってきたメーカーで、卓上UVプリンターにも力を入れている。11月17日から20日までドイツ・フランクフルトで開かれたFormnextにも、ホール12.0のA07ブースで出展した。\n【詳細】ePrintは2つのプリントヘッドで12のインクチャンネルを使い、100万色以上、最大1,440dpiをうたう。印刷範囲は310×420mm。1,600万画素のカメラがベッドを撮影して対象物の輪郭を見つけ、印刷範囲をプレビューする。対応素材は木、アクリル、革、金属、ガラスなど300種類以上だという。構成は2つあり、デュアルUVはUV直接印刷、細かなグラフィック、テクスチャ、フルカラーのレリーフに対応する。UV+DTFはそれに加え、UV DTF（フィルムを瓶やボトルに転写）、DTF（フィルムと接着パウダーで布に熱転写）、DTG（衣類への直接印刷）の4つの作業ができる。表現技法には、インクを重ねた刺しゅう風、木や石の質感、インクとコーティングによる鏡のような光沢、両面カラー、最大15mmのレリーフ、1つのデザインでのマットと光沢の使い分け、ネイル、蛍光印刷などがある。ソフトのLONGER Studioは、文字からのロゴ生成、画像からの画像生成、背景除去、素材のAI認識、カメラでの位置合わせ、2Dから3Dレリーフへの変換、まとめて印刷などの機能を備える。\n【ポイント・注意点】記事に価格は載っておらず、LONGERのサイトでのブラックフライデーのセールに触れるだけだ。性能や対応素材の数はメーカーの説明によるもので、実際の仕上がりや手入れの手間は自分で確かめる必要がある。","2026-11-16","3Dnatives","https://www.3dnatives.com/en/longer-eprint-16112026/"],["米印刷店Little 6の業界週報、UV-DTFは高付加価値の商機と分析","米アリゾナ州の印刷店Little 6 Industriesは2026年11月16日、カスタム印刷業界の週報を公開した。中心はDTFだが、UV-DTFステッカーなどの特殊仕上げを高付加価値の商機として取り上げ、地元の競合がUV-DTFやグリッター、金箔DTFを扱っていると紹介した。筆者はドリンクウェアや硬い素材にUV-DTFを勧めている。DTFのギャングシートの相場やミマキのDTF機など、周辺の動きもまとめた。","\n【概要】米アリゾナ州でカスタム印刷を手がけるLittle 6 Industriesは2026年11月16日、自社ブログでカスタム印刷業界の週報「Custom Printing Industry Brief」を公開した。筆者はMatt Harvey氏。内容の中心はDTF（フィルム転写）だが、「特殊ステッカーとUV-DTFは引き続き高付加価値の商機」という項目でUV-DTFを取り上げている。\n【背景】UV-DTFは、UV硬化インクでフィルムに印刷したデザインを、タンブラーやボトルなどの硬い素材に転写する方式。衣類向けのDTFと並んで、小さな印刷店が扱う特殊な仕上げの一つになっている。\n【詳細】週報によると、地元の競合であるArizona Inkは、通常の転写に加えてUV-DTFステッカー、グリッターDTF、金箔DTFを扱っており、特殊仕上げでも地元の競争が起きている証拠として紹介された。筆者はドリンクウェアや硬い素材にはUV-DTFを勧め、UV-DTFは客が利用しやすくなってきた特殊仕上げの一つだとしている。そのほかの話題として、Little 6が13色のSuperGamut Krakenをカサグランデの工場に導入することと、2色の蛍光インクをFacebookの投票で選ぶことを伝えた。Pearl DTFが競合19社を調べたところ、22×60インチのギャングシートは12.90〜49.99ドルで、中央値は30ドルだった。アリゾナ州内の22インチ幅のギャングシートは、Outta PHXが60ドル（22×120）、NikNak Creationsが70ドル（22.5×120）、Teddy Transfersが約67.32ドル（22×120）。ミマキのDTFプリンターTxF330-800はCMYK＋白か6色＋白に対応する。DuPontのパウダーを使わないDTFは開発中で、Little 6は今後の動きを注視している。\n【ポイント・注意点】記事はDTFが中心で、UVに関する内容は一部にとどまる。価格調査には販売者が公表した数字も含まれ、Little 6自身の導入の話は同社の発表である点にも注意したい。UV-DTFを始める店にとっては、地元の競合の品ぞろえや価格を見ておく参考になる。","2026-11-16","Little 6 Industries","https://www.little6llc.com/2026/11/16/custom-printing-industry-brief-november-16-2026/"]],"risk":[["乳児期に始まる重いてんかんCDKL5欠損症 たんぱく質の固定の仕組みを解明","英リバプール大学などの研究チームは、乳児期早期から重いてんかんが起きる希少疾患「CDKL5欠損症」の原因となるCDKL5たんぱく質が、神経細胞のシナプスの骨組みにつなぎ留められる仕組みを突き止めた。末端のアミノ酸1つを変えるだけで細胞内の位置が大きく変わり、力に反応するたんぱく質タリンとも直接結合していた。病気の変異の多くはこの部分を失わせており、新たな治療の糸口になると期待されている。","\n【概要】英リバプール大学の研究チームは、フィンランドのヘルシンキ大学と共同で、希少な小児てんかんの原因となるたんぱく質CDKL5が神経細胞のどこで、どのように固定されているかを明らかにした。成果は学術誌Science Advancesに掲載された。\n【背景】CDKL5欠損症（CDD）は、乳児期早期に始まる重いてんかんと、大きな発達上の困難を伴う希少な神経の病気で、CDKL5遺伝子の変異によって起きる。発症は世界で出生4万〜6万人に1人程度とされる。しかし、このたんぱく質が神経細胞の中で実際にどう働くのかは、ほとんど分かっていなかった。\n【詳細】研究チームは、CDKL5を神経細胞のシナプスの構造的な骨組みにつなぎ留める、これまで知られていなかった「ドッキング」の仕組みを特定した。これにより、CDKL5がシナプスのどこにあるのかが示された。この固定の仕組みを壊すと、神経細胞の構造の組み立てが変化した。筆頭著者のヤスミ・オオタニ博士は、CDKL5の末端にあるたった1つのアミノ酸を変えるだけで、神経細胞内での位置が劇的に変わったと説明している。さらにCDKL5は、物理的な力を受けると形を変えるたんぱく質タリンと直接結合することも分かった。培養細胞の実験で、この結合を妨げたり、細胞が生み出す力を弱めたりすると、CDKL5の位置が変わった。機械的な力がCDKL5の居場所に影響する可能性を示す結果だという。\n【ポイント・注意点】CDDに関わる変異の多くはたんぱく質を短くし、今回見つかったドッキング部分を失わせる。研究者らは、こうした変異がたんぱく質そのものの働きだけでなく、正しい場所に届かないことによっても問題を起こしている可能性があるとみている。研究を率いたベン・ゴールト教授は、これまで酵素の働きに注目が集まってきたが、その働きが「どこで起きるか」が重要だと述べた。患者の親が設立した団体CURE5の創設者は、新たな治療の可能性に希望を与える成果だと話している。今回は細胞レベルの研究で、患者への効果が確かめられた段階ではない。","2026-11-20","Medical Xpress","https://medicalxpress.com/news/2026-11-cell-biologists-uncover-key-mechanism.html"],["慢性・複雑な病気の子ほど心の病の診断が多く 290万人を分析","米国のメディケイド加入の5〜17歳、約290万人の2022年のデータを分析した研究で、気分障害や不安症などの心の病の診断がある子の割合は、複雑でも慢性でもない病気の子で7.6%、複雑でない慢性疾患の子で16.0%、複雑な慢性疾患の子で20.0%と、病気が複雑・慢性になるほど高かった。心臓・神経・腎臓の病気で特に高く、研究者は病気の種類に応じた検査や支援の重要性を指摘している。","\n【概要】米国のチルドレンズ・マーシー・カンザスシティの研究者らが、体の病気の複雑さや慢性度と、子どもの心の病の診断との関係を調べ、小児科の学術誌Pediatricsに発表した。病気が複雑で長く続くほど、不安やうつなどの診断を受けている子の割合が高いことが分かった。\n【背景】慢性的な病気や複雑な持病を抱える子どもは、体の治療に目が向きがちで、心の不調が見過ごされるおそれがある。研究チームは、どの病気のグループで心の病の診断が多いのかを大規模なデータで確かめようとした。\n【詳細】研究は、米国の公的医療保険メディケイドの大規模データベースを使った後ろ向きの横断研究で、2022年の5〜17歳の子ども約290万人が対象。不安症、うつ病、双極性障害、強迫性障害、トラウマ関連の障害、自殺・自傷を「気分・不安に関わる心の病の診断」とし、入院や救急で1回、または外来で2回記録された場合に診断ありとした。比較は、体の病気の複雑さと慢性度によって子どもを三つのグループに分けて行った。診断の割合は、複雑でも慢性でもない病気の子で7.6%、複雑でない慢性疾患の子で16.0%、複雑な慢性疾患の子で20.0%と、段階的に高くなった。複雑な慢性疾患のある子では、およそ5人に1人に診断があったことになる。複雑な慢性疾患の中では、心臓、神経、腎臓の分野で診断のオッズが高く、オッズ比はそれぞれ1.49、1.18、1.13だった。また慢性疾患のある子では、非ヒスパニック系白人に比べ、黒人やヒスパニック系の子で診断のオッズが低かった。\n【ポイント・注意点】著者らは、心の病は医療の利用の増加や経済的な負担、持病の悪化、生活の質の低下につながるため、この結果は重い意味を持つとしている。どの病気のグループの子に、どのような背景があるかを理解することで、医師がスクリーニングや介入を改善できる可能性があるという。一方、対象はメディケイド加入の子どもに限られ、後ろ向きの横断研究のため、病気と心の不調の因果関係を示すものではない。持病のある子の診療では、体だけでなく心の状態にも目を配ることが求められる。","2026-11-20","Medical Xpress（HealthDay）","https://medicalxpress.com/news/2026-11-mental-health-medical-complexity-chronicity.html"],["髪抜き・皮むき・爪かみ 11〜18歳の58.5%に 英5400人調査","英オックスフォード大学などが11〜18歳の生徒5400人超を調べたところ、58.5%が爪かみや皮膚むしり、髪抜きといった「身体に向かう反復行動（BFRB）」を少なくとも1つ持ち、13%がかなり、または非常に苦痛を感じていた。苦痛のあるBFRBは不安やうつのある若者の34%、いじめを受けた若者の27%に見られた。研究者は、単なる悪い癖ではなく、悩みのサインであることが多いと呼びかけている。","\n【概要】英オックスフォード大学の研究チームが、主にオックスフォードシャーとリバプールの11〜18歳の生徒5400人以上を調べ、爪かみや皮膚むしり、髪抜きといった「身体に向かう反復行動（BFRB）」がありふれていて、大きな苦痛のもとになっていることを示した。成果はBMJ Mental Healthに掲載された。\n【背景】調査は2年ごとに行われる「OxWell学生調査」の一部で、結果は学校や自治体と共有される。BFRBのある生徒には、その行動でどのくらい動揺するかを「まったくない」から「非常に」まで答えてもらった。\n【詳細】58.5%が少なくとも1つのBFRBを報告し、13%が「かなり」または「非常に」苦痛を感じていた。最も多いのは爪かみ（43.6%）で、皮膚むしり（31.3%）、髪抜き（14.5%）が続いた。BFRBのある人の17.6%は2つ以上を持っていた。苦痛を伴う割合は、髪抜きで37%、皮膚むしりで29%と、爪かみの11%より高かった。女子とトランスジェンダー・性別多様な若者はBFRBを持ちやすく、苦痛も感じやすかった。苦痛のあるBFRBは、トランスジェンダー・性別多様な若者の約4人に1人、女子の約6人に1人に見られ、男子は約18人に1人だった。不安やうつのある若者の34%、いじめを受けた若者の27%が苦痛のあるBFRBを抱えていた。自閉症やADHDのある若者では約5人に1人と、ない人の約2倍だったが、この差はおもに精神的な苦痛といじめで説明できたという。\n【ポイント・注意点】筆頭著者のクレア・マッケイ教授は「BFRBは単なる悪い癖ではない。若者が苦しんでいるサインであることが多い」と述べ、自分を動揺させるような形で抜いたり、むしったり、かんだりしていないか尋ねることが大切な会話のきっかけになるとした。共著者のポリー・ウェイト教授は、恥や偏見が助けを求めにくくしていると指摘する。別の聞き取り研究でも、12人の若者が恥の感情が髪抜きを引き起こし続けると語っていた。叱って止めさせるより、背景にある悩みに目を向けることが求められる。","2026-11-20","Medical Xpress（オックスフォード大学）","https://medicalxpress.com/news/2026-11-hair-skin-common-young-people.html"],["RSウイルス予防のTikTok動画 質が高いのは半分未満 米分析","乳児のRSウイルス感染症を防ぐ妊婦向けワクチンや乳児用抗体薬について、TikTokの動画169本を米ラトガース大学の研究者らが評価したところ、質が高いと判定されたのは79本（47%）だった。誤情報は3%にとどまった一方、内容が混在したり不確かだったりする動画が約20%あった。医療者の動画ほど質が高く、研究者は、家族がネットで混在した情報に触れることを前提に、根拠のある情報源へ案内するよう臨床医に求めている。","\n【概要】乳児のRSウイルス感染症を防ぐ手段について、TikTok上の動画の質を調べた研究が学術誌Vaccineに掲載された。米ラトガース・ニュージャージー医科大学の研究者らによる分析で、質が高いと判定された動画は半分に届かなかった。\n【背景】RSウイルスの予防には、妊婦に接種するワクチン（アブリスボ）と、乳児に投与する抗体薬ニルセビマブ（ベイフォータス）がある。子育て世代がSNSで健康情報を得る機会が増えるなか、その内容が正確かどうかが課題になっている。\n【詳細】研究者らは「RSV vaccine」「RSV jab」「RSV prophylaxis」などの言葉で検索し、2023年7月17日から2025年11月14日までに投稿された169本の動画を調べた。質は1〜5点の「グローバル品質尺度」で評価し、4点を超えるものを高品質とした。対象は、母親に接種するワクチンと乳児に投与する抗体薬の両方を扱う動画だ。点数の中央値は3点で、高品質は79本（47%）だった。作り手は医療従事者が50.3%、親や養育者が37.9%、インフルエンサーが4.7%、所属不明の作成者が4.1%、クリニックが1.8%、科学者・研究者が1.2%で、医療従事者の動画ほど質が高かった。論文の図では、作り手の多い上位3グループとして医療従事者85本、親や養育者64本、インフルエンサー8本が比べられている。明らかな誤情報は3%だったが、内容が混在したり不確かだったりする動画は約20%と、誤情報の約6倍にのぼった。\n【ポイント・注意点】著者らは、動画の多くは根拠に沿っていて医療者が作ったものだったが、5分の1近くは混在した、あるいは不確かな内容だったとまとめている。そのうえで臨床医に対し、家族がネット上で混在した情報に触れることを想定し、根拠に基づく情報源へ導くよう勧めている。保護者にとっては、SNSの動画だけで判断せず、かかりつけの小児科医や産科医に確認することが大切になる。研究はTikTokの動画を一定期間集めて内容を評価したもので、視聴した人の行動への影響を調べたものではない。","2026-11-20","Medical Xpress（ミネソタ大学）","https://medicalxpress.com/news/2026-11-tiktok-videos-rsv-high-quality.html"],["恵まれない地域で育つ幼児 情緒・行動の心配が多く 4歳で最も強く","米ペンシルベニア大学とフィラデルフィア小児病院の研究で、フィラデルフィア周辺の母子249組を1・2・4歳の時点で調べたところ、経済や学校の質、汚染、暑さ、安全な屋外空間などを合わせた「地域の不利」が大きいほど、家庭の収入にかかわらず子どもの情緒面の心配が多く、発達・行動の診断や支援への紹介も受けやすかった。困りごとの差は年齢とともに目立つようになり、4歳で最も強かった。","\n【概要】住んでいる地域の環境が、幼い子どもの情緒や行動の発達に関わっていることを示す研究が、JAMA Network Openに掲載された。米ペンシルベニア大学とフィラデルフィア小児病院（CHOP）の研究者らによるもので、家庭の収入とは別に、地域の不利が子どもの心配事の多さと結びついていた。\n【背景】研究は、妊婦1000人を対象にした先行研究「IGNITE」から一部の家族を追う「出生前から就学前まで（P2P）研究」の一環。地域の環境が子どもの発達にどう影響するかを、早い時期から追跡して調べた。\n【詳細】対象は大フィラデルフィア圏の母子249組で、2021年6月から2025年3月まで追跡し、子どもが1歳、2歳、4歳の時点で評価した。母親が質問票に答え、言葉の遅れや自閉症、ADHD、不安、破壊的行動などの発達・行動面の診断の有無を診療記録で確かめた。研究者らは、各家庭の住所に結びつけた国勢調査などのデータから、経済的な資源、学校の質、汚染、暑さ、安全な屋外空間、貧困、交通の便、住宅の密集度を合わせた「地域の不利」の指標を作った。その結果、地域の不利が大きいほど、家庭の収入に関係なく、母親が報告する子どもの情緒面の心配が多かった。不利な地域の子は、発達・行動の診断を受けたり、支援に紹介されたりする確率も高かった。関連は黒人や多人種の家庭の子で強く、著者らはその背景に歴史的な人種隔離と投資の引き揚げがあると指摘した。困りごとは年齢とともに目立つようになり、4歳で最も強かった。\n【ポイント・注意点】上席著者のレベッカ・ウォーラー氏は、生涯にわたる健やかな発達を支えるには、個々の子どもや家族を支えるだけでなく、子どもが暮らす地域そのものに投資する必要があると述べている。記事には効果の大きさを示す具体的な数値は示されておらず、対象も一つの都市圏の249組に限られる。論文の題名は「早期幼児期を通じた地域の困窮と発達上の懸念」で、幼い時期の暮らしの環境が後の発達に影を落としうることを示しており、家庭だけでなく地域ぐるみの支えが求められる。","2026-11-20","Medical Xpress（ペンシルベニア大学）","https://medicalxpress.com/news/2026-11-disadvantaged-neighborhood-socioemotional-behavioral-young.html"],["持病のある子の家族 ネットの誤情報をどう見分けるか 鍵マークを誤信","カナダ・サスカチュワン大学の小児リウマチのチームが、慢性関節炎などのある10代とその保護者に、ネットの健康情報の使い方を聞き取った。全員がネットを使っていたが、多くがHTTPSの鍵マークやSNSの認証バッジを信頼の目安と誤解していた。必要な答えが見つからないことも多かった。研究者は、年齢に合った情報と、デジタルの健康リテラシーを育てる資料づくりを医療者と家族で進めるよう提案している。","\n【概要】慢性の病気を抱える子どもとその家族が、ネット上の健康情報をどう探し、どう判断しているかを調べた研究について、カナダ・サスカチュワン大学の研究者らが解説した。記事はThe Conversationからの転載で、研究は学術誌Childrenに掲載された。\n【背景】研究チームは同大学の小児リウマチの専門チームで、慢性関節炎や関連するリウマチ性の病気のある10代と、その保護者に聞き取りを行った。記事には参加者の人数は示されていない。\n【詳細】聞き取りをした10代と保護者は全員、健康の支えとしてネットを使っていた。参加者はしばしば、ウェブサイトのHTTPSの鍵マークや、SNSの青い認証バッジを信頼できる目印として頼っていた。しかし、鍵マークはデータが安全に送られることを、認証バッジはアカウントが本人であることを示すだけで、情報の確かさとは関係がないと知らない人が多かった。10代と保護者は、医療者に聞く代わりに「ちょっとした質問」でネットを使っていた。10代は症状の管理や、注射が怖いといった治療への備えについて情報を探し、保護者は判断が根拠に基づくという安心や、不安を和らげる情報を求めていた。どちらも必要な答えが見つからないことが多く、新しい薬の長期的な影響のように、まだ根拠がない場合もあった。10代向けの情報は少なく、年少の子向けか、難しすぎるものが多かった。一方、医療チームは大事な安全網になっており、多くの参加者は医療チームを信頼し、判断の前にネットの情報について相談していた。\n【ポイント・注意点】研究で見えた壁は、誤情報と確かな情報の見分けにくさ、誤った信頼の目印への依存、医師を偽る人物への誤った信頼の三つだった。著者らは、医療者と患者、家族が一緒にデジタルの健康リテラシーの資料や年齢に合ったネット情報を作ること、医療チームが確かな情報源の使い方を年齢に合わせて伝えることを勧めている。家族にとっては、ネットで見つけた情報を、判断の前に主治医や医療チームに確かめることが身を守る手だてになる。","2026-11-20","Medical Xpress（The Conversation）","https://medicalxpress.com/news/2026-11-families-children-chronic-illnesses-online.html"],["乳児のRSウイルス予防 抗体製剤の定期接種化を検討 厚労省がまとめ","厚生労働省は11月18日、小児のRSウイルス感染症の予防に関する議論のまとめを公表し、抗体製剤を予防の選択肢として広く使うことは妥当と評価した。RSウイルスは2歳までにほぼ100%の子が感染し、1歳未満で負担が大きい。新製剤クレスロビマブは入院抑制効果84.2%などが確認された。定期接種の対象は生後1年未満が妥当とし、今後は予防接種基本方針部会で審議することが適当とされた。","\n【概要】厚生労働省は2026年11月18日、小児のRSウイルス感染症の予防についての議論のまとめを公表した。乳児に抗体製剤を使うことを予防の選択肢として広く用いるのは妥当と評価し、定期接種の対象を生後1年未満とすることが妥当だとした。リセマムが内容を伝えた。\n【背景】RSウイルスは飛沫や接触で広がり、1歳までに50%以上、2歳までにほぼ100%の子どもが少なくとも1度は感染するとされる。特に1歳未満の乳児で病気の負担が大きい。予防の手段として、乳児に直接投与する抗体製剤が注目されている。今回の評価では、下気道感染症の発症や入院をどれだけ防げるかが重視された。\n【詳細】新しい抗体製剤のクレスロビマブは、健康な早産児（在胎29週以上）と正期産児を対象にした第IIb/III相の臨床試験で、使用後150日までの下気道感染症の発症を抑える効果が60.4%、入院を抑える効果が84.2%、使用後180日までの発症を抑える効果が59.5%と確認された。費用対効果については、1歳未満の子に抗体製剤を投与した場合、1QALY（質を調整した生存年）あたりニルセビマブで616.5万円、クレスロビマブで579.5万円と推計された。QALYは、生きられる年数を生活の質で重み付けした指標だ。まとめは、効果だけでなく費用に見合うかどうかも含めて評価している。定期接種については、抗体製剤の対象を生後1年未満とすることが妥当とした。接種の時期は、流行に地域差があることを踏まえ、通年での接種も含めて検討するとしている。\n【ポイント・注意点】一方で、クレスロビマブは実際の診療での知見がまだ乏しく、定期接種にどう位置付けるかは検討を要するとされた。今後は予防接種基本方針部会で審議することが適当とされており、すぐに定期接種が始まるわけではない。乳児のRSウイルス感染症は重症化して入院につながることがあるため、保護者は今後の国の議論の行方に注目するとともに、現時点での予防の選択肢については小児科医などに相談するとよい。","2026-11-20","リセマム","https://resemom.jp/article/2026/11/20/88394.html"],["幼児の食事に悩む初めての父親 「十分食べているか」に不安 スウェーデン調査","スウェーデンのウプサラ大学が、生後10〜24か月の子を持つ初めての父親21人に聞き取りを行ったところ、多くが子どもに自分で食べ物を探らせることと、十分に食べさせることの両立に悩んでいた。食べる量が少ないときや食事への関心が薄いときに不安を感じ、体重が少ない子の父親ほど迷いが大きかった。父親たちは場面ごとの実践的な助言を求めており、研究者は乳幼児健診などでの支援の必要性を訴えている。","\n【概要】スウェーデンのウプサラ大学の研究チームが、幼い子どもの食事に関わる初めての父親の経験を調べ、学術誌PLOS Oneに発表した。父親たちは、子どもの自主性を尊重することと、十分な量を食べさせることのあいだで揺れていた。\n【背景】子どもの食事に関するこれまでの研究は、おもに母親を対象にしてきた。一方スウェーデンでは、育児休業中に多くの父親が食事の責任を担うようになる。ところが、子どもが大きくなるにつれて、乳幼児健診を行う子ども保健センターなどとの接点は減っていくことが多い。\n【詳細】研究は博士課程のイルヴァ・トーネル・ル・プリオル氏が率いた聞き取り調査で、生後10〜24か月の子を持つ初めての父親21人が参加した。父親が子どもの食べ物や食事にどう関わっているかを調べたものだ。中心となる結果は、父親たちが、子どもに自分で食べ物を発見させることと、十分に食べているか確かめることの両立を図ろうとしていた点だった。多くの父親が食事の世話を大切で、かつ難しいものと感じていた。子どもが思ったより食べないときや、食べ物にあまり興味を示さないときに不安を覚えていた。「もっと食べるよう促すべきか、子どもに任せるべきか」という問いが繰り返し語られた。体重が少ない子や、体重がなかなか増えない子の父親ほど迷いが大きく、体重の多い子の父親には同じような心配は見られなかった。何人かの父親は、さまざまな食事の場面にどう対応すればよいか、より分かりやすく実践的な助言を求めていた。\n【ポイント・注意点】研究者は、この研究が子ども保健サービスによる父親への支援の必要性を浮き彫りにすることを期待している。育児休業中に父親が食事を担うことが多い一方で、相談先との接点が減っていくという支援の空白が指摘された形だ。ただし、1か国の父親21人を対象にした小規模な質的研究で、経験を描いたものであり、どのくらいの割合の父親が同じ悩みを持つかを示すものではない。子どもの食べる量や体重の増え方が心配なときは、父親も健診や相談の場を積極的に利用することが望まれる。","2026-11-20","News-Medical","https://www.news-medical.net/news/20261120/Study-reveals-uncertainty-among-new-fathers-navigating-toddler-feeding-habits.aspx"],["子ども用パジャマが難燃基準に違反 やけどの恐れで米国で回収","米消費者製品安全委員会（CPSC）は11月19日、Qpancyブランドの子ども用パジャマセット約1309着の回収を発表した。子どもの寝間着に義務づけられた燃えにくさの基準に違反し、重いやけどの恐れがある。サイズは4〜5歳向けから10〜11歳向けまでで、アマゾンで2026年3〜8月に約20ドルで販売された。けがの報告はないが、直ちに使用をやめ、返金を受けるよう呼びかけている。","\n【概要】米消費者製品安全委員会（CPSC）は2026年11月19日、Qpancyブランドの子ども用パジャマセットの回収を発表した（回収番号27-094）。子ども用の寝間着に義務づけられている燃えにくさの基準に違反しており、重いやけどの恐れがあるという。\n【背景】子どもの寝間着は、火が近づいたときに燃え広がりにくいことが法律で求められている。基準を満たさない寝間着は、万一の着火の際に深刻なやけどにつながりかねない。CPSCは、この義務基準を満たさない今回の製品について、重いけがや死亡につながる危険があるとしている。販売元は中国のShanghai Shengkailong Trading Co., Ltd.で、Qpancyの名で事業を行っている。\n【詳細】対象は約1309着。長袖で前ボタンと胸ポケットのある上着、半ズボン、人形用のおそろいのパジャマがセットになっている。柄は多色の猫、ピンクのリボン、ピンクと白のしまのリボン、ピンクと白のしまの4種類。サイズは120（4〜5歳向け）から150（10〜11歳向け）まで。ブランド名は首のラベルに、サイズは脇の縫い目のラベルに表示されている。米アマゾンで2026年3月から8月まで、約20ドルで売られていた。これまでにけがの報告はないが、CPSCは子どもを守るため早めの対応を求めている。\n【ポイント・注意点】CPSCは、持っている人に直ちに使用をやめ、Qpancyに連絡して全額の返金を受けるよう求めている。返金を受けるには、パジャマを半分に切り、壊したパジャマの写真を指定のメールアドレスに送ったうえで処分する。セットには人形用のパジャマも含まれるため、子どもが人形遊びに使っている分も忘れずに確かめたい。日本でも海外の通販サイトを通じて子ども服を買う機会があるが、寝間着は燃えにくさの表示や安全基準への適合を確かめ、ストーブやガスこんろなど火のそばで子どもが過ごすときは服装にも気を配ることが大切になる。回収の詳しい手続きはCPSCの告知ページで確認できる。","2026-11-19","米消費者製品安全委員会（CPSC）","https://www.cpsc.gov/Recalls/2027/Qpancy-Recalls-Childrens-Pajama-Sets-Due-to-Risk-of-Serious-Injury-or-Death-from-Burn-Hazard-Violate-Mandatory-Standards-for-Childrens-Sleepwear"],["乳児用バウンサーが使用中に崩れる 頭を打つ例も 米国で回収","米消費者製品安全委員会（CPSC）は11月19日、Kidsviewブランドの乳児用バウンサー約412台の回収を発表した。使用中に崩れて乳児がけがをする恐れがある。崩れたという報告は7件あり、うち2件は乳児の頭が床などに当たり、1件は医療機関を受診した。対象は2022年8〜10月製造の品で、座面の裏のラベルで確認できる。CPSCは直ちに使用をやめるよう求めている。","\n【概要】米消費者製品安全委員会（CPSC）は2026年11月19日、Kidsviewブランドの乳児用バウンサーの回収を発表した（回収番号27-092）。使用中に崩れることがあり、中にいる乳児が衝撃でけがをする恐れがあるという。\n【背景】バウンサーは乳児を寝かせたり座らせたりして揺らす育児用品で、家事の合間などに使われることが多い。今回の回収は、乳児が乗っている状態で本体が崩れる危険を理由としている。販売元は中国のZhongshan Haimao Cross-border Information Technology Co., Ltd.で、Kidsviewの名で事業を行い、アマゾンを通じて販売していた。\n【詳細】対象は約412台で、色はカーキ。動物のおもちゃが付いたアクセサリーバーがある。2022年8月、9月、10月に製造されたもので、布の座面の裏に縫い付けられたラベルの日付コードが「2022/08」「2022/09」「2022/10」で始まるものが該当する。米アマゾンで2022年8月から2023年11月まで、60〜170ドルで販売された。Kidsviewには使用中に崩れたという報告が7件寄せられ、そのうち2件では乳児の頭が下の床などに当たった。1件では、保護者が乳児のために医療機関を受診したと報告している。対象の台数は多くないが、乳児の頭を打つ事故につながっている点が重い。\n【ポイント・注意点】CPSCは、持っている人に直ちに使用をやめるよう求めている。座面のラベルで日付コードを確かめ、対象であれば、布の座面に油性ペンで「RECALLED」と書き、日付コードのラベルが見えるように写真を撮って、指定のメールアドレスに送る。告知ページでは、対応は「返金」とされる一方、詳細欄ではアマゾンのギフトカードの提供と書かれている。バウンサーのような育児用品は、使用中に目を離さないこと、床など低く安定した場所で使うことが基本になる。中古品や海外の通販で買った品も含め、回収の対象になっていないか確かめておきたい。","2026-11-19","米消費者製品安全委員会（CPSC）","https://www.cpsc.gov/Recalls/2027/Kidsview-Recalls-Infant-Bouncers-Due-to-Risk-of-Collapse-and-Impact-Injury-to-Infants"],["手足から強力磁石が外れる人形おもちゃ 約10万個を米国で回収","米消費者製品安全委員会（CPSC）は11月19日、CHE-USの磁石付き人形おもちゃ約10万1282個の回収を発表した。手足を引っ張ると中の強力な磁石が外れ、子どもが飲み込む恐れがあり、おもちゃの義務基準に違反する。飲み込んだ磁石は腸に穴を開けるなどして死に至ることもある。アマゾンで2025年4月〜2026年8月に販売。けがの報告はないが、すぐに子どもから取り上げるよう求めている。","\n【概要】米消費者製品安全委員会（CPSC）は2026年11月19日、CHE-USブランドの磁石付きの人形おもちゃの回収を発表した（回収番号27-096）。手足を引っ張ると強力な磁石が外れ、子どもが飲み込む恐れがあるとして、おもちゃの義務基準に違反するとしている。\n【背景】強力な磁石を複数飲み込むと、腸の中で磁石同士や金属が引き合い、消化管にとどまってしまう。CPSCは、その結果、腸の穿孔やねじれ、閉塞、血液の感染（敗血症）を起こし、死に至ることもあると警告している。今回の製品は、手足から強力な磁石が外れることで、米国のおもちゃの義務基準に違反するとされた。\n【詳細】対象は約10万1282個。棒人間の形をした磁石付きの人形で、5体または10体のセットになっており、色は紫、青、黄、赤、緑。各人形には両手両足に1つずつ、計4つの小さな磁石が入っている。包装の裏には「X004N3MGCB」と印刷されており、手元の製品が対象かどうかはこの表示で確かめられる。米アマゾンで2025年4月から2026年8月まで、9〜18ドルで販売された。販売元は中国のGuangzhou Shian Trading Co., Ltd.で、CHE-USやCHESLICRの名で事業を行っている。これまでにけがの報告はない。1体に4つの磁石が入っているため、10体のセットでは磁石が40個になり、複数を飲み込む危険がある。\n【ポイント・注意点】CPSCは、直ちに使用をやめ、人形を子どもから取り上げて、CHE-USに連絡し全額の返金を受けるよう呼びかけている。返金には、おもちゃをごみ箱に入れた写真を指定のメールアドレスに送り、処分する。磁石入りのおもちゃは、壊れたり分解されたりして中の部品が出てくることがある。小さな子どもがいる家庭では、手足や部品が外れかけていないか日ごろから点検し、磁石を飲み込んだ疑いがあるときは、症状がなくてもすぐに医療機関を受診することが大切だ。海外通販で買ったおもちゃは、回収情報を確認しておきたい。","2026-11-19","米消費者製品安全委員会（CPSC）","https://www.cpsc.gov/Recalls/2027/CHE-US-Recalls-Magnetic-Robot-Toys-Due-to-Risk-of-Serious-Injury-or-Death-from-Magnet-Ingestion-Violate-Mandatory-Standard-for-Toys"],["米ペンシルベニアではしか8人目の死者 致死率を知らない人が6割近く","米ペンシルベニア大学アネンバーグ公共政策センターが成人1000人超に行った調査で、はしかで死亡する確率を知らない人が60%近くにのぼり、子どもが十分に守られるにはMMRワクチンが2回必要だと知っていた人は3分の1にとどまった。公表と同じ日、ペンシルベニア州は8人目のはしか関連の死亡を発表し、米国の今年の死者は11人になった。専門家は、信頼される人が情報を伝える大切さを指摘している。","\n【概要】米ペンシルベニア大学アネンバーグ公共政策センターが、はしか（麻疹）の危険やワクチンについての米国の成人の理解を調べた調査結果を公表した。ミネソタ大学が伝えたもので、多くの人が病気の危険を十分に理解していないことが分かった。\n【背景】記事によると、米国ではワクチン接種率の低下を背景に、2025年1月からはしかの全国的な流行が続いている。ジョンズ・ホプキンス大学の集計では患者は累計8025人にのぼる。汎米保健機構は、ウイルスが1年以上続けて広がっているとして、米国のはしか排除の認定を取り消した。調査が公表された日、ペンシルベニア州は8人目のはしか関連の死亡を発表し、米国の今年の死者は11人となった。昨年の死者は3人だった。\n【詳細】調査は11月6〜8日に成人1000人超を対象に行われ、誤差は±3.5ポイント。60%近くが、はしかで死亡する確率を知らなかった。正しい「約1000人に1人」を選んだのは10人に1人だけで、米疾病対策センター（CDC）は感染した子ども1000人当たり1〜3人が死亡すると推計している。4分の1近くは実際より低く、10%近くは高く答えた。子どもへのMMRワクチンが自閉症を起こすという誤った主張には64%が同意しなかったが、17%が同意し、19%は分からないと答えた。規定どおり接種を受けた子も受けていない子も自閉症の兆候の出やすさは「ほぼ同じ」と正しく答えた人は半数近くだった。子どもが十分に守られるにはMMRの接種が2回必要だと知っていたのは3分の1で、半数近くは分からないと答えた。\n【ポイント・注意点】科学コミュニケーターのエリザベス・マーニク氏は、情報だけでは人の行動や考えは変わりにくく、信頼する人から伝えられることが必要だと述べた。米エモリー大学の感染症専門医ボグマ・ティタンジ氏は、ためらう親にまず心配の理由や情報の出どころを尋ね、耳を傾けることで、科学的根拠に基づく例を示せると話している。はしかは子どもの命に関わる病気で、子どもの接種歴を母子手帳などで確かめ、不安があればかかりつけ医に相談しておきたい。","2026-11-19","Medical Xpress（ミネソタ大学）","https://medicalxpress.com/news/2026-11-pennsylvania-measles-death-survey-americans.html"],["年末のおもちゃ選び 誤飲・窒息を防ぐには 米専門家が助言","米テキサス大学ヒューストン健康科学センター（UTHealth Houston）の専門家が、年末年始のおもちゃ選びの注意点をまとめた。小さな部品や風船による窒息、ボタン電池や磁石の誤飲は命に関わることがあり、ボタン電池を飲み込んだら緊急事態として扱うよう求めた。年齢表示や安全基準の表示を確かめ、信頼できる店で買うこと、車輪のあるおもちゃではヘルメットを着けることなども勧めている。","\n【概要】米テキサス大学ヒューストン健康科学センター（UTHealth Houston）の専門家が、年末年始の贈り物シーズンに向けて、子どもに安全なおもちゃを選ぶための助言を質疑応答の形でまとめた。News-Medicalが紹介した。\n【背景】贈り物の季節はおもちゃを買う機会が増え、子どもが新しいおもちゃに触れる時期でもある。記事は研究結果ではなく、専門家による実践的な助言で、具体的な統計は示していない。\n【詳細】よくあるおもちゃのけがとして、小さな部品やビー玉、風船、壊れた破片による窒息や、鋭い縁による切り傷を挙げた。ボタン電池や磁石は、飲み込むと体内でやけどや詰まりを起こし、命に関わることがあるという。車輪のあるおもちゃでは、最初に使うときからヘルメットや保護具をきちんと着けるべきだとし、病院では全地形対応車（ATV）や電動キックボードなど動力付きの乗り物による重いけがが目立って増えていると指摘した。おもちゃを買うときは、子どもの発達の段階に合っているか確かめ、米国の安全基準を満たしていることを示す表示を探し、偽物を避けるため信頼できる店で買うよう勧めた。偽物には有害な化学物質や鉛を含む塗料が使われていることがあるという。年齢表示は発達の段階と危険の両方を反映しているため、年齢と体の大きさを考え、安全表示を読むことが大切だとした。小さな部品かどうかを確かめる器具も、窒息の危険を見分けるのに役立つという。\n【ポイント・注意点】電子おもちゃやリモコンにはボタン電池が入っていることが多い。ねじ止めのふたはしっかり締め、予備の電池は子どもの手の届かない所に保管する。ボタン電池を飲み込んだら、迷わず緊急事態として扱うよう求めている。赤い丸に「0-3」と書かれた表示は、小さな部品があり3歳未満には危険だという警告だ。最後に、大人がそばで見守り、一緒に遊ぶことが安全につながり、子どもの発達も支えると結んでいる。贈り物を開けたら、電池のふたや小さな部品を大人がひと通り確かめてから子どもに渡すと安心だ。","2026-11-18","News-Medical","https://www.news-medical.net/news/20261118/Expert-advice-on-choosing-safe-toys-for-the-holiday-season.aspx"],["新型コロナの症状が重かった10代ほど論理や数の力が低め オーストリア","オーストリアのカール・ランドシュタイナー医科大学などが12〜16歳の3860人を調べたところ、新型コロナの最も重かったときの症状が重い人ほど、論理的思考や数の力の得点が低い傾向があった。感染したかどうかや回数は成績と関連しなかった。差は最も軽い人と重い人で標準得点3〜7点ほどで、全体のIQの低下ではないという。自己申告の一時点の調査で、研究者は追跡研究の必要性を訴えている。","\n【概要】新型コロナウイルスに感染したときの症状の重さと、10代の認知機能との関係を調べた研究が、学術誌Scientific Reportsに掲載された。オーストリアのカール・ランドシュタイナー医科大学心理学部などのチームによるもので、症状が重かった人ほど一部の能力の得点が低い傾向が見られた。\n【背景】子どもや10代は新型コロナで重症化しにくいとされるが、感染が脳の働きに影響するかは関心を集めてきた。今回は、感染の有無だけでなく、症状の重さに注目して調べた。\n【詳細】研究は、2024年4月から10月にオーストリア・ニーダーエスターライヒ州で12〜16歳（平均13.5歳）の3860人を調べた横断研究で、女子は47.4%だった。参加者は感染歴と、最も重かったときの症状を9段階で自己申告した。言語、論理、数、空間、長期記憶を測るテストなどで認知機能を評価し、年齢、性別、学校の種類で調整し、重回帰分析と機械学習の手法で分析した。83.9%が少なくとも1回の感染を報告し、症状の重さの平均は9段階で2.9だった。症状が重いほど論理的思考と数の能力が低く、女子では言語能力も低かった。最も軽い人と最も重い人の差は、論理で5.4、数で2.9、女子の言語で7.2と、標準得点で約3〜7点だった。著者らは、これは特定の領域の差で、全体的なIQの低下ではないとしている。新型コロナに関する要因で説明できる成績のばらつきは、それぞれ1%未満の上乗せにとどまった。感染したかどうかや感染の回数は、成績と有意な関連がなかった。\n【ポイント・注意点】研究は一時点の調査で、感染歴は自己申告であり、感染前の成績もない。感染の時期やワクチン接種、持病、思春期の段階などの情報もなく、休校や心の健康の影響もありうるという。機械学習で見えた非線形のパターンは探索的な結果とされている。著者らは、長期の追跡研究と別の集団での再現が必要だとしている。結果は因果関係を示すものではなく、過度に心配するより、体調の回復を丁寧に見守ることが大切だといえる。","2026-11-18","News-Medical","https://www.news-medical.net/news/20261118/COVID-19-and-the-teenage-brain-Why-the-severity-of-symptoms-may-matter.aspx"],["手術前にレースゲームで遊ぶと子どもの不安が和らぐ 米イェール大","米イェール大学医学部の麻酔科のチームが、全身麻酔で手術を受ける4〜14歳の子どもに、麻酔のマスクを着ける直前、ベッドの足元の画面でレースゲームを遊ばせる試みをランダム化比較試験で検証した。ゲームを使った子は、通常の対応の子に比べ、麻酔導入前の不安の高まりが有意に小さかった。ゲームはハンドルを操作しなくてもコースから外れないものを選び、手術室のスタッフの評価も良かったという。","\n【概要】手術の前にレース型のテレビゲームで遊ぶと、子どもの不安の高まりを抑えられることが、米イェール大学医学部麻酔科のチームの研究で分かった。成果は学術誌Journal of Clinical Anesthesiaに掲載された。\n【背景】全身麻酔で手術を受ける子どもにとって、麻酔のマスクを着ける瞬間は大きな不安のもとになる。研究チームは、子どもが受け身で画面を眺めるのではなく、周りの状況も分かりながら能動的に関われる道具を使いたいと考えた。論文の題名には、ゲームが子どもの不安を減らし、麻酔導入への協力も良くしたことが示されている。\n【詳細】研究は、全身麻酔で処置を受ける4〜14歳の子どもを対象に、手術直前に運転をテーマにしたゲームを遊ぶことで不安の高まりが減るかを調べたランダム化比較試験。研究責任者はアンソニー・ロンギーニ医師。持ち運べる「ベッドサイド・エンターテインメント・リラクゼーション・シアター（BERT）」を使い、ベッドの足元のスクリーンにゲームを映した。子どもは部屋の様子も分かる状態で遊ぶことができる。ゲームはレゴバットマンのレースゲームで、子どもがハンドルを操作してもしなくてもコースから外れないため、見ているだけでも、積極的に遊んでもよい。子どもたちはマスクを着ける前に1分ほど遊ぶことが多く、眠くなりながら遊び続ける子もいた。その結果、BERTを使った子は、通常の対応の子に比べて、麻酔導入前の不安の高まりが有意に小さかった。手術室のスタッフへの調査でも評価は前向きで、スタッフは患者ごとに装置の準備と片付けを手伝った。BERTはもともと米スタンフォード大学のチャリオット・プログラムが開発したものだ。\n【ポイント・注意点】研究チームは次の段階として、どのような方法がそれぞれの子どもに最もよく合うかを探るとしている。記事には参加人数や効果の大きさなどの数値は示されておらず、結果の程度は論文で確かめる必要がある。手術や検査を控えた子の不安を和らげる工夫として、病院での取り組みが広がるかが注目される。","2026-11-18","News-Medical","https://www.news-medical.net/news/20261118/Playing-racing-video-games-reduces-pre-surgery-anxiety-in-children.aspx"],["「ペニシリンアレルギー」の子の多くは実はアレルギーでない 見直しを","英国の医師らが、子どもの抗菌薬アレルギーの記録の多くは誤りの可能性があると解説した。米国では子どもの約20人に1人にペニシリンアレルギーが記録されているが、ウイルス感染による発疹などを誤ってアレルギーとした例が多いという。誤った記録は効きの劣る薬の使用や入院の長期化につながる。2024年の研究では、見直しで91%の子の記録が外れた。保護者には、子どもが元気なときにかかりつけ医に見直しを相談するよう勧めている。","\n【概要】子どもの診療記録に書かれた「抗菌薬（抗生物質）アレルギー」の多くは、実際にはアレルギーではない可能性があると、英国の医師らが解説した。記事はThe Conversationからの転載で、誤った記録を外す「脱ラベル化」の考え方を紹介している。\n【背景】記事は、扁桃炎の10歳の男児の例から始まる。母親がペニシリンも「〜マイシン」という名の抗菌薬も使えないと話したため、治療が難しくなったという。著者らによると、米国では子どもの約20人に1人の診療記録にペニシリンアレルギーと書かれているが、研究ではそうした子の多くは本当のアレルギーではないとされる。\n【詳細】子どもの「アレルギー」の記録の多くは、ウイルス感染症にかかっていたときに始まる。ウイルスによる発疹や、嘔吐、頭痛、発熱、関節の痛みといった症状が、薬のアレルギーと誤解されるのだ。いったん記録されると、大人になるまで残ることがある。誤った記録があると、効きが劣り、幅広い菌に作用する抗菌薬が使われやすくなり、MRSAやクロストリディオイデス・ディフィシル感染のリスク、入院の長期化、費用の増加につながる。2024年の研究では、外来やかかりつけ医の場で手順に沿って見直した結果、評価した子の91%で記録を安全に外すことができた。著者らは子どもを三つに分ける。最初の症状が典型的でない、その後同じ薬を問題なく使った、家族のアレルギーだけが理由、といった場合は検査なしで外せる。軽い発疹だけの場合は、見守りのもと自宅で1回服用し、1週間後に電話で確認する。アナフィラキシーや重い粘膜の発疹があった子や、重い・コントロール不良のぜんそくの子は、小児アレルギーの専門医に紹介する。\n【ポイント・注意点】保護者には、子どもが元気なときに、かかりつけ医に診断を見直せるか尋ねるよう勧めている。記録が外れたら、はっきりした説明と書面での確認を受けるべきだという。一方で、医師の助言なしに自己判断で抗菌薬を再び飲ませてはいけないとしている。誤った記録を
