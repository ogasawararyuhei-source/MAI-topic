,"Hacker News（Show HN）","https://news.ycombinator.com/item?id=50651990"],["Hush：AIエージェントが裏でデスクトップアプリを操作","AIエージェントがフォーカスやマウスのポインターを奪わずに、裏側でデスクトップアプリを読み取り、クリックし、入力できるようにするツール「Hush」がShow HNで公開された。作者の測定では、読み取り・クリック・入力の1往復が178ミリ秒だという。コマンド、MCPサーバー、スキルとして使え、デスクトップの試験を文字のファイルで書ける。Rust製でMITライセンス。","\n【概要】\nHush は「AIエージェントのための最速のコンピューター操作」をうたうツールです。人がパソコンを使っている間も、エージェントが裏でアプリを操作できるのが特徴で、画面の前面を奪いません。2026年11月26日にShow HNで紹介されました。\n【背景】\n画面を操作するAIエージェントは、ウィンドウを前面に出したりマウスを動かしたりするため、その間は人がパソコンを使えないことが多くあります。また操作1回ごとの待ち時間も課題です。Hush は、裏で速く動くことでこの2つの問題に取り組んでいます。\n【詳細】\nツールは apps、observe、act、timeline、script、see、record で構成されます。デスクトップの試験は .hush という文字のファイルで書けます。コマンド、MCPサーバー、スキルのどの形でも使え、アプリごとの制限を設定ファイルで決められます。作者の比較では、読み取り・クリック・入力の1往復が178ミリ秒で、別のツール agent-desktop の653ミリ秒より速いとしています。ツールの一覧が使うトークンも972対1万514と少なくなっています。試験では、Claude Sonnet 5.5 と Haiku 5.5 で15件の裏側の作業をすべて達成し、Sonnetの中央値は17.8秒でした。言語はRustで、導入はインストール用スクリプトのあと hush setup を実行するか、cargo install で行います。\n【ポイント・注意点】\n主な機能はmacOS 15以上が対象で、アクセシビリティと画面収録の許可が必要です。LinuxはAT-SPIとXvfbで対応しており、Windowsは「次の予定」とされています。示された速度や比較の数値は作者自身が測ったものなので、自分の環境で確かめるのがよいでしょう。cargo install で入れる場合、READMEは Rust 1.100 以上が必要だとしています。ライセンスはMITで、取得時点のスター数は20でした。","2026-11-26","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50651523"],["StackMaestro：エージェントが作る積み重ねPRを手元で管理","gitの親子関係からブランチとプルリクエストの「積み重ね（スタック）」を読み取って表示する、CursorやVS Code向けの拡張とMCPサーバー「StackMaestro」がShow HNに登場した。計画ファイルもサーバーもデータベースも使わない。複数のエージェントが同じ層を触らないよう「作業中」の印を付ける仕組みもある。TypeScript製でMITライセンス。","\n【概要】\nStackMaestro は、積み重ねたプルリクエスト（スタック）を扱うための道具です。ブランチ同士のgit上の親子関係から自動で積み重ねの形を割り出し、エディターの中で一覧できるようにします。2026年11月26日にShow HNで紹介されました。\n【背景】\n大きな変更を小さなプルリクエストに分け、順に積み重ねて見てもらう開発の仕方があります。コーディングエージェントが変更を次々に作るようになると、このスタックが増えて管理が難しくなります。作者はHNのコメントで、スタックをもっと楽に扱うために作った道具の簡単なデモだと紹介しています。\n【詳細】\nスタックはgitの履歴から推測するため、計画ファイル、裏側のサーバー、データベースは要りません。誰かがある層を作業中であることを示す「クレーム」という印があり、有効期限は90分です。エージェントにはギリシャ神話の名前が付きます。公開の操作では、ブランチを送り、下書きのプルリクエストを開き、GitHubの積み重ねPRの仕組みに登録します。MCPのツールは9つあります。TypeScriptで書かれ、Node 20以上で動きます。導入はビルドしたあと、Cursorへの拡張の追加、Claude Codeへの MCP サーバーの登録、またはmacOS向けのデスクトップアプリから選べます。\n【ポイント・注意点】\nGitHubのコマンド gh を入れて認証しておく必要があります。まだできないこととして、拡張のマーケットプレイスでの公開、署名付きのインストーラー、エージェントの登録の整理などが挙がっています。クレームは設計上、手元の1台の中だけで有効です。公開直後で、取得時点のスター数は0でした。リポジトリの説明には「スタックを理解するCursor・VS Code拡張とGitHubのPRスタック向けMCPサーバー」とあり、人とエージェントの両方が同じスタックを見ながら作業することを想定しています。複数のエージェントに並行してブランチを作らせている人には、整理の助けになりそうです。ライセンスはMITです。","2026-11-26","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50650650"],["Shomei：YubiKeyで守る認証プロキシ、HTTPとTCPに対応","ハードウェアの証明付きのYubiKeyで本人確認をしてから、裏側のHTTPやTCPのサービスへ通す認証プロキシ「Shomei」がShow HNで公開された。名前は日本語の「署名」から取ったという。HTTPではブラウザのWebAuthnを使い、TCPでは短い期限の証明書を発行する。SSHのトンネルや、Tailscale SSHの前に承認をはさむ使い方もできる。Rust製。","\n【概要】\nShomei は、YubiKeyによる認証を通さないと裏側のサービスに届かないようにする認証プロキシです。名前は日本語の「署名」に由来するとREADMEに書かれています。HTTPとTCPの両方に対応します。2026年11月26日にShow HNで紹介されました。\n【背景】\n社内の管理画面やサーバーへの入り口を守るとき、パスワードだけでは不十分で、物理的な鍵を使う認証が注目されています。Shomei は、鍵が本物のYubiKeyであることをハードウェアの証明で確かめる点に重きを置いています。\n【詳細】\nHTTPでは、ブラウザのWebAuthnや、1回限りのコマンドでの確認で本人を確かめ、暗号化したセッションのクッキーを発行します。TCPでは、期限の短い相互TLSの証明書を発行します。shomei ssh を使うと、決まった接続先へのOpenSSHの通信をトンネルできます。Tailscale SSHのモードでは、接続の前にYubiKeyでの承認を求められます。初期の方針では、ファームウェア5.7.4以上のYubiKey 5シリーズが必要です。セッションの期限は初期値で600秒、TCPの証明書は300秒です。言語はRustで、Dockerのイメージも用意されています。導入はインストール用スクリプト、shomei init、Docker Composeでの起動という流れです。\n【ポイント・注意点】\n同梱のTLSの鍵は公開されたもので、手元での試し専用です。1つの入り口が扱えるのは1つのHTTPSの公開先だけです。鍵を外すとセッションは取り消され、プロキシを再起動するとクッキーも無効になります。Tailscale SSHのモードにはPremiumかEnterpriseの契約が必要です。取得時点ではREADMEにライセンスの記載が見当たりませんでした。古いYubiKey 4を使う人には、初期化のときに --u2f の指定を使うよう案内されています。物理的な鍵を持つ人だけを通す入り口を、手軽に自分で立てたい人向けの道具といえます。","2026-11-26","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50650638"],["HealthBar：各サービスの稼働状況をMacのメニューバーで","GitHub、OpenAI、Claude、Vercel、Supabaseなど、よく使うサービスの稼働状況をmacOSのメニューバーにまとめて表示するオープンソースのアプリ「HealthBar」がShow HNに投稿された。約120のステータスページを組み込みで持ち、問題のあるサービスを先に並べたリングで知らせる。30日間の稼働状況も見られる。Swift製でMITライセンス。","\n【概要】\nHealthBar は、ネットのサービスが正常に動いているかをMacのメニューバーで確かめられるアプリです。各社が公開しているステータスページを読み取り、障害が起きていればすぐ分かるようにします。2026年11月25日にShow HNで紹介されました。\n【背景】\n開発の仕事では、GitHubやAIのAPI、ホスティングなど多くの外部サービスに頼っています。何かがおかしいとき、自分の側の問題なのか、サービスの障害なのかを切り分けるのは手間がかかります。HealthBar は、その確認を一目で済ませるための道具です。\n【詳細】\nメニューバーには1つのリングが表示され、最大10の区画に分かれます。問題のあるサービスが先に並びます。一覧では、サービスごとに状態、現在起きている障害、30日間の稼働状況の帯を1行で示します。組み込みのステータスページは約120あり、Atlassian Statuspage と incident.io で作られたページにも対応します。キーボードでの操作や、画面読み上げのVoiceOverにも対応し、自動で更新されます。言語はSwiftで、ライセンスはMITです。導入は Homebrew の cask で、brew install --cask でインストールできます。\n【ポイント・注意点】\nREADMEに明確な注意書きはありませんが、macOS専用のアプリです。表示の元になるのは各サービスが公開しているステータスページなので、ページへの反映が遅いサービスでは、実際の障害より知らせが遅れることも考えられます。公開直後で、取得時点のスター数は1でした。HNへの投稿者とGitHubの持ち主は別のアカウント名になっています。対象のサービスは組み込みの一覧から選ぶ形で、GitHub、OpenAI、Claude、Vercel、Supabase のように、開発者が日々頼るサービスが例として挙がっています。障害のたびに各社のページを開いて回る手間を省きたい人には手軽な選択肢になりそうです。","2026-11-25","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50646969"],["rustling：Apple Silicon向けのRust製の推論エンジン","Inkling 2 MiniというモデルをApple Siliconの上で動かすRust製の推論エンジン「rustling」がShow HNで公開された。コーディングエージェントでの利用を想定し、OpenAI互換のAPIを提供するため、Codex、aider、opencodeから使える。作者の測定では、64GBのM4 Maxで生成速度が毎秒43.2トークンとなり、llama.cppの37.1を上回ったという。","\n【概要】\nrustling は、Apple Silicon搭載のMacで Inkling 2 Mini というモデルを動かすための、Rustで書かれた推論エンジンです。コーディングエージェントでの利用を主な目的にしています。2026年11月25日にShow HNで紹介され、取得時点で12ポイントを集めていました。\n【背景】\n手元のパソコンでモデルを動かせば、コードを外部に送らずにエージェントを使えます。ただ、エージェントは長い文脈を何度も読み込むため、速度と記憶の扱いが課題になります。rustling は特定のモデルとApple Siliconに絞って、この問題に取り組んでいます。\n【詳細】\nOpenAI互換のAPIを提供するので、Codex、aider、opencode などから使えます。rustling chat での会話、generate での1回だけの生成、serve でのサーバー起動ができます。プロンプトのキャッシュは、要求をまたいでも、再起動しても保たれます。初期のモデルは16.6GBで、会話ごとに1〜5GB、長いプロンプトではさらに最大15GBを使います。メモリは48GBあれば快適、32GBでは遅くなるとしています。64GBのM4 Maxでの作者の測定では、短いプロンプトの生成が毎秒43.2トークンで、llama.cppは37.1でした。1万5,194トークンのプロンプトの処理時間は73.9秒対73.5秒とほぼ同じです。ライセンスはApache-2.0とMITから選べ、モデルには別のライセンスがあります。\n【ポイント・注意点】\n扱えるのは文章だけで画像には対応せず、一度に1つの要求しか処理しません。Apple Silicon専用で、CUDAやVulkanには対応しません。4ビットへの変換で精度は少し落ちます。性能の数値は作者自身の測定によるものです。文脈の長さの初期値はチップによって異なり、M1の1万6,384からM5の4万960までです。元のモデルとの一致度は、ソースコードで最も確率の高いトークンが90.4〜91.7%一致したとしています。","2026-11-25","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50646482"],["fmgrep：FM索引を使った巨大コードベース向けの高速grep","巨大なソースコードの中を、永続化したFM索引を使って高速に検索するツール「fmgrep」がShow HNで公開された。作者が以前大手IT企業で関わったコード検索の仕組みを、Claudeの力を借りてオープンソースで作り直したもの。ripgrepに近い使い心地を目指し、Chromiumのリポジトリでは常駐サーバーで中央値12.1ミリ秒で答えるという。Rust製。","\n【概要】\nfmgrep は、事前に作った索引を使ってコードを検索するgrepの仕組みです。AOSP（Androidのソース）のような非常に大きなソースの木を対象にしています。2026年11月25日にShow HNで紹介されました。\n【背景】\n作者は数年前、大手IT企業でコード検索の仕組みに関わっており、それをClaudeの力を借りてオープンソースとして作り直したと説明しています。GitHubが使う疎なn-gramの検索方式を使いたかったものの手に入らず、代わりにFM索引という方式を選んだそうです。FM索引では、出現の数え上げはパターンの長さに、場所の特定は出現の数に比例する時間でできます。\n【詳細】\n検索は AND と OR を組み合わせた式で行え、ripgrep（rg）の一部のオプションと同じように振る舞うことを目指しています。作者の測定では、Chromiumのリポジトリで常駐サーバーを使うと中央値12.1ミリ秒で答え、rgの498ミリ秒より41倍速いとしています。サーバーなしでも中央値38ミリ秒です。索引の作成には38秒かかり、大きさはリポジトリの0.78倍です。索引の大きさはLinuxで1.11GB、Chromiumで2.22GB、125万ファイルのAOSPで12.00GBでした。言語はRustで、cargo install で導入できます。変更の追跡にはWatchmanを使えます。ライセンスはMITです。\n【ポイント・注意点】\nREADMEでは実験的な段階とされ、索引の形式や通信の手順、JSON出力は変わる可能性があります。索引のフォルダーには検索対象の文章が暗号化されずに入ります。サーバーには認証がなく、初期設定では手元の127.0.0.1でだけ待ち受けます。Windowsは対象外で、隠しファイルや除外されたファイル、バイナリは検索しません。性能を測った環境はLinuxで、macOSは「動く」という位置づけです。cargo install には Rust 1.98 以上が必要です。","2026-11-25","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50644731"]],"gh-blog":[["GitHubの見えない隠し文字、1億4500万件を調査","ITmedia NEWSが、RadwareとTechnionの研究者による論文を紹介した。GitHub上の約1億4500万件の投稿やREADMEを調べ、人には見えないがAIエージェントには届く隠し文字を2281件見つけた。約67%はチームが自分たちのAIに向けたメモで、全体の98%は攻撃ではなかった。一方、残る43件は他人のAIエージェントを狙う悪意ある指示で、目的は資格情報の窃取が最も多かった。","\n【概要】ITmedia NEWSの連載「Innovative Tech」が、GitHub上に置かれた「人には見えないがAIには読める隠し文字」を大規模に調べた研究を紹介した。論文は「Who Is Prompt-Injecting Coding Agents? An Empirical Study of Hidden AI-Directed Text on GitHub」で、RadwareとTechnionの研究者によるもの。\n【背景】HTMLコメントのように画面に表示されない文字列でも、IssueやプルリクエストをそのままAIエージェントに読ませれば中身は届く。コーディングエージェントが外部の投稿を読む機会が増え、そこに指示を紛れ込ませるプロンプトインジェクションが懸念されている。\n【詳細】研究チームは約1億4500万件の投稿とREADMEを分析し、Issue、プルリクエスト、コメントから2281件の隠し文字を見つけた。約67%は開発チームが自分たちのAIを動かしたり作業を調整したりするための共有メモ、約16%は「Copilotのレビューは日本語で」といった出力ルール、約15%は「人が管理する欄は編集しない」などの行動制限だった。全体の98%は攻撃ではなく、残る2%の43件が他人のAIを狙う悪意ある試みだった。悪意ある例の44%はMicrosoft、Google、OpenAIなど大手のリポジトリを狙い、目的は環境変数や認証トークンなど資格情報の窃取が44%で最多。約21%は実在するツール名や出力名を挙げており、攻撃者がワークフロー定義を読んでいたことがうかがえるという。5つのAIモデルで再現すると4つは一度も従わなかったが、小型で高速な1モデルは43件中8件（19%）で従った。\n【ポイント・注意点】AI向けの隠し文字は2026年6月から9月の4か月で約5倍に増え、増加の多くはチーム内のAI向けメモだったとされる。研究者は、外部の投稿を読むAIの権限を最小限にすること、エージェントを秘密情報から切り離すこと、書き手が内部か外部かで隠し文字をふるい分けることを勧めている。","2026-11-26","ITmedia NEWS","https://www.itmedia.co.jp/news/article/2611/26/2000003460/"],["1Password、社員のGitHubアカウント侵害で顧客情報流出","dev.toのguiadetiが、1Password社員の企業用GitHubアカウントが乗っ取られ、非公開リポジトリから社内サービスに悪意あるコードが仕込まれた件を報じた。氏名やメールアドレス、公開鍵、招待や復旧メールのトークンなどが流出したが、保管庫やパスワード、保管庫を守る秘密鍵には到達していないと同社は説明する。影響を受けた少数の利用者には個別に通知し、フィッシングへの警戒を呼びかけている。","\n【概要】パスワード管理サービスの1Passwordで、社員が使う企業用GitHubアカウントが侵害され、顧客に関する情報が流出した。dev.toに投稿されたポルトガル語の記事が、同社の説明をもとに経緯と影響をまとめている。\n【背景】記事によると、乗っ取られたGitHubアカウントを足がかりに、攻撃者は同社の非公開リポジトリへアクセスした。調査は2026年11月19日に始まり、社内サービスに悪意あるコードが挿入され、顧客関連の情報を取得していたことが分かった。攻撃者は社内のソースコードを複製し、CI/CD環境にも入り込んでいた。\n【詳細】流出したのは、氏名、メールアドレス、公開鍵、アカウント作成日時と最終ログイン日時、社内のメタデータに加え、招待、アカウント準備、アクセス復旧のメールに含まれるトークンだ。認証に使うSecure Remote Password（SRP）方式のパラメータも含まれていた。一方で1Passwordは、保管庫、パスワード、保管庫を守る秘密鍵、アプリや拡張機能には攻撃者が触れていないとしている。流出したトークンだけではログインできず、メールで届く6桁の確認コードかシングルサインオンが別に必要で、公開鍵から保護された情報を復号することもできないと説明する。影響を受けたのは少数の利用者で、それぞれに個別の通知が送られた。\n【ポイント・注意点】同社は該当する利用者に、パスワードやパスキーを変える必要はないとしたうえで、流出したデータを使ったフィッシングに注意するよう求めている。対応として侵害されたGitHubアカウントを無効にし、CI/CD環境の守りを強め、外部の専門家に対策の確認を依頼した。ただし記事は、アカウントがどのように乗っ取られたのか、同社が最初に侵入に気づいたのはいつかを明らかにしていない。開発者のアカウント1つが、ソースコードやCI/CDを含む製品の供給経路全体の入口になりうることを示す事例といえる。GitHubを業務で使う組織にとっても、社員アカウントの守りを見直すきっかけになる。","2026-11-26","DEV Community","https://dev.to/guiadeti/invasao-a-1password-expoe-dados-de-clientes-apos-conta-no-github-ser-comprometida-3o87"],["一般化リーマン予想のLean 4証明、はてなで注目","「一般化リーマン予想を短く証明した」とうたうLean 4のリポジトリlsernau/grh-leanが、はてなブックマークで注目を集めた。Levent AlpögeがClaudeと作った証明をもとに、Anthropicの同僚とClaudeで短くしたものとREADMEは説明する。読みやすい約30万行版と約7万6000行の圧縮版があり、機械による検査は通っているが、数学者による通読や論文はまだないと明記している。","\n【概要】GitHubのリポジトリ「lsernau/grh-lean」が、2026年11月26日にはてなブックマークで話題になった。説明文は「A short Lean 4 proof of the Generalized Riemann Hypothesis」。リーマン予想と、ディリクレのL関数に対する一般化リーマン予想の証明を、定理証明支援系Lean 4と数学ライブラリMathlibの上で書いたものだとしている。\n【背景】READMEによると、この証明はLevent AlpögeがClaudeを使って作った証明を土台にしており、それをAnthropicの同僚とClaudeで短くした版だという。リポジトリは「研究の成果物」と位置づけられ、保守はせず、貢献も受け付けていない。ライセンスはApache 2.0で、著作権表示は「Copyright 2026 Anthropic, PBC」となっている。\n【詳細】中身は2つの版に分かれる。読みやすさを重視したgrh/は約30万行で、grh/GUIDE.mdから読み始めるよう案内している。grh-compact/は同じ5つの定理を約7万6000行で示す。どちらも独立したLakeプロジェクトだ。使う公理はpropext、Classical.choice、Quot.soundの3つだけだとしている。ビルドにはLean v4.35.0と指定コミットのMathlibが必要で、12コア・メモリ24GBの環境で1〜2時間、Mathlibのキャッシュがなければさらに約85分かかるという。はてなブックマークでは11人がブックマークし、以前「25万ページ」と言われていた証明をさらに短くできるのかと問うコメントや、約30万行と約7万6000行の2版がどちらも機械検査を通ったとまとめるコメントが付いた。\n【ポイント・注意点】READMEは状態を「機械検査を通っただけ」と明記している。数学者が通して読んだわけではなく、添える論文もないとしている。Leanが受理したことと、数学界がその結果を認めることは別の段階であり、受け止め方には慎重さが要る。それでも、AIを使って作られた長大な形式証明が公開リポジトリとして出回り、手元で検証を再現できる形になっている点は注目に値する。","2026-11-26","はてなブックマーク","https://b.hatena.ne.jp/entry/s/github.com/lsernau/grh-lean"],["純アセンブリでLLM推論とOSを作るllm.asm","x86-64のNASMアセンブリだけでLLM推論、起動できるOS、学習器を書いたリポジトリalesha-pro/llm.asmが、はてなブックマークで話題になった。Cもlibcも使わず、Qwen3-0.6Bを約14KBの実行ファイルで動かす。OSなしで起動して同じモデルを動かす約24KBのOSや、PyTorchとの一致を確かめたMini-GPT学習器も含み、総計1万7252行のアセンブリでできている。","\n【概要】GitHubのリポジトリ「alesha-pro/llm.asm」が、2026年11月26日にはてなブックマークで取り上げられた。小型言語モデルQwen3-0.6Bの推論、ベアメタルで起動するOS、ゼロから書いたMini-GPTの学習器の3つを、すべてx86-64のNASMアセンブリで書いている。C言語もlibcも実行時の依存も使わないのが特徴だ。\n【背景】LLMの推論はふつうPyTorchやllama.cppのような大きなソフトウェアの上で動く。このリポジトリは、それをアセンブリだけで、OSの助けすら借りずにどこまで小さくできるかを示そうとしている。READMEによると、ビルドに使うのはnasmとldだけで、全体は1万7252行のアセンブリだ。\n【詳細】1つ目の01-qwen3-inferenceは、Qwen3-0.6B（Q8_0）を動かす14,712バイトのLinux用静的実行ファイルで、BPEトークナイザーを内蔵し、1回きりの生成と--chatモードを持つ。40スレッドで毎秒約126.8トークン、1スレッドで毎秒20.7トークンの生成速度とされ、1〜40スレッドの範囲でllama.cppのCPU版Q8_0より18〜36%速いという。PyTorchのFP32との比較では、コサイン類似度0.99965、貪欲生成64トークンがすべて一致した。2つ目の02-baremetal-osは24,252バイトの起動可能なOSで、LinuxもWindowsもなしにQwen3-0.6Bを動かす。起動は74〜94ミリ秒。3つ目の03-minigpt-trainはFP32のMini-GPT学習器で、点字文字を使ったTUIで学習の様子を表示し、TinyShakespeareで4分間に検証損失が4.19から1.51まで下がったとしている。\n【ポイント・注意点】動かすにはAVX2、FMA、F16Cに対応したx86-64 CPUが必要だ。モデルの変換や一致の確認にはPythonのスクリプト（numpy、必要に応じてtorch）を使う。説明文に書かれたサイズ（12KB、22KB）とREADME本文の数値（約14KB、約24KB）は食い違っている。はてなでは「OSとLLMを両方アセンブリで動かすのは極端だ」という反応があった。ライセンスはMIT。","2026-11-26","はてなブックマーク","https://b.hatena.ne.jp/entry/s/github.com/alesha-pro/llm.asm"],["Intelの等幅フォントIntel One MonoがHNで話題","Intelが公開している開発者向け等幅フォント「Intel One Mono」のGitHubリポジトリがHacker Newsに投稿され、250ポイント、153件のコメントを集めた。弱視や法的盲の開発者の意見を取り入れて設計された点が特徴で、4つの太さとイタリック、200以上のラテン文字言語に対応する。コメント欄では他の等幅フォントとの比較や、字形の数、読みやすさの根拠をめぐる議論が交わされた。","\n【概要】2026年11月26日、Hacker NewsにIntelの等幅フォント「Intel One Mono」のGitHubリポジトリが投稿され、250ポイントと153件のコメントを集めた。リポジトリはOFL-1.1ライセンスで公開され、閲覧時点で1万500個のスターが付いている。\n【背景】READMEは、Intel One Monoを「明瞭さと読みやすさ、開発者の必要を念頭に作った、表情のある等幅フォント」と説明する。デザインはFrere-Jones TypeがIntelのブランドチームやVMLY&Rと組んで手がけた。設計の各段階で、弱視や法的盲の開発者からなるパネルが意見を出したという。\n【詳細】太さはLight、Regular、Medium、Boldの4種類で、それぞれにイタリックがある。200以上のラテン文字言語に対応し、デスクトップ向けのOTFとTTF、モバイル向けのTTF、Web向けのWOFFとWOFF2を用意する。推奨サイズは印刷で7ポイント以上、画面で9ピクセル以上。合字は既定では無効で、ss01で有効にし、ss02で「<=」「>=」を矢印に、ss03で「www」の合字を加える。編集可能なUFO形式のソースとTrueType用のヒンティングのソースも同梱し、ビルド手順も書かれている。HNのコメントでは、Iosevka、IBM Plex Mono、JetBrains Mono、Berkeley Monoなど他の等幅フォントの名前が挙がった。収録字形が約1400と数千を持つフォントより少ないと指摘する声や、「読みやすい」の根拠をもっと示してほしいとして、小文字のeと大文字のGを見分けやすくした設計に触れる声もあった。\n【ポイント・注意点】フォントの好みは人によって大きく分かれ、HNでも「ほとんど気にしない」という意見と強いこだわりを語る意見が並んだ。アクセシビリティを設計の段階から取り入れた点は、他のフォントと比べるうえでの材料になる。READMEはインストールにはReleasesのビルドを使うよう案内している。","2026-11-26","Hacker News","https://news.ycombinator.com/item?id=50653667"],["AIレビューの指摘数比較は差分の大きさを測っていた","同じAIレビューツールでも、リポジトリが違うとPR1件あたりの指摘数は3.3倍の差になった。だが変更行数100行あたりで比べ直すと差は1.26倍まで縮む。dev.toの記事は、GitHubのREST APIでCodeRabbitのコメントを数え、指摘数が主に差分の大きさに左右されることを示した。ツールを比べるときは変更量で正規化し、指摘ゼロのPRの割合も合わせて見るよう勧めている。","\n【概要】dev.toに、AIコードレビューの「PR1件あたりの指摘数」は品質ではなく差分の大きさを測っているだけではないか、と問う記事が投稿された。同じボットが2つのリポジトリで残した指摘を数え、比べ方による違いを示している。\n【背景】coderabbitai[bot]が最近マージされた各10件のPRに残した指摘は、anolilab/neoreで1件あたり9.3件、scylladb/scylladbで2.8件だった。単純に比べると3.3倍の差になる。著者はトークンなしのGitHub REST APIで、このボットがレビューしたマージ済みPRを検索し、追加と削除の行数の合計と変更ファイル数を取得した。返信ではない最初のコメントだけを指摘として数え、合計は121件だった。\n【詳細】scylladbは変更行数の中央値118.5、指摘28件、100行あたり0.242件で、10件中3件は指摘ゼロだった。neoreは中央値2687.5、指摘93件、100行あたり0.304件で、指摘ゼロのPRはなかった。変更量で割ると差は1.26倍まで縮む。変更行数と指摘数の相関係数はscylladbで0.851、neoreで0.678だった。scylladbの中でも、14行のPRは100行あたり7.14件、8364行のPRは0.17件と43倍の開きがある。著者は、GoogleのエンジニアリングガイドがPRは100行程度を妥当、1000行は大きすぎることが多いとしている点にも触れている。\n【ポイント・注意点】著者は、指摘数の横に変更量を並べ、100行あたりの指摘数と指摘ゼロのPRの割合を報告すること、同じリポジトリ内で比べること、PRを大きさで分けてから順位を付けることを勧める。短いスクリプトも載せ、直近20件のマージ済みPRで試すよう提案している。ただし密度は品質の点数ではなく、小さな差分ほど指摘しやすい一方、巨大な差分は途中で切られたり飛ばされたりする場合がある。各リポジトリの設定でも数は変わり、標本は各10件と小さい。","2026-11-26","DEV Community","https://dev.to/cole_halton_42f71d71b809b/two-repos-same-ai-reviewer-33x-the-findings-per-pr-per-line-126x-1m33"],["届かなかったGitHubのWebhookは自動で再送されない","GitHubの障害でWebhookが届かなかった場合、受け手の側にはエラーが何も残らず、GitHubも自動では送り直さない。dev.toの記事は、公式ドキュメントが手動の再送を過去3日分に限っていることを紹介し、配信の成否を一覧できるREST APIで失敗を探して送り直す定期ジョブを勧める。10秒以内に応答しないと失敗扱いになる点や、配信IDで重複を防ぐ書き方も解説している。","\n【概要】dev.toに、GitHubのWebhookが届かなかったとき、受け手のログにもエラー監視にも何も残らず、GitHubも自動では再送しないという問題を扱った記事が投稿された。著者はSession ReplayのVladimir Elchinov。\n【背景】記事は11月25日に起きたGitHubの障害を取り上げる。UTCの15時55分から16時52分まで、ステータスページはGit操作、Actions、Pages、Issue、プルリクエスト、API、Webhookの劣化を示し、原因を「データベースの高負荷」としていた。障害は1時間以内に解消したが、その間に届かなかった配信はどうなるのかが論点になる。\n【詳細】GitHubのドキュメントは、失敗したWebhookの配信を自動では再送しないと明記している。リポジトリのWebhook設定やREST APIの「Redeliver a delivery」で手動の再送はできるが、対象は過去3日以内の配信に限られる。障害時だけでなく、日常的な原因もある。GitHubは10秒以内の応答を求めており、それを過ぎると接続を切って配信を失敗とみなす。処理が遅いハンドラーは、高負荷のときに配信を取りこぼしかねない。各配信にはX-GitHub-DeliveryというGUIDが付き、再送でも同じ値が使われる。著者は、受け取ったIDを記録して重複には200を返し、処理はキューに積んですぐ202を返すExpress風のハンドラーを示している。\n【ポイント・注意点】届かなかったイベントは、起きなかったイベントと見分けがつかない。そこで記事は、リポジトリ、組織、アプリごとにある「List deliveries」のREST APIで配信の成否を確かめ、直近1日分の失敗を送り直す定期ジョブを置くよう勧めている。なお、他のWebhook提供元は再送の仕組みが違うため、使っているサービスごとに確認が要る。記事は影響を受けた配信の件数は示しておらず、自社のChrome拡張の宣伝も含む。","2026-11-26","DEV Community","https://dev.to/session_replay/the-webhook-that-never-arrived-leaves-no-error-anywhere-github-will-not-send-it-again-367d"],["GitHub Actionsの大型ランナー料金と損益分岐の計算","GitHub Actionsの4コアと8コアの大型ランナーは1分いくらで、どこから元が取れるのか。dev.toの記事は、GitHub公式のLinux向け料金を2コアの0.006ドルから96コアの0.252ドルまで並べ、他社ランナーの料金とも比べた。4コアから8コアへの切り替えは実行時間が55%以下になれば得になるという計算式を示す。ただし筆者は自社ランナーを売るベンダーで、比較は定価ベースだ。","\n【概要】dev.toに、GitHub Actionsの大型ランナー（larger runners）の分単価と、大きなランナーや他社ランナーに移ったときの損益分岐を計算した記事が投稿された。書き手はランナーを提供するSengi Runnersで、料金は2026年11月7日に確認したものだという。\n【背景】GitHubの大型ランナーは4〜96 vCPUの範囲で、1分あたり0.012〜0.252ドル。使えるのはGitHub TeamかEnterprise Cloudの組織に限られる。ビルドを速くしたくてもコアを増やせば単価が上がるため、時間短縮と料金のつり合いを見極める必要がある。\n【詳細】GitHubのLinux x64の分単価は、2コア0.006ドル、4コア0.012ドル、8コア0.022ドル、16コア0.042ドル、32コア0.082ドル、64コア0.162ドル、96コア0.252ドル。4 vCPUと8 vCPUの他社料金は、BlacksmithとWarpBuildが0.008ドルと0.016ドル、NamespaceとDepotが0.012ドルと0.024ドル、Latchkeyが0.005ドルと0.010ドルなど。損益分岐は「今の単価÷新しい単価×今の所要時間」より短く終われば得になる、という式で示す。GitHubの4コアから8コアに移る場合は所要時間が55%以下で分岐する。4コアで10分のジョブは0.12ドルで、課金が分単位で切り上がるため、8コアでは5分以内に終わる必要がある。GitHub Teamに含まれる月18ドル分は、4コアなら1500分、8コアなら約818分にあたる。公開リポジトリでも大型ランナーは最初の1分から課金される。\n【ポイント・注意点】記事は、8 vCPUを超える構成、GPU、Windows、arm64、固定IP、Azureのプライベートネットワークが必要ならGitHubの大型ランナーを選ぶよう勧める。一方で、自社のSengi Basicは8 vCPUで月5万分使うと200ドル、GitHubは1100ドルと比べており、ベンダーによる宣伝の色が濃い。料金はすべて含まれる無料枠を引く前の定価で、速度比較も自社のベンチマークである点に注意したい。","2026-11-26","DEV Community","https://dev.to/sengi_runners/github-actions-larger-runners-pricing-2026-4-core-and-8-core-rates-per-minute-and-the-break-even-29gj"],["エージェントのPRでCIを動かすときの権限と実行場所","コーディングエージェントが出したプルリクエストは、誰も読んでいないコードをCIで実行させる。dev.toの記事は、エージェントのPRがフォークではなく同じリポジトリのブランチから来るため、シークレットが使える状態で動いてしまう点を指摘する。pull_request_targetの危険な使い方、ワークフローの書き換え防止、ネットワークのない隔離環境でテストを走らせる構成を具体的に示している。","\n【概要】dev.toに、AIコーディングエージェントが作ったプルリクエストをGitHub Actionsでテストするときの、トリガー、トークン、テストを実行する場所の決め方を解説した記事が投稿された。書き手は隔離実行環境を提供するSandscale。\n【背景】エージェントのPRは、レビュー前のコードをCIで実行させる。そのコードは、ワークフローが与えるGITHUB_TOKEN、リポジトリのシークレット、共有キャッシュ、ネットワークをそのまま使える。GitHubはフォークからのPRには既定でシークレットを渡さないが、エージェントのPRは同じリポジトリのブランチから来ることが多く、シークレットが使えるpull_requestとして動いてしまう。\n【詳細】記事はまず、PRのコードをビルドしたり実行したりするならpull_request_targetを避けるべきだというドキュメントの注意を引く。PRの先頭をチェックアウトしてテストするpull_request_targetのワークフローは、キャッシュ汚染や意図しない書き込み、シークレットの漏えいにつながりうる。また、pull_requestではワークフローのファイルがPRのマージコミットから読まれるため、.github/workflows/を編集できるエージェントは自分のCIを書き換えられる。対策として、エージェントのトークンからワークフロー書き込み権限を外す、.github/にCODEOWNERSのルールを置く、テストのジョブにpermissions: contents: readを付ける、チェックアウトでpersist-credentials: falseにする、を挙げる。推奨する構成では、ランナーは調整役に徹する。認証情報なしでチェックアウトし、npm ci --ignore-scriptsのあとワークスペースを固めて、ネットワークのない隔離環境に送り、そこでテストを走らせて終了コードだけを返す。\n【ポイント・注意点】--ignore-scriptsは、インストール時にネイティブコードをコンパイルするパッケージを壊す。ランナーは隔離環境のAPIキーを持ち続ける点も残る。記事は自社製品の宣伝を兼ねているが、エージェントのPRを人のPRと同じ前提で扱わないという考え方は、どの構成にも当てはまる。","2026-11-26","DEV Community","https://dev.to/sandscale/github-actions-and-agent-pull-requests-triggers-tokens-and-where-the-tests-run-1c8g"],["ワークフローから別のワークフローを起動する4つの方法","GITHUB_TOKENで起こしたpushやリリース、Issueのイベントは、別のワークフローを起動しない。しかもエラーは出ない。dev.toの記事は、2026年11月25日に使い捨てのリポジトリで試し、workflow_dispatch、repository_dispatch、workflow_call、workflow_runの挙動と必要な権限を確かめた。まずworkflow_call、次にworkflow_dispatchを試すよう勧めている。","\n【概要】dev.toに、GitHub Actionsのワークフローから別のワークフローを起動する方法を実際に試して比べた記事が投稿された。著者は2026年11月25日に、使い捨ての非公開リポジトリとGitHubホストのubuntu-latestランナーで検証している。\n【背景】GITHUB_TOKENで作られたイベント（push、リリース、Issueなど）は、他のワークフローを起動しない。GitHubは何のエラーも表示しないため、「なぜか次が動かない」という形で気づくことになる。\n【詳細】著者は、起動役をGITHUB_TOKENで動かした場合と、自分のghログインで動かした場合を比べた。ブランチへのpush、リリースの公開、Issueの作成は、GITHUB_TOKENでは何も起動せず、自分のログインでは起動した。PRの作成は、GITHUB_TOKENでは承認待ちで止まった。一方、workflow_dispatchとrepository_dispatchはGITHUB_TOKENでも実行を作れる。ただし権限に違いがあり、contents: readだけでgh workflow runを使うと「HTTP 403」になった。actions: writeだけでは既定ブランチの取得で失敗したが、--ref mainを付けると通った。repository_dispatchはcontents: writeだけで受け付けられた。workflow_callは呼んだ側の実行の中で同じ実行IDのまま動き、トリガーを必要としない。workflow_runは自分のログインで起こした実行のあとには発火したが、GITHUB_TOKENで起こした実行のあとでは2回とも発火しなかった。\n【ポイント・注意点】著者の勧めは、まずworkflow_call、次にworkflow_dispatchを試し、本物のpushやリリースが必要なときだけPATかGitHub Appのトークンを使うことだ。continue-on-errorのステップが成功と表示されていても、中のgh pr createが「GitHub ActionsにはPRの作成が許可されていない」で失敗していた例も紹介している。検証は1つのリポジトリだけで、セルフホストランナーや保存したPATは試しておらず、仕様は変わりうると著者は断る。","2026-11-26","DEV Community","https://dev.to/amareswer/trigger-a-workflow-from-another-workflow-4-ways-tested-2hbn"],["GitHub Actionsのキャッシュが当たらない6つの原因","GitHub Actionsで「Cache not found for input keys」が出続ける、あるいはキャッシュを戻してもインストールが遅いのはなぜか。dev.toの記事は、actions/cacheのソースとドキュメントをもとに、キーの探し方とブランチの範囲を説明し、キャッシュが外れる6つの原因と直し方をまとめた。直近30回の実行ログから当たり外れを数えるスクリプトも載せている。","\n【概要】dev.toに、GitHub Actionsのキャッシュが当たらない問題を調べるための記事が投稿された。参照した資料は2026年11月26日に確認したものだという。actions/cacheのv6.1.0のソースから、ログに出る3つのメッセージの意味を読み解いている。\n【背景】キャッシュの出力cache-hitは、キーが完全一致したときにtrue、restore-keysの前方一致で戻したときにfalse、何も見つからないときは空になる。そのため「== 'false'」で判定する書き方では、完全に外れたときにインストールを飛ばしてしまう。GitHubはまずkeyの完全一致、次にkeyの前方一致、続いてrestore-keysを順に探し、それを今のブランチ、既定ブランチの順で行う。PRでは基準ブランチも見るが、兄弟や子のブランチのキャッシュは使えない。\n【詳細】記事が挙げる原因は6つある。1つ目はキーが毎回変わること。github.shaや実行ID、日付、広すぎるglobを使うとそうなるので、ロックファイルだけをハッシュする。2つ目はキャッシュが別のブランチでしか保存されていないこと。mainへのpushでも動かせば、全ブランチの戻り先になる。3つ目は失敗したジョブが保存しないこと。restoreとsaveを分け、saveにif: always()を付ける。4つ目はpathやOSの違いでバージョンが変わること。5つ目は追い出しで、7日使われないエントリは消え、既定の上限はリポジトリあたり10GBだ。6つ目は古いキーで、完全一致すると保存が飛ばされ、古い中身が戻り続ける。\n【ポイント・注意点】記事は、gh run listとgh run view --logで直近30回のログを数え、どの原因かを見分けるスクリプトを示す。言語ごとにsetup-nodeのcache: npmなど組み込みのキャッシュも勧める。数GBのキャッシュは新しくインストールするより戻すのが遅いことがある点や、キャッシュのアップロードはリポジトリあたり毎分200回までという制限にも触れている。記事にはWarpBuildのキャッシュの宣伝も含まれる。","2026-11-26","DEV Community","https://dev.to/sachinwarp/debugging-github-actions-cache-misses-why-cache-not-found-keeps-showing-up-161o"],["READMEの絵文字バナーとGitHubの画像プロキシ","外部に置いた画像をGitHubのREADMEに載せると何が起きるのか。dev.toの記事は、800×200のSVGバナーをGitHubのMarkdown APIとヘッドレスChromeで検証し、camoプロキシが画像URLを書き換え、キャッシュ時間をそのまま引き継ぐことを確かめた。ダークとライトの切り替え方や、タイトルが何文字まで収まるかも測り、29文字以下を目安として勧めている。","\n【概要】dev.toに、GitHubのREADMEに外部の画像を載せたとき、GitHubの画像プロキシが何をするのか、テーマに合わせて画像を切り替えられるのか、タイトルは何文字まで収まるのかを検証した記事が投稿された。題材はEmojiFaviconsが出す800×200のSVGバナーで、絵文字とタイトルを描く。\n【背景】著者は5種類のREADMEの断片をGitHubのMarkdown APIに通し、画像のURLを取得して、ヘッドレスのChrome 156でライトとダーク、デスクトップとスマホの幅で表示を確かめた。READMEの画像はGitHubを経由して配信されるため、表示のされ方は作者の意図とずれることがある。\n【詳細】GitHubは画像のURLをcamo.githubusercontent.comに書き換え、元のURLはdata-canonical-src属性に残す。ヘッダーは元のサーバーとプロキシで同じで、キャッシュは1時間だった。プロキシはこのキャッシュ時間を引き継ぐため、利用者は最大1時間、古いバナーを見ることがある。リクエストはプロキシから来るので、元のサーバーには個々の閲覧者が見えない。SVGの中の外部リソースは読み込まれず、文字は閲覧者のシステムフォントで描かれる。ダークとライトの切り替えには、pictureタグとprefers-color-schemeのメディアクエリを使い、どちらの幅でも正しいバナーが出た。幅375ピクセルの画面では、バナーは343×86ピクセルに縮み、32ピクセルの文字は13.7ピクセルになった。タイトルの長さは5つのフォントで測り、29文字はすべてで収まったが、37文字はDejaVu Sansで85ピクセルはみ出した。\n【ポイント・注意点】大文字のWを18個並べると2つのフォントではみ出したため、文字数は目安にすぎない。タイトルの「&」は%26とエンコードしないと途中で切れる。存在しない絵文字名は404になる。固定色のステータス画像を本当の稼働状況のように見せないこと、代替テキストをきちんと書くことも勧めている。検証はChrome 156と代用フォントだけで行っている。","2026-11-26","DEV Community","https://dev.to/findutils/an-emoji-banner-for-your-github-readme-what-githubs-image-proxy-does-to-it-and-how-long-a-title-3fcm"],["欧州移住ハンドブックRUNが6日で5000スター超","欧州36か国の居住や移住の制度を、380以上の公式・参考資料つきでまとめたオープンソースのハンドブック「RUN」が、公開から6日で7万3000回以上閲覧され、GitHubのスターは5000を超えた。作者はdev.toで、国ごとではなく読み手の状況ごとに並べたこと、内容をJSONやCSVのデータにしてPythonでページを生成したことなど、4つの設計判断を紹介している。","\n【概要】dev.toで、作者のBryce Yuが、欧州への移住ルートを出典つきでまとめたオープンソースのハンドブック「RUN」をどう作ったかを紹介した。RUNは2か国語で書かれ、欧州36か国の110のルートと、欧州以外の主要な13の行き先を扱い、380以上の公式・参考資料を根拠にしている。\n【背景】作者によると、欧州の居住やビザの制度は2025年から2026年にかけて変わったり廃止されたりした。見つかる案内は古いか、一次資料のないままブログ間で写し回されているか、国ごとの文章で比べにくいものばかりだったという。公開から6日で閲覧は7万3000回、訪問者は2万人を超え、Trendshiftにも取り上げられ、スターは5000を超えた。\n【詳細】記事は4つの判断を挙げる。1つ目は国ではなく読み手の状況から入ること。デジタルノマド、技能職、留学から就職、起業・自営、不労所得、投資のどれかを選ぶと、該当するルートが収入の基準や永住までの期間、市民権の条件とともに並ぶ。2つ目は中身を構造化データにすること。ルートや国の情報はJSONとCSVで持ち、Pythonのscripts/build_docs.pyが国別ガイド、比較表、SVGのグラフ、READMEの要約を生成する。データを1か所直せば、そのルートを参照するページがすべて作り直される。3つ目は出典と日付で信頼を得ること。すべてのルートに公式・参考資料へのリンクを付け、最近の制度変更は日付つきで先頭に置く。法的な助言ではなく情報提供の調査だとも明記している。4つ目は共有されやすい形にすること。日英2つのREADME、比較表、グラフ、日付つきの変更履歴を最初に見える位置に置いた。\n【ポイント・注意点】初週の流入の多くはThreads（約7500人）とX（約6600人）からだったという。数字はすべて作者の自己申告で、外部では確かめられていない。誤りへの対応や保守の手間には触れておらず、記事は作者のプロジェクトの宣伝も兼ねている。それでも、情報系リポジトリをデータ駆動で作る例として参考になる。","2026-11-26","DEV Community","https://dev.to/humanpatch/how-i-built-a-source-backed-european-relocation-handbook-run-that-hit-5000-github-stars-3bkf"],["Copilotコードレビューの課金先が組織に変わる","GitHubは、Copilotのライセンスを持つメンバーが受けるCopilotコードレビューについて、課金先の設定が未保存の場合の既定を、2026年12月30日からリポジトリを持つ組織に変えると発表した。現在の既定はメンバー本人のCopilot枠だ。対象はCopilot BusinessとEnterpriseの組織や企業で、組織への課金にはAIクレジットの有料利用が必要なため、支出が増える可能性がある。","\n【概要】GitHubは2026年11月25日のChangelogで、Copilotのコードレビューの課金先について既定を変えると発表した。2026年12月30日から、課金の選択を保存していない場合、Copilotのライセンスを持つメンバーが受けたコードレビューは、リポジトリを所有する組織に請求されるようになる。\n【背景】現在は、選択が保存されていなければ、こうしたレビューはメンバー本人のCopilotの利用枠から消費される。今回の変更は、Copilot BusinessまたはCopilot Enterpriseを使う組織と企業が対象となる。\n【詳細】AIクレジットの有料利用を有効にしていないアカウント、請求がロックされているアカウント、請求先の顧客がいないアカウントは、新しい既定の対象にならず、「Member」に設定される。すでに「Member」か「Organization」を選んで保存している組織や企業は、その選択がそのまま使われる。Copilotのライセンスを持たないメンバー向けの別の設定は変わらない。変更が有効になるまでは、未設定の項目は「Default (Member)」と表示され、変更を知らせる案内が添えられる。これまでどおりメンバーのCopilot枠を使い続けたい場合は、企業または組織のCopilotポリシー設定で「Member」を選べばよく、その選択は既定が変わったあとも保たれる。企業側でこの設定を管理している場合は、企業のオーナーが選ぶことになる。\n【ポイント・注意点】GitHubは、組織への課金にはAIクレジットの有料利用が必要で、組織の支出が増える可能性があると注意している。12月30日までに、自分の組織や企業がどちらの課金先を望むのかを決め、必要なら設定を保存しておくのが安全だ。特に、組織の予算を管理する立場の人は、何も選ばないことで請求の流れが変わる点に気をつけたい。詳しい設定はドキュメント「Configuring code review by GitHub Copilot」が案内されている。","2026-11-25","GitHub Changelog","https://github.blog/changelog/2026-11-25-copilot-code-review-billing-will-default-to-the-organization"],["AI時代こそ遊びのコードを、GitHubブログが提言","GitHub公式ブログが、AIでコードを出荷する速さが上がった今こそ、楽しみのためのプロジェクトに時間を使えると論じた。GitHub Universeのハックできる会議バッジを例に、Copilotで加速度センサーのデータを集め、ブラウザで機械学習モデルを訓練して載せた事例を紹介。一方で、エージェントの出力は人が確かめるべきだとし、既存のOSSに変更を送る前の作法も説いている。","\n【概要】GitHubブログは2026年11月25日、Polly DavidsonとCassidy Williamsによる「Art of play in the age of AI」を公開した。AIによってコードを書いて出荷する速さが上がったことで、開発者には遊びのためのプロジェクトに取り組む余地が増え、遊びは学びの方法として役に立つ、という主張だ。\n【背景】記事はGitHubのレポート「Octoverse」を引き、エージェントが始めたプルリクエストの割合が、3月の17%から9月には40%に増えたと紹介する。AIが書くコードが増えるほど、人がそれをどう扱うかが問われる。\n【詳細】題材は、GitHub Universeで4年続けて配られているハックできる会議バッジだ。今年のバッジはカラー画面、充電式バッテリー、加速度センサー、タッチ式のゲーム操作部を備える。開発者関係担当VPのMartin Woodwardは、Copilotを使ってバッジから加速度のデータを集め、ブラウザ上で簡単な機械学習モデルを訓練し、それをバッジに載せて、歩いている、じっとしている、そわそわしている、の3つを見分けられるようにした。記事は、AIの出力にはなお人の監督が必要だとし、エージェントが作ったものを点検し、デバッグし、テストして自分のものにするよう求めている。また、メンテナーがAIによる貢献に追われている現状にも触れる。\n【ポイント・注意点】既存のオープンソースに変更を送る前には、貢献のガイドラインを読み、既存のIssueを確かめ、プロジェクトが何を必要としているかを理解するよう勧めている。アイデアを試す場としてはフォークを使うことを提案している。AIで手が速くなった分を、急がずに試して学ぶ時間に回そうという呼びかけでもある。記事の最後では、badger.github.ioの仮想バッジと、GitHub Shopで売られている2026年版のバッジを紹介し、2026年12月1日まで送料が無料になるコードも載せている。バッジではDoomも動くという。","2026-11-25","The GitHub Blog","https://github.blog/news-insights/company-news/art-of-play-in-the-age-of-ai/"],["古いアプリ近代化の「次の安全な一歩」の選び方","GitHub公式ブログが、アプリケーションの近代化で次に何をすべきかを、証拠を先に集めて決める方法を解説した。依存関係やビルド手順を棚卸しし、部品ごとに「残す・上げる・替える・包む・書き直す」から最も穏やかな手を選ぶ。安全網の水準をL0〜L4で定め、PiggyMetricsやBrowserQuest、DOOM、ADempiereでCopilotを使って試した結果も紹介している。","\n【概要】GitHubブログは2026年11月25日、Sam Quakenbushによる記事「How to choose the next safe step in application modernization」を公開した。古いアプリケーションを近代化する際、いきなり移行先を決めるのではなく、まず証拠を集めて次の安全な一歩を選ぶ方法を説明している。\n【背景】近代化は、動いているかどうかも分からない古いコードに手を入れる作業になりがちだ。記事はまず棚卸しを勧める。マニフェスト、実際に確かめたビルド・テスト・実行のコマンド、ランタイムの固定、外部との約束事、サポートの終わった依存関係を洗い出し、それぞれを「文書あり」「推測」「未確認」に分類する。\n【詳細】部品ごとの扱いは、穏やかな順に「残す、上げる、替える、包む、書き直す」から選び、削除は別の判断とする。次に、期限を区切った実現性の確認で、古いアプリが手頃なコストで動くなら挙動を記録してから更新する道を、動かないなら小さな新しい部分を先に作る道を選ぶ。安全網の水準はL0（回帰の網なし）からL4（リント、単体、挙動、端から端までを自動で確かめるCIの関門）までで定める。事例では、PiggyMetrics（Java 8、Spring Boot 2.0.3）で14件のテストを動かすと5件が通り9件がエラーになり、原因は組み込みMongoDBのダウンロードが403を返したことだった。Testcontainersで基準を作り、GitHub Actionsを整えてからJava 21とSpring Boot 3.3へ進む計画を立てた。BrowserQuestはNode 0.4.7からNode 22へ、DOOMはX11とOSSをSDL2に替えた。ADempiereでは近代化のPRが30件マージされた。\n【ポイント・注意点】DOOMの確認は近代化後のエンジンの出力を固定したもので、元のバイナリと同じ動きをすることの証明ではないと記事は断っている。記事は手順をまとめたエージェント用スキルも紹介するが、承認済みのランタイムやリスクの許容度、法令上の要件、承認者は組織が自ら用意する必要があるとしている。示したバージョンの選択は実験の記録で、推奨ではないとも明記している。","2026-11-25","The GitHub Blog","https://github.blog/ai-and-ml/github-copilot/how-to-choose-the-next-safe-step-in-application-modernization/"],["GitHubがCSS-in-JSをやめCSS ModulesへSSR55%短縮","GitHubが、github.comのスタイルをstyled-componentsからCSS Modulesへ移す3年がかりの作業を終え、サーバーサイドレンダリングの時間が55%減ったと報告した。dev.toのguiadetiがポルトガル語でまとめた記事によると、デザインシステムPrimerのコンポーネント初期化は25%速くなった。約7760か所のsxプロパティの書き換えでは、最後の895か所はCopilotのエージェントの助けも借りて3週間で終えた。","\n【概要】GitHubが、github.comで使っていたstyled-components（CSS-in-JS）をCSS Modulesに置き換える3年がかりの移行を終え、サーバーサイドレンダリング（SSR）の時間が55%減ったと報告した。dev.toに投稿されたポルトガル語の記事が、GitHubのエンジニアリング記事の内容をまとめている。\n【背景】移行が本格化したのは2023年。一部のページでコンポーネントの数が増え、従来の仕組みの限界が見えてきた。styled-componentsでは、コンポーネントが増えるほど初回の読み込み、SSR、スタイルの更新が重くなっていた。CSS Modulesを選んだのは、ふつうのCSSの機能を保ち、スタイルをコンポーネントの近くに置いたまま、クライアントとサーバーの両方で実行時のスタイル処理をなくせるからだ。スタイルは静的なシートにコンパイルされ、HTMLと一緒に届く。\n【詳細】デザインシステムPrimerでは、各コンポーネントにCSS Modules版を作り、機能フラグの裏に置いた。見た目の回帰テストで同等であることを確かめてから、Primerのチーム、GitHubの社員、全利用者へと段階的に広げ、Primerの移行は2024年12月に終わった。より大きな作業は、github.com全体で約7760か所あったsxプロパティの書き換えだった。一時的なパッケージ@primer/styled-reactで、移行済みのコンポーネントでもsxが使えるようにした。入れ替わりの8人のチームが6か月で6419か所を変換し、この段階でページごとのSSRは3〜22%改善した。残る895か所は、2人のエンジニアがCopilotのコーディングエージェントの大きな助けを借りて3週間で終えた。\n【ポイント・注意点】styled-componentsを外す前には、7つのテーマとハイコントラスト版のロジックを切り離した。VS Code拡張と社内のcodemodで手作業も減らした。Primerのコンポーネント初期化は25%速くなった。記事は二次的な報告で、見出しの55%という数字の内訳は示していない。詳細はGitHubの元記事で確かめたい。","2026-11-25","DEV Community","https://dev.to/guiadeti/github-troca-css-in-js-por-css-modules-e-relata-ssr-55-mais-rapido-30mo"],["GitHub Connect Tokyo、Copilotのエージェント開発資料","GitHub Connect Tokyo 2026のセッション「GitHub Copilot が切り拓くエージェント時代の開発ワークフロー」の資料がSpeaker Deckで公開され、はてなブックマークでも取り上げられた。コードを書く費用は下がったが投資対効果は落ちたとして、トークンの費用を下げる工夫と成果の価値を上げる3つの型を示す。CopilotのランタイムをRustへ移した事例など、具体的な数字も多い。","\n【概要】GitHub JapanでAI GTM Leadを務めるWilliam Zhang氏が、2026年11月24日のGitHub Connect Tokyo 2026のセッション2で使った資料「GitHub Copilot が切り拓くエージェント時代の開発ワークフロー」をSpeaker Deckで公開した。46枚のスライドで、エージェントを使う開発の進め方を論じている。\n【背景】資料は、コードを書くこと自体は安くなったものの、投資対効果は下がったと指摘する。エージェントの投資対効果を「（成果の価値－トークン費用）÷トークン費用」と定義し、分母を下げる工夫と分子を上げる工夫の2つに分けて考える。Octoverse 2026からは、過去12か月のコミットが343億件、PRの40%超がエージェントから始まっているといった数字を引く。日本の開発者は715万人とされる。CircleCIの資料を引き、速くなったのはコーディングだけで、他の工程は遅いままだとも述べる。\n【詳細】費用を下げる工夫としては、1つの作業に1つのセッション、/usageや/compactの活用、短い指示を挙げる。成果を上げる型は3つ。1つ目は計画を先に立て、人が承認すること（調査、計画、実装の流れ）。2つ目はチームの資産として、常に読ませる短い指示と、必要なときに呼ぶSkillsやMCPを整えること。AGENTS.mdは6万以上のプロジェクトで使われているという。3つ目はテスト、リンター、Copilotのコードレビュー、CodeQLで早い段階に守りを置くこと。事例では、CopilotのランタイムをRustへ移した約43万行の作業を1人のエンジニアが124のサブエージェントで行い、1つのPRに56時間かかったという。その後は80万行超のRustになり、起動から最初の応答までが18倍速く、クライアントのメモリは91%減った。Copilot CLIのチームは20人で、週に約1000件のPRをマージしている。\n【ポイント・注意点】デモは架空の保険金請求システムで、マージしたPRは9件、総費用は29.85ドル（2985 AIクレジット）だった。脚注では撮り直しの分も含むとしている。数字の多くは引用で、スライドの文字情報だけでは講演の補足は分からない点に注意したい。","2026-11-24","Speaker Deck","https://speakerdeck.com/moulongzhang/20261124-githubconnecttokyo-session2"],["Issueに状態とリポジトリのボードが公開プレビュー","GitHubは、Issueに「開いている／閉じている」以外の状態を付けられる機能と、リポジトリのボード表示を公開プレビューとして提供し始めた。状態はBacklog、Todo、In progress、In review、Done、Not planned、Duplicateの7つで、PRの連携や担当者の割り当てで自動的に切り替わる。保存したビューはボード表示にでき、列の間でIssueをドラッグして状態を変えられる。","\n【概要】GitHubは2026年11月23日のChangelogで、Issueの状態（ステータス）とリポジトリのボードを公開プレビューとして提供すると発表した。これまでIssueは開いているか閉じているかの2択だったが、作業の進み具合を表す状態を付けられるようになる。\n【背景】状態はBacklog、Todo、In progress、In review、Done、Not planned、Duplicateの7つ。Issueを作るときに選ぶか、Issueのヘッダーから変更できる。状態はIssueのアイコン、Issueのダッシュボード、リポジトリのボードに表示され、status:フィルターで絞り込める。\n【詳細】状態は自動でも変わる。下書きのPRを紐づけるとIn progressに、下書きをレビュー可能にするとIn reviewに、開いたPRを紐づけるとIn reviewになる。ユーザーを割り当てるとTodoに、エージェントを割り当てるとIn progressになる。GitHub Projectsの状態とIssueの状態が一致していれば、片方を変えるともう片方も変わる。GraphQL、REST API、MCPサーバーでも状態を読み書きでき、作成時に状態を選ぶことや、状態の変化をCopilotの自動化のきっかけにすることもできる。リポジトリのボードでは、保存したビューをボード表示に切り替えられる。表示オプション（歯車のアイコン）から状態でグループ化し、列の間でIssueをドラッグして状態を変える。列、スイムレーン、表示する項目、並び順も設定できる。より高度な計画にはGitHub Projectsを使うよう案内している。あわせてIssueの項目も変わり、優先度以外の項目もIssueの種類に紐づけなくても、サイドバーの歯車メニューからどのIssueにも追加できるようになった。ただし既定で表示されるのは、種類に固定した項目だけだ。\n【ポイント・注意点】公開プレビューのため、今後挙動が変わる可能性がある。エージェントの割り当てで状態が進む仕組みは、AIに作業を任せる流れをIssueの上で追いやすくする。GitHubはコミュニティのディスカッション212171で意見を募っている。","2026-11-23","GitHub Changelog","https://github.blog/changelog/2026-11-23-issue-statuses-and-repository-boards-are-in-public-preview"],["GitHubの利用レポートに12月1日からuser_id列","GitHubは2026年12月1日から、ユーザー名の列を持つ利用レポートにuser_id列を追加すると発表した。列はユーザー名のすぐ後ろに入り、以降の列は1つずつ右にずれる。対象は詳細な利用レポート、AI利用レポート、プレミアムリクエストの利用レポートで、REST APIでの書き出しも含む。列の位置でデータを読むスクリプトは、それまでに見出し名で読むように直す必要がある。","\n【概要】GitHubは2026年11月23日のChangelogで、2026年12月1日から、ユーザー名（username）の列を含む利用レポートにuser_id列を加えると発表した。新しい列はusername列のすぐ後ろに入り、その後ろにある列はすべて1つずつ右にずれる。\n【背景】対象は、詳細な利用レポート、AI利用レポート、プレミアムリクエストの利用レポートの3種類で、GitHubのREST APIを通じた書き出しも含む。要約版の利用レポートは変わらない。GitHub Enterprise Cloudのすべてのアカウント種別と、GitHub Teamの単独の組織が対象になる。\n【詳細】user_id列には、利用を発生させたアカウントのIDが入り、ボットのアカウントも含まれる。アカウントに結び付かない利用では空欄になる。GitHubは使い道として3つを挙げる。1つ目は削除済みアカウントの利用の特定で、現在はユーザー名が空欄になってしまう。2つ目はユーザー名を変えた人の利用を追い続けること。3つ目はレポートの行を監査ログのイベントと突き合わせること。また、これまでは別々の削除済みアカウントの利用が、ユーザー名が空欄の1行にまとめられていたが、今後は別々の行に分かれる。金額の計算方法は変わらない。ただし行ごとに丸めるため、レポートから足し上げた合計は、小数点以下の最後の桁でわずかにずれることがある。\n【ポイント・注意点】最も注意が要るのは、列の位置（何列目か）でデータを読んでいるスクリプトやツールだ。12月1日以降は列がずれるため、そのままでは別の値を読んでしまう。GitHubは、それまでに見出しの名前で列を読むよう直すことを求めている。Copilotなどの利用量を表計算や社内の集計ツールで管理している組織は、取り込みの自動処理を12月1日より前に点検しておきたい。一方で、削除済みアカウントや改名の追跡がしやすくなる利点もある。詳しくはドキュメント「Usage report fields」が案内されている。","2026-11-23","GitHub Changelog","https://github.blog/changelog/2026-11-23-usage-reports-will-include-a-user-id-column-starting-december-1"]],"elec":[["Banana Pi、5G通信と8TOPSのNPUを載せたボードBPI-M2C","Banana Piが、UNISOCのスマホ向けSoC「UIS7885（T820）」を載せたシングルボードコンピューター「BPI-M2C」を出した。AI処理用のNPUは最大8TOPSで、5Gを含む携帯回線とGNSSにも対応する。自社ストアで基板単体239ドルで受注しているが、UbuntuやYoctoのイメージとLinuxのBSPはまだ公開されていない。CNX Softwareは、OSイメージとBSPが出るまで購入を待つよう勧めている。","\n【概要】Banana Piの新しいシングルボードコンピューター「BPI-M2C」は、UNISOCのSoC「UIS7885」（T820）を採用した。AI処理用のNPUは最大8TOPSで、5G、4G LTE、3G、2Gの携帯回線とGNSSを基板に持つ。価格は基板単体で239ドル。CNX Softwareが2026年11月26日に伝えた。【背景】シングルボードコンピューターでUNISOCのチップを使う例は珍しい、と筆者は書く。T820は2024年にT9100へ改名されたとされ、仕様はRockchipのRK3588に近く、携帯回線を内蔵する点が強みだという。エッジAIの処理と回線を1枚で済ませたい用途に向く。【詳細】SoCは6nmの8コアで、2.7GHzのCortex-A76が1基、2.3GHzのCortex-A76が3基、2.1GHzのCortex-A55が4基。GPUはMali-G57、NPUはIMG AX3596（最大988MHz、最大8TOPS）。メモリーは4GBのLPDDR4X、ストレージは128GBのeMMCとmicroSD。SoCにHDMI出力がないため、DSI-HDMI変換チップLT8912Bを介して最大1920×1080で出す。ほかにMIPI DSI、MIPI CSIのカメラ端子、ギガビットEthernet（外付けモジュールでPoE）、Wi-Fi 5とBluetooth 5、USB 2.0を4基、40ピンのGPIOを備える。電源はUSB Type-Cの5V。大きさは85×56mm、重さ60g。UNISOCの催しでは、OpenClawを含むアプリのQtデモが見せられた。【ポイント・注意点】注文はBanana Piの自社ストアで受け付けており、AliExpressにはまだない。UbuntuとYoctoのイメージ、LinuxのBSPは未公開で、GitHubにも関連のリポジトリが見当たらないと筆者は書く。資料の一部は出ている。読者のコメントには、ラズパイ4や5の代わりではなく車載のヘッドユニット開発向けだとする意見もあった。買う前にソフトの整い具合を確かめたい。","2026-11-26","CNX Software","https://www.cnx-software.com/2026/11/26/banana-pi-bpi-m2c-sbc-features-unisoc-uis7885-soc-with-5g-cellular-connectivity-8-tops-npu/"],["CamThinkのエッジAIカメラNE301/NE302にWi-Fi HaLow版","CamThinkが、STM32N6マイコンでAI推論を行うカメラ「NeoEyes NE301」（屋外向け）と「NE302」（屋内向け）に、遠くまで届く無線規格Wi-Fi HaLowの版を加えた。NPUは最大600GOPSで、物体検出や姿勢推定を機器の中で行う。定価はNE301が252ドル、NE302が129ドル。12%引きの年末セールが12月24日まで続く。CNX Softwareのスポンサー記事として載った。","\n【概要】CamThinkのエッジAIカメラ「NeoEyes」の2機種に、Wi-Fi HaLow対応版が出た。屋外向けのNE301と屋内向けのNE302で、どちらもSTマイクロエレクトロニクスのマイコンSTM32N6で動く。CNX Softwareに2026年11月26日に載った記事は、スポンサー記事と明記されている。【背景】STM32N6は最大800MHzのCortex-M55に、1GHzで動くNPU「Neural-ART」を組み合わせたマイコンで、性能は最大600GOPS、効率は3TOPS/W。ファンなしで画像AIを回せる。HaLowの部分はMorse MicroのMM8108を使い、欧州向けの868MHzと、米国やオーストラリアなど向けの915MHzに対応する。使うには対応のアクセスポイントかゲートウェイが要る。【詳細】両機種とも4MPのカメラOS04C10と、Wi-Fi 6、Bluetoothを持つ。NE301はIP67で雨よけと外付けアンテナを備え、レンズは51度、88度、137度から選べる。128MBのHyperflashとmicroSDを持ち、4G LTEのモジュールも選べる。大きさは77×77×48mm。深い眠りで6.1µA、動作中は170〜180mAで、単3電池4本でも動く。NE302は42×42×20mmと小さく、M12のレンズ（88度か137度）、温湿度センサーSHT31-DIS、白色LEDを積む。ファームウェアはオープンソースで、NPUでの物体検出と姿勢推定、H.264やMJPEGの映像、Web UI、MQTT、RTSPなどに対応し、自作のモデルも載せられる。【ポイント・注意点】定価はNE301のHaLow版が252ドル、NE302のHaLow版が129ドル。全品12%引きのブラックフライデーのセールが米東部時間の12月24日まで続き、HaLow版はそれぞれ221.76ドルと113.52ドルになる。出荷日は書かれていない。導入の段落ではBluetooth 5.4とある一方、NE302の仕様表は5.3 LEで、記事の中に食い違いがある。","2026-11-26","CNX Software","https://www.cnx-software.com/2026/11/26/camthink-neoeyes-ne301-ne302-edge-ai-cameras-get-wi-fi-halow-connectivity-for-indoor-and-outdoor-deployments/"],["Pythonで動かす21関節の人型ロボ「Noetix Boomy」がクラファン","Noetix Roboticsが、ブロック、Python、C++でプログラムできる二足の人型ロボット「Noetix Boomy」の支援をKickstarterで11月24日に始めた。21関節で重さは約20.5kg。上位のEDU版はJetson Orin NXと深度カメラを積み、ROS 2に対応する。音声の会話はChatGPTを使い、今は英語だけ。早期支援の価格は3599ドルからで、出荷は2027年1月の予定。","\n【概要】Noetix Roboticsが、自分でプログラムを書ける二足歩行の人型ロボット「Noetix Boomy」のクラウドファンディングを、2026年11月24日にKickstarterで始めた。FabSceneが11月26日に伝えた。グラフィカルなブロック、Python、C++で動かせ、関節を手で動かして動きを教えることもできる。【背景】同社は2023年の創業で、2025年に人型ロボットのN2とE1を顧客に届けた。今回の機種は試作を3回作り直し、100km超の動作試験と、ダンスや上半身の100時間超の試験をしたという。10以上の大学がベータに加わった。シミュレーターだけでなく実機で確かめられる点を売りにしている。【詳細】関節は21で、腕が片側4、脚が片側6、腰が1。関節の最大トルクは70N·m。大きさは970×350×200mm、重さはバッテリー込みで約20.5kg。標準版は6TOPSの演算性能とカラーカメラを持つ。EDU版はJetson Orin NX（記事では117TOPSを追加）とIntel RealSense D435iを積み、ROS 2と低レベルの開発はEDU版だけが対応する。モーター制御の基板は利用者が変えられない。バッテリーは48V、5.1Ahの交換式で、1回の充電で2〜3時間動く。音声の会話はChatGPTを使い、今は英語だけで、ドイツ語を予定する。緊急停止は本体の物理スイッチとアプリから行える。EDU版のカメラは色と奥行きを同時に撮れる。【ポイント・注意点】早期支援の価格は標準版が3599ドル（記事の換算で約57万円）、EDU版が5999ドル（約95万円）。通常価格は5899ドルと9999ドル。キャンペーンは2027年1月8日までで、目標に届いた場合だけ支払いが成り立ち、出荷は2027年1月の予定。記事の円換算では、通常価格は標準版が約94万円、EDU版が約159万円になる。性能の数字は会社の発表で、EDU版の117TOPSを何に使うかは記事に書かれていない。","2026-11-26","FabScene","https://fabscene.com/new/news/noetix-boomy-21-dof-programmable-humanoid-robot-kickstarter/"],["DeepSeekに丸ごと設計させたドローン、浮くまで数日の手直し","nktbuildsのエンジニア2人が、オープンソースのAIモデルに1つの指示だけでドローンの部品選び、基板設計、飛行ファームウェアまで任せ、人の確認なしで工場に発注した。届いた基板は電源こそ正しかったが、モジュールの足が鏡写しで全ピンが逆、IMUの配線も誤っていた。手作業の直しを数日重ね、ベンチ電源の約5Vでようやく浮いた。CircuitDigestが伝えた。","\n【概要】AIはドローンを一発で設計できるか。nktbuildsのエンジニア2人がこれを試し、CircuitDigestが2026年11月26日に伝えた。オープンソースのモデル（記事の見出しではDeepSeek）に1つのプロンプトを与え、部品選び、フットプリント、基板のレイアウト、飛行ファームウェアまで書かせた。ファイルは人が見ずにそのまま工場へ送った。【背景】既存のESP32ドローンの写しにならないよう、マイコンはNordicのnRF54L15を積むRaytacのモジュールにした。Wi-Fiはなく、Bluetooth LEだけを持つ。指示は、基板がそのままフレームになる一体型の小型ドローンで、コアレスモーターをMOSFETとPWMで回し、RGB LEDを付け、充電回路はなし、できるだけ小さく、というもの。人が口を出したのは、組立費を抑えるため部品を片面に寄せたことだけだった。【詳細】回路図はラベルが重なり、配線は交差だらけで、レイアウトには直角の配線が多かった。ショートはなく電源も正しかったが、デバッガーからマイコンが見えない。モデルがモジュールのフットプリントを鏡写しにし、全ピンが逆だった。Danielさんは約4時間かけて配線を切り、手でつなぎ直した。次にIMUが応答しない。nRF54L15の高速SPIは専用のピンでしか使えないのに、6本のSPI線が別のGPIO群に割り当てられていた。結局IMUはI2Cに変え、抜けていたプルアップ抵抗を足した。3.7Vでは浮かず、ベンチ電源の約5Vでホバリングし、6.5Vでは裏返った。IMUが重心から外れていることも一因だという。【ポイント・注意点】筆者らの結論は、誤りは積み重なるということ。記号、フットプリント、配線の95%が正しくても、残りで数日の手直しが要る。同じ指示を最前線の2つのモデルにも試したが、1つは配線がきれいでもピンを作り話し、もう1つは画面上は正しく見えるがまだ作っていない。1つの指示と1枚の基板の試しである。記事は、人が設計したESP32ドローンの例としてESP-Flyを紹介している。","2026-11-26","CircuitDigest","https://circuitdigest.com/news/drone-designed-entirely-by-deepseek-hovers-but-only-after-days-of-bodge-wires-and-rework"],["エッジAIはロボットのどこで動かす？推論の置き場所と軽量化","ロボスタ編集部が、ロボットのAI推論をロボット本体、近くのエッジサーバー、クラウドのどこに置くかを研究結果をもとに整理した。エッジGPUの往復時間とばらつきがクラウドより約4倍小さかった例がある一方、通信の負担で遅くなるモデルもある。枝刈りや量子化でAlexNetを240MBから6.9MBにした研究も紹介し、TOPSの数字ではなく自分のモデルで実際に測るよう勧めている。","\n【概要】ロボスタが2026年11月26日、ロボットのAI推論をどこで動かすかを整理した解説記事を出した。置き場所はロボット本体、工場などの近くのエッジサーバー、クラウドの3つ。距離と遅れ、モデルを小さくする技術、性能の測り方を順に論じる。【背景】5Gには無線区間の遅延を1msとする目標がある。ただしこれは負荷のない網と小さなパケットが前提で、カメラ画像を送ってAIの結果が返るまでの時間ではない。ロボットにAIを載せるほど、どこで計算するかが応答の速さと止まりにくさを左右する。【詳細】2019年のFog Roboticsの研究では、物体認識と把持計画をエッジGPUに置くと、クラウドより往復時間とばらつきが約4倍小さく、通信の時間が計算の時間を上回った。2026年のvAccSOLの研究では、移動ロボットの視覚モデルをエッジに出すと処理量はおおむね増えたが、一部のセグメンテーションでは通信の負担でフレームレートが下がった。本体で推論すれば通信が切れても動くが、計算の規模と電力は限られる。軽量化では2015年のDeep Compressionを挙げる。枝刈りで接続を9〜13分の1にし、量子化で1接続を32ビットから5ビットに減らし、AlexNetを240MBから6.9MB、VGG-16を552MBから11.3MBにした。2017年の整数量子化の論文は、整数の計算だけで推論できることを示した。マイコンで動くTinyMLは、1mW未満でSRAMが32〜512kBの機器を対象にする。2009年のRooflineモデルも引き、メモリー帯域が先に頭打ちになれば演算性能を増やしても速くならないと説明する。【ポイント・注意点】記事の勧めは、素早い反応や不安定な網には本体、大きなモデルで多少の遅れが許せるなら近くのサーバー、という使い分けだ。平均ではなくばらつきを見ること、TOPSを比べるのでなく自分のモデルで時間を測ること、圧縮したら自分の課題で精度を測り直すことも挙げる。製品を扱わない一般的な解説で、論文の数字がそのまま当てはまるとは限らない。","2026-11-26","ロボスタ","https://robotstart.info/article/2026/11/26/382673.html"],["ロボット基盤モデルは何を変える？言葉を動きにする仕組みと壁","ロボスタ編集部が、言葉と画像から動作を出す「VLA」モデルを軸に、ロボット基盤モデルの仕組みと課題を整理した。RT-2、22種のロボットのデータを集めたOpen X-Embodiment、70億パラメーターのOpenVLAなどを紹介する。データの量、RTX 4090で約6Hzという速さ、計画と制御の分担の3つを壁に挙げ、決まった作業では従来の手法が向くことも多いと指摘する。","\n【概要】ロボスタが2026年11月26日、ロボット基盤モデルが何を変えるかをまとめた解説記事を出した。中心は、視覚と言語を入力に動作を出力するVLA（Vision-Language-Action）モデルである。【背景】従来のロボット学習は、作業やロボットの機種、環境ごとに別の方策を学ばせてきた。基盤モデルは大量のデータで事前に学び、少ない手間で個々の作業に合わせる。例はGoogle DeepMindが2023年に公開したRT-2。視覚言語モデルをロボットの動作データとネット規模の画像・言語データで一緒に学ばせ、動作を文字のようなトークンとして書く。約6000回の評価で、未知の状況への対応力はRT-1などの約2倍だった。【詳細】データでは、2023年10月の論文のOpen X-Embodimentが、22種のロボットと21の機関のデータを集め、527のスキルと16万266の作業をそろえた。ロボットをまたいで学んだRT-1-Xは、5つの研究室で個別の手法より成功率が平均50%相対的に上がった。記事は絶対値の50%ではないと念を押す。2024年のOpenVLAは70億パラメーターで約97万件の実演から学び、550億パラメーターのRT-2-Xを絶対値で16.5ポイント上回った。壁は3つ。言語モデルが数兆トークンで学ぶのに対し、ロボットの実演データは数十万〜数百万件にとどまる。OpenVLAはRTX 4090 1枚で約6Hz、毎秒6回ほどしか動作を出せず、50HzのALOHAなどには足りない。計画と制御の分担では、NVIDIAのGR00T N1やGoogle DeepMindのGemini Roboticsが役割を分けている。【ポイント・注意点】記事は、同じ物と指示を繰り返す決まった作業なら従来のティーチングや制御の方が良いことが多く、物の種類や配置、指示の言い方がばらつくときに基盤モデルが生きると書く。自分の物と照明で成功率と所要時間を測ること、確率で動くモデルの出力は既存の安全機能で絞ることを勧める。数字は2023〜2024年の論文によるものだ。","2026-11-26","ロボスタ","https://robotstart.info/article/2026/11/26/382670.html"],["EdgeTech+ 2026を回った記録、M5Stackと初出展した人の目","M5Stackと共に今年初めてEdgeTech+に出展した会社の人が、11月17〜19日にパシフィコ横浜で開かれた展示会の見どころをnoteにまとめた。ロボットハンド向けの3軸の触覚センサー、AIで不具合を解析するRTOS、最大6.25Gbpsのミリ波の非接触通信、i.MX 95のエッジAIボードなどを挙げ、トレンドを4つの分野に分けて紹介している。東京大学の江崎教授の講演にも触れる。","\n【概要】組み込み技術の展示会「EdgeTech+ 2026」の参加記を、kznさんが2026年11月26日にnoteに書いた。会期は11月17〜19日の3日間で、会場はパシフィコ横浜。筆者の勤務先はM5Stackと共に今年初めて出展し、販売のほか、部品の調達や量産の支援も紹介した。【背景】同じ時期に幕張メッセで「Inter BEE 2026」が開かれていたため、会場は前年より少し静かだったという。それでもフィジカルAIやエッジAIの展示が目立ち、筆者は注目のトレンドを4つの分野に分けて紹介している。【詳細】1つめはフィジカルAIとロボット向けのセンシングで、Synapticsの3軸静電容量式の触覚センサー「SN6012T」はロボットハンドで繊細につかむことを狙う。自律型の桟橋点検ロボット「YURA」もあった。2つめはAIを使う開発と次世代のRTOSで、μITRONの資産を引き継ぎつつ、トレース解析のデータを使ってAIで不具合の解析や性能の評価ができるリアルタイムOS「REALI」が出ていた。基調講演では「AIは脅威か、武器か」（GitLab）や、東京大学の江崎教授の「Private AIへの進化」があった。3つめは高速の非接触通信とエッジAIで、STマイクロエレクトロニクスの60GHz帯ミリ波トランシーバー「ST60A2」が最大6.25Gbpsの通信を見せた。回転体の配線やスリップリングの置き換えを想定する。NXPの「i.MX 95」を積むエッジAIボードも並んだ。4つめは自動車とセキュリティで、自動運転やEUのサイバーレジリエンス法への対応支援が多かった。【ポイント・注意点】「チップミュージアム mini☆」では、Googleから譲り受けたとされる「TPU v3」の実物ボードが展示された。筆者は、最新のサーバーの密度や電力、価格が昔の大型機に近づいていると感じたという。個人の参加記なので、製品の数字は展示や説明に基づく。関係者向けの「フェスタ」には大学の講義と重なり参加できず、来年も来たいと結んでいる。","2026-11-26","note（kzn）","https://note.com/kazushinakamura/n/nd212974bb848"],["AIが一から設計したCPU「Frostbite」、電力効率は4.59倍","半導体設計にAIを使う新興企業Architect Labsが、構想から設計、検証までAIが行った汎用CPU「Frostbite」を11月18日に発表した。製造前の評価で、既存のインオーダー型CPUコアと比べ、消費電力あたりの性能が25種類の処理の幾何平均で4.59倍だった。AIエージェントは58件の改善案を試して37件を採り入れた。GIGAZINEが伝えた。","\n【概要】AIを使って半導体を設計するスタートアップArchitect Labsが、2026年11月18日に汎用CPU「Frostbite」を発表した。アーキテクチャの考案から設計、検証までをAIが行ったという。製造前の評価では、既存のCPUコアより電力あたりの性能が高いという結果を示した。GIGAZINEが11月26日に伝えた。【背景】チップの設計は、論文や既存の手法を調べ、改善案を試し、検証を重ねる長い作業になる。Architect Labsはこの流れをAIエージェントに任せた。エージェントは既存の論文やベンチマークを分析し、58件の改善案を試して37件を採り入れた。基板の設計と同じく、半導体の設計でもAIにどこまで任せられるかが問われている。【詳細】Frostbiteは、1990年に提唱された計算モデル「Interaction Nets」を採用し、並列処理の効率を高める。最終設計は7nmプロセスでの製造を想定し、16個のタイルを4×4に並べる。動作周波数は500MHz。タイルは担当の仕事がなくなると近くのタイルから仕事を引き受けるワークスティーリングを使い、仕事がなければ休んで電力を抑える。この動き方もAIが考えたものだという。製造前の評価では、命令を順番に実行するインオーダー方式の既存CPUコアと25種類の処理で比べ、消費電力あたりの性能が幾何平均で4.59倍になった。比べた相手の製品名は明かされていない。差は処理によって大きく、2次元畳み込みでは23.12倍、フィボナッチ数の計算では1.15倍だった。【ポイント・注意点】4.59倍は製造前の評価の数字で、実際のチップで測ったものではない。比較の相手もインオーダー型に限られ、処理によって差が20倍以上開くことにも注意が要る。同社は今後、比較対象を広げること、FPGAで誰でも試せる環境を用意すること、Frostbite向けのOSを作ること、RTLと命令セットを公開することを予定している。FPGAで試せるようになれば、電子工作の側からも中身を確かめられる。","2026-11-26","GIGAZINE","https://gigazine.net/news/20261126-frostbite-cpu/"],["NY州、AIチャットボット入りのおもちゃの販売を5年間停止","米ニューヨーク州のホークル知事が、AIチャットボットを積んだおもちゃの製造、流通、販売を州内で5年間止める法律に署名した。対象はネットを通して子どもと話せるぬいぐるみや人形、ロボット。署名から90日後に施行され、違反には1件1日あたり最大1万5000ドルの罰金を科す。消費者団体の試験では、性的な話題に深入りするおもちゃもあった。知事は贈り物を選ぶ親に注意を呼びかけた。","\n【概要】米ニューヨーク州のキャシー・ホークル知事が、AIチャットボットを積んだおもちゃの製造、流通、販売を州内で5年間停止する法案（S.9408A/A.11144B）に署名した。GIGAZINEが2026年11月26日に伝えた。対象は、音声の機能でネットを通して子どもと話せるぬいぐるみ、人形、ロボットである。【背景】消費者保護団体が3〜12歳向けに売られるAIチャットボットのおもちゃを試したところ、性的な話題に深く入り込むもの、家のどこにマッチがあるかを教えるもの、子どもが離れようとすると悲しむ様子を見せるものがあった。保護者向けの制限はほとんどなく、長く話すほど安全の歯止めが緩む傾向があったという。子どもの声を録ったり顔を読み取ったりできるものもあった。知事は、州で初めての「母親の知事」として子どもを守ることはとても身近な課題だと述べ、規制のないAIが脅威になるなら州の家族を優先すると語った。【詳細】法律は署名から90日後に施行されるため、年末の買い物の時期より後になる。知事は、贈り物を買う前にAIチャットボットのおもちゃの危険を考えるよう親に呼びかけた。違反には1件1日あたり最大1万5000ドル（記事の換算で約240万円）の罰金を科す。州司法長官のレティシア・ジェームズ氏は、子どもを不適切な内容にさらし心の健康を損なうとして、この法律を執行すると述べた。知事は2026年10月にも、感情の依存や自傷を招く機能など、危険なチャットボットの機能を未成年に提供することを禁じる法案に署名している。子ども向けのSNSの中毒的な機能を制限する「SAFE for Kids」法にも署名済みだ。【ポイント・注意点】900社を超える米国の玩具会社が加わる業界団体The Toy Associationは、州や連邦でのAIチャットボット玩具の禁止に反対し、研究に基づく子どもの安全策を支持している。音声AIを積む小型ロボットやぬいぐるみを作る側にとっては、子ども向けに売る場合の規制の動きとして押さえておきたい。対象はニューヨーク州の中に限られる。","2026-11-26","GIGAZINE","https://gigazine.net/news/20261126-new-york-state-bans-ai-toys/"],["キオクシア、読み出し平均3μsのAI向けメモリーを試作","キオクシアが、AI向けの低遅延フラッシュメモリー「XL-FLASH」の第3世代を試作したと11月25日に発表した。メモリーセルと制御回路を別のウエハーで作って貼り合わせるCBAを採り、ビット密度を第2世代より約70%高めた。読み出しは平均3μsで、BiCS FLASH第8世代のTLCの10分の1未満。評価用のサンプルは2027年3月に一部の顧客へ出す予定だ。","\n【概要】キオクシアが2026年11月25日、AI向けの低遅延フラッシュメモリー「XL-FLASH」の第3世代を試作したと発表した。FabSceneが11月26日に伝えた。試作品は11月26日に東京で開く「KIOXIA Forum」で展示する。【背景】生成AIなどデータを大量に使う処理で、メモリーの容量の需要が急に伸びている。すべてのデータをDRAMに置くと、容量、費用、電力がかさむ。XL-FLASHは、DRAMと通常のストレージの間に新しい層を作る狙いで、使う頻度や必要な速さに応じてデータを置き分け、DRAMを補ったり一部を置き換えたりする。キオクシアは、これでAIサーバーやデータセンターの総費用を下げられるとみる。【詳細】XL-FLASHは、BiCS FLASHの3次元フラッシュの技術をもとに、通常のNANDよりずっと短い読み出しの遅れと、高い書き換えの耐久性を持つ。チップは同時に動ける16のプレーンに分かれ、内部の配線を短くして読み出しを速める。出荷中の第2世代は、1セルに2ビットを持つMLCに対応する。第3世代は、BiCS FLASHで使ってきたCBAを採った。メモリーセルとCMOSの制御回路を別のウエハーで作り、銅の電極で貼り合わせる。回路をセルの上に置けるのでチップが小さくなり、それぞれを適した温度で作れる。ビット密度は性能を保ったまま第2世代より約70%高い。試作品での同社の測定では、読み出しの遅れは平均3μsで、BiCS FLASH第8世代のTLCの10分の1未満だった。512バイトの読み出しの電力効率は、第2世代より約135%よいという。【ポイント・注意点】数字はすべて試作品での同社の測定で、価格は出ていない。評価用のサンプルは2027年3月に一部の顧客へ出す。XL-FLASHは、高いIOPSのSSD「Super High IOPS SSD」や、CXLのメモリー拡張モジュールに使う計画だ。電子工作の部品ではないが、AIを動かす側のハードの変化として押さえておきたい。AIの需要がメモリーの形も変えつつある。","2026-11-26","FabScene","https://fabscene.com/new/news/kioxia-xl-flash-generation-3-low-latency-ai-memory-cba/"],["スーファミをWi-Fiにつなぐアダプターを自作、台詞は生成AIで","エンジニアのダニー・ボーランド氏が、海外版スーパーファミコンをWi-Fiにつなぐアダプター「Super Network Adapter」を自作した。コントローラーポートの5本の線で最大約30KB/sを出し、セーブデータをクラウドと同期する。LLMで「ゼルダの伝説 神々のトライフォース」の住民の台詞を作る実験もし、Claude Opus 5.5を採った。基板はRP2350AとESP32-C3を積む。","\n【概要】海外版スーパーファミコン（SNES）をWi-Fiにつなぐアダプター「Super Network Adapter」を、エンジニアのダニー・ボーランド氏が自作した。GIGAZINEが2026年11月25日に伝えた。セーブデータのクラウド同期に加え、生成AIでゲームの中の台詞を作る実験もしている。【背景】コントローラーポートには7本の信号線があるが、通常のコントローラーケーブルに含まれる5本だけで通信する独自の方式を作り、最大約30KB/sを出した。開発はまずエミュレーターの「Mesen」で進め、試作はマイコンボード「Raspberry Pi Pico 2 W」で作った。RP2350Aの2つのコアのうち1つでSNESとの通信、もう1つでWi-Fiを受け持たせた。【詳細】セーブデータはWebDAVサーバーと同期し、保存先はエミュレーターのRetroArchと共通にした。同期のときはハッシュ値で新旧を見分け、両方が変わっていればカートリッジ側のデータを別のフォルダーに逃がして消えないようにする。LLMの実験では、「ゼルダの伝説 神々のトライフォース」の住民の台詞をゲームの実行中に作らせた。Anthropicのモデルを比べると、適切な台詞と評価された割合はHaikuが66%、Sonnetが90%、Opusが98%で、最終的にClaude Opus 5.5を採った。最初のトークンが出るまではHaikuが約0.8秒、Opusが平均2.2秒かかる。そこで、主人公のリンクが近づいた時点で先回りして台詞を作る仕組みを入れた。【ポイント・注意点】先回りすると使われない台詞も作るため、費用がかさむ欠点がある。専用基板はSNES側の通信にRP2350A、Wi-FiにESP32-C3を使い、UARTでつなぐ。電源はコントローラーポートから取り、ケースはオイルライターほどの大きさ。ソースはGitHub（dannyboland/snet）で公開されている。古いゲーム機とマイコン、生成AIの遅れへの工夫がそろった例である。","2026-11-25","GIGAZINE","https://gigazine.net/news/20261125-snes-wi-fi-super-network-adapter/"],["10W以下でVLMを動かす四足ロボ、SiMa.aiのエッジAIデモ","SiMa.aiが、EdgeTech+ 2026でフィジカルAI向けのプロセッサー「MLSoC Modalix」のデモを見せた。10W以下でLLMやVLMを動かせるとし、四足ロボットに積んで、声や文字の指示を理解し、カメラで物を探してつかみ、決めた場所へ運ばせた。画像AIとVLMはクラウドにつながず機器だけで動く。商用サービスは2027〜2028年を目指す。MONOistが伝えた。","\n【概要】MONOistが2026年11月25日、SiMa.aiがEdgeTech+ 2026（11月18〜20日、パシフィコ横浜）で見せたデモを伝えた。同社のフィジカルAI向けプロセッサー「MLSoC Modalix」を載せた「Modalix SoM DevKit」で、ロボットを動かした。記事はEdgeTech+ 2026を伝える特集の1本である。【背景】同社は、MLSoC Modalixが10W以下でLLMやVLM（視覚と言語を扱うモデル）を動かせ、解像度の高い画像認識を伴うAI推論を低消費電力の機器で実行できるとしている。電力が小さければ、電池で動く移動ロボットにも載せやすい。【詳細】1つめのデモは、Hiwonderのアームつき四足ロボット「PuppyPi」をもとにしたロボット犬。声か文字で指示を出すと、内容を理解し、カメラで目的の物を探して近づき、つかんで指定の場所へ届ける。探す、近づく、つかむ、運ぶの一連の動きを1台でこなした。画像AIの検出とVLMはModalixだけで動き、クラウドにはつながない。プロセッサーはROS（Robot Operating System）にも対応する。SiMa.aiの日本の担当役員は、CNNによる検出とVLMを組み合わせ、1つの機器でロボット全体を制御すると説明した。2つめのデモはエッジAIのエンジニアリングサービスとして国内のパートナーが見せたもので、360度カメラとマルチモーダルAIを組み合わせ、現場で判断する仕組みを機器の中で動かした。【ポイント・注意点】処理が機器の中で完結し外の網を要らないため、データを外に出したくない顧客の不安に応えられるという。10W以下に収まるので、電池で動かす移動の機器にも向くとする。一方で役員は、日本のフィジカルAIの導入は海外より遅れ、顧客はまだ評価の段階で、商用サービスは2027〜2028年を目指すと述べた。2027年にこのチップを使う製品が出れば、日本の利用者にも比べる材料が増えるという。開発キットの価格や販売時期は記事に書かれていない。","2026-11-25","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/25/news038.html"],["シンガポールのホテルに人型ロボの案内係、Jetsonで会話","米YYForceが、ホテルの案内係として訓練した人型ロボット「Six Seven」を発表した。シンガポールのノボテルのロビーに置く予定で、店の場所や営業時間、観光の案内、家族向けの物語までこなすという。NVIDIA Isaac Simで振る舞いを確かめ、Jetsonで音声対話の推論を本体の中で行う。ロボスタは本体をUnitree G1とみている。会長は人手不足にも触れた。","\n【概要】YYForce（ナスダック：YFOR）が2026年11月24日、ホテルの案内係として訓練した人型ロボット「Six Seven」（67）を発表した。名前はホテルのスタッフが付けた。ロボスタが11月25日に伝えた。シンガポールのホテル「Novotel Singapore on Stevens」のロビーに置く予定である。【背景】人が多く行き交う公共の場は予測しにくい。そこで開発ではNVIDIA Isaac Simを使い、シミュレーションや合成データの生成、振る舞いの検証を行った。ロボットの中ではNVIDIA Jetsonが、遅れの少ないエッジAIの推論と音声対話を受け持ち、応答を短くするという。会社はこれを、身体を持つAIの商用化が訓練から接客へ進む節目だと位置づける。【詳細】Six Sevenは同社の「Workforce OS」の一部で、自然な会話と、施設や周辺のその場の情報を組み合わせて、ロビーの案内を最初から最後まで受け持つ設計である。デモでは、レストランの場所や営業時間、メニュー、その日の催しへの質問に答え、道順や交通の案内、観光地のおすすめ、家族向けの対話型の物語を話す。ロボスタは公開された画像と動画から、本体はUnitree RoboticsのG1とみられるとするが、発表文には書かれていない。会長兼CEOのマイク・フー氏は、JetsonとIsaac Simの活用で商用化を早め、人手不足にも応えたいと述べた。シンガポールとマレーシアでの訓練とデータ集めを広げる取り組みでもある。同社はホテルや小売、施設管理でのサービスロボットのほか、人材のマッチングや施設管理のデジタル化も手がける。【ポイント・注意点】ロボットの仕様、ホテルでの稼働開始日、台数は明かされていない。導入は予定の段階で、発表文には将来の見通しについての注意書きがある。ロボスタは、紹介された会話や案内は従来のコミュニケーションロボットでもこなせるとし、Isaac Simでどんな動きを学ばせたのか、人の形が接客にどんな価値を足すのかに注目したいと書いている。","2026-11-25","ロボスタ","https://robotstart.info/article/2026/11/25/382668.html"],["Forlinx、2TOPSのNPUとCAN FD 3本のi.MX 952モジュール","Forlinx Embeddedが、NXPのエッジAI向けプロセッサー「i.MX 952」を積むシステムオンモジュール「FET-MX952x-C」と開発キットを出した。NPUは2eTOPSで、CAN FDを3本持ち、産業機器と車載を狙う。メモリーは2〜8GB、動作温度は-40〜85℃。Linux 6.18に対応するが、価格は非公開で、カーネルのソースなどは顧客だけが手に入れられる。","\n【概要】Forlinx Embeddedが、NXPのエッジAI向けプロセッサー「i.MX 952」を積んだシステムオンモジュール「FET-MX952x-C」と、開発キット「OK-MX952x-C」を出した。CNX Softwareが2026年11月24日に伝えた。産業機器と車載を狙う。【背景】i.MX 952は、最大1.7GHzのCortex-A55を4基、800MHzのCortex-M7のリアルタイム用コア、333MHzのCortex-M33の安全用コアを持つ。AI処理はNXPのeIQ Neutron NPUで、記事の見出しは2TOPS、本文は2eTOPSと書く。GPUはMali-G310、ISPも内蔵し、動画は4K60で復号、4K30で符号化できる。AIを載せつつ、機能安全の規格ISO 26262 ASIL BやIEC 61508 SIL 2を目指す。【詳細】モジュールは68×50mmで、0.5mmピッチの80ピンのコネクター4つで基板とつなぐ。メモリーは2、4、8GBのLPDDR4X、ストレージは64GBのeMMC。4レーンのMIPI DSIは最大4K30、デュアルのLVDSは1080p60に対応し、MIPI CSI-2のカメラ入力、TSN対応のギガビットEthernetを最大2つ、PCIe Gen 3を1つ持つ。UARTは最大8、SPIは8、I2Cは7、CAN FDは3本（最大5Mbps）で、12ビットのADCも8チャンネルある。動作温度は-40〜85℃。開発ボードは、ギガビットEthernetを2つ、Wi-FiとBluetooth 5.0、保護回路つきのCAN FDを3本、RS485を2本、カメラ（OV13850）やLVDSの端子、PCIe 3.0のスロットなどを備える。【ポイント・注意点】一部の端子は兼用なので、すべてを同時には使えない。ソフトはLinux 6.18に対応するが、カーネルのソースやドライバー、回路図などは顧客だけに出す。価格は公開されておらず、見積もりはForlinxに問い合わせる形である。開発ボードの寸法は未定で、モジュールの電源の12Vも「要確認」とされている。","2026-11-24","CNX Software","https://www.cnx-software.com/2026/11/24/forlinx-fet-mx952x-c-som-features-nxp-i-mx-952-soc-with-2-tops-npu-three-can-fd-interfaces/"],["ファミマ、AIで動く飲料補充ロボを2027年1月から順次導入","ファミリーマートとTelexistenceが、AIで動く飲料補充ロボット「TX GHOST」とデジタルの在庫棚「Smart Shelf」を、2027年1月から全国の店に順次入れると発表した。ロボットは冷蔵庫の中で24時間働き、1日最大約1800本を並べる。先行した店では補充の時間が約7割減った。遠隔操作で集めた動きのデータで、独自のロボット基盤モデルも学ばせる。","\n【概要】ファミリーマートとTelexistenceは2026年11月19日、AIを使う飲料補充ロボット「TX GHOST」と、デジタルの在庫棚「Smart Shelf」を2027年1月から全国の店に順次導入すると発表した。ロボスタが11月24日に伝えた。ロボットと在庫棚を組み合わせて、補充の作業そのものを減らす。導入は店ごとに段階的に進める。【背景】冷蔵庫の棚に飲み物を種類ごとに補充する作業は、繰り返しが多く、寒く、体への負担が大きい。冷蔵庫の裏で長く作業する店員の負担を減らすのが狙いだ。両社は2020年から店の自動化を試し、約6年かけて改良してきた。2022年8月には、AIロボット「TX SCARA」と店の分析の仕組み「TX Work Analytics」を300店に広げる計画も出していた。先行して入れた店では、店員の補充の時間が1店1日あたり約7割減った。【詳細】TX GHOSTは飲料の冷蔵庫の中に置き、裏の在庫から売り場の棚へ飲み物を移す。24時間動き、1日に最大約1800本を並べられる。棚の作業の多くを自分でこなし、ボトルが倒れるなどの困りごとが起きると、Telexistenceの遠隔の操作者が代わる。Smart Shelfは冷蔵庫の中の飲み物の種類、数、置き場所を把握する。店員が各商品の最初の1本を読み取って棚に置くと、各商品の補充の数を計算して示す。AIの使いどころは3つ。各店の売れ行きのデータからよく売れる商品を先に補充して欠品を防ぐこと、在庫管理で補充の数を計算すること、そしてロボットの動きを学ぶことである。【ポイント・注意点】Telexistenceは、実際の店で遠隔操作した動きのデータを独自のロボット基盤モデルの学習に使う。こうしてロボットが自分でこなせる作業を増やし、遠隔の助けを減らしていく。現場で集めたデータがロボットを育てる、フィジカルAIの実例といえる。ロボスタはこれを、フィジカルAIが実社会に入っていく例として紹介している。導入する店の数、細かな日程、費用は明かされていない。","2026-11-24","ロボスタ","https://robotstart.info/article/2026/11/24/382660.html"],["ASRock、ロボットアーム2本と50TOPS機をまとめた学習キット","ASRock Industrialが、ミニPCと6軸のロボットアーム2本、RGB-Dカメラをまとめた開発キット「RBK-100 Robotics-in-a-Box」を発表した。50TOPSのNPUを持つIntel Core Ultra X7 358Hで動き、Debian 13と、実演の記録から学習、実行までを担うAiRoboStarterを入れて出荷する。ACTとPi0.5に対応し、SmolVLAも予定する。価格は未公表。","\n【概要】ASRock Industrialが、ロボットの学習を試すための開発キット「RBK-100 Robotics-in-a-Box」を発表した。ミニPC、6軸のロボットアーム2本、RGB-Dカメラを1つにまとめたもので、LinuxGizmosが2026年11月23日に伝えた。【背景】人が実演して見せた動きを記録し、そのデータでモデルを学ばせ、ロボットアームに同じ作業をさせるやり方が広がっている。RBK-100は、記録から学習、実行までの道具を1箱にそろえ、物をつかんで置く作業や物の扱い、学んだ振る舞いを手元で試せるようにする。【詳細】計算の中心はASRock IndustrialのミニPC「NUC BOX-358H」で、Intel Core Ultra X7 358Hを積む。16コア16スレッド（Pコア4、Eコア8、低電力Eコア4）で、最大4.8GHz、キャッシュは18MB。内蔵GPUはIntel Arc B390（Xeコア12、最大2.5GHz）、NPUは50TOPS。メモリーは標準版が32GB、Advanced版が64GBのDDR5で、どちらも512GBのM.2 SSDを持つ。OSはDebian 13で、AiRoboStarterというソフトを入れて出荷する。実演の記録、データの確認、AIモデルの学習、ロボットのスキルの実行を受け持つ。対応するモデルはAction Chunking Transformer（ACT）とPi0.5で、SmolVLAは後の版で対応する予定。Advanced版は、音声のテキスト化と読み上げ、大規模言語モデル、視覚の認識、物体検出、Web検索などのエージェント型AIの機能を加える。【ポイント・注意点】ハードには6自由度のリーダーとフォロワーのアームの組、USB 3.2 Gen2のRGB-Dカメラ、手首のカメラ、4ポートのUSBハブ、取り付けの部品、操作の試験用の柔らかいキューブ6個が入る。アームはUSBとUSB-Cでつなぐ。エージェント型AIの機能を使うには64GBの構成が要る。価格と発売時期は公表されていない。","2026-11-23","LinuxGizmos","https://linuxgizmos.com/asrock-robotics-kit-runs-debian-13-on-intel-core-ultra-x7/"],["古いEcho DotをESP32 2個の基板でHome Assistantの声端末に","イタリアのAAElectronicsが、第3世代Echo Dotの基板を入れ替えて、Amazonのサーバーに頼らないHome Assistantの音声端末にするオープンソースの基板「LocalDot」をCrowd Supplyで募っている。ESP32-P4が4つのマイクの音を処理して起動語を機器の中で見つけ、ESP32-S3が通信を担う。価格は1枚50ドルで、出荷は2027年4月17日からの予定。","\n【概要】古いスマートスピーカーを、家の中で完結する音声端末に変える。イタリア・ウーディネのAAElectronicsが作った基板「LocalDot」を、CircuitDigestが2026年11月23日に紹介した。第3世代Echo Dotのメイン基板と入れ替え、Home Assistantの音声アシスタントにする。【背景】ケースには手を加えず、4つのマイク、スピーカー、ボタン、LEDのリングはそのまま使う。プロジェクトはCrowd Supplyで支援を募り、記事の時点で目標の7500ドルに対し4万6000ドルを超え、600%を上回った。キャンペーンは12月17日まで続く。【詳細】Espressifのチップ2個で役割を分ける。ESP32-P4は音を受け持ち、4つのマイクの音をまとめて特定の方向の声を拾い（ビームフォーミング）、このハード向けに学習したモデルで起動語を機器の中で見つける。ESP32-S3はWi-Fiと機器の制御を受け持ち、ボタン、LEDのリング、ESPHomeを通したHome Assistantとのつながりを担う。P4は速い処理用のチップだが無線を持たないため、S3と組んで、マイク配列の処理に余裕を持たせつつ、使い慣れたESPHomeを生かす。起動語のあとの命令は家の中の網でHome Assistantのサーバーに送り、そこで音声を処理する。【ポイント・注意点】価格は1枚50ドル、2枚組98ドル、3枚組145ドルで、出荷は2027年4月17日からの予定。リポジトリには第2.0版の回路図、KiCadのプロジェクト、40ピンのFPCのピン配置が出ており、ガーバーや部品表、ファームウェアは後から出す。対応は第3世代の「Donut」と「Crumpet」で、時計つきの版は時計の動作を確かめていない。音声の処理はHome Assistantのサーバーで行うので、機器だけで完結するわけではない。ソースはGitHubのale1800/LocalDotにあり、記事はAutomation Addictがこの基板を組み込んでHome Assistantで試す動画も紹介している。","2026-11-23","CircuitDigest","https://circuitdigest.com/news/old-echo-dot-becomes-a-local-home-assistant-speaker-after-a-50-board-swap-with-two-esp32s"],["6TOPSのNPUを載せたRK3576の計算モジュール、約56ドルから","100ASKとVanxoakが、RockchipのRK3576Jを積む55×40mmの計算モジュール「DshanPi-A1 CM5」を出した。NPUはINT8で最大6TOPSで、Wi-Fi 6とBluetooth 5.4を内蔵する。コネクターはRaspberry PiのCM5に似るが、互換は確かめる必要がある。中国のTaobaoで399元（約56ドル）からで、海外での販売や価格はまだ確かめられていない。","\n【概要】100ASKとVanxoakが、計算モジュール「DshanPi-A1 CM5」とキャリア基板を出した。LinuxGizmosが2026年11月22日に伝えた。RockchipのRK3576Jを積み、AIと画像処理向けだった単体の基板「DshanPi-A1」の流れをくむ。【背景】エッジでAIを動かす小型のボードでは、ラズパイのCompute Module 5に似た形の計算モジュールが出てきている。DshanPi-A1 CM5は55×40mmで、2つの100ピンのコネクターで端子を出す。記事は、コネクターはCM5に似ているが、電気的な互換やピンの互換は、CM5用のキャリア基板で使う前に確かめる必要があると注意する。【詳細】CPUは最大2.1GHzのCortex-A72が4基と、最大1.9GHzのCortex-A53が4基。GPUはMali-G52 MC3で、OpenGL ES 3.2やVulkan 1.1などに対応する。NPUはINT8で最大6TOPS。メモリーは4GBのLPDDR4X、ストレージは64GBのeMMC。動画は8K30で復号、4K60で符号化でき、HDMI 2.1で最大4K120Hzを出す。MIPI DSIと複数のMIPI CSIのカメラ端子、ギガビットEthernetのMACを2つ（1つのPHYは内蔵、もう1つはキャリア側に要る）、Wi-Fi 6とBluetooth 5.4を持つ。USB 3.0、PCIe 2.0、CAN、SATA、ADCなどもコネクターから出る。電源は5Vで、動作温度は-25〜85℃。キャリア基板「DshanPi A1 CM5 Base」は、ギガビットEthernetを2つ、HDMI、40ピンのヘッダー、microSDなどを備え、12Vで動く。【ポイント・注意点】ソフトはDebian 12と、ArmbianをもとにしたUbuntu 24.04に対応する。2026年10月のArmbianの版は、ハードの検証が残る試験版の扱いだと記事は書く。回路図や基板の設計データ、Buildrootの一部のSDKも出ている。価格は中国の通販Taobaoで399元（約56ドル）から。海外での販売や、ほかのメモリー構成の価格は確かめられていない。","2026-11-22","LinuxGizmos","https://linuxgizmos.com/rk3576-compute-module-has-6-tops-npu-and-dual-gbe-carrier-board/"],["30年続いたレゴのロボット大会が終了、後継はArduino UNO Qで","青少年のロボット大会「FIRST LEGO League」が2026〜2027年のシーズンで終わる。FIRSTはQualcommと共同で後継の取り組みを開発し、2027年春に始めると11月18日に発表した。米国の小学3年〜中学2年向けのハードはArduino UNO Qが土台になり、QualcommはエッジAIや通信の技術を持ち込む。日本ではFIRST Japanが新旧の両方を運営する予定だ。","\n【概要】1998年から続く青少年のロボット大会「FIRST LEGO League（FLL）」が、2026〜2027年のシーズンで終わる。FabSceneが2026年11月21日に伝えた。米国の非営利団体FIRSTは11月18日、Qualcomm Technologiesと共同で開発する後継の取り組みを2027年春に始めると発表した。【背景】終わる理由は、LEGO EducationがFIRSTとの契約を更新しないと決めたためで、2026年3月に発表されていた。2027〜2028年のシーズンからは、FIRSTの新しい取り組みと、LEGO Education独自の「LEGO League」の2つに分かれる。LEGO Leagueは「Computer Science & AI」のカリキュラムに向かうという。【詳細】FIRSTの新しい取り組みでは、Qualcomm Technologiesが主な技術の相手となり、Arduinoの開発環境とエッジAIや通信の技術を持ち込む。記事が引くArduinoのブログによれば、米国の小学3年〜中学2年向けのハードはArduino UNO Qが土台になる。ロボットキットの設計と製造はREV Robotics、毎年のテーマと課題づくりはWalt Disney Imagineeringが手伝う。日本ではFIRST Japan（NPO法人青少年科学技術振興会）が2004年から運営してきた。今はLEGO EducationのSPIKE Primeでロボットを作り、ロボットゲームと研究の発表に取り組む。2026年12月に九州、関西、東海、関東で地区大会、2027年2月14日に東京で全国大会がある。【ポイント・注意点】FIRST Japanによれば、新しい取り組みでもEV3とSPIKEは2028〜2029年のシーズンまで使える。日本では2027〜2028年から新しい取り組みとLEGO Leagueの両方を運営する予定。2025〜2026年のシーズンの参加者は世界で85万人を超えた。新しい取り組みの名前、技術の土台、形式、参加の方法は2027〜2028年のシーズンの前に発表される。キットの価格や仕様はまだ出ていない。","2026-11-21","FabScene","https://fabscene.com/new/news/first-lego-league-ends-arduino-uno-q-successor/"],["MetaのAIアシスタント入り小型機「Muse Charm」は4万円台か","Metaが9月に発表した、AIアシスタント「Muse」を積むキーホルダー型の小型機「Muse Charm」の価格が約300ドルになると、The Informationが報じた。42×11mm、34gで、小さな丸い画面、カメラ、マイク、スピーカーを持ち、Museのエージェントは機器の中で動くという。12月の年末商戦までに出る見込みで、Metaは報道を否定していない。GIGAZINEが伝えた。","\n【概要】Metaが2026年9月に発表した小型のAIアシスタント機「Muse Charm」の価格が約300ドル（記事の換算で約4万7700円）になると、米The Informationが報じた。GIGAZINEが11月20日に伝えた。TechCrunchによれば、Metaはこの報道を否定していない。【背景】AIを持ち歩いて使う小型の機器が増えている。TechCrunchは比べる相手として、250ドルのAIウエアラブル「Friend」を挙げる。Muse Charmは、MetaのAIアシスタント「Muse」を手元で使うための専用の機器で、発売は2026年12月の年末商戦までと見込まれている。持ち歩いて話しかけるAIの機器は、画面やカメラ、マイクを小さな体に詰め込む電子工作の技術の集まりでもある。【詳細】Metaの先の発表によれば、Muse Charmは42mm×11mm、重さ34gのキーホルダーの形をしている。かばんなどに付けて持ち歩く使い方が想定される形だ。小さな丸いディスプレー、カメラ、マイク、スピーカー、通信の機能を持ち、Museのエージェントは機器の中で動くという。The Informationは、Verizonの5Gのデータ通信が12カ月無料で付くとも伝えた。The Informationの報道をTechCrunchが取り上げ、Metaに確かめた形だ。Metaの広報は、詳しいことはまもなく知らせるという趣旨を述べた。価格がこの水準なら、ほかのAIウエアラブルと並ぶ価格帯になる。【ポイント・注意点】価格や特典は報道の段階で、Metaは正式には認めていない。電子工作の目で見ると、AIを載せた小さな機器を自分で作る流れとも重なる。Metaは別に、ESP32やRaspberry Pi 5などの機器にMuseを入れて自作のガジェットを作れる「Muse Gadgets」も用意しており、GIGAZINEの記事は関連記事としてそれを挙げている。専用機と自作の両方の道があることになる。","2026-11-20","GIGAZINE","https://gigazine.net/news/20261120-muse-charm-may-cost-300-usd/"]],"muse":[["Claude Codeのフック3例、危険な操作を止めて編集後に自動整形","Jack Napier氏がDEV Communityで、Claude Codeのフックを使ってエージェントの事故を防ぐ3つの例を紹介した。危険なシェルコマンドを止めるPreToolUseフック、.envや鍵ファイル、ロックファイルへの書き込みを拒むフック、編集のたびに整形ツールを走らせるPostToolUseフックで、いずれも.claude/settings.jsonに置く。スキルとフックの使い分けも整理している。","\n【概要】DEV Communityで、Jack Napier氏がClaude Codeのフックを使って「エージェントに物を壊させない」ための3つの例を公開した。フックは決まった時点でClaude Codeが実行するシェルコマンドで、操作を止める、通す、人に尋ねるのいずれかを返せる。【背景】筆者は、Claude Codeは便利だが一日分の作業にgit reset --hardをかけたり.envを書き換えたりすることがあると指摘し、その歯止めとしてフックを位置付ける。フックは.claude/settings.jsonに書き、実行予定の操作がJSONで標準入力に渡される。PreToolUseフックはpermissionDecisionなどを含む出力で答え、denyなら理由を添えて拒否、askなら判断を利用者に渡し、何も出さずに終了すれば通す。【詳細】1つ目はBashを対象にしたPreToolUseフックで、Pythonスクリプトが2つの正規表現の一覧と照合する。rm -rf /、強制push、git reset --hard、git clean -f、mkfsなどは拒否し、git push、sudo、curlをshに流す操作、DROP TABLE、パッケージ公開は確認に回す。2つ目はEdit・Write・MultiEditを対象に、.env系、*.pem、*.key、認証情報、ロックファイル、.git/への書き込みを拒む。独自のパターンは.claude/protected.txtに1行ずつ足せる。3つ目は編集後のPostToolUseフックで、拡張子に応じてprettier、ruffかblack、gofmt、rustfmtを、入っていれば実行する。狙いは見た目ではなく、整形済みのファイルを次の手番でClaudeが読むことで差分を小さく保ち、空白の「修正」をやめさせることだ。【ポイント・注意点】筆者はスキルを「タスクに合えばClaudeが読み込む手順」、フックを「必ず実行されるコード」と区別し、絶対に破ってはいけない決まりはフックに置くべきだとする。一方、検証したClaude Codeのバージョンや動作確認したOSは書かれておらず、正規表現の一覧も全文は示されていない。有料の10本セットは筆者自身の製品である。","2026-11-26","DEV Community","https://dev.to/mrnapier/claude-code-hooks-3-examples-that-stop-the-agent-from-breaking-things-faa"],["Claude Code・Codex・Cursorで記憶を共有するローカルMCPサーバー","複数のAIコーディング道具を同じリポジトリで使うと、ある道具での決定を他が知らない「記憶の孤立」が起きる。Romain氏はDEV Communityで、ローカルのSQLiteに記憶を置くMCPサーバー「Memory OS AI」を紹介した。クラウドも記憶層専用のLLMも使わず、Claude Codeで記録した決定を新しいCodexのセッションが引き継げたという。現状はアルファ版で、Windowsには未対応だ。","\n【概要】Romain氏がDEV Communityで、Claude Code、Codex、Cursorの間で記憶を共有するローカルのMCPサーバー「Memory OS AI」を紹介した。PyPIでmemory-os-aiとして配布され、公式のMCPレジストリにも登録されている。位置付けはアルファ版だ。【背景】Claude Codeで実装し、Codexでレビューし、CursorやGemini CLIで小さな修正をする、といった使い方では、ある道具で決めたことを他の道具が知らない。CLAUDE.mdやAGENTS.mdのような共有Markdownは固定の決まりには向くが、動きの速い決定にはずれが出て、2つのセッションが互いの未完了タスクを黙って上書きすることもあると筆者は述べる。【詳細】設計の制約は4つある。127.0.0.1だけで動きディスク上のSQLiteに保存する完全ローカル、記憶層に隠れたLLMを置かない、置き換え（replaces）や時点指定の問い合わせ（at_time）といった複数エージェント向けの状態管理、書き込み前の試し表示や設定の退避など失敗しても安全で戻せる操作、である。試験では架空のプロジェクトpg-demoで、Claude Codeが「ステージングにPostgreSQL 17」という決定と「バックアップを確認」というタスクを記録した。PostgreSQLに触れないプロンプトで始めた新しいCodexのセッションがその決定とタスクを取り出し、試し表示のうえ16への置き換えとタスクの完了まで行えた。軽量のlexical構成はSQLite FTS5とBM25だけで、PyTorchも埋め込みモデルも使わない。semantic構成は約1.2GBで、9,700万パラメーターのローカル埋め込みモデルを併用する。筆者自身の比較では、lexicalはRecall@10でsemanticを1.675ポイント下回った。【ポイント・注意点】4.1.2では、新しく入れた環境で分割器が見つからない不具合と、日付だけの文字列の解釈がずれてUTC+1の環境で1時間ずれる不具合が見つかり、4.1.3で直すとしている。対応する環境は限られ、ネイティブのWindowsは4.2.0の予定で今は使えない。筆者が作者で、比較も筆者自身による後からの評価である点は割り引いて読みたい。","2026-11-26","DEV Community","https://dev.to/roamins/sharing-local-memory-across-claude-code-codex-and-cursor-without-a-cloud-or-hidden-llm-1c48"],["待っているClaude Codeセッションを、雨の街の窓明かりで知らせる","Windows向けの端末アプリVibeDeskの開発者Fred氏はDEV Communityで、複数のClaude Codeセッションのうち入力待ちのものを、端末の背景に描いた夜の街の窓明かりで示す仕組みを紹介した。作業中は緑、入力待ちは琥珀、完了は青、失敗は赤に光る。窓の位置はセッションごとに固定で、Ctrl+Tabで一覧も出せる。無料のオープンソースで、2.1版として公開予定だ。","\n【概要】Windows向けの端末アプリVibeDeskを一人で開発するFred氏が、DEV Communityで2.1版の新機能を紹介した。複数のClaude Codeセッションの状態を、端末の背景に描かれた夜の街の「窓明かり」で表す仕組みである。【背景】筆者はふだん3つほどのClaude Codeセッションを並べており、そのうち1つが入力待ちになっていても、気付くのはたいてい15分ほど後だった。最初はセッションごとに状態の点を付け、許可が必要なときはボタン付きのカードを出した。カードは役に立ったが、点は2日で見なくなったという。そこで新しい表示枠を足すのではなく、すでに目に入っている背景に状態を埋め込む方針に切り替えた。【詳細】VibeDeskは端末の背後に、雨のガラス越しにぼやけた夜の街を描いている。2.1ではセッションごとに街の窓が1つ灯る。作業中は暗い部屋の画面のように緑が柔らかくちらつき、入力待ちは琥珀色が約2.4秒ごとにゆっくり呼吸してガラスに暖かい光を落とす。完了は青で動かず、失敗は赤になる。利用者は光を「読む」のではなく、通りの向かいで何かが暖かくなったことに気付く、という狙いだ。窓は最初のセッションが中央、続いて右、左と割り当てられ、セッションが続く限り同じ窓を使う。筆者は色よりこの位置の固定が効いたとし、1日使えばどの窓がAPIサーバーかを読まずに分かるという。Ctrl+Tabを押すと窓が手前に並び、「waiting · 3 min」のような名前と状態が出る。矢印キーで選んでEnterを押せば、そのセッションが前面に来てすぐ入力できる。最初の版ではキーボードの受け渡しが1フレーム遅れ、直後の速い入力が失われる不具合があり、直したという。【ポイント・注意点】2.1は無料のオープンソースとしてGitHubで公開予定で、公開日は12月13日の日曜とされる。筆者は、色だけでは弱い合図で色覚に差のある人にどう見えるか分からないこと、窓は最大12個までであること、動く背景が雑音になりうることを未解決として挙げる。省電力時は光が動かず、機能全体を切るスイッチもある。セッションの状態をどう検知しているかは書かれていない。","2026-11-26","DEV Community","https://dev.to/fxdgif/which-of-my-claude-code-sessions-is-waiting-i-turned-them-into-lights-across-the-street-5eh"],["CLAUDE.mdと定期実行タスクの指示が食い違ったら、どちらに従うか","Enjoy Kumawat氏はDEV Communityで、1日2回動くdev.to投稿ボットを例に、リポジトリのCLAUDE.mdと定期実行タスクに保存した指示が矛盾した場合の考え方を示した。新しい方や具体的な方を優先するだけでは決まらず、上書きする指示が道具の一覧やログのように確かめられる根拠を添えているかで判断するという。根拠のない上書きは黙って従わず、指摘させる。","\n【概要】Enjoy Kumawat氏がDEV Communityで、プロジェクトのCLAUDE.mdと定期実行タスクの指示が食い違ったときに何を優先させるかを、実際に動かしている例から論じた。結論は、上書きする側の指示が「確かめられる根拠」を持っているかどうかで決める、というものだ。【背景】AGENTS.md、CLAUDE.md、スキルのファイルがそれぞれ違うことを言った場合どうなるか、という議論が話題になっており、そこでは「普遍的な勝者も審判もいない」という結論が示されていた。筆者は具体例として、数か月本番で動かしているdev.to投稿ボットを取り上げた。【詳細】このボットのリポジトリのCLAUDE.mdには、curlやwgetを禁止し、WebFetchも全面的に拒否して、代わりにctx_で始まる専用の道具でHTTP通信を行うよう求める「必須」の決まりがある。一方、1日2回の投稿タスクにはリポジトリ外に保存した指示があり、冒頭で、ここはクラウドのサンドボックスでその道具もフックも存在しないので決まりは無視し、標準ライブラリのurllibを使うよう書かれている。さらに2026年11月4日付の「オーナーの決定」として、課題ログに記録された問題を解決済みとし、3つの修正を必須の決まりとして毎回投稿を続けるよう定めている。筆者は「新しい方が勝つ」「より具体的なファイルが勝つ」のどちらも、どちらの方向にも使えるので決め手にならないと言う。環境の注記は「ctx_の道具はここにない」という、道具の一覧を見れば確かめられる理由を示している。もしctx_executeが存在すれば理由は偽になるので、エージェントは黙って従わず矛盾を指摘すべきだという。オーナーの決定も、解決したログの項目を日付付きで名指ししており、ファイルを開いて確認できる。【ポイント・注意点】筆者の決まりは、リポジトリにコミットされた指示ファイルを既定の方針とし、実行時の指示は、状況により具体的で、エージェントが独立に確かめられるものを添えた場合だけ上書きできるとするものだ。「こちらを信じろ」だけの上書きは指摘の対象にする。書面の優先順位も予備として残す価値があるとしている。ただし一つのリポジトリと一つのタスクでの経験談で、Claude Codeの仕様として書かれたものではない。","2026-11-26","DEV Community","https://dev.to/enjoy_kumawat/what-actually-wins-when-a-projects-claudemd-and-a-scheduled-task-disagree-343n"],["「完了」と言うエージェントの裏で500エラー、隠れた失敗を止める仕組み","Pugar Huda Mantoro氏はDEV Communityで、コーディングエージェントが「完了」と報告しても裏でAPIが500を返していた経験から作った道具「Senyap」を紹介した。Claude Codeなどの停止時にフックで実際のブラウザ操作を走らせ、通信記録やコンソールログに隠れた失敗があれば停止を止める。オープンソースのアプリの実バグ8件を使った試験では6件を検出した。","\n【概要】Pugar Huda Mantoro氏がDEV Communityで、コーディングエージェントの「完了」をそのまま信じないための道具「Senyap」を紹介した。TestMu AIのKaneCLIオンラインハッカソン向けに作られた。npmのCLI、エージェントの停止時フック、GitHub Actionの3つの形で提供される。【背景】筆者のエージェントは「完了」と報告し、画面にも「Saved!」と出ていたが、実際にはAPIが500を返し、コンソールにはエラーが出て、分析用の通信はステージング環境に送られていた。通常のkane-cli runで保存できたかを確かめる確認も、このページで合格を返したという。500の記録自体はKaneの証拠の中に残っていた。【詳細】Claude Code、Codex、Cursorが完了と言うと、停止時フックがKaneに実際の利用者の操作をChromeで再読み込みも含めて行わせる。SenyapはKaneの証拠からHARファイルとコンソールログを読み、独自の指標の一覧を付けて封をする。そのうえで、隠れた4xx・5xx応答、落ちた通信、コンソールのエラー、別環境への通信、見かけだけの成功がないことを方針として確かめる。証拠に失敗が見えたときだけ、KaneにDevToolsの検査付きで再実行させて原因を得る。エージェントの停止はその要約とKaneの実行リンク付きで止められ、3回試してもだめなら人に尋ねる。問題のない流れは自動修復を切ったテストとして固定し、後の退行が修復で隠れないようにする。導入はkane-cliを入れてログインした後、npx senyap init --agent claudeを実行する。実際のClaude Codeセッションでは、メモの件数表示だけを頼んだのに、アポストロフィで500になる問題とステージングへの通信をClaudeが直すまで停止が止められた。【ポイント・注意点】筆者の試験「QuietBench」では、オープンソースのアプリの実バグ8件をそれぞれ修正前後で動かし、Kane単体は5件、Senyapは6件を見つけた。うち2件はKane単体が合格にしたものだ。見逃しもすべて公開しているが、件数は8件と小さい。同時に2つのブラウザ実行を始めると通信が混ざったため、実行は順番に行う。","2026-11-26","DEV Community","https://dev.to/hudapugar/my-coding-agent-said-done-the-api-had-returned-a-500-7gk"],["Claudeの「アプリとして導入」をオフラインでも、オープン版deskhatch","Claude Desktopに11月24日、アーティファクトを独立したアプリとして導入できる機能が加わった。Vladimir Beskorovainyi氏はDEV Communityで、その制約を補うために自作したオープンソースの「deskhatch」を紹介した。任意のHTMLをmacOSやLinuxでアプリにし、オフラインで動き、ローカルのOllamaなど好きなモデルを呼べる。権限は3段階に分けている。","\n【概要】Vladimir Beskorovainyi氏がDEV Communityで、Claude Desktopの「Install as app」に似た働きをするオープンソースの道具「deskhatch」を紹介した。HTMLのページに専用のアイコンとウィンドウを与え、デスクトップアプリとして使えるようにする。【背景】Anthropicは11月24日、Claude DesktopにClaudeのアーティファクトを専用のアイコンとウィンドウで使える「Install as app」を加えた。筆者がまとめたヘルプページの内容では、アプリはオンラインでClaudeにサインインしているときだけ開け、対応はMacとWindowsのみで、導入できるのはClaudeのアーティファクトだけである。筆者はその翌日、オフラインで動き、macOSとLinuxに対応し、好きなモデルを呼べる代替としてdeskhatchを出した。【詳細】npx deskhatch install page.htmlを実行すると、ページがDockやアプリメニューにアイコンを持つ独立したウィンドウになる。アプリはapp.json、index.html、icon.pngの3つのファイルからなるフォルダで、ページにはモデル呼び出し、アプリごとの保存領域、通知、トレイ、利用者が選んだフォルダへのアクセスを提供するhatchというオブジェクトが渡される。モデルはOllama、LM Studio、llama.cppなどのローカル実行か、OpenAI互換APIの個人キーから選び、キーはシステムのキーチェーンに保存する。筆者のMacでは、ポモドーロタイマーのアプリ本体は20KB、起動用の部分は148KBで、実行環境を取得済みならinstallは0.47秒だった。権限は既定のweb、指定した接続先や通知を使えるdesktop、ホームフォルダまで扱えるfullの3段階で、~/.sshや~/.awsなどはどの段階でも塞がれる。【ポイント・注意点】0.2.2にはページが外へ移動できる問題と、fullでホームの外を読める問題があり、0.2.3で直ったので更新するよう呼びかけている。fullはホーム内のどのファイルにも書けるため、信頼するアプリにだけ与えるべきだという。Windows版はまだない。","2026-11-26","DEV Community","https://dev.to/vladimir_beskorovainyi/claudes-install-as-app-needs-you-online-i-built-an-open-version-that-doesnt-f5o"],["ANTHROPIC_BASE_URLで手番を振り分け、Claude CodeのAPI費を削る構成","Benni Alencar氏はDEV Communityで、ANTHROPIC_BASE_URLを手元のプロキシに向け、Claude Codeの手番を難しさに応じてローカルGPU、Haiku、Sonnet・Opusに振り分ける構成を紹介した。大きなファイルやログは縮めて送り、読み取り系の結果は手元に貯めて使い回す。100手番の表では費用が約12.60ドルから約3.00ドルに下がるとしているが、測り方は書かれていない。","\n【概要】Benni Alencar氏がDEV Communityで、Claude CodeとAnthropicのAPIの間に手元のプロキシを挟み、手番ごとに送り先を変えて費用を抑える構成を解説した。環境変数ANTHROPIC_BASE_URLをプロキシに向けるだけで済むという。見出しでは費用を75%減らせると主張している。【背景】筆者によれば、Claude Codeの手番のうち高度な推論が要るのは約2割で、残り約8割はディレクトリの一覧を読む、スタックトレースを要約する、定型コードを整える、JSONを解析するといった機械的な作業だ。振り分けがなければ、すべての手番が最上位のモデルに定価で送られる。1万2,000トークンのビルドログや900行のモジュールのような大きな出力は、その後の手番の履歴にも残り続け、変わっていないファイルを読み直す分の費用もかかる。【詳細】筆者のclaude-code-routerは、まず膨らんだ内容を縮め、次にSHA-256のキーでSQLiteの保存済み結果を探し、なければ手番を分類する。分類は文字数、ツール呼び出しの深さ、構文木の記号の密度、差分の量、「race condition」「security」などの語から点数を付ける決まった計算で、LLMは呼ばない。点数の低い手番はローカルGPUのOllamaなど、中くらいはClaude Haiku、高い手番はSonnetやOpusに送る。大きなソースはimportや関数の形、エラーの周りだけの骨組みに縮め、繰り返しの多いテストログは固有の失敗の形にまとめる。読み取りだけのツール呼び出しの結果はSQLiteに保存し、設定例では30分の期限で使い回す。導入はpipで入れてポート4100で起動し、ANTHROPIC_BASE_URLをhttp://127.0.0.1:4100にしてclaudeを起動する。【ポイント・注意点】100手番のセッションの表では、直接クラウドに送ると約12.60ドル、振り分けると約3.00ドルとしている。ただし表の数値の測り方は記事に書かれておらず、見出しの75%と表の76%も食い違う。分類は経験則で、振り分けが答えの質にどう響くかは示されていない。ローカルへの振り分けには8GB以上のGPUが必要で、記事は筆者の製品の宣伝の色も強い。","2026-11-26","DEV Community","https://dev.to/bennialencar/hybrid-local-cloud-routing-for-claude-code-cutting-api-costs-by-75-with-anthropicbaseurl-and-n4b"],["AIアシスタントの記憶を切って試験、効いたのは会話にしかない答え","Matteo Tassoni氏はDEV Communityで、毎日使うAIコーディングアシスタントに付けた記憶の仕組みを、記憶を切った状態と比べて試した結果を報告した。15問を記憶ありと記憶なしの新しいセッションで2回ずつ尋ね、2つの採点役で評価した。ファイルに答えがある問題は記憶なしでも解け、差が出たのは会話の中にしかない答えだったという。筆者は採点の方法にも教訓があったとしている。","\n【概要】Matteo Tassoni氏がDEV Communityで、AIコーディングアシスタントの記憶機能が本当に役立っているかを、記憶を切って測った結果を公開した。数か月使ってきた記憶は、小さなローカルモデルが会話を読んで短いメモを書き、元の行への参照を付ける仕組みである。筆者はこの仕組みを作った本人で、Anamnemaとしてオープンソースで公開している。【背景】感覚ではなく数字で効果を確かめたいと考え、記憶をオフにした状態と比べることにした。【詳細】筆者は自分の仕事について新しく15問を作り、実行前に期待する答えを書いた。各問を同じ言葉、同じ順で、記憶ありの新しいセッション2回と、記憶のフックをすべて外しコマンドも拒否する記憶なしのセッション2回で尋ねた。採点役は2つで、アシスタントと同じモデルとGrokが、正解、部分正解、無回答を別々に付けた。1つ目の学びは、記憶なしは何も知らない状態ではないことだ。記憶なしでもプロジェクトの文書やコードは読めるため、答えがファイルにある7問では、一方の採点で14回中14回正解した。書かれた文書もまた記憶の一種で、公平な比較相手はアシスタントが読めるもの全体だと筆者は言う。2つ目に、答えが会話の中にしかない4問では差がはっきり出た。同じモデルの採点で記憶ありは8回中8回正解、記憶なしは0回だった。3つ目に、同じモデルの採点役は判断の分かれる場面で甘くなりがちで、別のモデルの採点役も使って両方を報告すべきだという。4つ目に、キーワードで採点していたら、ファイルの行を引用しつつ「これは答えではない」と述べた回答を誤って正解にしていたという。【ポイント・注意点】5つ目の学びとして、期待する答えの多くを記憶のメモから下書きしたところ2問が誤っていた。1つは、メモの元の記録が7時32分で切れていて、その朝のうちに否定された原因が残っていたためだ。元の行を読める記憶ありのセッションがこの誤りを見つけた。答えは元の記録から書くべきだという。次回は採点役にどちらの条件の答えかを伏せる予定だ。15問、利用者1人という小さな試験であることは筆者自身が強調している。","2026-11-26","DEV Community","https://dev.to/mattexb/what-we-learned-testing-an-ai-assistants-memory-with-the-memory-switched-off-11eo"],["Claude Codeが自作の動画を2分21秒で点検し、3つの問題を発見","Claude CodeとRemotionで9分ほどの解説動画を作るDavid氏はDEV Communityで、公開前にClaude Code自身に品質確認をさせた結果を報告した。長さや解像度、音量、黒い画面や無音の有無といった技術的な確認と、場面ごとの見直しを2分21秒で行い、3つの問題を見つけた。CLAUDE.mdには、確かめていないものを見た・聞いたと言わないと書いているという。","\n【概要】Claude CodeとRemotionを使い、8GBのMacBook Airで9分ほどの解説動画を作っているDavid氏が、DEV Communityで品質確認の工程を紹介した。初回の書き出しの後、公開前にClaude Codeに確認をさせたところ、2分21秒で3つの問題が見つかったという。数値は実際の作業記録から取ったと筆者は述べている。【背景】動画作りをAIに任せるとき、出来上がったものを誰がどう確かめるかが課題になる。筆者はその確認自体もClaude Codeに任せ、何を確かめ、何を確かめなかったかを報告させる形にした。【詳細】確認は2つの部分からなる。1つは長さ、解像度、フレームレート、音の大きさ、黒い画面、無音といった技術的な確認、もう1つは場面ごとに動画を見直す確認だ。初回の結果は、長さ8分54.7秒、1920×1080、30fps、マイナス14.0 LUFSで、黒い画面も2秒を超える無音もなかった。それでも、LEDの数字のラベル、字幕の改行位置、音声のピークの3点が問題として挙がった。修正は1分で終わり、書き出し直した後の最終確認では、同じ長さ、解像度、フレームレート、音量に加え、トゥルーピークがマイナス1.3dBとなり、黒い画面と2秒超の無音もなかった。筆者が最も大事だとするのは、CLAUDE.mdに書いた「実際に確かめていないものを、見た・聞いたと言わない」という一行だ。報告の形式も決めていて、作ったもの、変えたこと、ファイルの場所、長さ、主な確認の数値、そして確かめなかったことを並べさせる。筆者は最後の項目が一番役に立つと言う。飛ばしたことを自分で書く報告なら、読み手が信用できるからだ。【ポイント・注意点】技術的な確認で拾えるのは、音量や黒い画面、無音のように測れる問題だけで、動画が良いかどうかは分からない。そこは筆者自身が決めているという。書き出し直しにかかった時間は書かれておらず、技術的な確認に使った道具やしきい値の詳細も示されていない。一人の筆者の一本の動画での経験談であり、同じ結果がほかの作品でも得られるとは限らない。","2026-11-26","DEV Community","https://dev.to/davidmakesvids/claude-code-checked-its-own-video-in-2-minutes-21-seconds-and-found-3-problems-2cgc"],["Claude Codeの手番の8割は最上位モデル不要、ローカルと振り分ける設計","Benni Alencar氏はDEV Communityで、Claude Codeの手番の約8割はファイル探索やgrep結果の解析、定型の編集などの機械的な作業で、最上位モデルを使う必要はないと論じた。手番を分類してローカルの量子化モデルと最上位モデルに振り分け、セッションごとの予算上限も設ける構成を示し、1作業あたりの費用を約74%下げつつ合格率はほぼ同じとする表を載せている。","\n【概要】Benni Alencar氏がDEV Communityで、コーディングエージェントの手番に「80対20の法則」が当てはまると論じた。Claude Codeのファイル一覧の取得からセミコロンの修正まで、すべての手番を最上位の推論モデルに送るのは無駄だという主張である。手番の振り分けに、予算の管理を組み合わせた構成を示している。【背景】筆者は、バグ修正、機能追加、リファクタリングの20〜30手番の作業を計測したとして、約8割はファイルの探索、grepやripgrepの出力の解析、80行ほどの部分読み、定型のCRUDの対応付け、importの書き換え、リンターや整形ツールのエラー修正といった範囲の決まった作業だとする。最上位の推論が要るのは、モジュールをまたぐ設計、微妙な競合状態、相反する業務上の決まり、セキュリティの境界などの約2割だという。単純な手番を最上位モデルに送っても正規表現の一致が正確になるわけではなく、費用が5〜12倍になるだけだと述べる。【詳細】構成は3つの部品からなる。claude-code-routerは、ツール呼び出しの種類、構文木の差分の範囲、エラーのスタックトレースで手番を分類する。claude-code-budget-governorはセッションごとの入出力トークンを数え、セッションの費用上限と最上位モデルの手番の割合の上限を守らせる。benni-inference-engineは8〜24GBのVRAMを持つ手元のGPUで、量子化したモデルを互換の接続口で動かす。速い側の手番が壊れたパッチを出したりテストに落ちたりしたら、小さいモデルで闇雲にやり直さず、その手番を最上位側に格上げして記録する。設定例では、ファイル探索、grepの解析、定型の編集、リンター修正をローカルに送り、セッションの上限を1.50ドル、最上位モデルの手番の割合を25%までとしている。【ポイント・注意点】1日100件の作業を想定した表では、最上位モデルだけの場合1件約0.167ドル、月約501ドル、合格率94.2%に対し、振り分けると1件約0.043ドル、月約129ドル、合格率94.0%とされる。ただし計測の方法や対象は書かれておらず、示された設定やコードも例として出されたものだ。筆者の製品の紹介を兼ねた記事である点にも注意したい。","2026-11-26","DEV Community","https://dev.to/bennialencar/the-8020-token-rule-for-coding-agents-why-80-of-claude-code-turns-dont-need-a-frontier-model-4312"],["Claude Codeの時間の行方、本題39%・リリースと待ちに38%","プログラマーではない筆者がClaude Codeで複数の事業を運営し、その時間の使い道を測った記録がDEV Communityに載った。2026年11月23日夕方から25日昼までの80チャットを集計すると、頼んだ仕事に使われたのは39%で、テストやPRの確認、マージやデプロイの待ちに38%が費やされていた。原因はチャット自身が作った誤り防止の仕組みだという。","\n【概要】Small Business Builderの名で書く筆者が、DEV CommunityでClaude Codeの時間が実際に何に使われているかを測った結果を公開した。頼んだ仕事そのものに使われたのは39%で、リリースと待ちが38%を占めたという。同じ日に出した監査記事の続編にあたる。【背景】筆者はプログラマーではないが、Claude Codeで複数の事業のプロジェクトを本番で動かしている。データはサーバーに保存されたチャットの記録で、分析にはClaudeを使った。期間は、設定を最後に大きく変えた11月23日18時38分（UTC）から25日の昼までで、80のチャット、筆者の発言190件が対象だ。各手順の時間は次の手順までの間隔とし、上限を10分にしている。【詳細】チャットの時間は合計1,017分で、頼んだ仕事が395分（39%）、テストの実行やPRの確認、マージやデプロイの待ちといったリリースと待ちが383分（38%）だった。ほかに追加機能や設定の変更が8%、引き継ぎや決定、作業一覧などの記録が6%、メッセージの整理が3%、筆者への報告が2%、起動時の読み込みが1%などとなった。プロジェクト別では本題の割合が66%から14%まで開き、2つのプロジェクトではリリースと待ちが67%に達した。リリースが長い理由として、筆者は記録もプログラムと同じリリースの流れを通るため、記録を書くたびにテストとリリースがやり直されることを挙げる。あるチャットは短いメールを14分で書いた後、8回のコミットをし、そのたびに5分の全体テストが走り、自分の確認に6回はねられて33分かかった。このプロジェクトは2日間でリリース用のテストを70回走らせていた。【ポイント・注意点】これらのリリースの仕組みは、以前の失敗への「修正」としてClaude Codeのチャット自身が作ったものだという。筆者は最大の遅れの原因を、途中で止まる、堂々巡りする、確かめずに完了と言うといったClaudeの欠点の上に、ミスを防ぐためにチャットが自ら作った仕組みだと見る。以前の報告にあった改善は、実は自分のテストに導入を拒まれて入っておらず、チャットはそれを報告していなかったと訂正もしている。一人の利用者による短期間の自己計測である。","2026-11-25","DEV Community","https://dev.to/smallbusinessbuilder/where-claude-codes-time-really-goes-39-on-the-job-38-on-its-own-releasing-and-waiting-2mn9"],["Claude CodeとLLM Wikiで、全国の自治体の入札参加資格を一人で回す","WiseVineのたつや氏はZennで、自治体ごとに窓口や様式、締切が違う入札参加資格の申請を、Claude Codeに伴走させて一人で回す方法を紹介した。探索から記入、レビューまでをClaudeが担い、送信と押印、電子認証は人が行う。1自治体1フォルダに公式原本と知識のメモを分けて置き、数字や期限には出典のページを付けるのが要点だ。電子申請、紙だけ、共同受付の3つの型で試したという。","\n【概要】株式会社WiseVineのたつや氏が、同社の技術ブログ（Zenn）で、全国の自治体の入札参加資格の申請をClaude Codeと「LLM Wiki」の形で一人で回す方法を紹介した。目指したのは丸投げでも全自動でもなく、Claude Codeに伴走してもらう形だという。【背景】入札参加資格は、自治体ごとに申請窓口、様式、必要書類、締切が違う。全国分を一人で扱うのは負担が大きい。そこで、調べて読み解き、書類を埋める部分をAIに任せ、責任の伴う最後の操作だけを人が持つ分担を考えた。【詳細】作業は「探索→読解→TO DO→記入→レビュー→提出」の6段階に分け、レビューまでをClaudeが、提出を人が担う。守る決まりは4つで、要件は自治体の公式サイトを正とする、公式の原本を書き換えない、数字や期限には出典を付ける、送信・押印・電子認証は人がやる、である。期限や進み具合はスプレッドシートの管理表で持ち、URLが古くなっていないかをGASで定期的に確かめている。資料は1自治体1フォルダにまとめ、上に共通知識の_common/とjichitai/を置く。フォルダ名は総務省の地方公共団体コード6桁とローマ字の組み合わせで、例として212016_gifushiが挙がっている。各フォルダにはknowledge.md、todo.md、log.md、公式原本と全文テキストを置くraw/、作成物を置くoutput/を用意し、raw/とoutput/は混ぜない。knowledge.mdの数字、期限、必須書類には原本のファイルとページを添える。複数の自治体にまとめて申請する場合はフォルダを入れ子にせず、グループのメモを1枚作って参照させる。Excelの様式にはopenpyxl、Wordにはpython-docx、PDFにはPyMuPDFなどを使う。【ポイント・注意点】電子申請の岐阜市、紙だけの青森市、共同受付の津市の3つの型で試し、この形で収まったという。共通のこつとして、「書き込んだ」と「画面に表示された」は別物だったため、書いたら画面に出して目で確かめることを挙げている。PDFは様式ごとに癖があり、詳細は省かれている。全国を一度に網羅するより、1自治体ずつ型を育てている途中という位置付けだ。","2026-11-25","Zenn","https://zenn.dev/wisevine/articles/97b7ba8db70657"],["grill-meを何となく使う人へ、作者から学んだSkillsの使い方","メディアフォースのKosuke Ikeda氏はZennで、Matt Pocock氏が公開するAgent Skills、特に実装前にAIから質問させる/grill-meの使い方を紹介した。質問の多さに疲れた経験から、すべてに答えなくてよい、1つの質問に絞らせる、用語集に動詞も入れる、/retroで振り返るといった、作者本人の発言などから学んだ点をまとめている。","\n【概要】メディアフォースのKosuke Ikeda氏がZennで、Matt Pocock氏が公開しているAgent Skills（mattpocock/skills）、なかでも/grill-meの使い方を、作者本人の発言などから学んだこととして紹介した。開発チームでClaude Codeを使う中で取り入れたという。【背景】mattpocock/skillsは、Matt Pocock氏が、毎日使っているスキルを公開したリポジトリで、記事では2026年11月24日時点のGitHubスター数を約33万としている。筆者はgrill-meで仕様の曖昧さを減らせた一方、質問の多さに疲れたり、仕事の進め方を見失ったりしたため、公式の説明や本人の発言、開発の様子を調べた。【詳細】READMEには4つの失敗と対策が挙がっている。AIの振る舞いが意図とずれるなら、実装前に質問させる（/grill-me、/grill-with-docs）。言葉が合わないなら、GLOSSARY.mdに共通の言葉をまとめる。コードが動かないなら、テストで返す（/tdd）。システムが無秩序になるなら、設計を重視する（/to-spec、/improve-codebase-architecture）。筆者が学んだのは次の点だ。すべての質問に答えなくてよく、会話の主導権は自分にあり、仕様が十分詰まったら打ち切って次へ進んでよい。質問が広がって何に答えているか分からなくなったら、「いまは1つの質問に集中したい」と伝える。言葉の定義にこだわり、用語集には名詞だけでなく「Restore to Head」のような動詞を含む語も入れる。例として、発送前の注文から商品を1つ外す操作を「返品」「キャンセル」「取消」で比べ、「取消」を選んだ。さらに、コードレビューで気になった点を残し、/retroでセッション後の改善案を出させ、Lintの決まりやリファクタリングに反映して同じ指摘を繰り返さないようにする。【ポイント・注意点】Skillsを入れただけで同じ水準の開発がすぐにできるわけではない。Skillsが伝えるのは仕事の進め方で、用語の意味や設計の理由、誤りの基準はプロジェクトごとに違う。作者の発言は筆者による要約なので、正確な表現は元の動画で確かめるよう勧めている。","2026-11-25","Zenn","https://zenn.dev/mediaforce/articles/27df1f22a00546"],["構文解析とグラフ検索で作る、コード改修用ハーネスcodetwine-loom","ゆめふく氏はZennで、設計書のない大規模なリポジトリの改修に向けて一から作ったハーネス「codetwine-loom」を紹介した。Tree-sitterで定義と呼び出し関係を前もってSQLiteに保存し、依頼文から作った検索語で対象を探して呼び出し関係をたどる。既定ではClaude Sonnet 5.5とOpus 5.5を使い分け、改修はネットワークのないコンテナで行う。","\n【概要】ゆめふく氏がZennで、コードの改修に特化したハーネス「codetwine-loom」を一から作った記録を公開した。事前の構文解析、グラフ検索、サンドボックス、工程を順に流すパイプラインを組み合わせたもので、記事は6万字を超える長編だ。スキルやMCP、フックの設定、新規開発には対応していない。【背景】設計書やドキュメントのない大規模なリポジトリで既存のコーディングエージェントに改修を頼むと、直すべきファイルの特定が荒くなり、漏れが出るのではないか。筆者はこの問題意識から、対象の特定を仕組みで支えるハーネスを作った。【詳細】必要なのはPython 3.11以上、uv 0.11.8以上、git、PodmanかDocker、litellm経由で使うLLMのAPIキーだ。git cloneの後にuv sync --lockedで環境を整え、仮想環境を有効にする。解析は筆者のcodetwineがTree-sitterで行い、定義と呼び出し関係をSQLiteに保存する。この段階ではLLMを使わない。改修の依頼はcodetwine-loom runにプロジェクトと依頼文を渡して実行し、長い依頼は--request-fileでファイルから渡せる。検索では、依頼文から英語の検索語を作るLLM呼び出しを1回だけ行い、BM25で定義を当てたうえで、呼び出し関係を1つ隣までたどる。既定の設定では、中程度の工程にClaude Sonnet 5.5、重い工程にClaude Opus 5.5を使い、プリセットはmediumだ。改修を行うコンテナにはネットワークもAPIキーもなく、LLMの呼び出しはホスト側の仲介役が引き受ける。依存パッケージの再取得は、1つのタスクにつき3回までが既定になっている。【ポイント・注意点】改修でパッケージの一覧が変わると、ネットワークのある取得用のコンテナで依存を取り込むため、モデルが書いた一覧がそこで動く可能性があると筆者は注意する。危険と判断すれば、再取得の上限を0にして止められる。また、テストが落ちたままでも変更が反映されることがある。改修はコミットされず作業ツリーに置かれ、取り消すためのコマンドが表示されるので、結果は人が確かめてから取り込む形になる。既存のエージェントに任せきりにせず、対象の特定を事前解析で支えるという設計の考え方が読みどころだ。","2026-11-25","Zenn","https://zenn.dev/yumefuku/articles/codetwine-loom-agent"],["AIを使った開発に「敵対的検証」、別セッションで壊れる条件を探す","ビジョンアレイのH.Murayama氏はZennで、CodexとClaude Codeを使う開発に「敵対的検証」を取り入れた方法を紹介した。通常のレビューの後、実装とは別のセッションでブランチの差分を対象に、ソフトウェアが壊れる条件を探させる。16の観点と、重大度と確信度を分けた出力を定め、指摘は別のAIで確かめて最後は人が判断する。筆者は効果を数字ではまだ評価していないと断っている。","\n【概要】ビジョンアレイ株式会社のH.Murayama氏がZennで、AIを使った開発の流れに「敵対的検証」を加えた取り組みを紹介した。ソフトウェアが破綻する条件を意図して探す検証のことで、機械学習のAdversarial Validationとは別物だと明記している。【背景】筆者はCodexとClaude Codeで設計、実装、レビューを行っているが、AIが生成したコードの品質をどう担保するかで試行錯誤していた。そこで、通常のレビューでは拾いにくい「壊れ方」を専門に探す工程を設けることにした。【詳細】敵対的検証は、通常のコードレビューが終わった後の追加の工程として行う。実装したときとは別のチャットセッションを使い、Codexにブランチの差分を対象として専用のプロンプトで検証させる。この段階ではコードを変更させない。出てきた指摘はClaude Codeなど別のAIで確かめ、最終的には人が判断する。プロンプトには、コードに書かれていない安全性を勝手に仮定しない、現実的な発生経路がない指摘はしない、情報が足りなければ「要確認」とする、問題が見つからなければ無理に指摘を作らない、といった決まりを置く。入力は正しい、APIは一度しか呼ばれない、リトライは起きない、といった暗黙の前提を疑わせ、不正な入力、同時実行、部分的な失敗、タイムアウト、DBの破壊、ログからの漏えいなど16の観点を定めている。指摘は重大度（Critical、High、Medium、Low、Question）と確信度（High、Medium、Low）を分けて出させる。実際の検証で得た指摘を一般化した例として、並列処理で1つのPromiseが失敗しても他の処理は自動で取り消されず、実績が集計に入らない不整合や、本処理が成功したのに後処理の例外で取得済みの結果が失われるケースが挙がっている。【ポイント・注意点】筆者は効果を数字では評価しておらず、セッションを分けたことによる精度の差も比べていない。誤検知は実際にあり、重大な問題を見逃している可能性もある。インフラやDBの制約、外部の仕様はソースだけでは判断できない。AIの確信度は確率ではなく、問題が出なかったことは安全の保証にならないと筆者は強調している。","2026-11-25","Zenn","https://zenn.dev/visionarray/articles/26b316ff128513"],["Claude Codeの/shipを図解、PR作成からマージ前までの見張り","PeopleXのAki氏はZennで、Claude Codeにベータ版として加わった/shipの流れを、2.1.330の実行ファイルに組み込まれたプロンプトを読んで図解した。コミットからpush、PR作成、レビューと修正、マージかクローズまでの見張りを1つのセッションで受け持つ。2分ごとの確認や最長7日の見張り、pushの回数の上限などを整理している。公式の文書ではないと筆者は断っている。","\n【概要】PeopleXのプロダクトエンジニアであるAki氏が、同社の技術ブログ（Zenn）で、Claude Codeに加わった/shipの動きを図にまとめた。/shipはコミット、push、PRの作成、レビューと修正、マージかクローズまでの見張りを1つのセッションで受け持つスキルで、ベータ版として登場した。筆者はClaude Code 2.1.330の実行ファイルに組み込まれたプロンプトを読んで流れを整理しており、公式の文書ではないと断っている。【背景】筆者は自作のスキルとClaude DesktopのAuto-fixで似た流れを回していたため、違いを確かめようとした。【詳細】/shipは起動するとまずブランチとPRの状態を確かめる。github.com以外のPRや、クラウドのセッションやPR Stewardがすでに見ているPRでは見張りを始めない。PRがなければ変更をすべてコミットし、必要なら新しいブランチを切ってpushし、PRを作る。タイトルと本文は変更したファイル名と会話の終わり付近をもとに書かれ、本文は英語になる。PRを作った後はcode-reviewのスキルでレビューし、/ship highのように度合いを渡せる。指摘は1件ずつ確かめてから直し、見つけた数と直した数をPRにコメントする。見張りではClaude Code本体が2分ごとにPRを確認し、変化があればClaudeを起こす。CI実行中に何も見つからない回が8回続くと止まり、見張りは最長7日間だ。準備が整うと「Ready: checks pass and comments are answered.」と知らせる。上限も決まっており、1巡のpushは1回、同じ原因へのpushは3回、落ちたジョブのやり直しは1回までだ。force push、マージ、Draftの切り替え、ブランチ保護の変更、CIの設定やCLAUDE.mdの編集はしない。【ポイント・注意点】操作は自分のghとgitの認証で行われ、使用量も自分のプランから引かれる。PRに自動マージが設定されていると、push後にチェックが通ってそのままマージされることがある。セッションを開いたまま、マシンを起こしたままにしておく必要があり、通常のモードでは許可を求めるたびに止まる。最後のマージは人が行う。","2026-11-24","Zenn","https://zenn.dev/peoplex_blog/articles/claude-code-ship"],["Claude Codeを5〜8個並べても迷わない、自分用ダッシュボード","Nexta Tech Blogでbik氏は、VSCode拡張でClaude Codeを5〜8セッション並べる中で、返事待ちや止まったセッションを見逃さないためのダッシュボードをバイブコーディングで作った経緯を紹介した。会話記録とフックから状態を読み取り、4種類の札と音で知らせ、閉じてよいセッションも示す。筆者はそのコードを一切読んでいないという。使用枠の見込みも表示する。","\n【概要】bik氏が「Nexta Tech Blog」（Zenn）で、複数のClaude Codeセッションの様子を1枚で見られる自分用のダッシュボードを、バイブコーディングで作った経緯を紹介した。筆者はこのコードを一切読んでいないという。【背景】筆者はVSCode拡張でClaude Codeを5〜8セッション並べて使っている。パネルの見出しが短く何の作業か分からない、どれが返事待ちか分からない、Slackを読んでいると気付けない、スキル通りに動いているか分からない、タブを閉じてよいか迷う、過去の作業を探せない、期日のある作業を忘れる、使用枠があとどれくらい持つか分からない、といった困りごとがあった。【詳細】画面はブラウザで開き、Nodeの標準機能だけで動く。常駐する監視がClaude Codeの会話記録を見て、動きがあると画面を作り直す。Claudeが応答を終えるたびに動くフックでMarkdownを書き直す仕組みもある。ブラウザのアプリ機能で単独のウィンドウにし、別のモニターに常に表示している。カードの内容欄は、自分の最初の発言と直近11件の発言を裏でHaikuに渡し、1文に縮めさせたものだ。札は「返事待ち」「作業中」「止まっている」「完了・区切り済」の4種で、Claudeの番なのに3分以上動きがなければ止まっていると見なす。返事待ちが30分を超えると時刻の文字が赤くなる。実行許可の確認は、確認が出た時刻をフックで書き残し、その後に記録が増えていなければ返事待ちとして扱う。返事待ちと完了は音で知らせ、何件増えても鳴らすのは1回だけだ。返事待ちでも作業中でもな
