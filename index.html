<style>

:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;display:flex;flex-direction:column;height:100dvh;overflow:hidden;transition:background .35s ease,color .35s ease}
body::before{content:"";position:fixed;inset:0;background:var(--pattern);pointer-events:none;opacity:var(--pattern-op,.5)}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
[data-theme="steampunk"]{--bg:#e6d7b8;--pattern:radial-gradient(circle at 12% 20%,rgba(141,100,40,.16) 0 26px,transparent 27px),radial-gradient(circle at 88% 78%,rgba(141,100,40,.13) 0 38px,transparent 39px),repeating-linear-gradient(0deg,rgba(90,62,25,.05) 0 1px,transparent 1px 26px);--pattern-op:1;--card:#f8eed3;--ink:#2e2010;--muted:#77603c;--line:#a97f3f;--accent:#9c4a12;--accent2:#2f5d50;--accent-ink:#fff6df;--soft:#efdfba;--old:#97835f;--top-bg:#2a1a0c;--top-ink:#f2dfae;--radius:8px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\2699  \2699  \2699";--shadow:0 14px 34px rgba(62,40,8,.28)}
[data-theme="witch"]{color-scheme:dark;--bg:#161022;--pattern:radial-gradient(circle at 18% 12%,rgba(233,213,255,.20) 0 1.5px,transparent 2.5px),radial-gradient(circle at 72% 22%,rgba(233,213,255,.14) 0 1px,transparent 2px),radial-gradient(circle at 42% 66%,rgba(196,181,253,.12) 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 84%,rgba(233,213,255,.16) 0 1px,transparent 2px),radial-gradient(circle at 6% 88%,rgba(196,181,253,.12) 0 1px,transparent 2px);--pattern-op:1;--card:#241a3d;--ink:#f1eaff;--muted:#bdaee0;--line:#5b4595;--accent:#a678ff;--accent2:#e9d5ff;--accent-ink:#1d1233;--soft:#2f2350;--old:#8d81ad;--top-bg:#0e0919;--top-ink:#efe6ff;--radius:20px;--font-display:"IM Fell English","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\263E  \2726  \263D";--shadow:0 14px 34px rgba(0,0,0,.5)}
[data-theme="dnd"]{--bg:#e7d9b4;--pattern:repeating-linear-gradient(45deg,rgba(158,43,37,.05) 0 2px,transparent 2px 18px),radial-gradient(circle at 85% 10%,rgba(158,43,37,.10) 0 30px,transparent 31px);--pattern-op:1;--card:#f7ecc9;--ink:#332216;--muted:#7d6248;--line:#8c6a3f;--accent:#9e2b25;--accent2:#a97b00;--accent-ink:#fdf3d8;--soft:#eee0b6;--old:#9a8a72;--top-bg:#471611;--top-ink:#f7e7bd;--radius:4px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\265E  \2726  \265E";--shadow:0 14px 30px rgba(71,22,17,.30)}
[data-theme="celtic"]{--bg:#e3dfc6;--pattern:repeating-linear-gradient(0deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px),repeating-linear-gradient(90deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px);--pattern-op:1;--card:#f6f2dc;--ink:#20331e;--muted:#5d7050;--line:#77873f;--accent:#2e6b34;--accent2:#a8842a;--accent-ink:#fbf7e2;--soft:#e7e5c8;--old:#93a086;--top-bg:#17351f;--top-ink:#efeccb;--radius:14px;--font-display:"Uncial Antiqua","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\16DA  \2726  \16DB";--shadow:0 14px 30px rgba(23,53,31,.26)}
[data-theme="greek"]{--bg:#f2eee3;--pattern:repeating-linear-gradient(90deg,rgba(29,95,138,.06) 0 1px,transparent 1px 34px),radial-gradient(circle at 90% 0%,rgba(185,138,28,.10) 0 60px,transparent 61px);--pattern-op:1;--card:#fffdf6;--ink:#1e2c38;--muted:#66727c;--line:#b3923c;--accent:#1d5f8a;--accent2:#b98a1c;--accent-ink:#ffffff;--soft:#ece7d7;--old:#a3a8ad;--top-bg:#fdfbf4;--top-ink:#1e2c38;--radius:2px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\03A9  \2766  \03A9";--shadow:0 14px 30px rgba(30,44,56,.18)}
.top{flex:none;position:relative;z-index:30;background:var(--top-bg);color:var(--top-ink);border-bottom:3px double var(--line)}
.topin{max-width:1080px;margin:auto;padding:10px 16px 4px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.logo{font-family:var(--font-display);font-weight:900;font-size:23px;letter-spacing:.06em}.logo span{color:var(--accent2)}
[data-theme="witch"] .logo span,[data-theme="steampunk"] .logo span{color:var(--accent)}
.date{font-size:10px;opacity:.75;white-space:nowrap}
.topbtns{display:flex;gap:8px;flex:none}.pill{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.themes{max-width:1080px;margin:auto;padding:6px 16px 10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.themes-label{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;opacity:.8}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;opacity:.85}
.theme-btn .gly{margin-right:5px}
.theme-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
.stage-wrap{flex:1;min-height:0;max-width:1080px;width:100%;margin:auto;padding:10px 16px 12px;display:flex;flex-direction:column;position:relative;z-index:1}
.herostrip{flex:none;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;box-shadow:var(--shadow)}
.herostrip img{width:74px;height:52px;object-fit:cover;border-radius:calc(var(--radius) * .6);flex:none}
.herostrip p{margin:0;font-size:13px;color:var(--muted)}.herostrip b{color:var(--ink);font-family:var(--font-display)}
.catbar{flex:none;display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.catbar .navbtn{flex:none}
.catinfo{flex:1;text-align:center;min-width:0}
.catinfo h2{margin:0;font-family:var(--font-display);font-size:clamp(19px,4.6vw,27px);line-height:1.25;letter-spacing:.03em}
.catinfo p{margin:1px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catcount{flex:none;font-size:12px;background:var(--soft);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-weight:700}
.navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800;box-shadow:var(--shadow)}
.navbtn:active{transform:scale(.97)}
.dots{flex:none;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:transparent;padding:0}
.dot.active{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.stage{flex:1;min-height:0;touch-action:none;position:relative}
#cardSlot{height:100%}
.card{height:100%;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
.card::after{content:var(--orn);position:absolute;top:6px;right:12px;font-size:13px;letter-spacing:.3em;color:var(--accent2);opacity:.85;pointer-events:none}
.card.old .ph{filter:grayscale(1)}
.card .ph{width:100%;height:30%;min-height:120px;object-fit:cover;display:block;flex:none}
[data-theme="steampunk"] .card .ph{filter:sepia(.35) contrast(1.05)}
[data-theme="witch"] .card .ph{filter:saturate(.85) hue-rotate(-12deg) brightness(.92)}
[data-theme="dnd"] .card .ph{filter:sepia(.25) saturate(1.1)}
[data-theme="celtic"] .card .ph{filter:saturate(1.05) hue-rotate(6deg)}
[data-theme="greek"] .card .ph{filter:saturate(.92) brightness(1.04)}
.cbody{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.badge{background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:999px;font-weight:800}.badge.oldb{background:var(--old)}
.card h3{margin:0;font-size:clamp(17px,4.4vw,21px);line-height:1.45;font-family:var(--font-display);font-weight:700}
.sum{font-size:14px;color:var(--muted);margin:0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.btn{border:0;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800}
.btn.primary{background:var(--accent);color:var(--accent-ink)}.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.saved{background:var(--accent2);color:var(--accent-ink)}
.src{font-size:11px;color:var(--muted);word-break:break-all}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;color:var(--muted)}
.empty .big{font-size:34px;color:var(--accent2)}
.pager{flex:none;display:flex;align-items:center;gap:10px;margin-top:10px}
.pager .navbtn{flex:1}
.artdots{flex:none;display:flex;gap:5px;max-width:34vw;flex-wrap:wrap;justify-content:center}
.artcount{flex:none;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.hint{flex:none;font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.addcat{flex:none;text-align:center;margin-top:6px}
.addcat button{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700}
@keyframes inNext{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes inDown{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes inUp{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
.anim-next{animation:inNext .28s ease}.anim-prev{animation:inPrev .28s ease}.anim-down{animation:inDown .28s ease}.anim-up{animation:inUp .28s ease}
dialog{border:2px solid var(--line);border-radius:calc(var(--radius) + 6px);padding:0;max-width:min(680px,94vw);width:680px;max-height:92dvh;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,8,4,.6)}
.din{padding:20px;overflow-y:auto;max-height:92dvh}
.din img{width:100%;height:200px;object-fit:cover;border-radius:var(--radius)}
.din h3{font-size:20px;line-height:1.4;margin:12px 0 6px;font-family:var(--font-display)}
.full{font-size:15px;white-space:pre-line}
textarea,input[type="text"]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px}
label.fl{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
.memoBox{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.memoItem{border-top:1px solid var(--line);padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--top-bg);color:var(--top-ink);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:90vw;text-align:center}
@media(max-width:640px){.topin{padding:8px 12px 2px}.themes{padding:4px 12px 8px}.stage-wrap{padding:8px 12px 10px}.herostrip{display:none}.catbar .navbtn{padding:8px 10px;font-size:12px}.card .ph{height:24%;min-height:104px}}
@media(prefers-reduced-motion:reduce){.anim-next,.anim-prev,.anim-down,.anim-up{animation:none}body{transition:none}}

</style>

const DATA = {"ai":[["Anthropic、PRのレビューから承認まで支援する「Claude Ship」公開","Anthropicは米国時間11月23日、プルリクエスト（PR）のレビューから修正、承認までをAIで支援する「Claude Ship」をベータ版として公開した。既存のCode Reviewに、PRをマージ可能な状態に保つ「PR Steward」と、リポジトリ内のポリシーファイルに基づいて承認を判断する「Claude Approvals」を加えた構成で、GitHubを使うClaude TeamとEnterpriseの利用者が対象となる。","\n【概要】Anthropicは米国時間11月23日、PRのレビューから修正、承認までをAIで支援する「Claude Ship」をベータ版として公開した。3月に提供を始めたCode Reviewに、新たな2つのエージェント「PR Steward」と「Claude Approvals」を組み合わせたもので、GitHubのリポジトリを使うClaude TeamとEnterpriseの利用者が対象となる。\n【背景】AIによるコード生成が広がる中、書かれたコードをレビューし、CIの失敗やマージの競合に対応してリリースまで運ぶ工程の負担が課題になっている。Claude Codeの開発チームでは、6月から9月にかけてマージされたPRがおよそ2倍に増え、マージ後に差し戻されたPRは40%以上減ったという。\n【詳細】PR StewardはCIの失敗、マージの競合、レビューコメントに対応してPRをマージ可能な状態に保つが、承認やマージ自体は行わない。変更ごとに内容と元に戻す方法をコメントで残し、開発者は「@claude」で指示、「@claude stop」で停止できる。Claude Approvalsは、CODEOWNERSを拡張したようなリポジトリ内のポリシーファイルに基づいて承認を判断し、定型的な変更は自動承認、特定の変更には人間の承認を必須にできる。Anthropicはまず観察のみのモードから始めることを推奨している。Claude Codeとデスクトップアプリには、プッシュからPR作成、レビュー、失敗したチェックの修正までを進める「/ship」コマンドも追加された。管理者はリポジトリ単位で有効化し、レビューの深さやタイミング、月間の支出上限を設定できる。\n【ポイント・注意点】料金はトークン量に応じた従量制。Claude Approvals自体に基本料金はないが、ポリシーで使う分類器にはトークン料金がかかり、観察モードでもCode Reviewの料金は発生する。対象となるEnterprise組織は2027年1月15日まで、1万ドル以上のClaude Shipクレジットを申請でき、申請から30日以内に使う必要がある。ゼロデータ保持、HIPAA構成、顧客管理キーを使う組織は対象外。AnthropicはAIがバグやセキュリティ上の脆弱性を見逃す可能性があると注意を促している。","2026-11-24","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/24/2000003404/"],["オレゴン州とバージニア州がSpaceXを提訴　Grokの性的画像生成で","米オレゴン州とバージニア州の司法長官は米国時間11月23日、SpaceXと関連会社を提訴したと発表した。xAIのAI「Grok」が児童性的虐待コンテンツ（CSAM）や同意のない性的画像を生成・拡散したと主張し、差し止め命令や民事制裁金、不当利得の返還を求めている。両州は連携しつつ、それぞれの州の裁判所に別々に訴えを起こした。xAIは2026年2月にSpaceXと統合している。","\n【概要】米オレゴン州のダン・レイフィールド司法長官とバージニア州のジェイ・ジョーンズ司法長官は米国時間11月23日、SpaceXと関連会社を提訴したと発表した。xAIのAI「Grok」が児童性的虐待コンテンツ（CSAM）や同意のない性的画像を生成・拡散したと主張している。両州は連携しつつ、それぞれの州の巡回裁判所に別々に訴えを起こした。\n【背景】xAIは2023年11月にGrokを公開し、Xと統合して提供してきた。xAIは2026年2月にSpaceXと統合している。Grokを巡っては、2026年1月に実在の人物の写真を性的に加工した画像が出回ったと報じられ、カリフォルニア州が正式な調査を始めたほか、英国のOfcomやICO、フランスの検察も調査を進めている。\n【詳細】両州は、Grokが既存の写真1枚から、本人の知らないうちにリアルな裸や性的な画像・動画を作れる状態にあり、実際にそうした生成が行われたと主張する。SpaceXはAI競争で差別化するため業界標準の安全策を無視し、性的コンテンツを作れる機能を宣伝したと指摘。Grokは「反抗的」な一面を持つAIコンパニオンとして売り出され、2025年8月に公開された画像・動画生成ツール「Grok Imagine」の「Spicy」モードも宣伝されていた。その一方で消費者には強固な保護策があると説明しており、これは虚偽だとしている。州側は非営利団体CCDHの調査を引用し、2025年12月29日から2026年1月8日までにGrokが約300万枚の性的画像を作成してXに投稿し、うち約2万3000枚が子どもを描いたとみられると指摘した。\n【ポイント・注意点】両州は差し止め命令、民事制裁金、不当利得の返還を求めている。Xの安全担当アカウントは同日、訴訟には触れずに声明を出し、こうしたコンテンツはXやGrokに存在してはならないとしたうえで、安全策を意図的に回避したユーザーに責任があると主張した。現在は生成前にプロンプトを審査し、出力を分類器で確認しているという。訴えの内容はあくまで州側の主張であり、裁判所の判断はまだ出ていない。","2026-11-24","ITmedia NEWS","https://www.itmedia.co.jp/news/article/2611/24/2000003399/"],["DeNA、「AI社員」を外販　使い過ぎは“残業時間”で管理","DeNAは11月20日、AIエージェントを社員のように配属し育成できるサービス「AI社員 by DeNA」を発表した。トークン使用量を「労働時間」とみなし、「残業上限」を設けて使い過ぎを防ぐ仕組みが特徴だ。社内では既に30人のAI社員が購買やITシステム、営業などの業務に就いており、経理システムの開発保守チームでは8営業日で52.6時間分の作業を担った。11月から事前登録を受け付ける。","\n【概要】DeNAは11月20日、AIエージェントを企業の社員のように配属し、育成できるサービス「AI社員 by DeNA」を発表した。トークンの使用量を「労働時間」として扱い、「残業上限」を設定することで使い過ぎを防げるのが特徴だ。11月から事前登録を受け付ける。\n【背景】生成AIを業務に組み込む企業は増えているが、AIがどこまで権限を持ち、何をしたのかを管理すること、利用コストが想定以上に膨らむことが課題になりやすい。DeNAは社内で先行してAI社員を運用しており、そのノウハウを外部に提供する形となる。社内では既に30人のAI社員が購買、ITシステム、インフラ、営業などの業務に就いているという。外販するサービスでも、AI社員は人間の社員と同じように部署に配属され、メンター役の社員から仕事を教わる形をとる。\n【詳細】AI社員はそれぞれ専用のアカウントを持ち、主にSlackなどのチャットツール上で働く。メンター役の社員が仕事の進め方やルールを教え、AI社員は繰り返し担当する作業を自らスクリプト化して自律的に実行できるようになる。行動は固有のIDとひもづけて記録されるため、AIと人間の操作を区別できる。権限は必要最小限に絞り、それを超える操作には人間の承認を求めるよう設定できる。顧客データは同意なくモデルの学習に使わず、契約終了後には削除できるとしている。経理システムの開発・保守チームに配属したAI社員は、8営業日で52.6時間分に相当する作業を担当し、人間のメンバーは空いた時間を設計や調整の業務に充てたという。\n【ポイント・注意点】料金は初期費用と、従量課金分を含む月額費用の組み合わせで、具体的な金額は個別見積もりとなる。AIを単なるツールではなく同僚として扱い、労働時間や残業という人事の概念でコストと権限を管理する発想は、AIエージェントの業務導入を進める企業にとって参考になりそうだ。一方、52.6時間分という効果は社内の1チームでの事例であり、導入先の業務内容によって成果は変わり得る点には留意が必要だ。","2026-11-24","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/24/2000003406/"],["「GetBackers」告知映像のAI利用で謝罪　作者への説明不足認める","漫画「GetBackers -奪還屋-」のボイスコミック公式Xアカウントは11月22日、11月18日に公開した生成AIを一部使った告知映像について謝罪した。新作TVアニメやAIアニメ化との誤解を招き、制作方法の説明が不十分だったとしている。映像を制作したIMAKAIも、作者への説明と確認が十分でなかったと認めた。本編では原画への生成AI加工やAIによるアニメ化は行わないという。","\n【概要】漫画「GetBackers -奪還屋-」のボイスコミックの公式Xアカウントは11月22日、11月18日に投稿した告知映像の一部に生成AIを使っていたことについて謝罪した。映像によって新作TVアニメやAIによるアニメ化が進んでいるとの誤解を招き、制作方法や今後の計画の説明が不十分だったとしている。\n【背景】GetBackersは1999年から2007年まで「週刊少年マガジン」で連載され、2002年から2003年にはTVアニメも放送された作品。公式YouTubeでのボイスコミックシリーズは2025年12月から休止しており、2026年12月1日に再開する予定だった。告知映像は漫画のコマにアニメーションを組み合わせたもので、「YouTubeコミックアニメ、再始動」とうたっていた。漫画やアニメの制作で生成AIをどう使うかには、作り手やファンの間で敏感な反応が起きやすく、制作過程の透明性がこれまで以上に問われるようになっている。\n【詳細】公式アカウントによると、本編は従来通り漫画のコマに声と効果音を付ける形式を維持する。原作の絵やコマに生成AIによる加工を施す予定や、本編を生成AIでアニメ化する予定はないと明言した。AIの利用や告知に関する判断は運営側が行ったもので、講談社は関与しておらず、責任は運営側にあるとしている。映像の制作・編集は、AI漫画サービス「MangaNow」やアニメサービス「AnimeNow」を運営するIMAKAIが担当した。同社も11月22日、映像は公開前に作者側に送っていたものの、生成AIの利用を含む制作方法についての説明と確認が十分ではなかったと説明した。\n【ポイント・注意点】今回の問題は、生成AIの使用そのものに加え、権利者である作者への説明と合意形成のプロセスが不十分だった点にある。既存作品をAIで再活用するビジネスが広がる中、制作手法を事前に権利者へ具体的に伝え、ファンに対しても誤解のない形で告知する必要性を示す事例といえる。ボイスコミックは12月1日に再開する予定で、本編の制作方法は従来通りとされている。今後、同様のAI活用を検討する事業者にとっても教訓となりそうだ。","2026-11-24","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/24/2000003424/"],["国内で採れないAI人材をインドで確保　Zenkenが開発ラボ開始","これまで約700人のインド人エンジニアを日本に送り出してきたZenkenは、2026年8月、エンジニアがインドにいながら日本企業の開発を担う「ZenNxt Labs」を始めた。求められるのは15年以上の経験を持ち、1人で3〜4人分の成果を出せるAI人材だが、日本の年収1500万〜2000万円では採用が難しいという。同社幹部へのインタビューから、その背景と選考の仕組みを探った記事だ。","\n【概要】約700人のインド人エンジニアを日本に送り出してきたZenkenは2026年8月、エンジニアがインドに住んだまま日本企業の開発に携わる開発ラボ「ZenNxt Labs」を始めた。ITmedia AI+が、同社執行役員でZENKEN INDIA LLPのCEOを務める田中志穂氏と、林順之亮社長に話を聞いた。\n【背景】同社の「日本に呼ぶ」事業は、2020年から2022年のコロナ禍で大きな打撃を受けた。さらに、取引先のIT企業から、インドに開発拠点を作るための採用を手伝ってほしいという依頼があったことも、ラボ設立のきっかけになったという。田中氏によると、需要が高いのは15年以上の経験を持ち、1人で3〜4人分の成果を出せるAI人材だが、日本の年収1500万〜2000万円という水準では、こうしたシニア人材を引きつけられないという。\n【詳細】田中氏は、この1年で採用の要件が変わったと話す。以前はフルスタックのスキルが重視されていたが、現在はアーキテクチャ設計の力、事業への理解、AIを使って朝に頼まれたものを夕方までに仕上げる力が求められている。同社が対象とするのは、コンピューターサイエンスの学士または修士号を持ち、AI・機械学習、LLM、クラウドネイティブの実務経験があり、英語で自律的に開発を進められるエンジニアだ。選考は3段階で、書類選考の後、インド子会社に駐在する元CTOが面接を担当し、ディスカッションと技術面接の両方に合格した人だけを顧客に提案する。顧客企業が求める経験年数は12〜20年が一般的だという。インド子会社は2019年にベンガルールで設立された。\n【ポイント・注意点】AI活用で開発の生産性が上がるほど、少数の高度な人材の価値が高まり、国内の給与水準では確保が難しくなるという構図が浮かぶ。人材を日本に呼ぶのではなく、現地で働いてもらう形は、採用難に悩む企業の選択肢の一つになり得る。一方で、記事は同社幹部への取材に基づくもので、ラボの規模や顧客数などの具体的な実績は示されていない点には注意したい。","2026-11-24","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/24/2000003396/"],["フィジカルAIの「200兆円市場」阻む資源不足　日立が独自技術で挑む","日立製作所は11月17日の研究開発イベントで、社会インフラ向けフィジカルAIの潜在市場が2030年に約1.3兆ドル（約200兆円）に達する一方、データセンターの電力需要や人手不足、設備の老朽化といった資源不足が普及を阻んでいると説明した。打開策として、物理モデルと専門家の知見をAIエージェントが組み合わせる「IWIM」を進めており、データセンターでの検証成果も示した。","\n【概要】日立製作所の研究開発グループで産業オートメーション研究を率いる小倉孝裕氏は、11月17日に開いた研究開発イベントで、社会インフラ向けフィジカルAIの潜在市場が2030年に約1.3兆ドル（約200兆円）、年平均成長率9.5%に達するとの見方を示した。一方で、資源の不足がその実現を阻んでいると指摘した。\n【背景】小倉氏が挙げた制約は、データセンターの電力需要の増大、人手不足、設備の老朽化の3つだ。AIの計算需要が増えるほど電力の確保が難しくなり、インフラを維持する人材も不足している。日立はこの課題への答えとして、2025年11月に発表した「IWIM（Integrated World Infrastructure Model）」を位置付けている。IWIMは、物理法則に基づくモデルと、専門家のノウハウから作った知識モデルをAIエージェントが組み合わせて使う考え方で、日立は数百のモデルを持つとしている。\n【詳細】日立のラボで実際のGPUを使って行ったデータセンターの検証では、AIの計算と冷却の制御を統合することで、GPUが性能を落として動く時間が約10分から約30秒に短縮され、電力あたりのAI処理量は20%向上した。データセンターと電力網、通信網を連携させる「ワット・ビット連携」の取り組みも進めている。デモでは、豪雨で太陽光発電の出力が落ちた場面を想定し、電力網側とデータセンター側のエージェントが連携して、処理を別の拠点に移したり自家発電を使ったりして過負荷を解消してみせた。鮫島茂稔CTOは、個々のユースケースで完結させるのではなく、領域をまたいだ連携を可能にする点に価値があると語った。\n【ポイント・注意点】IWIMの事例の多くは検証や実証の段階にあり、現場で使われているものは一部にとどまる。記事によると、NVIDIAやGoogleも9月から、電力網の状況に合わせてデータセンターの電力使用を調整する取り組みを始めており、AIと電力インフラを一体で最適化する動きは広がりつつある。市場規模の数字は日立の見通しであり、実現には資源制約の解消が前提となる。","2026-11-24","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/24/2000003382/"],["Microsoft、自社AI「MAI」の新モデル7種を投入　コスト削減狙う","Microsoftは米国時間11月17日、年次イベント「Microsoft Ignite」で自社開発AI「MAI」ファミリーの新モデル7種を発表した。企業がAIエージェントを常時稼働させる中で、トークン消費とコストを抑えるのが狙いだ。セキュリティ、コーディング、画像生成、リアルタイム音声、医療向け文字起こし、意思決定などの用途をそろえ、WordやTeamsの裏側でもMAIのモデルが動いているという。","\n【概要】Microsoftは米国時間11月17日、年次イベント「Microsoft Ignite」で、自社開発AI「MAI（Microsoft AI）」ファミリーの新モデル7種を発表した。企業がAIエージェントを24時間動かす中で、トークン消費とコストを減らす狙いがある。\n【背景】Microsoftは外部のAIモデルを製品に組み込む一方、自社モデルの開発も急いでいる。第2世代のAIアクセラレーター「Maia 200」は既に本番環境で稼働しており、電力あたりに処理できるトークン数は1.7倍になったとしている。WordやExcel、PowerPoint、Teamsの裏側では、MAI Code 2 Flashをベースにした「MAI Work Flash」が動いている。\n【詳細】7種は、セキュリティ運用や脆弱性対応向けの「MAI Cyber 2 Flash」、企業のコーディング向けの「MAI Code 2」と軽量な「MAI Code 2 Flash」、画像の生成・編集向けの「MAI Image 2.7」とそのFlash版、1分あたり0.01ドルからのリアルタイム音声モデル「MAI Realtime 1」、MAI Transcribe 2を基にした医療向け文字起こし「Dragon Copilot Transcribe」、意思決定・ルーティング用で一般提供を始めた「Decision 1.1」だ。Microsoftによると、MAI Code 2はGPT-6.1 Solの98%の性能を40%のコストで実現し、GitHub Copilotで使える。MAI Image 2.7はArtificial Analysisの画像編集ベンチマークで首位となった。Decision 1.1はGPT-6.1 Solより50倍速く79倍安いとし、既に4000の顧客が使っているという。顧客の専用Azure環境に最先端モデルを展開する「MAI Licensed Weights」も近く提供する。\n【ポイント・注意点】ベンチマークの数字はいずれもMicrosoft自身の発表によるもので、一部は50%のプロモーション価格を前提にしている点に注意が必要だ。顧客事例として、Alaska Airlinesでは分類精度が81.2%から91.1%に上がったという。顧客データは同意なく学習に使わないとしている。","2026-11-24","TechTargetジャパン","https://techtarget.itmedia.co.jp/tt/article/2611/24/2000003366/"],["住友生命、ChatGPT導入でROI最大524%　金融の厳しい基準を突破","住友生命はChatGPT Enterpriseを導入し、週次の利用率は80%を超えた。従業員が申告した削減時間から算出した推定の平均ROIは203%で、月100回以上使う人では推定524%に達したという。2023年に生成AIの活用を始め、試行を経て2026年6月にEnterprise版へ移行した。独自のセキュリティ基準をOpenAIと確認したうえで導入しており、今後は数千人規模への展開を計画している。","\n【概要】住友生命保険は「ChatGPT Enterprise」を導入し、週次の利用率が80%を超えた。推定の平均ROI（投資利益率）は203%で、月に100回以上利用するユーザーでは推定524%に達したという。ITmediaの記事が、金融機関として厳格な基準をどう満たし、どう活用を広げたかを紹介している。\n【背景】住友生命は2023年に生成AIの活用を始め、当初はチャット形式の質疑応答に使っていた。複数の汎用ツールを比較した結果、Deep Researchの機能や、Word、PowerPoint、Excelとの連携を評価してChatGPTを選んだ。2025年には役員や企画部門など100〜150人がChatGPT Businessを試し、2026年6月にEnterprise版へ移行した。今後は数千人規模に広げる計画だ。セキュリティ面では、自社の基準に照らしてOpenAIと確認を行い、業務データが標準でモデルの学習に使われないこと、管理者がアクセスや機能を制御できることを確かめた。\n【詳細】企画部門は経営向けの提案書の下書きや国内外の事例調査に使い、ChatGPTの「プロジェクト」機能でチャットやファイル、指示をまとめて管理している。財務・経理部門は分析に、資産運用部門はリターンや価格リスクを分析する統計コードの作成に活用している。社長自らも試行段階から使い始め、経営会議や社内ポータルで利用を呼びかけた。ROIは利用頻度や使い方を調査し、従業員が申告した削減時間をもとに算出した。月8〜15回の利用では平均55%、16〜30回では231%、101回以上では524%と、使うほど効果が高まる結果となった。\n【ポイント・注意点】ROIは従業員の自己申告による削減時間に基づく推計である点に留意が必要だ。担当者は、従来の働き方のままではAIの効果に限界があるとし、より長期的な業務改革を進めるという。2026年度下期からは対象を広げ、AIに任せる業務、人と協働する業務、人が責任を持つ業務を整理する。引き受けや保険金支払いへの適用は長期的な検討課題としている。","2026-11-24","ITmedia キーマンズネット","https://kn.itmedia.co.jp/kn/article/2611/24/2000003335/"],["AIコーディングエージェント、自社コード活用は6割未満　調査で判明","ルーマニアのDesignVerseは、航空や銀行、防衛などの企業15社の大規模な既存コードベースでAIコーディングエージェントを検証した報告書を公表した。企業固有の文脈を与えない一般的な使い方では、エージェントが組織の承認済みコードを使ったのは55〜59%にとどまり、残りは部品を独自に作ったり公開部品で代用したりしていた。同社の文脈管理システムでは92%に上がったという。","\n【概要】ルーマニア・ブカレストの企業向けAIスタートアップDesignVerseは、AIコーディングエージェントを企業の既存コードベースで検証した「AI Coding Drift Report」を公表した。The Next Webによると、企業固有の文脈を与えない場合、エージェントが組織の承認済みコードを使ったのは10回に6回未満だった。\n【背景】検証対象は、航空、銀行、防衛、ソフトウェアサービス、コンサルティングの企業15社の非公開コードベースだ。いずれも15〜20年使われ、100万行以上のコードを約20人のエンジニアが保守しており、多くはAda、C++、COBOLで書かれている。こうした古い大規模システムでは、AIが既存の部品を使わずに新しいコードを作ると、エンジニアが手作業で直す必要が生じる。\n【詳細】報告書は、広く使われる2つのコーディングエージェントを「エージェントA」「エージェントB」として匿名化し、DesignVerse独自の文脈管理システムと比較した。2つのエージェントはリポジトリ全体にアクセスできるが独自ルールのない標準設定で動かした。社内部品を使った割合は、2つのエージェントが55〜59%だったのに対し、DesignVerseは92%。同じ課題を繰り返した際に同じ答えを出した割合は61〜69%に対し97%だった。文脈管理がない場合、エージェントは採用されたコード1トークンあたり中央値で10トークンを読み込んでいた。ある顧客の事例では、12カ月で作業が9人・9600時間から5人・4000時間に減り、浮いた時間は約88万2000ドルに相当すると試算した。\n【ポイント・注意点】15社はいずれもDesignVerseと取引中か導入を検討中の企業で、同社自身がこのシステムを販売している。アンドレイ・マノラケCEOも結果に利害があることを認めたうえで、手法は公開しており再現可能だと説明している。88万2000ドルという数字は1社の推計で、プラットフォームやライセンス、トークンのコストは含まれていない。結果を解釈する際には、こうした前提を踏まえる必要がある。","2026-11-24","The Next Web","https://thenextweb.com/news/designverse-ai-coding-drift-report-legacy-codebases"],["Thinking Machines「Inkling 2 Mini」、層を繰り返し省メモリ化","Thinking Machinesの「Inkling 2 Mini」は、ニューラルネットワークの同じ層で計算を繰り返すことで推論力を高めるモデルだ。24層のうち中間の12層をトークンごとに3回繰り返し、24層分の重みで48層分の計算を行う。モデル本体の容量は約20GBで、ネット接続のないMacBook上で飛行シミュレーターを作るデモも披露された。重みはApache 2.0ライセンスで公開されている。","\n【概要】AI専門メディアThe Neuronは、Thinking Machinesの「Inkling 2 Mini」が、同じ層で計算を繰り返す「ループ」構造によって少ないメモリで高い推論力を得ている仕組みを解説した。同社のスタッフが機内で、インターネットに接続していないMacBook上でこのモデルを使い、遊べる飛行シミュレーターを作らせたデモも紹介されている。\n【背景】高性能なAIモデルを手元のPCで動かすには、モデルの重みを保存するメモリが壁になる。Inkling 2 Miniは24層で構成され、中間の12層がトークンごとに3回計算を繰り返す。これにより、24層分の重みを保存するだけで48層分の計算を行える。Thinking Machinesによると、中間層を繰り返す方式は、最終層を繰り返す方式に28の評価のうち27で勝ったという。\n【詳細】パラメーター数は264億だが、Mixture of Experts方式を採用し、タスクに必要なエキスパートだけを動かす。学習の途中でエキスパートの3分の2を削除し、残りを再学習して性能を回復させた。さらに量子化で重みを小さな数値形式で保存し、モデル本体の容量を約20GBに抑えた。公式のモデルカードはApple Silicon搭載機で32GB以上のメモリを推奨しており、デモにはM5 Proチップと48GBメモリのMacBook Proが使われた。同社はコーディングのベンチマークDeepSWE v1.1で48.2%、Vals Index v2.2で46.5%を記録したとしている。第三者のArtificial Analysisの評価では、Qwen3.8-27Bと同等の指数を、およそ5分の1のアクティブパラメーターで達成し、1タスクあたりの平均コストは0.59ドルと、Qwen3.8-27Bの3.53ドルを下回った。\n【ポイント・注意点】結果は特定のベンチマークに基づくもので、あらゆるタスクで優れているわけではない。Thinking Machines自身も、複雑な指示や難しい推論問題に苦戦する場合があると認めている。ループを増やしても、学習していない知識が加わるわけではない。比較的高性能なPCが必要な点や、繰り返し計算に伴うコストにも留意が必要だ。","2026-11-24","The Neuron","https://www.theneuron.ai/news/thinking-machines-inkling-2-mini-looped-ai-memory/"],["アジア太平洋でAI導入拡大、投資効果の測定には課題　AWS調査","AWSの委託でStrand Partnersがアジア太平洋10市場の企業経営者9750人を調べたところ、AIを使う企業の58%が投資額をすでに回収したと答えた。一方、ROIを正確に測れると強く確信していたのは12%にとどまった。正式なAI戦略を持つ企業は19%で、戦略の有無によって導入の進み具合に大きな差が出た。AIやデジタルのスキル不足も48%が障壁に挙げている。","\n【概要】米CNBCによると、Amazon Web Services（AWS）の委託でStrand Partnersが実施した調査で、アジア太平洋地域でAIを使う企業の58%が、AIへの投資がすでに当初のコストを上回る成果を上げたと回答した。一方で、ROI（投資利益率）を正確に測定できると強く確信している企業は12%にとどまった。\n【背景】調査はオーストラリア、インドネシア、日本、マレーシア、ニュージーランド、フィリピン、シンガポール、韓国、タイ、ベトナムの10市場で、企業経営者9750人を対象に行われた。AWSのアジア太平洋・日本・中国担当バイスプレジデント、ハイメ・バイエス氏はCNBCの独占インタビューで、前年からの最大の変化は、AIプロジェクトを本番運用に移す企業が増えたことだと述べた。技術だけでは不十分で、技術、文化、スキル、個人の4つの準備が必要で、経営層がAIを使い、文化を築くことで意味のある成果が出るとも語った。\n【詳細】多くの企業はまだ導入の初期段階にある。AIを使う企業の64%は汎用の既製ツールに頼っており、正式で包括的なAI戦略を持つ企業は19%にすぎない。戦略を持つ企業では35%が最も進んだ導入段階に達していたのに対し、戦略のない企業では8%だった。AIやデジタルのスキル不足は48%が障壁に挙げた。導入率は10市場すべてで前年から上がり、オーストラリアが61%で首位、シンガポール59%、韓国58%と続いた。金融の事例として、ベトナムのテクコムバンクがAIで融資審査を行い、従来なら断られていた可能性のある申し込みも承認するなど、中小企業への与信を広げていることが紹介された。\n【ポイント・注意点】58%や12%という数字は、AWSが委託した単一の調査によるもので、記事では調査手法の詳細は示されていない。行政分野では、太平洋経済協力会議（PECC）の報告書で政府関係の回答者の約72%がAIで生産性が上がったと答えたほか、アジア開発銀行と韓国が途上国のAI導入を支援する2000万ドルの基金を設けたことも伝えている。","2026-11-23","CNBC","https://www.cnbc.com/2026/11/24/aws-asia-gains-roi.html"],["アマゾン、Decartの最適化技術を75億ドルで取得　Trainium外販へ","米Amazonは、イスラエルのAIスタートアップDecartの事業の主要部分を取得することで合意した。Bloombergによると取得額は75億ドル。AIモデルをNVIDIAやAmazon、Googleのハードウェア上で効率よく動かすソフトウェア「Decart Optimization Stack」の技術と、創業チームや研究者を迎え入れる。自社チップ「Trainium」の外部販売に向けた布石とみられる。","\n【概要】TechCrunchによると、米Amazonはイスラエルのスタートアップ、Decartの事業の主要部分を取得することで合意した。取得額はBloombergの報道によると75億ドル。AmazonはDecartの「Decart Optimization Stack（DOS）」の技術に加え、創業チームとAI研究者、エンジニアを迎え入れる。\n【背景】Decartは、リアルタイムで操作できる「ワールドモデル」で知られ、最近では「Oasis 3」を手がけたほか、AI動画生成ツールも提供してきた。DOSは、AIモデルをNVIDIA、Amazon、Googleのハードウェア上で効率よく動かすためのソフトウェアだ。Amazonはこれまで、独自開発のAIチップ「Trainium」を自社のデータセンターで使ってきたが、現在はNVIDIAの対抗として顧客への販売を準備している。記事は、これまでAIチップの事実上の標準だったNVIDIAに代わり、顧客がAmazonのチップで処理を動かしやすくなる可能性があると指摘している。\n【詳細】取引の詳細はAmazonのブログ投稿で明らかにされた。Amazonで基盤AIモデル、カスタムシリコン、量子コンピューティングを統括するピーター・デサンティス上級副社長は「AIのあらゆる飛躍は、1つ1つのチップからより多くを引き出すことから始まる」とコメントした。同氏は、計算効率が上がれば、学習や強化学習の質が上がり、推論は速くなり、顧客はより低コストのモデルを使えるようになると説明している。チップの性能だけでなく、その上で動くソフトウェアの最適化が競争力を左右するという認識がうかがえる。\n【ポイント・注意点】75億ドルという金額はBloombergの報道によるもので、両社から確認されたものではない。記事の執筆時点で、DecartとAmazonはコメントの求めにすぐには応じなかった。取引の完了時期や構造などの条件も明らかにされていない。AIチップ市場でNVIDIAの牙城を崩せるかは、ハードウェアだけでなくソフトウェア面の使いやすさにかかっており、今回の取得はその点を補う動きといえる。","2026-11-23","TechCrunch","https://techcrunch.com/2026/11/23/amazon-snaps-up-decarts-ai-optimization-tech-for-7-5b-as-it-prepares-to-sell-trainium-chips/"],["Google検索のAIモード、ドライブとウォレットに連携　個人化を強化","Googleは11月23日、検索の「AIモード」で使える「パーソナルインテリジェンス」を拡張し、Googleドライブ、Googleウォレット、Geminiアプリと連携できるようにすると発表した。既にGmailやカレンダー、フォトと連携しており、利用者のデータを踏まえたより個人的な回答を返す。連携は任意で、いつでもオン・オフできる。ウォレットの情報は読み取るだけで、お金を動かすことはできない。","\n【概要】TechCrunchによると、Googleは11月23日（月曜日）、検索の「AIモード」で使える「パーソナルインテリジェンス（Personal Intelligence）」を拡張し、Googleドライブ、Googleウォレット、Geminiアプリとの連携を加えると発表した。パーソナルインテリジェンスは既にGmail、Googleカレンダー、Googleフォトと連携しており、利用者のデジタル生活の情報をもとに、文脈に沿った個人的な回答を返す仕組みだ。\n【背景】記事は、Googleが自社のエコシステム内に既にある利用者データを活用しており、競合が簡単には追いつけない強みになっていると指摘する。一方で、ウォレットやドライブの中身をAIに見られたくない人もいるため、アプリの連携は任意とされ、パーソナルインテリジェンスはいつでもオン・オフを切り替えられる。\n【詳細】ウォレットと連携すると、資金計画の目標を管理したり、日々の支出を減らしたり、クレジットカードの特典を活用したりする手助けができるという。ただしAIモードが行えるのは口座情報の読み取りだけで、お金を移動したり管理したりすることはできない。ドライブについては、プロジェクトや大きな判断に必要な情報が複数の文書やスプレッドシートに分散していることが多いとし、連携すれば、例えば確定申告の時期に合わせた計画づくりなど、より関連性の高い回答に使えると説明している。GeminiアプリとAIモードの間で文脈を共有できるようになり、アプリを切り替えてもアイデアを一から説明し直す必要がなくなる。さらに、回答の下に新しい「パーソナライゼーション」アイコンを表示し、AIモードがどの情報を使ったのかを確認できるようにする予定だ。\n【ポイント・注意点】AIによる概要（AI Overviews）とAIモードでは、最近の検索の文脈に合わせた回答も増えるという。記事には「近く」以外の提供時期や、対象となる国やアカウントの情報は示されていない。個人データの活用は利便性を高める一方、プライバシーへの配慮が欠かせず、利用者は連携の設定内容を確認しておく必要がある。","2026-11-23","TechCrunch","https://techcrunch.com/2026/11/23/google-searchs-ai-mode-can-now-tap-into-drive-and-wallet-for-more-personalized-responses/"],["相場観をAIで投資に変えるSupertake、2000万ドル調達","利用者の市場に対する見立てをAIエージェントが投資ポートフォリオに変えるスタートアップのSupertakeが、2000万ドルのシード資金を調達した。Adjacentが主導し、Coinbase VenturesとUnion Square Venturesも参加した。自然言語で語った考えをAIと練り上げて投資可能な形にし、他の利用者も同じ投資に乗れる。現在はベータ版で、順番待ちリストを通じて提供している。","\n【概要】TechCrunchによると、AI投資スタートアップのSupertakeは、2000万ドルのシード資金を調達した。主導したのはAdjacentで、Coinbase VenturesとUnion Square Ventures（USV）も参加した。エンジェル投資家には、Meta Superintelligence Labsの製品責任者とされるナット・フリードマン氏や、VercelのCEOギレルモ・ラウチ氏らが名を連ねる。今回の調達は200万ドルのプレシードに続くものだ。\n【背景】Supertakeは、ポッドキャスト企業Anchorの共同創業者で、USVのゼネラルパートナーを務めるマイケル・ミニャーノ氏がUSV内で立ち上げた。同氏は創業者兼会長にとどまり、日々の運営は、いずれもCoinbaseでAIの製品・技術部門を率いたCEOのリンカーン・マー氏とCTOのジョン・ピーターソン氏が担う。\n【詳細】利用者は自分の考えを大まかな自然言語で説明し、AIとやりとりしながら投資可能な「テイク」にまとめる。アイデアはリーダーボードに並び、他の利用者も一緒に投資できる。記事では、外見やアンチエイジングへの関心の高まりを見込み、製薬や化粧品の銘柄を組み入れた例が紹介されている。現時点のポートフォリオは株式の個別銘柄のみだが、今後はパートナーを通じて空売りやデリバティブ、無期限先物、予測市場も加える計画だ。マー氏は、Supertakeは予測市場ではないと説明している。現在はCoinbaseとRobinhoodと連携しており、対応する証券会社を増やす予定だ。\n【ポイント・注意点】信頼性を確保するため、明示的な同意なしにAIが入出金できない仕組みや、取引規模の上限、異常のリアルタイム監視、利用者の証券口座の認証情報にアクセスしないことなどの安全策を設けている。製品はベータ版で、順番待ちリスト経由で提供中だ。創業者らが自らAIに運用を任せている金額は自己申告で、記事では企業評価額は明らかにされていない。","2026-11-23","TechCrunch","https://techcrunch.com/2026/11/23/supertake-raises-20m-to-let-ai-agents-turn-your-market-predictions-into-stock-portfolios/"],["Google DeepMind、AIエージェントで量子アルゴリズムを高速化","Google DeepMindは11月23日、「Gemini 4」を使ったエージェントのチームが、よく知られた量子アルゴリズムを改良し、より効率的な量子回路を見つけたと発表した。古典コンピューターでは検証できない回路の正しさは、定理証明系Leanで証明した。核融合のシミュレーションで計算コストを11.8分の1に減らすなどの成果を挙げ、Leanのライブラリなどをオープンソースで公開する。","\n【概要】Google DeepMindは11月23日、公式ブログで、「Gemini 4」を基盤とするエージェントのチームが既存の量子アルゴリズムを改良し、より効率的な量子回路を生み出したと発表した。成果は論文としてarXivに公開され、Google Quantum AIとの共同研究として行われた。\n【背景】量子コンピューターは近く古典的なスーパーコンピューターを超える問題を解けるようになる可能性があるが、重要な応用の中には、初期の量子ハードウェアで賄える以上の資源を必要とするものがある。また、こうした回路は古典コンピューターでも現在の小規模な量子プロセッサーでも試せない。そこで研究チームは、エージェントが見つけた結果をすべて定理証明系「Lean」で形式的に証明する方式をとった。\n【詳細】問題ごとに独立した複数のエージェントチームが改良案を探し、Leanで検証されたアイデアだけを共有ノートに追加した。4時間ごとに各チームのエージェントが仮想会議に集まり、アイデアを交換・議論した。人間は研究の方向性を決め、進行を監督した。成果として、レーザー核融合（慣性閉じ込め核融合）の重要な性質を求める回路で計算コストを11.8分の1にし、必要な誤り訂正済み量子ビットを5650個から4338個に減らした。医薬品の多くを分解する酵素シトクロムP450のシミュレーションでは2.5倍の改善を得て、量子ビットを481個から333個に減らした。Groverのアルゴリズムの特定の実装で2.57倍、多くのアルゴリズムで使われるarcsinの処理では290倍の高速化を達成した。\n【ポイント・注意点】研究チームは、改善は大きいものの、これらのアルゴリズムを科学シミュレーションで実行するには、最初の誤り訂正量子コンピューターが提供できる以上の計算資源がなお必要だと認めている。DeepMindはLeanのライブラリ、問題の定義、検証済みの解をGitHubで公開する。手法はクリーンエネルギーや創薬に限らず、量子計算研究の他の分野も加速し得るとしている。","2026-11-23","Google DeepMind","https://deepmind.google/blog/finding-faster-quantum-algorithms-with-agents-and-formal-verification/"],["AWS「Strands Decider v2」公開　1つの細部で変わる判断に強く","Amazonは、選択肢の中から答えを選ぶ「意思決定モデル」の新版「Strands Decider v2」5種を公開した。GoogleのGemma 4を基にしたオープンウェイトのモデルで、Apache 2.0ライセンスで提供し、最大310億パラメーター。入力を双方向に読むことで、長い会話の中の1つの細部が判断を左右する難しいケースに強くなった。AWSは社内での大幅なコスト削減事例も示した。","\n【概要】VentureBeatによると、Amazonは意思決定モデル「Strands Decider v2」の5つのモデルを公開した。GoogleのGemma 4を基にしたオープンウェイトのモデル群で、Apache 2.0ライセンスで提供され、規模は最大310億パラメーター。意思決定モデルは、開発者が用意した選択肢から答えを選び、各選択肢の確率を返す。1つの質問に最大255の選択肢を設定できる。\n【背景】意思決定モデルは新しいカテゴリーで、Hugging FaceのDecision Index 0.4.1には300以上のモデルが登録されている。初代Strands Deciderは10月1日に登場した。競合では、OpenAIのDecisions APIが10月22日に一般提供を開始し、Googleの「Gemini Decision 1」が11月11日に登場、Microsoftも前週に「Microsoft-Decision 1.1」を出した。AWSの特徴は、モデルをダウンロードし、自社の環境で微調整して動かせる点にある。\n【詳細】AWSのノナト・デ・パウラ氏によると、利用者からは、長い会話の中の1つの細部で判断が変わる難しいケースで、より良い答えを求める声があった。左から右へ読むモデルでは、前半の細部を読む時点で後半の文を参照できない。v2は状況全体を双方向に読み、その共有表現から各質問の選択肢を採点する。AWSによると、最大のv2モデルはDecision Index 0.3で71.5（v1は48.8）、1つの決定的な細部だけが異なるペアで作ったベンチマークDecisionPivotでは84.3（同23.2）を記録した。社内のチケット分類テストでは、Claude Sonnet 4.6をv1モデルに置き換え、1回の処理時間が4215ミリ秒から897ミリ秒に、100万チケットあたりの分類コストが約2万2200ドルから約500ドルに下がったという。\n【ポイント・注意点】数値はいずれもAWSの提供で、独立した検証はされていない。ベンチマーク比較も、v2の31Bモデルとv1のより小さい26B-A4Bモデルを比べたものだ。デ・パウラ氏は、自社の実際のデータ数百件で試し、差がある部分だけ微調整し、誤りの代償が大きい場面ではほかのチェックと組み合わせて使うよう勧めている。","2026-11-23","VentureBeat","https://venturebeat.com/data/awss-strands-decider-v2-targets-the-agent-decisions-that-hinge-on-a-single-detail"],["AMD、AIチップ新興Taalasを約29億ドルで買収　推論技術を強化","米AMDは、AIモデルを直接シリコンに組み込む専用チップを開発するスタートアップTaalasを約29億ドルで買収した。Taalasは2023年にトロントで、Tenstorrentの共同創業者でもあるリュビシャ・バイッチ氏らが設立した。最初のデモチップはMetaのLlama 3.1 8B向けで、ユーザーあたり毎秒約1万7000トークンを出すとされる。AMDは同社のAIアクセラレーターの計画に組み込む。","\n【概要】欧州のテックメディアTech.euによると、米AMDはAIチップのスタートアップTaalasを、約29億ドル規模の取引で買収した。Taalasは汎用GPUに頼るのではなく、AIモデルを直接シリコンに組み込む専用チップを開発している。AMDはこの技術を、自社のAIアクセラレーター「Instinct」のロードマップに取り込む計画だ。\n【背景】Taalasは2023年、セルビア出身のエンジニア、リュビシャ・バイッチ氏が、レイラ・バイッチ氏、ドラゴ・イグニャトビッチ氏とともにカナダのトロントで設立した。Quiet Capital、Lamond Ventures、Fidelity、ベオグラードのFifth Quarter Ventures（5QV）などから約2億2000万ドルを調達していた。バイッチ氏にとっては2社目のユニコーンで、同氏は以前、評価額62億ドルのAIチップ企業Tenstorrentを共同で創業している。\n【詳細】Taalasの最初のデモ用チップはMetaの「Llama 3.1 8B」向けに作られ、ユーザーあたり毎秒約1万7000トークンを出せると伝えられている。記事は、今回の取引がAIハードウェア分野における欧州のエンジニア人材とベンチャーキャピタルの存在感の高まりを示していると指摘する。5QVのゼネラルパートナー、ティホミール・バイッチ氏は、AIで最も重要な仕事の一部はモデルの下のチップやシステムで起きているとし、ファンド設立当初はベオグラードからAI計算に賭けることは難解に聞こえたが、今では正しい判断だったと証明されたと述べた。欧州はAIハードウェア競争を傍観する必要はないとも語っている。5QVは1号ファンドを通じてTaalasに出資しており、アドリア海地域やその出身者によるディープテックやAIの起業家を支援している。\n【ポイント・注意点】記事では、買収の完了時期や取引の構造、規制当局の審査状況は示されていない。29億ドルという金額は「約」とされ、毎秒1万7000トークンという性能も出典や測定方法が明示されておらず、記事が独自に検証したものではない。推論特化チップの実力は、今後の製品化で確かめる必要がある。","2026-11-23","Tech.eu","https://tech.eu/2026/11/23/amd-acquires-ai-chip-startup-taalas-for-29b-to-advance-ai-inference-technology/"],["国連事務総長、AI安全の国際枠組み協議を呼びかけ　権力移転に警鐘","国連のグテーレス事務総長は11月23日、国連とバルバドスが共催したAI安全特別サミットの閉幕にあたり、AIのリスク管理に関する多国間枠組みの協議を始めるよう加盟国に呼びかけた。AIは「人類史上最大の権力移転」をもたらしていると警告した。「ブリッジタウン行動呼びかけ」は、独立した信頼できる監督を伴う枠組みを1年以内に策定するよう求め、グローバルサウスへの支援も促している。","\n【概要】国連ニュースによると、アントニオ・グテーレス国連事務総長は11月23日、加盟国に対し、AIのリスクを管理する多国間の枠組みについて協議を始めるよう呼びかけた。同氏は、AIが「人類史上最大の権力移転」を引き起こしていると警告した。呼びかけは、国連とバルバドスが共催した「AI安全に関するブリッジタウン特別サミット」の閉幕に合わせて出された。\n【背景】グテーレス氏は、AIへの保護策はばらばらで、各国政府は後追いになっていると指摘した。最近のシステム障害やサイバー攻撃が脆弱性を浮き彫りにしたほか、AIが開発者さえ予想しない振る舞いをすることがあると述べた。権力は国家や統治機関から少数の企業や個人へと移りつつあり、国連を含む第二次大戦後の国際機関は十分に対応できていないとして、グローバルガバナンスの抜本改革を求めた。同氏は12月末で任期を終える。\n【詳細】「ブリッジタウン行動呼びかけ」は、独立した信頼できる監督を伴う、包括的で原則に基づくAIリスク管理の多国間枠組みを1年以内に策定するよう加盟国に求める。枠組みには、共通の安全対策、共通の試験手法、明確な保護策と基準、基本的な透明性要件、先進モデルの独立評価、すべての国が実施できるための支援を盛り込む。各国政府や民間、金融機関、援助国には、グローバルサウスでのAI能力構築への投資と、提案中の「AI能力構築グローバル基金」への拠出を促した。グテーレス氏は、AIを兵器化する能力が2つの国と限られた企業に集中しているとし、自律型兵器の禁止を改めて支持した。\n【ポイント・注意点】バルバドスのモトリー首相は、小国は自らに影響するルールづくりで発言力を持たないことが多いと訴えた。マクロン仏大統領はビデオメッセージで、AIの安全に関する「パリ・コール」に18の首脳と11のAIリーダーが署名したと述べた。一方、記事ではグローバル基金の資金規模は示されておらず、枠組みの実効性は今後の加盟国の協議にかかっている。グテーレス氏はAIの進化が安全を管理する能力を上回ってはならないとも訴えた。","2026-11-23","UN News","https://news.un.org/en/story/2026/11/1168861"],["中国のAI競争、ロボットからスマートフォンへ拡大　CNBC報告","米CNBCのニュースレター「The China Connection」は、中国のAI競争がヒト型ロボットからスマートフォンへと広がっている様子を伝えた。ヒト型ロボットのLimXは、人が動かした家庭用品を元の場所に戻すデモを披露。スマホ大手Honorの担当者は、AIはまだ大衆向けの主要な購入動機ではないと語った。メモリ価格の高騰がAI端末普及の制約になっていることも指摘している。","\n【概要】米CNBCのニュースレター「The China Connection」は11月23日、中国のAI競争がロボットからスマートフォンへと広がっている現状を伝えた。執筆したエブリン・チェン記者は、深圳で開かれたAPECの会合から北京に戻ったばかりで、ヒト型ロボットメーカーやスマホメーカーへの取材内容を紹介している。\n【背景】中国では、ヒト型ロボットやAI搭載端末の開発競争が激しくなっている。ロボットメーカーLimXのジェシー・リウCFOは、APECのCEOサミットでの議論から、大規模言語モデルをクラウドではなく機体上で動かせるロボット用チップへの需要が高まっていると語った。ロボットの生産台数は数百台から数千台、数万台へと増え、いずれは自動車並みの規模になるとの見通しも示した。\n【詳細】LimXのロボットは、人が動かした家庭用品をすばやく見つけ、決められた場所に戻すデモを披露した。チェン記者は、夏に見た以前の機体より動きが滑らかになったが、完璧にはほど遠いと評している。LimXはスイスを含む30以上の市場でパートナーと組み、スイスでは発電所の点検にロボットが使われている。スマホでは、HonorのAI製品担当トーマス・バイ氏が、AIは大衆向けの利用者にとってまだ上位3つの購入動機に入っていないと述べた。同氏は、より高性能なモデルを動かせるチップによって、コーヒーの注文などを代行する「スーパーエージェント」が使いやすくなると期待する。Counterpointのアナリストによると、生成AIスマホの普及率は中国で55%、海外で38%に達しているが、機能はまだ必須とはいえない。\n【ポイント・注意点】制約となっているのがメモリ不足だ。メモリコストの上昇でAI端末を大衆向けに作るのが難しくなっており、自動車関連企業EcarXのディラン・ジェンCFOは、メモリ価格の上昇が2027年を通じて2028年前半まで続くとみている。Counterpointは、小売分野のエッジAIの売上高が2032年までに6倍に伸び、その約半分を小売用ロボットが占めると予測している。","2026-11-23","CNBC","https://www.cnbc.com/2026/11/23/cnbcs-the-china-connection-newsletter-ai-race-spreads-to-smartphones.html"],["アント・グループ、医療特化の560B MoEモデルをオープン公開","中国アント・グループのAnt Lingチームは11月22日、医療向けの大規模言語モデル「LingSante-3.1-flash」をMITライセンスでHugging Faceに公開した。総パラメーター数は5600億、トークンごとに使うのは250億で、100万トークンの文脈を扱える。自社評価ではGPT-6 Astraなどを上回るとするが、数値は自社の評価環境によるもので、第三者評価のスコアは23.3%だった。","\n【概要】AI Weeklyによると、中国アント・グループのAnt Lingチームは11月22日、医療に特化した大規模言語モデル「LingSante-3.1-flash」をHugging Faceで公開した。ライセンスはMITで、総パラメーター数は5600億、1トークンあたりに使うアクティブパラメーターは250億のMixture of Experts（MoE）モデル。100万トークンの文脈を扱える。\n【背景】Artificial Analysisの掲載情報によると、このモデルはテキストのみに対応し、拡張推論の機能を持つ。InclusionAIの組織名で、FP8形式のオリジナル版とMXFP4の量子化版が公開された。アント・グループは健康アプリ「Afu」を運営しており、記事は1日2000万件の相談を扱っていると伝えている。医療分野で蓄積したサービス基盤を背景に、オープンウェイトのモデルを広く提供する形だ。\n【詳細】アントが公表したスコアは、HealthBench Professionalで65.72、ツールを使うHLEで72.22、BrowseCompで94.10。これらのテストでGPT-6 Astra、Claude Opus 5.5、Gemini 4 Argonを上回ったと伝えられている。ただし、記事によるとこれらの数値はすべてアント自身の評価環境で測定したものだ。記事が引用する唯一の独立した評価は、Artificial AnalysisのMLCR-AAという、非公開文書をもとに長い文脈で医療推論を行う能力を測る試験で、スコアは23.3%だった。記事はこれが別の、より難しいベンチマークだと注記している。\n【ポイント・注意点】モデルカードには、出力が不完全または不正確な場合があり、専門家による医療アドバイスの代わりにしてはならないと明記されている。診療科や画像の品質、言語、患者集団によって結果が変わる可能性もある。軽量な関連モデル「air-VL」でも、運用には141GBのGPUが4基必要とされ、多くの病院のIT部門にとって自前での導入は難しいと記事は指摘する。性能の数字は自社評価が中心であり、実際の医療現場での有用性は第三者による検証を待つ必要がある。","2026-11-23","AI Weekly","https://aiweekly.co/alerts/ant-open-sources-lingsante-31-flash-a-560b-medical-moe"]],"gh-pop":[["Chrome公式「DevTools MCP」v1.14.0、背景タブや通信モック対応","Chrome DevToolsチームが公開する「chrome-devtools-mcp」が、11月24日にv1.14.0を公開した。AIコーディングエージェントに実際のChromeを操作・調査させるMCPサーバー兼CLIで、スターは5.9万。GitHub Trendingの週間ランキングでは1週間に1,581スター増えた。新版では新しいタブを背景で開くオプションや通信のモック、Service Workerの通信取得、透過スクリーンショットなどが加わった。","\n【概要】Chrome DevToolsチームのリポジトリ「ChromeDevTools/chrome-devtools-mcp」が、2026年11月24日にv1.14.0をリリースした。説明文は「Chrome DevTools for coding agents」。コーディングエージェントが動いているChromeブラウザーを操作し、中身を調べられるようにするツールで、MCPサーバーと「chrome-devtools」CLIの2つの形で提供される。スターは5.9万、フォークは4.9千。GitHub Trendingの週間ランキングに入り、1週間で1,581スターを集めた。\n【背景】READMEは主な機能として3つを挙げる。DevToolsのトレースを使った性能分析、ネットワーク要求やコンソールなどを使うデバッグ、そしてPuppeteerを土台にした自動待機付きのブラウザー操作だ。導入はMCPクライアントの設定で「npx -y chrome-devtools-mcp@latest」を実行させるだけで、CLIはnpmでインストールできる。Claude Code向けなどのプラグインやスキルも同梱されている。\n【詳細】v1.14.0では、新しく開いたタブを背景のままにする「--backgroundNewPages」、通信を止めたり特定のオリジンを許可したりするネットワークモック、Service Workerからのネットワーク要求の取得が追加された。コンソールの取得はService Workerにも対応し、CSSの取得では計算済みのスタイルを返せるようになった。透過スクリーンショットにも対応し、ツールの実行中に起きたページのエラーも一覧で示される。WSL2環境でのURIの扱いやCLIの引数処理なども直された。起動を速くする改修も入っている。\n【ポイント・注意点】公式にサポートされるのはGoogle ChromeとChrome for Testingだけで、ほかのChromium系ブラウザーは動作の保証がない。利用統計の送信は初期状態で有効で、「--no-usage-statistics」で止められる。性能ツールはトレースのURLをCrUX APIに送るため、避けたい場合は「--no-performance-crux」を指定する。","2026-11-24","GitHub（ChromeDevTools/chrome-devtools-mcp）","https://github.com/ChromeDevTools/chrome-devtools-mcp/releases/tag/chrome-devtools-mcp-v1.14.0"],["「skillshare」AIツールのスキル設定を一括同期、v0.31.0","複数のAIコーディングツールに、スキルやエージェント、MCP、プラグインの設定を1つのコマンドで配る「skillshare」が、11月24日にv0.31.0を公開した。Go製の単一バイナリーで、Claude CodeやCodex、OpenCodeなどに対応する。GitHub TrendingのGo部門の週間ランキングに入り、スターは3.3千。新版では、MCPサーバーを一度だけ定義し、必要なプロジェクトだけで読み込めるようにした。","\n【概要】「runkids/skillshare」は、AIコーディングツールで使うスキル、エージェント、MCP接続、プラグインなどをまとめて同期するツールだ。説明文は「Sync skills, agents, MCP, plugins to all AI CLI tools with one command and simplify team sharing」。2026年11月24日にv0.31.0がリリースされた。スターは3.3千、フォークは378で、GitHub TrendingのGo言語部門の週間ランキングに名を連ねた。\n【背景】AIコーディングツールが増えると、同じスキルや設定をツールごとに置き直す手間が生まれる。skillshareは元になるフォルダーを1か所に持ち、そこからClaude Code、Codex、Pi、OpenCodeなどへ配る。macOSとLinuxではシンボリックリンク、WindowsではNTFSジャンクションでつなぐ仕組みだ。READMEによると、Node.jsやnpmに頼らないGo製の単一バイナリーで、インストールはmacOS・Linux向けのシェルスクリプト、Windows向けのPowerShellコマンド、Homebrew、Nixから選べる。\n【詳細】主な機能は、Gitホストからのスキルの導入と更新、組み込みのセキュリティー監査、全ツールへの一括同期、MCPとフックの設定、プラグインの導入、Webダッシュボード、デスクトップアプリなど。GitHub Actions向けのアクションも用意されている。v0.31.0の目玉は、MCPサーバーを「global: false」で一度だけ定義し、「use」に挙げたプロジェクトだけで読み込めるようにした点だ。ダッシュボードではスキルやエージェントのバージョンがタグとして表示される。無視ルールの各コマンドは、どのルールがスキルの状態を決めたかを示すようになり。監査が、コード例の中の小文字の「root:」を理由にスキルを止めてしまう問題も解消された。\n【ポイント・注意点】Windowsでファイル単位のシンボリックリンクを作るには開発者モードが必要で、使えない場合はコピーになる。チームで設定を共有する場面や、複数のエージェントを使い分ける開発者に向く。","2026-11-24","GitHub（runkids/skillshare）","https://github.com/runkids/skillshare/releases/tag/v0.31.0"],["「magpie」各エージェントのモデルをメニューバーで切り替え","Claude CodeをKimiで、CodexをDeepSeekで動かすといった組み合わせを、メニューバーから切り替えられる「magpie」が、11月24日にv0.1.4759を公開した。手元に1つのゲートウェイを立て、多くのコーディングエージェントに別の会社のモデルを使わせる。スターは4万超で、GitHub Trendingの月間ランキングに入っている。モデルの振り分けや利用量の記録、契約アカウント間の切り替えにも対応する。","\n【概要】「yetone/magpie」は、AIコーディングエージェントが使うモデルを1か所で管理するツールだ。説明文は「Every agent's model. One place. Codex on DeepSeek, Claude Code on Kimi, from the menu bar.」。2026年11月24日にv0.1.4759がリリースされた。スターは4.09万、フォークは3.7千で、GitHub Trendingの月間ランキングに入っている。\n【背景】コーディングエージェントは、それぞれ決まった会社のモデルを前提に作られていることが多い。magpieは手元の127.0.0.1:3425に1つのゲートウェイを立て、Claude Code、Codex、Gemini CLI、OpenCodeなど多くのエージェントから、別の会社のモデルを呼べるようにする。メニューバーのアプリのほか、ウィンドウ、TUI、Web UI、CLIの形でも使える。\n【詳細】各エージェント自身の設定ファイルを書き換えて、モデルを差し替えられる。複数のモデルをグループにまとめ、smart、order、rotate、usage、paceといった方式で振り分けることもできる。契約アカウントの利用枠が尽きたときに別のアカウントへ切り替える機能、プロファイル、利用量と費用の記録、Bunで動くプラグインもある。送る内容の一部を伏せるプライバシー用のマスキング機能は任意で、初期状態では無効。使う場合のローカルモデルは1.6GBのダウンロードになると説明されている。導入は公式サイトからのダウンロード、インストールスクリプト、「go install」、Dockerイメージから選べ、macOS、Windows、Linux、Termuxで動く。v0.1.4759の変更点は1つで、種類を選んだときに今週のおすすめが保たれ、バーが上まで滑らかにスクロールするようになった。導入済みのアプリは自動で更新される。\n【ポイント・注意点】テレメトリーとして1日1回の匿名の送信があり、「DO_NOT_TRACK=1」で止められる。READMEによると、このリポジトリはプルリクエストを受け付けておらず、作れるのはメンテナーだけだ。各モデルの提供元の利用規約や契約条件は、使う側で確認する必要がある。","2026-11-24","GitHub（yetone/magpie）","https://github.com/yetone/magpie/releases/tag/v0.1.4759"],["アリババの「Open Code Review」週3千スター、v1.14.3公開","アリババが公開するAIコードレビューツール「Open Code Review」が、11月24日にv1.14.3を公開した。決まった処理の流れとLLMエージェントを組み合わせ、行単位のレビューコメントを出す。社内のレビュー支援ツールが元になっており、スターは5.6万。GitHub Trendingの週間ランキングで1週間に3,015スター増えた。新版は不正な正規表現への対応やドキュメントの追加などを含む小さな修正版だ。","\n【概要】「alibaba/open-code-review」は、Gitの差分を読み取ってLLMに渡し、構造化されたレビューコメントを返すAIコードレビュー用のCLI「ocr」だ。2026年11月24日にv1.14.3がリリースされた。スターは5.6万、フォークは4.6千。GitHub Trendingの週間ランキングに入り、1週間で3,015スターを集めた。\n【背景】READMEによると、もとはアリババ社内のレビュー支援ツールで、数万人の開発者が使い、数百万件の欠陥を見つけてきたという。設計の特徴は、決まった処理と動的な判断の使い分けにある。対象ファイルの選択や束ね方、ルールの照合、コメント位置の調整は決まった処理で行い、中身の判断をエージェントに任せる。NPE、スレッド安全性、XSS、SQLインジェクションなどの多言語のルールを内蔵し、OpenAIとAnthropicのAPIに対応する。\n【詳細】READMEでは、50の公開リポジトリ、200件のプルリクエスト、10の言語、注釈付きの1,505件の問題からなるAACR-Benchでの比較を示している。同じモデルを使ったClaude Codeよりも適合率とF1値が高く、トークンは約9分の1で済んだ一方、再現率は低かったという。導入はnpmで、Git 2.41以降が必要。自分で設定したモデルを使うモードと、エージェント側のモデルを借りてAPIキーなしで動くモードがある。「ocr review --from main」で差分を、「ocr scan」でファイルやフォルダー全体を調べられる。スキルとしてClaude Code、Codex、Cursorなどから呼べ、GitHub ActionsやGitLab CIにも組み込める。v1.14.3は小さな修正版で、コード検索に不正な正規表現が渡されたときにモデル向けのエラーを返すようにし、OpenTelemetryをv1.47.0に上げた。ドキュメントではpull_request_targetの許可方法を追記し、フランス語版のREADMEを加えた。\n【ポイント・注意点】ベンチマークは開発元自身による比較で、再現率では劣るという結果も併記されている。導入するときは、自社のコードや規模で効果を確かめたい。","2026-11-24","GitHub（alibaba/open-code-review）","https://github.com/alibaba/open-code-review/releases/tag/v1.14.3"],["「FreeVideo」VRAM8GBで動画生成AIを手元で動かす","動画生成モデル「MiniMax H3」を家庭用のGPUで動かす推論エンジン「FreeVideo」が、11月24日にv0.6.10を公開した。VRAM8GB、メモリー16GBから動かせるとし、手持ちの機材に合わせて精度や処理の方法を自動で選ぶ。ComfyUIのプラグインとして動き、Windows、macOS、Linux向けの配布物がある。GitHub TrendingのPython部門のデイリーランキングに入り、スターは4.9千。","\n【概要】「FlashML-org/FreeVideo」は、動画生成モデル「MiniMax H3」を手元のパソコンで動かすための推論エンジンだ。説明文は「Make videos on the computer you already own.」で、最小でVRAM8GB、メモリー16GBで動くとうたう。2026年11月24日にv0.6.10がリリースされた。スターは4.9千、フォークは681で、GitHub TrendingのPython部門のデイリーランキングに入った。\n【背景】READMEによると、OpenVDNの8ステップ版モデル「VDN-H3」と、Video DeltaNetのハイブリッドアテンションを土台にしている。VRAM、メインメモリー、ディスクを連携させ、重みの形式や精度、アテンションの計算方法をハードウェアに合わせて選ぶ。GeForce RTX 30／40／50などのAmpere世代以降ではint8、新しいワークステーション・データセンター向けのGPUではFP8を使う。メモリーが少ない環境向けには、重みを少しずつ読み込む方式や先読み、分割した計算を組み合わせる。\n【詳細】ComfyUIのプラグインとして動き、Windows、macOS、Linux用の起動ツールがある。テキストの指示に加え、最初と最後のフレームや、画像・動画・音声を参考素材として渡せる。WindowsはFreeVideo.exe、macOSはApple silicon向けのDMG、LinuxはAppImageで配布され、git cloneでも導入できる。macOS版はプレビューの扱いで、24GBメモリーのM5搭載Macで試したとしている。主な対象は計算能力8.0以上のNVIDIA製GPUだ。v0.6.10は修正版で、プリセットを開いた後の生成の不具合が直り、設定の変更が必要な場合は理由が横に表示されるようになった。「Preview first」は処理のステップ数に従うようになった。更新の失敗報告には更新ログの末尾が入るようになった。\n【ポイント・注意点】コードはApache 2.0だが、モデルの重みはMiniMax H3 Community Licenseで、地域や用途に制限がある。生成した動画を商用で使う場合などは、モデル側の条件を確認する必要がある。","2026-11-24","GitHub（FlashML-org/FreeVideo）","https://github.com/FlashML-org/FreeVideo/releases/tag/v0.6.10"],["「AutoClip」長い動画をAIで短尺に、配信録画にも対応","ポッドキャストや講座などの長い動画から見どころを選び、字幕やカバー画像付きの短い動画に切り出すデスクトップツール「AutoClip」が、11月24日にv1.6.0を公開した。新版ではOBSやTwitch、YouTubeなど6種類の配信録画に対応し、画面の言語も13に増えた。GitHub Trendingのデイリーランキングで1日に981スター増え、スターは1.5万に達している。","\n【概要】「zhouxiaoka/autoclip」は、リンク1つで長い動画から短い動画を作るオープンソースのAI動画編集ツールだ。ポッドキャスト、インタビュー、講演、講座、ゲーム配信の録画などから見どころを探し、話者を追い、字幕を焼き込み、カバー画像を作って、TikTok、Shorts、Reels、抖音、小紅書、Bilibili向けに書き出す。2026年11月24日にv1.6.0がリリースされた。スターは1.5万、フォークは2.3千。GitHub Trendingのデイリーランキングで1日に981スターを集めた。\n【背景】切り出しや書き出しは利用者のパソコン上で行う。LLMは自分のAPIキーを使うか、OllamaやLM StudioとWhisper、SenseVoiceを組み合わせてオフラインでも動かせる。Apple silicon搭載MacでのREADMEの計測では、1時間43分の動画から10本を作るのに7.5分、LLMの費用は0.09元。2時間52分の動画では29.5分、0.20元だった。費用はqwen-plusを使った場合の見積もりとしている。\n【詳細】v1.6.0では、OBS Studio、Twitch、YouTube、Kick、Discord、手元の録画という6種類の配信録画を扱えるようになった。TwitchとYouTubeのチャンネルを一覧して選ぶ機能や、ゲームの見せ場の抽出も改良された。画面の言語は8から13に増えた。CometAPI、Novita AI、PoYo AIの各サービスにも対応し、GeminiのREST APIを直接呼ぶ経路も加わった。Windowsで、英数字以外を含むインストール先で起きていた問題も直された。デスクトップ版はApple silicon向けのdmgと、Windows 10／11向けのインストーラーで配布される。CLIやMCPとして使う方法や、Dockerで自前のサーバーに置く方法もある。\n【ポイント・注意点】配布ファイルには署名や公証がなく、リリースページはSHA-256による確認の手順を示している。Intel MacとLinuxにはデスクトップ版がなく、Dockerで使うことになる。字幕のない動画を初めて処理するときは、約220MBの文字起こし用の部品がダウンロードされる。ライセンスはMITだ。","2026-11-24","GitHub（zhouxiaoka/autoclip）","https://github.com/zhouxiaoka/autoclip/releases/tag/v1.6.0"],["「OpenSRE」CIの失敗原因を突き止め修正案まで出すAI","失敗したCIの実行結果を読み、原因をたどって修正をレビュー用に送るオープンソースのエージェント「OpenSRE」が、11月24日に新版を公開した。本番環境の障害調査にも使え、LLMや監視、インフラなど60を超えるツールとつながる。GitHub Trendingのデイリーランキングで1日に408スター増え、スターは1.5万。READMEは現状を公開アルファ版としている。","\n【概要】「Tracer-Cloud/opensre」は「The open-source agent for CI/CD reliability.」をうたう、自分の環境で動かすCLIエージェントだ。2026年11月24日に「OpenSRE 0.1.2026.11.24」がリリースされた。スターは1.5万、フォークは2.0千。GitHub Trendingのデイリーランキングで1日に408スターを集めた。\n【背景】CIが失敗したとき、原因がCIの側にあるのかコードの側にあるのかを見分けるだけでも手間がかかる。OpenSREは失敗したCIの実行を読み、考えられる原因をたどり、修正をレビュー用に送る。本番環境の障害を調べる用途も想定している。READMEによると、LLMの提供元、監視、インフラ、データベース、データ基盤、開発ツール、障害管理、連絡ツールなど、60を超えるツールとつながる。\n【詳細】主な機能は、CIが原因の失敗とコードが原因の失敗の切り分けと、CIの失敗率や失われた開発時間、mainブランチが失敗のままだった時間といったコスト指標の報告だ。対話型のシェルに加え、「opensre ask」で画面なしに質問でき、PythonのAPIも用意されている。導入はmacOSとLinuxならcurlのワンライナー、WindowsならPowerShellのコマンドで、sudoは要らない。置き場所は、公式のクラウド版、AWS EC2のAMI、自前のコンテナの3通りから選べる。今回のリリースは前日の版からの差分で、標準のホスト型モデルを「GPT-6.2 Sol」に変えたほか、ツールの引数やコマンドの経路を固める対策、コンテキストの量を削るループの修正、テスト内のコードスキャン警告の解消、mainブランチのCIの修正が入った。日付をそのまま版番号にしており、ほぼ毎日新しい版が出ている。\n【ポイント・注意点】READMEは現状を「Public Alpha」としている。テレメトリーは初期状態で有効で、「OPENSRE_NO_TELEMETRY=1」で止められる。リリースページではWindowsの利用者にWSLを使うよう案内しており、READMEのPowerShellでの手順と記述が食い違っている点にも注意したい。","2026-11-24","GitHub（Tracer-Cloud/opensre）","https://github.com/Tracer-Cloud/opensre/releases/tag/v0.1.2026.11.24"],["「ffmpeg-skill」AIエージェントに42の動画編集ツール","Claude CodeやCursor、Codexに、FFmpegを使った42の動画編集ツールを渡すエージェント用スキル「ffmpeg-skill」が、11月23日にv4.7.1を公開した。カット、字幕、縦横比の変換、音量の調整、各SNS向けの書き出しを手元で行い、クラウドやAPIキーは要らない。GitHub Trendingの週間ランキングで1週間に3,891スター増え、スターは1万を超えた。","\n【概要】「kajisho5/ffmpeg-skill」は、コーディングエージェント向けのローカルの動画編集ツール集だ。説明文は「Local video editor for coding agents」で始まり、FFmpegを使う42のツールを、機械が読める仕様とMCPサーバー付きで提供するとうたう。2026年11月23日にv4.7.1がリリースされた。スターは1.05万、フォークは911。GitHub Trendingの週間ランキングに入り、1週間で3,891スターを集めた。\n【背景】動画編集をAIに任せようとすると、FFmpegの複雑なフィルター指定をエージェントが直接書くことになり、誤りが起きやすい。READMEによると、ffmpeg-skillは処理の前後で素材と出力を調べ、生のフィルター文字列ではなく型の決まったオプションを使い、元のファイルを上書きしないように作られている。\n【詳細】42のツールは、カット、結合、無音部分の削除、長さや縦横比の調整、字幕とカラオケ字幕、音量、HDRからSDRへの変換、LUT、音声の整理、音ずれの補正、マルチカメラ、納品前の確認、一括処理などを扱う。「contract --json」でツールの仕様を出力でき、MCPサーバーは初期状態で12の主要なツールを公開する。FFmpegの構成を調べる「doctor」コマンドもある。導入は「npx ffmpeg-skill setup」で、必要ならFFmpeg自体も入れられる。Cursor向け、Codex向けのオプションも用意されている。動作にはインストーラー用のNode 16以上、標準ライブラリーだけを使うPython 3.10以上、FFmpegが必要で、FFmpeg 6.1、7.1、8、9でCIのテストをしているという。v4.7.1は自動生成のリリースで、変更はテストごとの出力フォルダーを分ける修正1件。初めての貢献者によるものだ。\n【ポイント・注意点】今回は大きな機能追加の版ではないが、プロジェクトは短い間隔で更新を重ねている。ページ上では42のツールのうち12が安定版とされており、それ以外のツールの扱いはドキュメントで確かめたい。ライセンスはMIT。","2026-11-23","GitHub（kajisho5/ffmpeg-skill）","https://github.com/kajisho5/ffmpeg-skill/releases/tag/v4.7.1"],["「Plannotator」AIの計画やコードに注釈して返す作業場","AIコーディングエージェントが出した計画や成果物をブラウザーで開き、注釈を付けてそのまま送り返せる「Plannotator」が、11月23日にv0.29.3を公開した。Claude CodeやCodex、Gemini CLIなど多くのエージェントに対応する。GitHub Trendingの週間ランキングで1週間に2,395スター増え、スターは1.48万。新版はForgejoとGiteaのプルリクエストのレビューに対応した。","\n【概要】「backnotprop/plannotator」は、エージェントの作業に人が関わり続けるための作業場だ。説明文では、方向づけ、判断、計画、注釈、コードレビュー、チームでの共有を行い、すべてのフィードバックをワンクリックでエージェントに送れるとうたう。2026年11月23日にv0.29.3がリリースされた。スターは1.48万、フォークは1.4千。GitHub Trendingの週間ランキングに入り、1週間で2,395スターを集めた。\n【背景】エージェントが計画を出したとき、作業を終えたとき、レビューを求めたときにブラウザーで画面が開き、利用者は注釈を付けて返す。対応するのはClaude Code、Codex、Copilot CLI、Gemini CLI、OpenCode、Kiro、Droid、Amp、DeepSeek Harness、Piなど。手元で動くのが基本で、導入はmacOS、Linux、WSL向けのシェルスクリプトか、Windows向けのPowerShellのコマンドで行う。\n【詳細】計画や文書への注釈は、HTMLや、プロキシを通した手元のlocalhostのサイトにも使える。手元の変更やGitHub、GitLab、Bitbucketのプルリクエストをレビューでき、v0.29.3でForgejoとGiteaも加わった。エージェントからのメッセージを集める「Inbox」や、7日で期限が切れる共有リンクもある。v0.29.3では、つながった2台のコンピューターのスレッドをまとめる機能、画像や動画、HTMLへのコメントにファイルや画像を添える機能、ガイド付きレビューでの画像のプレビューが追加された。「Take back」で自分の書いた言葉だけが戻るよう直し、Claudeのデスクトップアプリのコードタブに返信がすぐ届くようにした。リリースには39件のプルリクエストが含まれ、Mermaid図を描く任意の機能「Pele」は無効の状態で同梱されている。\n【ポイント・注意点】共有リンクは「PLANNOTATOR_SHARE=disabled」で無効にできる。ライセンスはApache 2.0とMITのどちらかを選べる。Gemini CLIは0.36.0以上が必要で、Claude Codeは2.1.287以降で計画レビューの流れが変わるとREADMEは注意している。","2026-11-23","GitHub（backnotprop/plannotator）","https://github.com/backnotprop/plannotator/releases/tag/v0.29.3"],["家計管理アプリ「Sure」週1,600スター、アルファ版を更新","公開を終えた家計管理アプリ「Maybe Finance」をコミュニティーが引き継いだ「Sure」が、11月23日にアルファ版「v2026.11.23-alpha」を公開した。自分のサーバーに置いて使える個人向けの家計・資産管理アプリだ。GitHub Trendingの週間ランキングで1週間に1,612スター増え、スターは1.77万。新版には約50件の変更が入り、レポートにカテゴリー別の推移グラフが加わった。","\n【概要】「we-promise/sure」は「The personal finance app for everyone (by everyone)」をうたう、個人向けの家計・資産管理アプリだ。2026年11月23日に「v2026.11.23-alpha」が、互換用の別名「v0.7.7-alpha.9」とともにプレリリースとして公開された。スターは1.77万、フォークは1.5千。GitHub Trendingの週間ランキングに入り、1週間で1,612スターを集めた。\n【背景】READMEによると、Sureは公開が終わった家計管理アプリ「Maybe Finance」をコミュニティーが引き継いだフォークで、Maybe Finance社とは関係がない。READMEはフォークに至った経緯も説明している。Dockerを使って自分のサーバーで動かせ、ブラウザー、macOS向けのデスクトップアプリ、モバイルアプリ、APIクライアント、LLMエージェントから使える。Render、PikaPods、Hostimへのワンクリック導入も用意されている。開発にはRuby、PostgreSQL、Redisが必要で、Mac、Linux、Windows、開発コンテナー向けの手順がある。デモ用のデータを読み込むコマンドもある。\n【詳細】今回のリリースには約50件のプルリクエストがまとまっている。LLMの料金情報を自動で更新する仕組み、インドネシア語などの翻訳の追加、QIF形式の取り込みの修正、銀行口座と連携するPlaidとEnable Bankingの同期の修正、レポートでのカテゴリー別の推移グラフの追加、ダッシュボードとサイドバーの表示の修正などが並ぶ。新たに4人が貢献者に加わった。Android向けのAPKと、署名のないiOS版というデバッグ用のビルドも添付されている。前回の版は11月20日付のアルファ版で、短い間隔で更新が続いている。\n【ポイント・注意点】今回の版はプレリリースのアルファ版で、本番の家計データを扱う場合はバックアップを取るなど慎重に扱いたい。ライセンスはMaybeと同じAGPLv3で、改変して外部にサービスとして提供する場合は、ソースコードを公開する義務に注意が必要だ。銀行口座との連携機能を使う場合は、各サービスの条件も確認しておきたい。","2026-11-23","GitHub（we-promise/sure）","https://github.com/we-promise/sure/releases/tag/v2026.11.23-alpha"],["「Univer」週4,300スター、表計算や文書をアプリに組み込む","表計算や文書の編集、計算、共同編集、ファイル処理を自社の製品に組み込めるOffice SDK「Univer」が、11月23日にv1.6.1を公開した。人とAIエージェントの両方が使う「AIオフィス」を作れるとうたう。GitHub Trendingの週間ランキングで1週間に4,324スター増え、スターは3.16万。新版は表示まわりの細かな不具合を直す修正版だ。","\n【概要】「dream-num/univer」は「Build your own AI office with Univer Office SDK.」をうたうOffice SDKだ。編集、計算、共同編集、ファイル処理を、人とAIエージェントの両方に向けて製品へ組み込めるとし、土台は拡張できるオープンソースのコアだと説明する。2026年11月23日にv1.6.1がリリースされた。スターは3.16万、フォークは2.9千。GitHub Trendingの週間ランキングに入り、1週間で4,324スターを集めた。\n【背景】Univerは3つの部分からなる。オープンソースの土台であるWeb SDK、共同編集や履歴、Officeファイルの読み書きを担うServer SDK、エージェントとつなぐAI SDKだ。このリポジトリにはApache-2.0のWeb SDKのコアとエンジンが入っており、商用のプラグインやServer SDK、商用のAI拡張は別のライセンスになる。Web SDKは、内容のモデル、編集、描画、数式の計算、操作用のAPIを受け持つ。\n【詳細】オープンソース版では、表計算で数式、絞り込み、並べ替え、入力規則、条件付き書式などを、文書でリッチテキスト、リスト、コメントを扱える。pnpmでパッケージを入れ、「createUniver」から始められる。Node.js上で画面なしに使うこともできる。対応ブラウザーはChrome・Edge 88以降、Firefox 90以降、Safari 14.1以降、Electron 12以降で、React 18と19に対応する。v1.6.1は小さな修正版だ。表計算では、特定の拡大率や表示倍率でスクロールしたときに行と列の見出しの近くに線が残る問題を直した。画面部品では、デスクトップとモバイルでダイアログやサイドバー、ドロワーの余白を減らし、浮かぶツールバーの区切り線を見えているグループの間だけに出すようにした。Pro版のスライドでは、低い拡大率で定規の目盛りを間引いて数字を隠し、中央の印は残すようにした。\n【ポイント・注意点】オープンソースで使える範囲と商用部分の境目は、導入の前に確かめておきたい。共同編集やOfficeファイルの読み書きはServer SDK側の機能で、別のライセンスの扱いになる。","2026-11-23","GitHub（dream-num/univer）","https://github.com/dream-num/univer/releases/tag/v1.6.1"],["アプリ審査の却下を事前に防ぐ「app-store-compliance」","App StoreとGoogle Playの審査で却下されやすい原因を、提出前に見つけるための手引きと検査ツール「app-store-compliance」が、11月22日にv2.5.1を公開した。124の却下パターンと対処法、112の期限を記録し、AIコーディングエージェント用のスキルも備える。GitHub Trendingのデイリーランキングで1日に936スター増えた。新版では中国本土向けの申告など3つの期限を加えた。","\n【概要】「mjmirza/app-store-compliance」は、App StoreとGoogle Playでのよくある却下を避けるための、公開の手引きと提出前のチェックツールだ。説明文によると、124の却下パターンと対処法、プライバシーマニフェストとData safetyの確認、EU AI法やDSA、COPPA、年齢に関する法律など112の期限、AIコーディングエージェント用のスキルをそろえる。2026年11月22日にv2.5.1がリリースされた。スターは5.6千、フォークは361。GitHub Trendingのデイリーランキングで1日に936スターを集めた。\n【背景】iOSやAndroidのアプリは、審査で却下されると修正と再提出に時間を取られる。このプロジェクトは、審査担当者より先に原因を見つけることを狙う。READMEは、承認を保証するものではないと明記している。\n【詳細】中身は、参照用の手引き、アプリのフォルダーを調べて「BLOCKED.」「CLEAR.」などの結果を出す検査スクリプト、エージェント用のスキルの3つだ。リポジトリをcloneし、検査スクリプトにアプリのパスを渡せば一度きりの検査ができる。インストールスクリプトでAIツールのフックとして組み込むこともでき、Claude Code、Codex CLI、Gemini CLI、OpenCode、Cursor、GitHub Copilot、Windsurfなどに対応する。対象はiOS／iPadOS、macOS、Android、Flutter、React Native、Expo、Unityだ。v2.5.1は修正版で、作者は2.5.0で通ったものが新たに止められることはないとしている。新しい期限として、Appleの中国本土向けアプリのコンプライアンス申告（既存アプリは2027年1月31日まで）、Google Playの事業者区分の申告（2027年2月1日まで）、Google Playのマーケットプレイス表示ルール（2027年3月1日から）の3件を加えた。追跡する期限は33の法域で112件になった。\n【ポイント・注意点】ライセンスはREADMEによると独自の「OpenRoots Agent License 2.3」だ。期限の情報は、自分でも公式の発表と照らし合わせたい。","2026-11-22","GitHub（mjmirza/app-store-compliance）","https://github.com/mjmirza/app-store-compliance/releases/tag/v2.5.1"],["エージェントと画面をつなぐ「AG-UI」週3千スター","AIエージェントとユーザー向けのアプリをつなぐ共通の手順を定めたプロトコル「AG-UI」が、11月21日に関連パッケージをまとめてリリースした。1本の双方向のイベントの流れでエージェントと画面をつなぐ仕組みで、READMEは1.0の公開を伝えている。GitHub Trendingの週間ランキングで1週間に2,966スター増え、スターは2.15万。今回の版は認証の回避を防ぐ修正などセキュリティーの強化が中心だ。","\n【概要】「ag-ui-protocol/ag-ui」は「AG-UI: the Agent-User Interaction Protocol. Bring Agents into Frontend Applications.」をうたうプロトコルだ。AIエージェントをユーザーが使うアプリにつなぐ方法を標準化する、軽量でイベント駆動のオープンなプロトコルだと説明している。2026年11月21日に「Release 2026-11-21」として4つのパッケージが公開された。スターは2.15万、フォークは2.2千。GitHub Trendingの週間ランキングで1週間に2,966スターを集めた。\n【背景】エージェントを画面に組み込むとき、これまでは個別の配線を作ることが多かった。AG-UIはこれを1本の双方向のイベントの流れに置き換える。READMEによると、AG-UI 1.0が公開され、仕様はJSON Schemaで固定された。TypeScript、Python、.NETのSDKは仕様から生成され、0.x系とは双方向に互換がある。イベントは実行の開始と終了、テキスト、ツール呼び出し、状態、推論、サブエージェントなど8系統31種類だ。\n【詳細】npm、pip、dotnetの各パッケージがあり、LangChain、CrewAI、Google ADK、Mastra、Claude Agent SDKなどと連携できる。今回のリリースは自動の一括公開で、npmの@ag-ui/langgraph 0.0.47と、PyPIのag_ui_adk 0.14.0、ag-ui-langgraph 0.0.48、ag-ui-openai-agents 0.2.0が出た。中身の多くはセキュリティーの強化だ。ag_ui_adkの認証回避の修正、リクエストのヘッダーをクライアント側の状態より優先する変更、ag-ui-openai-agentsでの一時停止中のツール呼び出しへのHMAC署名とトークンの期限の確認、LangGraphでクライアントから渡される値の許可リストなどが入った。\n【ポイント・注意点】各パッケージに互換性を崩す変更があり、新たに422や401の応答が返る場合がある。複数のワーカーで動かす環境では、共有の保存先の指定が必要になる。大手企業の採用をうたう記述はプロジェクト自身の説明だ。","2026-11-21","GitHub（ag-ui-protocol/ag-ui）","https://github.com/ag-ui-protocol/ag-ui/releases/tag/release/2026-11-21"],["Meta製デザインシステム「Astryx」週3千スター超え","Metaのデザインシステム「Astryx」が、11月20日にv0.7.17を公開した。社内で8年かけて育ち、1万3千を超える社内アプリを支えてきたとされ、150を超える部品やテーマ、CLIを備える。AIアシスタントにも扱いやすい作りをうたう。GitHub Trendingの週間ランキングで1週間に3,165スター増え、スターは3.28万。新版ではスマホのキーボードを表示したときの入力欄の扱いなどを改善した。","\n【概要】「meta/astryx」は「An open source design system that's fully customizable and agent ready」をうたう、Metaのオープンソースのデザインシステムだ。2026年11月20日にv0.7.17がリリースされた。スターは3.28万、フォークは2.6千。GitHub Trendingの週間ランキングで1週間に3,165スターを集めた。\n【背景】READMEによると、AstryxはMeta社内で8年かけて育ち、社内の1万3千を超えるアプリを支えてきた。アクセシビリティーに配慮した150を超える部品、ブランド単位のテーマ、ダークモード、テンプレート、CLIを備え、現在はベータ版だ。React 19以降とStyleXで作られ、利用者はビルド済みのCSSを読み込み、型付きのReact部品を使う。ビルド用のプラグインは要らない。人とAIアシスタントの両方に向けて書かれていると説明している。\n【詳細】部品は組み合わせて使え、「swizzle」コマンドで部品のソースを自分のプロジェクトに取り出して手を加えられる。見た目はclassNameで上書きでき、Tailwind、CSSモジュール、普通のCSSが使える。テーマはCSSカスタムプロパティーの上書きで、neutral、butter、chocolate、matcha、stone、gothic、y2kの7種類が公式に用意されている。導入はnpmでコアとテーマ、StyleXを入れ、CLIで初期化する。v0.7.17では、ItemとListItemのスワイプ操作が、指の動きに合わせて開く・確定・実行・取り消しの動きを追うようになった。TextInputなどの入力欄は、スマホやタブレットのキーボードの上に表示され続ける。メニュー類は選択後に一度だけ閉じ、操作した元の部品に焦点を戻す。CLIは全コマンドをMCPツールとして使えるようになった。11のパッケージが更新され、24人が貢献した。\n【ポイント・注意点】更新するときは全パッケージを0.7.17にそろえ、「astryx upgrade --from 0.7.16 --apply」を実行するよう案内されている。ベータ版のため、今後も仕様の変更が続く点は踏まえておきたい。ライセンスはMIT。","2026-11-20","GitHub（meta/astryx）","https://github.com/meta/astryx/releases/tag/v0.7.17"],["「CodeGraph」コードを知識グラフ化しエージェントを省力化","コードベースを前もって知識グラフにしておき、Claude CodeやCodex、Cursorなどのエージェントが少ない手数で必要な情報を得られるようにする「CodeGraph」が、11月20日にv1.6.4を公開した。すべて手元で動き、コードの変更に合わせて自動で更新される。GitHub TrendingのTypeScript部門のデイリーランキングに入り、スターは7.86万。新版では1つの記号の定義と使用箇所をまとめて返すようにした。","\n【概要】「colbymchenry/codegraph」は、コードベースの記号、呼び出し関係、依存関係を前もって知識グラフにしておくツールだ。説明文は、Claude Code、Codex、Gemini、Cursorなど向けに、トークンもツールの呼び出しも減らせ、すべて手元で動くとうたう。2026年11月20日にv1.6.4がリリースされた。スターは7.86万、フォークは5.2千。GitHub TrendingのTypeScript部門のデイリーランキングに入った。\n【背景】エージェントがコードを調べるとき、ファイルの検索や読み込みを何度も繰り返すと、時間もトークンもかさむ。CodeGraphは、ファイルの変更を見張って自動で更新されるグラフを用意する。エージェントは主に「codegraph_explore」という1つのMCPツールで、関係するソース、呼び出しの経路、変更の影響範囲を一度に受け取る。READMEのベンチマーク（7つのリポジトリ、4回の中央値）では、ツールの呼び出しが88%減り、53%速く、トークンは62%減、費用は44%減ったという。\n【詳細】ほかに、変更の影響分析、20を超えるWebフレームワークのルートの検出、iOS、React Native、Expoが混ざったプロジェクトでの言語をまたぐ関係づけなどができる。導入はインストールスクリプトかnpmで、「codegraph install」でエージェントとつなぎ、プロジェクトごとに「codegraph init」を実行する。Windows、macOS、Linuxのx64とarm64で動く。v1.6.4では、codegraph_exploreが1つの記号についての質問に、定義とすべての使用箇所を返すようになった。Claude Codeのプロンプトフックは、起動済みのサーバーを使う。セキュリティー面では、各セッションが、裏で動くサーバーが同じユーザーで動いているかを確かめるようになった。JavaScript／TypeScript、Python、Rust、C#、PHP、Javaの呼び出しの関連づけも多く直った。\n【ポイント・注意点】更新した後は「codegraph index」の実行が求められる。ベンチマークは開発者自身による計測だ。","2026-11-20","GitHub（colbymchenry/codegraph）","https://github.com/colbymchenry/codegraph/releases/tag/v1.6.4"],["学習AI「DeepTutor」、認証情報の露出を受け署名鍵を交換","個人に合わせた学習を支えるオープンソースのワークスペース「DeepTutor」が、11月20日にv1.7.4を公開した。デスクトップ版の配布に使う認証情報がGitHub Actionsの成果物から見える状態になっていたことを受け、更新の検証に使う署名鍵を入れ替えるセキュリティー更新だ。GitHub Trendingの月間ランキングに入り、スターは6.22万。古い版の利用者には早めの更新が求められる。","\n【概要】「HKUDS/DeepTutor」は「Lifelong Personalized Tutoring」をうたう、オープンソースの学習用ワークスペースだ。2026年11月20日にv1.7.4がリリースされた。スターは6.22万、フォークは7.5千で、GitHub Trendingの月間ランキングに入っている。今回の版は、デスクトップ版のセキュリティー更新だ。\n【背景】DeepTutorは、個別指導、調べもの、教材づくり、演習を1つの仕組みにまとめる。Chat、Quiz、Research、Visualize、Solveの各モードが会話の流れを共有する。知識ベースはLlamaIndex、PageIndex、GraphRAG、LightRAGなどの検索方式に対応する。資料から編集できる対話型の章を作る「Book」や、チャットツール上でも動く相棒の「Partners」もある。記憶は3層で、中身と根拠をたどれる。スキル、MCP、ほかのエージェント向けのCLIで拡張でき、論文はarXivで公開されている。\n【詳細】v1.7.4のリリースノートによると、11月20日、デスクトップ版の配布に使う認証情報がGitHub Actionsの成果物の中で見える状態になっており、その成果物は削除された。これを受け、macOS版とWindows版のアプリが実行環境の更新を確かめるための署名鍵を入れ替えた。アプリは新しい公開鍵で更新を検証し、古い鍵で署名された実行環境が保存されていれば、ワークスペースをバックアップしたうえで、同梱の検証済みの実行環境を入れ直す。今後は、タグ付きのデスクトップ版のビルドが配布用の認証情報を使うには、メンテナーの承認が必要になる。macOSのDMG、Windowsのインストーラー、ポータブル版のZIPのそれぞれについて、更新の手順が示されている。\n【ポイント・注意点】以前のデスクトップ版は古い鍵を信頼したままなので、アプリを更新するまではコアの更新を取り込まないよう呼びかけている。デスクトップ版の利用者は早めの更新が必要だ。導入方法にはほかに、Docker、PyPI、ソースからの導入、CLIだけの導入がある。","2026-11-20","GitHub（HKUDS/DeepTutor）","https://github.com/HKUDS/DeepTutor/releases/tag/v1.7.4"],["「Ghost Downloader 3」1日1,100スター、万能ダウンローダー","HTTPやBitTorrent、FTP、動画配信の形式など多くの方式に1本で対応するダウンロード管理アプリ「Ghost Downloader 3」が、11月20日にv4.5.11を公開した。YouTubeやBilibiliの動画、GitHubやHugging Faceのファイルの取得にも対応する。GitHub Trendingのデイリーランキングで1日に1,102スター増え、スターは1.71万。新版ではドイツ語など5つの言語の翻訳が加わった。","\n【概要】「XiaoYouChR/Ghost-Downloader-3」は「The only downloader you need.」をうたう、Windows、macOS、Linux、Androidで動くダウンロード管理アプリだ。2026年11月20日にv4.5.11がリリースされた。スターは1.71万、フォークは1.0千。GitHub Trendingのデイリーランキングで1日に1,102スターを集めた。\n【背景】READMEは「5つのアプリの代わりに1つ」と説明する。HTTP、Magnet／BitTorrent、FTP、M3U8、MPEG-DASH、eD2kに対応し、YouTubeとBilibiliの動画は範囲や画質、字幕を選んで取得できる。GitHubとHugging Faceからのダウンロードは、ミラーを使って速められる。\n【詳細】ファイルを結合せずに済む分割ダウンロード、回線の帯域の自動検出、ページ内の動画などを見つけてデスクトップアプリに渡すブラウザー拡張、aria2互換のRPC APIなどを備える。Android版はライブ配信のM3U8を録画でき、裏でもダウンロードを続ける。「ghd」というコマンドラインツールもあり、調査、追加、一覧、一時停止、再開、削除、待機の各操作ができる。対応環境はWindows 10以降（x86_64とarm64）、macOS 13.0以降、glibc 2.35以降のLinux、Android 9.0以降（arm64-v8a）だ。v4.5.11は小さな更新で、ドイツ語、フランス語、インドネシア語、イタリア語、韓国語の翻訳を加えた。Windowsで、タスクバーが進み具合の表示に対応していない場合に毎秒エラーが記録される問題も直した。配布物はWindowsのインストーラーと持ち運び版、macOSのArm版とIntel版、LinuxのAppImage・deb・tar.xz、Android版のapkだ。\n【ポイント・注意点】リリースノートでは、作者の学業のため今後の更新は遅くなるとしている。READMEは、Qt 6.6以降はAVXに対応しないCPUで動かないと注意している。ライセンスはGPL v3。動画サイトからのダウンロードでは、各サービスの利用規約や著作権に気をつけたい。","2026-11-20","GitHub（XiaoYouChR/Ghost-Downloader-3）","https://github.com/XiaoYouChR/Ghost-Downloader-3/releases/tag/v4.5.11"],["「Agent Substrate」大量のAIエージェントを安全に隔離","Kubernetes上で大量のAIエージェントを、ゼロトラストの考え方で隔離して動かす実行基盤「Agent Substrate」が、11月20日にv1.0.1を公開した。使っていないエージェントを記憶から退避し、要求が来たら500ミリ秒未満で戻すとうたう。1.0に達し、互換性の維持を約束している。GitHub TrendingのGo部門に入り、スターは8.3千。新版は外向きの通信の制限を強める修正版だ。","\n【概要】「agent-substrate/substrate」は、READMEで「Zero-trust sandboxing for millions of agents on Kubernetes.」とうたう、AIエージェント用の実行基盤だ。2026年11月20日にv1.0.1がリリースされた。スターは8.3千、フォークは913。GitHub TrendingのGo言語部門のランキングに入った。\n【背景】Agent Substrateは、エージェントを作るためのSDKではなく、こだわりの少ない実行基盤だと位置づけられている。状態を持つ多くの「アクター」を、少数の待機済みの「ワーカー」に割り当て、使われていないアクターはスナップショットにして記憶から外し、要求が来たら戻す。READMEによると、復帰は500ミリ秒未満で、1秒あたり500回を超える起動ができ、通常のコンテナの約10倍の密度になる。デモでは8つのポッドで約250のアクターを動かしている。\n【詳細】各アクターはgVisorかCloud Hypervisorのマイクロ仮想マシンの中で動き、普通のLinuxコンテナは使えない。アクターごとに、短い期間だけ有効なSPIFFEの身元証明が与えられる。認証情報はサンドボックスの外に置かれ、外向きの通信のゲートウェイが差し込む。通信は初期状態ですべて拒否だ。OCIイメージを動かすためフレームワークを選ばず、ADK、LangChain、Claude Code、Codex、MCPサーバーなどと組み合わせられる。プロジェクトは1.0に達し、API、CLI、設定の互換性を守ると約束している。v1.0.1ではセキュリティーを強化し、外向きのゲートウェイが名前解決の後にループバックやリンクローカル、クラウドのメタデータのアドレスにつながらないようにした。拒否した要求には403を返す。Goを1.27.4に上げてnet/httpの注意報に対応したほか、アクターの復帰が遅いときに空の504ではなく、再試行を促す503を返すように直した。\n【ポイント・注意点】対象は最新の安定版のKubernetesと、一つ前のマイナー版だ。試すにはGo、kubectl、Dockerが必要で、kindでのクラスター作成の手順とGKE向けの導入手順が用意されている。ライセンスはApache-2.0。","2026-11-20","GitHub（agent-substrate/substrate）","https://github.com/agent-substrate/substrate/releases/tag/v1.0.1"],["論文の調査から仕上げまで支える「Academic Research Skills」","文献調査から執筆、査読、修正、仕上げまで、学術研究の流れを支えるClaude Code用のスキル集「Academic Research Skills」が、11月19日にv3.24.4を公開した。13のエージェントによる調査、12のエージェントによる執筆、7つのエージェントによる多角的な査読などで構成する。GitHub TrendingのPython部門のデイリーランキングに入り、スターは5.84万。新版では研究倫理審査向けの機能の範囲を絞った。","\n【概要】「Imbad0202/academic-research-skills」は「Academic Research Skills for Claude Code: research → write → review → revise → finalize」をうたうスキル集だ。2026年11月19日にv3.24.4がリリースされた。スターは5.84万、フォークは4.5千で、GitHub TrendingのPython部門のデイリーランキングに入った。\n【背景】構成要素は、13のエージェントで調べる「Deep Research」、12のエージェントで書く「Academic Paper」、7つのエージェントで多角的に査読する「Academic Paper Reviewer」だ。Deep Researchは、対話で導くソクラテス式のモードや、PRISMAに沿ったシステマティックレビュー、Semantic Scholarでの確認を備える。全体をつなぐ10段階のパイプラインには、2.5段階と4.5段階に誠実さを確かめる関門があり、各段階で人の確認を待つ。\n【詳細】導入はClaude Codeのプラグインコマンドで行い、Claude CodeとAPIキーが必要だ。出力はMarkdown、DOCX、LaTeX、PDFで、引用形式はAPA 7.0、Chicago、MLA、IEEE、Vancouverに対応する。READMEは、1万5千語の論文を通しで作る費用を、2026年9月の定価で約3〜7米ドルと見積もる。v3.24.4では、修正支援の中の委員会あての文面を、正式な研究倫理審査や人を対象とする研究の審査に限り、利用者が審査機関を名指しした言葉を引用させるようにした。編集者からの手紙に、合意に届かなかった指摘を載せる節も加えた。OpenAI側の検証役にはGPT-6.2 Astraを推奨したが、暫定の扱いだ。Chicago、MLA、IEEE、Vancouverの引用の確認は、自動で直すのをやめて報告だけにした。\n【ポイント・注意点】READMEの実例では、2.5段階で15件の問題のある参考文献を見つけたが、その後の監査で68件中21件に問題が残っていた（以前の版での結果）。引用の確認は人の目でも行う必要がある。ライセンスは非営利に限るCC BY-NC 4.0だ。","2026-11-19","GitHub（Imbad0202/academic-research-skills）","https://github.com/Imbad0202/academic-research-skills/releases/tag/v3.24.4"],["「HermesEnabler」どのApple WatchでもHermès文字盤を","Apple Watchのエルメス（Hermès）モデル向けの文字盤を、ほかのApple Watchでも使えるようにするアプリ「HermesEnabler」が、11月19日に1.6.3を公開した。新版はwatchOS 27.2 beta 2に対応した。GitHub Trendingの週間ランキングで1週間に390スター増え、スターは2.5千。導入にはアプリの手動インストールや開発者モードの有効化が必要で、READMEは自己責任での利用を求めている。","\n【概要】「pookjw/HermesEnabler」は「Enable Hermès Watch Faces on any Apple Watch devices」をうたうアプリだ。2026年11月19日に1.6.3がリリースされた。スターは2.5千、フォークは206。GitHub Trendingの週間ランキングで1週間に390スターを集めた。\n【背景】Apple Watchには、ブランドと組んだモデルにだけ用意された文字盤がある。HermesEnablerは、その一つであるエルメスの文字盤を、ほかのApple Watchでも使えるようにする。READMEによると、現在のHermesEnabler 2はwatchOS 27.0から27.3 beta 1に対応する。watchOS 26には対応しておらず、ほかの非対応のバージョンには別のプロジェクト「Clocky」を案内している。READMEはほかに9つの言語に翻訳されている。\n【詳細】macOSからの導入方法は2つある。1つは用意されたIPAファイルをSideloadlyでインストールする方法で、バンドルIDの自動設定を切り、開発者証明書を信頼し、iPhoneとWatchの両方で開発者モードを有効にする必要がある。Watch側のアプリは、iPhoneのWatchアプリから入れる。もう1つは、Xcodeでプロジェクトを開いて自分でビルドする方法だ。Windowsでは、コミュニティーのツール「WatchBridge」を使う。READMEは、このツールがAppleともプロジェクトとも関係がないと断っている。Apple Mobile Device Serviceと、開発者モードの準備のためのUSB接続が必要で、iPhone側とWatch側の両方を含むIPAを使う。1.6.3のリリースノートは1行で、watchOS 27.2 beta 2（ビルド24S5091f）に対応し、27.3 beta 2は含まないと明記している。\n【ポイント・注意点】アプリを消す前に、アプリ内でMobileGestaltのバックアップを戻すよう注意がある。更新するときは、同じバンドルIDとApple IDを使い続ける必要がある。READMEは「Use at your own risk.」と明記しており、利用は自己責任だ。","2026-11-19","GitHub（pookjw/HermesEnabler）","https://github.com/pookjw/HermesEnabler/releases/tag/1.6.3"]],"gh-new":[["Chili3D：ブラウザで動くCADが3つの造形方式を1つに統合","ブラウザ上で動くオープンソースの3D CAD「Chili3D」が、Hacker NewsのShow HNで新機能を紹介した。今回加わったのは、履歴をさかのぼって直せるパラメトリック造形、言葉で形を作るAI支援造形、履歴なしで面を押し引きするプッシュ・プル造形の3つ。形状処理にはOpenCascadeをWebAssemblyに変換したものを、描画にはThree.jsを使う。3つの方式は同じ文書と取り消し履歴を共有し、GitHubのスターは5.0kに上る。","\n【概要】\nChili3Dは、インストールなしでブラウザから使える3D CADアプリだ。作者はHacker NewsのShow HNで、パラメトリック、AI支援、プッシュ・プルの3つの造形モジュールを追加したと報告した。3つは1つの文書と1つの取り消し履歴を共有するので、方式を切り替えながら同じモデルを編集し続けられる。デモはchili3d.comで公開されている。\n【背景】\n作者は以前にもShow HNでChili3Dを紹介しており、今回はその続報にあたる。形状処理の中核には、オープンソースの形状カーネルOpenCascade（OCCT）をWebAssemblyにコンパイルしたものを使い、画面の描画はThree.jsが受け持つ。READMEは「ネイティブに近い造形性能」をうたっているが、具体的な測定値は示していない。\n【詳細】\nパラメトリック造形では、押し出し、回転、ロフト、スイープ、フィレット、ブーリアン演算などを特徴の一覧として管理する。スケッチの拘束を変えると、後に続く形状が自動で作り直される。2Dスケッチには同梱の拘束ソルバーを使う。AIアシスタントは、利用者自身のAPIキーでAnthropicかOpenAIのAPIをブラウザから直接呼び出し、編集できる特徴として形を生成する。プッシュ・プルは履歴を持たない直接造形で、切り取りや結合が自動で行われる。ファイルはSTEP、IGES、BREP、STLの読み込みと書き出しに対応する。\n【ポイント・注意点】\n開発言語はTypeScriptで、git cloneのあとnpm installとnpm run devを実行すれば手元でも動かせる。Docker Composeでの起動にも対応し、推奨環境はNode 24だ。GitHubではスター5.0k、フォーク509、コミット1,366件と、すでに大きな関心を集めている。ライセンスはAGPL-3.0で、C++のWebAssembly部分はLGPL-3.0となる。商用ライセンスは問い合わせで提供されるため、自社製品に組み込む場合はAGPLの条件をよく確かめたい。","2026-11-24","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50629040"],["Voxa：話し手と口の動きがずれない動画吹き替えツール","動画を別の言語に吹き替えるオープンソースツール「Voxa」がHacker NewsのShow HNに投稿された。Whisperで文字起こしをして翻訳し、音声を合成して元の映像に重ねる。訳した各行を元の発話が始まった時刻にそろえることで、話し手とのずれを防ぐ。話者ごとの声の割り当てや元のBGMの保持、字幕の生成、品質チェックにも対応する。Python製の1ファイルのCLIで、GUIのStudioも用意されている。ライセンスはMIT。","\n【概要】\nVoxaは、動画の音声を別の言語に吹き替えるツールだ。Whisperで文字起こしをし、翻訳して、訳文を音声に変え、元の動画の下に混ぜ込む。最大の特徴は、訳した各行を元の発話が始まった位置から再生させる点にある。たとえば「voxa talk.mp4 --target_lang ru」のように、1行のコマンドでロシア語の吹き替えを作れる。字幕も作り、仕上がりを確かめる品質チェックの仕組みも組み込まれている。\n【背景】\nREADMEによると、訳した音声を単純に順番どおり並べた場合、3分の動画で最後には18秒も遅れてしまったという。翻訳すると文の長さが変わるため、こうしたずれは吹き替えの大きな課題になる。Voxaでは音声を最大1.25倍まで速め、開始が最大0.4秒遅れるのを許すことで、話し手とのタイミングを保つ。\n【詳細】\n話者の分離にはpyannote、BGMの分離にはDemucsを使い、話者ごとに別の声を割り当てながら元の音楽を残せる。翻訳エンジンは既定のGoogleのほか、OpenAI、Anthropic、OpenRouter、Ollamaから選べる。音声合成は既定のEdgeのほか、OpenAIとPiperに対応する。声のクローンにはChatterbox、VoxCPM2、XTTSを使える。文字起こしのfaster-whisperは「2〜4倍速い」と書かれている。コマンドが苦手な人は、GUIのStudioから同じ処理を進められる。\n【ポイント・注意点】\n必要なのはPython 3.10以上とFFmpeg。Windows用の11MBのインストーラーがあり、セットアップ中にさらに約1GBをダウンロードする。pipxやDockerでも導入できる。ノートPCのCPUでは、Chatterboxで1文あたり40〜60秒、VoxCPM2で2〜3分かかったとされ、声のクローンは重い処理になる。本体はMITライセンスだが、XTTSの重みは非商用に限られるなど、エンジンごとの条件はNOTICE.mdで確かめる必要がある。","2026-11-24","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50628521"],["ParaViz：RustとWebGPUで作った科学データ可視化スタジオ","RustとWebGPUで作られた科学データの3D可視化スタジオ「ParaViz」がHacker NewsのShow HNに登場した。デスクトップアプリ、ブラウザで動くWebアプリ、CLIとRust・PythonのAPIという3つの形で使える。流体解析（CFD）、構造解析（FEA）、医用画像、LiDAR点群、分子構造など幅広い形式を読み込み、断面、切り取り、流線、ボリューム描画といった処理をそろえる。ライセンスはMITとApache-2.0の選択式だ。","\n【概要】\nParaVizは、シミュレーションや計測で得た科学データを3Dで見るための可視化ツールだ。RustとWebGPUで書かれ、デスクトップアプリ、ブラウザ版、CLIおよびRust・PythonのAPIとして使える。ブラウザ版はGitHub Pagesで公開されており、インストールせずに試せる。現在の対象範囲はv0.2系とされている。ライセンスはMITとApache-2.0のどちらかを選べる形だ。\n【背景】\n科学技術計算の分野では、解析結果を目で確かめる可視化ツールが欠かせない。ParaVizは、流体解析のOpenFOAM、CGNS、EnSight、構造解析のExodus II、Abaqus、Gmsh、医用画像のNIfTIとDICOM、点群のLASのほか、メッシュや分子の形式も読み込む。分野ごとに分かれがちなデータを、1つのツールで扱えるようにしている。\n【詳細】\n機能としては、断面表示、切り取り、流線、レイマーチングによるボリューム描画、奥行きを強調するEye-Dome Lighting、4倍のMSAA、取り消しとやり直し、コマンドパレット、作業環境のプロファイルを備える。結果は操作できるviewer.html、回転するGIF、PNG、GLBとして書き出せる。操作できるviewer.htmlは、受け取った人がブラウザで開いて自分で向きを変えながら見られる。CLIでは、等値面のフィルタやカラーマップを指定して1行で画像を描くことができる。\n【ポイント・注意点】\nデスクトップ版はmacOS、Windows、Linux向けのバイナリがGitHub Releasesで配られ、cargoでソースからビルドすることもできる。一方で、MPIによる並列処理、OSPRayやOptiXによるレンダリング、STEPやIGESの読み込みは対象外と明記されている。性能の数値は示されていない。なお、HNへの投稿者とリポジトリの所有者は別の名前で、その関係はページからは分からない。スターはまだ4と少なく、コミットは84件。","2026-11-24","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50628288"],["Graph-TUI：ターミナルの中で図を描いて編集できる道具","ターミナルの中でグラフ（ノードと矢印の図）を描いて編集できるRust製ツール「Graph-TUI」がHacker NewsのShow HNで紹介された。無限に広がるキャンバス、ノードの縁へ直角に線を引く自動の経路づけ、vim風のキー操作が特徴だ。独自のJSON形式で保存し、Graphvizの.dotやJSON Canvasを読み込める。PNGやSVGなどへの書き出しにも対応する。ratatuiで作られ、ライセンスはMIT。","\n【概要】\nGraph-TUIは、マウスを使わずにターミナルの中でグラフを描くためのエディタだ。ノードを置いて線でつなぐと、線は直角に折れ曲がりながらノードの縁にある接続点まで自動で引かれる。vimに似たキー操作で編集でき、キー割り当ては自由に変えられる。「graph-tui tutor」で操作を学ぶチュートリアルも用意されている。キャンバスに端がないので、大きな図でも画面の広さを気にせずに描き足していける。\n【背景】\n設計図や処理の流れを図にしたいとき、多くの人はGUIの作図ソフトを使う。しかし、ターミナルで作業を続ける開発者にとって、画面を切り替えるのは手間になる。Graph-TUIは、RustのTUIライブラリratatuiを使い、ターミナルから離れずに図を作れるようにした。例として、TCPの動きを描いた図のファイルもリポジトリに収められている。\n【詳細】\n標準の保存形式はJSONをもとにした.gtuiで、Graphvizの.dotとJSON Canvasを読み込める。書き出しはPNG、SVG、.canvas、テキスト、ターミナル出力に対応し、.dotへの書き出しは一部の情報が失われる形になる。ノードの形は6種類あり、要素ごとに色を変えられる。取り消しとやり直しにも対応する。「graph-tui --export out.svg 入力ファイル」のように、コマンドラインから画像だけを書き出すこともできる。\n【ポイント・注意点】\nLinuxとmacOSではインストール用スクリプトで導入でき、Rust 1.88以上があれば「cargo install graph-tui」でも入れられる。Windows向けにはReleasesにzipが置かれている。ライセンスはMIT。リポジトリにはスター25、コミット219件があり、短期間で多くの改良が積み重ねられている。READMEには性能の数値は書かれておらず、設計上の割り切りは別の文書にまとめられている。ターミナルで完結する作図の道具を探している人には、試す価値がありそうだ。","2026-11-24","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50627991"],["Postvec：Postgresで埋め込みモデルを再計算なしに乗り換え","PostgreSQLの拡張機能「Postvec」がHacker NewsのShow HNで公開された。BM25による全文検索と意味検索を1回のSQLで組み合わせるハイブリッド検索、ベクトルの自動同期、そして埋め込みモデルの入れ替えを特徴とする。モデルを替えるとき、既存の行は「埋め込み空間の変換器」で新しい空間に移すため、全データを埋め込み直す必要がない。対応するのはPostgreSQL 16〜18で、Rustで書かれている。","\n【概要】\nPostvecは、PostgreSQLの中でベクトル検索を扱いやすくする拡張機能だ。BM25と意味検索を1回のSQLで合わせて実行でき、テキスト列を指定すると埋め込みベクトルが自動で同期される。最大の特徴は、埋め込みモデルを別のモデルに替えるときに、古い行を変換器で移し替えられる点にある。\n【背景】\n埋め込みモデルを替えると、古いモデルで作ったベクトルとは比べられなくなる。ふつうは全件を新しいモデルで埋め込み直す必要があり、データが多いほど時間と費用がかかる。Postvecでは、古い行は変換器で新しい空間に写し、新しく書き込まれる行は新しいモデルで埋め込む。migration_finalize()を呼ぶと列が切り替わる。対応するのはPostgreSQLの16、17、18の3つの版だ。\n【詳細】\n推論は、データベースに組み込む方式が既定で、ローカル用のイメージには384次元のMiniLMが入っている。gRPCで別サーバーのpostvec-serverに任せることもできる。OpenAI、Cohere、Bedrock、Gemini、Mistral、OpenRouter、UniVecといった外部APIにも対応する。HNのコメントで作者は、変換の組み合わせが100以上あること、埋め込みと変換を1段で行って古い空間のベクトルを近似していることを説明した。\n【ポイント・注意点】\nDockerイメージ1つで試せ、postvec.enable、postvec.search、postvec.migrateといった関数で操作する。拡張機能やCLIはPostgreSQLライセンスだが、postvec-serverはBusiness Source License 1.1で、各リリースから4年後にPostgreSQLライセンスへ移る。組織での本番利用には有料のPro版が必要とされている点に注意したい。READMEには精度の数値は載っておらず、作者は指標をWebサイトとHugging Faceに置いているとしている。","2026-11-24","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50627889"],["Decloak：AIエージェントの設定に潜む悪意を手元で検査","AIエージェントのスキル、ルールファイル、MCPサーバーの設定に隠された指示を探すGo製のスキャナー「Decloak」がHacker NewsのShow HNに登場した。LLMを使わずオフラインで動き、調べる対象のコードも実行しない。隠しHTMLコメントや多重のbase64エンコードを解く規則のほか、15種類以上のエージェントの設定をまとめて調べる監査機能、ハッシュで後からのすり替えを見つける機能を持つ。ライセンスはApache-2.0。","\n【概要】\nDecloakは、AIエージェントが読み込むスキルやルールファイル、MCPサーバーの設定から、隠された指示を見つけるツールだ。HNの投稿タイトルでは、~/.claudeやMCPの設定をLLMなしで検査できると紹介している。本体のバイナリにはネットワーク通信の機能がなく、調べる対象のコードを実行することもない。\n【背景】\nコーディングエージェントが広まるにつれ、他人が作ったスキルやMCPサーバーを取り込む機会が増えた。そこに人の目には見えにくい形で命令が埋め込まれていると、エージェントが意図しない動きをする恐れがある。Decloakは、こうした「隠し込み」を規則に基づいて見つけることを狙う。本体はLLMを使わずオフラインで動くため、調べる設定ファイルを外部のサービスに送らずに済む。\n【詳細】\n隠しHTMLコメントの検出、base64・16進数・gzipを何重にも解く処理、データの流れをたどる追跡といった規則を備える。--policyを付けると、隠されていない形での権限の悪用も調べる。decloak auditは15種類以上のエージェントを対象にし、lockとverifyではSHA-256ハッシュを記録して、後からのすり替えを検出する。結果はSARIF形式で出力でき、GitHub Actionやpre-commitフックとしても使える。作者が示したMaliciousSkillBenchでの結果は、--policyありで再現率36.7%、誤検知率3.3%。比較に挙げたCiscoのスキャナー（規則のみ）は7.7%と4.0%だった。\n【ポイント・注意点】\nHomebrewやgo installで導入できる。LLMで判定する別のバイナリdecloak-judgeを任意で使え、48件の検証では再現率89.7%、誤検知率0.0%だったが、READMEはこれを目安にとどまると説明している。規則だけでは見逃しも多いことが数値から読み取れ、ほかの対策と組み合わせて使うのが前提になる。ブラウザで試せるWebAssembly版のデモも用意されている。","2026-11-24","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50627796"],["Sheaf：手元のCPUでLean 4の定理を証明するRust製CLI","数学の証明支援系Lean 4の定理を自動で証明するRust製のコマンドラインツール「Sheaf」がHacker NewsのShow HNで紹介された。量子化した埋め込みモデル、補題を探す索引、Lean 4のカーネルによる検証器を約25MBの1つの実行ファイルにまとめ、ローカルで動かす。実行時にPythonは要らない。作者はRyzen 5のノートPC級CPUと8GBのメモリで、自作の問題集の多くを解けたと報告している。","\n【概要】\nSheafは、Lean 4で書かれた定理の証明を自動で探すツールだ。量子化したRoPE方式のエンコーダー、SQ8で圧縮したHNSW方式の補題索引、Lean 4のカーネル検証器を、約25MBの1つの実行ファイルに収めている。クラウドのAIに頼らず、手元のCPUだけで動かすことを目指している。モデルはONNX形式で埋め込まれており、Leanの環境はelanで用意する。\n【背景】\nLeanのような証明支援系では、人が細かな証明の手順を書く必要があり、その手間が大きい。近年はAIで証明を探す研究が進んでいるが、多くは大きなGPUや外部サービスを前提にしている。Sheafは、小さな単体バイナリにまとめて、普通のPCで使える形にした。\n【詳細】\n証明すべき目標ごとに、そのまま実行する経路と、関連する補題を探して最良優先探索をする経路を振り分ける。証明の状態は内容のハッシュで管理する仮想ファイルシステムに置き、分岐や巻き戻しができる。最後はカーネルで検証し、使ってよい公理をpropext、Classical.choice、Quot.soundに限って、sorryの混入を防ぐ。同じところを回り続ける探索は重複として取り除く。作者の測定では、Ryzen 5 4600Hとメモリ8GBのCPUのみの環境で、単一モジュールの15問を159.7秒ですべて解き、状態機械の6問も51.8秒ですべて解いた。4つのフォルダが菱形に依存し合う5問は46.5秒、自己検証の8問は38.2秒で、いずれも全問を解いている。前提が未解決の3問のうち解けたのは2問だった。\n【ポイント・注意点】\ncargo build --releaseでビルドし、sheaf doctor、sheaf check、sheaf proveの順で使う。出力はNDJSONや差分表示などから選べる。前提はLean 4.36.0で、ライセンスはAGPL-3.0のみ。READMEは、最先端の研究数学のために作ったものではないとはっきり書いている。数値は作者自身による測定で、スターはまだ0だ。","2026-11-24","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50627688"],["Horus：古いAndroidスマホをコーディングエージェントの箱に","使わなくなったAndroidスマートフォンを、Claude Code、Codex、OpenCodeといったコーディングエージェントを動かす専用機に変えるアプリ「Horus」がHacker NewsのShow HNで紹介された。root化やTermuxなしで、本物のAlpine Linux（またはDebian 13）の作業環境をスマホの中に用意する。GitHubのスターは149に上り、HNには「2018年のスマホで動いている」という声も寄せられた。","\n【概要】\nHorusは、AndroidスマートフォンでClaude Code、Codex、OpenCodeを動かすためのアプリだ。root化もTermuxも使わずに、Alpine Linux（またはDebian 13）の作業環境を端末の中に作る。ネイティブの疑似端末とターミナル画面を備え、セッションはフォアグラウンドサービスとして動き続ける。\n【背景】\nコーディングエージェントは、長い時間をかけて作業を任せる使い方が増えている。そのためにPCをつけっぱなしにしたりクラウドのサーバーを借りたりするのは負担になる。Horusは、引き出しで眠っている古いスマホを、エージェント用の小さなLinuxの箱として生かそうという発想だ。作者の紹介デモでは、2021年の格安スマホでCodexがMNISTのネットワークを正解率97.97%まで学習させたという。\n【詳細】\n画面はReact Native、端末側の処理はKotlin、疑似端末はJNI経由のC言語で作られ、Linux環境はソースからビルドしたPRootで動かす。gitでのクローンやGitHubのリポジトリ選択に対応する。別に用意されたhorusというCLIを使うと、SSH接続、ポート転送、adb forwardによるペアリングができる。READMEは、分析ツールや広告を入れていないと明記している。Alpineのほか、Debian 13を作業環境に選ぶこともできる。HNのコメント欄では、利用者の1人が2018年のスマホで実際に動かしていると報告した。\n【ポイント・注意点】\n対応はARM64の端末に限られ、Android 7.0にあたるSDK 24以上が必要だ。F-DroidかGitHub ReleasesのAPKから導入できる。本体はMITライセンスだが、同梱のPRootはGPL-2.0以上など、部品ごとに条件が異なる。HNではiOS版の予定を尋ねる声があったが、その予定はリポジトリには書かれていない。スター149、フォーク39と、注目度は高い。ソースからビルドするには、Node 22.11以上、JDK 17、Android SDKとNDKが要る。","2026-11-24","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50627186"],["Clockoli：時間記録のSaaSをGitリポジトリで置き換え","検索エンジンManticore Searchの開発者が、チームの時間記録サービスをGitHubの非公開リポジトリで置き換えたブラウザ拡張「Clockoli」をHacker NewsのShow HNで公開した。Clockifyの無料プランが5人までに制限されたのがきっかけだ。記録はJSON Lines形式でリポジトリに保存され、サーバーも人数の制限もない。タイマー、カレンダー編集、チームの集計、請求書のPDF作成に対応し、ライセンスはGPL-3.0だ。","\n【概要】\nClockoliは、作業時間の記録を自前のGitHubリポジトリに保存するブラウザ拡張だ。投稿者は、Manticore Searchで働く開発者のSergeyと名乗っている。専用のサーバーを持たず無料で、利用人数にも上限がない。チームは約1か月、実際にこの道具で時間を記録しているという。\n【背景】\n投稿によると、チームが使っていたClockifyの無料プランが5人までに制限されたことが、作るきっかけになった。投稿者は、10人のチームで同じような機能を有料プランで使うと、Clockifyで年に約1,000ドル、Toggl Trackで約2,000ドルかかると比べている。そこで、GitHubの非公開リポジトリを記録の置き場にする方法を選んだ。専用のサーバーを立てて保守する必要がなく、記録はGitの履歴として残る。投稿の最後で、作者はこうした道具を使いたいかどうかを読者に尋ねている。\n【詳細】\n記録は、メンバーごとに自分のブランチへJSON Lines形式で書き込まれる。任意のWebページでタイマーを動かせ、タイムラインやカレンダーの形で記録を直せる。チームの集計表、CSVやJSONでの書き出し、ブラウザの中で作る請求書のPDFにも対応し、Clockifyからの取り込みもできる。時給のような情報はブラウザの中だけにとどまり、リポジトリには書き込まれない。各自が別々のブランチに書くので、複数人が同時に記録しても互いの書き込みがぶつかりにくい。\n【ポイント・注意点】\nChromium系のブラウザ向けにはChrome Web Storeで配られ、FirefoxとSafariは試験版がGitHubのリリースにある。投稿者自身も弱点として、GitHubに頼ること、リポジトリを読めるメンバーなら誰でも全員の記録を見られることを挙げている。記録を誰に見せるかを考えたうえで導入したい。ライセンスはGPL-3.0のみで、スターは79、フォークは7。開発する場合は、npm ciとnpm testのあと、展開したままの拡張としてブラウザに読み込む。","2026-11-24","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50627008"],["Rowkeep：Claudeのアーティファクト内に住む追記専用DB","Claudeのアーティファクトが持つ文書データベースを使い、追記専用の活動記録をサーバーなしで残す仕組み「Rowkeep」がHacker NewsのShow HNで紹介された。Claudeのスキルとして書き込み、行には番号を振って前の行の指紋とつなぐことで、後から書き換えると検査で分かる。顧客記録やフォローアップ、朝のまとめ機能も備える。Anthropicとは無関係の個人による実験的なプロジェクトで、ライセンスはApache-2.0。","\n【概要】\nRowkeepは、Claudeのアーティファクトに付いた文書データベースを記録帳として使う仕組みだ。データの書き込みはClaudeのスキルが受け持ち、外部のサーバーは要らない。追記専用の活動記録に加えて、顧客などの記録、フォローアップ、連絡の段取り、朝のまとめ、保管用の写しを扱える。READMEは、Anthropicとは独立しており、承認も受けていないと明記している。\n【背景】\n作者はHNのコメントで、冗談まじりに、Teams向けのデータベースがあればClaudeの外のシステムにつながなくてもClaudeの中にとどまれると書いた。業務の記録を別のサービスに分けず、AIとの会話の場所にまとめたいという考えが出発点にある。HNのタイトルが示すとおり、データベースそのものがClaudeのアーティファクトの中に置かれ、ほかに保存先を用意する必要がないのが特徴だ。\n【詳細】\n行には番号が振られ、前の行の指紋とつながる鎖になっているため、途中の変更は全体の検査で見つかる。締めの時点で合計を記録し、名前で記録を照合でき、予定したセッションにも対応する。READMEは、アシスタントがメールを送ることはないと書いている。作者は2026年11月に観測した制限として、アーティファクト1つあたり100MBと25,000文書、1文書あたり256KiBを挙げ、1つの記録帳に入るのは約8,000〜24,000行と見積もった。\n【ポイント・注意点】\nclaude.aiでrowkeep.skillをスキルとしてアップロードし、「set up Rowkeep」と話しかけると始められる。スクリプトはPython 3.8以上の標準ライブラリだけで動き、画面はJavaScriptで書かれ、試験にはNode 22を使う。ライセンスはApache-2.0。試験は5,000行で行ったが、上限に近い量はまだ実際に動かしていないという。作者1人で作られ、公開から数日しかたっていない実験段階のもので、大事なデータを任せるのは慎重に考えたい。","2026-11-24","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50626952"],["Seabraid：NVIDIAとAMDのGPUで1つのMoE層を分担","NVIDIAとAMDという異なるメーカーのGPUが、同じMoE（専門家混合）モデルの1つの層を分け合って計算する実行環境「Seabraid」がHacker NewsのShow HNで公開された。CUDAとROCmのカードがそれぞれ専門家の一部を持ち、メーカーごとに1つのプロセスを立てて、共通のC言語の境界でつなぐ。中核はRustで、Pythonからも使える。ただしREADMEは、標準の構成より速くなることはまだ示せていないと率直に書いている。","\n【概要】\nSeabraidは、NVIDIAのGPU（CUDA）とAMDのGPU（ROCm）を1台のマシンで一緒に使い、MoEモデルの同じ層を分担して動かすための実行環境だ。各カードが専門家の一部を持って計算し、メーカーごとに1つのプロセスを立て、特定のエンジンに依存しないC言語の境界でつなぐ。現在の版は0.5.0-alpha.8で、「アルファ版、自己責任で使うこと」とされている。\n【背景】\n大きなMoEモデルを手元で動かすには多くのGPUメモリが要る。手持ちのGPUがメーカーの違う組み合わせだと、ふつうは一緒に使うのが難しい。Seabraidは、こうした混在した構成でも1つのモデルを分け合って載せられるようにすることを狙っている。メーカーごとにプロセスを分けることで、CUDAとROCmという別々の仕組みを1つのプログラムに押し込まずに済む。\n【詳細】\n中核はRustで書かれ、C言語のヘッダーとPythonのバインディングを持つ。測定は1台のマシンで、各条件6回、IQ3_Sの量子化で2,000トークンを生成して行われた。AMDのR9700をメイン、NVIDIAのRTX 3090を補助にした場合は平均94.8トークン毎秒、役割を逆にすると106.7トークン毎秒だった。補助のプロセスを止めても、失敗したのは1件のリクエストだけで、0.33〜0.46秒で処理が続いたという。片方のGPUに問題が起きても、サービス全体は止まらずに動き続けられることを示した形だ。\n【ポイント・注意点】\npip install seabraidで導入でき、Linux x86-64、glibc 2.34以上、Python 3.11以上が条件となる。cargoでも追加できる。正式な対象はLinux x86-64で、Windowsは試験的、macOSは未確認だ。READMEは、標準の構成と比べて速くなることは示せていないとはっきり書いており、速さよりも、異なるGPUを組み合わせられることに意味がある段階といえる。ライセンスはApache-2.0とMIT。","2026-11-24","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50625445"],["mac-alpha-zero：MacBook AirでAlphaZero流の学習を回す","Apple Silicon向けの機械学習フレームワークMLXの上で、AlphaZero流の自己対局による強化学習を行うライブラリ「mac-alpha-zero」がHacker NewsのShow HNで紹介された。投稿タイトルは、1台のMacBook Airでオセロを1時間学習させたというもの。ゲームの種類に依存しない作りで、Metalの専用カーネルでモンテカルロ木探索をまとめて実行する。四目並べとオセロに対応し、チェスと9路盤の囲碁は予定にとどまる。","\n【概要】\nmac-alpha-zeroは、MacのApple Siliconだけで、AlphaZeroと同じような自己対局の強化学習を行うためのライブラリだ。HNの投稿タイトルは、1台のMacBook Airで1時間オセロを学習させたと紹介している。四目並べは最初から最後まで学習でき、オセロもゼロから学習させられる。チェスと9路盤の囲碁は今後の予定とされている。\n【背景】\nAlphaZeroのような手法は、大量の自己対局と探索が必要で、ふつうは多くのGPUを使う。このライブラリは、AppleのMLXと、GPUを直接動かすMetalの専用カーネルを使い、ノートPCでも試せる規模に収めた。探索をまとめて処理することで速さを稼いでいる。ゲームの種類に依存しない作りなので、ルールを用意すれば別のゲームにも広げられる設計になっている。\n【詳細】\nまとめて実行するモンテカルロ木探索、PUCTとGumbelの2つの根の選び方、経験を蓄えるリプレイバッファ、オセロの強豪ソフトEdaxとの対戦評価を備える。READMEの結果は、Apple M5と24GBのメモリで、1回だけ、1つの乱数の種で行ったもの。Edax 4.6のレベル1に対し、探索32回で100局中90勝1分け9敗、得点0.905となった。探索128回では0.990、512回では1.000だった。探索の速さは、256件をまとめた場合に毎秒70,485回で、比較したmctxの18,899回を上回った。\n【ポイント・注意点】\nPython 3.10以上とMLX 0.32.4以上が必要で、pipやuvで導入できる。ライセンスはMIT。注意したいのは、HNのタイトルが「1時間」なのに対し、READMEの主な結果は「2時間の自己対局」で、評価を含めた学習時間は2時間29分だった点だ。また結果は1回の実行によるもので、ばらつきは確かめられていない。レベル2のEdaxに対しては、探索32回で0.605、128回で0.820、512回で0.960と、相手が強くなると得点は下がる。メモリ使用量の最大は1.692GiBだった。","2026-11-24","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50624664"],["Genesis Map：エージェントの変更が壊しうる箇所を地図に","コーディングエージェントが加えた変更を「業務の流れの地図」に描き、テストされていない箇所や危うい変更を知らせる道具「Genesis Map」がHacker NewsのShow HNで公開された。Claude CodeとCodexのスキルとして動き、Pythonで最も正確に働く。作者の比較では、テスト不足を見つけた割合がClaude Codeで8%から38%に上がり、1回のレビューあたりの誤った警告は2.1件から0.7件に減ったという。","\n【概要】\nGenesisは、コードベースを業務の流れの地図に変え、エージェントの変更のうち、テストされていないものや危ないものに印を付ける道具だ。Claude CodeとCodexのスキルとして動く。対応言語はPythonが最も正確で、TypeScript、Go、Java、Rustなどにも対応する。ライセンスはApache-2.0。\n【背景】\n作者はHNで、エージェントが書くコードの速さに人のレビューが追いつかないうえ、エージェントの「問題ありません」という報告も信用しきれないと述べた。そこで、変更が業務のどの流れに関わり、どこが壊れうるのかを目で確かめられる形にしようと考えたという。地図は業務の流れごとに整理されるため、コードを1行ずつ読まなくても、変更の影響が及ぶ範囲をつかみやすい。\n【詳細】\n作者が示した比較では、何も足さないClaude CodeとCodexに対し、Genesisを使うとテスト不足を見つけた割合がClaude Codeで8%から38%に、Codexで4%から23%に上がった。1回のレビューあたりの誤った警告は、2.1件から0.7件、1.4件から0.5件に減った。一方で、本当の危険を挙げた数は2.9件から2.8件、2.4件から2.4件とほぼ変わらない。READMEの評価では、5つのオープンソースのPythonプロジェクトから選んだ10件のコミットを、それぞれ3回ずつ調べている。テストの網
