の運用が必要だ。Cloudflareとは無関係のプロジェクトで、移行の可否は対応表で確認すべきだ。","2026-11-12","GitHub","https://github.com/rivet-dev/open-orange"],["「ai-texture-forge」：文章からBlender用テクスチャを生成","文章からBlender用のテクスチャを作る「ai-texture-forge」が公開された。継ぎ目のないPBR素材やコンセプトアート、場面全体への投影に対応し、ローカルのGPUでもクラウドでも動く。11月11日に生まれ、約680スターを集めている。生成の履歴は保存して呼び戻せる。対応はWindows x64とBlender 4.2以降だ。ローカルの拡散モデルとクラウドの提供者を選べる。","\n【概要】文章からBlender用のテクスチャを作る「ai-texture-forge」が公開された。継ぎ目のないPBR素材やコンセプトアート、場面全体への投影に対応し、ローカルのGPUでもクラウドでも動く。11月11日に生まれ、約680スターを集めている。MITライセンスで公開されている。【背景】テクスチャ探しは、素材集を何時間も探し、継ぎ目を手で直す手間のかかる作業だった。AI生成をBlenderの画面の中で完結させれば、試作の回転が速くなる。この拡張は、生成から貼り付けまでを1つの画面にまとめた。【詳細】使い方は、Nパネルに「weathered copper, green patina, seamless」のような文章を入れ、提供者を選ぶだけだ。色や粗さ、法線の地図が1回の操作で貼られ、継ぎ目のないタイル状の仕上がりになる。深さを読み取った投影で、場面全体を一度に着色することもできる。欠けた部分の補修や外側への拡張、4倍へのアップスケールにも対応する。ローカルの拡散モデルとクラウドの提供者を選べ、生成の履歴は保存して呼び戻せる。テクスチャ探しは、素材集を何時間も探し、継ぎ目を手で直す手間のかかる作業だった。AI生成をBlenderの画面の中で完結させれば、試作の回転が速くなる。文章で指示するだけで、色や粗さ、法線の地図まで一度に作れる点が便利だ。欠けた部分の補修や外側への拡張、4倍へのアップスケールにも対応する。【ポイント・注意点】対応はWindows x64とBlender 4.2以降で、ローカル生成には十分なVRAMを持つGPUが要る。クラウドを使う場合は鍵と利用料が別途必要だ。生成物の権利は使うモデルの条件に従う。説明書の一部に、姉妹プロジェクトの名前が残るなど、作りたての粗さも見られる。ローカル生成には十分なVRAMを持つGPUが要り、クラウドを使う場合は鍵と利用料が別途必要だ。説明書の一部に姉妹プロジェクトの名前が残るなど、作りたての粗さも見られる。試してみたい。","2026-11-11","GitHub","https://github.com/linknimiball1974/ai-texture-forge"],["「TelemetryCleaner」：国行Androidの通信モジュールを整理","中国向けAndroidに入った通信モジュールを整理する「TelemetryCleaner」が公開された。Shizukuを使い、rootなしでSystemHelperやRegServiceなどのプリインストール部品を確認し、削除や復旧ができる。11月11日に生まれ、約1,270スターを集めている。削除は選んだ領域ごとに実行され、復旧はシステムに残るAPKから行う。","\n【概要】中国向けAndroidに入った通信モジュールを整理する「TelemetryCleaner」が公開された。Shizukuを使い、rootなしでSystemHelperやRegServiceなどのプリインストール部品を確認し、削除や復旧ができる。11月11日に生まれ、約1,270スターを集めている。MITライセンスで公開されている。【背景】一部の中国向けファームウェアには、通信事業者の端末管理部品が入っており、裏で定期的にデータを集めるとされる。設定画面がなく、通常の方法では無効化も削除もできない。作者は自分のOPPO端末で、位置情報や端末識別子、インストール済みアプリの情報を読む動きを確認したという。【詳細】Android 10以降で動き、ShizukuをADBや無線デバッグで起動して使う。検出が終わると、各部品の権限やインストール状態を確認し、選んだものをまとめて操作できる。対象は中国移動・中国電信・中国聯通の部品で、OPPOやXiaomi、ファーウェイ、Honor、魅族などの包名が一覧になっている。削除は選んだ領域ごとに実行され、復旧はシステムに残るAPKから行う。自動の定期チェックも設定できる。一部の中国向けファームウェアには、通信事業者の端末管理部品が入っており、裏で定期的にデータを集めるとされる。設定画面がなく、通常の方法では無効化も削除もできない。作者は自分のOPPO端末で、位置情報や端末識別子、インストール済みアプリの情報を読む動きを確認したという。【ポイント・注意点】一部のvivo機種では、システムの保護対象のためrootなしの削除ができない。削除は自己責任で、端末の動作に影響する恐れがある。作者は学習目的としており、通信事業者には入網や運用のために必要な収集もあると注記している。対象は中国向け端末が中心で、他の地域の端末では関係ない場合が多い。一部のvivo機種では、システムの保護対象のためrootなしの削除ができない。削除は自己責任で、端末の動作に影響する恐れがある点に注意したい。","2026-11-11","GitHub","https://github.com/Eynnzerr/TelemetryCleaner"],["「relax」：Rustを待たずに走らせるJITコンパイラ","Rustを待たずに走らせるJIT「relax」が公開された。rustcやLLVM、リンカを使わず、ソースから直接実行し、編集中の変更を動いているプログラムへ差し込む。Makepadによるもので、11月11日に生まれ、約580スターを集めている。型と借用の検査も行い、パニック時は処理を止めて中身を調べられる。対応はLinux x86-64とmacOS arm64が中心で、Windowsは未検証だ。","\n【概要】Rustを待たずに走らせるJIT「relax」が公開された。rustcやLLVM、リンカを使わず、ソースから直接実行し、編集中の変更を動いているプログラムへ差し込む。Makepadによるもので、11月11日に生まれ、約580スターを集めている。MITライセンスで公開されている。【背景】Rustのビルド待ちは、大きなプロジェクトでは数分かかることもある。AIエージェントが何度も試行する場面では、その待ち時間が積み重なる。relaxは、コンパイルと実行を同時に行うことで、編集と実行の往復を速くすることを目指した。【詳細】仕組みは、関数が初めて呼ばれるときにコンパイルし、よく使う関数を動いている間に最適化する。大きな3Dゲームでは、まっさらな状態から最初の画面まで約3分だったものが、M4のMacBookで11秒になったという。ファイルを保存すると、変わった関数だけを再検査して差し替え、状態は保たれる。テストは保存の2.2秒後に92件が再実行されたという。型と借用の検査も行い、パニック時は処理を止めて中身を調べられる。実行速度は最適化ビルドよりx64で1.12倍、arm64で1.24倍の時間がかかる。Rustのビルド待ちは、大きなプロジェクトでは数分かかることもある。AIエージェントが何度も試行する場面では、その待ち時間が積み重なる。コンパイルと実行を同時に行うことで、編集と実行の往復を速くできる。【ポイント・注意点】AIが生成したRustの再実装で、Rustプロジェクトとは無関係と明記されている。安全なコードの保証は、relax自身の検査が正しい範囲に限られる。配布するものは必ずcargo build --releaseで作るべきだ。対応はLinux x86-64とmacOS arm64が中心で、Windowsは未検証。まだ実験段階で、粗さが残る。AIが生成したRustの再実装で、Rustプロジェクトとは無関係と明記されている。配布するものは必ずcargo build --releaseで作るべきだ。","2026-11-11","GitHub","https://github.com/makepad/relax"]],"gh-blog":[["Copilot、12月14日に6モデル廃止へ 代替の確認を","GitHubが2026年12月14日に、Claude Fable 5やGemini 3.8 Flashなど6つのモデルをGitHub Copilotの全画面から廃止すると発表した。チャットやインライン編集、エージェントモード、コード補完のすべてが対象になる。5モデルには代替が示されたが、Kimi K3の後継はまだ未発表だ。個人の年額プランではClaude Haiku 4.5が残る例外もある。モデル名を固定した設定は期日までの見直しが要る。","\n【概要】GitHubは2026年11月13日付の変更履歴で、同年12月14日に6つのAIモデルをGitHub Copilotから廃止すると発表した。対象はClaude Fable 5、Claude Haiku 4.5、Gemini 3.8 Flash、Gemini 4 Argon、Grok 4.6、Kimi K3で、Copilot Chatやインライン編集、質問モード、エージェントモード、コード補完のすべてから姿を消す。5モデルには後継が示されたが、Kimi K3の後継は「未発表」のままだ。\n【背景】Copilotは今や1つのアシスタントではなく、複数の大規模モデルを切り替えて使う仕組みになっている。GitHubは2026年11月にClaude Fable 5.2やGemini 4 Carbon、Gemini 4 Hydrogenを相次いで追加し、モデル一覧は1週間で大きく入れ替わった。古いモデルを残し続けると一覧が膨らみ、利用者がどれを選べばよいか分からなくなる。今回の廃止は、新しいモデルへの移行を促す整理の一環といえる。\n【詳細】GitHubが示した代替は、Fable 5がFable 5.2、Haiku 4.5がHaiku 5.5、Gemini 3.8 FlashがGemini 4 Hydrogen、Gemini 4 ArgonがGemini 4 Carbon、Grok 4.6がGrok 4.7となっている。Kimi K3だけ後継が決まっていない。例外として、Claude Haiku 4.5は個人のCopilot年額プラン契約者には引き続き提供される。料金や座席数、プラン構成の変更はない。GitHubは「期日までにワークフローや連携を対応モデルへ更新してほしい」と呼びかけている。\n【ポイント・注意点】組織では、既定のモデル有効化がオンなら代替モデルが自動で表示される。管理者が既定をオフにしていたり個別に無効化していたりすると、代替が表示されず、旧モデルだけが消える恐れがある。モデル名をスクリプトや設定ファイルに直接書いている場合は自動で切り替わらないため、12月14日までに探し出して書き換えること。Kimi K3を使っている人は、後継の発表を待つ間に他の代替を試しておくと安心だ。","2026-11-16","Make Tech Easier","https://maketecheasier.com/github-copilot-models-retired-14-december/"],["Copilotのモデル切替、12月15日の分かれ目は管理設定","GitHubがCopilotの6モデルを2026年12月14日に廃止すると発表したが、12月15日に何が起きるかは組織の管理設定で決まる。既定のモデル有効化がオンなら代替モデルが自動で表示されるが、オフにしていると何も表示されないままになる。個人プランでは自分で選び直すだけだが、組織では管理者の設定確認が欠かせない。同じ日に一般提供が始まったGemini 4 Hydrogenは、廃止モデルの代替とは別の扱いだ。","\n【概要】GitHubは2026年11月13日の変更履歴で、12月14日に6つのモデルをCopilotから廃止すると発表した。注目すべきは、廃止日そのものよりも「代替モデルが自動で表示されるかどうかは管理設定次第」という点だ。Copilot BusinessやEnterpriseでは、既定のモデル有効化がオンの場合に限り、後継モデルが自動で有効になる。設定をオフにしていると、旧モデルが消えた後に何も表示されない状態になりかねない。\n【背景】Copilotは今、複数の提供元のモデルを切り替えて使う仕組みだ。個人プランでは利用者がモデル選択画面で自分で選ぶが、組織プランでは管理者がモデルポリシーで1つずつ許可する。さらに「既定の有効化」という全体設定があり、これがオンだと新しいモデルが自動で一覧に加わる。GitHubはこの仕組みを以前から使っており、今回の廃止でも同じ規則が後継モデルに適用される。\n【詳細】廃止されるのはClaude Fable 5、Claude Haiku 4.5、Gemini 3.8 Flash、Gemini 4 Argon、Grok 4.6、Kimi K3の6モデルで、チャットやインライン編集、エージェントモード、コード補完のすべてが対象になる。個人の年額プランではClaude Haiku 4.5だけが残る例外がある。同じ11月13日に一般提供が始まったGemini 4 Hydrogenは、Googleの最新Flashモデルで、高速なエージェント作業向けと説明されている。ただしGitHubはこれを廃止モデルの代替とは呼んでおらず、別の発表として扱うべきだ。\n【ポイント・注意点】個人利用者は、廃止日までにモデル選択画面で後継を試しておくのがよい。組織の管理者は、既定の有効化がオンか、代替モデルが個別に無効化されていないかを確認すること。モデル名を直接指定するスクリプトや拡張機能、社内ツールは自動では切り替わらないため、期日までに書き換えが必要だ。削除そのものの作業は不要で、GitHub側で一覧から消える。","2026-11-15","Pickuma","https://pickuma.com/for-dev/github-copilot-model-deprecation-december-2026/"],["Copilotから6モデル消える日、Kimi K3だけ後継未定","GitHubは2026年12月14日に、Copilotの6モデルをすべての画面から廃止する。代替は5モデルに示されたが、Kimi K3の後継はまだ決まっていない。Claude Haiku 4.5は個人の年額プラン契約者に限って残る。モデル名を直接指定したワークフローや設定は自動では切り替わらないため、12月14日までに後継を試し、書き換えておく必要がある。何も選んでいない利用者には、既定のモデルが更新される。","\n【概要】2026年12月14日、6つのモデルがGitHub Copilotから一斉に消える。対象はClaude Fable 5、Claude Haiku 4.5、Gemini 3.8 Flash、Gemini 4 Argon、Grok 4.6、Kimi K3で、チャットやインライン編集、質問モード、エージェントモード、コード補完のすべてが対象だ。GitHubは11月13日に一覧を公表し、1か月の猶予を設けた。5モデルには後継が示されたが、Kimi K3の後継は「未発表」のままで、利用者は切り替え先を自分で探す必要がある。\n【背景】Copilotのモデル廃止は今回が初めてではない。同じ形が繰り返されており、1か月前の告知、代替の一覧表、そして1つだけ未定の枠という組み立てだ。モデルを名指しで固定する使い方は、いつか期限切れになる賭けだといえる。今回の教訓は、できるだけ「速いモデル」「強いモデル」のような役割で指定し、名前への依存を減らすことだ。\n【詳細】代替はFable 5がFable 5.2、Haiku 4.5がHaiku 5.5、Gemini 3.8 FlashがGemini 4 Hydrogen、Gemini 4 ArgonがGemini 4 Carbon、Grok 4.6がGrok 4.7となっている。Haiku 4.5は個人の年額プラン契約者に限り廃止の対象外だ。注目すべきはGemini 4 Hydrogenで、11月12日に登場したばかりのモデルがFlashの後継に指名された。100万トークンの文脈を持ち、入力100万トークンあたり1.50ドル、出力7.50ドルとされている。Googleは独自指標でTerminal-Bench 4.1が18.2%から57%へ上がり、作業完了が2.5倍速くなったとしている。\n【ポイント・注意点】個人利用者は今週中に後継モデルを1日試し、自分の作業での振る舞いを確かめるのがよい。チーム管理者はモデルポリシーを確認し、既定の有効化がオフなら代替を手動で有効にすること。自動化や設定ファイルにモデル名が書かれている場合は、12月13日までに書き換えて最終確認をすること。何も選ばず既定のまま使っている人は、既定が更新されるため大きな影響はないが、念のため確認しておきたい。","2026-11-14","DEV","https://dev.to/aheadkit/github-copilot-is-dropping-6-models-on-dec-14-heres-what-replaces-each-one-1g8c"],["Copilotのモデル選択画面、4日で3つ目の新顔が登場","GoogleのGemini 4 Hydrogenが2026年11月13日にGitHub Copilotで一般提供となり、4日間で3つ目の新モデルがモデル選択画面に加わった。11月9日のClaude Fable 5.2、11月10日のGemini 4 Carbonに続く登場だ。Hydrogenは高速なエージェント作業向けのFlash級モデルで、12月14日に廃止されるGemini 3.8 Flashの後継に指名されている。","\n【概要】Gemini 4 Hydrogenが2026年11月13日、GitHub Copilotで一般提供となった。Googleの最新Flashモデルで、高速で効率的なエージェント作業やツール利用、複数段階の作業向けと説明されている。Copilot Pro、Pro+、Max、Business、Enterpriseが対象で、VS CodeやVisual Studio、Copilot CLI、コーディングエージェント、Copilotアプリ、GitHubサイト、モバイル、JetBrains IDE、Xcode、Eclipse、Copilot SDKで選べる。提供は段階的に広がる。\n【背景】Copilotのモデル選択画面は、2026年11月に急速に入れ替わっている。11月9日にClaude Fable 5.2が一般提供となり、11月10日にはGemini 4 Carbonが続いた。Hydrogenはその4日後で、1週間で3つの新モデルが加わった計算になる。GoogleやAnthropicが月単位でモデルを更新するようになり、モデル選びは四半期に一度の判断から、繰り返し見直す作業へと変わりつつある。\n【詳細】HydrogenとCarbonの役割は異なる。Carbonは複雑なコーディングや推論、セキュリティ重視の作業向けで、Hydrogenは速さが求められる単純で量の多いエージェント作業向けだ。間違ったモデルを選ぶことが、今では古いモデルを使うことよりも多い失敗要因になっている。同じ変更履歴では、Gemini 3.8 Flashが2026年12月14日に廃止され、Hydrogenが後継に指名された。ほかにもClaude Fable 5、Claude Haiku 4.5、Gemini 4 Argon、Grok 4.6、Kimi K3が同じ日に廃止される。\n【ポイント・注意点】組織では、新しいモデルは既定で自動有効になる。管理者が既定の有効化をオフにしている場合は、手動で有効にしないと利用者に表示されない。ワークフローや拡張機能の設定、社内文書に特定のモデル名を固定している場合は、12月14日までに見直すこと。Kimi K3の後継がまだ発表されていない点も、引き続き確認したい。料金は従量課金で、提供元の定価に基づく。","2026-11-14","Pondero","https://pondero.ai/news/2026-11-14-copilot-gemini-4-hydrogen-ga/"],["主要パッケージの週間更新、Node.jsは全LTSで安全性修正","2026年11月7日から14日の1週間で、追跡する87パッケージのうち35件に変更があった。Node.jsは3つのLTS系列すべてでセキュリティ版を出し、HTTP/2とTLSの高深刻度の問題を直した。Grafanaは6件のCVE、Gradleは重大1件を含む3件の勧告に対応した。Rust 1.100.0ではnever型と独自アロケーターが安定化し、Kyverno 1.20.0は古いポリシーエンジンを削除した。","\n【概要】技術ブログの週間まとめによると、2026年11月7日から14日の期間に追跡対象の87パッケージのうち35件が更新された。目立つのはセキュリティ修正の多さで、Node.jsは3つのLTS系列すべてにセキュリティ版を出し、GrafanaやGradle、Podmanも脆弱性対応を行った。機能面ではRust 1.100.0がnever型と独自アロケーターAPIを安定化させ、Kyverno 1.20.0は古いポリシーエンジンを削除した。\n【背景】このまとめは毎週、主要な開発ツールの更新をGitHubの変更履歴やコミット履歴から読み取って整理している。今週はGitHubのリリースページが読みにくかったため、変更履歴のあるものはその内容を、ないものはタグまでのコミット履歴を読んでまとめている。コミット履歴だけのものは、破壊的変更があるかどうかを確認できていないと明記されている。\n【詳細】Node.jsはv26.13.1、v24.22.3、v22.23.5を出し、HTTP/2のストリーム処理やTLSの再開・再交渉に関する高深刻度の問題などを修正した。Grafanaは13.3.1など4系列で6件のCVEに対応し、Gradleは9.9.1と8.14.7で重大度9.3を含む3件の勧告に対処した。Rust 1.100.0はnever型と独自アロケーターAPIを安定化。Kyverno 1.20.0は従来のポリシーエンジンを削除したため、更新前の確認が必要だ。VS Codeは1.146.0でMCPとワークスペース信頼性の堅牢化を行い、FastAPI 0.162.6はPython 3.10の対応を終了した。\n【ポイント・注意点】Node.jsやGrafana、Gradleを使っている場合は、同じパッチ系列の最新版へ早めに上げるのがよい。Kyvernoは古いポリシーエンジンが消えるため、移行の確認なしに上げると動かなくなる恐れがある。FastAPIはPython 3.10で動かしている場合、先にPythonの更新が必要だ。コミット履歴のみでまとめられた項目は破壊的変更の有無が未確認のため、更新後に差分や動作を確かめること。","2026-11-14","SeungAh Hong Tech Blog","https://seungahhong.github.io/en/posts/2026-11-14-package-release-weekly/"],["公開監視アラート、直接リンクで共有できるように","GitHub Enterprise Cloudの公開監視アラートに、個別の直接リンクが付いた。アラート番号をクリックするとそのアラートの詳細ページが開き、URLをブックマークしたり同僚と共有したりできる。対象はGitHub Secret ProtectionかGitHub Advanced Securityを持つEnterprise Cloudの利用者で、追加料金はかからない。小さな改善だが、セキュリティ対応の連絡がしやすくなる。","\n【概要】GitHubは2026年11月12日の変更履歴で、公開監視アラートに個別の直接リンクを付けたと発表した。企業の公開監視画面でアラート番号をクリックすると、そのアラートの詳細ページが開く。URLはブックマークや共有に使える。公開監視は、GitHub Enterprise CloudでGitHub Secret ProtectionまたはGitHub Advanced Securityを持つ利用者が追加料金なしで使える機能だ。\n【背景】公開監視は、組織の公開リポジトリに漏れた秘密情報などを監視する仕組みだ。これまではアラートの一覧から目的のものを見つけて開く必要があり、特定のアラートを同僚に伝えるには画面の説明が必要だった。直接リンクが付いたことで、チャットや課題管理ツールにURLを貼るだけで同じアラートを開けるようになる。\n【詳細】使い方は簡単で、公開監視の画面でアラート番号をクリックするだけだ。開いた詳細ページのURLをそのまま共有できる。アクセスできるのは、そのアラートを見る権限を持つ同僚に限られる。GitHubは詳しい使い方として、公開監視アラートの表示と管理に関するドキュメントへのリンクを示している。意見はコミュニティの議論で受け付けている。\n【ポイント・注意点】この変更は画面の使い勝手をよくするもので、監視の対象や検出の仕組み自体は変わっていない。URLを共有しても、権限のない人は開けないため、社外に誤って送っても内容は見られない。とはいえ、アラートの存在自体が伝わる場合があるため、共有先は社内の関係者に限るのが無難だ。公開リポジトリへの秘密情報の混入に気づいたら、リンクを添えて担当者へ早く知らせる使い方に向いている。この機能は追加料金なしで使えるため、すでにSecret ProtectionやAdvanced Securityを契約している組織は、設定なしに利用できる。アラートのURLを課題管理ツールに貼っておけば、対応の進み具合も追いやすくなる。公開リポジトリに秘密情報が混入したときは、早く見つけて早く知らせることが大切で、直接リンクはその一助になる。","2026-11-12","GitHub Changelog","https://github.blog/changelog/2026-11-12-public-monitoring-alerts-now-have-direct-links"],["GitHub Actions、ARM32の実行を12月8日に終了へ","GitHubは2026年12月8日までに、ホスト型ランナーでのARM32ジョブ実行の対応を終えると発表した。LinuxとWindowsが対象で、64ビットARM上で32ビットのプログラムを動かすAArch32ユーザー空間の実行も外れる。理由はNode.js 20の終了で、現在のNode 24がARM32に対応していないためだ。ARM32で動かしているワークフローは、期日までの移行が必要になる。","\n【概要】GitHubは2026年11月12日の変更履歴で、GitHub Actionsのホスト型ランナーがARM32ジョブの実行の対応を終えると発表した。期日は2026年12月8日で、LinuxとWindowsの両方が対象だ。同時に、64ビットARM上で32ビットのプログラムをそのまま動かすAArch32ユーザー空間の実行の対応もなくなる。\n【背景】GitHub ActionsはJavaScriptのアクションを動かすのめにNodeの実行環境を使っている。Node 20は2026年4月に寿命を終え、9月23日にActionsのランナーから除かれた。現在のランナーはNode 24を使うが、Node 24はARM32を公式に対応していない。対応する実行環境がない以上、ランナー自体もARM32のジョブを動かし続けられないのが、今回の廃止の理由だ。\n【詳細】対象はGitHubが用意するホスト型ランナーのLinuxとWindowsで、ARM32ジョブの実行とネイティブのAArch32ユーザー空間実行がなくなる。ARM32とARM64は別物で、互換性はない。自前で用意するランナーについても、ARM32やmacOS 13.4以前はNode 24の対応外とされている。発表は短く、影響を受ける第三者のアクションやコンテナ像の一覧は示されていない。詳しくはGitHubのコミュニティの議論が案内されている。\n【ポイント・注意点】ワークフローでARM32を使っているかどうか、期日までに確かめること。32ビットARM向けのビルドやテストをホスト型ランナーで動かしている場合は、arm64の環境への移行が必要だ。期日までは発表から3週間半ほどしかないため、影響範囲の調査を早めに始めたい。ARM32のソフト開発自体が終わるわけではなく、対象はGitHubのホスト型ランナーに限られる点にも注意したい。移行先としては、arm64のランナー環境を選ぶのが筋だ。コンテナやアクションのうちARM32に依存するものは、arm64対応の版があるか確かめること。GitHubはこの廃止を「Retired」として変更履歴に載せ、同じ月の別の項目ではpull_request_targetの既定の変更なども進めている。期限までに移行できないワークフローは、12月8日以降に動かなくなる恐れがある。","2026-11-12","GitHub Changelog","https://github.blog/changelog/2026-11-12-actions-for-arm32-linux-windows-retirement/"],["企業のGitHubアプリ、Copilotの座席管理ができるように","Enterprise GitHubアプリが、企業レベルのCopilot座席管理APIを呼べるようになった。どの利用者やチームにCopilotの座席を割り当てるかを、アプリ経由で制御できる。新しい企業向けの細かい権限「Enterprise Copilot license management」が必要になる。手作業だった座席の割り当てを自動化しやすくなり、大規模な組織での運用が楽になる。","\n【概要】GitHubは2026年11月10日の変更履歴で、Enterprise GitHubアプリが企業レベルのCopilot座席管理APIを呼べるようになったと発表した。これにより、どの利用者や企業チームにCopilotの座席を割り当てるかを、アプリから制御できるようになる。利用には新しい企業向けの細かい権限「Enterprise Copilot license management」が必要だ。\n【背景】Copilotの座席管理はこれまで、企業の管理者が画面で操作するか、限られた手段でしか行えなかった。組織が大きくなると、入社や異動、チーム変更のたびに座席を手で割り当て直す作業が増える。APIが使えるようになれば、人事システムや社内の管理ツールとつなげて、座席の割り当てを自動化できる。\n【詳細】座席管理APIは企業レベルで動作し、利用者や企業チームへの座席の割り当てを制御する。アクセスには新しい権限が必要で、GitHubアプリにその権限を付与する形になる。GitHubは詳しい使い方として、企業向けCopilot座席管理APIのドキュメントを示している。変更は改善として分類されており、2026年11月10日のリリースとして記録されている。\n【ポイント・注意点】この機能はEnterpriseプランの利用者が対象で、個人や小規模な組織には関係しない。APIを使うには、GitHubアプリへの権限付与が必要なため、企業の管理者と相談して設定すること。座席の割り当てを自動化する場合は、誰に座席が必要かを決める社内の規則を先に整えておきたい。誤って座席を外すと利用者がCopilotを使えなくなるため、自動化の前に小さい範囲で試すのが安心だ。座席の割り当てを自動化すると、入社や異動のたびに手で操作する手間が減る。反面、誤って座席を外すと利用者が使えなくなるため、まずは少人数で試すのがよい。APIの利用には、アプリへの権限付与と、企業の管理者による承認が必要になる。社内の規則を先に決め、誰に座席を割り当てるかを明確にしてから自動化すると、運用が安定する。","2026-11-10","GitHub Changelog","https://github.blog/changelog/2026-11-10-github-app-support-for-enterprise-copilot-seat-management"],["Gemini 4 CarbonがCopilotに登場、複雑な作業向け","Gemini 4 Carbonが2026年11月10日にGitHub Copilotで一般提供となった。Googleの最新モデルで、複雑なコーディングや推論、セキュリティ重視の作業向けとされる。対象はPro+、Max、Business、Enterpriseで、FreeとProは使えない。料金は従量課金で提供元の定価に基づく。まずは段階的な提供の進み具合を確かめ、自分の環境で選べるようになったら試すのがよい。","\n【概要】GoogleのGemini 4 Carbonが2026年11月10日、GitHub Copilotで一般提供となった。複雑なコーディングやエージェント作業、推論を得意とし、安全なコード生成やセキュリティ重視の作業に向くと説明されている。料金は提供元の定価に基づく従量課金だ。\n【背景】Copilotのモデル一覧は2026年11月に急速に入れ替わっている。11月9日にClaude Fable 5.2が一般提供となり、翌日にCarbonが続いた。Googleは、大半のソフトウェア開発にはGemini 4 Argonが向くとし、Carbonは難しい課題向けと位置づけている。同じ週にはGemini 4 Hydrogenも加わり、使い分けが求められる。\n【詳細】CarbonはVS CodeやVisual Studio、Copilot CLI、コーディングエージェント、Copilotアプリ、GitHubサイト、モバイル、JetBrains IDE、Xcode、Eclipseの10画面でモデル選択画面から選べる。提供は段階的に広がるため、まだ見えない場合もある。BusinessやEnterpriseの管理者は、モデルポリシーで利用を制御できる。既定の有効化がオンなら、新しいモデルは自動で有効になる。\n【ポイント・注意点】Carbonを使えるのはCopilot Pro+、Max、Business、Enterpriseで、FreeとProは対象外だ。管理者は、既定の有効化がオンか、Carbonが個別に無効化されていないかを確かめること。同じ週の別の発表では、Gemini 4 Argonが2026年12月14日に廃止され、Carbonが後継に指名されている。Argonを使っている人は、期日までにCarbonを試しておくと安心だ。Carbonは、Gemini 4の系列のなかで最も難しい課題に向けた位置づけで、Argonは大半の開発作業、Hydrogenは速さを重視する用途とされている。モデルを選ぶときは、作業の難しさと求める速さを考えて決めるとよい。Copilotのモデル一覧は公式の文書で確かめられる。提供元の定価に基づく従量課金のため、使う量が多い場合は料金の様子も見ておきたい。","2026-11-10","GitHub Changelog","https://github.blog/changelog/2026-11-10-gemini-4-carbon-in-github-copilot"],["GitHubのダッシュボードがすっきり、一覧は6件表示に","GitHubのダッシュボードが使いやすくなった。余白が減り、プルリクエストや課題、エージェントセッションの一覧は既定で3件から6件表示に増えた。長いタイトルは1行に収まり、エージェントセッションがない場合はその欄が隠れる。フィードかホームのタブを既定の表示に固定することもできる。新しいダッシュボードが既定になってからの「余白が多く情報が少ない」という声に応えた改善だ。","\n【概要】GitHubは2026年11月10日の変更履歴で、ダッシュボードをより見やすくしたと発表した。プルリクエストや課題、エージェントセッションの一覧の余白が減り、既定の表示件数が3件から6件に増えた。長いタイトルは1行に収まるようになり、エージェントセッションがない場合はその欄自体が隠れる。フィードタブとホームタブのどちらを既定にするかも選べるようになった。\n【背景】新しいダッシュボードが既定になってから、利用者からは「余白が多く、見える情報が少ない」という声が上がっていた。余白が広く、タイトルが折り返され、表示件数も3件と少なかったため、確認したい内容を見るのに余計な操作が必要だった。今回の変更は、そうした声に応えて画面を詰め、一目で分かる情報量を増やすものだ。\n【詳細】変更点は5つある。フィードかホームのタブを既定の表示に固定できる。プルリクエストや課題、エージェントセッションの一覧で余白が減った。長いタイトルは1行に収まり、全文は必要に応じて確認できる。プルリクエストと課題は既定で6件表示され、これまで自分で選んだ表示設定は引き継がれる。エージェントセッションが存在しないアカウントでは、その欄は表示されない。\n【ポイント・注意点】表示件数が増えたことで、一画面で確認できる課題やプルリクエストが倍になった。自分で表示件数を変えていた場合は、その設定が優先されるため、変わらないと感じる人もいる。その場合は設定を見直すとよい。エージェントセッションの欄が消えたのは不具合ではなく、仕様どおりの動作だ。意見はGitHubのコミュニティ議論で受け付けている。表示件数が増えたことで、確認したい課題やプルリクエストを一覧で見比べやすくなった。自分で表示件数を変えていた場合は、その設定が優先されるため、変わらないと感じる人もいる。その場合は設定画面で件数を見直すとよい。エージェントセッションの欄が消えたのは、セッションが存在しない場合の仕様どおりの動作で、不具合ではない。画面の見やすさは、使う人の作業に直結するため、意見があればコミュニティの議論で伝えるのがよい。","2026-11-10","GitHub Changelog","https://github.blog/changelog/2026-11-10-a-more-informative-github-dashboard"]],"elec":[["ESP32でWi-Fi妨害を検知、SDRで電波の乱れを見分ける","ESP32を使い、Wi-Fiの帯域に起きている妨害を検知する装置が紹介された。人気のESP-SDRプロジェクトを土台にし、ESP32-C5で2.4GHzと5GHzの両方を調べられる。妨害を広帯域や狭帯域など4種類に分類し、携帯できる単体装置として動く。Home Assistantとつなげて妨害検知器にもなり、部屋に人がいることも雑音の変化から察知できるという。","\n【概要】Hackadayが2026年11月16日に紹介したのは、ESP32でWi-Fiの妨害を検知する装置だ。作者のTheDigital1氏が作り、ソフトウェア無線を使ってWi-Fiの帯域を走査し、妨害を検出する。これまでのESP32によるWi-Fi攻撃の実験とは違い、妨害そのものを見つけて種類を分ける点が新しい。ハードウェアはESP32-C5を土台にし、2.4GHzと5GHzの両方の帯域を調べられる。\n【背景】ESP32を使ったWi-Fiの実験としては、切断攻撃や妨害を仕掛ける側の話題が多かった。今回は逆に、妨害を受けている側を検知する装置だ。土台になっているのは、ESP32でソフトウェア無線を動かすESPARGOS ESP-SDRという人気のプロジェクトで、Hackadayでも以前に取り上げられている。オープンソースのため、別の装置への移植も可能だ。\n【詳細】装置は妨害を4種類に分類する。広帯域、狭帯域、パルス状の広帯域、周波数が掃引されるものの4つだ。作者が使ったのはWaveshareのESP32-C5-Touch-LCD-3.5で、画面付きの装置として携帯できる。パソコンにUSBでつなぐとさらに多くの機能が使える。Home Assistantとつなげれば、Wi-Fi妨害の検知器として動かすこともできる。さらに、人が動くことで雑音の基準が上がる変化から、部屋に人がいるかどうかも検知できるという。\n【ポイント・注意点】この装置は妨害を検知できても、その意図までは分からない。電子レンジの漏れ電波なのか、誰かが意図的に妨害しているのかは、利用者自身が判断する必要がある。とはいえ、自宅のWi-Fiが不安定なときに原因の切り分けに使える。作る場合は、ESP32-C5搭載の開発ボードとESPARGOSの仕組みを組み合わせるのが近道だ。電波法の範囲内で使うことも忘れずに確認したい。自宅のWi-Fiが不安定なとき、妨害の有無を確かめる手がかりになる。画面付きの装置なら、持ち歩いて場所ごとの様子を比べることもできる。オープンソースのため、別のESP32ボードへの移植も可能だ。","2026-11-16","Hackaday","https://hackaday.com/2026/11/16/esp32-wifi-jam-detector-finds-the-raspberry/"],["カンファレンスのバッジが写真ブースに変身、RP2350で撮影","GitHub Universeの参加者バッジを小さな写真ブースに改造した作例が紹介された。バッジはRaspberry Pi RP2350を搭載しMicroPythonで動く。ESP32のカメラモジュールをI2Cでつなぎ、LEDをフラッシュにして撮影し、Bluetoothの感熱プリンターで印刷する。顔の表情を読み取ってキャラクターを動かす作例もあり、バッジを楽器やサーマルカメラにした人もいる。","\n【概要】開発者のWes Bos氏が、GitHub Universeの参加者バッジを小さな写真ブースに改造した。Hackster.ioが2026年11月16日に紹介した。バッジはカラー画面やボタン、センサーを持つ小型の開発ボードで、今年のものはRaspberry Pi RP2350を搭載しMicroPythonで動く。Bos氏はESP32のカメラモジュールをI2Cの拡張端子でつなぎ、撮影と印刷ができる装置に仕上げた。\n【背景】GitHub Universeの参加者には、普通の名札ではなく、プログラムできる電子バッジが配られる。画面やボタン、センサーを備え、自由に改造できるよう作られている。Bos氏は、AIツールがコーディングを担うようになり、実際にものを作る感覚から離れがちだと感じ、はんだごてを手に取ったという。\n【詳細】カメラはESP32のモジュールで、バッジのI2C端子に配線をはんだ付けしてつないだ。明るいLEDを2つ付けてフラッシュにし、バッジのバッテリーだけで動く。MicroPythonのアプリでカメラの映像を画面に映し、ボタンを押すとLEDが光って撮影する。印刷には1台10〜15ドル程度のBluetooth感熱プリンターを使い、画像を白黒の点描に変換して無線で送る。同じ動画では、Sam Meech-Ward氏がESP32と機械学習で笑顔やウインクを読み取り、画面のキャラクターを動かす作例も紹介された。ほかにもバッジを楽器や小型サーマルカメラにした人がいる。\n【ポイント・注意点】この作例は、市販のバッジと安い部品だけで作れる点が魅力だ。カメラの配線は、I2Cの端子と電源の位置を確かめてからはんだ付けする必要がある。感熱プリンターはレシート用の小型のもので、写真の画質は粗いが、雰囲気を楽しむ用途には十分だ。MicroPythonで動くため、Pythonが書ければ改造しやすい。バッジを持っていない人は、RP2350搭載の開発ボードでも同じ仕組みを試せる。作例の動画では、ほかの改造例も紹介されている。","2026-11-16","Hackster.io","https://www.hackster.io/news/this-conference-badge-is-now-a-tiny-photo-booth-bcbb945ab028"],["週末50ドル以下で作る、ESP32とラズパイのスマートホーム5選","ESP32とRaspberry Piで作るスマートホームの実践例5つが紹介された。ラズパイの自宅サーバー、ローカルAI防犯カメラ、ESP32の音声衛星、空調コントローラー、LED通知の5つで、どれも週末で作れて50ドル以下に収まる。すべて自宅のネットワーク内で動き、クラウドに頼らない点が特徴だ。部品はESP32が5ドル程度からと安く、身近な材料で始められる。","\n【概要】ESP32とRaspberry Piを使ったスマートホームの作例5つをまとめた記事が、2026年11月16日に公開された。いずれも週末で作れて、費用は50ドル以下に収まる。中心になるのは、自宅のネットワーク内で完結する仕組みで、クラウドのサービスに頼らない。ラズパイを中核に、ESP32をセンサーや音声の末端として組み合わせる構成だ。\n【背景】市販のスマートホーム製品は便利だが、クラウドの仕様変更やサービス終了で使えなくなる心配がある。自分で作れば、データが自宅の外に出にくく、長く使い続けられる。ESP32は5ドル程度から手に入り、ラズパイも手元に余っている人が多い。週末の工作として手頃な題材になっている。\n【詳細】5つの作例は次の通り。1つ目はラズパイの自宅サーバーで、DockerにAdGuard HomeやSyncthing、Uptime Kumaを入れる。2つ目はFrigate NVRによるローカルAI防犯カメラで、HailoやGoogle Coralの加速器を使う。3つ目はESP32-S3の音声衛星で、マイクとアンプ、LEDマトリックスを組み合わせ、OllamaとHome Assistantへ音声を送る。部品費は15ドル以下だ。4つ目はDHT22とスマートプラグによる空調コントローラー、5つ目はWLEDやESPHomeで動くLED通知だ。\n【ポイント・注意点】ローカルで動かす利点は、クラウドの都合に左右されないことと、音声や映像が外に出にくいことだ。反面、設定や保守は自分で行う必要がある。防犯カメラの顔認識はARMでは動かないため、人物や物体の検知に絞るのが現実的だ。まずは自宅サーバーから始め、動くものを確認してから末端を増やすと失敗しにくい。5つの作例はどれも、クラウドに頼らず自宅で完結する点が共通している。まずは自宅サーバーから始め、動くものを確認してから末端を増やすと失敗しにくい。部品は手元の余りものから試し、足りないものだけを買い足すのがよい。設定の記録を残しておくと、作り直すときに役立つ。","2026-11-16","Vinjo","https://blog.vinjo.co.in/blog/2026-10-11-these-5-esp32-and-raspberry-pi-smart-home-projects-take-a-weekend-and-cost-less-than-50"],["ラズパイとESP32の組み合わせ、得意分野を分けて使う","Raspberry PiとESP32を組み合わせると、それぞれの弱点を補い合えるという解説が公開された。ラズパイはOSやデータベース、Dockerなど重い処理を担い、ESP32はモーター制御やセンサー読み取りなど正確なタイミングが要る処理を担う。Wi-FiやBluetoothで無線のセンサーを広げられ、Home Assistantと組み合わせるのにも向く。単純な工作には1枚で十分だが、複雑な仕組みでは組み合わせが効く。","\n【概要】Raspberry PiとESP32を組み合わせる利点を解説した記事が、2026年11月16日に公開された。ラズパイはフルOSで動き、Webサーバーやデータベース、Dockerなど重いソフトを扱える。一方ESP32は、正確なタイミングが求められるハードウェア制御や低消費電力が得意だ。2枚を組み合わせれば、それぞれの長所を生かした柔軟な仕組みが作れるという。\n【背景】ラズパイ1枚でも多くのことはできるが、Linuxの都合で処理のタイミングがぶれることがある。モーター制御やPWM信号、センサーの即時読み取りには、専用のファームウェアで動くマイコンの方が向いている。逆にESP32だけでは、重いソフトや大量のデータ処理は苦手だ。両方の弱点を補うために、役割を分ける考え方が広がっている。\n【詳細】記事では、DIYの気象観測所を例に挙げている。ESP32が温度や湿度、気圧を集め、ラズパイが過去のデータを蓄えてInfluxDBで管理し、Grafanaで表示する。ロボットでは、ラズパイが移動や画像処理を担い、ESP32がモーターの動きや車輪の回転を監視する。無線では、ESP32を各部屋のセンサーとして置き、Wi-FiやBluetoothでラズパイへ送る。ESPHomeやMQTTのMosquittoを使えば、設定はYAMLや話題の購読で済む。Bluetoothの代理として使う手もある。\n【ポイント・注意点】組み合わせると、ソフトの管理や通信の決めごと、配線が増えて複雑になる。単純な温度計やLEDの制御なら、1枚で十分な場合が多い。組み合わせが本領を発揮するのは、重いLinuxアプリと正確なリアルタイム制御、複数のセンサー、無線での拡張が同時に求められるときだ。部品としては、Wi-Fi 6やZigbee、Threadに対応したSeeed StudioのXIAO ESP32-C6が5ドルで挙げられている。組み合わせを始めるときは、まずラズパイとESP32の役割分担を決めること。通信の方法は、ESPHomeやMQTTなど、手になじむものを選ぶと進めやすい。配線や設定の記録を残しておくと、後からの見直しが楽になる。","2026-11-16","Vinjo","https://blog.vinjo.co.in/blog/2026-11-14-why-combining-a-raspberry-pi-and-esp32-gives-you-the-best-of-both-worlds"],["USBSID-Pico 0.9.0、無線でSID音源を鳴らせるように","Raspberry Pi Picoで本物のSIDチップを鳴らすUSBSID-Picoが、バージョン0.9.0になった。USBの受信バッファーが8段になり、激しい書き込みでも音が途切れにくくなった。無線のPicoではネットワーク経由でSIDを制御できるサーバー機能も加わり、論理SID数は8から16に増えた。SIDの互換チップへの対応も広がり、設定ツールやファームウェアの種類も整理された。","\n【概要】Raspberry Pi Picoで本物のMOS SIDチップを現代のパソコンにつなぐUSBSID-Picoが、バージョン0.9.0になった。開発者のLouDnl氏による更新で、USBの通信と無線接続が大きく改善された。PicoやPico W、Pico 2、Pico 2 Wに対応し、SIDチップや互換チップを鳴らすためのファームウェアと設定ツールが更新されている。\n【背景】SIDチップは1980年代のコモドール64などに使われた音源チップで、今も愛好者が多い。USBSID-Picoは、Picoを橋渡しにして本物のチップをパソコンから制御する仕組みだ。USBのタイミングが厳しく、激しい書き込みでは音が途切れることがあった。また、無線で使いたいという要望もあり、今回の更新で両方に手が入った。\n【詳細】USBでは、受信データをためる8段のリングバッファーが加わった。開発者によると、激しい書き込み時のバッファー余裕は約160マイクロ秒から1.4ミリ秒に広がった。無線では、ネットワークSIDデバイスのサーバー機能が加わり、Pico WとPico 2 WではWi-Fi経由で、Bluetooth ClassicのSPPでも使える。論理SID数は8から16に増えた。FM音源のOPLをネットワーク経由で使うには、USBSID-Player 1.4.0より新しい版が必要だ。SIDKICK-picoの設定や時計速度の制御も加わった。\n【ポイント・注意点】無線のPico Wでは、メモリーの都合で内蔵プレーヤーと無線を同時に入れた版が作れないため、用途別のファームウェアが用意されている。Pico 2 Wでは両方入りの版がある。実験的な複数ボード間の時計リンクも加わったが、RX/PHI2ピンの共有接続が必要で、普通の使い方には不要だ。更新の前に、自分のボードに合うファームウェアの種類をリリースノートで確かめること。更新の前に、自分のボードに合うファームウェアの種類をリリースノートで確かめること。無線と内蔵プレーヤーの組み合わせは、ボードによって選べる版が違う。設定ツールの使い方も、更新に合わせて見直しておきたい。","2026-11-16","The Oasis BBS","https://theoasisbbs.com/usbsid-pico-v0-9-0-adds-network-sid-support-and-usb-buffering/"],["Pico Wの多画面時計、人の気配で表示が切り替わる","Raspberry Pi Pico Wで作る多画面の時計とセンサー表示板が、2026年11月16日に更新された。4枚の有機EL画面に時と分、屋内外の温度や湿度、気圧を出す。人感センサーを加え、人が30cm以内に近づくと表示の切り替えが始まる。以前はESP32-C3だった心臓部がPico Wに置き換わり、表示の流れも見直された。画面は4枚に分かれ、時と分、屋内外の環境を並べて表示する。","\n【概要】Raspberry Pi Pico Wを使った多画面の時計とセンサー表示板のプロジェクトが、2026年11月16日に更新された。4枚のSSD1306有機EL画面とTCA9548AのI2Cマルチプレクサーを組み合わせ、時計と環境データを並べて表示する。新たにHLK-LD2401の人感センサーと、AHT20とBMP280を組み合わせた温湿度・気圧センサーが加わり、人が近づくと表示が切り替わる仕組みになった。\n【背景】このプロジェクトは、1つの画面に詰め込むのではなく、表示ごとに画面を分ける発想で作られている。時と分、屋外の環境、屋内の環境を別々の画面に出すことで、遠くからでも読み取りやすい。以前の版ではESP32-C3が使われていたが、最新版ではRaspberry Pi Pico Wに置き換えられ、表示の流れも見直された。\n【詳細】画面の割り当ては、1枚目が時、2枚目が分、3枚目が屋外の温度・湿度・気圧、4枚目が屋内の温度・湿度・気圧となっている。3枚目と4枚目は並行して値を出すようになった。人感センサーは、人が30cm以内に近づくと新しい表示の周期をすぐに始める。時計を先に出し、次に温度や湿度、気圧を出す流れだ。動画も追加され、実際の動きを確認できる。\n【ポイント・注意点】この作例は、Pico Wの無線機能を生かしたものではなく、画面とセンサーの組み合わせが中心だ。4枚の画面を1つのI2Cバスで扱うため、マルチプレクサーで切り替えている。同じ仕組みを作る場合は、画面のI2Cアドレスが重ならないよう、マルチプレクサーの使い方を確かめること。人感センサーの感度は設置場所で変わるため、実際に置く場所で試すのがよい。この作例は、Pico Wの無線機能を生かしたものではなく、画面とセンサーの組み合わせが中心だ。時計としての見やすさを大切にし、表示ごとに画面を分けた点が特徴だ。動画も追加され、実際の動きを確認できる。作るときは、4枚の画面とセンサーの配線を先に確かめ、表示の切り替えを試してから仕上げるとよい。","2026-11-16","Proxima Star","https://www.proximastar.ca/projects/clock.html"],["エッジAIの導入手順、Jetsonとラズパイで動かすまで","Jetson NanoとRaspberry PiでAIモデルを動かす手順をまとめた解説が、2026年11月14日に公開された。YOLOv8やPyTorch、OpenCVのモデルを端末側で動かす流れを説明し、TensorRTやONNXでの最適化も扱う。Jetson Nanoは1秒30コマ以上、ラズパイは軽いモデルと組み合わせるのが向く。学生の卒業制作を想定し、眠気検知や欠陥検査などの題材も紹介している。","\n【概要】NVIDIA Jetson NanoとRaspberry PiでAIモデルを動かす手順をまとめた解説が、2026年11月14日に公開された。YOLOv8やPyTorch、OpenCVのモデルを、クラウドではなく手元の端末で動かす流れを説明している。対象はコンピューターや情報系の学生の卒業制作で、インドのプネーでの制作支援を手がける団体がまとめている。\n【背景】クラウドで推論すると、通信の遅れや帯域の消費、プライバシーの心配がつきまとう。端末側で推論すれば、ネットワークがなくても動き、応答も速い。ただし、端末の性能には限りがあるため、モデルを軽くする工夫が欠かせない。この記事は、その一連の流れを段階ごとに解説している。\n【詳細】ハードウェアの比較では、Jetson Nanoは128コアのMaxwell GPUと4GBメモリーを持ち、YOLOv8の中型モデルやResNet-50を1秒30コマ以上で動かせるとしている。Raspberry Pi 4や5は4コアのARMで、CUDAのGPUはないが、YOLOv8の小型版やMobileNetV3をONNX RuntimeやOpenVINO、Google CoralのUSB加速器と組み合わせるのが向く。モデルの最適化では、ONNXへの変換、TensorRTエンジンの生成、FP16やINT8への量子化を説明し、重みを16ビットや8ビットにすることでメモリーを最大75%減らし、検出精度は98%以上を保つとしている。\n【ポイント・注意点】題材としては、MediaPipeで目の開き具合を測る眠気検知、YOLOv8で微細な傷を見つける欠陥検査、OpenCVで車を数えて信号を変える交通管理などが挙げられている。記事は制作支援の案内も兼ねているため、学習用のモデルやスクリプト、報告書の用意まで含めた内容になっている。自分の制作に使う場合は、使うハードウェアに合った軽いモデルを選び、量子化の前後で精度を確かめること。使うハードウェアに合った軽いモデルを選び、量子化の前後で精度を確かめること。","2026-11-14","Codes & Circuits","https://www.codesandcircuits.in/blog/edge-ai-deep-learning-model-deployment-jetson-raspberry-pi"],["ラズパイのギフトガイド、Pico 2は4.80ポンドから","Raspberry Piの2026年版ギフトガイドが公開された。Pico 2は4.80ポンドから、Pi 400は57.60ポンド、Pi 500は172.80ポンドで、500+はキーボード一体の高級モデルだ。The Pi Hutの光るアドベントカレンダーは45ポンドで、12日分の工作が入る。AI HAT+ 2やAIカメラ、Sense HATなどの追加ボードや、本の紹介も載っている。","\n【概要】Raspberry Piの2026年版ギフトガイドが公開された。技術系ニュースサイトが2026年11月12日に内容を伝えている。安いものではPico 2が4.80ポンドからで、Pi 400が57.60ポンド、Pi 500が172.80ポンド、キット版は192ポンドとなっている。The Pi Hutの光るアドベントカレンダーは45ポンドで、12日分の工作が入っている。\n【背景】Raspberry Piは毎年、年末の贈り物向けにガイドを出している。今年はPico 2からPi 500+まで幅広く、予算や相手に合わせて選べる構成だ。価格は記事の執筆時点での公認販売店の価格で、税や送料は別とされている。アドベントカレンダーは毎年売り切れることが多いという。\n【詳細】デスクトップ向けにはPi 400、Pi 500、Pi 500+が並ぶ。Pi 400は本体のみ57.60ポンド、マウスや電源、HDMIケーブル、入門書付きのキットは76.80ポンドだ。Pi 500は本体172.80ポンド、キットは192ポンドで、500+はバックライト付きのキーボードに組み込まれた高級モデルだ。安いボードでは、Pico 2が4.80ポンドからで、はんだ付け不要のヘッダー付きや無線付きのPico 2 Wも選べる。追加ボードではSense HATやLEGOと組み合わせるBuild HAT、生成AIを試すAI HAT+ 2とAIカメラが紹介されている。アドベントカレンダーは初日にPico Hやケーブル、ブレッドボードが入り、12月1日から毎日オンラインの作り方が公開される。\n【ポイント・注意点】本では、レトロゲームのガイドが9.99ポンド、公式年鑑2027とBook of Making 2027が各7ポンド、AIプロジェクトの本が8.99ポンドとなっている。5冊の本のバンドルは4ポンドから買え、通常価格は最大255ポンドで、一部はRaspberry Pi財団の支援になる。贈る相手が初心者ならキット版、すでに持っている人には追加ボードや本が向く。アドベントカレンダーは売り切れやすいため、早めの入手が安心だ。","2026-11-12","TechPulseMind","https://techpulsemind.com/raspberry-pi-gift-guide-2026/"],["ブリーフケース型アーケード、ラズパイで2人対戦","ブリーフケースを開くと2人用のアーケード台になる工作が紹介された。心臓部はRaspberry Pi 3 B+で、Batoceraを動かす。15.6インチの画面と2本のジョイスティック、12個のボタンを備え、持ち運びできる。配線はキーボード変換基板に集約し、蝶番は自作した。ラズパイ4や5でも同じ画面が使え、安い変換基板への置き換えも可能だ。まずはブレッドボードで試し、動くことを確かめてから木工に入るのがよい。","\n【概要】ブリーフケースを開くと2人用のアーケード台になる工作が、2026年11月11日に紹介された。作者はMichael Alm氏で、Hacksterで公開された作例を基にしている。心臓部はRaspberry Pi 3 Model B+で、ゲーム専用のLinuxであるBatoceraを動かす。ふたを開けると15.6インチの画面が立ち上がり、下には2人分のジョイスティックとボタンが並ぶ。\n【背景】Batoceraは電源を入れるとすぐにゲームの一覧画面になる仕組みで、デスクトップを経由しない。Pi 3 B+の1.4GHz 4コアでも、8ビットや16ビット時代のアーケードゲームは快適に動く。持ち運べる形にすることで、旅行先や学校の催しでも遊べる。\n【詳細】操作系は、1人あたり三和のジョイスティック1本とボタン6個を、日本のゲームセンター筐体と同じVewlix配置で並べている。コインやスタートなどのボタンを含め、20個以上の入力はUltimarcのI-PAC 2というキーボード変換基板に集められ、パソコンからはUSBキーボードとして見える。筐体はバルト海産のカバ合板をレーザーで切り出し、操作面は手首が楽なよう7.5度傾けている。蝶番は市販品ではジョイスティックが画面に当たるため、黄銅のパイプと棒で自作した。電源は5V 2.5Aが必要で、弱い充電器では電圧不足の表示が出る。\n【ポイント・注意点】同じBatoceraの画面は、ラズパイ4や5でも動かせて余裕が増す。I-PAC 2の代わりに、300フィリピンペソ程度の安いUSB変換基板も使える。作るときは、ボタンの配線を1本の線でつなぐこと、スティックの動きの幅を測ってからふたを切ることが助言されている。まずはブレッドボードで1本のスティックを動かし、ゲームが動くことを確かめてから木工に入るのがよい。旅行先や学校の催しでも遊べる、持ち運べる形が特徴だ。ふたを閉じると画面が操作面を覆い、運ぶときの傷も防げる。2人で遊ぶときは、ボタン配置が同じため、公平に対戦できる。作例の動画や写真も公開されているので、作る前に全体像を確かめられる。","2026-11-11","Circuitrocks","https://blog.circuit.rocks/raspberry-pi-arcade-in-a-briefcase-two-player-batocera-build"],["ラズパイ5の床暖房コントローラー、資金集めを開始","オランダのDomeCtrlが、Raspberry Pi 5を使った床暖房コントローラーの資金集めを始めた。Home Assistantのサーバーが丸ごと入り、部屋ごとの温度管理やポンプの自動停止ができる。価格は1,550ドルで、2027年7月末の出荷を見込む。ESP32版の計画は棚上げになったが、回路図は製品化後にGitHubで公開される予定だ。回路図は製品化後に公開される予定だ。","\n【概要】オランダのDomeCtrlが、Raspberry Pi 5を使った床暖房コントローラー「ControlBox」の資金集めをCrowd Supplyで始めた。Hackster.ioが2026年11月10日に伝えている。温水式の床暖房をHome Assistantと組み合わせて制御する装置で、部屋ごとの温度管理やポンプの自動制御ができる。2年前に初めて公開されたものが、今回ようやく資金集めの段階に入った。\n【背景】床暖房の制御は、バルブやポンプ、温度センサーなど多くの機器を扱う必要があり、導入の手間が大きい。ControlBoxは、それらを1台にまとめてHome Assistantとつなげることで、導入を簡単にしようとしている。以前はESP32版も計画されていたが、今回は見送られた。\n【詳細】ControlBoxの心臓部はRaspberry Pi 5の4GBモデルで、128GBのNVMe SSDと組み合わせてHome Assistantのサーバーがそのまま動く。出力は、電源系が4系統、バルブ用の24V出力が16系統、光絶縁の入出力やPWM出力、LEDテープ用の32系統のPWM出力があり、最大2kWまで対応する。433MHzの無線も内蔵する。6mを超える長い配線でも、1-wireの温度センサーを多数読み取れる。価格はRaspberry Pi 5と128GB NVMe込みで1,550ドルで、2027年7月末の出荷を見込む。ただし、資金集めの製品は出荷が保証されるものではない。\n【ポイント・注意点】同社は、製品が正式に出た後に回路図をGitHubで公開すると約束している。ライセンスの種類はまだ決まっていない。部屋ごとに温度を自動で調整したり、暖房の要らない部屋のポンプを止めたり、太陽熱の集熱を制御したりできる。導入を検討する場合は、資金集めの性質を理解し、出荷が遅れる可能性も考えておくこと。制御の中心はHome Assistantのため、ほかの機器との連携も同じ画面で扱える。温度センサーは長い配線でも読み取れるため、広い家でも使いやすい。価格にはRaspberry Pi 5と128GBのNVMeが含まれている。","2026-11-10","Hackster.io","https://www.hackster.io/news/domectrl-opens-crowdfunding-for-its-raspberry-pi-5-powered-controlbox-under-floor-heating-controller-5d1d470ac434"]],"muse":[["Claude CodeのCode Mode、書いたJSをフックで点検する","Claude Code 2.1.323で加わった実験機能「Code Mode」は、ClaudeがJavaScriptを書いて道具を呼ぶ仕組みだ。会話には道具の呼び出しだけが表示され、書かれたコード自体は見えない。REPLという道具に対するフックを使えば、実行前にコードを記録し、危ない命令を拒否できる。環境変数で有効にし、対応モデルや実行環境の条件も限られている。","\n【概要】Claude Code 2.1.323で加わった実験機能「Code Mode」は、Claudeが道具を1つずつ呼ぶのではなく、JavaScriptを書いてまとめて呼ぶ仕組みだ。2026年11月12日に登場し、既定ではオフになっている。会話には道具の呼び出し結果だけが表示され、書かれたコード自体は表示されない。コードを事前に点検するには、REPLという道具に対するフックを使う方法が公式の案内として示されている。\n【背景】これまでClaude Codeは、道具を呼ぶたびに結果を読み、次の判断をしていた。複数ファイルの変更や検索結果の絞り込みなど、手順が多い作業では往復が増えていた。コードでまとめれば、並列実行や条件分岐、結果の絞り込みを1つの手順で表せる。ただし、コードの中身が見えにくくなるため、点検の方法も変わる。\n【詳細】Code Modeを有効にするには、環境変数CLAUDE_CODE_EXPERIMENTAL_CODE_MODEを1に設定して起動する。組織は管理設定で無効にできるが、有効にすることはできない。使えるのは対話型のターミナルだけで、-pやAgent SDK、VS Codeのパネル、デスクトップアプリ、クラウドでは動かない。対応モデルはOpus 5.5、Sonnet 5.5、Haiku 5.5、Fable 5.2だ。実行中のコードはREPLという道具で動き、自動モードでは分類器がコード全体を事前に審査するが、実行時に決まる値までは見えない。待ち時間は10分までで、裏側で動くコードは最大2時間まで許される。\n【ポイント・注意点】記事では、REPLに対するPreToolUseフックの例がGoで示されている。すべてのコードを記録し、rm -rfや強制プッシュ、curlをシェルへ流す命令などが含まれていれば拒否する仕組みだ。拒否や許可の規則は、コードの中の命令にもそのまま適用される。ただし、Bashの規則は命令の文字列で判断するため、形を変えた命令はすり抜ける可能性がある。実験的な機能のため、砂場のような環境で試してから使うのがよい。","2026-11-16","Import Static","https://importstatic.com/ai/claude-code-code-mode-hook-repl"],["Fable 5.2で副業の仕事が41%こなせる、実例が続々","AnthropicのClaude Fable 5.2は、実際のフリーランスの仕事の41.25%をこなせると、Remote Labor Indexの結果で示された。Xでは、2Dの間取り図から3Dの内見動画を作ったり、8時間でFPSゲームを作ったりする実例が相次いでいる。Fable 5.2は2026年11月9日に登場し、コーディングや推論、視覚の性能が上がったとされる。作る側の道具として注目されている。","\n【概要】AnthropicのClaude Fable 5.2は、実際のフリーランスの仕事の41.25%をこなせると、Remote Labor Indexの結果で示された。Daily Callerが2026年11月15日に伝えている。同じ指標では、AnthropicのClaude Opus 5.5やOpenAIのGPT-6 Astraがおよそ21%で、Fable 5.2が大きく上回った。2025年10月に指標が始まったときの首位は、Manusの2.5%だった。\n【背景】Fable 5.2は2026年11月9日に登場したAnthropicの最新モデルで、コーディングや推論、視覚の性能が上がったとされる。発表直後から、Xでは実際にものを作る実例が相次いでいる。単なる受け答えではなく、丸ごと1つの成果物を作る使い方が広がっている。\n【詳細】紹介された実例は多彩だ。ある利用者は2Dの間取り図から3Dの内見動画を作り、1件5,000〜10,000ドルの市場があると説明した。別の利用者は、2kmのコースや22のコーナー、10チーム20台の車が走るF1の賭けシミュレーターを1つのHTMLファイルで作った。ウェブカメラで顔に向けると頭蓋骨や脳を表示する「X線ミラー」もある。Anthropicの技術者Felix Rieseberg氏は、8時間でFPSゲーム「Saltline」を作り、費用はAPI価格で約550ドル、出力約270万トークン、入力約4億4,500万トークンだったとしている。Matt Shumer氏は13時間でニューヨークを舞台にしたゲームを作った。\n【ポイント・注意点】41.25%という数字は、フリーランスの仕事をどれだけこなせたかという指標の結果で、すべての仕事が自動化できるという意味ではない。実例の多くは、利用者が指示や調整を加えながら作ったものだ。とはいえ、間取り図やゲームのように、形のある成果物を短時間で作れる点は確かだ。使うときは、出来上がりの正確さを人の目で確かめ、特に金額や仕様に関わる部分は自分で点検すること。","2026-11-15","Daily Caller","https://dailycaller.com/2026/11/15/anthropic-claude-fable-work-automation"],["Claude Code週間まとめ、権限の穴4件とCode Modeが中心","2026年11月15日の週のClaude Codeは、4つの版が公開された。中心はv2.1.321の権限と砂場の修正4件で、促しが出るべき場面で出ていなかった問題を直した。v2.1.323では実験機能のCode Modeが加わり、v2.1.325では圧縮の扱いの安全性修正が入った。Codexは信頼の決め方が変わり、Gemini CLIも1件の更新があった。更新は4版に及んだ。","\n【概要】2026年11月15日の週のClaude Code、Codex、Gemini CLIの更新をまとめた記事が、2026年11月14日に公開された。Claude Codeはv2.1.321、v2.1.322、v2.1.323、v2.1.325の4版が出た。v2.1.320とv2.1.324は存在しない。最大の変更はv2.1.321の権限と砂場の修正4件で、促しが出るべき場面で出ていなかった問題を直している。\n【背景】コーディング用のAIは、ファイルの読み書きや命令の実行を繰り返すため、権限の仕組みが重要になる。促しが出るはずの場面で出なければ、利用者が気づかないうちに意図しない操作が進む。今回の修正は、そうした見落としをふさぐものだ。あわせて、道具の呼び出し方を変える実験機能も加わった。\n【詳細】v2.1.321の修正は、読み取り専用のBash命令が砂場の外で促しなしに動いた問題、ファイル書き込みの権限判断が違うフォルダーで行われた問題、cpやmvでフォルダーを指定したときの書き込み先が拒否規則の対象外だった問題、MCPのOAuthで秘密情報が別の場所へ送られた問題の4つだ。v2.1.322はVertexでの高速モード追加のみ、v2.1.323はCode Modeの追加とプラグインの版指定機能、v2.1.325はzstd圧縮の扱いの安全性修正が中心だ。新しいモデルとしてClaude Fable 5.2が既定のFableモデルになった。Codexはv0.169.0で、codex execの信頼の決め方が変わり、--sandbox workspace-writeだけではプロジェクト設定やMCPが有効にならなくなった。\n【ポイント・注意点】まずClaude Codeをv2.1.321以降に上げること。cpやmvでフォルダーを指定する使い方をしている場合は、拒否規則が効いていなかった可能性があるため、設定を見直すこと。CodexをCIで使っている場合は、--trustが必要になっていないか確かめること。Bashの許可規則に変数の値に*を含むものがあると、v2.1.323から起動時の警告が出る。","2026-11-14","DEV","https://dev.to/aicoding-guide/this-week-in-claude-code-codex-and-gemini-cli-week-of-november-15-2026-4pmm"],["Code Modeの自動審査、見るのは道具ではなくコード","Claude Code 2.1.323で加わったCode Modeは、ClaudeがJavaScriptを書いて道具をまとめて呼ぶ仕組みだ。自動モードでは、分類器が道具の呼び出し1つずつではなく、コード全体を事前に審査する。実行時に決まる値は見えないため、注意が要る。記事では、8,000トークンのテスト記録を20回分送る場合の試算も示し、v2.1.325で直った3件の不具合も伝えている。","\n【概要】Claude Codeの実験機能Code Modeについて、自動モードでの審査の仕組みを解説した記事が公開された。Code Modeはv2.1.323で2026年11月12日に加わり、ClaudeがJavaScriptを書いてBashやRead、Editなどの道具をまとめて呼ぶ。自動モードでは、分類器が道具の呼び出し1つずつではなく、コード全体を事前に審査する。実行時に決まる値は分類器には見えないため、使い方に注意が要る。\n【背景】これまでClaude Codeは道具を1つずつ呼び、結果を読みながら次を決めていた。Code Modeでは、複数の呼び出しを1つのコードにまとめ、必要な部分だけを返す。長いテスト記録をそのまま残すと、後のやり取りで何度も送り直すことになり、文脈を圧迫する。コードで要約して返すことで、この無駄を減らせる。\n【詳細】記事の試算では、8,000トークンのテスト記録を20回のやり取りで送り直すと16万トークンになるが、200トークンの要約にすれば4,000トークンで済む。Sonnet 5.5のAPI定価では0.32ドルと0.008ドルの差になる。ただし、これは記事独自の試算で、Anthropicの公表値ではない。v2.1.325では、Code Modeの不具合3件が直った。作業ツリーに入ったのに無視された問題、~のパスを誤って扱った問題、サインイン切れのMCPサーバーが接続中と表示された問題だ。\n【ポイント・注意点】Code Modeは対話型のターミナルだけで動き、-pやAgent SDK、VS Codeのパネル、デスクトップアプリ、クラウドでは使えない。WindowsではGit for Windowsが必要だ。対応モデルはOpus 5.5、Sonnet 5.5、Haiku 5.5、Fable 5.2で、HIPAA構成やデータ保持なしの組織では使えない。実行中のコードは10分で止まり、裏側で動く場合は最大2時間まで許される。公式の節約数値はまだ出ていないため、うわさの数字をそのまま信じないこと。","2026-11-14","Agent Breaking","https://agentbreaking.com/blog/claude-code-code-mode-auto-classifier-nov14"],["Claude Code 2.1.323、Code Modeと深い思考の強化","Claude Code 2.1.323では、実験機能のCode Modeが加わり、Ultrathinkがxhighの深さで動くようになった。自動モードの権限の扱いも明確になり、メールアドレスを外部へ送る前に確認する仕組みも加わった。MCPの作業は裏側で動くようになった。Opus 4.8の高速モードは11月30日に終わるため、Opus 5.5への移行が呼びかけられている。","\n【概要】Claude Code 2.1.323の変更点を解説した記事が、2026年11月13日に公開された。目玉は2つで、ClaudeがJavaScriptを書いて道具を呼ぶ実験機能「Code Mode」と、深く考えるUltrathinkがxhighの深さで動くようになったことだ。あわせて、自動モードの権限の扱いが明確になり、メールアドレスを外部へ送る前に確認する仕組みや、MCPの作業を裏側で動かす変更も加わった。\n【背景】Claude Codeは、道具を1つずつ呼ぶ方式から、コードでまとめて呼ぶ方式への転換を試している。複数ファイルの変更や検索と置き換えの繰り返しなど、手順が多い作業では、コードで表す方が正確に制御できる。また、深い思考の度合いを細かく選べるようにすることで、単純な作業に余計な時間をかけない配慮も進んでいる。\n【詳細】Code Modeはv2.1.323から選べる実験機能で、ClaudeがJavaScriptを書いて道具を呼び出す。プラグインの版指定も厳しくなり、対応しない版のプラグインは入らなくなった。Ultrathinkはxhighの深さで動き、サブエージェントごとに深さを指定できる設定も加わった。自動モードでは、分類器に任せきりにせず、確認できない呼び出しは尋ねるか拒否するようになった。Webやシェルの道具が利用者のメールアドレスを外部へ送る前に確認する仕組みも加わった。MCPサーバーが道具を呼ぶ作業は、すぐに裏側へ移るようになった。\n【ポイント・注意点】Opus 4.8の高速モードは2026年11月30日に終了し、以後は誤りになり、標準のOpus 4.8へ自動で切り替わらない。AnthropicはOpus 5.5への移行を勧めている。高速モードはVertexでも新たに使えるようになった。Code Modeは設定で明示的に有効にする必要があり、複雑な作業で試すのがよい。Ultrathinkは単純な作業に使うと遅くなるため、使い分けが大切だ。高速モードはVertexでも新たに使えるようになった。設定の変更は、自分の作業に合うかどうかを確かめてから進めること。プラグインを使っている人は、版の指定が厳しくなった点にも注意したい。","2026-11-13","Minssam","https://www.minssam.com/en/blog/2026-11-13-claude-code-experimental-code-mode-effort/"],["Museが米国の店に電話、有料プランから利用可能に","MetaのAIエージェントMuseが、米国の店や事業所へ利用者に代わって電話をかけられるようになった。有料プランの利用者が対象で、9月からの試験を経て11月12日に発表された。保険会社やケーブル会社、DMV、飲食店の予約などが例に挙がる。料金は月20ドルからで、米国限定の機能だ。無料利用者向けのMuseメールアドレスも近く始まるという。無料利用者向けのMuseメールアドレスも近く始まるという。","\n【概要】MetaのAIエージェントMuseが、米国の事業所へ利用者に代わって電話をかけられるようになった。Metaの最高AI責任者アレクサンドル・ワン氏が2026年11月12日にXで発表し、TechCrunchも同日に報じた。9月から一部の利用者で試験されており、今回から有料プランの利用者なら誰でも使える。保険会社やケーブル会社、DMV、飲食店の予約などが例に挙がっている。\n【背景】Museは2026年9月に登場したMetaの個人AIエージェントで、買い物や予約などの手続きを代わりに進めることを目指している。電話は、多くの店や事業所がいまだに頼る手段であり、チャットやアプリだけでは届かない場面がある。Museが電話を使えるようになることで、利用者の代わりに面倒な電話を済ませられるようになった。\n【詳細】利用できるのは有料プランの米国利用者で、対象は米国の事業所に限られる。TechCrunchによると、料金は月20ドルで週5億トークンまで、月100ドルのプランでは週30億トークンまで使える。Metaは10月時点でMuseの利用者が1,000万人を超えたとしている。あわせて、無料利用者向けのMuseメールアドレスも近く始まると報じられた。GoogleのGeminiや新興のInstinctも似た電話代行を進めており、エージェントによる電話は1つの分野になりつつある。\n【ポイント・注意点】記事によると、Museが電話でAIであることを名乗るのか、通話が録音されるのか、事業所が断れるのかは明らかにされていない。TechCrunchは、AIからの電話だと分かると切る受付も多いと指摘している。店側は、AIからの電話をすぐに切らず、予約の内容や営業時間を確認できるよう備えておくとよい。利用者側も、電話の内容はMuseに任せきりにせず、予約の日時など大切な点は自分で確かめること。電話をかける相手が米国の事業所に限られる点と、有料プランだけが対象という点は、使う前に確かめておきたい。試験は9月から一部の利用者で行われ、今回の発表で対象が広がった。発表はワン氏がXで行い、TechCrunchが同日に報じた。日本での提供時期は示されていない。","2026-11-13","Power Ads","https://powerads.group/news/meta-muse-places-calls-to-us-businesses-paid-subscribers/"],["Claude MeetingsがGoogle Meetに参加、IPOは18日決定","AnthropicのClaude MeetingsがGoogle Meetのベータ版で使えるようになり、会議にClaudeが参加して議事録や資料をその場で作る。TeamとEnterpriseプランが対象で、招待は専用アドレスから行う。AnthropicのIPOは、825百万株を70〜78ドルで売り出し、最大約644億ドルを調達する見込みで、最終価格は11月18日、Nasdaqでの取引は11月19日から始まる。","\n【概要】AnthropicのClaude MeetingsがGoogle Meetに対応し、ベータ版としてTeamとEnterpriseプランで使えるようになった。Claudeが会議に名前付きの参加者として加わり、議事録や文字起こしを作り、文書やホワイトボード、スライドをその場で作る。あわせて、AnthropicのIPOの注文が何倍にも膨らみ、最終価格は2026年11月18日、Nasdaqでの取引開始は11月19日と報じられた。\n【背景】Claude Meetingsは、会議に参加するAIとしてAnthropicが進めている機能だ。これまでは会議の後に要約を作る使い方が中心だったが、Google Meetへの対応で、会議の最中に資料を作る使い方ができるようになった。IPOは、Anthropicが株式を初めて公開する出来事で、調達額は最大で約644億ドルとされる。\n【詳細】Google Meetでの使い方は、会議中の「参加者を追加」からclaude@meetings.claude.aiを招待する。Claudeのパネルが会議画面の右側に開き、「今決まったことをまとめて」といった指示で、文書やホワイトボードの草案が10〜15秒ほどで作られる。議事録と文字起こしはベータ期間中は無料で、会議中に作った資料は2027年2月10日まで無料だ。データ保持なしやHIPAA対応、顧客管理の暗号鍵を使う組織は対象外で、ZoomやTeamsは今後の対応とされる。IPOでは、825百万株を70〜78ドルで売り出し、Googleやエヌビディアを含む7つの提携先が260億ドル分の株式を別に買う。ティッカーはANTだ。\n【ポイント・注意点】Claude Meetingsは、参加者が短く直接指示するほど良い成果が出る。定例の会議では、Claude Meetingsのプロジェクトを固定しておくと、前回の課題や対応項目が次の会議の議事録に引き継がれる。IPOの注文が膨らんでいるからといって、初日の値上がりが約束されるわけではない。個人投資家は、割り当てが少なかったりゼロだったりする可能性を考えておくこと。","2026-11-13","ClaudeBeat","https://www.claudebeat.ai/articles/2026/11/2026-11-13.html"],["Claude Fable 5.2とMythos 5.2、同じ中身で守りが2段階","Anthropicが2026年11月9日にClaude Fable 5.2とMythos 5.2を出した。同じモデルを、一般向けのFableと審査を通った組織向けのMythosに分けたものだ。出力は最大30%速くなり、断る回数は約55%減ったという。料金は入力100万トークンあたり8ドル、出力40ドルで、前の世代より20%安い。翌10日にはWhiteboardsやSheets、Dataも出た。","\n【概要】Anthropicは2026年11月9日、Claude Fable 5.2とClaude Mythos 5.2を発表した。同じ土台のモデルを、安全対策を付けた一般向けのFableと、審査を通った組織だけが使えるMythosに分けたものだ。出力は前の世代より最大30%速くなり、断る回数は約55%減ったとされる。料金は入力100万トークンあたり8ドル、出力40ドルで、前の世代より20%安い。翌11月10日には、チーム向けのWhiteboardsやSheets、Dataも出た。\n【背景】高性能なモデルほど、セキュリティ研究や生物学の研究に使える一方で、悪用される心配も大きくなる。Anthropicは、一般向けには安全対策を付け、高度な使い方を求める組織には審査を通したうえで対策を外した版を出す形を選んだ。あわせて、個人の対話だけでなく、チームの作業そのものをClaudeの中で行う製品も広げている。\n【詳細】Fable 5.2は、AnthropicのアプリやAWS、Google Cloudなどを通じて広く使える。Mythos 5.2は、サイバー検証プログラムやライフサイエンス検証プログラムの審査を通った組織だけが使える。性能では、FrontierCode 2.0で49.1%、CVEの再発見テストでMythosが89.6%、ロボットの指標RoboDojoで64.9%を記録したとされる。フェルマーの最終定理の証明を30時間で形式化したともいう。いずれもAnthropic自身の発表だ。Whiteboardsは共有の board で計画を練り、Sheetsは表計算をClaudeと一緒に作る。Sheetsは10万セルの上限があり、ピボットやマクロはまだ使えない。DataはBigQueryやSnowflake、Salesforceなどとつなぎ、11月19日からEnterpriseで既定でオンになる。\n【ポイント・注意点】料金の速いモードは入力16ドル、出力80ドルで、最大2.5倍速いとされる。Mythosを使いたい組織は、審査に時間がかかるため早めの申請がよい。Fable 5.2の速さや断りの少なさはAnthropic自身の数字で、独立した検証ではない。発表では文脈の長さが示されていない点も、確かめておきたい。","2026-11-12","Airank Audit","https://airankaudit.com/anthropic-claude-fable-mythos-5-2/"],["Muse Ember、安さが売りの小型モデルが登場","Metaが2026年11月9日にMuse Emberを出した。Museで最も小さく効率のよいモデルで、入力100万トークンあたり0.10ドルと安い。道具の呼び出しや下書き、分類など、エージェントが繰り返す作業向けだ。独立した評価ではClaude Haiku 5.5とほぼ同じ点数で、1件あたりの費用は約3分の1だった。大きなモデルが計画し、Emberが量をこなす使い方が勧められている。","\n【概要】Metaは2026年11月9日、Museシリーズで最も小さなモデル「Muse Ember」を発表した。道具の呼び出しやコーディングの下書き、振り分け、抽出、長い文書の読み取りなど、エージェントが毎日繰り返す作業向けのモデルだ。料金は入力100万トークンあたり0.10ドル、出力0.50ドルで、20万トークンを超える要求では3倍になる。100万トークンの文脈と最大51万2千トークンの出力に対応する。\n【背景】エージェントの作業では、大きなモデルにすべてを任せると費用がかさむ。計画や判断は大きなモデルに任せ、繰り返しの作業は安い小型モデルに任せる2段構えが広がっている。Metaは、Muse Wonderを難しい問題に、Muse Sparkをコーディングやエージェント作業に、Emberを繰り返しの作業に位置づけている。\n【詳細】独立した評価機関Artificial Analysisによると、Emberは知能指数で36点となり、Claude Haiku 5.5の36点とほぼ同じだった。1件あたりの費用はEmberが0.14ドル、Haiku 5.5が0.41ドルで、約3分の1だ。Terminal-Bench 4.0ではEmberが40.9%、Haiku 5.5が39.2%でEmberが上回った。AutomationBenchでもEmberが37.8%と大きく上回った。一方、実際の変更が取り込まれるかを測るFrontierCode 2.0では、Haiku 5.5が34.9%、Emberが27.2%でHaikuが上回った。テキストや画像、音声、動画、PDFを入力でき、VercelのAI Gatewayでも同日に使えるようになった。\n【ポイント・注意点】Emberは「Haikuと同等」と言われても、深い知識や難しい変更では及ばない面がある。Metaは、Muse Wonder Fullというモデルで学習させた初のモデルだとしている。料金は、入力が20万トークンを超えると入力0.30ドル、出力1.50ドルに上がるため、長い文脈を送る作業では費用の見積もりが変わる。繰り返しの作業に使う場合は、まわりの仕組みで誤りを検出できるようにしておくこと。","2026-11-11","i10X News","https://i10x.ai/news/meta-muse-ember-cheap-agent-model"],["Fable 5.2、1000超のエージェントでOSを自作","Anthropicが2026年11月9日に出したClaude Fable 5.2とMythos 5.2は、料金が前の世代より20%安くなり、出力が最大30%速くなった。Fable 5.2は1,000を超えるエージェントを束ねてOSを作り、ブラックホールの未解決問題にも取り組んだという。Mythosは脆弱性の再発見で89.6%を記録した。Fableは広く使え、Mythosは審査を通った組織に限られる。","\n【概要】Anthropicは2026年11月9日、Claude Fable 5.2とClaude Mythos 5.2を発表した。料金は入力100万トークンあたり8ドル、出力40ドルで、前の世代より20%安い。出力は最大30%速くなり、100万トークンの文脈と12万8千トークンの出力に対応する。発表では、1,000を超えるAIエージェントを束ねてOSを作った実験や、ブラックホールの未解決問題への取り組みなどが紹介された。\n【背景】Anthropicは、単に受け答えをするモデルから、大きな仕事をまとめて進めるモデルへと進んでいる。Fable 5.2は、コーディングや科学、セキュリティの難しい課題を担う位置づけだ。同じ土台のモデルを、一般向けと審査制の2つに分けたのは、能力の高さと悪用の心配の両方に応えるためだ。\n【詳細】性能では、FrontierCode 2.0でFable 5.2が49.1%となり、OpenAIのGPT-6 Astraの42.8%やGoogleのGemini 4 Carbonの41.1%を上回ったとされる。人類最後の試験では74.2%だった。Mythos 5.2は、脆弱性の再発見テストで89.6%を記録し、Opus 5.5の81.3%を上回った。Anthropicによると、Claudeは同社の基盤コードに取り込まれる変更の90%以上を書いている。実験では、1,000を超えるエージェントが8日かけてOSを作り、起動や画面、保存、通信まで備えたものができた。PythonからRustへの移行では、起動が約26倍速くなった。音声アシスタントやスピーカーフォン、手のひらサイズのペット端末の3つの機器も設計され、製造したものは電気的な手直しなしに動いた。\n【ポイント・注意点】これらの数字や実験は、Anthropic自身の発表によるもので、独立した検証ではない。Fable 5.2はAnthropicのサービスやAWS、Google Cloud、Azureで使える。Mythos 5.2は、審査を通った組織に限られ、セキュリティや生物学の研究向けだ。速いモードは料金が2倍で、最大2.5倍速いとされる。新しいモデルを試すときは、自分の作業での結果を確かめてから本格的に使うこと。","2026-11-10","TechStartups","https://techstartups.com/2026/11/10/anthropic-launches-claude-fable-5-2-and-mythos-5-2-its-most-advanced-ai-models-for-coding-science-and-cybersecurity/"]],"cnc":[["GibbsCAM 2027、AIがCAM作成を最大70%短縮へ","GibbsCAM 2027がIMTS 2026とAMB 2026で発表され、AI支援機能を強化した。推論モデル搭載のGibbsCAM Copilot、CloudNCの「CAM Assist」、up2partsの「autoCAM」により、繰り返し作業を自動化しCAMプログラム作成時間を最大70%短縮することを目指す。セットアップ検査の統合やシミュレーション高速化、工具管理のAI最適化も盛り込まれた。11月19日には新機能紹介ウェビナーも開催される。","\n【概要】GibbsCAM 2027は、AIを本格的に組み込んだCAMソフトウェアの新版だ。GibbsCAM Copilotは推論モデルを搭載し、画像や資料リンクを扱い、フォローアップの質問も提案する。CloudNCのCAM Assistは3軸および3+2軸加工の戦略立案を支援し、up2partsのautoCAMは設計からNCコード生成までを自動化する。【背景】製造現場では納期短縮と高精度化の両立が求められ、CAMプログラミングの工数がボトルネックになりがちだ。熟練プログラマーの不足もあり、AIによる戦略提案と自動化への期待が高まっている。【詳細】新版ではセットアップ検査がプログラミング画面に統合され、ツールパス上の可視化や加工中の素材確認ができるようになった。シミュレーションは巻き戻しをチェックポイント化するReverse-Rewindで高速化し、Chip Managerが切りくずを除去して視認性を高める。穴加工ではHole Managerが貫通穴を分割でき、Oscillating Thread Turning（揺動ねじ切り）が追加された。3D加工はテーパーやバレル、ロリポップなどの多様な工具に対応し、多軸仕上げも強化された。CAM Assist 2.0のStrategy Editorでは機械・材料・工具を設定し、AI提案を確認・修正・承認してからツールパスを返す。autoCAMは製造データから学び、独自のAIコパイロットへ育つという。データ面ではup2parts Cockpitが設計・計画・生産・CAMの情報を集約し、図面から公差を自動抽出する。ToolManageriQはSQLデータベースで工具・ホルダー・治具を管理し、AIが切削条件を最適化する。【ポイント・注意点】「最大70%短縮」はup2parts autoCAMの目標値であり、すべての加工で保証されるものではない。AI提案は最終的に人が確認・承認する設計で、責任はプログラマー側に残る。導入時は既存の工具データや加工実績の整備が前提になる。新機能紹介ウェビナー「Discover What's New in GibbsCAM 2027」は2026年11月19日（木）に2回開催される。日本時間では20日未明にあたる回もあるため、参加する際は時間を確認したい。","2026-11-16","The Machine Maker","https://themachinemaker.com/show-reports/clearer-setup-faster-validation-and-ai-assisted-programming-the-new-gibbscam-2027-and-cam-assist/"],["TIME選出の卓上CNC「NestWorks C500」、Formnextへ","TIME誌「Best Inventions of 2026」に選ばれた卓上CNC「NestWorks C500」が、11月17日から20日にドイツ・フランクフルトで開かれるFormnext 2026に出展する。800Wスピンドルは最大18,000回転、材料除去速度は最大で毎分80立方センチメートル。5本の自動工具交換や自動プロービングを備え、専用CAMソフトNestStudioと合わせて設計から加工までを1台でこなす。会場はホール11.0、ブースD69。","\n【概要】NestWorks C500は、TIME誌のBest Inventions of 2026に選出された卓上CNCマシンだ。11月17日から20日にフランクフルトで開かれるFormnext 2026に出展し、欧州の製造関係者に初めて紹介される。コンパクトな筐体に産業用に近い機能を詰め込み、試作や小ロット生産を社内で完結させることを狙う。【背景】デジタル設計を実際の部品にするには、専門的な機械や複雑な工程、外部メーカーへの依頼が必要で、小さなチームや個人の開発者には高い壁があった。NestWorksは「製造を創作プロセスの延長にする」という考えでC500を開発し、入門機と産業機の間を埋める位置づけにしている。TIME誌の選出が、その方向性を後押しした形だ。同社はハードウェアとソフト、アルゴリズムを一体で開発し、精密製造を誰もが使えるものにすることを掲げている。日本からの購入を検討する場合は、国内の販売代理店やサポート体制、電圧や安全規格への対応も含めて確認するとよい。【詳細】C500は剛性の高い構造に800Wのスピンドルを組み合わせ、最大18,000回転で材料除去速度は最大で毎分80立方センチメートルに達する。5本の自動工具交換、自動プロービングと工具設定、潤滑と切りくず排出の統合により、加工の手間を減らしている。専用CAMソフトのNestStudioが設計からツールパス生成までを効率化し、標準Gコードや他社製CAD/CAMソフトにも対応する。機能試作やカスタム部品、小ロット生産を社内で行い、試行錯誤の速度を上げられるという。【ポイント・注意点】発表はメーカー側のプレスリリースであり、性能値はカタログ上の最大値だ。実際の加工速度は材料や工具、加工条件によって変わる。価格や納期、対応材料の詳細は記事には示されていない。Formnext 2026の会場はホール11.0、ブースD69で、会期は11月17日から20日まで。現地で実機を確認できる貴重な機会だが、導入を検討する際は自社の材料での加工テストやサポート体制の確認が必要だ。","2026-11-16","PR Newswire","https://www.prnewswire.com/news-releases/time-recognized-nestworks-c500-to-showcase-desktop-cnc-manufacturing-at-formnext-2026-302937487.html"],["CNCルーター105機種の価格を毎晩チェック、最新セール情報","CNCルーターの価格比較サイトCNCRouterInfoが、2026年11月16日時点の価格・セール情報を更新した。掲載105機種のうち47機種に実売価格が付き、通常価格より10%以上安い機種を先頭に並べている。TwoTrees TTC 3018は22%安の123.26ドル、Genmitsu CubiKoは399ドルから。価格は毎晩各ショップから読み取られており、購入時はカートでの最終確認が必要だ。","\n【概要】CNCRouterInfoは、掲載するCNCルーターの価格を毎晩ショップから読み取り、更新している価格比較サイトだ。2026年11月16日時点の更新では105機種がセール対象で、うち47機種に確認済みの実売価格が付いている。通常価格より10%以上安い機種を先頭に並べ、予算帯別に整理している。【背景】卓上CNCルーターはメーカーや販売店が多く、同じ機種でも価格や付属品が異なるため、比較が難しい。セールやクーポンも頻繁に変わる。こうしたサイトは、価格の推移を継続的に記録することで、買い時や相場感をつかむ手助けをしている。スコア付けによる順位付けも行われている。【詳細】最も値下がり幅が大きいのはTwoTrees TTC 3018で、通常159ドルに対しAliExpressで123.26ドルと22%安い。Genmitsu CubiKoは399ドルから、Genmitsu 3018 PROVer V2は269ドルから、VEVOR 3018 Pro Maxは322.90ドルとなっている。500ドルから1,000ドルの帯では、Onefinity Apprenticeが995ドル、V1 Engineering LowRider CNC V4が650ドル。1,000ドルから2,000ドルの帯ではPrintNCが1,200ドルで最高スコア84点を獲得し、Sienci Labs LongMill MK3 30x30が1,400ドルで80点と続く。2,000ドル以上ではSienci Labs AltMill MK2 4x4が4,290ドルで88点、Avid CNC PRO4824が4,500ドルで86点と評価が高い。期間限定セールやクーポンは手作業で確認され、終了後は一覧から外れる仕組みだ。【ポイント・注意点】価格は2026年11月16日時点の確認値で、変動するため購入時はカートでの最終確認が必須だ。掲載価格に含まれるもの（スピンドル、バンドル内容、送料）は機種ごとに異なる。スコアはサイト独自の評価で、価値・剛性・精度・使いやすさ・能力を基準にしている。アフィリエイトリンクを含むが、スコアや順位には影響しないと明記されている。","2026-11-16","CNCRouterInfo","https://cncrouterinfo.com/deals/"],["LK Metrology「CAMIO 2026」、レニショーREVO 5軸に対応","LK Metrologyが三次元測定機（CMM）用ソフト「CAMIO 2026 R1」を発表した。レニショーのREVO 5軸スキャニングプローブに本格対応し、スイープスキャンやヘッドタッチなどの高度な測定戦略をCAMIOから直接プログラム・実行できる。I++/DME標準アーキテクチャにより、REVO搭載の他社製CMMとも連携でき、1つのソフトで混在する測定機を統一的に運用できる。","\n【概要】LK Metrologyは、三次元測定機（CMM）用の自社ソフト「CAMIO 2026 R1」を発表した。レニショーのREVO 5軸スキャニングプローブへの包括的な対応が中心で、REVOの高速・柔軟な5軸同期動作とCAMIOの検査機能を組み合わせ、複雑な形状の測定を効率化する。ブリッジ型や水平アーム型、ガントリー型のCMMに対応する。【背景】CNCで加工した部品の検査は、加工と同じくらい生産性を左右する。複雑な形状が増えるなか、測定プログラムの作成や実行に時間がかかると、検査がボトルネックになる。複数のメーカーの測定機が混在する現場では、ソフトごとに操作を覚える負担も大きい。メーカーを問わず使える開放型の測定プラットフォームへのニーズが高まっている。【詳細】CAMIOではREVOの検査ルーチンを直接プログラム・実行でき、スイープスキャンやヘッドタッチといった多軸測定戦略をフルに使える。プローブの動きと測定経路を最適化し、精度を保ちながら検査時間を大幅に短縮するという。直感的な操作画面とオフラインプログラミングにより、実機を止めずにプログラムを作成・検証・最適化できる。測定対象の形状によっては、REVOの効果が限定的な場合もあるため、自社の測定内容に合うかどうかを確認したい。REVO搭載の他社製CMMとも、業界標準のI++/DMEクライアント・サーバー構成で接続でき、専用のソフトやハード変更は不要としている。LK Metrologyによれば、5軸スキャニングソフトと幅広いREVO対応CMMを一社で提供できる点が強みだという。【ポイント・注意点】本記事はメーカー発表に基づくもので、検査時間の短縮率は具体的な数値が示されていない。実際の効果は測定対象の形状やプログラム内容によって変わる。REVO対応の恩恵を最も受けるのは、複雑形状の測定が多い現場だ。導入時は既存CMMの対応状況や、I++サーバーを持つUCCコントローラーの有無を確認したい。価格や提供開始時期は記事には示されていない。","2026-11-16","Quality Magazine","https://www.qualitymag.com/articles/100072-lk-metrology-camio-2026-with-renishaw-revo-5-axis-integration"],["MTDCNC週間まとめ、加工14.5%高速化など21本の動画","英国のCNC情報サイトMTDCNCが週間まとめを公開した。加工速度14.5%向上、無人夜間運転、複雑部品の段取り時間を2週間から2日へ短縮といった話題を含む21本の動画ハイライトを収録している。FANUC、オークマ、VERICUT、ソリッドCAM、GROBなど多数の企業が登場する。GROBの創業100周年オープンハウス（11月18〜19日、ストラトフォード・アポン・エイボン）の予告もある。","\n【概要】MTDCNCの週間まとめは、CNC加工や自動化、切削工具、ソフト、積層造形を扱う21本の動画ハイライトを集めたものだ。加工速度14.5%の向上、無人での夜間運転、複雑な部品の段取り時間を2週間から2日へ短縮した事例などが紹介されている。FANUCやオークマ、VERICUT、ソリッドCAM、GROBなど、20社以上の企業が登場する。【背景】CNC加工の現場では、加工速度の向上と無人運転の拡大が大きなテーマだ。人手不足や納期短縮の圧力が強まるなか、段取りや検証にかかる時間をどう減らすかが競争力を左右する。MTDCNCは英国を中心に、現場の事例を動画で伝えるメディアとして、週ごとに話題をまとめている。【詳細】登場企業はFANUC、FIMS Manufacturing、DN Solutions、Muffett Engineering、LANG Technik、VERICUT、Okuma、INDEX USA、SolidCAM、AXILE、MCI Tool、Integral、Tezmaksan、Maquinser、IBARMIA、3nine、SPINNER、Phillips Additive、Autodesk、HAIMER、GROBと幅広い。内容は加工、自動化、切削工具、ソフト、積層造形にわたる。記事ではGROBの創業100周年を記念したオープンハウスも予告されており、2026年11月18日から19日にストラトフォード・アポン・エイボンの技術・応用センターで開かれる。単なる見学会ではなく、小規模な展示会のような規模になるという。【ポイント・注意点】本記事は動画ハイライトのまとめで、各事例の詳細な数値や条件は動画本体の確認が必要だ。「14.5%高速化」や「2週間から2日へ」といった数字は、特定の事例における成果であり、すべての加工に当てはまるものではない。GROBのオープンハウスは11月18日から19日で、参加を検討する場合は事前の情報確認をおすすめする。動画の詳細はMTDCNCのサイトで確認できる。","2026-11-15","MTDCNC","https://mtdcnc.com/news/mtdcnc/faster-machining-overnight-automation-21-video-highlights-mtdcnc-week-in-review/"],["高精度CNC旋盤メーカー8社、DMG森精機が1位に","金属部品生産向けの高精度CNC旋盤メーカー8社ランキングが発表された。1位はDMG MORI、2位はマザック、3位は中国のJuxin（巨鑫）で、4位にオークマが続いた。評価軸は精度、自動化対応、機種の幅、用途適合性、品質検証、サポート体制の6項目。CNC工作機械市場は2026年に791億4000万ドル、旋盤セグメントは313億1000万ドルに達するとの予測も示された。なお本ランキングは編集部による評価で、業界団体の公式認定ではない。","\n【概要】金属部品生産向けの高精度CNC旋盤メーカーを8社に絞ったランキングが発表された。1位はDMG MORI、2位はマザック、3位は中国のJuxin Machine Tool、4位はオークマ、5位は台湾のVictor Taichung、6位は瀋陽工作機械（SMTCL）、7位は斗山工作機械（DNソリューションズ）、8位はHardingeという順位だ。評価は6つの基準を総合した編集部の判断による。【背景】旋盤の需要は、CNC工作機械全体の拡大のなかにある。Mordor Intelligenceの予測では、世界のCNC工作機械市場は2026年に791億4000万ドル、旋盤セグメントは313億1000万ドルに達する。量産部品では繰り返し精度や無人運転への対応が選定の鍵になっている。【詳細】評価基準は、精度と連続生産時の熱挙動、自動化・統合への対応、旋盤の機種の幅、シャフトやディスク部品への適合性、品質検証の実績、輸出市場でのサポート体制の6項目。DMG MORIは熱補償や体積精度、バー送りやロボット統合による自動化が評価された。マザックは対話型制御MAZATROLや複合加工機の幅が強みとされた。3位のJuxinは2005年創業の中国メーカーで、シャフト・ディスク部品に特化し、ハーフシャフトやブレーキディスクの無人ライン統合を手がける。工場面積は10,666平方メートル、従業員80名、年間約2,000セットの生産能力で、50件超の特許を持つという。オークマは自社製OSP制御と剛性・熱安定性が評価された。5位以下はVictor Taichungの自社鋳造による垂直統合、SMTCLの品揃えの広さ、DNソリューションズの重切削向けのコスト性能、Hardingeの超精密・小径加工がそれぞれの特徴とされた。【ポイント・注意点】本ランキングは編集部による評価で、業界団体や認証機関の公式な順位ではない。PR色の強い記事であり、3位のJuxinに関する情報はメーカー側の開示に基づく。順位は「金属部品の量産」という特定の用途に合わせたもので、超精密加工や小径部品を重視する場合は別の順位になる。市場予測の数値は調査会社によって異なる。購入の際は、自社の部品形状や生産形態に合わせた仕様検討と受入試験が欠かせない。","2026-11-15","EIN Presswire","https://www.einpresswire.com/article/955976187/top-8-high-precision-cnc-lathe-machine-companies-in-2026-for-metal-parts-production"],["卓上CNC選びの比較ガイド、用途別の最適解を整理","卓上CNCの比較ガイドが2026年11月12日に更新された。木材・樹脂向けにはShapeokoやOnefinity、入門にはGenmitsu 3018、金属やワックスの小型精密加工にはCarbide 3D Nomadが推奨されている。作業面積、スピンドルとルーターの違い、ソフトとコントローラー、安全対策、固定方法、予算帯までを網羅し、価格帯別の選び方を表で示す。機種名や仕様は変わりやすいため、購入前にメーカーサイトでの確認を促している。","\n【概要】卓上CNCの比較ガイドが2026年11月12日に更新された。用途と素材に合わせて機種を選び分けるためのもので、木材・樹脂、プラスチック、アクリル、アルミ・真鍮、フォームやワックス、基板といった素材別に適した機械を整理している。初心者から小規模工房までを対象に、作業面積や剛性、ソフト、安全面まで幅広くカバーする。【背景】卓上CNCは種類が多く、初めての購入では何を基準に選べばよいか分かりにくい。価格だけで決めると、加工したい材料に対応できなかったり、作業面積が足りなかったりする。用途と素材を先に決め、それに合う剛性や制御方式を選ぶことが失敗を減らす近道だ。【詳細】ガイドの推奨は、木材や樹脂の本格的な加工にはCarbide 3D ShapeokoやOnefinity Woodworker、入門にはGenmitsu 3018やSainsmartの小型キット、金属やワックスの小型精密部品にはCarbide 3D Nomadが挙げられている。予算帯では、Genmitsu 3018系が入門帯、Genmitsu PROVerXLやSainsmart Prover、Shapeokoの入門モデルが中間帯、OnefinityやShapeoko 5 Pro、Nomad、Bantam Toolsが上位帯とされる。スピンドルとトリマールーターの違い、GRBL系コントローラーと専用コントローラーの違い、Carbide CreateやFusion、VCarveといったCAMソフトの選択肢も解説されている。安全面では保護メガネと聴覚保護、集塵、作業中の放置禁止、非常停止ボタンの設置が挙げられている。固定方法ではクランプやスポイルボード、真空テーブル、エンドミルの種類が紹介されている。【ポイント・注意点】機種名や仕様は頻繁に変わるため、購入前にメーカーの公式サイトで現行モデルを確認するよう注意書きがある。アルミの加工は剛性の高い機械でも浅い切り込みや適切な工具、冷却が前提で、入門機での継続的な金属加工は想定されていない。集塵は健康と火災の両面で重要だ。手持ちルーターやレーザー、メーカースペースの利用といった代替案も紹介されており、購入前に試す選択肢として参考になる。","2026-11-12","QualiReviews","https://qualitreviews.com/best-cnc-machines/"],["GROBインド製5軸マシニングセンタ「G550a」、IMTEX 2027で初披露","GROBインドが、インド国内工場で製造した初の5軸マシニングセンタ「G550a」を、2027年1月21日から27日にベンガルールで開かれるIMTEX 2027で初披露する。製造拠点はアーンドラ・プラデーシュ州グディパリ工場で、会場はホール4・A110ブース。Gシリーズのエントリーモデルで、航空宇宙と半導体分野を主眼に置く。重切削向け5軸機「G352」も同時展示される。","\n【概要】GROBインドが、インド国内の工場で製造した初の5軸マシニングセンタ「G550a」を、IMTEX 2027で初披露する。会期は2027年1月21日から27日で、会場はベンガルールのバンガロール国際展示場（BIEC）、ホール4のA110ブースだ。インド製造による短納期やコスト面の利点を前面に出し、ドイツの5軸技術を現地で提供する姿勢を示している。【背景】インドの製造業は、従来の加工から精密・自動化された5軸加工へと急速に移行している。GROBインドは2009年設立で、ドイツ・ミンデルハイムに本社を置くGROBグループの一員だ。グディパリ工場で5軸マシニングセンタや自動化システム、eモビリティ駆動装置を製造している。現地生産により、納期短縮や総所有コストの低減、きめ細かなライフサイクル支援を狙う。【詳細】G550aはGROBのGシリーズのエントリーモデルで、コンパクトな設置面積と高精度・大量生産への対応が特徴だ。汎用加工や金型用途も想定されている。会場では重切削向けの5軸機「G352」も展示され、1段取りでの同時5軸加工や複雑加工に対応するという。両機とも水平スピンドルと上下逆向きの加工による切りくず排出、広い軸移動量、干渉のない加工空間、自動化対応を備える。デジタル製造ソリューションとして、リアルタイムの機械監視や工程最適化を行うGROB-NET4Industry、専用の旋削ソフト、自動スピンドル診断も紹介される。IMTEX 2027での主眼は航空宇宙と半導体分野で、自動車や金型、エネルギー、一般機械の来場者も歓迎するという。【ポイント・注意点】本記事はメーカー発表に基づく展示予告で、G550aの詳細な仕様や価格は示されていない。インド製であることの利点として、短納期やコスト、現地サポートが挙げられているが、品質はグローバル基準を維持するとしている。IMTEX 2027は2027年1月21日から27日までと先の話で、会期中の実機確認が判断材料になる。GROBインドのマネージングディレクターは「ドイツの5軸精度が、もはや遠いものではなくインドで製造される」とコメントしている。","2026-11-12","The Machine Maker","https://themachinemaker.com/imtex/grob-india-to-debut-its-india-built-g550a-5-axis-machining-centre-at-imtex-2027/"],["IBARMIAの新型5軸ポータル加工機、11月20日の社内イベントで発表","スペインの工作機械メーカーIBARMIAが、新型「Pシリーズ」を2026年11月20日にアスコイティア本社で開くオープンハウスイベント「OPENTUNITY 2026」で発表する。5軸ポータル加工技術を間近で見られるほか、インタラクティブな新体験も用意されるという。詳細な仕様や対象業種、性能数値はまだ公表されておらず、イベントでの公開が待たれる。参加には事前登録または招待が必要だ。","\n【概要】スペインの工作機械メーカーIBARMIAが、新型「Pシリーズ」を2026年11月20日に本社で開くオープンハウスイベント「OPENTUNITY 2026」で発表する。会場はバスク地方のアスコイティアにある同社施設で、5軸ポータル加工技術を間近で見られる機会になる。数週間にわたるティーザー発信の締めくくりとして位置づけられている。【背景】工作機械の新機種発表は、展示会だけでなく自社イベントで行う例が増えている。自社拠点なら実機の稼働や加工デモをじっくり見せられ、来場者と直接対話できる。IBARMIAはPシリーズの発表に合わせて、機械の見せ方そのものにも新しい試みを加えているという。【詳細】イベントではPシリーズの実機展示に加え、同社が「新しいインタラクティブな体験」と呼ぶ展示も用意される。IBARMIAはバスク地方に拠点を置く工作機械メーカーで、5軸ポータル加工機を得意としている。ポータル構造は大型部品の加工で剛性を確保しやすい形式で、航空宇宙やエネルギー分野などでの利用が想定される。会場は同社のアスコイティア施設だ。イベントの詳細はMTDCNCの記事やIBARMIAの案内で確認できる。来場者は技術に直接触れられるほか、事前登録または招待による参加案内が出されている。記事によれば、発表内容は5軸ポータル加工技術を中心としたもので、製造やイノベーション、バスクの産業をテーマに掲げている。ただし、対象業種や機械仕様、性能や生産、投資に関する数値は現時点では公表されていない。【ポイント・注意点】現段階で分かっているのは発表の日時と場所、5軸ポータル加工機であることだけで、仕様や価格、納期は不明だ。イベントは2026年11月20日の1日開催で、参加には登録または招待が必要とされている。導入を検討する場合は、イベント後の詳細発表や実加工のデモ情報を待つ必要がある。IBARMIAの発表は、欧州の工作機械メーカーが自社イベントを活用する流れの一例でもある。発表後に仕様や価格が明らかになれば、他社の既存5軸機との比較が可能になる。","2026-11-10","MTDCNC","https://mtdcnc.com/news/ibarmia/ibarmia-p-series-to-debut-at-opentunity-2026/"],["マザック複合加工機、エネルギー部品を1段取りで完成","オーストラリアの工作機械商社John Hartが、マザックの新型複合加工機「Integrex j-300S NEO」によるエネルギー産業向け複雑部品の加工事例を2026年11月10日に紹介した。複雑な形状の部品を最初から最後まで1段取りで仕上げる能力が特徴だ。同社のニュース一覧では、Variaxis i-800TやHCN-6800 NEOなど、マザックNEOシリーズの最新機種の紹介が続いている。","\n【概要】オーストラリアの工作機械商社John Hartが、マザックの新型複合加工機「Integrex j-300S NEO」の加工事例を2026年11月10日に紹介した。エネルギー産業向けの複雑な部品を、最初から最後まで1段取りで仕上げる能力が特徴だ。複合加工機の強みである工程集約を、実際の部品で示した内容になっている。【背景】複雑な部品は、従来は複数の機械に段取り替えして加工するため、段取り回数や位置決め誤差、リードタイムが課題になる。複合加工機は旋削とミーリングなどを1台に集約し、1段取りで完成させることで、こうした課題を減らす。エネルギー産業の部品は形状が複雑で精度要求も高く、複合加工機の得意分野とされる。【詳細】Integrex j-300S NEOは水平型の複合加工機で、複雑なエネルギー部品を1段取りで加工できるという。John Hartのニュース一覧では、11月6日にデジタル化社会の基盤づくり、11月5日にマザックVariaxis i-800Tによる効率化、11月2日にHCN-6800 NEOによる重切削や熱安定性、柔軟な自動化の話題が並んでいる。10月30日にはオーストラリア初のVariaxis C-700の加工デモ、10月28日にはIntegrex i-200ST NEOの紹介もあり、NEOシリーズの新機種が相次いで登場していることが分かる。【ポイント・注意点】本記事はニュース一覧ページのトップ項目で、部品の具体的な材質や寸法、加工時間などの詳細は示されていない。実加工の動画や詳細は「Read more」先の個別記事での確認が必要だ。1段取りで仕上げる能力は複合加工機の一般的な利点であり、対象部品や加工内容によって効果は変わる。John Hartはオーストラリアで80年の歴史を持つ工作機械商社で、マザック製品の販売とサポートを手がけている。ニュース一覧ではNEOシリーズの新機種紹介が続いており、現地の製造業への導入が進んでいることがうかがえる。詳細はJohn Hartのニュースページで確認できる。","2026-11-10","John Hart","https://www.johnhart.com.au/news/latest-news/cnc-machine-tools"]],"cricut":[["フェイクレザーのクリスマス企画、25日間毎日新作を公開","フェイクレザークラフト作家のAmy Romeuが、11月1日から25日まで毎日新しいホリデープロジェクトを公開する「ホリデークラフトカレンダー」を開催中だ。11月16日はイニシャルオーナメント、15日はクリスマスストッキングのリストレット。毎日のSVGは24時間限定で50%オフになる。25日分すべてに生涯アクセスできるパスも用意されている。ページは11月16日に更新された。","\n【概要】フェイクレザークラフト作家のAmy Romeuが、11月1日から25日まで毎日新しいホリデープロジェクトを公開する「ホリデークラフトカレンダー」を開催している。Cricutで作るフェイクレザーの小物が中心で、毎日のSVGは24時間限定で50%オフになる。11月16日時点ではDay 16まで公開されており、ページも同日に更新された。【背景】クリスマス商戦に向けて、手作りの小物やギフト需要が高まる時期だ。フェイクレザーは本革より扱いやすく、Cricutでカットできる素材として人気がある。アドベントカレンダー形式の企画は、毎日新しいデザインを楽しみにしてもらう仕掛けで、作家のファン層を広げる狙いもある。【詳細】公開済みのプロジェクトは、Day 1のボウコードキーパー、Day 2のレッツイットスノーブックマーク、Day 3のウィンターツリーパーシュチャーム、Day 4の写真キーホルダー、Day 5のクリスマスライトプランナークリップ、Day 6のボウオーナメントイヤリング、Day 7のポインセチアミニコインパース、Day 8のキャンディクォーターキーパー、Day 9のリースフォトマグネット、Day 10のホリデーグースバッグチャーム、Day 11のジンジャーブレッドマグネティックブックマーク、Day 12のホリデートリンケットトレイ、Day 13のペパーミントモカキーチェーン、Day 14のジンジャーブレッドクッキーイヤリング、Day 15のクリスマスストッキングリストレット、Day 16のイニシャルオーナメントとなっている。各SVGは発売から24時間は50%オフで、その後は通常価格に戻る。25日分すべてに生涯アクセスできる「ホリデークラフトカレンダーパス」も用意され、フェイクレザークラフターズクラブに入会すると無料で付いてくるという。【ポイント・注意点】毎日の割引は24時間限定で、買い逃すと通常価格になる。パスを買えば日々の購入を気にせず25日分すべてを入手できる。SVGの利用にはCricutなどのカッティングマシンとフェイクレザー素材が必要で、作り方の詳細は各プロジェクトのページで確認したい。企画は11月25日まで続き、残りのデザインも毎日追加される。","2026-11-16","Amy Romeu","https://amyromeu.com/holiday-craft-calendar-event-2026/"],["Cricut向け無料SVGサイト10選、2026年最新リスト","Cricut向け無料SVGファイルを配布するサイト10選が2026年11月14日に更新された。スクラップブッキング向けのLove Paper Crafts、約1000ファイルを20カテゴリーで揃えるCraftables、スローガン系に強いCreative Fabrica、アイコンが豊富なSVG Repoなどが並ぶ。無料SVGはDesign Spaceへアップロードして使う。販売用に使う際は各サイトの利用規約の確認が必要だ。","\n【概要】Cricut向けの無料SVGファイルを配布するサイト10選が、2026年11月14日に更新された。スクラップブッキングやカード作り、窓や鏡のデカール、スローガンステッカーなど、用途別に使えるサイトが並ぶ。いずれもDesign Spaceにアップロードして使う無料ファイルが中心だ。【背景】SVGファイルはクラフトの素材として欠かせないが、有料のものも多く、無料で良質なファイルを探すのは手間がかかる。配布サイトをまとめたリストは、初心者がまず試す素材を手早く見つけるための定番コンテンツになっている。更新版では、現在も使えるサイトが整理されている。【詳細】紹介されているのは、スクラップブッキング向けのLove Paper Crafts、20カテゴリーで約1000ファイルを持つCraftables、スローガンや引用ステッカーに強いCreative Fabrica、アイコン集のSVG Repo、ファイルサイズを選んでダウンロードできるFree SVG、40ページ超のデザインとフォントも揃うFree SVG Designs、名言や宗教的な文言、デジタルペーパーも扱うHello SVG、1,120超の無料SVGを持つCaluya Design、会員制で商用向け素材も多いCraft Bundles、植物や動物、ホリデースローガンに強いCraft House SVGの10サイトだ。SVGのアップロードはDesign Space左下のアップロードアイコンから行い、PNGやBMP、GIFも利用できるという。【ポイント・注意点】無料ファイルでも、商用利用の可否はサイトやファイルごとに異なる。販売用の製品に使う場合は、各サイトのライセンスや利用規約を必ず確認したい。SVGはベクター形式のため、写真のような細かい質感の画像には向かない。アカウント登録が必要なサイトもある。記事の元は2022年のWordPress投稿で、2026年11月14日に更新されたものだ。リストは随時更新されるため、リンク切れの際はサイト名で検索し直すとよい。","2026-11-14","WriteUpCafe","https://writeupcafe.com/top-10-websites-for-svg-files-for-cricut-updated-list"],["Cricut新ステッカーマシン「StickerPix」2機種を解説","Cricutが新製品ライン「StickerPix」の紹介記事を更新した。印刷とカットができる「StickerPix Print + Cut」と、印刷専用の「StickerPix Print」の2機種で、昇華型印刷とラミネート加工により高画質で耐水・耐傷・耐退色のステッカーや写真プリントを作れる。2026年9月24日に発売された。Design Spaceのワンクリック写真変換や編集可能テンプレートと連携する。","\n【概要】Cricutの新しいステッカーマシン「StickerPix」の紹介記事が更新された。印刷とカットができる「StickerPix Print + Cut」と、印刷専用の「StickerPix Print」の2機種があり、昇華型印刷とラミネート加工で高画質のステッカーや写真プリントを自宅で作れる。2026年9月24日に発売された製品ラインだ。【背景】従来のCricutカッティングマシンでステッカーを作るには、家庭用インクジェットプリンターが別途必要だった。StickerPixは印刷機能を内蔵し、写真やステッカー作りを1台で完結させる。スマホのカメラロールから直接デザインできる手軽さが特徴で、スクラップブッキングやメモリーキーピングの需要を狙っている。【詳細】両機とも昇華型印刷を採用し、インク滴を吹き付けるのではなく熱で染料を素材に転写するため、なめらかで連続的な色表現が得られるという。印刷と同時にラミネート加工も行われ、耐水・耐傷・耐退色の仕上がりになる。Print + Cutは4×7インチのステッカーシートと4×6インチの写真用紙に対応し、精密切断ができる大型機（8×11.3×4.1インチ）だ。Printはプレカット済みステッカーシートを使い、円形1.5インチ、長方形1×2.6インチ、正方形1.5インチ、写真用紙4×6インチに対応する小型機（7.8×5×3.5インチ）だ。Design Spaceではワンクリックの写真変換や編集可能なテンプレートが使える。カッティングマシンとの違いとして、StickerPixはキスカットのみで、ダイカットはできない。またラミネートは印刷工程に組み込まれている。【ポイント・注意点】StickerPixは12歳以下の子ども向けではないと明記されている。利用にはBluetooth対応のスマホやタブレット、パソコンと高速インターネットが必要だ。一部のソフト機能は有料サブスクリプションが必要になる。Print + Cutのみがカット機能を持ち、Printはプレカットシート専用だ。記事は2026年9月の発売時の内容を、11月13日に更新したものだ。","2026-11-13","Cricut Blog","https://cricut.com/blog/introducing-cricut-stickerpix/"],["無料SVGで作る立体クリスマスマウス、プレゼント抱えた愛らしい姿","ペーパークラフトブログが、立体レイヤードのクリスマスマウス無料SVG（デザイン#333）を2026年11月13日に公開した。Cricut Makerでカードストックを重ねて作る自立式の飾りで、完成サイズは約4.5×4.5インチ。スコア線への変更やアタッチなど、Design Spaceでの手順を7ステップで解説し、組み立て動画も付く。無料リソースライブラリからのダウンロードにはニュースレター登録が必要だ。","\n【概要】ペーパークラフトブログ「All Things Were Created」が、立体レイヤードのクリスマスマウス無料SVG（デザイン#333）を2026年11月13日に公開した。プレゼントを抱えたネズミの自立式ペーパークラフトで、Cricut Makerでカードストックを重ねて作る。マントルや棚、ティアードトレイなどの飾りに向いている。【背景】クリスマスの飾りは、立体感のあるペーパークラフトが人気だ。レイヤードデザインは色ごとにカットしたカードストックを重ねることで、奥行きのある仕上がりになる。無料SVGの配布は、ブログの読者を増やす定番の方法で、季節のデザインが次々と公開されている。【詳細】完成サイズは約4.5インチ×4.5インチで、11枚のマットに分けてカットする。使うのはCricut Maker（Exploreでも可）、12×12インチのライトグリップマット、スコアリングホイールまたはスタイラス、8.5×11インチのカードストック（白・ライトグレー各1枚）と、6×6インチのカードストック（黒・ダークグレー・ダークレッド・ブライトレッド・ライトピンク・ダークピンク・オリーブ・イエロー・グリーン）、接着剤、ブレイヤー、ボーンフォルダー、ピンセットだ。手順は、SVGのダウンロード、Design Spaceへのアップロードとグループ解除、カット線1本をスコア線に変更、グループのアタッチ、マットプレビュー、ミディアムカードストックの細かいカット設定でのカット、組み立ての7ステップ。組み立て動画も用意されている。ダウンロードは無料リソースライブラリからで、パスワードはニュースレターの末尾に記載されている。【ポイント・注意点】スコア線への変更は、レイヤーパネルで該当する線を探し、操作を「スコア」に切り替える作業が要になる。見落とすと折り目が付かない。デザインの再配布は禁止で、個人利用または自宅での商用利用は200回までとされている。ファイルはZIP形式で、解凍してからアップロードする必要がある。","2026-11-13","All Things Were Created","https://allthingswerecreated.com/christmas-mouse-present-svg/"],["クラフター向けブラックフライデー10選、Maker 5やStickerPixが対象","クラフトブログFirst Day of Homeが、2026年のブラックフライデーで注目するクラフター向けセール10選を11月12日に更新した。xTool C1カラーカッター、F2レーザー、Cricut StickerPix、Maker 5、Joy 2、xTool M2などが並ぶ。Maker 5は3mm厚までの切断・彫刻に対応する最上位機、Joy 2は幅4.5インチまでの小物向け。xToolの50ドル引きクーポン「XTOOLGIFT50」も紹介されている。","\n【概要】クラフトブログFirst Day of Homeが、2026年のブラックフライデーで注目するクラフター向けセール10選を11月12日に更新した。レーザー機やステッカーマシン、カッティングマシン、デジタル素材、クラフト用品まで幅広く、多くはすでに販売中だ。目玉はxToolの新機種C1カラーカッターと、CricutのMaker 5やStickerPixだ。【背景】クラフト機器の業界は2026年に新製品が相次ぎ、レーザーとカットの境界が薄くなっている。ブラックフライデーは高額な機器を安く買う好機で、ブログでは「ほしいものリストにある大物だけを狙う」ことをすすめている。価格は随時更新されるという。【詳細】1位はxTool C1カラーカッターで、内蔵スキャナーと4色インクジェットプリンターを備え、スキャン・印刷・カットを1台でこなす。2位は携帯型のxTool F2デュアルレーザーで、ダイオードと赤外線の2種のレーザーを搭載する。3位はCricut StickerPixで、写真やステッカーの品質が従来機より高いとされる。4位はCricut Maker 5で、300種類以上の素材に対応し、3mm厚までの切断・彫刻が可能。従来のMaker 4からの主な変更点は3mm対応と小型・軽量化だ。5位はCricut Joy 2で、幅4.5インチまでのカードやラベル、ビニールデカール向けの小型機。6位はxTool M2（40W）で、レーザーとブレードカット、インクジェットを組み合わせたハイブリッド機。7位はCreative Fabricaで、10点の無料デザインがもらえる無料トライアルがある。8位は著者のショップのデジタルパターン類、9位はWe R Memory Keepersのオールインワンツール、10位はArtistroのペイントマーカー100本セットで、通常価格から32%オフとされている。xToolの追加50ドル引きクーポン「XTOOLGIFT50」も紹介されている。【ポイント・注意点】記事は2026年11月2日に公開され、11月12日に更新されたもので、価格は変わる可能性がある。C1やM2、F2はxToolの製品で、Cricutのライバル機にあたる。Maker 5の詳細は著者のレビュー記事へのリンクで確認できる。クーポンには適用除外があるため、購入前に条件を確認したい。","2026-11-12","First Day of Home","https://www.firstdayofhome.com/black-friday-deals/"],["Design Spaceベータv10.12、準備画面の統合や156件の不具合修正","Cricut Design Spaceのデスクトップ版ベータv10.12のリリースノートが2026年11月11日に公開された。Explore 5／Maker 5のセットアップで「カット準備」と「Go」画面を1つに統合し、キャンバスのスクロール範囲を制限して見失いにくくした。過去6週間で156件の不具合を修正し、StickerPix関連の接続・表示トラブルや、DTFプロジェクトの不具合、保存・自動保存周りの問題などに対応している。","\n【概要】Cricut Design Spaceのデスクトップ版ベータv10.12のリリースノートが2026年11月11日に公開された。Explore 5とMaker 5の新規セットアップで「カット準備」と「Go」画面を1つに統合したほか、キャンバスのスクロール範囲をデザイン領域の3倍までに制限し、見失いにくくした。過去6週間で156件の不具合を修正している。【背景】Design SpaceはCricutマシンの操作ソフトで、頻繁に更新されている。新機種のExplore 5やMaker 5、StickerPixの登場に伴い、セットアップ画面や接続まわりの不具合が増えていた。ベータ版のリリースノートは、正式版への反映前に修正内容を公開するものだ。【詳細】今回の主な変更は、Explore 5／Maker 5のセットアップ画面の統合、キャンバススクロールの範囲制限、フィールド表示の不具合修正など。StickerPix関連では、停電時にエラーメッセージが出ない問題、2つ目のウィンドウを開くと接続が切れる問題、ファームウェア更新の自動リトライ、テンプレート表示の不具合など多数が修正された。DTFプロジェクトでは、カートの数量表示やデザイン領域のサイズが変わる問題が修正された。そのほか、Ctrl+SやCmd+Sで保存できない問題、Wi-Fi接続の失敗、背景除去のクラッシュ、AI生成ステッカーの追加に時間がかかる問題、保存ボタンの無効化、Pauseボタンの誤表示、画像の価格表示ミスなど、幅広い修正が含まれている。【ポイント・注意点】ベータ版のため、正式版への反映時に内容が変わる可能性がある。リリースノート本文には「このDesign Space for Desktop Beta release（v10.11）」と書かれており、見出しのv10.12と表記が食い違っている箇所がある。修正は156件にのぼるが、自分の使い方に当たるものがあるかどうかは、リリースノートの項目を確認するのが確実だ。正式版の公開時期は未定だ。","2026-11-11","Cricut Help Center","http://help.cricut.com/hc/en-us/articles/27054006457111-Design-Space-Release-Notes"],["パトロン投票で選ばれたカーディナルのシャドウボックス","ペーパークラフト作家のMiss Mandeeが、冬鳥カーディナルのシャドウボックス無料カットファイルを2026年11月11日に公開した。毎月Patreonの支援者が選ぶプロジェクトの11月分で、レイヤーの重ね順ガイド付き。接着剤とフォームテープを使い分けて立体感を出す。Adobe Illustratorで設計し、Cricut Makerでカットした。ダウンロードはGoogleドライブ経由で提供されている。","\n【概要】ペーパークラフト作家のMiss Mandeeが、冬鳥カーディナルのシャドウボックス無料カットファイルを2026年11月11日に公開した。毎月Patreonの支援者が投票で選ぶプロジェクトの11月分で、色とりどりのカードストックを重ねて作る冬の飾りだ。レイヤーの重ね順ガイドが付いている。【背景】カーディナルは冬の飾りで人気の鳥で、赤い姿が雪景色に映える。Miss Mandeeはプロのグラフィックデザイナーで、Adobe Illustratorでデザインし、Cricut Makerでカットしている。Patreonの支援者が毎月作るものを選ぶ仕組みで、読者参加型の企画になっている。【詳細】ダウンロードにはレイヤーの重ね順ガイドが含まれ、接着剤とフォームテープを使い分けて深さを出す。作者はフォームテープを一部の層に、接着剤をほとんどの層に使ったという。作者はカーディナルが生息しない地域に住んでおり、旅行先で見かけると特別に感じるというエピソードも添えられている。デザインはCricut Makerでカットされ、完成品の写真も掲載されている。ダウンロードはGoogleドライブ経由で提供され、チップによる支援も呼びかけられている。シャドウボックスは、額縁状の箱の中に重ねた紙を配置する飾りで、光と影で立体感が出る。カーディナルの赤は冬のインテリアのアクセントになり、クリスマスだけでなく冬の間ずっと飾れるデザインだ。Instagramでのタグ付けやFacebookグループでの共有も案内されている。完成品を共有すると、作者やほかの作り手と交流できる。カーディナルのデザインは、作者のバードウォッチングの経験から生まれたものだ。【ポイント・注意点】無料ファイルだが、記事にはアフィリエイトリンクが含まれている。レイヤーの重ね順ガイドをよく読んでから貼り付けると、立体感を出しやすい。フォームテープは厚みを出したい層に、接着剤は平らに貼りたい層に使うのが作者の方法だ。カーディナルの生息地や生態に興味がある人は、作者のバードウォッチングのエピソードも楽しめる。","2026-11-11","Designs By Miss Mandee","https://www.designsbymissmandee.com/2026/11/cardinal-shadowbox/"],["無料SVGファイル6選、商用利用の可否とライセンスを解説","無料SVGファイルの入手先6選を紹介するガイドが2026年11月11日に更新された。パブリックドメインのOpenclipart、アイコン集のSVG Repo、Design Spaceの無料画像、Creative Fabricaの無料配布、Pixabay、Wikimedia Commonsを比較し、商用利用の可否やライセンスの注意点を解説。パターン塗りを含むSVGはDesign Spaceでエラーになるため、単色フラットなファイルを選ぶのがコツだという。","\n【概要】無料SVGファイルの入手先6選を紹介するガイドが2026年11月11日に更新された。Openclipart、SVG Repo、Cricut Design Spaceの無料画像、Creative Fabricaの無料配布、Pixabay、Wikimedia Commonsを比較し、ライセンスや商用利用の可否、Design Spaceへのアップロード時の注意点を解説している。【背景】無料SVGはシャツやマグ、看板、ステッカー、カード、レーザー加工など、クラフトや小規模ビジネスの素材として広く使われている。問題は「どこで手に入るか」ではなく、「顧客に渡す製品に使えるか」「カットソフトで正しく開けるか」だ。ライセンスを誤るとトラブルのもとになる。【詳細】Openclipartはすべての画像がパブリックドメイン（CC0）で、製品への商用利用も可能とされている。SVG Repoはオープンライセンスのアイコン集で、基本は帰属表示不要だが、アイコンごとに独自のライセンスがあるため個別確認が必要だ。Design Spaceの無料画像は「画像」から「無料」を選ぶと見つかるが、期間限定のものもあるため、気に入ったものは早めにダウンロードするのがよいという。Creative Fabricaの無料配布はローテーションで変わる。Pixabayは帰属表示不要だが、商標や商品化には制限がある。Wikimedia Commonsは旗や図版、歴史的な美術作品が豊富だが、ファイルごとにライセンスが異なり、改変物の共有条件が付くものもある。技術面では、パターン塗り（グラデーションやテクスチャ、写真など）を含むSVGはDesign Spaceで非対応エラーになる。単色フラットのファイルが最も扱いやすいという。【ポイント・注意点】商用利用の前には、必ずファイルごとのライセンスを確認したい。特にPixabayは未加工のまま再配布できないなど、細かい条件がある。Wikimedia Commonsのライセンスには、改変版を同じライセンスで共有する義務が付くものがある。購入前にテストカットをし、レイヤーが正しく分離されるか確認するのがすすめられている。記事は2026年10月22日公開、11月11日更新のものだ。","2026-11-11","Lilach Bullock","https://www.lilachbullock.com/where-to-get-free-svg-files/"],["豪州のCricutブラックフライデー、最大60%オフの価格一覧","オーストラリアのCricutブラックフライデーセールを報じる記事が2026年11月11日に公開された。11月11日から対象製品が最大60%オフで、販売店はSpotlight、Harvey Norman、Officeworks、BIG W。Joy 2バンドル199豪ドル、Joy Xtra 299豪ドル、Explore 5バンドル369豪ドル、Maker 5バンドル649豪ドルなど。ヒートプレスや消耗品も割引対象だ。","\n【概要】オーストラリアのCricutブラックフライデーセールを報じる記事が2026年11月11日に公開された。11月11日から対象製品が最大60%オフになり、販売店はSpotlight、Harvey Norman、Officeworks、BIG Wだ。カッティングマシンやバンドル、ヒートプレス、消耗品まで幅広く、具体的な価格が一覧で示されている。【背景】クリスマス商戦に向けて、Cricutはオーストラリアでも大型セールを実施している。日本では未発売のモデルや、限定カラーのバンドルもあり、現地の価格は日本の購入検討にも参考になる。記事は公式発表を受けたニュースで、価格と販売店が明記されている。【詳細】価格は次の通り。Joy 2エッセンシャルバンドルは249豪ドルから199豪ドル（最大20%オフ）、Joy Xtraバンドルは429豪ドルから299豪ドル（最大30%オフ、Harvey Norman限定）、Explore 4エッセンシャルバンドルは499豪ドルから349豪ドル（BIG W限定）、Explore 5エッセンシャルバンドルは449豪ドルから369豪ドル（最大18%オフ）。Maker 3アルティメットバンドルは1,049豪ドルから499豪ドル（最大52%オフ、Spotlight限定）、Maker 5エッセンシャルバンドルは699豪ドルから649豪ドル。Ventureは1,499豪ドルから999豪ドル（Cricutショップ限定）。ヒートプレスではEasyPress Miniが129豪ドルから69豪ドル、EasyPress SE 9×9が199豪ドルから129豪ドル、12×10が249豪ドルから179豪ドル、Autopressが1,299豪ドルから599豪ドル、Mug Pressが299豪ドルから179豪ドル。Brightpad Goは159豪ドルから99豪ドル、消耗品は20%オフからとなっている。【ポイント・注意点】価格はオーストラリアドルで、日本の価格とは異なる。限定販売店の表記があるモデルは、取り扱い店を確認したい。セール期間の終了日は記事には明記されておらず、公式ブログでは12月1日までとされている。Maker 3バンドルの52%オフなど、割引率の大きいものは在庫限りとなる可能性がある。","2026-11-11","Impulse Gamer","https://www.impulsegamer.com/aus-make-your-cricut-mas-with-black-friday-deals-up-to-60-off-selected-products/"],["Cricut豪州公式、クリスマス向けブラックフライデーセール開始","Cricutオーストラリア公式ブログが、クリスマス商戦に向けたブラックフライデーセールを2026年11月10日に発表した。Joy 2やJoy Xtra、Explore 4／5、Maker 3／4／5、Venture、EasyPress、Mug Pressなど幅広い製品が対象で、販売店はSpotlight、Harvey Norman、Officeworks、BIG W。セールは12月1日まで。","\n【概要】Cricutオーストラリア公式ブログが、クリスマス商戦に向けたブラックフライデーセールを2026年11月10日に発表した。カッティングマシンやバンドル、ヒートプレスが対象で、販売店はSpotlight、Harvey Norman、Officeworks、BIG Wだ。セールは12月1日までで、クリスマスギフトの早めの準備を呼びかけている。【背景】年末商戦はクラフト機器の買い替えや入門の好機で、Cricutは毎年この時期に大型セールを行っている。オーストラリアでは小売店経由の販売が中心で、店舗ごとに限定バンドルがある。公式ブログでは、ギフト向けのモデルを中心に紹介している。【詳細】紹介されているのは、Joy Xtraスターターバンドル、Joy Xtra、Joy Xtraラベンダー＋ベーシックバンドル（限定色）、Joy 2エッセンシャルバンドル、Explore 4エッセンシャルバンドル、Explore 5エッセンシャルバンドル、Maker 4、Maker 3アルティメットバンドル、Maker 5エッセンシャルバンドル、Venture、EasyPress Mini Zen Blue、EasyPress SE 9×9と12×10、Autopress、Mug Press、Brightpad Go、素材とアクセサリーだ。Explore 4のバンドルは箱から出してすぐに100プロジェクト作れる内容で、12インチのスマートカッティングマシンに工具やSmart Vinyl、Iron-On、カードストックが付く。Maker 4は革や木材、ビニール、アイロン接着、カードストックなど300種類以上の素材に対応する。Maker 5は最上位機で、65以上のプロジェクト分の素材が付くバンドルが用意されている。Ventureは100種類以上の素材を最大75フィート（22.8メートル）までカットできる業務向けのワイドフォーマット機だ。【ポイント・注意点】価格はこの公式ブログ記事には載っておらず、具体的な金額は別記事で確認する必要がある。セールは12月1日までで、期間を過ぎると通常価格に戻る。販売店によって取り扱いが異なるため、欲しいモデルがある場合は店舗の在庫を確認したい。記事は2026年11月10日公開、11月12日更新のものだ。","2026-11-10","Cricut Blog","https://cricut.com/blog/au/make-your-christmas-with-cricut-black-friday-sales-au/"]],"uv":[["MimakiハイブリッドUV印刷、欧州4地域の現場から広がり","Mimaki Europeが、ハイブリッドUVプリンター「UJ330H-160」の欧州での広がりを報じる記事を2026年11月13日に公開した。ロールと剛性メディアの両方に対応する1台で、英国では省スペース性、イタリアでは用途の多様性、DACH地域では効率化、北欧では小規模サイン業者への広がりが評価されている。革や窓フィルムなど特殊素材への対応も進み、受注の内製化が進んでいる。","\n【概要】Mimaki Europeが、ハイブリッドUVプリンター「UJ330H-160」の欧州での広がりを報じる記事を2026年11月13日に公開した。ロール媒体と剛性媒体の両方に対応する1台で、発売から数か月後の各地の反響をパートナーへの取材でまとめている。英国、イタリア、DACH地域、北欧でそれぞれ異なる評価軸が示されている。【背景】印刷サービス業者は、顧客の要望に素早く応えながら、新しい用途を開拓することが求められている。剛性ボードとロール媒体の両方を扱うには、従来は専用機が2台必要だった。ハイブリッド機は1台で両方をこなすことで、外注の削減や納期短縮、投資効率の向上を狙う。欧州ではこの流れが広がっているという。【詳細】英国とアイルランドでは、販売代理店Hybrid Servicesが「小さな設置面積」を最大の魅力に挙げている。通常のドアを通るサイズでフラットベッド印刷を導入できるため、スペースに制約のある事業者でも剛性印刷を内製化できるという。真空ベルト搬送で、ピンチローラーによる跡が付かない点も評価されている。イタリアでは、代理店Bompanが用途の柔軟性を重視し、小さな案件から大きな案件まで、ロールと剛性の両方で対応できる点を挙げている。DACH地域では、Mimaki Deutschlandが効率化と投資の最適化を重視し、ロール印刷の需要を維持しながら剛性対応を加えられる点を評価している。北欧では、販売店Color Systemsが「10年前は10人中9人が真のフラットベッドを求めていたが、近年はハイブリッドを求める客が増えている」と述べ、小規模サイン業者への広がりを指摘している。革や人工皮革への印刷も可能で、用途の幅が広がっている。【ポイント・注意点】本記事はメーカー側の取材記事で、各地の評価は販売代理店のコメントに基づく。UJ330H-160の詳細な仕様や価格は記事には示されていない。ハイブリッド機は1台で多用途をこなせる反面、専用機に比べると切り替えの手間や生産性の面で譲歩がある場合もある。導入時は自社の受注構成に合うかどうかを確認したい。","2026-11-13","Mimaki Europe","https://www.mimakieurope.com/news/hybrid-uv-printing-opportunities-europe/"],["UV DTFプリンター初心者ガイド、選び方と失敗コストを解説","UV DTFプリンターの初心者向けガイドが2026年11月12日に公開された。Aフィルムに印刷してBフィルムで転写する仕組みや、機種選びのチェックポイント、原価計算の例を解説する。例として挙げられたVF13は4,799ドルからで、100枚中10枚の失敗を想定すると1枚あたり約1.22ドルの原価になるという。ステッカーやタンブラーなど硬質素材への展開を考える小規模事業者向けの内容だ。","\n【概要】UV DTFプリンターの初心者向けガイドが2026年11月12日に公開された。Aフィルムに印刷し、Bフィルムを貼り合わせて転写する仕組みや、機種選びのポイント、失敗率を織り込んだ原価計算の例を解説する。ステッカーやタンブラーなど、硬質素材の製品展開を考える小規模事業者に向けた内容だ。【背景】UV DTFは、UVインクで印刷した転写シールを、ガラスや金属、木材などの硬い素材に貼る技術だ。直接印刷が難しい曲面や小物にも対応できるため、個人や小規模事業者の参入が増えている。一方で、機種の価格帯は幅広く、仕組みを理解せずに買うと失敗しやすい。ガイドは、そうした初心者が最初に押さえるべき要点を整理している。【詳細】ガイドでは、UV DTFの基本的な流れとして、Aフィルムへの印刷、UV硬化、Bフィルムのラミネート、対象物への転写という手順を説明している。機種選びでは、印刷幅やインク構成、ラミネーターの内蔵有無、対応素材を確認するよう促している。例として挙げられたProcolored VF13は4,799ドルからで、オールインワン型の機種だ。原価計算の例では、100枚作って10枚失敗した場合、1枚あたり約1.22ドルの原価になるという試算が示されている。失敗率を織り込んだ価格設定の大切さが強調されている。転写後の耐久性は、素材の前処理や貼り付け方法によって変わる。初心者はまず小ロットで試作し、失敗率を把握してから本格的な販売に進むとよい。【ポイント・注意点】原価計算の例はあくまで試算で、材料費やインク代、失敗率によって変わる。UV DTFは衣類には向かず、硬質素材専用の技術だ。衣類への転写には通常のDTFを使う必要がある。機種によってはラミネーターが別途必要で、総コストは本体価格だけでは判断できない。インクの目詰まりなど、UVプリンター特有のメンテナンス負担もある。購入前に、自分の作りたい製品での試作や、消耗品の入手性を確認したい。ガイドはメーカー側のブログ記事で、紹介される機種は自社製品が中心だ。他社の機種と比較しながら検討するとよい。","2026-11-12","InkSonic","https://www.inksonic.com/blogs/news/uv-dtf-printer-for-beginners-how-to-choose-and-get-started"],["小規模事業向けUV DTFプリンター6選、価格と特徴を比較","小規模事業向けUV DTFプリンター6選が2026年11月12日に公開された。Procolored TX800 V11 PRO（5,999〜6,999ドル）、VF13 PRO、L800、DTF St
