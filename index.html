を使ったリモート運用の実用性が高まっている。半年以上にわたる段階的な改善の積み重ねが紹介されている。2026年10月時点の情報として、Claude CodeのRemote Control機能がバージョンアップを重ねるごとに拡充されて…","\n【概要】\n2026年10月時点の情報として、Claude CodeのRemote Control機能がバージョンアップを重ねるごとに拡充されてきた経緯がまとめられている。モバイル通知の強化やIDE連携、設定操作のリモート対応などが含まれる。\n\n【背景】\nRemote Controlは2026年2月に登場した、ローカルで動くClaude Codeのセッションをスマートフォンや別PCから操作できる機能だ。その後、半年以上かけて細かな機能追加が積み重ねられてきた。\n\n【詳細】\n主な拡充内容として、モバイルプッシュ通知（v2.1.110〜）：長時間処理の完了や判断が必要な場面でスマホに通知、VSCode拡張機能対応（v2.1.79〜）：CLIだけでなくVSCodeのプロンプト欄からリモートコントロールを起動可能といった機能が追加されている。さらに/mcpコマンドのリモート対応（v2.1.166〜）：スマホからMCPサーバーの状態確認・再接続・有効/無効切り替えが可能、/configコマンドのリモート対応（v2.1.181〜）：スマホから設定値の確認・変更が可能など、遠隔からの管理機能も充実してきた。加えて、クライアント在席検知（v2.1.181〜）：CLAUDE_CLIENT_PRESENCE_FILE環境変数でマシン前にいる間はプッシュ通知を抑制可能という、ユーザーの在席状況に応じた通知制御の仕組みも導入されている。これらはいずれも細かなバージョン単位で段階的に追加されており、半年以上にわたる継続的な改善の積み重ねであることがうかがえる。\n\n【ポイント・注意点】\nこれらの機能拡充により、Remote Controlは単なる「遠隔操作」から「遠隔での環境管理」までカバーする仕組みへと進化している。常駐PCを使ったリモート運用を行う場合、在席検知機能を活用すれば不要な通知を抑えられ、実務での使い勝手が向上する。一方で、頻繁なバージョンアップに伴い、使用しているバージョンによって使える機能に差が出るため、CHANGELOGを定期的に確認し環境を最新に保つことが推奨される。MCPや設定のリモート操作が可能になったことで、外出先からでも環境のトラブルシューティングがしやすくなった点も実用上の大きな進歩といえる。","2026-10-17","CayTech Lab","https://caymezon.com/claude-code-remote-control-guide/"],["ChatGPT Chrome拡張がコンピューター操作AIへ進化","OpenAIは「ChatGPT」Chrome拡張機能を強化し、単なるサイドバーAIからタブを操作してフォーム入力やファイルダウンロードまで行えるコンピューター操作AIへと進化させた。Edge・Operaでも利用可能で、Chatモードと作業代行モードで役割が分かれている。開いているタブの整理・グループ化も自動で行える点が特徴だ。OpenAIは、ChatGPTのChrome拡張機能に大きなアップグレードを行い、ブラウザのタブを読み取るだけでなく、実際に操作で…","\n【概要】\nOpenAIは、ChatGPTのChrome拡張機能に大きなアップグレードを行い、ブラウザのタブを読み取るだけでなく、実際に操作できる機能を追加した。これにより、ブラウザ上での作業をAIに任せられる範囲が広がった。\n\n【背景】\nOpenAI公式は、Chromeユーザー向けに大きなアップグレードを行い、Chromeを使うすべての人にコンピューター操作の力をもたらすと発表した。これまでのサイドバー型のアシスタントから、実際にブラウザを操作するエージェントへの転換を示す動きだ。\n\n【詳細】\n新機能では、モードによってできることが異なる。ChatGPTは今やChromeのタブを使って、より役立つ回答を作ったり、作業を代行したりできるようになった。Chatモードにいる場合は、開いているタブ全体を見渡して情報を集められる。さらに作業代行モードでは、Workモードにいる場合、ChatGPTはChromeのタブを操作して、メッセージの送信やフォームの入力、ファイルのダウンロードなどを行える。開いている大量のタブを整理してグループ化する手助けもできるとされている。また、この拡張機能は「Microsoft Edge」や「Opera」といった「Chromium」ベースのWebブラウザーでも利用できるため、Chrome以外の環境でも恩恵を受けられる。Chatモードは情報収集や回答の補強に重点を置き、Workモードは実際の操作代行に重点を置くという役割分担により、利用者は目的に応じてモードを切り替えて活用できる。タブの整理・グループ化機能は、同時に多数のタブを開いて作業する利用者にとって特に役立つ機能として位置づけられている。\n\n【ポイント・注意点】\nブラウザを実際に操作できる機能は利便性が高い反面、意図しない操作やデータ送信のリスクも伴う。フォーム入力やファイルダウンロードを自動実行させる際は、対象のタブやサイトが信頼できるものかどうかを事前に確認することが重要だ。常時ブラウザ拡張を有効にしておく運用を行う場合、機密情報を含むタブでの挙動にも注意を払う必要がある。","2026-10-16","窓の杜（Impress Watch）","https://forest.watch.impress.co.jp/docs/news/2148765.html"]],"cnc":[["オークマとファナックのCNC向けAI、JIMTOF2026の展示を3つの場面で比べる","JIMTOF2026でオークマとファナックがそれぞれ示した、CNCに生成AIを組み込む構想を3つの場面で比較した記事。オークマはAIエージェントによる診断・提案機能を、ファナックはMCPサーバを介したフィジカルAI CNCと安全設計を提示した。両社とも参考出展・コンセプト段階で仕様は未確定であり、商品化時期にも差がある。2026年10月26日から31日にかけて開催されたJIMTOF2026（第33回日本国際工作機械見本市）で、オークマとファナックがそろっ…","\n【概要】\n2026年10月26日から31日にかけて開催されたJIMTOF2026（第33回日本国際工作機械見本市）で、オークマとファナックがそろってCNCに生成AIをつなぐ構想を披露した。本記事はその展示内容を3つの場面に分けて比較している。\n\n【背景】\nCNC（数値制御）工作機械の現場では、加工結果の診断やトラブル対応、設定変更といった作業に熟練者の経験が求められてきた。こうした作業を生成AIで支援しようとする動きが工作機械大手各社で進んでおり、JIMTOF2026では複数メーカーがAI関連の構想を発表した。その中でもオークマとファナックは、それぞれ異なるアプローチでCNCと生成AIの連携を示した。\n\n【詳細】\nオークマは、自社CNC「OSP」と生成AIを組み合わせたAIエージェント機能を参考出展した。立形マシニングセンタ「MB-46VEII」に搭載し、加工結果や機械状態の診断、改善策やトラブル解決策の提案を行う。構成はGPU搭載PCを社内ネットワークで動かす形で、今後は社外での実証実験を進める計画という。日刊工業新聞の報道によれば、2027年度の商品化を目指すとされる。\n\n一方、ファナックは「フィジカルAI CNC」というコンセプトと、MCPサーバを披露した。LLM（大規模言語モデル）がCNCや関連ソフトウエアを操作できるようにするためのMCPサーバを今後提供する予定で、LLMはこのサーバを経由してCNCのデータを参照し、設定変更の案を提示できるようになる。ただし、LLMが出した案を直接実機に送ることはせず、まずPC上のデジタルツインで検証し、オペレーターが目で確認して承認した場合に限り実機へ転送する仕組みとしている。MCPサーバの提供時期については報道でも確認できていない。\n\nまた、加工面に不良が出た場面を想定した事例として、ファナックのAI加工面チューナーが紹介された。これはサーボデータや加工プログラムから加減速パラメータなどの不良原因を推定し、シミュレーションで確認した改善案を示す機能である。\n\n【ポイント・注意点】\n今回紹介された内容は、オークマ・ファナックのいずれも参考出展やコンセプト段階にとどまり、製品としての仕様は未確定である。オークマは商品化時期について報道で言及があるものの、ファナックのMCPサーバについては提供時期が明らかになっていない。また、ファナックの仕組みは人間による最終確認を経てから実機に反映する設計となっており、AIの提案をそのまま自動実行するものではない点が特徴である。両社の比較から、AIによる自律化と人間による安全確認のバランスをどう取るかが今後の業界共通の課題となることがうかがえる。","2026-11-13","MFG-AI（サオス）","https://www.mfg-ai.com/data/jimtof2026-okuma-fanuc-cnc-agents"],["JIMTOFで見た主要各社のAI活用、ファナック・マザック・三菱電機・DMG森精機","MONOistがJIMTOF2026での主要工作機械メーカーのAI活用をまとめた記事。ファナックの安全設計、マザックの「しゃべるNC」、三菱電機の技能伝承支援、DMG森精機の段取り自動化と生成AI活用の新機能を紹介している。各社に共通するのは人手不足や技能伝承への対応だが、安全性重視や音声活用など実用化段階にはばらつきが見られる。2026年11月4日発行のMONOist FAメールマガジンにおいて、編集担当者がJIMTOF2026（第33回日本国際工作機…","\n【概要】\n2026年11月4日発行のMONOist FAメールマガジンにおいて、編集担当者がJIMTOF2026（第33回日本国際工作機械見本市、2026年10月26〜31日開催）で見た主要各社のAI活用についてまとめている。ファナック、ヤマザキマザック、三菱電機、オークマ、DMG森精機といった主要メーカーが、それぞれ異なる切り口でAIを活用した展示を行った。\n\n【背景】\n工作機械業界では人手不足や技能伝承の課題が長年指摘されており、熟練オペレーターの知見をいかにシステム側で補うかが課題となってきた。JIMTOF2026では、こうした課題に対応するため各社が生成AIを活用したサービスやソリューションを一斉に披露する形となった。\n\n【詳細】\nファナックは「フィジカルAI CNC」を披露した。これは生成AIを活用してトラブル対応や加工調整を自律的に支援する次世代システムであり、AIの誤作動への懸念に対しては、事前にシミュレーションを行い、最終的に人間が承認するという多重の安全構造を示した。\n\nヤマザキマザックは自社開発のAIエージェントを活用した次世代サポートサービスを披露した。「しゃべるNC」と呼ばれる仕組みでエラーへの対処を行えるほか、やり取りした音声の内容を後から要約として確認できる機能も紹介されており、声を生かしたAI活用が特徴となっている。\n\n三菱電機は、加工現場における人手不足や技能伝承という課題の解決を図るAIソリューションを披露した。\n\nオークマは、工作機械と対話するAIエージェントを展示し、熟練者不足の現場を支援する狙いを掲げた。\n\nDMG森精機は、工具の組み立てから切りくずの排出までを含む段取り全工程を自動化するシステムを披露した。これに加えて、ユーザー専用ポータルサイト「my DMG MORI」において、生成AIを活用した新機能「サービスエージェント」の提供を開始することを発表した。このサービスエージェントは、工作機械に不具合が生じた際の対応を生成AIが支援するものである。\n\n【ポイント・注意点】\n各社の取り組みには共通して、人手不足や技能伝承という業界課題への対応という狙いがある一方、アプローチには違いが見られる。ファナックは安全性を重視した多重構造を強調し、マザックは音声インターフェースを前面に出し、DMG森精機はポータルサイトを通じた生成AIサービスの提供開始を発表するなど、実用化の段階にも差がある点に注意したい。","2026-11-13","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/04/news033.html"],["アルミ板組立式CNC、公開2年でDL1万超え突破","溶接なしでアルミ板をボルト締めする大型DIY CNC加工機の設計データが公開から2年でダウンロード1万回を突破。開発者がXで報告し、世界中から組立完了の報告が届いている。配布データもバージョン1.1に更新され、継続的な改良が続けられている。加工範囲935×620×115mm、部品代は約56万円とされ、個人でも本格的な加工機を構築できる点が注目されている。溶接不要でアルミ板を船舶用ステンレスボルトで組み上げる大型DIY CNC加工機の設計データについて、開…","\n## 概要\n溶接不要でアルミ板を船舶用ステンレスボルトで組み上げる大型DIY CNC加工機の設計データについて、開発者のGareth Evans氏が2026年11月8日にX（旧Twitter）で、公開から2年が経過しダウンロード数が1万回を超えたと報告した。\n\n## 背景\n近年、個人が高価な産業用CNC加工機を購入せずとも、自作で高精度な加工機を組み立てられるオープンソース設計の需要が高まっている。Evans氏が公開したこの設計は、溶接などの特殊技術を必要とせず、無垢のアルミ板をボルトで締結するだけで組み立てられる点が特徴で、DIY愛好家の間で支持を広げてきた。\n\n## 詳細\nEvans氏は2026年11月8日にXで、公開から2年がたち、ダウンロードは1万回を超えたと投稿した。世界中から、組み上げて稼働させた機械の写真が届いているという。\n\n機体の仕様としては、溶接を使わず、無垢のアルミ板を船舶用のステンレスボルトで締めて組む構造を採用している。加工できる範囲は935×620×115mm、機械の外形は1200×930×620mmだ。\n\n部品代はおよそ56万円とされ、個人が本格的な加工範囲を持つCNCマシンを比較的現実的なコストで構築できる点が注目されている。\n\nまた、配布ファイルは2026年11月5日にバージョン1.1へ更新した。設計は継続的にブラッシュアップされており、ユーザーからのフィードバックが反映されている可能性がある。\n\n## ポイント・注意点\n公開ファイルは誰でも無償で使えるが、販売は禁じている。用途は趣味と個人の非商用に限り、Evans氏は作った機械について責任を負わないとしている。これはオープンソースハードウェアに共通する典型的なライセンス形態であり、商用利用を検討する場合は別途許諾が必要になる点に注意したい。\n\nまた自作機であるため、安全確保や調整は利用者自身の責任で行う必要があり、特に大型のアルミ構造体を扱う組立作業には相応の工具と技術が求められる。AIを活用した工具パス生成や切削条件最適化と組み合わせることで、こうした自作マシンでも高精度な加工を実現する動きが今後広がる可能性がある。公開から2年という長期にわたり支持され続けている点は、設計の完成度とコミュニティの継続的な関与を示していると言える。","2026-11-10","FabScene（ファブシーン）","https://fabscene.com/new/make/thehardwareguy-open-source-diy-cnc-machine-aluminium-plate-mach3/"],["20万円台デスクトップCNC「Makera Z1 Pro」実機レビュー","AIによるモデル生成機能を備えたデスクトップCNC「Makera Z1 Pro」の実機レビュー記事。アルミ・真鍮切削や4軸加工、3Dプリンターとの比較など5つの作例を通じて、専用ソフト「Makera Studio」の使い勝手と加工性能を検証した。工具交換や高さ測定の自動化も特徴で、クラウドファンディングは2026年12月14日まで実施中である。デスクトップ型CNC「Makera Z1」および上位モデル「Makera Z1 Pro」の日本上陸に伴い、Fab…","\n## 概要\nデスクトップ型CNC「Makera Z1」および上位モデル「Makera Z1 Pro」の日本上陸に伴い、FabScene編集部が実機を用いたレビューを実施した。工具交換や材料高さ測定の自動化に加え、AIを活用したモデル生成機能が大きな特徴となっている。\n\n## 背景\n20万円台から金属切削に挑戦できるデスクトップCNC「Makera Z1 Pro」を実機レビューした。工作機器メーカーMakeraの最新製品「Makera Z1」と上位モデルの「Makera Z1 Pro」は、工具をレバーで交換する仕組みや材料の高さを自動で測る機能、加工データの共有サービスを組み合わせ、こうした手間を減らそうとしているデスクトップCNCだ。従来、CNC加工には専門知識や面倒な設定作業が必要とされてきたが、本機はこうした参入障壁を下げることを目指している。\n\n国内ではMAKERA JapanがGREEN FUNDINGでクラウドファンディングを実施しており、本体のみのコースは先行支援でZ1が20万1799円（税込）から、Z1 Proが24万9799円（税込）から用意されている。プロジェクトの期日は2026年12月14日（月）23:59までだ。\n\n## 詳細\nレビューでは実際の加工性能を検証するため、複数の作例が試された。FabScene編集部はZ1 Proの実機をレビュー用に使い、開封とセットアップを経て5つの作例を削った。サンプルデータでのアルミ部品、公開データでのレリーフ、自作キーボード用の真ちゅうプレート、3Dプリントと仕上がりを比べる富士山の地形モデル、オプションの回転軸を使った4軸加工だ。\n\n仕様面では、スピンドルの出力は150W、最高回転数は1万3000rpmとなっている。また、Makeraが提供するプラットフォームでは、CNC作品やプロジェクトを見つけたり共有したりできる、Makeraのクリエイティブプラットフォームが用意されている。\n\nAIを活用した設計面の支援についても、アイデアを加工可能なモデルへと変換し、ものづくりの第一歩をスムーズにする機能があり、モデリングの経験がなくても安心して、AIを使えば、モデルの生成や調整も手軽に行える。\n\n## ポイント・注意点\n初心者でもCNC加工を始めやすいよう、ハードウェア・ソフトウェア・コミュニティの三位一体の仕組みが用意されている点が特徴的である。一方で、金属切削特有の切子処理や集塵、工具摩耗管理など、木材加工とは異なる知識も必要になるため、初めて金属加工に挑戦するユーザーはサンプルデータやコミュニティの知見を活用しながら段階的に習熟していくことが推奨される。AI設計機能についても、生成されたモデルがそのまま実加工に適しているとは限らず、仕上がり確認や微調整の工程は依然として重要である。","2026-11-09","FabScene（ファブシーン）","https://fabscene.com/new/pr/makera-z1-pro-cnc-review/"],["Adafruit対AI基板設計Flux、利用者数「虚偽広告」で訴状追加","電子工作大手Adafruitが、AI基板設計サービスFluxとの訴訟において訴状を改訂。Fluxが公表する約110万人の利用者数を虚偽広告とする請求を新たに追加した。発端はセキュリティ問題の指摘とCFAA違反を巡る応酬で、法律事務所を介した書簡合戦にも発展している。Fluxは2026年2月に多額の資金調達を発表していた経緯もある。電子工作向け製品で知られる米Adafruitと、AIによる電子回路基板設計支援サービス「Flux」の運営会社との間の法的紛争が…","\n## 概要\n電子工作向け製品で知られる米Adafruitと、AIによる電子回路基板設計支援サービス「Flux」の運営会社との間の法的紛争が新たな局面を迎えた。Adafruitは訴状を改訂し、Fluxが掲げる利用者数の表示を虚偽広告とする請求を追加した。\n\n## 背景\n米Adafruitは、AIで電子回路基板の設計を手伝うFluxとの訴訟で訴状を改め、Fluxが掲げる約110万人の利用者数を虚偽広告とする請求を加えた。発端はセキュリティーの問題の報告とCFAA違反を指摘した書簡で、Fluxは同法の請求を放棄した。\n\nFluxは基板設計の作業をAIが支援し、設計データを直接書き換えられることを売りにするサービスで、2026年2月には多額の資金調達を発表していた。この経緯の発端は、Adafruitが取材活動の一環でFluxに利用者数の裏付けを求めるメールを送ったことにあった。\n\n## 詳細\nFluxは8月31日、この件でCFAAに基づく請求をしないと約束する文書に署名し、訴えの却下を申し立てた。その一方で、Adafruit側は追加の請求を行う方針に転じた。そのうえで同社は利用者数の表示を虚偽広告、基板の見せ方を製品の出所を偽る行為などとして、米国の連邦商標法に基づく請求を加えた。\n\n一連の経緯を振り返ると、当初Fluxは公表する利用者数について、AI画像生成スタートアップが3700万ドルの資金調達（うちシリーズBで2700万ドル）を実施したことを明らかにしていた。\n\nまた、両者の対立は法律事務所を介した書簡のやり取りにまで発展し、AdafruitはFlux.aiの代理人であるFenwick & West法律事務所から督促状を受け取ったことを報告していた。その内容は、Fluxが虚偽または名誉毀損の可能性があるとする記事の公開差し止めを求めるものだった。\n\n## ポイント・注意点\nこの事案は、AIを活用したものづくり支援ツールの急速な台頭に伴い、利用者数などのマーケティング上の数値表示の正確性や、セキュリティ脆弱性の報告・開示のあり方を巡る対立が顕在化した事例として注目される。メーカーコミュニティにおいては、AI設計ツールを利用する際にセキュリティ上のリスクや、サービス提供企業が公表する実績データの信頼性を見極める重要性が改めて浮き彫りになった。今後の訴訟の行方次第では、AI系メーカーツール企業の情報開示や広告表示のあり方に一定の影響を与える可能性がある。","2026-11-09","FabScene（ファブシーン）","https://fabscene.com/new/news/adafruit-flux-lawsuit-amended-complaint-false-advertising/"],["オークマ、CNCと対話する生成AIエージェントをJIMTOF2026で参考出展","オークマはJIMTOF2026で、自社CNC「OSP」に生成AIを組み合わせた対話型AIエージェント機能を参考出展した。熟練技術者の引退や人手不足が進む製造現場で、機械と対話しながらトラブル原因の分析や加工調整を自律的に支援する次世代システムを目指すとしている。安全性を重視したローカル環境での活用が想定されており、現場でのAI活用に対する懸念にも配慮した設計となっている。","\n## 概要\nオークマは2026年10月26日から31日まで東京ビッグサイトで開催された「JIMTOF2026（第33回日本国際工作機械見本市）」において、自社開発のCNC「OSP」と生成AIを組み合わせたAIエージェント機能を参考出展した。熟練技術者の引退や人手不足が進む製造現場に向け、機械と対話しながら課題解決を自律支援する新たなソリューションを目指す。\n\n## 背景\n製造現場では熟練オペレーターの高齢化・引退が進み、加工トラブル発生時の原因切り分けや調整作業を担う人材の不足が深刻化している。こうした課題に対応するため、同社は従来のCNC操作に加えて、自然言語での対話を通じて課題解決を支援する機能の検討を進めてきた。オークマは「JIMTOF2026」（2026年10月26〜31日、東京ビッグサイト）において、自社開発のCNC「OSP」と生成AI（人工知能）を活用したAIエージェント機能を参考出展した。\n\n## 詳細\n新たなソリューションは、CNCと対話形式でやり取りしながら、トラブルの原因分析や加工条件の調整といった課題解決を自律的に支援することを狙う。「CNC」は、生成AIを活用してトラブル対応や加工調整を自律支援する次世代システムだ。対話は安全性を重視したローカル環境での活用が想定されており、現場でのAI活用に対する懸念にも配慮した設計となっている。\n\n同時期にファナックが披露した「フィジカルAI CNC」など、JIMTOF2026では複数の工作機械メーカーが生成AIを活用した次世代CNCのコンセプトを示しており、業界全体でAIエージェントによる現場支援への関心が高まっていることがうかがえる。オークマの取り組みも、こうした業界トレンドの一翼を担うものとして位置づけられる。\n\n## ポイント・注意点\n現時点ではあくまで「参考出展」であり、量産や正式な製品化の時期は明示されていない。対話型AIエージェントが実際の加工現場でどこまで自律的な判断を任されるか、安全性の担保や誤作動時の責任分担など、実用化に向けては検証すべき課題が残る。熟練技術者不足という構造的な課題に対し、生成AIがどこまで代替・補完できるかが今後の焦点となる。ローカル環境での運用という設計は、現場の情報セキュリティや安全性に配慮した対応と見ることができ、他社の取り組みと比較する上でも注目される点である。","2026-11-02","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/02/news033.html"],["ブラザー工業「THREEDIO」、3DデータからNCデータを最短1分生成","ブラザー工業はJIMTOF2026にて、3Dデータから最短1分でNCデータを自動生成するソリューション「THREEDIO」を展示した。CAMプログラミングの工程を大幅に短縮し、熟練者不足が進む製造現場での効率化を目指す取り組みとして会場で注目を集めた。ファナックのフィジカルAI CNCなどと並び、プログラムと判断を機械側に寄せる展示傾向の一つとして紹介された。","\n【概要】\nブラザー工業は「JIMTOF2026（第33回日本国際工作機械見本市）」において、3Dデータを取り込むだけで短時間でNCデータを自動生成するソリューション「THREEDIO」を展示した。会場レポートでは、CNC・AI・ソフトウェア分野の目立った展示の一つとして取り上げられている。\n\n【背景】\n製造現場ではCAMプログラミングの工数が加工全体のボトルネックになりやすく、熟練オペレーターの引退や人手不足も重なって、プログラム作成の自動化・高速化へのニーズが高まっている。JIMTOF2026では旋削とミーリングを1台にまとめる複合加工機や5軸機の展示とともに、プログラムと判断を機械側へ寄せる動きが目立った。THREEDIOはこうした流れの中で、3Dモデルから加工プログラムへの変換を人手を介さずに短時間で完結させることを狙ったツールとして位置づけられる。\n\n【詳細】\n会場レポートによれば、ブラザー工業のTHREEDIOは3Dデータから最短1分という短時間でNCデータを生成できる点が特徴とされた。従来はCAD図面から加工担当者が工具経路や加工条件を個別に設定し、CAMソフト上でプログラムを作成する必要があったが、THREEDIOはこの一連の作業を自動化・高速化することを志向している。\n\nJIMTOF2026の展示傾向としては、ファナックのフィジカルAI CNCなどと並び、プログラムと判断の多くを機械側に委ねる「CNC・AI・ソフト」分野の新製品群の一つとして紹介された。こうした自動化ソリューションの登場は、熟練者のノウハウに依存してきたプログラミング工程を、より短時間かつ再現性の高い形へと転換させる動きの一環と見ることができる。\n\n【ポイント・注意点】\nNCデータの自動生成は加工準備時間の短縮に直結するが、生成されたプログラムが実際の工作機械・工具条件に適合するかどうかの検証工程は依然として必要になる。短時間生成という利便性と、現場での安全性・精度確保をどう両立させるかが今後の実用化における課題といえる。会場レポートが他の自動化・AI関連展示と並べて紹介している点からも、こうした機械側へ判断を寄せる潮流が業界全体に広がりつつあることがうかがえる。","2026-11-02","ケズリバ","https://kezuriba.net/articles/jimtof2026-summary/"],["岡本工作機械、AI加工条件アドバイス機能「Quick Knowledge」を参考出品","岡本工作機械製作所はJIMTOF2026にて、精密平面研削盤の加工条件をAIが提案する新機能「Quick Knowledge」を参考出品した。熟練者のノウハウに頼りがちな研削加工条件の設定を支援し、技術継承や作業効率化につなげる狙いがある。精密平面研削盤「PSG63SA1」の展示に併せて披露され、会場で注目を集めた。岡本工作機械製作所は「JIMTOF2026」において、精密平面研削盤「PSG63SA1」を展示するとともに、動機と併せた参考出品としてAI加…","\n【概要】\n岡本工作機械製作所は「JIMTOF2026」において、精密平面研削盤「PSG63SA1」を展示するとともに、動機と併せた参考出品としてAI加工条件アドバイス機能「Quick Knowledge」を披露した。研削加工における条件設定の難しさをAIで支援する新たな取り組みとして注目された。\n\n【背景】\n研削加工は砥石の選定や送り速度、加工回数など多くのパラメータが仕上がり品質を左右するため、長年の経験に基づくノウハウが重視されてきた分野である。こうした属人的な知見をデジタル化し、経験の浅い作業者でも適切な加工条件を導き出せるようにする取り組みが各社で進んでおり、岡本工作機械もこの流れに沿ってAIを活用した支援機能の開発を進めている。\n\n【詳細】\nJIMTOF2026の展示会レポートによれば、岡本工作機械製作所は精密平面研削盤「PSG63SA1」の展示に併せ、AI加工条件アドバイス機能「Quick Knowledge」を参考出品としてアピールした。この機能は、加工対象のワークや要求精度などの条件を入力することで、適切な加工条件をAIが提示する仕組みとみられ、研削加工のノウハウをデータとして蓄積・活用することを目指している。\n\n同時期には他社からも、AIがNC装置や周辺ソフトと連携して情報収集・分析・改善提案を自律的に行うソリューションが複数出展されており、工作機械業界全体でAIによる加工知見のデジタル化・民主化が進んでいる様子がうかがえる。研削加工という専門性の高い分野においても、こうしたAI支援の流れが波及し始めていることが、今回の参考出品から読み取れる。\n\n【ポイント・注意点】\nQuick Knowledgeはあくまで参考出品段階であり、製品化や具体的な提供時期については明らかにされていない。研削加工は精度要求が高い分野だけに、AIが提案する条件の妥当性をどのように検証し現場に浸透させていくかが今後の課題となりそうだ。精密平面研削盤という専門機種との組み合わせで披露された点も、属人化しやすい研削技術の継承という業界課題への対応策として注目される。","2026-11-02","工場マガジンラック（日刊工業新聞社）","https://kojomag.nikkan.co.jp/exibition/exh/740"],["三菱電機、ヒューマノイドとCNCが自然言語で連携する加工システムを開発","三菱電機は、ヒューマノイドロボットとCNC工作機械がフィジカルAIを介して自然言語でやり取りしながら連携する加工システムを業界で初めて開発したと発表した。段取りや清掃、搬送、検査などオペレーターの作業を自動化し、2030年の実用化を目指しJIMTOF2026で実演した。ロボットの機種を問わず連携できる汎用性が特徴である。三菱電機は2026年10月21日、人型ロボットとCNC工作機械を連携させる加工システムを開発したと発表した。","\n## 概要\n三菱電機は2026年10月21日、人型ロボットとCNC工作機械を連携させる加工システムを開発したと発表した。作業者が言葉で指示するとAIが手順を組み立て、工作機械とロボットに作業を割り振る仕組みで、ロボットの機種を問わず連携できるという。2030年の実用化を目指し、JIMTOF2026で実演した。同社は業界で初めて「フィジカルAIを介してヒューマノイドロボットとCNC（Computer Numerical Control）工作機械がシームレスに連携する加工システム」を開発したとしている。\n\n## 背景\n製造現場では人手不足が深刻化しており、段取りや清掃、完成品の取り出し、搬送、検査、トラブル対応など、従来オペレーターが担ってきた作業の省人化が課題となっている。本システムの導入により、従来オペレーターが担ってきたこうした工作機械に関する作業を、容易にヒューマノイドロボットに置き換えることが可能になり、加工現場の省人化に貢献するという。\n\n## 詳細\nシステムは3つの要素から構成される。1つ目の「AI加工タスクプランナー」は、作業者が日常の言葉で出した指示を読み取り、あらかじめ登録した作業を組み合わせて計画を作り、工作機械とロボットに作業を割り振って管理する。\n\n2つ目はフィジカルAIを搭載し、自然言語で操作情報をやり取りしながらお互いに連携して加工を実行するCNC工作機械で、3つ目は一般的なヒューマノイドロボットである。このうち、AI加工タスクプランナーとCNCには、同社のAI技術Maisartを使用して新たに開発したフィジカルAIを搭載している。\n\nヒューマノイドの活用により、人の身体的特徴を生かした柔軟な作業代替が期待されている。従来は固定的な自動化設備でしか対応できなかった多様な作業を、汎用的なロボットと自然言語インターフェースの組み合わせによって柔軟にこなせるようにする狙いがある。\n\n## ポイント・注意点\n同システムはヒューマノイドロボットの機種を問わず連携できる汎用性を特徴とするが、実用化は2030年を目標としており、現時点では研究開発・実演段階にとどまる。JIMTOF2026ではファナックやオークマも同様にCNCと生成AIを組み合わせたフィジカルAI関連の展示を行っており、工作機械業界全体でAIとロボットの融合による省人化競争が本格化していることがうかがえる。自然言語による指示という共通インターフェースが、今後の業界標準となるかが注目される。","2026-10-21","三菱電機プレスリリース","https://www.mitsubishielectric.co.jp/ja/pr/2026/1021_rd/"],["Hexagon、JIMTOF2026でCAMのAI新機能「ProPlanAI」を国内初展示","Hexagon Manufacturing IntelligenceはJIMTOF2026にてCAMソフト「Esprit Edge」に搭載されたAI新機能「ProPlanAI」を国内で初めて展示した。過去の加工データを学習し工程計画を自動提案する機能で、熟練者の知見継承や設計・加工プロセスの効率化を支援する内容として注目を集めた。三次元測定機「MAESTRO」も同時に展示された。","\n【概要】\nHexagon Manufacturing Intelligence株式会社は、2026年10月に開催された世界最大級の工作機械見本市「JIMTOF2026」において、三次元測定機／測定・計測ソフトウェアとCAD/CAMソフトウェアの2ブースを出展し、次世代オールデジタル三次元測定機「MAESTRO」とともに、CAMソフトウェア「Esprit Edge」に搭載されたAI新機能「ProPlanAI」を国内初展示した。\n\n【背景】\n製造現場では熟練技術者の引退や人手不足が深刻化しており、CAMプログラミングの属人化が課題となっている。Hexagonはこうした課題に対応するため、過去の加工データをAIに学習させ、新しい部品に対する加工プロセスを自動提案する仕組みを開発した。すでに同社はMECT2025で日本初公開しており、JIMTOF2026ではさらに広い来場者層に向けて機能を訴求した形だ。\n\n【詳細】\nCAD/CAMソフトウェアブースでは、機械加工プログラムを効率的に作成できるCAMソフトウェア「Esprit Edge」に搭載されたAI新機能「ProPlanAI」が展示された。ProPlanAIは自己学習型の自動化ツールであり、過去の加工履歴データを解析して新規部品に適した加工戦略を予測・提案することで、手動でのプログラミング作業を大幅に削減する。\n\n同時に出展された三次元測定機「MAESTRO」との組み合わせにより、加工から品質保証までの一連のプロセスをAIとデジタルの力で効率化する提案が行われた。2つのブースでは、AIを活用した加工ノウハウや熟練者の知見の継承、デジタルツインによる設計・加工プロセスの効率化、測定・解析から生まれる品質データの活用がテーマとして掲げられた。両ブースを通じて、設計から加工、測定・検査に至るまでの一貫したデジタル化の提案が強調された形だ。\n\n【ポイント・注意点】\nProPlanAIはすでに海外市場でプログラミング時間を大幅に短縮する効果が報告されているが、日本国内での本格展開はこれからの段階にある。中小の加工現場でも導入しやすい形でサービス提供が進むかどうかが今後の焦点となる。また、AIが提案する加工戦略はあくまで過去データに基づく予測であるため、実際の現場導入時には人間による検証プロセスが引き続き必要とされる。設計・加工・測定を一貫してデジタル化する提案は、今後の工作機械業界の方向性を示す一例といえる。","2026-10-16","PR TIMES（Hexagon Manufacturing Intelligence）","https://prtimes.jp/main/html/rd/p/000000027.000148625.html"],["Makera Z1・Z1 Pro、日本初上陸でクラウドファンディング開始","Kickstarterで16億円超を集めた次世代デスクトップCNC「Makera Z1」「Z1 Pro」が日本初上陸。AIでモデル生成・調整ができる機能を搭載し、GREENFUNDINGでクラウドファンディングを展開している。原宿では実機体験会も開催され、金属加工対応の高機能性が注目された。本体サイズは約350×470×450mmとコンパクトで、第4軸モジュールなどの拡張オプションも用意される。","\n## 概要\n金属からも加工できる次世代デスクトップCNC「Makera Z1」「Z1 Pro」が日本市場に正式上陸し、クラウドファンディングサービスGREENFUNDINGでプロジェクトが開始された。AIを使ったモデル生成機能が初心者のものづくりを後押しする。\n\n## 背景\nKickstarterで16億3,000万円超・6,900人以上の支援を集めたデスクトップCNC「Makera Z1・Z1Pro」が、ついに日本上陸した。100万円クラスの金属加工機能を手の届く価格で自宅に導入できる点が大きな訴求点となっている。アルミや真鍮の切削、グッズ制作から廃盤部品の修理まで幅広い用途に対応するとされる。\n\n## 詳細\nMakera Z1の最大の特徴の一つはAIによる設計支援である。モデリングができなくても心配なく、AIを使えば、簡単なアイデアからモデルを生成・調整し、実際に加工できる形へと段階的に仕上げていける。CNCが初めての方でも、最初の一歩を踏み出しやすくなっている。\n\n日本上陸に先立ち、原宿・LIFORKでは実機体験会が開催された。2026年10月12日（月）、Makera Z1&Z1 Proの日本正式上陸の際、原宿・LIFORKで実機体験会を先行開催した。デスクトップに収まりやすい設計や、先進的な集塵技術、クイックツールチェンジなどの機能、それにもまして、AIプログラムも加えたソフトウェアなど、「Makera Z1&Z1 Pro」のアドバンテージが体験された。\n\nクラウドファンディングは、木材から金属まで多様な素材に対応し、自動プロービング・レベリング機能を搭載した本機を対象に、10月15日11時より開始された。\n\n## ポイント・注意点\n本体サイズは約350×470×450mmとデスクトップに収まるコンパクトさを備える一方、第4軸モジュールやレーザーモジュールなどのオプションも用意され、用途に応じた拡張性も確保されている。AIによるモデル生成機能は初心者の参入障壁を下げる一方、実際の加工にあたっては素材選びや工具選定などの基本知識も依然として必要となる。クラウドファンディングという性質上、支援後の納期やサポート体制についても事前に確認しておくことが望ましい。実機体験会の開催など、購入前に機能を確かめられる機会が設けられている点も利用者にとって安心材料となる。","2026-10-14","PR TIMES（株式会社ATTRUX）","https://prtimes.jp/main/html/rd/p/000000006.000153506.html"]],"cricut":[["2026年最新カッティングマシンおすすめ4選、xTool・シルエット・クリカットを比較","xToolの公式ブログが2026年注目の家庭用カッティングマシン4機種を比較。xTool C1 Color Cutter、Silhouette CAMEO5α、Cricut Maker 3、Brotherスキャンカットそれぞれの特徴や機能差を紹介し、用途別の選び方を解説する買い物ガイド。スキャン機能とPrint Then Cut機能の違いなど、見落としやすいポイントも整理している。","\n■概要\nxToolの公式ブログが2026年に注目すべき家庭用カッティングマシンとして4機種を取り上げ、比較する買い物ガイドを公開した。対象となったのはxTool C1 Color Cutter、Silhouette CAMEO5α、Cricut Maker 3、Brotherのスキャンカットの4機種である。\n\n■背景\nカッティングマシンは紙やシート、シールなどを自動で切り出す家庭用の機器として普及しているが、各ブランドによって搭載機能や得意分野が異なる。記事では、スキャン機能やPrint Then Cut機能など、見た目が似ていても用途が異なる機能についても整理し、購入検討者が選びやすいように情報をまとめている。\n\n■詳細\nxTool C1 Color Cutterは、スキャン・印刷・カットの3つの機能を1台に集約しており、スキャナーを内蔵している点が特徴である。Silhouette CAMEO5αはシート加工や長尺のカット作業に対応し、トンボ読み取り機能も備えているが、印刷をする場合はプリンターを別途用意する必要がある。\n\nCricut Maker 3は多彩な素材に対応し、専用ツールも豊富に用意されている。さらにPrint Then Cut作業向けに位置合わせセンサーを搭載している点が特徴として挙げられている。Brotherのスキャンカットはスキャナーを内蔵しており、手描きのイラストなどを直接読み取ってそのままカットできる点が強みとされている。\n\nカット作業を中心に使いたい場合には、Brother、Silhouette、Cricutなどが候補になるとされている。印刷からカットまでを一台で完結させたい場合はxTool C1が有力な選択肢となり、素材の対応幅や専用ツールの豊富さを重視するならCricut Maker 3が候補として挙げられる。長尺のシート加工や精密なトンボ合わせを重視するユーザーにはSilhouette CAMEO5αが向いているとされ、手描きイラストをそのまま取り込みたい場合はBrotherのスキャンカットが適していると整理されている。\n\n■ポイント・注意点\nスキャン機能とPrint Then Cut用の位置合わせセンサーは似たような印象を受けやすいが、記事では両者は用途が異なる機能であると明記されている。購入前にはどちらの機能が自分の制作スタイルに合っているか見極める必要がある。印刷工程を別機器に頼るか一台で完結させるかによっても選ぶべき機種が変わるため、制作内容と予算を踏まえた比較検討が推奨される。","2026-11-13","xTool","https://jp.xtool.com/blogs/buyer-guide/best-cutting-machines-for-beginners"],["工房SeTAにカッティングマシン「Silhouette CAMEO 5」を導入","建築系の工房SeTAが2026年10月25日、卓上カッティングマシン「Silhouette CAMEO 5」を導入したことを紹介。パソコンで作成したデータをもとにカッティングシートや紙を自動で切り出せる機器で、模型製作や表示物づくりへの活用が期待されている。精密な形状も自動処理できる点が導入の利点とされる。■概要建築系の工房として活動するSeTAが、2026年10月25日にカッティングマシン「Silhouette CAMEO 5」を導入したことを紹介する…","\n■概要\n建築系の工房として活動するSeTAが、2026年10月25日にカッティングマシン「Silhouette CAMEO 5」を導入したことを紹介する記事が公開された。CAMEO5はパソコンで作成した文字や図形のデータをもとに、カッティングシートや紙などを自動で切り出すことができる卓上タイプのカッティングマシンである。\n\n■背景\n工房SeTAは建築に関連するものづくりを行っている拠点であり、模型製作や表示物の作成など、さまざまな制作作業に取り組んでいる。こうした現場では、手作業では時間がかかる精密なカット作業を効率化するための機材が求められる場面がある。細かい文字情報や複雑な図形を正確に切り出す必要がある建築模型制作において、手作業の限界を補う機材の導入は制作現場にとって大きな意味を持つといえる。\n\n■詳細\n今回導入されたSilhouette CAMEO5は、パソコンで作成したデータをそのままカット作業に反映できる点が特徴である。文字や図形といったデザインデータをもとに、カッティングシートや紙などの素材を自動で正確に切り出すことが可能だ。手作業によるカットでは難しい細かい形状や複雑なデザインも、データさえ用意できれば機械が自動で処理してくれる点が導入の利点といえる。\n\n工房SeTAでは、建築模型の製作や工房内外での表示物づくりといった場面での活用が期待されている。建築模型では細部の造形や文字情報の表示などが求められることが多く、カッティングマシンの導入によってこうした作業の精度向上や効率化が見込まれる。手作業では時間を要していた細部の切り出し作業も、データを用意すれば機械が自動で繰り返し高精度に処理できるため、作業時間の短縮と仕上がりの均質化の両面で効果が期待されている。\n\n■ポイント・注意点\n記事では、CAMEO5が「ものづくりの現場での活用が期待される」機材として紹介されており、具体的な作業内容や仕上がりの詳細については今後の活用を通じて明らかになっていくとみられる。工房における制作の幅を広げる一台として導入された点が今回のポイントである。今後の建築模型制作や表示物づくりの事例を通じて、実際の活用方法が明らかになっていくことが注目される。","2026-11-13","工房SeTA","https://www.shirokuma-archi.com/post/%E5%B7%A5%E6%88%BFseta%E3%81%AB%E3%82%AB%E3%83%83%E3%83%86%E3%82%A3%E3%83%B3%E3%82%B0%E3%83%9E%E3%82%B7%E3%83%B3%E3%82%92%E5%B0%8E%E5%85%A5"],["カッティングマシンおすすめ5選、シルエットとブラザーを徹底比較","ガジェナビが2026年10月31日に更新したカッティングマシンおすすめ5選。シルエットジャパンのカメオ5αシリーズを中心に価格や仕様を比較し、年末のセール時期を見据えた購入タイミングの情報もまとめている。在庫状況やブラックフライデーなどの日程にも言及。■概要ガジェナビは2026年10月31日、カッティングマシンのおすすめ5選をまとめた記事を更新した。仕様については公式サイトと取扱説明書をもとに確認し、価格は2026年10月24日時点における公式ストアと楽…","\n■概要\nガジェナビは2026年10月31日、カッティングマシンのおすすめ5選をまとめた記事を更新した。仕様については公式サイトと取扱説明書をもとに確認し、価格は2026年10月24日時点における公式ストアと楽天市場の検索結果を参照している。\n\n■背景\nカッティングマシンは機種ごとに対応できるシートの幅や厚み、操作方法などが異なるため、購入を検討する際には複数の製品を比較する必要がある。記事では価格帯や用途別に迷いやすいポイントを整理し、選びやすくすることを目的としている。\n\n■詳細\n記事内で「迷ったらこれ」として紹介されているのが、シルエットジャパンのシルエットカメオ5α（CAMEO5α）である。12インチ幅、厚さ3mmまでの素材に対応し、パソコンとスマホの両方で操作が可能で、価格は39,600円（税込）となっている。\n\nA3ノビサイズや15インチ幅といった大きな作品を作りたい場合には、上位モデルのシルエットカメオ5α PLUS（57,750円）が候補となる。一方、最安かつ最軽量のモデルとして紹介されているのがシルエットポートレート4で、価格は28,600円前後、重量は約2kgとなっている。\n\nなお、2026年10月24日時点でシルエットジャパン公式ストアのカメオ5α商品ページでは「在庫がありません」と表示されていたことも記事内で触れられている。人気モデルであるがゆえに在庫が追いつかない状況がうかがえ、購入を急ぐユーザーにとっては入手性も重要な検討材料となっている。\n\n年末にかけての買い時については、Yahoo!ショッピングのブラックフライデーが11月22日0:00から11月30日1:59まで開催されることや、12月の楽天スーパーSALEが候補として挙げられている。なお、Amazonブラックフライデーについては、2026年11月1日時点で日程が未発表であることも記載されている。\n\n■ポイント・注意点\n購入を検討する際は、対応できるシートの幅や厚みといった基本仕様に加え、在庫状況やセール時期も踏まえて検討する必要がある。特に人気モデルは在庫切れになる場合があるため、早めの情報収集が求められる。価格と仕様のバランスを重視するか、作品サイズの大きさを優先するかによって選ぶべきモデルが変わる点も踏まえておきたい。","2026-11-13","ガジェナビ","https://gadge-navi.com/cutting-machine-osusume/"],["2026年のクラフト用カッティングマシン7選、Maker 4が総合1位に","DeskRatedが2026年11月に公開したクラフト用カッティングマシン7機種のレビュー。Cricut Maker 4が総合1位となり、Silhouette Cameo 5 Alphaなど各ブランドの特徴的なモデルを価格や評価とともに紹介している。サブスクリプションの条件差にも言及している。■概要DeskRatedは2026年11月、クラフト用カッティングマシン7機種をレビューする記事を公開した。","\n■概要\nDeskRatedは2026年11月、クラフト用カッティングマシン7機種をレビューする記事を公開した。Cricut、Silhouette、Brother、Sizzixの4ブランドを横断的に取り上げ、Amazonの商品ページを2026年11月に生確認した上で情報をまとめている。\n\n■背景\nクラフト用カッティングマシンは素材や用途に応じて多様なモデルが展開されており、価格帯や対応素材、評価の高さなど比較すべき観点が多い。記事ではブランド横断で性能や価格を整理し、目的別のおすすめモデルを提示している。\n\n■詳細\n総合1位に選ばれたのはCricut Maker 4で、価格は379ドル、300種類以上の素材に対応し、12インチマットに加えて13インチのマットレス運用にも対応する。評価は4.4となっている。\n\n予算を重視する層には、小型モデルのCricut Joy Xtra Digital Versionが紹介されている。アップグレード向けの枠としてはSilhouette Cameo 5 Alphaが挙げられ、価格は299ドル、評価は4.4でレビュー件数は721件にのぼる。5,000gのデュアルキャリッジを備え、シリーズの中でも最も静音性に優れたモーターを搭載している点が特徴だ。Print and Cutの精度についても高く評価されており、付属のソフトウェアSilhouette Studioは無料で利用でき、月額課金は発生しない。\n\nこのほか、コストパフォーマンス重視のCricut Explore 5、スキャナーを内蔵しパソコンなしでもカット作業ができるBrother ScanNCut SDX125E、手動式のダイカットマシンであるSizzix Big Shot、携帯性を重視した199.99ドルのSilhouette Portrait 4も紹介されている。\n\nなお、Cricut製品を利用する際のサブスクリプションサービスCricut Accessは月額13.99ドルで全デザインライブラリを利用できるが、無料枠は大幅に制限されている点も記事内で指摘されている。一方でSilhouette Studioは無料利用が可能であり、追加費用の有無が両ブランドを比較する際の大きな分かれ目になっている。\n\n■ポイント・注意点\n購入時には本体価格だけでなく、対応素材の種類やマットサイズ、付属ソフトウェアの利用条件、サブスクリプションの有無なども含めて比較することが重要である。特にCricut製品ではAccessの課金有無によって使える機能に差が出る点に注意が必要だ。","2026-11-13","DeskRated","https://deskrated.com/best-craft-cutting-machines/"],["ユーロポート、カッティングプロッター「ステッカーシート2本＋替刃」11月末まで進呈","カッティングマシン・プロッター販売のユーロポートが、最大カット幅606mm対応のプロ向けカッティングプロッターなどの購入特典として、2026年11月30日注文分までステッカーシート2本と替刃をプレゼントするキャンペーンを実施している。税込149,600円からの複数機種が対象となる。カッティングマシン・プロッターを扱うユーロポート株式会社が、Tシャツマーキングやステッカー制作、看板施工向けの業務用カッティングプロッターに関する購入特典キャンペーンを実施して…","\n【概要】\nカッティングマシン・プロッターを扱うユーロポート株式会社が、Tシャツマーキングやステッカー制作、看板施工向けの業務用カッティングプロッターに関する購入特典キャンペーンを実施していることが同社サイトで案内されている。\n\n【背景】\n業務用途でのカッティングマシンは、看板制作やアパレルへのマーキング、ステッカーの量産など幅広い商業利用が想定されており、個人向けのCricutやSilhouetteとは異なるプロ向けの製品ラインが存在する。こうした製品群は厚紙や特殊素材にも対応し、商業規模での生産に耐える仕様が求められる点が特徴である。\n\n【詳細】\n最大カット幅606mm幅に対応した、プロ向けのカッティングプロッターで、カット圧の調整により多様な素材を切ることが可能。厚紙カット用のオプションにより、パッケージ製作にもおすすめとされる製品が紹介されている。該当製品には今だけステッカーシート2本＆替刃プレゼントのキャンペーンが2026年11月30日（月）ご注文分まで実施されている。\n\n紹介されている機種には、最大カット幅603mmの本格運用向けモデルや、省スペース向けに最大カット幅584mmに対応したモデルなどがあり、ビジネス用途に最適な、最大カット幅606mm幅に対応したプロ向けカッティングプロッターも含まれる。価格帯は税込149,600円からとなっている。\n\nこれらの機種はいずれもカット圧の細かな調整機能を備えており、薄いステッカーシートから厚紙まで、用途に応じた切断が可能とされる。パッケージ製作用のオプションも用意されており、看板施工業者やアパレル事業者、印刷会社など幅広い業種での導入が想定されている製品ラインナップとなっている。設置スペースの都合によって省スペース向けモデルを選ぶか、本格運用向けの大型モデルを選ぶかなど、事業規模に応じた選択肢が用意されている点も特徴といえる。\n\n【ポイント・注意点】\nキャンペーンの適用期限は2026年11月30日注文分までと設定されているため、購入を検討する事業者は期限内の発注が望ましい。業務用カッティングプロッターは個人向け機種と異なり、看板施工やパッケージ製作など商業規模の制作に対応しており、用途に応じた機種選定が重要となる。価格帯も税込149,600円からと幅広く、導入規模や作業内容に合わせた機種比較が求められる。","2026-11-12","ユーロポート株式会社","https://europort.jp/user_data/plotter"],["Cricut、11月前半にブラックフライデー向け割引セール展開中","海外のCricut公式ストアでは、2026年11月14日まで素材・アクセサリーが最大50%オフとなるセールを実施。Joy 2やExplore 5、Maker 4、StickerPixなど主要機種にも割引価格が適用されている。EasyPress Mini LTは11月24日まで全色29ドルで購入可能。バンドル構成の割引商品も展開される。米国のCricutクラフト情報サイトLydia Wattsが報じたところによると、Cricut公式ストアでは2026年11…","\n【概要】\n米国のCricutクラフト情報サイトLydia Wattsが報じたところによると、Cricut公式ストアでは2026年11月14日まで、素材・アクセサリーの最大50%オフを含む大型セールが実施されている。\n\n【背景】\n11月は年末商戦に向けたセール時期にあたり、Cricutをはじめとするクラフトブランド各社が主要機種や消耗素材の割引キャンペーンを展開する時期である。今回のセールは新製品StickerPixも対象に含まれている点が特徴的である。\n\n【詳細】\n2026年11月14日まで、Cricutでは素材・アクセサリーが最大50%オフになるほか、マシンやヒートプレスにもお得な価格が適用されている。具体的な割引例として、Cricut Joy™ 2のBlue Essential Bundleが109ドル、Cricut Joy Xtraが149ドル、Cricut Explore® 5のUltimate Plus Bundleが279ドル、Cricut Maker 4が379ドルで、11月14日まで購入可能とされている。さらに新製品についても、Cricut StickerPix Print™のBlue Essential Bundleが149ドル、Blue Ultimate Plus Bundleが209ドルで提供され、Cricut EasyPress Mini LTは全色29ドルで11月24日まで購入できるという。\n\n割引対象は入門機から上位機種まで幅広く、バンドル商品として本体と付属素材をまとめて購入できる構成になっている点も特徴である。特に発売間もないStickerPixシリーズが早くもセール対象に含まれていることは、同製品の普及を急ぐ同社の戦略を示しているとみられる。ヒートプレス製品も対象となっており、アパレル関連のクラフト需要を取り込む狙いもうかがえる。バンドル構成で購入することで本体と素材をまとめて揃えられる点は、初めてCricut製品を購入するユーザーにとっても利点となる。\n\n【ポイント・注意点】\nこのセールは米国市場向けの価格・条件であり、日本国内の価格や販売条件とは異なる点に注意が必要。対象期間は機種によって11月14日までと11月24日までの2パターンがあり、購入を検討する場合は対象期限を事前に確認する必要がある。発売間もないStickerPixも割引対象に含まれていることから、早期の普及促進を狙った施策とみられる。","2026-11-10","Lydia Watts","https://lydiawatts.com/2026/11/10/cricut-50-off-materials-and-accessories-plus-savings-on-machines-and-heat-presses/"],["Cricut株、決算後の急騰を受けWall Street Zenが格上げ","Cricut株がQ3決算を受けて急伸する中、調査会社Wall Street Zenが投資判断を引き上げたと報じられた。株価の推移やアナリスト間での評価の分かれ方、機関投資家の保有動向などを詳しく伝える記事。Barclaysも目標株価を引き上げている。平均評価は依然Strong Sellとされた。米メディアDaily Politicalが、Cricut株（NASDAQ: CRCT）に関する最新の株価動向とアナリスト評価の変化を報じた。","\n【概要】\n米メディアDaily Politicalが、Cricut株（NASDAQ: CRCT）に関する最新の株価動向とアナリスト評価の変化を報じた。決算後の株価急騰を受け、調査会社Wall Street Zenが投資判断を引き上げたことを中心に、他の証券会社の評価の違いも紹介している。\n\n【背景】\nCricutは2026年第3四半期決算で市場予想を上回る好業績を発表し、株価が大きく上昇した。新製品Maker 5とStickerPixの投入が業績を押し上げたことを受け、複数の証券会社が投資判断や目標株価を見直す動きが続いている。\n\n【詳細】\n記事によればBarclaysは目標株価を4.00ドルから6.00ドルに引き上げつつも「underweight」評価を維持したと報じた。アナリスト全体の評価については2人のアナリストがHold評価、4人がSell評価を付けており、MarketBeatによれば平均評価は「Strong Sell」、平均目標株価は4.73ドルだとした。\n\n株価の動きについてはNASDAQでCricut株は金曜日に8.78ドルで取引を開始し、50日移動平均は6.26ドル、200日移動平均は4.94ドルだったと報じた。短期的な移動平均が中長期の移動平均を大きく上回っていることから、直近の株価モメンタムの強さがうかがえる内容となっている。\n\n機関投資家の動向にも言及があり、複数の機関投資家が最近株式の売買を行っており、Dimensional Fund Advisors LPは第1四半期に保有株数を30.4%増やし、追加取得分を含めて985,868株、評価額368万7000ドル相当を保有していると報じた。こうした機関投資家の積み増しは、弱気なアナリスト評価とは対照的に、長期的な成長性を評価する投資家層が存在することを示している。\n\n記事全体を通じて、アナリスト評価の慎重さと株価モメンタムの強さ、さらに機関投資家の買い増し動向という三つの異なる視点が併存している状況が浮き彫りになっている。短期的な値動きと中長期的な評価の乖離は、今後の決算動向次第で修正される可能性もある。\n\n【ポイント・注意点】\nアナリストの間では引き続き弱気な評価が大勢を占めるものの、個別の目標株価は引き上げられる動きが相次いでいる点が特徴的だ。決算を機に株価のモメンタムとアナリスト評価の間にギャップが生じている状況がうかがえる。","2026-11-08","Daily Political","https://www.dailypolitical.com/2026/11/08/cricut-nasdaqcrct-stock-moved-up-to-buy-by-wall-street-zen.html"],["Cricut StickerPixがMakuake登場、初日限定割など特典用意","スマホ内の画像を自宅でステッカー・写真プリントに変える「Cricut StickerPix」がMakuakeに登場。2026年11月16日先行販売開始予定で、初日限定割や数量限定の早割セットが用意される見込み。印刷からカットまで一台で完結するモデルと、専用シートを使うコンパクトモデルの2種展開となる。Cricut StickerPixは、スマートフォン内の画像や写真を自宅で簡単にオリジナルステッカーや写真プリントへ変えられる新シリーズとして、2026年1…","\n【概要】\nCricut StickerPixは、スマートフォン内の画像や写真を自宅で簡単にオリジナルステッカーや写真プリントへ変えられる新シリーズとして、2026年11月16日（月）よりMakuakeにて先行販売が開始される見込みであることが報じられた。\n\n【背景】\n近年、推し活や手帳デコなど、個人が所有する写真やイラストを使ったクラフト需要が拡大している。従来はプリンターでの印刷とカッティングマシンでのカット作業を別々に行う必要があったが、こうした手間を一台で解消する製品として本シリーズが企画された。\n\n【詳細】\nCricut StickerPixは、スマートフォン内の画像や写真を自宅で簡単にオリジナルステッカーや写真プリントへ変えられる新シリーズで、2026年11月16日（月）よりMakuakeにて先行販売が開始される。プロジェクト名は「Cricut StickerPix™ 日本先行販売プロジェクト」で、販売場所はMakuake、対象モデルは「Cricut StickerPix Print + Cut™」および「Cricut StickerPix Print™」の2種となる。先行販売では、初日限定割や数量限定の早割セットなどが用意される予定とされている。\n\n「Cricut StickerPix Print + Cut™」は印刷から保護加工、輪郭に沿った自動カットまでを一台で完結できるオールインワンモデルであり、自由な形のステッカー制作に向いている。一方、「Cricut StickerPix Print™」はあらかじめカットされた専用シートを用いるコンパクトモデルで、写真プリントやラベル作りをより手軽に楽しめる仕様となっている。両モデルはユーザーの用途や予算、設置スペースに応じて選択できる構成となっており、本格的な制作を求めるユーザーから手軽さを重視するユーザーまで幅広く対応できる点が特徴とされる。\n\nこの2モデル展開により、自由な形状のステッカーを本格的に作りたいユーザーと、手軽に写真プリントやラベル作りを楽しみたいユーザーの双方のニーズに応える構成となっている。スマートフォンの画像をそのまま活用できる手軽さは、従来のクラフト制作のハードルを下げるものとして期待されている。\n\n【ポイント・注意点】\nMakuakeでの先行販売はクラウドファンディング形式の応援購入サービスであるため、通常の店頭販売や通販サイトとは異なるタイミング・価格設定になる可能性がある。初日限定の割引や早期予約特典を活用したい場合は、公開日である11月16日のスケジュールを事前に確認しておくことが推奨される。日本市場における写真・イラスト系クラフトの新たな選択肢として注目されている。","2026-11-06","Cube-Soft News","https://news.cube-soft.jp/article/4112766"],["Cricut決算、プラットフォーム部門堅調で海外売上30%増と判明","金融情報メディアTradingKeyがCricutの2026年Q3決算説明会を報じ、売上高11%増の詳細な内訳とともに、プラットフォーム部門の堅調さや海外売上の大幅な伸びを伝えている。接続型マシンの実売動向も解説。純利益は2,780万ドルに増加した。新製品Maker 5の投入効果も分析されている。金融メディアTradingKeyの日本語版が、Cricutの2026年第3四半期決算説明会の内容を報じた。","\n【概要】\n金融メディアTradingKeyの日本語版が、Cricutの2026年第3四半期決算説明会の内容を報じた。売上高の増加要因をプラットフォーム部門と海外展開の両面から分析し、新製品投入による接続型マシン市場での実売動向を詳述している。\n\n【背景】\nCricutは主力のカッティングマシン事業に加え、デザインプラットフォームの会員収益を収益源の柱としている。2026年第3四半期は新製品の投入と合わせてこれらの事業が総合的に成長した四半期となり、海外メディアに続き金融専門メディアも詳細な分析記事を発表した。\n\n【詳細】\n決算全体の数値についてはCricutの2026年第3四半期売上高は前年同期比約11%増の1億8,860万ドルとなり、純利益は2,780万ドルに増加したと報じた。成長の要因については新製品Maker 5や新カテゴリーStickerPixの投入に加え、プラットフォーム部門が堅調に推移し、海外売上高も30%増と大きく伸長したと伝えた。\n\n新製品の市場投入状況についてはCricutはMaker 5を発売し、StickerPix PrintおよびStickerPix Print + Cutにより接続型マシンの新たなカテゴリーに参入したと報じた。接続型マシンの実売動向に関してはJoy 2、Explore 5、Maker 5、StickerPixに支えられ、世界における接続型マシンの実売台数（セルアウト）は2四半期連続で2桁成長を記録したと伝えた。\n\nこの決算内容は、ハードウェア単体の販売だけでなく、デザインソフトやサブスクリプションを含むプラットフォーム事業の安定した成長があったことを示している。海外売上高の大幅な伸びは、国内市場に偏らない収益構造への転換を裏付けるものとして位置づけられている。\n\nまた新製品投入のタイミングと既存製品の継続的な販売が重なったことも、全体の成長を下支えする結果につながったとみられる。接続型マシンの2四半期連続の2桁成長は、単発の好材料ではなく持続的な需要の高まりを示すデータとして注目されている。\n\n【ポイント・注意点】\n同記事はプラットフォーム部門の堅調さを特に強調しており、ハードウェア単体ではなく、デザインソフトやサブスクリプション収益を含めた総合的な事業モデルの強さが業績回復の背景にあることを示唆している。海外売上の30%増という伸び率も、国内市場の成熟に対する海外展開の重要性を裏付ける数字として注目される。","2026-11-04","TradingKey","https://www.tradingkey.com/jp/news/transcripts/262275159-"],["Cricut、2026年Q3決算でMaker5とStickerPixが業績牽引","Cricut(CRCT)の2026年第3四半期決算で、製品売上高が17%増の1億270万ドルに。新製品Maker 5と新カテゴリーStickerPixの投入が寄与し、海外売上高も30%増と大きく伸びた。接続型マシンのセルアウトは2四半期連続で2桁成長を記録。StickerPixは発売間もなく影響は限定的とされる。Cricut, Inc.（NASDAQ: CRCT）の2026年第3四半期決算説明会が開催され、新製品の投入と海外展開の進展が業績を押し上げたこ…","\n【概要】\nCricut, Inc.（NASDAQ: CRCT）の2026年第3四半期決算説明会が開催され、新製品の投入と海外展開の進展が業績を押し上げたことが明らかになった。\n\n【背景】\nCricutは近年、既存の接続型マシン事業の立て直しと新カテゴリーへの展開による成長戦略を進めてきた。2026年に入りJoy 2、Explore 5を投入し、さらに9月にはフラッグシップ機Maker 5、11月にはStickerPixという新カテゴリー製品を相次いで発売している。\n\n【詳細】\n決算説明会によれば、売上高が予想を上回った主因は、製品売上高が17％増の1億270万ドルとなったことにあり、接続型マシンの販売数量が増加したほか、新たに発売したMaker 5やStickerPixが寄与した。Cricutの2026年第3四半期売上高は前年同期比約11%増の1億8,860万ドルとなり、純利益は2,780万ドルに増加した。プラットフォーム部門が堅調に推移し、海外売上高も30%増と大きく伸長した。\n\nCricutは「Maker 5」を発売し、「StickerPix Print」および「StickerPix Print + Cut」により接続型マシンの新たなカテゴリーに参入した。同社は2四半期連続で2桁のセルアウト成長を報告し、既存製品のJoy 2やExplore 5に加え、新しいMaker 5の発売も好調に寄与したとしている。\n\nこうした結果は、既存製品の安定した需要に加え、新製品投入によるカテゴリー拡大が同時に進んだことを示している。経営陣は新興カテゴリーであるStickerPixへの期待を示しつつも、発売間もないことから当四半期への貢献は限定的であったと説明している。\n\n新興カテゴリーの立ち上げ初期段階にもかかわらず、既存ラインナップの堅調さがそれを補う形で業績全体を押し上げた点は、同社の製品ポートフォリオの厚みを示す結果といえる。経営陣としても新カテゴリーの立ち上がりそのものには手応えを感じている様子がうかがえる。\n\n【ポイント・注意点】\n経営陣はインフルエンサーの関与も強く、初期反応は良好と述べる一方、StickerPixは当四半期の最後の数週間に発売されたため影響は限定的であり、新興市場では当四半期の大半で同製品が販売されていなかったと補足している。新カテゴリーの本格的な業績貢献は次四半期以降に見込まれる状況で、投資家にとっては今後の販売動向が注目点となる。","2026-11-03","BigGo ファイナンス","https://finance.biggo.jp/quote/CRCT/earnings-call/US_CRCT_2026-11-03"],["xTool C1、11月24日Makuakeで先行販売　印刷・スキャン・カット一体型","Makeblock Japanは、カラー印刷・スキャン・カットを1台でこなすカッティングマシン「xTool C1」を、2026年11月24日よりMakuakeで先行販売すると発表。スマホやタブレットからも操作でき、厚さ3mmまでの素材に対応する。1,000円の事前予約で5つの特典が付くキャンペーンも実施。内蔵スキャナーが自動で位置合わせを行う仕組みが特徴。Makeblock Japanは2026年10月30日、フルカラーのカッティングマシン「xTool …","\n【概要】\nMakeblock Japanは2026年10月30日、フルカラーのカッティングマシン「xTool C1」を応援購入サービス「Makuake」にて2026年11月24日11時から先行販売すると発表した。\n\n【背景】\n家庭用カッティングマシン市場では、印刷とカットを別々の機器・工程で行う従来の方式に代わり、1台で完結するオールインワン型への関心が高まっている。Cricutも同様のコンセプトでStickerPixを投入しており、各社でこの分野の競争が活発化している。\n\n【詳細】\nMakeblock Japanは、印刷・スキャン・カットを1台でこなすカッティングマシン「xTool C1」をMakuakeで2026年11月24日から先行販売する。スマホやタブレットからも操作でき、厚さ3mmまでの素材に対応する。1,000円の事前予約で5つの特典が付くキャンペーンは2027年1月17日まで実施される。\n\n製品の特徴として、xTool C1は、カラー印刷・スキャン・カットを1台でこなすマシンであり、これまでのように家庭用プリンターで印刷した紙をカッティングマシンに移し替えて位置を合わせる手間がいらない点が挙げられる。紙から厚さ3mmまでの素材に対応し、スマートフォンやタブレットからも操作できる。本体価格は、Makuakeの先行販売開始時に発表される予定となっている。動作としては、4色インクで印刷したうえで内蔵スキャナーが位置を合わせてカットする仕組みが採用されている。\n\nこの仕組みにより、従来は印刷後にカッティングマットへ素材を移し替え、トンボを手動で合わせる手間が必要だったが、xTool C1では内蔵スキャナーが自動的に位置を検出するため、作業工程の簡略化が期待されている。事前予約キャンペーンでは、早期購入者向けに複数の特典が用意されており、長期間にわたって申込を受け付ける点も特徴である。\n\nこうした一体型の設計は、従来複数の機材を使い分けていたクラフト愛好家にとって、作業スペースの節約や制作時間の短縮につながると見込まれている。スマホやタブレットから操作できる手軽さも、幅広い層への普及を後押しする要素となりそうだ。\n\n【ポイント・注意点】\n本体価格は先行販売開始時点で公表されるため、購入を検討するユーザーは11月24日の発表を待つ必要がある。事前予約キャンペーンは2027年1月17日まで実施されるため、特典を受けたい場合は期限に注意したい。Cricut StickerPixと同様のオールインワン型市場に参入する製品であり、今後価格・性能面での比較が注目される。","2026-11-03","Smart Watch Life","https://www.smartwatchlife.jp/86025/"],["Cricut決算、EPS0.13ドルでアナリスト予想を大幅上回る","Investing.comがCricutの2026年第3四半期決算を報じ、1株当たり利益が市場予想の0.05ドルを大きく上回る0.13ドルだったと詳述。決算発表後の時間外取引での株価急騰の具体的な値動きも伝えている。全社売上高は11%増、製品売上高は17%増だった。流通在庫の積み増し効果にも言及している。投資情報メディアInvesting.comが、Cricutの2026年第3四半期決算の詳細な数値を報じた。","\n【概要】\n投資情報メディアInvesting.comが、Cricutの2026年第3四半期決算の詳細な数値を報じた。1株当たり利益と売上高がともにアナリスト予想を大きく上回ったことを中心に、決算発表直後の株価の具体的な値動きを伝える記事となっている。\n\n【背景】\nCricutはクラフト用カッティングマシンを手がける米国企業で、近年は業績の伸び悩みが続いていた。2026年第3四半期は新製品Maker 5とStickerPixの投入、国際展開の進展を背景に、市場予想を上回る決算内容となった。\n\n【詳細】\n決算の具体的な数値については1株当たり利益0.13ドルはアナリスト予想の0.05ドルを大きく上回り、売上高1億8,860万ドルも予想の1億6,436万ドルを上回ったと報じた。\n\n決算の全体的な評価についてはCricutは火曜日に市場予想を上回る第3四半期決算を発表し、新製品と国際展開の成長が、クラフト機器メーカーを売上成長へと押し戻す原動力になったと伝えた。\n\n株価の反応については株価は通常取引を5.97ドルで終えた後、決算発表を受けて時間外取引で7.02ドルまで急伸し、1.05ドル、率にして17.59%の上昇となったと報じた。\n\n売上成長の内訳についてはAshishが述べた通り、世界全体の接続型マシンの実売台数は二桁成長を記録し、Joy 2とExplore 5の継続的な販売、そしてMaker 5と新しいStickerPix製品の発売が当四半期の成長を牽引したと伝えた。財務責任者のコメントとしては最高財務責任者のキンボール・シル氏は今四半期の結果に非常に満足していると述べ、全社売上高が11%増、製品売上高が17%増となったとし、これは製品発売前の流通在庫積み増しの恩恵を受けたと説明した。\n\n市場予想を大きく上回るEPSと売上高の両面での好決算は、投資家心理を大きく改善させ、時間外取引における急騰という形で即座に反映された。既存製品の継続販売と新製品投入のタイミングが重なったことも、好決算を後押しした要因として挙げられている。\n\n【ポイント・注意点】\n今回の決算は市場予想を大幅に上回る内容であったものの、財務責任者自身が流通在庫の積み増し効果に言及している点には注意が必要だ。次四半期以降もこの成長ペースを維持できるかが今後の焦点となる。","2026-11-03","Investing.com","https://www.investing.com/news/transcripts/earnings-call-transcript-cricut-beats-q3-2026-estimates-shares-jump-after-hours-93CH-4996833"],["Cricut Maker 5、アイルランド紙が「家庭クラフトが進化」と評価","アイルランドの大手紙アイリッシュ・タイムズがCricut Maker 5を実機レビュー。素材の厚み対応拡大や処理速度の向上、初心者への使いやすさなどを紹介し、前モデルより信頼性が高まったと総括している記事。電源ボタン廃止という仕様変更が唯一の懸念点として挙げられた。本体の小型化による収納性向上も評価されている。アイルランドの大手紙アイリッシュ・タイムズのテクノロジー欄が、Cricutの最新カッティングマシン「Maker 5」の実機レビューを掲載した。","\n【概要】\nアイルランドの大手紙アイリッシュ・タイムズのテクノロジー欄が、Cricutの最新カッティングマシン「Maker 5」の実機レビューを掲載した。記事は家庭での手工芸がこの機種によってレベルアップすると評価し、素材対応の広さと使いやすさの両面を取り上げている。\n\n【背景】\nCricut Maker 5は2026年9月に発売された同社のフラッグシップ機で、前モデルMaker 4からの刷新として素材対応力と省スペース性を打ち出した製品。発売から約2カ月が経過し、海外の主要メディアでも実機を使った評価記事が相次いでいる。\n\n【詳細】\n記事は総括としてMaker 5は高速で信頼性が高く、従来モデルより多機能だとし、より厚い素材を切断でき、動作も速く、初心者であれば立ち上げ期の難しさに寄り添ってくれると評価した。対応素材についても布地や紙、ビニールや木材まで幅広い素材を切断でき、追加ツールを使えば金属の彫刻や皮革のデボス加工も可能になると紹介した。\n\n設計面ではMaker 5は市場に出た最新機種であり、従来より厚い素材を切断できることでより万能になり使いづらさが減った一方、前モデルより小型化され収納しやすくなったと指摘した。具体的な変更点としては蓋と左側のツールホルダーを廃止してサイズを削減したが、実用上の損失はないとした。\n\nただし使い勝手の面では課題も指摘されており、電源ボタンが廃止され、コンセントに挿すだけで起動する仕様になったことで、操作すべき要素が一つ減った一方、電源を切るたびにコンセントを抜く必要があり、それがやや不便だとした。\n\n処理速度についても言及があり、従来モデルより動作が速くなったとし、組み立てより機械の動作を待つ時間の方が長いと感じるほどその差は顕著で、古いMaker 3と比べて詰まりやエラーも少なく信頼性が高いと評価した。こうした速度と安定性の両立は、頻繁にクラフト制作を行うユーザーにとって作業効率の向上に直結する利点として位置づけられている。\n\n【ポイント・注意点】\n同紙は電源ボタン廃止という仕様変更を唯一の懸念点として挙げつつも、総合的には従来機からの明確な進化だと結論づけている。既存ユーザーが買い替えを検討する際の参考情報として、速度と信頼性の向上を重視する評価内容となっている。","2026-10-31","The Irish Times","https://www.irishtimes.com/technology/consumer-tech/review/2026/10/31/cricut-maker-5-review-home-crafting-levels-up/"],["Cricut Maker 5、NZメディアが「速くて万能」と高評価レビュー","ニュージーランドのガジェットメディアWitchdoctorがCricut Maker 5を検証。30%の小型化や3mm厚までの素材対応、海外メディアでの高評価も紹介し、共有テーブルに適したデザインだと結論づけた記事。販売価格は799.95ドルで展開されている。Tom's GuideのEditor's Choice受賞にも言及している。ニュージーランドのテクノロジーメディアWitchdoctorが、Cricutの新型フラッグシップ機「Maker 5」の実機…","\n【概要】\nニュージーランドのテクノロジーメディアWitchdoctorが、Cricutの新型フラッグシップ機「Maker 5」の実機レビューを掲載した。記事は家庭のダイニングテーブルを占領しがちなクラフト用品にまつわるユーモラスな導入から、同機の省スペース性と実用性を評価する内容となっている。\n\n【背景】\nMaker 5は前モデルMaker 4の後継として2026年9月に発売され、ニュージーランドでも販売価格799.95ドルで展開されている。海外の主要レビューメディアでも高評価を得ており、同国メディアも独自の検証記事を公開した。\n\n【詳細】\n記事は総評としてMaker 5は俊敏で万能性があり、より小型で整理されたデザインは共有テーブルに適しているとし、海外のレビューも好評で、Tom’s GuideはEditor’s Choiceの評価を与えたと紹介した。\n\n開発の背景についてはクラフトに関心のあるニュージーランドの家庭には、3つ目のビニールプロジェクトのあたりからダイニングテーブルとしての役目を終えてしまうテーブルがあるとし、切れ端がソファに散らばりグリッターがカーペットを覆う様子をユーモラスに描写した上で、Cricutの新型Maker 5はそうした家庭を念頭に設計されており、前モデルのMaker 4より30%コンパクトになったと伝えた。\n\n実機を試した感想としてレビュー用にMaker 5を借りて検証したところ、結論として速く非常に万能性が高く、好印象を受けたと述べた。\n\n最大の注目点である素材対応の拡大については目玉となる変更点は素材の厚み対応で、Cricutによれば互換素材を最大3mm厚まで切断・彫刻でき、前世代の2.4mmから25%のクリアランス拡大になったと紹介した。\n\nこうした素材対応の広がりと本体の小型化は、限られたスペースで多様なクラフト制作を楽しみたいユーザーにとって大きな利点として位置づけられている。狭い住宅事情を抱える家庭でも導入しやすい設計は、同国のクラフト愛好家層にとって特に訴求力が高いとみられる。\n\n【ポイント・注意点】\n同メディアは海外レビューの評価も引用しながら、Maker 5がコンパクトさと機能性を両立した機種であることを強調している。ダイニングテーブルを占領しがちなクラフト愛好家の家庭にとって、設置のしやすさが購入の決め手になりうる点を示唆する内容だ。","2026-10-22","Witchdoctor","https://www.witchdoctor.co.nz/2026/cricut-maker-5-review/"],["Cricut Joy 2限定カラーバンドル「Coral」10月21日発売、年末商戦意識","Cricutは季節イベント向けの限定カラーセット「Cricut Joy 2 Coral Deluxe Bundle Box」を10月21日に発売。ハロウィンやクリスマス、お正月の手づくりアイテム制作需要を見込み、素材やツールをまとめたバンドルモデルとして展開している。販売価格は税込35,800円。数量限定で楽天・Amazon・Yahoo!で販売。Cricutは、季節イベントを彩る手づくりアイテム制作向けに、数量限定の限定カラーセット「Cricut Joy…","\n【概要】\nCricutは、季節イベントを彩る手づくりアイテム制作向けに、数量限定の限定カラーセット「Cricut Joy™ 2 Coral Deluxe Bundle Box」を2026年10月21日（水）に発売した。\n\n【背景】\n11月・12月はギフト需要やクリスマスカード、年末年始の装飾制作など、Cricut利用が高まる季節とされている。同社はフラッグシップ機Maker 5で得た知見を活かし、入門機であるJoy 2にも同様のアプローチを展開した。\n\n【詳細】\n11月、12月は、ギフト需要に加え、クリスマスカードや年末年始の装飾など、Cricutを使う機会が自然と増える季節であり、Maker 5で手応えを得た「付属品まで含めた価値の分かりやすさ」をJoy 2にも取り入れることで、Coral Deluxe Bundle Boxには年末商戦において新しいユーザーを呼び込む役割も期待されている。\n\n本製品は、限定カラー本体（Coral）に加え、人気の基本ツールやマルチツール、各種スマート素材やプリンタブルビニールなど、制作に使う素材とツールをセットにした限定バンドルモデルであり、販売価格は税込35,800円となる。ハロウィン、クリスマス、お正月などの季節イベントに向けた創作シーズンを控え、素材やツールを揃える負担を減らし、届いたその日からすぐに作品づくりを楽しめる特別なクリエイティブ体験を提供するとしている。「Cricut Joy™ 2」は専用アプリで文字やデザインを選ぶだけで紙やシートをカットできるコンパクトなカッティングマシンで、付属のインサートカードでメッセージカードを作ったり、スマートビニールでオリジナルラベルを仕立てたりできる。\n\nこうしたバンドル展開は、初めてCricutを購入するユーザーが別途素材を揃える手間を省き、すぐに季節のクラフト制作を始められる点を重視した構成となっている。限定カラーという特別感もあり、ギフト購入やセルフギフトとしての需要も見込まれている。\n\nフラッグシップ機Maker 5で評価された「付属品込みのわかりやすさ」という考え方を、よりコンパクトな入門機であるJoy 2にも展開することで、幅広い価格帯のユーザー層に同様の価値を届ける狙いがうかがえる。\n\n【ポイント・注意点】\n本製品はCricut公式ストアの楽天市場・Amazon・Yahoo!ショッピングで販売される。数量限定のため、年末商戦でのギフト需要に合わせて早めの購入検討が推奨される。初心者でも届いてすぐ制作を始められる点が特徴で、入門用途としても適している。","2026-10-21","newscast.jp（Cricut, Inc.プレスリリース）","https://newscast.jp/news/8411549"],["xTool C1、全色印刷とスキャン一体型カッターとして米国で正式発表","Makeblockのブランドxtoolが、印刷・スキャン・精密カットを1台で行えるカッターマシン「xTool C1」を発表。複数機材を行き来する従来の制作工程を簡略化する製品として、クラフト愛好家や小規模事業者向けに展開する。10月20日から事前予約キャンペーンを開始し、割引や素材バンドルなどの特典を用意する。デジタル工作機器を手がけるxTool（Makeblock系ブランド）は、フルカラー印刷・スキャン・精密カットを1台でこなす新型カッティングマシン「…","\n【概要】\nデジタル工作機器を手がけるxTool（Makeblock系ブランド）は、フルカラー印刷・スキャン・精密カットを1台でこなす新型カッティングマシン「xTool C1 Color Cutter」を正式発表した。複数の機材を使い分ける従来のクラフト制作の手間を解消する製品として位置づけられている。\n\n【背景】\nxToolはこれまでレーザー加工機を中心に展開してきたブランドだが、今回新たにクラフトカッター市場へ本格参入した。従来、カラフルなステッカーやグッズを作る際には家庭用プリンターとカッティングマシンを別々に使い、トンボ位置合わせなどの手間が発生していた課題に対応する製品として開発された。\n\n【詳細】\n発表によればxToolはデジタル製造とスマートデスクトップ製造のグローバルパイオニアを自称しており、今回クラフトカッター市場への参入としてxTool C1 Color Cutterを発売したと説明した。対象ユーザーについてはDIY愛好家や経験豊富なクラフターから小規模事業者まで想定し、スキャン・フルカラー印刷・精密な刃によるカットを1台のデスクトップ機にまとめ、カスタムステッカーやアパレル、パーソナライズギフトやラベルなど幅広い制作を簡略化するとした。\n\n製品コンセプトについては印刷とカットを1台にまとめることでこの課題に対応し、デザインを個別のインクジェットプリンターで印刷してからカッティングマットに素材を移し替え、トンボを合わせるといった複数ステップが必要だった従来工程を解消し、機材を切り替えずに詳細でカラフルなデザインを作成できるとし、これらの追加工程は素材の無駄やズレ、製作時間の長期化につながっていたと指摘した。\n\nスローガンについては「Scan It. Print It. Cut It. Always in One Workflow」というスローガンの下で設計され、高精度なCISスキャン、CMYKフルカラーインクジェット印刷、動的な刃によるカットを1台の自動化されたデスクトップワークステーションに統合することで業界の長年の課題を解決するとした。\n\n販売戦略に関しては2026年10月20日からグローバルでの事前予約キャンペーンを開始し、10ポンドの予約金で早期購入者向けに機材の大幅割引や素材バンドル、ライブ配信での景品応募権などの特典を提供するとした。\n\nこのような一体型設計とグローバル規模での事前予約施策は、同社がクラフトカッター市場においても従来のレーザー加工機事業と同様に早期の市場浸透を図る狙いを示している。\n\n【ポイント・注意点】\nxToolにとって本製品は、従来のレーザー加工機事業から精密機械・自動化技術を応用し、クラフトカッター市場へ本格進出する戦略的な一歩となる。家庭でのステッカー制作や小規模事業者のカスタム商品作りにおける競合製品との比較が今後の焦点となりそうだ。","2026-10-20","PR Newswire（Yahoo Finance掲載）","https://finance.yahoo.com/news/xtool-launches-c1-color-cutter-130000142.html"]],"uv":[["ColDesi、Mutoh新型UVフラットベッド「XpertJet 661UF Pro」の取り扱い開始","米ColDesiがMutohの新型UVフラットベッドプリンター「XpertJet 661UF Pro」の取り扱いを開始した。従来機比で印刷速度約2.1倍、点字印刷約1.5倍を実現し、販促品やパーソナライズ品、工業マーキングなど幅広い用途に対応する。最大印刷面積は約19×24インチで、厚さ6インチ、重さ約8kgまでの立体物にも印刷可能な汎用性の高い機種である。","\n【概要】\n米フロリダ州クリアウォーターに拠点を置くColDesiは、MutohのUVフラットベッドプリンター「XpertJet 661UF Pro」の取り扱いを開始したと発表した。本機は従来機「XpertJet 661UF」の後継モデルにあたり、印刷性能の大幅な向上が特徴となっている。\n\n【背景】\nUVフラットベッドプリンターは販促品やノベルティ、記念品などのパーソナライズ製品市場で需要が拡大しており、印刷速度や対応素材の幅広さが製品選定の重要な指標となっている。ColDesiはこうした市場ニーズに応える形で、Mutohの新型機をラインアップに加えた。\n\n【詳細】\nXpertJet 661UF Proは、従来機と比較して印刷速度が約2.1倍に向上し、点字印刷についても約1.5倍の速度を実現した。プリントヘッドには「AccuFine HD Pro」を搭載し、シャーシはスチールとアルミによる強化構造を採用している。また、UV-LED硬化システムも強化され、安定した硬化性能を発揮する。\n\n対応する最大印刷面積は約19×24インチ（約48×61cm）で、厚さ6インチ（約15cm）までの素材に印刷可能。さらに、重さ約17.6ポンド（約8kg）までの立体物にも対応する。\n\n用途としては、販促品の印刷のほか、賞状や盾などのパーソナライズ品、小判サイズのサイネージ、工業製品へのマーキング、さらに盛り上げ印刷や点字印刷といった加飾表現にも対応する。販売はColDesiを通じて行われる。強化されたプリントヘッドとシャーシ構造により、高速運転時でも安定した印刷品質を維持できる点も導入のメリットとして挙げられる。\n\n【ポイント・注意点】\n本機の最大の特徴は、従来機比で印刷速度が約2.1倍、点字印刷が約1.5倍というスピードの向上にある。生産性を重視するユーザーにとっては大きな導入メリットとなるだろう。また、厚さ6インチ、重さ約8kgまでの立体物に対応できる点も、多様な製品への印刷ニーズに応える強みといえる。導入を検討する際は、対応素材のサイズや重量の上限を事前に確認し、自社の製造ラインに適合するかを見極めることが重要である。販促品からパーソナライズ品、工業マーキングまで幅広い用途をカバーできるため、複数分野への展開を視野に入れる事業者にとっても有力な選択肢となる。","2026-11-13","Big Picture","https://bigpicturemag.com/coldesi-adds-mutoh-xpertjet-661uf-pro-uv-flatbed-for-promo-and-personalized-products-2-1x-faster/"],["PRINTING United 2026、注目のUV・大型新機種32選を写真ギャラリーで紹介","米Big Picture誌がラスベガスで開催されたPRINTING United Expo 2026で注目を集めた新製品32点を写真ギャラリー形式で紹介。Agfa、Arcus、Epson、Mimaki、CET Color、EFI、Durst、Canonなど各社のUV・大型プリンターが取り上げられ、自動化やハイブリッド対応、多様なメディア対応が共通の潮流として見られた。","\n【概要】\n米Big Picture誌は、ラスベガスで開催された大型展示会「PRINTING United Expo 2026」の会場で目を引いた製品32点を写真ギャラリー形式で紹介した。UVフラットベッドや大型プリンターを中心に、各社の最新機種が並んだ。\n\n【背景】\nPRINTING United Expoは印刷業界における大型展示会のひとつで、毎年各メーカーが最新のプリンター技術を披露する場となっている。2026年の開催でも、自動化やハイブリッド対応、多様なメディア対応を打ち出した新製品が多数登場した。\n\n【詳細】\n紹介された製品の一部を挙げると、Agfaの「Onset Panthera FB3216」はフラットベッドタイプで、段階式UV LED硬化によりニスを使わずに2パスでサテンまたは高光沢の仕上げが可能。最大生産性は16,297平方フィート／時に達する。Arcusの「Monarch FB1218」は飲料用カップ向けロータリーユニットを内蔵した小型UVフラットベッドで、Soft-Flex UVインクによる立体エンブレム表現、ビジョンスキャンカメラ、ロール・トゥ・ロールUV DTFアタッチメントを備える。\n\nEpsonの「SureColor V4000」は27.5×38.5インチのベッドと7.8インチのメディア対応高さを持ち、オレンジ・赤・グレーを含む10色インクでADA（米国障害者法）準拠の点字印刷に対応する。Mimakiの「JFX220-2515」は厚さ4インチ（101.6mm）までの素材に対応し、最大印刷面積は98.4×59.1インチに達する。\n\nこのほか、CET Colorの「K2-1000 3 Row UVフラットベッド」は京セラ製プリントヘッドを搭載し最大2,159平方フィート／時、EFIの「VUTEk M3h」ハイブリッドLEDプリンターは最大4,219平方フィート／時、Durstの「P5 350 CORE」は最大3,500平方フィート／時の生産性を誇る。CanonのColorado XLはUVgel 860インクセットを採用している。\n\n【ポイント・注意点】\n会場全体を通じて目立ったのは、自動化機能、硬質素材とロール素材の両方に対応するハイブリッドプラットフォーム、そしてインテリアや小売、ダイレクト・トゥ・オブジェクト向けの多様なメディア対応という3つの潮流だった。各社の製品は生産性の数値だけでなく、対応素材の厚みや仕上げの質、点字印刷への対応など、用途に応じた機能差が見られる点に注目したい。導入検討時には自社の用途に合った生産性・対応素材・仕上げ品質のバランスを確認することが重要である。","2026-11-13","Big Picture","https://bigpicturemag.com/2026-printing-united-show-report/"],["ミマキ、新型UVプリンターUJF200シリーズのローンチイベントを欧州各地で開催へ","Mimaki Europeが新製品UJF200シリーズなどを披露するローンチイベントを欧州各地で開催する。フランス、セルビア、ルーマニアで順次実施され、コンパクトなフラットベッドUV-LEDプリンターの高画質・自動化機能を紹介する。オプションのカメラシステムによる自動位置認識や高さ25cmまでの立体物対応も特徴である。Mimaki Europeは、2026年9月8日に発表した3つの新製品を披露するローンチイベントをEMEA（欧州・中東・アフリカ）各地で開…","\n【概要】\nMimaki Europeは、2026年9月8日に発表した3つの新製品を披露するローンチイベントをEMEA（欧州・中東・アフリカ）各地で開催すると発表した。フランスでは2026年11月17〜18日にMimaki France（パリ北部のTremblay-en-France）で開催されるほか、セルビアでは11月20日、ルーマニアでは11月25〜26日に実施される。\n\n【背景】\nMimakiは9月に発表した新製品について、欧州各国で実機を交えたローンチイベントを展開することで、現地の顧客やパートナー企業への周知を図っている。今回の主役となるのが、コンパクトなフラットベッドUV-LEDプリンター「UJF200シリーズ」である。\n\n【詳細】\nUJF200シリーズは、高画質・高生産性・高度な自動化を兼ね備えたコンパクト設計のフラットベッドUV-LEDプリンターで、パーソナライズ製品や装飾、製品製造向けの用途を想定している。\n\n特筆すべき機能として、オプションで用意されるカメラシステムが挙げられる。このシステムを使用することで、印刷対象となる各オブジェクトの位置を自動的に認識し、位置合わせの手間を軽減できる。また、高さ25cmまでの立体物への印刷にも対応しており、平面素材だけでなく厚みのある製品にも柔軟に対応できる設計となっている。\n\nフランス会場ではMimaki Franceの拠点であるTremblay-en-Franceで開催され、2日間にわたって新製品が紹介される。セルビア、ルーマニアでもそれぞれ現地にてイベントが予定されており、欧州各国の顧客が実機を見る機会が設けられる。各国での開催により、幅広い地域の顧客やパートナー企業が実機に触れ、導入検討の参考にできる機会が提供される。\n\n【ポイント・注意点】\nUJF200シリーズの魅力は、コンパクトな筐体でありながら高画質・高生産性・高度な自動化を実現している点にある。特にオプションのカメラシステムによる自動位置認識機能は、多品種少量生産や個別パーソナライズ製品の制作において作業効率の向上に寄与すると考えられる。また、高さ25cmまでの立体物に対応することから、平面印刷だけでなく、さまざまな形状の製品への展開を検討している事業者にとっても参考になる情報といえる。各国のイベント日程が異なるため、参加を検討する場合は開催地と日程を事前に確認することが推奨される。","2026-11-13","Mimaki Europe","https://www.mimakieurope.com/events/new-product-launch-events-france-17-nov-2026/"],["モノラボファクトリー、つなげて楽しむ連結アクキーを1個から作成可能に","共立出版グループのオンデマンド印刷サービス「モノラボファクトリー」が、複数パーツをつなげられる「連結アクキー」の提供を開始。UV印刷とレーザー加工で製造し、1個から注文可能で、イベント頒布グッズにも活用できる。サイズは40mm角から95mm角まで5種類用意され、片面・両面印刷や台紙印刷オプションにも対応する。共立出版グループが運営するオンデマンド印刷サービス「モノラボファクトリー」は、パーツ同士をつなげて楽しめる「つながるアクキー（連結アクキー）」の提供…","\n【概要】\n共立出版グループが運営するオンデマンド印刷サービス「モノラボファクトリー」は、パーツ同士をつなげて楽しめる「つながるアクキー（連結アクキー）」の提供を紹介した。1個から注文可能で、個人のクリエイターから同人イベント向けグッズ制作まで幅広く利用できる仕様となっている。\n\n【背景】\nアクリルキーホルダーは同人グッズやノベルティとして定番のアイテムだが、単体のデザインだけでなく、複数のパーツを組み合わせて楽しめる商品への需要も高まっている。モノラボファクトリーは、こうしたニーズに応える形で連結可能なアクキーの企画を提供している。\n\n【詳細】\n「つながるアクキー」は、上下2か所に穴の開いたアクリルキーホルダーで、下側の穴にマルカンを通すことで別のパーツと連結できる仕組みになっている。この機能を活用することで、キャラクターを縦に並べた連結アクキーを作成したり、ロゴとキャラクターを組み合わせたデザインを実現したりすることが可能だ。\n\nサイズは40mm角から95mm角までの5種類が用意されており、印刷は片面印刷と両面印刷から選択できる。さらに、有料オプションの台紙印刷を追加すれば、イベントでの頒布グッズとしてもそのまま活用できる仕上がりとなる。\n\n製造方法には、CMYKに白おさえを加えたUV印刷と、レーザー加工の技術が用いられている。UV印刷による発色とレーザーによる精密な形状加工を組み合わせることで、連結構造を持つ製品でも高い品質を確保している。\n\n注文は1個単位から可能で、納品時には1個ずつOPP袋に封入される。価格例として、40×40mmサイズを1個注文した場合、早割（14営業日）適用で税込1,342円となっている。納期は特急便で5営業日、通常便で9営業日、早割で14営業日の3種類から選べる。\n\n【ポイント・注意点】\n本サービスの特徴は、1個からの小ロット注文に対応している点と、パーツを自由に連結できるデザインの柔軟性にある。イベント頒布グッズとして活用する場合は、有料の台紙印刷オプションを付けることで完成度の高い商品に仕上げられる。また、納期は特急・通常・早割の3段階が用意されているため、制作スケジュールに応じて選択するとよい。サイズ展開が40mm角から95mm角までの5種類に限られる点や、価格が早割適用時の例である点にも留意して検討することが望ましい。","2026-11-13","モノラボファクトリー","https://kyoyupublish-onde.com/goods/tsunagaru/"],["バードランド、2027モデルのA4サイズ小型UVプリンター「UVP-A4XP」を発売","工業用ミシン・プリンター販売のバードランドが、アクリルや木材、革に素早くフルカラー印刷できる新型A4サイズUVプリンター「UVP-A4XP」(2027モデル)の販売を開始した。価格は575,000円（税込）で、小型機ながら多様な素材への対応力を備えており、個人や小規模事業者によるオリジナルグッズ制作需要に応える製品となっている。工業用ミシンやUVプリンター、DTFプリンターを扱うバードランドは、2027モデルのA4サイズUVプリンター「UVP-A4XP」…","\n【概要】\n工業用ミシンやUVプリンター、DTFプリンターを扱うバードランドは、2027モデルのA4サイズUVプリンター「UVP-A4XP」の販売を開始した。アクリル・木材・革など多様な素材への印刷に対応する。\n\n【背景】\n個人や小規模事業者によるオリジナルグッズ制作市場が拡大する中、設置スペースを取らず初期費用を抑えられる小型UVプリンターへの需要が高まっている。大型の業務用機は高額であったり設置場所を確保する必要があったりするため、手軽に導入できる機種を求める声が増えていた。同社はこうしたニーズに応える形で、A4サイズの新モデルを投入した。\n\n【詳細】\n「UVP-A4XP」は、マルチ素材対応のUVプリンターであり、A4サイズでの高精細印刷を特長としている。アクリル・木材・革といった異なる素材へ素早くフルカラーで印刷できる点が訴求されている。価格は575,000円（税込）であり、比較的手の届きやすい価格帯で導入できる点も特徴である。小型でありながら多様な素材に対応できるため、個人クリエイターが自宅やオフィスで気軽にオリジナルグッズ制作を始める用途にも適している。\n\n同社は他にも、A1サイズの高性能・大型UVプリンター「UVP-A1（3I3200DS）」（2026年モデル）も展開しており、こちらは3ヘッド搭載で90×60cmエリアへの印刷が可能、8色インクを採用している。価格は980,000円（税込）である。小型機のA4サイズモデルから大型機のA1サイズモデルまで幅広いラインナップを揃えており、用途や予算、印刷したい素材のサイズに応じて選択できる体制を整えている。\n\n【ポイント・注意点】\nA4サイズの小型機は初めてUVプリンターを導入する個人・小規模事業者に適した選択肢である一方、印刷エリアが限られるため、大量生産や大型素材への対応を想定する場合はA1サイズなど上位機種の検討が必要となる。価格だけでなく、対応インク数やヘッド構成による画質・耐久性の違いも比較検討のポイントとなる。導入目的や生産規模を明確にした上で、自社に適したモデルを選ぶことが重要である。","2026-10-20","バードランドマシン","https://wakuwakumisin.ocnk.net/product-list/17"]],"risk":[["北九州市で小中学校インフルエンザ流行、13日に7校で学級・学年閉鎖","北九州市内の小中学校・高校で11月13日にインフルエンザ様疾患による学級閉鎖・学年閉鎖が相次いで報告された。各校で発熱などの症状を訴える児童生徒が増加し、14日を中心に数日間の閉鎖措置がとられている。市は手洗いや換気など基本的な感染対策の徹底を呼びかけており、前日の12日報告分でも複数校で学級閉鎖が確認されるなど、市内広域で流行が拡大している状況がうかがえる。","\n【概要】\n北九州市は、2025/2026シーズンのインフルエンザ様疾患による学級閉鎖等の報告状況を公表しており、11月13日報告分として、若松区のくきのうみ小学校2年生、小倉北区の貴船小学校3年生、門司区の門司海青小学校3年3組など複数の小中学校・高校で学年閉鎖・学級閉鎖が発生した。\n\n【背景】\n福岡県北九州市では秋以降インフルエンザとみられる感染症の報告が増加しており、同市は週ごとに学級閉鎖等の状況を集計・公表している。11月12日報告分でも小倉北区の西小倉小学校や門司区の萩ケ丘小学校などで学級閉鎖が確認されており、流行は市内の広い地域に及んでいる。閉鎖措置は学校単位・学年単位・学級単位でそれぞれ罹患状況に応じて判断されており、市内の複数区にわたって同時多発的に発生している点が特徴である。\n\n【詳細】\n11月13日の報告によると、若松区のくきのうみ小学校では2年生1クラス26人中6人が罹患し学年閉鎖、小倉北区の貴船小学校では3年生1クラス23人中9人が罹患し学年閉鎖となった。門司区の門司海青小学校では3年3組19人中9人が罹患し学級閉鎖、小倉南区の吉田小学校では2年3組27人中11人、守恒小学校では4年4組31人中6人がそれぞれ罹患し学級閉鎖となっている。中学校でも小倉北区の富野中学校1年3組で罹患者が出て学級閉鎖、八幡西区の折尾愛真高校3年5組でも学級閉鎖が報告された。閉鎖期間はいずれも11月14日を中心に設定されている。\n\n【ポイント・注意点】\n小学校低学年から高校生まで幅広い年齢層で感染が確認されており、1クラスあたり罹患者数が全体の3分の1近くに達するケースもある。市教育委員会や学校現場では手洗い・うがい、咳エチケット、換気の徹底を呼びかけており、保護者には体調不良時の早めの受診と休養を促している。今後も週ごとに閉鎖状況が更新される見込みで、引き続き感染拡大の動向に注意が必要となっている。","2026-11-13","北九州市","https://www.city.kitakyushu.lg.jp/contents/334_00019.html"],["福島3歳児暴行死事件、市確認の傷が児相に未伝達","福島県いわき市で3歳男児が母親の交際相手の暴行により死亡した事件で、市が事前に確認していた男児の顔やまぶたのあざ・傷が児童相談所に報告されていなかったことが判明。行政間の情報共有の不備が浮き彫りになり、県は市や児相の対応を検証する部会の開催を検討している。母親は「息子の不注意」と説明していたとされる。福島県いわき市で3歳の男児が母親の交際相手の暴行を受けて死亡した事件で、市が確認していた男児のけがの情報が児童相談所に伝わっていなかったことが新たに判明した。","\n【概要】\n福島県いわき市で3歳の男児が母親の交際相手の暴行を受けて死亡した事件で、市が確認していた男児のけがの情報が児童相談所に伝わっていなかったことが新たに判明した。\n\n【背景】\nいわき市の会社員の男（41）は11月8日、交際相手の息子である3歳の男児に暴行を加え、胃に穴が開く大けがをさせて死亡させた疑いがもたれている。男は「言うことを聞かなかった」という趣旨の供述をしているという。事件以前から、市や県警、児童相談所がそれぞれ虐待の疑いを把握していたことが分かっている。\n\n【詳細】\n市は10月27日に男児と初めて面会した際に顔の傷を確認し、11月4日の面談でも左目にあざを確認していた。しかし、この4日の面談で確認されたあざについては児童相談所に報告されていなかったことが新たに分かった。県浜児童相談所は11日、市からの報告で顔の傷を把握していたが、一時保護など緊急対応は取らなかったと説明している。その理由について、同相談所は「その傷が今回のような死亡するような暴力に結び付くとは想定できなかった」としている。母親はあざについて「息子の不注意だ」と説明し、市の担当者が注意を促していたという。福島県はこの事件について、市や児童相談所の対応を検証する部会を開く方向で検討しているとされる。関係機関がそれぞれ断片的に情報を把握していながら、それが一つにまとまらなかった結果、重大な結果を防げなかった構図が浮かび上がっている。\n\n【ポイント・注意点】\n本件は暴行事件であり、直接の「事故」ではないが、子どもの身体に生じた傷・あざが行政機関の間で十分に共有されず、重大事態を防げなかった点は、子どもの安全管理体制全体への警鐘となる。保護者や周囲の大人が子どもの体のあざや傷に気づいた場合、関係機関への迅速かつ漏れのない情報共有が、再発防止の鍵となる。家庭内や身近な大人からの暴力により子どもが深刻なけがを負うケースは後を絶たず、地域の見守り体制の強化が改めて求められている。","2026-11-12","福島テレビ（FTV）","https://www.fukushima-tv.co.jp/localnews/2026/11/2026111200000003.html"],["福島県内インフルエンザ急増、前週の1.5倍 42校で学年・学級閉鎖","福島県が11日公表した感染症週報によると、県内のインフルエンザ定点当たり報告数が前週から大幅に増加し、県南やいわき市で高水準となった。保育園や学校など計42校で学年・学級閉鎖が行われ、県は手洗いの徹底など感染拡大防止を呼びかけている。今季は例年より早い時期から流行が確認されており、地域差を踏まえた対策強化が急務となっている。福島県が11月11日に公表した感染症発生動向調査週報（11月2日〜8日）によると、県内48カ所の定点医療機関当たりのインフルエンザ報…","\n【概要】\n福島県が11月11日に公表した感染症発生動向調査週報（11月2日〜8日）によると、県内48カ所の定点医療機関当たりのインフルエンザ報告数が前週から大幅に増加し、保育園や学校など42校で学年閉鎖・学級閉鎖の措置が取られた。\n\n【背景】\n福島県では今シーズン、例年より早い時期からインフルエンザの流行が確認されており、11月に入ってからも報告数の増加傾向が続いている。特にいわき市や県南地域では他地域に比べて感染拡大のペースが速く、子どもを中心とした集団感染が懸念されている。週報は保健所別の定点報告数をまとめたもので、地域ごとの流行状況の違いが明確に示されている。\n\n【詳細】\n報告によれば、福島県が11日に公表した週報では県内48カ所の定点医療機関当たりのインフルエンザ報告数は21．08人で前週（13．77人）より大幅に増えた。保健所別に見ると、県南が35．00人と最も多く、いわき市が32．67人と続いた。これを受けて保育園や学校など42校が学年閉鎖や学級閉鎖になり、県は手洗いの徹底など感染拡大防止を呼びかけている。前週比で報告数がおよそ1.5倍に急増したことから、県内の子どもを中心とした集団生活の場での感染対策強化が急務となっている。特に保健所別の数値の開きが大きく、地域によって流行の深刻度に差がある点が特徴として挙げられている。\n\n【ポイント・注意点】\nいわき市や県南地域など特定地域での報告数の高さが目立っており、地域差を踏まえたきめ細かな対策が求められる。保育園・小中学校では引き続き学年閉鎖・学級閉鎖が相次ぐ可能性があり、保護者は発熱などの症状が見られた場合の早期受診、マスク着用、手洗いの徹底など基本的な感染対策を継続することが重要となる。今後の報告数の推移にも注意が必要である。","2026-11-12","福島民友新聞（Yahoo!ニュース）","https://news.yahoo.co.jp/articles/6c60aa331362f654f608505f1db1713208bd2bad"],["岡山市の小学校2校でインフルエンザ学級閉鎖、新たに2クラス対象","岡山市は12日、市立小学校でインフルエンザとみられる症状を訴える児童が相次いだとして、新たに2クラスの学級閉鎖を決定したと発表した。市内の保育園・幼稚園・小中高校での欠席者数は前年同期を下回るものの、依然として流行が続いており、10日にも高校で学級閉鎖が発表されるなど対応が続いている。岡山市は12日、市内の市立小学校でインフルエンザとみられる症状を訴える児童が増加したとして、1年生のクラスで学級閉鎖の措置を決めたと発表した。","\n【概要】\n岡山市は12日、市内の市立小学校でインフルエンザとみられる症状を訴える児童が増加したとして、1年生のクラスで学級閉鎖の措置を決めたと発表した。他の小学校でも同様の報告があり、複数のクラスが閉鎖対象となっている。\n\n【背景】\n岡山市では秋以降、保育園・幼稚園・小中高校でインフルエンザとみられる症状による欠席が継続して報告されている。10日にも高校でインフルエンザによる学級閉鎖が発表されるなど、学校現場での感染対策が続けられている状況にある。欠席者数の全体的な傾向は前年より少ないものの、個別の学校・学年では罹患が集中するケースがみられる。\n\n【詳細】\n岡山市の発表によると、12日、市立小学校の1年生のクラスで12人がインフルエンザとみられる症状を訴え、そのうち11人が欠席したことを受け、このクラスは13日に学級閉鎖となった。さらに他の市立小学校の1年生のクラスでも22人がインフルエンザの症状を訴え、そのうち6人が欠席したため、このクラスも13日から16日まで学級閉鎖となる。一方で、岡山市の保育園・幼稚園・小中学校・高校では、9月1日から11月12日までに、のべ299人がインフルエンザとみられる症状で欠席し、前年同時期と比べて603人少なくなっているという。市全体の集計と個別クラスの状況には差があり、局所的な流行が繰り返されている様子がうかがえる。\n\n【ポイント・注意点】\n全体の欠席者数は前年より少ないものの、個別の学校・クラス単位では罹患率が高く学級閉鎖に至るケースが続いている。特に低学年のクラスで罹患者数が多い傾向がみられ、保護者には発熱や咳などの症状が出た際の早期の受診・休養が呼びかけられている。市は今後も学校ごとの状況を注視し、必要に応じて追加の閉鎖措置を取る方針とみられる。","2026-11-12","KSB瀬戸内海放送","https://news.yahoo.co.jp/articles/dbd43d38092b3684731562c72bb731d4df1cd938"],["長野・佐久市で車7台絡む事故、3人搬送　意識はあり","11月12日午前、長野県佐久市の交差点付近で車7台が絡む事故が発生し、これまでに3人が病院に搬送された。搬送された3人はいずれも意識があるとみられ、警察が事故の詳しい状況を調べている。多数の車両が関係した事故で、現場では一時交通の混乱が生じた可能性がある。2026年11月12日午前、長野県佐久市の交差点付近で乗用車7台が関係する事故が発生し、3人が病院に搬送された。","\n【概要】\n2026年11月12日午前、長野県佐久市の交差点付近で乗用車7台が関係する事故が発生し、3人が病院に搬送された。搬送された人はいずれも意識があるとされ、警察が事故原因や詳しい状況を調査している。\n\n【背景】\n長野県内では近年、交差点や幹線道路での複数台が絡む自動車事故が相次いで報じられており、通学・送迎時間帯や交通量の多い時間帯の事故リスクが指摘されている。今回の事故も交差点付近という交通が集中しやすい場所で発生した。多重事故は一台の衝突が連鎖的に他の車両を巻き込むことで被害が拡大しやすく、搬送者数が多くなる傾向がある。\n\n【詳細】\nNHKの報道によれば、12日午前、佐久市の交差点付近で車7台がからむ事故があり、これまでに3人が病院に運ばれました。警察によりますと、いずれも意識はあるということで、警察が事故の詳しい状況を調べていますとしている。事故の規模や関係車両の多さから、現場では一時交通が混乱した可能性があり、今後警察による詳細な原因究明が進められる見通しである。報道の時点では搬送者の年齢や事故発生の詳しい経緯は明らかにされていない。\n\n【ポイント・注意点】\n多重事故では搬送者の中に子どもが含まれるケースも少なくなく、通学・送迎時間帯の交差点事故は特に注意が必要とされる。今回の事故で搬送された人の年齢等の詳細は明らかにされていないが、意識があるとの情報から重篤な状態ではないとみられる。保護者や学校関係者は、冬に向けて日照時間が短くなる時期の視界不良や凍結による交通事故リスクの高まりにも注意を払う必要がある。","2026-11-12","NHK","https://news.web.nhk/newsweb/na/nd-20261112de74735"],["コイン電池誤飲、体内で化学やけどの恐れ　専門家が警鐘","子どもによるコイン電池の誤飲事故について、専門家が体内で化学的なやけどを引き起こす危険性を指摘し警鐘を鳴らした。わずかな時間目を離した隙に発生するケースが多く、親の注意だけに頼らない製品設計の観点を含め、企業や家庭での対策強化が議論されている。子どもの誤飲事故に関する特集で、特にコイン電池の誤飲について専門家が警鐘を鳴らしている。飲み込んだコイン電池が体内で化学反応を起こし、重篤なやけどを引き起こす危険性があることが指摘されている。","\n【概要】\n子どもの誤飲事故に関する特集で、特にコイン電池の誤飲について専門家が警鐘を鳴らしている。飲み込んだコイン電池が体内で化学反応を起こし、重篤なやけどを引き起こす危険性があることが指摘されている。\n\n【背景】\n乳幼児は手に触れたものを何でも口に入れる傾向があり、家庭内にある小型の電池やボタン型電池が誤飲事故の原因となるケースが継続的に報告されている。近年はコイン電池を使用する家電製品やおもちゃが増え、誤飲のリスクが高まっているとされる。小型で見た目も特徴的でないため、保護者が気づかないうちに子どもの手の届く場所に置かれてしまうことも少なくない。\n\n【詳細】\n専門家による解説では、特に注意したいのが「コイン電池」の誤飲。飲み込むと「体内化学やけど」を起こす恐れがありますと指摘されている。わずかな目を離した瞬間に誤飲事故が発生することが多く、企業の製品設計や家庭での保管方法の両面からの対策が議論されている。番組では親の注意だけに頼らず、子どもの誤飲リスクを減らすために企業に何ができるのかという視点からも議論が展開された。具体的には電池カバーのねじ止めなど、子どもが容易に開けられない構造にする製品設計の工夫が求められるとされている。\n\n【ポイント・注意点】\nコイン電池は小型で見た目が菓子などに似ていることもあり、乳幼児が誤って口に入れやすい点が指摘されている。誤飲すると短時間で食道や胃の粘膜を傷つける化学反応が進行する恐れがあり、早期の発見と医療機関への受診が極めて重要となる。家庭では電池を使用する製品の電池カバーの固定状況を定期的に確認し、使用済み電池も含めて子どもの手の届かない場所に保管することが推奨される。","2026-11-12","WACOCA（NewsPicks）","https://wacoca.com/2175228"],["札幌市に今季初のインフルエンザ警報、小中学校62クラス学級閉鎖","札幌市で今シーズン初めてインフルエンザ警報が発令された。例年より流行が早く、ここ1か月で感染者数が増え続け、A型患者が多数確認されている。13日には市内小中学校25校・62クラスで学級閉鎖が決まり、江別市や旭川市など道内全域で感染が拡大している状況が報じられた。北海道のニュースにより、札幌市で今シーズン初めてインフルエンザ警報が発令されたことが報じられた。例年より流行の立ち上がりが早く、ここ1か月ほどで感染者数が増え続けており、インフルエンザA型の患者が…","\n【概要】\n北海道のニュースにより、札幌市で今シーズン初めてインフルエンザ警報が発令されたことが報じられた。例年より流行の立ち上がりが早く、ここ1か月ほどで感染者数が増え続けており、インフルエンザA型の患者が多数確認されている。13日には市内の小中学校で合わせて25校、62クラスの学級閉鎖が決まっているとされ、江別市や旭川市など北海道内全域で感染が拡大している。\n\n【背景】\nインフルエンザは例年、気温が下がり空気が乾燥する晩秋から冬にかけて流行が本格化する感染症だが、今季は全国的に流行開始が早まっている地域が目立つ。北海道でも同様の傾向がみられ、学校や保育施設など子どもが集団で生活する場で感染が広がりやすい状況が続いている。警報は都道府県や自治体が一定の基準を超えた患者報告数を基に発令するもので、医療機関や学校、家庭に対して一段と強い注意を促す意味を持つ。\n\n【詳細】\n報道によれば、札幌市内では小中学校あわせて25校、62クラスで13日に学級閉鎖が決定している。これは今シーズン初めての規模であり、市内全域で感染が急速に広がっていることを示している。江別市や旭川市など札幌以外の地域でも感染拡大が確認されており、北海道全体でインフルエンザが流行期に入ったとみられる。流行しているのは主にA型で、発熱などの症状を訴える児童生徒が相次いでいるという。警報の発令は、医療機関への受診が集中する可能性も示唆しており、地域全体での感染対策の強化が求められている。\n\n【ポイント・注意点】\n子どもは免疫力が大人に比べて未発達なため、学校や保育施設など集団生活の場でインフルエンザが急速に広がりやすい。発熱や咳などの症状が出た場合は早めに医療機関を受診し、自宅で安静にすることが重要となる。また、手洗いやうがい、換気、マスクの着用といった基本的な感染対策を家庭でも徹底することが、重症化や流行の拡大を防ぐ上で欠かせない。今後も学級閉鎖が増える可能性があり、保護者は学校からの連絡や自治体の発表に注意を払う必要がある。","2026-11-12","北海道ニュースUHB（Yahoo!ニュース）","https://news.yahoo.co.jp/articles/2e57fa8c2c1b674745b8570b0fcd2d08054ce493"],["秋田県インフルエンザ2週連続注意報超、子ども中心に感染拡大","秋田県で2週連続してインフルエンザの患者数が注意報レベルを超えたことが分かった。患者数は前週の1.1倍に増加し、子ども世代を中心に感染が広がっている状況が報告された。県は手洗いや換気、マスク着用など基本的な感染対策を心がけるよう呼びかけている。全国的にも流行が続いており、秋田県も警戒が必要な状態にある。秋田県内でインフルエンザの感染拡大が続いており、患者数が2週連続で注意報レベルを上回ったことが報じられた。","\n【概要】\n秋田県内でインフルエンザの感染拡大が続いており、患者数が2週連続で注意報レベルを上回ったことが報じられた。県内の患者数は前の週から1.1倍に増加しており、子ども世代を中心に感染が広がっている状況だという。県は手洗いや換気、マスクの着用など基本的な感染対策を続けるよう呼びかけている。\n\n【背景】\nインフルエンザは毎年冬場に流行のピークを迎える感染症で、学校や保育施設など子どもが集団で過ごす場では特に感染が広がりやすい。秋田県では近年、流行の立ち上がりが早まる傾向が指摘されており、今季も例年に比べて早い段階から患者数の増加が続いている。注意報は都道府県が独自に定める基準に基づき発令されるもので、医療機関からの定点報告数が一定の水準を超えた場合に出される。2週連続で基準を超えたことは、流行がすでに定着しつつあることを示している。\n\n【詳細】\n報道によれば、秋田県内の患者数は前週に比べて1.1倍に増加し、2週連続で注意報レベルを超える水準となった。特に子ども世代を中心に感染が広がっていることが特徴で、学校や家庭内での感染拡大が懸念される状況にある。県はこうした状況を受け、こまめな手洗いや部屋の換気、マスクの着用といった基本的な感染対策を改めて県民に呼びかけている。全国的にもインフルエンザの流行が続いており、秋田県も例外ではなく警戒が必要な状態が続いているとみられる。\n\n【ポイント・注意点】\nインフルエンザは子どもにとって重症化のリスクが比較的高い感染症であり、発熱や咳などの症状が見られた場合は早期の受診が望ましい。特に乳幼児や基礎疾患のある子どもは重症化しやすいため、普段以上に体調の変化に注意する必要がある。家庭内でも、手洗いやうがいの徹底、十分な睡眠と栄養摂取、室内の湿度管理などを心がけることが感染予防につながる。学校や保育施設からの健康観察の連絡にも留意し、症状がある場合は無理に登校・登園させないなどの対応が求められる。","2026-11-12","ABS秋田放送（Yahoo!ニュース）","https://news.yahoo.co.jp/articles/c5e460030bddb88112d1ed79947eb782845d8fe1"],["3歳児暴行死、容疑者「言うことを聞かなかった」と供述","福島県いわき市のアパートで3歳男児が暴行を受け死亡した事件で、逮捕された母親の交際相手の男が動機について供述。母親は制止していたとみられるが、男は男児にのみ一方的に暴行し、首をつかんで投げ飛ばすなどして胃に穴があく大けがを負わせ死亡させた。男児は搬送時に意識があったが容体が急変したという。福島県いわき市のアパートで3歳の男児が暴行を受けて死亡した事件で、傷害致死容疑で送検された母親の交際相手の男（41）が、動機について「男児が言うことを聞かないから暴行し…","\n【概要】\n福島県いわき市のアパートで3歳の男児が暴行を受けて死亡した事件で、傷害致死容疑で送検された母親の交際相手の男（41）が、動機について「男児が言うことを聞かないから暴行した」という趣旨の供述をしていることが分かった。\n\n【背景】\n事件当時、アパートには男、男児、母親の3人がいた。捜査関係者によると、男が男児に暴行した際、母親は言葉や体で制止していたとみられている。男は制止する母親には暴力を振るわず、男児にのみ一方的に暴行を加えたという。\n\n【詳細】\n送検容疑は、8日午後4時ごろ、同居するアパート室内で男児の首をつかんで投げ飛ばしたほか、腹を踏みつけるなどして胃に穴が開く大けがを負わせ、死亡させた疑い。男は容疑を認めている。男児は病院に搬送された時点では意識があり、受け答えもできていたが、その後容体が悪化して死亡したことが捜査関係者への取材で判明した。警察は遺体を司法解剖し、詳しい死因を調べている。また、県浜児童相談所は11日、事件前に市からの報告で男児の顔の傷を把握していたものの、一時保護などの緊急対応は取らなかったと明らかにしている。10月27日に市が男児と初めて面会した際に傷を確認したことも報告を受けていたが、母親とのやり取りや子どもの様子から緊急性があるとの判断には至らなかったという。\n\n【ポイント・注意点】\n本件は、子どもへの暴行による重篤な内臓損傷（胃穿孔）が死因につながった深刻な事例である。搬送時に意識があっても、腹部への強い衝撃により内臓が損傷し、その後急変するケースがあることを示しており、腹部への打撲・衝撃を受けた子どもは見た目に軽症でも医療機関での慎重な経過観察が必要となる。また、周囲の大人が暴力を目撃した場合や、子どもに不自然な傷・あざを発見した場合は、ためらわず通報・相談することが命を守る上で重要である。","2026-11-11","福島民友新聞","https://www.minyu-net.com/news/detail/2026111209283057126"],["いわき3歳児死亡、県警・市・児相が事前に虐待疑い把握も防げず","福島県いわき市で3歳男児が暴行を受け死亡した事件で、県警や市、県児童相談所が事前に虐待の疑いを把握していたことが判明。10月27日の面会で顔の傷、11月4日の面談で左目のあざが確認されていたが、重大事態を防げなかった。周辺住民からも泣き声など異変を疑う声が寄せられていたという。福島県いわき市のアパートで男児（3）が母親の交際相手の会社員の男（41）から暴力を受けた後に死亡した事件で、県警や市、県の児童相談所が事前に虐待の疑いを把握していたことが10日に分…","\n【概要】\n福島県いわき市のアパートで男児（3）が母親の交際相手の会社員の男（41）から暴力を受けた後に死亡した事件で、県警や市、県の児童相談所が事前に虐待の疑いを把握していたことが10日に分かった。男児の顔の傷が確認されていたにもかかわらず、事件を防ぐことができなかった。\n\n【背景】\n市は10月27日に男児と初めて面会した際、顔に傷があることを確認した。さらに11月4日の面談でも左目にあざが見られ、母親は「息子の不注意だ」と説明したという。市の担当者はこの際、注意を促していた。複数回にわたり外傷が確認されていたにもかかわらず、緊急性の高い対応にはつながらなかった点が問題視されている。\n\n【詳細】\n逮捕容疑は、8日午後4時ごろ、市内のアパートで同居していた男児の首をつかんで投げ飛ばし、腹部を蹴ったり踏んだりして大けがを負わせたというもの。県警は10日、容疑を傷害致死に切り替えて容疑者を送検した。当初、男児は腸に穴が開く大けがをしたと発表されていたが、その後、実際には胃に穴が開いていたことが判明し、発表内容が訂正された。市は対応を検証する会議体を設置し、再発防止策を検討する方針を明らかにしている。周辺住民からは、アパートの管理会社に対し、以前から「泣き声が部屋の外まで響く」など虐待を疑う声が寄せられていたことも報じられている。\n\n【ポイント・注意点】\n本件では、複数の公的機関がそれぞれ個別に虐待の兆候（顔の傷、あざ）を把握していながら、情報が統合されず、緊急性の判断や保護につながらなかった点が深刻な課題として浮かび上がっている。近隣住民の「異変の声」も活かされなかった。子どもの体に傷やあざが繰り返し見られる場合、その都度の説明を鵜呑みにせず、複数回の確認や関係機関との緊密な連携が不可欠である。地域社会全体で子どもの異変に気づき、ためらわず通報する体制の重要性が改めて示された。","2026-11-11","河北新報（共同通信配信）","https://kahoku.news/articles/JY72JKRIHWKHN.html"],["岐阜市アパート火災、1歳児含む12人搬送","2026年11月11日未明、岐阜市北一色のアパートで火災が発生し、1歳から40代までの男女12人が病院に搬送された。搬送時は全員意識があったとされるが、けがの詳しい程度は分かっていない。アパートには計15人が居住しており、火元の部屋の住人3人は自力避難できたという。2026年11月11日午前1時10分ごろ、岐阜市北一色3丁目のアパートから出火し、鉄骨3階建ての建物1棟が焼けた。","\n【概要】\n2026年11月11日午前1時10分ごろ、岐阜市北一色3丁目のアパートから出火し、鉄骨3階建ての建物1棟が焼けた。住人の1歳から40代までの男女12人が、市内や笠松町内の病院に搬送された。\n\n【背景】\n岐阜中署によると、このアパートには計15人が居住していた。火元の部屋に住む男性を含む3人は、自力で避難して無事だったという。多くの住人が暮らす集合住宅で深夜に火災が発生したことで、建物全体に被害と避難の混乱が及んだとみられる。\n\n【詳細】\n搬送された12人のけがの程度は明らかになっていないが、NHKの報道では搬送時に全員の意識があったことが確認されている。岐阜中署が出火原因について調べを進めている。乳幼児を含む多人数が同時に搬送される事態となり、夜間の火災発生時における避難の困難さが改めて浮き彫りとなった。火元の部屋の住人3人は自力避難できた一方、他の部屋の住人を含む12人が搬送されたことから、建物内での煙の広がりや避難経路の状況が被害の広がりに影響した可能性がある。\n\n【ポイント・注意点】\n夜間の集合住宅火災では、就寝中の発見の遅れや煙の充満により避難が難しくなるケースが多い。特に乳幼児や小さな子どもは自力での避難が困難なため、各家庭での火災報知器の設置・点検、避難経路の確認、就寝前の火気の取り扱い確認などが重要となる。また、集合住宅では一つの出火が多数の世帯に影響を及ぼす可能性があるため、日頃から防火意識を高めておくことが、子どもを含む家族の安全確保につながる。今回のように乳幼児を含む住人が搬送される事例は、改めて家庭内の防火対策の重要性を示している。","2026-11-11","中日新聞","https://www.chunichi.co.jp/article/1337649"],["NHK、岐阜市アパート火災で1歳児含む12人搬送と報道","岐阜市北一色のアパートで11日未明に発生した火災で、1歳から40代までの12人が病院に搬送されたとNHKが報じた。けがの詳しい程度は不明だが、搬送時には全員に意識があったという。同日には東京都青梅市の圏央道でも車5台が絡む玉突き事故が発生し、1人が意識不明の重体となった。NHKは2026年11月11日、岐阜市にあるアパートで火事があり、このアパートに住む1歳から40代の12人が病院に搬送されたと報じた。","\n【概要】\nNHKは2026年11月11日、岐阜市にあるアパートで火事があり、このアパートに住む1歳から40代の12人が病院に搬送されたと報じた。\n\n【背景】\n火災は11日未明に発生し、警察によると、けがの詳しい程度はわかっていないものの、搬送時には全員に意識があったとされている。乳幼児を含む世帯全体が被害に遭う事態となった。深夜の時間帯での出火であったことから、住人は就寝中に被害に遭った可能性が考えられる。\n\n【詳細】\n同日には、東京都青梅市の圏央道でもトラックなど5台が関係する玉突き事故が発生し、1人が意識不明の重体となるなど、各地で事故・火災のニュースが相次いだ。岐阜市の火災では、1歳の乳児を含む複数世代が同時に被害を受けており、夜間の集合住宅火災における避難の難しさが改めて浮き彫りになった。搬送された12人の詳しいけがの程度や、火災の出火原因については引き続き警察が調べを進めている状況である。\n\n【ポイント・注意点】\n乳幼児がいる家庭では、就寝中の火災発生時に自力避難が困難であることを踏まえ、住宅用火災警報器の設置・定期点検、避難はしごや避難経路の確認、集合住宅であれば隣接世帯との連携や避難訓練への参加などが推奨される。特に冬季は暖房器具の使用が増え、電気配線や暖房器具からの出火リスクも高まる時期であるため、各家庭でストーブやヒーターの周囲の可燃物の整理、就寝前の電源確認などを徹底することが、子どもを含む家族の命を守る上で重要である。","2026-11-11","NHK NEWS WEB","https://news.web.nhk/newsweb/na/nd-20261111de73892"],["感染性胃腸炎、東京都が注意喚起　保育所など集団感染13件に","東京都は2026年11月6日、ノロウイルスなど感染性胃腸炎の流行シーズンを前に注意喚起を発表。全国的には島根、群馬、大分、石川、宮崎など一部地域で患者報告数が高い水準にあり、冬季に向けた予防徹底が呼びかけられている。都内では11月1日までに保育所12件、小学校1件の計13件の集団感染が報告された。教育情報メディア「リセマム」は2026年11月10日、東京都が同年11月6日に発表した感染性胃腸炎に関する注意喚起について報じた。","\n【概要】\n教育情報メディア「リセマム」は2026年11月10日、東京都が同年11月6日に発表した感染性胃腸炎に関する注意喚起について報じた。冬季に集団感染が多発するノロウイルスなどについて、例年これからの季節に増える傾向があるとして、予防の徹底を呼びかけている。\n\n【背景】\n感染性胃腸炎の警報レベルの開始基準値は定点あたり20人で、警報レベル開始基準値を超えた保健所の管内人口の合計が都の人口全体の30％を超えた場合に、広域的な流行発生・継続として警報が発出される仕組みとなっている。この基準に基づき、都は定期的に流行状況を監視し発表している。\n\n【詳細】\n全国的な感染状況を見ると、第44週の全国平均は定点あたり3.25人で、いずれの都道府県も警報レベルには達していない。ただし、地域差があり、島根県6.09人、群馬県5.92人、大分県5.69人、石川県5.61人、宮崎県5.14人などが高い状況にあると報じられている。ノロウイルスをはじめとする感染性胃腸炎は特に冬に増加し、主な症状は吐き気、嘔吐、腹痛、下痢、発熱で、多くは1～2日で改善する一方、乳幼児では脱水に注意が必要とされる。保育所など集団で過ごす場では感染が広がりやすく、東京都内ではすでに11月1日までに13件の集団感染事例（保育所12件、小学校1件）が報告されている。\n\n【ポイント・注意点】\nノロウイルスは感染力が非常に強く、嘔吐物やおむつの処理を介した二次感染、食品を介した感染などさまざまな経路で広がる。家庭では、トイレやドアノブなどの消毒、調理前後の手洗いの徹底、嘔吐物処理時の使い捨て手袋・マスクの着用、塩素系消毒剤の使用などが基本的な予防策となる。保育施設や学校など集団生活の場では、症状のある子どもの早期の受診・登園自粛判断も重要である。今後気温の低下に伴い流行の本格化が予想されるため、保護者や保育関係者は改めて手洗い・消毒などの基本対策を見直すことが求められる。","2026-11-10","リセマム（resemom）","https://resemom.jp/article/2026/11/10/88253.html"],["福山市、11月の小児感染症情報を発表　ノロウイルス対策を呼びかけ","福山市医師会は2026年11月9日、小児科領域の感染症流行状況を発表。インフルエンザや急性呼吸器感染症は減少傾向だが、感染性胃腸炎・RSウイルスなどは横ばいで、今後のノロウイルス流行に備えた対策を呼びかけている。水痘や手足口病なども少数ながら継続して報告されている。福山市医師会は2026年11月9日発行の「いきいき子育て支援情報」11月号で、市内の小児の間で流行している感染症について報告した。","\n【概要】\n福山市医師会は2026年11月9日発行の「いきいき子育て支援情報」11月号で、市内の小児の間で流行している感染症について報告した。インフルエンザや急性呼吸器感染症、マイコプラズマ肺炎は減少傾向にある一方、感染性胃腸炎やRSウイルス感染症などは横ばいで推移している。\n\n【背景】\n情報では、感染頻度の高い疾患順に、急性呼吸器感染症（減少傾向）、インフルエンザ（減少傾向）、感染性胃腸炎（横ばい）、RSウイルス感染症（横ばい）、A群溶血性レンサ球菌咽頭炎（横ばい）、突発性発しん（横ばい）、マイコプラズマ肺炎（減少傾向）が報告されている。流行性角結膜炎、水痘、新型コロナウイルス、手足口病、伝染性紅斑、ヘルパンギーナなども少数ながら報告が続いている。\n\n【詳細】\n同情報では、冬に向けて増加するノロウイルスについて特集し、事前の対策を呼びかけている。ノロウイルスによる感染性胃腸炎や食中毒は一年を通じて見られるが、特に冬に増加する傾向があり、主な症状は吐き気、嘔吐、腹痛、下痢、発熱である。多くは1～2日で回復するとされるが、乳幼児については脱水に注意が必要と強調されている。このほか、マイコプラズマ感染症や、ADHDの薬物療法に関する情報も掲載されている。複数の感染症が同時期に報告されている状況を踏まえ、保護者には引き続き最新の流行情報の確認が呼びかけられている。\n\n【ポイント・注意点】\n小児の感染症は季節や地域によって流行状況が変動するため、保護者は最新の流行情報をこまめに確認し、手洗い・うがいなど基本的な予防策を継続することが重要である。特にノロウイルスは感染力が強く、保育施設や家庭内での二次感染を防ぐため、嘔吐物処理時の適切な消毒や手袋・マスクの着用が推奨される。乳幼児は脱水症状が急速に進行することがあるため、嘔吐・下痢が続く場合は水分補給の状況をこまめに確認し、ぐったりする、尿量が減るなどの症状が見られたら速やかに医療機関を受診することが望ましい。","2026-11-09","福山市医師会","https://www.fmed.jp/cnt/news/archives/2026/11/20261109.html"],["インフルエンザ第44週、重症化しやすい0〜9歳の入院報告が突出","国立健康危機管理研究機構の感染症週報によると、インフルエンザ入院サーベイランスで1〜9歳の報告数が全年齢層の中で突出して多いことが分かった。子どもの重症化事例も確認されており、医療機関は小児の感染動向に注意を払っている。主流の型がH3N2からH1N1pdm09へ交代した影響とみられている。国立健康危機管理研究機構（JIHS）が公表した感染症週報によると、基幹定点からのインフルエンザ入院サーベイランスにおいて、1〜9歳の年齢層の入院報告数が他の年齢層に比べ…","\n【概要】\n国立健康危機管理研究機構（JIHS）が公表した感染症週報によると、基幹定点からのインフルエンザ入院サーベイランスにおいて、1〜9歳の年齢層の入院報告数が他の年齢層に比べて突出して多いことが明らかになった。子どもの感染・重症化動向への注意が呼びかけられている。\n\n【背景】\n今シーズンのインフルエンザは例年より早期に流行入りし、高い水準での推移が続いている。専門家の分析では、主流の型の交代や重症化しやすい年齢層の変化なども指摘されており、小児科・小児病棟を持つ医療機関では体制の見直しが求められている。流行の中心となるウイルスの型が変わることで、重症化しやすい年齢層にも変化が生じることが知られている。\n\n【詳細】\nJIHSの週報によると、基幹定点からのインフルエンザ入院サーベイランスにおける報告数は352例と前週と比較して減少した。都道府県別では45都道府県から報告があり、年齢群別では0歳（16例）、1〜9歳（163例）など、1〜9歳の報告数が全体の中で大きな割合を占めていることが示されている。感染管理の専門家による分析でも、主流の型がH3N2からH1N1pdm09に交代し、重症化しやすい年齢層にも変化が見えていていると指摘されており、10歳未満の割合が増えているという今シーズンの傾向を踏まえて、体制を見直す価値があるとの見解も示されている。全体の報告数は減少傾向にあるものの、年齢層別の偏りが続いている点が注視されている。\n\n【ポイント・注意点】\n乳幼児から学童期の子どもで入院を要する重症例が目立っており、保護者は高熱や呼吸苦、ぐったりするなどの症状が見られた場合、速やかな受診が重要となる。医療機関側も小児科・小児病棟の体制を見直す動きがあり、今後の流行状況によってはさらなる対応強化が求められる可能性がある。","2026-11-09","国立健康危機管理研究機構（JIHS）感染症週報","https://id-info.jihs.go.jp/surveillance/idwr/idwr/2026/idwr2026-10.pdf"],["厚労省、インフルエンザ定点報告10.26で横ばい　患者数は約1か月高止まり","厚生労働省は6日、第44週（10月26日〜11月1日）のインフルエンザ発生状況を公表した。全国の定点当たり報告数は10.26人で、前週からほぼ横ばいの状態が約1か月続いている。各自治体は注意報を発令するなど対策を呼びかけ、全国2,400以上の施設で学級閉鎖等の対応が取られている。厚生労働省は11月6日、2026年第44週（10月26日〜11月1日）のインフルエンザ発生状況を公表した。","\n【概要】\n厚生労働省は11月6日、2026年第44週（10月26日〜11月1日）のインフルエンザ発生状況を公表した。全国の定点当たり報告数は10.26人となり、前週からほぼ横ばいの状態が約1か月にわたって続いている。\n\n【背景】\n今シーズンのインフルエンザは例年より早い時期から流行が始まり、9月以降高い水準での推移が続いている。8月の発表開始以降、全国の定点当たり報告数は増減を繰り返しながらも、注意報レベルとされる10人前後で高止まりの状態が継続している。\n\n【詳細】\nNHKの報道によると、今月1日までの1週間に全国から報告されたインフルエンザの患者数は1医療機関あたり10.26人でした。患者数はおよそ1か月前からほぼ横ばいの状態が続いていて、各自治体は注意報を出すなどして対策を呼びかけている。また別の報道では、11月6日(金)、厚生労働省は2026年10月26日〜11月1日のインフルエンザ発生状況を発表しました。今季初の前年割れとなったものの患者数は前週比で増加し、全国2,400以上の施設で学級閉鎖等の対応がとられていますとしている。地域別では愛媛27.89、北海道21.90など地域差もみられます。各地域の数値は全国平均を大きく上回るところもあり、地域ごとの対策状況にばらつきがあることがうかがえる。\n\n【ポイント・注意点】\n全国的には前年をやや下回るペースながら、地域によっては大きなばらつきがあり、北海道や東北、四国の一部では突出して高い報告数となっている。学校・保育施設での学級閉鎖等の対応は2,400以上の施設に及んでおり、子どもを中心とした集団感染対策が引き続き重要となる。厚労省は手洗い・うがい・マスク着用・換気といった基本的な感染対策の徹底を改めて呼びかけている。","2026-11-06","NHK","https://news.web.nhk/newsweb/na/nd-20261106de71556"],["インフルエンザ定点報告、今季初めて前年同期を下回るも高水準続く","厚労省発表の第44週インフルエンザ発生状況で、報告数が今季初めて前年同期を下回った一方、依然として全国で高水準が続いていることが分かった。全国2,400以上の施設で学級閉鎖等の対応が取られており、前週比では約2,700人増加している。昨シーズンより1か月以上早く流行入りした経緯がある。ウェザーニュースの報道によると、厚生労働省が11月6日に公表した第44週（10月26日〜11月1日）のインフルエンザ発生状況で、報告数が今シーズン初めて前年同期を下回った。","\n【概要】\nウェザーニュースの報道によると、厚生労働省が11月6日に公表した第44週（10月26日〜11月1日）のインフルエンザ発生状況で、報告数が今シーズン初めて前年同期を下回った。一方で前週比では増加しており、依然として高水準が続いている。\n\n【背景】\n今シーズンのインフルエンザは昨シーズンよりも早期に流行入りし、9月以降高い報告数での推移が続いてきた。8月の発表開始以降、一貫して前年を上回る水準が続いていたが、今回初めて前年割れとなった。長期間にわたり高水準の流行が継続してきたことから、今回の前年割れが流行の収束を意味するのか、一時的な変動なのかが注目される。\n\n【詳細】\n報道によれば、11月6日(金)、厚生労働省は2026年10月26日〜11月1日のインフルエンザ発生状況を発表しました。今季初の前年割れとなったものの患者数は前週比で増加し、全国2,400以上の施設で学級閉鎖等の対応がとられています。具体的にはこの1週間における定点医療機関からの報告数は38,205人で、定点当たりの報告数は10.26でしたという。また今シーズンは、昨シーズンよりも1か月以上早く流行入りし、高い水準が続いています。第44週の報告数は38,205人で、前年同期（57,424人）を今季初めて下回ったものの、前週比では約2,700人増加していますとしている。\n\n【ポイント・注意点】\n前年割れとはいえ絶対数としては依然として高水準であり、学級閉鎖等の対応が取られている施設数の多さからも、子どもを中心とした集団感染対策の重要性は変わらない。保護者や学校関係者には、引き続き手洗い・うがい・マスク着用などの基本対策の徹底と、発熱時の早期受診が呼びかけられている。","2026-11-06","ウェザーニュース","https://weathernews.jp/news/202611/060241/"],["乳幼児の誤飲事故、何でも口に入れる時期の注意点をクリニックが解説","ひまわりキッズクリニックが乳幼児の誤飲事故について解説。開院から10か月の間にシールやビー玉を飲み込んだ子どもが受診したとし、身の回りの物を口に入れる乳幼児期特有のリスクについて注意を呼びかけている。家庭内の環境整備と、誤飲時の落ち着いた対応の重要性が強調されている。ひまわりキッズクリニックは2026年10月30日、乳幼児期に多い誤飲事故について解説する記事を公開した。","\n【概要】\nひまわりキッズクリニックは2026年10月30日、乳幼児期に多い誤飲事故について解説する記事を公開した。乳幼児は身の回りの物を口に入れて確かめる時期があり、思わぬ誤飲・誤嚥事故につながることがあると説明している。\n\n【背景】\n乳幼児が手に取った物を口に入れる行動は発達過程で自然に見られるものだが、同時に誤飲・誤嚥事故のリスクを高める要因でもある。同クリニックでは、開院から10か月の間に、シールを飲み込んでしまった子どもや、ビー玉を飲み込んでしまった子どもが実際に受診したことが紹介されている。こうした行動は乳幼児の発達段階において珍しいものではなく、どの家庭でも起こりうるリスクとして位置づけられている。\n\n【詳細】\n記事によれば、紹介された事例では幸い大きな問題には至らなかったものの、保護者にとっては大変心配な出来事だったとされている。乳幼児期はシールやビー玉のような小さな物だけでなく、ボタン電池や磁石、医薬品、洗剤など、家庭内のさまざまな物が誤飲の対象となりうる。家庭内で乳幼児の手が届く範囲に小さな物や危険な物を置かないようにすることが、事故予防の基本とされている。記事では、日常生活の中で子どもの目線や手の届く範囲を意識した環境整備を行うことの重要性が繰り返し説明されている。\n\n【ポイント・注意点】\n誤飲事故は家庭内で起こりやすく、特にボタン電池や磁石などは食道や胃の中に留まることで重症化するリスクが高いとされる。保護者は、子どもの手の届く場所に小さな部品や電池、薬、洗剤などを放置しないよう注意するとともに、万一誤飲が疑われる場合には、慌てず状況を確認し、必要に応じて医療機関や中毒110番などに相談することが推奨される。特に乳児期後半から1歳半ごろにかけては誤飲事故が多く発生する時期とされており、保護者はこの時期特有のリスクを認識し、日常的な室内環境の点検を行うことが重要である。","2026-10-30","ひまわりキッズクリニック","https://www.himawarikids.com/blog/%E4%B9%B3%E5%B9%BC%E5%85%90%E3%81%AF%E4%BD%95%E3%81%A7%E3%82%82%E5%8F%A3%E3%81%AB%E5%85%A5%E3%82%8C%E3%81%A6%E3%81%97%E3%81%BE%E3%81%84%E3%81%BE%E3%81%99%EF%BC%81%E3%80%80-%E3%80%9C%E8%AA%A4%E9%A3%B2/"],["インフルエンザ定点9.49人、地域差浮き彫りに　第43週発表","厚生労働省が10月30日に公表した第43週のインフルエンザ発生状況で、全国の定点当たり報告数が9.49人となり前週から増加した。都道府県ごとに増減の傾向が分かれており、地域差が大きいことが浮き彫りになった。厚労省は手洗い・うがい・マスク着用・換気などの基本対策を改めて呼びかけている。厚生労働省は10月30日、2026年第43週（10月19日〜25日）のインフルエンザ発生状況を公表した。","\n【概要】\n厚生労働省は10月30日、2026年第43週（10月19日〜25日）のインフルエンザ発生状況を公表した。全国の定点当たり報告数は9.49人となり、前週の9.08人から増加した一方、都道府県ごとの動きには差がみられた。\n\n【背景】\n今シーズンのインフルエンザは例年より早期に流行入りしており、9月から10月にかけて増減を繰り返しながら高水準で推移してきた。全国一律の傾向ではなく地域差が大きいことが、これまでの発表でも繰り返し指摘されている。週ごとの数値の上下は、特定地域での局所的な流行拡大や収束の影響を強く受けていると考えられる。\n\n【詳細】\n報道によると、厚生労働省が10月30日に公表したインフルエンザの発生状況では、10月19〜25日の全国の定点当たり報告数は9.49人だった。前週の9.08人から増えたが、都道府県ごとの動きは分かれているという。週ごとの推移としては2026年第39〜43週は順に7.17、11.35、12.81、9.08、9.49人と増減を繰り返している。厚労省は対策としてインフルエンザを含む急性呼吸器感染症の対策として、手洗い、うがい、マスクの着用、換気などを挙げているとしている。数週にわたる増減の波が続いていることから、流行の完全な収束にはまだ時間を要するとみられる。\n\n【ポイント・注意点】\n週ごとの報告数が増減を繰り返しながらも高水準で推移していることから、流行の収束にはまだ時間がかかる可能性がある。地域差が大きいため、居住地域の流行状況に応じた対策の強化が求められる。特に子どもが集団生活を送る保育園・学校では、地域の流行状況を踏まえた感染対策の継続が重要となる。","2026-10-30","共同通信PRワイヤー（汐塾）","https://kyodonewsprwire.jp/corp/shioj/11633/"],["入浴剤でやけど事故、無水硫酸マグネシウム成分に注意喚起","日本中毒情報センターは、無水硫酸マグネシウムを主成分とする入浴剤により子どもがやけどをする事故が発生したとして緊急の注意喚起を行った。家庭での誤使用や取り扱いに関するリスクが指摘されている。同センターは乗物酔い防止薬の誤飲やきのこによる食中毒など季節性の注意喚起も継続的に行っている。公益財団法人日本中毒情報センターは10月29日、無水硫酸マグネシウムを主成分とする入浴剤の使用により子どもがやけどを負う事故が発生したとして、緊急の注意喚起情報を公開した。","\n【概要】\n公益財団法人日本中毒情報センターは10月29日、無水硫酸マグネシウムを主成分とする入浴剤の使用により子どもがやけどを負う事故が発生したとして、緊急の注意喚起情報を公開した。家庭内で広く使われる入浴剤による健康被害として注意が呼びかけられている。\n\n【背景】\n同センターは家庭内の誤飲・誤食などの身近な事故について日常的に情報収集・発信を行っており、子どもの誤飲・誤用に関する注意喚起を継続的に実施している。近年は乗物酔い防止薬の誤飲やきのこによる食中毒など、季節や製品特性に応じた注意喚起情報が相次いで発表されている。入浴剤は家庭で日常的に使われる製品であるだけに、今回の事故は多くの家庭にとって身近なリスクとして受け止められている。\n\n【詳細】\nセンターの発表によると、無水硫酸マグネシウムを主成分とする入浴剤により子どもがやけどをする事故が発生しましたとされており、緊急の注意喚起として公開されている。同センターのサイトでは、他にも小学生の乗物酔い防止薬の誤飲に注意しましょうといった呼びかけや、帰省先での子どもの誤飲事故に注意しましょうといった季節性の注意喚起も掲載されており、家庭内の化学物質や日用品による子どもの事故リスクについて継続的な情報発信が行われている。これらの情報発信は、家庭内にある身近な製品であっても使用方法を誤ると重大な事故につながりうることを示している。\n\n【ポイント・注意点】\n入浴剤に含まれる成分によっては、肌に直接触れることで化学的なやけどを引き起こす可能性があり、特に皮膚の薄い乳幼児では重症化のリスクが高まる。使用上の注意事項を十分に確認し、規定量を超えた使用や長時間の接触を避けることが重要となる。異常を感じた場合は使用を中止し、速やかに医療機関を受診するとともに、必要に応じて中毒情報センターなど専門機関に相談することが推奨される。","2026-10-29","日本中毒情報センター","https://www.j-poison-ic.jp/"]],"dev":[["日本初、未就学児・小学生の「騒音下での聞き取り能力」の発達標準値を確立","同志社大学と北陸先端科学技術大学院大学の研究チームが、年長児から小学6年生714名を対象に大規模調査を実施し、騒がしい環境で音声を聞き分ける「選択的聴取能力」の発達標準値を日本語環境で初めて確立した。2つの課題を15分程度で実施でき、聴き取りに困難を抱える子どもを客観的に把握する指標として、教育・保育現場での活用が期待される成果である。■概要同志社大学赤ちゃん学研究センターおよび研究開発推進機構の加藤正晴氏（特定任用研究員・准教授、当時）と、北陸先端科学…","\n■概要\n同志社大学赤ちゃん学研究センターおよび研究開発推進機構の加藤正晴氏（特定任用研究員・准教授、当時）と、北陸先端科学技術大学院大学人間情報学研究領域の木谷俊介氏（特任准教授）の研究チームが、日本の年長児（5歳児）から小学6年生までを対象とした大規模横断研究を実施し、騒がしい環境で聞きたい音声を聞き分ける「選択的聴取能力」の発達的標準値を日本語環境として初めて確立した。\n\n■背景\n日常生活や教育・保育の現場では、周囲の雑音や他者の話し声がある中で、特定の音声に注意を向けて聞き取る「選択的聴取能力」が求められる場面が多い。この能力がどのように発達していくのかを示す標準的な指標がこれまで日本語環境では整備されておらず、聴き取りに困難を抱える子どもを客観的に把握する基準が不足していた。教育・保育の現場からも、こうした発達の目安となる指標の整備を求める声があったとみられる。\n\n■詳細\n研究チームは、国内の認定こども園・幼稚園・保育所・小学校に在籍する年長児から小学6年生までの714名を対象にデータを収集し、分析を行った。調査では2つの課題が用いられ、これらを合わせて15分程度で実施できる構成となっている。この調査により、日本語環境における選択的聴取能力の発達的標準値が、日本で初めて確立された。\n\n本研究の成果は「日本における未就学児・児童の選択的聴取の発達と標準化」という論文タイトルで、日本音響学会誌82巻7号（2026年7月1日刊行）に掲載された。研究は日本学術振興会・科学研究費助成事業（課題番号23K20763）の助成を受けて実施された。\n\n■ポイント・注意点\n今回確立された発達標準値は、短時間で実施可能な2つの課題によって測定できる点が特徴であり、教育・保育の現場で活用しやすい設計となっている。この標準値を基準として用いることで、騒がしい環境での聴き取りに困難を抱える子どもを早期に特定できる可能性があり、教育・保育現場における支援の手がかりとして活用が期待される。日本語環境に特化した標準値が整備されたことは、今後の子どもの聴覚発達支援や関連研究の基盤となる成果といえる。今後は、この標準値を活用した現場での実践的な支援方法の確立や、より幅広い年齢層を対象とした追加調査の実施も期待されるところである。","2026-11-13","同志社大学・北陸先端科学技術大学院大学（@Press）","https://home.kingsoft.jp/news/pr/atpress/610531.html"],["OpenAIが子ども向けAI安全研究に2億円超を拠出","OpenAIが子どものAI利用に関する安全性研究のため200万ドルを拠出すると発表。「子どもの権利とAI時代の保護のための連合」の研究ネットワークを支援し、年齢に応じたAI設計の原則づくりを目指す動きが報じられた。専門家からは研究に必要な規模として資金額が控えめだとの指摘も出ている。2026年11月12日、OpenAIが子どものAI安全に関する世界的な研究ネットワークに200万ドルを拠出すると発表したことが報じられた。","\n【概要】\n2026年11月12日、OpenAIが子どものAI安全に関する世界的な研究ネットワークに200万ドルを拠出すると発表したことが報じられた。年齢に適したAI設計のための憲章に署名し、リスクと便益の両方を測定する研究プログラムを支援する内容である。\n\n【背景】\nAI技術の急速な普及に伴い、子どもの発達や精神的健康への影響を懸念する声が世界的に高まっている。欧州連合のEU Kids Actなど、子どものデジタル環境を規制する政策論議が進む中、民間企業による自主的な資金拠出が注目されている。こうした流れの中で、AI企業が自ら安全研究に資金を投じる動きは、規制当局との関係構築の観点からも注目されている。\n\n【詳細】\n報道によれば、OpenAIは「子どものAIへの影響を研究するための憲章に署名し、世界的な研究ネットワークに資金を提供した」としている。この取り組みでは「OpenAIが子どものAI安全に200万ドルを投じ、この研究結果がEU Kids Actや子どもとAIの関わり方に影響を与える可能性がある」と伝えられている。具体的には「年齢に適したAIの共通原則を定める憲章と、若年利用者へのリスクと便益の両方を測定するための研究プログラムが設けられた」という。この資金は「AI時代における子どもの権利と保護のための連合」のもとにある科学研究ネットワークを支援するものである。この連合は、複数の研究機関や専門家が参加する枠組みとされ、今後の研究成果が政策論議にも反映されることが見込まれている。\n\n【ポイント・注意点】\n一方で、専門家からは資金規模への懸念も示されている。「発達、精神的健康、安全への長期的影響を測定するには縦断的研究と多様な集団が必要であり、200万ドルは世界的な研究ネットワークとしては歓迎すべきだが控えめな額だ」との指摘がある。比較として「米国立衛生研究所（NIH）は子どもの発達研究に毎年数十億ドルを拠出している」ことも挙げられており、研究の独立性と規制への反映が今後の課題とされている。保護者としては、AIサービスの年齢設定や利用時間の管理など、既存の対策を継続しつつ、今後公表される研究成果に注目する価値があるだろう。","2026-11-12","Inside AI","https://insideai.news/news/ai-policy-and-regulation/openai-childrens-ai-safety/15056"],["Tony Charman教授、子どもの精神保健研究で実践賞を受賞","キングス・カレッジ・ロンドンのTony Charman名誉教授が、研究の臨床実践への応用に貢献したとしてACAMH（子どもと青年の精神保健協会）の2026年度翻訳研究実践賞を受賞した。長年の自閉症研究と、その成果を現場に橋渡しする社会実装への取り組みが高く評価された。2026年11月12日、キングス・カレッジ・ロンドンは、同校のTony Charman名誉教授（臨床児童心理学）が、子どもと青年の精神保健協会（ACAMH）から「Eric Taylor 翻訳…","\n【概要】\n2026年11月12日、キングス・カレッジ・ロンドンは、同校のTony Charman名誉教授（臨床児童心理学）が、子どもと青年の精神保健協会（ACAMH）から「Eric Taylor 翻訳研究実践賞」を受賞したと発表した。受賞は11月5日のACAMHアワードで決定した。\n\n【背景】\n子どもの発達障害や精神保健に関する研究は、学術的な知見にとどまらず、実際の臨床現場でどう活用されるかが重要な課題とされている。ACAMHは研究成果を臨床実践に橋渡しした功績のある研究者を毎年表彰しており、今回の受賞者は長年自閉症研究に携わってきた人物である。学術的な知見が現場で実際に活用されるまでには時間や橋渡しの工夫が必要であり、こうした功績を可視化する賞の存在は分野全体にとっても意義がある。\n\n【詳細】\nTony Charman教授は、研究を臨床実践に応用した功績が認められ、子どもと青年の精神保健協会（ACAMH）からEric Taylor「翻訳研究実践」賞を受賞した。キングス・カレッジ・ロンドンの臨床児童心理学名誉教授であるCharman氏は、11月5日に開催された2026年ACAMHアワードで受賞者に選ばれた。Charman氏は長年、自閉症の早期発見や介入に関する研究を進めてきた人物として知られており、今回の受賞はその研究成果が実際の臨床現場における子どもの支援にどう生かされてきたかが評価されたものである。学術研究の成果を一方的に発信するだけでなく、現場の支援者や家族が実際に活用できる形へと橋渡しする役割を長年担ってきたことが、今回の受賞理由の核にあるとみられる。\n\n【ポイント・注意点】\n学術研究と臨床現場の橋渡しは、発達障害のある子どもやその家族への支援の質を左右する重要な要素である。研究成果がエビデンスに基づく介入プログラムやスクリーニングツールとして実装されることで、早期発見・早期支援につながる可能性が高まる。今後も研究と実践の往還を重視した取り組みが、子どもの発達支援分野全体に広がっていくことが期待される。こうした賞の存在自体が、研究者に対して社会実装への意識を高めるインセンティブとなり、同分野の若手研究者の育成にも波及効果をもたらす可能性がある。","2026-11-12","King's College London","https://www.kcl.ac.uk/news/professor-tony-charman-receives-acamh-translational-research-into-practice-award"],["妊娠中のコロナワクチン、児の神経発達に影響せず　米デューク大の前向き研究","米デューク大学の研究チームが、妊娠中の新型コロナワクチン接種と子宮内曝露した児の神経発達との関連を前向きコホート研究で検討。生後18〜30カ月時点の発達評価で、非曝露群と曝露群の間に差は認められなかった。評価には標準化ツールASQ-3が用いられ、安全性情報を補強する結果となった。■概要妊娠中の新型コロナウイルス（SARS-CoV-2）mRNAワクチン接種と、子宮内で曝露した児の長期的な神経発達との関連を検討した前向きコホート研究の結果が報告された。","\n■概要\n妊娠中の新型コロナウイルス（SARS-CoV-2）mRNAワクチン接種と、子宮内で曝露した児の長期的な神経発達との関連を検討した前向きコホート研究の結果が報告された。米デューク大学のBrenna L. Hughes氏らの研究チームによるもので、JAMA Pediatrics（2026年11月2日オンライン版）に掲載された。\n\n■背景\n新型コロナワクチンについては、妊娠中に接種した場合の短期的な安全性はこれまでの研究で示されてきた。しかし、母親が妊娠中にワクチンを接種した場合、子宮内で曝露した児のその後の長期的な神経発達にどのような影響があるのかについては、十分なエビデンスが得られていなかった。こうした背景から、より長期の追跡調査によるデータの蓄積が求められていた。妊婦や医療従事者にとって、接種の是非を判断する材料として長期的な安全性データの重要性は高いとされてきた。\n\n■詳細\n研究チームは、生後18〜30カ月の児を対象に、母親の妊娠中または妊娠直前の新型コロナワクチン接種と児の神経発達との関連を検討した。評価には、乳幼児の発達状況を保護者の回答によって把握する標準化ツールである「年齢・発達段階質問票第3版（ASQ-3）」が用いられた。\n\n解析の結果、母親が妊娠中にワクチン接種をしていない非曝露群と、接種していた曝露群との間で、ASQ-3の合計スコアは同等であった。すなわち、子宮内でワクチンに曝露したかどうかによって、児の神経発達に差は認められなかったことが示された。この結果は、妊娠中のワクチン接種が子どもの発達に悪影響を及ぼすという懸念に対して、一定の安心材料を提供するものといえる。\n\n■ポイント・注意点\n本研究は、妊娠中の新型コロナワクチン接種についてこれまで課題とされてきた「児の長期的な神経発達への影響」という点に関して、前向きコホート研究という手法を用いて検討した点に意義がある。生後18〜30カ月という時点での評価において、ワクチン曝露の有無による神経発達スコアの差が見られなかったという結果は、妊娠中のワクチン接種に関する安全性情報を補強するものといえる。妊婦や医療従事者が接種の判断を行う際の参考情報として、今後も長期的なデータの蓄積が重要になると考えられる。","2026-11-11","Medical Tribune","https://www.medical-tribune.co.jp/news/articles/?blogid=7&entryid=621198"],["ユネスコ、2026年版「乳幼児期ケア・教育グローバル報告書」を発表へ","ユネスコは2026年11月20日の世界子どもの日に「2026年版乳幼児期ケア・教育グローバル報告書」を発表する予定。資金格差や不平等が8歳未満児の教育機会を奪っている現状を示す最新データが公開される見通し。2030年までの国際目標達成に向けた重要な局面での発表となる。国連教育科学文化機関（ユネスコ）は、2026年11月20日の「世界子どもの日」に合わせてパリ本部で「2026年版乳幼児期ケア・教育グローバル報告書」を発表すると発表した。","\n【概要】\n国連教育科学文化機関（ユネスコ）は、2026年11月20日の「世界子どもの日」に合わせてパリ本部で「2026年版乳幼児期ケア・教育グローバル報告書」を発表すると発表した。発表には各国政府関係者や専門家、若者代表が参加する予定である。\n\n【背景】\n乳幼児期の教育・保育へのアクセスは子どもの発達の土台となるが、世界的に資金不足や地域間格差が課題となっている。2030年までにすべての子どもが質の高い乳幼児期の発達・ケア・就学前教育にアクセスできるようにするという国際目標の達成状況が注目されている。各国の政策担当者にとって、こうした国際データは自国の施策の評価軸としても重視されている。\n\n【詳細】\n発表によると「世界子どもの日である11月20日に、2026年版乳幼児期ケア・教育グローバル報告書がユネスコ本部で発表される」予定である。「8歳未満の数百万人の子どもが資金格差と不平等により質の高い教育を受けられずにいる現状を踏まえ、発表イベントには政府関係者、専門家、若者代表が集まり解決策を議論し、子どもたちによる芸術的パフォーマンスも予定されている」という。報告書は「2030年までにすべての子どもが質の高い乳幼児期の発達・ケア・就学前教育にアクセスできるようにするという目標達成に向けた重要な局面で発表され、世界・地域レベルの最新の就学率データが含まれる」としている。\n\n【ポイント・注意点】\nこの報告書は、各国の乳幼児教育政策の資金配分や格差是正の方向性を左右する可能性がある重要な資料として位置づけられている。発表はまだ行われていないが、報告書本体は「エンバーゴ付きで請求により閲覧可能」とされており、今後の詳細な内容公開が注目される。保護者や教育関係者にとっては、国際的な乳幼児教育の動向を把握する機会となるため、11月20日の正式発表後の続報にも注目したい。資金格差の是正に向けた具体策や各国の優良事例が盛り込まれるかどうかも、今後の政策論議の行方を占う上で重要な焦点となるだろう。","2026-11-10","UNESCO","https://www.unesco.org/en/articles/launch-2026-global-report-early-childhood-care-and-education-unesco"],["仏パリ平和フォーラムで子ども向けAI安全宣言、OpenAIなど8.9億円拠出","パリ平和フォーラムが主催する「子どもサミット」でAI開発企業や安全研究機関が子どもとAIの関係を研究する基金に総額約8.9億円を拠出すると表明した。UAEなど数十か国が未検証AIモデルから子どもを守る宣言に署名し、AI実務者向けの指標やベストプラクティスの策定を目指す枠組みが始動した。■概要フランス・パリで開催された「子どもサミット」において、OpenAIやAnthropicを含むAI開発企業や主要なAI安全組織が、AIと子どもの発達の関係を研究するため…","\n■概要\nフランス・パリで開催された「子どもサミット」において、OpenAIやAnthropicを含むAI開発企業や主要なAI安全組織が、AIと子どもの発達の関係を研究するための基金に総額8百万ユーロ（約8.9億円）を拠出すると表明した。同時にUAEを含む数十か国が、未検証のAIモデルから子どもを守ることを目的とした国際的な宣言に署名した。\n\n■背景\nこのサミットは、エマニュエル・マクロン仏大統領が2018年に立ち上げた国際的なガバナンス改善のための年次会合「パリ平和フォーラム」が主催するもので、子どもサミットはAI関係者に指標やベストプラクティスを提供し、官民が連携するプラットフォーム「Action Hub for Children」を設立することを目指している。UAEはすでに15歳未満のソーシャルメディア利用を禁止するなど、子どものデジタル環境保護に積極的な姿勢を示してきた国の一つである。\n\n■詳細\n拠出される資金は、AIと子どもの発達の相互作用に関する研究やツール開発に充てられる。パリ平和フォーラムのフィリップ・エティエンヌ会長は、研究者に適切な資源を提供することで、こうした技術が子どもの発達に与える影響を理解し、科学的根拠に基づく政策立案につなげることが狙いだと説明している。会合に先立ち、政府が任命した専門家委員会のメンバーがエリゼ宮（大統領府）で面会する場も設けられた。宣言に署名した数十か国は、未検証のAIモデルが子どもに与えるリスクを重視し、安全性が十分に確認されていないモデルの利用から子どもを保護するための協調行動をとることで合意したとされる。\n\n■ポイント・注意点\n今回の宣言と拠出は、各国政府とAI企業、研究機関が連携して子どものAI利用に関するエビデンスを蓄積しようとする初期段階の取り組みであり、具体的な研究テーマや成果はこれから公表される見通しである。AI技術が急速に子どもの生活に浸透する中、科学的知見の空白を埋めることが急務とされており、今後の基金運用や研究成果の公開状況が注目される。官民連携の枠組みである「Action Hub for Children」が実際にどのような指標やベストプラクティスを打ち出すかも、今後の重要な焦点となる。","2026-11-10","The National","https://thenationalnews.com/news/europe/2026/11/10/uae-among-dozens-of-countries-to-sign-ai-safety-declaration-to-protect-children"],["幼児の言語学習過程をLLMで再現、Scienceにプリンストン大の研究掲載","プリンストン大学の研究チームが、幼児が1000日間に実際に聞いた音声データをLLMに学習させ、言語獲得過程を再現する研究をScienceに発表。学習した音素や単語数の増加パターンや幼児間の多様性が実データと一致する結果を示した。一方で視覚情報を伴わない学習条件である点が課題として指摘されている。■概要プリンストン大学の研究チームによる論文が2026年11月5日付のScienceに掲載された。","\n■概要\nプリンストン大学の研究チームによる論文が2026年11月5日付のScienceに掲載された。タイトルは「The first 1000 days: Modeling language learning from individual children's everyday speech（最初の1000日：個別の子供の毎日のスピーチから言語学習をモデル化する）」。幼児が毎日聞く音の中から言葉の音素と単語を抽出する過程を、大規模言語モデル（LLM）を用いて再現しようとする研究である。\n\n■背景\n幼児がどのようにして周囲の音声から言語を獲得していくのかは、発達科学における重要な問いである。近年、Transformerなどの深層学習技術を用いて、実際の幼児の体験データをモデルに学習させることで、言語獲得の過程を計算論的に検証する研究が進んでいる。本研究は、2024年にニューヨーク大学から発表された、ヘッドカメラを装着した幼児が見た画像と聞いた言葉をTransformerにインプットする研究の流れをくむものである。\n\n■詳細\n研究チームは、一人の幼児が1000日という長期間にわたって実際に経験したスピーチを、Transformerシステムを持つLLMにインプットした。具体的には、子供の暮らす家庭にビデオカメラとマイクロフォンを設置し、子供がいる場所で聞いたと思われる人の声を記録。8人の子供について個別の体験データを収集し、総インプット量は最大で6,600時間分、最少で1,921時間に及んだ。\n\nモデルの構造は、音としてインプットされたスピーチを20ミリ秒の分解能で離散化し、768次元の空間に分布させるエンコーダーと、インプットに対して次のアウトプットを予測するデコーダーから構成される。\n\n結果として、同じ体験をした幼児と同じように、時間の経過とともに学習した音素と単語の数が増えていくことが示された。さらに、8人の子供それぞれのデータに基づくモデル間で、学習の進み方に幼児間で見られるような多様性も反映されていた。\n\n■ポイント・注意点\n本研究の意義は、実際の幼児が経験した音声データをそのまま用いることで、現実の言語獲得過程に近い形でモデル化を試みた点にある。一方で注意すべき点として、実際の幼児は視覚を含む様々な体験を通じて学習しているのに対し、今回のLLMは音声以外のインプットがない条件で学習している。この違いは、モデルが再現する学習過程と実際の幼児の学習過程との間に本質的な差異が残ることを意味しており、今後の研究課題として留意する必要がある。","2026-11-07","AASJ","https://aasj.jp/news/watch/29930"],["青年期の『助けを求めない』心理、信頼形成プロセスを解明","東京大学の研究グループが、援助要請をしない日本の青年がどのように心理的孤立から対人信頼を回復していくかのプロセスモデルを示した論文を国際誌に発表。学校現場での支援のあり方に示唆を与える内容。援助要請をしない青年を支援困難な存在としてではなく、段階的に変化しうる存
