で、Meta Model APIとMuse Codeでのみ使える。料金は入力が100万トークンあたり0.10ドル、キャッシュ済み入力が0.004ドル、出力が0.50ドルで、入力が20万トークンを超えると0.30ドル、0.012ドル、1.50ドルに上がる。文脈は100万トークン、最大出力は512Kトークンだ。Artificial Analysisの知能指数は36点で、Claude Haiku 5.5（最大）の36点と同じだが、1タスクあたりの費用は0.14ドルと、Haikuの0.41ドルの約3分の1だ。Muse Codeではコーディングエージェント指数が46点で、Claude CodeでのHaiku 5.5の37点を上回る。一方で知識は弱く、AA-Omniscienceの正答率は21.1%で、質問の64%に答えるのを控えた。【ポイント・注意点】Emberは、大きなモデルが計画を立て、小さなモデルが大量の作業をこなす二段構えの「作業役」として設計されている。知識を問う用途には向かず、事実が必要な作業では検索や取得を組み合わせるのがよい。クラウド専用のため、機密性の高いファイルを自分の機器に留めたい場合は、自分の機器で動くモデルとの使い分けが必要だ。","2026-11-10","ModelFit","https://modelfit.io/blog/meta-muse-ember-cloud-subagent-vs-local-model/"],["MuseとClaudeの連携、公式手順は2つの形のみ","MuseとClaudeの連携について、11月10日時点の公式文書をもとに整理した解説記事が公開された。連携は4つの形に分かれ、公式の手順があるのはClaude Codeの接続先をMeta Model APIに変える方法と、Claude Codeの設定をMuse Codeに取り込む方法の2つだ。MuseのアプリとClaudeを直接つなぐ公式のコネクターは見つかっていない。","\n【概要】MuseとClaudeの連携について、2026年11月10日時点の公式文書をもとに整理した解説記事が公開された。結論として、MuseのアプリとClaudeをつなぐ公式のコネクターは見つからず、開発者向けにはMetaの文書が案内する2つの形があるという。【背景】MuseとClaude CodeはどちらもAIを使った開発の道具だが、提供元も設計も違う。利用者からは「つなげて使えないか」という相談が増えており、どこまでが公式の手順で、どこからが非公式の工夫なのかを切り分ける必要があった。記事は、連携を4つの形に分けて整理している。【詳細】4つの形は次の通りだ。①Claude Codeの接続先をMeta Model APIに変え、Muse WonderやMuse Spark、Muse Emberに答えさせる形で、Metaの文書に手順がある。②Claude Codeのスキルやメモ、MCP設定、会話をMuse Codeに取り込む形で、muse skills importや/migrate、/resume-claudeが使える。③MuseのアプリとClaudeを直接つなぐ形で、公式のコネクターは見つかっていない。④Muse Codeの中でClaudeのモデルを選ぶ形で、公開の案内は見つかっていない。Anthropicの文書は、Claude CodeをClaude以外のモデルに向ける使い方をサポートしないと明記している。Metaの設定例では、軽い作業とサブエージェントに11月9日発表のMuse Emberを割り当てている。Muse Codeのサブスクは月5ドルから200ドルの4段階で、初期設定はContributorモードだ。【ポイント・注意点】会社のClaude Codeでは、管理者の設定で接続先と使えるモデルを固定できる。Contributorモードは送った内容をMetaの今後のモデルの学習に使ってよい代わりに枠が増えるため、社外秘のコードを扱う場合は切るかどうかの判断が要る。取り込む前にCLAUDE.mdやスキル、MCP設定に秘密の値が入っていないか確認することも大切だ。","2026-11-10","Uravation","https://uravation.com/media/meta-muse-claude-integration-2026-11/"],["Meta、Wonderで学んだ専用モデルをMuseへ展開","MetaがMuse Wonderを使って学習させた専用版モデルを、MuseとMeta AIの利用者へ展開し始めた。既存モデルの専用版に「Active Memory」と「Active Focus」の機能が広がる。Metaによれば、重要な情報を忘れる割合が2.4分の1に減り、日常タスクの完了率が67%改善したという。ただし数字の根拠となる試験方法は公開されていない。","\n【概要】Metaが、Muse Wonderを使って学習させた専用版モデルをMuseとMeta AIの利用者へ展開し始めたと、2026年11月8日に報じられた。Wonderそのものではなく、既存モデルの専用版で、「Active Memory」と「Active Focus」という2つの機能が広がる。発表文自体に日付はなく、Techmemeのまとめは11月7日付だ。【背景】MetaはMuse Wonderの発表時に、まずMuseの有料加入者向けにWonderの力を届け、その後Wonderを使って開発した専用モデルをMuseの全利用者へ広げるとしていた。今回の展開はその計画に沿ったものだ。Wonder自体がMuseの裏側で動くようになったかどうかは、発表では明らかにされていない。【詳細】Active Memoryは、一時的な情報と恒久的な情報を区別し、まだ必要なものと古くなったものを分けるようモデルを学習させる機能だ。Metaによれば、Museの改良モデルでは目標達成に必要な重要な情報を忘れることが2.4分の1に減ったという。Active Focusは、予期せぬ障害が起きても目標に向かって作業を続けるための機能で、日常のタスクを最後まで終える割合が67%改善したとされる。Meta AI向けには数字が示されていない。同じ改善で、途中の指示や修正への対応もよくなるとされる。【ポイント・注意点】2つの数字はMetaの発表だけが出どころで、比較対象や試験方法は公開されていない。独立した検証結果もなく、価格や地域、展開の予定、安全性の評価も発表には含まれていない。数字の大きさだけで判断せず、自分の使い方で実感できるかどうかを見極めるのがよい。Wonderの発表時に約束された安全性評価の全文書も、まだ公開されていないとされる。Metaは、Wonderの力をまず有料加入者へ届け、その後Wonderで学習させた専用モデルをすべての利用者へ広げる計画を示していた。今回の展開はその計画に沿ったものだ。ただし、数字の根拠となる試験方法が公開されていない点には注意が必要で、自分の使い方で実感できるかを見極めるのがよい。","2026-11-08","Automatica Press","https://www.automaticapress.com/articles/meta-rolls-out-wonder-trained-models-to-muse-and-meta-ai-users-mw7ecvrb"],["Muse「スペース」とは、言葉で作る専用ページ","Metaが11月6日にMuseへ追加した「スペース」について、仕組みと作り方を解説した記事が公開された。言葉で伝えるだけで、Museの中に自分専用の小さなアプリを作れる機能で、サイドバーに置いて何度でも戻れる。つないだアプリがあれば裏側で自動更新される。買い物ハブや学校ダッシュボードなど9つの例が挙げられ、共有機能はまだ提供されていない。まずは小さなものから試すのがよい。","\n【概要】Metaが2026年11月6日にMuseへ追加した「スペース」について、仕組みと作り方、できることを解説した記事が公開された。言葉で伝えるだけで、Museの中に自分専用の小さなアプリを作れる機能で、サイドバーに置いて何度でも戻れる。【背景】Museは9月8日に米国で発表され、スペースはその2か月後の追加機能だ。前日の11月5日には米国で音声とアバターの提供が始まっており、2日続けて大きな機能が追加された。発表はMetaのニュースルーム記事「Design the Muse App, Just for You」で、同日18時（UTC）に公開された。【詳細】スペースは、チャットでアイデアを伝えるだけで作れる。トラッカーやプランナー、プロジェクトボード、ゲームなどが作れ、作ったものはサイドバーに残り、会話で直していくこともできる。つないだアプリがあれば、コンサートの日程や価格の変化、貯金の進み具合などが裏側で自動更新される。Metaが挙げた9つの例は、買い物ハブ、学校ダッシュボード、音楽トラッカー、結婚式プランナー、クイズゲーム、ポッドキャストスタジオ、注文トラッカー、顧客ハブ、旅行プランナーだ。サイドバーやメインタブに置いたり、曜日で表示を切り替えたりできる。iPhoneアプリのバージョン14.3のリリースノートにもスペースが記されている。Museは米国、カナダ、日本、シンガポール、メキシコの5か国で提供されている。【ポイント・注意点】スペースは今のところ個人専用で、他の人との共有や共同編集はできない。Metaは共有の検討を進めているとしているが、時期は示されていない。料金も発表されておらず、無料の範囲で使えるとみられるが、確約はない。アカウントによってはすぐ表示されない場合もあり、段階的な展開の可能性がある。まずは贈り物トラッカーのような気軽なものから試すのがよい。スペースは、チャットとは違い、作ったものが残って何度でも戻れる場所になる。旅行の計画や贈り物の管理など、繰り返し使う作業に向いている。まずは小さなものから作り、使いながら直していくのがよい。","2026-11-07","Built With Muse","https://builtwithmuse.com/blog/muse-spaces"],["MuseとClaude Codeの連携方法、手順と料金を解説","MuseとClaude Codeの連携方法を、11月3日時点の公式ページをもとにまとめた解説記事が公開された。連携は3つの別々の方法に分かれる。Claude Codeの接続先をMetaのModel APIに替える方法、Muse CodeにClaude Codeの設定を持ち込む方法、アプリ版Museの作業環境でClaude Codeを動かす方法だ。料金や使えなくなる機能、Anthropic側の立場も整理されている。","\n【概要】MuseとClaude Codeの連携方法について、2026年11月3日時点の公式ページをもとにまとめた解説記事が公開された。「連携する」といっても実際には3つの別々の方法があり、それぞれ手順や料金、できなくなることが違う。【背景】MuseはMetaのパーソナルAIエージェントで、裏側ではMuse WonderやMuse Sparkといったモデルが動く。Claude CodeはAnthropicのコーディング用エージェントだ。両者をつなぐ方法として、Metaが開発者向け文書で手順を公開しているものと、紹介記事で語られるものがあり、区別が必要だった。【詳細】3つの方法は次の通りだ。AはClaude Codeの接続先をMetaのModel APIに替える方法で、環境変数ANTHROPIC_BASE_URLを「https://api.meta.ai」にし、末尾に「/v1」を付けないのが要点だ。モデルはmuse-wonder-1.0やmuse-spark-1.3を指定する。BはMuse CodeにClaude CodeのメモリやMCP、スキル、プラグイン、指示ファイルを取り込む方法で、/resume-claudeや/skill/importなどが使える。Cはアプリ版Museの作業環境にClaude Codeを入れて動かす方法で、公式の手順ページは見つかっていない。料金は従量課金で、Wonderは入力100万トークンあたり4.00ドル、出力20.00ドル、Sparkは入力1.25ドル、出力4.25ドルだ。接続先を替えるとRemote Controlは使えなくなり、claude.aiのサブスク枠も使われなくなる。Contributorモードは送った内容を学習に使う代わりに安くなる。【ポイント・注意点】Anthropicは、ゲートウェイ経由でClaude CodeをClaude以外のモデルにつなぐ使い方をサポートしないと明記している。Metaが手順を公開している一方で、Anthropic側は対象外としており、公式ページ同士で記述がそろっていない点もある。Muse Codeのサブスクは初期設定でContributorモードがオンのため、仕事のコードを扱う場合は設定を確認しておきたい。","2026-11-03","AIのプロ名鑑","https://kenkyo.site/muse-claude-code-howto-price-limits/"]],"cnc":[["JIMTOF2026、AIがCNC加工の段取りと診断を支援へ","JIMTOF2026で日本の工作機械メーカー各社が、AIをCNC加工に組み込む取り組みを披露した。オークマは加工結果の診断と改善提案を行うAIエージェント搭載の立形マシニングセンタを試作し、ファナックはフィジカルAI CNCの構想とMCPサーバを示した。マザックは段取り時間の短縮、三菱電機とDMG森精機は作業者支援を進める。熟練者の経験に頼ってきた段取りや不具合対応をAIが補う流れが鮮明になった。","\n【概要】2026年11月3日、JIMTOF2026で日本の工作機械メーカー各社がAI活用の最新動向を示した。加工条件の分析や段取り支援、不具合対応など、これまで熟練作業者の経験に頼ってきた工程をAIが支える内容が中心だった。フィジカルAIによりロボットが自律的に動く構想も広がっている。【背景】製造現場では熟練者の不足が深刻で、段取りや加工条件の調整、不具合の切り分けが属人化しやすい。AIに現場のデータと知見を学習させることで、経験の浅い作業者でも安定した加工ができる環境が求められている。各社は自社の機械データと生成AIを組み合わせる方向に進んでいる。【詳細】オークマはAIエージェントを載せた立形マシニングセンタMB-46VEIIの試作機を展示し、加工結果や機械状態の診断と改善提案ができることを示した。2027年度の商品化を目指す。ファナックはフィジカルAI CNCの構想とMCPサーバを発表し、工作機械メーカーが自社の段取りや加工の知見をAIアプリ化できる仕組みを示した。設定変更の提案はデジタルツインで効果を試せる。マザックはAIエージェントをクラウドサービスMazak iConnectと段取り支援ソフトMazatrol DXに組み込み、問い合わせ対応と手順支援で段取り時間を短くする。三菱電機は既存のCNCを扱いやすくするAIエージェントを開発し、スマートグラスと連携した案内機能も紹介した。DMG森精機は修理経験を学習したService Agentで故障診断と対応策の提示を行う。ファナックのAI Masterless Visionは2027年1月の出荷を予定する。【ポイント・注意点】AIの提案はあくまで支援であり、最終判断は人が行う運用が前提になる。デジタルツインでの事前検証や、提案の根拠を確認できる仕組みがあるかどうかが導入時の見極め点だ。DIYや小規模工房では産業機の機能をそのまま使えないが、段取り支援や診断の考え方はCAMや加工条件の見直しにも応用できる。こうしたAI活用の動きは、産業機だけでなく卓上CNCの使い方にも影響しそうだ。加工条件の記録や見直しを習慣にすることで、小さな工房でも安定した仕上がりに近づける。","2026-11-03","M Report","https://www2024.mreport.co.th/en/news/trend-and-innovation/103-jimtof-2026-ai-cnc"],["CNCの段取り不要に、7軸協働ロボットOB7-AI登場","Productive Roboticsが10月30日に発表した協働ロボットOB7-AIは、フィジカルAIでCNC工作機械の配置を自ら走査し、プログラミングなしで機械の段取り作業を始められる。扉やバイス、チャック、ボタンを自動で認識し、CNCの画面を読んで加工サイクルの終了も検知する。熟練工不足に悩む小規模な加工現場で、既存のCNCを自動化する手段として注目される。 加工現場の人手不足への対応として、AIの活用が広がっている。","\n【概要】Productive Roboticsは2026年10月30日、フィジカルAIを搭載した7軸協働ロボットOB7-AIを発表した。CNC工作機械のレイアウトを自ら走査し、教示やプログラミングなしでワークの着脱などの段取り作業を始められる点が特徴だ。加工現場の人手不足への対応策として打ち出された。【背景】CNCの機械段取りは繰り返し作業だが、ロボットを新しい機械へ移すたびに扉や治具、操作ボタンの位置を教え直す手間が大きく、自動化の壁になっていた。特に多品種少量の町工場では、段取り替えのたびに教示し直す負担が重い。既存の機械を買い替えずに自動化したいという需要も強い。【詳細】OB7-AIは扉やバイス、チャック、ボタン、センサーを自動で検出し、CNCの制御画面を読み取って加工サイクルの終了を把握する。ワークは精密な位置決めが不要で、グリッパーがつかめる程度の指一本分のすき間があれば位置を見つけて把持できるという。オプションの第8軸リニアレールを付けると最長約24フィートの部品にも対応する。7軸の腕は一般的な6軸より可動範囲が広く、機械の周囲の障害物をかわしやすい。同社は研究室や医療分野への応用も視野に入れているが、当面の対象はCNC加工と自動車製造だ。2026年第3四半期に北米で受注された協働ロボットは4605台で、最も伸びている分野とされる。【ポイント・注意点】「教示なし」の主張が実際の現場でどこまで通用するかは、散らかった作業台や照明条件、想定外の機械配置で検証が必要だ。導入時はまず1台の機械で試し、把持の安定性や画面読み取りの確実さを確認するとよい。DIY用途では価格や設置スペースの面で産業機そのものの導入は難しいが、画像認識で機械状態を読む発想は小型CNCの自動化にも参考になる。こうしたAI活用の動きは、産業機だけでなく卓上CNCの使い方にも影響しそうだ。加工条件の記録や見直しを習慣にすることで、小さな工房でも安定した仕上がりに近づける。新しい機能を試す際は、まず簡単な形状や材料で確かめ、無理のない範囲から取り入れるとよい。導入の判断では、仕様や価格だけでなく、自分の作るものや作業の流れに合うかどうかを見極めたい。","2026-11-02","The Robotics Media","https://theroboticsmedia.com/article/productive-robotics-ob7-ai-physical-ai-cobot"],["AIビジョンの協働ロボットがCNCの段取りを自動化","Techman RobotとGuorui Automationが、AIビジョンと協働ロボットを組み合わせたCNC工作機械の段取り自動化ソリューションを開発した。ワークの識別や位置決め、搬入・搬出を自動化し、機械の稼働率向上と手作業の削減を目指す。2026年11月11日に報じられた。段取り替えの多い現場での柔軟な運用が期待される。 加工現場の人手不足への対応として、AIの活用が広がっている。","\n【概要】Techman RobotとGuorui Automationは、AIビジョンと協働ロボットを組み合わせたCNC工作機械向けの段取り自動化ソリューションを開発した。ワークの識別や位置決め、搬入と搬出を自動化し、機械の稼働率を高めるとともに手作業を減らす狙いがある。2026年11月11日に報じられた。【背景】CNC加工では段取り替えやワークの搬送に人手がかかり、機械が止まる時間が生産性を左右する。特に多品種少量生産では、品種ごとにワークの形や置き方が変わるため、固定の自動化では対応しにくい。カメラで見て判断するAIビジョンと協働ロボットの組み合わせが、この課題への答えとして注目されている。【詳細】このソリューションはTechman RobotのTM AI CobotプラットフォームにAIビジョンを組み合わせたもので、ワークの識別、位置決め、搬入・搬出といった段取り作業の主要工程を自動化する。画像からワークの形や向きを把握し、ロボットが適切につかんで機械へ運ぶ流れだ。専用の自動化と組み合わせることで、品種が変わっても比較的柔軟に対応できる。協働ロボットは安全柵なしで人と近くで働ける設計が多く、小規模な現場にも入れやすい。両社はこの仕組みにより、機械の稼働率向上と作業負担の軽減、生産の柔軟性向上を図るとしている。導入事例の詳細な数値は報じられていない。【ポイント・注意点】AIビジョンの認識精度はワークの材質や表面の光沢、照明条件に左右されやすい。導入前には実際のワークで認識テストを行い、つかみ損ねや誤認識時の停止方法を確認しておきたい。DIYや小規模工房では産業用協働ロボットの導入は大がかりだが、カメラでワーク位置を補正する考え方は、卓上CNCの治具や位置決めの工夫にも生かせる。こうしたAI活用の動きは、産業機だけでなく卓上CNCの使い方にも影響しそうだ。加工条件の記録や見直しを習慣にすることで、小さな工房でも安定した仕上がりに近づける。新しい機能を試す際は、まず簡単な形状や材料で確かめ、無理のない範囲から取り入れるとよい。導入の判断では、仕様や価格だけでなく、自分の作るものや作業の流れに合うかどうかを見極めたい。","2026-11-11","Metrology News","http://metrology.news/ai-vision-and-collaborative-robots-target-cnc-machine-tending/"],["Hurco、3D形状から加工箇所をAIが見つける機能を展示","HurcoがIMTS2026で、取り込んだ3Dソリッドから加工すべき箇所をAIが自動で見つけるフィーチャー認識機能を披露した。手作業では1時間以上かかることもある5軸部品のプログラミングを、15〜30分程度に短縮できるとする。対話型プログラミングと新しい操作画面も合わせて示された。 加工現場の人手不足への対応として、AIの活用が広がっている。 段取りや診断の手間を減らす工夫が、現場の負担軽減につながる。","\n【概要】HurcoはIMTS2026で、取り込んだ3Dソリッドから加工すべき形状をAIが自動で識別するフィーチャー認識機能を披露した。対話型プログラミングソフトに組み込まれたもので、手作業では1時間以上かかることもあるプログラミング作業の短縮を狙う。操作画面の刷新も合わせて示された。【背景】CNCのプログラミングでは、図面や3Dモデルを見ながら穴やポケット、輪郭などの加工箇所を一つずつ指定する作業に時間がかかる。特に複合角度の穴を持つ5軸部品では、形状の読み取りと工具経路の検討が負担になる。AIが形状を先に読み取って候補を示せば、作業者は確認と調整に集中できる。【詳細】Hurcoのデモでは、3Dソリッドを取り込むとAIが切削すべき形状を自動で識別し、確認用にハイライト表示した。複合角度の穴を持つ5軸部品のプログラミング時間について、同社はソリッド取り込みを使うと15〜30分程度になるとの見積もりを示し、手作業では1時間以上かかるとしている。ただしこれは同社のデモでの見積もりで、さまざまな実部品での性能は独立には確認されていない。あわせてユーザーアカウント型に刷新された制御画面も披露され、作業者ごとの設定管理がしやすくなった。Hurcoは対話型CNCプログラミングソフトで知られる工作機械メーカーだ。【ポイント・注意点】AIの認識結果は必ず人が確認する運用が前提で、見落としや誤認識がそのまま加工ミスにつながるおそれがある。見積もり時間はデモ条件のものであり、自分の部品で試して実測することが大切だ。DIYや小規模工房では産業機の機能は使えないが、形状から加工箇所を推測する発想は、CAMの自動フィーチャー認識や、Fusionなどの対話型CAMの使い方を見直すヒントになる。こうしたAI活用の動きは、産業機だけでなく卓上CNCの使い方にも影響しそうだ。加工条件の記録や見直しを習慣にすることで、小さな工房でも安定した仕上がりに近づける。新しい機能を試す際は、まず簡単な形状や材料で確かめ、無理のない範囲から取り入れるとよい。導入の判断では、仕様や価格だけでなく、自分の作るものや作業の流れに合うかどうかを見極めたい。","2026-11-03","WiseVoter","https://wisevoter.com/world/2026/11/03/hurco-ai-feature-recognition-imts-2026"],["三菱電機、人型ロボットとCNCが協働する加工システム開発","三菱電機が、人型ロボットとCNC工作機械がフィジカルAIで協働する加工システムを開発した。段取りや清掃、完成品の搬送、検査、不具合対応など、従来は作業者が担ってきた工程を人型ロボットが担う。JIMTOF2026で実演し、2030年の実用化を目指す。世界初をうたう取り組みだ。 加工現場の人手不足への対応として、AIの活用が広がっている。 段取りや診断の手間を減らす工夫が、現場の負担軽減につながる。","\n【概要】三菱電機は、人型ロボットとCNC工作機械がフィジカルAIを通じて協働する加工システムを開発した。段取りや清掃、完成品の取り出しと搬送、検査、不具合対応など、従来は作業者が行ってきた工程を人型ロボットが担う。JIMTOF2026で実演され、2030年の実用化を目指すとされる。【背景】製造現場の熟練者不足は世界的な課題で、機械の段取りや清掃、検査といった周辺作業まで人手が回らない現場が増えている。人型ロボットは人向けに作られた設備や通路をそのまま使える可能性があるため、専用設備への作り替えが少なくて済む点が注目されている。言葉での指示を理解するAIと組み合わせることで、作業の幅が広がる。【詳細】このシステムはAI加工タスクプランナー、フィジカルAIを備えたCNC工作機械、人型ロボットの3要素で構成される。作業者が言葉で指示すると、タスクプランナーが作業を分解し、ロボットと工作機械に割り振る。CNC側も自らのフィジカルAIで指示を生成・実行し、ロボットと連携する。基盤技術には三菱電機のAI技術Maisartが使われている。2026年10月に東京で開かれたJIMTOFで実演され、今後は機能を高めながら実証を進め、2030年の商品化を目指すとしている。同社は世界初の取り組みと位置づけている。【ポイント・注意点】実用化は2030年が目標で、現段階は実証の途上だ。人型ロボットの作業速度や安全性、コストが見合うかどうかが今後の焦点になる。DIYや小規模工房に直接の関係は薄いが、言葉で指示して機械が段取りを組み立てる流れは、将来の卓上CNCやCAMの対話型操作の姿を考えるうえで参考になる。こうしたAI活用の動きは、産業機だけでなく卓上CNCの使い方にも影響しそうだ。加工条件の記録や見直しを習慣にすることで、小さな工房でも安定した仕上がりに近づける。新しい機能を試す際は、まず簡単な形状や材料で確かめ、無理のない範囲から取り入れるとよい。導入の判断では、仕様や価格だけでなく、自分の作るものや作業の流れに合うかどうかを見極めたい。","2026-11-03","Drives & Controls","https://drivesncontrols.com/humanoid-robots-collaborate-with-cnc-machine-tools-in-world-first/"],["Vericut、CNC加工の検証と最適化にAIを活用","VericutがAdvanced Engineering 2026で、CNCシミュレーションと最適化、AIソリューションを展示した。NCプログラムを仮想環境で検証し、切削条件を最適化するもので、導入企業では工具コスト20％減とサイクルタイム11％減の事例が紹介された。自然言語で使い方を案内するAI機能も披露された。 加工現場の人手不足への対応として、AIの活用が広がっている。","\n【概要】Vericutは2026年11月4〜5日にバーミンガムで開かれたAdvanced Engineering 2026で、CNCシミュレーションや最適化、AIソリューションを展示した。加工前にNCプログラムを仮想の機械環境で検証し、切削条件を最適化することで、加工ミスや工具コストの削減を図る内容だ。【背景】CNC加工では、プログラムの誤りが機械やワーク、工具の破損につながるため、実機で試す前の検証が欠かせない。切削条件が合わなければ工具寿命が短くなり、加工時間も伸びる。シミュレーションと最適化を組み合わせることで、初めてのプログラムでも安心して加工できる環境が求められている。【詳細】Vericutのシミュレーションと検証ソフトは、ポスト処理済みのNCプログラムを機械や製造環境のデジタル表現と照らし合わせて試せる。Vericut Forceは工具経路に沿った切削条件を分析し、工具のかみ合いや切りくず厚さ、切削力に応じて送り速度を調整する。導入事例として、航空宇宙や発電向けタービン部品を作る英国ELE Advanced Technologiesは、Vericut Forceにより部品あたりの切削工具コストが20％減り、サイクルタイムが11％減ったとされる。AI関連では、自然言語の質問に答えてソフトの使い方を案内するVericut Assistant、技術知識へのウェブアクセスを提供するVericut Intelligence、Icam PostへのAI支援案内が紹介された。【ポイント・注意点】導入事例の数値は特定企業の実績であり、自分の加工条件で同じ効果が出るとは限らない。シミュレーションはあくまで仮想環境での検証なので、実機の状態や工具の摩耗を反映させる運用が大切だ。DIYや小規模工房では高価な産業ソフトは手が届きにくいが、加工前に工具経路を確認し、送り速度を見直す習慣は卓上CNCでもそのまま生かせる。 こうしたAI活用の動きは、産業機だけでなく卓上CNCの使い方にも影響しそうだ。 加工条件の記録や見直しを習慣にすることで、小さな工房でも安定した仕上がりに近づける。","2026-10-30","The Machine Maker","https://themachinemaker.com/news/vericut-to-showcase-cnc-simulation-optimisation-and-ai-solutions-at-advanced-engineering-2026/"],["DN Solutions、AI診断付きの自律型CNC加工セルを発表","DN SolutionsがROBOTWORLD 2026で、CNC工作機械と産業用ロボット、AI診断を組み合わせた自律型加工セルを発表した。デジタルツインで加工の動きや衝突リスクを事前に確かめ、診断システムが保全の提案を行う。高精度部品の生産で、サイクルタイムのばらつきと手作業の搬入を減らす狙いだ。 加工現場の人手不足への対応として、AIの活用が広がっている。 段取りや診断の手間を減らす工夫が、現場の負担軽減につながる。","\n【概要】DN SolutionsはROBOTWORLD 2026で、CNC工作機械と産業用ロボット、AI診断を組み合わせた自律型の加工セルを発表した。サイクルタイムのばらつきや手作業での搬入のボトルネックをなくし、高精度部品の生産を安定させる狙いがある。2026年11月6日に報じられた。【背景】高精度部品の加工では、ワークの搬入や段取りのタイミングがずれると加工時間がばらつき、品質にも影響する。人の手による搬送は疲労や熟練度でばらつきが出やすく、夜間や長時間の無人運転の妨げにもなる。ロボットとデジタルツイン、AI診断を組み合わせた自律セルは、このばらつきを抑える手段として注目されている。【詳細】この自律加工セルは、関節型協働ロボットと第2世代のDVF 5000 5軸立形マシニングセンタを閉じた搬送ループで結んだ構成だ。DN Virtual Simulatorというデジタルツインプラットフォームで加工の動きをモデル化し、衝突リスクの評価とサイクルタイムの計算を事前に行う。さらにiDOO RMS+という診断システムが機械の状態データを集め、生産中の保全に向けた是正措置を提案する。ロボットと工作機械、AI診断が一体となることで、搬入から加工、診断までを連続して回す仕組みだ。ROBOTWORLD 2026での展示として紹介された。【ポイント・注意点】産業用の自律セルは投資規模が大きく、小規模工房がそのまま導入できるものではない。ただし、加工前にデジタルツインで動きを確認し、機械の状態データから保全のタイミングを考える流れは、卓上CNCの運用にも応用できる。段取りのばらつきを減らすには、まず搬入や固定の手順を定型化し、記録を残すことから始めるとよい。 こうしたAI活用の動きは、産業機だけでなく卓上CNCの使い方にも影響しそうだ。 加工条件の記録や見直しを習慣にすることで、小さな工房でも安定した仕上がりに近づける。 新しい機能を試す際は、まず簡単な形状や材料で確かめ、無理のない範囲から取り入れるとよい。 導入の判断では、仕様や価格だけでなく、自分の作るものや作業の流れに合うかどうかを見極めたい。","2026-11-06","Industry Valley","https://community.industry-valley.com/threads/robot-integrated-machining-cells-in-industrial-automation-the-future-of-manufacturing.3422/"],["AIエージェントがCNCのポストプロセッサを自作する仕組み","AIエージェントがCNC用ポストプロセッサを自ら書き、デバッグする仕組みが紹介された。MCPでポスト生成機能とCAMデータを結び、コンパイルとGコード生成、照合を繰り返す。試作では経験のない操作者が約1日で3軸用のポストを作れたが、専門家の監査で見落としも見つかり、最終確認の大切さが示された。 加工現場の人手不足への対応として、AIの活用が広がっている。 段取りや診断の手間を減らす工夫が、現場の負担軽減につながる。","\n【概要】ENCyを手がけるCube CAD Techは、AIエージェントがポストプロセッサを自ら書き、デバッグする仕組みを紹介した。ポストプロセッサはCAMの工具経路を特定のCNC制御用のGコードへ翻訳する部品で、その開発は専門知識が必要な工程だった。2026年11月2日に公開された。【背景】ポストプロセッサがなければ、CAMで作った工具経路は機械に届かない。制御ごとに異なる出力形式やサイクル、補正の扱いを理解して作る必要があり、対応できる技術者は限られる。新しい機械や制御を導入するたびに開発の手間がかかり、現場の導入を遅らせる要因になっていた。AIが下書きと検証を担えば、この壁を下げられる。【詳細】この仕組みではAIエージェントがMCPを通じてENCyのポストプロセッサ生成機能を操作する。一つのMCPサーバがポストプロセッサのハンドラコードを読み書きし、出力形式の設定やコンパイル、Gコード生成を行う。もう一つのサーバが実際のCAMデータであるCLDataを読み、扱う指令やサイクル、機械情報に合わせて作る。開発の流れは、CAMデータを読み、ハンドラを書き、コンパイルし、誤りを直し、NCプログラムを生成して参照結果と照合する繰り返しだ。試作では、ポストプロセッサの経験がない操作者が約1日で3軸ミーリング用のポストプロセッサを作り、約3900ブロックのGコードを生成した。エージェントは自ら安全上の欠陥も見つけ、早送り指定のない接近動作を修正したという。ただし専門家の確認では、工具長補正の出力など2件の見落としが見つかった。【ポイント・注意点】AIが作ったポストプロセッサは専門家の最終確認なしに実機へ入れてはいけない。試作では専門家の監査で見落としが見つかっており、検証の層が欠かせないことが示された。DIYではポストプロセッサを自作する場面は少ないが、生成したGコードを実機に入れる前にシミュレーションで確認し、最初の動きを低速で確かめる習慣は共通する。 こうしたAI活用の動きは、産業機だけでなく卓上CNCの使い方にも影響しそうだ。","2026-11-02","Cube CAD Tech","https://www.cubecadtech.com/post/ai-powered-postprocessor-development"],["AIが作った旋盤用CAM、対話でGコードを書き出す","LinuxCNCのフォーラムで、AIコーディングエージェントを使って作られた旋盤用CAMプログラム「WOP」が紹介された。端面加工や外径切削、穴あけ、ねじ切り、溝入れなどに対応し、対話で工程を組み立ててGコードを書き出す。手軽な部品作りを狙った個人のオープンソース開発で、2026年11月11日に投稿された。 加工現場の人手不足への対応として、AIの活用が広がっている。","\n【概要】LinuxCNCのフォーラムで、AIコーディングエージェントを使って作った旋盤用CAMプログラムが紹介された。WOPと名付けられた対話型のプログラムで、Linux上で単体アプリとして動き、加工内容を会話のように入力してGコードを書き出す。2026年11月11日に投稿された。【背景】旋盤のCAMは、端面加工や外径切削、穴あけ、ねじ切り、溝入れなど、工程ごとに設定が分かれるため、初心者には敷居が高い。市販の高機能CAMは価格も操作も重いことが多く、手軽に部品を1個作りたい場面では過剰になりがちだ。AIにプログラムの下書きを任せ、対話で工程を組み立てる方法が試されている。【詳細】投稿者によると、WOPはLinuxCNCの画面のプラグインではなく、Linux上で直接動く単体アプリだ。端面加工、単純な外径切削、固定サイクルを使った穴あけ、ねじ切り、溝入れ、任意の経路に沿った切削に対応し、部品全体のプログラムを1ファイルでまとめてGコードとして書き出せる。複雑な部品では本格的なCAMの代わりにはならないと投稿者自身が述べており、目的は手早く素直にプログラムを作ることだ。オープンソースとしてGitHubで公開され、投稿者以外にはまだほとんど使われていないため、使い勝手の分かりにくさが残る可能性もある。【ポイント・注意点】AIが作ったプログラムでも、Gコードは必ず内容を確認してから実機に入れること。特にねじ切りや溝入れでは、工具の動きと回転数の組み合わせを誤ると工具やワークを壊す。オープンソースの個人開発物なので、対応機種や不具合の情報は限られる。試す場合はまず簡単な形状で、エアカットや低速運転から始めるとよい。 こうしたAI活用の動きは、産業機だけでなく卓上CNCの使い方にも影響しそうだ。 加工条件の記録や見直しを習慣にすることで、小さな工房でも安定した仕上がりに近づける。 新しい機能を試す際は、まず簡単な形状や材料で確かめ、無理のない範囲から取り入れるとよい。 導入の判断では、仕様や価格だけでなく、自分の作るものや作業の流れに合うかどうかを見極めたい。","2026-11-11","LinuxCNC Forum","https://forum.linuxcnc.org/31-cad-cam/59378-i-made-a-cam-program-for-my-lathe-ai-made-it"],["卓上CNC 2026年モデル、価格帯別の比較が更新","卓上CNCの2026年モデルを価格帯別に比べた記事が更新された。入門機からMakera Z1などの中級機、Shapeoko 5.1 ProやOnefinity Eliteなどの上位機まで仕様が整理され、InfiMaker K1などの卓上5軸の新顔も紹介された。予算と用途に合わせた選び方の目安になる内容だ。 加工現場の人手不足への対応として、AIの活用が広がっている。 段取りや診断の手間を減らす工夫が、現場の負担軽減につながる。","\n【概要】卓上CNCの2026年モデルの比較記事が更新され、価格帯別に人気機種の仕様が整理された。約300ドルの入門機から1000ドル台の中級機、3000ドル超の上位機まで、用途に合わせた選び方が示されている。5軸の新顔も取り上げられた。2026年11月11日ごろの更新とされる。【背景】卓上CNCは機種が増え、価格も性能も幅広いため、初めて買う人は何を基準に選べばよいか分かりにくい。加工できる材料や大きさ、主軸の出力、ソフトウェアの扱いやすさが機種ごとに違う。価格だけで選ぶと、作りたいものに合わない機種を買ってしまうおそれがある。比較記事は、予算の目安と判断材料を整理する役割がある。【詳細】入門帯ではGenmitsuなどの約300ドルからの機種が挙げられた。中級帯ではMakera Z1が取り上げられ、2026年9月に予約が始まり、価格は1099ドル、通常価格1199ドルとされる。150Wの主軸と回転数制御、素早い工具交換が特徴だ。上位帯ではShapeoko 5.1 Proがボールねじとリニアレールによる剛性の高さで紹介され、OnefinityのGen 2 Eliteは2026年夏のバンドルが3995ドルとされる。Carveraは自動工具交換やレーザー、集じんを備えた密閉型として挙げられた。2026年後半の新顔として、InfiMaker K1やTOPFAB TF500といった卓上5軸機も紹介され、K1は2026年8月に登場し、9月にベルリンで賞を受けたとされる。【ポイント・注意点】比較記事の価格や仕様は確認時点のもので、為替やセールで変わる。購入前には公式ページで最新の価格と同梱物、送料、保証を確認したい。5軸機は魅力的だが、対応するCAMや学習コストも増えるため、まずは作りたいものの大きさと材料、置き場所を決めてから機種を絞るとよい。 こうしたAI活用の動きは、産業機だけでなく卓上CNCの使い方にも影響しそうだ。 加工条件の記録や見直しを習慣にすることで、小さな工房でも安定した仕上がりに近づける。 新しい機能を試す際は、まず簡単な形状や材料で確かめ、無理のない範囲から取り入れるとよい。","2026-11-11","TopFab","https://www.topfab.com/blogs/news/best-desktop-cnc-brands-2026"]],"cricut":[["Cricut Maker 5レビュー、彫刻と厚物対応を実機で検証","Cricutの最新フラッグシップMaker 5の実機レビューが11月6日に更新された。本体は従来より30％小型化され、対応する材料の厚さは2.4mmから3mmへ広がった。300種以上の材料と13種のツールに対応し、アルミへの彫刻も試された。リュックや車のデカール作りなど実作を通じ、Exploreとの使い分けが示された。 クリスマスシーズンの制作に向け、参考になる情報が多い。","\n【概要】Cricutの最新フラッグシップ、Maker 5の実機レビューが2026年11月6日に更新された。従来機より30％小型化された本体や、対応する材料の厚さが2.4mmから3mmへ広がった点、アルミへの彫刻などが試された。5年ぶりの買い替えを検討する人への判断材料になる内容だ。【背景】CricutのMakerシリーズは300種以上の材料と13種のツールに対応する多機能さが売りだが、実際にはビニールやアイロンプリントだけしか使わない人も多い。Exploreシリーズでも十分な場面があり、フラッグシップの追加機能が自分の作るものに必要かどうかが買い替えの分かれ目になる。レビューはその違いを実作で確かめている。【詳細】Maker 5は幅50.2cm、奥行き19cm、高さ12.1cmで、従来のMakerより30％小さいとされる。重さは約4.9kgで前機とほぼ同じだ。材料の厚さは最大3mmまで対応し、25％広がった。300種以上の材料と13種のツールに対応し、布のカットや彫刻、デボス、スコア、装飾的な縁取りができる。切断やスコア、彫刻用のワンピースツールが新しくなり、差し替え式のハウジングなしで装着できる。操作はLoad & Goで、Goボタンを一度押すと材料の読み込みと計測から加工まで進む。接続はUSB-CとBluetooth Low Energyだ。スマートマテリアルを使えばマットなしで切断でき、1枚のデザインは最大3.6mまで延ばせる。レビューではリュックへのアイロンプリントや車のデカール作り、アルミのドッグタグへの彫刻が試された。彫刻は最初うまくいかず、Cricutからの助言で再挑戦して成功したという。【ポイント・注意点】厚い材料が通ることと切れることは別で、密度やツール、加工方法の組み合わせを確認する必要がある。古いペンは新しいペンホルダーと互換性がない場合がある。ビニールやアイロンプリント中心ならExploreで十分なことも多く、彫刻や厚物に挑戦したい人ほどMaker 5の価値が大きい。購入前に対応ツールと材料の組み合わせを確認したい。カッティングマシンでの制作は、材料と刃、マットの組み合わせで仕上がりが大きく変わる。","2026-11-06","Digital Reviews","https://www.digitalreviews.net/reviews/lifestyle/cricut-maker-5-review/"],["ステンシル作りはMaker 4が有力、Maker 5との比較","ステンシル作りに適したカッティングマシンを比べた2026年の記事が更新された。多くの人には実績のあるCricut Maker 4が向くとし、最新機がほしい人にはMaker 5のUltimate Bundleが挙げられた。2026年11月時点の英国Amazonの価格と評価に基づき、刃の選び方が仕上がりを左右することも示された。 クリスマスシーズンの制作に向け、参考になる情報が多い。","\n【概要】ステンシル作りに適したカッティングマシンを比べた2026年の記事が更新され、Cricut Maker 4とMaker 5の使い分けが示された。多くの人にはMaker 4が向くとし、最新機がほしい人にはMaker 5のバンドルが挙げられた。価格は2026年11月時点の英国Amazonの表示に基づく。【背景】ステンシルはマイラーなどの薄いフィルムをきれいに切り抜く必要があり、刃の種類と送り、材料の固定が仕上がりを左右する。厚物や彫刻まで使うなら上位機、ステンシル中心なら価格と実績のバランスが大切になる。機種が増えたことで、どれを選べばよいか迷いやすくなっている。【詳細】記事では、英国でステンシルをよく作る多くの人にはCricut Maker 4が適しているとされる。マイラーをきれいに切る力と刃の選択肢があり、12インチ幅のマットが使え、Design SpaceへのSVG読み込みも問題なく行えるという。価格は2026年11月時点で約388ポンドとされる。最新のMaker 5はUltimate Bundleとして販売され、対応する材料は最大3mm、ツールは13種とされる。価格は約462ポンドで、記事の確認時点ではAmazon UKでの評価は4.5で13件と少なく、在庫も残り8台とされていた。Maker 4の評価は4.5で658件とされる。刃については、ステンシルには適切な刃の選択が重要で、記事では刃の違いが仕上がりを左右するとしている。【ポイント・注意点】価格は変動するため、購入前に販売ページでの確認が必要だ。評価件数の少ない新機種は、長期の実績がまだ乏しい。ステンシル中心なら実績のある機種と刃の組み合わせを優先するとよい。SVGを使う場合は、Design Spaceへの読み込みと線の太さ、切り抜きの設定を小さな試し切りで確認したい。販売ページの価格や在庫は変わりやすいため、購入直前の確認が欠かせない。カッティングマシンでの制作は、材料と刃、マットの組み合わせで仕上がりが大きく変わる。作る前に小さな試し切りをして、設定やサイズを確認しておくと失敗を減らせる。","2026-11-04","Free Stencil Maker","https://freestencilmaker.com/blog/best-cutting-machine-for-stencils"],["Cricut第3四半期は増収増益、Maker 5とStickerPixがけん引","Cricutの2026年第3四半期決算が報じられた。売上高は1億8860万ドルで前年同期比約11％増、純利益は2780万ドルだった。Maker 5やStickerPixなどの新製品の発売とプラットフォームの成長がけん引した。有料会員は約307万人で、通年では2021年以来の売上成長が見込まれるという。 クリスマスシーズンの制作に向け、参考になる情報が多い。 カッティングマシンを使う人の制作の幅を広げる内容だ。","\n【概要】Cricutは2026年第3四半期の売上高が1億8860万ドルで、前年同期より約11％増えたと発表した。純利益は2780万ドルで、Maker 5やStickerPixなどの新製品の発売とプラットフォームの成長がけん引した。2026年11月4日に報じられた。【背景】Cricutは2021年以降、年間売上の成長が止まっていた時期があり、新しい機械の投入が業績の回復につながるかどうかが注目されていた。Maker 5やStickerPixは、既存のカッティングマシンとは違う新しい買い替えや新規購入の理由を作る製品として位置づけられる。決算はその手応えを測る材料になる。【詳細】第3四半期の売上高は1億8860万ドルで、前年同期比約11％増。製品の売上高は1億270万ドルで約17％増、プラットフォームの売上高は8590万ドルで約4％増だった。純利益は2780万ドル、1株あたり0.13ドルで、前年同期の2050万ドル、0.10ドルから増えた。CEOのAshish Arora氏は、Maker 5とStickerPixの発売が業績を支えたと述べた。StickerPixは2014年以来の新しい接続機器のカテゴリーで、家庭でフルカラーのステッカーや写真プリントを作れる。写真と指示文からステッカーシートや写真プリントを作るAI機能もDesign Spaceに追加された。Joy 2やExplore 5、Maker 5、StickerPixの発売が機械需要を支えた。有料会員は約307万人で、前年同期比約2％増だった。経営陣は第4四半期もプラットフォーム売上と有料会員が増えると見込み、通年では2021年以来の売上成長を見込むとしている。【ポイント・注意点】決算の数字は四半期の実績であり、StickerPixは四半期の終盤に発売されたため、この期の売上への影響は限定的とされる。AI機能は便利だが、写真の扱いや生成結果の確認は利用者自身が行う必要がある。日本での販売時期や価格は別途確認したい。株や投資の判断材料として使う場合は、公式の決算資料もあわせて確認したい。カッティングマシンでの制作は、材料と刃、マットの組み合わせで仕上がりが大きく変わる。","2026-11-04","MarketBeat","https://www.marketbeat.com/instant-alerts/transcript-what-cricut-crct-said-on-its-q3-earnings-call-2026-11-03/"],["StickerPixの体験ポップアップ、シドニーで11月12〜15日開催","Cricutの新しいステッカー・写真プリント機器StickerPixを体験できるポップアップが、シドニーのWestfield Chatswoodで11月12日から15日まで開かれる。来場者は自分の写真から無料のカスタムステッカーシートを作れる。寄付するカード作りや賞品、コンテストも用意された期間限定イベントだ。 クリスマスシーズンの制作に向け、参考になる情報が多い。 カッティングマシンを使う人の制作の幅を広げる内容だ。","\n【概要】Cricutの新しいステッカー・写真プリント機器StickerPixを体験できるポップアップが、オーストラリアのシドニーで2026年11月12日から15日まで開かれる。来場者は自分の写真から無料のカスタムステッカーシートを作れる。4日間の期間限定イベントとして案内された。【背景】StickerPixはCricutにとって2014年以来の新しい接続機器のカテゴリーで、家庭でフルカラーのステッカーや写真プリントを作れる点が特徴だ。新しい機器は実際に触ってみないと使い勝手が分かりにくいため、ショッピングモールでの体験イベントが購入のきっかけとして重視されている。写真を使ったその場での制作体験が中心になる。【詳細】ポップアップはシドニーのWestfield Chatswoodで、2026年11月12日木曜日から15日日曜日までの4日間開かれる。来場者はスマートフォンのカメラロールにある写真から、その場で無料のカスタムステッカーシートを数分で作れるという。あわせて、老人ホームや病院へ寄付するカード作りも用意され、作ったカードはCricutが送料を負担して大切な人へ送る。ステッカーの賞品やコンテストへの参加も案内されている。イベントの詳細は変更される場合があり、主催者の案内での確認が求められている。【ポイント・注意点】StickerPixは11月16日から日本でMakuakeでの先行販売が予定されるなど、各地で展開が進んでいる。無料のステッカー作りはその場の体験が中心で、持ち帰れる枚数や条件は現地の案内に従う必要がある。写真を使うため、自分の写真や他人の写った写真の扱いには注意したい。日本での販売や価格はMakuakeの案内で確認するのが確実だ。イベントの日時や場所は変更される場合があるため、出かける前に公式の案内を確認したい。カッティングマシンでの制作は、材料と刃、マットの組み合わせで仕上がりが大きく変わる。作る前に小さな試し切りをして、設定やサイズを確認しておくと失敗を減らせる。無料のデザインを使う場合は、利用条件や対応する機種を確かめてから取りかかると安心だ。","2026-11-04","Only Sydney","https://www.onlysydney.com.au/cricut-stickerpix"],["xTool C1実機レビュー、印刷・スキャン・カットを1台に","xToolの新しいカッティングマシンC1を2週間使った実機レビューが公開された。カラー印刷とスキャナー、刃によるカットを1台にまとめ、登録マークなしでプリント＆カットができる。米国価格は469ドルからで、インクカートリッジは59ドルとされる。Silhouette Cameo 5 Alphaとの比較も行われた。 クリスマスシーズンの制作に向け、参考になる情報が多い。 カッティングマシンを使う人の制作の幅を広げる内容だ。","\n【概要】xToolの新しいカッティングマシンC1を2週間使った実機レビューが公開された。カラーインクジェット印刷とスキャナー、刃によるカットを1台にまとめた点が特徴で、登録マークなしでプリント＆カットができる。Silhouette Cameo 5 Alphaとの比較も行われた。【背景】従来のプリント＆カットは、印刷した用紙の周りに登録マークを付け、カッターがそのマークを探して位置を合わせる方式が一般的だった。マークの分の余白が無駄になり、位置合わせの失敗も起きやすい。印刷とスキャン、カットを1台で済ませられれば、ステッカー作りの手間と失敗を減らせる。【詳細】C1はCMYKのインクジェット印刷とスキャナー、刃によるカットを1台にまとめた。レビューでは、xToolから送られたC1が10月27日に到着し、約2週間、2000人規模のイベント準備で実際に使われた。スキャナーはマット上の印刷物を読み取り、登録マークなしでカット位置を合わせる。ほかのプリンターで印刷したものや、xTool O1 Omni、eufyMake E1で印刷したものもスキャンしてカットできたという。価格は米国でBasicが469ドル、Deluxeが539ドル。Atomm Pro会員になると399ドルと469ドルになる。英国ではBasicが449ポンド、Deluxeが499ポンドとされる。インクカートリッジは米国で59ドルで、2027年1月の発売とされる。米国では12月中旬からの出荷とされる。刃は4種で、紙やビニールから革、バルサ材、布まで対応する。マットは12×12インチだ。【ポイント・注意点】インクやマットの価格、消耗品の入手性は地域によって異なるため、購入前に確認したい。レビューは提供機によるもので、長期の耐久性はまだ分からない。CricutやSilhouetteからの乗り換えを考える場合は、対応するファイル形式やソフトの使い勝手、刃やマットの互換性を確かめるとよい。カッティングマシンでの制作は、材料と刃、マットの組み合わせで仕上がりが大きく変わる。作る前に小さな試し切りをして、設定やサイズを確認しておくと失敗を減らせる。","2026-11-13","Maker Hacks","https://www.makerhacks.com/xtool-c1-review/"],["xTool C1ガイド、印刷とカットの使い勝手を解説","xTool C1の使い方をまとめたガイドが11月11日に公開された。内蔵のインクジェットとスキャナーで印刷とカットを1台で行え、最大3mmまでの材料に対応する。価格はCricut Maker 5と同程度で、インクカートリッジは59ドルとされる。CricutやSilhouetteとの比較も示された。 クリスマスシーズンの制作に向け、参考になる情報が多い。 カッティングマシンを使う人の制作の幅を広げる内容だ。","\n【概要】xTool C1の使い方をまとめたガイドが2026年11月11日に公開された。内蔵のインクジェットプリンターとスキャナーが特徴で、CricutやSilhouetteのユーザーにも分かりやすい比較が示された。カットやスコア、箔押し、描画など、これまでのカッティングマシンの機能も備える。【背景】xToolはレーザー加工機などで知られ、カッティングマシン市場への参入は新しい動きだ。CricutやSilhouetteのユーザーは、使い慣れたソフトや材料、刃の互換性を気にする。C1がどこまで従来の作業を置き換えられるか、価格や消耗品の条件とあわせて確かめる必要がある。【詳細】C1は内蔵のインクジェットプリンターとスキャナーを備え、印刷とカットを1台で行える。熱転写インクジェットカートリッジで4色CMYK印刷ができ、xToolのDURAラベル素材では防水のデザインも作れるという。カットやスコア、箔押し、描画にも対応する。適切な刃とマットを使えば、最大3mmまでの材料を切れるとされ、Cricutの最新機Maker 5と同等とされる。大きさはMaker 5より大きく、重さも約2ポンド重い。価格はBasicとDeluxeでMaker 5と同程度とされる。インクカートリッジの交換費用は59ドルで、A4のフルページ印刷を最大100枚まで行えるとされる。他社製の材料にも対応するが、自動認識はされない。ガイドはxToolの提供によるものだが、意見は筆者自身のものとされている。【ポイント・注意点】インクの持ちや印刷の解像度は、使う素材や設定で変わる。提供による記事のため、長期の使用感や不具合の情報は別途確認したい。乗り換えを考える場合は、対応するファイル形式やソフトの操作感、消耗品の価格を確かめるとよい。3mmまでの切断は刃とマットの組み合わせ次第で、材料の密度によっては切れない場合もある。 カッティングマシンでの制作は、材料と刃、マットの組み合わせで仕上がりが大きく変わる。 作る前に小さな試し切りをして、設定やサイズを確認しておくと失敗を減らせる。","2026-11-11","First Day of Home","https://www.firstdayofhome.com/xtool-color-cutter/"],["クリスマスクラフト企画、20日間毎日無料SVGを配布","クリスマスに向けたペーパークラフト企画「Christmas Craft Countdown」が11月11日から始まった。20日間、毎日1つの新しいプロジェクトが届き、カットファイルは公開から24時間は無料でダウンロードできる。SVGやDXF、EPS、PNG形式で、CricutのDesign Spaceでの使用を想定して作られている。 クリスマスシーズンの制作に向け、参考になる情報が多い。","\n【概要】クリスマスに向けたペーパークラフトの企画「Christmas Craft Countdown」が、2026年11月11日から始まった。20日間にわたり毎日1つの新しいプロジェクトが届き、カットファイルは公開から24時間は無料でダウンロードできる。SVGやDXF、EPS、PNG形式で提供される。【背景】クリスマスの手作りは、オーナメントやカード、ギフトタグなど作るものが多く、デザイン探しに時間がかかる。毎日1つずつ届く企画は、作るペースを作りやすく、季節の制作を楽しむきっかけになる。無料期間が24時間と短いため、毎日の確認が欠かせない仕組みだ。【詳細】企画に参加するには無料のチケットに申し込み、メールアドレスを登録する。2026年11月11日水曜日から20日間、毎日メールでその日のプロジェクトが届く。カットファイルは公開から24時間は無料でダウンロードでき、その時間を過ぎると無料では手に入らなくなる。作り方の解説は24時間を過ぎても無料で見られる。すべてのカットファイルは2026年版のために新しく作られたものだ。各デザインはSVG、DXF、EPS、PNG形式で提供され、CricutのDesign Spaceで切ることを想定して作られている。20のプロジェクトのうち14は、小さくしてCricut JoyやJoy 2でも切れるとされる。すべてのファイルをすぐに手に入れたい人向けに、有料のInstant Access Bundleも用意され、30の限定デザインが含まれる。【ポイント・注意点】無料で手に入れるには、メールが届いた当日にダウンロードする必要がある。24時間を過ぎると無料では入手できないため、見逃しに注意したい。メールアドレスの登録が必要で、迷惑メールフォルダに届く場合もある。ファイルはCricut向けに作られているが、DXFやSVGが使える他の機種でも試せる場合がある。作る前に材料と刃の組み合わせを確認したい。 カッティングマシンでの制作は、材料と刃、マットの組み合わせで仕上がりが大きく変わる。 作る前に小さな試し切りをして、設定やサイズを確認しておくと失敗を減らせる。","2026-11-11","Craft with Sarah","https://craftwithsarah.lpages.co/christmas26"],["無料クリスマスSVG 25件超、オーナメントやカード作り","Jennifer Makerによるクリスマス工作のまとめが更新され、25以上の無料プロジェクトが紹介された。オーナメントやカード、ギフトタグ、手作りギフト、季節の飾りなど、無料のSVGファイルと作り方がまとめられている。2026年11月6日に始まったMerry Maker Mingle 2026にあわせた内容だ。 クリスマスシーズンの制作に向け、参考になる情報が多い。","\n【概要】Jennifer Makerによるクリスマス工作のまとめが更新され、25以上の無料プロジェクトが紹介された。オーナメントやカード、ギフトタグ、手作りギフト、季節の飾りなど、無料のSVGファイルと作り方をまとめたものだ。2026年11月6日に始まったMerry Maker Mingle 2026にあわせた内容だ。【背景】クリスマスの手作りは、作りたいものが決まっても、無料のデザインと作り方を探すのに手間がかかる。材料や道具、ファイルの入手方法がまとまっていると、初めての人でも取りかかりやすい。季節のイベントにあわせて、毎年新しいプロジェクトが追加される。【詳細】まとめでは25以上の無料クリスマスプロジェクトが紹介され、それぞれの作り方には無料のデザインや型紙、材料の一覧、作り方の説明が付けられている。木や陶器、ガラス、紙で作るオーナメントや、ビニールで文字を入れる飾りなどが挙げられている。Cricut Joy向けに小さくした版があるものもある。無料のデザインは、筆者の無料リソースライブラリーから手に入れる仕組みで、登録用のフォームからパスワードを受け取る。SVGファイルの扱いに慣れていない人向けに、解凍とDesign Spaceへの読み込み方法の案内もある。Merry Maker Mingle 2026は2026年11月6日に始まり、25のプロジェクトすべてをすぐに見たい人向けにVIP Passも用意されている。FacebookのCricut Crafters and Makersグループでの質問も案内されている。【ポイント・注意点】無料のデザインを手に入れるには登録が必要で、デザイン番号と入手方法は各プロジェクトの作り方に書かれている。ファイルの利用条件はプロジェクトごとに異なる場合があるため、販売目的で使う場合は確認したい。材料や刃、マットの組み合わせはプロジェクトごとに指定があるため、作る前に一覧を確認するとよい。 カッティングマシンでの制作は、材料と刃、マットの組み合わせで仕上がりが大きく変わる。","2026-11-06","Jennifer Maker","https://jennifermaker.com/25-free-christmas-craft-projects/"],["冬の帽子オーナメントの無料SVG、クリスマス向けに公開","カードストックで作る冬の帽子型オーナメントの無料SVGが11月13日に公開された。Merry Christmasの文字とハート、雪の結晶が入り、名前や年を加えて自分用に変えられる。Cricut Explore Air 2とカードストック、熱転写ビニールで作られた。無料ライブラリーからの入手になる。 クリスマスシーズンの制作に向け、参考になる情報が多い。 カッティングマシンを使う人の制作の幅を広げる内容だ。","\n【概要】カードストックで作る冬の帽子型オーナメントの無料SVGが、2026年11月13日に公開された。Merry Christmasの文字とハート、雪の結晶が入ったデザインで、名前や年を入れて自分用に変えられる。Cricut Explore Air 2とカードストック、熱転写ビニールで作られた。【背景】クリスマスのオーナメントは、ツリーに飾るだけでなく、ギフトタグや小さな贈り物にも使える。カードストックとカッティングマシンがあれば、色や文字を変えて何個も作れる。無料のSVGは、初めての人でも気軽に試せるきっかけになる。【詳細】このSVGにはMerry Christmasの文字とハート、雪の結晶が含まれ、文字を変えたり、名前や年を加えたりできる。カードストックの色や柄紙を変えることで、1つずつ違う仕上がりにできる。帽子は2種類の形があり、色の違うカードストックを重ねたものや、柄紙1枚で作るものが選べる。作例ではCricut Explore Air 2とカードストック、文字部分に熱転写ビニールが使われた。無料ファイルはDesign #292として、サイトの無料ライブラリーから手に入れる仕組みで、パスワードを受け取るために無料クラブへの登録が必要だ。サイトの無料ファイルは個人利用と商用利用ができるとされている。あわせて、6種類のオーナメントをまとめた無料バンドルも紹介されている。【ポイント・注意点】無料ファイルの入手には登録が必要で、パスワードの受け取り方法はサイトの案内に従う必要がある。商用利用の条件はサイトの記載を確認したい。カードストックの厚さや刃の設定は、使う材料に合わせて試し切りで確かめるとよい。熱転写ビニールを使う場合は、アイロンやヒートプレスの温度と時間を確認したい。 カッティングマシンでの制作は、材料と刃、マットの組み合わせで仕上がりが大きく変わる。 作る前に小さな試し切りをして、設定やサイズを確認しておくと失敗を減らせる。 無料のデザインを使う場合は、利用条件や対応する機種を確かめてから取りかかると安心だ。","2026-11-13","Main Road Digital Creations","https://mainroaddigitalcreations.com/free-christmas-hat-ornament-svg/"],["サンタプレート用の無料SVG、クリスマスイブ向けに公開","クリスマスイブの定番、サンタへのお菓子をのせるプレート用の無料SVGが11月9日に公開された。きれいな線とクラシックな書体が特徴で、プレートの大きさに合わせて調整できる。Cricut JoyやMaker、Exploreに対応し、登録なしで無料ダウンロードできる。 クリスマスシーズンの制作に向け、参考になる情報が多い。 カッティングマシンを使う人の制作の幅を広げる内容だ。","\n【概要】クリスマスイブの定番として、サンタへのお菓子をのせるプレート用の無料SVGが2026年11月9日に公開された。きれいな線とクラシックな書体が特徴で、家族で作る季節の行事に使える。Cricut JoyやMaker、Exploreに対応する。【背景】クリスマスイブにサンタへのお菓子やミルクを置く習慣は、子どもと一緒に楽しむ家庭の行事として親しまれている。市販のプレートに文字を入れるだけでも特別感が出るが、デザインを探す手間がかかる。無料のSVGがあれば、家にあるプレートや木製トレイを使って手軽に作れる。【詳細】このSVGは、すっきりした線とクラシックな季節の書体で作られ、プレートの大きさに合わせて拡大や縮小ができる。光沢のある permanent ビニールを陶器のプレートやマグに貼ったり、屋外用の粘着ビニールを木製のサービングトレイに貼ったりする使い方が紹介されている。クッションカバーやツリーのオーナメント、トートバッグ、看板などへの応用も挙げられている。ファイルは無料でダウンロードでき、登録は不要とされる。Cricut Joyのほか、MakerやExploreにも対応する。利用は個人の工作向けで、作ったものを贈ることはできるが、デジタルファイル自体の再販や再配布はできないとされる。SVGの動作確認にはSVG Doctorの利用も案内されている。【ポイント・注意点】ビニールを貼る面は、油分やほこりを落としてから貼ると長持ちする。陶器やガラスに貼る場合は、洗うときの扱いに注意したい。ファイルは個人利用が前提で、デジタルファイルの再販や再配布はできない。プレートの大きさに合わせてサイズを調整し、試し貼りで確認するとよい。 カッティングマシンでの制作は、材料と刃、マットの組み合わせで仕上がりが大きく変わる。 作る前に小さな試し切りをして、設定やサイズを確認しておくと失敗を減らせる。 無料のデザインを使う場合は、利用条件や対応する機種を確かめてから取りかかると安心だ。 季節の制作は早めに準備を始めることで、材料の手配や試作に余裕を持てる。","2026-11-09","Crafty Crafter Club","https://crafty-crafter.club/christmas/santa-plate-svg-for-cricut/"]],"uv":[["ローランドDG、UVプリンターカッターTrueVis MG2を発表","ローランドDGが11月11日、大判UVプリンターカッターの新シリーズTrueVis MG2を発表した。64インチと30インチの2機種で、UV印刷と輪郭カットを1台にまとめた。従来機と比べ約2倍の生産性をうたい、最大5層の重ね刷りで立体的な表現もできる。 UV印刷の用途や価格帯を知るうえで参考になる内容だ。 小さな工房や個人の制作販売にも関わる話題である。 導入前には仕様や費用を確かめておきたい。","\n【概要】ローランドDGは2026年11月11日、大判UVプリンターカッターの新シリーズTrueVis MG2を発表した。64インチのMG2-640と30インチのMG2-300の2機種で、UV印刷と輪郭カットを1台にまとめた。従来のMGシリーズと比べて約2倍の生産性をうたう。【背景】UV印刷は、看板やステッカー、パッケージの試作、販促物など、付加価値の高い用途への広がりが期待されている。印刷とカットを別々の工程にすると手間と時間がかかり、色の再現や立体感のある表現も求められる。1台で印刷からカットまで行えれば、生産の流れを短くできる。【詳細】MG2シリーズは新開発のプリントヘッドと波形制御技術により、印刷速度とインクの着弾精度を高めた。ローランドDGのVariable Dot TechnologyとTrue Rich Color設定により、細かい図柄や滑らかなグラデーション、色の再現を支える。オプションのオレンジとレッドのインクで、標準のCMYKより広い色域を再現できる。1回の印刷でCMYKと白、グロスを合わせて最大5層まで重ねられ、テクスチャーやエンボス、立体的な効果を作れる。72のテクスチャーライブラリーが内蔵されている。印刷と輪郭カットを1つの流れにまとめ、巻き取り装置の刷新で連続生産を支える。自動のメディア設定と調整、自動の布ワイパー、1000mlのインクパウチにより、交換の手間と運用コストを減らす。VersaWorks 7のRIPソフトとRoland DG Connectによる遠隔監視にも対応する。【ポイント・注意点】生産性が約2倍というのはメーカーの発表によるもので、使うメディアや図柄、設定で変わる。導入時には実際の仕事で試し、色の再現やカットの精度、運用コストを確認したい。UVインクの扱いや換気、メンテナンスの条件も事前に確かめる必要がある。DIYや小規模工房では大判機の導入は難しいが、印刷とカットを1台で済ませる考え方は、卓上UV機の選び方にも参考になる。UVプリンターの導入では、印刷できる大きさや材料だけでなく、インクや消耗品の費用も考える必要がある。","2026-11-11","Impressions Magazine","https://impressionsmagazine.com/news/roland-dg-truevis-mg2-series-uv-printer-cutters/170988/"],["LONGER、デスクトップUVプリンターePrintを販促の中心に","LONGERが2026年のブラックフライデーにあわせ、デスクトップUVプリンターePrintを前面に出した販促を始めた。Epson F1080ヘッドを2つ備え、フルカラーと最大15mmの盛り上げ印刷に対応する。11月3日から12月2日まで最大48％の割引が案内された。 UV印刷の用途や価格帯を知るうえで参考になる内容だ。 小さな工房や個人の制作販売にも関わる話題である。","\n【概要】LONGERは2026年のブラックフライデーにあわせ、デスクトップUVプリンターePrintを前面に出した販促を始めた。3Dプリンターやレーザー彫刻機と並べ、UV印刷で机上の制作の幅を広げる内容だ。2026年11月14日に報じられた。【背景】机上の制作では、3Dプリンターで形を作り、レーザーで彫刻し、UVプリンターで色や質感を付ける組み合わせが広がっている。UVプリンターは木や金属、アクリルなどに直接印刷でき、立体的な盛り上げもできるため、小さな工房や個人の制作販売での活用が期待されている。価格と使い勝手が導入の分かれ目になる。【詳細】LONGERは2016年に設立され、デスクトップの3Dプリンターやレーザー彫刻機、UV印刷機を手がけている。ePrintはEpson F1080のプリントヘッドを2つ備え、12のインクチャンネルでフルカラー印刷と立体的な表現に対応する。最大15mmまでの盛り上げ印刷ができるとされる。ブラックフライデーの販促では、2026年11月3日から12月2日まで最大48％の割引が案内された。ePrint Single UVは2499ドルから1899ドル、ePrint Dual UVは3299ドルから2499ドル、ePrint UV + DTは3299ドルから2699ドルとされる。クーポンを使うとさらに割引になる場合がある。【ポイント・注意点】記事は販促の紹介であり、実機の独立した検証ではない。割引価格は期間や地域、クーポン条件で変わるため、購入前に公式ページで確認したい。盛り上げの高さや色の再現は、使う材料や設定で変わる。UVインクの扱いや換気、メンテナンスの手間も事前に確かめる必要がある。DIYや小規模工房では、印刷できる大きさと材料、消耗品の価格を自分の作るものに照らして選ぶとよい。UVプリンターの導入では、印刷できる大きさや材料だけでなく、インクや消耗品の費用も考える必要がある。換気やメンテナンスの条件も事前に確かめ、作業環境に合うかどうかを見極めたい。作りたいものの大きさや量に合った機種を選ぶことで、無駄な出費を抑えられる。","2026-11-14","Armchair Arcade","https://armchairarcade.com/perspectives/2026/11/13/desktop-manufacturing-maker-workshop/"],["Mutohの新型UVフラットベッド、速度約2.1倍で登場","ColDesiが、Mutohの新しいUVフラットベッドプリンターXpertJet 661UF Proの取り扱いを始めた。従来機の後継で、印刷速度が約2.1倍になったとされる。最大19×24インチの印刷面積で、厚さ6インチまでのものに対応する。販促品や記念品、小判の看板などへの活用が見込まれる。 UV印刷の用途や価格帯を知るうえで参考になる内容だ。 小さな工房や個人の制作販売にも関わる話題である。","\n【概要】ColDesiは、Mutohの新しいUVフラットベッドプリンターXpertJet 661UF Proの取り扱いを始めた。従来の661UFの後継機で、印刷速度が約2.1倍になったとされる。2026年11月2日に発表された。【背景】販促品や記念品、看板などの小ロット印刷では、短納期と多品種への対応が求められる。UVフラットベッドは、木や金属、アクリルなどさまざまな材料に直接印刷できるため、1台で幅広い仕事をこなせる。速度と精度、メンテナンスのしやすさが導入の決め手になる。【詳細】XpertJet 661UF Proは、A2判より少し大きいサイズのUVフラットベッドプリンターで、従来機の661UFに代わるモデルだ。印刷速度は従来機の約2.1倍、点字の印刷は約1.5倍速いとされる。MutohのAccuFine HD Proプリントヘッドを使い、鉄とアルミを組み合わせた頑丈な筐体と、強化されたUV-LED硬化システムを備える。最大の印刷面積は約19×24インチで、厚さ最大6インチ、重さ約17.6ポンドまでのものに対応する。販促品や記念品、賞状、盾、小判の看板、工業製品のマーキング、盛り上げや点字の印刷などが用途として挙げられている。ColDesiを通じて購入できる。【ポイント・注意点】速度が約2.1倍というのはメーカーの発表によるもので、使う図柄や印刷条件で変わる。導入時には実際の仕事で試し、色の再現や盛り上げの仕上がり、メンテナンスの手間を確認したい。UVインクの扱いや換気の条件も事前に確かめる必要がある。DIYや小規模工房では業務機の価格や大きさが合わない場合が多いが、印刷できる材料の幅と厚さを確かめる視点は、卓上UV機の選び方にも生かせる。UVプリンターの導入では、印刷できる大きさや材料だけでなく、インクや消耗品の費用も考える必要がある。換気やメンテナンスの条件も事前に確かめ、作業環境に合うかどうかを見極めたい。作りたいものの大きさや量に合った機種を選ぶことで、無駄な出費を抑えられる。購入前には公式の仕様と価格を確認し、実際の作例やレビューも参考にするとよい。","2026-11-02","ColDesi","https://coldesi.com/news/coldesi-expands-commercial-uv-printer-lineup-with-the-new-mutoh-xpertjet-661uf-pro/"],["eufyMake E1、実際の印刷400万回を突破","AnkerのeufyMakeが、UVプリンターE1の実際の印刷回数が400万回を超えたと11月12日に発表した。発売から1年、無料のソフト更新で速度やまとめて作る作業が改善された。ブラックフライデーでは11月11日から30日まで、Basic Bundleが1799ドルで販売される。 UV印刷の用途や価格帯を知るうえで参考になる内容だ。 小さな工房や個人の制作販売にも関わる話題である。","\n【概要】AnkerのeufyMakeは、UVプリンターE1の実際の印刷回数が400万回を超えたと2026年11月12日に発表した。世界初の個人向け3DテクスチャーUVプリンターとうたうE1は、発売から1年、無料のソフト更新を重ねてきた。ブラックフライデーでの値下げも案内された。【背景】E1はKickstarterで1万7822人の支援を集め、最も資金を集めたプロジェクトになったとされる。個人や小さな工房向けのUVプリンターとして、発売後の使い勝手の改善が続けられてきた。印刷回数の実績は、実際に使われているかどうかの目安になる。【詳細】E1は2026年11月12日時点で、実際の印刷回数が400万回を超えた。1年間の無料ソフト更新により、印刷速度の向上や制作の簡略化、まとめて作る作業の改善が進められたとされる。核となる仕様は、最大5mmまでのAmass3Dテクスチャー印刷、最大1440dpiのColorMaestro色管理、300種以上の材料への対応、円筒物用のロータリー、最大10mまで連続印刷できるロール・トゥ・フィルムだ。ブラックフライデーとサイバーマンデーでは、2026年11月11日から30日まで、Basic Bundleが通常2409ドルから1799ドルで販売される。Deluxe Plus Bundleは3709ドルから2699ドルとされる。価格は米国の案内に基づく。【ポイント・注意点】400万回という数字はメーカーの発表によるもので、1台あたりの使用回数ではない。値下げは期間と地域で変わるため、購入前に公式ページで確認したい。UVプリンターはインクや材料、メンテナンスの費用が別にかかる。DIYや小規模工房では、印刷できる大きさと材料、消耗品の価格を自分の作るものに照らして選ぶとよい。UVプリンターの導入では、印刷できる大きさや材料だけでなく、インクや消耗品の費用も考える必要がある。換気やメンテナンスの条件も事前に確かめ、作業環境に合うかどうかを見極めたい。作りたいものの大きさや量に合った機種を選ぶことで、無駄な出費を抑えられる。購入前には公式の仕様と価格を確認し、実際の作例やレビューも参考にするとよい。","2026-11-12","EIN News","https://www.einnews.com/pr_news/956308906/eufymake-uv-printer-e1-marks-4-million-real-world-prints-and-a-year-of-ongoing-improvements"],["Morpho UVプリンター、出荷見直しで遅れて参加は値上がり","デスクトップUVプリンターMorphoのクラウドファンディング後の動きをまとめた記事が公開された。キャンペーンは10月14日に終了し、遅れて参加する人向けの価格は2159ドルからで、出荷は2027年5月の見込みとされた。11月6日の更新では生産と出荷の見直しが進められ、新しい日付は示されなかった。 UV印刷の用途や価格帯を知るうえで参考になる内容だ。 小さな工房や個人の制作販売にも関わる話題である。","\n【概要】デスクトップUVプリンターMorphoのクラウドファンディング後の動きをまとめた記事が公開された。キャンペーンは2026年10月14日に終了し、遅れて参加する人向けの価格が上がり、出荷時期も2027年5月の見込みとされた。11月6日の更新では、生産と出荷の見直しが進められているとされた。【背景】クラウドファンディングのUVプリンターは、量産前の仕様変更や出荷の遅れが起きやすい。支援する側は、価格や出荷時期、仕様の変更をこまめに確かめる必要がある。Morphoは支援者への更新で、生産の準備と出荷計画の見直しを伝えている。【詳細】Morphoのキャンペーンは2026年10月14日午前10時59分に終了し、目標の5万ドルを達成した。遅れて参加する人向けの価格は、F1080 Standard Packが2159ドル、i3200 Pro Packが3999ドルで、出荷は2027年5月の見込みとされた。キャンペーン中の特別価格は1999ドルと3299ドルで、出荷は2026年12月の見込みだった。11月6日の更新では、柔軟な白インクがまだ試験中であることや、生産ラインの準備とともに出荷計画を見直していることが伝えられ、新しい日付は示されなかった。10月16日の更新では、出荷版のハードウェア変更として、小さなカメラに代わるCISモジュールの採用が伝えられ、最大の印刷幅は330mmから約310〜320mmに狭まるとされた。公式サイトの仕様表には330×220mmと残っている。双方向印刷への対応も伝えられたが、速度や品質の数値は示されていない。【ポイント・注意点】クラウドファンディングへの参加は、在庫のある商品の購入とは違う。製造や印刷品質、ソフトの安定性、サポート、納期はいずれも未確認だ。返金の完了はメーカー側の主張で、独立には確認されていない。参加を考える場合は、仕様の変更と出荷時期の不確かさを理解したうえで、公式の更新を確かめたい。UVプリンターの導入では、印刷できる大きさや材料だけでなく、インクや消耗品の費用も考える必要がある。換気やメンテナンスの条件も事前に確かめ、作業環境に合うかどうかを見極めたい。","2026-11-09","The Crafty Catsman","https://www.thecraftycatsman.com/news/morpho-uv-printer-kickstarter-launch-2026/"],["インド初のWeigang UVフレキソ機ZJR-450Eを導入","インドのラベル印刷会社Nitikshaa Label Techが、Weigangの新しいUVフレキソ印刷機ZJR-450Eをインドで初めて導入した。8色のサーボ駆動インライン機で、12ミクロンの薄いフィルムから400gsmの板紙まで幅広く印刷できる。2026年11月14日に報じられた。 UV印刷の用途や価格帯を知るうえで参考になる内容だ。 小さな工房や個人の制作販売にも関わる話題である。","\n【概要】インドのラベル印刷会社Nitikshaa Label Techが、Weigangの新しいUVフレキソ印刷機ZJR-450Eをインドで初めて導入した。8色のサーボ駆動インライン機で、ラベルやパッケージの多様な仕事に対応する。2026年11月14日に報じられた。【背景】ラベルやパッケージの印刷では、薄いフィルムから厚い板紙まで、さまざまな素材に安定して印刷できることが求められる。インラインのフレキソ印刷機は、印刷から加工までを1つの流れで行えるため、短納期や多品種への対応に強みがある。新しい機種の導入は、受注できる仕事の幅を広げるきっかけになる。【詳細】WeigangのZJR-450Eは、最近発表されたEシリーズのインライン・フレキソ印刷機で、インドでの初導入がコインバトールのNitikshaa Label Techで行われた。8色のサーボ駆動で、12ミクロンの薄いフィルムから400gsmの板紙まで、幅広い素材に印刷できるとされる。印刷スリーブ技術により、版の交換や素材の切り替えをしやすくしている。同社のGuru Prasanth氏は、Labelexpoの展示でこの機械が多様な仕事をこなす様子を見たと述べている。WeigangのZJR-Gシリーズは、印刷スリーブ方式を採用した中国初のフレキソ印刷機とされる。同社は全回転式と間欠式のUVオフセットラベル印刷機も手がけている。【ポイント・注意点】導入事例の数字はメーカーや導入企業の発表によるもので、自分の仕事での再現性は別途確認が必要だ。業務用のフレキソ印刷機は価格や設置面積、運用の手間が大きく、個人や小さな工房が直接導入するものではない。ただし、薄いフィルムから厚い板紙まで1台で扱う考え方は、UV印刷で扱う材料の幅を考えるうえで参考になる。 UVプリンターの導入では、印刷できる大きさや材料だけでなく、インクや消耗品の費用も考える必要がある。 換気やメンテナンスの条件も事前に確かめ、作業環境に合うかどうかを見極めたい。 作りたいものの大きさや量に合った機種を選ぶことで、無駄な出費を抑えられる。","2026-11-14","PRESSIdeas","https://pressideas.com/nitikshaa-label-tech-installs-indias-first-weigang-zjr-450e/"],["Prodways、UV出力を高めたセラミック3Dプリンターを追加","フランスのProdwaysが、セラミック3DプリンターCERAM PROシリーズに、UV出力を高めたCERAM PRO 365 MAXを追加した。365ナノメートルの光源で最大200ミリワット毎平方センチメートルの照射強度をうたい、セラミック材料の開発に向けた機種とされる。2026年11月10日に報じられた。 UV印刷の用途や価格帯を知るうえで参考になる内容だ。 小さな工房や個人の制作販売にも関わる話題である。","\n【概要】フランスのProdwaysは、セラミック3DプリンターCERAM PROシリーズに、UV出力を高めたCERAM PRO 365 MAXを追加した。独自のMOVINGLight技術とDLP方式を用い、セラミック材料の開発に向けた機種とされる。2026年11月10日に報じられた。【背景】セラミックの3Dプリントでは、光で樹脂を固める工程で使うUVの強さが、扱える材料の幅を左右する。UVが強いほど、固まりにくい樹脂や新しいセラミック材料の開発に挑戦しやすくなる。ただし、光の吸収や重合の挙動、材料の組成も関わるため、UVの強さだけで印刷時間が短くなるとは限らない。【詳細】CERAM PRO 365 MAXは、365ナノメートルの波長の光源を使い、メーカーによると最大200ミリワット毎平方センチメートルの照射強度を実現する。独自のMOVINGLight技術とDLP方式を基盤とし、モジュール式のトップダウン構造を採用する。ネイティブの画素解像度は31マイクロメートルとされる。UV出力の向上により、セラミック材料の開発の幅が広がるとされる。ただし、メーカーは独立した性能データや比較測定を示しておらず、UVの強さがそのまま印刷時間の短縮につながるわけではないと記事では指摘されている。Formnext 2026での実演も案内されている。【ポイント・注意点】性能の数値はメーカーの発表によるもので、独立した検証はない。導入時には実際の材料で試し、仕上がりと再現性を確認したい。UVプリンター全般に言えることだが、光源の強さだけで選ぶのではなく、扱える材料や解像度、運用コストをあわせて見ることが大切だ。DIYや小規模工房では産業機の導入は難しいが、UVの波長や強さが材料に与える影響を理解するうえで参考になる。 UVプリンターの導入では、印刷できる大きさや材料だけでなく、インクや消耗品の費用も考える必要がある。 換気やメンテナンスの条件も事前に確かめ、作業環境に合うかどうかを見極めたい。 作りたいものの大きさや量に合った機種を選ぶことで、無駄な出費を抑えられる。","2026-11-10","3Druck.com","https://3druck.com/en/printers-and-products/prodways-expands-its-ceramic-3d-printer-lineup-with-the-ceram-pro-365-max-featuring-higher-uv-power-08165433/"],["小さな工房のE1導入記、UV印刷で制作の流れが変化","米国の小さな工房が、eufyMakeのUVプリンターE1を導入した体験を11月5日に紹介した。ケーキトッパーやオーナメント、小さな看板の制作で使い始め、UV印刷が作業の流れを変えたという。最大1440dpiで、ロールや円筒物への印刷にも対応する。 UV印刷の用途や価格帯を知るうえで参考になる内容だ。 小さな工房や個人の制作販売にも関わる話題である。 導入前には仕様や費用を確かめておきたい。","\n【概要】米国の小さな工房が、eufyMakeのUVプリンターE1を導入した体験を2026年11月5日に紹介した。ケーキトッパーやオーナメント、小さな看板の制作で使い始め、UV印刷が作業の流れを変えたという。個人や家族経営の工房での実例になる。【背景】小さな工房では、ヒートプレスや転写紙を使わず、木やアクリル、金属などに直接印刷できるUVプリンターが注目されている。1台で平面と円筒、ロール状のものまで扱えれば、機械を増やさずに作れるものの幅が広がる。導入後の実際の使い勝手は、仕様だけでは分かりにくい。【詳細】この工房では、E1を導入してケーキトッパーやオーナメント、小さな看板を作っている。E1は小型のUVフラットベッドプリンターで、フルカラーのUV硬化インクを対象物に直接のせ、UV光で瞬時に硬化させる。色は最大1440dpiで、シアン、マゼンタ、イエロー、ブラックに白インクを加えた構成だ。印刷面積は330×420mmのA3級とされる。3つのモジュールが紹介され、ロール・トゥ・フィルムではUV DTFのロールを連続印刷し、ラベルやデカール、最大10mまでの長尺物を作れる。ラミネートとロータリーもあり、円筒物やフィルムへの印刷に対応する。レーザーカッターと仕上げ台の間に置かれ、平面とロール、円筒の仕事を同じインクでこなす。E1はKickstarterで最も資金を集めたプロジェクトになり、TIMEのBest Inventions of 2025にも選ばれたとされる。【ポイント・注意点】この記事は1つの工房の体験談であり、すべての工房で同じ結果が出るとは限らない。UVプリンターはインクや材料、メンテナンスの費用が別にかかる。導入前には、作りたいものの大きさと材料、1日の受注量に合うかどうかを確認したい。UVインクの扱いや換気の条件も事前に確かめる必要がある。 UVプリンターの導入では、印刷できる大きさや材料だけでなく、インクや消耗品の費用も考える必要がある。 換気やメンテナンスの条件も事前に確かめ、作業環境に合うかどうかを見極めたい。","2026-11-05","Makes & Crafts","https://www.makesandcrafts.com/blog/posts/eufymake-e1-uv-printer.html"],["UV DTFステッカー印刷の仕組みと費用、2026年版ガイド","UV DTFステッカープリンターの仕組みと費用をまとめたガイドが11月5日に更新された。UV硬化インクを接着フィルムに印刷し、ラミネートして硬い面に手で貼る方法で、衣服用のDTFとは別物だと説明された。機種別の価格帯も示された。 UV印刷の用途や価格帯を知るうえで参考になる内容だ。 小さな工房や個人の制作販売にも関わる話題である。 導入前には仕様や費用を確かめておきたい。","\n【概要】UV DTFステッカープリンターの仕組みと費用をまとめたガイドが2026年11月5日に更新された。UV硬化インクとワニスを接着フィルムに印刷し、ラミネートしたフィルムを硬い面に手で貼る方法で、衣服用のDTFとは別物だと説明されている。機種別の価格帯も示された。【背景】UV DTFは、ガラスや金属、木など硬い面にステッカーやデカールを貼る方法として注目されている。衣服用のDTFと混同されやすいが、工程も用途も違う。機種によって印刷とラミネートが1台で済むものと、別途ラミネーターが必要なものがあり、費用の見極めが大切になる。【詳細】UV DTFステッカー印刷は、UV硬化インクとワニスを接着用のAフィルムに印刷し、ラミネートしたBフィルムでデザインを運び、硬い面に手の圧力で貼る方法だ。ヒートプレスは使わない。機種別の価格は、2026年11月に確認された米国の価格として、オールインワン型が約6000〜7000ドル、小型UVフラットベッドが約2000〜12000ドルにラミネーター数百ドル、量産用のロール・トゥ・ロール型が約20000ドルとされる。代表的な機種として、Procolored VF13 Proは13インチ幅でCMYKと白、ワニスに対応し、ラミネートを内蔵する。eufyMake E1はUVフラットベッドで、ラミネーターは別途必要だ。xTool O1 OmniはUVとDTG、DTF、UV DTFの版がある。Mimaki UJV300DTF-75は量産用のロール・トゥ・ロール型だ。ColDesiではBフィルムの温度を190°Fとしている。【ポイント・注意点】価格は1機種の表示に基づく目安で、機種や地域で変わる。インクやフィルムの費用は別にかかり、現在のインク価格は確認できていないとされる。UV DTFは衣服には使えず、衣服には通常のDTFが必要だ。導入前には、作りたいものの大きさと量、ラミネーターの有無、消耗品の価格を確認したい。 UVプリンターの導入では、印刷できる大きさや材料だけでなく、インクや消耗品の費用も考える必要がある。","2026-11-05","The Printer Expert","https://theprinterexpert.com/uv-dtf-sticker-printer/"],["UVプリンター2026年版ガイド、E1を推奨機種に","2026年のUVプリンター選びのガイドが更新され、個人や小さな工房向けの機種が整理された。最も多くの作り手に合う機種としてeufyMake E1が挙げられ、汎用性の高さではxTool O1 Omniが挙げられた。価格は確認時点のもので、セールで変わるとされる。 UV印刷の用途や価格帯を知るうえで参考になる内容だ。 小さな工房や個人の制作販売にも関わる話題である。 導入前には仕様や費用を確かめておきたい。","\n【概要】2026年のUVプリンター選びのガイドが更新され、個人や小さな工房向けの機種が整理された。最も多くの作り手に合う機種としてeufyMake E1が挙げられ、汎用性の高さではxTool O1 Omniが挙げられた。2026年11月4日ごろの更新とされる。【背景】UVプリンターは機種が増え、印刷できる大きさや材料、価格、消耗品の条件が違うため、初めて買う人は何を基準に選べばよいか分かりにくい。印刷の仕上がりだけでなく、ランニングコストや対応する材料の幅も大切になる。ガイドは、作るものに合わせた選び方を整理する役割がある。【詳細】ガイドでは、多くの作り手や小さな工房に合う機種としてeufyMake E1が挙げられた。木や金属、アクリルなどにフルカラーで印刷でき、最大5mmまでの盛り上げに対応する。価格はインクなしで2109ドルとされ、2026年10月27日に確認された。セールでは、10月27日から11月10日まで1999ドルで200ドル分のギフト付き、11月11日から30日まで1799ドルとされる。最も汎用性が高い機種としてxTool O1 Omniが挙げられ、UVとDTG、DTFの版がある。A3級のProcolored V11 Proは、より大きな量を作る場合に適するとされる。E1は330×420mmの印刷面積で、テクスチャー印刷やロータリー、ロール・トゥ・フィルムに対応する。ガイドの筆者はいずれの機種も実機で検証しておらず、仕様に基づく内容だと明記されている。【ポイント・注意点】価格は確認時点のもので、セールや地域で変わる。ガイドは実機検証ではなく仕様に基づくため、購入前には実際の作例やレビューも確認したい。UVプリンターはインクや材料、メンテナンスの費用が別にかかる。導入前には、作りたいものの大きさと材料、1日の量に合うかどうかを確認するとよい。 UVプリンターの導入では、印刷できる大きさや材料だけでなく、インクや消耗品の費用も考える必要がある。 換気やメンテナンスの条件も事前に確かめ、作業環境に合うかどうかを見極めたい。","2026-11-04","Planet 3DP","https://planet3dp.com/best-uv-printers/"]],"risk":[["インフルエンザで1週間休んでも「欠席0日」の仕組み","インフルエンザで1週間休んでも、通知表の欠席日数は0日になることがある。学校には病気の欠席とは別に「出席停止」という扱いがあり、インフルエンザはその対象となっている。小学生は発症後5日を経過し、かつ解熱後2日を経過するまで登校できない。先生は毎朝、発熱による欠席と出席停止を区別して記録しており、休んだ子が不利にならないよう配慮されている。流行期にこそ知っておきたい、学校の休みの数え方を解説する。","\n【概要】インフルエンザにかかって1週間学校を休んでも、学期末の通知表では欠席0日になることがある。学校には、病気による欠席とは別に「出席停止」という数え方があり、インフルエンザの休みはここに入る。学期末に通知表の出欠欄を見て、不思議に思った保護者もいるのではないだろうか。休みの扱いを知っておくと、流行期の判断がしやすくなる。【背景】学校保健安全法施行規則で、インフルエンザは出席停止の対象とされている。小学生の場合、発症した後5日を経過し、かつ解熱した後2日を経過するまで登校できない。これは「休んでもいい」という許可ではなく、学校全体への感染拡大を防ぐために校長が登校を止める決まりだ。本人や家庭の都合で休む欠席とは性格がまったく違い、休んだ子が不利にならないよう記録の扱いも分けられている。出席停止は、感染症の広がりを防ぐための制度で、学校保健安全法施行規則に定められている。【詳細】指導要録という学校の正式な記録には、欠席日数とは別に「出席停止・忌引等の日数」という欄がある。出席停止の日数は「出席しなければならない日数」から除かれるため、欠席の数には影響しない。先生は毎朝、発熱による欠席なのかインフルエンザによる出席停止なのかを区別して記録し、学期末に数え直して通知表に写している。欠席0日の裏側には、この毎朝の丁寧な仕分けがある。出席停止の仕組みは、感染症で休む子を守るためのものだ。欠席と出席停止の区別は、先生が毎朝の健康観察の中で行っている。【ポイント・注意点】「休むと欠席が増えるから」と熱のある子を無理に登校させるのは避けたい。元教員の筆者は、無理をした1日の登校が学級全体の1週間を奪うこともあると指摘する。秋から冬は教室で一気に広がりやすい季節で、休むことを責めない仕組みは最初から学校に組み込まれている。体調が悪いときはしっかり休ませ、熱が下がっても決められた期間は様子を見ることが大切だ。登校の目安が分からないときは学校に相談すると安心だ。出席停止の期間が明けても、体調が万全でなければ無理は禁物だ。学校と連絡を取り合い、子どもの様子を見ながら登校を再開したい。","2026-11-14","Yahoo!ニュース エキスパート","https://news.yahoo.co.jp/expert/articles/6fca803e7ca124b5e2e0f48745032e0811c8d381"],["インフルエンザ患者数、再び4万人超に 3週連続増加","厚生労働省が11月13日に発表した11月2〜8日のインフルエンザ発生状況によると、定点医療機関からの報告数は4万1071人で、定点当たり11.00人となり、3週連続で増加した。休校や学年・学級閉鎖などの対応をとっている施設は全国で1325にのぼる。今シーズンは昨シーズンより1か月以上早く流行入りし、高い水準が続いている。今シーズンの流行はまだ続いており、手洗いや咳エチケットなどの基本的な対策が呼びかけられている。","\n【概要】厚生労働省は11月13日、11月2〜8日のインフルエンザ発生状況を発表した。定点医療機関からの報告数は4万1071人で、定点当たり11.00人となり、3週連続の増加で再び4万人を超えた。休校や学年・学級閉鎖などの対応をとっている施設は全国で1325にのぼる。流行は今も高い水準が続いている。【背景】今シーズンのインフルエンザは、昨シーズンより1か月以上早く流行入りし、その後も高い水準が続いている。第42週に一度減少した後、3週連続で増加傾向にある。前年同時期の8万4183人と比べると約半数だが、一昨年の同時期の5266人と比べると約8倍の規模で、流行が収束したわけではない。例年であれば年明けにかけて患者数が増える傾向もある。第45週の報告数は前週より約2800人増えており、3週連続の増加が続いている。【詳細】都道府県別では北海道が定点当たり28.32と突出して高く、東北でも秋田県16.56のほか、青森、岩手、宮城、山形、福島で18.36〜21.08と北日本で多い傾向だ。インフルエンザによる休校や学年閉鎖・学級閉鎖などの対応をとっている施設は、全国の保育園や幼稚園、小中学校などを合わせて1325ある。前週の2451施設より総数は減ったが、休校や学年閉鎖は増えている。全国の2人に1人が周りに風邪を引いた人がいると答える調査結果もあり、体調を崩す人が増えている。効果的な手洗いとして、石けんで泡を作り、手のひらや指の間、指先や爪、親指のつけ根、手首まで洗う方法が紹介されている。【ポイント・注意点】ウェザーニュースの調査では「周りに風邪を引いた人がいる」と答えた人が11月5〜6日は4割だったのに対し、11月12〜13日は5割に増えた。寒暖差が大きく空気も乾燥する時期で、体調を崩しやすい。こまめな手洗いや消毒、咳エチケットを続け、体調管理に気をつけたい。発熱などの症状が出たときは無理をせず、早めに休むことが大切だ。風邪とインフルエンザは同じではないが、体調を崩している人は増加傾向にある。暖房器具の使用による空気の乾燥にも注意が必要だ。","2026-11-13","ウェザーニュース","https://weathernews.jp/news/202611/130221/"],["石川・中能登の小学校で集団風邪 80人が発熱","石川県は11月13日、中能登町の鹿島小学校でインフルエンザとみられる集団風邪が発生したと発表した。1〜3年生151人のうち約半数の80人が発熱などの症状を訴え、学年閉鎖となった。石川県内の今シーズンの集団風邪の累計は63校1363人にのぼっている。低学年を中心に広がる流行に注意が必要だ。低学年の子どもは体調の変化を伝えにくいこともあり、家庭での見守りが大切だ。発熱などの症状を訴える児童が急増し、学年閉鎖の措置がとられた。","\n【概要】石川県は11月13日、中能登町の鹿島小学校でインフルエンザとみられる集団風邪が発生したと発表した。1〜3年生151人のうち、約半数にあたる80人が発熱などの症状を訴え、学年閉鎖となった。県内の今シーズンの集団風邪の累計は63校1363人にのぼっている。【背景】全国的にインフルエンザの流行が続く中、石川県内でも学校での集団発生が相次いでいる。県内では11月10日にも5校で計81人の集団風邪が報告されており、地域全体で広がりを見せている。低学年の子どもが多く通う小学校での発生が目立ち、家庭や学校での注意が求められる時期だ。11月10日には星稜高校や金沢市の小学校など県内5校で計81人の集団風邪が報告されていた。全国的にも学校での集団発生が各地で報告されている。【詳細】鹿島小では1〜3年生の低学年を中心に症状を訴える児童が急増し、151人のうち80人が発熱などの症状を示した。県は集団風邪として発表し、学校は学年閉鎖の措置をとった。インフルエンザとみられる症状が中心だが、確定診断ではなく「集団風邪」としての発表だ。学年閉鎖は、感染の広がりを抑えるための措置で、対象の学年の児童は登校を控えることになる。集団風邪の発表は、インフルエンザとみられる症状の広がりを受けて行われ、学年閉鎖で感染の拡大を抑える狙いがある。発熱などの症状を訴えた児童は、1〜3年生151人のうち80人にのぼった。【ポイント・注意点】低学年の子どもは体調の変化を言葉で伝えにくいこともあり、発熱やだるさなど小さな変化に早めに気づくことが大切だ。家庭では手洗いやうがい、十分な睡眠を心がけ、発熱があれば無理に登校させず医療機関に相談したい。学校からの連絡にも注意し、学級閉鎖や学年閉鎖などの措置が出た場合は速やかに対応したい。流行期には、子どもの様子をいつもより丁寧に見守りたい。登校前には体温や体調を確かめ、少しでも体調が悪いときは休ませることが大切だ。家庭内でも手洗いや換気を心がけたい。学級閉鎖や学年閉鎖の連絡が来たときは、速やかに迎えや預かりの手配をしたい。","2026-11-13","47NEWS（北國新聞）","https://www.47news.jp/15225636.html"],["岡山県内5校園で集団風邪 患者75人","岡山県などは11月13日、5つの学校・幼稚園でインフルエンザとみられる集団風邪が発生したと発表した。患者は合わせて75人で、最長で11月16日まで学年・学級閉鎖する。岡山県内では11月12日にも5つの小学校で患者65人の集団風邪が発表されており、学校での流行が続いている。県内では11月に入って学校での集団風邪の発表が相次いでおり、子どもを中心とした流行が続いている。家庭でも体調の変化に注意したい。","\n【概要】岡山県などは11月13日、5つの学校・幼稚園でインフルエンザとみられる集団風邪が発生したと発表した。患者は合わせて75人で、最長で11月16日まで学年・学級閉鎖する。県内では学校での集団発生が連日続いており、子どもを中心とした流行が続いている。【背景】岡山県内では11月12日にも5つの小学校で患者65人の集団風邪が発表されており、学校での流行が連日続いている。県内では11月に入って学校での集団風邪の発表が相次いでおり、例年より早い時期から流行が広がっている。幼稚園から高等学校まで幅広い施設で発生が報告されている。県内では11月10日にも7校で集団風邪が報告されており、学校での発生が続いている。岡山県内ではインフルエンザ注意報が過去2番目に早い時期に発令されたと報じられている。【詳細】13日に発表された5校園は、県立の小学校では備前市の東鶴山小学校と吉備中央町の加賀南小学校、岡山市では岡山聖園幼稚園、高島小学校、瀬戸南高等学校だ。患者は合わせて75人で、学年閉鎖や学級閉鎖の措置がとられている。いずれもインフルエンザとみられる症状による集団風邪としての発表で、最長で11月16日まで閉鎖が続く。閉鎖の措置は最長で11月16日までで、学年閉鎖や学級閉鎖の形で実施されている。患者の症状はインフルエンザとみられるものが中心だ。【ポイント・注意点】学校での集団発生が続く時期は、家庭でも子どもの体調変化に注意したい。発熱や咳などの症状が出たら早めに休ませ、医療機関に相談する。手洗いやうがい、マスクの着用といった基本的な感染対策を続け、学校からの連絡や閉鎖情報もこまめに確認しておきたい。きょうだいがいる家庭では、家庭内での広がりにも気をつけたい。発熱や咳などの症状が出たら早めに休ませ、医療機関に相談することが大切だ。手洗いやうがい、マスクの着用といった基本的な感染対策を続けたい。学校からの連絡や閉鎖情報もこまめに確認し、きょうだいがいる家庭では家庭内での広がりにも気をつけたい。登校前には体温や体調を確かめ、少しでも体調が悪いときは休ませることが大切だ。","2026-11-13","47NEWS（山陽新聞）","https://www.47news.jp/15226712.html"],["名古屋市、集団かぜの学級閉鎖 今季累計214施設に","名古屋市は11月13日、市内の学校などで発生した集団かぜによる学級閉鎖などの状況を更新した。当日判明したのは千種区の市立みやこ小学校3年2組の学級閉鎖1件で、在籍32人のうち8人が患者となった。今シーズンの累計は214施設で、小学校が117施設と最も多い。今シーズンの累計は214施設で、小学校が117施設と最も多い。市のページでは日々の発生状況が更新されており、地域の流行を知る手がかりになる。","\n【概要】名古屋市は11月13日、市内の学校などで発生した集団かぜによる学級閉鎖などの状況を更新した。当日判明したのは千種区の市立みやこ小学校3年2組の学級閉鎖で、在籍32人のうち8人が患者となった。今シーズンの累計は214施設にのぼっている。【背景】名古屋市では、2026年8月31日から始まった今シーズンの集団かぜによる措置を、保育園や幼稚園、小中学校、高等学校などの施設別に毎日公表している。学校施設からの報告が遅れる場合があり、掲載が数日後になることもあるという。集団かぜの情報は、地域の流行状況を知る手がかりになる。集団かぜの情報は、名古屋市健康福祉局感染症対策課が各区保健センターと教育委員会から集約し、名古屋市衛生研究所に送ってもらった情報をもとに作られている。【詳細】今シーズンの累計では、休校が5施設、学年閉鎖が16施設、学級閉鎖が193施設で、合計214施設にのぼる。施設別では小学校が117施設と最も多く、中学校50施設、高等学校34施設、幼稚園6施設などとなっている。11月の集団かぜの患者検体からは、PCR検査でA/H1pdm09ウイルスの遺伝子が検出されている。9月と10月の検体からも同じ型が検出されていた。「患者数」とは、学校が閉鎖の措置を決定した日に、インフルエンザ様症状があると学校が判断した生徒の数を指す。施設別報告数は、各施設から閉鎖措置の報告があった件数を日ごとに集計したものだ。【ポイント・注意点】学級閉鎖は、学校が閉鎖を決めた日にインフルエンザ様の症状があると判断した生徒の数をもとに決められる。子どもの体調に変化があれば早めに休ませ、医療機関に相談したい。市のページでは日々の発生状況が更新されており、地域の流行状況を知る手がかりになる。手洗いや換気など基本的な対策も続け、流行期の体調管理に気をつけたい。学級閉鎖の連絡が来たときは、速やかに迎えの手配をしたい。家庭内でも手洗いや換気を心がけ、きょうだいへの広がりにも注意したい。発熱などの症状が出たときは無理に登校させず、十分な睡眠と水分をとらせることが大切だ。","2026-11-13","名古屋市公式ウェブサイト","https://www.city.nagoya.jp/kenkofukushi/eisei/1015269/1015388/1015389/1015390.html"],["韓国スクールゾーンで7歳児死亡 右折SUVにはねられ","韓国の京畿道金浦市で11月12日午後、スクールゾーンの横断歩道を渡っていた7歳の小学生が、右折してきたSUVにはねられて死亡した。子どもは歩行者信号に従って渡っていた。警察は40代の運転手を児童保護区域での致死の疑いで逮捕し、信号無視や前方不注意の有無を調べている。スクールゾーンでの死亡事故は法律で重く処罰される。運転する側の注意と、子どもへの声かけの両方が欠かせない。","\n【概要】韓国・京畿道金浦市のスクールゾーンで11月12日午後3時26分ごろ、横断歩道を渡っていた7歳の小学生が右折してきたSUVにはねられ、死亡した。子どもは学校の授業を終え、塾へ向かう途中だった。警察は運転手を児童保護区域での致死の疑いで逮捕した。【背景】事故が起きたのは、子どもを守るために設けられた児童保護区域、いわゆるスクールゾーンの中だ。子どもは歩行者信号に従って横断歩道を渡っていたという。金浦警察署は11月13日、SUVを運転していた40代の男性を、特定犯罪加重処罰法上の児童保護区域致死の疑いで逮捕したと発表した。スクールゾーンでの死亡事故は、法律で重く処罰される。韓国では、スクールゾーンで安全運転義務を怠り子どもを死亡させた場合、特定犯罪加重処罰法で加重処罰される。運転手の逮捕状の請求が検討されている。【詳細】警察は、運転手が横断歩道の手前で歩行者信号を無視して一時停止せず、運転中に前方確認を怠ったとみて調べている。運転手は調べに対し、子どもをよく見ていなかったという趣旨の供述をしているという。警察は車両の進行状況や当時の信号、運転手の注意義務の履行の有無を確認し、取り調べの後に逮捕状を請求する方針だ。事故のあった場所は、子どもが一人で塾へ向かう途中の道だった。事故は12日午後3時26分ごろ、金浦市傑浦洞のスクールゾーンで発生した。子どもは学校の授業を終え、塾へ移動する途中だった。【ポイント・注意点】韓国の警察庁は、車両用信号が青でも、右折時に横断歩道に歩行者がいれば一時停止し、渡り終えた後に徐行しなければならないと案内している。スクールゾーン内の信号機がない横断歩道では、歩行者がいなくても運転者は一時停止しなければならない。日本でも、子どもが一人で歩く通学路や横断歩道では、運転する側の注意と、子どもへの声かけの両方が欠かせない。通学路の危険な場所を子どもと一緒に確認し、横断歩道では車が止まったのを確かめてから渡る習慣をつけたい。子どもが一人で通学する場合は、通学路の危険な場所を事前に一緒に歩いて確かめておきたい。","2026-11-13","財経日報","https://news.jkn.co.kr/editions/japanese/post/1090456"],["21か月児がゴム凝固剤を誤飲 飲料ボトルに詰め替え","ベトナムで11月10日、21か月の男の子がゴムの凝固に使う化学薬品を誤って飲み、消化管に重い損傷を負った。薬品はラベルのない容器から飲料水のペットボトルに詰め替えられていた。子どもは激しく吐いて病院に運ばれ、1週間の治療で退院したが、自宅での経管栄養が続いている。医師は、化学薬品の誤飲は深刻な事故だが、保管の仕方で防げると強調している。薬品や洗剤は子どもの手の届かない場所に置き、飲料用の容器への詰め替えは避けたい。","\n【概要】ベトナム・ドンナイ省で11月10日、21か月の男の子がゴムの凝固に使う化学薬品を誤って飲み、消化管に重い損傷を負って病院に運ばれた。薬品は飲料水のペットボトルに詰め替えられて置かれていた。1週間の治療で退院できたが、自宅での経管栄養が続いている。【背景】家族によると、ゴムの凝固剤は大量に購入され、ラベルが十分にない容器に入っていた。使いやすいようにと、親族が古い清涼飲料水のボトルに詰め替えたという。男の子はそれを飲み物だと思って口にした。少量を飲んだ直後に激しく吐き、家族が小児病院に運んだ。化学薬品の誤飲は、家庭内の事故として各地で起きている。化学薬品の誤飲は、家庭内の事故として各地で起きている。飲料用の容器への詰め替えは、子どもが飲み物と間違える原因になる。男の子は21か月で、ドンナイ省に住んでいる。【詳細】受け入れた小児病院の消化器科では、絶食と胃酸を抑える薬による治療を始め、内視鏡検査を行った。胃の粘膜には広い範囲に炎症と充血があり、胃と十二指腸に潰瘍が見つかった。医師は腸に栄養を送る管を入れて治療を続け、1週間の集中治療で状態は安定し、退院できた。ただ、自宅でも管による栄養が続き、食道や胃の出口が狭くなる合併症がないか定期的な受診が必要だ。医師は、誤飲に気づいたときは、まず落ち着いて子どもの様子を確かめ、速やかに医療機関へ連絡することが大切だとしている。【ポイント・注意点】医師は、化学薬品の誤飲は深刻な事故だが、保管の仕方で防げると強調する。薬品や洗剤は子どもの手の届かない場所に置き、飲料用の容器への詰め替えは絶対に避けたい。ラベルのない容器に薬品を入れたままにしないことも大切だ。万が一飲んでしまった場合、無理に吐かせたり、レモンや酢を飲ませたりせず、容器を持って速やかに医療機関を受診することが大切だ。家庭内の薬品や洗剤は、子どもの手の届かない高い場所や鍵のかかる場所に保管したい。詰め替えをするときは、必ず元の容器のラベルを確かめ、飲料用のボトルは使わないようにしたい。","2026-11-10","ベトナムネット（Bao Moi）","https://baomoi.com/be-trai-nguy-kich-vi-uong-nham-thu-nuoc-la-dung-trong-chai-nuoc-ngot-c56477718.epi"],["東京でRSウイルス過去5年最多 百日咳も増加","東京都の2026年第44週の感染症報告によると、RSウイルス感染症は定点当たり0.93人で、同じ週として過去5年で最も多くなった。報告244例のうち231例が4歳以下だ。一方、インフルエンザは3週続けて減少し、マイコプラズマ肺炎も38例から11例に減った。百日咳の届出は直近4週で36例と増えている。百日咳の届出も直近4週で36例と増えている。赤ちゃんの呼吸の苦しさや長引く咳には、早めの受診が勧められている。","\n【概要】東京都の2026年第44週（10月26日〜11月1日）の感染症報告によると、RSウイルス感染症は定点当たり0.93人で、同じ週として過去5年で最も多い水準が続いた。報告244例のうち231例が4歳以下で、乳幼児が中心だ。インフルエンザが減る中で、RSウイルスだけが高止まりしている。【背景】秋のインフルエンザは3週続けて減少し、定点当たり6.91人まで下がった。マイコプラズマ肺炎も38例から11例に減った。一方でRSウイルスだけが0.9人前後で高止まりし、第37週の1.49人をピークに3週ほど横ばいが続いている。百日咳も直近4週で36例となり、前の4週の23例から増えている。子どもの感染症の顔ぶれが入れ替わってきた。【詳細】RSウイルス感染症は、0歳49例、1〜4歳182例と、報告のほとんどが4歳以下だ。百日咳は生後6か月ごろまでの赤ちゃんがかかると重くなりやすい病気で、大人がかかると熱がなく咳だけが長く続くことが多い。感染性胃腸炎も969例と2週続けて増え、冬に向けて増える時期に入っている。1〜4歳が362例で最も多い年代だ。嘔吐物の片づけには使い捨て手袋やマスク、塩素系の消毒剤の用意が勧められている。インフルエンザの入院は54例で、うち集中治療室に入った方は3例、人工呼吸器を使った方は2例だった。RSウイルス感染症は244例で、前週の242例とほぼ同じだ。0歳は63例から49例に減り、1〜4歳は178例から182例だった。【ポイント・注意点】赤ちゃんが息をするたびに胸がへこむ、ゼーゼーする、ミルクの飲みが普段の半分ほどに減ったときは、早めに医療機関に相談したい。5種混合ワクチンの接種が予定どおり進んでいるか、母子健康手帳で確かめておくと安心だ。咳が2週間近く続く家族がいるときは、赤ちゃんとの距離にも気を配りたい。手洗いや換気、マスクなど基本的な対策も続けたい。百日咳は、大人がかかると熱がなく咳だけが長く続くことが多く、気づかないまま家庭の赤ちゃんにうつすことがある。咳が2週間近く続くときは受診し、家に乳児がいることを伝えたい。","2026-11-06","池袋東口まめクリニック","https://beans-mc.jp/tokyo-epidinfo-2026-w44/"],["鹿児島で登校中の小2男児が車にはねられ軽傷","鹿児島市で11月6日朝、登校中だった小学2年生の男子児童が信号のある交差点で横断歩道を渡っていたところ、普通乗用車にはねられた。児童は肘にけがをして病院に搬送されたが、軽傷で意識はあるという。登下校の時間帯は子どもと車の動きが重なりやすく、注意が必要だ。警察が事故の詳しい状況を調べている。登校時間帯の交差点では、青信号でも車が曲がってくることがあり、子どもへの声かけと運転する側の注意の両方が欠かせない。","\n【概要】鹿児島市で11月6日午前7時30分ごろ、登校中だった小学2年生の男子児童が普通乗用車にはねられる事故があった。児童は肘にけがをして病院に搬送されたが、軽傷で意識はあるという。朝の登校時間帯は、通勤の車と子どもの動きが重なりやすく注意が必要だ。【背景】事故が起きたのは、鹿児島市新屋敷町の信号機のある交差点だ。児童は横断歩道を渡っていたところ、普通乗用車にはねられた。朝の登校時間帯は、通勤の車と登校する子どもの動きが重なる時間でもある。警察が事故の詳しい状況を調べている。登下校中の子どもの交通事故は、各地で繰り返し起きている。児童は登校中で、一人で横断歩道を渡っていたとみられる。警察が事故の詳しい状況を調べている。【詳細】はねられたのは小学2年生の7歳の男子児童で、登校中に信号のある交差点の横断歩道を渡っていた。普通乗用車にはねられ、肘にけがを負って病院に搬送されたが、意識はあり軽傷だという。運転手の状況や信号の状態など、事故の経緯については警察が確認を進めている。児童は登校中で、一人で横断歩道を渡っていたとみられる。事故が起きたのは6日午前7時30分ごろで、児童は肘にけがをして病院に搬送されたが、軽傷で意識はあるという。【ポイント・注意点】登校時間帯の交差点では、青信号でも車が曲がってくることがある。子どもには、信号が青でも左右を確認してから渡ること、車が止まったのを確かめてから進むことを繰り返し伝えたい。運転する側も、通学時間帯は横断歩道の手前で十分に速度を落とし、子どもの姿を見落とさないよう注意したい。地域での見守り活動も、こうした事故を防ぐ力になる。通学路の危険な場所を、子どもと一緒に確認しておきたい。登校時間帯は車の通りも多く、子どもと車の動きが重なりやすい。通学路では、交差点の手前で一度立ち止まり、左右を確認する習慣をつけたい。子どもが一人で通学する場合は、通学路の危険な場所を事前に一緒に歩いて確かめておきたい。地域の見守り活動に参加し、通学路の安全をみんなで支えることも大切だ。","2026-11-06","日テレNEWS NNN","https://news.ntv.co.jp/category/society/kyd04a0d5709b0486f8ed441b2167470f4"],["愛媛で登下校の見守り活動 県内すべての小中学校で","愛媛県では11月4日、県内すべての公立小中学校で登下校の安全を見守る活動が行われた。新居浜市の小学校では午前7時半ごろから教員や保護者、地域の見守り隊が登校を見守った。県が年3回設ける「児童生徒をまもり育てる日」の一環で、通学路の注意点などを共有しながら安全確保に取り組んでいる。県下一斉の活動は、登校時と下校時の両方で実施された。見守りの目があるだけでも防げる事故があり、日々の積み重ねが大切だ。","\n【概要】愛媛県では11月4日、県内すべての公立小中学校で、登下校の安全を見守る活動が行われた。新居浜市新須賀町の新居浜小学校では、午前7時半ごろから教員や保護者、地域の見守り隊のメンバーらが登校を見守った。登校時だけでなく下校時にも見守りが行われた。【背景】この活動は、愛媛県が4月と7月、11月の年3回設けている「児童生徒をまもり育てる日」の一環だ。登校時の見守りに加え、下校時にも県内すべての公立小中学校で見守りが行われた。新居浜小学校では、近隣の小学校や中学校と通学路上の注意ポイントなどの情報を共有しながら、見守り活動を毎日行っているという。学校と地域が連携した取り組みだ。県が年3回設けている「児童生徒をまもり育てる日」は、4月と7月、11月に行われている。【詳細】見守り隊が「おはようございます」と声をかけると、児童も「おはようございます」と返し、登校の様子を見守った。学校と地域が連携し、通学路の危険な場所や注意すべきポイントを共有することで、日々の安全確保につなげている。県下一斉の活動は、登校時と下校時の両方で実施された。見守り隊の声かけは、子どもへの注意喚起と同時に、運転する側への注意喚起にもなっている。見守り隊が「おはようございます」と声をかけると、児童も「おはようございます」と返した。県下一斉の活動は、登校時と下校時の両方で実施された。見守り隊の声かけは、子どもへの注意喚起と同時に、運転する側への注意喚起にもなっている。【ポイント・注意点】子どもの交通事故は、下校中の飛び出しや横断中の事故が多く、見守りの目があるだけでも防げる場合がある。保護者や地域の人が通学路に立つことは、子どもへの声かけと同時に、運転する側への注意喚起にもなる。見守り活動は特別な日だけでなく、日々の積み重ねが大切だ。自分の地域でも、通学路の危険な場所を把握し、子どもと一緒に確認しておきたい。子どもの交通事故は、下校中の事故も多い。見守りの目があるだけでも防げる場合があり、日々の積み重ねが大切だ。","2026-11-05","南海放送NEWS NNN","https://news.ntv.co.jp/n/rnb/category/society/rbd376711adb5b4b26baa0094da1d124f3"]],"dev":[["子どもの心の不調、本人と保護者の見立ては食い違う","米カリフォルニア大学サンディエゴ校などの研究チームが、9〜17歳の子ども1万1868人とその保護者を調べたところ、精神科の診断が本人と保護者のどちらか一方からのみ報告された割合は、診断や発達段階によって65〜98%にのぼった。子どもはうつや自傷を、保護者は行動の問題を報告しやすいという。発達段階が上がっても食い違いは残るため、年齢を問わず両方の声を聞く姿勢が大切だ。心配な様子があれば、早めに専門家へ相談したい。","\n【概要】子どもの精神科の評価では、本人と保護者の報告が大きく食い違うことが多い。米カリフォルニア大学サンディエゴ校などの研究チームが、9〜17歳の子ども1万1868人とその保護者を対象に調べた結果を、2026年11月11日付の米医学誌JAMA Psychiatryに発表した。診断が片方からしか報告されない割合は、診断や発達段階によって65〜98%にのぼった。【背景】子どもの精神科の評価では、本人と保護者の両方から話を聞くのが一般的だ。だが両者の報告が違う問題を指し示すことがあり、診断や治療の計画、有病率の推計にも影響する。研究では、米国最大規模の子どもの脳と行動の長期研究ABCD研究の参加者に、同じ診断の質問を別々の面接で聞き、DSM-5に基づく診断をそれぞれから導き出して比較した。対象は9〜17歳の子どもとその保護者1万1868組だ。対象は9〜17歳の子どもとその保護者1万1868組で、米国最大規模の子どもの脳と行動の長期研究ABCD研究の参加者だ。【詳細】診断が報告された場合、その診断が本人と保護者のどちらか一方か 施された地域では、母親の低体重が少なく、生後6か月未満の赤ちゃんは体が長く育ち、6〜24か月の子どもは食べ物の種類が豊かになるなど、母子の栄養と健康に良い変化が見られた。プログラムは第1期の終わりまでに約240万人に届き、3万3688人のボランティアなどが研修を受けた。小さな試みを大きく広げても成果が出ることを示した研究だ。","\n【概要】ネパールで2011年から2023年にかけて行われた大規模な栄養・健康プログラム「スアハラ」の評価研究が、医学誌Maternal & Child Nutritionに発表された。実施された地域では、実施されなかった地域と比べ、母子の栄養と健康に良い変化が見られた。大規模な事業でも成果が出ることを示した研究だ。【背景】ネパールでは5歳未満の子どもの41%が発育阻害、11%が消耗症とされる。スアハラは、妊婦や乳幼児の母親を対象に、栄養の情報やサービスへの接触を増やし、知識と実践を改善することを目指した。教育や農業、水や衛生など複数の分野が連携し、2011年から2023年にかけて77郡のうち42郡で実施された。米国の開発援助機関が資金を出した。ネパールでは、妊婦と乳幼児に絞って、食べ物や病気の予防、衛生、医療へのアクセスに取り組むことが進められてきた。【詳細】実施地域では、母親が低体重である割合が低く、生後6か月未満の赤ちゃんは体が長く育つ傾向が見られた。6〜24か月の子どもは食べ物の種類が豊かで、食事の多様性の目安を満たす割合が高かった。病気のときに十分に食べさせたり、下痢のときに経口補水液や亜鉛を使ったりするなど、子どもの世話の仕方も改善していた。プログラムは第1期の終わりまでに約240万人に届き、3万3688人のボランティアなどが研修を受けた。32,784人の現場の担当者も研修を受けている。下痢のときに経口補水液や亜鉛を使うなど、子どもの世話の仕方も改善し、重い病気を防ぐことにつながった。【ポイント・注意点】研究を率いたフロンジロ教授は、小さな試みではうまくいっても、大きく広げると同じ成果が出にくい中で、長期間にわたり多様な地域で成果が出た点を評価している。地震や干ばつ、洪水、政治の変化、新型コロナといった困難もあった。それでも妊婦と乳幼児に絞って、食べ物や病気の予防、衛生、医療へのアクセスに取り組んだことが、子どもの体と心の発達を支えたと考えられる。大規模な事業でも成果が出ることを示した研究で、他の国や地域での取り組みにも参考になるという。","2026-11-12","サウスカロライナ大学","https://www.sc.edu/study/colleges_schools/public_health/about/news/2026/nepal_nutrition_intervention_frongillo_hpeb.php"],["早産児にアイマスクと耳栓 体内時計が育ちを助ける","オーストラリアとニュージーランドの11病院で800人以上の早産児を対象に行われた研究で、夜にアイマスクと耳栓を使って昼夜の区別をつけた赤ちゃんは、睡眠が長く効率的になり、体も長く育ち、重い腸の病気になる割合が3分の2近く減った。1人当たり66豪ドルという安価な工夫で、退院も早まる傾向が見られた。研究を率いたピロー教授は、安価な工夫が赤ちゃんの健やかな発達を支える可能性を指摘している。体内時計を整えることが、学校への準備にもつながるかが調べられる。","\n【概要】早産児に夜だけアイマスクと耳栓を使い、昼夜の区別をつけることで、睡眠や成長、免疫の働きが改善することが、オーストラリアとニュージーランドの研究で示された。11病院で800人以上の早産児が参加した大規模な試験で、1人当たり66豪ドルという安価な工夫だった。【背景】新生児集中治療室では、明かりや音が一日中ほぼ変わらないことが多い。研究チームは、夜にアイマスクと耳栓で光と音を減らし、昼は外すことで、赤ちゃんの体内時計を育てる試みを行った。対照群は通常のケアを受けた。体内時計は免疫の働きを整え、健やかな成長や発達を支えるうえで大切だとされる。極早産で生まれた赤ちゃんも対象となった。対照群は通常のケアを受け、明かりや音が一日中ほぼ変わらない環境で過ごした。【詳細】昼夜の区別をつけた赤ちゃんは、より長く効率的に眠り、体も長く育った。新生児の重い腸の炎症である壊死性腸炎になる割合は、3分の2近く減った。上の段階の病棟への移動や自宅への退院も、早まる傾向が見られた。アイマスクと耳栓の費用は、8〜12週の期間で1人当たり66豪ドルと安価だ。集中治療は1日当たり数千ドルの費用がかかるため、安価な工夫が医療体制の負担を軽くする可能性もある。研究に参加したトーマス君は31週で生まれ、36週ごろに退院し、現在は6歳で1年生だという。家族の体験談も紹介されている。【ポイント・注意点】研究を率いたピロー教授は、安価な工夫が赤ちゃんの健やかな発達を支え、集中治療の負担を軽くする可能性を指摘する。来月からは、この研究に参加した子どもたちが小学校に入る時期に合わせ、体や神経、気持ちの面での発達を追う後継研究が始まる。体内時計を早い時期に整えることが、学校への準備や視力、聴力、睡眠、肺の働きなどにどうつながるかが調べられる。体内時計を早い時期に整えることが、学校への準備や視力、聴力、睡眠、肺の働きなどにどうつながるかが調べられる。安価な工夫が、赤ちゃんの健やかな発達を支える可能性が期待されている。この研究は、オーストラリアとニュージーランドの11病院で行われた大規模な試験だ。","2026-11-11","The Kids Research Institute Australia","https://www.thekids.org.au/news--events/news-and-events-nav/2026/november/circa-diem-study-nov26/"],["子どもの「感性」大切に 親子4,500人調査","積水ハウスが子どもや親、教育関係者ら4500人を対象に行った調査で、親と教育関係者の約8割が、子どもの成長において「感性」を大切にしたいと答えた。これから大切にしたい力としては「物事を自分で考え、判断する力」が1位だった。親子で過ごす時間の満足度には、日常の何げない関わりや自律の尊重が影響しているという。京都大学の高橋雄介准教授は、子どもの発見をきっかけに親子の関心が広がることや、答えに至るまでの過程に目を向けることを助言している。","\n【概要】積水ハウスが子どもや親、教育関係者ら4500人を対象に行った「暮らしにおける子どもの育ちに関する意識・実態調査2026」によると、親と教育関係者の約8割が、子どもの成長において「感性」を大切にしたいと答えた。これから大切にしたい力の1位は「物事を自分で考え、判断する力」だった。【背景】調査は、生成AIの普及など子どもを取り巻く環境が大きく変わる中で行われた。「感性」は、身の回りの世界の繊細な変化や他者の心の動きに気づき、自分なりに受け止め、考えたり表現したりする力と定義された。文部科学省が2026年10月に公表した次期学習指導要領に向けた審議まとめでも、一人ひとりの「好き」を育み「得意」を伸ばす方向性が示されている。調査は、生成AIの普及など子どもを取り巻く環境が大きく変わる中で行われた。子どもの精神的幸福度が先進国の中でも特に低いといわれることが背景にある。【詳細】これから大切にしたい力としては、親の65.1%、教育関係者の76.4%が「物事を自分で考え、判断する力」を1位に挙げた。感性を大切にしたいと答えたのは親の75.2%、教育関係者の78.8%だった。親子で過ごす時間の満足度が高い子どもでは、「親と一緒に食事をする」「自分でできることは自分に任せてくれる」「話をもっと詳しく聞いてくれる」といった実感が高いことも分かった。子どもは、自分の考えや感じ方を尊重してもらえることや、日常の何げない関わりで親との時間を十分と感じるようだ。親から「好き」を大切にされている実感がある子どもは、親と「一緒に食事をする」割合が32.9pt高いことも分かった。【ポイント・注意点】京都大学の高橋雄介准教授は、子どもの発見をきっかけに親子の関心が広がることや、答えに至るまでの過程に目を向けることを助言している。生成AIを使う場合も、子どもがまず自分の案を考え、別の案と比べながら何を採用するかを自分で決める使い方が考えられる。特別な体験だけでなく、日常の共有や子どもの感じ方への関心が、感性や考える力を育む土台になるという。積水ハウスは、今日から家庭でできる3つのアクションも提案している。子どもの「好き」を大切にするカギは、特別な体験だけでなく日常をどう一緒に過ごすかだという。","2026-11-11","沖縄タイムス＋プラス","https://www.okinawatimes.co.jp/articles/-/1963967"],["自閉症児の読解、実行機能との関係が異なる","自閉症のある子どもと読字障害のある子ども、定型発達の子どもの計223人を調べた研究で、実行機能と読解の流暢さの関係がグループごとに異なることが分かった。自閉症の子どもでは処理速度やワーキングメモリとの関連が広く、読字障害の研究から作られた支援をそのまま当てはめるのは難しいという。研究チームは、自閉症のある子どもの読解の評価には実行機能の測定を入れることが望ましいとしている。子どもに合った見立てと支援が大切だという。","\n【概要】自閉症のある子どもでは、実行機能と読解の流暢さの関係が、読字障害のある子どもや定型発達の子どもとは異なることが、223人の子どもを対象とした研究で示された。米国の医学誌Journal of Autism and Developmental Disordersに掲載された。読解のつまずきが似て見えても、その背景は違う場合があるという。【背景】実行機能は、注意やワーキングメモリ、処理速度などをつかさどる心の働きだ。研究では、8〜12歳の英語を話す子ども223人を、自閉症35人、読字障害99人、定型発達89人の3グループに分け、単語やつくり言葉の読解の流暢さ、文章を読む流暢さを測り、数字を覚える課題や記号を写す課題などで実行機能を調べた。年齢の影響も確かめられている。年齢の影響も確かめられている。研究では、年齢を考慮した分析でも結果は変わらなかったという。【詳細】自閉症と読字障害の両グループは、定型発達の子どもより読解の流暢さと実行機能が低かった。だが、その関係は違っていた。自閉症のグループでは、記号を素早く写す課題の成績が、単語とつくり言葉の読解の流暢さを最も強く予測した。文章を読む流暢さでは、記号を探す課題の成績が自閉症と定型発達の子どもで関連したが、読字障害のグループでは関連が見られなかった。ワーキングメモリを測る数字の課題は、自閉症の子どもの単語の読解と、両方の臨床グループのつくり言葉の読解を予測した。処理速度を測る課題の成績は、自閉症のグループで単語の読解の流暢さと0.40、つくり言葉の読解の流暢さと0.43の関連を示した。【ポイント・注意点】研究チームは、実行機能と読解の関連が最も広く見られたのは自閉症の子どもだったと結論づけた。自閉症のある子どもの読解の評価には、実行機能の測定を入れることが望ましいという。一方で、読字障害の研究から作られた支援を、自閉症の子どもにそのまま当てはめるのは難しい。読解のつまずきが似て見えても、その背景は違う場合があるため、子どもに合った見立てと支援が大切だ。読字障害の研究から作られた支援を、自閉症の子どもにそのまま当てはめるのは難しいと研究チームは注意を促している。","2026-11-08","ScienMag","https://scienmag.com/executive-functions-drive-reading-fluency-differently-in-autistic-children/"],["英国で3万人の赤ちゃん追跡調査が始動","英国で2026年生まれの赤ちゃん3万人を追跡する大規模な研究「ジェネレーション・ニュー・エラ」が始まった。25年ぶりの同種の調査で、過去最大規模だ。ウェールズでは生まれた赤ちゃんの約3分の1にあたる9000人の家庭が招かれ、発達や健康、家庭や社会の影響を調べ、子どもや家族のための政策づくりに生かす。調査のテーマは、親や一般の人々、専門家、政策担当者の意見を取り入れて作られた。集まった声が、次の世代の親や専門家を助ける根拠になることが期待されている。","\n【概要】英国で2026年生まれの赤ちゃん3万人を追跡する大規模な研究「ジェネレーション・ニュー・エラ」が始まった。25年ぶりの同種の調査で、過去最大規模となる。ウェールズでは今週から、母親や父親への聞き取りが始まっている。子どもたちが急速に変わる世界でどう育つのかを調べる。【背景】この研究は、ロンドン大学UCLの縦断研究センターが主導し、英国の経済社会研究会議が資金を出している。子どもたちが急速に変わる世界でどう育つのか、発達や健康、親の健康、家庭や住まい、社会や環境の影響、不平等や多様性などを調べ、今日の家族のニーズに合った政策づくりに生かすことを目指す。調査のテーマは、親や一般の人々、専門家、政策担当者の意見を取り入れて作られた。ウェールズの責任者を務めるのは、スウォンジー大学医学部のルーシー・グリフィス教授だ。【詳細】ウェールズでは、今年生まれた赤ちゃんの約3分の1にあたる約9000人の家庭が招かれる。赤ちゃんが9〜10か月ごろに手紙が届き、この1年間で英国各地で聞き取りが行われる。スコットランドでは生まれた赤ちゃんの4分の1、北アイルランドでは約半数が招かれるなど、4つの国ごとに政策の根拠が作れる規模が確保されている。今年初めには同じ質問を使った予備調査も行われた。予備調査に参加した親は、家族が大きな取り組みの一部になれたと話している。調査は、4つの国ごとに政策の根拠が作れる規模が確保されている。ウェールズでは、今年生まれた赤ちゃんの約3分の1にあたる約9000人の家庭が招かれる。【ポイント・注意点】縦断研究は function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;

  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }

}
