機関（WHO）の指針は2016年が最後の改訂で、長期的な影響については根拠が不足していると記している。\n【詳細】\nレビューでは、鉄だけ、鉄と葉酸、鉄とほかのビタミン・ミネラルを毎日口から飲む方法を調べた。鉄だけの場合、何もしない場合や偽薬と比べて鉄欠乏性貧血はおそらく減る。鉄と葉酸の組み合わせもおそらく減らすが、根拠は1つの研究に限られる。鉄とほかのビタミン・ミネラルの組み合わせも減らす可能性がある。鉄だけでは身長や体重に影響はなく、せき、発熱、呼吸器の病気にも影響はなかった。鉄と葉酸は、下痢や呼吸器の病気にほとんど差をもたらさなかった。副作用としては、鉄で便の色が変わることが増える可能性があった。鉄だけでは嘔吐や下痢にほとんど差はなく、便秘への影響ははっきりしなかった。一方、鉄とほかのビタミン・ミネラルを組み合わせると、嘔吐はおそらく増える。筆頭著者のクリパ・ラジャゴパラン氏は、毎日の鉄剤は「本来の役割を果たしている」と述べ、よくある病気への目立った影響なしに貧血を減らすと説明した。\n【ポイント・注意点】\n上席著者のサウラブ・メータ氏は、便の色の変化や、一部の製剤での嘔吐が鉄剤でより多かったとし、貧血そのものを含むいくつかの結果は根拠の確かさが低い、または非常に低いと述べている。共著者のジュリア・フィンケルスタイン氏は、鉄の不足が心配される地域で鉄剤を続けることを支持するデータだとした。ただし研究チームは、すべての子どもに毎日の鉄剤が必要という意味ではないとしている。子ども一人ひとりの必要、地域の鉄欠乏や貧血の多さ、製剤の種類を考えて判断すべきだという。子どもに鉄剤を使うかどうかは、医師に相談したい。","2026-11-16","Medical Xpress","https://medicalxpress.com/news/2026-11-daily-iron-supplements-deficiency-anemia.html"],["胎内や幼少期の高脂肪食が免疫を長く弱める恐れ ワクチンへの反応が低下 マウス研究","胎内や生後早い時期に高脂肪食にさらされると、免疫の弱さが長く続く恐れがあるとする研究を、米ペンシルベニア大学の研究チームが英科学誌ネイチャー・イムノロジーに発表した。子どもの肥満を再現したマウスでは、抗体の反応をまとめる「濾胞性ヘルパーT細胞」が減り、ワクチンへの反応が弱かった。原因はA20という遺伝子の働きが抑えられることにあるとみられ、この遺伝子が欠けたまれな病気の患者5人でも同じ細胞の不足が確認された。","\n【概要】米ペンシルベニア大学ペレルマン医学部の研究チームは、胎内や生後早い時期に高脂肪食にさらされると、免疫の弱さが長く続く恐れがあるとの研究結果を英科学誌ネイチャー・イムノロジーに発表した。主にマウスを使った研究で、一部の人の観察結果も示している。\n【背景】子どもの肥満は、インフルエンザや新型コロナなどの呼吸器ウイルスで重症化したり亡くなったりする危険因子として知られている。また、妊娠前から妊娠中の母親の過体重や肥満は、子どもの肥満の危険因子とされる。研究チームは、こうした早い時期の食事が免疫にどう影響するかを調べた。\n【詳細】子どもの肥満を再現したマウスでは、ウイルス感染に対して効果的な抗体の反応を生み出す免疫細胞の種類が少なく、ワクチンへの反応も弱かった。直接の原因は、未熟なT細胞が、抗体の反応をまとめる「濾胞性ヘルパーT細胞（TFH細胞）」へと成熟する数が減ったことで、代わりに炎症を起こしやすいT細胞が増えていた。チームはこの異常を、T細胞が作り変えられる過程でA20という遺伝子の働きが抑えられることにたどり着いた。さらに、A20遺伝子の片方が失われるまれな遺伝性の病気の患者5人の免疫細胞を調べ、A20が正常な子どもや大人と比べたところ、血中のTFH細胞が著しく少なく、肥満の幼いマウスと似ていた。\n【ポイント・注意点】共同責任著者のホルヘ・エナオ＝メヒア教授は「母親の食事や生後早い時期の食事は、発達中のT細胞を長く作り変える環境のシグナルとなる」と述べた。小児科のサラ・ヘンリクソン助教は、高脂肪食が免疫を悪い方向に作り変えうる「重要な、人生早期の時期」があることを示したと説明している。記事は、うまく設計された薬でこの低下を元に戻せる可能性にも触れている。ただし主な結果はマウスによるもので、研究が測ったのはワクチンへの反応であり、実際の感染の経過ではない。また記事では高脂肪食と肥満のどちらが原因なのかがはっきり区別されておらず、人の子どもに当てはまるかは今後の検証が必要だ。","2026-11-16","News-Medical","https://www.news-medical.net/news/20261116/High-fat-diet-in-early-life-may-permanently-weaken-immune-system.aspx"]],"dev":[["話し言葉が少ない子は6タイプに 「理解は高いが話せない」群が2つ 英193人の研究","英国で話し言葉がごく少ない4〜12歳の子ども193人を調べた研究が「Molecular Autism」誌に載った。遊びの観察や検査、保護者の質問票をもとに子どもを分けると、6つのまとまりが見つかった。そのうち2つは、言葉の理解は強いのに発話が少ない「食い違い」の群だった。研究チームは、言葉そのものがないのではなく、話すための口の動きの難しさが背景にある可能性を指摘し、早い時期からの発話運動の支援や、代わりの伝達手段の活用を勧めている。","\n【概要】\n英国の研究チームが、話し言葉がごく少ない「ミニマリー・バーバル」の子ども193人を調べ、6つのまとまり（クラスター）に分かれることを示した。うち2つは、言葉の理解は高いのに発話が少ない群だった。成果は「Molecular Autism」誌（2026年、17巻）に掲載され、Scienmag の記事を Bioengineer.org が転載した。\n【背景】\n話し言葉が少ない子どもは、言葉の力全体が育っていないと見られがちだ。しかし、理解と発話が同じように低いのか、両者にずれがあるのかによって、合う支援は変わってくる。\n【詳細】\n対象は、英国内の114の学校や支援団体、研究ネットワークを通じて集めた4〜12歳（平均7.6歳）の193人で、73％が男児だった。保護者の報告では77％が自閉症の診断を受けており、26％に知的障害、15％に30種類にわたる遺伝的な病気があった。参加の条件は、意思を伝える単語が75語未満か、2語以上の文が10未満であること。遊びを通した観察の映像を細かく記録し、発話の動きや動作のまねの検査、絵を選ぶ理解の検査、保護者の質問票を組み合わせた。データのそろった181人を階層的クラスター分析で分けた結果、理解と発話が同じ水準の4群（得点が最も低い群、反響言語が多い群、最も高い群など）と、理解が強く発話が少ない2群（19人と37人）が見つかった。別の分け方（k平均法）で確かめても、72％の子が同じ群に入った。37人の群は遺伝的な診断が多く、動作のまねの得点が低かった。2つの食い違い群では、絵カードや機器などで意思を伝える手段（AAC）の利用が目立って多かった。\n【ポイント・注意点】\n研究チームは、この食い違いは言葉がないためではなく、話すための口の動きの壁を反映している可能性が高いとみている。一方で、診断は保護者の報告で、確認はされていない。独自の課題も使われ、一部の検査では7〜32％の子が最低点だった。一時点の調査のため、群分けが時間がたっても変わらないかは分からず、4段階の追跡研究の後半で確かめる予定だという。","2026-11-21","Bioengineer.org（Scienmag）","https://bioengineer.org/minimally-verbal-children-exhibit-discrepant-receptive-and-expressive-communication-subgroups/"],["安静時の脳波が自閉症の幼児の言葉の力と関連 米ボストン大などの研究","米ボストン大学とボストン小児病院のチームが、2〜6歳の子どもの安静時の脳波を調べた研究を「Molecular Autism」誌に発表した。自閉症の子は、脳波のうちリズムを持たない「背景成分」の強さが定型発達の子より高かった。また言葉の遅れがある自閉症の子では、アルファ波の山が低かった。2つの指標はそれぞれ独立して言葉の得点と関連していた。研究チームは脳の成熟との関係を考えているが、一時点の調査のため因果の向きは分からないとしている。","\n【概要】\n米ボストン大学とボストン小児病院の研究チームが、2〜6歳の自閉症の子どもと定型発達の子どもの安静時の脳波を比べ、脳波の2つの特徴が言葉の力と関連することを示した。成果は「Molecular Autism」誌（2026年、17巻）に掲載された。\n【背景】\n脳波には、一定のリズムを持つ成分（アルファ波など）と、リズムを持たない背景の成分が混ざっている。近年は両者を分けて調べる方法が広がり、発達の目印として使えるかが注目されている。\n【詳細】\nデータはボストン大学の言語発達の研究と、ボストン小児病院の脳の発達の研究の2つから集め、当初の参加者は154人だった。子どもは保護者と一緒に座って音のない映像を見ながら、128個の電極がついたネットで脳波を測った。信号を、リズムを持たない背景成分と、リズムを持つ成分に分けて解析し、オフセットは2.5ヘルツでの強さと定めた。年齢をそろえた定型発達の子64人と自閉症の子64人（どちらも平均およそ4歳半）を比べると、自閉症の子は背景成分の強さ（オフセット）と総量が高かったが、傾きには差がなかった。自閉症かどうかだけでは、アルファ波の山の高さに差はなかった。言葉のデータがそろった自閉症の子63人のうち37人に言葉の遅れがあり、この子たちはアルファ波の山が、定型発達の子とも、遅れのない自閉症の子とも比べて低かった。背景成分が低いほど話す力と理解する力の得点が高く、アルファ波の山が高いほど伝える力が高かった。2つの指標は互いにほとんど相関せず、それぞれが別々に言葉の得点を説明していた。\n【ポイント・注意点】\n研究チームは、背景成分の高さは大脳の成熟の遅れや、神経のつながりの刈り込みが少ないことを反映している可能性があるとし、アルファ波は視床と大脳のつながりと結び付けて考えている。ただし一時点の調査で、因果の向きや、その後の言葉の伸びは予測できない。参加家庭は社会経済的に恵まれた層が多く、自閉症の群は女児が少なかった。雑音による脱落も多く、覚醒の度合いの違いが結果に影響した可能性もある。","2026-11-21","Bioengineer.org（Scienmag）","https://bioengineer.org/preschool-eeg-study-links-resting-aperiodic-offset-and-alpha-rhythms-to-autism-language/"],["人の笑顔のごほうびで学びが進む 話す自閉症児には効果、言葉の少ない子では見られず","米国の3つの研究拠点で、2〜4歳台の幼児72人の学び方を視線の計測で調べた研究が「Molecular Autism」誌に載った。人が拍手してほほえむ「社会的なごほうび」は、定型発達の子と、話せる自閉症の子の学びを後押しした。一方、話し言葉がごく少ない自閉症の子では、ごほうびの種類にかかわらず、結び付きを学んだ様子が見られなかった。研究チームは、本人の好きなものや慣れたものを使う支援を試す価値があるとしている。","\n【概要】\n米国の研究チームが、ボールの落ちる先と、その後に出てくる映像の結び付きを幼児が学べるかを、視線の動きで調べた。人の笑顔などの社会的な刺激は、定型発達の子と話せる自閉症の子の学びを強めたが、話し言葉がごく少ない自閉症の子では学んだ形跡が見られなかった。成果は「Molecular Autism」誌（2026年、17巻）に掲載された。\n【背景】\n言葉での受け答えが難しい子どもは、ふつうの検査では学ぶ力を測りにくい。そこで研究チームは、テストを受ける力に頼らずに「結び付きを学ぶ力」を測る新しい視線計測の課題を作った。\n【詳細】\n検査はA.J.ドレクセル自閉症研究所、カリフォルニア大学デービス校のMIND研究所、コネチカット大学で行った。対象は生後24〜56か月の72人で、定型発達が19人、話せる自閉症が30人、話し言葉がごく少ない自閉症が23人だった。画面では階段をボールが転がり、緑か青のバケツに入る。緑のときは左上で泡がはじけ（社会的でない刺激）、青のときは右上で知らない大人が拍手してほほえむ（社会的な刺激）。4回の学習のあと、ボールだけを見せる2回のテストで、子どもがどこを見ていたかを測った。主な指標は、それぞれの場所を見ていた合計の時間だ。社会的なテストでは、定型発達の子が社会的な刺激の場所を強く見ており、話せる自閉症の子も小さめながら同じ傾向だった。話し言葉の少ない自閉症の子には差がなかった。定型発達の子は、話し言葉の少ない自閉症の子より社会的な後押しが大きかった。話せる自閉症の子は両方の条件で学んでいたが、社会的な刺激への注目は定型発達の子より少なかった。\n【ポイント・注意点】\n話し言葉の少ない子の結果は、統計的な学習を調べた過去の研究と食い違う。研究チームは、今回の課題が複数の場所にわたる結果の予測を求めたためかもしれないとみている。人数が少なく群の大きさもそろわず、言葉の少ない群は女児が少なすぎて性別を考慮できなかった。各条件のテストは1回だけで、刺激も日常のやりとりとは違うため、結論の強さには限りがある。","2026-11-21","Bioengineer.org（Scienmag）","https://bioengineer.org/social-cues-boost-learning-in-speaking-autistic-preschoolers-not-minimally-speaking-peers/"],["デジタルの創作・美術教育で子どもの感情の力が高い傾向 中国286人の記録","中国・四川の研究者が、デジタル技術を使った創作・美術教育を受けた子どもと受けなかった子どもを学校の記録で比べた研究を「Frontiers in Public Health」誌に発表した。教育を受けた148人は、感情に気づき調整する力の得点が高く、社会への適応も伸びていた。感情の力は、適応の伸びの約28％を説明していた。ただし過去の記録を振り返った観察研究で、因果関係は示せないため、研究者は無作為化比較試験が必要だとしている。","\n【概要】\n中国の研究者2人が、デジタルの創作的な美術教育を受けた子どもの感情の力と社会への適応を、学校に残る記録をもとに調べた。教育を受けた子は感情の力が高く、適応も伸びていた。成果は「Frontiers in Public Health」誌（2026年、14巻）の子どもと健康の部門に掲載された。\n【背景】\n自分や他人の感情に気づき、うまく扱う力は、友だちづきあいや学校生活への適応を支えるとされる。美術や創作の活動がその力を育てるかどうかは、教育の現場で関心の高いテーマだ。この研究は、デジタル技術を取り入れた創作的な美術教育が、子どもの感情の力と社会への適応にどう結び付くかを確かめようとした。\n【詳細】\n著者は四川工商学院の申宇陽氏と、四川城市職業学院の鄧橋氏。保管された学校の記録から、教育を受けた148人と受けていない138人、計286人を分析した。子どもの年齢や調査期間は記事に書かれていない。感情の力は子ども向けの感情能力の質問票で、社会への適応は幼児の社会情緒の質問票と適応行動の尺度で測った。2つの群の違いを減らすため傾向スコアでそろえ、開始時の差は標準化した差で10％未満に収まった。分析には反復測定の分散分析や階層的な重回帰、ブートストラップ法による間接効果の検定を使った。教育を受けた群では、感情の力の合計点と、感情に気づく力・感情を扱う力の両方が高く、効果量はコーエンのdで0.82だった。社会への適応も期間中に有意に伸び（平均の変化は12.36）、回帰分析の調整済み決定係数は0.317だった。媒介分析では、感情の力が適応への効果の28.47％を担う部分的な媒介役になっていた。\n【ポイント・注意点】\n著者はこの教育に子どもの健康への応用価値があるとしている。ただし、過去の記録を振り返る観察研究なので、教育が感情の力を高めたという因果関係は証明できない。対象の年齢や教育の中身の詳しい条件も記事からは分からず、研究者の直接の発言も載っていない。著者自身も、先を見越して行う無作為化比較試験で確かめる必要があると強調している。","2026-11-21","Bioengineer.org（Scienmag）","https://bioengineer.org/digital-creative-aesthetic-education-linked-to-improved-emotional-competence-in-children/"],["聴覚障害のある親を持つ子は心の苦痛が多い傾向 日本の全国調査2万9千人","日本の2022年国民生活基礎調査のデータで、聴覚障害のある親を持つ子ども（コーダ）の心の状態を調べた研究が「BMC Public Health」誌に載った。対象は両親と暮らす12〜29歳の2万9615人。父親だけに聴覚障害がある子は1.54倍、母親だけの子は2.20倍、心の苦痛が中程度以上になりやすかった。両親ともの場合は人数が少なく有意ではなかった。研究者は社会の認知と、子どもと親への支援を広げるよう求めている。","\n【概要】\n日本の研究チームが、全国を代表する国民生活基礎調査のデータを使い、聴覚障害のある親を持つ聞こえる子ども（コーダ、CODA）の心の苦痛を調べた。父親か母親のどちらかに聴覚障害がある子は、心の苦痛が強い割合が高かった。成果は「BMC Public Health」誌に掲載された。\n【背景】\nコーダは幼いころから親と周囲の通訳役を担うことがあり、特有の負担を抱えると指摘されてきた。しかし、全国規模のデータでその心の健康を確かめた研究は多くない。今回の研究は、全国を代表する大規模なデータでこの点を調べた。\n【詳細】\n著者は渡辺氏、杉山氏、小宮山氏、田宮氏ら。2022年の国民生活基礎調査から、結婚している両親と暮らす12〜29歳の子ども2万9615人を分析した。子ども自身には聴覚障害はない。比べたのは、両親のどちらにも聴覚障害がない子と、父親だけ、母親だけ、両親ともに聴覚障害がある子の4つの組み合わせだ。記事では、親について「聴覚障害」という表現が使われている。心の苦痛は6問の尺度「K6」で測り、5点以上を中程度以上の苦痛とした。個人と世帯の条件を調整する多層ロジスティック回帰で、親に聴覚障害がない子と比べた。父親だけに聴覚障害がある子のオッズ比は1.54（95％信頼区間1.05〜2.25）、母親だけの子は2.20（同1.46〜3.32）で、どちらも有意だった。両親ともに聴覚障害がある子は2.43（同0.69〜8.59）だったが有意ではなく、著者は人数の少なさのためとしている。ほかに、女性であること、年齢が高いこと、本人や親の主観的な健康がよくないことが苦痛の多さと関連し、きょうだいが2人以上いると苦痛は少なかった。\n【ポイント・注意点】\n著者は、コーダは心の苦痛のリスクが高い可能性があるとして、社会での認知を広げ、的を絞った支援を行い、聴覚障害のある親が子育ての役割を果たせるよう支援を広げることを求めている。一方、一時点の調査なので因果関係は分からない。各群の人数は記事に書かれておらず、両親とも聴覚障害がある群の結果は人数不足で確かではない。","2026-11-21","Bioengineer.org（Scienmag）","https://bioengineer.org/children-of-deaf-adults-in-japan-show-higher-odds-of-psychological-distress/"],["人が思い描く「自閉症の子の顔」は否定的に 原因は顔ではなく先入観か","人々が頭の中に描く「自閉症の子どもの顔」を画像にして評価させる一連の実験が「Molecular Autism」誌に載った。描かれた顔は、定型発達の子の顔より魅力が低く、嫌悪や避けたい気持ちを強く起こすと評価された。自閉症の子の親が描いた顔でも同じ傾向だった。同じ顔に行動の説明や診断名をつけた実験も合わせ、研究チームは否定的な評価は顔の違いではなく、上から持ち込まれる知識や先入観から生まれると結論づけた。","\n【概要】\n研究チームが「逆相関法」という手法で、人々の頭の中にある自閉症の子どもの顔のイメージを画像にし、その印象を別の人たちに評価させた。描かれた顔は否定的に評価され、自閉症の子の親が描いた場合も同じだった。成果は「Molecular Autism」誌（2026年、17巻）に掲載された。\n【背景】\n自閉症への偏見は、本人や家族の生活の質を下げる要因になる。ただ、人がどんなイメージを抱いているかは、質問票だけではとらえにくい。\n【詳細】\n逆相関法では、ノイズを加えた2枚の顔から「より自閉症の子らしい方」を何百回も選ばせ、選ばれた画像を重ねてイメージを作る。元の顔は8歳の男児10人の写真から作った。実験1では18〜56歳の大人157人がウェブ上で300回選び、別の評価者が7段階で採点した。自閉症の子のイメージは、魅力が2.49（比較の顔は3.58）と低く、嫌悪感は4.43（同3.49）、避けたい気持ちは4.49（同3.56）と高かった。実験1aで大学生93人が描いた定型発達の男児のイメージは魅力3.61で、自閉症の子のイメージはこれより低かった。実験1bでは、診断の確認できた自閉症の子の親79人が描き、魅力は2.28（自閉症でない顔は3.38）だった。研究チームは、親が内側に取り込んだ偏見や子育てのストレスを反映している可能性を挙げている。実験2では同じ中立の顔に自閉症的な行動か典型的な行動の説明を添え（3.14と3.36）、実験3では自閉症という名札の有無で比べた（3.01と3.14）。\n【ポイント・注意点】\n研究チームは、否定的な評価は顔そのものの違いではなく、概念や知識から上から生まれると結論づけ、偏見を減らす取り組みは、ゆがんだイメージを変える認知面の工夫に向けるとよいと提案している。ただし使ったのは8歳男児の中立の表情だけで、女児や大人、別の表情に当てはまるかは分からない。行動の説明文は自閉症の当事者と作ったものではなく、偏見が自閉症に特有なのか、社会の規範から外れることへの一般的な反応なのかも区別できていない。","2026-11-21","Bioengineer.org（Scienmag）","https://bioengineer.org/mental-images-of-autistic-children-face-biased-and-negative-public-perceptions/"],["3〜6歳でも太り気味の子は血液の代謝に幅広い変化 スペイン1200人の分析","スペインの7つの自治体で集めた3〜6歳の子ども1200人の血液を調べた研究が「Molecular Biomedicine」誌に載った。体格指数（BMI）が高い子ほど、分岐鎖アミノ酸や炎症の目印、中性脂肪の多いリポたんぱくが高く、善玉のHDLなどは低かった。BMIと有意に関連した代謝の指標は75に上ったが、空腹時の血糖とは関連がなかった。一時点の調査で因果は分からず、研究者は長い追跡が必要だとしている。","\n【概要】\nスペインの研究チームが、肥満のリスクを長く追う研究「CORALS」の開始時のデータを使い、就学前の子どもの体格と血液中の代謝の指標の関係を調べた。BMIが高い子では、多くの指標がまとまって変化していた。成果は「Molecular Biomedicine」誌（2026年、7巻）に掲載された。\n【背景】\n子どもの肥満は大人になってからの心臓病や糖尿病につながるとされる。ただ、幼児期の段階で体の中の代謝がどこまで変わっているかは、よく分かっていなかった。\n【詳細】\n対象は2019年5月から2022年6月にスペインの7自治体で集めた3〜6歳の1200人（平均4.55歳、男児49.8％）。国際肥満タスクフォースの基準で、やせが9.4％、普通が68.2％、過体重が14.2％、肥満が8.2％だった。女児は過体重と肥満の合計が多く、体脂肪の指数や腹囲と身長の比も高かった。8〜10時間絶食したあとの血液を核磁気共鳴（NMR）の分析で調べ、168の指標と81の比を測った。地域、母親の学歴、摂取カロリー、画面時間、外遊びを調整して分析したところ、厳しい補正のあとでも75の指標がBMIと有意に関連し、別の補正法では107に上った。BMIが高いほど、バリンやロイシンなどの分岐鎖アミノ酸、チロシンなどの芳香族アミノ酸、炎症の目印である糖たんぱく、中性脂肪の多いVLDLが高かった。逆に、HDLに関わる指標、ベータヒドロキシ酪酸、クエン酸、アポリポたんぱくA-Iは低かった。空腹時の血糖とBMIには有意な関連がなかった。著者は、75の別々の発見ではなく、物質の種類ごとのまとまった変化だと説明している。\n【ポイント・注意点】\n一時点の調査なので因果関係は判断できない。体の組成は電気抵抗による測定で、より精密な方法ではない。数値は集団内で標準化しており、ほかの研究と比べにくい。生活習慣は親の記憶に頼り、分析に残った子は年齢や地域がやや偏っていた。研究チームは、この代謝の特徴が続くのか、将来の病気にかかわるのかを、追跡で確かめる必要があるとしている。","2026-11-21","Bioengineer.org（Scienmag）","https://bioengineer.org/preschool-adiposity-associates-with-broad-metabolic-shifts-in-spanish-children/"],["子どもへの鍼治療、59のレビューを総点検 効果の確かさは「低い」が多数","中国・四川大学の研究者らが、24歳以下の子ども・若者への鍼治療を扱った59の系統的レビューを総まとめした研究を「Frontiers in Public Health」誌に発表した。対象の試験は940件、参加者は8万3423人。自閉症や脳性まひ、ADHDなど神経・精神の分野が多かった。重い副作用の報告は少なかったが、効果の根拠の確かさは「低い」か「非常に低い」が4分の3を占めた。著者は鍼は補助的な手段と位置づけるべきだとしている。","\n【概要】\n四川大学の研究者らが、子どもと若者への鍼治療の効果と安全性を調べた系統的レビューを集めて評価する「アンブレラ・レビュー」を行った。役に立つ可能性は示されたが、根拠の確かさは全体に低かった。成果は「Frontiers in Public Health」誌（2026年、14巻）に掲載された。\n【背景】\n鍼治療は子どものさまざまな症状に使われ、レビュー論文も増えている。しかし、レビューの質や結論の確かさにはばらつきがあり、全体を見渡す評価が求められていた。同じグループによる2015年の総まとめの更新版にあたる。\n【詳細】\n2015年1月から2025年7月に出たレビューを7つのデータベースで探し、2人が独立して2753件を選別した。最終的に59のレビュー、940件の試験、8万3423人の子どもが対象になった。報告の質をみる27項目の基準では、得点は15.5〜27（中央値21.5）で、全項目を満たしたのは2件だけだった。検索方法を示したレビューは50.8％、根拠の確かさを評価したものは30.5％にとどまった。方法の質の評価では、中程度が13件（22.0％）、低いが19件（32.2％）、非常に低いが27件（45.8％）だった。56のメタ分析にある319の結果について根拠の確かさを評価すると、高いは4件（1.3％）、中程度72件（22.6％）、低い154件（48.3％）、非常に低い89件（27.8％）だった。59のうち41のレビューが神経・精神の分野で、多かったのは自閉症（10レビュー）と脳性まひ（9レビュー）。ADHDでは結論が食い違い、チック症では有効率が高めだった。安全性のデータは35のレビュー（59.3％）にあり、副作用は多くが軽く、その場で一時的なものだった。\n【ポイント・注意点】\n著者は、鍼治療は病気そのものを変える治療ではなく、症状に向けた補助的な手段として見るのが適切だとしている。もとの試験は小さく、主観的な「有効率」に頼ることが多く、リハビリや漢方と組み合わせた試験も多い。研究の事前登録、十分な人数の試験、副作用報告のやり方の統一を求めている。","2026-11-21","Bioengineer.org（Scienmag）","https://bioengineer.org/acupuncture-review-in-children-shows-potential-benefits-but-low-certainty/"],["幼い子の睡眠はなぜ短く、まとまっていくのか 数理モデルで仕組みを推定","大人の睡眠の調節を表す数理モデルを、生後1か月から5歳の子どもに当てはめた研究が「PLOS Computational Biology」誌に載った。眠気の「圧力」がたまる速さが落ちることで、成長とともに睡眠時間が短くなると説明できた。また眠気の圧力の時間の幅が長くなることで、昼寝が減り睡眠がまとまっていくと説明できた。個人差は1歳未満で最も大きく、年齢が上がるにつれて大人の値に近づいていた。","\n【概要】\n研究チームが、大人の睡眠の調節をよく表すとされる生理学に基づく数理モデルを、生後1か月〜5歳の子どもに当てはめ、成長に伴う睡眠の変化を生む仕組みを推定した。成果は「PLOS Computational Biology」誌（2026年、22巻11号）に掲載された。著者はウェッブ氏、フィリップス氏、ロバーツ氏。\n【背景】\n赤ちゃんは1日に何度も眠り、成長とともに睡眠の合計時間は短くなり、夜にまとまった眠りへと変わっていく。こうした変化がよく知られている一方、体の中でどんな調節の変化が起きているのかは、まだはっきりしていなかった。\n【詳細】\n研究チームは、ベイズ統計の手法を使って、年齢ごとにモデルの値の組み合わせの分布を推定した。使ったのは、もともと大人の睡眠を説明するために作られ、すでに確立したモデルで、論文の題も乳児期と幼児期の睡眠について集団レベルでモデルの値を推定するという内容だ。その結果、起きている間に眠気の圧力（睡眠の恒常性の圧力）がたまる速さが落ちていくことで、発達に伴う睡眠時間の短縮が説明できた。また、この眠気の圧力が変化する時間の幅が長くなることで、1日の睡眠の回数が減り、まとまった眠りになっていくことも説明できた。個人差は1歳未満の乳児期に最も大きく、年齢が上がるにつれて値の分布は、これまでに報告された大人の値へと少しずつ近づいた。さらに、時間の幅を表す値を変えたときの振る舞いを調べると、睡眠のまとまりは少しずつ進むのではなく、眠りの回数が一つずつ急になくなる形で進むことが分かった。その途中には、24時間より長い周期になって昼夜のリズムに合わない狭い区間がはさまっていた。\n【ポイント・注意点】\nこの研究は、子どもの睡眠の発達を、眠気のたまり方という生理の変化から説明する枠組みを示した点に意味がある。一方、転載記事には対象となったデータの人数や具体的な数値、研究者の所属や研究の限界は書かれていない。モデルによる推定であり、実際の子どもで同じ仕組みが働いているかは、測定による裏づけが必要になる。","2026-11-20","Bioengineer.org（Scienmag）","https://bioengineer.org/mathematical-model-identifies-physiological-shifts-governing-sleep-maturation-in-young-children/"],["10代のむちゃ食いが、のちの認知テストの低さと関連 米ABCD研究4782人","米国の大規模な子どもの脳の発達研究「ABCD」のデータで、思春期のむちゃ食いとその後の認知機能の関係を調べた研究が「Journal of Eating Disorders」誌に載った。平均12歳の4782人のうち7.6％が何らかのむちゃ食いを報告した。定期的なむちゃ食いや、それに伴う苦痛があった子は、2年後の調査時点で認知テストの総合点が低かった。著者は、むちゃ食いの症状が認知のリスクの早い目印になりうるとしている。","\n【概要】\n米国の研究チームが、思春期のむちゃ食い（過食）の症状と、その後の認知テストの成績の関係を追跡データで調べた。むちゃ食いがあった子は、のちの認知テストの点が低い傾向があった。成果は「Journal of Eating Disorders」誌（2026年）に掲載された。著者にはナガタ氏らが名を連ねる。\n【背景】\nむちゃ食いは、短い時間に大量に食べ、自分で止められない感覚を伴う食行動で、思春期から目立ち始めることがある。体や心への影響は研究されてきたが、考える力や記憶への影響を長く追った研究は限られていた。\n【詳細】\nデータは、米国の21か所で行われている「青年期の脳と認知の発達（ABCD）研究」から取った。分析の対象は平均12.0歳の4782人で、47.7％が女子だった。むちゃ食いは2年目の調査（2018〜2020年）で、精神疾患の診断基準DSM-5に沿った子ども向けの面接で調べた。何らかのむちゃ食いがあったのは7.6％、定期的なむちゃ食いは1.7％、むちゃ食いに伴う苦痛は2.8％、特徴的な症状が3つ以上あったのは2.3％だった。認知機能は4年目の調査（2020〜2022年）で、米国立衛生研究所の認知テストを使い、言葉、出来事の記憶、処理の速さ、総合点を測った。むちゃ食いを測った時点と認知を測った時点をずらした、前向きの分析だ。論文はガンソン氏、テスタ氏らを含む10人の共著。混合効果モデルで分析すると、定期的なむちゃ食い、むちゃ食いに伴う苦痛、何らかのむちゃ食いのいずれも、のちの認知テストの総合点の低さと関連していた。特定のむちゃ食いの行動は、言葉、出来事の記憶、処理の速さの成績の低さとも関連していた。\n【ポイント・注意点】\n著者は、むちゃ食いの症状が、思春期に現れ始める認知のリスクを早く知らせる臨床的な目印になりうると結論づけている。ただし、転載記事には効果の大きさを示す数値はなく、研究の限界も書かれていない。観察研究なので、むちゃ食いが認知機能を下げたという因果関係までは言えない点に注意が必要だ。","2026-11-20","Bioengineer.org（Scienmag）","https://bioengineer.org/adolescent-binge-eating-linked-to-lower-cognitive-performance-over-time-in-us-study/"],["幼児のスクリーン時間、親はなぜ減らせない？ インドで親と医師に聞き取り","インド北部チャンディーガルの病院で、2〜5歳の子を持つ親20人と小児科・精神科の医師11人に聞き取りをした研究が「Discover Public Health」誌に載った。親は睡眠の乱れやかんしゃくなどの害を知りながら、家事の間に画面を「デジタルおしゃぶり」として使っていた。多くの親は、1日1時間という国の目安を知らなかった。医師からは指針が乏しいとの声が出て、家族への相談支援や画面を使わない遊びの時間が提案された。","\n【概要】\nインドの研究チームが、幼児のスクリーン時間について親が抱える悩みと、医師が考える解決策を聞き取りで調べた。親は害を知りながらも、画面に頼らざるをえない事情を語った。成果は「Discover Public Health」誌（2026年）に掲載された。\n【背景】\n幼い子どもの画面の使いすぎは、睡眠や行動、注意力への影響が心配されている。著者らが引用する先行研究では、5歳未満で画面時間の目安を守れている子は35.6％にとどまる。\n【詳細】\n調査は、チャンディーガルの都市部にある高度医療病院の外来で行った。参加したのは、家で電子機器を1台以上使う2〜5歳の子を持つ親20人で、慢性の病気や長期の治療を受けている子は除いた。親の平均年齢は34.2歳、70％が母親だった。医師は小児科医7人と精神科医4人の計11人で、2つのグループで話し合った。医師の平均年齢は29歳で、半数以上が若手の研修医だった。研究は、健康についての信念のモデルと、個人から社会までの層で考えるモデルを枠組みにした。45〜60分の半構造化面接をヒンディー語で記録して英語に訳し、テーマごとに分析した。親は、睡眠や活動の乱れ、攻撃的な態度、かんしゃく、集中力の低下といった害を認識していたが、学びの道具としての価値も感じていた。家事やきょうだいの勉強の間、画面を「デジタルおしゃぶり」として使う親が多かった。かんしゃく、外で遊ばせにくい治安、冬の厳しい寒さが制限を難しくし、その負担の多くは母親が担っていた。親が決めた1日の上限は30分〜2時間とばらばらで、多くが国の目安（就学前の子は1日1時間）を知らなかった。医師は診療の指針が乏しく経験に頼っていると話し、家族単位の相談支援と、1日30分以上の画面を使わない遊びを勧めた。親の学歴や機器の種類は画面時間を左右していなかった。\n【ポイント・注意点】\nこの聞き取りは、340家族を対象にした画面時間を減らすプログラムの無作為化比較試験の設計に生かされた。ただし1つの病院で選んだ参加者に限られ、ほかの地域や経済状況の家庭に当てはまるとは限らない。","2026-11-20","Bioengineer.org（Scienmag）","https://bioengineer.org/qualitative-study-explores-parent-struggles-and-clinician-solutions-for-preschoolers-screen-time/"],["28週未満で生まれた子、3歳までに運動と認知の得点が伸びる 中国121人","中国・重慶の病院で、妊娠28週未満で生まれた超早産児121人の発達を修正年齢3歳まで追った研究が「Frontiers in Neurology」誌に載った。生後6か月から18〜36か月までに、運動の発達指数は約8.3点、認知の発達指数は約4.8点上がった。生まれた週数の違いは伸びと関係しなかった。早い時期の運動の遅れは一部が追いついたが、認知の重い遅れは残りやすかった。研究者は週数だけで将来を決めつけないよう求めている。","\n【概要】\n中国・重慶医科大学に属する重慶市婦女児童保健センターの研究チームが、超早産で生まれた子どもの発達の歩みを振り返って調べた。運動の発達は大きく追いつく一方、認知の伸びは小さめだった。成果は「Frontiers in Neurology」誌（2026年、17巻）に掲載された。\n【背景】\n妊娠28週未満で生まれる超早産児は、医療の進歩で助かる子が増えたが、その後の発達に遅れが出ることがある。生まれた週数で予後を考えることが多いが、個々の子の伸び方はよく分かっていなかった。\n【詳細】\n対象は2017年1月から2022年8月に新生児集中治療室に入院した、28週未満生まれの121人。生き延びた子を、修正年齢6か月、12〜17か月、18〜36か月で、ベイリー乳幼児発達検査の中国都市版を使って評価した。運動の発達指数（PDI）と認知の発達指数（MDI）を、生まれた週数で26週未満、26週台、27週台の3群に分けて比べた。慢性の肺の病気、重い脳室内出血、入院の長さ、性別を調整した分析では、6か月から18〜36か月までに、PDIは推定8.34点、MDIは推定4.77点上がった（95％信頼区間はそれぞれ5.06〜11.63、1.60〜7.94）。週数の群は、どちらの伸びとも独立した関連がなく、各時期の得点も群の間で差がなかった。6か月の時点で運動の遅れ（PDI 70未満）は11.3％、認知の遅れ（MDI 70未満）は3.8％で、有意な差があった。運動の遅れがあった12人のうち、のちの評価を受けた10人中4人が80点以上に達した。一方、早い時期に認知の遅れがあった4人のうち、追跡できた3人は全員70未満のままだった。\n【ポイント・注意点】\n研究チームは、運動の回復は認知の回復よりはっきりしており、週数だけで一人ひとりの予後を決めるべきではないとしている。早い時期の重い認知の遅れは改善しにくい可能性もある。ただ、1施設の過去の記録を振り返った研究で人数も少なく、生き延びた子だけを分析している点にも注意が要る。著者はより大きな研究が必要だとしている。","2026-11-20","Bioengineer.org（Scienmag）","https://bioengineer.org/extremely-preterm-infants-show-motor-and-cognitive-gains-by-age-three/"],["思春期の進み方と自閉症が「刺激求め」と「衝動」の差に関連 米ABCDの分析","米国のABCD研究で8〜10歳から追った子どもたちのデータを使い、思春期の進み方と自閉症が、刺激を求める気持ちと衝動を抑える力の「差」とどう関わるかを調べた研究が「Child Psychiatry & Human Development」誌に載った。男子では思春期が進んでいるほど差が大きく、自閉症の男子は差が小さかった。女子ではどちらも関連がなかった。ただし女子の自閉症は28人と少なく、統計的な力が弱いと著者は認めている。","\n【概要】\n米国のウォイチェホフスキ氏が、思春期の発達の進み方と自閉症の診断が、「二重システムの不均衡」と呼ばれる心の働きの差とどう関係するかを調べた。男子でのみ関連が見られた。成果は「Child Psychiatry & Human Development」誌（2026年）に掲載された。\n【背景】\n思春期には、刺激や報酬を求める心の働きが先に強まり、衝動を抑える働きは遅れて育つとされる。この差（不均衡）が、思春期の危険な行動の背景にあると考えられている。自閉症の子どもでこの差がどうなるかは、あまり調べられていなかった。\n【詳細】\nデータは米国の21か所で行われているABCD研究の1〜3回目の調査から取った。開始時の対象は8〜10歳の1万1880人で、欠けたデータを補う方法を使い、男子6189人、女子5667人を分析した。自閉症の診断は保護者の報告によるもので、男子173人、女子28人だった。3回目の調査で、刺激を求める傾向と、先を考えずに行動する傾向の質問から不均衡の大きさを求めた。2回目の調査の思春期の段階は、子ども自身の回答を年齢で補正して使った。男子では、思春期の進み方が不均衡の大きさとわずかに関連し（有意に近い水準）、自閉症は不均衡の小ささと関連した。両者の掛け合わせを入れたモデルでは思春期の進み方が有意になったが、掛け合わせ自体は有意ではなかった。女子では、思春期の進み方も自閉症も関連がなく、年齢、過去の暴力への接触、開始時の不均衡が予測因子だった。刺激を求める傾向と衝動の抑えを別々に分析すると、有意な関連はなかった。分析は調査地点ごとのまとまりを考慮した回帰で行い、データの補い方や補完の回数を変えても結果は変わらなかった。\n【ポイント・注意点】\n自閉症の診断は保護者の報告による有無だけで、重さは測っていない。女子は自閉症の人数が少なく、統計的な力が弱い。不均衡は単純な足し引きの指標で、感情に駆られた衝動の項目は含めていない。性別は生物学的な性だけを使い、個人の中の変化ではなく人と人の比較である点も、著者は限界として挙げている。","2026-11-19","Bioengineer.org（Scienmag）","https://bioengineer.org/pubertal-timing-and-autism-linked-to-adolescent-dual-systems-brain-development/"],["自閉症の10代は「典型像」をもとに分類を学ぶ 脳画像と9か月の追跡","知的障害のない14〜18歳の自閉症の若者64人に、架空の動物を仲間分けする課題を学ばせ、脳の働きをMRIで調べた研究が「Molecular Autism」誌に載った。多くの若者は、個々の例を覚えるのではなく、抽象的な「典型像」をもとに分類していた。典型像に沿った活動は前頭前野の内側の下部で見られた。新しい例への当てはめが上手な若者ほど、日常の適応的な行動の得点が高かった。","\n【概要】\n米国の研究チームが、自閉症の若者がどのように「仲間分け（カテゴリー）」を学ぶのかを、計算モデルと脳画像で調べた。多くの若者は、典型的な姿を頭の中に作って分類していた。成果は「Molecular Autism」誌（2026年、17巻）に掲載された。著者にはケンワージー氏、ヴァイジャ氏らが名を連ねる。\n【背景】\n自閉症の人は細部に注目しやすく、物事を一般化するのが苦手だという見方がある。しかし、学ぶときにどんなやり方を使っているかを、脳の働きと合わせて調べた研究は少ない。\n【詳細】\n対象は知能指数が80以上で知的障害のない14〜18歳の自閉症の若者64人で、9か月をあけて2回調べ、39人が両方に参加した。8つの二択の特徴で決まる魚・虫・チョウのアニメの動物を使い、典型的な姿は見せずに、5つの区切りで計240回の分類を練習させた。そのあとMRIの中で、答え合わせなしに新しい例を含む刺激を分類させた。典型像をもとにするモデルと、個々の例を覚えるモデルのどちらに合うかを比べた。練習の最後の正答率は1回目80.1％、2回目84.0％で、新しい例でも74.2％と78.0％だった。典型像に頼る若者は1回目82％、2回目71％で、7人は個々の例に頼るやり方へ移った。脳では、典型像に沿った活動が前頭前野の内側の下部（腹内側前頭前野）で有意に見られ、海馬の関わりは弱かった。全脳では、典型像に沿った活動は左右の下頭頂小葉、右の外側後頭皮質、右の前頭極にも見られ、個々の例を追う活動は左右の楔部に限られた。新しい例への当てはめが正確な若者ほど、日常の適応行動の得点が高かった。社会的な反応の困難の得点が高い若者では、左の下頭頂小葉の活動が高いほど適応行動の得点が高かった。\n【ポイント・注意点】\n自閉症の若者も抽象化して学べることを示した結果だが、比べる定型発達の群がない。刺激は二択の特徴を持つアニメで、もっと連続的な刺激に当てはまるかは分からない。78％が精神に作用する薬を1種類以上飲んでいた（覚醒系の薬は撮影の24時間前から止めた）。データの条件のため、追跡の脳画像の人数も限られた。","2026-11-19","Bioengineer.org（Scienmag）","https://bioengineer.org/autistic-adolescents-rely-on-abstract-prototypes-during-category-learning-study-finds/"],["ダウン症と脆弱X症候群の10代、文法の力は同程度 実行機能との関わりは違う","米ウィスコンシン大学マディソン校とマサチューセッツ大学アマースト校のチームが、ダウン症と脆弱X症候群の9〜17歳46人の文法の力と実行機能を調べ、「Journal of Neurodevelopmental Disorders」誌に発表した。実験課題では2つのグループに差はなかったが、親の報告では脆弱X症候群の方が日常の実行機能の困難が大きかった。作業記憶が文法の判断を助ける度合いは、グループで違っていた。","\n【概要】\n米国の研究チームが、遺伝的な原因で知的障害が起きるダウン症と脆弱X症候群の若者について、文法の力と、記憶や切り替えなどの「実行機能」の関係を調べた。成果は「Journal of Neurodevelopmental Disorders」誌（2026年、18巻）に掲載された。研究はウィスコンシン大学マディソン校とマサチューセッツ大学アマースト校で行われた。\n【背景】\nどちらの症候群でも言葉の難しさが知られているが、文法の弱さが実行機能とどう関わるか、2つの症候群で違うのかは、はっきりしていなかった。\n【詳細】\n対象は9〜17歳の46人で、脆弱X症候群の男子21人と、ダウン症の25人（うち女子9人）。年齢（平均約14歳）や非言語の知能、語彙の検査の成績はそろっていた。話す文法は40の文をまねて言う課題で、聞いて分かる文法は40の文が正しいかを判断するコンピューター課題で測り、判断の分析には信号検出理論の指標を使った。実行機能は、ブロックの順番を覚える課題、注意の妨げを無視する課題、全体と部分を切り替える課題で測り、親にも質問票に答えてもらった。課題をやり終えた割合は、文のまねが91％、注意の課題が89％、文法の判断が80％などで、年齢の低い子ほど途中でやめやすかった。実験課題の成績に2つのグループの差はなく、文のまねは約68〜69％、文法の判断はほぼ当てずっぽうの水準だった。一方、親の報告では脆弱X症候群の方が、日常の実行機能、とくに切り替えと抑制の困難が大きかった。ブロックの記憶の幅が1増えるごとに、文法の判断が正しくなる見込みは13％上がった。探索的な分析では、作業記憶は脆弱X症候群でのみ判断の正しさと関連し、切り替えの力は2つのグループで逆向きに関連していた。\n【ポイント・注意点】\n人数が少なく一時点の調査で、脆弱X症候群の女子は含まれていない。ADHDや自閉症の症状の重さなども測っていない。著者は、グループによって違う関わり方の結果は慎重に解釈し、より大きな追跡研究で確かめる必要があるとしている。","2026-11-19","Bioengineer.org（Scienmag）","https://bioengineer.org/adolescents-with-down-and-fragile-x-syndromes-show-similar-grammar-abilities/"],["親が担う自閉症幼児の言葉の支援 専門家の指導つきも独学も効果 中国の試験","中国で、言葉の表現が少ない2〜5歳の自閉症の子ども112人の親に、オンラインで社会的なコミュニケーションの支援法を学んでもらう無作為化比較試験の結果が「Molecular Autism」誌に載った。言語聴覚士の指導つきの群も独学の群も、子どもの社会的なやりとりや発話が伸び、親のストレスも下がった。機械学習の分析では、世帯の月収が低い家庭ほど専門家の指導の効果が大きかった。","\n【概要】\n中国の研究チームが、親が家庭で行う自閉症の幼児向けのコミュニケーション支援を、専門家の指導つきと独学の2つのやり方で比べた。どちらでも子どもの力が伸び、家庭の収入によって合うやり方が違う可能性が示された。成果は「Molecular Autism」誌（2026年、17巻）に掲載された。\n【背景】\n自閉症の子への早期支援は、専門家の数や費用の面で受けにくいことが多い。親が担い手になる支援をオンラインで届けられれば、より多くの家庭に広げられると期待されている。\n【詳細】\n117家族を選別し、言葉の表現が少ない生後24〜60か月の中国語を話す子ども112人を、評価者に割り付けを知らせない形で2群に分けた。指導つきの群では、親が8人の組で言語聴覚士が教える全20回のオンライン講座を受け、家庭の様子を撮った動画に毎週助言を受けた。独学の群は同じ教材を2週ごとに自動で受け取り、専門家とのやりとりはなかった。割り付けには最小化法を使い、開始時、20週の支援後、12か月後に評価した。家族には評価1回ごとに160元を渡した。両群とも、自閉症の評価尺度の社会的なやりとりの得点、発話の平均の長さ、適応行動、話す語彙の得点が有意に伸びたが、自閉症全体の重さは変わらなかった。親のストレスは下がり、子育ての自信は上がった。指導つきの群では親の満足度が下がったが、独学の群では変わらなかった。機械学習で誰に効くかを調べると、世帯の月収が最も安定した予測因子だった。月収2万5500元未満では専門家の指導の方が社会的なやりとりや語彙などの伸びがはっきり大きく、それより高い家庭では独学でも同等以上だった。開始時の社会性の適応の得点が低い子ほど、指導つきの効果が大きかった。\n【ポイント・注意点】\n独学の群は途中でやめる家庭が多かった。試験は群の中の変化を見るよう設計されており、2群の差を見分ける力は限られる。機械学習の分析は人数が少なく探索的で、仮説を立てる段階のものだと著者は述べている。親の関わり方の測り方も大まかだった。なお、別の方法でデータを補った感度分析でも、主な変化の流れは安定していた。","2026-11-19","Bioengineer.org（Scienmag）","https://bioengineer.org/parent-led-training-improves-preschool-autism-communication-in-guided-and-self-study-formats/"],["言語発達障害の幼児は雑音の中で言葉を聞く脳の働きが弱い 中国の研究","言語発達障害（DLD）のある中国の就学前の子ども34人と、定型発達の子43人を比べた研究が「Journal of Neurodevelopmental Disorders」誌に載った。雑音の中で言葉を聞き取る課題では、DLDの子は正答が少なく、脳の血流を測る近赤外線の装置では、前頭部や言語に関わる領域の活動が低かった。研究チームは、DLDの子の聞き取りの力を早い時期に幅広く調べることを勧めている。","\n【概要】\n中国の研究チームが、言葉の発達に遅れがある「発達性言語障害（DLD）」の幼児について、雑音の中で言葉を聞き取るときの脳の働きを調べた。DLDの子は聞き取りの成績が低く、言語に関わる脳の領域の活動も弱かった。成果は「Journal of Neurodevelopmental Disorders」誌（2026年、18巻）に掲載された。転載記事によると論文の公開は2026年7月2日。\n【背景】\nDLDは、ほかにはっきりした原因がないのに言葉の発達が遅れる状態で、記事は中国の子どもでの有病率を約8.5％としている。言葉を理解するには、周囲の雑音の中から声を聞き分ける力も欠かせない。\n【詳細】\nDLDの子34人と、年齢と性別をそろえた定型発達の子43人を比べた。保護者に聞き取りの様子を尋ねる質問票に答えてもらい、子どもには、雑音と同じ大きさの声で2音節の言葉を聞かせて理解を調べる課題を、静かな条件と交互に行った。その間、頭に当てた近赤外線の装置で、前頭前野の外側、ブローカ野、ウェルニッケ野、側頭葉の上部と中部で、酸素と結び付いたヘモグロビンの量の変化を測った。DLDの子は正答率と聞き分けの指標が低く、質問票ではすべての項目で困難が多かった。反応は速く、研究チームは衝動的な反応や注意の調整の弱さを反映している可能性があるとみる。定型発達の子は雑音があると左右の側頭葉の活動が高まったが、DLDの子は雑音のもとで左の前頭前野やブローカ野、右のウェルニッケ野の活動が静かなときより低かった。課題中の前頭部と側頭部の活動が高いほど、言葉と知能の得点が高かった。ただ、聞き取りの成績や右の側頭葉の活動と言葉の力の関連は、知能指数を考慮すると有意ではなくなった。\n【ポイント・注意点】\n一時点の調査で人数も限られ、2言語の環境や方言の影響などを十分に調整できていない。分析の方法にも改善の余地があり、研究チームは大きな集団や脳波を使った研究を勧めている。そのうえで、DLDの子への早い時期からの聞き取りの検査や訓練、雑音を減らす工夫を提案している。","2026-11-19","Bioengineer.org（Scienmag）","https://bioengineer.org/fnirs-reveals-auditory-processing-abnormalities-in-preschool-children-with-language-disorder/"],["乳幼児の健康を親が答える新尺度、発達検査との一致は限られる 中国591人","中国・浙江省の農村で生後6〜24か月の子ども591人を調べ、乳幼児の健康に関わる生活の質を親が答える試作の尺度「EQ-TIPS」を、専門家が行う発達検査と比べた研究が「Health and Quality of Life Outcomes」誌に載った。発達検査では4割前後の子に認知や言葉の遅れがあったが、尺度では6割が「最もよい状態」と答えていた。研究者は、両者は別のものを測っているとしている。","\n【概要】\n中国などの研究チームが、乳幼児の健康に関わる生活の質を保護者が代わりに答える試作の尺度「EQ-TIPS」の第2版を、専門家が行うベイリー乳幼児発達検査と比べて評価した。両者の一致は弱かった。成果は「Health and Quality of Life Outcomes」誌（2026年）に掲載された。記事は、この版を評価した初めての研究だとしている。\n【背景】\n乳幼児は自分で健康状態を答えられないため、保護者が代わりに答える尺度が開発されてきた。医療や政策の評価に使うには、その尺度が子どもの実際の状態をどこまで映すかを確かめる必要がある。\n【詳細】\n浙江省の農村で、段階を踏んだ抽出で選んだ生後6〜24か月の591人を調べた。主な養育者（77％が母親）が「今日」の状態について尺度に答え、訓練を受けた検査者が発達検査を行った。回答の分布、遅れの有無で分けた群の違い、発達検査との相関の3点を、年齢別に調べた。著者にはロゼル氏、デブリン氏らが名を連ねる。発達検査では、39.6％に認知の遅れ、19.1％に運動の遅れ、41.6％に言葉の遅れがあった。一方、尺度では回答者の60.2％が最もよい健康状態を選び、得点が上限に集まる「天井効果」がはっきり出た。認知・運動・言葉の遅れがある子は、それぞれ食べる・動く・伝えるの項目で問題が多いと答えられており、遅れの有無を見分ける力はある程度あった（p値は0.01未満）が、差の大きさは全体に小さかった。年齢別では、19〜24か月の子の言葉の遅れについて、伝える項目が中程度の見分ける力を示した。尺度の各項目と発達検査の総合点の相関は、全体に弱かった。\n【ポイント・注意点】\n研究者は、尺度は保護者から見た発達の状態の一部をとらえる可能性があるとしつつ、保護者が答える生活の質と専門家の発達の評価は、重ならない別の概念を測っていると結論づけた。対象は中国の農村に限られ、相関の具体的な数値も記事にはない。より幅広い集団や病気の子での検証や、ほかの尺度との比較が必要だとしている。","2026-11-19","Bioengineer.org（Scienmag）","https://bioengineer.org/eq-tips-tool-shows-limited-alignment-with-clinical-developmental-assessments-in-infants/"],["ろう・難聴の10代、肯定的な自己像と学ぶ意欲が不安・うつの低さと関連","中国中南部の6つの学校で、ろう・難聴の10〜19歳377人の心の健康を調べた研究が「Child and Adolescent Psychiatry and Mental Health」誌に載った。周囲からの支えや役割を任されること（外的な資産）は、自分を肯定的にとらえる力や学ぶ意欲などの内的な資産と結び付いていた。そして肯定的な自己像と学ぶ意欲が、不安やうつの低さにつながる主な道筋になっていた。研究者は家庭・学校・地域での後押しを求めている。","\n【概要】\n中国などの研究チームが、ろう・難聴の若者の心の健康に、「発達の資産」と呼ばれる成長を支える要素がどう関わるかを、経路分析で調べた。肯定的な自己像と学ぶ意欲が、不安やうつを和らげる鍵になっていた。成果は「Child and Adolescent Psychiatry and Mental Health」誌（2026年）に掲載された。\n【背景】\nろう・難聴の子どもは、聞こえる子に比べて不安やうつを抱えやすいと指摘されている。問題やリスクに注目する研究が多い一方、子どもの持つ強みや周囲の支えという前向きな面から心の健康を考える研究は限られていた。発達の資産は、周囲からの働きかけ（外的な資産）と本人の内面の強さ（内的な資産）に分けてとらえられる。\n【詳細】\n対象は中国の中部と南部にある6つの学校に通う、10〜19歳のろう・難聴の若者377人。すべて本人が答える質問票を使い、外的な資産（周囲の支えや役割を任されること）、内的な資産（肯定的な自己像、前向きな価値観、学ぶ意欲）、不安とうつの症状を調べた。経路分析で、直接の効果と、ほかの要素を通した間接の効果を推定した。著者はイェ氏、アクセリン氏らで、論文の題は「発達の資産がろう・難聴の若者の心の健康に与える影響」だ。その結果、周囲の支えや役割を任されることは、3つの内的な資産のすべてと正の関連があった。肯定的な自己像と学ぶ意欲は、それぞれ不安の低さ、うつの低さと直接関連していた。さらに、この2つが、外的な資産を不安とうつの低さに結び付ける主な仲立ちの役割を果たしていた。\n【ポイント・注意点】\n研究者は、外的な資産が内面の強さを育て、それが不安やうつを和らげると述べ、家庭、学校、地域が発達の資産を強めるよう勧めている。支援の枠組みには、支え、役割の付与、肯定的な自己像、学ぶ意欲を含めるとよいとしている。ただ、転載記事には使った質問票の名前や、経路の強さを示す数値は書かれておらず、研究の限界も示されていない。一時点の調査なので、因果の向きは確かめられない点に注意が必要だ。","2026-11-19","Bioengineer.org（Scienmag）","https://bioengineer.org/positive-identity-and-learning-commitment-linked-to-reduced-anxiety-in-deaf-adolescents/"],["うつ病の10代の自傷、人間関係のストレスとの結び付きが強い 中国667人","中国・武漢の病院で、うつ病の10〜19歳667人のつらい出来事、ネット依存の症状、自傷行為の関係をネットワーク分析で調べた研究が「BMC Psychiatry」誌に載った。自傷の中では、ひっかく、つねる、頭を打ちつける行為が中心的だった。つらい出来事と自傷をつなぐ役割が最も強かったのは、人間関係、勉強のプレッシャー、罰だった。ただし一時点の調査で、因果関係や支援の的を決めるものではないと著者は注意している。","\n【概要】\n中国の研究チームが、うつ病のある10代の若者について、生活の中のつらい出来事、インターネット依存の症状、自殺を目的としない自傷行為が、互いにどう結び付いているかをネットワーク分析で調べた。人間関係のストレスが自傷と最も強く結び付いていた。成果は「BMC Psychiatry」誌（2026年）に掲載された。\n【背景】\n自殺を目的としない自傷は、うつ病の若者に多く見られ、のちの自殺のリスクとも関わる。どんなストレスが自傷と結び付きやすいかが分かれば、支援の手がかりになると期待されている。\n【詳細】\n対象は武漢の病院で集めた、うつ病のある10〜19歳の667人。自傷の質問票、生活の出来事のチェックリスト、インターネット依存のテストに答えてもらった。欠けた値は20通りの補完データを作って平均し、項目同士のつながりを網の目のように表すネットワークを推定した。各項目の重要さは、ほかの項目への影響の合計を示す指標で測った。論文はユー氏、ワン氏ら11人の共著。自傷だけのネットワークでは、自分をひっかく、つねる、頭を打ちつけるといった行為が、ほかとの結び付きが最も強かった。17項目をまとめたネットワークでは、ひっかく、つねる、罰の結び付きが強かった。つらい出来事と自傷をつなぐ「橋」の役割が最も強かったのは、人間関係（0.240）、勉強のプレッシャー（0.187）、罰（0.115）だった。ただし人間関係と勉強のプレッシャーのどちらがより重要かは、統計的に確かではなかった。分析の区切り方を変えると順位が入れ替わり、インターネット依存が最上位になる場合もあった。健康への適応という項目を加えた分析では、人間関係、健康への適応、勉強のプレッシャーが上位になった。\n【ポイント・注意点】\n著者は、示されたのは統計上の条件つきのつながりで、因果関係を証明するものでも、支援の的を決めるものでもないと注意している。一時点の調査なので、どちらが先に起きたかも分からず、結果は探索的なものだという。1つの病院の患者に限られる点にも注意が要る。研究チームは、時間を追った研究が必要だとしている。","2026-11-19","Bioengineer.org（Scienmag）","https://bioengineer.org/interpersonal-stress-links-to-self-injury-in-adolescents-with-major-depression/"]]};
let memos=[]; // {cat,title,note,date}
const OLD_CUT="2026-11-07";
function isOld(d){return d<OLD_CUT}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
/* ===== 項目（ジャンル）はデータ駆動：CATS／DATAに足すだけで自動で増えます ===== */
const extraCats=[];
function allCats(){
  const list=CATS.slice();
  Object.keys(DATA).forEach(id=>{ if(!list.some(c=>c.id===id)) list.push({id:id,name:id,desc:"追加された項目",img:"hero"}); });
  extraCats.forEach(c=>{ if(!list.some(x=>x.id===c.id)) list.push(c); });
  return list;
}
let cats=allCats();
let catIdx=0;
const artIdxMap={};
function itemsOf(c){return (DATA[c.id]||[]).map((a,i)=>({a:a,oi:i})).sort((x,y)=>y.a[3].localeCompare(x.a[3]))}
function curCat(){return cats[catIdx]}
function curItems(){return itemsOf(curCat())}
function curArtIdx(){const n=curItems().length;if(!n)return 0;let i=artIdxMap[curCat().id]||0;if(i>=n)i=n-1;if(i<0)i=0;return i}
function renderStage(dir){
  cats=allCats(); if(catIdx>=cats.length)catIdx=cats.length-1; if(catIdx<0)catIdx=0;
  const c=curCat(), items=curItems(), ai=curArtIdx();
  const total=cats.reduce((s,x)=>s+(DATA[x.id]||[]).length,0);
  document.getElementById('heroText').innerHTML="<b>今日のまとめ — 全"+cats.length+"ジャンル・"+total+"件。</b> タイトルと概要は日本語、カードの「和訳全文を読む」で全文が開きます。新しい順に並べ、48時間より古い記事はグレー表示です。";
  document.getElementById('catName').textContent=c.name;
  document.getElementById('catDesc').textContent=c.desc||"";
  document.getElementById('catCount').textContent="ジャンル "+(catIdx+1)+" / "+cats.length;
  document.getElementById('catDots').innerHTML=cats.map((x,i)=>'<button class="dot'+(i===catIdx?' active':'')+'" data-cat="'+i+'" aria-label="'+x.name+'へ移動"></button>').join('');
  document.querySelectorAll('#catDots .dot').forEach(d=>{d.onclick=()=>{const n=+d.dataset.cat; if(n!==catIdx){const dd=n>catIdx?'down':'up'; catIdx=n; renderStage(dd);}}});
      const slot=document.getElementById('cardSlot');
  if(!items.length){
    slot.innerHTML='<article class="card"><div class="empty"><div class="big">✦</div><p><b>'+c.name+'</b> は追加されたばかりの項目で、まだ記事がありません。</p><p>毎日の更新でこの項目の記事が集まると、ここに表示されます。<br>上スワイプで他のジャンルへ移動できます。</p></div></article>';
    document.getElementById('artDots').innerHTML=""; document.getElementById('artCount').textContent="0 / 0"; return;
  }
  const it=items[ai], a=it.a, old=isOld(a[3]);
  slot.innerHTML='<article class="card'+(old?' old':'')+(dir?' anim-'+dir:'')+'">'
    +'<img class="ph" src="'+IMGS[c.img]+'" alt="'+c.name+'のイメージイラスト">'
    +'<div class="cbody"><div class="meta"><span class="badge'+(old?' oldb':'')+'">'+(old?'少し前':'NEW')+'</span><span>'+a[3]+'</span><span>'+(ai+1)+' / '+items.length+'</span></div>'
    +'<h3>'+a[0]+'</h3><p class="sum">'+a[1]+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="openArticle(\''+c.id+'\','+it.oi+')">和訳全文を読む</button>'
    +'<button class="btn ghost" onclick="quickMemo(\''+c.id+'\','+it.oi+',this)">メモ保存</button>'
    +'<button class="btn ghost" onclick="shareArticle(\''+c.id+'\','+it.oi+')">共有</button></div>'
    +'<div class="src">出典：'+a[4]+'<br><a href="'+a[5]+'" target="_blank" rel="noopener">原文を開く</a></div></div></article>';
  document.getElementById('artDots').innerHTML=items.map((x,i)=>'<span class="dot'+(i===ai?' active':'')+'"></span>').join('');
  document.getElementById('artCount').textContent="記事 "+(ai+1)+" / "+items.length;
  requestAnimationFrame(fitCard);
}

function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;
  const sum=card.querySelector('.sum'), h3=card.querySelector('h3'), ph=card.querySelector('.ph');
  let ss=14, hs=Math.min(21, Math.max(17, window.innerWidth*0.044)), phh=ph?Math.round(ph.getBoundingClientRect().height):0; const ph0=phh;
  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }
    if(hs>13){ hs-=0.5; if(h3) h3.style.fontSize=hs+'px'; continue; }
    break;
  }
}
window.addEventListener('resize', fitCard);
function nextArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i>=n-1)return;artIdxMap[curCat().id]=i+1;renderStage('next')}
function prevArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i<=0)return;artIdxMap[curCat().id]=i-1;renderStage('prev')}
function nextCat(){if(catIdx>=cats.length-1)return;catIdx++;renderStage('down')}
function prevCat(){if(catIdx<=0)return;catIdx--;renderStage('up')}
/* ===== スワイプ操作（スクロールではなくスワイプで移動） ===== */
const stage=document.getElementById('stage');
let sx=null, sy=null, swipedAt=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;
  swipedAt=Date.now();
  if(Math.abs(dx)>Math.abs(dy)){ dx<0?nextArt():prevArt(); } else { dy<0?nextCat():prevCat(); }
});
stage.addEventListener('click',e=>{ if(Date.now()-swipedAt<120){e.stopPropagation();e.preventDefault();} },true);
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')nextArt(); else if(e.key==='ArrowLeft')prevArt();
  else if(e.key==='ArrowDown'){e.preventDefault();nextCat();} else if(e.key==='ArrowUp'){e.preventDefault();prevCat();}
});
/* ===== 項目の追加 ===== */
document.getElementById('addCatBtn').onclick=()=>{document.getElementById('newCatName').value="";document.getElementById('newCatDesc').value="";document.getElementById('addDlg').showModal()};
document.getElementById('addCatSave').onclick=()=>{
  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast("項目名を入力してください");return}
  const desc=document.getElementById('newCatDesc').value.trim()||"追加された項目";
  const id='custom-'+Date.now();
  extraCats.push({id:id,name:name,desc:desc,img:'hero'}); DATA[id]=[];
  cats=allCats(); catIdx=cats.length-1;
  document.getElementById('addDlg').close(); renderStage('down');
  toast("項目「"+name+"」を追加しました");
};
/* ===== 記事ダイアログ・メモ・共有 ===== */
function openArticle(cat,idx){
const c=allCats().find(x=>x.id==cat); const a=DATA[cat][idx];
document.getElementById('dlgIn').innerHTML=`<img src="${IMGS[c.img]}" alt=""><div class="meta" style="margin-top:10px"><span>${c.name}</span><span>${a[3]}</span></div><h3>${a[0]}</h3><p class="sum" style="font-size:14px">${a[1]}</p><div class="full">${a[2]}</div>
<p class="src" style="margin-top:12px">出典：${a[4]} — <a href="${a[5]}" target="_blank" rel="noopener">${a[5]}</a></p>
<div class="memoBox"><label style="font-weight:800;font-size:14px">ひとことメモ</label><textarea id="memoText" placeholder="気づいたこと、作りたいもの、家族への共有メモなど"></textarea>
<div class="actions"><button class="btn primary" onclick="saveMemo('${cat}',${idx})">このメモを保存</button><button class="btn ghost" onclick="shareArticle('${cat}',${idx})">iPhoneで共有</button><button class="btn ghost" onclick="document.getElementById('dlg').close()">閉じる</button></div></div>`;
document.getElementById('dlg').showModal();
}
function quickMemo(cat,idx,btn){const a=DATA[cat][idx];memos.unshift({cat,title:a[0],note:"",date:a[3]});updateMemoUI();btn.textContent="保存しました";btn.classList.add('saved');toast("メモに保存しました（このページを開いている間）")}
function saveMemo(cat,idx){const a=DATA[cat][idx];const note=document.getElementById('memoText').value.trim();memos.unshift({cat,title:a[0],note,date:a[3]});updateMemoUI();toast("メモを保存しました");document.getElementById('dlg').close()}
function updateMemoUI(){document.getElementById('memoCount').textContent=memos.length;const area=document.getElementById('memoList');
if(!memos.length){area.innerHTML='<p class="sum">まだメモがありません。記事の「メモ保存」をタップしてください。</p>';return}
area.innerHTML=memos.map(m=>`<div class="memoItem"><b style="font-size:14px">${m.title}</b><div style="font-size:13px;color:var(--muted)">${m.note||"（ひとことメモなし）"} ・ ${m.date}</div></div>`).join('')}
function exportMemos(){if(!memos.length){toast("まだメモがありません");return}const txt="MAI topic メモ — 2026-11-10\n\n"+memos.map((m,i)=>`${i+1}. ${m.title}\n${m.note||""}\n`).join("\n");const b=new Blob([txt],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="mai-topic-memo-2026-11-10.txt";a.click();URL.revokeObjectURL(u)}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}} try{await navigator.clipboard.writeText(text);toast("コピーしました — メモアプリなどに貼り付けできます")}catch(e){toast("共有できませんでした")}}
function shareArticle(cat,idx){const a=DATA[cat][idx];shareText(a[0],`${a[0]}\n\n${a[1]}\n\n出典：${a[4]} ${a[5]}`)}
function shareMemos(){if(!memos.length){toast("まだメモがありません");return}shareText("MAI topic メモ",memos.map(m=>`・${m.title} ${m.note}`).join("\n"))}
document.getElementById('sharePage').onclick=()=>shareText("MAI topic","MAI topic — 2026年11月23日朝版（全"+cats.length+"ジャンル）");
document.getElementById('memoBtn').onclick=()=>{updateMemoUI();document.getElementById('memoDlg').showModal()};
updateMemoUI();
renderStage();
</script>

try {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
} catch (e) {}
</script>
