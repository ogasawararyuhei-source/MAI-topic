に対して持つ「親切であってほしい」「自立してほしい」といった社会化の目標が、感情表現や感情の伝え方（感情社会化）と、幼児の社会情緒的な適応との関連にどう影響するかを検証したものである。\n\n【背景】子どもの社会情緒的な発達は、養育者が日常の中でどのように感情を表現し、子どもの感情表現にどう応答するか（感情社会化）に大きく影響を受けることが知られている。しかし、養育者自身が持つ価値観や子育ての目標、例えば子どもに「親切であってほしい」のか「自立してほしい」のかといった社会化の目標が、感情社会化の効果にどのような調整的な役割を果たすかについては、十分に検討されていなかった。本研究は、こうした養育者の社会化目標という視点を取り入れることで、感情社会化と子どもの適応の関係をより精緻に理解しようとするものである。\n\n【詳細】研究チームは、養育者を対象に、子育てにおいて重視する社会化の目標（親切さ重視か、自立重視か）を調査し、それが養育者の感情社会化の実践と、幼児の社会情緒的な適応指標との関連にどのような調整効果を持つかを分析した。結果として、養育者が持つ社会化目標の違いによって、同じような感情社会化の実践であっても、子どもの適応への影響の現れ方が異なることが示された。これは、子育て支援において、画一的な「良い感情対応」のモデルを提示するのではなく、各家庭が大切にする価値観を踏まえた支援が重要であることを示唆する。価値観の違いを無視した一律の助言は、かえって効果を損なう可能性もあると考えられる。\n\n【ポイント・注意点】本研究は特定の文化的背景における調査であり、親切さや自立という価値観の重み付けは文化によって異なる可能性があるため、結果の解釈には文化的文脈を考慮する必要がある。また、横断的なデータに基づく分析である場合、因果関係の方向性については慎重な解釈が求められる。子育て支援に携わる専門家にとっては、養育者ごとの価値観の違いを尊重しながら、感情社会化のあり方について対話することの重要性を示す知見といえる。","2026-11-02","Early Child Development and Care","https://www.tandfonline.com/journals/gecd20"],["画面視聴と5〜7歳の言語発達、大半の指標で関連見られず","JAMA Pediatricsに掲載された縦断研究で、子どもと親のスクリーン使用と5〜7歳児の言語発達の関連を検証。デバイス所有や親のSNS利用などの指標の多くは言語発達と結びつかず、家庭環境全体で評価する重要性が示された。画面視聴時間だけで一律に判断すべきではないとの指摘もあり、親子の会話の質にも目を向ける必要性が示唆された。","\n【概要】\n2026年11月、医学誌JAMA Pediatricsに掲載された研究は、子どもと保護者のスクリーン使用が5歳から7歳にかけての言語発達とどう関連するかを調べたコホート研究である。これまでスクリーン使用と言語発達の関連については相反する結果が報告されてきたが、今回の研究はベースラインの差と発達的変化を区別する点に重点を置いた。\n\n【背景】研究の背景には、子どものスクリーン使用と早期言語発達に関する懸念が社会的に広く共有されている一方、先行研究の多くがベースラインの違いと発達の変化を十分に区別できていなかったという問題意識がある。研究チームは、子どもの平日・週末の平均画面視聴時間、子ども自身のデジタル端末の所有状況、母親・父親それぞれのSNS利用時間、そして主な養育者のスマートフォン使用時間という複数の指標を用い、これらが子どもの受容語彙（British Picture Vocabulary Scale）や受容文法（Test for Reception of Grammar）の発達とどう関係するかを分析した。\n\n【詳細】分析の結果、調査した大半のスクリーン使用指標は子どもの言語発達の伸びと関連していなかったことが示された。これは、スクリーン使用そのものが一律に言語発達を妨げるわけではない可能性を示唆するものであり、従来強調されてきた「画面視聴時間イコール悪影響」という単純な図式に再考を促す結果といえる。研究チームは、スクリーン使用を家庭全体の文脈の中で捉える必要性を強調しており、保護者やSNS利用など家族全体の環境要因を含めて評価することが、子どもの言語発達を理解する上で重要だとしている。\n\n【ポイント・注意点】この結果は、スクリーン使用が子どもの発達に全く影響しないと結論づけるものではなく、特定の指標や文脈によっては影響が異なりうる点に留意が必要である。研究は特定の年齢層（5〜7歳）を対象としており、乳幼児期など他の発達段階には当てはまらない可能性がある。また、親の学歴や家庭の社会経済状況などの交絡要因が結果に影響している可能性もあり、単独の研究結果として過度に一般化せず、今後のさらなる検証が待たれる。保護者にとっては、画面視聴時間の長さだけでなく、親子の会話の機会や家庭内のコミュニケーションの質にも目を向けることが、子どもの言語発達を支える上で有用な視点となる。","2026-11-01","JAMA Pediatrics","https://jamanetwork.com/journals/jamapediatrics/currentissue"],["経済的困窮が子どもの実行機能を阻害、視線計測で資源の役割を検証","学術誌Developmental Scienceに掲載された研究で、経済的に困窮した家庭の子どもの実行機能が阻害されるメカニズムを、視線追跡技術を用いて検証。注意資源や作業記憶資源など複数の資源の役割が明らかにされた。貧困対策や子育て支援政策の基礎データとなる成果である。","\n【概要】\n2026年11月、学術誌Developmental Scienceに「経済的困窮は貧困家庭の子どもの実行機能を阻害する：視線追跡で検証した複数資源の役割」と題する研究が掲載された。中国の研究チームによるこの研究は、経済的な困窮が子どもの実行機能にどのような影響を与えるか、そのメカニズムを視線追跡（アイトラッキング）技術を用いて詳細に分析したものである。\n\n【背景】経済的な困窮が子どもの認知発達、特に実行機能に悪影響を及ぼすことは、これまでの研究でも示されてきた。しかし、そのメカニズムについては、単に「資源が少ない」という単純な説明だけでなく、注意資源や認知的な処理資源など、複数の「資源」がどのように関与しているかについての詳細な検証が不足していた。本研究は、視線追跡という客観的な計測技術を用いることで、経済的困窮が子どもの認知処理プロセスにどのように影響するかを、より精密に捉えることを目指している。\n\n【詳細】研究チームは、経済的に困窮した家庭の子どもを対象に、課題遂行中の視線の動きを追跡し、実行機能に関わる認知プロセスを分析した。その結果、経済的な困窮が子どもの実行機能を阻害する過程には、単一の要因ではなく複数の資源（例えば注意資源や作業記憶資源など）が関与していることが示された。視線追跡データは、子どもが課題にどのように注意を配分し、どの程度効率的に情報を処理しているかを可視化する手段として用いられ、経済的困窮が認知処理の「質」に影響を与えている可能性を具体的に示す結果となった。こうした知見は、支援の対象を単に経済的な側面だけでなく、認知資源の補強という観点からも検討する必要性を示している。\n\n【ポイント・注意点】本研究は特定の文化的・経済的背景を持つ集団を対象としており、結果を他の社会経済的文脈にそのまま適用することには注意が必要である。また、視線追跡という手法自体の限界として、観察された視線パターンが必ずしも内的な認知プロセスを完全に反映しているとは限らない点も留意すべきである。それでも、経済的困窮と子どもの発達の関連について、より精緻なメカニズムを提示した点で、貧困対策や子育て支援政策を検討する上での重要な基礎データとなる。","2026-11-01","Developmental Science","https://onlinelibrary.wiley.com/journal/14677687"]]};

/* ===== 項目（ジャンル）はデータ駆動：CATS／DATAに足すだけで自動で増えます ===== */

}
let cats=allCats();
let catIdx=0;
const artIdxMap={};

function curCat(){return cats[catIdx]}

function curArtIdx(){const n=curItems().length;if(!n)return 0;let i=artIdxMap[curCat().id]||0;if(i>=n)i=n-1;if(i<0)i=0;return i}
function renderStage(dir){
  cats=allCats(); if(catIdx>=cats.length)catIdx=cats.length-1; if(catIdx<0)catIdx=0;
  const c=curCat(), items=curItems(), ai=curArtIdx();
  const total=cats.reduce((s,x)=>s+(DATA[x.id]||[]).length,0);
  document.getElementById('heroText').innerHTML="<b>今日のまとめ — 全"+cats.length+"ジャンル・"+total+"件。</b> タイトルと概要は日本語、カードの「和訳全文を読む」で全文が開きます。新しい順に並べ、48時間より古い記事はグレー表示です。";
  document.getElementById('catName').textContent=c.name;
  document.getElementById('catDesc').textContent=c.desc||"";
  document.getElementById('catCount').textContent="ジャンル "+(catIdx+1)+" / "+cats.length;
  document.getElementById('catDots').innerHTML=cats.map((x,i)=>'<button class="dot'+(i===catIdx?' active':'')+'" data-cat="'+i+'" aria-label="'+x.name+'へ移動"></button>').join('');
  document.querySelectorAll('#catDots .dot').forEach(d=>{d.onclick=()=>{const n=+d.dataset.cat; if(n!==catIdx){const dd=n>catIdx?'down':'up'; catIdx=n; renderStage(dd);}}});
      const slot=document.getElementById('cardSlot');
  if(!items.length){
    slot.innerHTML='<article class="card"><div class="empty"><div class="big">✦</div><p><b>'+c.name+'</b> は追加されたばかりの項目で、まだ記事がありません。</p><p>毎日の更新でこの項目の記事が集まると、ここに表示されます。<br>上スワイプで他のジャンルへ移動できます。</p></div></article>';
    document.getElementById('artDots').innerHTML=""; document.getElementById('artCount').textContent="0 / 0"; return;
  }
  const it=items[ai], a=it.a, old=isOld(a[3]);
  slot.innerHTML='<article class="card'+(old?' old':'')+(dir?' anim-'+dir:'')+'">'
    +'<img class="ph" src="'+IMGS[c.img]+'" alt="'+c.name+'のイメージイラスト">'
    +'<div class="cbody"><div class="meta"><span class="badge'+(old?' oldb':'')+'">'+(old?'少し前':'NEW')+'</span><span>'+a[3]+'</span><span>'+(ai+1)+' / '+items.length+'</span></div>'
    +'<h3>'+a[0]+'</h3><p class="sum">'+a[1]+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="openArticle(\''+c.id+'\','+it.oi+')">和訳全文を読む</button>'
    +'<button class="btn ghost" onclick="quickMemo(\''+c.id+'\','+it.oi+',this)">メモ保存</button>'
    +'<button class="btn ghost" onclick="shareArticle(\''+c.id+'\','+it.oi+')">共有</button></div>'
    +'<div class="src">出典：'+a[4]+'<br><a href="'+a[5]+'" target="_blank" rel="noopener">原文を開く</a></div></div></article>';
  document.getElementById('artDots').innerHTML=items.map((x,i)=>'<span class="dot'+(i===ai?' active':'')+'"></span>').join('');
  document.getElementById('artCount').textContent="記事 "+(ai+1)+" / "+items.length;
  requestAnimationFrame(fitCard);
}

function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;
  const sum=card.querySelector('.sum'), h3=card.querySelector('h3'), ph=card.querySelector('.ph');
  let ss=14, hs=Math.min(21, Math.max(17, window.innerWidth*0.044)), phh=ph?Math.round(ph.getBoundingClientRect().height):0; const ph0=phh;
  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }
    if(hs>13){ hs-=0.5; if(h3) h3.style.fontSize=hs+'px'; continue; }
    break;
  }
}
window.addEventListener('resize', fitCard);
function nextArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i>=n-1)return;artIdxMap[curCat().id]=i+1;renderStage('next')}
function prevArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i<=0)return;artIdxMap[curCat().id]=i-1;renderStage('prev')}
function nextCat(){if(catIdx>=cats.length-1)return;catIdx++;renderStage('down')}
function prevCat(){if(catIdx<=0)return;catIdx--;renderStage('up')}
/* ===== スワイプ操作（スクロールではなくスワイプで移動） ===== */
const stage=document.getElementById('stage');
let sx=null, sy=null, swipedAt=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;
  swipedAt=Date.now();
  if(Math.abs(dx)>Math.abs(dy)){ dx<0?nextArt():prevArt(); } else { dy<0?nextCat():prevCat(); }
});
stage.addEventListener('click',e=>{ if(Date.now()-swipedAt<120){e.stopPropagation();e.preventDefault();} },true);
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')nextArt(); else if(e.key==='ArrowLeft')prevArt();
  else if(e.key==='ArrowDown'){e.preventDefault();nextCat();} else if(e.key==='ArrowUp'){e.preventDefault();prevCat();}
});
/* ===== 項目の追加 ===== */
document.getElementById('addCatBtn').onclick=()=>{document.getElementById('newCatName').value="";document.getElementById('newCatDesc').value="";document.getElementById('addDlg').showModal()};
document.getElementById('addCatSave').onclick=()=>{
  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast("項目名を入力してください");return}
  const desc=document.getElementById('newCatDesc').value.trim()||"追加された項目";
  const id='custom-'+Date.now();
  extraCats.push({id:id,name:name,desc:desc,img:'hero'}); DATA[id]=[];
  cats=allCats(); catIdx=cats.length-1;
  document.getElementById('addDlg').close(); renderStage('down');
  toast("項目「"+name+"」を追加しました");
};
/* ===== 記事ダイアログ・メモ・共有 ===== */
function openArticle(cat,idx){
const c=allCats().find(x=>x.id==cat); const a=DATA[cat][idx];
document.getElementById('dlgIn').innerHTML=`<img src="${IMGS[c.img]}" alt=""><div class="meta" style="margin-top:10px"><span>${c.name}</span><span>${a[3]}</span></div><h3>${a[0]}</h3><p class="sum" style="font-size:14px">${a[1]}</p><div class="full">${a[2]}</div>
<p class="src" style="margin-top:12px">出典：${a[4]} — <a href="${a[5]}" target="_blank" rel="noopener">${a[5]}</a></p>
<div class="memoBox"><label style="font-weight:800;font-size:14px">ひとことメモ</label><textarea id="memoText" placeholder="気づいたこと、作りたいもの、家族への共有メモなど"></textarea>
<div class="actions"><button class="btn primary" onclick="saveMemo('${cat}',${idx})">このメモを保存</button><button class="btn ghost" onclick="shareArticle('${cat}',${idx})">iPhoneで共有</button><button class="btn ghost" onclick="document.getElementById('dlg').close()">閉じる</button></div></div>`;
document.getElementById('dlg').showModal();
}
function quickMemo(cat,idx,btn){const a=DATA[cat][idx];memos.unshift({cat,title:a[0],note:"",date:a[3]});updateMemoUI();btn.textContent="保存しました";btn.classList.add('saved');toast("メモに保存しました（このページを開いている間）")}
function saveMemo(cat,idx){const a=DATA[cat][idx];const note=document.getElementById('memoText').value.trim();memos.unshift({cat,title:a[0],note,date:a[3]});updateMemoUI();toast("メモを保存しました");document.getElementById('dlg').close()}
function updateMemoUI(){document.getElementById('memoCount').textContent=memos.length;const area=document.getElementById('memoList');
if(!memos.length){area.innerHTML='<p class="sum">まだメモがありません。記事の「メモ保存」をタップしてください。</p>';return}
area.innerHTML=memos.map(m=>`<div class="memoItem"><b style="font-size:14px">${m.title}</b><div style="font-size:13px;color:var(--muted)">${m.note||"（ひとことメモなし）"} ・ ${m.date}</div></div>`).join('')}
function exportMemos(){if(!memos.length){toast("まだメモがありません");return}const txt="MAI topic メモ — 2026-11-10\n\n"+memos.map((m,i)=>`${i+1}. ${m.title}\n${m.note||""}\n`).join("\n");const b=new Blob([txt],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="mai-topic-memo-2026-11-10.txt";a.click();URL.revokeObjectURL(u)}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}} try{await navigator.clipboard.writeText(text);toast("コピーしました — メモアプリなどに貼り付けできます")}catch(e){toast("共有できませんでした")}}
function shareArticle(cat,idx){const a=DATA[cat][idx];shareText(a[0],`${a[0]}\n\n${a[1]}\n\n出典：${a[4]} ${a[5]}`)}
function shareMemos(){if(!memos.length){toast("まだメモがありません");return}shareText("MAI topic メモ",memos.map(m=>`・${m.title} ${m.note}`).join("\n"))}
document.getElementById('sharePage').onclick=()=>shareText("MAI topic","MAI topic — 2026年11月12日朝版（全"+cats.length+"ジャンル）");
document.getElementById('memoBtn').onclick=()=>{updateMemoUI();document.getElementById('memoDlg').showModal()};
updateMemoUI();
renderStage();
</script>

try {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
} catch (e) {}
</script>
