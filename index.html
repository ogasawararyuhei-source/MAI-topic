gier/how-i-keep-claude-code-running-through-usage-limits-958"],["Claude Codeの確認をApple Watchに届ける、3つの方法を比較","Claude Codeがコマンドの許可や質問で止まったとき、Apple Watchで気づくための3つの方法を試した記事。公式のRemote Controlと通知設定、Notificationフックとntfyなどの通知サービス、筆者が作るTapprovalを比べる。前の2つはiPhoneがつながっていないと黙ってしまう。筆者は、いつもスマホを持ち歩くならまずRemote Controlから始めるよう勧めている。","\n【概要】Claude Codeが許可や質問、計画の承認で止まったとき、Apple Watchで気づく方法を3つ試した記事。筆者は3つ目の方法であるTapprovalの作者で、そのことを明記している。記事はAIの助けを借りて書かれ、2026年11月19日に内容を確かめたとしている。【背景】Claude Codeは、コマンドの許可を求めるとき、質問するとき、計画の承認を求めるときに止まる。PCの前を離れていると、止まったことに気づかないまま時間が過ぎる。筆者は腕時計で知らせを受けたいと考えた。【詳細】1つ目は公式のRemote Control。同じアカウントでiPhoneにClaudeアプリを入れ、セッションで/remote-controlと打つ。/configで「Push when actions required」を有効にすると、許可や質問を通知する。有料のサブスクリプションが必要で、APIキーでは使えない。腕時計は振動と1行の文を出すが、Claudeの腕時計用アプリはないため、答えるのはスマホになる。2つ目はClaude CodeのNotificationフックで、スクリプトからntfyやPushoverに送る。作業の終わりを知らせるclaude-watchや、ntfyで許可と拒否のボタンを付けるclaude-remote-approverが公開されている。どのプランでも使えるが、多くは知らせるだけ。3つ目のTapprovalは、PermissionRequestフックで各確認を中継に送り、腕時計に許可と拒否のボタンを出す。確認ごとに5段階の危険度を付け、既定では自動承認しない。PC側はオープンソースで、最初の100回の回答は無料、その後は買い切りで5ドル。【ポイント・注意点】前の2つの方法は、iPhoneがつながっていないと知らせが届かない。Remote Controlの通知とTapprovalを併用すると、すでに腕時計で答えた確認でもClaudeアプリが通知し、1つの質問で2回振動する。筆者はこれをAnthropic側の未解決の不具合だとしている。いつもスマホを持ち歩くなら、まずRemote Controlを勧める。","2026-11-19","DEV Community","https://dev.to/marcobelini/i-tried-three-ways-to-get-claude-codes-prompts-on-my-apple-watch-4m2o"],["1つのroutineが1日の25%を消費、スケジューラーが4回起動","複数の機械でLLMを動かす人から、全セッションとroutineのトークン消費を一覧したいと相談を受けた筆者が、手元の1台で測った記録。その日の消費は4億4,270万トークンで、43%がバックグラウンドとroutineだった。最大の消費は1つのroutineで、1日に4回起動されて全体の25.7%を使っていた。筆者は、複数の機械をまたぐ一覧はまだ作れていないと認めている。","\n【概要】1日のトークン消費を測ったところ、1つのroutineが全体の4分の1を使っていたという記録。原因は仕事の中身ではなく、スケジューラーが同じ処理を1日に4回起動したことだった。【背景】記事は、8台の機械でひとつの保管庫を複数のLLMに読ませている人からの質問で始まる。その人は、機械をまたいだ全セッションとroutineを1枚の画面で見て、トークンの行き先を知りたいと考えていた。筆者は、自分の1台の機械にすでにある計測の道具を動かし、9秒で答えを出したという。【詳細】その日のこの機械での合計は4億4,270万トークン。対話のセッションが2億5,300万（57%、6セッション）、バックグラウンドとroutineが1億8,970万（43%）だった。警告の段階は黄色で、旗は8つ立った。最大の消費は1つのroutineで、4回の実行で1億1,380万トークン、全体の25.7%を使っていた。旗には、1日に4回起動されたとしてスケジューラーの異常の疑いが記されていた。筆者は1回あたり約2,800万トークンと見積もり、問題は処理の繰り返しにあるとみる。直近24時間では、23のセッションがキャッシュ済みのトークンを延べ125億3,400万読み直していた。最大のセッションは1万1,160ターンで65億4,800万を読み直しており、それはこの記事を書いたセッションだった。【ポイント・注意点】一覧画面は7つあるが、6つは更新が止まり、最も新しいものでも104日前だった。機械をまたぐ一覧はまだ作れていない。2台の機械で1つのアカウントを使う場合、機械ごとに分けるにはセッションに印を付ける必要があるが、今はその印を出す仕組みがない。また、共通の入口であるclaude_run.pyを通らない無人の呼び出しが4つあり、監査のスクリプトには機械の区別がない。数値は1台の1日分で、筆者自身も一部が不正確な可能性を認めている。routineを無人で回すときは、起動の回数と1回あたりの消費を見張る仕組みを用意しておくと、異常に早く気づける。","2026-11-19","DEV Community","https://dev.to/cryptopunk_dz2_bd054446a6/one-routine-ate-25-of-my-day-the-scheduler-fired-it-4-times-55pl"],["Code Modeの考え方を試す、読むトークンは11分の1に","Claude Codeに実験的に加わったCode Modeの考え方を、手元のオープンモデルで再現して比べた記事。1回ずつツールを呼ぶ方式と、ツールを呼ぶ短いスクリプトを書く方式で、3つのタスクを各3回試した。正解は9回中5回と8回、読んだトークンは14万809と1万2,788だった。筆者は、同じ処理を多くのファイルに行う作業や、正確な数え上げに向くとまとめている。","\n【概要】Claude CodeのCode Modeは、Claudeがツールをつなぐスクリプトを書く実験的な機能。筆者はClaude Code自体のCode Modeではなく、その考え方を手元のオープンモデルで試した。Claude CodeのCode Modeは対話のターミナルでしか動かないためだという。記事はAIの助けを借りて書かれている。【背景】公式の文書は、関連する多くのツール呼び出しが必要な作業にCode Modeを勧めている。使うにはClaude Code v2.1.323以降、対応するモデル、CLAUDE_CODE_EXPERIMENTAL_CODE_MODE=1で始めた対話のセッションが要る。【詳細】筆者はM3 ProのMacBook Proで、Apple MLXを使い、Qwen3.6-35B-A3B（4ビット）を動かした。ファイルの一覧、読み取り、存在の確認、検索、編集の5つのツールを用意した。従来の方式では、モデルが1つのメッセージにつき1つのツール呼び出しを返す。スクリプトの方式では、同じツールを呼ぶ短いPythonのスクリプトを書き、出力だけを受け取る。架空のプロジェクトで、壊れたリンクを探す、TODOを数える（14ファイルに48件）、JSONの値を3から5に変える、という3つのタスクを各3回試した。従来の方式は9回中5回正解で、122ターン、14万809トークンを読んだ。スクリプトの方式は9回中8回正解で、20ターン、1万2,788トークンだった。TODOの数え上げでは、従来の方式は3回とも数え間違えた。【ポイント・注意点】スクリプトの方式は出力トークンが多く、5,211対4,170だった。筆者は、多くのファイルに同じ処理をする作業や正確な数え上げにはCode Modeを、結果ごとに考える必要があるデバッグなどには従来の方式を勧める。auto modeでは安全の確認がスクリプト全体に対して行われるため、必ず守らせたい決まりは拒否ルールかフックに書くよう助言している。試験は1つのモデル、小さなプロジェクト、各3回だけで、プロンプトのキャッシュも使っていない。","2026-11-19","DEV Community","https://dev.to/tabishhassan5121472/i-tested-the-idea-behind-claude-codes-new-code-mode-the-ai-read-11x-fewer-tokens-and-stopped-2f7c"]],"cnc":[["大理石彫刻の工具経路づくり、米新興が自動化","ニューヨーク・ブルックリンの石彫・建築装飾スタジオMonumental Labsが、ロボットで大理石を彫る工具経路を手作業なしで作るシステムを開発した。彫刻の3Dモデルと石材のデータを入れると、刃の通り道と向きを数百万点の規模で計算し、シミュレーションで確かめる。これまではCAMで作品ごとに手で組み、1点に数週間から数か月かかっていた。実演には産業用アームKUKA KR240を使い、石のブロックからシルクハットやウサギの像を彫り出した。","\n【概要】米ニューヨーク・ブルックリンの石彫・建築装飾スタジオMonumental Labsが、ロボットで大理石を彫るための工具経路を手作業なしで作るシステムを開発した。彫刻の3Dモデルと石材ブロックのデータを入力すると、刃の通り道と向きを数百万点の規模で計算し、シミュレーションで確かめる。担当のEleanor Wiesler氏が、ニューヨークのイベントでの講演内容を2026年10月6日付の個人ブログで解説した。\n【背景】工具経路は切削工具がたどる道筋で、最終的には機械が1点ずつ読むGコードとして書き出される。同社はこれまでもロボットで彫り、職人が手で仕上げる方法で、ニューヨークの歴史的建築の装飾の修復や等身大の人物像を手がけてきた。ただ工具経路は、金型やエンジン部品向けに作られたCAM「Autodesk PowerMill」で作品ごとに手で組み、1点に数週間から数か月かかっていた。同じ部品を何千回も作る工業製品と違い、彫刻は1点ごとに形が違うため、手組みが生産拡大の妨げになっていたという。\n【詳細】新システムは石材を小さな立方体（ボクセル）の集まりとして扱い、荒削りと仕上げを別の計算で処理する。荒削りでは高さごとに上から層を取り除き、耳やあごの下のように真上から刃が届かない部分は傾いた面に沿って削る。仕上げでは残った石をいくつかの層に分け、各層を同じ刃の向きで削れる領域に自動で分割する。領域の中では表面に沿って測った等距離の線を経路とし、各点で工具とロボットがぶつからない刃の向きと関節角度を解く。実演では産業用アームKUKA KR240が1つのブロックからシルクハットを彫り、続けて同じブロックから、CG研究の試験用モデル「スタンフォード・バニー」を彫り出した。\n【ポイント・注意点】ロボットで削った後の最終仕上げは、今後も職人が手で行う。同社サイトによれば、2023年7月にロボット1台と石工1人で始まり、現在はデザイナー、彫刻家、技術者を含む26人体制だ。ソフトとハードで石の加工を段階的に自動化し、費用を最大90%下げることを目指す。情報源は担当者の個人ブログと講演で、同社サイトにこの件のプレスリリースはない点に留意したい。","2026-11-20","FabScene（ファブシーン）","https://fabscene.com/new/news/monumental-labs-autonomous-toolpathing-robotic-marble-carving/"],["三菱電機、人型ロボと工作機械をAIで連携する実演","三菱電機が、AIの加工タスクプランナーでGalaxea Dynamicsの人型ロボットと工作機械を連携させる開発中のシステムを、東京のJIMTOF 2026で実演した。作業者が音声でタグに彫る文字を指定すると、AIが加工プログラムを作り、ロボットが材料をセットし、CNCが加工して、ロボットが完成品を取り出す。CNCとはMCP、ロボットとはROSで通信する。加工の開始や設定変更には人の承認が必要で、実用化は2030年ごろを見込む。","\n【概要】三菱電機は、AIによる加工タスクプランナー、専用の工作機械、Galaxea Dynamics製の人型ロボットを連携させる開発中のシステムを、東京で開かれたJIMTOF 2026で実演した。humanoid.guideがengineering.comの取材をもとに伝えたもので、同社は検証研究を進めており、実用化は2030年ごろと見ている。\n【背景】工作機械の周りでは、材料の段取りや部品の出し入れといった定型作業に人手がかかる。今回の仕組みは、人の作業を前提に作られた既存のラインで、人型ロボットとCNCを言葉の指示でまとめて動かすことをねらう。\n【詳細】実演では、作業者が音声でタグに彫る文字を指定した。AIが加工プログラムを生成し、人型ロボットが材料をセットし、CNCが加工し、ロボットが完成品を取り出す流れだ。プランナーは指示を解釈してタスクを作り、ロボットとCNCに指示を出す。CNCとはModel Context Protocol（MCP）、ロボットとはRobot Operating System（ROS）で、Wi-Fiか有線LANを通じてやり取りする。CNC側は加工モードの切り替え、プログラムの読み込み、取扱説明書の情報やアラームの提供ができる。プランナーとCNCのフィジカルAIには同社独自の「Maisart」技術を使い、生成したタスク計画は別のAIが内部で検証する。ロボットは登録済みのタスクライブラリに沿って動き、つかみ方や治具への置き方は事前に設定しておく必要がある。カメラとセンサーで各工程の完了を確かめ、つかみ損ねは再試行する。材料の位置がずれて機械に入れられない場合はアラームを出すが、その自動復旧は開発中だという。\n【ポイント・注意点】加工の開始、パラメータの変更、CNC設定の変更には人の承認を挟む設計で、AIに機械を自由に操作させるものではない。同社のフジタ・トモヤ氏は、多数のCNCがあり段取り替えが多い工場や、比較的小さな部品を扱う現場を用途に挙げ、重い材料には向かない可能性があるとした。現行の主力CNCシリーズにはソフトの追加で対応する計画で、古い機械への産業用PC経由の対応は構想段階にある。まず自社の生産拠点などで機械周りの定型作業から試し、その後に定型外の作業へ広げたいとしている。価格や台数は示されていない。","2026-11-20","Humanoid.guide","https://humanoid.guide/mitsubishi-electric-demonstrates-humanoid-cnc-machine-tending/"],["ベッコフ、PC制御40年の歩みから産業AIへ","工作機械とAIの専門メディアMachineToolNews.aiが、独BeckhoffのPC制御40年の歩みと産業AIへのつながりをまとめた。1986年に初のPC制御システムを納入して以来、TwinCATやEtherCATなどを重ねてきた。現在は日常の言葉で要件を伝えるとPLCやHMIの作成を手伝う「TwinCAT 3 CoAgent」や、制御の実時間環境の中で学習済みモデルを動かす機械学習機能を提供している。導入効果の数値は示されていない。","\n【概要】工作機械とAIを扱う専門メディアMachineToolNews.aiが、ドイツのBeckhoffが進めてきたPC制御40年の歩みと、それが産業AIにつながる流れをまとめた。記事は同社が提供した40周年記念の記事をもとにしている。\n【背景】Beckhoffは1986年、ダブルマイターソー向けに初のPC制御システムを納入した。その後、1989年のLightbus、1995年のモジュール式Bus Terminal、1996年にPC上でPLCとモーション制御を実時間で動かすTwinCAT、2003年のEtherCAT、2012年の搬送システムXTS、2018年の磁気浮上式XPlanar、2021年のMX-Systemと続いた。\n【詳細】2026年時点のAI関連では、まず「TwinCAT 3 CoAgent for Engineering」がある。PLCのプログラミング、I/Oの設定、HMIの開発を支援し、技術者が日常の言葉で要件を伝えると提案を返し、同社の技術文書も参照できる。「TwinCAT 3 CoAgent for Operations」は設定した稼働データへのアクセス、ログやプロセス値の分析、トラブル対応の助言を行い、チャット画面をTwinCAT HMIに組み込める。例として「この機械が止まる前に何が変わったか」という問いが挙げられている。「TwinCAT Machine Learning」は学習済みモデルを制御の実時間環境の中で動かし、重い処理にはGPU対応の別サーバー方式を用意する。「TwinCAT Machine Learning Creator」はモデルの作成と学習の一部を自動化し、画像や時系列データ向けの拡張で分類、異常検知、予測に使える。\n【ポイント・注意点】CoAgentは設計と運用の支援、TwinCAT Machine Learningは学習済みモデルの実行と役割が分かれる。対応可否は制御装置、TwinCATのバージョン、計算能力、データの取り出し方、ライセンスによって変わる。記事は効果の測り方として、設計工数、故障調査と復旧の時間、検出の正確さや見逃し、誤報を挙げ、導入費用はライセンス、計算資源、組み込み、データ準備、検証に左右されるとしている。価格やライセンス費用、導入効果の数値は示されていない。","2026-11-20","MachineToolNews.ai","https://machinetoolnews.ai/beckhoff-pc-based-control-industrial-ai/"],["Mastercam技術者が語る、対話で組むCAM「Copilot」","MachineToolNews.aiが、Mastercamの上級アプリケーションエンジニア、Jesse Trinque氏に対話型AI機能「Mastercam Copilot」について聞いた。Copilotは機械グループや加工工程の作成、確認付きの送り速度と主軸回転数の調整、簡単なスクリプト作成、ファイルの問題の指摘ができる。一方、形状の選択や切削条件、工具経路の検証はまだプログラマーの仕事で、人の確認や実機での試し削りを置き換えるものではないという。","\n【概要】工作機械とAIを扱うMachineToolNews.aiが、CAMソフトMastercamの上級アプリケーションエンジニア、Jesse Trinque氏への独占インタビューを掲載した。テーマは言葉で指示して加工プログラムづくりを進める「Mastercam Copilot」だ。Trinque氏は同社に13年勤め、顧客研修、5軸加工、複合加工の経験を持つ。\n【背景】CNCのプログラミングでは、機械や工程の設定、送り速度や回転数の調整、ファイルの点検に手間がかかる。CAM各社は対話型のAIでこうした作業を短くする機能を加えており、Copilotもその一つだ。\n【詳細】記事によると、Copilotは対応する機械グループと加工工程の作成、確認手順を挟んだ一部の送り速度と主軸回転数の調整、簡単なスクリプトの生成、プログラムファイルの問題の指摘ができる。送りと回転数の変更は、対応するミル、旋盤、ルーターの工程で使える。例として「既定の機械でミルの機械グループを作り、輪郭加工と2D高速加工の工程を入れて」と頼むと、機械グループと工程は作るが、形状の選択、ステップオーバーの設定、切削条件の決定はまだ行わない。ファイル点検では、クーラント設定の誤り、ワーク座標のずれ、工具の刃長を超える切り込み深さなどを指摘でき、変更は元に戻せる。\n【ポイント・注意点】Copilotはツールパス、ファイル、大量の形状を削除できない。また人によるレビュー、シミュレーション、実機での試し削りを置き換えるものではない。学習の場としては、Mastercam University、無料のMastercam Learning Edition、Project MFGやSkillsUSAとの連携が挙げられた。今後の方向として、Trinque氏は文脈を踏まえた自動化、送りと回転数の推奨、Sandvikの製品群とのより深い連携を挙げたが、記事はこれらを現在の機能ではなく開発上の優先事項と位置づけている。生産性向上の具体的な数値や価格は示されていない。","2026-11-18","MachineToolNews.ai","https://machinetoolnews.ai/conversational-cnc-programming-mastercam/"],["製造業向けClaude、見積や保全など17の技能を搭載","Anthropicが2026年11月12日、「Claude for Manufacturing」を発表した。17の専門技能と4つのソフト連携を備え、見積、品質管理、保全、調達、設計、生産報告を既存データで支援する。連携先はAutodesk Fusion、Infor、Microsoft 365、Oracle NetSuite。CNCやロボットなどの設備は操作しない。Claude TeamとEnterprise向けで、価格は示されていない。","\n【概要】工作機械とAIを扱うMachineToolNews.aiによると、Anthropicは2026年11月12日に製造業向けの「Claude for Manufacturing」を発表した。17の専門技能と4つのソフト連携を持つプラグインで、見積、品質問題、設備故障、生産情報の扱いを、既存システムのデータを使って支援する。\n【背景】加工現場では、見積の作成、検査不良の原因調査、故障時の記録確認、報告書づくりなど、図面や表計算、業務システムにまたがる作業が多い。記事は、こうした事務と調査の作業にAIを入れる動きとして伝えている。\n【詳細】主な用途は6つ。見積では依頼内容を分析し、足りない情報を洗い出し、過去の仕事の原価と比べる。品質管理では不合格の検査や不良を調べ、是正処置の報告書を下書きする。保全では設備の記録、センサーの出力データ、文書を調べて故障の原因候補を示す。調達では仕入れ先への見積依頼を作り、回答を比べる。設計ではAutodesk Fusionで設計案を生成して比べる。生産報告では生産量、停止時間、原価をまとめて管理者向けの報告にする。連携先はAutodesk Fusion、Infor（購買、在庫、生産）、Microsoft 365（文書、メール、品質手順、報告）、Oracle NetSuite（原価、在庫、受注）で、ほかのアプリから書き出したデータも使える。Inforの別プラグインでは承認済みの変更を扱え、鋼材の納入遅れを受けて日程の組み直しを提案し、権限を持つ社員の承認後に反映する例が示された。\n【ポイント・注意点】Anthropicは、Claude for ManufacturingはCNC工作機械、ロボット、生産設備を操作しないとしている。ファイルを介した作業の流れは機械とのリアルタイム接続ではない点も記事は指摘する。設備との接続については、研究プレビューとして「Model Hardware Standard」を別に開発中という。提供はClaude TeamとEnterpriseの利用者向けプラグインで、製造業向けのライセンス価格は公表されていない。記事は、時間短縮や見積精度の独立した検証値はまだないとし、評価には見積作成時間、報告作成時間、修正の割合、作業負荷を測るよう勧めている。","2026-11-16","MachineToolNews.ai","https://machinetoolnews.ai/claude-for-manufacturing-ai/"],["卓上CNC「NestWorks C500」、Formnext 2026に出展","中国・深センのNestWorksが、卓上CNC「C500」をドイツ・フランクフルトで11月17〜20日に開かれるFormnext 2026に出展すると発表した。C500はTIMEの「2026年の最も優れた発明」に選ばれたという。800Wで最高1万8000回転の主軸、毎分最大80立方センチの除去量、5本の自動工具交換、自動の測定と工具設定を備える。専用のCAMソフト「NestStudio」で設計から工具経路への流れを簡単にし、標準のGコードにも対応する。","\n【概要】中国・深センのNestWorksは、卓上CNC「C500」をドイツ・フランクフルトで2026年11月17〜20日に開かれる付加製造と先端生産の見本市Formnext 2026に出展すると、PR Newswireで発表した。会場は11.0ホールのD69ブース。C500は最近、TIMEの「2026年の最も優れた発明」のリストに選ばれたという。\n【背景】発表文は、デジタルの設計を実物の部品にするには専用設備や複雑な手順、外部の製造業者が必要になることが多く、小さな技術チームや個人の作り手にとって試作の妨げになっていると指摘する。そのうえでC500を、入門向けの卓上CNCと複雑な産業機械の間を埋める機械として位置づけ、精密な切削加工を小さな作業場に持ち込めるとしている。\n【詳細】仕様として、剛性の高い機械構造、出力800Wで最高1万8000回転の主軸、毎分最大80立方センチメートルの材料除去量を挙げる。5本の工具を自動で交換するATC、自動の測定と工具設定、潤滑と切りくず排出の仕組みも内蔵する。ソフト面では、同社が「インテリジェントなCAMソフト」と呼ぶNestStudioで、設計データから工具経路を作るまでの流れを簡単にするという。経験のある利用者向けには、標準のGコードや他社のCAD/CAMソフトにも対応する。同社は、技術者、メイカー、小さな事業者が試作品や特注部品、少量の製品を社内で作り、試行錯誤を速められるとしている。\n【ポイント・注意点】NestWorksは、ハードウェア、ソフトウェア、アルゴリズムを組み合わせたデジタル製造の仕組みを開発する会社で、精密な製造を誰にでも使えるものにすることを掲げる。今回の出展は、欧州の製造業の専門家にC500を紹介する場と位置づけている。発表文にC500の価格は書かれていない。仕様や性能は同社の発表によるもので、第三者による検証結果ではない点に注意したい。NestStudioがどのような形でAIを使うかについて、発表文に具体的な説明はない。","2026-11-16","PR Newswire","https://www.prnewswire.com/news-releases/time-recognized-nestworks-c500-to-showcase-desktop-cnc-manufacturing-at-formnext-2026-302937487.html"],["AIと作る無料CAD「SolidCraft」、5週間で150万DL","米ミシガン州の開発者Brennen Herbruck氏が10月に公開したオープンソースの3D CAD「SolidCraft」を、FabSceneが書面インタビューで紹介した。v0.1.0から約34日で安定版を58回出し、11月13日時点でGitHubのダウンロードは約150万回、スターは約1万6000に達した。1日に約200件のプルリクエストを取り込む。開発の多くをAIで進め、アプリにはMCPサーバーとAIエージェントのチャットを備える。","\n【概要】FabSceneが、米ミシガン州の開発者Brennen Herbruck氏が公開したオープンソースのパラメトリック3D CAD「SolidCraft」を、書面インタビューで紹介した。最初のコミットは2026年10月7日、v0.1.0は10月9日に出た。Herbruck氏は家族の農業関連事業でAIと自動化の仕事を担っている。\n【背景】ものづくりの現場では、CNCや3Dプリンターに渡す形状をCADで作る。SolidCraftは開発の多くをAIで進めた点が特徴で、リポジトリにはAIの作業手順を書いたCLAUDE.mdとAGENTS.mdが置かれている。\n【詳細】記事によると、v0.1.0（10月9日）からv0.41.0（11月12日）まで約34日で安定版を58回公開した。ナイトリー版と候補版は数えていない。11月13日までにmainへの変更は5140件、READMEのバッジでGitHubのダウンロードは約150万回、スターは約1万6000。1日に約200件のプルリクエストを確認して取り込み、11月10日は247件、11日は160件、12日は202件だった。コミットした人は約410人。v0.6.0で名前をSolveCraftから改め、v0.10.0で曲面ツールとURDF書き出し、v0.13.0でアプリ内のAIエージェントのチャット、v0.14.0でFreeCADとRhinoの読み込みや歯車・ねじの関節を加えた。形状計算の核は当初Rust製の「Truck」だったが、フィレットやブーリアンが遅く、v0.40.0でNVIDIAのC++製SMLibをRustに移した「SolidCore」に入れ替えた。アプリは公開当初からMCPサーバーを備え、チャットはClaude Code、Codex、Gemini CLI、OpenCodeに対応する。\n【ポイント・注意点】初期のREADMEはFusionに似た操作を打ち出し、Fusionで作った76個の部品を再現して精度を確かめていた。現在はAutodeskとは無関係と明記し、理論値やFreeCADとの比較で精度を確かめている。ライセンスはMITとApache-2.0から選べ、著作権者はTangency Labs。運営の形は未定だ。ダウンロード数はREADMEのバッジの数字で、同じページには6週間で190万回という別の数字もある。","2026-11-14","FabScene（ファブシーン）","https://fabscene.com/new/interview/solidcraft-open-source-cad-ai-1-5m-downloads-brennen-herbruck/"]],"cricut":[["「Merry and Bright」の無料カットファイルが配布","Silhouette Schoolブログの恒例企画「Freebie Friday」で、クリスマス向けのカットファイル「Merry and Bright」が無料公開された。Silhouette Studio用のファイルでGoogleドライブのリンクから入手でき、個人利用に限られる。用途としてTシャツや木製サイン、クッション、タンブラー、オーナメントなどが挙がった。商用で使いたい人向けには、So Fontsyで商用ライセンス付きSVGが1ドルで案内されている。","\n【概要】\nSilhouette Schoolブログは2026年11月20日（金）、恒例の「Freebie Friday」としてクリスマス向けのカットファイル「Merry and Bright」を無料で公開した。投稿では、すでにツリーを飾り終えた人に向けたデザインとして紹介している。ファイルはSilhouette Studio用で、外部のGoogleドライブのリンクから入手する形式。利用は個人用途に限られると明記されている。\n\n【背景】\nSilhouette Schoolは、Silhouetteのカッティングマシンとソフトの使い方を扱う制作ブログで、金曜日に無料のカットファイルを配る企画を続けている。前週の11月13日には感謝祭向けの「Thankful」のファイルが配られており、今回はクリスマスの飾り付けが始まる時期に合わせた内容となった。季節の言葉を使った文字デザインは、衣類から小物までさまざまな素材に転用しやすく、年末の手作りに取り入れやすい。\n\n【詳細】\n投稿が挙げる使い道は、クリスマス用のTシャツ、木製の暖炉上のサイン、玄関先に立て掛けるポーチリーナー、ホリデー用のクッション、タンブラー、オーナメントのセットの6つ。ファイルは個人利用に限られるため、作品を販売する場合は別の手段が必要になる。そのための選択肢として、フォント・素材サイトのSo Fontsyで、商用ライセンス付きのSVGを1ドルで購入できると案内している。この1ドルの提供は「Saturday 11/21/26」、つまり2026年11月21日（土）までとされている。投稿には過去の無料ファイルをまとめたラベルページへのリンクもある。\n\n【ポイント・注意点】\n無料版はあくまで個人利用向けで、販売用の品に使うなら商用ライセンス版を選ぶ必要がある。1ドルの商用版は11月21日までの期間限定のため、使う予定がある人は早めの確認が望ましい。投稿には素材や機械の設定、作り方の手順は書かれていないので、Tシャツならアイロン転写シート、木のサインなら粘着ビニールなど、使う素材に合わせた設定は各自で用意する必要がある。また投稿にはアフィリエイトリンクを含む旨の表示がある。","2026-11-20","Silhouette School","https://www.silhouetteschoolblog.com/2026/11/merry-and-bright-freebie-friday.html"],["押すと光るカード、LED回路をCricutで作る","Jennifer Makerが、紙のスイッチを押すとLEDが光る5×7インチの折りたたみ式ホリデーカードの作り方を公開した。白くまと雪の結晶、星をのせたクリスマスツリーの2種類で、無料デザイン#850としてSVG・DXF・PDFが配布される。Chibitronicsのシール型LEDと導電性テープ、電池を使い、Cricut Maker 4で切ったカードにペンで回路の下書きを描いてテープを貼る。所要時間は約1時間10分、費用は9〜14ドルとしている。","\n【概要】\n制作ブログJennifer Makerは、紙のスイッチを押すとLEDが点灯する折りたたみ式のホリデーカードの作り方を公開した（ページの表示は「Last updated: November 20, 2026」）。仕上がりは5×7インチで、白くまと光る雪の結晶のデザインと、星が光るクリスマスツリーのデザインの2種類がある。ファイルは無料のデザイン#850として、カッティングマシン用のSVGとDXF、手で切る人向けのPDFが用意され、スコア線あり・なしの2版がある。\n\n【背景】\nカッティングマシンの紙工作に電子工作を組み合わせると、カードに動きや光を加えられる。今回はシールのように貼れるChibitronicsのLaunchpad用LEDと導電性の布テープを使い、はんだ付けなしで回路を組む。スコア線ありの版はスコアリングスタイラスかシングルスコアリングホイールが必要になる。\n\n【詳細】\n材料は65ポンドのカードストック5〜7枚（8.5×11インチか12×12インチ）。白い110ポンドの土台やグリッター紙、LED3〜7個、電池またはキット、幅4mmの導電性布テープ、グルードット、フォームドットなどを使う。作者はCricut Maker 4を使用し、Maker、Explore、Venture、Joy Xtra、Joy 2でも作れるとしている。マットは緑のStandardGrip。回路の下書きは0.4mmのファインポイントペンで描き、光る位置の印は別の色のペンで描く。土台は7×10インチ、前面は7×5インチ。手順は、ファイルをアップロードしてグループ解除、カットと不要部分の除去、土台を折り、電池とLEDを固定し、下書きに沿ってテープを貼り、紙のスイッチを付けて重ね貼りし、最後にスイッチを押して点灯を試す。\n\n【ポイント・注意点】\nペンは端紙で試し書きをすること、つなぎ目にはテープを重ねること、プラスとマイナスのテープを触れさせないことが挙げられている。グリッター紙を切ったあとは刃の掃除を勧めている。フォームが光の穴をふさがないようにも注意したい。難易度は中程度で、所要時間は約1時間10分、費用は9〜14ドル。無料ファイルの入手にはメール登録が必要。","2026-11-20","Jennifer Maker","https://jennifermaker.com/light-up-card/"],["「Wish You Nothing But」文字の無料クリスマスSVG","Crafty Crafter Clubが、「wish you nothing but」の文字を主役にしたクリスマス向けの無料SVGを公開した。英国のクリスマスカードのような控えめで上品な雰囲気が特徴。ギフトタグ、クッション、マグ、Tシャツ、アクリルのオーナメント、シャドーボックスなどの作例が示され、Cricut Design Spaceで「Cut Image」として取り込み、アイロン転写の場合は反転して切る手順を説明している。利用は個人用途に限られる。","\n【概要】\nSVG配布サイトのCrafty Crafter Clubは2026年11月19日、「wish you nothing but」という言葉を使ったクリスマス向けの無料カットファイルを公開した。英国の伝統的なクリスマスカードを思わせる、すっきりした文字デザインとして紹介している。Cricutでの使い方を中心に、Silhouette Studioでも使えると説明している。\n\n【背景】\n年末は贈り物の包装やカード、季節の飾りなど、文字だけのデザインを使う場面が増える。言葉を主役にしたSVGは色や素材を選ばず、紙にもビニールにも転用しやすい。サイトはクリスマス関連の無料SVGを連日公開しており、今回もその一つとなる。\n\n【詳細】\n作例は6つ。クリーム色のカードストックに金色の永久粘着ビニールを貼ったギフトタグ、リネン地に深緑のアイロン転写シート（HTV）を貼ったクッション、光沢のある永久粘着ビニールで飾るマグ、黒地に深紅と白のHTVを重ねたTシャツ、透明なアクリル製オーナメントにメタリックビニール、カードストックで作ってシャドーボックスに飾る額装。Tシャツ向けの材料にはEasyWeedのHTV、耐熱テープ、ミニヒートプレスを、マグ向けには光沢の永久粘着ビニール、転写シート、圧着用のスクレーパーを挙げている。手順は、フォルダーを解凍し、Cricut Design Spaceで「Cut Image」としてアップロードし、縦横比を固定して大きさを変え、HTVの場合は反転してから切る、というもの。\n\n【ポイント・注意点】\nFAQでは、ファイルは個人利用のみとされ、手作りの品を贈るのは構わないが、データそのものの再販や再配布は禁じている。対応機種としてCricut Joy、Maker、Exploreが挙がっている。寸法や機械ごとのカット設定は書かれていないため、素材に合わせた設定は各自で選ぶ必要がある。切る前には、サイトのSVG Doctorでファイルを点検することを勧めている。作例ごとに素材と色の組み合わせが具体的に示されているので、配色の参考にもなる。","2026-11-19","Crafty Crafter Club","https://crafty-crafter.club/christmas/wish-you-nothing-but-svg-for-cricut/"],["自動ヒートプレス3機種比較、Cricutが厚盛りに強い","The Country Chic Cottageが、Cricut Autopress 2、HTVRont Auto Press 2、xTool WonderPressの3台の自動ヒートプレスを比べた。いずれも15×15インチの熱板で最高410°F。圧力はCricutとxToolが220ポンド、HTVRontが170ポンド。基本価格は379・349・399ドル。発泡HTVの試験ではCricutが最もなめらかに仕上がった。","\n【概要】\n制作ブログThe Country Chic Cottageのアンジー・ホールデン氏は2026年11月19日、自動で圧着するヒートプレス3機種の比較記事を公開した。対象はCricut Autopress 2、HTVRont Auto Press 2、xTool WonderPress。Cricutなどで切ったアイロン転写シート（HTV）や昇華転写の仕上げに使う機械で、仕様の比較と実際の圧着試験の結果をまとめている。\n\n【背景】\nカッティングマシンで切ったHTVを衣類に貼るには、熱と圧力を均一にかける必要がある。自動ヒートプレスは閉じるだけで設定した圧力をかけられるため、手で押す機種より負担が少ない。カッティングマシンの各社が自社のプレスを出しており、選び方が分かれる部分でもある。\n\n【詳細】\n3台とも熱板は15×15インチ、最高温度は410°F。最大圧力はCricutとxToolが220ポンド、HTVRontが170ポンド。タイマーの上限はCricutが360秒、ほかの2台は999秒。開口部の高さは1.8インチ（Cricut）、1.77インチ（HTVRont）、3.0インチ（xTool）。基本価格は379ドル（Cricut）、349ドル（HTVRont）、399ドル（xToolの本体）。操作部はCricutが外付けのコントローラー、HTVRontが起き上がる画面、xToolが前面のつまみ。昇華転写は3台とも良好だった。決め手になったのは発泡するパフHTVで、Cricutは320°F・10秒・最大圧でなめらかに均一にふくらんだ。xToolは265°F・10秒でやや粒っぽく、圧力の低いHTVRontはしわが寄った。\n\n【ポイント・注意点】\n結論として、パフHTVにはCricut、価格重視ならHTVRont、かさばる物や追加機能を使うならxToolを勧めている。Cricutはタイマーが360秒までのため、スレート（石板）のような長時間の作業では再スタートが必要。xToolは高さが16インチと最も高く、開閉に時間がかかり、慣れも要る。オーブンや3D真空の追加モジュールは別料金で、置き場所もとる。","2026-11-19","The Country Chic Cottage","https://www.thecountrychiccottage.net/autopress-comparison/"],["24インチ幅の昇華プリンター、Epson F570を試す","The Country Chic Cottageが、幅24インチまで印刷できるEpsonの昇華転写プリンターF570を試した記事を公開した。EcoTankを改造したものではない昇華専用機で、単票紙とロール紙の両方に対応し、ロール紙は印刷の終わりで自動で切れる。白いポリエステル布に大きな柄を380°で55秒圧着した。作者は自分の作業部屋には大きすぎるとして、13インチ幅のF370を好むと結論づけている。","\n【概要】\n制作ブログThe Country Chic Cottageは2026年11月19日、Epsonの24インチ幅の昇華転写プリンターF570の使用記事を公開した。作者はこれを本来の昇華専用プリンターだとし、EcoTankを転用したものとは違うと説明している。単票の用紙とロール紙の両方に印刷でき、ロール紙は印刷の終わりで自動的にカットされる。Epson独自のソフトは不要で、手持ちの印刷ソフトから使える。\n\n【背景】\n昇華転写は、専用インクで印刷した紙をポリエステルやコーティング済みの素材に熱で転写する手法で、カッティングマシン愛好者の間でも広く使われている。家庭向けの昇華プリンターは用紙の幅が小さいものが多く、大きな柄を一度に刷りたい場合は幅の広い機種が必要になる。\n\n【詳細】\n作例は白いポリエステル布に大きな柄を転写したパネル。手順は、まず布を予熱して湿気を飛ばし、印刷した紙を耐熱テープで固定し、保護紙をかぶせて380°で55秒圧着する。完成したパネルはガーデンフラッグやトートバッグ、オリジナルの布地にする予定だという。記事では同じシリーズのF170（レターとリーガルサイズの用紙）、F370（13インチ幅）、F570（24インチ幅）を比べている。全幅の柄を一度に圧着するには、少なくとも24インチ幅のヒートプレスが必要になる。転写できる素材は、白か淡い色のポリエステル布、またはポリエステルでコーティングされた硬い素材。\n\n【ポイント・注意点】\n作者はF570を自分の作業部屋には大きすぎると感じ、大きさと価格の面でF370を好むとしている。画像は拡大すると画素が粗くなるため、高解像度のデータを使うよう勧めている。インク詰まりを防ぐため、少なくとも週に1回は印刷することも挙げている。プリンターだけでなく、大きなヒートプレスの置き場所や費用まで含めて検討したい。記事にはHeat Press NationやCreative Fabricaへのアフィリエイトリンクが含まれている。","2026-11-19","The Country Chic Cottage","https://www.thecountrychiccottage.net/epson-f570/"],["DTG印刷とは何か、DTFや昇華との違いを解説","The Country Chic Cottageが、生地に直接インクを吹き付けるDTG（ダイレクト・トゥ・ガーメント）印刷を解説した。フィルムを使わない点がDTFとの違いで、濃い色の服には前処理が要る。Epson F2270で黒いTシャツに印刷し、336°で約90秒、さらに30秒圧着して定着させた。10×12インチの柄はF1070で約5分、F2270で約2分。本体価格の目安は約5,000ドルと約13,000ドルとしている。","\n【概要】\n制作ブログThe Country Chic Cottageは2026年11月19日、DTG（Direct-to-Garment）印刷の仕組みを解説する記事を公開した。DTGはフィルムを使わず、インクを服に直接印刷する方式。作者はEpsonとHeat Press Nationのイベントで、Epson F2270を使って黒いTシャツに印刷した体験をもとに説明している。\n\n【背景】\nカッティングマシンでHTVを切って貼る方法のほかに、衣類に絵柄を付ける手段としてDTF、昇華転写、DTGが広がっている。記事によれば、DTGは濃い色の服には前処理が必要、DTFはほとんどの色や素材に使える、昇華はポリエステルかコーティング済みの淡い色の素材に限られる、という違いがある。\n\n【詳細】\n使用したF2270の印刷範囲は16×20インチ。比較対象のF1070は10×12インチで、10×12インチの柄はF1070で約5分、F2270で約2分かかる。ソフトはWindowsとMacで動くEpson Garment Creator。手順は、柄の大きさを整え、前処理済みのシャツを予熱し、枠の中で平らに台に載せて印刷する。最高画質の設定では白インクを2層重ねてから色を刷り、低い設定では白と色を1層ずつ刷った。印刷直後のインクは濡れたままで、ヒートプレスで定着させるまで乾かない。プレスは336°に設定し、保護紙をかぶせて約90秒押したが、蒸気が出たため30秒追加した。作者が示した価格の目安はF1070が約5,000ドル、F2270が約13,000ドル。\n\n【ポイント・注意点】\nDTGは毎日の起動時と終了時に手入れが必要で、導入費も大きい。記事は家庭の趣味より、量を作る小規模事業者向けの設備として読むのがよさそうだ。濃い色の服には前処理が欠かせない点にも注意したい。DTFや昇華転写と比べた向き不向きを押さえたうえで、作りたい物に合う方式を選びたい。作例のおばけの柄はCreative FabricaのPNG素材で、記事からリンクされている。","2026-11-19","The Country Chic Cottage","https://www.thecountrychiccottage.net/what-is-dtg-printing/"],["自宅でビニールTシャツ、9段階の手順を解説","Silhouette Americaの公式ブログが、アイロン転写シート（HTV）でオリジナルTシャツを作る初心者向けの手順を公開した。HTVは熱と圧力で布に付き、硬い面向けの粘着ビニールとは別物だと説明する。デザイン、反転、試し切り、不要部分の除去、圧着、はがしなど9つの手順を示し、温度や時間は製品ごとのメーカー指定に従うよう繰り返す。よくある失敗7つと洗濯の注意も載っている。","\n【概要】\nSilhouette Americaの公式ブログは2026年11月18日、アイロン転写シート（HTV）を使って自宅でオリジナルTシャツを作る手順を、初心者向けに順を追ってまとめた記事を公開した。HTVは熱と圧力で布に接着する素材で、硬く滑らかな面に貼る粘着ビニールとは用途が違うことを最初に説明している。\n\n【背景】\nTシャツ作りはカッティングマシンの代表的な用途だが、素材の選び違いや反転忘れなど、初心者がつまずく点が多い。同じ日にはTシャツ作りに必要な道具をまとめた記事も出ており、今回はその実践編にあたる。HTVにはスムース、グリッター、フロック、メタリック、ストレッチなどの種類があり、布の種類や色の対比、熱への弱さで選ぶとしている。\n\n【詳細】\n必要な物は、対応するSilhouetteの機械、合う刃、必要ならマット、HTV、Silhouette Studio、きれいな衣類、除去用のフック、ヒートプレスかメーカーが認めるアイロン、推奨される場合のカバーシート、耐熱の作業台。手順は9つ。（1）Silhouette Studioでデザインする。例はデザインストアのID D-1292795。（2）大きさを整えて反転する。一般的なHTVは台紙側を下にして反転して切る。（3）道具の対応表に従って刃と設定を選ぶ。（4）試し切りで、台紙を切らないハーフカットを目指す。（5）小さな文字や閉じた部分に気をつけて不要部分を除く。（6）乾いたきれいなシャツを用意し、推奨があれば軽く予熱する。（7）HTVのメーカー指定の温度・圧力・時間で圧着する。（8）製品に合わせて熱いうち、温かいうち、冷めてからのいずれかではがす。（9）多色の場合は1色ずつ切って貼り、貼った部分をカバーシートで守る。\n\n【ポイント・注意点】\n記事は共通の温度や時間を示さず、必ずメーカーの値を使うよう繰り返している。よくある失敗として、粘着ビニールを使う、反転を忘れる、試し切りを省く、圧力のむら、温度や時間の当て推量などの7つを挙げる。洗濯は裏返して行い、メーカーが示す待ち時間を守り、高温を避ける。むき出しの柄に直接アイロンを当てるのは、メーカーが認める場合だけにする。","2026-11-18","Silhouette America","https://www.silhouetteamerica.com/blog/post/how-to-make-custom-vinyl-t-shirts-at-home"],["年末商戦の小さな店へ、カッターで包装を統一","Silhouette Americaの公式ブログが、ホリデーの手作り市などに出る小規模事業者向けに、包装をそろえる考え方と作り方をまとめた。色は主色と差し色の2つ、季節の模様は1つ、書体は2つに絞ってタグ、シール、同封カードを統一する。シールは用途で印刷用シール紙、印刷用ビニール、粘着ビニールを使い分け、印刷・カット・仕分け・組み立ての順で量産する手順と、試し切りの勧めを示している。","\n【概要】\nSilhouette Americaの公式ブログは2026年11月18日、ホリデーシーズンの小さな店に向けた包装づくりの記事を公開した。中心となる助言は、見た目のルールを1つの体系にまとめること。主色1つと差し色1つ、星やリボン、雪の結晶、緑の葉、オーナメントなどから選んだ季節の模様1つ、店名用の目立つ書体と商品説明用の読みやすい書体の2つで、包装全体をそろえる。\n\n【背景】\n手作り市に出店する作り手にとって、包装は品物の印象を左右する。カッティングマシンがあれば、タグやシール、同封カードを自分で作って統一感を出せる。一方で、作業が場当たり的になると時間がかかるため、記事は型を決めてまとめて作る流れを勧めている。\n\n【詳細】\nタグは1つの型を使い回し、上に店名かロゴ、中央に商品情報、下に季節の飾りを置く。形は長方形、波形の円、アーチ、小さな旗から選ぶ。素材は中厚のカードストックで、ロゴや取り扱い表示、QRコードはプリント＆カットで作る。シールは、室内で短期間使う包装なら印刷用シール紙、柔軟さや耐久性が要るなら印刷用ビニール、瓶やボトル、硬い容器には粘着ビニールを使う。プリント＆カットでは位置合わせマークの周りを空け、反射に気をつけ、まず小さく試し切りをする。同封物はお礼状、取り扱いカード、QRコードのカード、贈り物のメモ。量産は印刷、カット、仕分け、組み立ての順に進め、各回の前にSendパネルで素材の設定を選び、マットの有無、素材の向き、道具を確認する。\n\n【ポイント・注意点】\nシール紙やカードストックの厚さ、ビニールの仕上げ、刃の状態を変えたら必ず試し切りをする。きれいに切れる中でいちばん弱い設定を選び、厚い紙が外れないときは、刃の深さを大きく変える前に力を少し上げるか、もう1回切ることを勧めている。光沢やラミネート素材は反射を抑える工夫が要る。よくある失敗として、書体の使いすぎ、詰め込みすぎのラベル、売れてから包装を考えることを挙げている。具体的な刃や力の数値は示されていない。","2026-11-18","Silhouette America","https://www.silhouetteamerica.com/blog/post/small-business-packaging-ideas-for-the-holidays"],["UVプリンターで作るゴルフの贈り物セット","Ruffles and Rain Bootsが、xTool O1 OMNIのUVプリンターでゴルフ好き向けの贈り物セットを作る方法を紹介した。名前入りのPUレザーのティーホルダー、ティー、白いネオプレンの缶クーラー、飾り用のゴルフボールを組み合わせる。缶クーラーは1色層・高画質・ぼかし100％で1枚約3分。ビンテージ調のゴルフ柄3点は作者のショップなどで無料で入手できる。","\n【概要】\n制作ブログRuffles and Rain Bootsは、xTool O1 OMNIのUVプリンターで作るゴルフの贈り物セットの記事を公開した（ページの表示は「Updated: November 18, 2026」）。筆者はサラ・ネニ＝ダハー氏。モノグラムを入れたPUレザーのティーホルダー、ゴルフティー、白いネオプレン製の缶クーラー、UV印刷したゴルフボールを1つのセットにまとめている。\n\n【背景】\nカッティングマシンやレーザーを使う作り手の間で、硬い物や曲面に直接印刷できるUVプリンターが広がっている。使用したxTool O1 OMNIはデュアルヘッドで、CMYK、ニス、硬質用と柔軟用の白、蛍光の赤と黄のインクを使える。年末の贈り物の時期に合わせ、趣味に合わせた名入れの品をまとめて作る例として紹介されている。今回はカッティングマシンで切って貼るのではなく、UVプリンターで名前や絵柄を素材に直接印刷する手法が中心になっている。\n\n【詳細】\n缶クーラーの設定は、色の層1つ、高画質、フェザー（ぼかし）100％。1枚の印刷に約3分かかり、名前を入れた裏面も同じ設定で約2分だった。それぞれが平らに置けるよう、1枚ずつ印刷することを勧めている。色の濃いクーラーには、柔軟用の白インクを下地に使える。ゴルフボールは印刷が使用に耐えないため、飾り専用とされる。包装は、ボタン留めと持ち手の付いた透明な袋に、受け取る人の名前を入れたUV DTFのステッカーを貼る。ビンテージ調のゴルフの絵柄3点は、作者のショップ（支払い0円）またはAtommで無料で入手できる。\n\n【ポイント・注意点】\n白以外の背景がある絵柄は、先に画素を取り除くツールで背景を消してから印刷するよう勧めている。ゴルフボールは実際の使用には向かない点に注意したい。缶クーラーは1枚ずつ平らに置いて印刷することが、仕上がりをそろえるこつとされている。ページには発行日ではなく更新日だけが記されている。記事にはアフィリエイトリンクが含まれ、画像はリンクを付ければ1枚だけ使ってよく、それ以外の利用は認められていない。","2026-11-18","Ruffles and Rain Boots","https://rufflesandrainboots.com/uv-printed-golf-gift-set/"],["ChatGPTで絵柄を編み物風・刺しゅう風に変える","Silhouette Schoolが、ChatGPTのテクスチャ用プロンプトで平面のPNG画像を、形と色を保ったまま太編みのニット、クロスステッチ、キルト、革のような質感に変える方法を紹介した。効果は11種類で、刺しゅうと太編みはSilhouette Uの無料ツール欄で配布。仕上げた画像をxTool Studioに取り込み、xTool O1 Omni DualでUV印刷した。キルト柄の印刷は約10〜12分だった。","\n【概要】\nSilhouette Schoolブログは2026年11月17日、ChatGPTに入力するテクスチャ用プロンプトで、平面的なPNGのデザインを編み物や刺しゅう、キルトのような見た目に変える方法を動画付きで紹介した。形と色を保ったまま質感だけを加えられるのが特徴で、作者は11種類の効果を用意している。このうち刺しゅうと太編みのニットは、Silhouette Uの無料ツールの欄で無料で入手できる。\n\n【背景】\n画像生成AIを、カッティングマシンやプリンターの素材づくりに取り入れる作り手が増えている。平面のイラストでも質感を加えるだけで印象が変わり、冬の小物に合う温かい雰囲気を出せる。今回はUVプリンターでの立体的な仕上げまで試している。\n\n【詳細】\n使い方は、プロンプトをコピーしてChatGPTに貼り、できれば背景を透明にしたPNGをアップロードして1〜2分待つ。縁が崩れたら最初からやり直さず、縁をもっときれいに仕上げるよう頼む。印刷する場合は、結果を透明なPNGとして保存し、xTool Studioに取り込む。作者はxTool O1 Omni Dualで印刷した。クロスステッチと太編みにはテクスチャモードが最も合った。キルトの柄にはレリーフモードを使い、このモードはxToolアカウントのクレジットを消費する。印刷前には3Dプレビューで深さを確認できる。柄に白が含まれていたため、インクのモードは「white and color」にした。キルト柄の印刷にかかった時間は約10〜12分。\n\n【ポイント・注意点】\n質感を加えたPNGは、昇華転写、DTF、DTG、ステッカー、普通紙にも使え、平面の印刷でも縫い目のような見た目は残ると作者は述べている。レリーフモードはクレジットを使うため、回数には注意したい。質感の加工はAIに任せ、印刷方式や素材は自分で選ぶという分担が、この手法の要点といえる。HTVにUV印刷して刺しゅう風のワッペンを作る関連記事へのリンクもある。記事にはアフィリエイトの表示がある。","2026-11-17","Silhouette School","https://www.silhouetteschoolblog.com/2026/11/chatgpt-texture-prompts-make-design.html"],["手作り市のブース看板をカッターで作る4案","Silhouette Americaの公式ブログが、ホリデーの手作り市で使うブース用の看板づくりを紹介した。客は「何か・いくらか・どう払うか・贈り物向きか」を短い時間で判断するとして、値札、分類ラベル、QRコードの表示、テーブル用の案内の4つを提案する。材料はカードストック、粘着ビニール、印刷用シール紙など。QRコードは反射や素材の飾りを避け、印刷した実物でいろいろな角度から読み取りを試すよう勧めている。","\n【概要】\nSilhouette Americaの公式ブログは2026年11月17日、ホリデーシーズンの手作り市に出店する人向けに、ブースの看板をカッティングマシンで作る記事を公開した。出発点は、客が品物について「何か」「いくらか」「どう払うか」「贈り物に向くか」をすぐに判断するという考えで、看板はこれらの問いに答えるべきだとしている。\n\n【背景】\n年末の手作り市は作り手にとって大きな販売の機会で、ブースの見やすさは売り上げに関わる。カッティングマシンがあれば、値札や案内を統一したデザインで自作できる。同じ日に同ブログは包装づくりの記事も公開しており、出店準備の一連の記事となっている。\n\n【詳細】\n提案は4つ。（1）値札：卓上の札や棚のラベルを、カードストック、木やアクリルの板に貼った粘着ビニール、印刷用シール紙で作る。色の対比を強くし、裏に分類名を書いておく。（2）分類ラベル：アーチ、長方形、波形のタグ、小旗などに季節の飾りを1つ添え、数フィート離れても読める大きな文字にする。（3）QRコード：支払い、ネットショップ、メールマガジン、特注の受付への案内を、カードストックの三角立てやアクリルの額に高い対比で印刷する。（4）テーブル用の案内：包装受付、名入れの相談、取り扱い方法、人気商品、会計場所など。材料はカードストック、粘着ビニール、印刷用シール紙か印刷用ビニール、転写シート、スクレーパー、除去用フック、小さなスタンド、リボンやひも。\n\n【ポイント・注意点】\n統一感のため、見出し用と補助用の書体を1つずつ、枠や絵柄の繰り返し、2〜3色、そろった仕上げを勧める。作業はカードストック、ビニール、プリント＆カットのラベルの順に切り、売り場の区画ごとに封筒に分けてまとめる。練習で並べた机を写真に撮っておくとよい。本番の素材でも必ず試し切りをする。よくある失敗は、文字の詰め込み、小さな値段、ばらばらの様式、読み取れないQRコード。QRコードはデータではなく印刷した実物で試すこと。記事に機械の設定値は載っていない。","2026-11-17","Silhouette America","https://www.silhouetteamerica.com/blog/post/diy-booth-signs-for-holiday-markets"],["犬のクリスマス・トーテム柄、無料SVGで小物作り","Crafty Crafter Clubが、犬を積み重ねたトーテム風のクリスマス用無料SVGを公開した。複数の色のビニールを重ねて立体感を出す使い方を勧め、アクリルのオーナメント、家族おそろいの黒Tシャツ、散歩用の犬のバンダナ、マグ、ギフトタグ、木の看板の作例を挙げる。ストレッチHTVや耐熱のマグ素材など材料も示し、Cricut Design SpaceとSilhouette Studioで使える。個人利用に限られる。","\n【概要】\nSVG配布サイトのCrafty Crafter Clubは2026年11月17日、犬をモチーフにしたクリスマス向けの無料カットファイル「Christmas Dog Totem」を公開した。犬を積み重ねたトーテムのような遊び心のあるデザインとして紹介し、複数の色のビニールを重ねて立体的に見せる使い方を勧めている。\n\n【背景】\nペットをテーマにした季節の小物は、家族や犬好きへの贈り物として人気がある。同サイトはクリスマス関連の無料SVGを連日公開しており、今回は犬好き向けの一点。衣類から食器、木製品まで幅広い素材に使える用途の広さを打ち出しており、作例ごとに合う素材も分けて示している。\n\n【詳細】\n作例は6つ。永久粘着ビニールで飾るアクリルの丸いオーナメント、白いHTVを貼った家族おそろいの黒Tシャツ、冬の散歩用にアイロンで貼る犬のバンダナ、光沢の永久粘着ビニールで飾る陶器のマグ、ギフトタグ、廊下に飾る木の看板。材料には、伸びる布向けのストレッチHTV、EasyWeedのHTV、ミニヒートプレス、オーブンで使える陶器のマグ、光沢の永久粘着ビニール、転写シート、洗う物向けの防水ビニールが挙がる。手順は、フォルダーを解凍し、Design Spaceにアップロードし、素材に合わせて大きさを変え、HTVの柄は反転して、カードストック、HTV、粘着ビニールなど素材に合わせて機械の設定を変えて切る、というもの。Silhouette Studioにも対応する。\n\n【ポイント・注意点】\nライセンスは他の同サイトの投稿と同じく個人利用のみで、贈り物にするのは認められるが、データの再販や再配布はできない。手作りの品を販売できるかどうかは、FAQでもはっきり書かれていない。寸法や細かいカット設定は記載がないため、使う素材と機械に合わせて各自で調整する必要がある。洗濯する品には防水ビニールを選ぶなど、用途に合う素材選びが仕上がりを左右する。切る前には、サイトのSVG Doctorでファイルを点検することを勧めている。","2026-11-17","Crafty Crafter Club","https://crafty-crafter.club/christmas/christmas-dog-totem-svg-for-cricut/"],["DTFプリンターxTool Apparel Printer Plusを評価","The Country Chic Cottageが、DTF方式の衣類用プリンター「xTool Apparel Printer Plus」の使用レビューを公開した。前機種からの変更点は、湿度を45〜65％に保つ加湿器、2つの湿度センサー、改良したインクダンパー、自動のウェットキャップ。ヘッドは30日以上湿ったまま保たれ、保湿液の使用は最大75％、インクは約80％減るという。印刷の質と速さは前機種と同じとしている。","\n【概要】\n制作ブログThe Country Chic Cottageは2026年11月17日、xToolのDTFプリンター「Apparel Printer Plus」の正直なレビューを公開した。DTFは、フィルムに印刷して粉を付けて硬化させ、熱で衣類に転写する方式。作者は粉の付着と硬化を自動で行うシェーカーとオーブン、空気清浄機と組み合わせて使っており、これが家庭で最も安全な構成だと述べている。\n\n【背景】\nカッティングマシンで切ったHTVに代わり、多色の柄を手軽に衣類へ転写できるDTFは、作り手の間で広がっている。一方で、使わない期間にヘッドが乾いて詰まりやすいことが課題とされてきた。今回のPlusは、その乾きの対策を中心に改良されている。\n\n【詳細】\n前機種からの変更点は、湿度を45〜65％に保つ内蔵の加湿器（水道水を補充する）、1つから2つに増えた湿度センサー、改良したインクダンパー、自動のウェットキャップ。作者によると、ヘッドは30日以上湿った状態が保たれ、保湿液の使用量は最大75％、インクの使用量は約80％減る。印刷の質と速さは前機種と変わらないという。前機種の持ち主向けには、加湿ボックス、インクダンパー、ソフト更新を含むアップグレードキットがあり、xToolからクーポン付きのメールが届く。新たにxTool StudioアプリからBluetoothで印刷できるようになり、画像は自動で反転される。xTool WonderPressでの圧着手順は、プレスを320°に予熱、シャツを予熱、柄の位置を決め、保護紙をかぶせて10秒押し、冷却ブロックで冷まして台紙をはがし、再び保護紙をかぶせて10秒押す。\n\n【ポイント・注意点】\nDTFは粉と硬化の工程を伴うため、作者は自動のシェーカーとオーブン、空気清浄機を組み合わせることを安全面から勧めている。前機種を持つ人は、本体を買い替えずにアップグレードキットで改良点を取り入れられる。記事にはアフィリエイトリンクが含まれ、素材の利用条件についての記載はない。","2026-11-17","The Country Chic Cottage","https://www.thecountrychiccottage.net/xtool-apparel-printer-plus/"],["ミニーのクリスマス柄、無料SVGでおそろいの服に","Crafty Crafter Clubが、ミニーマウスのシルエットにクリスマスの飾りを組み合わせた無料SVGを公開した。家族おそろいのパジャマや手作りの贈り物、季節の飾りに向くとし、赤いベルベットのクッション、木箱で作るクリスマスイブの箱、Tシャツ、マグ、グリッターHTVのアクリル飾り、トートバッグの作例を挙げる。個人利用に限られ、キャラクターの権利については記載がない。","\n【概要】\nSVG配布サイトのCrafty Crafter Clubは2026年11月16日、ミニーマウスのシルエットにクリスマスらしい装飾を合わせた無料カットファイルを公開した。家族おそろいのパジャマ、手作りの贈り物、季節の飾りに向くデザインとして紹介している。Cricut向けの手順を中心に、Silhouette Studioにも直接取り込めるとしている。\n\n【背景】\nキャラクターを使った季節の柄は、子どものいる家庭のクリスマスの手作りで人気が高い。同サイトはクリスマス関連の無料SVGを連日公開しており、前日までにはミッキーの柄も出ている。家族でそろえる衣類や、イブに贈り物を入れる箱など、行事に合わせた使い道を幅広く示している。\n\n【詳細】\n作例は6つ。赤いベルベットに白いフロックHTVを貼ったクッションカバー、木箱で作るクリスマスイブの箱、白いHTVを貼った黒いTシャツ、光沢ビニールで飾るマグ、透明なアクリルのオーナメントにグリッターHTV、ホリデー用のトートバッグ。材料は、グリッターHTV、通常のアイロン転写シート、耐熱テープ、綿のトートかTシャツ、光沢の永久粘着ビニール、透明の転写シート、アクリルのオーナメント、圧着用のスクレーパー。手順は、ファイルを解凍して.svgをアップロードし、アイロン転写の柄はカットのプレビューで反転し、柄以外の部分をすべて取り除き、ビニールの種類に合わせてカット設定を確認する。寸法や機械の設定値は書かれていない。\n\n【ポイント・注意点】\nライセンスは同サイトの他の投稿と同じく個人利用のみで、手作りの贈り物は認められるが、データの再販や再配布はできない。ミニーはディズニーのキャラクターで、ページのタグにも名前が入っているが、キャラクターの権利についての説明はない。商用での利用や作品の販売を考える場合は、この点を特に慎重に考える必要がある。作例ごとにHTVの種類と布の組み合わせが示されているので、配色の参考になる。切る前には、サイトのSVG Doctorでファイルを点検することが勧められている。","2026-11-16","Crafty Crafter Club","https://crafty-crafter.club/christmas/minnie-christmas-svg-for-cricut/"],["xTool M2で虹のアーチの3D小物入れを作る","The Country Chic Cottageが、レーザーと印刷のモジュールを持つxTool M2で、虹のアーチ形の3D小物入れを作る手順を紹介した。xToolのコミュニティにある無料の設計を使い、正面に雲の飾りと「Hazel」の名前を入れる。材料は木の板、色付きアクリル、接着剤。木を切り、アクリルを切り、マルチモジュールの処理で印刷してから切る流れを示し、換気や仮組みの注意も挙げている。","\n【概要】\n制作ブログThe Country Chic Cottageのアンジー・ホールデン氏は2026年11月16日、xTool M2で虹のアーチ形の3D小物入れを作る記事を公開した。正面には雲の飾りと名前（作例では「Hazel」）を入れる。xToolのコミュニティで公開されている無料の設計を使い、木の板、雲用の色付きアクリル、接着剤、印刷した虹の層で組み立てる。\n\n【背景】\nxTool M2は印刷モジュールとレーザーモジュールを持つ機械で、印刷した部品をそのまま切り抜ける。カッティングマシンでいう「プリント＆カット」に近いことを、木やアクリルで行える。作者は、印刷機能のないxToolのレーザーでも、印刷の工程を省けば同じ作品を作れるとしている。\n\n【詳細】\n手順は6段階。（1）xToolコミュニティで小物入れを検索し、無料の作品に絞ってxTool Studioで開く。設計は印刷層とカット用の2つのファイルで届いた。（2）素材に合わせて大きさを変え、筆記体の書体で名前を加え、文字が1つの部品として切れるよう溶接する。（3）色を付けない木の部品を先に切る。磁石の押さえで木を固定し、カメラで台を撮影して部品を並べ、その板に載らない部品は出力をオフにし、素材の種類を選んで処理し、フレーミングで範囲を確かめてから開始し、本体前面のボタンを押す。（4）色付きアクリルで雲を切る。（5）処理をマルチモジュール（最新版では「Print Then Cut」）に切り替え、両方の層の設定を確かめて処理する。ソフトの指示に従ってレーザーを印刷ヘッドに付け替えて印刷し、戻して印刷した部品を切る。（6）仮組みしてから、切り込みを穴に差して接着し、外側の虹、雲と名前の順に貼る。\n\n【ポイント・注意点】\nM2の出力や速度の数値は示されていない。インクの量を調整するスライダーがあり、プリンターに白インクがないため、木の色が仕上がりの色に影響する。レーザーは屋外へ排気するか空気清浄機を使い、素材の設定は実物に合わせる。印刷は切り線の内側に収め、接着前に仮組みし、重しを載せて乾かす。記事にはアフィリエイトリンクがあり、設計の利用条件は書かれていない。","2026-11-16","The Country Chic Cottage","https://www.thecountrychiccottage.net/3d-laser-project/"],["自動送り装置で大きな木の看板をレーザー加工","The Country Chic Cottageが、WeCreat Vision ProレーザーにAuto Pass-Through Feederを付け、幅18インチ・厚さ3mmの板からハロウィーンのガチョウの玄関看板を作った。送り装置を使うとデザインの大きさは14.9×137インチ、素材は18.11×137インチまで広がる。設置と操作の手順に加え、ケーブルの引っかかりや厚い板のずれなどの注意を挙げ、小さな作品には不要と評価している。","\n【概要】\n制作ブログThe Country Chic Cottageのアンジー・ホールデン氏は2026年11月16日、WeCreatのレーザー加工機Vision Proに自動送り装置「Auto Pass-Through Feeder」を組み合わせ、大きな木の看板を作る記事を公開した。作例は幅18インチ・厚さ3mmの板から切り出して彫刻した、ハロウィーンのガチョウの玄関用看板。板は本体の台だけでは収まらない大きさだった。\n\n【背景】\n家庭用レーザーは加工できる範囲に限りがあり、大きな看板などは作りにくい。送り装置は板を前後に送りながら加工することで、長い素材を扱えるようにする。ソフトのWeCreat Make Itでは「Auto Pass Through Feeder」の作業モードで動かす。\n\n【詳細】\nVision Pro単体ではデザインの最大は12.6×19.7インチ、素材の最大は15.75×22.83インチ。送り装置を使うと、デザインは14.9×137インチ、素材は18.11×137インチまで広がる。WeCreatは厚さを軟材25mm、硬材18mmとしているが、作者が仕上げたのは3mmの素材だけ。素材はデザインより15〜20インチほど長くし、切る前に少なくとも4インチを本体の中に入れておく。設置は、枠を組んで送り装置に差し込み、ローラーやアルミの板、レールを付ける。本体の電源を抜いてケーブルやホース、トレイ、台を外し、ふたと開始ボタンが送り装置側を向くよう枠の上に載せ、配線を戻して送り装置のケーブルを回転軸の端子につなぐ。板は横のつまみで送り込み、圧力の目安を推奨表で確かめる。ソフトでデザインを板の幅に合わせ、オートフォーカスを実行し、「Add Perforated Line」を有効にして部品が板に残るようにし、フレーミングで確認してから開始する。\n\n【ポイント・注意点】\n付属の結束バンドでケーブルをまとめ、動く板に引っかからないようにする。引っかかると加工が台無しになったり、機械を傷めたりする。本体は一番手前に寄せて枠とそろえ、台は素材の全長を支えられるものを使う。車輪は手で締める必要があり、厚い板では滑ってずれたという。作者は、取り付けは簡単で大きな飾りや薄い部品のまとめ切りに便利だが、小さな作品には不要だとまとめている。","2026-11-16","The Country Chic Cottage","https://www.thecountrychiccottage.net/laser-large-wood-signs-with-wecreat-auto-pass-through-feeder/"],["左右どちらの角にも、紙の扉飾りを無料で","Jennifer Makerが、ドア枠の右上にも左上にも付けられる、カードストックを重ねた扉の角飾りの作り方を公開した。雪だるま（8層）、ツリー（7層）、ホリデートラック（6層）の3種で、無料デザイン#847。Cricut Design Spaceで全体を左右反転すれば反対側の角に使える。12×12インチの紙で切れるよう11.5インチ未満に収め、Joyシリーズ向けの縮小寸法も示している。","\n【概要】\n制作ブログJennifer Makerは、ドア枠の角に飾るカードストックの重ね飾り「Flexible Door Corner Topper」の作り方を公開した（ページの表示は「Last updated: November 14, 2026」）。右の角にも左の角にも使えるのが特徴で、無料のデザイン#847として雪だるま（8層）、クリスマスツリー（7層）、ホリデートラック（6層）の3種類が用意されている。ページによると、動画は2026年11月14日午後7時（米東部時間）にMerry Maker Mingle 2026の一環として公開された。\n\n【背景】\nドアの角の飾りは、壁に大きな穴を開けずに季節感を出せる手軽な飾り。ただ、左右どちらかの角専用になりがちだ。この作品は左右対称に作り替えられるよう設計され、Cricut Design Spaceでデザイン全体を選んで「Flip Horizontal」で反転すれば、反対側の角にも使える。\n\n【詳細】\n材料は12×12インチ・65ポンドのカードストック5〜8枚。雪とツリーのデザインには青緑の紙、雪のデザインには白いグリッター紙を任意で使う。ほかに緑のStandardGripマット、ブレイヤー、スクレーパー、へら、除去用フック、ピンセット、精密用の接着剤、メジャー、壁に付けるための練り消し状の粘着材か小さなCommandストリップ。作者はCricut Maker 4を使い、Maker、Explore、Ventureで作れるとしている。12×12インチの紙から切れるよう、各デザインは縦横11.5インチ未満に収めた。寸法はトラック8.72×10.16インチ、雪8.88×10.24インチ、ツリー9.24×11.08インチ。Joy Xtraは8.5×9.81インチ未満、JoyとJoy 2は4.5×5.19インチ未満への縮小が必要。\n\n【ポイント・注意点】\n最初にドアを測る。飾りは枠の上に約5インチ、横に約3インチはみ出す。カット後は切れ残りがないか確かめ、層を重ねて裏を接着し、L字の支えに合わせて押さえる。雪のデザインはグリッターの層を最後に重ね、トラックはリースにリボンを付ける。小さなリボンの部品はなくしやすいので注意する。きれいにはがしたい場合は、塗装面を傷めにくい粘着材かはがせるストリップを上と横の縁に使う。","2026-11-14","Jennifer Maker","https://jennifermaker.com/flexible-door-corner-topper/"]],"uv":[["京都ステッカー、UVDTFでグッズ販売向け解説 1枚から対応","京都ステッカーは2026年11月20日、UVDTFステッカーでオリジナルグッズを販売したい人向けの記事を公開した。UV硬化インクを透明PETフィルムに印刷したステッカーで、UVプリンターがなくても貼るだけで直接印刷のような仕上がりになるという。料金は50mm角10枚で1,080円から（税抜・参考価格）で、最小1枚から注文できる。通常プランは入金後2〜4営業日で発送し、家庭用食洗機で約100回洗ってもはがれなかったという自社テストも紹介している。","\n【概要】\n京都のステッカー印刷会社「京都ステッカー」は2026年11月20日、自社サイトで「【1枚から】UVDTFステッカーでオリジナルグッズ販売！料金と仕様」と題した記事を公開した。小ロットでオリジナルグッズを作って売りたい人に向けて、UVDTFステッカーの仕組み、料金、納期、入稿の条件をまとめている。\n\n【背景】\nUVDTFステッカーは、UV硬化インクを透明なPETフィルムに印刷した転写ステッカーである。台紙をはがして品物に置き、転写シートをはがすだけで貼れるため、購入者の側でUVプリンターを用意する必要はない。記事は、ガラス、金属、プラスチック、木材、陶器に使え、カップやボトルのようなゆるい曲面にも貼れると説明している。UVプリンターを持たない個人や小さな店でも、UV印刷の質感をグッズに取り入れやすくなる手段として紹介されている。\n\n【詳細】\n印刷はCMYKに白インクを加えた構成で、フチなしで仕上がる。金・銀インク、メタリック、箔押し、ミラー加工には対応しておらず、金や銀の雰囲気はデザインの色で表現する必要がある。料金は税抜の参考価格で、50mm×50mmが10枚1,080円から、50枚4,200円から、100枚7,200円から。100mm×100mmは10枚2,700円から、50枚10,500円から、100枚18,000円から。税抜1万円以上で送料無料、制作実績の公開を認めると10％割引になる。納期は入金とデザイン確認のあと、無料の通常プランで2〜4営業日、有料の特急プランで1〜2営業日で発送する。入稿はPNGかJPGで、300dpi以上を推奨。Web見積もりでは画像、サイズ、数量を入れるとPDFの見積書を取り出せ、注文は24時間受け付ける。\n\n【ポイント・注意点】\n耐久性については、家庭用食洗機で約100回洗ってもはがれなかったという自社テストを挙げている。ただしデザインによってははがれる場合があるとして、スキージーでしっかり圧着すること、貼った直後は洗わず24〜72時間おくことを勧めている。販売する商品に使う場合は、事前に試し貼りをするよう求めている。料金はファイル形式や個別カットなどのオプションで変わるため、正確な金額はWeb見積もりで確かめる必要がある。","2026-11-20","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/20/24063/"],["100均のUV転写シールと専門業者の製作の違い 京都ステッカー","京都ステッカーは2026年11月20日、100円ショップで売られている既製のUV転写シールと、専門業者が作るオリジナルのUVDTFステッカーの違いを解説する記事を公開した。専門業者なら好きなデザインで作れ、耐久性も高い点を利点に挙げる。白インクに対応するため透明や濃い色の品物にも色が出るとし、店のロック入りグラスや会社名入りヘルメットなどの用途を示した。料金は50mm角10枚1,080円から（税抜）で、1枚から注文できる。","\n【概要】\n京都ステッカーは2026年11月20日、「【違いを解説】100均のUV転写シールと専門業者のオリジナル製作」と題した記事を公開した。100円ショップで手に入る既製の転写シールと、専門業者に頼むオリジナルのUV転写ステッカー（UVDTF）を比べ、どんな場面で専門業者を選ぶとよいかを説明している。\n\n【背景】\nUV硬化インクで印刷した転写シールは、貼るだけで品物に直接印刷したような見た目になることから、手軽な装飾として広がっている。記事は、既製品は柄が決まっているのに対し、専門業者なら自分のデザインで作れることと、耐久性が高いことを主な違いとして挙げる。同社のUVDTFは1枚の小ロットから大量注文まで受け付けている。\n\n【詳細】\n同社のUVDTFは、UV硬化インクを透明PETフィルムに印刷したもので、フチなしで仕上がる。貼れる素材はガラス、金属、プラスチック、木材、陶器。白インクに対応しているため、透明な品物や色の濃い品物でも色がはっきり出るという。用途の例として、スマホケース、タンブラー、マグカップ、ノートパソコン、文房具、店のロゴ入りのバーグラスやジョッキ、会社のロゴ入りの工事用ヘルメット、水筒や弁当箱の名前ラベル、贈り物のグラスを挙げている。印刷はCMYKと白インクで、金・銀、メタリック、箔押し、ミラー加工には対応しない。入稿はPNGかJPGで、300dpi以上を勧める。料金は税抜の参考価格で、50mm×50mmが10枚1,080円から、50枚4,200円から、100枚7,200円から、100mm×100mmが10枚2,700円から、50枚10,500円から、100枚18,000円から。税抜1万円以上で送料無料、実績の公開に同意すると10％割引となる。\n\n【ポイント・注意点】\n納期は入金とデザイン確認のあと、無料の通常プランで2〜4営業日、有料の特急プランで1〜2営業日で発送する。繁忙期にはずれることがある。耐久性では、家庭用食洗機で約100回洗ってもはがれなかった自社テストを紹介する一方、デザインによってははがれる場合があるとして、スキージーで圧着し、洗う前に24〜72時間おくよう勧めている。よくある質問では、最小注文数は1枚、曲面にも貼れる、金・銀インクはないと答えている。大事な品物に使う前には試し貼りをしておきたい。","2026-11-20","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/20/24076/"],["LONGER、Formnext 2026で卓上UV機ePrintを紹介","仏3Dnativesは2026年11月19日、中国LONGERがドイツ・フランクフルトの積層造形展Formnext 2026で卓上UVプリンター「ePrint」を出展していると伝えた。記事は、卓上のUVプリンターが小型化して身近になりつつある流れの中で同社の取り組みを紹介し、マーケティング責任者Jenny Zhang氏へのインタビュー動画を載せている。展示はホール12.0のA07ブース。動画では表現できる効果や色、ソフトウェアについて説明している。","\n【概要】\nフランスの3Dプリンター専門メディア3Dnativesは2026年11月19日、「LONGER multiplie les possibilités de personnalisation grâce à sa machine UV（LONGER、UV機でカスタマイズの幅を広げる）」と題した記事を公開した。中国の卓上ものづくり機器メーカーLONGERが、ドイツ・フランクフルトで開かれている積層造形の展示会Formnext 2026に、卓上UVプリンター「ePrint」を出展していることを伝えている。\n\n【背景】\n記事は、UVプリンターが小型化し、より身近な機械になりつつあると指摘している。UVプリンターは、紫外線で固まるインクを品物に直接吹き付けて印刷する機械で、これまでは業務用の大型機が中心だった。近年は個人や小さな工房の机に置ける卓上機が増え、3Dプリンターやレーザー加工機と同じ展示会で並ぶようになっている。LONGERもレーザー彫刻機や3Dプリンターを手がけるメーカーで、その品ぞろえにUVプリンターを加えている。\n\n【詳細】\nLONGERのブースはホール12.0のA07。記事の中心は、同社のマーケティング責任者Jenny Zhang氏へのインタビュー動画で、ePrintで表現できる効果や色、付属するソフトウェアについて話している。記事の本文には仕様や価格、寸法は書かれておらず、詳しい情報は同じサイトのePrintの紹介記事へのリンクで案内している。筆者は3DnativesのMélanie Wallet氏。Formnextは毎年フランクフルトで開かれる積層造形の大きな展示会で、3Dプリンター各社が新機種を見せる場になっている。そこに卓上UVプリンターが並んだことは、UV印刷と3Dものづくりの距離が縮まっていることを示す一例といえる。\n\n【ポイント・注意点】\nこの記事は展示会での紹介とインタビューが中心で、新しい数値や発売情報は含まれていない。動画の内容は記事の本文からは確かめられないため、ePrintの具体的な性能や価格を知りたい場合は、メーカーの発表や仕様を詳しく載せた別の記事を確認する必要がある。購入を考える人は、使えるインクや素材、ソフトの使い勝手、消耗品の費用も合わせて確かめたい。","2026-11-19","3Dnatives","https://www.3dnatives.com/longer-machine-uv-formnext/"],["LONGER、卓上UV機ePrintを軸に製品群を拡充 最大15mm立体","中国LONGERは2026年11月18日、レーザー彫刻機、3Dプリンター、UVプリンターをそろえた卓上ものづくり製品群についての発表をGlobeNewswire経由で出した。中心となる卓上UVプリンター「ePrint」は、エプソンF1080ヘッド2基と12のインク経路を備え、最大15mmの盛り上げ印刷に対応する。対応素材は300種類以上。11月3日〜12月2日（米東部時間）のブラックフライデー販売で、最大48％引きを打ち出している。","\n【概要】\nLONGERは2026年11月18日（香港発）、GlobeNewswireを通じて、レーザー彫刻、3Dプリント、UVプリントを一つにまとめた卓上ものづくり製品群についての発表を出した。比国紙Manila Timesのサイトにも同日付で掲載されている。中心に据えたのは卓上UVプリンター「ePrint」で、高精細なカラー印刷、インクを重ねる表現、フルカラーの立体レリーフ印刷ができるとしている。\n\n【背景】\n卓上UVプリンターは、木、金属、ガラス、布などに直接色を載せられる機械として、個人の作り手や小規模の事業者に広がっている。LONGERはもともとレーザー彫刻機や3Dプリンターを扱っており、UVプリンターを加えることで、一つのメーカーで加工から印刷までをそろえられるようにしている。\n\n【詳細】\nePrintの2ヘッド機は、エプソンF1080プリントヘッドを2基と12のインク経路を持ち、白インク、カラーインク、ニスに対応する。同社は、1ヘッドの「ePrint SE」と比べて2D印刷で最大2倍、3Dテクスチャ印刷で最大6倍速いとしている。盛り上げは最大15mm、高低差は最大10mmの面まで印刷できる。対応素材は300種類以上で、オープンインク方式により他社のインクも使える。標準の印刷台は310×420mm、別売りの小型台は310×75mm。ソフト「LongerStudio AI」は、背景の除去、配置、色の調整、仕上がりの予測、文字からロゴを作る機能などを持つ。金・銀、蛍光、蓄光、刺しゅう風、ニスといった特殊な表現も、素材と構成によって可能という。用途として、名入れ品、看板やインテリア、グッズ、小ロット生産を挙げる。\n\n【ポイント・注意点】\n同時に、11月3日から12月2日（米東部時間）まで世界で最大48％引きのブラックフライデー販売を行う。ePrintは1ヘッド版が2,499ドルから1,899ドル、2ヘッド版が3,299ドルから2,499ドル、UV＋DT版が3,299ドルから2,699ドルとなり、クーポンを使うとそれぞれ1,766.07ドル、2,299.08ドル、2,483.08ドルになる。速度の比較や特殊表現はメーカー自身の説明であり、素材や構成によって結果が変わる点に注意したい。","2026-11-18","The Manila Times（GlobeNewswire）","https://www.manilatimes.net/2026/11/18/tmt-newswire/globenewswire/longer-brings-laser-engraving-3d-printing-and-advanced-uv-printing-together-in-its-expanded-desktop-creative-manufacturing-lineup/2472920"],["MAW、ローランドDGの円筒UV機RC-300を国内初導入","オリジナルグッズの「ME-Q」を運営するMAWは2026年11月17日、ローランド ディー.ジー.の円筒形UVインクジェットプリンター「VersaObject RC-300」を国内で初めて導入したと発表した。品物を回しながら側面に360°フルカラーで印刷でき、ステンレスボトル、タンブラー、化粧品容器、ガラス製品などに対応する。版のいらないデジタルのUV印刷のため、試作や小ロット・多品種に向くという。今後さらに台数を増やす予定。","\n【概要】\nオリジナルグッズ制作サービス「ME-Q」などを運営する株式会社MAWは2026年11月17日、PR TIMESで、ローランド ディー.ジー.製の「VersaObject RC-300」を国内で初めて導入したと発表した。RC-300は円筒形の品物を回転させながら、側面の周り360°にフルカラーで印刷できるUVインクジェットプリンターである。\n\n【背景】\nボトルやタンブラーは企業のノベルティや自社ブランド商品として人気があるが、曲面への全周印刷は版を使う方法が中心で、少ない数を作るのは難しかった。MAWは、RC-300が版を使わないデジタルのUV印刷であるため、試作品や小ロット・多品種の注文に向くと説明している。印刷方式にはヘリカル印刷と呼ばれる方法を使うという。\n\n【詳細】\n対象とする品物は、ステンレスボトル、タンブラー、化粧品容器、ガラス製品、円筒形の容器などで、企業の記念品、OEM商品、オリジナルブランドのグッズといった用途を想定している。発表に載った仕様は、ピエゾ式インクジェット、最高解像度1,200dpi、印刷幅は最大300mm、品物の直径は45〜127mm、長さは30〜355mm、テーパー形状は最大10°（条件あり）、重さは最大3kg。インクはUVインクの「EUV-HB」で、CMYK、白、グロス、プライマーを使う。MAWは今後RC-300をさらに導入する予定としている。価格は公表していない。\n\n【ポイント・注意点】\n食洗機への耐性について、発表は、高密着モードでの食洗機耐性はメーカーが検証中だとしている。2018年に行われたMagiCoatのガラス試験（業務用グラス洗浄機500回、家庭用食洗機125回）にも触れているが、この試験はRC-300やEUV-Hインクを使ったものではないと明記し、どの製品についても食洗機での使用を保証していない。印刷できるかどうかは素材、表面処理、形、大きさによって変わるため、必要に応じて試し刷りをするという。飲料容器などに使う場合は、用途に合った耐久性があるかを事前に確かめたい。","2026-11-17","PR TIMES（株式会社MAW）","https://prtimes.jp/main/html/rd/p/000000415.000072705.html"],["LONGERのブラックフライデー、卓上UV機ePrintが1,899ドルから","米3DPrinting.comは2026年11月17日、LONGERのブラックフライデー販売を紹介した。期間は11月3日〜12月2日（米東部時間）で、レーザー彫刻機やプリンターが最大38％引き、さらにクーポンで5〜8％引きになる。卓上UVプリンター「ePrint」は通常2,499ドルの1ヘッド版が1,899ドルからで、2ヘッド版、UV＋DT版も値下げされた。記事は、LONGERが有料の提携先で、リンク経由の購入で手数料を得ることも明記している。","\n【概要】\n米国の3Dプリンター情報サイト3DPrinting.comは2026年11月17日、「Longer Black Friday 2026: ePrint UV Printer from $1,899」と題した記事を公開した。中国LONGERのブラックフライデー販売の中身をまとめたもので、価格は11月16日時点のものとしている。\n\n【背景】\n年末商戦では、卓上UVプリンターやレーザー彫刻機の値引きが相次ぐ。LONGERの販売は11月3日から12月2日まで（米東部時間）、世界を対象に米ドルで行われ、レーザー彫刻機とプリンターが最大38％引き、さらにクーポンで5〜8％引きになる。対象はレーザー彫刻機4機種、UVプリンターのePrint、3DプリンターのLK5 Proの計6機種。\n\n【詳細】\nePrintは品物に直接カラーで印刷できるUVプリンターで、LONGERは最大15mmの盛り上げと300種類以上の素材への対応をうたっている。3つの版があり、UV＋DT版は硬い品物、布、衣類への直接印刷、UV DTFに対応するという。価格は、1ヘッド版が通常2,499ドルから1,899ドル、2ヘッド版が3,299ドルから2,499ドル、UV＋DT版が3,299ドルから2,699ドル。クーポンは注文額で分かれ、BF5は全注文5％引き、BF6は299ドル以上で6％、BF7は899ドル以上で7％、BF8は1,999ドル以上で8％引き。クーポンを使うと1ヘッド版は1,766.07ドル、2ヘッド版は2,299.08ドル、UV＋DT版は2,483.08ドルになる。ほかにレーザー彫刻機Ray5が159.99ドルから、Ray2が239.99ドルから、Ray7が229.99ドルから、Ray7sが279.99ドルから、LK5 Proが279.99ドルからとなっている。\n\n【ポイント・注意点】\n記事は、LONGERが有料のブラックフライデー提携先であり、サイトはリンク経由の購入で手数料を得ると開示している。中立なレビューではなく販売の案内として読む必要がある。また、UV＋DT版の対応範囲や盛り上げの高さはメーカーの説明である。価格は11月16日時点のもので、変わる可能性がある。購入前には、インクなど消耗品の費用や、日本から買う場合の送料・保証も確かめたい。","2026-11-17","3DPrinting.com","https://3dprinting.com/news/longer-black-friday-2026/"],["DeCOVER、手帳型ケースの完成図と金額がわかるページ公開","株式会社embは2026年11月17日、スマホケースブランド「DeCOVER」で、ファスナーポケット付き手帳型ケースの「デザインシミュレーター」ページを公開した。色や名入れを選ぶと、完成イメージと合計金額がその場でわかる。名入れは専用のUVプリンターで印刷する方式と箔押しから選べ、追加料金は880円。価格は2,860円（税込）からで、800以上の機種に対応する。通常は2〜5営業日で発送する。","\n【概要】\nスマートフォンケースブランド「DeCOVER」を展開する株式会社embは2026年11月17日、PR TIMESで、ファスナーポケット付き手帳型ケースの「デザインシミュレーター」ページを同日に公開したと発表した。ケースの色や名入れを選ぶと、仕上がりのイメージと合計金額をその場で確かめられる。\n\n【背景】\n名入れなどのカスタマイズ商品は、注文する前に完成した姿や総額がわかりにくいことが、購入をためらう理由になりやすい。embは、選んだ内容を画面ですぐに見せることで、注文の前の不安を減らそうとしている。名入れのうち印刷の方式は、専用のUVプリンターで刷るとしており、UVプリンターを使った小ロットの名入れ商品の販売例といえる。\n\n【詳細】\n発表によると、手帳型ケースの価格は2,860円（税込）から。名入れは印刷か箔押しを選べ、追加料金は880円。対応する機種は800以上で、これまでの出荷数は累計50万個を超えるという。通常は2〜5営業日で発送する。シミュレーターでは、色や名入れの内容を選ぶと完成イメージと合計金額が表示される。UVプリンターによる名入れは、版を作らずに1個ずつ違う文字を刷れるため、名前やイニシャルを入れる商品に向いている。スマホケースのように機種ごとに形が違う品物でも、注文を受けてから一つずつ名入れできる点は、在庫を抱えにくい小さなブランドにとって利点になる。ページの公開により、購入者は選んだ色と名入れの組み合わせを画面で確かめてから注文できるようになった。\n\n【ポイント・注意点】\nこの発表はスマホケースの販売ページの公開が主な内容で、UVプリンターの機種名や印刷の仕様は書かれていない。UVプリンターについては、名入れの印刷に専用機を使うという説明にとどまる。画面のイメージと実物の色合いは、端末の画面や素材によって違って見えることがあるため、色にこだわる場合は注意が必要だ。印刷と箔押しでは見た目や手触りが違うので、用途に合わせて選びたい。制作販売の事業者にとっては、注文前に完成図と金額を見せる仕組みが、名入れ商品の売り方の参考になる。","2026-11-17","PR TIMES（株式会社emb）","https://prtimes.jp/main/html/rd/p/000000005.000192364.html"],["Allprintheads週報、UV対応フィルムやエプソンI3200-U1","米Allprintheadsは2026年11月15日、同月9〜15日の印刷業界の動きをまとめた週報を公開した。UV関連では、Drytacの両面印刷フィルム「PrintDuo」がエコソルベント、ラテックス、UVに対応すると紹介し、ノズル近くにLEDランプがあるUVヘッドでは密な合成フィルムでの拭き取りに注意が要ると指摘した。エプソンのUV対応ヘッド「I3200-U1」は1,390ドルで載せた。ORAFOLの道路標示用機やエプソンContourJetも扱った。","\n【概要】\nプリントヘッドや消耗品を販売する米Allprintheadsは2026年11月15日、「Allprintheads Industry News — What Moved in Print This Week (November 9 – 15, 2026)」と題した週報を公開した。11月9日から12日にかけての印刷業界のニュースを拾い、それぞれに同社の目から見た実務上の注意を添えている。\n\n【背景】\nUVプリンターを使う現場では、機械本体だけでなく、メディア（印刷する素材）やプリントヘッドの選び方が品質と費用を大きく左右する。この週報は、販売店の立場からヘッドや素材の情報をまとめており、機械を運用する人に向けた内容になっている。\n\n【詳細】\nUV関連で目立つのは、Drytacが11月11日に発表した「PrintDuo」である。厚さ10ミル（250ミクロン）の白マットの両面印刷フィルムで、不透明度は99.9％。エコソルベント、ラテックス／レジン、UVの各方式に対応し、窓用の粘着製品と組み合わせて使う。週報は、ノズル面の近くにLEDランプがあるUVヘッドでは、密な合成フィルムに刷るときにヘッドの拭き取りに気を配る必要があると注意している。ヘッドでは、エプソンI3200系のUV対応版「I3200-U1」を1,390ドル、溶剤用の「I3200-E1」を1,450ドルで載せている。このほか、ローランドDGのTrueVIS XP-640をもとにしたORAFOLのエコソルベントの道路標示用プリンター（メディア幅最大64インチ＝1,625mm、約70社の招待客に披露）や、PrecisionCore S800ヘッドと6軸ロボットを組み合わせたエプソンの立体物向け印刷システム「ContourJet」も取り上げた。ContourJetは2027年2月2〜4日のC!Print Lyonに出展される予定という。\n\n【ポイント・注意点】\nORAFOLの機械やContourJetはUV方式とは書かれておらず、週報全体のうちUVに直接関わるのはフィルムとヘッドの話題である。ヘッドの価格は同社の販売価格で、メーカーの定価ではない。販売店の週報のため、商品の紹介を兼ねている点も踏まえて読みたい。UVヘッドの手入れの注意は、合成フィルムを多く扱う現場では参考になる。","2026-11-15","Allprintheads","https://www.allprintheads.com/blogs/news/allprintheads-industry-news-what-moved-in-print-this-week-november-9-15-2026"]],"risk":[["乳児用マラリア抗体L9LS 防御78%もワクチンの効きを下げる恐れ","米国立アレルギー感染症研究所（NIAID）が開発したマラリアのモノクローナル抗体L9LSを乳児に投与した臨床試験で、6か月間の熱帯熱マラリア感染に対する防御効果は78%と高く、安全性にも問題はなかった。一方、ワクチン接種の5か月前にL9LSを受けた子では、その後のマラリアワクチンR21への抗体反応が約20〜30%低かった。研究チームは大規模な乳児試験をいったん止め、ワクチンの防御への影響を見極めるとしている。","\n【概要】米国熱帯医学衛生学会（ASTMH）の年次総会で、マラリア予防用のモノクローナル抗体「L9LS」を乳児に使った第Ib相試験の結果が発表された。抗体そのものは安全で高い防御効果を示したが、後に接種するマラリアワクチンR21の効き目を弱める可能性が浮かんだ。\n【背景】記事が引用する世界保健機関（WHO）の数字では、2024年のマラリアによる死者は約61万人で、その多くはアフリカの幼い子どもだった。L9LSは米国立アレルギー感染症研究所（NIAID）が開発した抗体である。研究者によると、子どもは少なくとも生後5か月にならないとマラリアワクチンを受けられない。\n【詳細】試験は2024〜2025年にマリの3施設で行われ、生後1〜12か月の健康な乳児180人が参加した。半数がL9LSを1回筋肉注射で受け、残り半数は生理食塩水の偽薬を受けた。L9LSは安全で忍容性も良好で、6か月間の熱帯熱マラリア原虫の感染に対する防御効果は78%だった。一方、ワクチン接種の5か月前にL9LSを受けた子では、R21に対する抗体反応が約20〜30%低かった。筆頭著者はNIAIDの臨床フェローのビッキー・チャン医師。主任研究者のカスム・カイエンタオ氏は、より大規模な乳児試験をいったん止める必要があると述べ、反応の低下がR21の防御を弱めるかどうかが分かるまで、乳児での開発は検討しないとした。\n【ポイント・注意点】研究者は、R21の接種を終えた子への使用や、重いマラリアや貧血で入院した子への使用、季節性マラリア化学予防の代わりとしての使い道には可能性が残るとしている。妊婦への応用にも関心が示された。ASTMHのテリー・テイラー会長は、R21への干渉を「考慮すべき重要な結果」と述べた。今回の結果は、抗体とワクチンという二つの予防策を組み合わせる際には、互いの効果を打ち消さないかを確かめる必要があることを示している。抗体は1回の注射で効果が続くため、使い方次第で幼い子を守る有力な手段になりうるが、接種の順番や間隔を含めた慎重な検討がこれから必要になる。","2026-11-20","Medical Xpress","https://medicalxpress.com/news/2026-11-malaria-antibody-infants-lowers-immune.html"],["胎児期のネオニコチノイド系殺虫剤 9歳時の認知得点と関連 大阪大","大阪大学の研究チームが、新生児200人のへその緒の血清に含まれるネオニコチノイド系殺虫剤の関連物質を測り、生後10か月から9歳まで発達を追った。9歳の時点で、ジノテフランの濃度が高いほど処理速度の得点が低く、アセタミプリドの代謝物の濃度が高いほど知覚推理の得点が低い関連が見られた。乳幼児期には一貫した関連はなく、因果関係は確かめられていない。結果は米医学誌JAMA Network Openに掲載された。","\n【概要】妊娠中にネオニコチノイド系殺虫剤にさらされることと、子どもの認知機能との関係を調べた研究結果を、大阪大学のチームが米医学誌JAMA Network Openに発表した。9歳の時点で一部の認知の得点と関連が見られたが、研究者は慎重な解釈を求めている。\n【背景】ネオニコチノイド系は広く使われる殺虫剤の一群である。今回の研究は、出生時の体内の物質の量を測り、子どもが大きくなってからの発達と照らし合わせるという設計で行われた。筆頭著者のアビール・ナガタ氏は、出生時の曝露と、子ども時代の後の時期に測った結果とを追う設計だと説明している。\n【詳細】研究チームは新生児200人のへその緒の血清で、ネオニコチノイド関連の10種類の化合物を測定した。そのうち、ジノテフランと、アセタミプリドの代謝物であるデスメチルアセタミプリドに注目した。この二つはいずれも試料の半数以上から検出された。多重比較の補正を行うと、生後10か月から32か月までの発達の指標とは、どちらの物質も関連がなかった。一方、9歳の時点では、ジノテフランの濃度が高いほど処理速度の得点が低く、デスメチルアセタミプリドの濃度が高いほど、ウェクスラー式知能検査の知覚推理の得点が低いという関連が見られた。\n【ポイント・注意点】責任著者の土屋賢治氏は、乳幼児期の結果は一貫性に欠けたと述べ、一律の傾向というより、認知の領域や年齢によって異なる関連を反映している可能性を示した。著者らは、対象者数が比較的少ないことや、測定された濃度が低かったことを限界として挙げ、結果を確かめるにはさらなる研究が必要だとしている。今回の研究は関連を示したもので、殺虫剤が認知機能の低下を引き起こすという因果関係は確かめられていない。記事も、妊娠中の曝露について一層の研究が必要だと強調している。ネオニコチノイド系の物質は試料の半数以上から見つかっており、身近な曝露であることがうかがえる。一方で、測定された濃度は低く、この結果だけで妊娠中の生活を大きく変える必要があるとは言えない。今後の研究の積み重ねを待つ必要がある。","2026-11-20","Medical Xpress","https://medicalxpress.com/news/2026-11-insecticide-exposure-pregnancy-linked-cognition.html"],["インフル4週連続で増加 北海道は警報レベル 休業1542施設","厚生労働省は11月20日、第46週（11月9〜15日）のインフルエンザの発生状況を発表した。全国の定点医療機関あたりの報告数は11.94人で、前週の11.00人から増え、4週連続の増加となった。前年同期の37.73人よりは低い。北海道は30.63人で、警報レベルの目安の30人を上回った。休校・学年閉鎖・学級閉鎖の措置をとった施設は全国で計1542施設で、このうち小学校が1017施設と最も多かった。","\n【概要】厚生労働省が2026年11月20日に発表した第46週（11月9〜15日）のインフルエンザの発生状況によると、全国の定点あたりの報告数は11.94人で、第43週から4週連続で増えた。子どもが通う学校での休業措置も前週から増えている。\n【背景】定点あたりの報告数は、全国の決まった医療機関から報告された患者数を1医療機関あたりにならした値で、流行の広がりを見る目安となる。記事によると、1医療機関あたり30人が警報レベルの目安とされる。今シーズンの全国の数字は、前年同期の37.73人と比べると低い水準にとどまっている。\n【詳細】全国の報告数は前週の11.00人から11.94人に増えた。都道府県別では北海道が30.63人で最も多く、警報レベルの目安の30人を上回った。続いて宮城県24.20人、福島県23.02人、岩手県22.83人、青森県20.88人、山形県20.54人で、東北地方では秋田県を除く5県で20人を超えた。全国で最も少なかったのは徳島県の5.24人だった。第46週には休校27校、学年閉鎖413校、学級閉鎖1102校が報告され、休業措置をとった施設は計1542施設と、前週の1325施設から増えた。施設の種類別では小学校が1017施設で最も多かった。\n【ポイント・注意点】全国の水準は前年より低いものの、北海道や東北では流行が大きくなっており、地域による差がはっきりしている。小学校での休業措置が全体の多くを占めていることから、子どもの間で感染が広がっている様子がうかがえる。厚労省は、外出後の手洗いや、こまめな換気、十分な休養とバランスの取れた食事などを呼びかけている。家族に体調の悪い子どもがいる場合は、無理に登校させず休ませることも、学校での広がりを抑えるうえで大切になる。今回の数字は11月15日までの1週間のもので、地域によっては流行がさらに進んでいる可能性もある。学校からの休業の知らせや、自治体が発表する地域ごとの流行状況にも気を配りたい。前週からの増え方は小さいものの、増加は4週続いており、今後の推移を見守る必要がある。","2026-11-20","Yahoo!ニュース（リセマム）","https://news.yahoo.co.jp/articles/15f13d781b414c30f6ff7c3c91a8cc186b38e996"],["秋田でインフル急増 小学生中心に集団・家庭内感染 小児科医が対策助言","秋田県内でインフルエンザの患者が急増し、爆発的に増えている地域もある。秋田市のやすおか小児科医院の安岡健二医院長によると、現在はA型が大きく流行し、患者は小学生が非常に多く、学校での集団発生や家庭内で親にうつる例も目立つ。医院長は、熱が出てすぐに検査しても反応が出ないことがあるため半日ほど様子を見ること、重症化を防ぐワクチンの接種、家の中でのマスクや換気、手洗いなどの対策を呼びかけた。","\n【概要】秋田県内でインフルエンザの患者が急増しており、爆発的に増えている地域もある。学校などでの集団感染や、家庭内での感染の広がりが相次いでいる。秋田テレビが、秋田市のやすおか小児科医院の安岡健二医院長に、今シーズンの傾向と感染対策について話を聞いた。\n【背景】安岡医院長によると、インフルエンザは長年、年明けから流行する傾向があったが、流行の時期は早まっており、この傾向はこれからも続くとみている。医院を訪れる患者の大半はA型で、小学生はもちろん、幼児から高校生まで幅広い世代に感染が広がっている。\n【詳細】医院長は今シーズンについて「現在A型インフルエンザがすごく流行している。小学生が非常に多い」と述べた。学校で何人かが感染すると、その後に集団で発生することが多く、家庭内での発生も多く、親が感染することも結構あるという。インフルエンザ特有の初期症状としては、急な発熱を挙げ、普通の風邪と違って倦怠感がとても強く、見た瞬間に分かるほどだるそうにしていると説明した。一方で、熱が出てすぐに慌てて受診しないよう呼びかけた。熱が出てすぐに検査しても反応が出ないことがあるため、半日ほど様子を見て、熱が下がらなければ来院してほしいとしている。ワクチンについては、発症を防ぐことはできないが重症化を防ぐことができ、症状が軽く済むとして接種を勧めた。\n【ポイント・注意点】予防策として医院長は、インフルエンザは飛沫で感染するため、可能であれば家の中でも感染者はマスクをした方が良いと述べ、換気、うがい、手洗いに加え、十分な睡眠と栄養をとることも大事だとした。学校での集団感染を防ぐため、体調が悪いときは無理に登校させないことや、子ども自身も基本的な感染対策を徹底することが重要とされている。子どもが学校でうつり、家庭に持ち込んで親にも広がる例が多いことから、家族の誰かが感染したときは家の中での対策も欠かせない。発熱直後の受診は検査で反応が出ないことがあるという点も、保護者が知っておきたい情報だ。ただし、ぐったりしているなど様子が気になるときは、早めにかかりつけ医に相談することも大切になる。医院長は「インフルエンザの流行はこれからも続くので、ワクチンを接種し、感染対策をしっかりしてほしい」と話している。","2026-11-19","Yahoo!ニュース（秋田テレビ）","https://news.yahoo.co.jp/articles/4c43177e045e69b1338fdf61fe70097264c1eaef"],["子どもの頭部CT1回分の被ばくで脳腫瘍リスク1.8倍 370万人分析","米国とカナダ・オンタリオ州の子ども370万人以上の電子カルテを使った大規模研究で、画像検査による脳への累積被ばく量が多いほど、脳腫瘍のリスクが高まる関連が見られた。頭部CT1回分に当たる被ばくでリスクは1.8倍となり、21歳までに子ども1万人あたり約8件の脳腫瘍が増える計算になる。研究者は、必要な検査は避けるべきではないとしつつ、頭部CTは使われすぎていると指摘している。","\n【概要】米カリフォルニア大学デービス校とサンフランシスコ校の研究チームが、子どもの頃の医療画像検査による被ばくと脳腫瘍の関係を調べ、米医学誌JAMAに発表した。脳への累積被ばく量が多いほど脳腫瘍のリスクが高くなる関連が示された。\n【背景】記事によると、脳腫瘍は子どものがんで2番目に多く、子どもと若者のがんによる死亡の最大の原因である。CTなどの電離放射線を使う画像検査は診断に欠かせない一方、被ばくの影響が以前から論じられてきた。\n【詳細】研究では米国とオンタリオ州の子ども370万人以上を出生から平均12.3年追い、すべての画像検査による脳への累積被ばく量を推計した。脳腫瘍は1536件見つかり、55.7%が男児、64.5%が2〜10歳で診断され、82.5%が悪性度の高いものだった。追跡期間中に頭部CTを1回受けた子は4.3%、2回は0.9%、3回以上は0.4%だった。頭部CT1回分に当たる被ばくは脳腫瘍のリスク1.8倍と関連し、21歳までに子ども1万人あたり約8件の脳腫瘍が増える計算、頭部CT1266回につき約1件の過剰な腫瘍に相当する。子どもと若者の脳腫瘍の10.1%は医療画像の被ばくによる可能性があると推計された。被ばく量が多いほどリスクは高く、悪性度の高い腫瘍で関連が強かった。\n【ポイント・注意点】筆頭著者のダイアナ・ミグリオレッティ氏は、絶対的なリスクは小さく、医学的に必要な画像検査は命を救いうると強調した。一方、責任著者のレベッカ・スミス＝ビンドマン氏は頭部CTは「使われすぎている」と述べ、検査を指示するたびに必要性を考えるべきだとした。記事は、頭のけがをした子どもへの不適切なCTを減らすための判断基準（PECARNルール）があることにも触れている。保護者は、検査の必要性を医師に確認することが大切だ。今回の研究は関連を調べたもので、記事が紹介する数字はいずれも集団全体での推計である。一人の子どもが頭部CTを受けたことで必ず脳腫瘍になるという意味ではない。必要な検査をためらうのではなく、検査の目的や代わりの方法の有無を医師に尋ねる姿勢が求められる。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-children-exposed-medical-scans-higher.html"],["ドラベ症候群の重い型 SCN1B変異で機能するたんぱく質ができず","子どもにけいれん発作や知的障害などを起こす希少疾患ドラベ症候群のうち、SCN1B遺伝子のまれな変異による特に重い型について、米ミシガン大学のチームが仕組みを解明した。この変異ではRNAの加工の際に取り除かれるはずのイントロンが残り、機能するたんぱく質が作られない。通常のドラベ症候群でてんかんの予期せぬ突然死の率は約20%だが、この変異では「ほぼ100%」だったという。","\n【概要】米ミシガン大学の研究チームが、ドラベ症候群の中でも特に致死的な型を引き起こすまれな遺伝子変異の仕組みを明らかにし、米科学アカデミー紀要（PNAS）に発表した。治療法の開発に向けた手がかりになると期待されている。\n【背景】記事によると、ドラベ症候群は子どもにけいれん発作、運動やバランスの障害、知的障害、認知の遅れを起こす希少な発達の病気で、てんかんの予期せぬ突然死（SUDEP）のリスクも高める。症例の約90%はSCN1A遺伝子の変異によるもので、よりまれなSCN1B遺伝子の変異では特に重い型になることがある。\n【詳細】主任研究者のロリ・アイソム氏によると、ドラベ症候群の患者のSUDEPの率は通常約20%だが、SCN1Bの「c.449-2A>G」という変異では「ほぼ100%」だった。博士研究員のシュリーヤ・バクシ氏が率いたチームは、この変異がイントロンに影響していることを突き止めた。イントロンは通常、RNAの加工の際に切り取られるが、この変異ではイントロンが残ったままになり、遺伝子が正しくつなぎ合わされず、機能するたんぱく質が作られない。アイソム氏の研究室が以前に行った、SCN1B遺伝子を持たないマウスの研究では、重いてんかん、心臓の不整脈、死亡が見られていた。今回、研究者がこの重い型を患者で確認したのは初めてだという。\n【ポイント・注意点】治療の方向性として、残ったイントロンを取り除く方法、米フィラデルフィア小児病院（CHOP）の研究者と試している遺伝子治療、ミシェル・ヘイスティングス氏と進めるアンチセンス核酸を使う方法が挙げられている。バクシ氏は「まだ初期の段階だが、期待している」と述べた。記事は、人を対象にした研究や臨床試験については説明していない。患者や家族にとってすぐに使える治療ではなく、基礎研究の段階の成果として受け止める必要がある。SUDEPは子どもを突然失う深刻な事態であり、重い型がなぜ起きるのかが分かったことは、狙いを絞った治療の研究を進めるうえでの手がかりとなる。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-reveals-rare-mutation-dravet-syndrome.html"],["米国の幼稚園児MMR接種率92.4%に低下 妊婦と子のはしかに警鐘","米国がはしかの排除状態を失ったことを受け、米ハッケンサック・メリディアン・ヘルスの医師らが妊婦と子どもへの影響に注意を促した。予備的な分析では、はしかにかかった妊婦の死亡リスクが10倍に高まり、重い合併症の可能性も高かった。米疾病対策センター（CDC）のデータでは、2025〜2026年の幼稚園児のMMR接種率は92.4%に下がり、約28万人の子どもが守られていない状態だという。","\n【概要】米国が汎米保健機構（PAHO）から認められていた、はしかの排除状態を失った。これを受けて、米ニュージャージー州の医療機関ハッケンサック・メリディアン・ヘルスの医師らが、妊婦と子どもにとっての危険と予防接種の大切さを解説した。\n【背景】記事は、2025〜2026年のはしかにかかった妊婦とその赤ちゃんについての予備的な分析（NEJM Evidence掲載）を紹介している。それによると、妊婦の死亡リスクは10倍に高まり、重い合併症の可能性も高かった。データに含まれた妊婦の多くはワクチンを受けていなかった。米国では先天性のはしかがまれだったため、おなかの中ではしかにさらされた赤ちゃんへの長期的な影響はよく分かっていない。\n【詳細】記事が引用するジョンズ・ホプキンス大学のデータでは、2026年の米国の患者は5400人を超え、その30%近くが大人だった。ニュージャージー州のオーシャン郡とモンマス郡は、学齢期の子どものMMR接種率が州内で最も低く、それぞれ83.2%と88.1%だった。集団免疫は一般に接種率93〜95%を下回ると得られないとされる。CDCのデータでは、2025〜2026年の全米の幼稚園児のMMR接種率は92.4%に下がり、接種免除は過去最高の4.2%で、約28万人の子どもが守られていない状態だという。\n【ポイント・注意点】産婦人科のメーガン・ラッティガン医師は、妊娠を考える女性に、MMRの接種歴を事前に確認するよう勧めた。メリッサ・ワラック医師は、接種率の低下は「完全に防げるものだ」と述べた。小児科のダニエル・ルーダーファー医師は、はしかにかかった子どもの約20%が入院を必要とすると指摘し、子どもの定期接種を受けるよう呼びかけた。妊娠中はMMRワクチンを受けられないため、妊娠前の確認が大切になる点も記事は強調している。米国では2026年にはしかによる死亡も相次いでおり、予防接種率の低下が子どもと妊婦の命に直結しうることを示す内容となっている。記事が示すように、接種率が集団免疫の目安を下回る地域では、はしかが広がりやすくなる。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-measles-status-pregnant-women-children.html"],["大量の飲酒や多様な大麻の使用で10代のうつリスク上昇 米研究","米テキサスA&M大学公衆衛生大学院の研究チームが、米国の12〜17歳の若者9817人のデータを分析し、飲酒の量が多いほど、また大麻を使う方法の種類が多いほど、大うつ病エピソードの可能性が高いという関連を見いだした。女子や年齢の高い子、多人種の子は、飲酒や薬物の使用にかかわらずうつの可能性が高かった。研究者は、10代の飲酒・薬物使用とうつを一体の問題として、両方を合わせて調べるよう求めている。","\n【概要】米テキサスA&M大学公衆衛生大学院の研究チームが、10代の飲酒や大麻の使用の度合いと、うつ病との関係を調べた研究を発表した。飲酒が重いほど、また大麻を使う方法の種類が多いほど、うつの可能性が高くなる関連が示された。\n【背景】筆頭著者のスンヒョン・チョン氏によると、米国の若者の約5人に1人が、過去2週間以内に気分の落ち込みを感じたと答えている。これまでの研究の多くは、一つの物質だけを追跡していた。今回は、飲酒と大麻の両方の使い方の広がりを同時に見た点に特徴がある。\n【詳細】研究では、2023年の米国の全国薬物使用・健康調査（NSDUH）のデータを使い、全国を代表する12〜17歳の若者9817人を分析した。飲酒は、たまに飲む程度から、大量または頻繁に飲む程度までの段階で測った。大麻の使用は、たばこのように吸う、電子たばこで吸う、食品で取るなど、使う方法の種類の数で測った。その結果、飲酒が重いほど、また大麻を使う方法の種類が多いほど、うつの可能性が高かった。女子、年齢の高い子、多人種の子は、飲酒や薬物の使用の有無にかかわらず、うつの可能性が高かった。記事には、これらの関連の強さを示す具体的な比率は示されていない。\n【ポイント・注意点】チョン氏は、保護者や医師、学校関係者に対し、10代の飲酒、薬物使用、うつをつながった問題として扱い、「両方の問題を合わせて調べる」よう求めた。この研究は一時点の調査に基づく横断研究で、関連を示したものであり、飲酒や大麻がうつを引き起こすという因果関係を示したものではない。うつが先にあって飲酒や薬物に向かう場合も考えられるため、子どもの変化に気づいたときは、どちらか一方だけでなく全体を見て相談先につなぐことが大切になる。調査では、女子や年齢の高い子、多人種の子でうつの可能性が高かったことから、こうした子どもたちへの目配りも欠かせない。これまでの研究の多くが一つの物質だけを追っていたのに対し、複数の物質の使い方をまとめて見た今回の研究は、10代の心の健康を考えるうえで新しい視点を示している。","2026-11-19","News-Medical","https://www.news-medical.net/news/20261119/Heavy-drinking-and-varied-marijuana-use-raise-teen-depression-risk.aspx"],["強力磁石の球体おもちゃ 誤飲の恐れで使用中止を 米CPSCが警告","米消費者製品安全委員会（CPSC）は、中国の業者がアマゾンで販売した磁石の球体おもちゃ「FZChenrry Magnetic Fidget Ball」について、すぐに使用をやめるよう消費者に警告した。強力な磁石が玩具の義務基準に違反しており、子どもが飲み込む危険がある。約1372個が2025年2月から2026年9月にかけて約16ドルで売られた。販売業者は回収にも返金にも応じていない。","\n【概要】米消費者製品安全委員会（CPSC）は2026年11月19日、磁石の球体おもちゃ「FZChenrry Magnetic Fidget Ball Toys」について、ただちに使用をやめるよう消費者に警告を出した。強力な磁石を使っており、子どもが飲み込むと重いけがや死亡につながる恐れがある。\n【背景】CPSCの警告によると、このおもちゃの磁石は強力で、玩具に関する義務基準に違反している。強力な磁石は、子どもが誤って飲み込む危険がある製品として注意が向けられてきた。今回は回収（リコール）ではなく、業者が対応に応じないためにCPSCが独自に出した製品安全の警告である。\n【詳細】対象は、紫色のシリコン製の磁石の球8個が黒いファスナー付きのケースに入ったセットで、ほかの色もある可能性があるとしている。販売数は約1372個で、2025年2月から2026年9月までアマゾンで約16ドルで売られた。ほかの第三者の販売業者やウェブサイトでも売られた可能性がある。これまでに事故やけがの報告はない。販売業者は中国の「Fu Zhou Jing Li Xin Xi Ke Ji You Xian Gong Si（Chanlee）」で、回収や返金などの対応に同意していない。\n【ポイント・注意点】CPSCは、このおもちゃをすぐに使うのをやめて処分し、売ったり人にあげたりしないよう求めている。業者による返金などの救済措置はないため、持っている人は自分で処分する必要がある。日本ではこの製品が売られているかは記事からは分からないが、海外の通販サイトで同じような磁石おもちゃを買うこともできる。家庭に小さな子どもがいる場合、磁石の部品が外れやすいおもちゃや細かな磁石は手の届かない所に置き、飲み込んだ疑いがあればすぐに医療機関を受診することが大切だ。業者が回収にも返金にも応じていない以上、消費者が自ら製品を確かめて処分することが、子どもを守るための唯一の手段となる。対象のおもちゃは紫色の球8個のセットで、黒いファスナー付きのケースに入っている。見覚えがあれば中身を確かめたい。","2026-11-19","米消費者製品安全委員会（CPSC）","https://www.cpsc.gov/Warnings/2027/CPSC-Warns-Consumers-to-Stop-Using-FZChenrry-Magnetic-Fidget-Ball-Toys-Immediately-Due-to-Risk-of-Serious-Injury-or-Death-from-Magnet-Ingestion-Violate-Mandatory-Standard-for-Toys"],["ボタン電池に子どもの手が届く 工具など約23万点を米国で回収","米消費者製品安全委員会（CPSC）は、ハルタフォース・グループ北米が、ライト付きポートフォリオや角度計、ノギス、電卓など約22万9430点を回収すると発表した。ボタン電池に子どもが簡単に手を届かせることができ、飲み込む危険があるほか、包装や製品に米国のリース法で求められる警告表示がなかった。事故の報告はない。販売店はロウズやアマゾンなどで、代金はギフトカードで返金される。","\n【概要】米消費者製品安全委員会（CPSC）は2026年11月19日、ハルタフォース・グループ北米が、ボタン電池を使う工具などを回収すると発表した。電池に子どもが簡単に手を届かせることができ、飲み込むと重いけがや死亡につながる恐れがある。\n【背景】米国には、ボタン電池を使う消費者製品について、子どもが電池を取り出せないようにすることや警告表示を求める義務基準があり、リース法と呼ばれる。今回の製品は、電池に子どもが簡単に手を届かせることができるうえ、包装と製品に同法が求める警告表示もなく、基準に違反していた。\n【詳細】対象は約22万9430点。CLCのライト付きポートフォリオ（L217）と、ジョンソン・レベルのデジタル角度計、ノギス、電卓などで、型番には1750-1200、1886-0100、1886-0200、1888-0700、1888-1100、1889-0600、40-6065、CALC-1500などが含まれる。ロウズ、メナーズ、W.W.グレンジャー、トゥルー・バリューなど全米の工具・金物店とアマゾンで売られた。販売期間は製品によって2023年2月または2024年3月から2026年11月まで。これまでに事故やけがの報告はない。\n【ポイント・注意点】CPSCは、対象の製品の使用をすぐにやめ、子どもの手の届かない所に置くよう求めている。返金を受けるには、専用サイトに製品の写真を送り、処分したことを申告する。代金は仮想のVisaギフトカードで支払われる。ボタン電池は地域の有害廃棄物の手順に従って処分するよう呼びかけている。子ども向けではない大人用の道具でも、家庭に置かれれば子どもが触れる可能性がある。ボタン電池を飲み込むと体の中でやけどを起こすことがあり、飲んだ疑いがあればすぐに受診することが大切だ。回収の対象には、子ども向けではない大工道具や事務用品が多く含まれている点が今回の特徴である。いずれも多くの販売店で長い期間売られていたため、手元にないか型番で確かめたい。返金額は小売価格に基づき、問い合わせは電話やメールでも受け付けている。","2026-11-19","米消費者製品安全委員会（CPSC）","https://www.cpsc.gov/Recalls/2027/Hultafors-Group-North-America-Recalls-Lighted-Portfolios-Angle-Locators-Calipers-and-Calculators-Due-to-Risk-of-Serious-Injury-or-Death-from-Battery-Ingestion-Violate-Mandatory-Standard-for-Consumer-Products-with-Button-Cell-Batteries"],["自転車ヘルメットが安全基準に不適合 米国で1万6730個を回収","米消費者製品安全委員会（CPSC）は、Ciptonの自転車用ヘルメット1万6730個を回収すると発表した。衝撃の吸収、ずれにくさ、認証の各項目で義務基準を満たしておらず、事故の際に頭を守れない恐れがある。対象には子ども向けのSサイズも含まれる。2024年4月から2026年5月にディックス・スポーティング・グッズなどで約35ドルで売られた。事故の報告はなく、全額が返金される。","\n【概要】米消費者製品安全委員会（CPSC）は2026年11月19日、Ciptonの自転車用ヘルメットの回収を発表した。義務となっている安全基準を満たしておらず、衝突や転倒の際に頭を十分に守れず、重いけがや死亡につながる恐れがある。\n【背景】米国では自転車用ヘルメットに義務の安全基準が定められている。今回のヘルメットは、そのうち衝撃をやわらげる性能（衝撃吸収）、頭の上での位置の保ちやすさ（ずれにくさ）、認証の項目で基準を満たしていなかった。回収の対象には、頭囲約19.7〜21.3インチの「ユースサイズS」が含まれている。\n【詳細】回収の対象は1万6730個。全米のディックス・スポーティング・グッズとJCペニーの店舗、ディックスの通販サイトで、2024年4月から2026年5月まで約35ドルで売られた。これまでに事故やけがの報告はない。返金を受けるには、ヘルメットのストラップを切り、油性ペンで「Recalled」と書いて写真を撮り、指定のアドレスにメールで送ったうえで処分する。問い合わせは平日の東部時間午前9時から午後5時まで電話で受け付けるほか、業者のウェブサイトにも案内がある。\n【ポイント・注意点】CPSCは、対象のヘルメットの使用をすぐにやめるよう求めている。ヘルメットは見た目では性能が分からないため、基準を満たしていない製品をかぶっていても、守られていると思い込んでしまう危険がある。自転車に乗る子どものヘルメットを選ぶ際は、安全基準に適合していることを示す表示や認証を確かめることが大切だ。今回の製品が日本で売られているかは記事からは分からないが、海外の通販で買ったヘルメットを使っている場合は、型番や販売元を確認しておきたい。回収の手続きでは、ストラップを切って写真を送ったうえで処分する必要がある。家族で同じ製品を使っていないかも確かめたい。米国の大手の店舗で約2年にわたって売られていた製品であり、対象のヘルメットを持っていないか、購入した時期と販売店を手がかりに確かめておきたい。","2026-11-19","米消費者製品安全委員会（CPSC）","https://www.cpsc.gov/Recalls/2027/Cipton-Recalls-Bicycle-Helmets-Due-to-Risk-of-Serious-Injury-or-Death-from-Head-Injury-Violate-Mandatory-Standard-for-Bicycle-Helmets"],["長崎でインフル3週連続増 患者の75%超が10代以下 学級閉鎖も","長崎県内で11月15日までの1週間に報告されたインフルエンザの患者は760人で、前の週より97人多かった。50の定点医療機関の1医療機関あたりでは15.20人で、3週連続の増加となり、注意報レベルの10を7週続けて超えた。対馬地区に加えて県北地区が警報レベルの30以上となった。患者の75%以上を10代以下が占め、小学校を中心に12の学年・学級閉鎖が起きている。","\n【概要】長崎県内でインフルエンザの患者が3週連続で増えている。11月15日までの1週間の患者は760人で、患者の4分の3以上を10代以下の子どもや若者が占めた。学校では学年閉鎖や学級閉鎖も相次いでいる。\n【背景】県内のインフルエンザの患者数は、県内50の定点医療機関からの報告で把握されている。1医療機関あたりの報告数が10を超えると注意報レベル、30を超えると警報レベルとされる。長崎県では、注意報レベルの10を超える状態がすでに7週続いている。\n【詳細】直近1週間（11月15日まで）に報告されたインフルエンザの患者は760人で、前の週より97人多かった。1医療機関あたりでは15.20人で、3週連続の増加となった。地域別では、長崎市、佐世保市、西彼地区が注意報レベル（10以上）となった。さらに、対馬地区に加えて新たに県北地区が警報レベル（30以上）となった。年代別では、患者全体の75%以上を10代以下が占めている。学校では、11月13日までの5日間に、主に小学校で計12の学年閉鎖や学級閉鎖が発生した。\n【ポイント・注意点】県は今後の大きな流行に備え、手洗い、マスクの着用、換気といった基本的な感染対策を呼びかけている。患者の大半が10代以下であることから、学校や家庭での子どもの感染に特に気を配る必要がある。県内でも地域によって流行の度合いが異なり、県北地区や対馬地区ではすでに警報レベルに達している。子どもに発熱などの症状が見られたときは早めに医療機関に相談し、無理に登校させないことが、学校での広がりを抑えることにもつながる。注意報レベルを超える状態が7週続いていることからも、県内では流行が長引いている。今後は年末に向けて人の行き来が増える時期となり、さらなる拡大への備えが欠かせない。学年・学級閉鎖の情報にも注意を払いたい。長崎市、佐世保市、西彼地区でも注意報レベルに達しており、県内の広い範囲で流行が続いている。10代以下の割合が高い状況では、家庭の中で兄弟姉妹の間に広がることにも気をつけたい。","2026-11-19","Yahoo!ニュース（NBC長崎放送）","https://news.yahoo.co.jp/articles/ab669b77582eb26fcdd7c5beaaa7efdfbdb2d63e"],["1型糖尿病の部分寛解 肥満の子では従来の指標が半数以上を見逃す","米ベイラー医科大学の研究チームは、1型糖尿病の部分寛解を見積もる指標「IDAA1c」が、太り気味や肥満の子どもでは、部分寛解の子の45%しか見つけられないと報告した。診断から1年以内の若者422人を分析した結果で、全体では部分寛解の子の約61%を正しく見分けていた。研究者は、特に太り気味や肥満の患者でこの指標を使う際は慎重に判断するよう求めている。結果は米医学誌Diabetes Careに掲載された。","\n【概要】米ベイラー医科大学の研究チームが、1型糖尿病の子どもの「部分寛解」を見積もる一般的な指標が、太り気味や肥満の子では半数以上の寛解を見逃すと、米医学誌Diabetes Careに発表した。\n【背景】部分寛解とは、1型糖尿病と診断された後も、体がまだ意味のある量のインスリンを作っている状態を指す。責任著者のマリア・レドンド医師は、部分寛解は血糖値の管理がしやすく、低血糖の回数が少なく、長期的な合併症も少ない可能性があることと関連すると説明している。IDAA1cは、HbA1cと1日のインスリンの量から計算する指標で、部分寛解を見積もるのに使われている。\n【詳細】研究では、米国の「SEARCH for Diabetes in Youth」研究に参加し、診断から1年以内だった若者422人を分析した。基準には、刺激後のCペプチドの値を用いた。従来のIDAA1cの基準値である9以下では、部分寛解の若者の約61%、寛解していない若者の約79%を正しく見分けた。しかし、太り気味や肥満の若者では、部分寛解の子の45%しか見つけられなかった。基準値を11.6に上げると、この集団での見つけ方は良くなったが、誤って寛解と判定する例も増え、全体の性能は理想的とはいえなかった。\n【ポイント・注意点】筆頭著者のマイケル・ファーム氏は、この検査では意味のあるインスリンをまだ作っている子どもの半数以上を見逃すことになると述べた。レドンド医師は、個々の患者を評価する際、特に太り気味や肥満の患者では、IDAA1cを慎重に使うよう助言し、部分寛解を定義して測るための、より信頼できる方法が必要だとした。子どもの肥満が増えるなか、体格の違いで指標の精度が変わることを意識した診療が求められている。基準値を変えるだけでは、見逃しと誤判定の両方を同時に減らすことはできず、別の測り方の工夫が必要だという点が今回の研究の要点である。患者や家族にとっては、指標の数字だけで判断せず、主治医と相談しながら治療を進めることが大切になる。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-common-diabetes-score-partial-remissions.html"],["雪で中央線が見えないと法定30キロに？ 北海道で新たな標識","2026年9月から、中央線や中央分離帯がなく速度標識もない道路の法定速度が時速60キロから30キロに引き下げられた。住宅街などの生活道路での事故を防ぐのが目的だが、冬の北海道では雪で中央線が見えなくなり、幹線道路でも法定速度が30キロになる可能性があるという。混乱を避けるため、北見市の国道39号では11月19日に最高速度60キロの標識が新たに設けられた。記事は生活道路での子どもの飛び出しの危険にも触れている。","\n【概要】生活道路での事故を防ぐため、2026年9月に法定速度の見直しが行われ、中央線などがない道路の法定速度が時速30キロに引き下げられた。冬の北海道では、雪で中央線が見えなくなることで、幹線道路でも法定速度が30キロになる可能性があり、新たな課題として浮上している。\n【背景】見直しでは、中央線や中央分離帯がなく、速度標識もない道路の法定速度が、時速60キロから30キロに引き下げられた。目的は、住宅街などの生活道路での事故の防止である。記事は、生活道路には、突然車道に飛び出してくる子どもなどの危険があることにも触れている。本来の対象は、道幅の狭い生活道路だ。\n【詳細】ところが冬の北海道では、幅の広い道路でも、中央線が雪で見えなくなることがある。警察によると、国道などの幹線道路でも、速度標識がなく中央線が完全に見えなくなると、法定速度が30キロになる可能性がある。雪によって法定速度が30キロになる可能性がある道路は、国道や道道を含めて道内で1万キロ以上ある。混乱を避けるため、北見市の国道39号では11月19日、最高速度を時速60キロとする標識が新たに設置された。道内では国道4路線の約25キロの区間で、標識を新たに設けているという。\n【ポイント・注意点】法定速度の引き下げは、子どもや高齢者が歩く生活道路の安全を高めるための見直しである。一方で、雪国では路面の状態によって適用される速度が変わる可能性があり、ドライバーが戸惑う恐れがある。冬道では、標識の有無や中央線が見えるかどうかに気を配るとともに、雪で歩道と車道の境目が分かりにくくなる住宅街では、特に子どもの飛び出しに注意してスピードを控えめにすることが求められる。見直しの趣旨を理解し、生活道路では速度を落とす習慣をつけることが、子どもを事故から守ることにつながる。標識を新たに設けた区間は約25キロで、雪で30キロになる可能性がある1万キロ以上の道路と比べるとごく一部である。冬の間の運転では、とりわけ慎重さが求められる。法定速度がどう変わりうるかを、運転する人が事前に知っておくことも大切だ。","2026-11-19","Yahoo!ニュース（STVニュース北海道）","https://news.yahoo.co.jp/articles/9cc99345756c3645c6218d476882933183c13252"],["米陸軍が劣化爆薬を爆破処理 鉛の粉じん最大161キロ 子どもに注意","米陸軍は、アイオワ州南東部の陸軍弾薬工場で、劣化して極めて不安定になった起爆用の爆薬アジ化鉛を爆破処理する計画を進めている。爆発で生じる鉛を含む粉じんは最大100マイル（161キロ）先まで運ばれる恐れがある。陸軍は健康への大きな影響は見込まれないとしつつ、近くの住民に避難を勧めた。記事は、鉛は子どもと妊婦に最も危険だとして、幼い子を土に触れさせないなどの対策を紹介している。","\n【概要】米陸軍が、アイオワ州南東部ミドルタウンにあるアイオワ陸軍弾薬工場で、不安定になった爆薬を金曜日の正午に爆破処理する計画を進めている。米ニューヨーク・タイムズの報道を引いたヘルスデイの記事によると、爆発で生じる鉛を含む粉じんは最大100マイル（161キロ）先まで運ばれる恐れがある。\n【背景】処理されるのは、より大きな軍用の爆薬を起爆させるのに使われる、非常に敏感な爆薬のアジ化鉛である。陸軍の爆破許可によると、工場にある68本のたるは劣化し、極めて不安定になっている。陸軍は、たるを動かすことは偶発的な爆発の「容認できない危険」を伴うとした。米環境保護局（EPA）は前の週、偶発的な爆発の危険を理由に緊急の許可を出した。\n【詳細】陸軍は水曜日に公表した評価で、爆発は短く大きな音と、すぐに消える鉛を含んだ粉じんの雲を生じるが、健康への大きな影響は見込まれないとした。それでも近くの住民には避難を勧め、最も近くに住む人には一時的な避難先を用意した。避難しない人には、窓を閉めて室内の空気を循環させ、その後に窓枠や子どものおもちゃを拭くよう求めた。陸軍工兵隊は希望した約150人の住民の土壌を爆破前に調べ、爆破後も検査を行う。鉛が規制の上限を超えた場合は除去作業を行うという。アイオワ大学公衆衛生大学院のパトリック・オショーネシー教授は、強い北風が煙を町から遠ざけて早く薄める可能性がある一方、「かえって遠くまで広げる」とも述べ、「どうなるのか本当のところは誰にも分からない」と話した。\n【ポイント・注意点】記事は、鉛は子どもと妊婦にとって最も危険だとしている。胎児の発達中の脳を傷つけ、長く続く学習や行動の問題を起こし、早産や流産のリスクを高めることがある。鉛は分解されず、発生源がなくなった後も長く土に残る。EPAと米疾病対策センター（CDC）は、玄関で靴を脱ぐこと、ペットの足を拭くこと、幼い子どもをむき出しの土に近づけないことを勧めている。家庭菜園の作物はよく洗い、根菜は皮をむき、葉物野菜は外側の葉を捨てるよう記事は助言している。CDCによると、鉛にさらされても多くの人は症状がなく、確かめるには血液検査が最もよい方法だという。","2026-11-19","Medical Xpress（HealthDay）","https://medicalxpress.com/news/2026-11-army-blast-iowa-toxic-miles.html"],["スキー場のエスカレーターで巻き込み事故の恐れ 消費者事故調が防止策","消費者安全調査委員会（消費者事故調）は11月18日、スキー場のベルトコンベヤー式エスカレーターで起きる恐れがある巻き込み事故の防止策を公表した。運行前の監視員の配置、停止装置の作動確認、緊急時の救助手順の確認などを求め、利用者には立った姿勢で使うよう呼びかけた。北海道小樽市では2025年12月、5歳の男児が巻き込まれて死亡しており、降り口で自動停止装置が作動しない設備も確認された。","\n【概要】消費者安全調査委員会（消費者事故調）は2026年11月18日、スキー場に置かれたベルトコンベヤー式のエスカレーターで起きる恐れがある巻き込み事故について、防止策を公表した。本格的なスキーシーズンを前に、運営者と利用者の双方に注意を呼びかけている。\n【背景】対象は「スノーエスカレーター」などと呼ばれる移動設備で、初心者用のエリアや、駐車場とゲレンデの間などに置かれている。利用者はベルトの上に立ったまま雪の上を移動できるが、ベルトが降り口で機械の内部に引き込まれる構造のため、転んだり座り込んだりした状態では、衣服や腕が巻き込まれる恐れがある。北海道小樽市のスキー場では2025年12月、男児（当時5）が巻き込まれて死亡した。\n【詳細】事故調は2026年3月から関連する設備の調査を進めてきた。その結果、降り口付近で衣服が巻き込まれた際に、自動停止装置が作動せず、止まらないものがあったことを確認した。防止策として、運行の前に、(1)監視員を配置する、(2)停止装置が作動するか確かめる、(3)緊急時の救助の手順や役割分担を確認する、ことなどを示した。利用者に対しては、立った姿勢で使うことや、衣服のひもなどが機械に巻き込まれないようにすることを求めている。\n【ポイント・注意点】スキー場のエスカレーターは子どもや初心者がよく使う設備で、転倒や座り込みが巻き込みにつながる恐れがある。保護者は、子どもがベルトの上でしゃがんだり座ったりしないよう事前に伝え、ウエアのひもや長いマフラーなど、引き込まれやすい物を外に垂らさないよう確かめておきたい。降り口に近づいたら立ち止まらずに速やかに降りることも大切だ。異常を見つけたときは、すぐに監視員に知らせるようにしたい。事故調は全国の設備を調べたうえで防止策をまとめており、スキー場の運営者には運行前の点検と監視の徹底が求められる。設備によっては自動停止装置が働かない場合があることが確認されており、装置だけに頼らず、人の目で見守る体制を整えることが重要になる。子どもを連れて利用する際の参考にしたい。","2026-11-18","Yahoo!ニュース（時事通信）","https://news.yahoo.co.jp/articles/64dbd1c726bcb20f6932ae73c2d4b84ebdef7f80"],["チャイルドシート使用率84%でも 5歳児は65.7%で正しく座れた子は58.7%","JAFと警察庁が2026年5月に行った全国調査で、6歳未満のチャイルドシート使用率は84.0%と過去最高を更新した。ただし5歳児では65.7%に下がり、助手席での使用率も68.6%にとどまった。取扱説明書どおりに固定されていたのは77.6%で、子どもが正しく座れていたのは58.7%だった。国の基準を満たさない未承認品がネット通販で出回っている点も指摘されている。","\n【概要】チャイルドシートの使用率は過去最高となったが、年齢の高い子での使用率の低さや、取り付けと座らせ方の不備など、子どもの命を守るうえでの課題が残っている。JAFと警察庁が2026年5月に行い、9月15日に発表した全国調査の結果を、交通メディアのMerkmalが解説した。\n【背景】調査によると、6歳未満のチャイルドシートの使用率は84.0%で、過去最高を更新した。年齢別では、1歳未満が94.8%、1〜4歳が86.9%と高い一方、5歳児では65.7%に落ち込む。乗る位置では、後部座席の86.0%に対し、助手席は68.6%だった。助手席、特に後ろ向きに取り付けた場合は、衝突時にエアバッグが開いて危険とされ、原則は後部座席に取り付ける。\n【詳細】全国16か所で434台のチャイルドシートを確かめたところ、取扱説明書どおりに固定されていたのは77.6%だった。不備で最も多かったのは腰ベルトの締め付け不足で、乳児用で47.4%、幼児用で57.5%に見られた。また、651人の子どもの座り方を確かめたところ、正しく座れていたのは58.7%で、41.3%に何らかのミスがあった。乳児用・幼児用では、ハーネスの締め付け不足が半数近くを占めた。記事は、国の基準を満たさない未承認品がネット通販で出回っていることも指摘している。\n【ポイント・注意点】チャイルドシートを使っていても、固定や座らせ方が不十分だと、事故の際に子どもを守りきれない恐れがある。取り付けたら取扱説明書を見ながら腰ベルトがしっかり締まっているかを確かめ、子どもを乗せるたびにハーネスの締め付けを確認したい。体が大きくなる5歳前後でも使用を続け、取り付けは原則として後部座席にすることが大切だ。購入の際は、国の基準を満たしていることを示す表示を確認したい。子どもの成長に合わせ、シートのサイズや向きを見直すことも欠かせない。調査結果は、使うかどうかだけでなく、正しく使えているかどうかが子どもの安全を左右することを示している。保護者が日ごろから点検する習慣をつけることが、事故の際の被害を減らすことにつながる。","2026-11-18","Yahoo!ニュース（Merkmal）","https://news.yahoo.co.jp/articles/c4e6449e2b4a9fcfca089490f6deab9880440c12"],["希少な神経発達症の子に個別の遺伝子治療を 診断から設計への道筋","カナダのマギル大学などの研究チームが、希少な神経発達症の子どもについて、遺伝子の診断から個別の遺伝子治療の設計と試験までをつなぐ枠組みを示した。血液から患者の変異を持つ脳の細胞を作り、病気の研究や治療の試験に使う。実例として、クリーフストラ症候群の子のための実験的なRNA治療を作り、細胞で試した。人での試験の前には、さらに研究が必要だとしている。結果は米人類遺伝学会誌に掲載された。","\n【概要】カナダのマギル大学とケベック州のサント・ジュスティーヌ大学病院センターの研究チームが、希少な神経発達症の子どもに向けて、遺伝子の診断から個別の遺伝子治療の設計と試験までを結びつける枠組みを、米人類遺伝学会誌に発表した。\n【背景】希少な神経発達症は、原因となる遺伝子の変異が子どもごとに異なることが多い。著者らは、必要な技術の多くはすでにあり、課題はそれらを医療の仕組みの中に組み込むことだと指摘している。\n【詳細】枠組みでは、まず患者の血液を採り、そこから患者の変異を持つ脳の細胞を作る。その細胞を使って、実験室で病気の仕組みを調べたり、治療法を試したりする。研究チームは実例として、クリーフストラ症候群の子どものための実験的なRNA治療を開発し、試験した。クリーフストラ症候群は、発達の遅れ、知的障害、言葉の困難を起こす希少な遺伝性の病気である。この治療は実験室の細胞でのみ試されたもので、人での試験に進む前には、さらなる研究が必要だとしている。記事には、患者の人数や効果の数値は示されていない。\n【ポイント・注意点】筆頭著者でマギル大学の博士課程の学生のジュリア・マッキントッシュ氏は、診断を「遺伝子に基づく治療の設計を導くために」使う取り組みだと説明した。責任著者でマギル大学のカール・アーンスト氏は、このモデルがほかの地域の遺伝子診断の拠点にも役立ちうると述べた。今回の成果は、治療法が確立したことを意味するものではなく、子ども一人ひとりの変異に合わせた治療を目指す研究の道筋を示したものである。診断がついても治療法がない希少疾患の子どもと家族にとって、今後の進展が注目される。今回の枠組みは、診断のための血液の検査から治療の設計までを一続きの流れとしてとらえる点に特徴がある。実際の医療の場で使われるには、安全性の確認や費用、体制づくりなど、乗り越えるべき課題が多く残っている。クリーフストラ症候群の例では、患者の変異を持つ細胞で実験的なRNA治療を試すところまで進んだが、人での検証はこれからの課題である。","2026-11-18","News-Medical","https://www.news-medical.net/news/20261118/New-framework-aims-to-create-personalized-genetic-therapies-for-rare-neurodevelopmental-disorders.aspx"],["幼少期のビスフェノールAやフタル酸エステル 思春期の肝機能を追跡","韓国の研究チームが、ソウルの出生コホートの子ども126人を対象に、3〜5歳と7〜9歳の尿中のビスフェノールA（BPA）と9種類のフタル酸エステル代謝物を測り、10〜15歳時の肝臓の酵素の値との関係を調べた。全体の混合曝露と肝臓の酵素との関連は統計的に有意ではなかったが、一部の物質で年齢や性別によって異なる関連が見られた。著者らは因果関係や肝障害は示していないとしている。","\n【概要】プラスチックのおもちゃやシャンプーなど身近な製品に含まれうる化学物質と、子どもの肝臓の健康との関係を調べた研究を、韓国の国立がんセンターや梨花女子大学などの研究チームが科学誌Scientific Reportsに発表した。\n【背景】ビスフェノールA（BPA）やフタル酸エステル類は、日常のさまざまな製品から体に入る可能性がある化学物質である。研究は、ソウルの「梨花出生・成長コホート」に参加する子どもを幼少期から追った前向きの研究として行われた。\n【詳細】対象は126人の子どもで、3〜5歳と7〜9歳の時点で、尿中のBPAと9種類のフタル酸エステル代謝物を測った。思春期（10〜15歳）には、肝臓の酵素であるAST、ALT、γ-GTPと、AST/ALT比を測った。さらに38人は思春期の肝臓のデータがないため除外された。分析には、複数の物質を同時に見る手法を用い、男女別や物質同士の相互作用も調べた。男子は女子より、AST、ALT、γ-GTPの中央値が有意に高かった。物質全体の混合曝露と肝臓の酵素との関連は統計的に有意ではなかった。9種類のフタル酸エステルのうち、低分子量のものが両方の年齢でASTに対して最も重要とされ、その中でもフタル酸モノイソブチルが最も重要な目印だった。一部の代謝物では、年齢や性別によって異なる関連や、統計的に有意な物質同士の相互作用も見られた。\n【ポイント・注意点】著者らは、この研究は因果関係を確かめたものでも、肝臓の障害を示したものでもないとしている。対象者が少ないこと、尿を1回だけ採ったこと、これらの物質は体内にとどまる時間が短いこと、思春期の喫煙や飲酒などの要因を測っていないことを限界に挙げ、より大規模な前向き研究が必要だとした。結果だけで特定の製品を避けるべきだと結論づける段階ではない。化学物質と子どもの健康の関係は、曝露の時期や性別によって表れ方が異なる可能性があり、長い期間にわたる追跡が欠かせない。今回の研究は、そうした調査の必要性を示した一例といえる。","2026-11-17","News-Medical","https://www.news-medical.net/news/20261117/From-plastic-toys-to-shampoo-Could-everyday-chemicals-influence-childrens-liver-health.aspx"],["魚介類を倍食べると子の尿中水銀13.2%高く 韓国2329人を分析","韓国の研究チームが、3〜17歳の子どもと若者2329人のデータを分析し、魚介類を食べる量が2倍になると尿中の総水銀が13.2%高くなる関連を示した。最も多く食べる群は最も少ない群より45〜83%高かった。一方、若者872人で尿と血液の検査を比べると、一致は中程度で、尿の検査は血中水銀が上位20%の人の約半数しか見つけられなかった。尿の検査は血液検査の代わりにならないとしている。","\n【概要】子どもの水銀の摂取を調べる方法として、尿の検査がどこまで使えるかを検証した研究を、韓国の忠北大学病院や順天郷大学医学部などの研究チームが科学誌Scientific Reportsに発表した。魚介類を多く食べる子ほど尿中の水銀が高い一方、尿の検査だけでは個々の子どもの状態を十分にとらえられないことが示された。\n【背景】研究には、韓国国民環境保健基礎調査の第5期（2021〜2023年）のデータを使った。全国を代表する3つの集団で、未就学児（3〜5歳）648人、小学生（6〜11歳）780人、中高生（12〜17歳）901人の計2329人が対象となった。保護者または本人が、6つの区分で魚介類を食べる頻度を答えた。尿はすべての子どもから1回採り、血液は中高生からのみ採った。\n【詳細】動物性の魚介類を食べる量が2倍になると、尿中の総水銀は13.2%高くなり、年齢による差は見られなかった。最も多く食べる群は、最も少ない群より尿中の水銀が45〜83%高かった。過去1週間に魚介類を食べた日が1日増えるごとに、尿中の水銀は約5〜6%高かった。魚と甲殻類は一貫して寄与していたが、比較のために調べた海藻では関連がなかった。尿と血液の両方を調べた中高生872人では、両者の一致は中程度で、同じ水銀の区分に入ったのは約3分の1、血中水銀が上位20%の人のうち尿の検査で見つかったのは約半数だった。\n【ポイント・注意点】著者らは、尿の検査は集団全体を見張る目的には向くかもしれないが、個々の子どもについては血液検査の代わりにならないと結論づけた。尿中の水銀の値は、子どもの健康に基づくドイツの指針値を全体としてかなり下回っていた。研究は健康への影響を調べておらず、因果関係も示していない。子どもの水銀の状態を正確に知りたい場合には、尿ではなく血液の検査が必要になりうることを示す結果である。魚介類は栄養源でもあり、この研究だけで食べ方を変えるべきとは言えない。研究で使った尿の試料は1回だけ採ったものであり、調べ方によって結果が変わりうることにも注意が必要だ。","2026-11-17","News-Medical","https://www.news-medical.net/news/20261117/A-study-of-2329-children-and-teens-challenges-how-we-measure-mercury-exposure.aspx"]],"dev":[["夜のスマホ使用で10代の睡眠が短く 特に女子で強い関連 アプリで実測","米国の13〜18歳の若者218人のスマートフォンに利用を記録するアプリを入れ、平均17.5日間の使い方と睡眠の関係を調べた研究が、Journal of Adolescent Healthに掲載された。夜間の使用が1時間増えるごとに睡眠は約26分短く、夜間のSNSでは平均44.4分短かった。女子では夕方の使用が1時間増えると寝つきが82.2分遅れ、睡眠が70.8分減っていた。結果は関連を示すもので、因果関係は分からない。","\n【概要】スマートフォンを夜遅くまで使う10代ほど睡眠が短く、その傾向は特に女子で強いことが、スマートフォンの利用を実際に記録した研究で示された。論文は米ストーニーブルック大学のMEDiA研究としてJournal of Adolescent Healthに掲載され、Medical Xpressが紹介した。\n【背景】記事によると、専門家は10代に毎晩少なくとも9〜9.5時間の睡眠を勧めているが、スマートフォンは就寝を遅らせ、睡眠を乱すことがある。これまでの研究の多くは、10代が自分で見積もったスクリーン時間の回答に頼っており、思い出し方の偏りが入りうるという課題があった。\n【詳細】研究チームは、米国の13〜18歳の若者218人の自分のスマートフォンに「RealityMeter」というアプリを入れ、平均17.5日間、アプリごとの使用時間や種類、使った時間帯を記録した。使い方は日中、夕方、夜間に分け、スマートフォン全体の使用とSNSの使用も分けて分析した。1日の使用が多い10代ほど寝る時間が遅く、睡眠が短く、平日と週末で睡眠が不規則になり、週末に寝だめをする傾向があった。夜間の使用が1時間増えるごとに睡眠は約26分短く、夜間のSNSが1時間増えると平均44.4分短かった。女子では、夕方のスマートフォンやSNSの使用が就寝の遅れや睡眠の短さと有意に関連し、夕方の使用が1時間増えるごとに寝つきが82.2分遅く、睡眠が70.8分少なかった。男子ではこの関連は統計的に有意ではなかった。男女とも、使用が多いほど休日の寝だめが多かった。睡眠の質の自己評価の低さと関連したのは夜間のSNS使用だけで、その効果は小さかった。\n【ポイント・注意点】結果は観察による関連で、スマートフォンの使用が睡眠を短くしたと断定するものではない。研究者は、良い睡眠のためには全体のスクリーン時間を減らすだけでは足りない可能性があるとし、寝る前の使用やSNSを減らすといった特定の習慣に的を絞る方法を今後の研究で試すべきだとしている。こうした方法は特に女子の助けになる可能性があるという。記事は参加者の男女の内訳を示しておらず、研究者の発言も直接は引用していない。","2026-11-20","Medical Xpress","https://medicalxpress.com/news/2026-11-late-night-linked-shorter-teens.html"],["妊娠中のストレスは「時期」が大事 母の産後うつと乳児に影響 米大学","米ミシガン州立大学の研究チームは、妊娠15週という早い時期から毎週ストレスを測る研究を進めている。逆境的小児期体験が4つ以上ある女性では、妊娠20週のストレスの高さや週ごとの揺れの大きさが産後6か月のうつの悪化と関連した。生後6か月の乳児では、ストレスの影響を受けやすい時期が女の子は妊娠中期ごろ、男の子は妊娠後期と異なっていた。チームは約400組の母子のコホートで追跡を続ける。","\n【概要】妊娠中のストレスが母親と赤ちゃんに与える影響は、ストレスの大きさだけでなく妊娠のどの時期かによって異なることを、米ミシガン州立大学（MSU）の研究チームが報告した。妊娠15週という早い時期から毎週ストレスを測る、初めての種類の研究だという。\n【背景】妊娠中には最大70%の女性がストレスや不安の症状を経験するとされ、妊娠中のストレスは37週未満の早産の一因になりうる。どの時期のストレスが特に影響するのかは、よく分かっていなかった。研究チームは、ストレスを細かい間隔で測ることで、母子に影響しやすい時期を明らかにしようとしている。\n【詳細】エイミー・ナトール准教授らの研究（Archives of Women's Mental Health）では、機械学習による分析で、妊娠期間を通じたストレスの高さが産後うつのリスク上昇と関連した。ストレスの時期と一貫性も鍵で、逆境的小児期体験が4つ以上ある女性では、妊娠20週のストレスの高さと週ごとの揺れの大きさが、産後6か月のうつの悪化と関連した。ナトール准教授は人間発達・家族学科に所属し、研究の主任研究者の一人だ。別の研究では、アリシア・レベンドスキー教授が生後6か月の乳児を調べた。ストレスホルモンであるコルチゾールの反応にとって影響を受けやすい時期は、女の子では妊娠中期ごろ、男の子では妊娠後期だった。女の子では妊娠全体の平均ストレスの高さと妊娠中期〜後期のストレスが、ぐずりやすい気質と関連し、男の子では妊娠中期〜後期という時期の影響だけが気質と関連した。\n【ポイント・注意点】チームは約400組の母子のコホートをもとに、研究費を得た追跡研究を進め、行動の問題が子どもの約20%に見られるとされる児童期中期まで調べる計画だ。最も影響の大きいストレスの時期や性別などによる違い、ストレスを和らげる支えとなる環境も検討する。心理学科のジョセフ・S・ロンスタイン教授も研究者として加わる。ナトール准教授は、知見が妊娠中のストレスの把握や支援に役立つ可能性を挙げているが、これは今後の応用として語られたもので、確立した成果ではない。なお、記事は公表された2つの研究の対象人数を示していない。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-prenatal-stress-mothers-infants.html"],["スクリーン時間と体力、10代の脳の構造に映る フィンランドの研究","東フィンランド大学の研究チームは、16〜19歳の健康な若者44人の脳をMRIで調べ、余暇のスクリーン時間や身体活動、体力が脳の灰白質の体積と関連することを報告した。スクリーン時間が長い若者は、記憶や学習に関わる内側側頭葉の灰白質が小さく、注意や視覚処理に関わる前頭や後頭の一部は大きかった。一時点の調査のため、因果関係は分からない。論文はNeuroImage: Reportsに掲載された。","\n【概要】余暇のスクリーン時間、身体活動の量、体力が、それぞれ10代の脳の構造に反映されていることを、東フィンランド大学の研究チームが報告した。論文はNeuroImage: Reportsに掲載された。スクリーンを長く使う若者では、記憶と学習に関わる領域の灰白質が小さかった。\n【背景】10代は脳が大きく変化する時期で、灰白質はふつう思春期に減っていく一方、脳の働きの効率は高まるとされる。スマートフォンなどの使用や運動の習慣が、この時期の脳とどう関わるかに関心が集まっている。今回の研究は、余暇のスクリーン時間、身体活動、体力という3つの要素を同じ若者で測り、脳の構造との関係を比べた。\n【詳細】研究には16〜19歳の健康な若者44人（女子25人、男子19人）が参加した。2018〜2019年のデータで、同大の「子どもの身体活動と栄養（PANIC）研究」とクオピオ大学病院のFitBrain研究から集めた。灰白質はMRIで測り、スクリーン時間やスマート機器の使用、身体活動は質問票で、体力は50メートルのシャトルランと立ち幅跳びの合成得点で評価した。スクリーン時間が長い若者は、記憶と学習に関わる内側側頭葉の灰白質の体積が小さかった。一方、運動の計画、注意、作業記憶、意思決定に関わる前頭皮質の一部と、視覚情報を処理する後頭部では体積が大きかった。身体活動が多いほど右の後頭部の体積が大きく、体力が高いほど頭頂葉は大きいが、海馬と後部帯状回は小さかった。\n【ポイント・注意点】博士課程の研究者ハンナマリ・スコグ氏は、体積の大きさは注意や運動の計画、視覚処理を求めるアプリやゲームと関係している可能性がある一方、脳の発達の遅れを反映している可能性もあるとした。調査は一時点のもので、因果関係や、体積の違いが良いのか悪いのかは分からない。スコグ氏は、長期的な意味の理解にはさらに研究が必要だと述べている。対象は44人と少なく、スクリーン時間や身体活動は質問票による回答である点にも注意が必要だ。海馬は記憶と学習の中心となる領域で、体力との関係の意味もまだはっきりしない。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-screen-smart-device-usage-adolescent.html"],["離乳期の多様な味が大人の好みを形づくる 脳の「最適期」をマウスで","米オハイオ州立大学の研究者は、母乳やミルクから固形食へ移る時期が、生涯の味の好みを形づくる「最適期」である可能性をマウスで示し、米神経科学学会の年次総会で発表した。離乳後に複数の味を持つ栄養飲料を与えたマウスは、大人になって甘い水を好んだ。味覚をつかさどる脳の領域の回路の成熟が関わるとみられる。ただし人での時期や意味はまだ分からない。論文誌への掲載は記事に示されていない。","\n【概要】赤ちゃんが母乳やミルクから固形食へ移る時期は、食べ物の多様さに触れることで生涯の味の好みを形づくる「最適期」かもしれない。米オハイオ州立大学の研究者がマウスの研究をもとに、米神経科学学会の年次総会「ニューロサイエンス2026」でポスター発表した。研究には同大神経科学大学院プログラムの学生、イーデン・キャントレル氏も加わった。\n【背景】研究が注目するのは、味をつかさどる脳の領域である味覚皮質だ。ここの神経細胞は、幼い頃の多様な食事に反応して回路を成熟させ、のちの味に基づく行動を左右するとみられる。以前の研究では、離乳後にさまざまな味を与えられたマウスは、餌と水だけのマウスより大人になって砂糖を強く好み、大人になってから同じ味に触れたマウスではこの好みは見られなかった。生後の時期には味覚皮質の抑制性の細胞の可塑性が高く、経験に応じてつながりを組み替えていた。\n【詳細】上席著者で同大歯学部のヒラリー・シフ助教が11月15日に発表した。今回は甘味、塩味、うま味を持つ栄養飲料「エンシュア」を幼い時期の経験として使い、シフ氏はそのカロリーや栄養素が重要とみられると話す。離乳後にエンシュアを与えたマウスは、のどが渇いているときも満腹のときも、大人になって甘い水を好んだ。大人のマウスで味覚皮質の働きを止める別の実験では結果が分かれ、幼い頃にエンシュアを与えたマウスは、渇いているときに水より砂糖を選ぶことが少なくなり、満腹のときには甘くない添加物に関心を示した。記事は、幼い時期の経験が単に甘い物への欲求を生むのではなく、味覚を洗練させる証拠と読んでいる。\n【ポイント・注意点】シフ氏は、マウスの脳の変化の時期は、幼い子の長い食事の移行期間と一致しないと注意する。回路の成熟に最適な「感受期」はまだ定まっておらず、人への意味も分からない。記事はマウスの実験の数を示していない。今回は学会のポスター発表で、論文誌への掲載は記事に示されていない。シフ氏の研究室は、幼い時期の神経細胞が味の好みにどう関わるかを引き続き調べている。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-child-sweet-affects-adult.html"],["自閉症の子の支援の目標は「良い人生」へ 144研究のレビューがBMJに","カナダ・アルバータ大学のロニー・ツヴァイゲンバウム医師らが、2019〜2025年の文献をもとに自閉症の子どもと若者の支援に関する科学の現状を英医学誌BMJでまとめた。9038人の子どもを含む144の研究から、より集中的な治療が必ずしもより良い結果を生まないと結論づけた。行動を変えることから、人間関係や楽しみを含む良い人生を支えることへと、目標が広がっているという。","\n【概要】自閉症の子どもと若者の発達を支える方法について、カナダの研究者らが英医学誌BMJで「科学の現状」をまとめたレビューを発表した。共同筆頭著者でアルバータ大学のロニー・ツヴァイゲンバウム医師は、「私たちはようやく自閉症の人たちの経験に耳を傾けている」と述べた。\n【背景】記事によると、自閉症は子どもの推定1〜2%にみられ、男性は女性の3〜4倍多く診断される。診断は増えているが、本当に発症が増えたというより、認知が高まったためとみられる。成功の目標は、行動を変えることから、人間関係や家族、意味のある活動、楽しみを含む良い人生を支えることへと広がってきたという。\n【詳細】著者は全員カナダの研究者で、2019〜2025年の出版物を調べた。レビューには9038人の子どもを含む144の研究が入り、より集中的な治療が必ずしもより良い結果を生まないと結論づけた。著者らは、医療、行動、教育、心理の支援を家族と一緒に子どもに合わせて調整し、家庭や学校、地域での日常を乱さずに役立てるよう勧める。ツヴァイゲンバウム医師はこれを「構造と柔軟さの結婚」「料理本というより枠組み」と表現した。また、診断時の状態から子どもの成長は予測できないとし、期待される結果や研究される結果が標準化されていない点を批判した。代わりに、カナダ・マクマスター大学の「発達のFワード」（機能、家族、体力、楽しみ、友達、将来）を勧めている。なお、論文の筆頭著者にはメラニー・ペナー氏の名が記されている。\n【ポイント・注意点】ツヴァイゲンバウム医師は、自閉症の人はしばしば偏見や、生活の質とケアへの障壁に直面し、民族や性別、地域、所得といった社会的要因も影響すると指摘する。診断から就学前、小学校、10代までを追う研究「Pathways in Autism Spectrum Disorder」では、エドモントン拠点の責任者として参加者を大人になるまで追う予定だ。早期介入プログラム「Social ABCs」にも共同研究者として加わり、自閉症の子どもや若者の病院での経験を良くする計画も始めるという。記事は報道向けの要約で、1〜2%という有病率の出典は示されていない。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-autistic-people.html"],["10代のうつ、重い飲酒や多様な大麻の使い方と関連 米国9817人の分析","米テキサスA&M大学の研究チームは、2023年の全米薬物使用・健康調査をもとに、12〜17歳の若者9817人を分析した。飲酒の程度が重いほど、また大麻を吸う、電子たばこで吸う、食品でとるなど多くの形で使うほど、大うつ病エピソードの可能性が高かった。女子や年長の10代、複数の人種にルーツを持つ10代は、飲酒や薬物に関係なくうつが多かった。研究者は、飲酒、薬物、うつを一緒に確かめるよう勧める。","\n【概要】10代の若者のうつが、飲酒の重さや大麻の使い方の多様さと関連していることを、米テキサスA&M大学公衆衛生学部の研究チームが報告した。論文はJournal of Substance Useに掲載された。全国を代表する9817人のデータを使った分析だ。\n【背景】記事によると、米国の若者のおよそ5人に1人が、過去2週間に気分の落ち込みを感じたと答えている。筆頭著者で博士課程の学生のスンヒョン・チョン氏は、これまでの研究の多くは物質を1つずつ、使ったかどうかや使った日数で調べてきたが、10代は複数の物質を重ねて使い、健康へのリスクもそれぞれ異なると指摘する。そこで今回は、使ったかどうかだけでなく、飲酒の重さと大麻のとり方の種類まで区別して同時に調べ、うつとの関係を見た。\n【詳細】研究は全国を代表する横断研究で、2023年の全米薬物使用・健康調査（NSDUH）から、12〜17歳の米国の若者9817人を分析した。飲酒が「ときどき」から「多量・頻繁」へと重くなるほど、また大麻を吸う、電子たばこで吸う、食品でとるといった、より多くの形で使うほど、大うつ病エピソードの可能性が高かった。また、女子、年長の10代、複数の人種にルーツを持つ10代は、薬物や飲酒の有無にかかわらず、大うつ病を経験している可能性が高かった。共著者は同学部のアダム・バリー氏とベンジャミン・モンテマヨール氏。論文の題は、米国の12〜17歳におけるアルコールと大麻の使用行動と大うつ病エピソードの関連、という趣旨だ。\n【ポイント・注意点】チョン氏は、親や医師、学校の関係者に対し、10代の飲酒、薬物使用、うつを一緒に確かめるよう呼びかけている。一方、この研究は一時点の調査に基づく関連の分析で、飲酒や大麻がうつを引き起こすのか、うつが使用を増やすのかといった因果関係は示していない。記事は割合やオッズ比などの具体的な数値も示していない。米国の若者を対象にした調査で、ほかの国にそのまま当てはまるかは分からない。それでも、物質の使い方とうつを組にして見る必要性を示した研究といえる。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-adolescent-teen-depression-linked-heavier.html"],["超低出生体重で生まれた人の多くが大人の生活へ順調に移行 スウェーデン","スウェーデン・ウプサラ大学の研究で、1990〜1992年に出生体重1000グラム以下で生まれた201人の26〜29歳時点の生活を、満期で生まれた327人と比べた。自立した生活は91%（対照97%）、就労や就学は85%（同93%）で、多くが大人の生活へ順調に移っていた。親しい友人や親になることでは差がなかった一方、妊娠23〜25週で生まれた人では差が大きかった。","\n【概要】とても小さく生まれた人の多くが、大人の生活へうまく移行していることを、スウェーデン・ウプサラ大学の全国コホート研究が示した。論文はArchives of Disease in Childhood—Fetal and Neonatal Editionに掲載された。多くの人が自立や仕事などの節目を迎えていた一方、一部の指標では満期で生まれた人との差も見られた。\n【背景】研究チームの以前の研究では、超低出生体重で生まれた人は、体と心の病気のリスクが高いことが分かっていた。今回は、自立や仕事、人間関係など、大人としての生活の節目をどの程度迎えているかを、大人への移行を示す6つの目印を使って確かめた。\n【詳細】対象は、1990年4月から1992年3月にスウェーデンで出生体重1000グラム以下で生まれた201人で、26〜29歳のときに調査に答えた。その回答を、満期で生まれた327人と比べた。指標は、自立した生活、就労または就学、恋愛関係、友人関係、親になることなどだった。自立して暮らしていたのは91%（対照群97%）、就労か就学中は85%（同93%）、恋愛関係を持ったことがあるのは80%（同88%）で、差はいずれも6〜8ポイントだった。後期中等教育の修了、親しい友人がいること、親になることでは差が見られなかった。障害のない人では差が小さく、妊娠23〜25週で生まれた人では差が大きかった。\n【ポイント・注意点】筆頭著者で小児科医のマリア・ヘイマン氏は、支援の必要性は、子ども時代の医療的な経過観察が終わったところで必ずしも終わるわけではないと述べる。対象は1990年代初めに生まれた人で、その後の新生児医療の進歩により、今ではこうした赤ちゃんがより多く生き延びている点にも留意が必要だ。記事は回答率や統計的な検定の結果を示していない。ヘイマン氏は、ウプサラ大学女性・子どもの健康学科の博士課程の学生でもある。論文の題は「超低出生体重で生まれた若い成人の大人への移行：スウェーデン全国コホート研究」。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-people-successful-transition-adult-life.html"],["国内9つの出生コホートが連携 5万6千組超の母子で子の成長・発達を追う","国立成育医療研究センターの青山友子氏、森崎菜穂氏らの研究グループは、国内9つの出生コホート研究が参加する全国出生コホートコンソーシアム（JBiCC）の特徴や追跡状況、収集情報、共同解析の仕組みをまとめ、国際学術誌International Journal of Epidemiologyに発表した。合わせて5万6000組を超える母子が対象で、妊娠期から子どもの成長・発達を追う研究をつなぎ、単独の研究では難しい課題に取り組む。東京大学などが共同で発表した。","\n【概要】妊娠期から子どもの成長・発達を追う国内の出生コホート研究をつなぐ「全国出生コホートコンソーシアム（JBiCC）」の全体像が、論文としてまとめられた。国立成育医療研究センター社会医学研究部の青山友子氏、女性の健康政策研究部の森崎菜穂氏らが国際学術誌International Journal of Epidemiologyに発表し、東京大学大学院医学系研究科などが共同でプレスリリースを出した。\n【背景】妊娠期や乳幼児期の栄養・生活習慣、周囲の環境は、子どもの成長やその後の健康に関係すると考えられている。この関連を調べるため、日本各地で妊娠期から母子の健康状態などを続けて調べる出生コホート研究が行われてきた。しかし個々の研究だけでは、参加者数などの制約から十分に検討できない課題もある。海外では複数の出生コホートが連携する
