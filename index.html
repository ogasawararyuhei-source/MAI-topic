羅についての判断が正しかった割合は、Claudeで79%から88%に、Codexで76%から80%に上がった。本当の危険を見つけた割合も44%から64%、54%から72%に伸びた。\n【ポイント・注意点】\nuvでCLIを入れ、genesis agent installでエージェントに組み込み、/genesis mapや/genesis review mainで使う。結果はview.htmlとして開ける。READMEは、評価の件数が少ないこと、採点にLLMを使っていることを自ら断っている。スターは65、フォークは9で、HNでは12ポイントを集めた。","2026-11-24","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50623965"],["Graticule：オシロスコープの画面写真を数値データに戻す","オシロスコープの画面のスクリーンショットから、波形のグラフ、CSVデータ、測定値の表を作り直すツール「Graticule」がHacker NewsのShow HNで紹介された。画面の目盛りと縮尺を読み取り、各アナログチャンネルの波形を抜き出して、ピーク間電圧や実効値、周波数、立ち上がり時間、位相などを測る。ブラウザで動くのでインストールは要らない。TypeScriptとReactで作られ、ライセンスはMIT。","\n【概要】\nGraticuleは、オシロスコープの画面を撮った画像を、もう一度数値として使えるデータに戻す道具だ。画像から目盛りの格子と縮尺を読み取り、チャンネルごとに波形を抜き出す。そこからピーク間電圧、実効値、周波数、立ち上がりと立ち下がりの時間、位相を測り、グラフやCSV、測定値の表として出力する。\n【背景】\n実験の授業や回路の試作では、オシロスコープの画面を写真やスクリーンショットで残すことが多い。しかし画像のままでは、あとから数値を計算したり別のグラフと比べたりできない。Graticuleは、そうした画像から元のデータを取り出し、解析やレポートに使えるようにする。HNの投稿タイトルも、画面写真をCSVとグラフに変える道具だと簡潔に紹介している。\n【詳細】\n高速フーリエ変換による周波数分析と全高調波ひずみ（THD）、XYモード、チャンネル同士の演算、ボード線図、実験レポート用のzipの出力にも対応する。SiglentのSDS2000X PlusとRigolのDS1054Zには専用の設定があり、ほかの機種でも範囲を切り取るモードで使える。作者の検証では、合成した正解データ7件で縦方向の誤差の中央値が0.24ピクセル、実効値の誤差の中央値が0.015%だった。Rigolの公開画像9件では、機器が出したCSVと比べた誤差の中央値が0.57ピクセルだった。手元で撮ったSiglentの28件と公開画像2件も、すべて一致したという。能動フィルタを10回の画像で測った例では、遮断周波数を990Hzと求め、利得の誤差の中央値は0.003dBだった。\n【ポイント・注意点】\n公開ページを開けばすぐに使え、解析の処理はブラウザのWeb Workerの中で動く。リリースのファイルからnpmでCLIを入れることもでき、開発にはNode 22以上が必要だ。作りはTypeScript、Vite、Reactによる。画像から読み取る以上、元の画像の質に精度が左右される点には注意したい。スターはまだ3と小さいプロジェクトだが、検証の数値を細かく公開している点は信頼の手がかりになる。","2026-11-24","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50623010"],["Budget：データを手元に置く家計予算アプリ","MacとWindowsで動く、無料でオープンソースの予算管理アプリ「Budget」がHacker NewsのShow HNで公開された。データはすべて自分のPCに保存し、Cookieも広告も料金もない。予算と支出を記録する簡単な方式と、残りの繰り越しや支出の分割、1年先の見通しまで扱う詳しい方式を選べる。作者は、メモリ8GBのMacBookでは編集に数分かかるほど重くなった表計算から乗り換えるために作ったという。","\n【概要】\nBudgetは、MacとWindowsで使える個人向けの予算管理アプリだ。データはPCの中だけに保存され、外部のサーバーには送られない。予算と支出を記録するだけの簡単な方式と、残った予算の繰り越し、複数の予算への支出の分割、大きな年払いを考えた1年先の見通しまで扱う詳しい方式がある。\n【背景】\n作者によると、もとは表計算で家計を管理していたが、メモリ8GBのMacBookでは編集に「数分」かかるほど重くなったという。そこで専用のアプリを作ることにした。作者はClaude Opus 5.5を使って開発し、いくつかの不具合や設計の判断は自分で直したと明かしている。投稿では、Cookieも広告も料金もなく、データを外部に保存しないことを売りにしている。書き出しと取り込み、バックアップの機能も備え、PCを替えても記録を引き継げる。\n【詳細】\n予算は分類と項目に分けて管理でき、1件の支出を分割したり、余りを翌月に繰り越したりできる。銀行の明細をCSVで取り込めるが、READMEでは対応しているのはオランダのINGだけとされている。CSVでの書き出し、履歴の表示、貯蓄の余裕を含めた12か月の見通し、毎日の自動バックアップ（直近14件を保存）を備える。表示は英語とオランダ語で、新しい版の確認のためにGitHubへ1日1回だけ接続する。それ以外の通信は書かれていない。\n【ポイント・注意点】\n中身はPythonの標準ライブラリとSQLite、JavaScriptの画面で、ブラウザでもデスクトップアプリとしても動く。MacはApple Silicon向け、Windowsは10と11の64ビット版向けの配布がある。どちらもコード署名がないため、起動時に警告が出る。ライセンスはGPL-3.0。作者は、足りない機能を教えてほしいと呼びかけている。開発する人は「python3 server.py」で起動し、「python3 -m unittest」で試験を実行できる。GitHubのスターは3、コミットは127件だ。","2026-11-23","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50619761"],["Console.tty：ブラウザの開発者コンソールが本物の端末に","ブラウザの開発者ツールのコンソールの中で、本物のターミナルを動かす実験的なツール「Console.tty」がHacker NewsのShow HNで紹介された。ブラウザ拡張と、セッションを管理するRust製の実行ファイルを組み合わせ、bash、zsh、fish、PowerShellなどのシェルをconsole.logの世界に持ち込む。作者は、数週間前に見かけた別の作品に刺激を受けて作った概念実証だと説明している。ライセンスはMIT。","\n【概要】\nConsole.ttyは、Chromeなどのブラウザの開発者コンソールの中に、実際に使えるターミナルを作る道具だ。Windows、Linux、macOSで動き、ブラウザ拡張と、セッションを管理するRust製の実行ファイルconsole-ttyの2つで構成される。Control-Shift-9を押すと、コンソールで入力を受け付けるようになる。\n【背景】\n作者のcpenderyはHNで、数週間前にtextjs.orgを見て、console.logの中で完全に動くターミナルを作りたくなったと書いている。そのうえで、今回の公開はあくまで概念実証だとしている。実用品というより、ブラウザのコンソールでどこまでできるかを試す遊び心のある作品だ。それでも、複数のシェルやセッションの管理まで備えており、作りは本格的だ。\n【詳細】\n使えるシェルは、bash、zsh、fish、nu、xonsh、sh、pwshのほか、Windowsではcmdとpowershell。コンソールでconsole.tty.pair()を呼び、端末側でconsole-tty pairにセッションのIDを渡して結び付ける。console.tty(\"SHELL\")でシェルを選んで起動する。設定の既定値は、描画が毎秒15コマ、スクロールして戻れる行が5,000行、画面が100列30行、同時に動かせるセッションが8つとなっている。これらの値は設定で変えられる。\n【ポイント・注意点】\nmacOSとLinuxはシェルスクリプト、WindowsはPowerShellのスクリプトで実行ファイルを導入する。拡張機能はストアからではなく、chrome://extensionsで手動で読み込み、その拡張のIDを使ってネイティブホストを登録する必要がある。ブラウザから手元のシェルを操作できるようになるため、どの拡張に権限を与えるかには注意したい。スターはまだ4、HNでは8ポイントだった。実用の道具というより、ブラウザの新しい使い方を見せる作品として楽しむのがよさそうだ。","2026-11-23","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50618858"],["Narayanastra：エージェント不要のLinuxルートキット検査","侵入された後のLinuxに潜むルートキットやバックドアを探す、Rust製のスキャナー「Narayanastra」がHacker NewsのShow HNで紹介された。常駐するエージェントなしで検査でき、/procやnetlink、bind()、bpf()、ディスクといった複数の視点から見た結果を突き合わせて、隠されたものを見つける。12のLinux向けモジュールを並列に動かし、結果にはMITRE ATT&CKの識別子が付く。ライセンスはMIT。","\n【概要】\nNarayanastraは、攻撃を受けた後のLinuxを調べ、ルートキットやバックドアを見つけるためのスキャナーだ。Rustで書かれ、musl向けに静的にビルドした約3.5MBのバイナリ1つで動く。調べたいマシンでsudoを付けて実行するだけでよく、検査のための常駐エージェントは要らない。\n【背景】\nルートキットは、psやssといった普段のコマンドに自分の存在が映らないよう細工をすることが多い。そのため、同じ情報を別々の経路で集めて食い違いを探す「クロスビュー」という考え方が有効になる。Narayanastraはこの手法を採り、psやss、findといった外部のコマンドを呼び出さずに、自分で情報を集めて比べる。HNでは5ポイントを集め、投稿のタイトルでもeBPFとio_uringを扱う点が強調されている。\n【詳細】\n/proc、netlink、bind()、bpf()、ディスクという複数の見え方を比べ、隠れたプロセスや通信、ファイルを探す。--fullを付けると、TCPとUDPの65,535個すべてのポートでbindを試す。マウントしたディスクをオフラインで調べることもでき、HMACで署名した基準の状態と比べられる。Linux向けに12のモジュールを並列で動かし、Windows向けにはPowerShellの7つの確認項目もある。報告はテキスト、JSON、NDJSON、SARIF、HTMLで出力でき、見つかった項目にはMITRE ATT&CKの識別子が付くので、攻撃の手口の分類と結び付けて読める。\n【ポイント・注意点】\n終了コードは、問題なしが0、警告が1、危険が2、検査が不完全なときが3と決まっているので、自動化の仕組みに組み込みやすい。リリースのバイナリを使うか、cargo build --releaseでビルドする。ただし性能や検出率の数値は示されておらず、コミットも7件と若いプロジェクトだ。本番環境で頼る前に、自分で確かめることが望ましい。ライセンスはMITで、スターは7。HNの投稿にはまだコメントが付いていない。","2026-11-23","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50618581"],["Arnold：PhonePeが公開した自前運用のAIコードレビュー基盤","PhonePeのGitHubで公開された、自分のサーバーで運用できるコードレビュー基盤「Arnold」がHacker NewsのShow HNで紹介された。GitLabとGitHubの両方に対応し、差分やディスカッション、下書きのレビュー、マージの待ち行列、レビューの統計をまとめた作業画面を備える。OpenAI互換のAPIを持つモデルなら何でも使え、AIが行ごとに修正案を書き込む。ライセンスはApache-2.0。","\n【概要】\nArnoldは、マージリクエストやプルリクエストのレビューを支える、自前で運用するプラットフォームだ。リポジトリはPhonePeのGitHubで公開されている。GitLabとGitHubの両方に対応し、差分の表示、ディスカッション、下書きのレビュー、マージの待ち行列、レビューの統計を1つの作業画面にまとめている。そこにAIによるレビューのワークフローが加わる。\n【背景】\nAIによるコードレビューのサービスは増えているが、社外にソースコードを送りたくない組織も多い。Arnoldは、自分たちのサーバーで動かし、使うモデルも選べる形を取った。OpenAI互換のAPIを持つモデルであれば接続でき、社内で動かすモデルと組み合わせることも考えられる。HNの投稿タイトルも、自前で運用できる点を最初に打ち出している。レビューの作業とAIの提案を1つの画面に集めることで、GitLabとGitHubを行き来する手間を減らす狙いがある。\n【詳細】\nAIのワークフローは、レビュー結果を該当する行への提案として書き込む。リポジトリはバックエンド、処理を実行するランナー、画面、配備用の設定に分かれている。データの保存にはAerospikeを使い、Elasticsearchは任意で加えられる。git cloneのあと、配備用の.env.exampleを.envにコピーし、docker compose upを実行すると、localhostの3000番ポートで画面が開く。署名付きのコンテナイメージがv1.0.0としてghcr.ioで公開されている。\n【ポイント・注意点】\nREADMEは、手早く起動する手順の設定のままでは外部に公開しないよう注意を促している。実際に使う場合は、認証や通信の設定を見直す必要がある。性能や精度の数値は示されていない。HNでの反応はまだ小さく、1ポイントにとどまった。今後の評価が待たれる。スター34、フォーク5、コミット501件と、開発の積み重ねは多い。ライセンスはApache-2.0。","2026-11-23","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50616293"],["Claimseed：ソフトの試験用に架空の医療費請求書を作る","米国の医療費の請求書や保険の給付説明書を、本物らしく見える架空の書類として作るツール「Claimseed」がHacker NewsのShow HNで公開された。スキャン、ファクス、写真、デジタルといった見た目の違いまで再現したPDFを、正解データ付きで出力する。医療費請求を扱うサービスの試験用データを探す中で生まれたという。約2,000件の試験用の書類があり、必要なだけ追加で作れる。","\n【概要】\nClaimseedは、米国の医療費の請求書や、保険会社が送る給付の説明書（EOB）を、架空の内容で作るツールだ。メディケアや会社の健康保険の書類を、スキャンしたもの、ファクスで届いたもの、スマホで撮ったもの、デジタルのものといった形で出力する。どの書類にも、何が書かれているかを示す正解データが付く。\n【背景】\n投稿者によると、医療費請求のプラットフォームBarleyのために試験用の書類を探していたことがきっかけだった。本物の医療費の書類には個人の健康情報が含まれるため、ソフトの開発や試験には使いにくい。架空でも本物に近い書類があれば、読み取りや誤りの検出を安全に試せる。しかも正解データが付いているので、ソフトがどこを読み違えたのかを自動で確かめられる。投稿者は、無料でオープンソースとして公開し、GitHubからもMCP経由でも使えると説明している。\n【詳細】\n用意された試験用の書類は、45の場面にわたる1,887件で、ほかに1,124件の835形式の送金データがある。約3.4MBのサンプルと、約455MBの標準セットが配られている。投稿者のコメントでは、Node.js 22.13以上とChromeがあれば、npxで1行のコマンドを実行して、3つの誤りを含む書類を作ってみられると紹介している。MCPサーバーの@claimseed/mcpとしても使え、Dockerイメージも用意されている。ライブラリとしてnpm installで自分のプロジェクトに組み込むこともできる。\n【ポイント・注意点】\nコードのライセンスはApache-2.0で、作られた書類と正解データはCC0 1.0として自由に使える。AIで書類を読み取る仕組みの評価や、請求の誤りを見つける機能の試験に向いている。ただし対象は米国の医療制度の書類なので、ほかの国の書類にそのまま当てはまるわけではない。リポジトリのスターは5、コミットは13件と、まだ始まったばかりだ。HNでは2ポイントで、投稿者自身が使い方を説明するコメントを添えている。","2026-11-23","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50615891"],["x2c：20年かけて作り続けたC言語の拡張言語","C言語に便利な機能を足した言語「x2c」が、作者が20年以上かけて1人で作り続けてきたものとしてHacker NewsのShow HNで公開された。コレクション、動的な値、パターンマッチ、範囲を限ったメモリ確保、例外、スレッド、コンパイル時のマクロを加え、Cのコードに変換して動かす。コンパイラーと実行環境はx2c自身で書かれている。コミットは8,142件に及び、ライセンスはApache-2.0。","\n【概要】\nx2cは、C言語を土台に多くの機能を足した言語と、そのコンパイラーおよび実行環境だ。書いたプログラムはC言語に変換され、普通のCコンパイラーで動く。作者のgwfは、20年以上続けてきた個人の趣味のプロジェクトを、思い切って公開することにしたと書いている。\n【背景】\nC言語は速くてどこでも動く一方、配列や辞書のような便利なデータ構造、例外処理、安全なメモリの扱いは自分で用意する必要がある。x2cは、Cとの互換を保ちながら、こうした機能を言語に組み込もうとしている。投稿では、ブラウザで例を動かせるページと、開発の経緯を書いたページを案内している。長年1人で育ててきた言語が、ようやく外の目に触れる形になった。インストールしなくても、まずはブラウザの例で書き味を確かめられる。\n【詳細】\n加えた機能は、コレクション、動的な値、パターンマッチ、範囲を限ったメモリ確保、例外、スレッド、コンパイル時のマクロだ。コンパイラーと実行環境はx2c自身で書かれていて、最初に動かすためのCのコードもリポジトリに入れてある。インストール用のスクリプトで導入し、「x2c run -q hello.x」のように実行する。ソースからはmake build-safeでビルドできる。プログラムの速さを比べる「Benchmarks Game」の課題もそろえてあるが、READMEには数値は載っていない。自分自身をコンパイルできるところまで育っていることは、言語としての完成度を示す1つの目安になる。\n【ポイント・注意点】\n対応するのはmacOS 15以上、glibc 2.38以上のLinux、WindowsではWSL2で、ccコマンドで呼べるCコンパイラーが必要だ。READMEでは「実験的」とされており、仕事で使うには早い。それでもコミット8,142件という積み重ねは目を引く。作者は投稿の最後を、駄じゃれについての冗談で締めくくっている。GitHubのスターは9、フォークは1で、HNでは3ポイントだった。長い歴史に比べて、知られるのはこれからという段階だ。","2026-11-23","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50614307"]],"gh-blog":[["Copilot Fusionの実行方式とeffortをQiitaで整理","Qiitaで、GitHub Copilotがタスクごとにモデルと実行パターンを選ぶ「Copilot Fusion」を整理した記事が公開された。Single・Cascade・Critiqueの3つの実行方式と、Standard・High・Maxのeffortの違いを、公式のChangelogとDocsを引きながら解説している。11月17日の更新で各effortに追加されたモデルや、管理者ポリシーで選択肢が表示されない場合の注意点にも触れている。","\n【概要】\nQiitaで、GitHub Copilotの「Copilot Fusion」の実行方式・effort・最新の対応状況を整理した記事が2026年11月24日に公開された。Fusionは1つのモデルに固定せず、タスクごとにモデルと実行パターンを選ぶ仕組みだと説明している。\n【背景】\n記事は2026年11月17日のChangelogを引用し、最新のGitHub.com、Visual Studio、GitHub MobileのiOS/Androidベータで利用できるようになったと紹介している。モバイル版の一般提供については「近日」とされていたという。モデルの選択肢が増える中で、どのモデルを使うかをCopilotに任せる考え方が注目されている。\n【詳細】\nGitHub Docsを引用して、3つの実行方式が紹介されている。Singleは1つのモデルがタスクを最後まで処理する。Cascadeは効率のよいモデルが下書きを作り、評価役が採用するか上位に回すかを決める。Critiqueは複数のモデルが下書きを並行して批評し、元のモデルが修正する。effortはFusion Standard（コスト・品質・待ち時間のバランス）、Fusion High（範囲がはっきりした大きめの変更）、Fusion Max（より深い推論）の3段階に分かれる。Fusion Fastはユーザーが選ぶものではなく、VS Codeのインラインチャットで使われるという。11月17日の追加分として、StandardにMAI-Code-2、HighにGPT-6.1 Terra、MaxにClaude Sonnet 5.5が挙げられている。ただしこれは追加分で、モデル一覧のすべてではないと記事は断っている。\n【ポイント・注意点】\nチェック工程が増える方式は、そのぶん時間とAIクレジットを多く使う。ChangelogにはTerminal-Bench 4.1の結果が載っているが、筆者は再現していない。Fusion Maxが表示されない場合は、ポリシーで一部のモデルが無効になっている可能性があるという。また、Fusionに独自の無制限のコンテキストウィンドウがあるわけではないとしている。記事はテスト用リポジトリでバグ修正のプロンプトを試す評価手順を提案しているが、測定結果はまだ載っていない。","2026-11-24","Qiita","https://qiita.com/phamxuanquyen22/items/65325031598edd51f4aa"],["GitHubのtopicで2年間の開発トレンドを集計","Qiitaで、GitHubリポジトリのtopicを2年分数えて開発トレンドを振り返る記事が公開された。GraphQL検索で、スター50以上の公開リポジトリを1日ずつ集め、スパムを取り除いたうえで四半期ごとに集計している。2026年1〜3月はclaude-code、7〜9月はai-agentsが1位で、MCPやAgent Skills、OpenClaw関連のtopicが順に伸びた様子がわかる。スターの数だけではスパムを防げなかったという結論も興味深い。","\n【概要】\nQiitaで「【2026年版】GitHub の topic で 2 年間の開発トレンドを振り返ってみた」が2026年11月24日に公開された。2024年10月から2026年9月までに作られた公開リポジトリのtopicを数え、AIや開発のトレンドの移り変わりを調べている。\n【背景】\nリポジトリに付けるtopicは、開発者が何を作っているかを表す手がかりになる。ただ、検索結果には1回あたり1,000件の上限があり、スパムのリポジトリも多い。筆者はこれらの問題を処理しながら、2年分の推移を集計した。\n【詳細】\nGitHub GraphQLの検索で、created:とstars:>=50の条件を付け、日本時間の1日単位で取得した。結果が1,000件の上限に届いた日は半分に分けて取り直している。topicは、四半期に50件以上のリポジトリと30以上のオーナーが使ったものだけを数えた。hacktoberfestなどのイベント系topicは除外している。スパム対策では、1日に1つのtopicで40件を超え、そのtopicの2年分の合計の25%以上を占める場合を除外した。6日分で2,256件を取り除き、2026年9月29日だけで712件あったという。集計対象は2025年の各四半期で約1.15万〜1.29万件、2026年1〜3月は21,423件だった。topicを付けたリポジトリの割合は42%から48%に増えた。1位のtopicは2025年がai、2026年1〜3月がclaude-code（1,552件）、7〜9月がai-agents（1,025件）。言語は毎期Pythonが1位、TypeScriptが2位だった。\n【ポイント・注意点】\n伸びたtopicは時期ごとに、MCP、コーディングエージェントとCLI、Agent Skills、OpenClaw関連（openclawは579件で約22倍）、deepseek-harnessと移り変わっている。一方で、最新の四半期はまだスターが集まりきっていないので少なく出る、と筆者は注意している。スターの数で絞り込むだけではスパムを防げなかった、という点も、GitHubのデータを分析する人には参考になる。","2026-11-24","Qiita","https://qiita.com/tsubasa_k0814/items/5fd850d47087c3575713"],["JiraのチケットからClaude Codeにリポジトリを調査させる","Qiitaで、運用担当がJiraに書いた「仕様か不具合か」という質問を、GitHub Actions上のClaude Codeに調べさせる仕組みが紹介された。Jira Automationからn8nを通してrepository_dispatchでワークフローを起動し、調査結果をJiraのコメントに書き戻す。GitHub Appの短期トークンを使う認証や、チケット本文の指示に従わせないプロンプトの書き方など、実際に運用するための工夫が具体的に説明されている。","\n【概要】\n株式会社viviONの筆者が、JiraのチケットからClaude Codeにリポジトリを調べさせる仕組みをQiitaで紹介した。公開日は2026年11月24日。運用担当がJiraに書いた質問を、GitHub Actions上で動くClaude Codeが調べ、結果をJiraのコメントとして返す。\n【背景】\n運用担当からは「これは仕様か、それとも不具合か」という質問がJiraで届く。答えるたびにエンジニアは作業を止める必要があった。運用担当はGitHubにアクセスできないため、自分でコードを確認することもできなかった。\n【詳細】\n処理の流れは、Jira Automation（手動実行の送信ルールと、受信用Webhookのルール）からn8nを通ってGitHub Actionsへ進み、結果がJiraのコメントに戻るというもの。n8nは個人用アクセストークン（PAT）ではなく、GitHub Appの秘密鍵でJWTに署名して取得する短期トークンを使う。ワークフローはrepository_dispatchのjira-investigateタイプで起動し、client_payloadでチケットのキー、要約、説明、プロンプトを渡す。プロンプトでは、チケット本文はデータとして扱い、そこに書かれた指示には従わないよう定めている。そのうえで不具合とコードを照らし合わせ、エスカレーションが必要かを判断させ、結果をJiraのWiki記法でresult.txtに書かせる。結果は「仕様どおりの動作」「不具合の可能性が高い」「追加調査が必要」の3つの判定に分け、運用向けの回避策と、エンジニア向けの技術的な説明に分けて書く形式にした。\n【ポイント・注意点】\n結果の質はチケットの書き方しだいだという。JiraのコメントはMarkdownではなくWiki記法で書く必要があり、日本語の横で強調記号を効かせるには空白が要る、といった細かい注意点もある。複数行の値は.jsonEncodeで渡している。筆者はその後、この仕組みをSlackベースの別の方法に置き換えた。ただ、利用者からは、エンジニアを待たずに運用担当が回答できるようになったという声があったという（効果は定性的な報告のみ）。","2026-11-24","Qiita","https://qiita.com/jk_vivion/items/79aa91bfb1c3036fbf81"],["GitHub Actionsのnpmキャッシュ活用でCIを短縮","Qiitaで、GitHub Actionsで依存パッケージのキャッシュを使い、CIの時間を短くする方法を紹介する記事が公開された。actions/setup-nodeのcache指定と、actions/cacheでpnpmストアを保存する設定例を載せ、npmの場合の書き方も示している。筆者の環境ではpnpm installが約2分から約1分になったという。ただし測定方法の説明はなく、2つのキャッシュ設定の重なりにも触れていないため、自分の環境で確かめたい。","\n【概要】\nQiitaで「GitHub Actions で npm キャッシュ活用！CI を 30% 短縮するシンプルテクニック」が2026年11月24日に公開された。CIのたびに依存パッケージを取り直す無駄を、キャッシュで減らす方法を紹介している。\n【背景】\nCIでnpm installやpnpm installを実行すると、毎回パッケージをダウンロードするため数分かかることがある。プルリクエストのたびに待たされると、開発のテンポが落ちる。GitHub Actionsにはキャッシュの仕組みがあり、うまく使えばこの時間を減らせる。\n【詳細】\npnpmの例では、actions/checkout@v4のあとにactions/setup-node@v4を置き、node-versionを20、cacheをpnpmに指定している。さらにactions/cache@v4で~/.pnpm-storeを保存する。キーはランナーのOS名とpnpm-lock.yamlのハッシュを組み合わせ、restore-keysにOS名とpnpmの接頭辞を指定する。依存のインストールはpnpm install --frozen-lockfileで行い、続けてpnpm testを実行する。npmの場合は、保存先を~/.npmに、キーのハッシュ元をpackage-lock.jsonにする。setup-nodeのcache: 'npm'は任意だとしている。ロックファイルのハッシュをキーにするので、依存が変わったときだけキャッシュが作り直される。\n【ポイント・注意点】\n筆者によると、pnpm installは約2分から約1分になり（30〜50%の短縮）、2回目の実行ではほぼゼロになる場合もあるという。ただし、これは筆者自身の数字で、測り方は書かれていない。また、setup-nodeに組み込まれたpnpmのキャッシュと、actions/cacheによる同じパスのキャッシュが重なる点についても説明がない。実際に使うときは、どちらか一方で足りるかを確かめ、自分のリポジトリで実行時間を比べてから取り入れるとよい。記事の最後には有料のPDFガイドへのリンクがある。","2026-11-24","Qiita","https://qiita.com/felix-jp-studio/items/d336aef4157bce8423a2"],["SAMのOIDC連携が失敗する原因は不変subクレーム","dev.toで、AWS SAMのパイプラインがGitHub ActionsのOIDC認証で失敗する原因を解説する記事が公開された。記事によると、2026年7月15日以降に作られたリポジトリは、オーナーIDとリポジトリIDを含む不変形式のsubクレームを発行する。一方、SAM CLIは古い名前だけの形式で信頼ポリシーを作るため一致しない。JWTを確かめる手順や、信頼ポリシーの直し方、再実行で上書きされる落とし穴まで説明している。","\n【概要】\ndev.toのAWS Community Buildersで、Seth David Gyimah氏が「The Silent Handshake Failure」を2026年11月24日に公開した。AWS SAMのパイプラインとGitHub ActionsのOIDC連携が、エラーの理由がわかりにくい形で失敗する問題を扱っている。\n【背景】\n失敗したワークフローでは、AWS認証情報を設定するステップで「Not authorized to perform sts:AssumeRoleWithWebIdentity」と表示される。記事によると、2026年7月15日以降に作られたGitHubのリポジトリは、subクレームを「repo:OWNER@OWNER_ID/REPO@REPO_ID:ref:refs/heads/BRANCH」という不変の形式で発行する。\n【詳細】\n記事は、SAM CLIのget_subject_claimが「repo:{org}/{repo}:ref:refs/heads/{branch}」という古い名前だけの形式を作ると指摘する。そのため、信頼ポリシーと実際のトークンがいつまでも一致しない。関連するSAM CLIのissue #4606は執筆時点でまだ開いていて、SAMを更新しても生成される形式は変わらないという。原因を確かめる方法として、ワークフローにOIDCのJWTをデコードしてsub、aud、repositoryを表示するステップを足す手順を紹介している。実際のsubにはIDの部分が含まれていることがわかる。直し方は、信頼ポリシーのsubを不変形式の値に書き換え、aws iam update-assume-role-policyで反映するというもの。オーナーとリポジトリの数値IDをcurlで調べるコマンドも載っている。\n【ポイント・注意点】\nsam pipeline bootstrapをもう一度実行すると、信頼ポリシーが古い形式で上書きされてしまう。また、すべてのロールとアカウントで同じ修正が必要になる。記事はワイルドカードを使わず、数値IDを固定して指定するよう勧めている。リポジトリのOIDCカスタマイズAPIで古い形式に戻すこともできるが、それは勧めないとしている。","2026-11-24","dev.to","https://dev.to/aws-builders/-the-silent-handshake-failure-sam-pipelines-vs-githubs-immutable-oidc-subject-claims-3k73"],["Actionsの請求が増えた原因をジョブ単位で探る","dev.toで、GitHub Actionsの請求額が急に増えたとき、ワークフロー単位の合計だけでは原因がわからないと指摘する記事が公開された。リポジトリ、ワークフロー、ジョブID、ランナーの料金区分を組み合わせた「Job Group」で費用を見る考え方を示し、読み取り専用ツールActions Cost Guardを紹介している。macOSやWindowsのジョブ、再実行の割合など、確認すべき3つのサインも挙げている。","\n【概要】\ndev.toで「Why Your GitHub Actions Bill Jumped (And Why Workflow Totals Hide the Cause)」が2026年11月24日に公開された。GitHub Actionsの請求額が増えたとき、どのジョブが原因なのかを突き止める方法を説明している。\n【背景】\n記事によると、請求画面には合計額しか出ず、Actionsタブには実行の一覧しか表示されない。どちらを見ても、どのワークフローのどのジョブが時間を使ったのかはわからない。1つのci.ymlの中に、安いUbuntuのジョブと高いmacOSやWindowsのジョブが混ざっていることもある。\n【詳細】\n記事は、リポジトリ、ワークフローファイル、ジョブID、ランナーの料金区分を組み合わせた単位を「Job Group」と呼び、この単位で費用を見ることを提案する。そのうえで、読み取り専用のツールActions Cost Guard（cost-guard.xyz）を紹介している。無料の公開スキャンでは、直近30日分の公開メタデータから最大5つのJob Groupを調べられる。非公開リポジトリは無料で1つまで使え、Proプランは月9ドルで10リポジトリまで対応し、週ごとの要約と異常の通知が付く。GitHub Appが読むのはリポジトリ、ワークフロー、実行、ジョブのメタデータと.github/workflowsのファイルだけで、ソースコード、Secrets、ログ全体、コミットの差分は読まないとしている。\n【ポイント・注意点】\n確認すべきサインとして、7日間の費用が普段より増えていること、高いmacOSやWindowsのジョブの割合、再実行にかかった費用の割合の3つを挙げている。表示される金額は「推定」で、無料枠は差し引かれていない。公開リポジトリでGitHubホストのランナーを使う場合は、普通は料金がかからないという。セルフホストランナーの費用や、GitLab CIなど他のCIには対応していない。紹介記事はツールの宣伝も兼ねているため、考え方を参考にしつつ、必要かどうかは自分で判断したい。","2026-11-24","dev.to","https://dev.to/senflyboy/why-your-github-actions-bill-jumped-and-why-workflow-totals-hide-the-cause-27pm"],["Actionsは不正なYAMLも通す、lintでも見逃し","dev.toで、GitHub Actionsが仕様上は不正なYAMLを警告なしで実行してしまう問題を紹介する記事が公開された。複数行の値の閉じ記号が、スペース1つ分インデントが足りないだけのケースで、ランナーが使うYamlDotNet 5.3.0はこれを受け入れる。actionlint 1.7.12とyamllint 1.38.0も検出できないという。キーの重複の扱いの違いや、ブロックスカラーで回避する方法もまとめている。","\n【概要】\ndev.toで、Alan West氏の「GitHub Actions Accepts Invalid YAML. actionlint and yamllint Don't Catch It」が2026年11月24日に公開された。GitHub Actionsが仕様上は不正なYAMLを、警告を出さずに実行してしまう問題を取り上げている。\n【背景】\n例として挙げているのは、jsdaniell/create-jsonのステップで、json:に複数行のシングルクォート文字列を書いたケースだ。閉じる}'がjson:と同じ列にあり、スペースが1つ足りない。記事はYAML 1.2.2の8.2.3節を引き、フローノードは親のブロックより1つ以上深くインデントする必要があると説明する。この話は、William Woodruff氏が2026年11月22日に書いたTILと、2025年8月に報告されたzizmorのissue #1116がもとになっている。\n【詳細】\n記事によると、GitHubのランナーはYamlDotNet 5.3.0に固定されていて、この入力を受け入れる。PyYAMLとgo-yaml v4も受け入れ、tree-sitter-yamlは拒否する。そしてactionlint 1.7.12とyamllint 1.38.0は、どちらもこの入力を通してしまう。キーの重複については、ランナーは大文字と小文字を区別せずに重複とみなして拒否する。たとえばversion_nameとVERSION_NAMEはぶつかる。この場合、key-duplicatesを有効にしたyamllint 1.38.0は通したが、actionlintは指摘した。また、${{ }}の式を含むキーは、読み込みの時点では比べられないという。\n【ポイント・注意点】\n記事は、actionlint、yamllint、zizmorを組み合わせて使うよう勧め、.yamllintの設定例とpre-commitの設定例を載せている。回避策としては、JSONの入力を|のブロックスカラーで書けば、このインデントの落とし穴を避けられる。筆者は、GitHubがこの挙動を変えることはないだろうと見ている。ワークフローの書き方次第で、意図と違う値が渡っても気づけない恐れがあるので、複数行の値は書き方をそろえておきたい。","2026-11-24","dev.to","https://dev.to/alanwest/github-actions-accepts-invalid-yaml-actionlint-and-yamllint-dont-catch-it-64g"],["エージェントの変更とテスト漏れを図にするGenesis Map","Hacker NewsのShow HNで、コーディングエージェントが加えた変更のうち、テストされていない部分やリスクのある部分を可視化するGenesis Mapが紹介された。Claude CodeとCodexで使えるローカルのCLIとスキルで、コードベースを業務フローの図にして、変更点ごとにテストの有無を判定する。CLI自体はモデルを呼ばず、外部にも何も送らないという。READMEには小規模なベンチマーク結果も載っている。","\n【概要】\nHacker NewsのShow HNに「Genesis Map – Visualize your agent's changes. See where they can break」が2026年11月24日に投稿された。リンク先はGitHubのGenesisAgentInfra/genesisで、コーディングエージェントの変更のうち、テストされていない部分やリスクのある部分を見つけるためのツールだ。\n【背景】\nClaude CodeやCodexのようなエージェントは大量の変更を素早く作る。その一方で、どの変更がテストで守られているのかを人が確かめるのは大変だ。Genesis Mapは、コードベースを業務の流れの図にし、変更がどこに影響するかを見えるようにする。\n【詳細】\nClaude CodeとCodexで使えるローカルのCLIとスキルで、「/genesis map」と「/genesis review main」の2つのコマンドがある。mapはシステムの図を描き、reviewは指定したリビジョンからの変更と、それをテストが確かめているかを示す。判定には「Behavior checked」「No coverage found」「Behavior not checked」「Coverage unclear」などがある。信頼性を保つため、エージェントは各ステップの根拠となるコードを引用しなければならず、CLIがその引用をリポジトリのスナップショットと照らし合わせる。READMEによると、CLIはモデルを呼ばず、どこにも何も送らず、コードを実行することもない。Pythonはコードを解析するので最も正確で、他の言語はエージェントの読み取りに頼る。\n【ポイント・注意点】\nREADMEのベンチマークでは、5つのオープンソースのPythonプロジェクトから10のコミットを選び、エージェントごとに3回ずつ答えさせた。見つかったテストの漏れは、Claude Codeで8%から38%、Codexで4%から23%に増えた。1回のレビューあたりの誤検知は2.1から0.7、1.4から0.5に減った。ただし、サンプルが少なく、採点に言語モデルを使ったことはREADMEでも断っている。ライセンスはApache-2.0。HNでの反応はまだ小さい。","2026-11-24","Hacker News","https://news.ycombinator.com/item?id=50623965"],["ProtonをApple Silicon向けに移植したProtium","Hacker Newsで、ValveのProtonをApple SiliconのmacOSで直接動くように移植したProtiumが紹介された。arm64向けにビルドしたWineの中でFEXがゲームのx86コードを動かし、Direct3DをMetalに変換する。RosettaもVMも使わないのが特徴だ。必要なのはmacOS 27とApple SiliconのMacで、動作確認済みのゲームと、まだ動かない機能を一覧にしている。","\n【概要】\nHacker Newsに「Protium – Valve's Proton Ported Natively to Apple Silicon macOS」が2026年11月24日に投稿された。リンク先はGitHubの0xLeathery/protiumで、Apple SiliconのMacでSteam Playを動かすためのプロジェクトだ。説明文には、Proton 11をarm64のWine、FEX、Metalで動かし、RosettaもVMも使わないとある。\n【背景】\nProtonはValveが作った互換レイヤーで、Windows向けのゲームを他のOSで動かすために使われる。Apple SiliconのMacでWindowsのゲームを動かすには、命令セットの変換やグラフィックAPIの変換が必要になる。Protiumはこれらを組み合わせ、macOS上で直接動かすことを目指している。\n【詳細】\nWineはarm64のmacOSプログラムとしてビルドされ、Wineの中のFEXがゲームのx86コードを実行する。Direct3Dは、D3D9をmtld3d、D3D10と11をDXMT、D3D12をVulkan上のvkd3d-protonで変換し、MesaのMetal向けVulkanドライバーKosmicKrispがVulkanを提供する。必要な環境はmacOS 27、Apple SiliconのMac、Mac版Steamだ。READMEによると、ビルドとテストはmacOS 27.2のM4 Pro搭載機1台でしか行っていない。動作表では、Call of Duty: Modern Warfare Remasteredが「動作する」、Red Dead Redemption 2が「問題はあるがプレイできる」、GTFOが「起動するがその先は未確認」となっている。\n【ポイント・注意点】\nSteamのオーバーレイ、OpenGL 2.1より新しいバージョン、.NET、埋め込みのWebビューはまだ使えない。カーネルレベルのアンチチートを使うゲームは動かない見込みだという。Protium独自のファイルはGPL-3.0以降、Valve由来のファイルはValveのライセンスのままだ。更新確認のため1日1回GitHubのリリースAPIにアクセスするが、これは無効にできる。","2026-11-24","Hacker News","https://news.ycombinator.com/item?id=50624271"],["Issueにステータスとボード表示、公開プレビュー","GitHubは、Issueにステータスを設定する機能と、リポジトリのボード表示を公開プレビューとして提供し始めた。Backlog、Todo、In progressなど7つのステータスがあり、ドラフトのプルリクエストを関連付けるとIn progressに移るなどの自動化も用意されている。保存したビューでボードのレイアウトを選べるようになり、どのタイプのIssueにも任意のフィールドを追加できるようになった。","\n【概要】\nGitHubは2026年11月23日、Issueのステータス機能とリポジトリのボード表示を公開プレビューとして発表した。Issueの進み具合を、GitHub Projectsを使わなくてもリポジトリの中で管理しやすくなる。\n【背景】\nこれまでIssueの状態は、基本的に開いているか閉じているかしかなかった。作業の段階を細かく管理したい場合は、GitHub Projectsを使うのが一般的だった。今回の機能で、Issueそのものに段階を持たせられるようになる。\n【詳細】\nステータスはBacklog、Todo、In progress、In review、Done、Not planned、Duplicateの7つ。Issueを作るときやIssueのヘッダーから設定でき、Issueのアイコン、Issueの一覧、ダッシュボード、ボードに表示される。ボードではstatus:フィルターが使える。自動化も用意されていて、ドラフトのプルリクエストを関連付けるとIn progressに、レビュー可能にするか開いたプルリクエストを関連付けるとIn reviewに移る。ユーザーを割り当てるとTodoに、エージェントを割り当てるとIn progressになる。GitHub Projectに同じ名前のステータスの値があれば、片方を変えるともう片方も変わる。GraphQL、REST API、MCPサーバーでも、ステータスの読み取り、設定、作成時の初期値の指定ができる。ステータスの変更は、Copilotの自動化のトリガーにもなる。リポジトリの保存済みビューではボードのレイアウトが選べるようになり、ステータスでグループ化してカードをドラッグで動かせる。列、スイムレーン、表示するフィールド、並び順も設定できる。\n【ポイント・注意点】\nIssueのフィールドは、タイプに関係なくどのIssueにも追加できるようになった。サイドバーのフィールド欄にある歯車のメニューから追加する。ただし、既定で表示されるのは、そのタイプに固定されたフィールドだけだ。これまでは、タイプに関係なく追加できるのはPriorityだけだった。今回は公開プレビューで、提供対象のプランなどは発表に書かれていない。フィードバックはコミュニティのディスカッションで受け付けている。","2026-11-23","GitHub Changelog","https://github.blog/changelog/2026-11-23-issue-statuses-and-repository-boards-are-in-public-preview"],["利用レポートに12月1日からuser_id列を追加","GitHubは、2026年12月1日から利用レポートにuser_id列を追加すると発表した。username列のあるレポートでは、その直後にuser_id列が入り、後ろの列がすべて1つずつ右にずれる。詳細レポート、AI利用レポート、プレミアムリクエストのレポートが対象で、REST APIでの出力も含む。列の位置でデータを読むスクリプトは、12月1日までに見出し名で読む方式に直す必要がある。","\n【概要】\nGitHubは2026年11月23日、利用レポートに2026年12月1日からuser_id列を追加すると発表した。username列があるレポートでは、その直後にuser_id列が入る。その後ろの列は、すべて1つずつ右にずれる。\n【背景】\nこれまでの利用レポートでは、削除されたアカウントの利用はusernameが空欄になっていた。また、ユーザー名を変えると、同じ人の利用を続けて追うのが難しかった。数値のIDを持たせることで、こうした問題を解決する。\n【詳細】\n対象は詳細な利用レポート、AI利用レポート、プレミアムリクエストの利用レポートで、GitHub REST APIによる出力も含まれる。集計済みの利用レポートは変わらない。GitHub Enterprise Cloudのすべてのアカウントの種類と、GitHub Teamの単独の組織が対象だ。user_idには、利用が発生したアカウントのIDが入る。ボットのアカウントも含まれ、アカウントに結びつかない利用の場合は空欄になる。使い道として、削除されたアカウントの利用を見分けること、ユーザー名が変わった後も同じユーザーの利用を追うこと、行を監査ログのイベントと照らし合わせることが挙げられている。\n【ポイント・注意点】\nいちばん大事なのは、列の位置でレポートを読んでいるスクリプトへの影響だ。12月1日より前に、見出しの名前で列を読む方式に直す必要がある。また、削除された別々のアカウントの利用は、これまでのように1行にまとめられず、別々の行に出るようになる。金額の計算方法は変わらないが、行ごとに丸めるため、合計の小数点以下の最後の桁が少し変わることがある。請求データを社内のシステムに取り込んでいる組織は、取り込み処理と合計の照合方法を早めに確かめておきたい。特に、列の番号を決め打ちにした表計算のマクロや集計用のSQLは、エラーを出さないまま別の列の値を読んでしまうおそれがあるので注意が必要だ。詳しい項目の説明は、課金ドキュメントの「Usage report fields」にある。","2026-11-23","GitHub Changelog","https://github.blog/changelog/2026-11-23-usage-reports-will-include-a-user-id-column-starting-december-1"],["SlackのWebhook URLの誤検知を秘密情報スキャンで削減","GitHubは、秘密情報スキャン（secret scanning）でSlackの秘密情報の誤検知を減らしたと発表した。対象はslack_incoming_webhook_urlの検出器で、SlackのIncoming Webhookの形式に合わないURLは検出の対象から外れる。誤ったアラートが減ることで、本当に漏れた秘密情報への対応に集中しやすくなる。設定の変更は必要なく、詳しくは秘密情報スキャンのドキュメントと対応パターンの一覧で確認できる。","\n【概要】\nGitHubは2026年11月23日、秘密情報スキャン（secret scanning）でSlackの秘密情報に関する誤検知を減らしたと発表した。改善の対象は、slack_incoming_webhook_urlという検出器だ。\n【背景】\n秘密情報スキャンは、リポジトリにAPIキーやトークンなどの秘密情報が含まれていないかを調べ、見つかるとアラートを出す機能だ。SlackのIncoming Webhook URLは、それを知っている人なら誰でもチャンネルにメッセージを送れるため、漏れると問題になる。一方で、Webhookに似ているだけのURLまで検出されると、アラートが増えて、確認する人の負担が大きくなる。誤検知が多いと、本当に重要なアラートが埋もれてしまうおそれもある。\n【詳細】\n今回の変更で、SlackのIncoming Webhookの形式を使っていないURLは、検出の対象から外れるようになった。つまり、Slackのドメインに関係するURLでも、Webhookの形式に合わなければアラートを出さない。発表は短く、具体的な削減の件数や、提供対象のプランについての記載はない。参考として、秘密情報スキャンのドキュメントと、対応している秘密情報のパターンの一覧へのリンクが付いている。意見はコミュニティのディスカッションで受け付けている。\n【ポイント・注意点】\n利用者が設定を変える必要は、発表を見る限りない。誤検知が減れば、セキュリティ担当者は本当に漏れた秘密情報の確認と無効化に時間を使える。ただし、検出が絞られるということは、形式が違うURLはアラートの対象にならないということでもある。Webhook以外の形でSlackの認証情報を扱っている場合は、対応パターンの一覧で、どの検出器が何を対象にしているかを確かめておくとよい。また、秘密情報スキャンはあくまで安全網の1つであり、すべての漏えいを防げるわけではない。秘密情報をそもそもリポジトリに入れない運用と組み合わせることが大切だ。","2026-11-23","GitHub Changelog","https://github.blog/changelog/2026-11-23-secret-scanning-reduces-false-positives-for-slack"],["ZedのUIフレームワークGPUIが独立リポジトリに","Hacker Newsで、Zedのエディタを支えるRust製UIフレームワークGPUIが、独立したGitHubリポジトリを持つことになったという話題が341ポイントを集めた。リポジトリには説明文と「See you in a few weeks.」という一文しかないが、すでに1,300以上のスターが付いている。コメントでは、これは公式発表ではないという指摘や、アクセシビリティをめぐる議論が交わされた。","\n【概要】\nHacker Newsに「GPUI is getting its own repository」が2026年11月23日に投稿され、341ポイントと117件のコメントを集めた。リンク先はGitHubのzed-industries/gpuiで、エディタのZedを作るZed Industriesが用意したリポジトリだ。\n【背景】\nGPUIは、Zedのエディタで使われているRust製のUIフレームワークだ。リポジトリの説明文では「GPUで高速化された、オープンソースのRust向けUIフレームワークで、イミディエイトモードとリテインドモードを組み合わせたもの」とされている。これまではZedのリポジトリの一部だったため、独立したリポジトリができたことで、単体のフレームワークとして使いやすくなるのではと注目された。\n【詳細】\n取得した時点で、リポジトリのREADMEには「See you in a few weeks.」と書かれているだけで、コミットも1つしかなかった。それでもスターは1,300、フォークは13あった。Webサイトとしてgpui.rsが示され、crates.ioにも登録されている。topicにはクロスプラットフォーム、デスクトップ、GPU、モバイル、Rust、Webなどが並ぶ。ライセンスはページ上に表示されていなかった。機能や設計については、説明文以上の情報はまだない。\n【ポイント・注意点】\nHNのコメントでは、リポジトリにはまだ中身がなく、Zedが発表したのではなく第三者がリポジトリの作成に気づいて投稿したものだ、という指摘があった。また、よく知られたGPUIのコンポーネントライブラリは、GPUIの作者ではなくLongbridgeが作ったものだ、という補足もあった。アクセシビリティについては、GPUIは対応していないという意見と、Zedのリポジトリにあるアクセシビリティ関連のファイルを示す反論があり、意見が分かれた。中身がまだない段階でも注目が集まったことになるが、正式な情報は今後の公開を待つ必要がある。","2026-11-23","Hacker News","https://news.ycombinator.com/item?id=50619103"],["Ansible×TerraformのGitOps連載、第2部をまとめ","Qiitaで、TerraformとAnsibleを1つのGitリポジトリからGitHub Actionsで動かすGitOps連載の第2部（第5〜12回）のまとめ記事が公開された。レビューしてマージしたプルリクエストでも、インフラの変更が安全とは限らないという前提から、パスフィルター、tfstateの置き場所、承認ゲート、lintとテスト、環境の分離、ロールバックの限界まで、仕組みを積み上げる過程を整理している。","\n【概要】\nQiitaで「「Ansible×TerraformをGitOpsで回す」第2部まとめブログ」が2026年11月23日に公開された。全21回・4部構成の連載のうち、第2部にあたる第5〜12回の内容をまとめた記事だ。テーマは「見たものだけが、承認したときだけ届く」仕組みづくりである。\n【背景】\n連載では、TerraformとAnsibleを1つのGitリポジトリで管理し、セルフホストランナー上のGitHub Actionsで実行している。検証にはTerraformのDockerプロバイダーを使う。出発点となる考え方は、レビューしてマージしたプルリクエストだからといって、インフラの変更が安全だとは限らない、というものだ。\n【詳細】\n扱う内容は、パスフィルターによるTerraformとAnsibleのジョブの切り替え、Terraformの後にAnsibleを実行する順番、インベントリを実行時に作る方法、セルフホストランナーでのtfstateの置き場所である。さらに、同時実行と「Error acquiring the state lock」への対応、手動実行による承認ゲートも取り上げている。安全策としては、ansible-lintとMoleculeをマージの条件にし、Terraform側ではplanの出力を確認して、Ansibleで入れた設定を消してしまうコンテナの作り直しを防ぐ。dev、stg、prodの環境を、tfstate、インベントリ、承認の単位で分け、昇格の順番を決めることも説明している。\n【ポイント・注意点】\nロールバックの限界にも触れている。git revertで戻せるのはTerraformが管理する状態だけで、AnsibleがOSに入れたパッケージやユーザーは戻らない。症状から原因を探す表もあり、たとえば2回目の実行でTerraformが既存のリソースをすべて新しく作ろうとする例（第6回）や、validateとtflintは通ったのにAnsibleで入れた設定が消えた例（第9回）が載っている。この記事自体にコードはなく、各回へのリンクをまとめたページなので、詳細は個別の回で確認したい。","2026-11-23","Qiita","https://qiita.com/juehara-crypto/items/d9d3f586edc8d9a27ce7"],["スマホだけで自動投稿を復旧、Actionsの手動実行で","Qiitaで、ブログの自動投稿の仕組みに図解を自動で入れる工夫と、スキップされた投稿をスマホだけで復旧した体験をまとめた記事が公開された。Claudeで投稿用のJSONを作り、スマホのブラウザからGitHub.comでコミットし、GitHub Actionsの「Run workflow」で実行する。main.pyに--from-fileオプションを、workflow_dispatchに入力項目を追加し、二重投稿を防ぐ仕組みも整えた。","\n【概要】\nQiitaで「今週AIで試したこと｜図解自動挿入＆スマホだけで投稿復旧した話」が2026年11月23日に公開された。ブログの自動投稿の仕組みを持つ筆者が、記事に図解を入れる工夫と、投稿が止まったときにスマホだけで復旧した方法を紹介している。記事は筆者のブログからの転載である。\n【背景】\n筆者の仕組みは、決まった時刻にブログ記事を自動で投稿する。ある金曜日の9時の自動投稿は実行されなかった。原因は、notes/log.mdのSHA256が前回の投稿から変わっていなかったことだ。同じ内容を二度投稿しないための安全装置が、意図どおりに働いた結果だった。\n【詳細】\n図解については、画像をアップロードするのではなく、スタイルを付けたdivで作るHTMLだけの図（フローチャート、比較ボックス、番号付きの手順）をbody_htmlに入れる方法を取った。図はClaude Codeに頼めば作ってくれるという。下書きはnotes/draft_add-diagrams-to-articles.jsonとして保存し、あとで--from-fileで投稿する。スマホでの復旧は、ClaudeのCoworkアプリで投稿用のJSONを作り、スマホのブラウザでGitHub.comからコミットし、GitHub Actionsの「Run workflow」を押す、という流れだ。このために、main.pyに--from-fileオプションを、workflow_dispatchにfrom_fileという入力を追加した。投稿したJSONはnotes/posted/に移し、二重投稿を防ぐ。\n【ポイント・注意点】\nAnthropic、WordPress、LINEの認証情報はGitHub Secretsに入れているので、手元の端末に鍵を置かずに済む。workflow_dispatchに入力を持たせておけば、パソコンがなくてもブラウザから必要な処理を起動できる、という点は他の自動化にも応用できる。筆者は次の段階として、スキップの検出からClaude APIの呼び出し、下書きJSONの作成、GitHubのプルリクエスト作成までの自動化を考えている。","2026-11-23","Qiita","https://qiita.com/ferdinand5819/items/cb4e3f8b9c769423603b"],["LinuxのカーネルモジュールでXNUを動かすxnulinux","はてなブックマークで、macOSのカーネルXNUをLinuxのカーネルモジュールとして読み込み、macOSのユーザー空間をLinux上で動かすGitHubリポジトリxnulinuxが話題になった。ハイパーバイザーを挟まない構成で、READMEによると通常のUbuntuカーネルでmacOS 27のシステムディスクをデスクトップまで起動できる。Appleのバイナリは配布しておらず、macOSは利用者が自分で用意する必要がある。","\n【概要】\nはてなブックマークで、GitHubのリポジトリ「AFK-surf/xnulinux」が2026年11月23日からブックマークを集め、22ユーザーに登録された。macOSのカーネルであるXNUを、arm64のLinuxカーネルの中でxnu.koというモジュールとして読み込み、macOSのユーザー空間をLinux上で動かすことを目指している。リポジトリには3,000以上のスターが付いている。\n【背景】\nmacOSのソフトを別の環境で動かすには、ふつうは仮想マシンを使う。xnulinuxは、2つのユーザー空間の間にハイパーバイザーを挟まない点が特徴だとREADMEで説明している。\n【詳細】\nXNUはAppleが公開しているソースからビルドし、ビルドスクリプトではxnu-12377.121.6に固定している。小さなインターフェースのモジュールfki.koを通じて、Linuxがメモリ、タイマー、ファイル、ネットワーク、GPUを提供する。READMEによると、通常のUbuntuカーネルでinsmod xnu.koを実行すると、macOS 27のシステムディスクがデスクトップまで起動する。Apple SiliconのMac上の仮想マシンでは、macOS 27.2.1が31〜48秒で起動し、30分の負荷テストでもカーネルパニックは起きなかった。NVIDIAのDGX Sparkの実機でもデスクトップまで起動したが、描画はCPUで行っている。必要な環境は、PACと4Kページをサポートするarm64のLinuxホストで、メモリは16GB以上（そのうち8GBをXNU側に確保）だ。\n【ポイント・注意点】\nmacOS本体は利用者が自分で用意する必要があり、Appleのバイナリは配布していない。ライセンスはディレクトリごとに異なり、GPL-2.0のみの部分とAPSL-2.0の部分がある。READMEは、Appleとは関係がなく、承認も受けていないと明記している。はてなでは「ハイパーバイザ挟まずLinuxのカーネルモジュールとしてmacOSのXNUを直接ロード」「31秒で起動して30分動いても落ちへんとか」といったコメントが寄せられた。","2026-11-23","はてなブックマーク","https://b.hatena.ne.jp/entry/s/github.com/AFK-surf/xnulinux"],["C言語にバリアントやジェネリクスを足すType-C","Hacker NewsのShow HNで、C11に足りない型の機能を加えるType-Cが紹介された。バリアント、オプション、ジェネリクス、網羅性を確認するパターンマッチングなどを持ち、コンパイラのtypecがType-Cを読みやすいCに変換してGCCやClangに渡す。C11のファイルはそのままType-Cのファイルとして扱えるので、少しずつ導入できる。作者はOCamlでコンパイラを書いたという。","\n【概要】\nHacker NewsのShow HNに「Type-C – variants, options, generics and pattern matching for C」が2026年11月22日に投稿され、46ポイントと21件のコメントを集めた。リンク先はGitHubのstass/type-cで、説明文は「C11に、Cに足りない型（バリアント、オプション、ジェネリクス、網羅的なマッチ）を加えたもの」となっている。\n【背景】\n作者は投稿の中で、Cは好きだが、構文解析や木の走査、複雑なエラー処理に使うとコードが絡まりやすいと書いている。SwiftやOCaml、Rustを使う手もあるが、Cの資産をそのまま生かしたい場面もある。Type-Cは、既存のCのコードベースに少しずつ導入できる道を目指している。\n【詳細】\nコンパイラのtypecは、ccと同じコマンドラインを受け取り、Type-Cを読みやすいCに変換してからGCCやClangに渡す。インストールはbrew install stass/tap/typecで行う。ファイルの拡張子は.tcで、READMEには「C11のファイルはすでにType-Cのファイルである」とあり、1ファイルずつ移行できる。機能として、網羅性を確認するmatch、result/try、option、defer、別名にならない型、ジェネリックな型、.tciのインターフェースによる非公開の型がある。matchで扱っていない場合があると、「the match does not cover the constructor 'Triangle'」のようなエラーになる。ヒープの確保、GC、例外、ランタイムライブラリはないという。\n【ポイント・注意点】\nREADMEによると、コア言語のType-C 1.0はリリース済みで、checkedモードなど一部は設計だけでまだ実装されていない。作者はコメントで、tomlc99のパーサーをType-Cで書き直し、約1,500回の障害注入テストで、元のCは34回おかしくなったが書き直し版は0回だったと報告している。これは作者自身の数字だ。一方で、Cに飾りを足すだけのプロジェクトだという批判的なコメントもあった。ライセンスはBSD-2-Clause。","2026-11-22","Hacker News","https://news.ycombinator.com/item?id=50602561"],["GitHub ActionsでSmoke Testを単独実行する設計","Qiitaで、デプロイとSmoke Testが連続するリリース用のワークフローから、Smoke Testだけを既存のステージング環境に対して実行できるようにする設計が紹介された。Smoke Testを再利用できるワークフローに切り出し、workflow_dispatchで呼ぶ入口を別に作る。permissionsを空にして権限を絞る工夫や、その限界、ヘルスチェックだけでは保証できない範囲についても丁寧に整理している。","\n【概要】\nQiitaで「GitHub ActionsでSmoke Testを単独実行できるようにする設計」が2026年11月22日に公開された。リリース用のワークフローの中で、デプロイの後に続けて実行されるSmoke Testを、既存のステージング環境に対して単独でも実行できるようにする方法を説明している。\n【背景】\nもとのリリース用ワークフローでは、smokeのジョブがneeds: deployでデプロイの後に続くようになっていた。そのため、デプロイをせずにSmoke Testだけを試すことができなかった。単にneedsを消せばよいわけではない、というのが記事の主張だ。\n【詳細】\nまず、Smoke Testをsmoke.ymlという再利用できるワークフローに切り出す。workflow_callで呼ばれ、必須の入力としてhealth_urlを受け取り、permissions: {}で権限を空にする。ジョブのタイムアウトは2分だ。確認には、curlでヘルスチェックのURLのステータスコードを取得し、10秒で打ち切り、200かどうかを確かめるコマンドを使う。リリース用のワークフローでは、deployのジョブがdeploy.ymlをsecrets: inheritで呼び、smokeのジョブはneeds: deployとpermissions: {}を付けて、vars.STAGING_HEALTH_URLを渡してsmoke.ymlを呼ぶ。smokeにはSecretsを引き継がない。単独実行用には、workflow_dispatchでsmoke.ymlだけを呼ぶsmoke-only.ymlを用意する。ActionsのUIから実行するには、このファイルがデフォルトブランチにある必要がある。\n【ポイント・注意点】\npermissions: {}で絞れるのはGITHUB_TOKENの権限だけで、外部への通信は止められない。AWSの鍵のような別の認証情報があれば、環境を変更できてしまう。また、例はヘルスチェックだけで、認証やデータベース、主要な利用の流れを確かめるリリース時のSmoke Testと同じ保証にはならない。デプロイで作られたデータに頼る場合や、共有のデータベースに書き込む場合は副作用もある。経路を分けるのは、目的と権限を分けることだと筆者はまとめている。","2026-11-22","Qiita","https://qiita.com/y0us91/items/eaeddeaf369376cecda4"],["AWSのコード理解基盤codekbがはてなで100超","はてなブックマークで、awslabsが公開したGitHubリポジトリcodekbが100以上のブックマークを集めた。複数のリポジトリのコードを、人とAIエージェントの両方が理解できるようにする仕組みで、関数ごとの業務的な説明の生成、意味検索、チャットエージェント、MCPツールを提供する。データとモデルの呼び出しは利用者自身のAWSアカウントの中で完結し、Amazon BedrockやS3 Vectorsを使う。","\n【概要】\nはてなブックマークで、GitHubのリポジトリ「awslabs/codekb」が2026年11月22日からブックマークを集め、101ユーザーに登録された。説明文は「すべてのリポジトリにわたるコード理解を、人とエージェントのために」となっている。リポジトリには170のスターが付いている。\n【背景】\nAIエージェントに大きなコードベースを扱わせるには、コードの構造や意味をあらかじめ整理しておく必要がある。codekbは、単なるコードの索引ではなく、自律的にソフトウェアを作る仕組みのためのコード理解基盤だと自らを位置づけている。\n【詳細】\nGitリポジトリのURLかzipのアップロードから「space」を作る。機能として、spaceの概要、コードの意味検索、チャットエージェントの「Agent Hopper」、関係するリポジトリをまとめる「Hyperspaces」がある。MCPのツールはKiroやClaude Codeなどのクライアントから使えるという。1つのコンテナでWeb画面、REST API、MCPサーバーを提供し、保存とモデルの呼び出しは利用者のAWSアカウントの中で行う。処理の流れは、Tree-sitterで関数などを解析して呼び出しの関係を組み立て、BedrockのLLMで各関数を業務の言葉で説明し、Bedrock Guardrailで秘密情報や個人情報を隠し、Titanで埋め込みを作ってS3 Vectorsに入れる、というものだ。更新時は変わったファイルだけを解析し直す。対応言語はPython、TypeScript、Java、Go、Rustなど14種類。\n【ポイント・注意点】\n1つのspaceは、あるブランチかタグの1つのコミットのスナップショットで、コミットの履歴は扱わない。1回の分析で扱えるファイルは最大1万件で、10MBを超えるファイルは飛ばされる。導入にはBedrockで対応するClaudeのモデルとTitan Text Embeddings V2を使える必要がある。はてなでは「大規模マルチリポなら重宝されそう」という声のほか、呼び先の情報まで説明に含めると呼び先の変更で説明が古くなる、という指摘もあった。","2026-11-22","はてなブックマーク","https://b.hatena.ne.jp/entry/s/github.com/awslabs/codekb"],["GitHub Desktopが同じホストの複数アカウントに対応","GitHub Desktopで、同じホストに複数のアカウントでサインインできるようになった。GitHub.com、GitHub Enterprise Server、GHE.comのそれぞれで、アカウントの数に上限なく追加できる。リポジトリごとに使うアカウントを結びつけられるので、クローンや公開、Gitの操作で正しい認証情報が使われる。バージョン3.7.0で利用でき、既存のリポジトリは自動で移行される。","\n【概要】\nGitHubは2026年11月19日、GitHub Desktopが同じホストでの複数アカウントに対応したと発表した。GitHub.com、GitHub Enterprise Server、GHE.comのいずれでも、1つのホストに2つ以上のアカウントでサインインできる。\n【背景】\n仕事用と個人用のように、同じGitHub.comで複数のアカウントを使い分ける開発者は多い。これまでのGitHub Desktopでは、この使い分けがしにくかった。今回の対応で、アプリの中でアカウントを切り替えて使えるようになる。\n【詳細】\n1つのホストに追加できるアカウントの数に、決まった上限はない。リポジトリごとに特定のアカウントを結びつけられるので、クローン、公開、Gitの操作では、そのリポジトリに合った認証情報が使われる。複数のサインイン中のアカウントがアクセスできるリポジトリをクローンしたり追加したりするときは、どのアカウントを使うかを選ぶ。1つのアカウントしかアクセスできない場合は、Desktopが自動で判断する。リポジトリに結びつけたアカウントは、リポジトリの設定か、リポジトリ一覧の右クリックメニューから変えられる。使い始めるには、GitHub Desktop 3.7.0をダウンロードし、「Settings」または「Options」の「Accounts」を開く。新しいアカウントの選択画面は、クローン、公開、リポジトリの設定の確認のときに表示される。\n【ポイント・注意点】\n既存のリポジトリは、すでに使っているアカウントに自動で移行される。1つのホストに1つのアカウントしか使っていない人には、見た目の変化はない。複数のアカウントを使う人は、移行後に各リポジトリが意図したアカウントに結びついているかを一度確かめておくと安心だ。リポジトリとアカウントの対応がはっきりするので、間違ったアカウントでコミットやプッシュをしてしまう事故を防ぎやすくなる。なお、発表には提供対象のプランについての記載はなく、利用するにはまず3.7.0への更新が必要になる。","2026-11-19","GitHub Changelog","https://github.blog/changelog/2026-11-19-github-desktop-now-supports-multiple-accounts-per-host"]],"elec":[["スタックチャン×LoRa、AIエージェントに1.8万行を任せて実装","M5Stack公式のスタックチャンにUnit C6LをGroveケーブル1本で接続し、Meshtastic（LoRa）通信を実現した製作記。実装はGoogleのAIコーディングエージェント「Antigravity」に任せ、著者はアイデア出しに専念した。約18,000行の実装とデバッグをAIが担い、音声での周辺局確認やDM送信、遠隔コマンド、AIによる文脈を踏まえた返信、地震情報の監視など多彩な機能を備える。","\n【概要】M5Stack公式のスタックチャン（StackChan）に、LoRa通信用のUnit C6LをPort CへGroveケーブル1本でつなぎ、Meshtastic通信で遊んだ記録がnoteに公開された。著者は実装をGoogleのAIコーディングエージェント「Antigravity」に丸投げし、自身は機能のアイデア出しに全振りしたという。記事によれば、約18,000行に及ぶ実装とデバッグをAntigravityが担った。\n【背景】スタックチャンは手のひらサイズのロボットで、M5Stackのハードウェアをベースに会話や表情の表示ができる。今回はこれにメッシュ型のLoRa通信を組み合わせ、離れた端末とのメッセージのやり取りをロボットに担わせる試みとなっている。\n【詳細】音声で周辺局を確認でき、NodeDBには最大32局を記憶する。個別DMの送信と受信確認の報告にも対応した。遠隔コマンドとして、温度やバッテリーなどを約200バイト以内で返す「!status」のほか、「!nodes」「!quake」（最新の地震情報）「!help」を用意した。コマンド以外のメッセージには、接続されたAIが文脈を考えて返信する。夜間に届いたメッセージは最大8件までキューに保存し、朝にまとめて報告する。さらに赤外線LEDによる照明の操作と、内蔵の環境光センサーでの消灯確認、カメラで撮ったものに即答する視覚認識、全二重音声、30種類のスタジオボイス、バネ物理による表情アニメーションも実装された。23時から7時の間に部屋が暗い状態が30秒続くと画面の明るさを8%にして眠り、気象庁の地震情報を45秒おきに監視して、震度3以上で起きる。\n【ポイント・注意点】Base側の電流・電圧センサーを使い、4.10Vを上限とするバイパス充電保護も組み込んだ。一方で、開発中には空きメモリが3.3KBまで減る場面もあったという。マイコンの限られた資源の中で多機能化するには、AIに実装を任せる場合でもメモリ管理への目配りが欠かせないことがうかがえる。なお、使用しているLLMの名称や型番は本文に記載がない。","2026-11-24","note","https://note.com/vivid_bicycle777/n/n836c0df5ca11"],["M5Stack×Museで「おかえり」、BLEの電波で在室を判定","M5Stack CoreS3 SEとAIエージェント「Muse」で、部屋に戻ると「おかえり」と声をかける仕組みを実現するまでの実機の壁をまとめたZenn記事。MetaのMuse Gadget SDKの非公式フォーク「Muse-Gadget OKAERI」を使い、音声返信やBLEによる在室検知、キーパッド操作、日本語字幕を追加した。Wi-Fiでの検知に失敗した理由や、電波強度のしきい値の設計、音声再生のバッファ設計を数値とともに解説している。","\n【概要】M5Stack CoreS3 SEとAIエージェント「Muse」を組み合わせ、部屋に戻ると「おかえり」と話しかけるデバイスを作るまでに直面した実機の壁を記した記事がZennに公開された。ファームウェアはMetaのMuse Gadget SDKの非公式フォーク「Muse-Gadget OKAERI」で、音声返信、BLEによる在室検知、キーパッド操作、日本語のビットマップ字幕を加えている。オプションで3キーのBLEキーパッド（MK321BT）も使う。\n【背景】在室の判定は当初Wi-Fiで試みたが、スマートフォンが5GHz帯へローミングしてしまうため失敗した。そこで、スマートフォンのランダムなBLEアドレスから得られる電波強度（RSSI）を使う方式に切り替えた。\n【詳細】RSSIは-72dBmを「強」、-80dBmを「近」とし、6回分の観測窓のうち4回が「強」なら在室と判定する。声かけは2時間以上離れていた場合に限り、1日最大3回まで、深夜2時から7時は行わない。実測値は机で-61〜-81dBm、部屋の奥で-73〜-82dBm、廊下で-77〜-83dBm、別の階では信号なしだった。判定ロジックはC言語のモジュールにまとめ、ホスト側で16件のPythonテストを用意した。キーパッドは出力モードをワンショットに設定し直したほか、電池切れによる切断（理由コード0x208）も原因として突き止めた。返信の音声は、マニフェストを取得してからMP3を8KB単位でストリーミングする。PSRAMの確保に失敗した場合は、再生バッファを60秒、30秒、15秒と段階的に縮める。\n【ポイント・注意点】ファームウェアは4MBのアプリ領域のうち3.67MBを占め、フォントはDotGothic16の16ピクセル、7,090字を収録している。容量の余裕は大きくない。また、デモ動画にGPSのメタデータが含まれていたためffmpegで削除したといい、作品を公開する際のプライバシーへの配慮としても参考になる。電波強度は場所によって値に幅があるため、しきい値や観測窓を実測に基づいて決めた過程は、同様の在室検知を作る人に役立つだろう。","2026-11-24","Zenn","https://zenn.dev/sasa_mkwy/articles/cd6f4448499669"],["子どもの工作を3D保存「おもいでレンジ」、UNO Qで製作","子どもが幼稚園や小学校で作った立体作品を3Dモデルとして保存する装置「おもいでレンジ」の製作記。Arduino UNO Qを使うコンテスト「フィジカルAIチャレンジ」への応募作で、電子レンジ型の箱の回転台で作品を撮影し、M5Stack Dialで4方向の写真を選ぶ。3D化にはTripoのAPIかローカルのHunyuan3Dを使い、完成モデルはペッパーズゴースト方式で窓の中に浮かぶように表示する。","\n【概要】子どもが幼稚園や小学校で作った立体作品を3Dモデルとして残す装置「おもいでレンジ」がnoteで紹介された。Arduino UNO Qを使うコンテスト「フィジカルAIチャレンジ」への応募作品で、記事の公開日が締め切り当日だったという。電子レンジの形をした箱に作品を入れ、回転させながら撮影し、生成AIで3Dモデルにする。\n【背景】電子レンジの形を選んだのは、子どもが自分で操作しやすく、回転と窓という二つの機能を実現できるからだと説明されている。子どもの作品を形のまま残したいという身近な願いを、電子工作と生成AIで形にした作品だ。\n【詳細】回転台は市販の電動ターンテーブルを改造し、内部にある3つのボタンの配線をUNO Qのピンにつないでプログラムから制御する。操作には、回して押せる丸い画面のM5Stack Dialを使う。一周分は36枚の写真に分けられ、Dialを回すと作品がその場で回って見える。当初は動画の決まった時刻のコマを正面としていたが、置き方が毎回変わりうるため、撮影後にDialで正面を選ぶ仕様に変えた。正面を選ぶと右・うしろ・左の候補が自動で表示され、合っていれば押す。4回押すと決定となる。3D化にはTripoのAPIか、ローカルに用意したHunyuan3Dを選べ、UNO Qは選んだ4枚を送って3D化の計算だけを外部に任せる。生成には数分かかり、途中経過はDialとアプリに表示される。完成したモデルは、天面に置いたディスプレイからペッパーズゴースト方式で映し、窓の中に浮いて見えるようにした。\n【ポイント・注意点】保存した作品には1から番号が付き、プレビューモードで選んで再表示できる。外装は、まず加工しやすい段ボールで動くものを作り、その後に木材で完成品を作る方針をとった。仕様と開発記録はProtoPediaにもまとめられている。記事には価格や部品の詳しい型番は書かれていないため、再現を考える場合は開発記録もあわせて確認したい。子どもが自分で使えることを重視した工夫が随所に見られる作品だ。","2026-11-24","note","https://note.com/hackingpapa/n/n0183189c80d4"],["Forlinx、2TOPSのNPU搭載i.MX 952モジュール","Forlinxが、NXPのi.MX 952 SoCを搭載したシステム・オン・モジュール「FET-MX952x-C」を発表したとCNX Softwareが報じた。最大2eTOPSのeIQ Neutron NPUを内蔵し、機器側でのAI推論に対応する。CAN FDを3系統備え、ISO 26262 ASIL BやIEC 61508 SIL 2を目標とする産業・車載向けの設計だ。開発キットも用意されるが、価格は非公開で問い合わせとなる。","\n【概要】Forlinxが、NXPのi.MX 952 SoCを搭載したシステム・オン・モジュール（SoM）「FET-MX952x-C」を発表したと、CNX Softwareが伝えた。記事のタイトルでは、2TOPSのNPUと3系統のCAN FDインターフェースを特徴として挙げている。開発キット「OK-MX952x-C」も用意されている。\n【背景】AI処理をクラウドに送らず機器側で行うエッジAIでは、NPUを内蔵したSoCを使う例が増えている。本製品は産業・車載用途を意識した仕様で、AI処理と制御系の通信を一つのモジュールで担える点が特徴だ。\n【詳細】CPUは最大1.7GHzのCortex-A55を4コア、800MHzのCortex-M7を1コア、333MHzのセーフティ用Cortex-M33を1コア備える。GPUはMali-G310で、OpenGL ES 3.2、Vulkan 1.2、OpenCL 3.0に対応する。AIアクセラレーターはNXPのeIQ Neutron NPUで、最大2eTOPSとされる。VPUはH.264とH.265を最大4K60fpsでデコードし、H.264を最大4K30fpsでエンコードできる。メモリは2GB、4GB、8GBのLPDDR4Xから選べ、ストレージは64GBのeMMCだ。インターフェースは、TSN対応のギガビットEthernetを最大2系統、PCIe Gen 3、CAN FDを3系統（開発キットでは最大5Mbps）、UARTを最大8、SPIを最大8、I2Cを最大7備える。モジュールの大きさは68×50mmで、0.5mmピッチ80ピンのボード間コネクターを4つ持つ。開発キットには2系統のGbE、AW-CM358SMモジュールによるWi-FiとBluetooth 5.0、4G LTE用のMini PCIeスロットがある。\n【ポイント・注意点】動作温度は-40〜+85℃で、NXP EdgeLock Secure Enclaveを備え、ISO 26262 ASIL BとIEC 61508 SIL 2を目標としている。ソフトウェアはLinux 6.18。ソースコードと資料は顧客のみに提供され、価格も公開されておらず、見積もりはForlinxへの問い合わせとなる。個人の電子工作向けというより、製品開発の部品候補として注目したいモジュールだ。","2026-11-24","CNX Software","https://www.cnx-software.com/2026/11/24/forlinx-fet-mx952x-c-som-features-nxp-i-mx-952-soc-with-2-tops-npu-three-can-fd-interfaces/"],["ネットのない教室でStackChanが遊び相手、ローカルLLMで","ネットワークのない小学校の教室で、StackChanが先生の指示どおりに子どもと遊べる仕組みを作ったZenn記事。M5Stack CoreS3ベースのStackChan 3台をそれぞれPCにUSB接続し、音声認識・会話・音声合成をすべてPC上で完結させた。ローカルLLM（llama.cpp）とVOICEVOXを使い、しりとりやじゃんけんなど先生が選んだ6種類の遊びを用意した。オフラインを守る設定や未検証の課題も紹介している。","\n【概要】インターネットにつながらない小学校の教室で、StackChanが先生の言うとおりに子どもと遊べる仕組みを作った事例がZennで公開された。M5Stack CoreS3ベースのStackChan 3台を、それぞれ1台のPCにUSBで接続する。音声認識、会話、音声合成はすべてPC側で処理し、ネットワークを使わずに動かしている。\n【背景】学校の教室では、通信環境を前提にできない場合がある。クラウドのAIサービスに頼ると、その場で動かせない恐れがある。そこで返答の生成にはローカルLLM（llama.cpp）、音声にはVOICEVOXを使い、手元の機材だけで完結する構成を選んだ。\n【詳細】用意した遊びは先生が選んだ6種類で、しりとり、じゃんけん（音声またはカメラ）、5問のなぞなぞ、おみくじ、ものまね声、ずんだもんの自転車ゲームだ。自転車ゲームにはジャンプの方法が6通りあり、カメラで検出したジャンプや声でも操作できる。Arduino UNOにつないだアナログジョイスティックの入力も使い、x・y・ボタンの値を50Hzで送る。オフラインを守るため、環境変数「SC_USB_ONLY=1」でWi-Fiを使わないようにし、「HF_HUB_OFFLINE」「TRANSFORMERS_OFFLINE」でモデルのダウンロードを止めている。小学校の職業体験の日に3台のStackChanで披露し、子どもたちが楽しんだと記されている。コードはGitHub（hamadareo/stackchan-elementary-education）で公開されている。\n【ポイント・注意点】一方で、完全にネットワークを遮断した状態での試験は、権限の都合でネットワークを分離できず、まだ実施できていない。再起動後の自動起動の確認も残っている。記事には「楽しんでもらえた」こと以上の定量的な評価は示されていない。教育現場への導入を考える際は、これらの未検証の項目を踏まえて準備する必要がある。それでも、ネットに頼らずAIロボットを教室で動かす具体的な構成例として価値は大きい。","2026-11-23","Zenn","https://zenn.dev/reohamada/articles/stackchan-elementary-education"],["データを増やしたら精度低下、M5StickS3でエッジAI入門","M5StickS3とEdge ImpulseでエッジAIを作る全手順と、混同行列の読み方を解説したZenn記事。長さや厚みの異なる舌片を持つ3Dプリント板に本体を取り付け、方向ごとの響き方の違いを6軸IMUで分類する。上下左右と「その他」の5クラスで学習したところ、データを追加すると逆にテストの正解数が減った経緯を数値で示した。最終的に本体の分類だけで迷路ゲームをクリアした。","\n【概要】M5StickS3とEdge Impulseを組み合わせ、エッジAIの開発手順と混同行列の読み方を学ぶ記事がZennに公開された。6軸IMUを搭載したM5StickS3を、長さと厚みの異なる舌片を持つ3Dプリントの板の下に取り付け、方向ごとに異なる響き方を分類する入力装置を作った。タイトルのとおり、「データを増やしたら精度が下がった」経験が中心となっている。\n【背景】Edge Impulseは、マイコン向けの機械学習モデルを作れるサービスだ。M5StickS3は公式の対応ボード一覧に載っていないが、書き出したC++ライブラリで動作したという。データ収集用のファームウェアはClaude Codeで書いた。\n【詳細】分類は上・下・左・右・その他の5クラス。各方向50件、その他20件の計220件を集め、さらに評価用として60件を別に確保した。特徴量は126個のスペクトル特徴で、重み2,805個の小さなニューラルネットに入力する。検証精度は95%を超えたが、別に取っておいたテストでは60件中50件の正解だった。そこで方向のデータを80件追加したところ、正解は46件に減り、「その他」の正解数は20件から10件に落ちた。int8に量子化したモデルは重みが3KB未満と約4分の1になり、テストの成績は変わらなかった。実機では特徴量の抽出に52ミリ秒、分類に1ミリ秒かかり、M5StickS3単体の分類だけで迷路ゲームをクリアできた。\n【ポイント・注意点】検証用データでの高い精度が、そのまま未知のデータでの性能を意味しないことが実例で示されている。データを足せば必ず良くなるわけではなく、どのクラスで誤りが増えたかを混同行列で確かめることが大切だとわかる。小さなマイコンでも、量子化によって成績を保ったままモデルを小さくできることも確認された。公式の対応ボード以外でも、書き出したライブラリで動かせた点は、手持ちの機材で試したい人にとって心強い。手を動かしながら機械学習の評価の考え方を学べる、実践的な教材といえる。","2026-11-23","Zenn","https://zenn.dev/beavers_hive/articles/edge-impulse-dpad"],["Museを頭脳に、ラズパイ5などで自宅スマートホーム構築","AIエージェント「Muse」を頭脳とし、Raspberry Pi 5やミニPC、GPU搭載PC、NASを組み合わせて構築した自宅スマートホームの全体像をまとめたZenn記事。ラズパイがウェイクワード検知や環境センサーの記録、赤外線での家電操作を担い、ミニPCが音声クローンによる音声合成を担当する。ポーリングからpush通知への切り替えで1日約5,760回のSSH往復をなくした工夫も紹介している。","\n【概要】AIエージェント「Muse」を中心に据えた自宅のスマートホームが一通り完成し、その構成をまとめた記事がZennに公開された。設計思想は「ローカルファースト」「仕組みで回す」「ポーリングよりpush」の3つ。著者はこれを、AIエージェントの身体を自作の機械で少しずつ広げていくプロジェクトだと位置づけている。\n【背景】頭脳にあたるのはMuseのVMで、記憶、スケジュール、判断、各ノードへの指示を受け持つ。Raspberry Pi 5は「皮膚と耳と手」として、ウェイクワード検知、環境センサーの記録、赤外線による家電操作を担う。Ryzen 5 3500UのミニPCは音声合成とテレビ録画、RTX 3060搭載のWindows 11 PCは画像生成などの重い計算を担当する。ノード間はTailscaleで結んでいる。\n【詳細】ウェイクワードは、USBマイクの音声をVoskの日本語小モデルで常に解析し、「おーいMuse」を検知する。当初は続く発話も文字起こししてコマンドにしていたが、遅延が約2分と実用にならず撤回し、今はウェイク専用だ。オムロンの環境センサーで温度、湿度、気圧、照度、騒音、eTVOC、eCO2、振動、WBGTを取得し、SQLiteに保存する。エアコンはUSB赤外線送受信機ADIR01Pで操作し、未学習の温度設定は信号の構造を解析して合成する。テレビはHDMI-CECと自作のGo製コントローラーで制御する。音声はIrodori-TTSによる音声クローンで、ONNX int8版をCPUで動かす。毎朝6時に5つの情報源の多数決で天気の原稿を作り、7時30分に読み上げる。返事があるまで5分おきに呼びかけ、返事をして初めて朝のテレビがつく。\n【ポイント・注意点】通知を15秒間隔のポーリングからGadget SDKによるpush送信に切り替え、1日約5,760回のSSH往復をなくした。一方、使っている環境センサーは製造終了品で、ドライバー探しに苦労したという。寝ているPCのping応答を起動と誤認した失敗もあり、見かけの応答と実際の状態を区別する大切さが語られている。","2026-11-23","Zenn","https://zenn.dev/k_motoki/articles/fbc0bde58f186e"],["AI任せから一歩、スタックチャンのコードでC++を学ぶ","非エンジニアの著者が、AIを活用しながらスタックチャンのC++コードを読み解き、超初級の知識を身につけた体験記。これまでコードの変更をAIに任せきりで構造を理解していなかった「理解負債」を振り返り、GitHubで公開されているAI_StackChan_Exを題材に、ファイルの役割や会話処理の流れを整理した。機能を増やすには理解が必要だが、LLMを使って全体像からつかむ方針をとったとまとめている。","\n【概要】非エンジニアの著者が、AIを使いながらスタックチャンのC++コードの超初級を学んだ体験記がnoteに投稿された。著者自身、詳しい技術解説ではないと明記している。これまでスタックチャンで会話、モーター操作、画面表示の変更などに取り組んできたが、コードの変更はAIに完全に任せていたという。\n【背景】AIに任せれば動くものは作れる。その一方で、プログラムの構造を把握しないまま改造が積み重なっていく。著者はこの状態を「理解負債」と表現している。スタックチャンの機能をさらに増やしたいと考えたとき、中身が分からないことが壁になると感じたことが、学び直しのきっかけとなった。\n【詳細】題材にしたのは、GitHubで公開されているronron-gh/AI_StackChan_Ex。まず拡張子の意味として、.cppは処理を書くファイル、.hは関数の目次にあたるヘッダーだと整理した。main.cppは全体の司令塔で、setup()で初期化を行い、loop()で状態を監視し続ける。AIとの会話に関係するファイルも一つずつ確認した。main.cppは画面のタッチ座標を確認し、ModManager.cppはアプリの一覧と切り替えを管理する。RealtimeAiMod.cppは録音の開始と停止を指示し、RealtimeLLMBase.cppは音声データの変換とLLMとの通信を担う。GeminiLive.cppはGemini専用の通信形式を扱う。操作の流れとしては、画面右下の「Please touch」に触れるとリスニングモードに入り、話した内容がクラウドのLLMに送られ、返答が音声で再生される。\n【ポイント・注意点】著者の結論は、機能を増やすにはプログラムの理解を深めたほうがよいが、勉強に時間をかけすぎないよう、LLMを使って全体像からつかむというものだ。AIに書かせるだけでなく、AIにコードの読み方を教わる使い方の一例といえる。なお、記事のハッシュタグにはClaude CodeやCodexも挙がっているが、本文でそれらをどう使ったかは書かれていない。AIで電子工作を始めた人が次の段階に進むためのヒントになりそうだ。","2026-11-23","note","https://note.com/eury_iku/n/n1fa6fdb4a3d9"],["スーファミに無線LAN、LLMがゼルダのNPCの台詞を生成","スーパーファミコン用の自作無線ネットワークアダプター「SNET」をHackadayが紹介した。RP2350とESP32-C3を組み合わせ、コントローラー端子経由で約30kB/sのデータ通信を実現する。セーブデータをWebDAVサーバーと同期する機能のほか、LLMが『ゼルダの伝説 神々のトライフォース』のNPCの台詞を生成するデモも披露された。ただし作者はトークンの消費が大きいことも認めている。","\n【概要】Danny Boland氏が開発したスーパーファミコン（SNES）用の無線ネットワークアダプター「Super Network Adapter（SNET）」を、Hackadayが紹介した。マイコンのRP2350とESP32-C3を組み合わせた自作ハードウェアで、デモではLLMがゲーム内の登場人物（NPC）の台詞を生成している。詳細はboland.dev/snetで公開されている。\n【背景】SNESには、かつてSatellaViewのモデムが使っていた拡張端子がある。SNETはそれを使わず、本体前面のコントローラー端子を利用する点が特徴だ。古いゲーム機をネットにつなぎ、現代のサービスと連携させる試みとなっている。\n【詳細】記事によれば、本体とのデータ通信速度は約30kB/s。ESP32-C3がWi-Fiを担当し、家庭のネットワークに接続するか、自らホットスポットになる。SNESのゲームは標準ではこの装置を認識しないため、ROMにパッチを当ててフラッシュカートリッジから読み込む必要がある。紹介された機能には、カートリッジのSRAMにあるセーブデータをWebDAVサーバーと同期するものがあり、RetroArchとの連携も示された。注目のデモは、『ゼルダの伝説 神々のトライフォース』でLLMにNPCの台詞を生成させるもので、たとえば壺を割ったことにNPCが反応する。記事はSNETを、独自のSNES用ROMにとって役立つ可能性のある拡張機器と評している。\n【ポイント・注意点】作者自身、LLMの機能はトークンを大量に消費し、誰にとっても役立つとは限らないと述べている。読者コメントでは、ESP32があるならPi Picoは不要ではないか、コントローラーの2番端子が使えなくなる、といった指摘もあった。過去のXBANDやセガのメガネットなど、ゲーム機向け通信機器の話題も出ている。実用性よりも、レトロゲーム機と生成AIを電子工作で結ぶ遊び心が光る作例だ。改造ROMやフラッシュカートリッジが前提になる点は、試す前に押さえておきたい。","2026-11-23","Hackaday","https://hackaday.com/2026/11/23/building-a-wireless-network-adapter-for-the-super-nintendo/"],["Echo Dotの基板を交換、ESP32-P4でローカル音声アシスタントに","第3世代Amazon Echo Dotの基板を置き換え、Home Assistantと連携するローカル音声アシスタントにする「LocalDot」をHackadayが紹介した。ESP32-P4をアプリケーションプロセッサーに、ESP32-S3を通信用のコンパニオンとして採用している。本体のインターフェースとマイクアレイはそのまま生かせるのが特徴だ。読者コメントでは、ソフトウェアで対応する別の手法やClaude連携の例も話題になった。","\n【概要】ale1800氏による「LocalDot」は、第3世代のAmazon Echo Dotの基板を置き換える自作のプリント基板だ。Hackadayが紹介した。Echo Dotのインターフェースとマイクアレイはそのまま残し、新しい基板がHome Assistantのサーバーにつながることで、ローカルで動く音声アシスタントに生まれ変わらせる。プロジェクトはGitHubで公開されている。\n【背景】スマートスピーカーは便利だが、メーカーのクラウドに依存する。家庭内で完結するスマートホーム基盤であるHome Assistantと組み合わせ、手元のハードウェアを生かして音声操作を実現したいという需要は根強い。LocalDotは外装やマイクといったEcho Dotの資産を再利用し、中身の基板だけを入れ替える発想だ。\n【詳細】新しい基板は、アプリケーションプロセッサーにESP32-P4を採用し、通信用のコンパニオンとしてESP32-S3を組み合わせた構成となっている。記事は、この機器が画面を使ったインターフェースを持たない点にも触れている。記事にはYouTubeの動画も埋め込まれている。記事のカテゴリーはホームハックで、タグにはAmazon Echo、ESP32-P4、ホームオートメーションが付いている。\n【ポイント・注意点】読者コメントでは、基板を交換せずソフトウェアで対応する方法として、Gamer92000氏のecho-dot-assistが紹介された。第2世代・第3世代のDotを含む複数のEchoでブートローダーを解除できるというが、これはコメント投稿者の主張だ。ほかに、第2世代のDotで音声をClaudeに送るスクリプトを動かしているという声や、マイクアレイ向けのオープンソースのビームフォーミングソフトが不足しているとの指摘もあった。Google Home Mini向けの差し替え基板の話題も出ている。既存の製品を分解して中身を入れ替える改造のため、試す際は元に戻せなくなる可能性も考えておきたい。使わなくなったスマートスピーカーを、自分で管理できる音声AI端末として再生する選択肢の一つになりそうだ。","2026-11-22","Hackaday","https://hackaday.com/2026/11/22/a-replacement-pcb-for-the-echo-dot/"],["初心者が時計にAIを住まわせた、StopWatch×Muse","プログラム初心者の著者が、M5Stack StopWatch C152とMuse Gadget SDKを使い、時計型デバイスでAIと会話できるようにした体験記。時計とWi-Fiだけで会話でき、PCやスマホを中継しない。ダウンロードモードの入り方やケーブル、SDKトークンの扱いでつまずいた経緯を紹介し、キャラクターの顔の表示や仕草の追加にも取り組んだ。設計はMuse、実装はCodexに任せる分担だった。","\n【概要】プログラム初心者の著者が、M5Stack StopWatch C152にAIを「住まわせた」体験記をnoteに公開した。使ったのはMuse Gadget SDKとMacBook Air M3。時計とWi-Fiだけで会話でき、PCやスマートフォンは中継しないという。外出先でも、スマートフォンの電波を借りて使えた。記事は著者の製作記録をもとにAI（Muse）が下書きを作り、著者が内容を確認したものだと明記されている。\n【背景】著者は仕事用のUWSCとPythonを少し書ける程度で、ファームウェアのような本格的なコードは書けない。そうした初心者でも、AIに設計と実装を任せることで電子工作に挑戦できるかが見どころだ。\n【詳細】最初のつまずきはダウンロードモードへの入り方だった。赤ボタンを長押しすると途中で時計が起動して画面がつくため、そこで指を離すと入れない。起動後も押し続けると画面が消えて緑のランプが光るのが正解で、これに半日を費やした。電源を切るダブルクリックは、短く2回押す必要がある。次に、マグネット式のUSBケーブルが充電専用でデータを通さず、普通のケーブルに替えると認識した。三つ目はSDKトークンで、新たに発行すると古いトークンが即座に無効になることを知らずに再発行し、登録がすべて失敗して再び半日を失った。トークンは1つだけ用意して共有するのが正解だったという。その後、キャラクターの顔を表示して瞬きと口パクをさせ、USBドライブとして見える仕組みにして、顔データをコピーするだけで数秒で差し替えられるようにした。タップでハート、連打で怒りマーク、振ると驚くといった反応も加えた。\n【ポイント・注意点】作り方は、著者が要望を伝え、Museが設計と指示書を作り、Codexが実装する分担だった。プロの手順書には初心者のつまずきは書かれていない、という著者の言葉どおり、同じ機材で始める人に役立つ注意点がまとまっている。AIを相棒にすれば、初心者でも自分だけのガジェットを形にできることが伝わってくる。","2026-11-22","note","https://note.com/osushiosu/n/n3630cb2f450e"],["Claude Codeの作業完了を、ATOM LiteのLEDが光って通知","プログラムも電子工作も未経験の著者が、友人から借りたM5Stack ATOM Liteで、Claude Codeの作業状況をLEDの光で知らせる仕組みを作った体験記。Claude Codeに日本語で頼むバイブコーディングで、作業終了は緑、承認待ちはオレンジで点滅させた。借り物のため元のプログラムを保存し、返却前に書き戻して1バイトも違わないことを確かめた。所要時間は約1時間15分だった。","\n【概要】プログラムも電子工作も未経験で、はんだごても持っていない著者が、Claude Codeの「終わったよ」をマイコンの光で知らせる仕組みを作った。使ったのは、友人から借りたM5Stackの「ATOM Lite」。2.4cm角で、ボタンとLEDが1つずつ付いた小さなマイコンだ。返却する日に、せっかくなので使ってみたという。\n【背景】Claude Codeは作業を終えるとWindowsの画面に通知を出すが、別のウィンドウを見ていると気づかないことがある。そこで手元のATOM Liteで状態を知らせる仕組みを、Claude Codeに日本語で頼んで作った。いわゆるバイブコーディングだ。\n【詳細】最初に作ったのは、ボタンを押すたびに赤、緑、青、白、消灯と色が変わるプログラム。書き込みは約30秒で、始めてから約25分で一発で動いた。続いて本題の通知ランプを作った。光り方は、作業終了で緑のゆっくりした点滅、承認待ちでオレンジの速い点滅、次の依頼を送ると消灯というものだ。途中、オレンジが光ってほしいときに光らず、光ってほしくないときに光る不具合も起きた。原因は続編で書くとしている。借り物なので、書き込み前に元のプログラムを丸ごと保存し、返却前に書き戻して読み出し、見比べて1バイトも違わないことを確かめた。保存から書き戻しまでの所要時間は約1時間15分。新たに買ったものはなく、借りたマイコンと手持ちのミニPC、USBケーブル、契約済みのClaude Codeを使った。\n【ポイント・注意点】返却後、著者は自分用に小さな画面付きの「ATOMS3R」をスイッチサイエンスで3,531円で注文した。次は画面に顔を出し、その先はスマートフォンとの組み合わせを目指す。貸し主の友人は、昔はこの種のプログラムを作るのが大変だったが、バイブコーディングがあると違うと語ったという。他人の機器に書き込む前に元の状態を保存し、返す前に照合する手順は、初心者にも参考になる。AIの手を借りた小さな成功体験が、次の挑戦につながっている様子が伝わる。","2026-11-21","note","https://note.com/nonengineer_vibe/n/na4c26a75b972"],["名前を呼ぶと返事、Museで作るスタックチャン「ひまちゃん」","M5Stack公式キット「StackChan K151」を使い、名前を呼ぶと返事をするロボット「ひまちゃん」を作った開発記録。頭脳は設定で切り替えられ、ずんだもんの声で話す「娘のMuse」と、OpenAIのリアルタイム音声AIを用意した。重い処理は自宅のNASとクラウドに任せ、音声合成はNAS上のVOICEVOXを使う。月額コストの試算や、512KBのメモリをめぐる不具合も記されている。記事の大部分は有料。","\n【概要】名前を呼ぶと返事をするロボットがほしい――。そんな思いから、M5Stack公式キット「StackChan K151」でロボット「ひまちゃん」を作った開発記録がnoteに公開された。頭脳モジュールはESP32-S3ベースの「CoreS3」で、土台には首を動かすサーボが入っている。名前は著者の娘が付けた。\n【背景】本体は聞く、話す、顔を出す役に徹し、重い処理は家のNASとクラウドが分担する構成だ。設定で切り替えられる頭脳は2つ。頭脳Aは無料の音声合成「ずんだもん」の声で話す「娘のMuse」、頭脳BはOpenAIのリアルタイム音声AIモデルだ。後から両方の長所を取った第3の頭脳も加えた。\n【詳細】ウェイクワードは、本体が候補を拾い、NASが最終判定する二段構え。本体のメモリは512KBしかない。音声合成はVOICEVOXをNAS上でコンテナとして常駐させる。ファームウェアのMiniMax互換接続に合わせ、Python標準ライブラリだけで書いた自作プロキシが音声を16kHzのMP3に変換する。声の候補には白上虎太郎、春日部つむぎ、四国めたん、ずんだもんを挙げ、ずんだもんのノーマルを採用した。MiniMaxを使う場合、日本語は1分あたり約350文字で、1日15〜30分話すと月1,400〜2,800円かかる試算となり、コストを理由にVOICEVOXを選んだという。純正ファームウェアは16MBのフラッシュを丸ごと吸い出して保管した。性格は「元気でものしりなお姉さん」で、宿題の答えは渡さず、ヒントで導く方針だ。\n【ポイント・注意点】想定外の不具合として、音声が出るまでの「間」、画面のスワイプで顔がスクロールしてしまう問題、512KBのメモリの奪い合いによる再起動ループが挙がっている。限られた資源のマイコンでAIロボットを作る際の典型的な課題といえる。なお、記事の大部分（20,348字）は1,500円の有料部分で、ここで紹介した内容は無料で読める部分に基づいている。家族のためのロボットづくりの記録として読み応えがある。","2026-11-20","note","https://note.com/higetombo/n/n2bc018be47e5"],["Claude CodeとESP32でネットラジオ、仕様から配線図まで","Claude Codeを使ってESP-32でインターネットラジオプレーヤーを作る連載の設計編。Visual Studio CodeとClaude Code拡張によるバイブコーディングで、最大10個の配信URLの記録、ボタンでの再生・選局・音量操作、7セグメントLEDでの表示、Webからの登録・編集といった仕様を投入した。Claude Codeは仕様の矛盾や抜けを質問したうえで、設計書から実体配線図、ビルドまでを作成した。","\n【概要】「おっさん vs Claude Code」と題した連載の第3回として、ESP-32でインターネットラジオプレーヤーを作る設計編がnoteに投稿された。開発環境はVisual Studio CodeとClaude Codeの拡張機能で、著者はバイブコーディングで進めている。\n【背景】著者は以前、隣人の騒音に反応して「うっせぇ！」と叫ぶデバイスを作り、一応動くところまでこぎ着けた。ただ環境音と隣人の騒音を区別できず、マイクを複数にするなどの改良を検討中だという。次の題材に選んだのがネットラジオだ。ESP-32は5cm×2cmほどのボードでWi-Fi、Webサーバー、Bluetoothに対応し、1枚1,000円ほどで買えると紹介している。\n【詳細】投入した仕様は具体的だ。ESP-32 Dev Moduleに最大10個のURLを配列で記録し、DACのGY-PCM5102Aから3.5mmミニジャックで外部スピーカーへ出力する。トグルボタン1で再生の開始と停止を切り替え、LED1は再生中に点灯する。トグルボタン2でURLの番号を進め、1桁の7セグメントLEDに番号を表示する。未登録や無効なURLは「ー」、有効なものが一つもなければ「E」を表示する。ボタン3と4で音量を上下させ、初期値は設定範囲の中央とした。さらにWebサーバーでURLを登録・編集・削除できる画面を作り、「登録」と「元に戻す」ボタンを付ける。Claude Codeは仕様の矛盾や抜け、未定の動作、手持ち部品の型番などを質問したうえで設計書をまとめ、コーディング、テスト、ビルドまでを続けて行った。作成された実体配線図は、実物の絵で配線を示す初心者向けの形式だった。\n【ポイント・注意点】著者は回路図の記号が読めないため、配線図どおりに部品をつないで動くか確かめる作業は人間の側に残っている。記事の時点では、実機での動作はまだ確かめられていない。著者は、AIに頼りきりになる危うさや、仕込まれたハッキングツールに気づけないかもしれないという懸念も率直に述べている。","2026-11-20","note","https://note.com/seiji_okamoto/n/nf38523ed2419"],["LLMは意図だけ、ラズパイのRust反射層で自律走行","LangGraphとRaspberry Piで自律走行ロボットを作る連載の続編。LLMが直接走行を制御する方式は判断が約1Hzと遅く、通信が途切れると止まれない問題があった。そこでLLMは「右へ進んで」などの意図だけを出し、ラズパイ5上のRust製反射ループと約10万パラメータの小型CNNが安全と操舵を担う構成に改めた。実機での失敗や評価指標の見直しも詳しく報告している。","\n【概要】PiCar-XとRaspberry Piを使い、LangGraphでロボットを自律走行させる連載の続編がQiitaに公開された。前回はカメラ画像をLLMが見て動く仕組みを作ったが、実機試験を重ねた結果、LLMによる直接制御は実用面で不十分だったという。今回はRust製の安全層とエッジAIを組み合わせた構成に作り替えた。\n【背景】LLMによる直接制御では、静止画の撮影からLLMの呼び出し、JSONの解析、走行指令までに1秒以上かかり、判断は約1Hzにとどまった。Wi-Fiの途切れやAPIのレート制限に当たると、直前の「前進」のまま止まらない危険もあった。走行・視覚・音声を分けたマルチエージェント化も、遅延がさらに倍増して失敗に終わった。\n【詳細】新しい構成では、ラズパイ上のRust製反射ループが40Hzで動き、超音波センサーで15cm未満なら強制停止するほか、段差センサーと指令の有効期限（400ミリ秒）を監視する。危険を検知してからモーターが止まるまでは最大20ミリ秒以内だ。LLMが出すのは「右へ進んで」「おまかせ」といった意図だけで、モーターを直接回す権限は持たない。操舵は、NVIDIAのPilotNetに着想を得た4層のCNN（約10万パラメータ）が担い、意図ごとに出力を分ける条件付き模倣学習を採用した。Raspberry Pi 5上でRustのtract-onnxにより推論し、推論時間の中央値は8.1ミリ秒。学習データはゲームパッドで手動操縦して集め、オプティカルフローと超音波の変化から、壁へのスタックや横滑りなどのフレームを自動で除外した。著者によれば、この除外のほうがモデル構造の変更より走行の安定に効いた。\n【ポイント・注意点】オフラインでの誤差が±4.7°まで下がったモデルでも、実機では立ち往生した。そこで評価指標を「10分あたりの人の介入回数」に変えた。モーターの個体差や前輪のずれで学習モデルが片側に曲がる癖を持つ、超音波が布や細い椅子の脚を検知できないなど、ハードウェア由来の課題も多い。著者は「秒単位の思考とミリ秒単位の反射を混ぜない」ことと、足回りの調整の重要性を強調している。","2026-11-19","Qiita","https://qiita.com/tactac1238/items/99ed93e89f94ca353d85"],["声で走るラズパイ車にAmiVoice、動き出し6秒を1秒台に","Raspberry Pi 5で動くPiCar-Xを声で操作する連載の第9回。音声認識にAmiVoiceのストリーミングAPIを使い、ノートPCのGPUで動くローカルLLM「gemma3:4b」が14種類の動作から一つを選ぶ。発話の終わりから動き出すまでの時間を当初の6秒から1.6〜2.3秒に短縮し、キャッシュした命令なら約0.5秒で動く。単語登録による認識率の改善や課金の実態も報告している。","\n【概要】「小さなAIで手足をうごかす」と題した連載の第9回がZennに公開された。Raspberry Pi 5で動くロボットカーPiCar-Xを声で操作する仕組みに、AmiVoiceのストリーミング音声認識を組み込み、話し終えてから車が動き出すまでの時間を6秒から1秒台に縮めるまでの記録だ。\n【背景】構成は、USBマイクを話し手から約1.5m離して置き、AmiVoiceで音声を文字にする。その文字をもとに、ノートPCのGPU上でOllamaを通じて動くローカルLLM「gemma3:4b」（約40億パラメータ）が、前進・後退・左右をそれぞれ1〜3回、停止、何もしない、など14種類の動作コードから一つを選ぶ。返事はOpen JTalkで読み上げる。\n【詳細】最初の版では、発話の終了から動き出しまで6秒かかっていた。返事の読み上げより先に動作を始めるように変えたことで1.6〜2.3秒となり、約4秒短縮した。一度実行した命令をキャッシュから繰り返す場合は約0.5秒で動く。AmiVoiceの設定値postTimeを550ミリ秒から300ミリ秒に下げると、約0.2秒縮んだ。呼びかけの「ピカ」は、単語登録をしないと31回中2回しか認識されなかったが、登録後は31回中25回になった。4種類の命令のテストでは、41回の発話のうち34回が正確に一致した。マイクの入力は最大でもフルスケールの2〜6%と小さかったため、5倍に増幅している。途中結果を使って先回りで計算する工夫は、かえって2.6〜4.0秒に遅くなったため取りやめた。\n【ポイント・注意点】課金は10回の命令で16.0秒分と計上され、アカウントでは519秒の使用で0円だった。記事は外部のベンチマークにある電話の音声エージェントの中央値1.3〜1.7秒と比べ、自身の車は1.1〜1.5秒、キャッシュ時は0.5秒としている。小さなAIでも、処理の順序を工夫すれば体感の速さを大きく改善できることを示す事例だ。返事の読み上げを待たずに動き出す設計は、ほかのロボットにも応用できそうだ。","2026-11-19","Zenn","https://zenn.dev/mappy55/articles/small-ai-hands-09"],["学園祭でスタックチャンが子どもと会話、頭脳をClaudeに換装","東京学芸大学の小金井祭で、性格を持たせたスタックチャンを使った展示と体験を3日間行った記録。7月の理科教室でほとんど会話にならなかった反省から、頭脳をGemini LiveからClaudeに、声をAivisSpeechに、耳を無線マイクとPCのWhisperに替えて作り直した。人間1人とロボット2台による三者会話や、台数を減らした運営の工夫、当日のトラブル対応を紹介している。","\n【概要】10月31日から11月2日まで、東京学芸大学の学園祭「小金井祭」で、スタックチャンを使ったロボット展示と体験を行った記録がnoteに公開された。登場したのは、著者が卒業論文で使う、性格を持たせたスタックチャンたちだ。\n【背景】7月に開いた理科体験教室では、回線の状態、会場の音、画面の連打が重なり、ほとんど会話にならなかった。そこで耳の部分を無線マイクと研究室のPCによる文字起こしに替え、仕組みを作り直した。10月29日には構成を変更し、頭脳をGemini LiveからClaudeに、声をAivisSpeechに替えた。耳は無線マイクの音をPCのWhisperで文字にしてロボットに渡す。Geminiは年齢制限のため子ども向けには使えず、切り替えたという。\n【詳細】展示は、人間1人とスタックチャン2台による三者会話の形をとった。人が話しかけないとスタックチャン同士で会話を始め、ココアに合わせるお菓子の話題で盛り上がったという。初日は4台を同時に動かしたが、人間側の対応が追いつかず、2日目からは2台ずつに減らした。音声が出なくなる、2台目が話し始めないといった問題は、その場で設定を直して対応した。前日の予行では首のモーターの赤いランプが点滅し、首が2周回る不具合もあった。当日の朝には、名前の読みが「にろう」になっていることに気づいて修正した。ブースでは、25cm四方のアルミホイルで船を作る実験も行い、保護者にも好評だった。\n【ポイント・注意点】頭脳の変更に伴い、一語ごとの課金が増えたことも記されている。子ども向けにAIサービスを使う場合は、年齢制限などの利用条件の確認が欠かせないことを示す実例だ。台数を絞って人の目が届く範囲で運営するなど、イベントでAIロボットを動かす際の現実的な工夫も参考になる。今後は約3か月研究を続け、12月12日に形の科学会で発表する予定だという。AIの性能だけでなく、マイクや会場の環境まで含めた全体の設計が会話の成否を左右することがよくわかる記録だ。","2026-11-19","note","https://note.com/rio0111/n/n6436bf2b7c37"],["スタックチャンが歩く！Claude Codeで不具合の原因を特定","3Dプリントの歩行台「Stackchan Strider」をスタックチャンの下に取り付け、首振りサーボ1個の力で4本脚を動かして歩かせた製作日誌。部品は57個で、ネジや接着剤を使わない。歩かない原因をClaude Codeで調べ、六角シャフトとクランク穴の隙間を突き止めて刷り直した。操作はCodexを使ってBLE接続に作り替え、Swiftのネイティブアプリにした。モーターの換装も検討している。","\n【概要】とよふく氏が設計した3Dプリントの歩行台「Stackchan Strider」を、スタックチャン（K151／CoreS3）の下に取り付けて歩かせた製作日誌がnoteに公開された。開発の過程では、不具合の原因調査にClaude Code、操作系の作り替えにCodexと、AIのコーディングツールを活用している。\n【背景】動力は首振り用のサーボ1個だけ。ターンテーブル、傘歯車、六角シャフトでクランクに回転を伝え、ヤンセン機構の4本脚を動かす。部品は57個（16種類）で、ネジ、ベアリング、接着剤を使わない。全体は幅96×長さ147×高さ180mm、重さは約297gだ。\n【詳細】プリンターはBambu Lab H3Cを使い、0.4mmノズル、積層0.2mm、PLA、サポートなしで出力した。ところが組み立てても歩かない。原因は、二面幅7.8mmの六角シャフトと8.3mmのクランク穴の間にある0.5mmの隙間だった。Claude Codeで調べた結果、A1 miniでは起きていた1層目のつぶれが、H3Cの設定では起きなかったためと結論づけた。対策として、クランク穴の二面幅を7.9mmに変え、0.3mmの面取りを加えて、黒のPLAで約20分、5.5gで刷り直した。操作は当初のWi-Fiから、Codexを使ってMacBook ProとのBLE接続に作り替えた。WebUIはスクロールの問題で断念し、Swiftのネイティブアプリにした。速度に連動して表情が変わる機能も入れた。11月18日の夜には前進と後退に成功した。\n【ポイント・注意点】MuJoCoによるシミュレーションでは、摩擦0.5、指令60%で約31mm/s。Claude Codeの試算では、100〜120rpmなら約67mm/sになるという。モーター換装の目安は無負荷回転数160rpm以上、ストールトルク3.8kg·cm以上とされるが、まだ決まっていない。ロボット本体にAI機能を加えた記事ではないものの、プリンターごとの出力の差という物理的な問題の切り分けにAIを使った実例として参考になる。","2026-11-19","note","https://note.com/goroman/n/nb9ee359c4d61"],["スタックチャンをMuseガジェット化、Google TTSで発話","M5Stack CoreS3ベースのスタックチャンを、MetaのMuse Gadget SDKでAIガジェットにし、Google Cloud Text-to-Speechで話せるようにしたZenn記事。Museはテキストしか返さないため、返答を分割して音声合成し、SDKに戻す仕組みを追加した。話し終えてから音声が出るまでは約8秒。トークンの改行コードや再書き込み時の設定消失など、セットアップでの落とし穴も紹介している。","\n【概要】M5Stack CoreS3を使ったスタックチャンを、MetaのMuse Gadget SDKでAIの「Museガジェット」にし、さらにGoogle Cloud Text-to-Speech（TTS）で喋らせるまでの手順をまとめた記事がZennに公開された。電源ボタンを長押しすると音声メモを録音でき、それがAIへの問いかけになる。\n【背景】Museは返答をテキストでしか返さない。そのままでは画面に文字が出るだけで、ロボットとしての魅力が半減してしまう。そこで著者はGoogle Cloud TTSを組み合わせ、返答を音声で再生する仕組みを追加した。既定の声はja-JP-Neural2-Bで、24kHzのMP3を使う。\n【詳細】ファームウェアはESP-IDF v6.0.3上のMuse Gadget SDKで、WSL2でビルドし、WindowsからCOM7経由で書き込んだ。音声化の流れは、別のタスクが返答を分割し（最初のかたまりは約120バイト）、MP3を取得してSDKに渡すというもの。タイムアウトは8秒、再試行は3回で、12秒たっても音声が得られなければ文字の表示に切り替える。セットアップでは、トークンの末尾をCRではなくLFにする必要があった。また、再書き込みの後にWi-Fiとペアリングの設定が消える現象もあったが、原因は分かっていない。変更点はパッチファイル（patches/0002-google-tts.patch）として別のリポジトリで公開されている。\n【ポイント・注意点】話し終えてから声が出るまでは約8秒かかる。リアルタイム音声は検証していない。長い返答の途中でまれに再起動したことが一度あるが、再現はできていないという。応答の速さや安定性にはまだ課題があるものの、テキストしか返さないAIサービスに外部の音声合成を後付けする手法として参考になる。パッチとして公開されているため、同じ機材を持つ人が試しやすい点も魅力だ。同様の構成を作る際は、タイムアウトや文字表示への切り替えといった失敗時の設計も参考にしたい。","2026-11-18","Zenn","https://zenn.dev/fujihide/articles/cf3eb84525346c"],["ラズパイとVoskでオフライン音声認識デバイスを作る","Raspberry Pi 3 Model B+とオフライン音声認識エンジンVoskを使い、話しかけた言葉に応じて音を鳴らすデバイスを作ったZenn記事。約50MBの日本語小モデルで音声を認識し、「わん」「ねこ」などのキーワードに反応して、MP3モジュールDFPlayer miniから犬や猫の音を再生する。ESP32-S3では音声モデルがフラッシュに収まらなかったため、ラズパイを選んだ経緯も記されている。","\n【概要】Raspberry Pi 3 Model B+とオフライン音声認識エンジンのVoskを使い、声に反応して音を鳴らすデバイスを作る記事がZennに公開された。ネットにつながずに日本語の音声認識ができる構成で、キーワードに応じてMP3の音を再生する。\n【背景】著者は当初、ESP32-S3-WROOM-1で同じことを試みたが、音声モデルがフラッシュメモリに収まらず失敗した。SDカードを使えるラズパイなら、その制約を避けられる。マイコンとシングルボードコンピューターの使い分けを考えるうえでも参考になる経緯だ。\n【詳細】使った部品は、Raspberry Pi 3 Model B+、MP3再生モジュールのDFPlayer mini、ダイナミックスピーカー、USBマイク。音声認識にはVoskの日本語小モデル「vosk-model-small-ja-0.22」（約50MB）を使い、PyAudioで16kHzの音声を取り込む。認識結果に「わん」「ねこ」といった言葉が含まれていれば、UART（9600ボー）でDFPlayer miniに指示を送り、「0001犬.mp3」や「0002猫.mp3」を再生する。DFPlayerのTxとRxには1kΩの抵抗を入れることを勧めている。仕組みはシンプルなキーワード照合で、大規模な生成AIは使っていない。それでも、手元の機器だけで声を文字に変え、電子回路の動作につなげられる点が魅力だ。音声で操作するおもちゃや装置づくりの入り口として、取り組みやすい構成といえる。\n【ポイント・注意点】著者自身が書いているとおり、コードにはエラー処理や再試行の仕組みが入っていない。長く使い続ける場合は、そうした処理を加える必要がある。また、約1GBの大きなモデルにも触れているが、試してはいないという。認識精度を高めたい場合の次の一歩となりそうだ。小さなモデルでどこまで実用になるかは、使う環境の雑音やマイクの位置によっても変わりうるため、実際の設置場所で確かめたい。ESP32では難しかった処理を、ラズパイに任せるという判断の具体例としても読める記事だ。","2026-11-18","Zenn","https://zenn.dev/piroft28/articles/10a81f3b06c45b"]],"muse":[["Claude Codeの新コマンド/ship、PRの作成から修正・監視まで任せた検証","Claude Codeに2026年11月23日に追加された/shipを、v2.1.331とGitHub Actionsの環境で試した検証記事。コミットからPR作成、/code-reviewによるレビューと修正、最長7日間のPR監視までを一つの流れで任せられる。わざと仕込んだ問題への対応、mainの変更で起きた競合の解消、レビューコメントへの返信までの様子を具体的に報告している。マージは人の手に残ることや、監視が止まる条件も確認した。","\n【概要】\nClaude Codeに2026年11月23日に追加された「/ship」コマンドを、実際のリポジトリで試した記録である。変更のコミットとブランチのプッシュ、PRの作成、レビューと修正、その後のPR監視までを一つのコマンドで任せられる。著者はClaude Code v2.1.331をautoモードで動かし、確認なしにPR作成まで進むことを確かめた。マージは最後まで人が行う。\n【背景】\nAIが書くコードが増えるほど、PRのレビューやCIの失敗、競合への対応が人の負担になる。/shipはこの後工程をClaudeに預けるための機能で、すでに開いているPRには監視だけを行う「/steward」も用意されている。検証ではGitHub Actions上でPython 3.12のruffとpytestを回すCIを使った。\n【詳細】\nmainにいる場合は新しいブランチを作ってからPRを開き、/code-reviewを既定の深さ「high」で実行する。著者は未使用の「import math」と、100を超える割引率を弾かない不具合をわざと仕込んだ。レビューは5件を指摘し、Claudeは2件を修正、端数の丸め方など仕様の判断が要る3件は残した。監視中に著者がmainで丸めを四捨五入に変えると、約2分で競合に気づいて解消し、プッシュした。レビューコメントにも約2分で修正と返信を返し、999円の1割引きのテストも追加した。監視は約2分ごとにPRを確認し、変化があったときだけClaudeが動く。\n【ポイント・注意点】\n「/ship terms」で示される制約として、マージや強制プッシュはできない。読むコメントは本人、書き込み権限を持つ人、github.com上のClaudeボットに限られ、「/ship +ボット名」で他のボットを加えられる。ネイティブのWindows、bypassPermissionsモード、セッションの終了、Escキー、7日の経過のいずれかで監視は止まる。常時の監視を任せる場合は、これらの停止条件をあらかじめ把握しておきたい。","2026-11-24","Zenn","https://zenn.dev/visionarray/articles/c14b6f8aa9056e"],["AnthropicがClaude Shipを公開、PRの確認と修正をエージェントに","英国のIT専門メディアITProが、AnthropicのPR向け新サービス「Claude Ship」を報じた記事。既存のCode Reviewに、ベータ版のPR StewardとClaude Approvalsを組み合わせ、レビュー、修正、承認をエージェントに任せる。TeamとEnterpriseプランのGitHubリポジトリで使える。一方でAnthropic自身が、バグやセキュリティ上の脆弱性などを見逃すおそれがあると注意を促している点も伝えている。","\n【概要】\n英国のIT専門メディアITProが、Anthropicの新サービス「Claude Ship」を伝えた記事である。ベータ版として、TeamとEnterpriseプランでGitHub上のリポジトリを対象に提供が始まった。既存のCode Reviewに、ベータ版の2つのエージェント「PR Steward」と「Claude Approvals」を組み合わせた構成になっている。執筆はNicole Kobie記者。\n【背景】\n記事は、開発者の約半数がAIの生成したコードを確認していないとされ、その一因に同僚のコードより確認に時間がかかることがあると紹介する。AIでコードを書く速さが上がる一方、確認の工程が追いつかないという課題がある。Anthropicによると、Claude Codeチームではコードの大半をClaudeが書いている。\n【詳細】\nCode Reviewは、PRを複数の観点から確認し、見つけた問題を検証して分類したうえでPRに投稿する。Code Reviewは既存の製品で、今回の2つの新しいエージェントと合わせて一つのサービスとして提供される。PR Stewardは承認もマージも行わず、プッシュのたびに何を変えたか、どう元に戻せるかをコメントで残す。Claude Approvalsは定型的な変更を自ら承認し、リスクの高い変更は人のレビュー担当に回す。Anthropicは、まず観察のみのモードで始めることを勧めている。Claude Codeチームでは、6月から9月にかけてマージされたPRが2倍以上に増え、取り消された変更は40%以上減ったという。\n【ポイント・注意点】\n記事の見出しにもある通り、Anthropic自身が、このツールは「バグやセキュリティ上の脆弱性、その他の問題を見逃す可能性がある」と警告している。人の確認をどこまで減らすかは、チームごとに慎重に決める必要がある。導入時は観察モードでClaude Approvalsの判断を確かめ、どの変更を人に回すかの方針を固めてから本格運用に移すのが現実的だろう。","2026-11-24","ITPro","https://www.itpro.com/software-engineering/anthropics-new-claude-ship-service-hands-the-reins-to-agents-to-fix-and-review-code-changes-but-the-company-warns-it-may-miss-bugs-security-vulnerabilities-or-other-issues"],["Claude Code v2.1.331、Code ModeがBedrockなどでも使える","2026年11月23日リリースのClaude Code v2.1.331の主な変更をまとめたDevelopersIOの記事。変更は135件で、実験的なCode ModeがAmazon BedrockやClaude Platform on AWSなどのターミナルセッションに対応した。claude doctorのAPI接続確認、プラグインのoptionalDependencies、Windowsでのポリシーの優先順位の変更など、更新前の確認点も整理した。","\n【概要】\n2026年11月23日にリリースされたClaude Code v2.1.331の主な更新を解説した記事である。変更は135件で、CLIが57件、VS Code拡張が78件。種類別では修正93件、新機能13件、性能改善11件、破壊的変更や予告が3件だった。\n【背景】\nCode Modeは、複数のツール呼び出しをJavaScriptでまとめてセッション内で実行する実験的な機能で、既定ではオフになっている。今回、Amazon Bedrock、Google Cloud Agent Platform、Microsoft Foundry、Claude Platform on AWSのターミナルセッションでも動くようになった。ただし11月24日時点の公式ドキュメントでは、これらはまだ未対応と書かれ、CHANGELOGと食い違っていると著者は指摘する。\n【詳細】\nclaude doctorにAPI接続の項目が加わり、HTTPステータスやエラー、テストを飛ばした理由を読み取り専用で表示する。プラグインのマニフェストでoptionalDependenciesが使えるようになり、親と一緒に入るが個別に無効化できる。MCPサーバーの不正な応答でツール呼び出しが最長30分止まる不具合や、Windowsのレジストリ管理設定に日本語などが含まれると起動しない不具合も直った。著者は東京リージョンのBedrockでCLAUDE_CODE_EXPERIMENTAL_CODE_MODE=1を設定して試し、わざと壊した4つのリンクをすべて見つけ、CloudWatchには4回の呼び出しが記録された。\n【ポイント・注意点】\n破壊的変更として、WindowsではHKLMのポリシーがmanaged-settings.jsonより優先されるようになった。著者はアップデート前にHKLM\\SOFTWARE\\Policies\\ClaudeCodeを確認するよう勧める。VS Code拡張では、VS CodeをNodeとして動かすラッパーやフック、MCPサーバーは自分でELECTRON_RUN_AS_NODE=1を設定する必要がある。11月30日以降のリリースでは、管理されたマーケットプレイスが既定で自動更新になる予定だ。","2026-11-24","DevelopersIO","https://dev.classmethod.jp/articles/20261124-cc-updates-v2-1-331/"],["OpenAIのCodex CLI 0.172.0、スレッドリンクやMCP起動を改善","OpenAIのChatGPTとCodexの変更履歴に、2026年11月24日付でCodex CLI 0.172.0が掲載された。検索結果や会話記録の中のスレッドリンクから保存済みの会話を開けるようになり、キャッシュ済みのMCPサーバーは最初のツール呼び出しで起動する形になった。11月23日のアプリ26.1120と、11月20日の0.171.0で加わった遠隔操作関連の機能もあわせて紹介する。","\n【概要】\nOpenAIのChatGPTとCodexの変更履歴に、2026年11月24日付でCodex CLI 0.172.0が掲載された。検索結果や会話記録の中のスレッドリンクから、保存済みの会話や入れ子のエージェントをターミナルで開けるようになった。Tabキーでスラッシュコマンドの引数を補完でき、Shift+UpとShift+Downでタスクのグループ間を移動できる。\n【背景】\nCodexは、Claude Codeと並ぶ代表的なAIコーディングエージェントで、CLIとアプリの両方で更新が続いている。以前のdevelopers.openai.comの変更履歴ページは、現在learn.chatgpt.comへ転送される。今回の一連の更新には、エージェントを離れた場所から動かす使い方に関わる機能も含まれている。\n【詳細】\n0.172.0では、ツール一覧がキャッシュされた標準入出力型のMCPサーバーが、既定で最初のツール呼び出しのときに起動するようになった。接続したアプリのツールごとに、承認の担当をconfig.tomlで設定できる。アプリサーバーのクライアントは、セットアップ時にAmazon Bedrock Runtimeを選べる。codex exec resumeは、サンドボックスの権限、作業ディレクトリ、ワークスペースのルートを復元する。同梱のopenai-docsスキルはGPT-6.2 AstraとSolへの移行を扱い、Code Modeはホストとの接続にすべてgRPCを使うようになった。11月23日のアプリ26.1120では、CSVファイルを表のプレビューで開けるようになった。11月20日の0.171.0では、GPT-6.2 SolとAstraがモデル一覧に加わり、Solが既定になった。\n【ポイント・注意点】\n0.171.0では、codex exec --remote <ADDR>で既存のアプリサーバー上の非対話セッションを開始・再開でき、/rcと/remoteで遠隔操作の管理や端末のペアリングコードの表示ができる。Code Modeの設定code_mode_host_grpcは非推奨になった。PCから離れた場所でエージェントを動かしたい人は確認しておきたい。掲載内容は変更履歴の要約のため、各機能の詳しい使い方は公式ドキュメントで確かめたい。","2026-11-24","OpenAI（ChatGPT & Codex 変更履歴）","https://learn.chatgpt.com/docs/changelog?type=codex"],["ログイン済みChromeをClaude Codeに任せた20日間、任せる線引き","Windows 11のClaude Codeデスクトップアプリに、ログイン済みのChromeでの作業を20日間任せた記録。A8.netの提携申請、はてなブログの公開、XやThreadsへの返信、Zennの管理画面の確認、ローカルのDifyでのアプリ作成などを担当させた。外部に出る操作は必ず承認、パスワードやカード情報は人が入力といった4つの基本ルールと、実際につまずいた点を整理している。","\n【概要】\nClaude Codeのデスクトップアプリ（Windows 11）に、普段ログインして使っているChromeでの作業を2026年10月9日から28日までの20日間任せた記録である。A8.netの提携申請、はてなブログの記事公開、Xへの返信4件とThreadsへの返信2件、Zennのダッシュボード確認、ローカルのDifyでのアプリ作成を担当させた。\n【背景】\nAIにPCのブラウザを操作させると、ログイン済みのサービスにそのまま手が届く。便利な反面、誤送信や秘密情報の漏れが心配になる。著者は「外部に出る操作はすべて承認が必要」「パスワードとカード情報は人が入力」「Chromeは頼んだときだけ前面に出す」「作業タブはClaudeのタブグループに入れ、終わったら閉じる」という4つのルールで運用した。\n【詳細】\nはてなブログでは、保存ボタン横の▼から「公開する」を選んで押す2段階で公開し、公開後にPR表記、アフィリエイトリンクの属性、タグを確認させた。Zennではデプロイ履歴が「デプロイ成功」でも、投稿数の上限で記事が飛ばされていた。A8.netの「リンクをコピー」は、Chromeが前面でタブが見えていないと「Document is not focused」で失敗した。古いクリップボードの中身で別のリンクが2か所に入ったが、URLを照合して見つけた。返信の投稿では、入力欄の文面を承認済みの文面と照らし、一致したときだけボタンを1回押す。\n【ポイント・注意点】\nChromeが他のウィンドウの裏に隠れるとvisibilityStateがhiddenになり、スクリーンショットがタイムアウトする。ブラウザツールの出力ではクエリ文字列やトークンが「[BLOCKED: ...]」に置き換わり、アフィリエイトURLは会話に出なかった。DifyのAPIキーは長さ、「app-」の接頭辞、API呼び出しの成否の3通りで確かめ、著者の許可を得て表示せずに.envへ書き込ませた。AIにPCのブラウザを任せる際の線引きとして参考になる。","2026-11-24","Zenn","https://zenn.dev/okzaq/articles/claude-code-browser-ops-delegation"],["Maxプランでもcronのclaude -pにAPI料金がかかる理由と対処","Maxプランを契約しているのに、cronで定期実行したclaude -pにAPI料金が発生する原因と対処をまとめた記事。多くの場合は環境変数ANTHROPIC_API_KEYが原因で、非対話の-pモードでは確認なしにAPIキーが使われる。確認方法、ジョブ単位でキーを外す書き方、ターン数や予算の上限、自動チャージの停止など、夜間の連続稼働に向けた備えを紹介する。","\n【概要】\nMaxプランを使っているのに、cronで回しているclaude -pにAPI料金が請求されてしまう理由と対策を解説した記事である。よくある原因は環境変数ANTHROPIC_API_KEYで、公式ドキュメントによると、このキーはサブスクリプションのログイン（/login）より優先順位が高い。\n【背景】\nClaude Codeは決まった優先順位でログイン方法を一つ選ぶ。対話モードではAPIキーを使うかどうかを一度尋ねるが、非対話の-pモードでは尋ねずに黙ってキーを使う。別のツールのために.bashrcに入れたキーを、cronジョブのclaude -pが拾ってしまうのが典型的な例だ。\n【詳細】\n確認には、対話モードの/statusで現在のログイン方法を見るほか、echo $ANTHROPIC_API_KEY（PowerShellではecho $env:ANTHROPIC_API_KEY）で変数を表示する。cronの環境は端末と違うことがあるため、envの出力をファイルに書き出して確かめる。対処は、そのジョブだけキーを外すことで、env -u ANTHROPIC_API_KEYを付けてclaude -pを起動する書き方を例に挙げる。cronからブラウザでログインできない場合はclaude setup-tokenで長期トークンを作り、CLAUDE_CODE_OAUTH_TOKENに入れる。ただしこれはANTHROPIC_API_KEYより優先順位が低いため、APIキーを外す作業は依然として必要だ。\n【ポイント・注意点】\n--max-turns 30でターン数を、--max-budget-usd 5で1回あたりの推定費用を制限できる。ただし後者は推定値で、請求額とずれたり少し超えたりすることがあるとドキュメントにある。APIアカウントの自動チャージは切っておく。Consoleの上限は月単位のため、一晩で1か月分の予算を使い切るおそれがある。著者は本物のキーの代わりに1日の上限付きのプロキシキーをAIに渡しており、そのプロキシ「Saifuban」をGitHubでオープンソースとして公開している。","2026-11-24","Zenn","https://zenn.dev/saihu/articles/af7808ab1af684"],["Claude CodeをWindowsのタスクスケジューラで定時実行、読み書きだけ許可","Windowsのタスクスケジューラからclaude -pを定時実行する際に、ファイルの読み書きだけを許可する設定を紹介したQiita記事。--tools、--allowedTools、--disallowedTools、--permission-mode dontAskの4つのオプションを組み合わせ、BashやWeb系ツール、MCPツールを禁止する。信頼されていないフォルダでの挙動や、重複実行の防止、ログと通知の仕組みもあわせて解説している。","\n【概要】\nClaude CodeをWindowsのタスクスケジューラで定時実行するとき、ファイルの読み書きだけを許す設定をまとめた記事である。claude -pに--tools、--allowedTools、--disallowedTools、--permission-mode dontAskの4つのオプションを渡し、使えるツールを絞り込む。\n【背景】\n人が見ていない時間に動く定時実行では、AIが想定外のコマンドを実行しないよう権限を絞りたい。-pで実行すると、フォルダのフックや.mcp.jsonが信頼の確認なしに読み込まれる。また信頼されていないフォルダではpermissions.allowが無視されるため、著者は設定ファイルではなくコマンドラインのフラグで制御する方式を選んだ。\n【詳細】\n--toolsと--allowedToolsには、Read、Write、Edit、Glob、Grep、Agentの6つを並べる。--disallowedToolsではBash、PowerShell、WebFetch、WebSearch、mcp__*を禁止する。dontAskを選んだのは、--permission-modeが設定ファイルのdefaultModeより優先されるためだ。公式ドキュメントに--toolsはMCPツールに効かないとあるため、11月20日にmcp__*を禁止リストに加えた。Windowsでは、Bashを禁止するとPowerShellツールも使えなくなる。11月20日にClaude Code 2.1.325で空のフォルダを使って試すと、使えるツールは6つになった。11月5日の実行は約5.5分で終わり、終了コードは0だった。\n【ポイント・注意点】\n--dangerously-skip-permissionsは隔離された環境向けのため使わなかった。--bareもAPIキーが必要で、CLAUDE.mdやサブエージェントに頼る構成と合わないため見送った。周辺の仕組みとして、マーカーファイル（.last_success_*.txt）で重複実行を防ぎ、ログをlogs\\YYYY-MM-DD_HHmm.logに残し、成功か失敗かをWindowsの通知で知らせる。","2026-11-24","Qiita","https://qiita.com/dice-k-lab/items/25f9eb7dfa66da8d10c5"],["音声メモを15分おきにAIが仕分け、決めるのは明らかなものだけ","Apple Watchで録った音声メモを、Claude Codeが15分おきに仕分ける個人システム「番頭」の運用記録。launchdで定期起動し、新しいメモがあるときだけclaude -pを呼ぶ。19日間でClaudeを123回呼び出して異常終了は0回、149件のメモのうち47件をClaudeが自分で振り分けた。少しでも迷えば本人に回すという指示が要で、運用中に見つかった問題と対策も紹介している。","\n【概要】\nApple Watchの音声メモを、15分おきにClaude Codeが日記やタスクに仕分ける個人システム「番頭（banto）」の記録である。仕組みはPythonスクリプト1本とClaude Code向けの指示ファイルで、毎回Sonnetモデルでclaude -pを実行する。11月4日から23日までの19日間で、Claudeの呼び出しは123回、異常終了は0回だった。人が判断すべきものだけを本人に回す設計になっている。\n【背景】\n音声メモは自作アプリWristJotからiPhoneを経由し、MarkdownとしてObsidianのフォルダに届く。launchdがbanto watchを15分ごとに実行し、新しいメモがなければClaudeを起動しない。以前は朝の仕分けに15〜20分かかっていたが、今は2〜3件の質問に答えるだけになったという。\n【詳細】\n149件のメモのうち、Claudeが自分で決めたのは47件で、日記が27件、タスクが20件だった。やり直しになった仕分けは5件にとどまる。指示の要は「少しでも迷ったら決めずに ask で本人に回す。」の一文だ。Claudeが使えるコマンドはmark、daily、ask、pending、showに限り、push、complete、unmark、migrate、Edit、Writeは禁止した。仕事のプロジェクトに関するメモは原文を付けずにGitHub Issuesへ送り、台帳のタイトルもぼかしている。\n【ポイント・注意点】\nファイル名のNFCとNFDの違いで同じメモが二重に並んだため、frontmatterのcreatedで識別するよう改めた。20件のメモがClaudeに渡されたのに決定も質問もされなかったので、そうしたメモはスクリプトが保留キューへ移す。&&でつないだコマンドが承認待ちで止まったため、1回の呼び出しに1コマンドと指示し、表記の揺れも許可リストに加えた。リポジトリは9月20日にgit管理を始め、以降46コミットを重ねている。","2026-11-24","Zenn","https://zenn.dev/yutakatsuhako/articles/bd375d60376bdc"],["Claude Desktopに聞き返させるか推定で進めさせるかのルール設計","Claude Desktopが質問しすぎる問題と、検証を終える前に止まってしまう問題を、ルールで両立させた事例を紹介するZennの記事。意図を推定できるなら推定を1行書いて進め、質問は4つの例外に限るという規則を定めた。確認なしで進めてよい5つの操作や、止まってよい条件、計画を示して待つ承認ゲートの4条件を整理し、条件の定義を1か所に置く考え方を示している。","\n【概要】\nClaude Desktopを使う中で起きる、正反対の2つの失敗を減らすためのルール設計を紹介した記事である。1つは質問をしすぎること、もう1つは検証を終える前に止まってしまうことだ。著者は常に読み込まれるルールのスキルにまとめ、承認を待つ場面を絞り込んだ。\n【背景】\nルール9では、意図が推定できるなら推定を1行で書いて実行し、質問はルール9の4つの例外に限るとした。対象と動作をはっきり示した依頼、たとえば「この記事を公開して」は承認とみなし、改めて聞き直さない。一方、バックアップもgitの履歴もないファイルを置き換える操作は、取り返しのつかない外部への操作として扱う。\n【詳細】\n確認なしで進めてよいのは、範囲内のファイルやログ、画面の読み取り、冪等な呼び出しの再試行、作業フォルダ内での差分編集、一時領域への中間出力、構文チェックのような読み取り専用の確認の5つ。止まってよいのは4つの例外に加え、CLAUDE.mdやプロジェクトのルール、フックが確認を求める場合、ユーザーが明示的に禁じた場合、別の方法を2つ試して両方失敗した場合だ。ルール11では、依頼された作業を「続けますか」と止めずに最後まで終えるよう定める。承認ゲートの手順1.5は、新しいFBやマクロ、複数ファイルの編集や検証ロジックの変更、1冊の本の章立て、設定値やしきい値の4条件。前の3つは計画を示して影響のない部分を進め、しきい値や設定だけは返事を待つ。承認ゲートは検証停止のスキルのルール3でも使われ、「できない」といった結論や根本原因を書くとき、手順1.5に当てはまるときに働く。画像判定のスキルでは、しきい値や帯の位置、判定条件を決めるときに使い、単なる計測や集計は待たずに進める。\n【ポイント・注意点】\nCLAUDE.md、プロジェクトの規約、フックはスキルより優先される。禁止事項が理由を失ったときは、AIが理由とともに削除を提案し、承認を得てから外す。運用中にAIが自分で消すことはない。条件の定義を1か所にまとめ、そこを正とする考え方が要点だ。","2026-11-24","Zenn","https://zenn.dev/kensho_ya/articles/claude-desktop-ask-or-infer-approval-gate-rules"],["Claude CodeからMCPで実機のiPhoneを操作する方法","Claude CodeなどのMCPクライアントから、脱獄なしで実機のiPhoneの画面を見てタップさせる方法を紹介するdev.toの記事。約7ドルのマイコンボードをiPhoneのUSBポートにマウスとキーボードとして挿し、PCとはBluetoothでつなぐ。対応機種、ファームウェアの書き込みからClaude Codeへの登録までの手順と、ASCII以外の文字を入力できないなどの制約を整理してまとめている。","\n【概要】\nClaude CodeなどのMCPクライアントから、実機のiPhoneの画面を見てタップできるようにする方法を、Manina AI（Holomix, Inc.）が紹介した記事である。脱獄は不要で、オープンソースのESP32 iPhone Agentを土台にしたManina AIのCLIを使う。PCのAIが、Bluetoothでつながった小さなボードを通じて、iPhoneをマウスとキーボードで操作する仕組みだ。\n【背景】\n使うハードウェアは、約7ドルのSeeed XIAO ESP32S3（フラッシュ8MB、PSRAM 8MB）。iPhoneのUSBポートにマウスとキーボードとして挿し、PCとはBluetoothで通信する。対応するのは、iOS 18以降のiPhone XS以降、またはiOS 16.4以降でTestFlightアプリ1.0.9以降を入れたiPhone 8やXである。\n【詳細】\nファームウェアはChromeかEdgeのブラウザ用インストーラーで書き込む。CLIにはファームウェアv0.2.2以降、任意のWi-Fi接続にはv0.2.3以降が必要だ。CLIはcurl、npm（Node 18以降）、npxのいずれかで入れ、ボードの電源を入れてから3分以内にesp32agent pairでペアリングする。iPhone側では、ボードのホットスポットに接続し、画面ミラーリングで「ESP32 Agent」を選び、AssistiveTouchをオンにする。Claude Codeにはclaude mcp addでesp32agentを登録し、esp32agent skill installを実行する。Claude Codeのプラグインを使えば両方を一度に済ませることもできる。スクリーンショットは480×1040で、BLE経由の映像は最大5fpsとなる。\n【ポイント・注意点】\n文字入力はASCIIのみで、パスコードの入力、Apple Pay、DRM付きの動画には対応しない。端末がロックされるとミラーリングが止まり、横画面のアプリにもまだ対応していない。ライセンスはMITだが、ファームウェアのAirPlay受信部分はGPL-3.0となっている。PCのAIからスマートフォンの実機に手を伸ばす接続方法の一つとして参考になる。","2026-11-24","dev.to","https://dev.to/maninaai/how-to-let-claude-code-or-any-mcp-client-control-a-real-iphone-fi7"],["タスクをBeadsでAIの外に置き、Claude障害時にCodexへ即引き継ぎ","タスクと意思決定ログをBeadsでAIエージェントの外に保管していたため、Claudeに障害が起きた際にもCodexへすぐ作業を引き継げた事例を紹介するDevelopersIOの記事。CodexにはBeadsから状況を読み、作業を始めずに整理するよう依頼した。小さなPython製CLIを題材に、引き継ぎ時点の状態、実行設定、確認できた点と限界を報告している。","\n【概要】\nClaude CodeとCodexの両方が、Beadsに保管したタスクと意思決定ログを読む運用にしていたところ、Claudeの障害時にCodexへすぐ作業を引き継げたという記事である。著者はCodexに、作業は始めずにプロジェクトの状況を確認して整理するよう、プロンプトを1回送った。Codexは、終わったこと、終わっていないこと、著者の判断が必要なことをまとめて返した。\n【背景】\nBeadsはAIコーディングエージェント向けの課題管理ツールで、bdコマンドで課題と依存関係を管理し、bd rememberでリポジトリ内のローカルDBに記憶を残す。Codexはもともと同じ運用ルールに従っており、セッション開始時にbd primeの出力を差し込むフックも持っていた。\n【詳細】\n題材は、家計簿のCSVを月ごとに集計する小さなPython製CLIである。引き継ぎ時点では、CSVの読み込みが完了、月別集計が進行中、整形が未着手で、金額のカンマ区切りに関するP3のバグがあった。金額は浮動小数を使わず整数の円で持つという決定が記録済みで、月をまたぐ返金の扱いは2案のまま判断待ちだった。実行はcodex execで、モデルはgpt-6.2-sol、推論の強さはlow、サンドボックスはworkspace-write。バージョンはbd 1.3.4、Claude Code 2.1.331、codex-cli 0.169.0である。Codexはbd ready、bd list --json、bd list --status=closed --jsonを実行し、課題の状態とgitの履歴は変わらなかった。「始めない」という指示はbd rememberで制約として記録した。\n【ポイント・注意点】\n結果は著者独自のルールとフックに支えられたもので、素の設定では試していない。著者は、タスクと意思決定ログを特定のエージェントの中に閉じ込めず外に置くことを勧め、まずbd setup codexから始めるよう提案している。Claudeの障害時にも作業を止めないための備えとして参考になる。","2026-11-24","DevelopersIO","https://dev.classmethod.jp/articles/beads-handoff-claude-code-to-codex/"],["Claude CodeのMCP許可リスト、ローカルとクラウドで書き方が違う","Claude Enterpriseの導入に向けてClaude Codeの統制を設計する中で、MCPサーバーの許可リストがローカルとクラウドのセッションで異なる動きをすることを検証したDevelopersIOの記事。クラウドではセッションのプロキシがコネクタのURLを書き換えるため、URLで個別のコネクタを選べない。Google DriveとBoxを使った検証結果と、推奨する許可リストの書き方を紹介している。","\n【概要】\nClaude Enterpriseの導入に合わせてClaude Codeの統制を設計する中で、MCPの許可リストがローカルとクラウドのセッションで違う書き方を必要とすることを確かめた記事である。設定にはallowManagedMcpServersOnlyと、allowedMcpServers、serverUrlを組み合わせて使った。\n【背景】\nクラウドのセッションでは、セッションのプロキシがコネクタのURLを書き換える。そのため、コネクタ本来のURLを書いたserverUrlは一致しない。検証ではGoogle DriveとBoxの両方をコネクタとして追加し、許可リストにはGoogle Driveだけを載せた。\n【詳細】\nローカルのセッションでは、/mcpに「claude.ai Google Drive」だけが表示されて使え、Boxは止められた。同じ許可リストのままクラウドのセッションで試すと、どちらのコネクタも動かなかった。mcp-proxy.anthropic.com配下を加えても効果はなく、すべてのhttpsやapi.anthropic.com配下全体を許可すると両方が動いた。api.anthropic.com配下のv2/ccr-sessions/*、v1/code/sessions/*、v1/code/mcp/*の3つのパスを許可しても、クラウドでは両方が動いた。ただしローカルでは、この3つだけだと「No MCP servers configured」になった。クラウドのコネクタはすべて同じプロキシのパスを通るため、URLの許可リストで個別のコネクタを選ぶことはできない。\n【ポイント・注意点】\n著者は、クラウドでのコネクタの制限はclaude.aiの管理コンソールで行うよう勧める。推奨する許可リストは、ローカル用のGoogle DriveのURLと、クラウド用の3つのプロキシパスの組み合わせだ。止められたコネクタには理由が表示されず、クラウドではサイドパネルからコネクタの欄が消えるだけになる。設定はセッション開始時に読み込まれるため、変更のたびに新しいセッションを始める必要がある。","2026-11-24","DevelopersIO","https://dev.classmethod.jp/articles/claude-code-mcp-allowlist-cloud-session/"],["Claude Codeのフック、Windowsでパスを\\で書くと黙って動かない","Windows上のClaude Codeで、フックのコマンドパスをバックスラッシュで書くと、エラー表示もなくフックが動かない現象を検証した記事。Git for Windowsがある環境では、フックのcommandがGit Bashのコマンドラインとして実行されるため、終了コード127で失敗する。書き方ごとの検証結果と、スラッシュとダブルクォートを使う対処法、失敗時に操作を止めるonFailureの設定を紹介している。","\n【概要】\nWindowsで、Claude Codeのフックに書いたパスをバックスラッシュで区切ると、フックが何も言わずに動かなくなる現象を検証した記事である。2026年11月24日にClaude Code 2.1.330で試したところ、Git for Windowsが入った環境では、フックのcommandがGit Bashのコマンドラインとして実行されていた。\n【背景】\nフックは、危険な書き込みを止めるといった安全策に使われる。ところが、フックが起動しなかった場合でも操作はそのまま通ってしまう。終了コードの意味は、0が成功、2が操作の阻止で、1や127などは操作を止めないエラーとして扱われる。127は「コマンドが見つからない」を表す。\n【詳細】\nバックスラッシュで書いたdeny.cmdのパスではフックが動かず、書き込みが通ってClaudeは「DONE」と返した。スラッシュで書いた場合や、バックスラッシュのパスをダブルクォートで囲んだ場合は、フックが動いて書き込みを止めた。スペースを含むパスをクォートなしで書くと動かなかった。--debug hooksで見ると、ログに「finished with status 127 (42ms)」と残っていた。公式リポジトリのIssue #109103でも、v2.1.322について同じ挙動が報告されている。試験用のdeny.cmdは標準入力を読み、標準エラーにメッセージを書いてexit /b 2を実行するもので、改行コードはCRLFで保存する。claude -pに--settingsと--permission-mode acceptEditsを付けて試し、書き込まれたファイルが存在すればフックは動いていないと判断する。\n【ポイント・注意点】\n対処は、パスを/で書き、パス全体をダブルクォートで囲むこと（JSONではエスケープが必要）。v2.1.295以降で使えるonFailureにblockを指定すると、フックの起動に失敗したときに操作を止められる。args配列（exec形式）を使えばシェルを通さずに済むが、Windowsではcommandにpythonのような実行ファイルを指定する必要があり、.cmdや.batは使えない。安全策としてフックに頼る場合は、実際に止まるかを一度試しておくことが大切だ。","2026-11-24","Zenn","https://zenn.dev/kamijo_aoto/articles/claude-code-hook-windows-path-127"],["AIの並行作業で増えるgit worktreeを1つの窓で見渡すアプリ","複数のAIエージェントを別々のgit worktreeで並行して動かすと、どれが何をしているか分からなくなる。この問題を解くため、著者がMac向けに自作したアプリを紹介するQiita記事。worktreeを処理中から完了まで4列に分け、AIの状態や最後の依頼、未コミットのファイル数などをカードで表示する。仕組みと、運用中に見つかった落とし穴もあわせてまとめている。","\n【概要】\nAIエージェントを複数のgit worktreeで並べて動かすと、どれがどの作業か追いにくくなる。そこで株式会社qnoteの著者が個人用に作ったMacアプリを紹介した記事である。worktreeを「処理中」「実装済み（未push）」「push済み・MR」「完了」の4列に分けて一覧できる。AIが返事を待っている作業や、まだpushしていない作業をすぐ見つけられるようにするのが狙いだ。\n【背景】\n未コミットの変更があるworktreeは、MRが開いていても処理中に置く。メインのフォルダは列の上に別枠で表示する。各カードには、AIの状態（作業中、返事待ちはオレンジ、終了）、会話のタイトル、最後の依頼、現在の手順が出る。コンテナやターミナルの状態、未コミットのファイル数、MRやPRの番号も確認できる。\n【詳細】\nAIの状態は、claudeやcodexのプロセスが動いているかどうかと、Claude Codeの会話ログの最終行から推定する。カードをクリックするとVS Codeでフォルダが開き、MRのラベルを押すとレビュー画面が開く。起動時には、マージ済みでクリーンかつ何も動いていないworktreeを片付け、元に戻せるようゴミ箱へ移す。アプリは常駐せず、開いたときか「集計し直す」を押したときだけ集計する。Pythonスクリプトがgitの情報からHTMLを作り、小さなSwiftアプリがそれを表示する仕組みで、git fetchは実行せず、片付け以外でリポジトリに書き込むこともない。\n【ポイント・注意点】\n運用の中で見つかった落とし穴として、gitignoreされたファイルが残る場合と、stashにブランチの作業が入っている場合があった。現在は名前付きのstashがあるブランチを残すようにしている。片付けではファイルをゴミ箱へ移すため、誤って片付けても元に戻せる。並行して動かすエージェントの数が増えるほど、状況を人が一目で把握できる仕組みの価値は高まる。その具体例として参考になる記事だ。","2026-11-24","Qiita","https://qiita.com/y_tsubasa/items/5f7aedbf06e06cc1f844"],["CLAUDE.mdとメモリに何を書くか、5か月で211件の運用記録","Claude Codeを約5か月使い、メモリが211件に増えた著者が、CLAUDE.mdとメモリに何を書いているかを公開したZennの記事。CLAUDE.mdとメモリの索引は毎回すべて読まれるため短く保ち、詳細は必要なときだけ開くファイルに分ける。メモリの種類別の件数、人の判断とAIの推測を分ける印の付け方、長くなった索引を2回外に出した経緯を紹介している。","\n【概要】\n7月からClaude Codeを使い続け、2026年11月24日時点でメモリが211件になった著者が、CLAUDE.mdとメモリの中身と運用を紹介した記事である。作業フォルダのCLAUDE.mdは51行、1,345文字。メモリはユーザーフォルダの.claude/projects配下の、フォルダごとのmemoryディレクトリに置かれている。\n【背景】\nCLAUDE.mdとメモリの索引（MEMORY.md）は、セッションのたびにすべて読み込まれる。そのため両方を短く保ち、詳細は必要なときだけ開くファイルに分けている。CLAUDE.mdには5つのルールを置き、たとえば圧縮の後は最新の引き継ぎ欄を読む、トークンが少なくなったら引き継ぎを書く、といった内容を記している。\n【詳細】\n記録された失敗とその回数も残す。heredocでバックスラッシュが消えたのが5回、BOMのない.ps1をPowerShell 5.1が誤読したのが2回、ダブルクォート内のバッククォートで失敗したのが1回だ。メモリは1ファイル1事実で種類のヘッダーを付け、索引には1ファイル1行で載せる。211件の内訳はproject 115件、feedback 81件、reference 12件、user 3件。索引166行のうち46行には、日付付きの「User明示」や「User指摘」の印を付け、ユーザーが決めたこととモデルの推測を区別する。feedbackには「Why」と「How to apply」の欄を設けている。\n【ポイント・注意点】\n索引は2回外に出した。1回目は長い索引行41行の全文を別ファイルへ移し、11月9日の2回目は110文字を超える行を移して、終わったプロジェクトの行を消した。それでも索引は166行、19,257文字ある。メモリにある名前やパスを使う前には今も存在するかを確かめ、食い違えば現実を優先してメモリを直す。コードやコミット履歴で分かる事実は保存せず、理由や人の判断、外部の事情だけを残している。","2026-11-24","Zenn","https://zenn.dev/suisei498/articles/5ca25f418f7b01"],["/code-reviewと自作10エージェント、小規模は互角で大規模は6倍差","Claude Code標準の/code-reviewと、著者が自作した複数エージェントのレビュー用プラグインを比べた4回連載の最終回。小規模な4つのプロジェクトでは、/code-reviewに30行のチェックリストを足すだけで約3分の1の費用で互角だった。一方、8万3千行のNestJSのモノレポでは、見つけた本物のバグの数に約6倍の差が出た。費用と規模に応じた使い分けを提案している。","\n【概要】\nClaude Codeに組み込まれた/code-reviewと、著者が自作した複数エージェントのレビュー用プラグインを比べた、4回連載の第4回である。小規模なプロジェクトでは互角だったが、8万3千行の規模では約6倍の差がついた。\n【背景】\n比べたのは、Go（827行）、Rust（1,217行）、NestJS（6,721行）、Python（6,317行）の4つの小規模プロジェクトと、8万3千行のNestJSのモノレポだ。チェックリストはCLAUDE.local.mdに置き、結果は2つのOpusが目隠しで採点した。比較対象はすべてSonnetで動かしている。\n【詳細】\n小規模な4プロジェクトでは、/code-reviewに30行のチェックリストを加えるだけで、自作のレビューと同等の結果を約3分の1の費用で出せた。8万3千行では、/code-reviewが確認した本物のバグは28〜36件、自作は209〜216件だった。1回あたりの費用は、チェックリスト付きの/code-reviewが3.77ドル、自作が55.33ドル、モジュールごとに探索役を1つ置く混合型が41.80ドル。混合型は本物のバグの約95%を約75%の費用で拾えた。自作のレビューは、Dockerの静的解析ツール、最大1万行のモジュール分割、モジュールごとに4つのレビュー役、各指摘の反証を試みる検証役を使い、指摘をWILL_BREAK、WILL_COST、WILL_ROTの3段階に分類する。/code-reviewはmediumとhighでは1つのサブエージェントが8つの観点を担い、観点ごとに最大6件の候補を出し、検証役は置かない。\n【ポイント・注意点】\n/code-review maxは小規模プロジェクトで181ドルかかり、プランの利用上限に達して結果が出なかった。著者は、約7千行まではチェックリスト付きの/code-review high、約1万5千行からはモジュールに分けることを勧める。実行ごとに結果がぶれるため、レビューは2回走らせるよう助言している。","2026-11-24","dev.to","https://dev.to/mkarytka/code-review-vs-my-10-agent-code-reviewer-a-tie-on-small-projects-6x-behind-on-83k-lines-fc7"],["Claude Codeのmodで会話の横にMusicの操作パネルを常駐","Claude Codeのmod（拡張）を使い、会話の横にmacOSのMusicアプリの操作パネルを常駐させたQiitaの記事。再生中の曲名とアーティストを30秒ごとに更新し、キー操作で再生や曲送りができる。デスクトップのパネルには画像部品がないため、ジャケット画像をSVGの色セルで描いた工夫や、組み込みのplugin-authoringスキルでClaudeに作らせた経緯、つまずいた点を紹介している。","\n【概要】\nClaude Codeのmodを使って、会話の横にmacOSのMusicアプリのコントローラーを常駐させた記事である。パネルにはMusicで再生中の曲名とアーティストが表示され、30秒ごとに更新される。キー操作は、Pで再生と一時停止、Nで次の曲、Lで歌詞の表示、Dで入力欄に/djを入れる。\n【背景】\nmodは、ターミナルではv2.1.287以降、デスクトップアプリではv2.1.286以降で使える。著者はv2.1.328で、組み込みのplugin-authoringスキルを使ってClaudeにmodを書かせた。構成はplugin.json、hooks.json、register.tsx
