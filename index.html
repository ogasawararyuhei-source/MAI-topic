1,599ポンド以上で210ポンド引き、3,299ポンド以上で480ポンド引き、4,999ポンド以上で820ポンド引き、8,199ポンド以上で1,400ポンド引き、11,999ポンド以上で2,400ポンド引きだ。【ポイント・注意点】本記事はスポンサー提供の内容で、xToolの製品を好意的に紹介している。価格は英国ポンド建てで、日本の価格とは異なる。割引はチェックアウト時に自動適用されるという。O1 Omniは予約販売の段階で、出荷時期の確認が必要な場合がある。購入前に、自分の作りたい製品に対応するエディションかどうかを確認したい。","2026-11-12","Stuff","https://www.stuff.tv/sponsored/get-creative-this-black-friday-with-exclusive-savings-from-xtool/"],["HeyGears「G1X」、1000万色超のUV 3Dプリンターが登場","HeyGearsのUV 3Dプリンター「G1X」がHacksterで紹介され、2026年11月12日に記事が更新された。8チャンネルのi3200-U1HDプリントヘッドで1000万色以上を再現し、解像度は1,400×2,400dpi、最大5mmのテクスチャ表現が可能という。Kickstarterでは3,599ドルからで、12月の出荷を予定している。フィギュアや造形物のフルカラー出力に関心のあるメーカー向けの内容だ。","\n【概要】HeyGearsのUV 3Dプリンター「G1X」がHacksterで紹介され、2026年11月12日に記事が更新された。8チャンネルのi3200-U1HDプリントヘッドで1000万色以上を再現し、解像度は1,400×2,400dpi、最大5mmのテクスチャ表現が可能という。Kickstarterでは3,599ドルからで、12月の出荷を予定している。【背景】UV 3Dプリントは、光硬化樹脂にUVインクで色を付けることで、フルカラーの造形物を1台で作れる技術だ。従来の単色3Dプリントでは後から塗装が必要だったが、色付きのまま出力できれば、フィギュアや試作モデルの手間が大きく減る。HeyGearsは産業向けの3Dプリントで実績のあるメーカーだ。【詳細】G1Xは8チャンネルのi3200-U1HDプリントヘッドを搭載し、1000万色以上の色再現をうたう。8色のインクチャンネルを組み合わせることで色を表現し、フィギュアや建築模型、医療模型など、色が重要な造形物の試作に向いている。解像度は1,400×2,400dpiで、最大5mmのテクスチャ表現が可能という。Kickstarterでの価格は3,599ドルからで、12月の出荷を予定している。記事は2026年7月24日に公開され、11月12日に更新されたものだ。更新時点ではクラウドファンディングの実施中または実施直後の段階で、出荷時期や最終仕様は今後の発表に左右される。【ポイント・注意点】1000万色や解像度、テクスチャの数値はメーカー側の発表に基づくもので、実際の出力品質は素材や設定によって変わる。Kickstarterの価格は早期支援者向けのもので、一般販売時の価格とは異なる場合がある。クラウドファンディングの製品は、出荷の遅れや仕様変更のリスクがある。実施状況は支援ページで随時更新される。支援を検討する際は、リターン内容や出荷予定、返金条件をよく確認しておきたい。購入を検討する際は、支援ページの最新情報や、出荷実績の報告を確認したい。","2026-11-12","Hackster.io","https://www.hackster.io/news/heygears-new-g1x-uv-3d-printer-can-mix-more-than-10-million-colors-for-brighter-3d-prints-424123c1c2da"],["ローランド「TrueVis MG2」、UV印刷とカットを1台に統合","ローランドDGのUVプリンター／カッター「TrueVis MG2シリーズ」を紹介する記事が2026年11月11日に公開された。64インチのMG2-640と30インチのMG2-300の2機種で、新開発プリントヘッドと波形制御により従来機の約2倍の生産性をうたう。CMYK・ホワイト・グロスを最大5層まで1パスで重ねられ、72種のテクスチャライブラリも内蔵する。オプションのオレンジ・レッドインクで色域も広がる。","\n【概要】ローランドDGのUVプリンター／カッター「TrueVis MG2シリーズ」を紹介する記事が2026年11月11日に公開された。64インチのMG2-640と30インチのMG2-300の2機種で、UV印刷と輪郭カットを1台に統合している。新開発のプリントヘッドと波形制御技術により、従来のMGシリーズの約2倍の生産性をうたう。【背景】看板やラベル、パッケージ試作などの分野では、印刷とカットを別々の工程で行うと手間と時間がかかる。印刷とカットを1台でこなすプリンター／カッターは、工程を短縮し、付加価値の高い特殊効果にも対応できる。UV印刷は白インクやグロス、立体的な質感を表現できるため、装飾性の高い製品に適している。【詳細】MG2シリーズは、新開発のプリントヘッドと高度な波形制御技術で、印刷速度とインクの着弾精度を高めたという。Variable Dot TechnologyとTrue Rich Color設定により、細部の表現や滑らかな階調、色再現を向上させている。オプションのオレンジとレッドのインクで、標準CMYKの色域を広げられる。シングルパス多層印刷により、CMYK・ホワイト・グロスを最大5層まで同時に重ねられ、テクスチャやエンボス、立体的な効果を作れる。72種のテクスチャライブラリも内蔵する。用途はステッカーやラベル、パッケージ試作、販促物、窓グラフィックス、装飾ディスプレイなどだ。自動メディア設定とキャリブレーション、自動ファブリックワイパー、1,000ミリリットルのインクパウチによる交換頻度の低減、再設計された巻き取りシステムによる連続生産への対応も特徴だ。VersaWorks 7 RIPソフトとRoland DG Connectによる遠隔監視・生産分析にも対応する。【ポイント・注意点】「約2倍の生産性」はメーカー側の発表に基づくもので、印刷条件によって変わる。価格は記事には示されておらず、正規販売代理店経由での案内となる。MG2シリーズは2026年9月に発表された製品で、今回の記事は米国での紹介記事だ。導入時は、自社の用途に合うサイズ（64インチか30インチか）や、必要なインク構成を確認したい。","2026-11-11","Impressions Magazine","https://impressionsmagazine.com/news/roland-dg-truevis-mg2-series-uv-printer-cutters/170988/"],["PRINTING United 2026注目32製品、UV機が多数ランクイン","PRINTING United Expo 2026で注目された32製品を紹介するフォトギャラリーが2026年11月11日に更新された。Agfa Onset Panthera FB3216は16,297平方フィート毎時、Epson SureColor V4000はA1+対応のUVフラットベッド、ローランドTrueVis MG2は5層印刷が特徴だ。自動化とハイブリッド機が会場の主流だったという。","\n【概要】PRINTING United Expo 2026で注目された32製品を紹介するフォトギャラリーが、2026年11月11日に更新された。ラスベガスで開かれた展示会の会場で目を引いた製品を、会社名のアルファベット順に並べ、仕様とともに紹介している。自動化やハイブリッド機、インテリア向けメディアが会場の主流だったという。【背景】PRINTING Unitedは北米最大級の印刷見本市で、ワイドフォーマットやUV印刷、ラベル、包装などの最新機種が集まる。2026年の会場では、高速化と省人化、剛性とロールの両対応が目立った。32製品のギャラリーは、会場全体の傾向をつかむ手がかりになる。【詳細】UV関連の注目製品として、Agfa Onset Panthera FB3216は段階的UV LED硬化により、ニスなしで2パスのサテンと高光沢仕上げを実現し、出力速度は時速16,297平方フィートに達する。Arcus PrintersのMonarch FB1218は、円筒形ドリンクウェア向けのロータリーユニット内蔵、3D立体エンボス用のSoft-Flex UVインク、ビジョンスキャンカメラ、ロール・ツー・ロールUV DTFアタッチメントを備える。Epson SureColor V4000は27.5×38.5インチのベッドに7.8インチのメディア対応高さ、10色インクエンジンを備え、点字印刷にも対応する。Mimaki JFX220-2515は最大98.4×59.1インチの印刷面積で、厚さ4インチ（101.6mm）までの媒体に対応する。ローランドTrueVis MG2シリーズはホワイトインクやグロスバーニッシュ、3Dテクスチャ、最大5層印刷を1パスで行える。Vanguard Cumberlandは毎時6,588平方フィート（164枚）で、同社最速のモデルだという。【ポイント・注意点】記事は2026年11月9日公開、11月11日更新のフォトギャラリーで、各製品の紹介は短い。速度や仕様はメーカー発表に基づく最大値で、実際の生産速度は条件によって変わる。価格は示されていない。会場の製品を網羅したものではなく、編集部が注目した32製品の抜粋だ。","2026-11-11","Big Picture","https://bigpicturemag.com/2026-printing-united-show-report/"],["2026年のUVプリンター5選、xTool公式が価格帯別に紹介","xTool公式のUVプリンター購入ガイドが2026年11月11日に公開された。O1 Omniは2,499ドルから、eufyMake E1は2,409ドル、Procolored V11 Proは5,999ドル、Epson SureColor V1070は9,299ドル、Roland VersaOBJECT BD-8は11,595ドル。用途と予算に応じた選び方がまとめられている。メーカー公式のガイドのため、自社製品に有利な構成になっている点には注意が必要だ。","\n【概要】xTool公式のUVプリンター購入ガイドが2026年11月11日に公開された。O1 Omni、eufyMake E1、Procolored V11 Pro、Epson SureColor V1070、Roland VersaOBJECT BD-8の5機種を、価格帯と用途別に紹介している。2,499ドルから11,595ドルまでの幅広い価格帯をカバーする。【背景】UVプリンターは、個人のクラフトから業務用の生産まで、用途によって適した機種が大きく異なる。価格帯も2,000ドル台から1万ドル超まで幅広い。メーカー公式のガイドは、自社製品を軸にしながら、他社製品も並べて比較する形を取ることがある。価格帯が2,000ドル台から1万ドル超まで幅広いため、用途に合わない機種を選ぶと無駄が出やすい。比較記事は、選び方の目安を示す役割を果たしている。【詳細】紹介されているのは、xTool O1 Omniが2,499ドルから、eufyMake E1が2,409ドル、Procolored V11 Proが5,999ドル、Epson SureColor V1070が9,299ドル、Roland VersaOBJECT BD-8が11,595ドルだ。O1 OmniはUV印刷に加えてUV DTFや布地印刷にも対応する多機能機、E1は個人向けのUVプリンター、V11 ProはA3対応の業務寄り機、V1070はエプソンの業務用UVフラットベッド、BD-8はローランドの小型UVプリンターという位置づけだ。記事では、用途と予算に応じた選び方の目安がまとめられている。【ポイント・注意点】本記事はxTool公式のガイドで、自社製品のO1 Omniが中心に紹介されている。他社製品の価格や仕様は記事公開時点のもので、セールや為替で変わる。購入を検討する際は、公式ガイドだけでなく、第三者のレビューや実機の試作結果も確認したい。UVプリンターはインクの目詰まりなどメンテナンス負担があるため、運用コストも含めて検討する必要がある。","2026-11-11","xTool","https://www.xtool.com/blogs/buyer-guide/best-uv-printer"],["xTool O1 Omniの疑問に回答、インク切れ時は20%で停止","xTool O1 Omniのよくある質問をまとめた記事が2026年11月10日に公開された。Single UV、Dual UV、UV+DTの3エディションの違いや、UV DTFに必要なラミネーター、ローラーフィーダーの要否などを解説する。インクが不足すると印刷は20%で止まり、スリープ状態になるという注意点もある。インクは週4万本以上が生産され、12月まで一部品薄が続く見通しだという。スポンサー記事である。","\n【概要】xTool O1 Omniのよくある質問をまとめた記事が2026年11月10日に公開された。Single UV、Dual UV、UV+DTの3エディションの違いや、UV DTFに必要な機材、ローラーフィーダーの要否などを解説する。著者自身がDual UV版を所有しており、実体験に基づく回答が中心だ。【背景】O1 Omniは2026年に登場したxTool初のUVプリンターで、3つのエディションや多数のアクセサリーがあるため、購入前の疑問が多い。Single UVはCMYKと硬質ホワイトのUVインク、Dual UVはさらにUVインクを追加、UV+DTは2つ目のヘッドを布地印刷用に使う構成だ。エディションによってできることが変わるため、選び方の整理が求められている。【詳細】記事では、3エディションの違いとして、Single UVが入門向け、Dual UVがUVインクの幅を広げたもの、UV+DTが布地印刷もできる構成だと説明されている。UV DTFを作るにはローラーフィーダーは不要だが、Bフィルムを貼るラミネーターは必要だという。UV DTFと衣類用のDTFは別物で、UV DTFは硬質素材向け、衣類用DTFは布地向けという違いも解説されている。インクが不足すると、印刷は20%のところで止まり、スリープ状態になるという注意点もある。インクの棚寿命は12か月とされている。供給面では、xToolがインクの増産を進めており、週4万本以上の生産体制で、12月まで一部品薄が続く見通しだという。ブラックフライデーでは50ドル引きのコード「XTOOLGIFT50」も紹介されている。【ポイント・注意点】本記事はスポンサー記事で、xToolの製品を好意的に紹介している。インクの品薄や出荷時期は2026年11月時点の情報で、変わる可能性がある。エディションは工場出荷時の構成で、後から別の構成に変更することはできないとされている。購入前に、自分の作りたいものに対応するエディションかどうか、必要なアクセサリーを含めた総コストを確認したい。","2026-11-10","The Quiet Grove","https://thequietgrove.com/xtool-o1-omni-uv-printer-faqs-your-top-questions-answered/"],["英印刷会社MLG、UVフラットベッド「Nyala 5」を導入","スコットランドの商業印刷会社McAllister Litho Glasgow（MLG）が、swissQprintのUVフラットベッドプリンター「Nyala 5」を導入したと2026年11月10日に報じられた。3.2×2メートルのベッドで最高速度は毎時253平方メートル。CMYKにホワイトとバーニッシュを加え、ロール対応も備える。過去2年間でワイドフォーマットへ100万ポンド超を投資しており、ワイドフォーマット事業は全体の約20%を占める。","\n【概要】スコットランドの商業印刷会社McAllister Litho Glasgow（MLG）が、swissQprintのUVフラットベッドプリンター「Nyala 5」を導入したと2026年11月10日に報じられた。ワイドフォーマット需要の急増に対応するための投資で、店頭販促物や看板、ディスプレイ、窓グラフィックス、床用ビニールなど幅広い用途に使われている。【背景】MLGは商業オフセット印刷が本業の家族経営の会社で、従業員45名、売上高600万ポンド、敷地面積4万平方フィートの拠点を持つ。2年前にワイドフォーマットへの投資を本格化し、ここ5〜6か月で受注が特に伸びたため、既存の設備では対応しきれなくなっていた。過去2年間のワイドフォーマットへの投資額は100万ポンドを超える。【詳細】Nyala 5は3.2×2メートルのフラットベッドを持ち、最高速度は毎時253平方メートルに達する。MLGの構成はCMYKにホワイトとバーニッシュのインクを加え、ロール・ツー・ロール対応も備える。用途は店頭販促物や看板、ディスプレイスタンド、窓グラフィックス、床用ビニールなど幅広く、地元企業から大手企業まで顧客層も広い。5mm厚のフォームフローリングなど、 demandingな素材への対応も進んでいる。ホワイトインクは窓グラフィックスの需要に応え、バーニッシュはドロップグロスなどの触感効果を可能にする。ワイドフォーマット事業は全体の約20%を占め、オフセット印刷との顧客の重なりも増えているという。ブライアン・マカリスター取締役は「Nyala 5の品質と、その品質を出す速度が際立っていた。ランニングコストと消耗品の大幅な節約も見込めた」と述べている。swissQprintのイアン・マックスフィールド氏は「MLGの成長戦略に最適な機械だ」とコメントしている。【ポイント・注意点】最高速度の毎時253平方メートルはカタログ上の最大値で、実際の生産速度は印刷品質や素材によって変わる。導入の決め手として、品質と速度に加え、ランニングコストや消耗品、信頼性、サービス体制、エネルギー消費、ダウンタイムといった総所有コストが挙げられている。記事は導入事例の紹介で、価格は示されていない。同様の投資を検討する際は、自社の受注構成や素材に合うかどうかの試作確認が欠かせない。","2026-11-10","Industrial News","https://industrialnews.co.uk/mlg-expands-wide-format-capacity-with-nyala-5/"]],"risk":[["南アで10代17人が荷台から投げ出され負傷 1人は人工呼吸器に","南アフリカ東部のクワズール・ナタール州で11月16日午前、10代の若者およそ17人を乗せた小型トラックが制御を失い道路を外れた。乗っていた若者たちは車外に投げ出され、17人が軽傷から重傷を負った。1人は現場で人工呼吸器を装着されて病院へ搬送され、ほかの負傷者も各地の病院へ運ばれた。死者はいない。警察が事故の原因を調べている。荷台に大人数を乗せる危険な移動の実態が改めて問われている。","\n【概要】南アフリカのクワズール・ナタール州インチャンガ付近のD1004号線で11月16日午前11時半ごろ、10代の若者約17人を乗せた小型トラックが制御を失って道路を外れた。乗っていた若者たちは車外に投げ出され、17人が軽傷から重傷を負った。1人は現場で人工呼吸器を装着されて病院へ搬送され、残りの負傷者もダーバンやピーターマリッツバーグの病院へ運ばれた。死者は出ていない。【背景】小型トラックの荷台に人を乗せて移動する習慣は南アフリカでは珍しくないが、荷台にはシートベルトがなく、急な操作や横転の際には乗員が投げ出されやすい。今回も約17人という大人数が1台に乗っていた。運転手の身元や若者たちの年齢は公表されておらず、なぜ制御を失ったのかもまだ分かっていない。南アフリカ警察が事故の原因を調べている。【詳細】救急サービスALSパラメディックスの報道官ギャリス・ジェイミソン氏によると、通報を受けて救急隊が現場に駆けつけ、近くの診療所でも負傷者の手当てにあたった。現場を目撃した人々も負傷者を診療所へ運ぶ手伝いをした。重傷の1人は現場で高度な救命処置を受け、人工呼吸器を装着したうえで病院へ搬送された。残りの負傷者も容体が安定してから各地の病院へ運ばれた。重傷者の容体は引き続き気がかりな状態だという。【ポイント・注意点】荷台に人を乗せる移動は、転倒や衝突の際に大けがにつながりやすい。日本では荷台への乗車は道路交通法で原則として禁じられている。海外で車に乗るときも、シートベルトのある座席に座るのが基本だ。子どもを大人数で移動させる場面では、定員と座席の確保を事前に確認し、無理な詰め込みをしないことが大切だ。事故の原因は捜査中で、続報を待ちたい。また、海外では交通ルールや車両の使い方が日本と異なる場合がある。現地で子どもを車に乗せる際は、シートベルトの有無や定員を必ず確認し、荷台や屋根に人を乗せる車両には乗せないようにしたい。事故に遭ったときの連絡先や、現地の救急番号を事前に家族で共有しておくことも大切だ。","2026-11-16","IOL","https://iol.co.za/news/south-africa/2026-11-16-17-teenagers-injured-after-being-ejected-from-bakkie-in-kzn-crash/"],["香川の小中高6校が学級・学年閉鎖 インフル疑い41人欠席","香川県教育委員会は11月16日、インフルエンザの感染などで県内の小中高校6校が学級閉鎖や学年閉鎖を行うと発表した。高松市の公立高校2校と三豊市の中学校1校、高松市・丸亀市・まんのう町の小学校3校で、インフルエンザとみられる症状で41人、別の症状で31人が欠席した。6校は16日から19日にかけて1日から3日間、閉鎖する。患者の主な症状は発熱、せき、のどの痛みで、インフルエンザA型とみられている。","\n【概要】香川県教育委員会は11月16日、インフルエンザの感染などで県内の小中高校6校が学級閉鎖や学年閉鎖を行うと発表した。対象は高松市の公立高校2校と三豊市の中学校1校、高松市・丸亀市・まんのう町の小学校3校で、インフルエンザとみられる症状で41人、別の症状で31人が欠席した。6校は16日から19日にかけて1日から3日間、学級閉鎖や学年閉鎖を行う。【背景】香川県では11月に入ってからも学級閉鎖が相次いでいる。KSBの関連記事によると、11月3日には3校、11月4日には2小学校、11月11日には高校、11月13日には2高校と1中学校が学級閉鎖を行っており、今シーズンの流行が学校現場で続いていることがうかがえる。患者の主な症状は発熱、せき、のどの痛みで、インフルエンザA型とみられている。【詳細】今回の6校では、インフルエンザとみられる症状による欠席が41人、別の症状による欠席が31人だった。閉鎖の期間は学校によって異なり、16日から19日にかけて1日から3日間の措置がとられる。県教委の発表をもとに報じられたもので、学級閉鎖か学年閉鎖かは学校ごとに判断されている。流行の中心は子ども世代で、学校や園での集団生活が広がりの場になっているとみられる。【ポイント・注意点】発熱やせき、のどの痛みがある場合は無理に登校せず、早めに受診して休養をとることが大切だ。手洗いやマスクの着用、こまめな換気といった基本的な感染対策を続けてほしい。学級閉鎖の情報は県や市の発表で確認できる。家庭では子どもの体調の変化に気を配り、熱が続くときや呼吸が苦しいときは早めに医療機関へ相談してほしい。香川県内では11月に入って学級閉鎖が相次いでおり、学校現場での流行はまだ続いている。保護者は学校からの連絡や県教委の発表をこまめに確認し、子どもの体調に変化があれば早めに対応してほしい。ワクチンの接種がまだの家庭は、かかりつけ医に相談して接種の時期を確かめておくとよい。流行のピークはこれからとも言われており、基本的な感染対策を続けることが大切だ。","2026-11-16","KSB瀬戸内海放送","https://news.ksb.co.jp/article/17054491"],["岡山県内16校園で集団風邪 患者282人 最長19日まで閉鎖","岡山県と岡山、倉敷市は11月16日、16校園でインフルエンザとみられる集団風邪が発生したと発表した。患者は計282人で、最長で19日まで休校や学年・学級閉鎖をする。対象は幼稚園1園、小学校10校、中学校2校、高校3校に及ぶ。県内では同日、岡山市の5施設でも69人が欠席して閉鎖が決まるなど、学校現場での流行が広がっている。手洗いやマスクの着用など基本的な対策の徹底が呼びかけられている。","\n【概要】岡山県と岡山、倉敷市は11月16日、16校園でインフルエンザとみられる集団風邪が発生したと発表した。患者は計282人で、最長で19日まで休校や学年・学級閉鎖をする。対象は総社市の幼稚園、玉野市や新見市、備前市などの小学校、美咲町の中学校、津山市の高校など、県内各地に広がっている。岡山市では横井小学校や幡多小学校など、倉敷市では倉敷南小学校などが含まれる。【背景】岡山県は9月28日から県下全域にインフルエンザ注意報を発令している。岡山市では9月1日から11月16日までに、保育園・幼稚園・小中学校・高校でのべ400人がインフルエンザとみられる症状で欠席した。県内では11月13日にも5校園で75人の集団風邪が発表されており、流行が学校現場で続いている。【詳細】今回発表された16校園の患者は計282人。休校や学年・学級閉鎖の措置は最長で19日まで続く。内訳は、県の管轄では幼稚園1園、小学校5校、中学校1校、高校1校、岡山市では小学校3校、中学校1校、高校1校、倉敷市では小学校4校となっている。同じ16日には岡山市の別の5施設でも児童・生徒69人がインフルエンザとみられる症状で欠席し、学年・学級閉鎖が決まった。【ポイント・注意点】学校での流行が広がる時期は、家庭での体調チェックがとくに大切だ。発熱やせきがある場合は登校を控え、早めに受診してほしい。手洗いやマスクの着用、換気といった基本的な対策を続け、閉鎖の情報は県や市の発表で確認してほしい。症状が重いときや長引くときは、かかりつけ医へ早めに相談することが大切だ。岡山県内では11月13日にも5校園で75人の集団風邪が発表されており、流行は学校現場で続いている。県は注意報を発令したままで、感染対策の徹底を呼びかけている。保護者は学校からの連絡や県・市の発表をこまめに確認し、子どもの体調に変化があれば早めに対応してほしい。ワクチンの接種がまだの家庭は、かかりつけ医に相談して接種の時期を確かめておくとよいだろう。流行のピークはこれからとも言われており、基本的な感染対策を続けることが大切だ。","2026-11-16","47NEWS","https://www.47news.jp/15239708.html"],["岡山市の小中高5施設で学年・学級閉鎖 69人が欠席","11月16日、岡山市の小学校・中学校、高校あわせて5施設で、児童・生徒あわせて69人がインフルエンザとみられる症状で欠席した。このうち中学校1施設は16日から、小学校3施設と高校1施設は17日から学年・学級閉鎖となる。岡山市の保育園・幼稚園・小中学校・高校では、9月1日から11月16日までにのべ400人がインフルエンザとみられる症状で欠席した。岡山県は9月28日から県下全域にインフルエンザ注意報を発令している。","\n【概要】11月16日、岡山市の小学校・中学校、高校あわせて5施設で、児童・生徒あわせて69人がインフルエンザとみられる症状で欠席した。このうち中学校の1施設は16日から、小学校の3施設と高校の1施設は17日から学年・学級閉鎖となる。岡山市の保育園・幼稚園・小中学校・高校では、9月1日から11月16日までに、のべ400人がインフルエンザとみられる症状で欠席した。【背景】岡山県は9月28日から県下全域にインフルエンザ注意報を発令し、マスクの着用や手洗いをするよう呼びかけている。岡山市の欠席者は前年同時期と比べて685人少なくなっているものの、11月に入ってからの流行は学校現場で続いている。同じ16日には県内全体でも16校園で282人の集団風邪が発表されており、県内各地で流行が広がっている。【詳細】今回の5施設は小学校3施設、中学校1施設、高校1施設で、欠席した児童・生徒は69人。閉鎖の開始日は施設によって異なり、中学校は16日から、小学校と高校は17日から学年・学級閉鎖に入る。9月1日以降の岡山市の累計欠席者はのべ400人で、前年同時期より685人少ない水準だという。県は注意報の発令を続け、感染対策の徹底を呼びかけている。【ポイント・注意点】発熱やせきなどの症状がある場合は無理に登校せず、早めに受診して休養をとることが大切だ。手洗いやマスクの着用、こまめな換気といった基本的な対策を家庭でも続けてほしい。学級閉鎖の情報は市や県の発表で確認できる。熱が続くときや呼吸が苦しいときは、早めに医療機関へ相談してほしい。岡山市の累計欠席者は前年同時期より685人少ない水準だが、11月に入ってからの流行は学校現場で続いている。保護者は学校からの連絡や市・県の発表をこまめに確認し、子どもの体調に変化があれば早めに対応してほしい。ワクチンの接種がまだの家庭は、かかりつけ医に相談して接種の時期を確かめておくとよい。流行のピークはこれからとも言われており、基本的な感染対策を続けることが大切だ。学校からの連絡を見落とさないよう、連絡手段の確認もしておきたい。","2026-11-16","Yahoo!ニュース","https://news.yahoo.co.jp/articles/7162c5efc923dc60e2297f3b82b054b0d40762fe"],["福井県内で小中高校の学年・学級閉鎖相次ぐ インフルで","福井県は11月16日午後2時までに、県内の小学校や高校などでインフルエンザによる学年閉鎖や学級閉鎖が相次いだと発表した。福井市では小学校2校で学年閉鎖2件と学級閉鎖1件、坂井市では小学校1校で学年閉鎖1件と学級閉鎖1件、鯖江市と南越前町では小学校1校ずつ学年閉鎖、越前市では高校等1校と小学校1校で学級閉鎖があった。全国的にもインフルエンザの流行が続いており、学校現場での対策が求められている。","\n【概要】福井県は11月16日午後2時までに、県内の小学校や高校などでインフルエンザによる学年閉鎖や学級閉鎖が相次いだと発表した。福井市では小学校2校で学年閉鎖2件と学級閉鎖1件、坂井市では小学校1校で学年閉鎖1件と学級閉鎖1件があった。鯖江市と南越前町では小学校1校ずつ学年閉鎖、越前市では高校等1校と小学校1校で学級閉鎖があった。【背景】全国では厚生労働省の11月13日公表で、第45週のインフルエンザの定点あたり報告数が11.00人となり、3週連続で増加した。都道府県別では北海道が28.32人で最多だった。福井県内でも学校現場での流行が続いており、県は毎日のように市町ごとの閉鎖状況を公表している。例年インフルエンザは12月から3月にかけて流行するが、今シーズンは早い時期から流行が始まっている。【詳細】16日午後2時までの発表では、福井市の小学校2校で学年閉鎖2件と学級閉鎖1件、坂井市の小学校1校で学年閉鎖1件と学級閉鎖1件、鯖江市の小学校1校で学年閉鎖1件、越前市の高校等1校で学級閉鎖1件と小学校1校で学級閉鎖1件、南越前町の小学校1校で学年閉鎖1件が確認された。県内の感染状況の詳細は県の発表で確認できる。【ポイント・注意点】学校での流行が続く時期は、家庭での体調チェックがとくに大切だ。発熱やせきがある場合は登校を控え、早めに受診してほしい。手洗いやマスクの着用、換気といった基本的な対策を続け、閉鎖の情報は県の発表で確認してほしい。症状が重いときや長引くときは、かかりつけ医へ早めに相談することが大切だ。福井県では県が毎日のように市町ごとの閉鎖状況を公表している。保護者は県の発表や学校からの連絡をこまめに確認し、子どもの体調に変化があれば早めに対応してほしい。全国の定点あたり報告数は3週連続で増加しており、流行はこれから本格化する可能性もある。ワクチンの接種がまだの家庭は、かかりつけ医に相談して接種の時期を確かめておくとよいだろう。流行のピークはこれからとも言われており、基本的な感染対策を続けることが大切だ。","2026-11-16","福井新聞","https://www.fukuishimbun.co.jp/articles/-/2748202"],["鳥取市の小学校がインフルで休校 コロナの学級閉鎖も","鳥取県感染症対策センターは11月16日、インフルエンザにより鳥取市の小学校で休校、東伯郡のその他社会福祉施設で集団発生があったほか、同市の小学校で新型コロナウイルス感染症による学級閉鎖の報告があったと発表した。インフルエンザと新型コロナが同時に学校現場で広がっている。全国的にもインフルエンザの流行が続いており、子ども世代を中心に感染が広がっている。手洗いや換気など基本的な対策の徹底が求められている。","\n【概要】鳥取県感染症対策センターは11月16日、インフルエンザにより鳥取市の小学校で休校、東伯郡のその他社会福祉施設で集団発生があったほか、同市の小学校で新型コロナウイルス感染症による学級閉鎖の報告があったと発表した。インフルエンザと新型コロナが同時に学校現場で広がっている状況だ。【背景】全国では厚生労働省の11月13日公表で、第45週のインフルエンザの定点あたり報告数が11.00人となり、3週連続で増加した。都道府県別では北海道が28.32人で最多、福島県や青森県、岩手県など東北でも高い水準が続いている。鳥取県内でも小学校での休校や集団発生が報告され、学校現場での流行が広がっている。【詳細】県の発表によると、インフルエンザにより鳥取市の小学校で休校の措置がとられ、東伯郡のその他社会福祉施設でも集団発生が確認された。さらに鳥取市の小学校では、新型コロナウイルス感染症による学級閉鎖の報告もあった。記事は速報として伝えられたもので、患者数などの詳細は今後の発表を待つ必要がある。県は感染症の発生状況を随時公表している。【ポイント・注意点】インフルエンザと新型コロナが同時に広がる時期は、家庭での体調チェックがとくに大切だ。発熱やせきがある場合は登校を控え、早めに受診してほしい。手洗いやマスクの着用、こまめな換気といった基本的な対策を続け、休校や学級閉鎖の情報は県の発表で確認してほしい。症状が重いときや長引くときは、かかりつけ医へ早めに相談することが大切だ。鳥取県内では小学校での休校や集団発生が報告され、学校現場での流行が広がっている。全国の定点あたり報告数は3週連続で増加しており、インフルエンザと新型コロナが同時に広がる時期に入っている。保護者は県の発表や学校からの連絡をこまめに確認し、子どもの体調に変化があれば早めに対応してほしい。ワクチンの接種がまだの家庭は、かかりつけ医に相談して接種の時期を確かめておくとよいだろう。流行のピークはこれからとも言われており、基本的な感染対策を続けることが大切だ。学校からの連絡を見落とさないよう、連絡手段の確認もしておきたい。","2026-11-16","日本海新聞","https://www.nnn.co.jp/articles/-/830766"],["大阪で3歳女児への虐待・殺害容疑 父親と母親を逮捕","大阪府警は11月16日までに、3歳の娘を虐待して殺害した疑いで、枚方市に住む33歳の会社員の父親を逮捕した。愛知県日進市に住む33歳の母親も、父親の行為を当局に通報するなど保護者として適切に対応しなかった疑いで逮捕された。専門家委員会によると、2024年度に日本で身体的虐待やネグレクトにより死亡した子どもは50人にのぼる。子どもの異変に気づいたときの相談窓口の周知が改めて問われている。","\n【概要】大阪府警は、3歳の娘を虐待して殺害した疑いで、枚方市に住む33歳の会社員の男を逮捕した。娘は恵玲奈さん（3歳）で、父親の金尾健太郎容疑者が殺害の疑いで逮捕された。愛知県日進市に住む33歳の母親、梨世容疑者も、父親の行為を当局に通報するなど保護者として適切に対応しなかった疑いで逮捕された。【背景】専門家委員会によると、2024年度に日本で身体的虐待やネグレクトにより死亡した子どもは50人にのぼる。虐待による子どもの死亡は後を絶たず、周囲が異変に気づいて通報や相談につなげることが命を守るうえで重要だと指摘されている。今回の事件でも、母親が父親の行為を通報しなかった疑いが持たれており、家庭内の虐待が見えにくい実態が浮き彫りになっている。【詳細】警察によると、父親は娘を虐待して殺害した疑いで逮捕された。母親は別居していたとみられ、父親の行為を当局に通報するなど、保護者として適切に対応しなかった疑いが持たれている。事件の詳しい経緯や、娘が亡くなった時期などは記事では明らかにされていない。警察が捜査を進めている。【ポイント・注意点】子どもの虐待が疑われるときは、児童相談所虐待対応ダイヤル「189（いちはやく）」へ連絡できる。近所の子どもの泣き声やあざなど、少しでも気になることがあれば、ためらわず相談してほしい。通報した人の情報は守られる。子どもと接する機会のある人は、日ごろから子どもの様子に気を配り、異変に気づいたら一人で抱え込まず、専門の窓口につなぐことが大切だ。虐待による子どもの死亡は後を絶たず、周囲が異変に気づいて通報や相談につなげることが命を守るうえで重要だと指摘されている。家庭内の虐待は外から見えにくいからこそ、子どもの様子の変化に気づいた人が声を上げることが大切だ。育児に悩む保護者自身も、一人で抱え込まず、児童相談所や地域の子育て支援窓口に相談してほしい。相談は匿名でもでき、通報した人の情報は守られる。地域全体で子どもを見守る意識を持つことが、悲しい事件を防ぐ一歩になる。","2026-11-16","The Japan Times","https://www.japantimes.co.jp/news/2026/11/16/japan/crime-legal/osaka-girl-abuse-murder/"],["久留米市の小学校で学級閉鎖 今シーズン5回目","福岡県久留米市は11月16日、インフルエンザ様疾患による臨時休業措置について発表した。上津小学校の1年生が学級閉鎖となり、在籍者数28人のうち11人が欠席している。臨時休業の終了予定は11月18日。久留米市内で今シーズン5回目の臨時休業措置となる。市はインフルエンザを広げないために、正しい知識と予防対策の徹底を呼びかけている。全国的にも学校現場での流行が続いている。","\n【概要】福岡県久留米市は11月16日、久留米市保健所あてに届出があったインフルエンザ様疾患による臨時休業措置について発表した。上津小学校の1年生が学級閉鎖となり、在籍者数28人のうち11人が欠席している。臨時休業の終了予定は11月18日。久留米市内で今シーズン5回目の臨時休業措置となる。【背景】全国では厚生労働省の11月13日公表で、第45週のインフルエンザの定点あたり報告数が11.00人となり、3週連続で増加した。九州でも学校現場での流行が続いており、久留米市では今シーズンに入って5回目の臨時休業措置となった。市はインフルエンザを広げないために、正しい知識と予防対策の徹底を呼びかけている。【詳細】今回の措置は上津小学校の1年生の学級閉鎖で、在籍者28人のうち11人が欠席している。臨時休業の終了予定は11月18日となっている。久留米市内の臨時休業措置は今シーズン5回目で、市はホームページで市内施設の臨時休業の状況を公表している。詳細は久留米市のホームページで確認できる。【ポイント・注意点】学級閉鎖が出た学校では、家庭での体調チェックがとくに大切だ。発熱やせきがある場合は登校を控え、早めに受診してほしい。手洗いやマスクの着用、こまめな換気といった基本的な対策を続け、臨時休業の情報は市の発表で確認してほしい。症状が重いときや長引くときは、かかりつけ医へ早めに相談することが大切だ。久留米市内の臨時休業措置は今シーズン5回目で、市はホームページで市内施設の臨時休業の状況を公表している。全国の定点あたり報告数は3週連続で増加しており、九州でも学校現場での流行が続いている。保護者は市の発表や学校からの連絡をこまめに確認し、子どもの体調に変化があれば早めに対応してほしい。ワクチンの接種がまだの家庭は、かかりつけ医に相談して接種の時期を確かめておくとよいだろう。流行のピークはこれからとも言われており、基本的な感染対策を続けることが大切だ。学校からの連絡を見落とさないよう、連絡手段の確認もしておきたい。","2026-11-16","久留米ファン","https://kurumefan.com/kurume-influenza20261116"],["インフル全国11.00人で3週連続増 北海道は28.32人で最多","厚生労働省は11月13日、第45週（11月2日〜8日）のインフルエンザ発生状況を発表した。全国の定点あたり報告数は11.00人で、前週の10.26人から増加し、第43週から3週連続の増加となった。都道府県別では北海道が28.32人で全国最多となり、福島県21.08人、青森県19.79人と続いた。全国の保育所や幼稚園、小・中・高校では、第45週に休校28校、学年閉鎖364校、学級閉鎖933校が報告された。","\n【概要】厚生労働省は11月13日、第45週（11月2日〜8日）のインフルエンザ発生状況を発表した。全国の定点あたり報告数は11.00人で、前週の10.26人から増加した。第43週の9.49人、第44週の10.26人に続き、3週連続の増加となった。報告された患者数は4万1071人だった。都道府県別では北海道が28.32人で全国最多となり、福島県21.08人、青森県19.79人、岩手県19.74人、宮城県18.45人、山形県18.36人、愛媛県17.71人と続いた。【背景】インフルエンザは例年12月から3月にかけて流行するが、今シーズンは9月ごろから流行が始まり、例年より早いペースで広がっている。北海道では札幌市で調査開始以来2番目の速さで注意報が発令され、11月15日から臨時の小児ドライブスルー発熱外来が開設された。厚生労働省は第46週分を11月20日に公表する予定だ。【詳細】第45週に前週と比べて増加したのは33自治体、減少したのは14自治体で、北日本・東日本で増加が目立つ一方、西日本や九州・沖縄では減少に転じた自治体が多く見られた。全国の保育所や幼稚園、小・中・高校では、第45週に休校28校、学年閉鎖364校、学級閉鎖933校が報告された。報告数が最多となった北海道では、休校7校、学年閉鎖50校、学級閉鎖81校で、休業措置をとった施設の患者数は2031人、このうち1523人が欠席した。【ポイント・注意点】流行が本格化する前に、ワクチンの接種や感染対策を確認しておきたい。厚生労働省は外出後の手洗いやこまめな換気、十分な休養とバランスの取れた食事を呼びかけている。受験シーズンを控えた家庭では、子どもだけでなく家族や周囲の人も感染予防を心がけてほしい。発熱などの症状がある場合は無理をせず、早めに受診して休養をとることが大切だ。厚生労働省は第46週分を11月20日に公表する予定だ。流行の動きは週ごとに変わるため、最新の発表を確認しながら、家庭での対策を続けてほしい。学校や園での休校・閉鎖の情報も、自治体の発表で確かめることができる。受験シーズンを控えた家庭では、体調管理にいっそう気を配りたい。","2026-11-13","リセマム","https://resemom.jp/article/2026/11/13/88307.html"],["香港で14か月女児がインフルで死亡 今年の小児死亡3例目","香港の衛生署衛生防護中心は11月13日、インフルエンザA型に感染して重症となっていた生後14か月の女児が同日亡くなったと発表した。女児は10月29日に重症例として公表されていた患者で、今年の香港で子どもがインフルエンザで亡くなったのは3例目。今季の重症小児症例は累計29例となった。同中心は流行の勢いが下がってきているものの基準値を上回っているとして、子どもを含む生後6か月以上の未接種者に早めのワクチン接種を呼びかけている。","\n【概要】香港の衛生署衛生防護中心は11月13日、インフルエンザA型に感染して重症となっていた生後14か月の女児が同日亡くなったと発表した。女児は、同中心が10月29日に重症例として公表していた患者だ。香港で今年、子どもがインフルエンザで亡くなったのはこれで3例目となった。同中心は、子どもを含む生後6か月以上でまだ接種していない人に、季節性インフルエンザワクチンを早めに受けるよう呼びかけた。【背景】今季の香港は6月下旬にインフルエンザのシーズンに入り、4か月以上続いている。日本の感覚では冬の病気という印象が強いが、今季の香港では夏から秋にかけて流行期が続いてきた。流行の勢いは最新の監視データでは下がってきているが、なお基準値を上回っており、同中心はシーズンが続いているとみている。【詳細】今季の重症小児症例は、11月13日の発表時点で累計29例で、内訳は退院22例、容体安定2例、重篤2例、死亡3例となっている。同中心によると、前年のデータでは、ワクチンを接種していない子どもは接種済みの子どもに比べ、重い合併症や死亡の率が約5倍だったという。今年の接種プログラムは始まって約2か月がたち、公的機関・民間ともにワクチンの供給は十分だと説明している。【ポイント・注意点】同中心は、子どもは急に容体が悪化することがあると注意を促している。呼吸が苦しい、唇が青い、胸が痛む、意識がもうろうとしている、熱が続く、けいれんを起こしたといった症状があれば、直ちに病院の救急外来を受診するよう呼びかけている。日ごろの予防としては、個人と環境の衛生を徹底し、リスクの高い人は公共交通機関や人混みでマスクを着けるよう勧めている。日本でも接種がまだの場合は、早めの接種を検討してほしい。香港では公的な接種場所が約270か所あり、民間でも補助制度に参加する医師1900人超が3200か所超で接種を行っている。日本でもインフルエンザの流行が続いており、接種がまだの家庭は、かかりつけ医に相談して接種の時期を確かめておくとよい。流行のピークはこれからとも言われており、基本的な感染対策を続けることが大切だ。","2026-11-13","香港ニュース","https://news.e-linez.com/hk-news/2026/11/14/%e9%a6%99%e6%b8%af%e3%81%a7%e3%82%a4%e3%83%b3%e3%83%95%e3%83%ab%e3%82%a8%e3%83%b3%e3%82%b6%e3%81%ae14%e3%81%8b%e6%9c%88%e5%a5%b3%e5%85%90%e3%81%8c%e6%ad%bb%e4%ba%a1%e3%80%81%e4%bb%8a%e5%b9%b4%e3%81%ae/"]],"dev":[["母親の気候不安が子の心の問題と関連 トルコ570人の調査","トルコで6〜12歳の子どもを持つ母親570人を調べた研究で、母親の気候変動への不安が子どもの心理社会的な問題と直接・間接に関連していることが分かった。気候不安が高い母親ほど感情の調整が難しく、親子のコミュニケーションが減り、子どもの問題が多くなる傾向が見られた。研究はトルコで行われた横断調査で、Current Psychology誌に掲載された。因果関係を示すものではなく、親の心のケアと親子の対話が大切だと研究者は指摘している。","\n【概要】トルコで6〜12歳の子どもを持つ母親570人を対象にした横断調査で、母親の気候変動への不安が、子どもの心理社会的な問題と直接・間接に関連していることが分かった。気候不安が高い母親ほど、感情の調整が難しい傾向があり、親子のコミュニケーションが少なく、子どもの情緒や行動の問題が多い傾向が見られた。研究はCurrent Psychology誌に掲載された。【背景】気候変動への不安は、環境の脅威が大きくなるなかで広く認識されるようになってきた。ただ、母親の気候不安が家庭のコミュニケーションや子どもの適応とどう関わるかは、あまり分かっていなかった。研究チームは、母親の気候不安が子どもの行動の問題と直接結びつくだけでなく、感情の調整の難しさや親子の対話の変化を通じて間接的にも関わるのではないかと考え、トルコの母親570人を調べた。【詳細】分析では、母親の気候不安と感情調整の困難さの関連は標準化係数0.468、子どもの心理社会的な問題との直接の関連は0.278だった。一方、気候不安と親子コミュニケーションの関連はマイナス0.180で、不安が高いほど対話が少ない傾向が見られた。感情調整の困難さを介した間接の関連は0.112、親子コミュニケーションを介したものは0.069、両方を経るものは0.041で、間接の関連の合計は0.222だった。子どもの問題はStrengths and Difficulties Questionnaireで評価した。【ポイント・注意点】この研究は1時点の横断調査で、母親の報告だけに基づいているため、因果関係や親から子への伝わり方は示せない。著者らは、今後は長期の追跡調査や、母親以外の情報も集めた研究が必要だとしている。気候の話題に不安を感じる保護者は、一人で抱え込まず、家族や周囲と話す時間を持つことが大切だ。子どもとの対話を意識的に保つことが、子どもの心の安定につながる可能性がある。親子の対話を意識的に保つことが、子どもの心の安定につながる可能性がある。気候の話題に限らず、親が不安を感じるときは、まず自分の心を整えることも大切だ。家族で話す時間を持ち、不安を言葉にできる環境を作ることが、子どもを支える一歩になる。","2026-11-16","ScienMag","https://scienmag.com/maternal-climate-anxiety-links-to-child-psychosocial-issues-in-cross-sectional-study/"],["宿題は毎回確認しなくても大丈夫？ 英国の長期調査から","英国教育省が11月13日に公表した長期調査では、親が宿題を確認する回数が多いほど成績が高くなる、という単純な関係は確認されなかった。14〜15歳ごろでは、宿題を「一度も確認されない」グループの予測得点が53.3点、「毎回確認される」グループは49.7点だった。ただし確認しない方がよいわけではなく、自分で管理できる子ほど確認が不要だった可能性がある。中国の研究でも、母親との会話は成績と正の関連があったが、宿題の責任を強く引き受けることは負の関連を示した。","\n【概要】英国教育省が2026年11月13日に公表した長期調査では、親が宿題を確認する回数が多いほど成績が高くなる、という単純な関係は確認されなかった。14〜15歳ごろでは、宿題を「一度も確認されない」グループの予測得点が53.3点、「毎回確認される」グループは49.7点だった。ただし「親が確認しない方が成績が上がる」という意味ではない。もともと自分で宿題を管理できる子どもほど、親の確認が必要なかった可能性がある。【背景】今週の子育て研究をまとめたSK進路の記事では、宿題や勉強法、AI、お金の管理、家事、友達づくりなど、子ども自身が考えて選び直す力をどう育てるかが共通のテーマだった。中国の中学生7457〜7604人を調べた研究では、母親との会話が多いことは認知能力や成績の高さと関連していた。一方、母親が宿題の責任を強く引き受けることは、主要な分析では成績などと負の関連を示した。【詳細】イタリアの11〜12歳を中心とする382人の研究では、数学の問題演習に加えて「計画する・途中で確認する・振り返る」という勉強方法を週1回60分、6回教えた。終了後の数学課題では、勉強方法を教えたグループの平均が41.47点、比較グループは35.27点で、6か月後も41.28点と34.76点で差が残った。フランスの13〜15歳116人の研究では、生成AIについて2時間の授業を受けたグループは、情報が足りない質問の後に質問し直した割合が59.2％で、受けなかったグループの27.9％を大きく上回った。【ポイント・注意点】宿題は「毎回確認する」か「まったく見ない」かの二択ではない。大切なのは、親が代わりに管理することと、子どもが考えるために話すことを分けることだ。計画や振り返りの方法を教えたり、答えをすぐ教える代わりに「どう確かめるか」を一緒に考えたりする関わり方が、子どもの自立につながる。子どもの様子に合わせて、手伝う量を少しずつ減らしていくのがよいだろう。子どもの様子に合わせて、手伝う量を少しずつ減らしていくのがよいだろう。親が関わる場合は、答えを教えるのではなく、子どもが自分で考える手伝いを意識したい。計画や振り返りの習慣が身につけば、宿題以外の学びにも生かすことができる。","2026-11-15","SK進路","https://sksinro.com/theme/kosodate/2995/"],["遊びで言葉を取り戻す 9歳児の言語回復プログラムを設計","スペインの研究チームが、言葉を失う病気「ランドウ・クレフナー症候群」の9歳5か月の男児のために、遊びを中心にした4週間の教育プログラムを設計した。男児は4歳ごろから夜間のけいれんとともに言葉の理解が急に悪くなり、受容語彙の標準得点は55、表出語彙は70と、年齢より1〜2学年分の遅れがあった。12回45分の授業は、ゲームや協力学習で語彙や文の力を伸ばす内容。プログラムはまだ実施前で、効果はこれから検証される。","\n【概要】スペインのカスティーリャ・ラ・マンチャ大学とバレンシア国際大学の研究チームが、ランドウ・クレフナー症候群の9歳5か月の男児のために、遊びを中心にした4週間の教育プログラムを設計した。この症候群は、てんかん性の脳波が言葉をつかさどる脳の働きを妨げ、順調だった言葉の力が急に失われていくまれな病気だ。研究はFrontiers in Education誌に掲載された。【背景】男児は2015年生まれで、2020年のコロナ禍のさなかに夜間の落ち着きのなさやぼんやりした様子が見られるようになった。言葉の理解が急に悪くなり、名前を呼ばれても反応せず、指示に従えなくなった。聴力は正常だったが、マドリードの専門施設での睡眠中の検査で異常な脳波が見つかり、2021年1月にランドウ・クレフナー症候群と診断された。抗てんかん薬で脳波の異常はおさまったが、言葉の後遺症が残った。【詳細】2025年5月1日の検査では、受容語彙の標準得点は55で年齢相当は6歳5か月、表出語彙は70で年齢相当は5歳5か月と、1〜2学年分の遅れが確認された。研究チームは、遊びの学習と協力学習を組み合わせた12回45分のプログラムを作った。語彙の分類ゲームや音のビンゴ、しりとりやなぞなぞ、グループでの脱出ゲームやボードゲームなどを通して、語彙や文の組み立て、文章の理解を伸ばす内容になっている。【ポイント・注意点】この研究はプログラムの設計と実施前の評価であり、授業はまだ行われていないため、効果は検証されていない。1人の事例だけの研究なので、ほかの子どもにも同じように役立つかは分からない。今後は授業を実施し、検査を繰り返して効果を確かめる必要がある。まれな病気の子どもには、医療と教育が連携し、仲間と一緒に学べる場を整えることが大切だと研究チームは指摘している。まれな病気の子どもには、医療と教育が連携し、仲間と一緒に学べる場を整えることが大切だ。遊びを通じた学びは、言葉の力だけでなく、友達との関わりや自信の回復にもつながる可能性がある。プログラムの効果が確かめられれば、同じような困難を抱えるほかの子どもたちへの応用も期待される。","2026-11-14","ScienMag","https://scienmag.com/educational-framework-uses-playful-learning-to-support-child-with-landau-kleffner-syndrome/"],["発達障害の子の偏食は「食事のリズム」と深く関係 ブラジル調査","ブラジル北東部で自閉スペクトラム症やADHDのある3〜14歳の子どもを持つ保護者128人を調べた研究で、73.4％の子どもに強い偏食の傾向が見られた。偏食の負担が大きい子どもほど、食事中の介助や見守りが必要で、睡眠の乱れや感覚の過敏さが多かった。食事と睡眠、学校、感覚の心地よさ、家庭の時間割を整える営みを「フード・クロノケア」と呼んで整理した。Journal of Autism and Developmental Disorders誌に掲載された。","\n【概要】ブラジル北東部の3市で、自閉スペクトラム症やADHDのある3〜14歳の子どもを持つ保護者128人を調べた研究で、73.4％の子どもに強い偏食の傾向が見られた。偏食の負担が大きい子どもほど、食事中に介助や見守りが必要で、睡眠の乱れや感覚の過敏さが多いことが分かった。研究はJournal of Autism and Developmental Disorders誌に掲載された。【背景】発達障害のある子どもは、食べ物の色や食感、においに敏感で、食べられるものが限られることが多い。ただ、偏食が家庭の1日のリズムとどう絡んでいるかは、あまり調べられていなかった。研究チームは、保護者への質問紙調査と35人の保護者への詳しい聞き取りを組み合わせ、食事の時間や睡眠、学校、感覚の心地よさがどう関係しているかを調べた。調査地はブラジル北東部のセアラー州の3市で、経済的に厳しい家庭が多かった。【詳細】偏食の強さは8項目のチェックリストで評価した。強い拒否反応が72.7％、見える調味料を取り除くのが72.4％、特定の食感を求めるのが71.7％、食べ物のグループ全体を拒否するのが54.7％、食べられるものが15品目未満が50.0％だった。偏食の負担が大きいことと関連したのは、食事中の介助や見守りが必要なこと（調整済み有病率比1.43）、睡眠の困難（1.41〜1.45）、感覚の過敏な反応（1.59〜1.88）だった。母親が回答者の88.3％を占め、家庭の食事作りの負担が母親に集中していた。【ポイント・注意点】研究チームは、食事と睡眠、学校、感覚の心地よさ、家庭の時間割を整える営みを「フード・クロノケア」と呼んだ。朝は食欲がなく、夜に強い空腹が来るなど、1日のリズムの乱れが偏食と絡んでいるという。ただし調査はブラジル北東部の限られた地域でのもので、治療法を示すものではない。偏食に悩む家庭は、無理に食べさせようとせず、決まった時間や慣れた出し方など、子どもが安心できる工夫をしながら、専門家に相談するのがよいだろう。偏食に悩む家庭は、専門家と相談しながら、子どもに合った関わり方を探してほしい。無理に食べさせようとするのではなく、子どもが安心できる工夫を重ねることが大切だ。","2026-11-12","ScienMag","https://scienmag.com/study-links-neurodevelopmental-feeding-challenges-to-daily-caregiver-rhythms-and-routines/"],["妊娠中の炎症性が高い食事 子どもの肥満や発達遅れと関連","妊娠中の食事の炎症性の高さと、母親や子どもの健康との関係を調べたシステマティックレビューで、炎症性の高い食事をとる妊婦は、妊娠糖尿病のリスクが1.43倍、妊娠高血圧が1.26倍、子癇前症が2.18倍高かった。子どもでは肥満のリスクが1.09倍、神経発達の遅れが1.23倍と関連していた。8件の観察研究をまとめたもので、BMC Pregnancy and Childbirth誌に掲載された。出生体重やぜんそくへの影響ははっきりしなかった。","\n【概要】妊娠中の食事の炎症性の高さと、母親や子どもの健康との関係をまとめたシステマティックレビューで、炎症性の高い食事をとる妊婦は、妊娠糖尿病のリスクが1.43倍、妊娠高血圧が1.26倍、子癇前症が2.18倍高かった。子どもでは肥満のリスクが1.09倍、神経発達の遅れが1.23倍と関連していた。研究はBMC Pregnancy and Childbirth誌に掲載された。【背景】食事の炎症性を数値化する「食事炎症指数」は、食品や栄養素が体の炎症を促すか抑えるかを総合的に評価する指標だ。妊娠中の栄養は母親と子どもの健康に大きく関わるが、食事の炎症性が妊娠の合併症や子どもの発達とどう関係するかは、ばらばらの研究結果が多く、全体像が分かりにくかった。研究チームはPubMedやEmbase、Web of Scienceで2025年12月までの文献を探し、346件のうち基準を満たした8件の観察研究をまとめた。【詳細】母親の側では、炎症性の高い食事は妊娠糖尿病（調整済みオッズ比1.43、95％信頼区間1.05〜1.95）、妊娠高血圧症（1.26、1.03〜1.54）、子癇前症（2.18、1.52〜3.13）のリスク上昇と関連していた。子どもの側では、肥満のリスクが1.09倍（1.00〜1.19）、神経発達の遅れが1.23倍（1.10〜1.39）と関連していた。一方、出生体重への影響ははっきりせず、子どものぜんそくや喘鳴との関連も統計的に有意ではなかった。【ポイント・注意点】まとめられたのは観察研究だけで、因果関係は示せない。食事の炎症性と健康の関連は、ほかの生活習慣や社会経済的な要因の影響を受けている可能性もある。著者らは、大規模な前向き研究で確認する必要があるとしている。妊娠中の食事は、野菜や果物、魚などを取り入れたバランスのよい内容を心がけ、気になることがあれば医師や管理栄養士に相談するのがよいだろう。妊娠中の食事は、野菜や果物、魚などを取り入れたバランスのよい内容を心がけたい。食事の内容に迷うときは、医師や管理栄養士に相談するのがよいだろう。極端な制限ではなく、無理のない範囲で整えていくことが大切だ。","2026-11-12","ScienMag","https://scienmag.com/maternal-inflammatory-diet-linked-to-pregnancy-complications-and-child-obesity-risk/"],["発達障害の子を育てる母親のセルフケア 7研究をまとめて分析","自閉スペクトラム症やADHDなど発達障害のある子どもを育てる母親のセルフケアについて、6か国の質的研究7件をまとめたレビューが発表された。母親のセルフケアは、疲れ果てた状態から自分らしさを取り戻していく変化の過程として描かれた。負担の重さ、内面や信仰に根ざした動機、さまざまな壁、工夫してきた方法、セルフケアがもたらす成長という5つのテーマが見つかった。BMC Women's Health誌に掲載された。","\n【概要】自閉スペクトラム症やADHDなど発達障害のある子どもを育てる母親のセルフケアについて、6か国の質的研究7件をまとめたレビューが発表された。母親のセルフケアは、疲れ果てた状態から自分らしさを取り戻していく変化の過程として描かれた。研究はBMC Women's Health誌に掲載された。【背景】発達障害のある子どもの母親は、長期にわたる育児の負担から心身の健康を損ないやすいことが知られている。ただ、母親がセルフケアをどう考え、どう実践しているかは、文化や地域によって異なり、まとまった知見が少なかった。研究チームはPubMedやScopusなど6つのデータベースを2026年5月までの文献で探し、1847件のうち基準を満たした7件の質的研究を選び、共通する語りをまとめた。【詳細】分析から5つのテーマが見つかった。1つ目は「強い育児負担と少しずつの消耗」で、体と心の疲れが積み重なる様子が描かれた。2つ目は「セルフケアへ向かう内面や信仰の動機」、3つ目は「セルフケアを妨げるさまざまな壁」、4つ目は「工夫して生み出す方法と実践」、5つ目は「セルフケアがもたらす影響と成長」だった。セルフケアは単なる気晴らしではなく、自分の健康を保ち、育児を続けるための大切な仕組みとして位置づけられた。【ポイント・注意点】このレビューは7件の質的研究のまとめで、セルフケアの支援策の効果を検証したものではない。著者らは、文化に配慮した、母親の強みを生かす支援が必要だと指摘している。育児の負担を感じている保護者は、一人で抱え込まず、家族や支援機関、同じ立場の保護者とつながることが大切だ。小さな時間でも自分のための時間を作ることが、長い目で見た育児の力につながる。育児の負担を感じている保護者は、一人で抱え込まず、家族や支援機関、同じ立場の保護者とつながることが大切だ。小さな時間でも自分のための時間を作ることが、長い目で見た育児の力につながる。地域の支援や相談窓口を活用し、自分の健康を守ることも、子どもを支えるための大切な一歩だ。","2026-11-12","ScienMag","https://scienmag.com/qualitative-review-synthesizes-self-care-experiences-among-mothers-of-neurodivergent-children/"],["妊娠後期の心の苦痛と虐待 子どもの発達障害と強く関連","エジプトで3〜17歳の子どもを持つ母親500人を調べた研究で、妊娠後期の母親の心の苦痛や身体的・言葉の虐待への経験が、子どもの発達障害と強く関連していることが分かった。虐待を経験した母親では子どもの発達障害のオッズが4.09倍、長期の情緒的苦痛では3.25倍、抑うつの重さでは1段階上がるごとに2.94倍だった。一方、周囲からの支えを感じている母親ではオッズが低かった。Frontiers in Psychiatry誌に掲載された。","\n【概要】エジプトで3〜17歳の子どもを持つ母親500人を調べた研究で、妊娠後期の母親の心の苦痛や身体的・言葉の虐待への経験が、子どもの発達障害と強く関連していることが分かった。虐待を経験した母親では子どもの発達障害のオッズが4.09倍、長期の情緒的苦痛では3.25倍、抑うつの重さでは1段階上がるごとに2.94倍だった。一方、周囲からの支えを感じている母親ではオッズが低かった。研究はFrontiers in Psychiatry誌に掲載された。【背景】妊娠中の母親の心の不調は、胎盤の働きやストレスホルモンを通じて胎児の脳の発達に影響するのではないかと考えられている（胎児プログラミング仮説）。世界では妊婦の15〜20％に抑うつや不安があるとされ、低中所得国ではさらに多い。エジプトでは産前健診での心の健康のチェックがほとんど行われておらず、支援の体制も都市部に偏っている。研究チームは、発達障害のある子どもの母親200人と、定型発達の子どもの母親300人を比べて調べた。【詳細】子どもの診断は自閉スペクトラム症が38.0％、ADHDが54.0％、注意欠如障害が8.0％だった。妊娠後期の虐待は、発達障害のある子どもの母親の45.2％が経験していたのに対し、対照群では13.7％だった。長期の情緒的苦痛は62.3％対25.0％だった。抑うつ、不安、ストレスの重さもすべて関連し、抑うつは1段階上がるごとにオッズが2.94倍、不安は1.99倍、ストレスは2.12倍だった。周囲からの支えはオッズ0.45と、発達障害の低さと関連していた。【ポイント・注意点】この研究は過去を振り返る調査で、因果関係は示せない。最大で17年前のことを思い出して答えてもらっているため、記憶の偏りの影響もある。著者らは、妊娠中の心の健康チェックと暴力の発見を、産前健診に組み込むことが大切だと指摘している。妊娠中に心がつらいときや、暴力を受けているときは、一人で抱え込まず、医療機関や相談窓口に早めに相談してほしい。妊娠中の心の健康は、母親と子どもの両方に関わる大切な問題だ。産前健診での心のチェックが広がることが期待される。つらいときは一人で抱え込まず、医療機関や相談窓口に早めに相談してほしい。","2026-11-12","ScienMag","https://scienmag.com/prenatal-maternal-distress-linked-to-offspring-neurodevelopmental-conditions-in-egyptian-study/"],["乳児から小3までの社会性・情緒の発達を1つの物差しで測る","米カリフォルニア大学バークレー校などの研究チームが、乳児期から小学3年生までの社会性・情緒の発達を1つの連続した物差しで測る方法を示した。DRDP 2025という評価法を使い、2022人の子どもを314人の教育者が評価したデータを分析したところ、5つの項目は想定どおりの順序で並び、得点は年齢とともに上がった（相関係数0.75）。信頼性は0.97と高かった。Education Sciences誌に掲載された。","\n【概要】米カリフォルニア大学バークレー校などの研究チームが、乳児期から小学3年生までの社会性・情緒の発達を1つの連続した物差しで測る方法を示した。DRDP 2025という評価法を使い、2022人の子どもを314人の教育者が評価したデータを分析したところ、5つの項目は想定どおりの順序で並び、得点は年齢とともに上がった（相関係数0.75）。研究はEducation Sciences誌に掲載された。【背景】社会性・情緒の発達は学びの土台だが、年齢によって表れ方が変わる。乳児の感情の表し方と小学生の協調性は見た目が違うため、別々の評価で測られがちで、成長のつながりが見えにくかった。DRDP 2025は、乳児期から小学3年生までを1つの発達の連続として捉える評価法で、教育者が子どもの様子を観察して評価する。研究チームは、この評価の得点が想定した発達の順序に沿っているかを確かめた。【詳細】分析には、2022人の子どもを314人の教育者が評価した現場調査のデータを使った。5つの社会性・情緒の項目はすべて想定の範囲に収まり、発達の段階に対応する区切りが想定どおりに並んだ。得点は年齢とともに上がり、相関係数は0.75だった。信頼性を示す値は0.97と高く、7つの人口学的な違いによる項目の偏りも心配される水準ではなかった。ただ、全体の12％、小学1〜3年生の評価では26％の子どもで、想定と合わない回答パターンが見られた。【ポイント・注意点】この研究は横断調査で、同じ子どもを追って発達の順序を確かめたものではない。小学1〜3年生の評価では想定と合わない回答が多く、評価の仕方や教育者の判断の過程をさらに検証する必要があると著者らは指摘している。発達は年齢だけで決まるものではなく、子どもによってペースが違う。評価の結果は、次にどんな学びの機会を用意するかを考える手がかりとして使うことが大切だ。発達は年齢だけで決まるものではなく、子どもによってペースが違う。評価の結果は、次にどんな学びの機会を用意するかを考える手がかりとして使うことが大切だ。教育現場では、一人ひとりの発達の段階に合わせた関わりが求められている。","2026-11-11","MDPI","https://www.mdpi.com/2227-7102/16/11/1937"],["ADHDと不安の子に3つの脳タイプ 米スタンフォード大の研究","ADHDや不安障害のある子どもの脳には、3つの異なるタイプがあることが、米スタンフォード大学を中心とする研究で分かった。ABCD研究のデータを使い、ADHDや不安のある子ども3508人、のちに診断された693人、対照群1947人の脳画像をAIで分析した。3つのタイプはそれぞれ外に向かう衝動性、内にこもる不安、両方が混ざった特徴に対応し、診断名とは完全には一致しなかった。Nature Mental Health誌に掲載された。","\n【概要】ADHDや不安障害のある子どもの脳には、3つの異なるタイプがあることが、米スタンフォード大学を中心とする研究で分かった。1万1000人以上の子どもを追うABCD研究のデータを使い、ADHDや不安のある子ども3508人と、のちに診断された子ども693人、対照群1947人の脳画像をAIで分析した。3つのタイプは診断名とは完全には一致せず、症状の組み合わせで分かれることが示された。研究はNature Mental Health誌に掲載された。【背景】ADHDと不安は子どもによく見られる心の不調で、重なることも多い。診断は症状のチェックリストで行われるが、ADHDの子どもが不安の症状を持っていたり、その逆もあったりして、診断名だけでは脳の違いが分かりにくい。研究チームは、脳のさまざまな場所がどう連携しているかを示す機能的結合をAIで分析し、症状のラベルにとらわれず、脳と行動の違いを捉えようとした。【詳細】分析から、認知と行動の不調、感情と注意の不調という2つの軸が見つかり、その組み合わせで3つの脳タイプが分かれた。「外向・脱抑制型」は敵意や反抗、衝動性が強く、ADHDの診断が多い。「内向・苦悩型」は罪悪感や緊張、完璧主義が強く、不安の診断が多い。「混合型」は注意の問題やいらだち、自傷が多く、ADHDの診断が多い傾向だった。興味深いことに、診断がつく前の脳画像からもタイプが見分けられ、早期の目印になる可能性が示された。【ポイント・注意点】脳タイプが症状による診断に取って代わるわけではないと研究者は説明している。ただ、脳タイプが分かれば、子どもに合った治療を選びやすくなる可能性がある。薬の効果が出るまでには数週間から数か月かかり、合わなければ切り替える試行錯誤が続く。今後は、どの治療がどの脳タイプに効くかを臨床試験で確かめ、適切な時期に適切な治療を届けることが目指されている。今後は、どの治療がどの脳タイプに効くかを臨床試験で確かめ、適切な時期に適切な治療を届けることが目指されている。脳タイプの研究が進めば、子ども一人ひとりに合った支援の選び方が変わっていく可能性がある。診断と脳の情報の両方を生かすことが、これからの課題だ。","2026-11-11","Medical Xpress","https://medicalxpress.com/news/2026-11-brain-biotypes-kids-adhd-anxiety.html"],["ネパール農村の成長モニタリング 徒歩4〜5時間が壁に","ネパールのゴルカ郡で子どもの成長モニタリングの利用を調べた研究で、利用が進まない背景に、母親の知識不足や家事・農作業の忙しさ、施設まで徒歩4〜5時間かかる距離、人手や機材の不足などが重なっていることが分かった。調査は24〜35か月の子どもを持つ母親26人への聞き取りと医療者6人への面談で行われた。一方、女性コミュニティヘルスボランティアの訪問や予防接種と組み合わせた実施が利用を後押ししていた。BMC Nutrition誌に掲載された。","\n【概要】ネパールのゴルカ郡で子どもの成長モニタリングの利用を調べた研究で、利用が進まない背景に、母親の知識不足や家事・農作業の忙しさ、施設まで徒歩4〜5時間かかる距離、人手や機材の不足などが重なっていることが分かった。調査は24〜35か月の子どもを持つ母親26人への聞き取りと医療者6人への面談で行われた。研究はBMC Nutrition誌に掲載された。【背景】成長モニタリングは、子どもの体重や身長を定期的に測り、成長曲線で発育の遅れを早く見つけて栄養の相談につなげる予防の仕組みだ。ネパールの農村部では子どもの栄養不良が多いにもかかわらず、利用はとても低いままだった。研究チームは2023年12月から2024年5月にかけ、ゴルカ郡の6つの自治体で、母親や医療者に聞き取りを行い、利用を妨げるものと後押しするものを調べた。【詳細】利用を妨げるものとして、成長モニタリングの大切さについての知識不足、家事や農作業との両立の難しさ、施設まで徒歩4〜5時間かかる地理的な遠さが挙がった。医療の側でも、人手不足や機材の不足、治療を優先して予防が後回しになること、成長モニタリングの研修不足が課題だった。一方、利用を後押しするものとして、母親の前向きな姿勢、地域の支え合いのグループ、女性コミュニティヘルスボランティアによる訪問、予防接種や栄養事業と組み合わせた実施が挙げられた。【ポイント・注意点】著者らは、利用を広げるには、地域の診療所の体制強化やボランティアによる訪問の拡充、農作業の時期に合わせた日程、予防接種と組み合わせた実施が必要だと指摘している。日本では乳幼児健診が身近な仕組みとして整っているが、健診の機会を逃さないことや、気になることがあれば早めに相談することが大切だ。地域の支え合いが子どもの育ちを守るという点は、どこでも共通している。日本では乳幼児健診が身近な仕組みとして整っているが、健診の機会を逃さないことや、気になることがあれば早めに相談することが大切だ。地域の支え合いが子どもの育ちを守るという点は、どこでも共通している。健診や予防接種の機会を生かし、子どもの成長を定期的に確かめる習慣を大切にしたい。","2026-11-10","ScienMag","https://scienmag.com/qualitative-study-uncovers-barriers-to-child-growth-monitoring-in-rural-nepal/"]]};

    document.getElementById('artDots').innerHTML=""; document.getElementById('artCount').textContent="0 / 0"; return;
  }
  const it=items[ai], a=it.a, old=isOld(a[3]);
  slot.innerHTML='<article class="card'+(old?' old':'')+(dir?' anim-'+dir:'')+'">'
    +'<img class="ph" src="'+IMGS[c.img]+'" alt="'+c.name+'のイメージイラスト">'
    +'<div class="cbody"><div class="meta"><span class="badge'+(old?' oldb':'')+'">'+(old?'少し前':'NEW')+'</span><span>'+a[3]+'</span><span>'+(ai+1)+' / '+items.length+'</span></div>'
    +'<h3>'+a[0]+'</h3><p class="sum">'+a[1]+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="openArticle(\''+c.id+'\','+it.oi+')">和訳全文を読む</button>'
    +'<button class="btn ghost" onclick="quickMemo(\''+c.id+'\','+it.oi+',this)">メモ保存</button>'
    +'<button class="btn ghost" onclick="shareArticle(\''+c.id+'\','+it.oi+')">共有</button></div>'
    +'<div class="src">出典：'+a[4]+'<br><a href="'+a[5]+'" target="_blank" rel="noopener">原文を開く</a></div></div></article>';
  document.getElementById('artDots').innerHTML=items.map((x,i)=>'<span class="dot'+(i===ai?' active':'')+'"></span>').join('');
  document.getElementById('artCount').textContent="記事 "+(ai+1)+" / "+items.length;
  requestAnimationFrame(fitCard);
}

function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;
  const sum=card.querySelector('.sum'), h3=card.querySelector('h3'), ph=card.querySelector('.ph');
  let ss=14, hs=Math.min(21, Math.max(17, window.innerWidth*0.044)), phh=ph?Math.round(ph.getBoundingClientRect().height):0; const ph0=phh;
  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }
    if(hs>13){ hs-=0.5; if(h3) h3.style.fontSize=hs+'px'; continue; }
    break;
  }
}
window.addEventListener('resize', fitCard);
function nextArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i>=n-1)return;artIdxMap[curCat().id]=i+1;renderStage('next')}
function prevArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i<=0)return;artIdxMap[curCat().id]=i-1;renderStage('prev')}
function nextCat(){if(catIdx>=cats.length-1)return;catIdx++;renderStage('down')}
function prevCat(){if(catIdx<=0)return;catIdx--;renderStage('up')}
/* ===== スワイプ操作（スクロールではなくスワイプで移動） ===== */
const stage=document.getElementById('stage');
let sx=null, sy=null, swipedAt=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;
  swipedAt=Date.now();
  if(Math.abs(dx)>Math.abs(dy)){ dx<0?nextArt():prevArt(); } else { dy<0?nextCat():prevCat(); }
});
stage.addEventListener('click',e=>{ if(Date.now()-swipedAt<120){e.stopPropagation();e.preventDefault();} },true);
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')nextArt(); else if(e.key==='ArrowLeft')prevArt();
  else if(e.key==='ArrowDown'){e.preventDefault();nextCat();} else if(e.key==='ArrowUp'){e.preventDefault();prevCat();}
});
/* ===== 項目の追加 ===== */
document.getElementById('addCatBtn').onclick=()=>{document.getElementById('newCatName').value="";document.getElementById('newCatDesc').value="";document.getElementById('addDlg').showModal()};
document.getElementById('addCatSave').onclick=()=>{
  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast("項目名を入力してください");return}
  const desc=document.getElementById('newCatDesc').value.trim()||"追加された項目";
  const id='custom-'+Date.now();
  extraCats.push({id:id,name:name,desc:desc,img:'hero'}); DATA[id]=[];
  cats=allCats(); catIdx=cats.length-1;
  document.getElementById('addDlg').close(); renderStage('down');
  toast("項目「"+name+"」を追加しました");
};
/* ===== 記事ダイアログ・メモ・共有 ===== */
function openArticle(cat,idx){
const c=allCats().find(x=>x.id==cat); const a=DATA[cat][idx];
document.getElementById('dlgIn').innerHTML=`<img src="${IMGS[c.img]}" alt=""><div class="meta" style="margin-top:10px"><span>${c.name}</span><span>${a[3]}</span></div><h3>${a[0]}</h3><p class="sum" style="font-size:14px">${a[1]}</p><div class="full">${a[2]}</div>
<p class="src" style="margin-top:12px">出典：${a[4]} — <a href="${a[5]}" target="_blank" rel="noopener">${a[5]}</a></p>
<div class="memoBox"><label style="font-weight:800;font-size:14px">ひとことメモ</label><textarea id="memoText" placeholder="気づいたこと、作りたいもの、家族への共有メモなど"></textarea>
<div class="actions"><button class="btn primary" onclick="saveMemo('${cat}',${idx})">このメモを保存</button><button class="btn ghost" onclick="shareArticle('${cat}',${idx})">iPhoneで共有</button><button class="btn ghost" onclick="document.getElementById('dlg').close()">閉じる</button></div></div>`;
document.getElementById('dlg').showModal();
}
function quickMemo(cat,idx,btn){const a=DATA[cat][idx];memos.unshift({cat,title:a[0],note:"",date:a[3]});updateMemoUI();btn.textContent="保存しました";btn.classList.add('saved');toast("メモに保存しました（このページを開いている間）")}
function saveMemo(cat,idx){const a=DATA[cat][idx];const note=document.getElementById('memoText').value.trim();memos.unshift({cat,title:a[0],note,date:a[3]});updateMemoUI();toast("メモを保存しました");document.getElementById('dlg').close()}
function updateMemoUI(){document.getElementById('memoCount').textContent=memos.length;const area=document.getElementById('memoList');
if(!memos.length){area.innerHTML='<p class="sum">まだメモがありません。記事の「メモ保存」をタップしてください。</p>';return}
area.innerHTML=memos.map(m=>`<div class="memoItem"><b style="font-size:14px">${m.title}</b><div style="font-size:13px;color:var(--muted)">${m.note||"（ひとことメモなし）"} ・ ${m.date}</div></div>`).join('')}
function exportMemos(){if(!memos.length){toast("まだメモがありません");return}const txt="MAI topic メモ — 2026-11-10\n\n"+memos.map((m,i)=>`${i+1}. ${m.title}\n${m.note||""}\n`).join("\n");const b=new Blob([txt],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="mai-topic-memo-2026-11-10.txt";a.click();URL.revokeObjectURL(u)}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}} try{await navigator.clipboard.writeText(text);toast("コピーしました — メモアプリなどに貼り付けできます")}catch(e){toast("共有できませんでした")}}
function shareArticle(cat,idx){const a=DATA[cat][idx];shareText(a[0],`${a[0]}\n\n${a[1]}\n\n出典：${a[4]} ${a[5]}`)}
function shareMemos(){if(!memos.length){toast("まだメモがありません");return}shareText("MAI topic メモ",memos.map(m=>`・${m.title} ${m.note}`).join("\n"))}
document.getElementById('sharePage').onclick=()=>shareText("MAI topic","MAI topic — 2026年11月17日朝版（全"+cats.length+"ジャンル）");
document.getElementById('memoBtn').onclick=()=>{updateMemoUI();document.getElementById('memoDlg').showModal()};
updateMemoUI();
renderStage();
</script>

      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
} catch (e) {}
