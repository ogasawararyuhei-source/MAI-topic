れば眠りに入る。\n\n【ポイント・注意点】\n中で動くのは手を加えていない本家のKubernetesの実行ファイルだ。利用者の接続は全クラスター共通の1つのポートで受け、TLSの最初のあいさつに入った名前で行き先を決めて中継する。通信は最後まで暗号化されたままで、nostromoは中身を開かない。新しいクラスターは作成直後に裏で最初の起動を済ませるので、最初の利用者も普通の起床時間しか待たない。ノードとポッドには、クラスターごとに専用のポートを用意し、普通のアドレスでAPIに届くようにしている。待ち時間の約2秒をどう受け止めるかが、採用を決める分かれ目になりそうだ。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50579736"],["Straum：古くならないPostgreSQLの集計ビュー","PostgreSQLで重いGROUP BYの集計を、常に最新のまま一瞬で返す「Straum」がShow HNに出た。集計を一度だけ読んで各グループをメモリに持ち、PostgreSQLの複製の流れから追加、更新、削除を追い続ける。アプリはHTTPで問い合わせ、データベースには触れない。ニューヨークのタクシーの約2000万行での比較では、重い集計で数千倍速かったという。Rustで書かれている。","\n【概要】\nStraumは、PostgreSQLの集計を常に最新の状態で、マイクロ秒単位で返す仕組みだ。2026年11月20日に「決して古くならないPostgresのマテリアライズドビュー」としてShow HNへ投稿された。Rustで書かれており、作者はこの2週間ほど取り組んできたという。\n\n【背景】\n作者は投稿で、PostgreSQLを苦しめるGROUP BYの遅い問い合わせを何度も見てきたと書いている。READMEによると、ダッシュボードは同じ集計を一日中繰り返し、そのたびにPostgreSQLは全部の行を読み直す。定期的に作り直すマテリアライズドビューや、トリガーで保つ集計表で対処することが多いが、前者は作り直すまで古く、後者は手間がかかる。\n\n【詳細】\nStraumは行を一度だけ読み、各グループをメモリに持つ。その後はPostgreSQLの複製の流れから、すべての追加、更新、削除を追いかける。複製スロットは論理でも物理でも使える。利用者は集計をビューとして宣言し、StraumがHTTPで答える。拡張機能もスーパーユーザーの権限も要らず、正しいデータの元はあくまでPostgreSQLだ。READMEの測定では、半年分のニューヨークのタクシーの乗車、20,332,093行に同じ問いを投げ、答えが等しいことを確かめた。乗車地の区ごとの乗車数はPostgreSQLが1,058.8ミリ秒、Straumが269マイクロ秒で3,938倍、週ごとの運賃は9,260倍速かった。運賃の中央値でも192倍だった。\n\n【ポイント・注意点】\n同じ集計のマテリアライズドビューは903マイクロ秒から68.3ミリ秒で答えるが、それは最後に作り直した時点の答えで、作り直しには6,934.4〜10,819.7ミリ秒かかった。中央値や百分位などには答えられない。測定はApple M2 Pro、16GBの機械で1回行ったもので、Straumのメモリは305MiBだった。表と索引はPostgreSQL側で2,475MiBを占める。1コマンドでPostgreSQLとタクシーのデータとStraumを立ち上げる試し方も用意されている。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50578332"],["Printer Friendly PDF：暗い背景のPDFを印刷向きに直す","黒い背景のスライドなど、暗い色のPDFを印刷しやすく直す道具「Printer Friendly PDF」がShow HNに出た。暗い背景や画像を取り除き、薄い色の文字を黒にするが、ページを画像に変えないので、配置や選択できる文字はそのまま残る。処理はすべてブラウザの中で行い、ファイルはアップロードされない。要素を1つずつ選んで直したり、複数のPDFをつないだり、1枚に複数ページを並べたりもできる。","\n【概要】\nPrinter Friendly PDFは、PDFを印刷向きに直すためのブラウザで動く道具だ。2026年11月20日に「暗いPDFを、画像に変えずにブラウザで印刷向きにする」としてShow HNへ投稿された。デモのページが公開されており、その場で試せる。\n\n【背景】\n暗い背景のスライドや資料をそのまま印刷すると、インクやトナーを大量に使い、文字も読みにくくなる。ページを画像にしてから色を反転する方法もあるが、それでは文字が選べなくなり、画質も落ちる。この道具は、PDFの中身を要素ごとに書き換えることで、レイアウトと本物の文字を保ったまま色を直す。\n\n【詳細】\nREADMEによると、自動の掃除では暗い背景と画像を取り除き、薄い文字や淡い線を黒にする。切り替えで既定の動きを決め、個別の選択がそれに優先する。プレビューで要素をクリックして選べ、同じ場所をもう一度クリックするとその下の要素を選べる。サイドバーから選ぶ、グループにまとめて同じ操作をする、範囲を四角で囲む、といった方法もある。操作は、残す、消す、白で塗る、黒にするの4つだ。元と直した後を並べて見比べられる。複数のPDFを開いて並べ替えてつなげる機能、ページを番号や範囲で外す機能、1枚に1、2、4ページを並べる配置、余白と10%から400%までの拡大縮小もある。決まったページ数ごとに分けたPDFをZIPで保存することもできる。\n\n【ポイント・注意点】\nファイルはブラウザの外に出ないので、社外に出せない資料にも使いやすい。書き換えるのは手を入れたページだけで、リンク、コメント、フォームの欄もページと一緒に残る。一方で、スキャンしたページは文字と背景が1枚の絵になっているため検出して手を付けない。スキャンした資料には効かない点は覚えておきたい。矢印キーでのページ移動のほか、ページの削除と復元、選んだ要素の色の変更、範囲ツールへの切り替え、ページ番号への移動にもキーボードの近道がある。長い文書でも、ページの縮小表示は画面に入ったものから順に読み込まれ、外したページには取り消し線が付く。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50577959"],["SOAP Client：Rust製の軽いSOAPの試験用アプリ","SOAPのWebサービスを試すための、すっきりしたデスクトップアプリ「SOAP Client」がShow HNに出た。macOSとLinuxで動き、Rustで作られている。WSDLを読み込むと、すべての操作のリクエストのひな形を作り、SOAP 1.1と1.2に対応する。環境ごとの変数で接続先を切り替え、パスワードなどはmacOSのキーチェーンやLinuxのキーリングに保存して、プロジェクトのファイルには書かない。","\n【概要】\nSOAP Clientは、SOAPのWebサービスを試すためのデスクトップアプリだ。2026年11月20日に「Rustで作った、macOSとLinux向けの軽いSOAPクライアント」としてShow HNへ投稿された。READMEの見出しは「小さく、安全で、SOAPだけ」である。\n\n【背景】\n新しいWebサービスはRESTやGraphQLが中心になったが、金融や公共、古くからの業務システムではSOAPがまだ多く使われている。SOAPの試験に使える道具はあるものの、多機能で重いものが多い。SOAP Clientは機能をSOAPに絞り、すっきりした画面を目指している。\n\n【詳細】\nREADMEによると、WSDLはリンクかファイルから読み込め、中で取り込まれているスキーマも一緒に取り込む。一度読み込めばオフラインでも使える。スキーマから、すべての操作の既製のリクエストを作り、SOAP 1.1と1.2に対応する。リクエストのどこにでも{{name}}の形で変数を書け、環境を切り替えるだけで接続先のサーバーや資格情報を1クリックで変えられる。送るたびに、状態、XPath、文字の有無、SOAP Faultが返っていないか、応答時間を確かめる点検ができる。認証はHTTP BasicとWS-SecurityのUsernameTokenに対応し、独自のヘッダーも足せる。作業は自動で保存され、次に開いたときに戻る。プロジェクトは.jsonのファイルとして共有できる。\n\n【ポイント・注意点】\n秘密の情報は、macOSではTouch IDで開けるキーチェーンに、Linuxではキーリングに保存され、プロジェクトのファイルには入らない。Linuxでは、GNOME Keyring、KWallet、KeePassXCなどSecret Serviceに対応したキーリングが動いている必要があり、ない場合はアプリを閉じるまでしか保持されない。macOSは11以降でApple SiliconとIntelに対応し、Linuxはx86_64とarm64向けにDebian、Ubuntu、Arch Linuxの配布物がある。Windows版はない。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50577109"],["Vairë：自分のVPSでPostgreSQL 18を動かすCLI","自分で借りた仮想サーバーで、PostgreSQL 18をまとめて運用するためのコマンドの道具「Vairë（vaire）」の1.0.0-rc1がShow HNに出た。新しいDebian 13かUbuntu 26.04のサーバーを準備し、データベースごとに専用のクラスターと資源の上限、バックアップの履歴を持たせる。セキュリティ、バックアップ、指標、時点を指定した復元をそろえ、エージェントからも扱いやすいCLIにしたという。","\n【概要】\nVairë（コマンド名はvaire）は、自分のVPSでPostgreSQL 18を動かすための、準備から運用、復旧までを1つにまとめたCLIだ。2026年11月20日に1.0.0-rc1がShow HNへ投稿された。作者は投稿で、セキュリティ、バックアップ、指標、PITR（時点を指定した復元）を、エージェントが使いやすいCLIで提供すると説明している。LinuxとMacで使える。\n\n【背景】\n管理されたデータベースのサービスは便利だが、費用がかさみやすい。自分でサーバーを借りれば安く済む一方、バックアップや復元、安全な接続の仕組みを自分で整える必要がある。Vairëはこの手間を道具に任せることを狙っている。\n\n【詳細】\nREADMEによると、vaireは新しいDebian 13またはUbuntu 26.04のサーバーを準備する。データベースごとに専用のPostgreSQLのクラスターと資源の上限を持たせ、バックアップを設定した場合は、それぞれ別のバックアップと復元の履歴を持つ。運用者はWireGuardの中のSSHでサーバーを管理し、アプリは普通のPostgreSQLのクライアントでPgBouncerを通してつなぐ。サーバー上に管理用の常駐プログラムや公開の管理APIはない。命令はvaire server initによる準備、望む状態を示すplanとapply、データベースの作成、大きさの変更、複製、分岐、物理バックアップとWALによるbackup、時刻や最新を指定するrestoreなどがそろっている。設定の調整を説明して適用するtuneもある。\n\n【ポイント・注意点】\nREADMEは、専用の新しいサーバーで使うよう求めている。今の構成はPgBouncerとVairë管理のnginxを使い、既存のCaddyの環境は移行しない。複数台の管理や、拡張機能をその場で外すことには対応していない。アルファとベータは互換の基準にならず、その場での更新はリリース候補から対応し、手順はリリースノートに載せるという。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50577053"],["Pug：Goで作ったオープンソースの製品分析基盤","ウェブやアプリの利用者の行動を記録して分析する、オープンソースの製品分析基盤「Pug」がShow HNに出た。出来事を集め、その背後の人を特定し、ファネル、継続率、傾向、利用者の流れなどで行動を調べ、ダッシュボードに並べられる。GoでPostgreSQL、ClickHouse、NATSの上に作られ、ウェブ、iOS、Android、Flutterなど7種類のSDKがある。MCPサーバーも持ち、AIから分析を呼び出せる。","\n【概要】\nPugは、オープンソースの製品分析のプラットフォームだ。2026年11月20日にShow HNへ投稿された。利用者の操作を出来事として記録し、その出来事を起こした人を特定し、ファネル、継続率、傾向、分割、利用者の流れの分析を通して行動を調べられる。結果は自由に組めるダッシュボードに並べる。\n\n【背景】\n製品の改善には、利用者が画面のどこで離れ、何度戻ってくるかを知ることが欠かせない。こうした分析は有料のサービスに頼ることが多いが、データを自分で持ちたい会社もある。Pugは、自分で動かせるオープンソースの選択肢として作られている。\n\n【詳細】\nREADMEによると、PugはGoで書かれ、PostgreSQL、ClickHouse、NATSの上で動く。SDKはウェブ、iOS、Android、Flutter、Node.js、Go、Rubyの7種類だ。出来事の取り込みはNATSを使った流れで、地域、ブラウザなどの情報、ボットの検出、ウェブの流入元を自動で補う。ウェブ分析の概要は、訪問者、セッション、ページビュー、直帰率、流入元を、設定なしで出来事から組み立てる。ライブの画面では、今いる訪問者を世界地図に映し、1人を選ぶとそのページ、機器、人物の情報まで見られる。インサイトでは、傾向、ファネル、継続率、分割、サンキー図の利用者の流れ、上位の内訳を、絞り込みや前の期間との比較つきで扱える。ダッシュボードは格子に分析とMarkdownの部品を並べ、事前に集計した近道で速くしている。\n\n【ポイント・注意点】\nMCPサーバーを備え、ClaudeやChatGPTなどMCPに対応したAIが、分析や出来事、人物の情報を問い合わせたり、ダッシュボードを作ったりできる。GDPRやDPDPに沿って、特定の人の出来事と情報を消す機能もある。生の出来事を届いた順に、場所、機種、属性、人物とともに一覧する画面もあり、取り込みの確認に使える。人の行動を細かく追える道具なので、導入する側は同意の取り方と保存の範囲をきちんと決めておきたい。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50576620"]],"gh-blog":[["Qiita雑記11月21日、GitHubの更新4件をまとめて紹介","Qiitaで石坂忠浩氏が毎日公開している「プログラミング雑記」の2026年11月21日版が、GitHub関連の更新をまとめて取り上げた。プルリクエスト概要ページの改良（公開プレビュー）、GitHub Desktopの同一ホスト複数アカウント対応、新しいダッシュボードで最大25件のリポジトリを固定できる機能、GitHub Enterprise Server 3.23のリリース候補の4件で、日々の技術ニュースの中からGitHub周りの動きを一度に追える。","\n【概要】Qiitaで石坂忠浩氏（@ishisaka）が公開している日刊の技術ニュースまとめ「プログラミング雑記 2026年11月21日」が、GitHubに関する更新を4件取り上げた。プルリクエスト概要ページの改良、GitHub Desktopの複数アカウント対応、ダッシュボードのお気に入りリポジトリ、GitHub Enterprise Server（GHES）3.23のリリース候補である。セキュリティ、データベース、Microsoft製品などのニュースと並んで紹介されており、週の後半に出たGitHubの更新を日本語で短く確認できる記事になっている。\n\n【背景】GitHubは公式の変更履歴（Changelog）で日々多くの更新を公開しているが、英語で量も多く、すべてを追うのは手間がかかる。この雑記は、筆者が気になったニュースへのリンクに短いコメントを添えて毎日まとめる形式で、GitHub以外の話題も同じ日の記事で扱っている。\n\n【詳細】プルリクエスト概要ページについては、公開プレビューとして、マージ状況の分かりやすさ、レビューやコメントの操作、アクティビティの詳細、ページとサイドバーの配置が改良されたと紹介している。GitHub Desktopは同じホストで複数のアカウントを使えるようになり、リポジトリごとにどのアカウントを使うかを結び付けられる。新しいダッシュボードでは「Favorite repositories」の欄で最大25件のリポジトリを固定でき、設定はGitHub Mobileと同期する。GHES 3.23のリリース候補については、GitHub Projectsの高度な絞り込み、オフライン環境でのAIによる秘密情報の検出、マルウェアのアドバイザリの拡充、Dependabotの更新を待つ期間の設定、OAuthトークンの有効期限、Redis専用ノードへの移行が挙げられている。\n\n【ポイント・注意点】記事は各項目を短くまとめたものなので、正確な条件や提供範囲は元の公式発表で確かめる必要がある。一方で、同じ日のAzure DevOps向けCopilotコードレビューの一般提供なども同じ記事に載っており、GitHubとその周辺の動きを横断して把握する入口として使いやすい。","2026-11-21","Qiita","https://qiita.com/ishisaka/items/e630b4572a4911bdc6cf"],["セキュリティアドバイザリの権限をカスタムロールで付与、一般提供に","GitHubは2026年11月20日、リポジトリのセキュリティアドバイザリと非公開の脆弱性報告を扱う権限を、カスタムリポジトリロールで付与できる機能を一般提供した。これまでは担当者をリポジトリ管理者にするか、組織全体のセキュリティマネージャーにする必要があった。閲覧、作成と管理、報告の受け付け、公開とCVE申請の4つの権限が新設され、必要なリポジトリだけに絞って任せられるようになる。","\n【概要】GitHubは2026年11月20日、セキュリティアドバイザリの権限をカスタムリポジトリロールで付与できる機能が一般提供になったと発表した。組織のオーナーは、リポジトリのセキュリティアドバイザリや非公開の脆弱性報告に関わる作業を、管理者権限や組織全体のセキュリティマネージャー権限を渡さずに任せられる。カスタムリポジトリロールに対応したプラン、たとえばGitHub Enterprise Cloudで使える。\n\n【背景】脆弱性の報告を受けて修正し、アドバイザリとして公開する作業には、これまで強い権限が必要だった。そのため、担当者をリポジトリ管理者にするか、組織全体のセキュリティマネージャーに指名するしかなく、必要以上の範囲にアクセスを与えることになりがちだった。今回の変更で、チームが保守しているリポジトリだけに権限を絞れるようになる。\n\n【詳細】カスタムリポジトリロールを作成・編集する画面の「Security」の欄に、4つの権限が加わった。1つ目は、下書きのアドバイザリとその状態、コメントを見られる「閲覧」。2つ目は、閲覧に加えてアドバイザリの作成と編集、コメント、共同作業者の管理、一時的な非公開フォークの作成ができる「作成・編集・管理」。3つ目は、非公開の脆弱性報告の受け付けとアドバイザリのクローズや再オープンで、閲覧か作成・編集・管理の権限が前提になる。4つ目は、アドバイザリの公開とCVEの申請で、こちらも同じ前提が必要になる。GitHubは、ロールを必要なリポジトリの利用者やチームだけに割り当てることを勧めている。\n\n【ポイント・注意点】制限もある。一時的な非公開フォークからの変更のマージには、引き続きリポジトリ管理者かセキュリティマネージャーが必要になる。新しい権限を持つ人でも、一時的な非公開フォークは削除できない。また、機密のコメントを使えるのは、作成・編集・管理の権限に加えてリポジトリへの書き込み権限を持つ人に限られる。最小権限で脆弱性対応の体制を組みたい組織にとっては、役割の分け方を見直すきっかけになる。","2026-11-20","GitHub Changelog","https://github.blog/changelog/2026-11-20-security-advisory-permissions-are-now-generally-available"],["GitHub Enterprise Server 3.23のリリース候補が公開","GitHubは2026年11月20日、GitHub Enterprise Server（GHES）3.23のリリース候補を公開した。Projectsの絞り込みでORや括弧を使えるようになり、GPUや外部接続なしで動くAIの秘密情報検出が公開プレビューで入る。npm以外のPyPIやMavenなどの悪意あるパッケージ検出、Dependabotの3日間の待機、OAuthアプリのトークン期限、Redisの主ノードの移動なども加わった。","\n【概要】GitHubは2026年11月20日、自社運用版のGitHub Enterprise Server（GHES）3.23のリリース候補を公開した。リリース候補は、一般提供の前に新機能を試し、意見を寄せてもらうためのものと位置づけられている。今回はProjectsの絞り込み、AIによる秘密情報の検出、悪意あるパッケージの検出範囲の拡大、Dependabotの待機期間、OAuthアプリのトークン期限、クラスタ構成でのRedisの配置などが含まれる。\n\n【背景】GHESは企業が自社の環境で動かすGitHubである。閉じたネットワークや外部と接続しない環境で使う組織も多く、今回の秘密情報検出のように、外部のサービスに頼らずに動くことが重視される機能もある。\n\n【詳細】Projectsの表示では、論理和のOR、明示的なAND、括弧を組み合わせた絞り込みができる。AIによる秘密情報の検出は公開プレビューで、決まった形をしない秘密情報をネットワーク内で見つける。専用に調整したモデルがアプライアンスのCPU上で動き、GPUや外部のLLM、外向きの通信を必要としないため、外部と切り離された環境でも使える。GitHub Secret Protectionが必要になる。悪意あるパッケージの検出は、npmに加えてPyPI、Maven、RubyGems、NuGet、Go、Rust、Composerに広がった。Dependabotは既定で、公開から3日以上たったバージョンだけを更新のプルリクエストにする。OAuthアプリのトークン期限は公開プレビューで、アクセストークンが8時間で切れ、リフレッシュトークンで取り直す仕組みになる。新しく作るアプリでは既定、既存のアプリでは選択制となる。\n\n【ポイント・注意点】トークン期限を必須にする前に、すべてのクライアントがリフレッシュトークンを扱えるようにしておかないと、対応していないクライアントでサインインが壊れると注意されている。Redisの主ノードはMySQLなどと同居するノードから専用ノードへ移せるが、この手順は既存ノードへのディスク追加や外部のRedisの利用ではない。なお、ページの本文では3.23が「利用可能」と書かれているが、タイトルはリリース候補となっている。","2026-11-20","GitHub Changelog","https://github.blog/changelog/2026-11-20-github-enterprise-server-3-23-release-candidate"],["ダッシュボードにお気に入りのリポジトリを最大25件固定","GitHubは2026年11月20日、ダッシュボードに「Favorite repositories」の欄を追加し、表示するリポジトリを自分で選べるようにした。編集画面で検索して選び、保存すると一覧の末尾に加わる。選んだリポジトリはGitHub Mobileで固定したリポジトリと同期し、両方を合わせて最大25件まで登録できる。新しいダッシュボードを有効にしていない場合は、従来の「Top repositories」の表示がそのまま残る。","\n【概要】GitHubは2026年11月20日、ダッシュボードに「Favorite repositories（お気に入りのリポジトリ）」の欄を追加したと発表した。利用者は、ダッシュボードに表示するリポジトリを自分で選べる。選んだ内容はGitHub Mobileで固定しているリポジトリと同期し、上限は両方を合わせて25件となる。\n\n【背景】GitHubのダッシュボードは、ログイン後に最初に目にする画面で、よく使うリポジトリへの入口になっている。これまでの「Top repositories」の欄は自動で選ばれる仕組みで、本当に毎日触るリポジトリが並ぶとは限らなかった。多くのリポジトリに関わる開発者ほど、目的の場所にすぐ移れることの価値は大きい。新しい欄は、表示するリポジトリを利用者自身が決められるようにしたものだ。なお、新しいダッシュボードの体験を有効にしていない場合は、従来のTop repositoriesの欄がそのまま使われる。\n\n【詳細】編集するには、欄の「Edit」か「Add」を選んで選択画面を開き、リポジトリを検索して選んだり外したりする。検索している間も、すでに選んだリポジトリは見えたままになる。「Save」で反映し、「Cancel」で変更を捨てられる。新しく加えたお気に入りは一覧の末尾に並ぶ。お気に入りはGitHub Mobileで固定したリポジトリと同期し、どちらかで変更すると、もう一方でも再読み込みのあとに反映される。上限は両方の体験を合わせて25件で、保存すると上限を超える場合はエラーが表示され、一覧は変わらない。\n\n【ポイント・注意点】上限の25件はWebとモバイルで共通なので、モバイルで多く固定している人は、Web側で追加できる数がその分減る。発表では、対象のプランや一般提供かどうかについては触れられていない。意見はGitHub Communityのディスカッションで受け付けている。小さな改良だが、毎日のように画面を開く開発者にとっては、作業の始まりを少し速くする変更といえる。","2026-11-20","GitHub Changelog","https://github.blog/changelog/2026-11-20-pin-your-favorite-repositories-to-your-dashboard"],["DeepMindの空リポジトリ「math-horizon」がHNで話題に","Google DeepMindのGitHub組織に、中身のない「math-horizon」というリポジトリが現れ、Hacker Newsで話題になった。コードもREADMEも説明もなく、名前だけから数学向けのベンチマークやモデルではないかという推測が広がったが、目的は確認されていない。紹介記事の時点で44ポイント、コメントは31件で、リンクが消えたという声も出ている。AI要約サイトZeliが2026年11月20日に伝えた。","\n【概要】Hacker NewsをAIで要約するサイトZeliは2026年11月20日、Google DeepMindのGitHub組織に「math-horizon」という空のリポジトリが現れ、ネットで注目を集めたと伝えた。リポジトリにはコードもREADMEも説明もなく、GitHubが空のリポジトリに出す決まりの案内文だけが表示されていた。紹介ページの時点で44ポイント、コメントは31件だった。\n\n【背景】大手のAI研究組織がGitHubに新しいリポジトリを作ると、正式な発表の前触れではないかと注目されることがある。今回は名前に「math（数学）」が入っていたことから、数学に特化したベンチマークやモデルの公開につながるのではないかという推測が広がった。記事によると、リポジトリは記事の数時間前に作られ、見つかった話がHacker Newsで素早く広まった。\n\n【詳細】ページでは、リポジトリに表示されていた「This repository is empty.」で始まる、GitHubのYouTubeチャンネルを案内する定型文を引用している。コメント欄の多くは反応で、リーマン予想を挙げる人がいたほか、「自分には見えない」「リンクが切れている、存在しても非公開か隠されているのでは」といった、すでにアクセスできないという報告が相次いだ。ミレニアム懸賞問題のような難問については、あとは誰が十分な計算資源を使う気があるかの問題だ、という書き込みも紹介されている。\n\n【ポイント・注意点】記事は、リポジトリの目的が確認されていないことをはっきり書いている。また、削除されたのか非公開にされたのかも確認しておらず、コメントした人たちがたどり着けなかったと伝えているだけだ。名前だけで話題になった例であり、中身や狙いを判断するには、DeepMindからの正式な発表を待つ必要がある。公開組織に空のリポジトリを作ると、それだけで外部の目に触れて憶測を呼ぶという点は、企業がGitHubを運用するうえでの教訓にもなる。","2026-11-20","Zeli","https://zeli.app/story/50582629"],["OpenAIやAnthropicが独自のGitHubを作る理由を分析","dev.toで、OpenAI、Anthropic、SpaceX傘下のCursorがそれぞれ自前のコード管理基盤を作る理由を分析する記事が公開された。AIで増えるコードの量にGitHubが追いついていないと論じ、外部の集計による障害件数や、CursorのOrigin、OpenAIのPando、AnthropicのScionの数値を並べて比べている。それでもGitHubは交流の場として残るとし、ミラーを持つよう勧めている。","\n【概要】dev.toに、筆者amananandrai氏による「Why OpenAI, Anthropic and SpaceX's Cursor Are All Building Their Own GitHub」が公開された。AIが生み出すコードの量が増え、AI企業が自前のコードの置き場を作り始めているという見方を示し、3社の取り組みを数値とともに比べた分析記事である。\n\n【背景】記事は、外部の集計で2025年5月から2026年4月までにGitHubの障害が257件（うち重大48件）あり、最も多かったのは2026年2月の37件だと紹介する。2026年3月にCopilot Coding Agentのエラー率が2回100%になったこと、4月1日のコード検索の2時間20分の停止、11月3日のHTTPSでのGit操作の約7.5時間の劣化、11月16日のプルリクエストの4時間27分の障害も挙げている。新しいリポジトリは月3,030万件と1,000万件から増え、2026年のGitHub Actionsのジョブは約450億件としている。\n\n【詳細】SpaceXはCursorを開発するAnysphereの買収を2026年6月16日に発表し、8月14日に株式600億ドルで完了した。8月17日に公開されたOriginはGitの置き場で、有料プランで初期ベータとして提供され、GitHubと双方向で同期する。OpenAIは11月2日、Rustで書いた社内のGitの土台Pandoを発表した。約10週間で作り、プッシュの待ち時間の中央値を約80%縮めたという。11月4日には、Code Storageを作った約10人の企業Pierre Computer Companyの買収も発表した。Anthropicは10月13日に記事を出し、1日のマージが5月の約2,500件から9月には3万件超に増えたと説明した。7人のチームが5か月でモノレポをGitから自前のScionに移し、CPUとメモリを約200分の1にしたという。Scionは社内専用である。\n\n【ポイント・注意点】記事は最後に、GitHubは代わりの置き場が置き換えない交流の場として残ると述べ、ミラーを用意しておくよう勧めている。障害件数は外部の集計にもとづく数字で、各社の数値も記事が紹介したものなので、詳しくは元の発表で確かめたい。","2026-11-20","DEV Community","https://dev.to/amananandrai/why-openai-anthropic-and-spacexs-cursor-are-all-building-their-own-github-33lg"],["S3への監査ログ配信のOIDC対応がGHE.comにも拡大","GitHubは2026年11月19日、エンタープライズの監査ログをOpenID Connect（OIDC）でAmazon S3へ流す機能を、データ所在地を選べるGitHub Enterprise Cloud（GHE.com）でも使えるようにした。github.comですでに使えた機能の拡大で、長期間有効なAWSの認証情報をGitHubに保存せずに認証できる。設定方法は、エンタープライズの監査ログ配信のドキュメントで案内されている。","\n【概要】GitHubは2026年11月19日、エンタープライズの監査ログをOpenID Connect（OIDC）を使ってAmazon S3に流す機能が、データ所在地に対応したGitHub Enterprise Cloud、つまりGHE.comでも使えるようになったと発表した。github.comで提供されていた機能をGHE.comに広げたもので、長期間有効なAWSの認証情報をGitHubに保存しなくても認証できる点が特徴である。\n\n【背景】監査ログは、だれがいつ何を操作したかを残す記録で、企業ではセキュリティの監視や規制への対応のために、自社の保管先へ流し続けることが多い。S3に送るには、GitHubからAWSへの書き込みを認める必要がある。アクセスキーのような長く使える秘密情報をGitHub側に置くと、漏れたときの影響が大きく、定期的な入れ替えの手間もかかる。OIDCは、事前に信頼関係を設定しておき、その都度短い期間だけ使える資格で認証する仕組みで、保管しておく秘密情報を減らせる。GHE.comは、データを置く地域を選べる形で提供されるGitHub Enterprise Cloudで、github.comで先に出た機能が後から広がることがある。\n\n【詳細】発表によると、GHE.comのエンタープライズでも、監査ログの配信先としてS3を選び、認証にOIDCを使えるようになった。これはgithub.comですでに可能だったことの拡大と説明されている。具体的な設定の手順は、GitHub Docsの「エンタープライズの監査ログを配信する」の中の、OpenID ConnectでS3への配信を設定する節で案内されている。OIDCの仕組みについては、OpenID Foundationの解説ページへのリンクが付いている。\n\n【ポイント・注意点】発表は短く、一般提供かプレビューかといった提供の段階や、必要なプランの条件、細かな手順は書かれていない。導入を考える場合は、リンク先のドキュメントでAWS側の信頼関係の設定などを確認する必要がある。データ所在地の要件からGHE.comを選んだ組織にとっては、github.comと同じ安全な方法で監査ログを外へ出せるようになる点が利点になる。","2026-11-19","GitHub Changelog","https://github.blog/changelog/2026-11-19-s3-audit-log-streaming-with-openid-connect-expands-to-ghe-com"],["GitHub CLIの「gh event listen」でPRの変化を待てる","GitHubは2026年11月18日、GitHub CLIがプレビュー中のGitHub Event Streamsに対応したと発表した。gh v2.105.0以降では「gh event listen」にプルリクエストのURLと待ちたいイベントを渡すだけで、レビューの提出やチェックの完了などを、ループでの問い合わせなしに待てる。既定では最初のイベントで終わるため、スクリプトやAIエージェントの処理の流れに組み込みやすい。","\n【概要】GitHubは2026年11月18日、GitHub CLIがGitHub Event Streamsに対応したと発表した。gh v2.105.0から、利用者やAIエージェントは、プルリクエストの変化を1つのコマンドで待てるようになる。これまでのように、ループで何度も状態を問い合わせる必要はない。\n\n【背景】プルリクエストのレビューやCIの結果を待つ処理は、スクリプトやエージェントの中で何度もAPIに状態を問い合わせる形で書かれることが多かった。GitHubは11月17日に、変化をこちらから取りに行かずに受け取れるEvent Streamsをプレビューとして発表しており、今回はそれをCLIから手軽に使えるようにしたものだ。\n\n【詳細】「gh event listen」にプルリクエストのURLと、提出されたレビューなど待ちたいイベントを指定すると、コマンドが購読を作って流れを開き、イベントを1件ずつJSONの1行として出力する。既定では最初のイベントで終わるため、スクリプトやエージェントの処理に組み込みやすい。「--count」で複数のイベントを待ち、「--follow」で聞き続け、「--timeout」で待つのをやめられる。「--jq」や「--template」で必要な項目だけを取り出せる。待てるイベントは、提出されたレビュー、プルリクエストの状態や先頭のコミットの変化、マージの衝突、完了したチェックスイートである。購読を直接扱う「gh event subscription」のcreate、list、view、deleteもある。さらに、gh pr create、gh pr view、gh run view、gh run watch、gh apiが、問い合わせの代わりにgh event listenを使うよう案内するようになり、エージェントが新しいコマンドを自分で見つけられる。\n\n【ポイント・注意点】gh eventのコマンドはプレビューで、変更される可能性がある。使うにはGitHub.comでプレビュー中のEvent Streamsへのアクセスが必要で、順番待ちの登録を通じて提供される。始めるにはgh v2.105.0以降に上げる必要がある。料金や一般提供の時期は示されていない。","2026-11-18","GitHub Changelog","https://github.blog/changelog/2026-11-18-wait-for-pull-request-events-with-github-cli"],["SupabaseやBoxなど8サービスをCopilotに接続可能に","GitHubは2026年11月18日、検証済みのMCPサーバー「コネクタ」で、8つのサービスをCopilotにつなげられるようにした。Box、Buildkite、Calendly、ClickUp、Mixpanel、Supabase、Webflow、Wixで、SlackやFigma、Sentryなど25以上の既存サービスに加わる。コネクタは全Copilotプランで公開プレビューとして使え、アプリやCLI、VS Codeなどから接続できる。","\n【概要】GitHubは2026年11月18日、GitHubが検証したMCPサーバーである「コネクタ」を通じて、さらに8つのサービスをCopilotに接続できるようになったと発表した。追加されたのはBox、Buildkite、Calendly、ClickUp、Mixpanel、Supabase、Webflow、Wixである。SlackやFigma、Sentryなど、すでに使える25以上のサービスに加わる。\n\n【背景】MCPは、AIが外部のツールやデータを使うための仕組みである。CopilotはこのMCPを使って外部のサービスとつながることで、コードの外にある情報を見ながら作業できる。GitHubは検証済みのMCPサーバーをコネクタとしてまとめて提供しており、一覧はCopilotアプリの「Customize」タブや、github.com/copilot/customizeで見られる。\n\n【詳細】発表では各サービスでできることとして、Boxは中身の検索と管理やBox AIの利用、Buildkiteはパイプラインとビルド、Calendlyは予定や会議の管理、ClickUpはタスクとプロジェクトの追跡、Mixpanelはプロダクト分析、Supabaseはプロジェクトとデータベース、Webflowはサイトと中身の管理、Wixはサイトと事業の道具の管理を挙げている。使い方の例として、Buildkiteのビルドが失敗した理由をCopilotに尋ね、同じセッションでコードを直させることや、マイグレーションを書く前にSupabaseのスキーマを確かめさせることが示されている。接続すると、そのサービスはCopilot全体で使える。接続はCopilotアプリの「Customize」、Copilot CLIの「/mcp」、VS Code、github.comから行える。\n\n【ポイント・注意点】コネクタはすべてのCopilotプランで公開プレビューとして提供される。Copilot BusinessやEnterpriseでは、管理者が「Editor preview features」のポリシーを有効にする必要がある。企業のMCP許可リストでコネクタを個別に列挙している場合は、新しいコネクタを追加する必要がある。Boxのように、サービス側でMCPでのアクセスを許可しなければならないものもある。","2026-11-18","GitHub Changelog","https://github.blog/changelog/2026-11-18-connect-supabase-box-calendly-and-more-to-copilot"],["Gemini 4 NeonがGitHub Copilotで一般提供に","GitHubは2026年11月18日、GoogleのモデルGemini 4 NeonをGitHub Copilotで一般提供した。エージェント型のコーディングや複数の手順にわたるツールの利用、知識作業向けとされる。Googleによると、Gemini 4 Carbonに近い品質を、作業あたりのトークン費用を抑えて出せるという。Copilot Pro+、Max、Business、Enterpriseの利用者が対象で、順次展開される。","\n【概要】GitHubは2026年11月18日、GoogleのGemini 4 NeonがGitHub Copilotで一般提供になったと発表した。エージェント型のコーディング、複数の手順にわたるツールの利用、知識作業のために設計されたモデルと説明されている。Copilot Pro+、Max、Business、Enterpriseの利用者が使え、展開は段階的に進む。\n\n【背景】GitHub Copilotは、複数の会社のAIモデルを選んで使えるようになっており、新しいモデルが次々に加わっている。11月16日の週次まとめでは同じGoogleのGemini 4 Carbonの追加が伝えられており、今回のNeonは、それに近い品質を少ない費用で使える選択肢として位置づけられている。\n\n【詳細】発表がGoogleの説明として紹介しているところでは、Gemini 4 NeonはGemini 4 Carbonに近い品質を、作業ごとのトークン費用を抑えて出せる。Carbonと比べて応答を始めるのが速く、コーディングの作業で頼まれていない変更をすることが少なく、コードやツール、テストの結果について根拠のない主張をしにくいという。料金は、使った量に応じた課金のもとで、提供元の定価で請求される。詳しくはCopilotのモデルと料金のドキュメントを参照するよう案内されている。モデル選択の画面から選べる場所は、Visual Studio Code、Visual Studio、Copilot CLI、Copilotのコーディングエージェント、Copilotアプリ、github.com、iOSとAndroidのGitHub Mobile、JetBrainsのIDE、Xcode、Eclipseである。\n\n【ポイント・注意点】展開は段階的で、まだ表示されない場合はあとで確かめるよう案内されている。Copilot BusinessとEnterpriseでは、管理者がCopilotの設定のモデルのポリシーで利用を管理する。既定のモデル有効化の設定では、新しいモデルは自動で有効になるが、管理者が全体の既定を切っている場合や、このモデルを明示的に無効にしている場合は使えない。品質の比較はGoogleによる説明であり、実際の使い勝手は自分の作業で確かめたい。","2026-11-18","GitHub Changelog","https://github.blog/changelog/2026-11-18-gemini-4-neon-in-github-copilot"],["GitHub Teamでセキュリティリスク評価が自動実行に","GitHubは2026年11月18日、GitHub Teamプランの組織で、無料のセキュリティリスク評価が自動で実行されるようになったと発表した。組織の管理者とセキュリティマネージャーは、評価の結果から、さらされている認証情報やコードの脆弱性を見つけ、組織の現在のリスクを把握し、次に何から手を付けるかの優先順位を決められる。コードのリスク評価と秘密情報のリスク評価のドキュメントも案内されている。","\n【概要】GitHubは2026年11月18日、GitHub Teamプランの組織で、セキュリティリスク評価が自動的に実行されるようになったと発表した。評価は無料と説明されている。組織の管理者とセキュリティマネージャーは結果を確認することで、さらされている認証情報やコードの脆弱性を見つけ、組織が今どのようなリスクを抱えているかを理解し、次の対応の優先順位を付けられる。\n\n【背景】リポジトリに誤って入った鍵やトークン、コードに残った脆弱性は、気づかないうちに攻撃の入口になる。とくに専任のセキュリティ担当者がいない小さめの組織では、まず全体の状況をつかむこと自体が難しい。GitHubは、コードのリスク評価と秘密情報のリスク評価という形で、組織の状態をまとめて点検する仕組みを用意しており、今回はそれがTeamプランで自動的に走るようになった。\n\n【詳細】発表によると、評価はGitHub Teamの組織で自動的に実行される。結果を確認できるのは、組織の管理者とセキュリティマネージャーである。結果からは、外にさらされた認証情報と、コードの脆弱性を見つけられる。そのうえで、組織の現在のリスクを把握し、何から手を付けるかを決める材料にできるとしている。詳しくは、コードセキュリティのリスク評価と、秘密情報のリスク評価についてのドキュメントへのリンクが付いている。利用者が設定を変えなくても評価が走る点が、今回の変更の中心である。自分たちから点検を始めなくても、組織の状態を知る手がかりが手元に届くようになる。\n\n【ポイント・注意点】発表は短く、一般提供かプレビューかといった提供の段階や、有効にするための手順は書かれていない。対象として名前が挙がっているのはGitHub Teamの組織だけで、ほかのプランへの影響については触れていない。評価が自動で走っても、見つかった認証情報の無効化や脆弱性の修正は組織側の作業になる。管理者やセキュリティマネージャーは、結果を定期的に確認する習慣を作ることが大切になる。","2026-11-18","GitHub Changelog","https://github.blog/changelog/2026-11-18-security-risk-assessments-run-automatically-on-github-team"],["チーム単位でCopilotのプラグインを既定設定、一般提供","GitHubは2026年11月18日、組織のチーム単位でGitHub Copilotをカスタマイズする機能を一般提供した。チームのメンテナーや組織のオーナーが、承認したAgent Pluginをチームの既定として選べるため、メンバーが一人ずつ設定する必要がなくなる。VS Code、Copilotアプリ、Copilot CLIで直接のメンバーに既定で有効になる。対象はCopilot BusinessとEnterpriseで、企業や組織のポリシーが優先される。","\n【概要】GitHubは2026年11月18日、組織のチームごとにGitHub Copilotをカスタマイズする機能が一般提供になったと発表した。チームのメンテナーや組織のオーナーは、承認したAgent Pluginをチームの既定として選べる。メンバーは自分で一つずつ設定しなくても、チームで決めたプラグインを使い始められる。Copilot BusinessとCopilot Enterpriseで利用できる。\n\n【背景】Copilotには、個人ごとのカスタマイズと、組織全体のポリシーという2つの段階があった。チームによって使う道具や進め方は違うため、その中間にあたる、チームで共有する出発点がほしいという場面がある。今回の機能は、個人の設定と組織のポリシーの間を埋めるものと説明されている。\n\n【詳細】設定するには、チームのメンテナーか組織のオーナーが、github.comで組織のチームを開き「Customize Copilot」タブを選ぶ。そこでは、Copilotに組み込まれたマーケットプレイス、企業のマーケットプレイス、チームが追加したマーケットプレイスからプラグインを探し、個別にチームへ加えられる。プラグインのマーケットプレイスを含むGitHubのリポジトリを、マーケットプレイスとして追加することもできる。選んだプラグインは、チームの直接のメンバーに対して、VS Code、GitHub Copilotアプリ、Copilot CLIで既定で有効になる。子チームのメンバーには引き継がれない。チームの既定は必須ではなく、ポリシーが許す範囲で、メンバーは自分のCopilotでチームのプラグインを切ることもできる。\n\n【ポイント・注意点】企業や組織のポリシーはチームの選択より優先される。どのマーケットプレイスを許すか、どのプラグインを必須にしたり禁止したりするかは、引き続きCopilotの側で守られ、チームの既定がそれを上書きすることはない。子チームに引き継がれない点は、入れ子のチーム構成を使う組織では注意が必要になる。","2026-11-18","GitHub Changelog","https://github.blog/changelog/2026-11-18-customize-github-copilot-for-your-team"],["任天堂がPicoflyのファームウェアをGitHubから削除","任天堂が、Nintendo Switchで署名のないプログラムを読み込めるようにするPicoflyのファームウェアをGitHubから削除させた件が、Hacker Newsで議論を呼んだ。PicoflyはSwitchとは別のチップ向けに一から書かれ、著作物を含まないとされる。削除の根拠が米著作権法1201条だった点をめぐり、ハードウェアを作るすべての事業者に関わる法的な問いだとして、265ポイント、105件のコメントが集まった。","\n【概要】Hacker NewsをAIで要約するサイトZeliは2026年11月18日、任天堂がPicoflyのファームウェアをGitHubから削除させたという話題を伝えた。元の投稿は、この件を扱う動画へのリンクである。Picoflyは、Switchとは別のチップ向けに一から書かれたファームウェアで、著作権のある素材を含まないと説明されている。目的は、Switchで署名のないプログラムを読み込めるようにすることだという。紹介の時点で265ポイント、コメントは105件だった。\n\n【背景】GitHubは、著作権者から米国のデジタルミレニアム著作権法（DMCA）にもとづく削除の申し立てを受けると、対象のリポジトリを公開停止にする。ゲーム機の改造に関わるソフトウェアは、こうした申し立ての対象になりやすい。今回は、著作物を含まないとされるファームウェアが対象になったことで、議論が広がった。\n\n【詳細】記事は、購入したハードウェアの持ち主に管理者の権限を与える汎用の解除ツールが、それだけで米著作権法1201条の違法な取引にあたるのか、というコメントの問いを紹介している。コメント欄では、認められたソフトウェアだけを動かすための仕組みが、DMCAで守られる技術的保護手段にあたるのかという疑問が出た。DMCAの削除は通常512条にもとづくが、任天堂は1201条だけを挙げていたという指摘もある。同じ人は、前日にTake-Twoが、手持ちのGTA 5をAppleのハードウェアで動かすソフトウェアへの削除を申し立てていたとも書いている。11月11日付の関連スレッドへのリンクも貼られた。\n\n【ポイント・注意点】元のリポジトリは2023年から公開されたままで、削除されたのはファームウェア以外のものも含むフォークだったという書き込みもある。バックアップやミラーを勧める声や、Radicleのような分散型の道具を挙げる声、1201条の廃止を求める声も出ている。記事は任天堂の声明や法的な判断は伝えておらず、内容の多くはコメント欄の主張である点に注意したい。","2026-11-18","Zeli","https://zeli.app/story/50547048"],["Copilotアプリ、Azure DevOpsとブラウザ操作に対応","GitHubは2026年11月17日、Microsoft Igniteに合わせてGitHub Copilotアプリの更新を発表した。Azure DevOpsのリポジトリでブランチ作成からプルリクエストまでを扱える機能と、サインイン済みのブラウザをCopilotに操作させる機能を公開プレビューで追加した。GitHub Enterprise Serverへの対応は一般提供となり、アプリの1.2.0以降が必要になる。いずれもクラウドのセッションは使えない。","\n【概要】GitHubは2026年11月17日、Microsoft Igniteに合わせてGitHub Copilotアプリの更新を発表した。Copilotは作業する場所で使えるほど役立つとして、Azure DevOpsのリポジトリ、GitHub Enterprise Server（GHES）、利用者がサインインしているブラウザに対応した。Azure DevOpsとブラウザの操作は公開プレビュー、GHESは一般提供である。\n\n【背景】Copilotアプリは、エージェントに作業を任せ、その進み具合を見守るためのデスクトップアプリである。これまではGitHub上のリポジトリが中心だったが、Azure DevOpsや自社運用のGHESを使う企業も多い。また、Webアプリを作る開発者にとっては、ブラウザでの確認作業もエージェントに任せたい部分になる。\n\n【詳細】Azure DevOpsでは、アプリの中でリポジトリをクローンし、エージェントにブランチを作らせて変更し、プルリクエストを開ける。サイドバーで状況を追い、レビューのコメントに「Fix」を押したり、エージェントによるマージを有効にして、CIの失敗を直させ、Azure DevOpsのチェックとポリシーを通ったらプルリクエストを完了させたりできる。設定の「Experimental」でAzure DevOps連携を有効にし、Azure DevOpsで使うMicrosoftアカウントを追加して使う。ブラウザの操作では、フォームの入力、Webページからの情報の取り出し、作っているWebアプリのテストやデバッグをCopilotに任せられる。ChromeやEdgeなどChromium系のブラウザで、Chrome向けのCopilot拡張機能を使って動き、既定では無効である。Copilot CLI、VS Code、JetBrainsのIDEでも使える。GHESは、以前は選択制のプレビューだったが一般提供になった。\n\n【ポイント・注意点】GHESを使うにはアプリの1.2.0以降が必要で、GitHub.comかGHE.comのアカウントでのサインインも求められる。Azure DevOpsのリポジトリとGHESでは、クラウドのセッションは使えない。ブラウザの操作は、拡張機能の設定で権限の段階を管理できるので、任せる範囲を確かめてから使いたい。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-github-copilot-app-microsoft-ignite-releases/"],["MicrosoftのONNX Runtimeリポジトリが予告なく消える","MicrosoftのONNX RuntimeのGitHubリポジトリが予告なく見えなくなり、Hacker Newsで464ポイント、107件のコメントを集めた。約2万2,000のスターを持つリポジトリで、利用者は自社のパイプラインで評価が失敗し始めて気づいたという。コメント欄では、Microsoftの広報が調査のため一部のリポジトリを非公開にしたと述べたとする報道の引用も出た。AI要約サイトZeliが2026年11月17日に伝えた。","\n【概要】Hacker NewsをAIで要約するサイトZeliは2026年11月17日、MicrosoftのONNX RuntimeのリポジトリがGitHubから予告なく消えたという話題を伝えた。記事によると、Hacker Newsの利用者が、約2万2,000のスターを持つこのリポジトリが見えなくなっていることに気づいた。きっかけは、自分たちのパイプラインで評価の処理が失敗し始めたことだった。紹介の時点で464ポイント、コメントは107件だった。\n\n【背景】ONNX Runtimeは機械学習のモデルを動かすための土台で、多くのソフトウェアが依存している。そのため、ソースの置き場が突然見えなくなると、ビルドやテストの流れに影響が出る。記事は、事前の告知はどこにもなかったと伝えている。コメント欄では、サプライチェーンの中にあるプロジェクトなので攻撃を受けたのではないかという推測も出た。\n\n【詳細】元の投稿者は「今朝、パイプラインで評価が失敗し始めて、このことを知った」と書いている。コメント欄では、Microsoft Agent Frameworkも侵害されてリポジトリが見えなくなっているとして、PyPIのパッケージの侵害を報じるSocket.devの記事を示す人がいた。同じ件を扱う別の記事を挙げ、ONNXの削除は後片付けではないかと推測する声もあった。The Registerの11月18日付の記事として、Microsoftの広報が「悪意のある内容を調べる間、いくつかのリポジトリを非公開にした」と述べたとする引用も紹介されている。また、最も先に進んでいるフォークとして、IntelのOpenVINO向けの変更を含むIntelのフォークを挙げる人もいた。スターの数は消えることと関係があるのかと疑問を投げる声もあった。\n\n【ポイント・注意点】記事は、削除の原因を独自には確かめていない。侵害の話や広報の発言は、コメント欄で紹介された主張として扱われている。依存しているリポジトリが突然見えなくなる事態に備え、手元にミラーやキャッシュを持っておくことの大切さを示す出来事といえる。","2026-11-17","Zeli","https://zeli.app/story/50539610"],["Copilotベンチマークサイトにハーネス比較を追加","GitHubは2026年11月17日、GitHub Copilotのベンチマークサイトに、科学研究の作業を評価するTerminal-Bench-Science 0.1と、エージェントのハーネスを比べる新しい表示を加えた。同じモデルと推論の深さで、Copilot CLIをClaude CodeやCodex CLIと比べ、解決率と作業あたりの費用を示す。いずれも公開プレビューで、比べるのは中程度の推論の深さで完全に一致するモデルの組だけとしている。","\n【概要】GitHubは2026年11月17日、GitHub Copilotのベンチマークサイトに、Terminal-Bench-Science 0.1と、エージェントのハーネスを比べる新しい表示を追加したと発表した。どちらも公開プレビューとして提供される。このサイトは、Copilotのエージェントの仕組みで動かしたモデル同士や、同じモデルを使う別の仕組み同士を、ソフトウェア開発のベンチマークで比べるもので、解決率、推論の深さ、作業あたりの費用を見比べられる。\n\n【背景】同じAIモデルでも、そのモデルにツールを使わせたり手順を管理したりする外側の仕組み、いわゆるハーネスによって結果は変わる。Claude CodeやCodex CLIなど、各社のハーネスが並ぶなかで、GitHubは自社のCopilot CLIが同じ条件でどの程度の成果を出すかを示そうとしている。発表は、Copilotのハーネス側の改良がこの表示で見えるようになると説明している。\n\n【詳細】Terminal-Bench-Science 0.1は、科学の様々な分野の研究の作業でAIエージェントを評価するもので、コードの枠を超えて、研究から取り出した難しい作業を扱う。課題は、生命科学、物理科学、地球科学、数理科学、工学の専門家が作り、確かめたという。結果はベンチマークの選択から見られる。新しい「Harnesses」の表示では、同じモデルと同じ推論の深さで、Copilot CLIをClaude CodeやCodex CLIと比べる。散布図では、各ハーネスの結果を解決率と作業ごとの平均費用で並べ、対応する結果を線で結び、公開された実行の間のばらつきを影の楕円で示す。差の表示では、一致するモデルごとに、Copilot CLIの解決率の差をポイントで、費用の節約を割合で、約95%のブートストラップ区間とともに並べる。\n\n【ポイント・注意点】示されるのは、中程度の推論の深さで完全に一致するモデルの組だけである。GitHub Copilot FusionのようなCopilotにしかない構成や、相手のいない結果は、別のモデルと比べることはせず除外される。比較はGitHub自身が公開するもので、料金やプランについての記載はない。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-github-copilot-benchmarks-site-adds-harness-comparisons"],["Claude Opus 5など3モデルがCopilotで廃止に","GitHubは2026年11月16日、Claude Opus 4.8、Claude Opus 5、GPT-5.6 Terraの3モデルを、Copilot Chatやコード補完など大半の機能で廃止した。廃止は10月15日に予告されていた。代わりとして、ClaudeにはClaude Opus 5.5、GPT-5.6 TerraにはGPT-6.1 SolかGPT-6 Lunaが勧められている。年額プランの個人は、Opus 4.8を引き続き使える。","\n【概要】GitHubは2026年11月16日、3つのAIモデルを、Copilotのほとんどの体験で廃止したと発表した。対象はClaude Opus 4.8、Claude Opus 5、GPT-5.6 Terraである。Copilot Chat、インラインの編集、ask（質問）とagent（エージェント）のモード、コード補完などが含まれる。この廃止は2026年10月15日に予告されていた。\n\n【背景】Copilotでは新しいモデルが次々に加わる一方、古いモデルは順に退いていく。利用者や組織は、ワークフローや連携でどのモデルを指定しているかを確かめ、必要に応じて切り替える必要がある。同じ時期には、Gemini 4 NeonやClaude Fable 5.2など新しいモデルの追加も発表されている。\n\n【詳細】発表の表によると、Claude Opus 4.8とClaude Opus 5の代わりにはClaude Opus 5.5が、GPT-5.6 Terraの代わりにはGPT-6.1 SolかGPT-6 Lunaが勧められている。廃止日はいずれも2026年11月16日である。Claude Opus 4.8は、年額プランの個人のCopilot利用者には引き続き提供される。Claude Opus 5はモデル選択の画面から外されたが、すでに認められたアクセスを通じて、実行時に応答を断られた場合の切り替え先としては残る。既存の企業のモデルのポリシーは引き続き適用される。\n\n【ポイント・注意点】利用者は、ワークフローや連携を、サポートされているモデルに更新するよう求められている。既定のモデル有効化の設定では、勧められている代わりのモデルは、Copilot EnterpriseとBusinessで自動的に有効になる。ただし、管理者が全体の既定を切っている場合や、そのモデルを明示的に無効にしている場合は別で、全体の既定が切られているときは、Copilotの設定のモデルのポリシーで代わりのモデルを有効にできる。有効にすると、対応する体験のCopilot Chatのモデル選択に表示される。廃止されたモデルを外すための作業は不要だ。","2026-11-16","GitHub Changelog","https://github.blog/changelog/2026-11-16-github-copilot-models-deprecated-on-november-16-2026/"],["Copilot週次まとめ、Fable 5.2とGemini 4 Carbonが登場","GitHubは2026年11月16日、11月9日の週のCopilotの更新をまとめて公開した。新モデルとしてClaude Fable 5.2とGemini 4 Carbonが加わったほか、Copilotアプリでスマートフォンへのセッションの引き継ぎや、GitHub Enterprise Server対応の一般提供が入った。VS Code 1.146では、モデルの比較やInboxモードなどが実験的に追加され、Localハーネスは2027年2月に廃止される。","\n【概要】GitHubは2026年11月16日、「GitHub Copilot weekly releases — November 9」として、11月9日の週のCopilotの更新をまとめて公開した。GitHub Copilot、Copilotアプリ、VS Code 1.146の3つに分けて紹介しており、注目は新しいモデルのClaude Fable 5.2とGemini 4 Carbonである。\n\n【背景】Copilotの更新はモデル、アプリ、エディタと多方面にわたり、個別の発表だけでは全体をつかみにくい。週次のまとめは、その週の変更を一か所で確かめられる形にしたものだ。\n\n【詳細】Claude Fable 5.2とGemini 4 Carbonは、Copilot Pro+、Max、Business、Enterpriseの利用者が使える。Claude Fable 5.2は既定でデータの保持が必要で、BusinessとEnterpriseでは管理者が既定で無効のポリシーを有効にする必要がある。Copilotアプリでは、新しい「Open in」メニューのGitHub Mobileの項目でQRコードを出し、クラウドやCodespaceのセッションをスマートフォンで続けられる。Slackなどへの再サインインも会話の中で済む。GitHub Enterprise Serverのリポジトリ、イシュー、プルリクエストを扱う機能は一般提供になったが、GitHub.comかGHE.comのアカウントが必要で、クラウドのセッションは使えない。ほかに、Projectの自動処理の分単位の予約や、多言語の音声入力なども入った。VS Code 1.146では、エージェントがモデルを探して比較を実行し結果をまとめる機能と、ワークスペースをまたいでセッションを追い、対応が必要なものを先に並べるInboxモードが実験的に加わり、チャットのウィンドウを切り離せるようにもなった。\n\n【ポイント・注意点】VS CodeのLocalハーネスは2027年2月に廃止され、新しいセッションではすでにCopilotハーネスが既定になっている。移行の手引きが用意されているので、Localハーネスを使っている場合は早めに確かめたい。VS Codeの項目の多くは実験的な機能やプレビューである。","2026-11-16","GitHub Changelog","https://github.blog/changelog/2026-11-16-github-copilot-weekly-releases-november-9/"],["Enterprise Cloudの予算上限、1アカウント4万件に拡大","GitHubは2026年11月16日、GitHub Enterprise Cloudの1つのアカウントで作れる予算の数の上限を、1万件から4万件に引き上げた。利用者ごとに予算を設けたり、多くのコストセンターや組織にまたがって予算を管理したりする企業に向けた変更で、github.comとGHE.comで自動的に適用されるため、利用者が何かを有効にする必要はない。詳しくは予算とアラートのドキュメントで案内されている。","\n【概要】GitHubは2026年11月16日、GitHub Enterprise Cloudの1つのアカウントで作成できる予算の数を、これまでの1万件から4万件に引き上げたと発表した。上限の引き上げは、github.comとGHE.comの両方で自動的に適用される。利用者の側で設定を変えたり、機能を有効にしたりする必要はない。\n\n【背景】GitHubでは、Copilotの利用やActionsの実行など、使った分に応じて費用がかかる仕組みが増えている。企業はその費用を管理するために、予算を作って使いすぎを防いだり、上限に近づいたときに知らせを受けたりしている。大きな組織では、部署やプロジェクトごとのコストセンター、複数の組織、さらには利用者一人ひとりに予算を設けたいこともあり、件数が多くなりやすい。発表は、利用者ごとに予算を設定する場合や、多くのコストセンターと組織にまたがって予算を管理する場合に、今回の引き上げが役立つと説明している。\n\n【詳細】1つのGitHub Enterprise Cloudのアカウントで作れる予算の数が、1万件から4万件に増えた。上限は4倍になったことになる。新しい上限はgithub.comとGHE.comで自動的に適用されるため、管理者がオンにする操作は要らない。詳しい使い方は、GitHub Docsの「予算とアラート」のドキュメントで案内されている。発表自体は短く、変更点はこの上限の引き上げに絞られている。予算を作る画面や操作の方法が変わったという説明はない。\n\n【ポイント・注意点】発表には、これ以外の制限や料金、日付についての記載はない。上限が増えても、予算を細かく分けるほど管理の手間は増えるので、どの単位で予算を持つかは組織の運用に合わせて決める必要がある。一方で、AIのエージェントなど使った量で費用が変わる機能が広がる中、利用者ごとに予算を設けて費用を見える化したい企業にとっては、これまでの1万件では足りなかった場面に対応できるようになる。","2026-11-16","GitHub Changelog","https://github.blog/changelog/2026-11-16-budget-limit-increased-to-40000-budgets-per-account/"],["Harmonyリモコンの赤外線データ1330万件がGitHubに","Logitechがほぼ販売を終えたHarmonyリモコンの赤外線データベースが、GitHubで公開され、Hacker Newsで紹介された。7,900社の約27万6,000台の機器、1,330万件のコマンド、Logitech独自の684の赤外線プロトコルの定義を、そのままのJSONで収めている。アカウントやLogitechのサービスは要らないという。AI要約サイトZeliが2026年11月16日に伝えた。","\n【概要】Hacker NewsをAIで要約するサイトZeliは2026年11月16日、LogitechのHarmonyリモコンを支えていた赤外線のデータベースが、GitHubの新しいアーカイブとして公開されたと伝えた。アーカイブには、7,900のメーカーの約27万6,000台の機器、1,330万件のコマンド、Logitech独自の赤外線プロトコルの定義684件すべてが、そのままのJSONの形で収められている。紹介の時点で47ポイント、コメントは8件だった。\n\n【背景】記事によると、LogitechはHarmonyリモコンの販売をほぼ終えており、テレビや機器を操作するための赤外線のデータは、Logitechのサーバーにしか置かれていなかった。そのため、サービスが止まれば、手元のリモコンを設定し直せなくなるおそれがあった。元の投稿は「Harmonyはほぼ販売終了で、このデータはLogitechのサーバーにしかなかった」と書いている。\n\n【詳細】アーカイブでは、各コマンドに元のHarmonyのキーコードと、そのまま送信できるPronto Hexの文字列が付いている。各プロトコルには、Logitechの定義がそのままの形で添えられている。使うのにアカウントやLogitechのサービスは必要ないという。リポジトリはpickysysadmin氏のlogitech-harmony-ir-archiveである。コメント欄では、これはMyHarmony.comの裏にあるデータベースの代わりになり、Logitechのソフトなしでリモコンを使えるようにするものだという説明があった。その穴を埋める試みとしてConcordanceという別のプロジェクトを挙げつつ、MyHarmony.comとそのWindowsやmacOSのアプリを完全に置き換えるものはまだ見つからないという声もあった。ESPHomeの赤外線送信機にこのコードを使うつもりだという人もいる。\n\n【ポイント・注意点】記事はLogitechの声明は伝えていない。メーカーのサービスにしかないデータは、製品が終わると失われやすく、利用者の手でGitHubに残す動きは、古い機器を使い続けたい人にとって大きな意味がある。一方で、データの扱いについてメーカーがどう考えているかは示されておらず、利用する場合はリポジトリの説明を確かめたい。","2026-11-16","Zeli","https://zeli.app/story/50519778"]],"elec":[["ラズパイ5で4Bモデルの家庭用アシスタント、採点はコードで","Jacob DeCamp氏は、Raspberry Pi 5（8GB）と10.1インチのタッチ画面で作る卓上機「PHNTM One」で、Gemma 3 4Bを端末内で動かした経験をまとめた。採点や習得の判定、イタリア語の添削はモデルを使わない固定のコードで処理し、モデルには雑談や会議の要約、会話練習の相手役などを任せる。8GBに収める工夫や応答にかかる秒数、まだ測っていない点も率直に書いている。","\n【概要】Jacob DeCamp氏がDEV Communityに投稿した記事。注文生産の卓上機「PHNTM One」は、Raspberry Pi 5（8GB）を10.1インチのタッチ画面の裏に置き、アシスタントを端末内で動かす。秋の作業では、202のスキル（うち139が数学）をつないだ家庭教師機能、話す練習つきの16単元のイタリア語講座、カメラで宿題を読む機能、ホームスクールの家庭向けの記録づけを作った。\n【背景】記事の中心は、モデルに何を任せ、何を任せないかの線引きだ。筆者はモデルを「決して権威にしない」と書く。採点、スキルを習得したとみなす規則、イタリア語の訂正は、モデルを介さない固定のコードで処理している。\n【詳細】構成はOllamaとllama.cpp上のGemma 3 4B（Q4_K_M、8Kコンテキスト）で、メモリが足りないときはLlama 3.2 3Bに切り替える。記憶や文書の検索にはbge-m3、音声入力はwhisper.cpp、読み上げはPiperを使う。モデルの担当は、どのAIが答えたかを必ず示す自由な雑談、端末内で録音した会議の要約（文字起こしと照らす下書きとして表示）、イタリア語の場面練習の相手役、確認済みの説明から1つを選ぶ役などだ。8GBに収めるため、Gemmaの視覚部分を外して約850MBを節約した。11月17日の試用機の測定では、文字で3問聞いたとき最初の1文まで23〜30秒、答え全体で30〜37秒。会議を録音しながら12問聞いたときの中央値は約50秒と66秒だった。電源を入れた直後の最初の答えは約2分かかることがある。\n【ポイント・注意点】多くの実際の声での精度はまだ測っていない。イタリア語とスペイン語の教材の文面は母語話者の確認を受けていない。手書きは活字より読み取りにくく、会議の文字起こしに話者名は付かない。完成品は799ドルで必須の月額料金はなく、ソフトは「ソース公開だがオープンソースではない」とされる。記事自体も「AI-assisted」と表示されている。","2026-11-21","DEV Community","https://dev.to/jacobdecamp/what-i-let-a-4b-model-do-on-a-raspberry-pi-5-and-what-i-took-away-from-it-34ek"],["脱獄Kindleに外気温と天気、ESP32とClaude Codeで作る","屋外用の温度センサーが飛ばす電波をESP32で受け、Cloudflare WorkersとD1に記録し、脱獄したKindle Paperwhiteに天気予報と外気温のグラフを映すダッシュボードを作った記事。実装のほとんどはClaude Codeに任せたという。無料枠のCPU時間の制限でのつまずきとその直し方、ドメイン代を除いてクラウド費用0円で回す工夫が、具体的な数字とともに書かれている。","\n【概要】Zennの記事。オーム電機の屋外温度センサーTEM-701-W（314.9MHzで送信）の電波をESP32で受け、温度をCloudflare WorkersとD1にためる。天気予報と外気温のグラフは、脱獄した第7世代のKindle Paperwhiteに表示する。筆者は、実装のほとんどをClaude Codeに任せたと明記している。\n【背景】部品はaitendoの受信モジュール（324円）とアンテナ（110円）で、マイコンはSeeed XIAO ESP32C3。最初はRaspberry Pi 3A+で試作した。安い部品とクラウドの無料枠を組み合わせ、電子ペーパーの常時表示の画面を手元に置くのがねらいだ。外気温は記録として積み上げ、天気予報と並べてグラフで見られるようにしている。\n【詳細】電波はNexus-THプロトコルで、同じ内容が2回続いたときだけ採用し、-40〜70℃の範囲から外れた値は捨てる。Kindle用のPNG（1072×1448）はBrowser Renderingで撮影する。1回約1.8秒、1日72回で約2分となり、無料枠の1日10分に収まる。つまずいたのは無料プランのCPU時間10msの制限だった。7日分のグラフの処理に12〜24msかかっていたが、1時間ごとの集計から返すように直して1〜6msにした。Kindleは30分ごとにcurlでPNGを取りに行き、前回と同じ画像なら描き直さない。脱獄にはWinterBreak v2.1.0（ファームウェア5.16.2.1.1）を使い、対象はファームウェア5.18.1未満と注意書きがある。\n【ポイント・注意点】クラウド費用はドメイン代を除いて0円。AIにコードを任せても、無料枠の制限のような運用上の壁は実測して直す必要があったことが読み取れる。脱獄は自己責任と明記されており、室温の取得はまだTODOのままだ。ハードは数百円の部品が中心で、まねしやすい構成になっている。同じ受信を2回確かめる、範囲外を捨てるといった雑音への備えも、無線センサーを扱うときの参考になる。","2026-11-21","Zenn","https://zenn.dev/zakkie/articles/c99167d7d037d5"],["ESP32-S31と7インチ画面の開発キット、AIチャットのデモも","CNX Softwareは、GUITIONのESP32-S31開発キット「JC1060F570C_I_W_Y」を紹介した。7インチのタッチ画面とEthernetを備え、SoCのネイティブEthernetを使う最初のESP32-S31ボードだという。マイク2つとオーディオコーデックを積み、出荷時ファームのデモ動画には「AIチャットボット」も入っているとされる。AliExpressのブラックフライデー価格は28.71ドルからだ。","\n【概要】CNX Softwareの記事。GUITIONの「JC1060F570C_I_W_Y」は、7インチの静電容量式タッチ画面を一体にしたESP32-S31の開発キットだ。記事はこれを、SoCのネイティブEthernetインターフェースを使う最初のESP32-S31ボードとしている。\n【背景】モジュールはESP32-S31-WROOM-3-N16R16Vで、SoCはESP32-S31NRV16。320MHzのRISC-Vコア（FPU、SIMD付き）と低消費電力のRISC-Vコアを持つ。メモリは512KBのSRAM、32KBの低消費電力SRAM、16MBのPSRAM、16MBのフラッシュ。無線は2.4GHzのWi-Fi 6、Bluetooth 5.4、Zigbee・Thread・Matter向けの802.15.4に対応する。Arduino ESP32コア4.0.0（ESP-IDF v6.1.1）が、ESP32-S31に対応した最初の安定版だという。\n【詳細】画面は1024×600の7.0インチIPSで、ドライバはJD9165。音声はEverestのES8389コーデック、NS4150アンプ、MEMSマイク2つを備える。ほかに10/100のRJ45、microSD、USB 2.0 High SpeedとFull SpeedのType-C、UART・I2C・RS485の4ピン端子、RTC、リチウムイオン電池の端子がある。電源はUSB-Cの5Vで、消費電流は約600mA。大きさは181.80×113.72×約17mmで300g、動作温度は-20〜70℃。ソフトはベンダーのZIPで、ArduinoとESP-IDFのデモ（LVGL、Wi-Fiスキャン、MJPEG/MP3プレーヤーなど）や回路図が配られる。\n【ポイント・注意点】NPUやTOPSの記載はなく、AIの要素はデモ動画の「AIチャットボット」にとどまる。筆者は、SoCはGigabitに対応するのにFast Ethernetしか実装していないと指摘する。価格はケース付き28.71ドル、ケースなし29.39ドルで、通常は35〜37ドルに近いという。税抜きの表示で、スペインでは50ユーロを超えたとのコメントもある。","2026-11-20","CNX Software","https://www.cnx-software.com/2026/11/20/guition-esp32-s31-development-kit-features-7-inch-capacitive-touch-display-ethernet-port/"],["一文の説明からKiCad基板とファームを生成、PCBBrew","回路を言葉で説明すると、KiCadの回路図と配線済みの基板、ESP32やArduino、Raspberry Pi Pico向けのファームウェア、そのファームを動かすブラウザ上のシミュレーションまで出してくれるWebアプリ「PCBBrew」を、作者がDEV Communityで紹介した。警報付きの卓上温度計を例に、AIが部品を選びデータシートを読む流れを示す。現在はクローズドベータで、宣伝を兼ねた記事だ。","\n【概要】DEV Communityでpcbbrew氏が紹介した記事。PCBBrewは、作りたい回路を普通の言葉で書くと、KiCadの回路図、配線済みのPCB、ESP32・Arduino・Raspberry Pi Pico向けのファームウェア、そのファームを動かすブラウザ内のシミュレーションを返すWebアプリだ。\n【背景】例として示したのは警報付きの卓上温度計。依頼文は、ESP32-C3 SuperMini、0.96インチのOLED、SHT40センサー、警報音用にLM386アンプで鳴らす小型スピーカー、ボタン2つ、USB-C給電で、基板はできるだけ小さく、というものだった。記事は、アシスタントにどのAIモデルを使っているかは明かしていない。\n【詳細】記事によると、アシスタントはOLEDの取り付け方を1つだけ質問し、警報の設定温度を28℃、ヒステリシスを1℃と提案した。KiCadの部品を選び、LM386のデータシートを読み、変更のたびに回路を点検したという。回路図はコントローラー、USB-C入力、オーディオアンプ、モジュールのブロックに分かれ、USB-CのCCの5.1kΩのプルダウンや、LM386を標準のゲイン20のまま使うことなどの注記が付く。基板は78×64mmの2層で、アンプの下にグランドプレーンを置く。デザインルールチェックはエラー0、未接続パッド0だった。Arduinoのスケッチは配線したピンに合わせて生成され、ESP32-C3向けにフラッシュの25%でコンパイルできる。シミュレーターでは温度のスライダーを28℃より上げると表示が「TEMP ALARM」に変わり、スピーカーが鳴る。GerberやBOM、STEPモデルなども書き出せる。\n【ポイント・注意点】電源系とファームはシミュレートされるが、LM386の音声段はされないため、実際の音量は実機で確かめる必要がある。自動の点検は、組み立てや通電の前に有能な人が確認することの代わりにはならないとしている。対象は30V以下の低電圧の趣味用で、商用電源は扱わない。","2026-11-20","DEV Community","https://dev.to/pcbbrew_e9ea9516675cb5ba9/i-built-a-web-app-that-turns-one-sentence-into-a-kicad-pcb-you-can-simulate-in-the-browser-46pg"],["AtomVMとESP32-C5で「パ・パ・パ」、PWM音声回路を学ぶ","ElixirをマイコンでうごかすAtomVMから、Seeed Studio XIAO ESP32-C5につないだスピーカーで「パ・パ・パ」と歌わせた実験記事。PWM出力をRCローパスフィルタとアンプICに通す音声回路をブレッドボードで組み、最初の練習用の音源はLLMに生成してもらった。回路の仕組みの説明や部品リストづくりにもLLMを使っている。2台で男声と女声の掛け合いも再現した。","\n【概要】Qiitaの記事。AtomVM（Elixir）から、Seeed Studio XIAO ESP32-C5に接続したスピーカーで「パ・パ・パ」と歌わせる。マイコンのPWM出力で音を出す回路を、ブレッドボードで組みながら学ぶ内容だ。\n【背景】筆者はLLMを、回路の仕組みの説明や部品リストの作成に使った。最初の音源も、LLMに生成してもらった約10秒の練習用フレーズ（8kHz、符号なし8ビット、モノラル）だ。AIに教わりながら音声回路の基本を一つずつ確かめる、学びの記録になっている。マイコンのPWMはそのままでは音声にならないため、フィルタで滑らかにし、アンプで増幅してスピーカーを鳴らすという流れを、実際の部品と数値で追っている。\n【詳細】回路は、PWM出力を10kΩと1nFのRCローパスフィルタ（理論上のカットオフは約15.9kHz）に通し、10kΩの可変抵抗で音量を調整し、オーディオアンプIC NJM2113D（DIP-8）を経て、スピーカーUGSM23A（8Ω、0.08W）につなぐ。PWMの周波数は約156kHz。後半では、パパゲーノ（男声）とパパゲーナ（女声）の16kHzの音源を2台で再生した。デバイス同士の同期はせず、音源に休止の時間を残しておき、2台をほぼ同時に起動する方法で掛け合いを再現している。ソフトは、Elixirが曲の選択と再生の指示を受け持ち、C（ESP-IDF）がGPTimerとLEDCでPWMを更新する構成で、両者はNIFで連携する。\n【ポイント・注意点】標準のAtomVMにはない音声用のNIFを使うため、カスタムファームウェアのビルドが必要になる。ソースコードと配線図はGitHubで公開されている。2台の掛け合いは厳密な同期ではなく、起動のタイミングに頼っている点にも注意したい。LLMは音を作る道具であると同時に、回路を理解するための先生役として使われている。ブレッドボードと汎用の部品で組めるので、PWM音声の入門としてもたどりやすい。カットオフ周波数などの値も示されており、部品を替えて試す手がかりになる。","2026-11-20","Qiita","https://qiita.com/mnishiguchi/items/fa300a537d549511ef20"],["地下鉄の放送を訳すラズパイ、メカトロ技術者の作品集","Raspberry Pi公式ブログは、ニューヨーク・ブルックリンのメカトロニクス技術者でメイカーのFavor Brunner氏を紹介した。地下鉄の車内放送を文字起こしして他の言語に訳し読み上げる「Run It Back NYC」や、ラズパイ上でローカルに動かし中国語の家庭教師に使ったチャットボット「Baymax」など、ラズパイとAIを組み合わせた作品が取り上げられている。","\n【概要】Raspberry Pi公式ブログの記事で、Raspberry Pi Official Magazineの第171号に載った人物紹介の転載だ。取り上げるのは、ニューヨーク・ブルックリンのメカトロニクス技術者でメイカーのFavor Brunner氏。\n【背景】Brunner氏は7歳ごろ、レゴで作ったものを動かし、現実の世界と関わらせたいと思ったのがものづくりの始まりだという。ソフトウェア技術者のおじがRaspberry Piを持ってきてくれた。小学3年ごろにおじが組んだKanoのキットでラズパイに触れ、Minecraftを動かして「主体性の感覚」を得たと語る。その後、母親が自分の作品と引き換えにして通わせてくれたロボット教室にも通った。\n【詳細】ロボットのチャンネルを始めたのは取材の1年少し前。転機は、パーキンソン病など指先の細かい動きが難しい人のために作った、デオドラントのふたを回す機械だった。注目を集め、ほかのアクセシビリティ向けの工作をクラウドファンディングで支えられるようになった。AIに関わるのは、お気に入りの作品のうち2つだ。「Run It Back NYC」は、ニューヨークの地下鉄MTAの放送を文字起こしする装置で、Raspberry PiとTouch Display 2で動く。放送を文字にし、他の言語に訳して読み上げる。地下鉄で本人が実際に困っていた問題を解くものだという。もう1つは「Baymax」という名のチャットボットで、Raspberry Pi上でローカルに動かした。家庭教師の契約なしに中国語を練習する手段として使い、ローカルAIを実際に扱う経験にもなったと語っている。\n【ポイント・注意点】記事は人物紹介が中心で、AIの部分はその一部にすぎない。どちらの作品についても、使ったモデルの名前や性能の数値、費用は書かれていない。技術的な再現の手引きではなく、身近な困りごとをラズパイとAIで解く作り手の姿を伝える読み物として読むのがよい。アクセシビリティと言語の壁という、暮らしの中の課題に向けた作品が多いのが特徴だ。","2026-11-19","Raspberry Pi公式ブログ","https://www.raspberrypi.com/news/mechatronics-engineering-as-a-form-of-artistic-expression/"],["声で走るPiCar-X、動き出し6秒を1秒台に縮めた工夫","Raspberry Pi 5で動くPiCar-Xに「前に進んで」と話しかけると走る仕組みで、話し終えてから動き出すまでの約6秒を1秒台にまで縮めた記録。耳はAmiVoiceのストリーミング音声認識、頭はノートPCのOllamaで動くgemma3:4b、声はOpen JTalkが担う。効いた工夫と失敗した工夫、単語登録の効果、費用、聞き間違いで車が動いた例まで数字で示している。","\n【概要】Zennの連載「小さなAIで手足をうごかす」の第9回。Raspberry Pi 5を載せたPiCar-Xに、「前に進んで」「左に2回曲がって」などと話しかけると、その命令どおりに走る。今回は耳にAmiVoice APIを付け、反応の遅さを詰めた。\n【背景】耳はAmiVoice API（WebSocketでのストリーミング）、頭はノートPCのOllamaで動くgemma3:4b（パラメータ約40億）、読み上げはOpen JTalk。マイクは車体の後ろのUSB小型マイクで、約1.5m離れて話しかける。声のピークは目盛りの2〜6%しかないため、5倍に増幅して送っている。当初は、話し終えてから動き出すまで約6秒かかっていた。声で操る車では、この待ち時間がそのまま使い心地を左右する。そこで今回は、耳・頭・声のどこで時間がかかっているかを一つずつ確かめ、順に削っていった。\n【詳細】最も効いたのは、返事の読み上げを待たずに車を動かすことで、約4秒縮んだ。話し終わりの無音判定を550ミリ秒から300ミリ秒にすると、さらに約0.2秒縮んだ。逆に、認識の途中経過で先に頭へ聞く案は、動き出しが1.8〜2.0秒から2.6〜4.0秒に延びて失敗した。頭の答えを{\"c\":\"F1\",\"say\":\"\"}のような記号にし、同じ文の2回目以降は控えを使うと、動き出しは約0.5秒になる。辞書にない「ピカ」は単語登録で改善し、1語だけの発話で31回中2回だった認識が25回になった。\n【ポイント・注意点】費用は、AmiVoiceが数えた16.0秒分で概算0.66円。マイページでは519秒で請求は0円だった。家族の会話も課金の対象になり、聞き間違いで車が動いた例が3回あったという。測定は家庭内で条件ごとに約10回の小規模なものなので、数字は目安として読みたい。それでも、返事を待たずに動く、答えを短い記号にする、同じ命令は控えを使うといった工夫は、小さなLLMで機械を動かすときに広く使える考え方だ。聞き間違いへの備えも今後の課題として残る。","2026-11-19","Zenn","https://zenn.dev/mappy55/articles/small-ai-hands-09"],["14時半に机がせり上がる、ESP32とMOSFETで昇降デスク改造","電動昇降デスクの手元スイッチと本体をつなぐRJ45の配線を読み解き、ESP32とMOSFET 1個でメモリーボタンを押したことにして、毎日14時30分に立ち位置まで自動で上げる改造記事。はんだ付けはしていない。配線の調べ方はChatGPTに質問し、ESP32のプログラムはClaude Codeに書いてもらったという。Webの管理画面から時刻の変更もできる。動く前にはブザーで知らせる。","\n【概要】Qiitaの記事。Sunon製の電動昇降デスクで、手元スイッチと本体をつなぐRJ45の配線を読み解き、ESP32とMOSFET（2N7000）で「メモリー2」のボタンを押したことにする。こうして、毎日14時30分に立ち仕事の高さまで机を自動で上げる。\n【背景】決まった時間に立ち仕事を強制するための工作だ。筆者は、配線の調べ方をChatGPTに質問し、ESP32のプログラムはClaude Codeに書いてもらったと記している。AIに相談しながら、既製品の家具をはんだ付けなしで改造した例になっている。手元スイッチのボタンを電気的に押す形なので、デスク本体の制御には手を入れず、もともとのメモリー機能をそのまま使えるのが利点だ。\n【詳細】部品はESP32、2N7000、圧電ブザー、抵抗、RJ45の中継基板2枚、ジャンパー線8本で、はんだ付けはしていない。ボタンはGNDにつながるアクティブローの方式なので、ESP32の信号でMOSFETを開け閉めする。3.3Vで駆動するとIRFZ44Nは確実にONにならないと教わり、2N7000を使ったという。動かす前にブザーを2回鳴らし、3秒置いてから机を動かす。ESP32はWi-Fi経由のNTPで時刻を合わせ、Webの管理画面から即時の起動や定時の時刻の変更ができる。11月18日の14時30分に動いた例も示されている。\n【ポイント・注意点】最初に使ったUSBケーブルは充電専用で、シリアルの出力が出なかったという。本体側の電源とGNDのピン配置は、先人のプロジェクトにならった。ソフトと配線図はGitHubで公開されている。デスクの機種によって配線は違う可能性があるので、まねする場合は自分の机の配線を確かめる必要がある。マイコンの3.3Vで確実に動く部品を選ぶこと、動く前に音で知らせることなど、家具を自動で動かすときの気配りも参考になる。AIに書かせたプログラムでも、配線や部品の選び方は人が確かめている点に注目したい。部品代も安く、週末の工作として試しやすい題材だ。","2026-11-19","Qiita","https://qiita.com/miyanaga/items/17893782b7c75bdac20b"],["ESP32-S3にパスワード保管庫、Claudeとtinywardenで試作","千円ほどのESP32-S3基板にBitwarden互換サーバー「tinywarden」を入れ、パスワードの保管庫をクラウドではなく手元の基板の中に置く試作記事。基板はUSBのネットワークアダプタとして見え、公式Bitwardenアプリがそのままつながる。基板には暗号文だけが届く。コードの多くはClaudeに書いてもらい、何を作るかは筆者が決めたという。限界も明記している。","\n【概要】Qiitaの記事。千円ほどのESP32-S3基板（記事ではESP32-S3 SuperMiniなど、フラッシュ4MB、PSRAM 2MB）に、Bitwarden互換のサーバー「tinywarden」を入れ、パスワードの保管庫を基板の中に置く試作だ。\n【背景】タイトルの「集めるから、狙われる」が示すとおり、多くの人のパスワードを集めるクラウドは攻撃の的になるという問題意識から出発している。保管庫をクラウドにもネットにも置かず、手元の小さな基板に閉じ込める発想だ。コードの多くはClaude（Anthropic）に書いてもらい、何を作るかは筆者が決めたとある。使い慣れた公式アプリをそのまま使える点も、手作りの保管庫としては大きい。\n【詳細】基板はUSBのネットワークアダプタ（CDC-NCM）として見え、公式のBitwardenアプリ（Mac、Windows、iPhone、Android）がUSB越しにつながる。基板には暗号文だけが届く。ファームの書き込みはブラウザのページから行える。鍵の導出にはArgon2id（Bitwardenの初期値で32MB）を使い、記事の概算では総当たりがGPUで約20倍遅くなるとしているが、測定値ではないと明記している。動作はMac、Windows 11、iPhone 17、moto g24（Android 14）で確認した。\n【ポイント・注意点】限界として、基板は封じていないため、盗まれると暗号文を手元で総当たりされうること、ログインした端末がマルウェアに感染すると守れないことを挙げる。監査を受けていない趣味の試作だとも書いている。AIで書いたコードをセキュリティの用途に使う場合、こうした前提を理解したうえで試すことが大切だ。記事は守れることと守れないことを分けて書いており、千円ほどの基板でどこまでできるかを知る材料として読むのがよい。本番の保管庫として使うことを勧める記事ではない。鍵を手元の機器に置くという考え方を、安いマイコンで形にしてみせた点に価値がある。","2026-11-19","Qiita","https://qiita.com/hide_seki/items/8d11d99f0d9b05bd2378"],["M5Stackで1秒ごとに送る工場見える化、FactorEye開発記","工場設備を見える化するOSS「FactorEye」の開発記の第3回。M5Stack系の端末を3種類作り、1秒ごとに温湿度や気圧を測って送る仕組みを扱う。自宅のラズパイを受け手にした負荷試験では、送り方の工夫で100か所まで通るようになった。サーバー側のコードはほぼAIに任せ、M5側のコードは筆者の書き方にそろえて書き直させたという。未検証の点も明記している。","\n【概要】Zennの記事。工場設備を見える化するOSS「FactorEye」の開発記の第3回で、M5Stack系の端末から1秒ごとにデータを送る仕組みを扱う。端末は3種類作った。\n【背景】筆者は、AIにサーバー側のコードをほぼ任せ、M5側のコードは自分の書き方にそろえて書き直させたと説明する。1秒ごとの測定は、工場のためではなく個人用の記録がきっかけだという。工場の生産ラインでの検知は、まだ実機で試していないと明記している。安価で手に入るM5Stack系の端末を、たくさんの場所に置いて一度に集めることを想定しており、受け手の負荷がどこで限界になるかを測ったのが今回の見どころだ。\n【詳細】1台目のFactorEyeNodeは、書き込みは1回だけで、そのあと端末自身がWi-Fiを出し、スマホの設定画面でWi-Fi、送り先、送信の間隔を入れて保存する。ATOM Lite、NanoC6、M5StickC、M5Stack Basicなどに対応する。2台目のFactorEyeBatchNodeは、温湿度、気圧、電波の強さを1秒ごとに測り、60秒分をまとめて送る。測る係と送る係を分け、送れなかった分は待ちのリストに残して古い順に送る。自宅のラズパイ（4コア）で試すと、1秒ごとに送ると約70か所で詰まったが、照合の結果を5秒覚えると100か所まで通った。60秒まとめて送るなら100か所でもCPUは28%だった。\n【ポイント・注意点】11月3日の夜に1台が約1時間止まった件は、原因が確定していない。11月11日の版で、再起動してもデータが欠けないよう、フラッシュに約24時間分を残すようにした。電池版は深く眠るモードにするとモバイルバッテリーが電源を切ってしまったため、起き続けるモードを3つ足した。個人開発で、勤務先とは関係がないとしている。止まった原因が分からないまま、データを失わない備えを先に入れた判断や、電池の挙動に合わせてモードを足した対応は、現場で長く動かす機器づくりの参考になる。連載は今後も続く。","2026-11-19","Zenn","https://zenn.dev/hayhide23/articles/factoreye-03-m5stack"],["ESP32-S3のTinyMLで予知保全、量子化の罠とOTA設計","産業用モーターの振動から故障の予兆をつかむESP32-S3のセンサーを例に、TinyMLのモデルを量子化するときの落とし穴と、現場で止まらないファームウェアとモデルの更新の設計を解説した記事。単純な量子化で微小な高周波の異常が丸め込まれる問題や、メモリの置き場所の注意点を挙げる。実機の計測結果を示す記事ではなく、多くの数値には出典や測り方が示されていない点に注意したい。","\n【概要】Zennの記事。産業用モーターの振動を解析して故障の予兆をつかむ「予知保全」のセンサーを、ESP32-S3で作る場合の設計と運用を解説する。実機の計測結果を報告する記事ではなく、設計の考え方をまとめた内容だ。\n【背景】ハードはESP32-S3（デュアルコアLX7、240MHz、512KBのSRAMと8MBのPSRAM）で、ESP-IDFのFreeRTOS上でTFLM（TensorFlow Lite for Microcontrollers）のINT8モデルを動かす。1kHzで加速度を取り、FFTで求めた振幅スペクトルをモデルの入力にする想定だ。小さなマイコンで推論するため、モデルは8ビットの整数に量子化して載せる。ここで精度をどう保つか、現場に置いた機器のモデルをどう安全に入れ替えるかが、記事の二つの柱になっている。\n【詳細】量子化では、学習後に単純に量子化する方法（PTQ）だと、微小な高周波の異常が丸め込まれてしまう問題を挙げ、量子化を意識した学習（QAT）と感度分析に切り替えたとしている。推論用の作業領域であるTensor Arena（64KB）は内部SRAMに置くべきで、PSRAMに置くと速度が「3倍〜5倍低下」すると書くが、測定の条件は示されていない。更新（OTA）では、ファームウェアの領域とモデルの領域（model_aとmodel_b、各512K）を分け、mmapでモデルを参照する。新しいモデルで失敗したら古いモデルに戻す案を示す。\n【ポイント・注意点】「通信量を約75%削減」という記述もあるが、算出方法は書かれていない。予知保全の観点では、エッジで一次的にふるい分けをし、詳しい解析はクラウドに任せる2段階の構成を勧めている。数値の多くは出典や測定方法が示されていないため、考え方の参考として読み、実際の値は自分の環境で確かめるのがよい。モデルの領域を2つ持って失敗時に戻す設計は、現場で止められない機器ほど大切になる。量子化で精度が落ちる場所を感度分析で探すという手順も、TinyMLに取り組む人の参考になる。","2026-11-19","Zenn","https://zenn.dev/esperanza/articles/auto-20261114-085858"],["「exit code 14」の正体は68、QCS6490でYOLOv11が通らない","QualcommのQCS6490を積むRB3 Gen 2ボード向けに、YOLOv11-Nをw8a16で量子化してコンパイルしたところ、理由の出ない「exit code 14」で失敗した。開発者がツールに本当のエラーを出すよう求めたところ、隠れていた原因はDSPの世代を示す「68」だったことがわかった。w8a8ならNPUで5.03msで動くという。組み込みNPUのツールの落とし穴を伝える短い記事だ。","\n【概要】DEV CommunityでAnguo氏が書いた、組み込みNPU向けにAIモデルをコンパイルしたときのデバッグの記録。対象はYOLOv11-Nをw8a16で量子化したモデルで、QualcommのQCS6490を積むRB3 Gen 2ボード向けにコンパイルした。\n【背景】コンパイルはコンテキストバイナリを作る段階で失敗し、「exit code 14」とだけ表示された。層の名前も理由も出なかった。同じモデルをw8a8にするとコンパイルは通り、NPUでは5.03ms、標準のTFLiteの経路では134.7msだったという。筆者はqualcomm/ai-hub-modelsにissue #364を立て、ツールが本来の診断を表示するよう求めた。\n【詳細】約10日後、メンテナーが隠れていたメッセージを貼った。それは「[4294967295] has incorrect Value 68, expected >= 73.」というものだった。記事の説明では、RB3 Gen 2のDSPはHexagon v68だ。w8a16の設定だと、コンパイラは16ビット同士の行列積のカーネルを出すが、それにはv73以降が必要になる。筆者は、モデルや校正、書き出しに問題はなかったとしている。回避策は、このシリコンではw8a8にとどめるか、AIMETの独自設定で行列積を16ビットにしないことだ。メンテナーはこの要望をQAIRTのチームに回した。\n【ポイント・注意点】実務上の勧めは、Hexagon v68の部品では行列積を含むモデルのw8a16を非対応とみなし、w8a8を既定にすることだ。記事はベンダーのツールに、ただの終了コードではなく本当のエラーを出すよう求めている。2分ほどで読める短いメモで、モデルの精度の数値はなく、時間の値は記事に書かれたものだ。量子化の設定がチップの世代によって使えるかどうかが変わるという点は、エッジ向けのAIボードでモデルを動かす人が覚えておきたい知見だ。issueで粘り強く原因を聞き出した過程も記録されている。","2026-11-19","DEV Community","https://dev.to/anguoyang/all-we-got-was-exit-code-14-the-real-answer-was-one-number-68-ndd"],["謎のビープ音を追う、コーディングエージェントに耳を","Hackadayは、たくさんの箱が置かれた部屋のどこかで時々鳴る謎のビープ音を、コーディングエージェントに「耳」を与えて突き止めたSimon Willison氏の試みを紹介した。手元のスマホなどがQRコードを読むだけで聞き役になり、エージェントは自分で音を集めながら方法を直していった。音の正体は、箱に埋もれた古い一酸化炭素警報器の電池切れの合図だった。AIが現実の世界を感じ取る例として注目される。","\n【概要】Hackadayの記事で、Simon Willison氏のプロジェクトを紹介している。たくさんの箱がある部屋のどこかで、時々ビープ音が鳴る。その出どころを探すため、コーディングエージェントに部屋の音を聞かせる仕組みを作った。\n【背景】仕組みの中心はPythonのWebサーバーだ。聞き役はふつうの機器でよく、人がQRコードを読み込むと、その機器がWeb Audio APIを使う聞き役のノードになる。部屋のあちこちに聞き役を置けば、システムは待ち、聞き、音の出どころを絞り込める。記事は、ハードは手元に転がっている「マイクの付いた古い機器なら何でもよい」としている。専用のセンサーや基板を用意しなくても、手持ちの機器を集めて分散したマイクの網にできるのが、この仕組みの面白いところだ。音が時々しか鳴らないため、人が張り付いて待つのは難しい。そこで、待って聞く役を機械に任せる発想になっている。\n【詳細】記事の要点は、エージェントがマイクを通して現実の世界を感じ取れるようになったことだ。エージェントは自分で音のデータを集め、開発の途中でやり方を見直したり調整し直したりできた。筆者は、これでWillison氏が自分で音を録って渡す手間がなくなったと書く。最終的に音の出どころは、箱に埋もれた古い一酸化炭素警報器で、電池切れを知らせる音を出していた。記事は、WiFiの解析器をAIモデルにつないだ別の記事や、ビープ音探しのGitHubリポジトリへのリンクも載せている。\n【ポイント・注意点】記事は、使ったコーディングエージェントやモデルの名前を明かしていない。マイクの数やサンプリング周波数、位置の精度、見つけるまでの時間といった数値もない。Willison氏のブログ記事をもとにした紹介で、読者コメントには防犯やプライバシーの面での使い道を推測する声もあるが、それは記事の主張ではない。エージェントに測る手段を与えると、人が仲介する手間が減るという点が、この試みから学べることだ。手持ちのスマホやPCで再現しやすいのも魅力だ。","2026-11-18","Hackaday","https://hackaday.com/2026/11/18/tracking-down-a-mystery-beep-by-giving-a-coding-agent-a-few-ears/"],["ESP32のアンテナ切替で衛星受信局、Claude Codeで構築","Hackadayは、Tommy Lather氏の衛星受信局「Starlab Observatory」を紹介した。安いRTL-SDRでISSの画像を受けようとしたのが始まりで、複数のSDRとアンテナをESP32のアンテナ切替器でまとめる局に育った。PCのソフトが衛星の通過を予測し、受信機とアンテナを選んでデータを記録する。開発には「少しのClaude Code」を使ったという。","\n【概要】Hackadayの記事。Tommy Lather氏の「Starlab Observatory」は、複数の受信機を使う衛星の受信局だ。安いRTL-SDRの受信機とアンテナを買い、ISSが送る画像を受けようとしたのが始まりだった。結果は「まちまち」だったが、計画はソフトウェア無線機やアンテナ、切替器の集まりに育ち、GitHubのオープンソースのプロジェクトになった。\n【背景】記事は、この局が「少しのClaude Code」を加えて作られたと紹介している。AIは局の中で動く機能ではなく、開発の道具として使われた。どの部分をClaude Codeが書いたり手伝ったりしたのかは、記事には書かれていない。受信機やアンテナが増えるほど、どの衛星をどの組み合わせで受けるかを決めて記録する仕事は複雑になる。その調整を受け持つソフトを、AIの助けを借りて形にした例といえる。\n【詳細】ハードの要はESP32を使うアンテナ切替器で、専用のUbuntuのコンピューターから命令を受ける。PCで動くソフト「Starlab」は、衛星の通過を予測し、適した受信機とアンテナの組み合わせを選び、データを記録して処理する。記事によると、複数の仕事を同時に走らせることもできる。将来の改良として、AntRunnerのような方位と仰角を自由に動かせる架台にも触れている。周波数や帯域、費用、処理量などの数値は記事には出てこない。\n【ポイント・注意点】AIの役割は開発の支援で、受信局そのものにAIの機能はない。読者コメントには、AIに頼って作った「バイブコーディング」の色が濃いことや、セキュリティの問題を指摘する声があり、作者は自分がソフトの開発者ではないと返している。これらはコメントで、記事の主張ではない。電子工作の経験者がAIを使ってソフト側を補う例として読める。公開するコードの安全性を誰が確かめるのかという、AIを使った開発ならではの課題も見えてくる。ISSの画像を受けたいという一つの動機から局が育っていく過程も、読みどころになっている。","2026-11-18","Hackaday","https://hackaday.com/2026/11/18/remarkable-observatory-receives-orbital-radio/"],["6 TOPSのNPUを積む携帯Linux機「Flipper One」","CNX Softwareは、Flipper DevicesがKickstarterで始めた携帯型のArm Linuxコンピューター「Flipper One」を紹介した。Rockchip RK3576と6 TOPSのNPU、8GBのLPDDR5を積み、ネットワークやエッジAIの多機能ツールとして使える。低レベルの制御にはRaspberry PiのRP2350を使う。出資は399ドルからで、届くのは2027年7月からの予定だ。","\n【概要】CNX Softwareの記事。Flipper Devicesの「Flipper One」は、オープンソースハードウェアの携帯型Arm Linuxコンピューターで、ネットワークとエッジAIの多機能ツールだ。記事は「Flipper Zeroの代わりではない」と注意している。もとは2026年5月21日の記事で、Kickstarterの開始を受けて更新されたという。\n【背景】SoCはRockchip RK3576で、Cortex-A72（2.2GHz）4つ、Cortex-A53（1.8GHz）4つ、400MHzのCortex-M0を持つ。NPUはINT8で6 TOPSで、INT4、INT16、BF16、TF32などの混合演算に対応する。低レベルの制御にはRaspberry PiのRP2350（150MHz、264KBのSRAM、16MBのフラッシュ）を使い、256×144の64階調の画面もRP2350が受け持つ。\n【詳細】メモリは8GBのLPDDR5で、価格が下がらなければ容量を減らす可能性があるとの注記がある。ストレージは64GBのUFS 2.2とmicroSD。GPUはMali-G52 MC3で、映像は8K 30fpsまでの再生に対応する。出力はHDMI 2.1とUSB-CのDisplayPort。ネットワークはギガビットEthernet 2つ、Wi-Fi 6とBluetooth 5.2で、M.2経由の4G LTEや5G、LoRa、SDR（24〜1700MHz、未確定）も選べる。バッテリーは7,000mAh（量産時の容量は未確定）、大きさは155×67×40mm。ソフトはメインラインLinuxを目指し、Debianベースの「Flipper OS」を用意する。\n【ポイント・注意点】Kickstarterの出資は399ドルからで、LoRa付き439ドル、SDR付き539ドル、5G付き599ドル、全部入り759ドル。送料は別。記事の執筆日には約1万9,000人から1,000万ドル近くを集めていた。届き始めるのは2027年7月の予定で、RAMや電池、SDRの仕様はまだ確定していない。","2026-11-18","CNX Software","https://www.cnx-software.com/2026/11/18/flipper-one-a-rockchip-rk3576-powered-portable-arm-linux-computer-and-networking-multi-tool/"],["ラズパイのAI船舶コンピューター、公開を延期した理由","ラズパイをオフラインで動くAI搭載の船の操舵席コンピューターにする「d3kOS」の作者が、開発の振り返りをDEV Communityに書いた。音声LLMやYOLOv8の画像認識を組み合わせる計画だが、ただ記事の中心はセキュリティの話だ。ソースの公開が攻撃者に手がかりを与え、開発を止めて脆弱性を調べ直したという。安全の基準を満たすまでソフトは公開しないと決めた。","\n【概要】DEV CommunityでDon Moskaluk氏が書いた記事で、もとはatmyboat.comに載ったもの。テーマは「d3kOS」というプロジェクトで、Raspberry Piを、オフラインで動くAI搭載の船の操舵席のコンピューターにする。作り方の記録というより、開発の教訓をまとめた内容だ。\n【背景】筆者によると、以前のRedditの記事では、このシステムを音声LLM、YOLOv8の画像認識、Signal K、AvNavを使うものとして紹介した。今回の記事ではそれらの部品を詳しく説明し直してはおらず、モデルの名前や性能の数値もない。Product Huntでの公開は反応が少なかった一方、Redditの投稿はRaspberryDIYのコミュニティの関心を集め、Smart BoatsやOpen Source AIのコミュニティとの議論につながったという。\n【詳細】記事の中心はセキュリティだ。筆者は、2026年7月まで多くのソースコードを公開していたことで、攻撃者に連携の仕組みを知る手がかりを与えたと書く。開発を止め、脆弱性を調べて取り除いた。スパム攻撃では6万5,000以上のアカウントが作られたが、サーバーは動き続け、性能も安定していたという。Smart Boatsでの議論として、初期パスワードが弱い、サービスがむき出し、遠隔操作の守りが甘い、といった船舶用電子機器の問題にも触れている。\n【ポイント・注意点】結論として、セキュリティの設計、監視、運用の安全策が筆者の基準を満たすまで、d3kOSは公開しないと決めた。ラズパイの機種やカメラ、アクセラレーター、推論速度、精度の記述はなく、ソフトもまだ出ていない。AIを積んだ機器を公開するときの安全の考え方を伝える記事として読むのがよい。船の上で使う機器は、事故やなりすましが安全に直結する。オープンソースで公開することの利点と、攻撃の手がかりになる危うさのあいだで、作者がどう判断したかが率直に書かれている。セキュリティを後回しにしない姿勢が教訓になる。","2026-11-18","DEV Community","https://dev.to/don_moskaluk_be46b51f5778/building-a-raspberry-pi-ai-marine-computer-lessons-in-security-open-source-and-trust-6em"],["組み込みC++にllama.cpp、エッジのAIアナライザ設計","センサーの時系列ログをエッジ機器の上で自然言語で解析し、保全の指示を出す「オンデバイスAIアナライザ」を、組み込みC++にllama.cppを組み込んで作るための設計記事。Raspberry Pi 4やJetson Orin Nano、RK3588などを想定し、センサー収集と推論の分け方やメモリの節約、熱への対策を解説する。実機での速度やメモリ使用量の測定結果は載っていない。","\n【概要】Zennの記事。工場などのセンサーの時系列ログを、エッジ機器の上で自然言語として解析し、保全の指示を出す「オンデバイスAIアナライザ」の設計を解説する。組み込みC++のプログラムにllama.cppを組み込む方法が中心だ。\n【背景】想定する機器は、Raspberry Pi 4（4GB）、Jetson Orin Nano、RK3588などのARMv8のLinux機。モデルはPhi-3-mini-4k-instruct-q4.ggufやQwen2.5-1.5B-Instruct-Q4_K_M.ggufなど、1〜2GB前後のものを例にしている。クラウドに送らず現場の機器だけで解析することをねらう。限られたメモリとCPUの中で、センサーの収集を止めずに言語モデルを動かすことが設計の課題になる。\n【詳細】構成は、センサーのデータを集めるタスクとAIの推論のタスクをリングバッファで分け、CMakeでllama.cppをサブディレクトリとして組み込む。コード例では、n_ctxを2048、temperatureを0.2、生成の上限を128トークンとし、greedy samplingで答えを作り、推論のあとにKVキャッシュを消す。推奨として、n_ctxを512〜1024に切り詰めてRAMを節約すること、推論のスレッドをCPUのコア2と3に固定し、nice(10)で優先度を下げてセンサー側を邪魔しないことを挙げる。\n【ポイント・注意点】注意点として、推論を続けると熱で速度が落ちるため、出来事が起きたときだけ推論する作りにすること、llama.cppとGGUFの互換性のためにコミットを固定すること、LoRAによる微調整を挙げている。記事には実機の推論速度やメモリ使用量の測定結果はない。コード例には「config_.model_path.c_c_str()」という誤記らしき箇所もあり、そのままでは修正が要りそうだ。設計の考え方の整理として読み、性能は自分の機器で測って確かめたい。小さなモデルを選び文脈を短くすることが、エッジでの現実的な落としどころとして示されている。","2026-11-17","Zenn","https://zenn.dev/esperanza/articles/auto-20261116-094430"],["44 TOPSのNPU、Rockchip RK3668がコア構成を変更","CNX Softwareは、RadxaとArmSoMが共有した資料をもとに、Rockchipの次世代SoC「RK3668」のCPU構成がCortex-A725とCortex-A520に変わったと伝えた。NPUは44 TOPS（スパース）で、エンジニアリングサンプルは2027年第1四半期、最初のSBCの試作は2027年上半期の予定だ。筆者は、TOPSだけの比較は実際のAIの処理を表さないと注意している。","\n【概要】CNX Softwareの記事。RadxaとArmSoMが共有した「RK3668 Application」という資料をもとに、RockchipのSoC「RK3668」の仕様の更新を伝える。買えるボードの話ではなく、チップの予定の話だ。\n【背景】CPUは8コアで、最大2.5GHzのCortex-A725が6つと、最大2.2GHzのCortex-A520が2つ。周波数はRockchipの見積もりだという。2025年7月に発表された、Cortex-A730が4つとCortex-A530が6つという構成から置き換わった。AIの処理を受け持つNPUは44 TOPS（スパース）で、筆者は1コア最大8.8 TOPSの5コア構成とみている。\n【詳細】GPUは最大1.1GHzのMali G2Pro MC4で1.23 TFLOPS。映像は8K 120fpsまでの再生と8K 60fpsまでの録画に対応する。メモリは最大64GBのLPDDR5x-8533、または96ビットのLPDDR6-10667で、LPDDR6なら理論値128GB/sのうち最大90GB/sが使えるという。ストレージはeMMC、NVMe、UFS 4.0などに対応し、カメラは24MPを2つと16MPを1つ扱えるISP、MIPI CSI-2の入力4つを備える。PCIe 5.0のコントローラー4つ、10GbE、CAN 6つ、Cortex-M52の安全用ドメインもある。予定は、エンジニアリングサンプルが2027年第1四半期、最初のSBCの試作が2027年上半期だ。\n【ポイント・注意点】筆者は、仕様はまだ暫定で、メモリ帯域やPCIeなど不明な点があり、ブロック図もないと書く。RockchipのNPUの比較は性能試験の結果がなくTOPSの数字だけで、TOPSは実際のAIの処理を必ずしも表さないと指摘している。価格は書かれていない。上位のRK3688は2027年末か2028年になりそうだという。エッジAI向けのSBCを選ぶ人には、先の見通しを立てる材料になる。","2026-11-17","CNX Software","https://www.cnx-software.com/2026/11/17/rockchip-rk3668-switches-to-cortex-a725-and-cortex-a520-cores-engineering-samples-planned-for-q1-2027/"],["学習済みポリシーで二足ロボ「Open Duck Mini」を歩かせる","小型の二足歩行ロボット「Open Duck Mini」を、公開されている学習済みの歩行ポリシー（ONNX）で歩かせる手順をまとめた連載の第6回。ラズパイとサーボ、ゲームコントローラーで実際に動かし、電源の不足や配線の長さによる不安定さ、制御ループの遅れの見方、調整用の引数を解説する。Ctrl+Cを押してもサーボの力は抜けないなど、安全面の注意も強調している。","\n【概要】Zennの連載の第6回。小型の二足歩行ロボット「Open Duck Mini」を、学習済みのポリシーで歩かせる手順をまとめた。ハードはラズパイ、サーボ、ゲームコントローラーで、コントローラーのAボタンで一時停止と再開ができる。\n【背景】AIの部分は、Open_Duck_Miniのリポジトリにある学習済みのポリシー「BEST_WALK_ONNX_2.onnx」を取得し、「v2_rl_walk_mujoco.py --onnx_model_path」で読み込んで歩かせる構成だ。ファイル名のとおり強化学習で得た歩き方を使うものだが、学習の方法そのものは記事には書かれていない。自分で学習しなくても、公開されたモデルで実機を動かせる点が入り口になっている。シミュレーターの名前を含むスクリプトで、実機のサーボを動かす流れだ。\n【詳細】バッテリーでは起動時に電力が足りなかったため、7.6Vの安定化電源（24AWGの線で約1.5m）で動かしている。配線が長すぎると電源が不安定になり、SSHが切れたという記載もある。歩いている途中に出る「budget exceeded」は、制御ループの1周が決められた周期に間に合わなかったことを示すと説明している。歩き方の調整用の引数として、KP（既定は30）、--action_scale、--cutoff_frequency、--pitch_biasを挙げる。設定で\"start_paused\": trueにすると、起動しただけでは歩き出さない。\n【ポイント・注意点】安全面では、Ctrl+Cを押してもサーボのトルクは切れず、最後の姿勢を保ったままになる点を強調している。最初はロボットを吊るすか手で支え、電源のスイッチとCtrl+Cにすぐ手が届くようにしておくよう勧める。学習済みのモデルを実機で動かすときは、ソフトの止め方と電源の切り方を分けて考える必要があるとわかる。電源と配線の安定が歩行の前提になる点も、実機ならではの学びだ。引数を少しずつ変えて歩き方を整える過程も楽しめる。","2026-11-16","Zenn","https://zenn.dev/yutaka_m/articles/open-duck-mini-06-first-walk"],["回路もAIが書く高精度テスター自作、3千円のADCを動かす","電圧や抵抗を測るデジタルマルチメーターを自作する連載の第1回。回路図やファーム、PCのスクリプト、手順書をAI（Claude Code、Claude Opus 5.5）が書き、はんだ付けや測定は筆者が担った。約3,100円の24ビットADCを壊さず動かすまでの記録で、ブレッドボードの接触の揺れや、AIが手順書を言い換えたことで起きた逆給電の失敗も数値つきで残している。","\n【概要】Zennの連載「Ladder Lab」の第1回。電圧と抵抗を測るデジタルマルチメーターを自作する。記事は、作業の記録をもとにAI（Claude Code、Claude Opus 5.5）が下書きを作り、回路図、ファームウェア、PCのスクリプト、手順書もAIが書いたと明記している。はんだ付け、組み立て、測定は筆者が行った。\n【背景】目標は、校正したあとで0.01〜0.02%（5桁半〜6桁半）の精度だ。ADCはTIのADS124S08（24ビット、TQFP-32版、DigiKeyで1個約3,100円）、基準電圧はADIのADR4525WBRZ-R7（Bグレード、±0.02%）。マイコンは手元にあったArduino Mega 2560の互換ボードを使う。人は手を動かして測り、AIは設計と文書を受け持つという役割分担で、どこまで精密な測定器に迫れるかを試す連載だ。\n【詳細】2つの基準の差は+1.751mVで、両方の保証の和の1.75mVとほぼ同じだった。ADC単体のノイズは1.19µV。ブレッドボードでは接触で値が揺れ（σ=322µV）、配線を直したあとの叩かない区間ではσ=27.9µVになった。筆者は、µV単位の測定ではブレッドボードの接触は信用できないと結論づけている。失敗も記録されている。AIが途中の答えで手順書を言い換えた結果、ADCを外したまま信号線だけを挿して通電してしまい、約70mAの逆給電が見えた。電流制限のある電源だったため、大事には至らなかった。\n【ポイント・注意点】AIに回路や手順を任せる場合でも、手順の言い換えが事故につながりうること、電流制限つきの電源が守りになることがよくわかる例だ。ADR4525は、はんだ付けの熱で±0.02%ずれることがあるとデータシートにあることも記されている。高精度の測定では、部品の扱いも精度に響く。AIの設計をうのみにせず、測った数値で確かめていく進め方が参考になる。失敗まで包み隠さず記録している点も、この連載の価値だ。","2026-11-16","Zenn","https://zenn.dev/k2exter/articles/5ff24daec3b92a"]],"muse":[["サブエージェントのキャッシュとルール順守、1週間のログで検証","開発者がClaude Codeの記録を1週間分読み直し、サブエージェントのプロンプトキャッシュの使われ方を調べた。種類の異なるエージェントはキャッシュを共有せず、カスタムエージェントは約59Kトークンを書き込みながら読み取りは0だった。同じ種類の最初の1体だけを先に走らせる方式を自作プラグインに実装し、待機した7体がキャッシュを読めたと報告している。CLAUDE.mdのルールが守られた割合も約14%にとどまった。","\n【概要】著者はClaude Codeの記録を1週間分読み直し、サブエージェントが指示どおりに動いていたか、プロンプトキャッシュがどう使われていたかを検証した。キャッシュの共有のされ方と、CLAUDE.mdに書いたルールの守られ方の両方に問題が見つかったとしている。【背景】サブエージェントを並列に起動すると、それぞれが似た前置きを読み込むため、キャッシュが効かなければ書き込みの費用がかさむ。著者は、種類の異なるエージェントはキャッシュを共有しないことを確認した。カスタムエージェントでは約59Kトークンを書き込みながら、読み取りは0だったという。【詳細】対策として、同じ種類のエージェントのうち最初の1体だけを先に走らせ、残りは最初の応答が返るまで待たせる方式を考えた。これを自作プラグインOmnisSwarm 0.7.0に実装し、11月15〜18日に4回実行したところ、待機した7体はいずれも19K〜33Kトークンをキャッシュから読んだ。汎用エージェントの初回の書き込みは60Kから27Kに減ったとしている。記事では、モデルが決まる優先順位として、呼び出し時の指定、エージェントファイルのmodel、環境変数CLAUDE_CODE_SUBAGENT_MODEL、メインのモデルの順を紹介し、v2.1.257以降のCLAUDE_CODE_SUBAGENT_MODEL_FORCE=1にも触れている。さらに11月13〜20日の1,799件を数えると、Sonnet 256件、Opus 1,537件、Haiku 6件で、著者のCLAUDE.mdのルールは約14%しか守られていなかった。【ポイント・注意点】待たせる方式の代償は待ち時間で、先に走るエージェントが止まった場合は4分後に残りを解放する。実行は4回だけで、同じ種類が3体を超える場合は検証していない。節約の額はトークン数と定価からの推定で、サブスクリプションの請求額ではないと著者は明記している。設定で指定したことが実際に守られているかを、記録から確かめる大切さを示す内容だ。","2026-11-21","DEV Community","https://dev.to/fortitudeomnis/my-claude-code-subagents-ignored-me-all-week-here-are-the-receipts-3g7h"],["Claude Codeの160億トークンの行き先、39日分を集計","著者は読み取り専用のusage-dashboardスキルで、10月13日〜11月20日の39日間のClaude Codeの記録を集計した。270セッション、75,055回のモデル呼び出しで計16.6Bトークン、定価換算で約4,562ドルだった。内訳はキャッシュ読み取りが96.8%を占め、サブエージェント由来が45.8%。253あるスキルのうち183は一度も呼ばれていなかった。実行方法と、出力の扱いの注意点も紹介している。","\n【概要】Claude Codeを使い込んでいる著者が、自作の読み取り専用スキルusage-dashboardで、39日間の利用記録を集計した。対象は10月13日〜11月20日で、270セッション、75,055回のモデル呼び出し、合計16.6Bトークンだった。定価で換算すると約4,562ドルになるが、これは請求額ではないと断っている。【背景】定額プランで使っていると、どこに使用量が流れているかが見えにくい。著者は記録を数えることで、費用の大半が何に使われているかを確かめようとした。【詳細】トークンの内訳は、キャッシュ読み取りが96.8%、キャッシュ書き込みが2.8%、出力が0.4%だった。金額の推定では、キャッシュ読み取りが約2,510ドルで全体の55%を占める。サブエージェントに由来するものは45.8%で、セッションごとのピーク時の文脈量の中央値は271,434トークンだった。モデル別では、Sonnet 5.5が37.5%で2,304ドル、Opus 5.5が30.1%で2,200ドル、Haiku 5.5が29.3%で58ドルとなっている。導入していた253のスキルのうち、183は一度も呼ばれていなかった。スキルはNode 22以上で、node .claude/skills/usage-dashboard/usage-dashboard.mjsとして実行する。--since 2026-11-01で期間を絞ったり、--top 0 --jsonでJSONを出したりできる。通信もファイルの書き込みもせず、プロンプトの中身は表示しないという。【ポイント・注意点】価格ファイル（2026年10月6日付）にない4種のモデルIDによる2,276回（3%）は、金額の計算から外している。ゼロとして数えたわけではない。プロジェクトのフォルダ名に取引先の名前が入っていることがあり、出力をAIのチャットに貼ると外部に送られる恐れがあると注意している。自分の使い方を数字で振り返る手順として参考になる。","2026-11-21","DEV Community","https://dev.to/malik_chohra/where-did-16-billion-claude-code-tokens-actually-go-j9f"],["20分の作業で2時間待ったエージェント、止まったジョブの見張り方","クラウドのマシンで通常約20分で終わるダンプ処理が2時間止まっていたのに、コーディングエージェントも人も気付かなかった事例の報告。終了時の通知だけではハングしたジョブを検知できず、進捗確認の間隔も根拠のない既定の40分だった。著者は「通常の2倍の時間で出力が増えたかを確かめる」ルールと、ログが伸びなければ処理を止める小さなスクリプトwatchdog.shを紹介している。","\n【概要】クラウドのマシン上でバックグラウンド処理を走らせていたところ、通常は約20分で終わるダンプが2時間止まっていた。コーディングエージェントも著者も、その間まったく気付かなかったという事例の報告だ。著者は原因を整理し、長時間の作業を見張る簡単な決まりと道具を示している。【背景】終了時に通知する仕組みだけでは、ハングしたジョブは終わらないので通知も来ない。さらにエージェントが進捗を確かめる間隔は既定の40分で、その値に根拠はなかったと著者は振り返る。【詳細】対策の柱は「通常かかる時間の2倍の時点で、出力が増えているかを確かめる」というルールだ。付属のwatchdog.shは、./watchdog.sh 秒数 ログファイル -- コマンド の形で使う。ログの大きさが指定した秒数のあいだ増えなければ処理を止め、終了コード124を返す。例として ./watchdog.sh 2400 dump.log -- python make_dump.py --circuit big が挙げられている。クラウドでは、止め忘れに備えて sudo shutdown -h +240 を併用することも提案している。確認の間隔は作業に合わせて見直し、5〜26分かかる分析の実行では約25分、7分のビルドでは約15分にしたという。エージェントに守らせるため、CLAUDE.mdに入れる文例も載せている。【ポイント・注意点】出力を出さないジョブでは、ログの代わりにハートビート用のファイルを見張る方法が示されている。2倍という値は、誤って止めることを避けるための著者の判断だ。Claude CodeのIssueにも似た報告があることに触れているが、個別には確かめていない。エージェントに長い処理を任せて席を離れる使い方では、終わりの通知だけでなく、止まったことに気付く仕組みが要るという教訓になる。確認の間隔をエージェント任せにせず、作業ごとにかかる時間を基準に決めておくことも、記事が示す大事な点だ。通知の仕組みと見張りの仕組みは、役割が違うものとして両方用意しておきたい。","2026-11-21","DEV Community","https://dev.to/priyanshudotsol/my-coding-agent-waited-2-hours-on-a-20-minute-job-5cim"],["PCのRGBライトでClaude Codeの状態を知らせるトレイアプリ","Claude Codeが今何をしているかを、PCやWi-Fi電球のライトの色で知らせるWindows用トレイアプリ「Claude Color」の紹介。作業中は青、質問は黄、プランの承認待ちは紫、許可の要求は橙、完了は緑に光る。Claude Codeのフックから状態を送り、OpenRGBや各社の照明ソフトに対応する。RGBがない場合はWindowsの通知やタスクバーの点滅で代わりに知らせる。MITライセンスで公開されている。","\n【概要】開発者が、Claude Codeの状態をPCのRGBライトの色で示すWindows用のトレイアプリ「Claude Color」を作り、公開した。.NET 10とWindows Formsで作られた、単体で動くexeファイルだ。作業中は青、質問は黄、プランの承認待ちは紫、許可の要求は橙、完了は緑に光る。【背景】Claude Codeに作業を任せていると、いつ返事を求められているのかが画面を見ないと分からない。著者は、部屋の照明やPCのライトを見るだけで状態が分かるようにしたいと考えた。【詳細】仕組みはClaude Codeのフックを使う。~/.claude/settings.jsonにUserPromptSubmit、PreToolUse、Notification、Stop、PostToolUseなどのフックを追加し、それぞれがClaudeColor.exe hookを実行する。イベントは名前付きパイプでトレイアプリに送られ、フックはすぐに戻るので、Claude Codeの動きを待たせない。対応する機器は、OpenRGB（SDK経由）、Tuya/Smart LifeのWi-Fi電球（ローカル通信、プロトコル3.3〜3.5）、Corsair iCUE、Logitech G HUB、MSI Mystic Lightだ。RGBの機器がない場合は、Windowsの通知、タスクバーの点滅、DiscordのRich Presenceで代わりに知らせる。導入は、GitHubのリリースからClaudeColor.exeを開き、「Install hooks」を押すだけで済む。MITライセンスで、GitHubのJoaoXavierDEV/Claude-Colorで公開されている。【ポイント・注意点】OpenRGBとメーカー純正のソフトが同じLEDを同時に操作すると競合する。GPUのLEDコントローラーが再起動まで応答しなくなることがあると著者は注意している。試せていない機器が多いため、著者は使った人からの報告を求めている。AIを動かし続けながら別の作業をする人にとって、状態を目で追わずに済む工夫の一例になる。","2026-11-21","DEV Community","https://dev.to/joaoxavierdev/i-made-my-pcs-rgb-lights-tell-me-what-claude-code-is-doing-225h"],["CCDV-F学習の第19回、Claudeでエージェントを作る4要素","Anthropicの資格CCDV-Fに向けた非公式の学習シリーズ（全24回）の第19回。公式の試験ガイドにある「Claudeによるエージェントの構築」の4要素、Claude Agent SDK、独自のエージェントループとハーネス、マネージドエージェントの配置方式、決定論的な動作のためのフックを、公式ドキュメントを参照しながら解説する。max_turnsやmax_budget_usdでの止め方、PreToolUseフックでの拒否なども扱う。","\n【概要】Qiitaで連載されている、Anthropicの資格CCDV-Fの合格を目指す学習シリーズ（全24回）の第19回が公開された。テーマは「Claudeによるエージェントの構築」だ。公式の試験ガイドの説明文に挙がっている4つの要素を、公式ドキュメントを参照しながら一つずつ解説している。【背景】4つの要素とは、Claude Agent SDK、独自のエージェントループとハーネス、マネージドエージェントの配置方式、決定論的な動作のためのフックだ。試験ガイドには細かい中身が書かれていないため、筆者は用語の意味を公式ドキュメントから読み解いている。その解釈は筆者の見解だと本文に記されている。【詳細】Agent SDKについては、Claude Codeと同じループと組み込みのツールを自分のアプリで使える仕組みだと説明する。max_turnsやmax_budget_usdで実行を止められ、結果のsubtypeを見ればどのように終わったかが分かる。ツールランナー（ベータ）と、自分でループを書く方法の使い分けにも触れている。Managed Agentsについては、クラウドの環境で動かす場合と、自分で用意するサンドボックスで動かす場合の違いを整理した。フックについては、PreToolUseでpermissionDecisionにdenyを返すとツールが実行されないこと、マッチャーはツール名にだけ一致することなどを説明している。【ポイント・注意点】記事は非公式で、筆者自身はまだ試験に合格していないと明記している。生成AIの助けを借りて書き、筆者が内容を確認したという。情報は2026年11月21日時点のものだ。同じ日には同じシリーズの第16〜18回も公開されている。エージェントの作り方を体系的に学びたい人には、公式ドキュメントへの道案内として使える。全24回のシリーズの一部として、Agent SDKやフックの基本を順に押さえる読み物にもなる。フックで動きを決定論的に縛る考え方は、長く動かすエージェントの安全にも直結する。","2026-11-21","Qiita","https://qiita.com/Ray_T/items/1eaa0892c3ed5d89300b"],["フックが壊れても操作は通る？14通り中11通りで通過と実測","Claude CodeのPreToolUseフックが壊れたとき、操作が止まるかを実測した記事。Windows 11で2.1.327・2.1.328・2.1.330を使い、有効な128回を試した。onFailureを書かない場合、壊した14通りのうち11通りで操作が通った。onFailureにblockを1行足すと、壊れたJSONを出す1通りを除く13通りが止まった。mcp_toolフックの扱いはバージョンで違っていた。","\n【概要】Claude CodeのPreToolUseフックが壊れたとき、本当に操作が止まるのかを実際に測った記事だ。公式ドキュメントには、ほとんどのイベントではフックが失敗しても操作が続くこと、onFailureにblockを指定すれば止められることが書かれている。筆者はそれを14通りの壊れ方で確かめた。【背景】フックで危ない操作を止めているつもりでも、フック自体が壊れていれば素通りになるかもしれない。筆者は、自分の設定が本当に守りになっているかを確かめたかった。【詳細】測定は2026年11月21日に、Git Bashを入れたWindows 11で行った。Claude Codeは2.1.327、2.1.328、2.1.330の3つで、claude -pを使った。有効な試行は128回で、組み合わせごとに1回ずつだ。onFailureを書かない場合、壊した14通りのうち11通りで操作が通った。onFailureにblockを1行足すと、壊れたJSONを出す1通りを除く13通りが止まった。ただし、存在しないファイルをpythonで実行する壊れ方は、書かなくても止まった。nodeで同じように欠けている場合は通った。mcp_toolフックは、2.1.327ではblockを書いても通り、2.1.328以降で止まるようになった。筆者は、自分の.claude/settings.local.jsonにonFailureが書かれていないことも確かめている。【ポイント・注意点】対話画面での見え方は測っていない。httpフックやCode Mode、Git Bashのない Windowsも測っていない。各組み合わせは1回ずつで、繰り返してはいない。onFailureにblockを足すと、フックが壊れている間は該当する操作がすべて止まる点にも注意が必要だ。守りのためのフックを使う人は、壊れたときの動きを一度確かめておく価値がある。特に、バージョンによって結果が変わった点は、更新のたびに確かめ直す必要があることを示している。","2026-11-21","Zenn","https://zenn.dev/ojisan_ai_lab/articles/claude-code-hook-onfailure-block-20261121"],["AIの席がログイン切れで10分停止、止まった間の知らせの扱い","X（旧Twitter）への投稿を任せているAIの「席」が、Claudeのログイン切れで約10分止まった事例の記録。席は3時間おきの定刻の知らせを受けて、予定があれば1本だけ投稿する作りだ。認証ファイルの更新で戻った後、受け取っていなかった知らせ2件を確かめて処理した。投稿の枠の外だったため、実際の被害はなかった。止まる前提で知らせを待ち行列に残す設計を勧めている。","\n【概要】X（旧Twitter）への投稿を担当させているAIの「席」が、Claudeのログイン切れで止まった事例の記録だ。2026年11月21日の朝6時5分の定刻の知らせのときに入力が止まり、約10分後に認証ファイルが更新されて元に戻った。時刻はUTCの記録に基づいており、日本時間は9時間を足したものになる。【背景】この席は、3時間おきに届く定刻の知らせ（tick）を受けて、予定があれば投稿を1本だけ出すように作られている。AIを長時間動かし続けると、認証の期限切れのような外側の理由で止まることがある。そのときに何が失われるかを確かめたのが、この記録だ。AIを人の代わりに席に着かせ、定刻の知らせを受けて働かせる形は、連続稼働の一つのやり方だ。【詳細】ログイン切れの表示はLogin expiredだった。元に戻った後、受け取っていない知らせを確かめると2件あった。1件は6時5分の定刻の知らせ、もう1件は「認証が戻りました」という知らせだ。どちらも受け取り、台帳に処理を書き込んだ。6時台はXの投稿枠の外で、出す予定もなかったので、実際の被害はなかった。投稿枠と重なっていた場合は、遅れて出すか見送るかを席が決める必要がある。その判断は今回は試していない。著者の対策は、止まることを前提に知らせを待ち行列に残しておくことだ。戻った後は、まず受け取っていない知らせを確かめ、次に止まっていた時間と予定の重なりを確かめる、という順番を勧めている。【ポイント・注意点】ログイン切れの原因は調べておらず、記録に残っているのは「期限切れ」という結果だけだと著者は書いている。AIを連続で動かす仕組みでは、止まらないことより、止まった後に取りこぼさないことが大事だと分かる事例だ。知らせを受け取ったかどうかを台帳に書き残していたからこそ、何が抜けたかを後から確かめられた点も見逃せない。ログイン切れのように外から起きる停止は、仕組みの側では防ぎきれない。だからこそ、戻った後の手順を決めておくことが、AIを長く動かす運用の要になる。","2026-11-21","Zenn","https://zenn.dev/ai_shihan/articles/9a8341f57c18f3"],["Claude Codeの費用は読み直しで決まる、128日分のログを集計","著者が1台のMacで使ったClaude Codeの記録128日分を数えた記事。応答ごとのトークン数を公式の単価で計算すると、AIに読ませた量は書かせた量の約346倍で、その97.6%はキャッシュの読み込みだった。費用の内訳もキャッシュの読み込みが57.9%で最大。出力の単価だけで見積もると実際の約10分の1に見誤るとし、自分の記録で確かめる際の数え方の注意も示している。","\n【概要】著者が1台のMacで使ってきたClaude Codeの記録を数え、費用が何で決まっているかを調べた記事だ。対象は2026年4月15日〜11月14日のうち実際に使った128日分になる。結論は、費用は書かせた量ではなく、読み直しの量で決まっていたというものだ。数え方の手順も具体的に書かれている。【背景】AIの費用というと、書かせた文章やコードの量を思い浮かべがちだ。しかしエージェントは作業のたびに会話やファイルを読み直す。著者は、それが費用にどれだけ響いているかを自分の記録で確かめた。記録はPCの中に残っているので、自分で数えれば実際の傾向が分かる。【詳細】記録は~/.claude/projects/にある.jsonlファイルで、応答ごとのusageにあるトークン数を、APIの公式の単価で計算した。AIに読ませた量（新しい入力、キャッシュの読み込み、キャッシュの書き込みの合計）は、書かせた量（出力）の約346倍だった。読ませた量の97.6%はキャッシュの読み込みだ。費用の内訳は、キャッシュの読み込みが57.9%、キャッシュの書き込みが31.7%、出力が10.3%、新しい入力が0.1%となった。出力の単価だけで見積もると、実際の約10分の1に見誤ることになるという。見積もりと実際の費用がずれる理由は、ここにある。【ポイント・注意点】自分の記録で確かめるときの注意が2つ挙げられている。1つは、同じ応答が複数の行に記録されるため、応答のID（message.id）ごとに1回だけ数えることだ。もう1つは、サブエージェントの記録は作業フォルダの下の階層にあるため、再帰的にたどる必要があることだ。1日あたりの量などの細かい集計は、別の記事に分けている。長い会話や大きな文脈を使い続ける人ほど、読み直しの量を意識することが費用を抑える近道になりそうだ。書かせる量を減らす工夫よりも、読ませる量を減らす工夫のほうが効くという見方を、実際の記録の数字で裏付けた記事だと言える。同じ集計は、記録のファイルさえあれば自分の環境でも試せる。","2026-11-21","Zenn","https://zenn.dev/kumukumu/articles/claude-code-cost-is-rereading"],["Claude Code v2.1.330、チャートのmod easelと定期実行30日","DevelopersIOがClaude Code v2.1.330の主な変更を解説した。記事の分類で142件の変更があり、チャートを描く組み込みmod「easel」が加わった。定期タスクと/loopは、セッションが動き続けている間、7日ではなく最大30日まで実行できるようになった。rmの承認の対象も広がった。deniedMcpServersの名前の指定は、指定したコネクターだけを隠す動きに変わった。","\n【概要】DevelopersIO（クラスメソッド）が、Claude Code v2.1.330の主な変更を解説する記事を公開した。記事の分類では変更は142件で、修正が98件、新機能が16件、改善が11件、破壊的な変更が6件などとなっている。この分類は記事独自のもので、CHANGELOGによるものではない。【背景】Claude Codeはほぼ毎日のように新しい版が出ており、変更の数も多い。記事は、利用者への影響が大きいものを選んで説明している。【詳細】目立つのは、組み込みのmod「easel」の追加だ。依頼したときや、MCPで得たメトリクスの結果の下にチャートを描く。対象はProとMax、提供されている場合はTeamとEnterpriseで、macOSとLinuxで使える。自動でチャートを描く動きは/configでオフにできる。Enterprise Admin Consoleで管理されている組織には、claude auth loginでサインインできるようになった。連続稼働に関わる変更として、定期タスクと/loopは、セッションが動き続けている間、7日ではなく最大30日まで実行されるようになった。それより前に作ったタスクは7日のままだ。rmコマンドの承認の対象は、ルート、ホーム、作業フォルダなどに広がった。承認できる人がいない環境では拒否される。【ポイント・注意点】deniedMcpServersに名前で書いた項目は、指定したコネクターだけを隠すように変わった。同じURLのものをすべて止めたい場合は、正確なURLを指定する必要がある。記事は、執筆時点の公式ドキュメントには、定期タスクが7日で期限切れになるという記載が残っていると指摘している。AIを長く回し続ける使い方をしている人は、30日への延長と、既存のタスクには適用されない点を確かめておきたい。rmの承認の変更も、無人で動かしている環境では動きが変わる可能性がある。毎日のように出る新しい版を追うには、こうした解説記事で影響の大きい変更だけを押さえるのが効率的だ。","2026-11-21","DevelopersIO","https://dev.classmethod.jp/articles/20261121-cc-updates-v2-1-330/"],["Claude Codeの記録を分析、自作フックの問題と本体のバグを切り分け","同じ失敗が続くとCLAUDE.mdに禁止の文を足しがちだが、先に原因が自作のフックや設定にあるのか、Claude Code本体にあるのかを分けるべきだという記事。会話の記録から失敗したツール呼び出しを集めてLLMに原因を判定させる仕組みを作り、41件のうち37件が自作の仕組み、4件が本体由来と分かった。本体のバグ2件は、それぞれ最小の手順で再現して確かめている。","\n【概要】Claude Codeで同じ失敗が繰り返されると、CLAUDE.mdに「〜するな」という文を足したくなる。著者は、その前に原因が自分のフックや設定にあるのか、Claude Code本体にあるのかを切り分けるべきだと主張し、そのための仕組みを作った。Zennに載せた記事を英語にしたものだ。【背景】会話の記録には、止められたり失敗したりしたツールの呼び出しが残っている。著者は、スクリプトでそれらを集め、LLMに原因を判定させれば、直す場所を正しく選べると考えた。【詳細】11月14日の分析では、指摘が42件、対象外が457件だった。11月18日に集計し直すと41件が残り、そのうち37件は著者の自作の仕組みが原因で、Claude Code由来は4件だった。最も多い失敗は「File has not been read yet」で、3,450件中854件あった。その1つは、SendMessageでサブエージェントを再開した直後にEditが拒否されるという本体のバグで、最小の手順で再現できたという。もう1つは、WindowsのBashツールでバックスラッシュの連続が縮められる問題で、著者は2026年11月2日にフックで補正した。仕組みはプラグインとして公開されており、/plugin marketplace add Az-llc/prompt-design-reviewと/plugin install transcript-failure-scan@az-llcで入れ、/transcript-failure-scan:scanで実行する。集計は約0.12ドル、7件の分析は約108秒で約0.53ドルだった。【ポイント・注意点】検証は著者のWindows PC 1台だけで、ほかの環境では確かめていない。記録はcleanupPeriodDays（既定は30日）を過ぎると消える。フックが一度も発火しなかった場合は記録にも残らない。ルールを書き足す前に、失敗の出どころを記録で確かめるという進め方は、長く使い続けるほど効いてくる。","2026-11-20","DEV Community","https://dev.to/murooka_az_dev/i-built-a-way-to-analyze-claude-codes-logs-it-separated-problems-in-my-own-hooks-from-two-bugs-in-2pj"],["40のエージェントが一斉に起動、7分で使用枠の83%を消費","Mac miniで数十のClaude Codeセッションを動かし、スマホから操作している著者の失敗談。使用量の上限がリセットされた直後に全セッションへ「続けて」と送ると、約40体のエージェントが同時に動き出し、7分で使用枠の83%が消えた。そこから得た5つのルールとして、担当の範囲、共有メモの読み方、mainへの送り方、使用量の予算化、報告の書き方を挙げている。","\n【概要】Mac miniで数十のClaude Codeのセッションを動かし、スマホから操作している著者が、使用量の上限で失敗した事例を報告した。レート制限がリセットされた直後に、すべてのセッションへ「usage reset, continue」と送ったところ、約40体が同時に動き出した。その結果、7分で使用枠の83%が消えたという。【背景】多くのエージェントを並べて動かすと、それぞれが自分の判断で作業を広げ、同じものを読み込み、同じ時間に枠を使う。スマホから一言で全体を動かせる便利さが、裏目に出た形だ。著者はこの失敗から、エージェントを並べて動かすための5つのルールを作った。【詳細】1つ目はレーンで、各エージェントは割り当てられた作業だけを行う。ほかの案件を見つけたら、アイデア用のファイルに1行書くだけにする。2つ目は共有メモで、書き込みを義務づけ、読むときは全文ではなくgrepで必要な箇所だけを読む。3つ目は送り方で、作るエージェントはmainにpushせず、専用のworktreeでブランチを送る。担当のlanderが2〜3本をまとめ、検査を1回だけ走らせる。pre-pushフックは、検査が通っていないmainへのpushを拒否する。4つ目は使用量を予算として扱うことで、リセット後はlander、作るエージェント2〜3体、残りの順に起動し、85〜90%で作業を保存して止める。5つ目は報告で、確かめていない点を明記させる。「後で確認する」という約束は効かず、予約したメッセージだけが再開の手段になると著者は述べている。【ポイント・注意点】83%という数字は著者の1件の事例だ。記事の一部はエージェントが下書きしたと開示している。テンプレート集は有料のPDF（12ドル）として案内されている。スマホから多数のエージェントを動かす人には、一斉に再開させない工夫が参考になる。多くのエージェントを動かすときは、作業の割り振りだけでなく、起動の順番と使用量の配分まで決めておく必要があることがよく分かる。","2026-11-20","DEV Community","https://dev.to/noah_9887fb88fef0f07a9791/forty-agents-woke-up-at-once-and-ate-83-of-my-usage-window-in-7-minutes-1pj3"],["Claude Codeの完了や確認待ちをiPhoneに通知する3つの方法","長いタスクをClaude Codeに任せて席を離れると、許可待ちで止まっていても気付けない。この記事は、StopフックとNotificationフックを使ってスマホに知らせる3つの方法を紹介する。無料のntfy、Remote Control中のClaudeアプリへのプッシュ、著者が作ったiPhoneアプリAgentAlarmだ。それぞれの設定方法と、トピック名の扱いや対応環境などの注意点をまとめている。","\n【概要】Claude Codeに長いタスクを任せて席を離れると、許可を待って止まっていても気付けない。この記事は、作業の完了や確認待ちをiPhoneに知らせる3つの方法を紹介している。どれもClaude CodeのStopフックとNotificationフックを使う。Notificationフックのmatcherにはpermission_prompt|elicitation_dialogを指定する。【背景】AIを長く動かし続けるほど、人の確認が要る瞬間を逃すと作業がそこで止まってしまう。著者は、PCの前にいなくても状況が分かるようにする方法を比べた。【詳細】1つ目はntfyで、無料のオープンソースだ。~/.claude/settings.jsonのhooksから、curl -s -m 5 -d 'Claude Code finished' ntfy.sh/長いランダムなトピック名 を実行する。2つ目はRemote Controlを使っている場合で、/configで「Push when Claude decides」と「Push when actions required」を有効にすると、Claudeアプリに通知が届く。これはClaude Codeだけで使える。3つ目は著者が作ったiPhoneアプリAgentAlarmだ。/plugin marketplace add achubnet/agentalarm-pluginsなどでプラグインを入れ、/agentalarm:setupと/agentalarm-hooks:setupを実行する。既定では、入力のない状態が2分続いたときだけ知らせ、3分以上かかったターンの完了だけを通知し、セッションごとに5分に1回までに抑える。macOSで入力のない時間を調べる例（ioregで120秒、jqが必要）も載っている。【ポイント・注意点】著者はAgentAlarmの開発者だと明記している。ntfyはトピック名を知っていれば誰でも読めるので、長いランダムな名前にし、機密を含めないことが必要だ。WindowsやSSH経由では入力の状態を判定できず、毎回通知される。AgentAlarmはiOS 26以上、CLIはNode 18以上が必要で、Androidには対応していない。","2026-11-20","DEV Community","https://dev.to/achubnet/how-to-get-an-iphone-notification-when-claude-code-finishes-or-needs-you-5baa"],["2時間の請求システム開発をClaude Codeに任せ、CLAWがチームを指揮","著者は1つのプロンプトで、B2B向けの請求サービスの構築をClaude Codeに依頼し、自作のプラグインCLAWで役割の違うエージェントを動かした。約22,000行のプロジェクトと948件の通るテストができ、仕込んだ16件のバグもすべて見つけたという。所要は約2時間で、トークンの91%はSonnetのエージェント7体が使った。導入方法と、自己申告のベンチマークである点もまとめる。","\n【概要】著者は1つのプロンプトで、B2B向けの請求サービスを作るようClaude Codeに依頼した。サブスクリプション、従量課金、VATとリバースチャージに対応した請求書、Webhook、督促、クレジットノート、複式簿記の台帳を持つものだ。作業は自作のプラグインCLAWで指揮した。GitHub Discussionsに書いた内容を転載した記事だ。【背景】大きめの開発をエージェントに任せると、役割分担や記憶の扱いがうまくいかずに崩れがちだ。CLAWはそれを整えるために、作業のルール、役割ごとのエージェント、プロジェクトのメモの3つで構成されている。1つのプロンプトから大きなシステムをどこまで作れるかを確かめ、作った後に既知のバグを仕込んで修正の力も試した。計画とレビューはOpus、実装はSonnetやHaikuが受け持つ。【詳細】記事によると、できあがったのは約22,000行のプロジェクトで、その半分はテストだった。通ったテストは948件で、わざと仕込んだ16件のバグもすべて見つけたという。トークンの91%はSonnetのエージェント7体が使い、Opusは9%だった。所要時間は約2時間で、Proプランの1セッション分の枠の85%を使った。16件のバグを16枚のチケットとしてまとめて渡すと、2回の実行ですべて直し、隠しておいたテストにも合格したとしている。導入は、/plugin marketplace add 290990-collab/CLAWと/plugin install claw@clawを実行し、プロジェクトで/claw installを行う。必要なのはPython 3.11と標準ライブラリだけだ。【ポイント・注意点】数字は著者の自己申告によるベンチマークで、第三者は確かめていない。CLAWを紹介する記事であり、宣伝の色合いが強い点にも注意したい。それでも、役割ごとにモデルを分けて長い作業を任せる構成の一例として参考になる。必要なのがPythonの標準ライブラリだけという点は、試しやすさにつながる。","2026-11-20","DEV Community","https://dev.to/290990collab/i-gave-claude-code-a-two-hour-billing-project-claw-ran-the-team-4gh6"],["Claude Desktopから別のPCのログを読む、remotify-mcpの試験","Claude Desktopからremotify-mcpを通じて、別のWindows PCにあるログファイルを読んだ試験の記録。受け手側のリスナーは監視モードで動き、コマンドごとに実行してよいかを人が答える。読み取りは期待どおりの行を返し、書き込みは受け手側で拒否するとClaudeの画面に拒否の印が出た。存在しないファイルを読んだときの返り方も確かめている。","\n【概要】Claude Desktopから、remotify-mcpというMCPサーバーを通じて、別のWindows PCにあるログを読んだ試験の記録だ。試験は2026年11月8日に行われた。受け手側のリスナーは監視モードで起動し、コマンドが届くたびに、実行してよいかをその場の人が答える仕組みになっている。【背景】AIに別のPCの様子を見せたい場面は多いが、勝手に書き込まれたり、思わぬコマンドを実行されたりするのは困る。著者は、読み取り、書き込みの拒否、失敗の3つの場面で、どう振る舞うかを確かめた。【詳細】8行の作り物のデータtest.logに対して、tail -n 5でファイルの末尾を読ませた。返ってきたのは4〜8行目で、元のファイルと一致し、大きさは101バイトだった。受け手側に表示された「Run? [y/N]」にはyと答えている。次に書き込みを試させ、受け手側でnを入力して拒否した。Claudeの画面には[declined by operator]と表示され、catで確かめるとファイルは元の8行のままだった。存在しないファイルを読ませると、tailのエラーと[remotify: exit status 1]が返り、Claudeは同じことを繰り返さなかった。読み取りは正しく、拒否も正しく伝わったことになる。環境はWindows、Bash 5.3.15(2)、curl 8.23.0だ。【ポイント・注意点】著者はremotify-mcpを広める活動に関わっていると開示している。試験は1組のWindows同士、監視モード、作り物のデータに限られる。プロジェクトの文書によると、コマンドはリスナーを起動したアカウントの権限で実行され、中継サーバーがコマンドと結果を保存する。試験用のフォルダのアクセス権は絞っていなかった。Claude Desktop側で「Allow once」の承認を約5回求められた理由は分かっていない。AIにほかのPCを触らせるときは、実行の前に人が確かめる仕組みと、権限の範囲の絞り込みを組み合わせることが大切だと分かる。","2026-11-20","DEV Community","https://dev.to/ezstgb/reading-a-remote-log-with-claude-desktop-and-remotify-mcp-2h6f"],["Claude Codeの作業をNotionに自動で記録し「共通の脳」に","Claude Codeが作業の区切りごとにNotionへ記録を残す仕組みの紹介。Notionにハブのページを作り、プロジェクトと開発ログの2つのデータベースを置いた。記録のルールはグローバルのCLAUDE.mdに書き、毎ターンではなく区切りだけで記録させる。導入から5日で開発ログは233件になった。Claude Desktopも同じNotionを読めるため、続きの相談に使えるという。","\n【概要】Claude Codeに、作業の区切りごとにNotionへ記録を残させる仕組みを作った記事だ。記録をためることで、Claude CodeとClaude Desktopが同じ情報を使える「共通の脳」にすることを狙っている。【背景】Claude Codeでの作業はセッションが変わると流れが途切れやすく、何をどう決めたかが後から追いにくい。著者は、作業の記録を1か所に集めることで、それを補おうとした。【詳細】Notionに、Claude用のハブのページを作り、その下に「プロジェクト」と「開発ログ」の2つのデータベースを置いた。プロジェクトのページは最新の状態に上書きし、開発ログは区切りごとに1件ずつ足していく。開発ログの項目は、プロジェクト、日付、種類（決定、実装、調査、設定、その他）、ツール（Claude CodeかClaudeか）、リンクだ。記録のルールはグローバルの~/.claude/CLAUDE.mdに書いた。記録は区切りだけにし、毎ターンは書かせない。Claudeが書き込めるのはハブの中だけで、ほかのページを書き換えたり消したりする前には確認させる。ハブとデータベースのURLは公開リポジトリに載せないよう、Gitで管理しないファイルに置き、CLAUDE.mdから@で読み込んでいる。導入から5日間で開発ログは233件になり、内訳は実装が140、決定が45、調査が27、設定が17、その他が4だった。区切りだけに絞っても、これだけの数の記録がたまったことになる。Claude Desktopも同じNotionを読み書きできるので、Claude Codeで進めた作業の続きをDesktopで相談できるという。【ポイント・注意点】Issueからプルリクエストを作る自動開発の記録も同じ場所に残しているが、その仕組みの詳しい説明はない。書き込める範囲を絞り、URLを公開しない工夫は、外部サービスと組み合わせるときの参考になる。作業の記録を人が書かなくても残るようにしておけば、後から振り返ったり、別の道具で続きを進めたりしやすくなる。","2026-11-20","Zenn","https://zenn.dev/ysk1to/articles/claude-code-notion-work-log"],["Claude Coworkの定期タスクで、競合の価格とレビューを毎週表に","Claude Coworkのスケジュールタスクを使い、AmazonとWalmartの競合商品の価格とレビューを毎週月曜に表へまとめる設計の記事。データAPIの呼び出しは実際に試したが、Cowork側のタスクは実行していないと明記している。週1回の実行は10回の呼び出しで約0.014737ドル。同じ商品でもキーワードで販売者と価格が変わったため、行の区別に販売者を加えた。","\n【概要】Claude Coworkのスケジュールタスクを使って、AmazonとWalmartの競合商品の価格とレビューを、毎週月曜に一覧表へまとめる仕組みの設計を説明した記事だ。EveryInfraのブログからの転載になる。著者は、データAPIの呼び出しは2026年11月3日に実際に行ったが、Coworkのタスク自体は実行していないと明記している。【背景】競合の価格を毎週手で集めるのは手間がかかる。AIに定期的に任せられれば、担当者は表を見るだけで済む。【詳細】週1回の実行は10回のAPI呼び出しで、カタログ価格では約0.014737ドルになる。Walmartの商品はIDで固定し、検索のキーワードも商品ごとに1つ決めて、毎週同じものを使う設計だ。実際に試すと、同じWalmartの商品IDでも、キーワードによって販売者と価格が違って見えた。「ninja air fryer 4 quart」ではPatent Paidの135ドル、「ninja crispi glass air fryer」ではMercshopの134.50ドルだった。このため、表の行は「ストア、商品ID、販売者」の組で区別することにした。Coworkについては、2026年10月6日以降、Pro、Max、Ultraで作った新しいタスクはクラウドで実行されると説明している。データはコネクタ経由でGoogle Sheetsに保存する。ローカルのフォルダに置くと、PCを起動しておく必要があるためだ。カスタムコネクタの設定では、APIキーをAuthorizationヘッダーでBearerの後に付けて送る方法が示されている。【ポイント・注意点】Teamプランでは「Always allow」の組織の設定が既定でオフのため、承認を求められてタスクが止まるおそれがあるという。この点は著者も確かめられていない。PCを起動していなくても動く定期実行を組むときの考え方として参考になる。実際にタスクを走らせた結果ではないため、導入する際は自分の環境で動きを確かめたい。","2026-11-20","Zenn","https://zenn.dev/everyinfra/articles/claude-cowork-scheduled-tasks-competitor-price-rev"],["Mac miniでClaude Codeを回して3か月、定期タスクの実際","RimoのCTOが、普段のPCとは別に用意したMac miniでClaude Codeに定期的な仕事を任せてきた3〜4か月の記録。Desktop AppのScheduled tasksで、バグ修正やアラート対応、PRの自動レビューなどを1時間ごとや毎日回している。2026年7月以降に解決したバグのPRの45%が定期タスク由来だった。認証切れや権限ダイアログで止まるといった失敗例も挙げている。","\n【概要】RimoのCTOが、普段使いのPCとは別にMac miniを用意し、Claude Codeに定期的な仕事を任せてきた3〜4か月の経験をまとめた記事だ。会社ではMac miniを4台買い、その後3台を追加したという。【背景】AIに仕事を任せ続けるには、止まらずに動き続ける場所が要る。普段のPCではほかの作業とぶつかるため、専用の機械を用意した。【詳細】定期実行には、主にClaude CodeのDesktop AppにあるScheduled tasksを使っており、/loopは使っていない。定期タスクには、バグ修正（9〜22時に1時間ごと）、アラート対応（1時間ごと）、新機能の開発（1時間ごと）、PRの自動レビューと承認（平日の業務時間に1日数回）、レビューの観点の更新（毎日1回）、新しいAIモデルのベンチマーク（毎日1回）などがある。タスクの中身はGitで管理するtask.mdにまとめ、プロンプトは「task.md を実行して。」だけにしている。プロンプトを1行にして中身をGitで管理するファイルに寄せる工夫は、タスクを直すたびにプロンプトを書き換えなくて済む点で実用的だ。成果として、2026年7月以降にRimoで解決したバグのPRの45%が定期タスクで作られた。直近ではPRの20〜30%が自動で承認されているという。ローカルで動かす利点として、ブラウザを使えること、たとえばClaude in Chromeを使った作業ができることを挙げている。【ポイント・注意点】失敗例として、Claude Codeの認証が切れて処理が止まること、auto modeでも権限のダイアログで途中で止まること、報告が大量になることが挙げられている。専用のPCでAIを動かし続ける運用を考えている人にとって、何を任せ、どこでつまずくかが具体的に分かる記録だ。1時間ごとのバグ修正や新機能の開発まで任せている点は、AIを連続で動かす運用がどこまで進んでいるかを示している。一方で、認証切れや権限のダイアログのように、人が近くにいないと解けない止まり方も残っている。","2026-11-20","Zenn","https://zenn.dev/rimo/articles/59dafa37bbc8af"],["Claude DesktopからBedrockへ、アクセスキーなしでサインイン接続","Claude DesktopからAmazon Bedrockへ、長く有効なAPIキーを端末に置かずに接続する手順をAWSのブログが紹介した。管理者はIAM Identity Centerでモデルの呼び出しだけを許す許可セットを作り、利用者はClaude Desktopの設定でインタラクティブサインインを選ぶ。CloudTrailには利用者の名前が残るため、誰が使ったかを追える。モデルの一覧の登録が必須などの注意点もある。","\n【概要】Claude DesktopからAmazon Bedrockへ、長期間有効なAPIキーを端末に置かずに接続する手順を説明した記事だ。著者はmacOS版のClaude Desktop 6.6395.1で確認している。インタラクティブサインインの設定項目は、バージョン1.6259.0以降で使えるという。【背景】PCに長く有効な鍵を置いておくと、漏れたときの影響が大きい。会社でClaude Desktopを配るときには、一人ひとりのサインインで使える方法が望まれる。【詳細】管理者は、IAM Identity Centerでカスタムの許可セットを作る。許可するのはbedrock:InvokeModelとbedrock:InvokeModelWithResponseStreamの2つだけで、名前の例はBedrockInference、セッションの期間は8時間だ。これを利用者に割り当てる。利用者はClaude Desktopの「開発者」から「サードパーティ推論を設定…」を開き、Bedrockを選んで、認証情報の種類で「インタラクティブサインイン」を選ぶ。入力するのは、SSOのスタートURL、SSOのリージョン、アカウントID、ロール名（許可セットの名前）の4つだ。モデルIDとしてus.anthropic.claude-sonnet-5を登録し、接続テストを押すとブラウザが開く。CloudTrailでは、ロールのセッション名として利用者の名前が記録されるため、誰が使ったかを追える。【ポイント・注意点】モデルの一覧は必ず登録する必要があり、自動では見つけてくれない。ブラウザでの承認は5分以内に終える必要がある。AWSのアクセスポータルのサインインの状態は、認証のページと共有されないことがある。PCのAIアプリを組織の認証につなぐ方法として、鍵の管理を減らしたい管理者に役立つ内容だ。鍵を配らずに済むうえ、使った人を記録から追えるため、組織での導入の手順として扱いやすい。許可する操作を2つに絞っている点も大事だ。","2026-11-19","Zenn","https://zenn.dev/aws_japan/articles/claude-desktop-bedrock-interactive-signin"],["8部署のサブエージェントで消費増、CLAUDE.mdを短くして測定","Claude Codeのサブエージェントを8つの部署に見立てて小さな会社を動かしている著者が、使用量の上限に1日3回達したことから、消費を抑えるルールを10項目作った記録。ルールの効果は測れなかったが、CLAUDE.mdの長さは測った。同じバグ修正を各3回実行すると、短いCLAUDE.mdでは入力トークンが約45%減り、絞り込みを加えると約55%減ったという。","\n【概要】Claude Codeのサブエージェントを8つの部署に見立て、小さな会社を動かしている著者の記録だ。使用量の上限である5時間の枠に1日で3回達し、サブエージェントが途中で止まったことがきっかけで、消費を抑える工夫を始めた。【背景】サブエージェントを多く動かすと、それぞれが指示や文脈を読み込むため、使用量が一気に増える。著者は、消費を抑えるルールを10項目書き、CLAUDE.mdの一番上に置いた。例として「同時に動かすサブエージェントは最大2つ」「1日のサブエージェントの起動は5〜6回まで」「会話を短く、サブエージェントの報告も3行以内」などがある。【詳細】ルールの効果は数字では測れなかった。測れたのはCLAUDE.mdの長さの影響だ。39個のファイルからなる小さなPythonのプロジェクトで、同じバグ修正の課題を、条件ごとに3回ずつclaude -pで実行した。長いC
