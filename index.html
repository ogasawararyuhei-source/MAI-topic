てみたい。まずは文字盤の呼び出しから試したい。","\n【概要】MetaのAIアシスタント「Muse」がApple WatchとWear OSに対応した。11月9日に発表され、音声通話やテキスト、音声入力で手首から使える。iPadアプリに続く展開で、提供開始から40日で米国のダウンロード数が1000万を超えた勢いが続いている。\n【背景】Museは9月にApp Storeで提供が始まり、10月にはiPadアプリが出た。11月に入ってからは、ビデオチャットやSpacesといった機能が相次いで追加されている。今回の腕時計対応は、Metaの専用端末が出る前の布石とも見られている。\n【詳細】Apple Watch版は、MuseのiOSアプリ15.0に同梱されるコンパニオンアプリとして提供される。手首からは、Museに電話をかけて話す、テキストを送る、音声入力で送るの3通りの方法で使える。文字盤のコンプリケーションからワンタップで呼び出すこともできる。Wear OS版も同じ日に提供された。Metaは9月に、専用の携帯端末「Muse Charm」を発表しており、12月の出荷が予定されている。\n【ポイント・注意点】腕時計から使える作業の範囲は、発表時点では詳しく示されていない。日本でもMuseが使えるため、腕時計版の提供状況は手元の端末で確認するとよい。Museの利用は18歳以上が対象で、提供地域は米国、カナダ、日本、シンガポールなどに限られている。音声でのやり取りが中心になるため、周囲への配慮も必要だ。まずは文字盤の呼び出しから試すのがよい。Museは、メールや会議、請求書の管理など、アカウントと結びつけた作業もできる。腕時計からは、買い物の依頼や予定の確認など、短いやり取りが中心になるとみられる。手首で完結する作業と、端末で確認したい作業を分けて考えるのがよい。まずは短い質問や依頼から試し、どこまで手首で済ませられるか確かめたい。提供地域は今後も広がる可能性がある。腕時計版の使い勝手は、利用者の報告を待って確かめたい。まずは短い依頼から試し、手首での使い勝手を確かめるのがよい。","2026-11-10","TechCrunch","https://techcrunch.com/2026/11/10/metas-ai-agent-muse-lands-on-apple-watch-and-wear-os/?ref=taaft"],["Museの「スペース」、提供中の全地域で使えるように","Museの「スペース」が、提供中のすべての地域で使えるようになった。11月7日から提供され、米国やカナダ、日本、シンガポール、メキシコが対象だ。チャットの説明から予定表や計画、ゲームなどを作り、接続したアプリから最新に保つ機能だ。日本でも使える。日本でも使えるようになったため、手元のMuseで確かめてみたい。身近な作業から試すのがよい。まずは1つのスペースを作ってみたい。","\n【概要】Museの「スペース」が、提供中のすべての地域で使えるようになった。11月7日から提供され、米国やカナダ、日本、シンガポール、メキシコが対象だ。チャットの説明から予定表や計画、ゲームなどを作り、接続したアプリから最新に保つ機能だ。\n【背景】スペースは11月6日に発表されたMuseの新機能で、特定の話題に絞った専用の会話として、Museが目標に向けて働く仕組みだ。発表直後は米国中心の提供だったが、11月8日の時点で、提供中のすべての地域で使えることが確認された。\n【詳細】スペースは、Museのサイドバーに表示される専用の会話で、利用者が「休みの日の贈り物リストを作って」などと説明すると、Museが予定表や計画、ゲーム、ダッシュボードといった小さなアプリをその場で作る。接続したアプリの情報を使って内容を最新に保つ。11月6日には、Wonderで学んだ専用モデルによるActive MemoryとActive Focusの展開も始まっており、重要な文脈の正しい利用が76%から90%、個人スーパーインテリジェンス指数が38%から47%に上がったとMetaは説明している。ただしこれらはMeta自身の内部評価だ。\n【ポイント・注意点】スペースを試す場合は、必要なアプリだけを接続し、数日後に内容が正しく保たれているか確認するとよい。Metaの性能の数字は内部評価で、第三者の検証はまだない。日本でも使えるようになったため、手元のMuseでサイドバーを確認してみたい。提供地域は今後も広がる可能性がある。まずは身近な繰り返しの作業から試すのがよい。スペースを使うと、話題ごとに会話を分けられるため、長い付き合いの中での整理がしやすくなる。贈り物のリストや旅行の計画など、時間をかけて進める作業に向いている。接続するアプリは、必要なものだけに絞るのが安全だ。内容が古くなっていないか、数日後に確かめる習慣も大切だ。日本でも使えるようになったため、手元のMuseでサイドバーを確認してみたい。まずは1つのスペースを作って様子を見るのがよい。","2026-11-08","AIFreshSignal","https://www.aifreshsignal.com/briefing/briefing-2026-11-08"],["Museを締め出したAmazon、自社Alexaの文字買い物を開始","Amazonは、Alexaに文字メッセージで買い物できる機能を始めた。9月にMetaのMuseを自社サイトから締め出した直後の動きで、招待制の米国利用者から順次広げる。検索や価格比較、カートへの追加、購入までを文字のやり取りで済ませられる。年末商戦の直前の開始だ。買い物の入り口をめぐる競争が進んでいる。文字での購入の使い勝手にも注目したい。まずは招待の有無を確認しておきたい。","\n【概要】Amazonは、Alexaに文字メッセージで買い物できる機能を始めた。9月にMetaのMuseを自社サイトから締め出した直後の動きで、招待制の米国利用者から順次広げる。検索や価格比較、カートへの追加、購入までを文字のやり取りで済ませられる。\n【背景】Amazonは9月、MetaのMuseが自社サイトを調べることを遮断した。今回の文字での買い物は、MuseのようなAIエージェントの使い方を、Amazon自身のAlexaで取り込む動きだ。年末商戦の直前に始まり、招待された利用者から順に広がる。\n【詳細】招待された利用者には、機能の有効化を促す文字メッセージが届く。有効にすると「Alexa Shopping」という連絡先に文字を送り、自然な言葉で商品の検索や価格比較、カートへの追加、購入ができる。リストの管理や価格の見守り、ウェブ全体の検索、注文状況の確認にも対応する。写真を送って似た商品を探すこともできる。招待されていない利用者は待機リストに登録できる。Alexaの買い物機能は、過去12か月に4億人以上の利用者が使ったとされている。\n【ポイント・注意点】文字での購入は、購入前の確認の仕組みがまだ詳しく示されていない。まずは価格の見守りやリスト管理から試し、カートの中身は自分で確認してから購入するのが安全だ。Amazonの発表にはMuseへの言及はないが、他社のエージェントを締め出しながら自社のエージェントを広げる流れは、買い物の入り口をめぐる競争を示している。買い物の入り口が誰の手に渡るか、今後の注目点だ。DoorDashも、他社のエージェントによる注文が数百件にとどまったとして、自社の文字エージェントに注力する方針を示している。買い物の入り口をめぐる競争は、各社が自社のエージェントを広げる流れになっている。利用者にとっては、どのエージェントが何を見られるかが大切だ。まずは招待の有無を確認し、待機リストへの登録も検討しておきたい。文字での購入の使い勝手は、実際に使ってみて確かめるのがよい。","2026-11-06","TechCrunch","https://techcrunch.com/2026/11/06/after-blocking-muse-amazon-now-lets-users-text-alexa-to-help-them-shop/"],["Claude Duet、待機者全員に開放　先回りするAIの実力は","AnthropicはClaude Duetの利用を、11月12日時点で待機していた米国のPro、Max、Ultra利用者全員に広げた。先回りして働くエージェントで、The Vergeの体験記は「少し神経質で、意外に役立つ」と評した。利用の上限は12月15日で一度区切られる。11月13日の発表だ。先回りするエージェントの実力が試される段階だ。まずは小さな作業から任せてみたい。","\n【概要】AnthropicはClaude Duetの利用を、11月12日時点で待機していた米国のPro、Max、Ultra利用者全員に広げた。先回りして働くエージェントで、The Vergeの体験記は「少し神経質で、意外に役立つ」と評した。利用の上限は12月15日で一度区切られる。\n【背景】Duetは、利用者の次の指示を待つのではなく、自分から働くAnthropicの消費者向けエージェントだ。10月21日から研究プレビューが始まり、Opus 5.5で動いている。11月13日に利用の拡大が発表され、同日にThe Vergeの体験記も公開された。\n【詳細】Duetは、利用者が設定した作業を本人が離れている間も進め、判断が必要なときに確認し、慎重な操作の前には許可を求める。対象は米国のPro、Max、Ultraの有料プランで、TeamやEnterpriseは対象外だ。待機リスト自体は残っており、今後さらに国が広がるとされている。利用の上限は12月15日に一度区切られる。The Vergeの体験記では、OpenAIのDotsやMetaのMuseよりも仕事向きだと評されたが、1人の記者の体験にすぎない点には注意が必要だ。\n【ポイント・注意点】Duetはまだ待機制で、法人向けプランは対象外だ。利用の上限が12月15日で区切られるため、その後の扱いを確認してから本格的に頼るのがよい。慎重な操作の前に許可を求める仕組みは安全面では安心だが、完全な自律にはまだ距離がある。国際展開の時期も今後の注目点だ。まずは小さな作業から任せてみるのがよい。先回りするエージェントは、指示を待つチャットボットとは使い方が違う。作業を任せたあと、進み具合の報告をどう受け取るかが鍵になる。Duetは判断が必要なときに確認してくるため、任せきりにするのではなく、ときどき様子を見る運用が向いている。利用の上限が12月15日で区切られるため、その後の扱いを確認してから本格的に頼るのがよい。国際展開の時期も今後の注目点だ。まずは身近な小さな作業から試したい。","2026-11-15","AI Agent Update","https://aiagentupdate.com/post/claude-duet-waitlist-opens-2026-11-15"],["Claudeの管理エージェント、自社環境で動かせる試行版","Anthropicは、Claudeの管理エージェントを自社のクラウドや社内環境で動かせるセルフホスト版の非公開試行を始めた。エージェントの実行環境は利用者側が持ち、モデルの推論はAnthropicや選んだ提供元へ送られる。運用の負担は利用者側に移る。11月12日の開始だ。自社環境で動かせるのは安心だが、使えない機能もある。導入前の確認が欠かせない。まずは試行の対象か確認しておきたい。","\n【概要】Anthropicは、Claudeの管理エージェントを自社のクラウドや社内環境で動かせるセルフホスト版の非公開試行を始めた。エージェントの実行環境は利用者側が持ち、モデルの推論はAnthropicや選んだ提供元へ送られる。運用の負担は利用者側に移る。\n【背景】これまでClaudeの管理エージェントは、Anthropic側が実行環境を持つ形で提供されていた。企業からは、実行環境全体を自社内に置きたいという要望があった。11月12日にセルフホスト版の試行が始まり、Anthropicの担当チーム経由で利用できる。\n【詳細】セルフホスト版では、利用者が管理エージェントのサーバーとPostgreSQLのデータベース、エージェントがシェルやファイル操作を行うワーカーを動かす。会話の履歴はこのデータベースに残る。モデルの推論は外部のままで、Anthropicのほか、Amazon BedrockやGoogleのAgent Platform、Microsoft Foundry、社内のゲートウェイへ送ることもできる。認証情報はサンドボックスの外で扱われ、利用者自身の秘密管理に置くこともできる。エージェントの操作はすべて記録され、OpenTelemetryで出力できる。ただし、ウェブフックや定期デプロイ、Files API、MCPのOAuth認証情報など、7つ以上の機能はセルフホスト版では使えない。\n【ポイント・注意点】セルフホスト版では、パッチやファイアウォール、設定の管理が利用者の責任になる。複数の部門で使う場合は、信頼の水準ごとに別々の環境が必要になる。価格は示されておらず、試行の利用者も公表されていない。同じ日にGoogleもエージェント向けのゲートウェイの試行を始めており、企業向けエージェント基盤の動きが重なっている。導入前には、使えない機能の一覧を確認しておきたい。セルフホスト版では、エージェントの実行環境を自社内に置けるため、データの扱いを自分で制御しやすくなる。一方で、運用の負担は利用者側に移る。導入前には、使えない機能の一覧を確認し、自社の要件に合うか確かめておきたい。まずは試行の対象になるかどうか、担当チームに問い合わせるのがよい。","2026-11-13","AI Weekly","https://aiweekly.co/alerts/anthropic-opens-self-hosted-claude-managed-agents-in-private-beta"]],"cnc":[["卓上CNCミルMakera Z1実機レビュー、金属加工でも上位機と同等","Hackster.ioがMakeraの卓上CNCミル「Z1」を実機で検証したレビューを更新した。木材やプラスチック、基板加工では申し分ない性能を示し、アルミや真ちゅうの切削でも上位機のCarvera Airとほぼ同等の精度を記録。1,099ドルからの価格に対し、内蔵カメラや集じん機構など上位機にない装備も備えており、入門機としての完成度の高さが際立つ内容だ。","\n【概要】Hackster.ioがMakeraの卓上CNCミル「Z1」を実機で検証したレビューを更新した。木材やプラスチック、基板の加工では申し分ない切削性能を示し、アルミや真ちゅうでも上位機のCarvera Airとほぼ同等の精度が得られたという。価格は1,099ドルからで、内蔵カメラや集じん機構を備えた完成度の高さが際立っている。レビューでは2,000ドル未満の予算なら迷わず選べる機種だと結論づけている。【背景】Z1はMakeraのエントリーモデルで、作業範囲は200×200×100mm、150Wのスピンドルを搭載する。上位のCarvera Airは2,499ドル、フラッグシップのCarveraは5,499ドルで、Z1はその半額以下という位置づけだ。デスクトップCNCの入門機として注目を集め、真空ベッドや4軸モジュールなどのアクセサリーも拡充されてきた。小型のため剛性面でも有利に働くという。【詳細】レビューでは木材の切削や基板ミリングで高い評価を得た。6061アルミでは公差がおおむね±0.15mm程度で、表面仕上げもCarvera Airとほぼ同等だったという。内蔵カメラで加工の様子をWi-Fi経由で確認でき、集じん機構「AeroDust」や真空ベッド、4軸モジュールなどのアクセサリーも用意されている。制御ソフトは直感的で初心者でも扱いやすく、新しいMakera Studio 2026はCAMと制御をひとつにまとめたものだ。【ポイント・注意点】鉄系金属の加工は公式には非対応で、スピンドルの出力不足から無理は禁物だ。純正の3Dプローブがテスト機で認識されない不具合も報告されており、ファームウェアの更新待ちとされる。Z1 Proはボールねじとクローズドループモーターを備えるが、多くの用途では標準モデルで十分だと結論づけている。購入前には作業範囲が自分の作りたい物に合うかを確かめたい。なお、Z1の作業範囲は200×200×100mmと小さめで、大きな部品には向かない。用途に合わせてZ1 Proや上位機種との比較もしておくとよいだろう。","2026-11-14","Hackster.io","https://www.hackster.io/news/the-maker-s-toolbox-makera-z1-desktop-cnc-mill-review-787aec8f8f66"],["AI CAMソフト2026年版、主要製品の機能と価格を比較","AIで加工戦略や工具経路を自動生成する「AI CAMソフト」の2026年版ガイドが更新された。CloudNCやToolpath、Limitlessなど既存CAMに組み込むタイプと、CAMなしで見積もりからNCプログラムまで作るタイプに整理し、対応機種や料金を比較している。旋盤への対応はまだ限定的で、導入前の確認が欠かせないという。料金は変更されることもあるため、公式ページでの確認が欠かせない。","\n【概要】AIが加工戦略や工具経路を自動で選ぶ「AI CAMソフト」の2026年版ガイドが更新された。既存のCAMに組み込んで使うコパイロット型と、CAMのライセンスなしで見積もりからNCプログラムまで作る一体型に整理し、主要製品の対応機種や料金を比べている。旋盤や複合加工への対応はまだ限定的だという。各製品の説明はメーカー公式ページを2026年11月4日時点で確認したものだ。【背景】CAMのプログラミングは熟練者の手作業に頼る部分が大きく、人手不足の現場ではボトルネックになりやすい。2026年はCloudNCのCAM AssistやToolpath、LimitlessといったAIツールが実用段階に入り、見積もりの自動化と合わせて導入が進んでいる。ガイドは各社の公式ページを2026年11月4日時点で確認してまとめられたもので、筆者の自社製品への立場も明記されている。【詳細】CloudNC CAM AssistはFusionやMastercam、NXなど5つのCAMで使え、3軸と3+2軸のフライス加工に対応する。月額はJob Shopプランで995〜1,499ドルとされる。ToolpathはFusion専用で、自動化CAMはProプランが1シート月額125ドル。LimitlessはMastercamやNX、Creoで動き、切削力の物理モデルやミルターン加工の干渉チェックをうたう。KinetiCADはSTEPと図面から旋盤とフライスの両方を計画し、見積もりまで一体で作る。【ポイント・注意点】ほとんどのAI CAMは使うCAMのライセンスが別途必要で、費用は本体と合わせて考える必要がある。旋盤やミルターンへの対応は製品によって差があり、CloudNCは開発中とされる。導入前には自社の部品と図面を持ち込み、図面の公差を読み取るか、加工後の検証がどう行われるかを確認するとよい。価格は変更されることもあるので公式ページで確かめたい。なお、ガイドはKinetiCADの運営者によるもので、自社製品への立場が明記されている。比較を読む際はその前提を踏まえておくとよい。","2026-11-10","KinetiCAD","https://kineticad.ai/blog/ai-cam-software"],["主要CAD/CAMのAI機能を総覧、MastercamやNXの違いを整理","主要CAD/CAMソフトのAI機能を一覧で比べた2026年版のガイドが更新された。MastercamのCopilotやNXの加工提案、ESPRITのProPlanAIなど大手の内蔵機能と、CloudNCやToolpathといった後付けのAIツールを整理。アシスタント型とエージェント型の違いも解説し、自社の課題に合った選び方を示している。料金は非公開の製品もあり、導入前の見積もりが必要になる。","\n【概要】主要なCAD/CAMソフトのAI機能を一覧で比べた2026年版のガイドが更新された。MastercamのCopilotやSiemens NXの加工提案、Hexagon ESPRITのProPlanAIといった大手の内蔵機能と、CloudNCやToolpath、Limitlessなどの後付けAIツールを整理し、それぞれの違いを解説している。筆者は各社の公式ページを2026年11月10日までに確認したとしている。【背景】2026年は大手CAMベンダーがAI機能を相次いで組み込み、同時に後付けのAIツールも実用段階に入った。Mastercam Copilotは2026.R2で正式版となり、保守契約のユーザーには無料で提供される。NXは特徴をクリックすると加工方法を提案する機能やチャット型のコパイロットを備え、ESPRITは自社の過去のプログラムで学習するProPlanAIを持つ。CimatronはLimitlessと組んだCAM AgentをIMTS 2026で披露した。【詳細】ガイドはAI機能を「アシスタント」と「エージェント」に分けて説明する。アシスタントは指示を受けて操作を代行するもので、Mastercam Copilotが代表例だ。エージェントは部品を見て段取りや工具、工具経路まで提案するもので、CloudNCやToolpath、Limitless、CimatronのCAM Agentなどが該当する。Fusionは穴やポケットの自動認識を備えるが、AIによる工具経路生成はパートナー製品に頼っている。NXの加工提案は使うほど自社の習慣に合うよう学習するとされる。【ポイント・注意点】多くのAIツールは3軸や3+2軸のフライス加工が中心で、旋盤やミルターンへの対応は限られる。料金は非公開の製品も多く、導入前に見積もりが必要だ。デモでは自社の部品と図面を持ち込み、図面の公差を読み取るか、加工後の検証方法や総費用を確認するとよいとしている。筆者の自社製品への立場も明記されており、比較はその前提で読むとよい。","2026-11-10","KinetiCAD","https://kineticad.ai/blog/cad-cam-software-with-ai-features"],["中村留がATC型複合加工機RX-50を初披露、時計部品など高付加価値加工に","中村留精密工業がJIMTOF2026でATC型複合加工機「RX-50」を初披露した。タレットを持たない対向2スピンドルと独立した工具主軸の構成で、独自開発の小型工具主軸「NT Smart Cube」は最高回転数3万回転をうたう。時計や医療、宝飾といった高価な材料の少量加工で、最初の1個から良品を狙う設計だ。発売は2027年1月を予定し、月間20台の販売を目指している。","\n【概要】中村留精密工業がJIMTOF2026でATC型複合加工機「RX-50」を初披露した。タレットを持たない対向2スピンドルと独立した工具主軸の構成で、独自開発の小型工具主軸「NT Smart Cube」は最高回転数3万回転をうたう。時計や医療、宝飾といった高価な材料の少量加工で、最初の1個から良品を狙う設計になっている。【背景】高付加価値の部品はロットが小さく材料も高価なため、試し切りを繰り返して品質に近づける従来のやり方では無駄が大きい。中村留は段取りや調整の時間をいかに短くするかを考えてRX-50を開発したという。機械本体は3000×2000mmと工具主軸機としてはコンパクトで、限られた設置スペースにも対応できる。2027年1月の発売を予定し、月間20台の販売を目標としている。【詳細】工具主軸は独立しており、他の加工系統からの振動や熱の影響を抑えて位置決め精度を高めている。対向2スピンドルを水平ベッドに垂直かつ左右対称に配置した独自のシンメトリー構造で、熱安定性を高めた。熱変位の補正値を計算する「NTサーモナビゲーターAI」も標準搭載する。最大加工径はφ350mm、最大加工長さは615mmで、ATCは標準60本、オプションで最大119本まで搭載できる。主軸中心までの距離を450mmに抑え、手作業やロボットでのワーク交換もしやすい。【ポイント・注意点】RX-50は発売前の製品のため、実際の加工精度や使い勝手は今後の実証で確かめる必要がある。操作盤「NT SmartX」の新バージョンも参考出展されており、こちらも仕様は未確定だ。マシニングセンタと比べると段取り替えの手間が少なく、同軸度の管理もしやすいとされるが、導入を検討する場合は展示会のデモ内容と合わせてメーカーの最新情報を確認したい。中村留の社長は、段取りや調整の時間が加工時間より長いことが多いと指摘し、最初の1個から良品を作ることを開発の狙いとしたと語っている。JIMTOF2026の会場では実機のデモも行われた。","2026-11-09","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/09/news029.html"],["オークマとファナックのCNC向けAIを比較、書き込み権限の設計が焦点","JIMTOF2026で示されたオークマとファナックのCNC向けAIを、3つの現場の場面で比べた解説記事が公開された。オークマは対話で過去のデータを引くAIエージェント、ファナックはLLMとCNCをつなぐ「フィジカルAI CNC」を参考出展。両社の違いは、AIが機械の設定を書き換える権限をどこに置くかに集約されるという。両社とも参考出展の段階で、製品の仕様はまだ確定していない。","\n【概要】JIMTOF2026で示されたオークマとファナックのCNC向けAIを、3つの現場の場面で比べた解説記事が公開された。オークマは自社CNC「OSP」と生成AIを組み合わせたAIエージェントを、ファナックはLLMとCNCをつなぐ「フィジカルAI CNC」を参考出展した。両社の違いは、AIが機械の設定を書き換える権限をどこに置くかに集約されるという。どちらも参考出展やコンセプトの段階で、製品の仕様は確定していない。【背景】工作機械の現場では熟練者の不足が進み、アラーム対応や加工不良の原因究明、稼働報告の作成といった作業の負担が課題になっている。オークマのAIエージェントは加工履歴や稼働データ、マニュアルを参照してチャットで答える仕組みで、2027年度の商品化を目指すと報じられている。ファナックはMCPサーバでLLMとCNCをつなぐ構想を示し、LLMがCNCのデータを参照して設定変更の案を出せるようにするという。【詳細】アラームの場面では、オークマは「聞かれたら過去を引いて答える」方式で、ファナックはAIが原因を推定しシミュレーションで検証した対策だけを提案する。加工不良の場面では、ファナックのAI加工面チューナーがサーボデータや加工プログラムから原因を推定し、改善案を示す。ただしLLMの出力は実機に直接送らず、PC上のデジタルツインで検証し、オペレーターが承認した場合のみ実機へ転送する2段の関門を設けている。報告の場面では、オークマは加工レポートの自動作成も視野に入れている。【ポイント・注意点】デジタルツインで検証できるのはモデル化された範囲に限られ、材料ロットのばらつきや工具の摩耗までは検証できない点に注意が必要だ。導入を検討する工場は、アラーム履歴や稼働実績の保存期間、停止理由の記録方法、MESとの時刻の突き合わせを事前に確認しておくとよい。書き込みを伴う方式を選ぶ場合は、承認者と記録の残し方を先に決めておくと試験導入の範囲を絞りやすい。記事はMONOistや日刊工業新聞などの報道をもとにまとめられており、MCPサーバの提供時期など未確認の点も明記されている。一次情報の発表を待つ姿勢も示されている。","2026-11-03","MFG-AI","https://www.mfg-ai.com/data/jimtof2026-okuma-fanuc-cnc-agents"]],"cricut":[["Cricutで木材を切る方法、写真オーナメント作りで解説","Jennifer Makerが「Cricutで木材を切る」チュートリアルを公開した。バルサ材や木材ベニヤを使った写真オーナメント作りを通して、機種と刃の組み合わせやDesign Spaceでの設定を解説する。長方形・丸型・四角形の3種類のデザインが無料で配布され、初めて木材に挑戦する人にも取り組みやすい内容だ。動画は2026年11月15日夜に初公開され、無料のデザインも配布される。","\n【概要】Jennifer Makerが「Cricutで木材を切る」チュートリアルを公開した。バルサ材や木材ベニヤを使った写真オーナメント作りを通して、機種と刃の組み合わせやDesign Spaceでの設定を解説する。長方形・丸型・四角形の3種類のデザインが無料で配布され、初めて木材に挑戦する人にも取り組みやすい内容になっている。動画は2026年11月15日夜に初公開される。【背景】木材のカットは紙やビニールと違い、刃や材料の組み合わせが分かりにくく、初めての人にはハードルが高い。Jennifer Makerは毎年恒例の「Merry Maker Mingle 2026」の一環としてこのチュートリアルを公開した。デザインは無料のライブラリからDesign #848として入手でき、SVGのほかDXFやPDFも用意されている。木材に写真を組み合わせたオーナメントは、家族の思い出を残す飾りとしても人気だ。【詳細】Makerシリーズはナイフブレードでバルサ材などの厚めの木材を切れ、ExploreやVentureはディープポイントブレードで木材ベニヤを切れる。オーナメントは写真をはめ込む切り抜き付きの木枠とビニールの装飾を組み合わせる作りで、Design Spaceでは写真をガイドに合わせて切り抜く手順も紹介されている。材料は12インチ×6インチ×1/16インチのバルサ材か、12インチ×12インチの木材ベニヤを使う。ビニールの文字や年号を貼って仕上げる。【ポイント・注意点】バスウッドはこのデザインの小さな開口部には向かず、試作の結果から推奨されていない。木材は刃が何度も往復して切るため、紙やビニールより時間がかかる。カット前にマットへの固定を確かめ、切り残しがあればマットを排出する前に再度カットするとよい。写真はPrint Then Cutで印刷して使い、オーナメントを大きくする場合は吊り下げ穴が刃で切れる大きさを保つこと。デザインは長方形・丸型・四角形の3種類で、写真を入れる切り抜きの形が異なる。家族の写真やペット、記念日を入れて贈り物にすることもできる。","2026-11-15","Jennifer Maker","https://jennifermaker.com/cutting-wood-with-cricut/"],["ホールマーク映画風の無料SVG、クリスマスギフト作りに","Crafty Crafterが「ホールマーク・クリスマス・ムービー」をテーマにした無料SVGを公開した。太くすっきりしたラインでウィーディングがしやすく、Tシャツやマグカップ、トートバッグなどに使いやすい。個人利用は無料で登録も不要。映画鑑賞会のおそろいシャツやシークレットサンタのギフト作りに向いている。ファイルはZIPで配布され、解凍してからDesign Spaceにアップロードして使う。","\n【概要】Crafty Crafterが「ホールマーク・クリスマス・ムービー」をテーマにした無料SVGを公開した。太くすっきりしたラインでウィーディングがしやすく、Tシャツやマグカップ、トートバッグなど幅広い素材に使いやすい。個人利用は無料で登録も不要。映画鑑賞会のおそろいシャツやシークレットサンタのギフト作りに向いている。【背景】冬の夜に温かい飲み物と心温まる映画で過ごす時間は、多くの人にとってクリスマスの楽しみのひとつだ。このデザインはそんな冬の夜のくつろいだ気分を切り取ったもので、サイトの無料SVGライブラリは毎週新しい季節のデザインが追加されている。クリスマスの準備を始める11月に合わせた公開だ。グループでの制作や職場の交換会にも使いやすい。【詳細】デザインは白いアイロンプリント用ビニールを黒いTシャツに貼る高コントラストの使い方が紹介されているほか、タンブラーやセラミックマグ、トートバッグ、クッション、アクリル製のオーナメントなどへの応用例も挙げられている。Cricut JoyやMaker、Exploreのほか、Silhouette Studioでも使える。ファイルはZIPで配布され、使う前に解凍してDesign Spaceにアップロードする。SVGはベクター形式のため、サイズを変えても画質は劣化しない。【ポイント・注意点】アイロンプリント用ビニールで切る場合は、必ずデザインを反転させる必要がある。ライセンスは個人利用のみで、作った物の販売はできるがデジタルファイルそのものの再配布や転売はできない。アップロードがうまくいかない場合は、まずZIPを解凍したかを確認するとよい。素材に合わせたビニールの種類や転写テープの選び方も仕上がりを左右する。サイトの無料SVGライブラリは毎週新しい季節のデザインが追加されており、クリスマス向けの作品も充実している。デザインは太い線で構成されているため、小さいサイズでも切りやすく、初心者でも扱いやすい。マグカップやトートバッグなど身近な物に貼るだけで、季節の雰囲気を手軽に楽しめる。","2026-11-14","Crafty Crafter","https://crafty-crafter.club/christmas/hallmark-christmas-movies-svg/"],["ミッキー風クリスマスSVGが無料公開、家族おそろい作りに","Crafty Crafterがミッキーをモチーフにしたクリスマス向けの無料SVGを公開した。すっきりした線でウィーディングがしやすく、家族おそろいのTシャツやパジャマ、マグカップ、ストッキングなどに使える。個人利用は無料で登録不要。CricutとSilhouetteの両方に対応している。ファイルはZIPで配布され、解凍してからDesign Spaceにアップロードして使う。名前を入れてパーソナライズすることもできる。","\n【概要】Crafty Crafterがミッキーをモチーフにしたクリスマス向けの無料SVGを公開した。すっきりした線でウィーディングがしやすく、家族おそろいのTシャツやパジャマ、マグカップ、ストッキングなどに使える。個人利用は無料で登録は不要。CricutとSilhouetteの両方に対応している。【背景】ディズニーのキャラクターはクリスマスの手作りギフトでも人気が高く、家族でおそろいの服を作る定番のテーマになっている。このデザインは懐かしさを感じる遊び心のある雰囲気で、クリスマスの朝のパジャマやツリーのオーナメントなど、家族の思い出作りに合わせた公開だ。サイトでは季節の無料SVGが随時追加されている。【詳細】Tシャツには白いアイロンプリント用ビニールを黒い生地に貼る使い方が紹介され、マグカップには光沢のある粘着ビニール、オーナメントには透明なアクリル素材への貼り付けが挙げられている。名前を入れてパーソナライズしたストッキングや、ギフトタグ、窓用デカールへの応用も可能だ。ファイルはZIPで配布され、解凍してからDesign Spaceにアップロードする。SVGはベクター形式のため、サイズを変えても画質は劣化しない。【ポイント・注意点】アイロンプリント用ビニールを使う場合は、プレビュー画面でデザインを反転させるのを忘れないこと。ライセンスは個人利用のみで、作った物の販売はできるがデジタルファイルの再配布や転売はできない。Cricutがうまく切れない場合は、サイト内のトラブルシューティングの案内も参照できる。細かい線が多いデザインは、刃の切れ味とマットの粘着を確認してから切るとよい。サイトでは季節の無料SVGが随時追加されており、クリスマス向けの作品も充実している。デザインはすっきりした線で構成されているため、小さいサイズでも切りやすく、初心者でも扱いやすい。家族おそろいのTシャツやパジャマを作れば、クリスマスの朝の思い出作りにもなる。マグカップやストッキングなど身近な物に貼るだけで、季節の雰囲気を手軽に楽しめる。","2026-11-14","Crafty Crafter","https://crafty-crafter.club/christmas/mickey-christmas-svg-for-cricut/"],["回る仕掛け付きクリスマスカード、無料SVGで作る","Extraordinary Chaosが「いたずらっ子か良い子か」を回して決めるスピナー付きクリスマスカードの無料SVGを公開した。グリッターカードと印刷用のPNGを組み合わせ、留め具で回る円盤を作る仕掛けだ。クリスマスカードやクリスマスイブの箱、エルフの小道具として楽しめる。ファイルは会員ショップから入手でき、登録するとメールで届く仕組みだ。CricutのほかSilhouetteやGlowforgeでも使うことができる。","\n【概要】Extraordinary Chaosが「いたずらっ子か良い子か」を回して決めるスピナー付きクリスマスカードの無料SVGを公開した。グリッターカードと印刷用のPNGを組み合わせ、留め具で回る円盤を作る仕掛けだ。クリスマスカードやクリスマスイブの箱、エルフの小道具として楽しめる内容になっている。【背景】クリスマスが近づくと、子どもたちは自分が「良い子リスト」に入っているか気になるものだ。このカードはそんな季節のワクワク感を遊び心のある仕掛けにしたもので、カードを開かなくても円盤を回して結果を楽しめる。サイトの無料ファイルは会員ショップから入手でき、登録するとメールで届く仕組みだ。Glowforgeで木材やアクリルに使うこともできる。【詳細】必要なのはCricut Makerなどのカッティングマシンと、赤や緑、白のグリッターカード、印刷用の白いカード、留め具、接着剤などだ。ベースをグリッターカードで切り、印刷したスピナー円盤を重ねて留め具で止める。円盤は半円の切り欠きからはみ出す大きさにし、雪の結晶の飾りを付ける。Print Then Cutを使う場合は、スピナーの幅が6.75インチ以内に収まるようサイズを調整する。ベースは11×6インチ強の大きさで作られている。【ポイント・注意点】印刷したスピナーの黒いガイド線は触るとにじみやすいので、印刷後は端を持って扱うとよい。留め具の穴を開ける前に、円盤がきちんと回るか確かめること。表と裏を貼り合わせる際は四隅だけに接着剤を付け、円盤の動きを妨げないようにする。Glowforgeで使う場合はSVGとPNGの使い分けに注意したい。スコア線を入れる場合はスコアリングホイールかスタイラスが必要だ。このカードはクリスマスカードとしてはもちろん、クリスマスイブの箱に入れる小物や、エルフが置いていく仕掛けとしても楽しめる。雪の結晶の飾りにはグリッターのドロップを付けると立体感が出る。子どもと一緒に作れば、クリスマスまでのカウントダウンの楽しみにもなる。ベースのサイズは11×6インチ強で、24インチのマットを使えばさらに大きく作ることもできる。","2026-11-14","Extraordinary Chaos","https://extraordinarychaos.com/naughty-or-nice-spinner-card.html"],["ドアの角を飾る無料デザイン、左右どちらにも対応","Jennifer Makerがドアの角に置く飾り「フレキシブル・ドアコーナートッパー」の無料デザインを公開した。雪だるま・ツリー・トラックの3種類で、Design Spaceで左右反転すれば左右どちらの角にも使える。色画用紙で作る重ね切りデザインで、Merry Maker Mingle 2026の一環として動画も公開される。動画は2026年11月14日夜に初公開され、無料のデザインも配布される。","\n【概要】Jennifer Makerがドアの角に置く飾り「フレキシブル・ドアコーナートッパー」の無料デザインを公開した。雪だるま・ツリー・トラックの3種類で、Design Spaceで左右反転すれば左右どちらの角にも使える。色画用紙で作る重ね切りデザインで、Merry Maker Mingle 2026の一環として動画も公開される。【背景】ドアの上は飾り付けを忘れがちな場所だが、角にひとつ飾りを置くだけで部屋の雰囲気が変わる。Jennifer Makerは左右どちらか片方にしか合わないデザインの問題を解決するため、同じファイルを反転させて使える設計にした。無料のライブラリからDesign #847として入手でき、2026年11月14日夜にチュートリアル動画も初公開される。25日間毎日新しいプロジェクトが届く企画のひとつだ。【詳細】デザインは色画用紙を重ねて作り、雪だるまは8層、ツリーは7層、トラックは6層で構成される。Cricut MakerやExplore、Venture、Joyシリーズで切ることができ、12インチ×12インチの画用紙をグリーンのStandardGripマットに貼って切る。素材の設定は中厚の画用紙で「多め」の圧力、グリッター画用紙は専用の設定を使う。組み立ては層を順に重ねて接着剤で貼るだけだ。両面テープやコマンドストリップで壁に付けることもできる。【ポイント・注意点】デザインは右角用に作られているので、左角に使う場合はDesign Spaceで「水平方向に反転」を選ぶこと。切り終えたらマットから外す前に角を持ち上げて切り残しがないか確かめるとよい。Joyシリーズで作る場合は4.5×5.19インチ以下、Joy Xtraでは8.5×9.81インチ以下に縮小する必要がある。細かい部分はスパチュラで丁寧に外すとよい。ドアの上は飾り付けを忘れがちな場所だが、角にひとつ飾りを置くだけで部屋の雰囲気が変わる。両面テープやコマンドストリップで壁に付けることもできる。雪だるま・ツリー・トラックの3種類から部屋の雰囲気に合うものを選べる。","2026-11-14","Jennifer Maker","https://jennifermaker.com/flexible-door-corner-topper/"],["雪だるまがツリーになる無料SVG、Tシャツやマグに","Crafty Crafterが雪だるまを積み重ねてツリーに見立てた無料SVGを公開した。すっきりした線でウィーディングがしやすく、家族おそろいのTシャツやギフトタグ、マグカップなどに使える。個人利用は無料で登録不要。CricutとSilhouetteの両方に対応している。ファイルはZIPで配布され、解凍してからDesign Spaceにアップロードして使う。Cricut JoyやMaker、ExploreのほかSilhouetteでも使える。","\n【概要】Crafty Crafterが雪だるまを積み重ねてツリーに見立てた無料SVGを公開した。すっきりした線でウィーディングがしやすく、家族おそろいのTシャツやギフトタグ、マグカップなどに使える。個人利用は無料で登録は不要。CricutとSilhouetteの両方に対応している。【背景】定番の飾りとは少し違う、遊び心のあるクリスマスデザインを探していた作者が、雪だるまを積み重ねるアイデアを思いついたという。ミニマルな線と祝祭感のある組み合わせで、子どもから大人まで楽しめるデザインになっている。クリスマスフェアでの販売用にも使いやすいとしている。サイトでは季節の無料SVGが随時追加されている。【詳細】Tシャツには白いアイロンプリント用ビニールを黒い生地に貼る使い方が紹介され、マグカップには光沢のある粘着ビニール、コースターには木材への熱転写、トートバッグやティータオル、アクリル製オーナメントへの応用も挙げられている。ファイルはZIPで配布され、解凍してからDesign Spaceにアップロードする。SVGはベクター形式のため、サイズを変えても画質は劣化しない。Cricut JoyやMaker、Exploreのほか、Silhouette Studioでも使える。【ポイント・注意点】アイロンプリント用ビニールを使う場合は、必ずデザインを反転させること。小さな事業で販売用の商品に使う場合は、デザインの線がすっきりしているため短時間で仕上げやすい。ライセンスは個人利用のみで、作った物の販売はできるがデジタルファイルそのものの再配布や転売はできない。Cricutの調子が悪いときは、サイト内のトラブルシューティングの案内も参照できる。サイトでは季節の無料SVGが随時追加されており、クリスマス向けの作品も充実している。デザインはすっきりした線で構成されているため、小さいサイズでも切りやすく、初心者でも扱いやすい。家族おそろいのTシャツやギフトタグを作れば、クリスマスの準備も楽しくなる。マグカップやトートバッグなど身近な物に貼るだけで、季節の雰囲気を手軽に楽しめる。","2026-11-13","Crafty Crafter","https://crafty-crafter.club/christmas/christmas-tree-snowmen-svg/"],["Cricut Maker 5の買い方ガイド更新、3mm対応と小型化を解説","Cricut Maker 5の使い方と選び方をまとめたガイドが更新された。従来機より30％小型化し、3mmまでの素材を切断・彫刻できるようになった点が最大の特徴。13種類のツールと300以上の素材に対応し、バンドルは349ドルから。Design SpaceのAI機能や新ペンホルダーの注意点も解説している。ガイドは2026年11月12日に更新され、発売当初の情報も整理されている。","\n【概要】Cricut Maker 5の使い方と選び方をまとめたガイドが更新された。従来機より30％小型化し、3mmまでの素材を切断・彫刻できるようになった点が最大の特徴だ。13種類のツールと300以上の素材に対応し、バンドルは349ドルから。Design SpaceのAI機能や新しいペンホルダーの注意点も解説している。【背景】Maker 5は2026年9月に発売されたCricutの最上位カッティングマシンで、2017年の初代から数えて4代目にあたる。発売当初はMichaelsでの独占販売を経て、現在は複数のバンドルで販売されている。スレートブルーとティール（Michaels限定）の2色が用意され、6種類のバンドルから選べる構成だ。ガイドは2026年11月12日に更新された。【詳細】最大の変更点は素材対応厚が2.4mmから3mmへ広がったことで、木材やアクリル、金属、フォームコアなどの切断や彫刻がしやすくなった。本体は幅50.2cm、奥行き19cm、高さ12.1cmで、従来機より30％小さい。ボタンは読み込み用と排出用の2つに簡素化され、ペンは新しいスナップイン式ホルダーを使う。Design Spaceでは背景除去や自動ミラー、AIによる画像生成などの機能が使える。Smart Materialsを使えばマットなしで最長3.6mまで切れる。【ポイント・注意点】従来のMakerやExplore用のペンやスコアリングスタイラスは新しいペンホルダーに合わず、使えないので注意が必要だ。刃やマットは従来品と互換性がある。3mmまで対応するとはいえ、素材の密度や刃の種類によって切れない場合もある。バンドルはEssentialが349ドル、最上位のUltimate Plusが549ドルで、付属品の内容を確認して選ぶとよい。初めての人は価格と付属品のバランスで選ぶのが無難だ。Maker 5は初代から数えて4代目で、2017年の初代、Maker 3、Maker 4に続くモデルだ。用途に合わせて6種類のバンドルから選べる構成で、付属品の内容を確認して選ぶとよい。","2026-11-12","First Day of Home","https://www.firstdayofhome.com/cricut-maker-5-what-you-need-to-know/"]],"uv":[["卓上UVプリンター5機種を比較、購入ガイド2026年版","The Gadgeteerが2026年版の卓上UVプリンター購入ガイドを公開した。xTool O1 Omni、eufyMake E1、Procolored V4の市販3機種と、クラウドファンディング中のMorpho、HeyGears G1Xを比べ、価格と仕様をメーカー公式ページで確認している。初めての1台にはE1、幅広い用途にはO1 Omniが推奨されている。","\n【概要】The Gadgeteerが2026年版の卓上UVプリンター購入ガイドを公開した。xTool O1 Omni、eufyMake E1、Procolored V4の市販3機種と、クラウドファンディング中のMorpho、HeyGears G1Xを比べ、価格と仕様をメーカー公式ページで確認している。初めての1台にはE1、幅広い用途にはO1 Omniが推奨されている。価格と仕様は今週確認されたものだ。【背景】卓上UVプリンターはかつて業務用の大型機が中心だったが、デスクトップ機の登場で小規模な工房や個人でも導入しやすくなった。木材やアクリル、ガラス、金属、布に直接印刷でき、立体感のある印刷も可能だ。ガイドでは5機種のうち3機種がブラックフライデーで値下げされており、買い時の情報としてもまとめられている。【詳細】xTool O1 Omniは2,249ドルからで、UV印刷に加えてUV DTFや布への印刷にも対応する多機能機だ。eufyMake E1は1,999ドルで、330×420mmのベッドに5mmまでの立体印刷ができる。Procolored V4は2,299ドルで、印刷面積は120×170mmと小さいがスマホケースなどの小物に特化している。Morphoは2,159ドルからのクラウドファンディング機で、HeyGears G1Xは3,299ドルからの早期価格でフルカラー3D印刷への拡張もうたう。【ポイント・注意点】MorphoとHeyGears G1Xはまだ出荷されておらず、クラウドファンディング特有の遅延リスクがある。今月中に必要な場合は市販機を選ぶべきだ。E1はインクが暗号化チップ付きのカートリッジ式で、他社インクを使うと保証対象外になる。価格と仕様は今週確認されたものだが、セール価格は変わりやすいので購入前に公式ページで確かめたい。ガイドでは5機種のうち3機種がブラックフライデーで値下げされており、買い時の情報としてもまとめられている。初めての1台にはE1、幅広い用途にはO1 Omni、小物専門にはProcolored V4が推奨されている。","2026-11-14","The Gadgeteer","https://the-gadgeteer.com/2026/11/14/the-5-best-desktop-uv-printers-to-buy-in-2026/"],["eufyMake E1が年末セールで1,799ドルに、UV DTFの費用も整理","eufyMake E1のブラックフライデー価格をまとめた記事が公開された。最終セールは11月11日から30日までで、基本バンドルは1,799ドル、ロータリーやUV DTFラミネーターなど3つの付属品を加えたデラックスプラスは2,699ドル。インクの価格や価格保証の条件も整理されており、購入前の確認に役立つ。価格はメーカー公式ページで11月13日に確認されたものだ。購入前には公式ページで最新の価格を確かめたい。","\n【概要】eufyMake E1のブラックフライデー価格をまとめた記事が公開された。最終セールは11月11日から30日までで、基本バンドルは1,799ドル、ロータリーやUV DTFラミネーターなど3つの付属品を加えたデラックスプラスは2,699ドル。インクの価格や価格保証の条件も整理されており、購入前の確認に役立つ内容だ。価格はメーカー公式ページで11月13日に確認されたものだ。【背景】E1はAnkerのeufyMakeブランドによる卓上UVプリンターで、2025年のクラウドファンディングでは1万7,822人の支援を集めた。立体感のある印刷が特徴で、ホビーや小規模事業での導入が進んでいる。ブラックフライデーは10月27日から11月10日の早期セールと、11月11日から30日の最終セールに分かれており、最終セールが今年の最安値とされる。【詳細】基本バンドルは通常2,409ドルが1,799ドルに、デラックスプラスは通常3,709ドルが2,699ドルになる。付属品ではロータリーアタッチメントが320ドル、UV DTFラミネーターが320ドル、ロール・トゥ・フィルムが400ドルだ。インクは100mlカートリッジが1本29.99ドルで、インクの定期購入では最大33％の割引がある。メール登録でもらえるクーポンは12月31日まで有効とされる。【ポイント・注意点】価格保証はセール期間内のみで、早期セールで1,999ドルで買った注文を1,799ドルに値下げ調整することはできない。ロール・トゥ・フィルムは製品ページで「近日発売」と表示されたまま販売されており、出荷時期は別途確認が必要だ。E1は衣類への印刷には対応せず、UV DTFで作れるのはステッカーやカップラップなどの硬い素材向けの転写だ。記事はメーカー公式ページとブラックフライデーの案内をもとにまとめられており、価格は11月13日に確認されたものだ。デラックスプラスにはロータリーアタッチメントとUV DTFラミネーター、ロール・トゥ・フィルムが含まれ、カップラップやステッカー作りを始めたい人に向けた構成だ。付属品だけの購入もでき、用途に合わせて選べる。","2026-11-13","DTF Database","https://dtfdatabase.com/blog/eufymake-e1-black-friday-2026-uv-dtf-bundle-prices/"],["eufyMake E1実機レビュー、立体UV印刷で賞のトロフィー作りも","Design WeekがeufyMake E1の実機レビューを公開した。木材やスマホケース、サイコロなどへの立体印刷を試し、AIで作った凹凸マップで油絵の筆致を再現する様子も紹介している。価格は1,599〜2,149ポンドで、インクのにおいや維持費には注意が必要だが、小規模スタジオには手が届く選択肢だという。レビューは2026年11月12日に公開され、実際の使用感が詳しく紹介されている。","\n【概要】Design WeekがeufyMake E1の実機レビューを公開した。木材やスマホケース、サイコロなどへの立体印刷を試し、AIで作った凹凸マップで油絵の筆致を再現する様子も紹介している。価格は1,599〜2,149ポンドで、インクのにおいや維持費には注意が必要だが、小規模スタジオには手が届く選択肢だという。【背景】立体感のあるUV印刷はこれまで高価な業務用機の領域だったが、E1は卓上サイズで個人や小規模スタジオにも届く価格を実現した。レビューを担当したDesign Weekは、実際に賞のトロフィーをE1で作れるか試したところ、木材への印刷の仕上がりが好評で、Design Week Awardsの復活を決めるきっかけになったという。【詳細】E1は330×420mmのベッドに最大5mmまでの立体印刷ができ、専用ソフト「eufyMake Studio」で印刷する。木材は最も扱いやすい素材で、薄い合板に印刷した結果は非常に良いものだった。ボールへの印刷では、直径60mmまでが自動位置合わせの上限で、20mm幅のロゴを鮮明に印刷するには直径52mm以上のボールが必要という計算も紹介されている。回転アタッチメントでは、金属ボトルは専用の下地処理なしでは定着しにくい。【ポイント・注意点】インクのにおいが強く、換気を十分に行う必要がある。プリントヘッドは約549ポンドの消耗品で、8か月程度での交換が見込まれる。A4全面の立体印刷ではインク代が7〜13ポンドかかることもあり、受注価格には維持費を織り込む必要がある。黒いアクリルは熱で反るため、厚みのある素材を選ぶとよい。レビューでは開封から1時間ほどでスマホケースの印刷ができたという。木材への印刷は仕上がりが良く、実際に作った賞の試作品がイベントで好評だったという。ソフトはAIで凹凸マップを作り、油絵の筆致を再現できる。ZBrushなどの3Dソフトで作った深さマップを読み込めば、さらに細かい立体表現も可能だ。回転アタッチメントでは1個ずつ手作業でセットするため、まとまった数の制作には時間がかかる。","2026-11-12","Design Week","https://www.designweek.co.uk/design-review-how-the-eufymake-e1-uv-printer-inspired-the-return-of-the-design-week-awards/"],["PRINTING United 2026報告、UV印刷の高速化と省人化が進む","PRINTING United 2026の展示報告が公開された。CET ColorのUVフラットベッドは毎時2,159平方フィート、AgfaのOnset Pantheraは毎時16,297平方フィートをうたい、VanguardのCumberlandは同社最速の毎時6,588平方フィートを記録。印刷速度だけでなく、仕上げや搬送の自動化で利益を守る動きが目立った。","\n【概要】PRINTING United 2026の展示報告が公開された。CET ColorのUVフラットベッドは毎時2,159平方フィート、AgfaのOnset Pantheraは毎時16,297平方フィートをうたい、VanguardのCumberlandは同社最速の毎時6,588平方フィートを記録した。印刷速度だけでなく、仕上げや搬送の自動化で利益を守る動きが目立った。【背景】印刷業界では物価高と市場の低価格化で利益率が圧迫され、設備投資を先送りする企業が増えている。その中でメーカーは印刷機の高速化だけでなく、仕上げや搬送、ワークフローまで含めた生産システム全体の効率化を訴求した。ラスベガスで開かれたPRINTING United 2026では、高速化と省人化を両立する展示が目立ったという。【詳細】CET ColorのK2-1000は京セラ製ヘッドと磁気リニア駆動で、印刷しない部分のキャリッジ移動を省いて速度を高める。AgfaのOnset Panthera FB3216はLED硬化で従来のUVランプより消費電力を最大60％削減し、ロボットによる搬送にも対応する。CanonとDigiTechのTexas ST2/X1は毎時2,024平方フィートで、媒体の交換は10秒でできるという。EFIはAIによる品質検査システム「InSpec AI」を紹介し、印刷中の不良を自動で検知して修正する。【ポイント・注意点】カタログの速度は売れる出力そのものではなく、仕上げが追いつかなければ利益にはならない点に注意が必要だ。ColDesiの自動転写配置システムは毎時350〜450着を処理し、作業員を6人から1.5人に減らせるとしている。導入を検討する際は、印刷速度だけでなく搬送や仕上げ、ワークフローまで含めた1日の生産量で比べるとよい。報告ではRoland DGのTrueVis MG2シリーズも紹介され、白インクや光沢ニス、立体印刷や5層印刷に1パスで対応するとしている。KornitのAtlas MATRIXは綿やポリエステル、混紡生地に対応し、短納期の需要に応える。","2026-11-09","Big Picture","https://bigpicturemag.com/printing-united-2026-report-improving-margins-and-printing-on-demand/"],["ColDesiがMutoh XpertJet 661UF Proの取り扱い開始、販促品向けに","ColDesiがMutohの新型UVフラットベッドプリンター「XpertJet 661UF Pro」の取り扱い開始を発表した。従来機と比べて印刷速度は約2.1倍、点字印刷は約1.5倍とされる。19×24インチの印刷面積で、厚さ6インチまでの素材に対応。アクリルや木材、革、金属、ガラスへの直接印刷ができる。価格は発表されておらず、ColDesiへの問い合わせが必要だ。導入前には設置スペースや電源、換気の条件も確かめたい。","\n【概要】ColDesiがMutohの新型UVフラットベッドプリンター「XpertJet 661UF Pro」の取り扱い開始を発表した。従来機と比べて印刷速度は約2.1倍、点字印刷は約1.5倍とされる。19×24インチの印刷面積で、厚さ6インチまでの素材に対応し、アクリルや木材、革、金属、ガラスへの直接印刷ができる。【背景】XpertJet 661UF Proは従来の661UFの後継機で、ColDesiの業務用UVプリンターのラインアップに加わった。販促品やパーソナライズ商品の需要が高まる中で、生産速度と品質の両方を高めたモデルとして位置づけられている。AccuFine HD Proヘッドと強化されたスチール・アルミ製の筐体、改良されたUV-LED硬化システムを備える。【詳細】最大印刷面積は約19×24インチで、厚さ6インチ、重さ約17.6ポンドまでの物を載せられる。アクリルや木材、革、金属、ガラスに直接印刷でき、円筒形の物にはオプションのロータリーアタッチメントが使える。用途は販促品や賞状、盾、小判の看板、工業製品へのマーキング、盛り上げ印刷や点字印刷など幅広い。保守部品へのアクセスも見直され、ヘッドやUV-LEDランプの交換がしやすくなったという。ColDesiは米フロリダ州クリアウォーターの企業で、UVプリンターのほかDTFプリンターや刺繍機、ヒートプレス、生産の自動化機器なども扱っている。XpertJet 661UF Proは同社の業務用UVプリンターのラインアップを広げる製品で、販促品や賞状、盾などの小ロット生産に向けたものだ。従来機の買い替えを検討する場合は、速度や保守性の改善点と合わせて、従来機の下取りやサポートの継続条件も確かめておくとよい。【ポイント・注意点】速度の数値はメーカー発表のもので、実際の生産速度は印刷内容や設定によって変わる。価格は発表されておらず、ColDesiへの問い合わせが必要だ。後継機への置き換えに伴い、従来機の在庫やサポートの扱いも確認しておくとよい。業務用機のため、導入前には設置スペースや電源、換気の条件も確かめたい。","2026-11-09","Big Picture","https://bigpicturemag.com/coldesi-adds-mutoh-xpertjet-661uf-pro-uv-flatbed-for-promo-and-personalized-products-2-1x-faster/"]],"risk":[["「できた！」の裏に潜む危険 冬のやけど・おもちゃ事故に注意","3歳未満の子どもが被害に遭った製品事故は、2020年から2024年の5年間で47件あり、その約8割が屋内で起きていたと、製品評価技術基盤機構（NITE）が注意喚起した。冬から春に増える家電の蒸気や熱湯によるやけど、おもちゃによるけがや誤飲が目立つ。できることが増える成長の裏にある危険に、見守りと環境づくりの両面で備えるよう呼びかけている。年末年始の帰省先でも同じ注意が必要だ。","\n【概要】製品評価技術基盤機構（NITE）は、3歳未満の子どもを屋内の事故から守るための注意喚起を発表した。2020年から2024年までの5年間にNITEへ通知された製品事故のうち、3歳未満の子どもが被害に遭った事故は47件で、その約8割にあたる38件が屋内で発生していた。家電の蒸気や熱湯に触れてやけどをする事故と、おもちゃでけがをしたり部品を誤飲したりする事故が目立っている。【背景】3歳未満の子どもは、指で物をつかむ、つかまり立ちをするといった運動機能の発達とともに、できることが急速に増える時期だ。NITEによれば、できることが増えることは成長の証である一方で、子どもが思わぬ被害に遭う場面も増える。事故は冬から春の時期に多い傾向があり、加湿器や電気ケトルなど蒸気や熱湯を扱う家電の使用が増えることや、寒さを避けて屋内で遊ぶ時間が長くなることが影響しているとみられる。また2025年12月25日からは、3歳未満向けの玩具に対する新たな規制も始まる。【詳細】屋内で発生した38件のうち、最も多いのは家電の蒸気や熱湯に触れてやけどをする事故で、保護者がその場にいないときに多く起きていたという。一方、おもちゃによるけがや誤飲の事故は、保護者が見守っていても対処が間に合わないケースがあるとされる。年齢別では、外傷の事故はどの年齢でも起きているが、やけどや窒息・誤飲の事故は、つかまり立ちや一人歩きができるようになる3歳未満の時期に集中する傾向がみられた。東京都のアンケート調査では、誤飲事故やヒヤリ・ハットの経験は3歳未満に集中しており、3歳の子どもの口の直径はおよそ4センチで、ほぼトイレットペーパーの芯と同じ大きさだという。【ポイント・注意点】やけどを防ぐには、やけどのおそれがある製品に子どもを近づけない安全な環境づくりが大切だ。床に置く製品の周囲に柵を設ける、製品を電源コードも含めて高い位置に置く、転倒してもお湯がこぼれにくい製品を選ぶといった対策が有効とされる。おもちゃは遊ぶ前に、まず対象年齢と注意事項を確認し、鋭利な部分や外れやすい部品がないかこまめに点検すること。遊んだ後のおもちゃや部品は、子どもの手の届かない高い位置や鍵のかかる場所に保管する。年上のきょうだいのおもちゃとは分けて保管する配慮も大切だ。年末年始の帰省先など、おでかけ先でも同じ注意を忘れないようにしたい。","2026-11-16","製品評価技術基盤機構（NITE）","https://home.kingsoft.jp/news/pr/prwire/202512150984.html"],["保育施設で園児12人が感染性胃腸炎 ノロウイルスを検出","福岡市は11月13日、早良区の保育施設で園児12人が感染性胃腸炎の集団発生となったと発表した。1歳から5歳までの園児に11月5日から12日にかけて嘔吐や下痢、発熱、腹痛の症状が出た。1人からノロウイルスとアストロウイルスが検出された。重症の園児はおらず、全員が快方に向かっているという。冬に向け、家庭での予防が呼びかけられている。二枚貝の加熱や手洗いの徹底が求められる。","\n【概要】福岡市は11月13日、早良区の保育施設で感染性胃腸炎の集団発生があったと発表した。11月5日から12日にかけて、1歳から5歳までの園児12人に嘔吐、下痢、発熱、腹痛の症状が出た。このうち1人からノロウイルスとアストロウイルスが検出された。重症の園児はおらず、全員が快方に向かっているという。【背景】ノロウイルスなどによる感染性胃腸炎は、秋から冬にかけて流行する季節性の感染症だ。東京都も11月6日に注意喚起を出しており、都内では第36週から第44週までに保育所12件と小学校1件のあわせて13件の集団感染事例が報告されている。全国的にも第44週の平均は定点あたり3.25人で、いずれの都道府県も警報レベルには達していないものの、島根県や群馬県などで高めの値が続いている。【詳細】ノロウイルスとアストロウイルスは、汚染された二枚貝などを生や不十分な加熱で食べることにより感染する。感染した人の便や吐いたものを片づける際に、二次感染することもあるとされる。福岡市は、二枚貝などを調理する際は十分に加熱すること、調理の前、トイレの後、食事の前にはよく手を洗うこと、タオルは清潔なものを使うことを呼びかけている。ノロウイルスの場合、潜伏期間は24時間から48時間で、吐き気や嘔吐、下痢、腹痛などの症状が1日から2日続いたあと治癒することが多いとされる。【ポイント・注意点】感染性胃腸炎の主な原因ウイルスはアルコール消毒の効果が乏しいため、石けんと流水による手洗いが予防の基本になる。特に排便の後や、調理や食事の前にはその都度、十分に手を洗いたい。吐いたものや便を処理する際は、次亜塩素酸ナトリウムを含む塩素系の漂白剤で適切に処理し、使い捨ての手袋やマスク、エプロンを着用することが推奨されている。乳幼児や高齢者では脱水症状を起こすことがあるため、症状が出たときは水分補給に気を配り、ぐったりしているなど気になる様子があれば早めに医療機関に相談したい。また、3歳未満向け玩具の新しい規制が2025年12月25日から始まることも、購入時の目安になる。対象年齢の表示を確認する習慣をつけたい。","2026-11-13","FBS福岡放送","https://news.ntv.co.jp/n/fbs/category/society/fse775a00ecc6a422a9843a0a129acadb8"],["流感ワクチンのはずが新型コロナワクチンに 16人に誤接種","台湾・台東県の大武国中で、流感ワクチンの集団接種の際、16人の生徒に誤って新型コロナワクチンが打たれていたことが分かった。疾管署は、出庫時のダブルチェックなし、接種前の確認なし、接種前の説明なしという少なくとも3つの見落としがあったと指摘した。県は医療費の負担と6か月にわたる健康の追跡を約束し、衛生局などが保護者説明会を開いた。調査報告の提出と再発防止が求められている。","\n【概要】台湾・台東県の大武国中で11月12日、流感ワクチンの集団接種の際、16人の生徒に誤ってモデナ製の新型コロナワクチンが接種されていたことが分かった。衛生単位は翌13日に保護者説明会を開き、疾管署は出庫時のダブルチェック、接種前の確認、接種前の説明という少なくとも3つの見落としがあったと指摘した。県は関連する医療費の負担と6か月にわたる健康の追跡を約束した。【背景】大武郷の衛生所が大武国中で流感ワクチンの集団接種を実施した際、接種を予定していた23人のうち、8年生と9年生の16人に誤ってモデナ製の新型コロナワクチンが打たれた。誤って打たれたワクチンは12歳以上が対象の単回接種型で、16人はいずれも12歳以上だったため年齢の条件は満たしていたが、国中生の公費接種の対象ではなかった。衛生所は誤りに気づいたあと直ちに作業を止め、ワクチンの種類を確認したうえで、残りの生徒には流感ワクチンで接種を終えた。【詳細】疾管署の報道官は、見落としとして3点を挙げた。第1に、ワクチンを出庫する際に2人での確認が行われていなかったこと。第2に、接種前に薬の名前などを確認する手順が守られていなかったこと。第3に、接種前に生徒へワクチンの名前を示して説明していなかったことだ。2つのワクチンが混ざって置かれていたのか、持ち出しを間違えたのかなど、詳しい経緯は衛生所の調査報告を待つ必要があるとしている。衛生局などは13日午後4時に保護者説明会を開き、経緯の説明と謝罪を行った。【ポイント・注意点】誤接種を受けた16人のうち、接種後に体調不良で欠席した生徒が1人いたが、ほかの生徒に発熱や腫れなどの症状はみられなかったという。県は医療費を負担し、6か月にわたって健康状態を追跡する。流感ワクチンの追加接種は、およそ1か月後に衛生所が手配する見込みだ。今回の事例は、ワクチンの種類が多い集団接種の現場では、出庫から接種までの各段階での確認が欠かせないことを示している。保護者としては、接種の前に子ども自身がワクチンの名前を確認できるよう、日ごろから声かけをしておくことも大切だ。","2026-11-13","聯合新聞網","https://udn.com/news/story/7266/9877526"],["秋田でインフルエンザ注意報レベル超 子ども中心に拡大","秋田県でインフルエンザの感染拡大が続いている。11月8日までの1週間に県内25の定点医療機関から報告された患者数は414人で、前の週の1.1倍に増え、1医療機関あたり16.56人と2週連続で注意報レベルの10人を上回った。集団発生は6か所の教育・保育施設から新たに報告され、今シーズン累計で48施設にのぼる。県は手洗いや換気などを呼びかけている。今後の流行の広がりにも注意が必要だ。","\n【概要】秋田県でインフルエンザの感染拡大が続いている。11月8日までの1週間に県内25の定点医療機関から報告されたインフルエンザの患者数は414人で、前の週から1.1倍に増えた。1医療機関あたり16.56人となり、2週連続で注意報レベルの10人を上回った。子ども世代を中心に感染が広がっており、県は感染対策を心がけるよう呼びかけている。【背景】今シーズンのインフルエンザは例年より早い時期から流行が始まっている。北海道でも9月から流行が始まり、札幌市では調査開始以来2番目の速さで注意報が発令された。全国的にも第45週の全国平均は定点あたり11.00人で3週連続の増加となり、33道県で患者が増えている。秋田県では集団発生が新たに6か所の教育・保育施設から報告され、今シーズン累計で48施設に達し、このうち教育・保育施設が35施設を占めている。【詳細】11月5日までの1週間には、小学校を中心に延べ23校で学年閉鎖や学級閉鎖の措置がとられた。子ども世代を中心に感染が広がっており、今後さらに流行が拡大する可能性があるとみられている。秋田県の1医療機関あたり16.56人という値は、注意報レベルの10人を大きく上回る水準だ。県は、こまめな手洗いや換気、マスクの着用など、感染対策を心がけるよう呼びかけている。【ポイント・注意点】インフルエンザの流行期には、熱やのどの痛みがある日は学校や仕事を休み、乳幼児や高齢の家族とは部屋を分けることが基本になる。帰宅時の手洗いや室内の換気を続け、十分な睡眠と休養をとることも大切だ。予防接種を検討している人は早めの接種がすすめられる。子どもの熱が続く、呼吸が苦しそう、水分がとれないといった様子がみられるときは、早めにかかりつけ医に相談したい。学級閉鎖などの情報は学校からの連絡を確認し、家庭内での感染の広がりを防ぐ工夫を心がけたい。県内では今シーズン累計48施設で集団発生が報告され、うち教育・保育施設が35施設を占める。園や学校での感染が広がりやすい時期のため、家庭と園・学校が情報を共有し、体調の変化に早く気づくことが大切だ。","2026-11-12","日テレNEWS NNN（秋田放送）","https://news.ntv.co.jp/category/society/ab48a8011377964e4eb412055f38a29418"],["北海道でインフル流行加速 小児ドライブスルー発熱外来を開設","北海道でインフルエンザの感染者が増え続けている。今シーズンは9月から流行が始まり、例年より早い展開となっている。札幌市は小児科の休日当番の受診者が多くなることから、11月15日から臨時の小児ドライブスルー発熱外来を開設した。この時期の設置は過去最速だという。道内では9つの保健所管内で警報、14の保健所管内で注意報レベルに達している。ピークがいつ来るかはまだ読めない状況だ。","\n【概要】北海道でインフルエンザの感染者が増え続けている。今シーズンは9月から流行が始まり、例年より早い展開となっている。札幌市は小児科の休日当番の受診者が多くなることから、11月15日から臨時の小児ドライブスルー発熱外来を開設することを決めた。この時期の設置は過去最速だという。北海道全体では、名寄市や江別市など9つの保健所管内で警報、札幌市など14の保健所管内で注意報レベルに達している。【背景】札幌市内のクリニックでは、11月11日の朝から診察開始と同時に続々と患者が訪れていた。ある幼稚園ではクラスの8人がインフルエンザに感染し、学級閉鎖になる幼稚園も出ている。円山ため小児科の多米淳院長は、今年の特徴として9月から流行が始まったことを挙げ、例年より早く始まったのが特徴だと話している。9月から流行が始まり、札幌市では調査開始以来2番目の速さで注意報が発令された。【詳細】1歳2か月の子どもが、兄の幼稚園での学級閉鎖をきっかけに感染した例も伝えられている。受診した兄弟のうち、弟にインフルエンザA型の反応が出て、兄はまだ反応が出ていない段階だったが、一緒に住んでいることから2人とも治療する方針がとられた。院長は、今後について「まだピークとは言えない」とし、感染のピークがこれから来る可能性もあるし、このままだんだん落ち着く可能性もあると話している。今流行しているインフルエンザA型に代わり、年末年始にかけてはB型の流行が始まるとのことだ。【ポイント・注意点】流行のピークがまだ読めない時期だからこそ、基本的な感染対策を続けることが大切だ。手洗いや換気、マスクの着用を心がけ、熱が出たときは無理をせず休む。子どもの発熱時には、車から降りずに受診できるドライブスルー外来のような仕組みも活用できる。休日の受診先が混み合う時期なので、かかりつけ医の診療時間や休日当番の情報をあらかじめ確認しておくと安心だ。兄弟の一人が感染した場合は、家庭内でもう一人にうつる可能性を考え、部屋やタオルを分けるなどの工夫をしたい。","2026-11-12","FNNプライムオンライン","https://www.fnn.jp/articles/-/1151486"],["登校中の女子児童が車にはねられ軽傷 長野・上田市","長野県上田市で11月12日朝、登校中とみられる小学生の女子児童が車にはねられ、病院に運ばれた。現場は横断歩道と信号機のある交差点で、午前7時40分ごろに通りかかった人から通報があった。女の子は顔にけがをしたが、搬送される際に意識はしっかりしており、軽傷とみられるという。警察が事故の原因などを調べている。信号のある交差点でも油断はできず、通学時間帯の安全確保が改めて問われている。","\n【概要】長野県上田市で11月12日朝、登校中とみられる小学生の女子児童が車にはねられ、病院に運ばれた。現場は上田市諏訪形の横断歩道と信号機のある交差点で、午前7時40分ごろ、通りかかった人から「車と歩行者がぶつかった」と通報があった。女の子は顔にけがをして市内の病院に運ばれたが、搬送される際に意識はしっかりしており、軽傷とみられるという。【背景】登下校の時間帯は、子どもと車の事故が起きやすい時間帯だ。同じ11月には、鹿児島市で登校中の小学2年生の男の子が右折してきた乗用車にはねられる事故や、大分市で登校中の15歳の学生がダンプカーと衝突して亡くなる事故も起きている。信号機のある交差点でも、右折する車と横断歩道を渡る子どもがぶつかる事故が繰り返されており、通学路の安全が改めて問われている。【詳細】上田市の事故では、女の子は登校中だったとみられ、警察が事故の原因などを調べている。現場は横断歩道と信号機のある交差点で、朝の通学時間帯にあたる午前7時40分ごろの出来事だった。女の子は顔にけがを負ったが、意識ははっきりしており、命に別状はないとみられる。事故の詳しい状況については、警察の調査が進められている。【ポイント・注意点】信号機のある横断歩道でも、車が右折や左折で曲がってくる際には子どもが見えにくくなることがある。登校時は、青信号でも左右を確認し、曲がってくる車がないか確かめてから渡る習慣を子どもと一緒に身につけたい。運転する側も、交差点では横断歩道の歩行者を最優先にし、特に通学時間帯は十分に速度を落として注意することが大切だ。通学路の危険な場所については、学校や地域の見守り活動と情報を共有し、子ども自身が「危ない場所」を知っておくことも事故防止につながる。なお、同じ11月には鹿児島市で登校中の小学2年生が右折車にはねられる事故も起きており、信号のある交差点でも右折車には十分な注意が必要だ。通学路の危険箇所は、保護者と学校、地域で情報を共有し、子ども自身にも伝えておきたい。登下校の安全は、家庭と学校、地域の見守りで支えたい。","2026-11-12","TBS NEWS DIG","https://newsdig.tbs.co.jp/articles/-/3079878?display=1"],["8歳男児が実験用の「魔術水」を誤飲 強アルカリに注意","台湾・新竹の8歳の男の子が、科学の実験で使う「神奇魔術水」を飲み物と間違えて飲み、病院に運ばれた。溶液には水酸化ナトリウムが含まれ、食道や胃を腐食させるおそれがあったが、胃カメラの検査では損傷はみつからず、男の子は無事に帰宅した。医師は、誤って飲んだときは吐かせず、酢などで中和せず、大量の水を飲ませず、すぐに受診するよう呼びかけている。実験の溶液は飲料用の容器に入れないことが大切だ。","\n【概要】台湾・新竹の8歳の男の子が、科学の実験で使う「神奇魔術水」を飲み物と間違えて飲み、病院に運ばれた。溶液には水酸化ナトリウムが含まれ、食道や胃を腐食させるおそれがあったが、胃カメラの検査では損傷はみつからず、男の子は観察のあと無事に帰宅した。医師は、強アルカリのものを誤って飲んだときの対処法として「3つのしてはいけないこと」を呼びかけている。【背景】男の子が誤って飲んだ「神奇魔術水」は、科学の授業でよく使われる「青い瓶の実験」の溶液だ。メチレンブルー、ブドウ糖、水酸化ナトリウムで作られ、瓶を振ると無色から青色に変わり、置いておくと再び無色に戻る。色が変わる様子が面白く、子どもの好奇心を引きやすい。だが、見た目は飲み物のように見えても、中には強い腐食性のあるアルカリが含まれている。【詳細】水酸化ナトリウムは強い腐食性があり、誤って飲むと口やのど、食道、胃の粘膜を傷つけるおそれがある。強いアルカリは組織の深いところまで侵食し、重い場合は食道に穴が開いたり、傷が治ったあとに食道が狭くなって飲み込みにくくなったりすることもある。口の中に目立ったやけどがなくても、食道や胃に損傷がある場合があるため、見た目や初期の症状だけでは判断できないという。今回、男の子は新竹台大分院新竹医院で胃カメラの検査を受け、消化管の粘膜に腐食性の損傷がないことが確認された。【ポイント・注意点】医師が呼びかける「3つのしてはいけないこと」は、吐かせないこと、酢や酸性の飲み物で中和しないこと、大量の水を無理に飲ませないことだ。吐くと腐食性の物質がもう一度食道を通って二重の損傷を招き、中和反応の熱がやけどを悪化させるおそれがある。誤って飲んだことに気づいたら、すぐに口に含むのをやめさせ、元の容器や成分の情報をもって速やかに受診する。科学の実験で使う溶液は飲料用の瓶やコップに入れず、使い終わったらすぐに片づける。家庭の洗剤や排水管洗浄剤なども強酸や強アルカリを含むことがあるため、元の容器のまま子どもの手の届かない場所に置くことが大切だ。","2026-11-11","聯合新聞網","https://udn.com/news/story/7266/9871236"],["大人には熱くなくても子どもには重傷に 熱湯・即席麺に注意","台湾・台北栄民総医院が「2026児童やけど防止週間」を始め、子どものやけど予防と応急手当を呼びかけた。子どもの皮膚は薄く、面積も小さいため、大人が軽いと感じるやけどでも、子どもにとっては重い、時には命に関わるけがになる。秋から冬は熱湯や熱いお茶、即席麺、風呂の熱い湯によるやけどのリスクが高まる時期で、家庭での注意が呼びかけられている。家庭では熱いものを子どもの手の届かない場所に置くことが大切だ。","\n【概要】台湾・台北栄民総医院が、児童やけど防止週間を始め、子どものやけど予防と応急手当の大切さを呼びかけた。活動は11月10日から13日までの5日間で、児童やけど基金会との共催は4年目になる。子どもの皮膚は薄く、面積も小さいため、大人が軽いと感じるやけどでも、子どもにとっては重い、時には命に関わるけがになるという。秋から冬にかけて、熱湯や熱いお茶、即席麺、風呂の熱い湯によるやけどのリスクが高まる。【背景】台北栄民総医院のやけどセンターの医師によれば、子どものやけどの治療では、体の傷だけでなく心の傷の回復にも長い付き添いが必要になる。児童やけど基金会は30年以上にわたりやけど防止の教育に取り組んできており、やけどの応急手当の合言葉「冲・脱・泡・盖・送」は広く知られるようになった。それでも家庭の中には、熱湯や熱いお茶、即席麺、風呂の熱い湯など、うっかりすると大けがにつながる危険が潜んでいるという。【詳細】防止週間の会場では、「やけど魔をやっつける九マス」などのゲームや、家庭の場面を再現した体験コーナーが設けられ、子どもと保護者が遊びながら危険な場所を見分ける力を育てる内容になっている。やけどの応急手当として、水で冷やす、服を脱がせる、水につける、清潔な布で覆う、病院へ運ぶという5つの手順が紹介された。活動には病院の副院長や台北市消防局の幹部、基金会の副理事長らも参加し、予防が治療に勝るという考えを広めることが呼びかけられた。【ポイント・注意点】秋から冬は、熱いスープやお茶、即席麺を食卓に置く機会が増え、風呂の湯も熱くなりがちだ。熱いものを子どもの手の届く場所に置かない、食卓では熱い容器をテーブルの端に置かない、風呂の湯温を確認してから子どもを入れるといった習慣が大切になる。やけどをしてしまったら、まず流水で冷やし、服がくっついている場合は無理にはがさず、清潔な布で覆って速やかに受診する。やけどの範囲が広い、顔や手、関節にかかるなどの場合は、迷わず医療機関へ連絡したい。防止週間は11月10日から13日までの5日間で、会場ではゲームや体験コーナーを通じて、子どもと保護者が危険な場所を見分ける力を育てる内容になった。","2026-11-10","聯合新聞網","https://udn.com/news/story/7266/9869100"],["埼玉でインフル再び増加 RSウイルス・百日咳も高水準","埼玉県の2026年第44週の感染症のまとめによると、インフルエンザは医療機関1か所あたり14.22人で3週ぶりに増加した。14歳以下が報告の63.0パーセントを占める。RSウイルス感染症は1歳を中心に過去3年の同じ週を上回り、ヘルパンギーナも高めで、百日咳の届出は直近4週で前の4週の1.94倍になった。子どもと乳児のいる家庭での注意が呼びかけられている。小児救急電話相談の活用も呼びかけられている。","\n【概要】埼玉県の2026年第44週（10月26日から11月1日）の感染症のまとめによると、インフルエンザは医療機関1か所あたり14.22人で、3週ぶりに増加した。報告の63.0パーセントが14歳以下で、学校に通う年代が中心となっている。RSウイルス感染症とヘルパンギーナは過去3年の同じ週を上回る水準が続き、百日咳の届出も直近4週で前の4週の1.94倍に増えた。【背景】埼玉県では第44週に、定点把握の16疾患と届出の17疾患のうち6つが注意が必要な状態とされた。インフルエンザは注意報の基準である10人を第38週から7週連続で上回っている。RSウイルス感染症は第41週の1.85人を山に3週続けて減っているものの、過去3年の同じ週の中央値の4.1倍にあたる。ヘルパンギーナは例年は夏に多い病気だが、今年は10月に入ってからも前年を上回る報告が続いている。【詳細】インフルエンザの報告は2,503例で、5歳から9歳が698例、10歳から14歳が471例だった。地域別では鴻巣保健所が31.92人、幸手保健所が28.22人と、県全体の値の2倍前後になった。RSウイルス感染症は114例のうち51例が1歳で、生後6か月までの赤ちゃんも5例いた。ヘルパンギーナは108例のうち25例が1歳だった。百日咳は今週11例で、直近4週では33例となり、前の4週の17例の1.94倍になった。急性脳炎の届出も直近4週で21例となり、前の4週の7例の3.0倍になった。【ポイント・注意点】RSウイルス感染症では、息をするたびに胸がへこむ、ゼーゼーする、ミルクや水分が飲めないときは早めに医療機関に相談したい。ヘルパンギーナでは、口の痛みで水分がとれない、おしっこが少ない、ぐったりしているときが受診の目安になる。百日咳は生後6か月ごろまでの赤ちゃんがかかると重くなりやすいため、母子健康手帳で5種混合ワクチンの接種が予定どおり進んでいるか確かめておきたい。熱のある子どもがけいれんを起こした、呼びかけへの反応が鈍いといった様子があれば、様子を見ずにすぐ医療機関へ連絡すること。夜間や休日に迷うときは小児救急電話相談のシャープ8000も使える。","2026-11-10","池袋東口まめクリニック","https://beans-mc.jp/saitama-epidinfo-2026-w44/"],["東京が感染性胃腸炎に注意喚起 保育所などで集団感染13件","東京都は11月6日、冬に集団感染が増えるノロウイルスなどの感染性胃腸炎について注意喚起を出した。都内の小児科定点からの第44週の報告は定点あたり3.68人で、警報レベルには達していない。ただ第36週から第44週までに保育所12件と小学校1件のあわせて13件の集団感染が報告されており、これからの季節に増える傾向があるため予防の徹底が呼びかけられている。石けんと流水による手洗いが予防の基本になる。","\n【概要】東京都は2026年11月6日、冬季に集団感染が多発するノロウイルスなどの感染性胃腸炎について注意喚起した。現時点では警報レベルには達していないが、例年これからの季節に増える傾向にあるため、予防の徹底を呼びかけている。都内264か所の小児科定点医療機関から寄せられた第44週の定点あたり患者報告数は3.68人だった。【背景】感染性胃腸炎は、おもにウイルスなどの病原体を原因とする胃腸炎の総称で、原因となるウイルスにはノロウイルス、ロタウイルス、サポウイルス、アデノウイルスなどがある。ノロウイルスの場合、潜伏期間は24時間から48時間で、吐き気や嘔吐、下痢、腹痛などの症状が1日から2日続いたあと治癒する。乳幼児や高齢者では脱水症状を起こすことがあるため注意が必要になる。都内では第36週から第44週までに保育所12件、小学校1件のあわせて13件の集団感染事例が報告されている。【詳細】全国的な感染状況をみると、第44週の全国平均は定点あたり3.25人で、いずれの都道府県も警報レベルには達していないものの、島根県6.09人、群馬県5.92人、大分県5.69人、石川県5.61人、宮崎県5.14人などが高い状況にある。感染性胃腸炎の警報レベルの開始基準値は定点あたり20人で、基準値を超えた保健所の管内人口の合計が都の人口全体の30パーセントを超えた場合に、広域的な流行として警報が出される。【ポイント・注意点】感染性胃腸炎の主な原因となるウイルスは、アルコール消毒の効果が乏しいため、石けんと流水で手を洗うことが予防の基本になる。特に排便の後や、調理や食事の前にはその都度、十分に手を洗いたい。吐いたものや便を処理する際は、次亜塩素酸ナトリウムを含む塩素系の漂白剤で適切に処理し、使い捨ての手袋やマスク、エプロンを着用することが推奨されている。冬の受験シーズンに向けては、エチケット袋や塩素系漂白剤などの必需品を備えておくと安心だ。症状が出たときは水分補給に気を配り、脱水の兆しがあれば早めに医療機関に相談したい。","2026-11-10","リセマム","https://resemom.jp/article/2026/11/10/88253.html"]],"dev":[["妊娠中のビタミンDと幼児の運動能力 わずかな関連を確認","妊娠中期の母親のビタミンD濃度が高いほど、3歳から5歳の子どもの運動能力がわずかに高い傾向がみられたとする研究が、カナダのコホート調査から報告された。252組の母子を調べたもので、認知や言語、行動との関連はみられなかった。関連は統計的な補正をすると有意ではなくなり、結果は慎重に受け止める必要があると研究者は述べている。結果は慎重に受け止める必要があると研究者は述べている。","\n【概要】妊娠中期の母親の血中ビタミンD濃度が高いほど、3歳から5歳の子どもの運動能力がわずかに高い傾向がみられたとする研究が報告された。カナダのアルバータ州で行われたコホート調査で、252組の母子を分析したものだ。ただしこの関連は、複数の項目を比べたことによる統計的な補正をすると有意ではなくなり、認知や言語、行動の発達との関連はみられなかった。【背景】胎児の脳は妊娠中に急速に発達し、神経の働きを支える仕組みづくりには母親の体内の栄養環境が大きく関わる。胎児は自分でビタミンDを作ることができないため、妊娠中のビタミンDはすべて母親の血液からまかなわれる。母親の濃度が低いと、胎盤を通じた供給が弱まり、発達の大切な時期の神経の働きに影響するのではないかと考えられてきた。これまでの観察研究では結論が分かれており、今回の研究は複数の発達領域と遺伝子の働きの指標をあわせて調べた点が特徴だ。【詳細】研究では、2009年から2012年に妊娠27週より前に登録した252組の母子を対象に、妊娠中期の血液からビタミンDの代謝物を測定した。子どもが平均4.3歳になった時点で、知能、言語、運動能力、行動について標準化された検査を行った。その結果、母親のビタミンD濃度が高いほど、運動能力の総合スコアがわずかに高い関連がみられ、補正前の有意確率は0.03だった。しかし、複数の項目を比べたことによる補正をすると有意ではなくなり、偶然の可能性も残る。知能と言語、行動との関連はみられず、乳児期の遺伝子の働きの指標がこの関連を説明することもなかった。【ポイント・注意点】この研究の参加者は、ヨーロッパ系で経済的に安定した家庭が中心で、ビタミンDが本当に不足している母親が少なかったため、重い不足の影響までは調べられていない。肌の色が濃く、日光からのビタミンD合成が抑えられやすい人たちへのあてはまりも限られる。妊娠中のビタミンDが運動能力をわずかに支える可能性は示されたものの、確かな効果とはいえず、サプリメントの摂取をすすめる根拠にはならない。妊娠中の栄養については、かかりつけ医と相談しながらバランスのよい食事を心がけることが大切だ。","2026-11-14","scienmag","https://scienmag.com/maternal-vitamin-d-weakly-links-to-preschool-motor-skills-in-cohort-study/"],["母親の「境界のあいまいさ」が子どもの抑うつと関連","母親が自分と子どもの境界をあいまいにとらえる傾向が強いほど、子どもの抑うつ傾向が高まることが、2つの調査から示された。母親の心理的なコントロールがその間に入るという。274組の母子へのアンケートと46組の母子による実験を組み合わせた研究で、学術誌に掲載された。家族への支援に新たな視点を与える結果として注目されている。家族への支援に新たな視点を与える結果として注目されている。","\n【概要】母親が自分と子どもの境界をあいまいにとらえる傾向が強いほど、子どもの抑うつ傾向が高まることが、2つの調査から示された。母親の心理的なコントロールがその間に入るという。274組の母子へのアンケート調査と、46組の母子による認知・行動の実験を組み合わせた研究で、学術誌ヒューマニティーズ・アンド・ソーシャル・サイエンシズ・コミュニケーションズに掲載された。【背景】母親は子どもの心の健康に大きな役割を果たし、母親の考え方や感情、行動の傾向が子どもの発達に影響することは知られている。ただ、母親の自己像そのものが子どもの心の健康とどう結びつくのかは、はっきりしていなかった。今回の研究は、母親の自己境界のあいまいさ、つまり自分と子どもの間の心理的な境界が過度にゆるい状態に注目し、それが子どもの心の健康とどう関連するのかを調べた。【詳細】研究は2つの調査で構成された。調査1では274組の母子にアンケートを行い、調査2では46組の母子を対象に認知・行動の実験を行った。その結果、母親の自己境界のあいまいさは、若者の抑うつ傾向と正の関連があり、その関係は母親の心理的コントロールを介していることが示された。心理的コントロールとは、子どもの気持ちや考えを母親の思いどおりに動かそうとする関わり方を指す。境界があいまいな母親ほど心理的コントロールが強くなり、それが子どもの抑うつ傾向につながるという流れがみられた。【ポイント・注意点】この結果は、母親の自己像と子どもの心の健康の関連を示すもので、家族への支援に新たな視点を与えるものだ。ただ、関連を示した研究であり、境界のあいまいさが直接の原因だと断定できるものではない。支援の現場では、母親を責めるのではなく、母親自身の気持ちや境界のあり方に目を向けることが大切になる。子どもが自分の気持ちを大切にできるよう、家族の中でそれぞれの気持ちを尊重する関わりを意識したい。気になる様子が続くときは、学校の相談窓口や専門機関に相談することも考えたい。研究は2つの調査を組み合わせたもので、母親の自己像と子どもの心の健康の結びつきを、家族への支援に生かす視点が示された。","2026-11-14","scienmag","https://scienmag.com/mothers-self-boundary-blurring-linked-to-youth-depression-via-psychological-control/"],["遠隔で乳児の発達を評価 対面と同等の信頼性を確認","自宅からビデオ通話で行う乳児の発達評価ツール「TEDI」が、対面での標準的な評価と同じくらい信頼できることが、カリフォルニア大学デービス校の研究で示された。111人の乳児を対象に、対面評価と遠隔評価を1か月以内に両方行って比べた。自閉症やADHDの可能性が高い乳児の早期発見に役立つと期待され、地方や支援の届きにくい地域での活用が見込まれている。地方や支援の届きにくい地域での活用が見込まれている。","\n【概要】自宅からビデオ通話で行う乳児の発達評価ツール「TEDI」が、対面での標準的な評価と同じくらい信頼できることが、カリフォルニア大学デービス校の研究で示された。TEDIは遠隔による乳児発達評価の仕組みで、研究成果は小児・青年臨床心理学の学術誌に掲載された。自閉症やADHDの可能性が高い乳児の早期発見に役立つと期待されている。【背景】新型コロナの流行期には、多くの研究者が子どもの発達評価を遠隔に切り替えた。だが、家庭で集めたデータと研究室で集めたデータを同じ子どもたちで比べた研究はほとんどなかった。今回の研究は、その空白を埋めるものだ。TEDIは、診断がつく前の乳児期に着目している点が特徴で、自閉症のきょうだいがいるなど、発達の違いが出やすい乳児の変化をとらえるために作られた。【詳細】研究では111人の乳児を対象とした。内訳は、自閉症の家族歴がある乳児が33人、ADHDの家族歴がある乳児が51人、どちらもない乳児が27人だった。それぞれの乳児は、対面での研究室での評価と、遠隔でのTEDIを1か月以内に両方受けた。評価は生後6か月か9か月、12か月、18か月のいずれかの時期に行われた。TEDIは60分の評価で、家庭には小さなおもちゃのセットが渡され、検査員がビデオ通話で保護者に声をかけながら、いないいないばあやシャボン玉、歌遊びなどを通じて発達をみた。言葉の理解や伝え方、遊び、問題解決、自閉症やADHDに関連する行動などが評価された。【ポイント・注意点】対面と遠隔の評価では、スコアが広く一致し、遠隔でも有効で信頼できるデータが得られることが示された。多くの家庭が、赤ちゃんは研究室よりも自宅のほうがいつもの様子でいられると話し、遠隔の便利さも好評だった。研究チームは現在、スペイン語を話す家庭向けのTEDIも試しており、遠隔評価と保護者への助言を組み合わせる研究も始めている。地方や支援の届きにくい地域でも、早期に発達をみて、必要な支援につなげる手がかりになると期待されている。","2026-11-13","UC Davis Health","https://health.ucdavis.edu/surgical-services/news/headlines/telehealth-tool-to-assess-infant-development-reliable-when-compared-to-gold-standard-in-person-methods-/2026/11"],["地域の貧困度と就学準備の差 英国58万人の分析","イングランドの5歳児58万9471人のデータを分析したところ、地域の貧困度が低いほど就学準備の基準を満たす子どもの割合が高いことが分かった。貧困度が1段階下がるごとに基準達成率は2.30ポイント上がった。男女差や無料給食の対象による差も大きく、地域による資源配分の見直しにつながる結果として注目されている。地域による資源配分の見直しにつながる結果として注目されている。","\n【概要】イングランドの5歳児58万9471人のデータを分析したところ、地域の貧困度が低いほど、就学準備の基準を満たす子どもの割合が高いことが分かった。2024年度から25年度の公式記録を使った分析で、貧困度が1段階下がるごとに、基準を満たす割合は2.30ポイント上がった。研究は心理学の学術誌フロンティアーズ・イン・サイコロジーに掲載された。【背景】就学準備は、子どもが小学校に入る前に身につけておくことが期待される力の目安で、イングランドでは5歳の終わりに教員が17の学習目標をもとに評価する。2024年度から25年度の記録では、全体の68.3パーセントが「良い発達水準」とされる基準を満たした。地域や家庭の条件によって子どもの機会がどう違うのかを、行政データから確かめることが研究の目的だった。【詳細】分析では、自治体や貧困度、性別で分けた5,525の集団を使い、重み付きの回帰分析を行った。貧困度が1段階下がるごとに、基準を満たす割合は2.30ポイント上がった。男女の差も大きく、女の子は75.31パーセント、男の子は61.60パーセントで、13.71ポイントの差があった。無料給食の対象の子どもは51.26パーセントで、対象外の72.52パーセントより21.26ポイント低かった。特別な教育支援を受けている子どもは26.36パーセントにとどまり、支援の必要がない子どもとの差は50.14ポイントにのぼった。秋生まれは75.58パーセント、夏生まれは61.14パーセントと、生まれた月による差も大きかった。【ポイント・注意点】研究者は、この結果は地域全体の傾向を示すもので、個々の子どもの能力や家庭の事情を直接測ったものではないと強調している。貧困度は地域の所得の集中度を表す指標で、家庭の収入や家庭での学び、保育の質そのものを示すものではない。教員による評価も、教室での様子をもとにしたものであり、子どもの能力を診断するものではない。結果は、支援を一部の層だけでなく、社会全体の段階に応じて配分することや、言葉の力を育てる取り組みを広げることの大切さを示している。地域の実情に合わせた支援の見直しが求められる。","2026-11-13","scienmag","https://scienmag.com/lower-area-deprivation-correlates-with-higher-early-school-readiness-across-england/"],["AIに「子ども時代」を与えると 言葉の学び方が見えてきた","プリンストン大学の研究チームが、子どもの日常生活の音声をもとにAIに言葉を学ばせたところ、睡眠中のような「ふり返り」を加えることで、2歳までに数千語を覚えるようになった。研究は学術誌サイエンスに掲載された。15家庭で生後から3歳ごろまでの日常を記録した「1000日プロジェクト」のデータを使い、子どもが言葉を覚える仕組みの解明に新たな道を開く成果として注目されている。子どもが言葉を覚える仕組みの解明に新たな道を開く成果として注目されている。","\n【概要】プリンストン大学の研究チームが、子どもの日常生活の音声をもとにAIに言葉を学ばせたところ、睡眠中のような「ふり返り」を加えることで、2歳までに数千語を覚えるようになった。研究は学術誌サイエンスに掲載された。15家庭で生後から3歳ごろまでの日常をカメラとマイクで記録した「1000日プロジェクト」のデータを使い、子どもが言葉を覚える仕組みの解明に新たな道を開く成果として注目されている。【背景】赤ちゃんは生まれたときには言葉を一つも理解できないが、数年のうちに数千の言葉を覚え、複雑な文を理解し、自分の考えを伝えられるようになる。子どもは文法を勉強するわけでもなく、インターネットの膨大な文章を読むわけでもない。家族の声や朝食の会話、遊び、寝る前の絵本といった身近な世界から言葉を学ぶ。子どもがどうやって言葉を覚えるのかは、長く議論されてきたが、子どもが実際に何を聞いて育つのかをほぼ完全に記録したデータはこれまでなかった。【詳細】研究チームは、8人の子どもについて、それぞれの日常の音声をそのまま与えた言語学習モデルを作った。モデルは最初は何も知らず、音の区切りも単語の区切りも分からず、文字を見せられることもなかった。まず一人の子ども「コーラル」で試したところ、毎日の音声を聞かせるだけではほとんど覚えられず、2歳相当の時点で覚えた単語はゼロだった。そこで、睡眠中に脳がその日の体験をふり返る仕組みにならい、モデルの一日の終わりに、最近聞いた音声の一部をふり返らせるようにした。すると学習が一気に進み、2歳相当の時点で数千語を覚えた。同じ方法で残り7人の子どものモデルも、英語の音と数千語の語彙を身につけた。【ポイント・注意点】子どもによって言葉の発達の速さは大きく違い、1歳の誕生日より前に多くの語彙を話す子もいれば、同じ段階に達するのが1年近く遅い子もいる。研究チームは、ふり返りの量や学ぶ速さ、単語を学び始める時期の3つを子どもごとに変えることで、それぞれの子どもの発達のタイミングを再現できた。このモデルは子どもそのものではなく、体もなく、言葉の意味もまだ分かっていない。だが、言葉の学び方を「作って確かめる」という新しい研究の道を開くもので、子どもの発達の理解や、発達の支援につながる可能性が期待されている。","2026-11-13","Medical Xpress","https://medicalxpress.com/news/2026-11-ai-childhood-insights-language.html"],["算数が苦手な子の脳には違いが 戦略の切り替えに課題","算数がどうしても苦手な子どもは、解き方の戦略を切り替えるのが苦手で、その背景に脳の働きの違いがあることが、スタンフォード大学の研究で分かった。8歳から10歳の子ども68人を調べたもので、学術誌に掲載された。計算そのものだけでなく、問題に合わせて解き方を選ぶ力の違いが、算数のつまずきに関わっている可能性を示している。算数のつまずきに関わっている可能性を示している。","\n【概要】算数がどうしても苦手な子どもは、解き方の戦略を切り替えるのが苦手で、その背景に脳の働きの違いがあることが、スタンフォード大学の研究で分かった。8歳から10歳の子ども68人を調べたもので、学術誌ジャーナル・オブ・ニューロサイエンスに掲載された。計算そのものだけでなく、問題に合わせて解き方を選ぶ力の違いが、算数のつまずきに関わっている可能性を示している。【背景】算数の問題を解くには、数を知っていることや計算のやり方を覚えていることだけでなく、どの解き方がうまくいくかを選ぶ力も必要になる。例えば、一つずつ数える方法と、知っている関係を使った効率のよい方法とでは、問題の難しさによって適した方法が変わる。発達性算数障害と呼ばれる、算数の問題解決に持続的な困難がある子どもは、練習や指導を受けてもつまずきが続くことがある。なぜ困難が続くのか、その考え方の仕組みは十分に分かっていなかった。【詳細】研究チームは、発達性算数障害のある子どもと、そうでない子どもを比べ、算数の問題にどう取り組むか、さまざまな戦略をどれだけうまく使えるか、脳の活動と成績がどう関係するかを調べた。その結果、算数障害のある子どもは、ほかの子どもに比べてさまざまな戦略をうまく使えず、ある方法から別の方法へ切り替えるのに時間がかかり、問題の難しさが変わっても対応が遅れることが分かった。また、ほかの子どもは時間とともに適切な戦略を選ぶのが上手になったが、算数障害のある子どもには同じ上達がみられなかった。脳の活動にも違いがあり、その活動のパターンから、数え方のうまさや戦略の切り替えのうまさを予測できたという。【ポイント・注意点】この研究は、算数の困難には計算の力だけでなく、注意や記憶、考え方を柔軟に変える力といった、算数以外の心の働きも関わっている可能性を示している。ただ、脳の活動の違いが困難の直接の原因だと示されたわけではなく、関連を示す証拠にとどまる。算数のつまずきは一つの原因だけではなく、子どもによって関わる働きが違うことも示唆された。答えが合っているかどうかだけでなく、子どもがどう解き方を選び、難しい問題にどう対応しているかを見ることが、支援の手がかりになると考えられる。","2026-11-12","ScienceDaily","https://www.sciencedaily.com/releases/2026/11/261112025542.htm"],["画面時間と子どもの発達 280万人超のデータが示した関連","画面の使用時間が長い子どもは、学力や言葉の発達が低く、不安や落ち込み、攻撃性などの心の問題が多い傾向があることが、280万人超の子どもを対象とした大規模な総括研究で示された。カナダ・カルガリー大学の研究チームが23件のメタ分析をまとめたもので、学術誌JAMA小児科学に掲載された。影響は小さいとする専門家の見方もあり、使い方の工夫が大切だとされている。使い方の工夫が大切だとされている。","\n【概要】画面の使用時間が長い子どもは、学力や言葉の発達が低く、不安や落ち込み、攻撃性などの心の問題が多い傾向があることが、大規模な総括研究で示された。カナダ・カルガリー大学の研究チームが、64か国、280万人を超える子どもと若者のデータを含む23件のメタ分析をまとめたもので、学術誌JAMA小児科学に掲載された。画面の使い方によって影響が違うことも示されている。【背景】画面は今や子どもの生活のあらゆるところにあり、子どもの発達や心の健康への影響が心配されている。今回の研究は、画面の使用と子どもの学力、認知、心の健康、社会性との関連について、世界中の研究をまとめて確かめることを目的とした。テレビやスマートフォン、ゲーム、動画など、画面の種類や子どもの年齢、研究の時期によって関連の強さが違うことも調べられた。【詳細】分析の結果、画面の使用時間が長い子どもは、学力全体が低く、言葉の発達も弱い傾向がみられた。心の内側の問題として不安や落ち込みが多く、外側の問題として攻撃性や注意欠如・多動症に関連する行動も多かった。感情の難しさや友人関係の問題も多かった。特にソーシャルメディアの使用は、心の内側の問題とより強く関連していた。一方で、実行機能や向社会性、算数、理科、読書については、画面の使用との関連はみられなかった。ただし、これらの領域は研究が少なく、影響がないと結論づけるには証拠が足りないとされている。【ポイント・注意点】専門家は、画面の使用と心の問題の関連は小さいとし、画面だけが子どもの心の不調の主な原因ではないと指摘している。画面の使用が心の問題を増やす一方で、心の問題がある子どもが画面に逃げるという双方向の関係も指摘されている。画面の内容や使い方も大切で、能動的で創造的な活動や、保護者と一緒に見ることは、子どもの理解を助けるという。家庭では、食事の時間は画面なしにする、睡眠や外遊びを優先する、画面の時間を数えるよりも何に置き換わっているかを見るといった工夫がすすめられている。保護者自身の画面の使い方も、子どもの見本になる。","2026-11-12","Bored Panda","https://2.boredpanda.com/high-screentime-hurting-kids-learning-skills/"],["週1回の公園通いが子どもの心の健康を高める","生まれてから11歳まで、週に1回以上公園や遊び場に通った子どもは、心の健康の評価が平均で16.5パーセント高かったとする研究が報告された。イギリスのエクセター大学の研究チームが、4,219人の子どもを追跡した長期データで調べたもので、疫学と地域保健の学術誌に掲載された。公園は無料か低コストで利用できるため、発達の格差を縮める手がかりにもなるという。発達の格差を縮める手がかりにもなるという。","\n【概要】生まれてから11歳まで、週に1回以上公園や遊び場に通った子どもは、心の健康の評価が平均で16.5パーセント高かったとする研究が報告された。イギリスのエクセター大学の研究チームが、4,219人の子どもを追跡した長期データで調べたもので、疫学と地域保健の学術誌に掲載された。公園は無料か低コストで利用できるため、発達の格差を縮める手がかりにもなるという。【背景】子どもの社会性や感情の発達は、自分の感情を理解してコントロールし、ほかの子と協力し、関係を築き、日常の課題に対応する力の土台になる。こうした力は、子ども時代だけでなく大人になってからの心の健康にも関わる。公園や遊び場は、体を動かす場であると同時に、想像力を使った遊びや冒険的な遊びを通じて自信や自立を育む場でもある。子どもの頃から公園に通う習慣が、長い目で見て心の健康とどう結びつくのかが研究のテーマだった。【詳細】研究では、イギリスの長期追跡調査「90年代の子どもたち」のデータを使い、4歳から11歳の4,219人を追跡した。生まれてから11歳まで週に1回以上公園に通った子どもは、週1回未満の子どもに比べて、心の健康の評価が平均で16.5パーセント高かった。家庭の困難や社会経済的な条件の違いを統計的に調整しても、この関連は残った。公園に通う頻度が高い時期には社会性や感情の発達がよく、子どもの頃を通じて通う頻度が高い子どもは、全体として社会性や感情の力が高かった。恵まれた家庭の子どもは幼い頃に公園に通うことが多かったが、年齢が上がると恵まれない家庭の子どもが通う頻度が上がることもあった。【ポイント・注意点】研究を率いたマーク・ファーガソン氏は、週に1回以上の公園通いをすすめることは、感情の健康や社会性、心の健康を支える実践的な方法だと述べている。ただ、効果は公園が安全で、誰でも気軽に入れて、よく整備されていることが前提になる。今回の結果はイギリスの1つの長期調査にもとづくもので、ほかの地域や多様な集団にもあてはまるかは、さらなる研究が必要だ。身近な公園を家族で使う習慣は、費用をかけずにできる取り組みとして、子どもの発達を支える手がかりになる。","2026-11-11","scienmag","https://scienmag.com/weekly-park-visits-linked-to-stronger-child-mental-health-and-social-development/"],["致死的な新生児脳疾患の原因遺伝子を特定","生まれる前から脳の発達に影響し、重い神経の障害を引き起こす致死的な新生児の脳疾患について、その原因となる遺伝子が特定された。サウジアラビア、ヨーロッパ、北米の5つの家族を調べた研究で、学術誌ゲノム・メディシンに掲載された。妊娠中の遺伝子検査による早期の発見や、家族の遺伝カウンセリングにつながる成果として注目されている。家族の遺伝カウンセリングにつながる成果として注目されている。","\n【概要】生まれる前から脳の発達に影響し、重い神経の障害を引き起こす致死的な新生児の脳疾患について、その原因となる遺伝子が特定された。サウジアラビア、ヨーロッパ、北米の5つの家族を調べた研究で、学術誌ゲノム・メディシンに掲載された。妊娠中の遺伝子検査による早期の発見や、家族の遺伝カウンセリングにつながる成果として注目されている。【背景】この疾患は、脳の発達が生まれる前から妨げられ、けいれんや重い発達の遅れ、脳の構造の大きな異常を引き起こす。なかには、原因が分からないまま複数の子どもを亡くした家族もあった。研究は、サウジアラビアのキング・アブドゥッラー科学技術大学とキング・ファイサル専門病院・研究センターのチームが中心となり、同じような症状の子どもがいる5つの家族をつなげて調べた。【詳細】研究チームは、5つの家族の子どもの症状を比べ、細胞の実験も行った結果、同じ遺伝子VPS25の変化が共通していることを発見した。VPS25は神経細胞を維持する働きに関わる遺伝子で、その変化により、細胞が放出する小さな袋の数や中身が変わり、神経細胞を守るために大切なたんぱく質が不足することが分かった。VPS25の変化が人の病気と結びついたのは初めてのことで、脳の異常をもつ子どもの原因を調べる際に考えるべき新しい遺伝子が見つかったことになる。5つの家族のうち3つはサウジアラビアのゲノム事業を通じて見つかり、北米とヨーロッパの家族とつなげることで、1つの家族だけでは見えなかったパターンが明らかになった。【ポイント・注意点】原因が分かったことで、同じ症状の子どもをもつ家族は、妊娠中の遺伝子検査で疾患を見つけられる可能性が広がり、今後の妊娠について考える際の遺伝カウンセリングにも役立つと期待されている。研究者は、世界中で同じ疾患の家族を見つけ、症例を増やすことで、診断の改善やVPS25の変化が脳の発達にどう影響するのかをさらに明らかにしたいとしている。まれな疾患の解明には、臨床と研究の協力や、ゲノム情報の共有が欠かせないことを示す成果でもある。","2026-11-11","Medical Xpress","https://medicalxpress.com/news/2026-11-science-genetic-mystery-fatal-brain.html"],["子ども同士の会話にもジップの法則 年齢とともに変化","子ども同士の会話でも、言葉の使われ方がジップの法則に近い形になることが、浙江大学の研究で示された。3歳から7歳の英語を話す子ども70人の会話を分析したもので、言語学の学術誌に掲載された。年齢が上がると言葉の分布が平らになり、使う言葉の種類が増える傾向がみられた。子どもの言葉の発達を数理的にとらえる手がかりになる。子どもの言葉の発達を数理的にとらえる手がかりになる。","\n【概要】子ども同士の会話でも、言葉の使われ方がジップの法則に近い形になることが、浙江大学の研究で示された。3歳から7歳の英語を話す子ども70人の会話を分析したもので、言語学の学術誌に掲載された。年齢が上がると言葉の分布が平らになり、使う言葉の種類が増える傾向がみられた。子どもの言葉の発達を数理的にとらえる手がかりになる。【背景】ジップの法則は、言葉の使用頻度と順位の関係を表す法則で、よく使われる言葉ほど短く、少数の言葉が全体の多くを占めるという特徴がある。これまで子どもの言葉の法則性は、親と子の会話のデータから調べられることがほとんどだった。子ども同士の会話では、親との会話とは言葉の使い方が違う可能性があり、同じ法則があてはまるのか、年齢とともにどう変わるのかは分かっていなかった。今回の研究は、子ども同士の会話データに注目した点が新しい。【詳細】研究では、4つの子ども言語データベースから、34か月から88か月の英語を話す子ども70人の、子ども同士の会話を分析した。それぞれの子どもについて、全体の言葉、内容語、機能語の分布を調べたところ、どの子どもの分布もジップ・マンデルブロモデルによくあてはまった。ただ、対数正規分布とも区別がつかず、分布は「重い裾をもつ、ジップに近い形」とするのが適切だった。よく使われる側は機能語が占め、内容語よりも分布の傾きが急だった。年齢が上がるほど分布の指数が小さくなり、分布が平らになる傾向がみられ、内容語の種類の増加とともに進むことが分かった。【ポイント・注意点】この結果は、子ども同士の会話にも、大人の言葉と同じような統計的な規則性があることを示している。年齢が上がると分布が平らになるのは、使う言葉の種類が増え、伝えたいことをより細かく表せるようになる過程と関係していると考えられる。ただし、今回の分析は英語を話す子どもに限られ、ほかの言語でも同じかどうかはまだ分からない。子どもの言葉の発達を、語彙の数だけでなく分布の形からもとらえる視点は、言語発達の研究や、子どもの言葉の育ちを見守るうえでの参考になる。","2026-11-09","MDPI","https://www.mdpi.com/2226-471X/11/11/232"]]};

const OLD_CUT="2026-11-07";

/* ===== 項目（ジャンル）はデータ駆動：CATS／DATAに足すだけで自動で増えます ===== */
const extraCats=[];
function allCats(){
  const list=CATS.slice();
  Object.keys(DATA).forEach(id=>{ if(!list.some(c=>c.id===id)) list.push({id:id,name:id,desc:"追加された項目",img:"hero"}); });
  extraCats.forEach(c=>{ if(!list.some(x=>x.id===c.id)) list.push(c); });
  return list;
}
let cats=allCats();
let catIdx=0;
const artIdxMap={};
function itemsOf(c){return (DATA[c.id]||[]).map((a,i)=>({a:a,oi:i})).sort((x,y)=>y.a[3].localeCompare(x.a[3]))}
function curCat(){return cats[catIdx]}
function curItems(){return itemsOf(curCat())}
function curArtIdx(){const n=curItems().length;if(!n)return 0;let i=artIdxMap[curCat().id]||0;if(i>=n)i=n-1;if(i<0)i=0;return i}
function renderStage(dir){
  cats=allCats(); if(catIdx>=cats.length)catIdx=cats.length-1; if(catIdx<0)catIdx=0;
  const c=curCat(), items=curItems(), ai=curArtIdx();
  const total=cats.reduce((s,x)=>s+(DATA[x.id]||[]).length,0);
  document.getElementById('heroText').innerHTML="<b>今日のまとめ — 全"+cats.length+"ジャンル・"+total+"件。</b> タイトルと概要は日本語、カードの「和訳全文を読む」で全文が開きます。新しい順に並べ、48時間より古い記事はグレー表示です。";
  document.getElementById('catName').textContent=c.name;
  document.getElementById('catDesc').textContent=c.desc||"";
  document.getElementById('catCount').textContent="ジャンル "+(catIdx+1)+" / "+cats.length;
  document.getElementById('catDots').innerHTML=cats.map((x,i)=>'<button class="dot'+(i===catIdx?' active':'')+'" data-cat="'+i+'" aria-label="'+x.name+'へ移動"></button>').join('');
  document.querySelectorAll('#catDots .dot').forEach(d=>{d.onclick=()=>{const n=+d.dataset.cat; if(n!==catIdx){const dd=n>catIdx?'down':'up'; catIdx=n; renderStage(dd);}}});
      const slot=document.getElementById('cardSlot');
  if(!items.length){
    slot.innerHTML='<article class="card"><div class="empty"><div class="big">✦</div><p><b>'+c.name+'</b> は追加されたばかりの項目で、まだ記事がありません。</p><p>毎日の更新でこの項目の記事が集まると、ここに表示されます。<br>上スワイプで他のジャンルへ移動できます。</p></div></article>';
    document.getElementById('artDots').innerHTML=""; document.getElementById('artCount').textContent="0 / 0"; return;
  }
  const it=items[ai], a=it.a, old=isOld(a[3]);
  slot.innerHTML='<article class="card'+(old?' old':'')+(dir?' anim-'+dir:'')+'">'
    +'<img class="ph" src="'+IMGS[c.img]+'" alt="'+c.name+'のイメージイラスト">'
    +'<div class="cbody"><div class="meta"><span class="badge'+(old?' oldb':'')+'">'+(old?'少し前':'NEW')+'</span><span>'+a[3]+'</span><span>'+(ai+1)+' / '+items.length+'</span></div>'
    +'<h3>'+a[0]+'</h3><p class="sum">'+a[1]+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="openArticle(\''+c.id+'\','+it.oi+')">和訳全文を読む</button>'
    +'<button class="btn ghost" onclick="quickMemo(\''+c.id+'\','+it.oi+',this)">メモ保存</button>'
    +'<button class="btn ghost" onclick="shareArticle(\''+c.id+'\','+it.oi+')">共有</button></div>'
    +'<div class="src">出典：'+a[4]+'<br><a href="'+a[5]+'" target="_blank" rel="noopener">原文を開く</a></div></div></article>';
  document.getElementById('artDots').innerHTML=items.map((x,i)=>'<span class="dot'+(i===ai?' active':'')+'"></span>').join('');
  document.getElementById('artCount').textContent="記事 "+(ai+1)+" / "+items.length;
  requestAnimationFrame(fitCard);
}

function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;
  const sum=card.querySelector('.sum'), h3=card.querySelector('h3'), ph=card.querySelector('.ph');
  let ss=14, hs=Math.min(21, Math.max(17, window.innerWidth*0.044)), phh=ph?Math.round(ph.getBoundingClientRect().height):0; const ph0=phh;
  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }
    if(hs>13){ hs-=0.5; if(h3) h3.style.fontSize=hs+'px'; continue; }
    break;
  }
}
window.addEventListener('resize', fitCard);
function nextArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i>=n-1)return;artIdxMap[curCat().id]=i+1;renderStage('next')}
function prevArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i<=0)return;artIdxMap[curCat().id]=i-1;renderStage('prev')}
function nextCat(){if(catIdx>=cats.length-1)return;catIdx++;renderStage('down')}
function prevCat(){if(catIdx<=0)return;catIdx--;renderStage('up')}
/* ===== スワイプ操作（スクロールではなくスワイプで移動） ===== */
const stage=document.getElementById('stage');
let sx=null, sy=null, swipedAt=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;
  swipedAt=Date.now();
  if(Math.abs(dx)>Math.abs(dy)){ dx<0?nextArt():prevArt(); } else { dy<0?nextCat():prevCat(); }
});
stage.addEventListener('click',e=>{ if(Date.now()-swipedAt<120){e.stopPropagation();e.preventDefault();} },true);
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')nextArt(); else if(e.key==='ArrowLeft')prevArt();
  else if(e.key==='ArrowDown'){e.preventDefault();nextCat();} else if(e.key==='ArrowUp'){e.preventDefault();prevCat();}
});

  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast("項目名を入力してください");return}
  const desc=document.getElementById('newCatDesc').value.trim()||"追加された項目";
  const id='custom-'+Date.now();
  extraCats.push({id:id,name:name,desc:desc,img:'hero'}); DATA[id]=[];
  cats=allCats(); catIdx=cats.length-1;
  document.getElementById('addDlg').close(); renderStage('down');
  toast("項目「"+name+"」を追加しました");
};
/* ===== 記事ダイアログ・メモ・共有 ===== */
function openArticle(cat,idx){
const c=allCats().find(x=>x.id==cat); const a=DATA[cat][idx];
document.getElementById('dlgIn').innerHTML=`<img src="${IMGS[c.img]}" alt=""><div class="meta" style="margin-top:10px"><span>${c.name}</span><span>${a[3]}</span></div><h3>${a[0]}</h3><p class="sum" style="font-size:14px">${a[1]}</p><div class="full">${a[2]}</div>
<p class="src" style="margin-top:12px">出典：${a[4]} — <a href="${a[5]}" target="_blank" rel="noopener">${a[5]}</a></p>
<div class="memoBox"><label style="font-weight:800;font-size:14px">ひとことメモ</label><textarea id="memoText" placeholder="気づいたこと、作りたいもの、家族への共有メモなど"></textarea>
<div class="actions"><button class="btn primary" onclick="saveMemo('${cat}',${idx})">このメモを保存</button><button class="btn ghost" onclick="shareArticle('${cat}',${idx})">iPhoneで共有</button><button class="btn ghost" onclick="document.getElementById('dlg').close()">閉じる</button></div></div>`;
document.getElementById('dlg').showModal();
}
function quickMemo(cat,idx,btn){const a=DATA[cat][idx];memos.unshift({cat,title:a[0],note:"",date:a[3]});updateMemoUI();btn.textContent="保存しました";btn.classList.add('saved');toast("メモに保存しました（このページを開いている間）")}
function saveMemo(cat,idx){const a=DATA[cat][idx];const note=document.getElementById('memoText').value.trim();memos.unshift({cat,title:a[0],note,date:a[3]});updateMemoUI();toast("メモを保存しました");document.getElementById('dlg').close()}
function updateMemoUI(){document.getElementById('memoCount').textContent=memos.length;const area=document.getElementById('memoList');
if(!memos.length){area.innerHTML='<p class="sum">まだメモがありません。記事の「メモ保存」をタップしてください。</p>';return}
area.innerHTML=memos.map(m=>`<div class="memoItem"><b style="font-size:14px">${m.title}</b><div style="font-size:13px;color:var(--muted)">${m.note||"（ひとことメモなし）"} ・ ${m.date}</div></div>`).join('')}
function exportMemos(){if(!memos.length){toast("まだメモがありません");return}const txt="MAI topic メモ — 2026-11-10\n\n"+memos.map((m,i)=>`${i+1}. ${m.title}\n${m.note||""}\n`).join("\n");const b=new Blob([txt],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="mai-topic-memo-2026-11-10.txt";a.click();URL.revokeObjectURL(u)}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}} try{await navigator.clipboard.writeText(text);toast("コピーしました — メモアプリなどに貼り付けできます")}catch(e){toast("共有できませんでした")}}
function shareArticle(cat,idx){const a=DATA[cat][idx];shareText(a[0],`${a[0]}\n\n${a[1]}\n\n出典：${a[4]} ${a[5]}`)}
function shareMemos(){if(!memos.length){toast("まだメモがありません");return}shareText("MAI topic メモ",memos.map(m=>`・${m.title} ${m.note}`).join("\n"))}
document.getElementById('sharePage').onclick=()=>shareText("MAI topic","MAI topic — 2026年11月16日朝版（全"+cats.length+"ジャンル）");
document.getElementById('memoBtn').onclick=()=>{updateMemoUI();document.getElementById('memoDlg').showModal()};
updateMemoUI();
renderStage();
</script>

    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
} catch (e) {}
</script>
