】\nMMRワクチンは2回の接種で感染を97％防ぐとされる。ウィスコンシン州とペンシルベニア州では、リスクの高い地域の乳児に、通常より早い「ゼロ回目」のMMR接種を勧めており、ウィスコンシン州の指針は生後6か月から対象としている。CIDRAPは、学校のワクチン接種で個人的・宗教的な理由による免除をなくすことが、州が取り得る最も重要な対策かもしれないと主張している。海外渡航の予定がある家庭では、子どもの接種歴を確認しておきたい。日本でも海外からの持ち込みによる感染は起こり得るため、子どもの定期接種の時期を逃さないことが大切になる。","2026-11-23","Medical Xpress","https://medicalxpress.com/news/2026-11-wisconsin-triple-digit-measles-nears.html"],["ボタン電池の誤飲で赤ちゃんの食道が黒くただれる　大量のよだれは誤飲のサイン","子どものボタン電池誤飲の事例を紹介する記事。1歳男児はリモコンから外れたコイン形リチウム電池を飲み込み、大量のよだれが出た。4時間後に内視鏡で取り出したが食道の粘膜は黒くただれ、約2週間入院した。コイン形リチウム電池は飲み込んで30分〜1時間でも潰瘍ができた報告があり、死亡例もある。誤飲時は無理に吐かせず水も与えず、電池や機器を持ってすぐ受診すること、電池を手の届かない場所に保管することが勧められている。","\n【概要】\nマイナビ子育ては、医師の監修のもと、子どものボタン電池の誤飲について2つの事例を紹介し、症状の見分け方と予防策をまとめた。コイン形リチウム電池を飲み込んだ1歳男児は食道の粘膜が黒くただれ、約2週間の入院が必要になった。親が目を離した一瞬で起きる事故として注意を呼びかけている。\n【背景】\nリモコンやキッチンタイマー、おもちゃなど、身の回りにはボタン電池を使う製品が多い。乳幼児は手にした物を口に入れることが多く、電池ボックスから外れた電池を飲み込んでしまうことがある。記事によると、コイン形リチウム電池は飲み込んでから30分〜1時間でも潰瘍ができたという報告があり、過去には死亡例もある。電池の誤飲は子どもの身近な製品から起こるため、どの家庭でも起こり得る事故といえる。\n【詳細】\n1例目の1歳男児は4月、自宅でリモコンから外れたコイン形リチウム電池を飲み込み、大量のよだれが出た。誤飲から4時間後に全身麻酔下で内視鏡を使って電池を取り出したが、食道の粘膜は黒くただれていた。約2週間入院し、1か月後に治ったという。2例目の11カ月の男児は、キッチンタイマーの電池を飲み込んだ。この電池は腸へ進み、翌朝に便とともに排出された。記事は、3歳以下の子どもが突然吐いたり、大量によだれを垂らしたりしたときは、電池の誤飲を疑う必要があるとしている。2つの事例は、同じボタン電池の誤飲でも、電池が食道にとどまるかどうかで経過が大きく異なることを示している。\n【ポイント・注意点】\n誤飲に気づいたら、無理に吐かせず、水も与えずに、飲み込んだ電池や電池を使っていた機器を持って、すぐに医療機関を受診することが大切だ。予防策として記事は、電池を子どもの手の届かない場所に保管すること、電池ボックスのフタをネジやテープで留めること、STマークの付いたおもちゃを選ぶことを挙げている。使用済みの電池も放置せず、すぐに片付ける習慣をつけたい。電池を交換するときは子どもの見ていない場所で行い、新しい電池も包装のまま手の届かない場所にしまっておくとよい。","2026-11-22","マイナビ子育て（Yahoo!ニュース）","https://news.yahoo.co.jp/articles/fb7a8f02e901da3513d4ed66d0ce7b7313d137ad"],["夜のスマホ使用で10代の睡眠が短く　女子で影響大きく、SNSは1時間で44分減","米ストーニーブルック大学の研究チームは、13〜18歳の218人のスマートフォンに利用状況を記録するアプリを入れ、平均17.5日間、使い方と睡眠の関係を調べた。夜間のスマホ使用が1時間増えるごとに睡眠は約26分短く、夜のSNS利用では1時間あたり平均44.4分短かった。女子では夕方の使用1時間ごとに寝つきが82.2分遅れ、睡眠が70.8分減ったが、男子では有意ではなかった。研究者は就寝前のスマホとSNSへの対策を勧めている。","\n【概要】\n米ストーニーブルック大学の研究チームは、夜間のスマートフォン使用が10代の睡眠時間の短さと関連し、特に女子で影響が大きいとする研究をJournal of Adolescent Healthに発表した。利用状況を自動で記録するアプリを使い、実際の使い方と睡眠の関係を調べた点が特徴だ。筆頭著者はジーナ・マリー・マシュー氏。\n【背景】\n記事によると、10代には一晩に9〜9時間半の睡眠が勧められている。しかし、遅い就寝、早い始業、友人関係などのために十分に眠れていない若者が多い。スマホなどの画面を見る時間の長さは、心身の健康問題との関連が指摘されてきた。従来の研究の多くは本人の自己申告に頼っており、記憶違いによる偏りが課題だった。\n【詳細】\n研究チームは、米国の13〜18歳の218人の自分のスマホに「RealityMeter」というアプリを入れ、平均17.5日間、アプリごとの使用時間や種類、使った時間帯を記録した。1日の使用時間が長いほど、就寝が遅く、睡眠が短く、平日と週末の睡眠のずれも大きかった。夜間のスマホ使用が1時間増えるごとに睡眠は約26分短く、夜のSNS利用が1時間増えるごとに平均44.4分短かった。女子では、夕方のスマホ使用が1時間増えるごとに寝つきが82.2分遅れ、睡眠は70.8分減ったが、男子では統計的に有意ではなかった。睡眠の質の低下と関連したのは夜のSNS利用だけで、その影響は小さかった。また、使用が多いほど休日に寝だめをする傾向は、男女ともにみられた。\n【ポイント・注意点】\n研究者は、画面を見る時間の合計を減らすだけでは十分でない可能性があり、就寝前のスマホ使用とSNSに的を絞った対策が必要だとしている。今後は、それが特に女子の睡眠を改善するかを検証すべきだという。家庭では、寝る前の一定時間はスマホを手元から離すなど、夜の使い方のルールを子どもと話し合うことが一つの手がかりになりそうだ。睡眠不足は日中の集中力や気分にも影響し得るため、子どもの睡眠時間を家族で見直すきっかけにしたい。","2026-11-20","Medical Xpress","https://medicalxpress.com/news/2026-11-late-night-linked-shorter-teens.html"],["RSウイルス予防の抗体製剤、定期接種化を検討　厚労省が議論のまとめを公表","厚生労働省は11月18日、小児のRSウイルス感染症予防に関する議論のまとめを公表し、抗体製剤を予防の選択肢として広く使うことは科学的に妥当と評価した。RSウイルスには1歳までに50％以上、2歳までにほぼ100％の子どもが感染し、1歳未満の負担が特に大きい。クレスロビマブは試験で下気道感染の発症を60.4％、入院を84.2％抑えた。定期接種にする場合の対象は生後1年未満が妥当とし、今後部会で審議する。","\n【概要】\nリセマムによると、厚生労働省は11月18日、小児のRSウイルス感染症の予防に関する議論のまとめを公表した。抗体製剤を予防の選択肢として広く使うことは科学的に妥当だと評価し、定期接種にする場合の対象は生後1年未満が妥当とした。定期接種化するかどうかは、今後、予防接種基本方針部会で審議される。\n【背景】\nRSウイルスは乳幼児の呼吸器感染症の主な原因の一つで、1歳までに50％以上、2歳までにほぼ100％の子どもが感染するとされる。特に1歳未満の乳児では負担が大きい。抗体製剤は、ウイルスに対する抗体を直接投与して感染や重症化を防ぐもので、乳児を守る手段として期待されている。厚労省の小委員会では、こうした製剤を定期接種の枠組みで使うかどうかが議論されてきた。今回は、ニルセビマブとクレスロビマブの2つの抗体製剤が評価の対象となった。\n【詳細】\nまとめでは、製剤ごとに有効性や費用対効果が評価された。クレスロビマブは、在胎29週以上の健康な早産児と正期産児を対象とした試験で、150日までの下気道感染の発症を60.4％、入院を84.2％抑えた。費用対効果を示す増分費用効果比（ICER）は、1QALY（質調整生存年）あたり、ニルセビマブが616.5万円、クレスロビマブが579.5万円と示された。定期接種にする場合の対象は生後1年未満が妥当とされ、接種の時期については、通年での接種も含めて検討するとしている。対象を生後1年未満としたのは、この時期の乳児で感染による負担が特に大きいことを踏まえたものとみられる。\n【ポイント・注意点】\n抗体製剤の定期接種化が実現すれば、乳児をRSウイルスから守る手段が広く使えるようになる可能性がある。ただし、現時点では定期接種化は決まっておらず、部会での審議を待つ段階だ。乳児がいる家庭では、手洗いやせきエチケットなど日常の感染対策に加え、今後の国の方針やかかりつけの小児科からの情報に注目しておきたい。定期接種化の判断は、今後の部会での審議に委ねられており、その行方が注目される。","2026-11-20","リセマム","https://resemom.jp/article/2026/11/20/88394.html"],["インフル流行期に子どもを守るには　米ロサンゼルス小児病院の医師が受診の目安を解説","米ロサンゼルス小児病院の感染予防・管理部門の医療責任者マイケル・スミット医師が、インフルエンザの季節に子どもを守るための助言をまとめた。米CDCは2024〜25年シーズンの小児のインフルエンザ死亡を289人と報告し、2004年の全国集計開始以来最多だった。5歳未満や持病のある子は24時間以内に小児科に連絡し、呼吸困難や40℃以上の発熱、意識の混濁があれば救急へ。予防には生後6か月以上の毎年の接種が勧められている。","\n【概要】\n米ロサンゼルス小児病院（CHLA）の感染予防・管理部門の医療責任者、マイケル・スミット医師は、インフルエンザの流行期に子どもを守るための助言を示した。症状の見分け方、受診や救急受診の目安、予防策を具体的に挙げている。News-Medicalが伝えた。\n【背景】\n記事によると、米国のインフルエンザの季節は10月から5月で、12月から2月にピークを迎える。子どもは重症化のリスクが最も高い層の一つだ。米疾病対策センター（CDC）は、2024〜25年シーズンの小児のインフルエンザによる死亡を289人と報告しており、2004年に全国での集計が始まって以来最多となった。なお、CDCの入院データは成人のみを対象としているという。\n【詳細】\n米国小児科学会（AAP）によると、インフルエンザの症状は、通常38℃（100.4°F）を超える突然の発熱に、体の痛み、寒気、だるさ、乾いたせきを伴い、かぜより重い。5歳未満、特に2歳未満の子どもや、ぜんそく、糖尿病、鎌状赤血球症、免疫の低下、神経筋の病気がある子どもは、24時間以内に小児科に連絡するよう勧めている。熱が3日以上続く場合や脱水がみられる場合は医療者の診察を受け、呼吸が苦しい、40℃（104°F）以上の発熱、意識の混濁やぐったりしているときは救急外来を受診するよう求めている。かぜとの違いは、症状が突然始まり、より重い点にあるという。\n【ポイント・注意点】\n予防策としては、生後6か月以上のすべての人の毎年のインフルエンザワクチン接種、20秒以上の手洗い、具合が悪いときは家で休むことが挙げられた。2歳を超える子どもにはN95やKN95マスクも選択肢とされる。登校・登園の再開は学校や保育施設の決まりに従うよう勧めている。日本とは制度が異なる部分もあるが、受診の目安は家庭での判断の参考になる。受診の目安のうち、呼吸の苦しさや意識の変化は特に見逃せないサインだ。持病のある子どもの家庭では、流行期の前にかかりつけ医と受診のタイミングを相談しておくと安心だ。","2026-11-20","News-Medical","https://www.news-medical.net/news/20261120/Pediatrician-shares-essential-tips-to-protect-children-during-flu-season.aspx"],["RSウイルス予防のTikTok動画、質の高い情報は半数以下　米ラトガース大が分析","米ラトガース大学ニュージャージー医科大学の研究チームは、母体用RSウイルスワクチンや乳児用の抗体製剤ニルセビマブなど、RSウイルス予防に関するTikTok動画169本を分析した。質が高いと判定されたのは47％の79本にとどまり、中央値は5段階で3だった。医療者の動画は質が高い傾向がある一方、保護者などの動画では賛否の混じった内容が多かった。研究者は、家族を根拠に基づく情報源へ案内するよう医療者に求めている。","\n【概要】\n米ラトガース大学ニュージャージー医科大学のシバニ・スリバスタバ氏らは、RSウイルスの予防に関するTikTok動画169本を分析し、質の高い情報を提供していたのは半数に満たなかったとする研究をVaccine誌に発表した。米ミネソタ大学CIDRAPの記事をMedical Xpressが掲載した。\n【背景】\nRSウイルスは乳児の呼吸器感染症の主な原因の一つで、予防策として妊婦に接種するワクチン「アブリスボ」と、乳児に投与する長時間作用型の抗体製剤ニルセビマブ（ベイフォータス）が使われている。ただ、これらの推奨は複雑で、保護者がSNSで情報を集める機会も増えている。動画の内容が正確かどうかは、家族の判断に影響し得る。研究は、こうした動画の質を共通の尺度で評価した。\n【詳細】\n研究チームは「RSV vaccine」「RSV jab」「RSV prophylaxis」などの語で検索し、2023年7月17日から2025年11月14日までに投稿された169本を集めた。質は1〜5の「Global Quality Scale」で評価し、4を超えるものを高品質とした。その結果、高品質だったのは47％（169本中79本）で、中央値は3だった。投稿者は、医療専門職が50.3％、保護者・養育者が37.9％、インフルエンサーが4.7％、所属不明が4.1％、クリニックが1.8％、科学者・研究者が1.2％だった。医療専門職の動画は質が高く、根拠に沿った動画の多くを占めた。一方、保護者・養育者の動画では、賛否の混じった内容や不確かな内容の割合が大きかった。そうした内容は全体の約20％、誤情報は3％だった。\n【ポイント・注意点】\n研究者は、母体ワクチンとニルセビマブの推奨が複雑であることから、医療者は家族がネット上で混在した情報に触れることを想定し、根拠に基づく情報源へ案内すべきだとしている。保護者にとっても、SNSの動画だけで判断せず、かかりつけ医や公的機関の情報で確かめることが大切だ。動画の投稿者が医療専門職かどうかを確かめることも、情報の信頼性を見極める手がかりになる。","2026-11-20","Medical Xpress","https://medicalxpress.com/news/2026-11-tiktok-videos-rsv-high-quality.html"],["妊娠中のネオニコチノイド系殺虫剤ばく露、9歳時の認知機能と関連　大阪大","大阪大学の研究チームは、子ども200人のへその緒の血液（臍帯血清）で、ネオニコチノイド系殺虫剤に関連する10種類の化合物を測定し、生後10か月から9歳までの発達との関連を調べた。乳幼児期には関連はみられなかったが、9歳時点ではジノテフランの濃度が高いほど処理速度の得点が、アセタミプリドの代謝物の濃度が高いほど知覚推理の得点が低かった。研究者は、対象が少なく因果関係は示せないため、さらなる研究が必要としている。","\n【概要】\n大阪大学のアビル・ナガタ氏、ケンジ・ツチヤ氏らの研究チームは、妊娠中のネオニコチノイド系殺虫剤へのばく露が、子どもの9歳時点の認知機能の一部と関連していたとする研究をJAMA Network Openに発表した。乳幼児期には関連はみられず、特定の能力と年齢に限った関連の可能性があるという。\n【背景】\nネオニコチノイド系殺虫剤は、安価で効果が高いことから世界で最も広く使われている殺虫剤の一つだ。分解されにくく、食品や水を汚染することがあり、国内の過去の研究では水道水から一年を通じて検出されている。この殺虫剤はニコチン性アセチルコリン受容体に作用するが、この受容体は人にもあり、胎児の脳の神経細胞の成熟に関わっている。\n【詳細】\n研究チームは、子ども200人の臍帯血清で、ネオニコチノイドに関連する10種類の化合物を測定した。特に、半数を超える試料で検出されたジノテフランと、アセタミプリドの代謝物であるデスメチルアセタミプリドに注目した。生後10か月から9歳まで神経発達を評価し、多重比較の補正を行って解析した。その結果、10〜32か月の時点では関連は認められなかった。一方、9歳時点では、ジノテフランの濃度が高いほどウェクスラー式知能検査の処理速度の得点が低く、デスメチルアセタミプリドの濃度が高いほど知覚推理の得点が低かった。ツチヤ氏は、乳幼児期の結果は一貫性に欠けるとし、特定の能力と年齢に限られた関連を反映している可能性があると述べている。測定に用いたのは出生時に採取された臍帯血清で、胎児期のばく露の指標とした。\n【ポイント・注意点】\n研究者は、対象者が比較的少なく、測定された濃度も低かったことを限界に挙げている。今回の結果は関連を示すもので因果関係は確立されておらず、確認のためのさらなる研究が必要だという。記事には効果の大きさは示されていない。結果を過度に恐れる必要はないが、妊娠中の化学物質へのばく露と子どもの発達の関係について、今後の研究の積み重ねが注目される。研究は、胎児期という発達の重要な時期のばく露に注目し、子どもの成長を9歳まで追跡した点に特徴がある。","2026-11-20","Medical Xpress","https://medicalxpress.com/news/2026-11-insecticide-exposure-pregnancy-linked-cognition.html"],["子どもの頭部CTの放射線、脳腫瘍リスク上昇と関連　米加370万人超を解析","米カリフォルニア大学デービス校とサンフランシスコ校の研究チームは、米国とカナダ・オンタリオ州の子ども370万人超の記録を分析し、画像検査による放射線量が多いほど脳腫瘍のリスクが高まることを示した。頭部CT1回分の線量で1.8倍のリスクと関連し、21歳までに1万人あたり約8人の腫瘍増加に相当する。研究者は、軽い頭部外傷では検査の必要性を見極め、最小線量を用いるよう求める一方、必要な検査は避けないよう呼びかけている。","\n【概要】\n米カリフォルニア大学デービス校とサンフランシスコ校の研究チームは、子どものころの画像検査による放射線ばく露が多いほど、脳腫瘍のリスクが高まるとする研究をJAMAに発表した。筆頭著者はダイアナ・ミグリオレッティ氏、責任著者はレベッカ・スミス＝ビンドマン氏。News-Medicalが伝えた。\n【背景】\n脳腫瘍は子どものがんの中で2番目に多く、子どものがんによる死亡の最大の原因となっている。また、頭部は子どもで最も多く画像検査が行われる部位だ。転倒や打撲などの軽い頭部外傷でもCT検査が行われることがあり、放射線ばく露の影響を大規模に検証する必要があった。\n【詳細】\n研究チームは、米国とカナダ・オンタリオ州の370万人を超える子どもの記録を、出生から平均12.3年追跡した。期間中に1536件の脳腫瘍が見つかり、55.7％が男児、64.5％が2〜10歳で診断され、82.5％が悪性度の高い腫瘍だった。子どもの4.3％が頭部CTを1回、0.9％が2回、0.4％が3回以上受けていた。頭部CT1回分に相当する線量は1.8倍のリスクと関連し、21歳までに子ども1万人あたり約8人の腫瘍の増加、頭部CT1266回あたり1人に相当した。リスクは線量が増えるほど高まり、悪性度の高い腫瘍で強かった。小児の脳腫瘍の推定10.1％が画像検査の放射線に起因する可能性があるという。研究は、米国とカナダの記録を組み合わせた大規模なものだ。\n【ポイント・注意点】\n研究者は、子ども一人ひとりにとっての絶対的なリスクは小さいとしている。そのうえで、特に軽い頭部外傷では、検査ごとに必要性を見極め、目的を果たせる最小の線量を使うこと、不要な頭部CTを減らすための判断基準「PECARN」を活用することを求めた。一方で、保護者は医学的に必要な画像検査を避けるべきではないと強調している。気になる場合は、検査の必要性について医師に尋ねるとよい。子どもが頭を打ったときは、意識や様子の変化をよく観察し、受診の際には医師の説明を聞いたうえで検査について判断することが大切になる。","2026-11-19","News-Medical","https://www.news-medical.net/news/20261119/Higher-radiation-from-childhood-imaging-may-increase-brain-tumor-risk.aspx"],["山形市で登校中の小学生が車にはねられ顔にけが　酒気帯び運転の疑いで男を逮捕","19日午前7時40分ごろ、山形市中桜田の丁字路交差点で、1人で登校中の小学校低学年の男の子が横断歩道を渡っていたところ、右折してきた乗用車にはねられた。男の子は顔から出血して搬送されたが、意識はあり命に別状はない。信号は双方が青だったとみられる。警察は運転していた50歳の会社員の男から基準を超えるアルコールが検出されたとして現行犯逮捕した。男は容疑を認めているが、車内から酒は見つかっていない。","\n【概要】\nテレビユー山形によると、19日朝、山形市で登校中の小学生の男の子が乗用車にはねられ、顔にけがをした。運転していた50歳の会社員の男から基準を超えるアルコールが検出され、警察は男を現行犯逮捕した。男の子は意識があり、命に別状はないという。\n【背景】\n事故が起きたのは午前7時40分ごろで、子どもの登校時間帯だった。男の子は1人で登校している途中だった。登下校の時間帯は通勤の車の通行とも重なる。今回の事故では、横断歩道を渡っていた子どもに、交差点を右折してきた車が衝突した。信号は車と男の子の双方が青だったとみられている。飲酒運転は運転者の判断力や注意力を低下させ、重大な事故につながるおそれがある。\n【詳細】\n現場は山形市中桜田の丁字路の交差点。小学校低学年の男の子が横断歩道を渡っていたところ、右折してきた乗用車にはねられた。男の子は顔から出血して病院に搬送されたが、意識はあり、命に別状はない。乗用車を運転していたのは、出勤途中だった山形市平清水に住む会社員の男（50）。駆け付けた警察官が酒のにおいに気付いて調べたところ、呼気1リットルあたり0.5ミリグラム以上のアルコールが検出されたため、男を現行犯逮捕した。男は容疑を認めているが、車内から酒は見つかっていないという。事故は朝の通勤・通学の時間帯に起きた。\n【ポイント・注意点】\n飲酒運転は重大な事故につながる危険な行為で、飲酒後に時間がたっていても、体にアルコールが残っていれば運転してはならない。また、右折する車は対向車に気を取られ、横断歩道を渡る歩行者を見落とすおそれがある。運転する側は、交差点を曲がる前に横断歩道の歩行者を必ず確認することが求められる。子どもには、青信号でも曲がってくる車があることを伝え、車が止まったのを確かめてから渡るよう、家庭で繰り返し確認しておきたい。子どもが1人で登校する場合は、通学路の危ない交差点を事前に一緒に歩いて確認しておくと安心だ。目立つ色の服や反射材を身につけることも、運転者から見つけてもらいやすくする工夫になる。","2026-11-19","テレビユー山形（Yahoo!ニュース）","https://news.yahoo.co.jp/articles/4239e865a6989714903ec47afb1cddf9f9eea380"]],"dev":[["自閉症の子の約3分の2に重い消化器症状 腸内細菌も異なる 米研究","米テキサス大学ヘルスサイエンスセンター・ヒューストン（UTHealth Houston）の研究チームは、4〜16歳の自閉スペクトラム症（ASD）の子を調べ、ほぼ3分の2に重い消化器症状があることを確かめた。自閉症の症状が重い子ほど腹痛やガス、夜中の目覚めなどを抱えやすく、腸内細菌の多様性も低かった。一方、腸の炎症や「リーキーガット」の説は支持されなかった。成果はPediatric Research誌に掲載された。","\n【概要】米UTHealth Houstonの研究チームが、自閉スペクトラム症（ASD）の子どもの消化器症状と腸内細菌、行動、炎症の関係を調べた横断研究をPediatric Research誌に発表した。ASDの子のほぼ3分の2に重い消化器症状があり、その重さは自閉症の症状の重さとも関連していた。\n【背景】記事によると、ASDは米国の子どもの約3％にみられる。ASDの子は腹痛や便の異常を抱えやすいとされ、その背景に腸の炎症や腸のバリア機能の低下（いわゆるリーキーガット）があるという説もあった。研究を率いたのは、同大マクガバン医学部で小児の消化器・肝臓・栄養部門を率いるマーク・ローズ教授である。\n【詳細】対象は診断の確定した4〜16歳のASDの子どもで、血液と便を採取し、診察と保護者の質問票で自閉症の行動と消化器症状を評価した。さらに炎症や腸のバリアの指標を測り、腸内細菌を分析して、定型発達の子やASDの子のきょうだいと比べた。その結果、自閉症の症状が重い子ほど腹痛、ガス、悪臭のある便、夜中の目覚めといった消化器症状を持ちやすく、両者の重さには有意な関連があった。ASDの子は腸内細菌の多様性が低く、菌の構成も比較した2つのグループと異なっていた。消化器症状のあるASDの子では、いくつかの菌のグループが多かった。一方、炎症や腸の透過性の指標は正常範囲にとどまり、消化器症状や自閉症の症状の重さとも関係しなかった。\n【ポイント・注意点】ローズ教授は、言葉で伝えられない子では、いらだちや繰り返し行動、自傷が不調を示す数少ない手段になりうると述べ、リーキーガットや炎症の説は今回の研究では支持されなかったとした。チームは、多様な食事や排便の習慣が腸の健康と行動を支える可能性を挙げ、プロバイオティクスでも有望な結果を得ているという。ただし横断研究のため因果関係は示せず、記事には対象者の総数が書かれていない。家庭では、行動の変化の裏に体の不調が隠れていないかに目を向けることが大切になりそうだ。研究の筆頭著者はヴァイシャリ・ハーン氏で、チームは成果が自閉症の子への今後の支援策に役立つことを期待している。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-link-autism-gi-symptoms-children.html"],["子どもの心のケアにAI 保護者の76％が「安心できない」 米572人調査","米ハーバード大学医学部やボストン小児病院などの研究者は、5〜17歳の子を持つ米国の保護者572人を調べ、AIが主導する子どもの行動療法に76％が「まったく」または「あまり」安心できないと答えたとJAMA Pediatrics誌に報告した。重視する点は診断の正確さや共感、医療者の推奨、秘密の保護が上位で、費用や待ち時間は下位だった。過去1年に子が行動療法を受けた家庭ほど前向きだった。","\n【概要】ハーバード大学医学部やボストン小児病院、RANDの研究者らが、AIが主導する行動療法を子どもに使うことを保護者がどう感じているかを調べ、JAMA Pediatrics誌に発表した。米国の保護者572人のうち76％が安心できないと答えた。\n【背景】記事によると、別の研究では12〜21歳の約19％がメンタルヘルスの助言にAIチャットボットを使っている。米マサチューセッツ州の報告では、若い患者が最初の評価や治療、処方の管理を受けるまで平均4か月待っていた。人間のセラピストの不足が続くなか、AIを使った心のケアに注目が集まっている。\n【詳細】調査は2025年11月、新型コロナの流行を追うために作られたクラウドソーシングの仕組み「Outbreaks Near Me」を使い、5〜17歳の子が少なくとも1人いる保護者572人を対象に行った。AIによる治療を子に使うことに「まったく安心できない」「あまり安心できない」と答えたのは76％で、「いくらか」「とても」安心できるは約24％だった。重視する点の上位は、診断の正確さ、チャットボットの共感、医療の専門家が勧めるかどうか、秘密とプライバシーの保護で、費用や予約の柔軟さ、待ち時間は下位だった。子へのAI療法にある程度安心できる保護者は、自分への利用にも前向きで、AIの働きを人間の専門家と同等以上とみていた。過去1年に子が行動療法を受けたことは安心感の高さと関連したが、親や子がふだんチャットボットを使っているかどうかは関係しなかった。\n【ポイント・注意点】筆頭著者のマルトマ氏は、保護者が最も重視しているのは診断の正確さだと述べ、人間のセラピストの不足が大きな課題だとした。調査は保護者だけが対象で、子ども本人やセラピスト、医師の考えも必要だと記事は指摘している。研究チームは、心のケアのツールは関係者それぞれが大切にする点に照らして評価すべきだとし、今後広がるとみられるAI利用の動きを追い続けるとしている。記事は、ダートマス大学が開発した相談用チャットボット「Therabot」にも触れている。研究者は、従来の研究費による調査より速く実施できるクラウドソーシングの手法の利点も挙げた。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-mental-health-chatbots-kids-parents.html"],["周産期のパートナー暴力 母乳育児の早期開始を妨げる 約35万組を分析","豪ウーロンゴン大学の研究チームは、妊娠前後のパートナーからの暴力と母乳育児の関係を調べた17研究、約35万組の母子のデータを統合して分析した。暴力を受けた女性は、出産後1時間以内に授乳を始める割合が36％、生後6か月に母乳だけで育てている割合が50％低かった。一方、母乳を与える期間全体とは有意な関連がなかった。研究者は、周産期のケアで暴力の有無を確かめ、支援につなげるべきだとしている。","\n【概要】オーストラリアのウーロンゴン大学の研究チームが、周産期の親密なパートナーからの暴力（IPV）と母乳育児の関係について、世界の研究を統合した系統的レビューとメタ分析をBMC Pregnancy and Childbirth誌に発表した。暴力にさらされた女性では、早い授乳の開始と母乳だけでの育児が少なかった。\n【背景】世界保健機関（WHO）は、出生後1時間以内に授乳を始め、生後6か月までは母乳だけで育てることを勧めている。IPVはストレスやうつ、不安と結びつき、乳の出や母子の絆を乱しうるとされる。記事によると、この関係を世界のデータで数量的に統合したのは今回が初めてだという。\n【詳細】研究では、妊娠の12か月前から出産後12か月までを周産期とし、この間のIPVと母乳育児の結果との関係を調べた17研究、約35万組の母子のデータを統合した。その結果、身体的な暴力も心理的な暴力も、授乳開始の遅れや母乳だけの育児の少なさと関連していた。IPVを受けた女性は、出産後1時間以内に授乳を始める割合が36％低く、生後6か月の時点で母乳だけで育てている割合が50％低かった。一方、母乳を与える期間全体とは統計的に有意な関連はみられなかった。\n【ポイント・注意点】研究を率いた博士課程のゼラレム・アゼネ氏は、母乳育児は個人の要因で語られがちだが、関係の中での女性の安全と健康も重要で、暴力を受けた女性には非難ではなく支援が必要だと述べた。共著者のキャサリン・マクフェイル准教授は、暴力が赤ちゃんの健康にも影響しうると指摘し、支援の窓口は暴力の確認にとどまらず女性を助けるべきだとした。研究チームは、周産期ケアにIPVの評価を組み込むこと、妊娠中から幼児期まで心の傷に配慮した支援を行うこと、一人ひとりに合った授乳支援を用意すること、産科や精神保健、母乳支援、家庭内暴力の窓口が連携することを提言している。記事には研究の限界は書かれていない。記事は、暴力がもたらすストレスや抑うつ、不安が、乳の出や母子の絆に影響しうる点にも触れている。母乳育児の支援を考える際、家庭の中の安全にも目を向ける必要があることを示す報告といえる。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-intimate-partner-violence-barrier-breastfeeding.html"],["小児の骨のがん ユーイング肉腫の原因たんぱくを分解に導く薬 米研究","米ペンシルベニア州立大学の研究チームは、子どもや若者に多い骨のがんであるユーイング肉腫で、がんを動かす融合たんぱくEWS-FLI1を安定させている酵素CK2に着目した。CK2を阻害する薬CX-4945を使うとEWS-FLI1の分解が進み、がん細胞の移動や浸潤が抑えられ、マウスでは腫瘍の成長が遅れて生存が延びた。この薬を使う第1相試験が27病院で進んでいる。前臨床の段階の成果である。","\n【概要】ペンシルベニア州立大学医学部のチャンドリカ・ベフラ准教授（小児科）らのチームが、Molecular Cancer Therapeutics誌に、ユーイング肉腫の原因たんぱくを分解に導く手法を報告した。酵素CK2を阻害する薬CX-4945（シルミタセルチブ）が、前臨床のモデルで抗腫瘍効果を示した。\n【背景】ユーイング肉腫は、EWS-FLI1という融合たんぱくが病気を動かしているが、このたんぱくは薬で直接狙いにくい「創薬が難しい」標的とされてきた。記事によると、標準的な化学療法は30年以上変わっておらず、再発や転移をした場合の5年生存率は30％未満だという。\n【詳細】チームは、EWS-FLI1を安定させる酵素カゼインキナーゼII（CK2）に注目した。市販の細胞株と、小児がん研究の共同体Beat Childhood Cancer Research Consortium（BCC）から提供された患者由来の細胞にCX-4945を使い、遺伝子でCK2を減らす実験や、患者の腫瘍を移植したマウスでも調べた。BCCの遺伝子データも分析した。その結果、ユーイング肉腫の腫瘍にはCK2が多く、CK2の量や働きが高いほど経過が悪かった。CK2を減らすとEWS-FLI1の分解が進み、このたんぱくが動かすがんの経路が抑えられ、がん細胞は移動や浸潤の力を失った。遺伝子でCK2を減らしても同じ結果だった。マウスでは腫瘍の成長が遅れ、生存期間が延びた。培養細胞では抗がん剤イリノテカンと組み合わせても効果がみられた。\n【ポイント・注意点】ベフラ氏は、この病気でCK2を標的として示したのは初めてだとし、小児がんでは通常8〜10年かかる臨床試験への移行を素早く実現できたと述べた。現在、BCCとともに27病院で、再発した患者を対象にシルミタセルチブとイリノテカンを含む治療を組み合わせ、安全性と忍容性を確かめる第1相試験が行われている。その後は効果を確かめる第2相試験が予定されている。ただし成果は前臨床段階で、人での効果はまだ証明されていない。記事には細胞株や患者、マウスの数は示されていない。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-molecular-backdoor-destroys-undruggable-protein.html"],["妊娠中の抗精神病薬クエチアピン 新生児に離脱症状の1例 伊報告","イタリア・パヴィア県の病院の医師らは、双極性障害の治療で妊娠中ずっと抗精神病薬クエチアピンを1日700mg飲んでいた母親から生まれた男の子に、新生児薬物離脱症候群がみられた1例を報告した。生後5時間から甲高い泣き声、約24時間で震えが出たが、評価点は治療の基準を下回り、支える手当てだけで生後5日には症状が消えた。著者は、妊娠中の使用は禁止ではないが慎重な判断と長期の追跡が必要だとしている。","\n【概要】イタリアのヴィジェーヴァノ病院などの医師らが、Frontiers in Pediatrics誌に、妊娠中に抗精神病薬クエチアピンにさらされた新生児の離脱症状（新生児薬物離脱症候群、NAS）の症例を報告した。症状は集中的な治療なしに治まった。\n【背景】精神疾患の治療薬を妊娠中に続けるかどうかは、母親の病状と赤ちゃんへの影響を比べて判断する必要がある。論文が引く先行研究では、クエチアピンを使う女性21人で、臍帯血の濃度は母親の血中濃度の約24％だった。\n【詳細】母親は28歳で、双極性障害のため妊娠中を通してクエチアピンを1日700mg服用していた。甲状腺機能低下症は薬で管理され、薬物の使用や喫煙、飲酒はなかった。男の子は妊娠40週6日に経膣分娩で生まれ、体重3470g、身長54cmで、アプガースコアは1分、5分、10分とも10点だった。生後5時間ごろから甲高い泣き声が始まり、約24時間で軽い刺激による震えがみられ、入院中にさらに2回、自然に震えが起きた。母親の血中濃度は53ng/mLで、臍帯血は19ng/mL、赤ちゃんの血中濃度は23ng/mLだった。離脱症状を評価するフィネガンスコアを4時間ごとにつけたところ、最高は生後2日の6点で、すべて治療の基準を下回ったため、支える手当てだけを行った。母親の服用量が推奨量の2倍を超えていたため、人工乳を選んだ。脳や心臓、腹部の超音波検査では軽い両側の腎盂拡張だけがみられ、神経の診察は年齢相応だった。生後5日には症状が消え、生後9日に退院した。\n【ポイント・注意点】著者らは、妊娠中のクエチアピンの使用は「禁じられてはいない」とする一方、利益とリスクを慎重に比べること、生まれた子の神経発達を長く見守ることが必要だとしている。1例だけの報告であり、ほかの母子にそのまま当てはまるとは限らない。論文によると、母乳中への移行を調べた9人の報告では、体重で補正した赤ちゃんの摂取量は1日あたり体重1kgあたり0.01mg未満だった。また今回の母親の血中濃度53ng/mLは、論文が示す治療域の100〜500ng/mLを下回っていた。母子の血中濃度は先行研究の報告よりやや高かったと著者らは述べている。","2026-11-25","Frontiers in Pediatrics","https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2026.1970451/full"],["包茎の塗り薬治療で改善後 約3割が再発 年齢の低さなどと関連 中国","中国・南通第一人民医院の小児外科チームは、ステロイドの塗り薬で包茎がいったん改善した2〜14歳の男の子132人を平均約12か月追い、29.5％が再発したと報告した。再発の約8割は6か月以内に起きた。年齢が低いこと、最初の包茎が重いこと、亀頭包皮炎があること、治療後に包皮をむく習慣が保たれないことが再発と関連した。著者は、実際に使う前に前向き研究での確認が必要だとしている。","\n【概要】中国江蘇省の南通第一人民医院小児外科の研究チームが、Frontiers in Pediatrics誌に、ステロイド外用薬による包茎の保存的治療のあと、何が再発と関係するかを調べた後ろ向き研究を発表した。再発率は29.5％だった。\n【背景】子どもの包茎には、手術の前にステロイドの塗り薬を使う方法が広く用いられているが、いったん改善しても再び狭くなる例がある。どんな子が再発しやすいかが分かれば、経過観察の仕方を考える手がかりになる。\n【詳細】対象は、2023年1月から2025年1月に0.1％モメタゾンまたは0.05％ベタメタゾンで治療を受け、最初の治療で改善した2〜14歳の男の子132人。電子カルテのデータを使い、ロジスティック回帰などで分析した。平均の追跡期間は12.1か月で、39人（29.5％）が再発し、そのうち79.5％は6か月以内だった。年齢が1歳上がるごとに再発のオッズは0.51倍となり、年齢の低い子ほど再発しやすかった。最初の包茎が重い（グレード4〜5）場合はオッズ比2.49、亀頭包皮炎は2.03、治療後に包皮をむく習慣が十分に続かない場合は2.41だった。包皮の癒着もオッズ比2.32だったが、癒着だけの6人を除くと1.36で有意でなくなり、結果は不安定だった。再発のない割合は6か月で76.5％、12か月で70.5％だった。\n【ポイント・注意点】著者らは、年齢の低さ、重い初期の包茎、亀頭包皮炎、治療後の包皮をむく習慣の不足が再発と関連したとまとめた。ただし単一施設の後ろ向き研究で、再発の数が少なく、追跡期間も長期の結果を見るには短い。包皮をむく習慣などは保護者の報告に頼っており、分析の途中で変数を絞ったため過剰適合も否定できない。著者らは、経過観察の分け方や早めの手術の判断に使う前に、前向き研究での確認が必要だとしている。分析では、あらかじめ決めた9つの候補の要因を調べ、再発のない期間の推定や、300回の再標本化による内部検証も行った。著者らはこの分析を、仮説を生み出すための探索的なものと位置づけており、最初の治療で改善した子だけを対象にした点にも注意が要る。","2026-11-25","Frontiers in Pediatrics","https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2026.1975239/full"],["乳児の牛乳アレルギー 血液検査は負荷試験の代わりにならず 中国175人","中国・河南省鄭州の研究チームは、牛乳アレルギーが疑われた0〜24か月の子175人で、血液の抗体検査が実際に牛乳を飲ませる負荷試験の結果をどこまで当てられるかを調べた。牛乳への特異的IgEは、アレルギーの子を見つける力（感度）が5.56％にとどまり、特異的IgGは19.44％、総IgEは36.11％だった。著者は、これらの検査は負荷試験の代わりにならず、試験後の血球数の変化も診断には使えないとしている。","\n【概要】中国の鄭州工業応用技術学院の研究チームが、Frontiers in Pediatrics誌に、乳児の牛乳たんぱくアレルギー（CMPA）で、血液の抗体検査と血球数の変化が、牛乳を実際に飲ませる経口負荷試験の結果とどこまで一致するかを調べた研究を発表した。\n【背景】乳児の牛乳アレルギーの診断では、医療者の見守りのもとで牛乳を飲ませる負荷試験が基準とされる。血液検査だけで判断できれば負担は減るが、その精度は十分に確かめられていなかった。\n【詳細】2021年1月から2024年3月の記録を使った単一施設の後ろ向き研究で、牛乳アレルギーが疑われた0〜24か月の子235人のうち、条件を満たす175人を分析した。調べたのは牛乳の特異的IgE、特異的IgG、総IgEで、基準は見守りのもとでの非盲検の負荷試験と、陰性の場合の2週間の家庭での再開とした。負荷試験の前と24〜48時間後には血球数も測った。年齢の中央値は4.6か月で、72人（41.14％）がアレルギーと判定された。アレルギーの子を見つける力（感度）は、特異的IgEが5.56％、特異的IgGが19.44％、総IgEが36.11％にとどまった。アレルギーでない子を正しく見分ける力（特異度）はそれぞれ97.09％、84.47％、70.87％だった。診断の性能を示すAUCは0.520〜0.542で、偶然と区別できなかった。負荷試験後には好中球と好酸球がわずかに増えたが、白血球数や血小板、ヘモグロビンは変わらなかった。アナフィラキシーは起きなかった。\n【ポイント・注意点】著者らは、あらかじめ決めた基準値では、これらの抗体検査は負荷試験に代わるだけの感度がないと結論づけた。血球数の変化は探索的な結果で、診断に使うことは支持されないとしている。単一施設で、負荷試験が二重盲検ではなく、判定が血液検査の結果を知った上で行われたことなどが限界として挙げられている。特異的IgEが陽性だったのは、IgEが関わるとみられる反応15人中3人、混合型13人中1人で、IgEが関わらない反応44人では0人だった。血液検査が陰性でも、アレルギーがないとは言い切れないことを示す結果といえる。","2026-11-25","Frontiers in Pediatrics","https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2026.1970804/full"],["子どもの肺炎モデルで生薬成分が炎症を抑制 マウス50匹の実験 中国","中国・湖北省の宜昌市中心人民医院の小児科チームは、生後1週のマウスで細菌の成分による子どもの肺炎のモデルを作り、生薬由来の成分ツベイモシドIIの効果を調べた。ツベイモシドIIは呼吸機能の低下を元に戻し、肺の傷みや炎症を示す物質を減らした。炎症を進めるAKT/NF-κBの信号を止める働きが関わっていた。著者は臨床での検討に値する候補だとする一方、動物実験で毒性は調べていない。","\n【概要】中国の三峡大学附属の宜昌市中心人民医院小児科の研究チームが、Frontiers in Pediatrics誌に、子どもの肺炎を模したマウスのモデルで、生薬由来の成分ツベイモシドIIが炎症と肺の傷みを抑えたとする研究を発表した。\n【背景】肺炎は子どもの重い病気の一つで、過剰な炎症が肺を傷つける。炎症の信号を伝えるNF-κBなどの経路を抑える物質は、新しい治療の候補として研究されている。\n【詳細】実験には生後1週の雄のC57BL/6マウス50匹を使い、10匹ずつ5つのグループに分けた。細菌の成分であるリポ多糖（LPS）を体重1kgあたり2mg腹腔内に注射して肺炎のモデルを作り、ツベイモシドIIは体重1kgあたり4mgをLPSの1時間前に注射した。AKTという信号を活性化させる薬SC79を加えるグループも設けた。呼吸機能、肺の組織の傷みの点数、肺の水分、気管支を洗った液の中のたんぱくや細胞、炎症物質TNF-α、IL-6、IL-1βなどを調べた。その結果、LPSで一回換気量や分時換気量、最大の吸気・呼気の流れが下がったが、ツベイモシドIIはこれらを元に戻した。健康なマウスでは呼吸機能を変えなかった。肺の傷みの点数や肺の水分、洗浄液のたんぱく、好中球などの細胞の数、炎症物質も減った。ツベイモシドIIは、AKTとNF-κB p65のリン酸化を減らし、NF-κBが核に入るのを抑えていた。\n【ポイント・注意点】著者らは、ツベイモシドIIはAKT/NF-κBの信号を止めることで、肺炎のマウスの炎症と肺の傷みを和らげたとまとめ、臨床の肺炎でさらに評価する「有望な候補になりうる」としている。ただし、LPSのモデルは病原体が増える実際の感染を再現しないため、子どものウイルス性や細菌性の肺炎に当てはまるとは限らない。毒性や副作用も評価しておらず、人での効果は分かっていない。肺の組織の傷みの点数は、どのグループか分からない状態でつけられた。一方、細胞の中にとどまるNF-κB p65の量には有意な差がなかった。実験は治療の可能性を探る基礎研究の段階にあり、ほかの信号の経路は調べていない。","2026-11-25","Frontiers in Pediatrics","https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2026.1797049/full"],["子どもの脳と脊髄の動静脈奇形 72人を22年追跡 9割超が経過良好","米マウントサイナイ医科大学などのチームは、2003〜2025年の22年間に治療した18歳以下の脳と脊髄の動静脈奇形の子72人をまとめた。最初の症状は出血が52.8％で最も多かった。手術による切除を87.5％、血管の中からの塞栓術を72.2％、放射線治療を18.1％が受け、追跡できた68人全員で病変の消失を確認した。日常生活の自立度が良い子は来院時の66.7％から最終確認時に91.4％になった。","\n【概要】米ニューヨークのマウントサイナイ・アイカーン医科大学と米バージニア大学の脳神経外科のチームが、Frontiers in Pediatrics誌に、子どもの脳と脊髄の動静脈奇形（AVM）72人の症状、血管の形、治療の結果をまとめた報告を発表した。\n【背景】AVMは動脈と静脈が異常につながる血管の病気で、破れると脳出血を起こす。子どもの症例は少なく、家族への説明や治療の判断に使える、まとまったデータが求められている。\n【詳細】2003〜2025年の22年間に、1人の脳神経外科医が担当した18歳以下の72人を後ろ向きに調べた。70人が頭蓋内（脳実質のAVM67人、ガレン大静脈瘤3人）、2人が脊髄の病変だった。来院時の年齢の中央値は12歳で、45.8％が女の子だった。最初の症状は出血が38人（52.8％）、偶然の発見が20人（27.8％）、けいれんが12人（16.7％）、神経の症状が2人（2.8％）だった。重さで分けられた脳のAVM67人のうち55.2％が最も軽いクラスAだった。治療は手術による切除が63人（87.5％）、血管の中からの塞栓術が52人（72.2％）、放射線治療が13人（18.1％）で、複数を組み合わせることが多かった。追跡期間の中央値は5.1年で、追跡できた生存者68人全員で、画像検査で病変の完全な消失を確認し、再発はなかった。日常生活の自立度を示すmRSが0〜2の良い状態の子は、来院時の66.7％から最終確認時には91.4％（70人中64人）になった。合併症は記録のある63人中14人（22.2％）で、出血に関連して2人が亡くなった。\n【ポイント・注意点】著者らは、比較や因果を主張するものではなく、家族への説明の参考や今後の比較研究の土台になるデータだとしている。単一施設・単一の外科医の経験で、治療した子だけを含み、比較の群がない。病変の消失や自立度の評価も治療チーム自身が行っており、結果の解釈には注意が必要だ。論文は、重い病変や深い場所の病変、脊髄の病変も含まれていたと記している。追跡期間は合計395人年に及んだ。","2026-11-25","Frontiers in Pediatrics","https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2026.1937877/full"],["慢性肺疾患の早産児 約5人に1人が肺高血圧に 9研究2431人を統合","中国・広西の梧州紅十字会医院のチームは、妊娠32週未満で生まれ、慢性の肺の病気である気管支肺異形成症（BPD）がある早産児を対象とした9研究、2431人のデータを統合した。肺高血圧を合併する割合は19.7％だった。在胎週数に比べて小さく生まれたこと（オッズ比7.38）、重いBPD、動脈管開存症の重い型や結紮手術が合併と関連した。著者は、見守りの優先度を決める手がかりになるとしている。","\n【概要】中国の梧州紅十字会医院小児科の研究者が、Frontiers in Pediatrics誌に、気管支肺異形成症（BPD）のある早産児で肺高血圧（PH）がどのくらい起き、何と関連するかを調べた系統的レビューとメタ分析を発表した。BPDに伴うPHの頻度は約5人に1人だった。\n【背景】BPDは早産児に多い慢性の肺の病気で、肺の血管に負担がかかる肺高血圧を合併すると経過が悪くなるとされる。どの赤ちゃんで起きやすいかを知ることは、心臓の超音波検査による見守りを計画するうえで重要になる。\n【詳細】研究は国際的な登録を行ったうえで、2026年6月1日までにPubMedなど4つのデータベースを検索した。対象は妊娠32週未満で生まれたBPDの早産児で、PHは心臓の超音波検査で確認されたものとした。条件を満たした9研究、2431人を分析し、うち8つのコホート研究（2211人）で頻度を求めた。研究はアジアから4件、英国または米国から5件だった。BPDに伴うPHの頻度は19.7％で、研究ごとに12.2％から28.3％と幅があった。調整後のオッズ比は、在胎週数に比べて小さく生まれた（SGA）ことが7.38と最も強く、重いBPDが5.16、血行に影響する動脈管開存症が3.80、動脈管の結紮手術が3.29だった。1研究ずつ除いて分析しても、結果は有意なままだった。\n【ポイント・注意点】著者らは、BPDの早産児の約5人に1人がPHを起こし、SGAとの関連が最も強かったとまとめ、見守りの優先順位をつける助けになりうるとしている。一方で、研究間のばらつきが大きく、PHの診断基準も研究ごとに異なる。多くが後ろ向き研究で、分析に使えた研究は10件未満と少ないため、結果は慎重に受け止める必要がある。研究は国際的なレビューの手順に沿って報告されており、各研究の質は7〜8点と評価された。在胎週数の割に小さく生まれた子や重いBPDの子では、とくに注意深い見守りが求められるといえる。動脈管開存症の時期別に分けた探索的な分析では、遅くまで閉じない動脈管でオッズ比が5.42と高かった。","2026-11-25","Frontiers in Pediatrics","https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2026.1988221/full"],["新生児の採血などの痛み 薬を使わない24の方法を比較 37試験を分析","中国・臨沂市婦幼保健院の新生児集中治療室のチームは、針を使う処置の痛みを和らげる薬以外の方法を比べた37のランダム化比較試験をネットワークメタ分析でまとめた。処置直後の痛みは、イヤーマフや目隠し、24％ショ糖とおしゃぶりの組み合わせなどで減り、5分後は複数の感覚への刺激や糖液が優れていた。ただ、すべての指標で一貫して最も良い方法はなく、順位だけで選ぶべきではないとしている。","\n【概要】中国の臨沂市婦幼保健院新生児集中治療科のチームが、Frontiers in Pediatrics誌に、新生児の採血など針を使う処置の痛みに対する薬以外の方法を比べた系統的レビューとネットワークメタ分析を発表した。\n【背景】新生児集中治療室（NICU）の赤ちゃんは、採血や注射などの痛みを伴う処置を何度も受ける。甘い液やおしゃぶり、音や光の調整など、薬を使わない方法がいくつも試されてきたが、どれがより効くのかを直接比べた研究は限られていた。\n【詳細】研究は国際的な登録を行い、PubMedなど5つのデータベースを検索した。NICUで針を使う処置を受けた新生児を対象に、24の方法を調べた37のランダム化比較試験を集め、複数の方法を同時に比べられるネットワークメタ分析で解析した。通常のケアと比べて、処置直後の痛みの点数を下げたのは、イヤーマフ、複数の方法の組み合わせ、目隠し、24％ショ糖とおしゃぶりの組み合わせ、24％ショ糖だった。イヤーマフが最上位だったが、根拠となる研究は少なかった。処置5分後の痛みでは、複数の感覚への刺激、30％ブドウ糖、24％ショ糖が通常のケアより優れていた。心拍数は複数の感覚への刺激や組み合わせ、ホワイトノイズで下がり、血中の酸素の割合はクラシック音楽、ショ糖とおしゃぶり、ホワイトノイズ、録音した母親の声で改善した。\n【ポイント・注意点】著者らは、すべての指標で一貫して優れた方法はなく、効果は時点や指標によって違う可能性があるとし、順位の指標だけで方法を選ばないよう勧めている。直後の痛みの比較の多くは確実性が低いと評価され、ネットワークの一部では結果の食い違いもみられた。イヤーマフや目隠しの根拠は少なく、在胎週数や処置、痛みの尺度も研究ごとに異なる点に注意が必要だ。論文によると、処置5分後の痛みでは、複数の感覚への刺激の効果の大きさ（標準化平均差）がマイナス2.40、30％ブドウ糖がマイナス2.13、24％ショ糖がマイナス1.60だった。研究ごとの偏りの危険性も評価され、比較の確からしさは専用の手法で格付けされた。","2026-11-25","Frontiers in Pediatrics","https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2026.1985461/full"],["新生児のRSウイルス予防薬 受け入れ94.9％ 母の学歴で差 伊ボローニャ","イタリア・ボローニャの大学病院のチームは、2024〜2025年の流行期に生まれた正期産児982人で、RSウイルスを防ぐ抗体薬ニルセビマブを産科病棟で全員に勧めた結果を調べた。受け入れたのは94.9％で、母親の学歴が高いほど受け入れが多かった。細気管支炎で小児救急を受診したのは、投与した子の1.2％、しなかった子の12.0％で、投与は受診のオッズの大きな低下と関連していた。","\n【概要】イタリアのボローニャ大学病院（IRCCS AOUBo）などのチームが、Frontiers in Pediatrics誌に、全ての新生児に勧めたRSウイルス予防の抗体薬ニルセビマブの受け入れと、その背景にある家庭の特徴、RSウイルス細気管支炎との関係を調べた研究を発表した。\n【背景】RSウイルスは乳児の細気管支炎の主な原因で、流行期には小児救急の受診が増える。長く効く抗体薬ニルセビマブの導入が進むなか、どんな家庭で受け入れが進みにくいかを知ることは、公平な予防の実現に欠かせない。\n【詳細】対象は、2024年10月〜2025年3月に同院で生まれた妊娠37週以上の赤ちゃん982人で、前年の同じ時期に生まれた995人を比較の群とした。新生児集中治療室などに入った子は除いた。予防の受け入れは退院前の保護者の書面の同意とし、ボローニャの2つの小児救急で、検査で確かめられたRSウイルス細気管支炎による受診を調べた。受け入れたのは932人（94.9％）だった。母親の学歴別の受け入れは、大学など高等教育で96.8％、高校相当で92.6％、それ未満で92.0％だった。調整後、高等教育と比べたオッズ比は、高校相当で0.422、それ未満で0.381だった。RSウイルス細気管支炎による受診は、予防を受けた子で1.2％（932人中11人）、受けなかった子で12.0％（50人中6人）で、予防は受診のオッズの低下（オッズ比0.098）と関連した。きょうだいがいることは細気管支炎のなりやすさと関連した。\n【ポイント・注意点】著者らは、産科病棟で勧めると受け入れは高いが、母親の学歴で差が出るとし、それぞれに合わせた説明が公平な利用を支えうるとしている。ただし、予防を受けなかった群の受診は6件と少なく、割り付けは無作為ではない。調べた救急は2か所で、かかりつけ医で対応した軽い例は含まれていない。地理的な出身による差は探索的な結果で、人数が少なく信頼区間も広い。複数の比較に対する補正も行われていない。論文は、予防の対象が10月から3月に生まれた正期産児に限られ、一般化には限界があるとしている。","2026-11-25","Frontiers in Pediatrics","https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2026.1975543/full"],["室内の粗い粒子が多い家 川崎病の発症が少ない傾向 エコチル3846組","富山大学などの研究チームは、出生コホート「エコチル調査（Japan Environment and Children's Study）」の3846組の母子で、家の中の空気の粒子と6歳までの川崎病の発症を調べた。粗い粒子（PM10–2.5）の濃度が最も高い群は、最も低い群に比べて発症のオッズが58％低かった。微小粒子PM2.5でも似た傾向があったが有意ではなかった。研究者は、粒子が病気を防ぐ証拠ではないと強調している。","\n【概要】富山大学と青森県立保健大学の研究者らのチームが、International Journal of Hygiene and Environmental Health誌に、家庭の室内の粒子状物質と6歳までの川崎病の発症の関係を調べた研究を発表した。粗い粒子が多い家の子ほど、川崎病になりにくい傾向がみられた。\n【背景】川崎病は主に乳幼児に起きる全身の血管の炎症で、原因はまだ分かっていない。これまで屋外の大気汚染との関係は調べられてきたが、子どもが長い時間を過ごす家の中の空気については十分に分かっていなかった。\n【詳細】研究には、出生前から子どもを追う全国の出生コホート「エコチル調査」の3846組の母子のデータを使った。子どもが1歳半と3歳の時に、それぞれ1週間、家の中の微小粒子（PM2.5）と粗い粒子（PM10–2.5）を測り、平均した。6歳までの川崎病の発症を追い、影響しうる要因を調整して分析した。その結果、59人が川崎病を発症し、累積の発症は単胎の出生1000人あたり15.34人だった。粗い粒子の濃度で3つの群に分けると、最も高い群は最も低い群に比べて、発症のオッズが58％低かった（調整後のオッズ比0.42）。PM2.5でも似た傾向があったが弱く、統計的に有意ではなかった（オッズ比0.67）。\n【ポイント・注意点】研究を率いた教授は、川崎病の発症を考える際に、屋外の大気だけでなく家庭の室内環境も考える大切さを示す結果だと述べている。一方で研究チームは、この結果は予想外のもので、因果関係を示すものではなく、室内の粒子が川崎病を防ぐという証拠として受け取るべきではないと強調している。今後は、粒子に含まれる微生物の成分や家庭の特徴を調べ、ほかの要因の影響を検討し、関連を確かめる必要があるという。前向きの出生コホートで、家庭ごとに2回測定した点が強みとされる。家の中の粒子の測定値は、2回の測定の間である程度一致していた（級内相関係数はPM2.5で0.52、粗い粒子で0.55）。屋外の測定では見落とされる室内の曝露をとらえられる可能性があるという。","2026-11-24","Medical Xpress","https://medicalxpress.com/news/2026-11-unexpected-link-coarse-particles-indoor.html"],["妊娠中の喫煙 4歳男児の発達得点が約4点低く エコチル調査4000人","妊娠中に母親が喫煙していた場合、4歳の男の子で認知・適応の発達と全体の発達の得点が約4点低い傾向があることが、日本の大規模出生コホート「エコチル調査」の解析で示された。福島県立医科大学や国立環境研究所などのチームが尿中コチニンで喫煙を判定し、2歳児4326人、4歳児4000人の発達検査を分析した。女の子や2歳時点でははっきりした差は見られず、研究チームは臨床的な意味はまだ不確かだとしている。","\n【概要】\n妊娠中の母親の喫煙が、子どもの発達に男女で異なる形で関わっている可能性を示す研究が、科学誌「Scientific Reports」に掲載された。福島県立医科大学と国立環境研究所を中心とする全国の研究者が、「子どもの健康と環境に関する全国調査（エコチル調査）」のデータを解析した。母親が能動喫煙していた4歳の男の子は、認知・適応と全体の発達得点が低い傾向にあった。\n\n【背景】\n妊娠中の喫煙は赤ちゃんの健康悪化と結び付けられてきたが、幼児期の発達への影響が男女でどう違うかははっきりしていなかった。これまでもADHDや自閉スペクトラム症との関連が調べられてきたが、自閉症については研究ごとに結果が分かれていた。胎児期の環境が後の健康を左右するという考え方では、男女で影響の受けやすさが違う可能性も指摘されている。\n\n【詳細】\nエコチル調査は2011年1月から2014年3月に全国15地域で妊婦を登録した出生コホート。発達検査を受けた一部の子のうち、2歳児4326人、4歳児4000人を最終解析に含めた。喫煙は、妊娠中期または後期の尿に含まれるニコチンの分解物コチニンで測定し、基準値でクレアチニン1グラムあたり36.8マイクログラムを超えると能動喫煙、それ以下を非喫煙・受動喫煙とした。発達は、訓練を受けた検査者が対面で行う「新版K式発達検査2001」で評価し、年齢相応を100とする発達指数で比べた。母親の学歴や飲酒、心理的苦痛などの影響を調整した。その結果、母親が能動喫煙していた男の子は、非喫煙・受動喫煙の母親の男の子に比べ、認知・適応で約3.8点、全体で約3.7点低いと推定された。言語・社会でも約3.6点低かったが、根拠は弱かった。女の子では差が小さく、結論は出なかった。2歳時点では男女とも明確な差はなかった。\n\n【ポイント・注意点】\n男の子での負の関連を示す根拠は強かったものの、研究が定めたより厳しい基準は満たしておらず、臨床的な意味はまだ不確かだ。男女差を直接比べた検定でも、はっきりした差は確認できなかった。喫煙は1回の尿検査だけで判定し、2区分にしか分けていないため、喫煙量との関係は調べられていない。胎盤の反応やDNAメチル化の男女差が背景にある可能性が挙げられているが、測定はされておらず未確認だ。研究チームは、成長に沿って追う長期の研究が必要だとしている。","2026-11-24","News-Medical","https://www.news-medical.net/news/20261124/Smoking-during-pregnancy-may-leave-a-different-developmental-mark-on-boys.aspx"],["ADHDと不安症の子 脳の働き方で3タイプ 診断前から兆し 米研究","米スタンフォード大学医学部などのチームは、米国の大規模調査ABCD研究の子どもの脳画像をAIで解析し、ADHDや不安症にかかわる脳のつながり方に3つのタイプがあることを見つけた。衝動性や規則違反が目立つ型、罪悪感や不安が目立つ型、注意の問題やいらだちが目立つ混合型に分かれた。後に診断を受けた子でも、最初の脳画像にすでにタイプの特徴が表れていた。研究は脳の働きに着目した。","\n【概要】米スタンフォード大学医学部が主導し、米アイオワ大学などが加わった研究チームが、Nature Mental Health誌に、注意欠如・多動症（ADHD）と不安症にかかわる脳の3つの「バイオタイプ」を報告した。診断名だけでは分からない子どもの違いを、脳の働き方からとらえる試みだ。\n【背景】ADHDと不安症は同時に起きることが多く、症状に基づく診断だけでは、一人ひとりに合った治療を選ぶのが難しい。記事によると、効く薬を見つけるまでに数週間から数か月かかることもある。\n【詳細】研究には、9〜10歳で参加した1万1000人以上の米国の子どもを追うABCD研究のデータを使った。入る時点でADHDか不安症、またはその両方と診断されていた3508人、後に診断を受けた693人、どちらもない1947人を分析した。全員がfMRIによる脳画像と認知・行動の評価を受けていた。チームは、脳の領域どうしのつながりに診断や行動のデータを組み合わせたAIのモデルを作り、別の調査の224人でも確かめた。その結果、「認知・行動の不調」と「感情・注意の不調」という2つの軸が見つかり、それぞれ異なる脳のネットワークと結びついていた。その組み合わせから、衝動性や攻撃性、規則違反が多くADHDの診断が多い型、罪悪感や完璧主義、不安や抑うつの症状が多く不安症の診断が多い型、注意の問題やいらだち、自傷が多い混合型の3つが分かれた。最も驚きだったのは、後に診断を受けた子でも、最初の脳画像にすでにタイプの特徴が表れていたことだという。\n【ポイント・注意点】共同責任著者のユー・ジャン氏は、バイオタイプが早期の目印となり、より早い支援につながる可能性があると述べた。ただし症状に基づく診断に取って代わるとは考えておらず、両方を組み合わせることで、子どもごとに合う治療を選ぶ助けになることを期待しているという。今後は、治療が各タイプの脳の働きにどう影響するかを試験で確かめたいとしている。記事には研究の限界は示されていない。研究には米テキサス大学オースティン校やペンシルベニア大学の研究者も加わった。","2026-11-24","ScienceDaily","https://www.sciencedaily.com/releases/2026/11/261124055713.htm"],["思春期に脳の回路を止めたマウス 大人になって人付き合いの意欲が低下","米オハイオ州立大学の研究チームは、前頭前野から報酬や意欲にかかわる腹側線条体へつながる脳の回路を、マウスの思春期に一時的に止めると、大人になってから他のマウスと関わろうとする意欲が下がることを見つけた。大人のマウスで止めた場合は、止めている間だけ一時的に下がるにとどまった。研究者は、思春期が社会的な行動の配線にとって特に大切な時期である可能性を示すとしている。","\n【概要】米オハイオ州立大学心理学部のローレンス・クトゥリエ准教授の研究室が、思春期のマウスで脳の特定の回路の働きを止めると、大人になってからの社会的な意欲が下がるという予備的な成果を、米国神経科学会の年次大会「Neuroscience 2026」でポスター発表した。\n【背景】研究チームが注目したのは、前頭前野から腹側線条体へ信号を送る回路だ。腹側線条体は報酬や意欲、喜びにかかわる部位である。思春期がこの回路の発達にとって敏感な時期なのか、またその時期に回路を乱すと行動に長く影響が残るのかを調べた。\n【詳細】まず、互いに知らないマウス2匹を同じケージに入れて撮影する社会的な交流のテストを、さまざまな年齢で行い、行動の基準を定めた。研究チームは思春期のマウスのほうが大人より社会的な意欲が高いと予想し、実際にそうした結果が得られた。次に、特定の神経細胞の働きをオンやオフにする技術を雄と雌のマウスに使った。思春期に回路を静かにすると、そのマウスは大人になってから社会的な意欲が低くなった。一方、大人のマウスで回路を静かにした場合は、止めている間だけ他のマウスへの探索が一時的に減るにとどまった。\n【ポイント・注意点】クトゥリエ氏は、思春期が社会的な行動の配線にとって特に重要な時期である可能性を示す結果だと述べ、10代の若者が友人を求める強い気持ちになぞらえた。マウスの思春期は約3週間で、人の前頭前野は25歳ごろに最後に成熟する部位だという。ただし成果は予備的なもので、学術誌での発表ではなく、記事には匹数や効果の大きさも示されていない。動物実験は人の行動を完全には再現できないことも研究者自身が認めている。今後は、コロナ禍での10代の孤立のような社会的な隔絶の影響なども調べたいとしている。研究チームは、回路の通常の発達の仕方を知ることが、発達が通常とは異なる道をたどった場合の理解につながるとしている。将来は、統合失調症に似た社会的なひきこもりなどの特徴をもつマウスも調べる予定だという。研究はホワイトホール財団の助成を受けた。","2026-11-24","News-Medical","https://www.news-medical.net/news/20261124/Disrupting-a-brain-pathway-during-adolescence-reduces-adult-social-motivation.aspx"],["ザンビアの10代の少女 HIV検査の経験率が6割から5割弱に低下","ザンビア大学などの研究者は、4回の人口保健調査に参加した15〜19歳の少女1万1717人のデータを分析した。HIV検査を受けたことがある割合は2007年の23.0％から2018年に60.9％まで上がったが、2024年には49.3％に下がった。低下は妊娠経験のない少女や都市部で大きく、妊婦健診を通じた検査以外の場で起きていた。著者は、妊婦健診以外の入り口が必要だとしている。","\n【概要】ザンビア大学公衆衛生学部、同国保健省、ザンビア国立公衆衛生研究所の研究者が、PLOS ONE誌に、思春期の少女のHIV検査の受検が近年逆戻りしていることを示す分析を発表した。2018年から2024年にかけて、検査を受けたことがある割合がはっきり下がっていた。\n【背景】HIVの流行が続く地域では、若い女性が早く検査を受けて自分の状態を知ることが、予防と治療の出発点になる。ザンビアでは妊婦健診での検査が大きな役割を果たしてきたが、それ以外の少女がどれだけ検査を受けているかが課題だった。\n【詳細】研究では、2007年、2013〜14年、2018年、2024年の4回の人口保健調査に参加した15〜19歳の少女計1万1717人のデータをまとめ、調査の重みをつけたロジスティック回帰や、変化の要因を分ける分解分析を行った。検査を受けたことがある割合は、2007年の23.0％から2018年に60.9％まで上がったが、2024年には49.3％に下がった。最近の検査で結果を受け取った割合も、2018年の47.4％から2024年に31.2％に下がった。調整後の2018〜2024年の変化はマイナス11.4ポイントだった。妊娠したことのない少女では16.9ポイント下がった一方、妊娠経験のある少女では2.7ポイント上がった（有意ではない）。都市部の低下はマイナス15.6ポイントで、農村部のマイナス6.9ポイントより大きかった。妊娠経験は検査経験の強い予測因子で、調整後のオッズ比は9.79だった。人口構成の変化で説明できる低下は5％未満で、自己検査の利用は両年とも約2％にとどまった。\n【ポイント・注意点】著者らは、低下はほぼすべて妊婦健診の経路の外で起きたとし、思春期の検査を立て直すには妊婦健診以外の入り口が必要だと結論づけている。ただし横断的な調査で、検査の経験は自己申告に基づき、2018年と2024年の間のデータはない。どこで、なぜ検査を受けたかも分からない点に注意が必要だ。研究チームは、検査の機会を妊婦健診以外にも広げる工夫が必要だとしている。","2026-11-24","PLOS ONE","https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0363627"],["エチオピア農村の5歳未満児 4人に1人が下痢 手洗いや予防接種と関連","エチオピアのジンマ大学などの研究者は、同国中部の東グラゲ県の農村で、生後6〜59か月の子を持つ母親など840人を調べた。直近2週間に子どもが下痢をした割合は25.7％だった。大事な場面での手洗いを行う母親は39.3％、水の塩素消毒は3.2％にとどまった。手洗い、石けんの使用、ふた付きの水の容器、はしかの予防接種、トイレがあることなどが下痢の少なさと関連していた。","\n【概要】エチオピアのジンマ大学とブタジラ保健センターの研究者が、PLOS ONE誌に、同国中部の東グラゲ県の農村で5歳未満の子どもの下痢の多さと、それに関係する要因を調べた横断研究を発表した。直近2週間の下痢の割合は25.7％だった。\n【背景】下痢は幼い子どもによくみられる病気で、安全な水、衛生的なトイレ、手洗いといった水と衛生（WASH）の改善が予防の柱とされる。この調査は、母親の手洗い教育や家庭での水の塩素消毒の効果を比べる4つの群のクラスターランダム化試験の、開始時の調査として行われた。\n【詳細】調査は2025年9月11〜25日に、4つの地区から無作為に選んだ28のクラスターで行い、生後6〜59か月の子を持つ母親や養育者840人が回答した。回答率は100％で、子どもの平均月齢は32.8か月だった。直近2週間に下痢をした子は25.7％で、試験の群の間で差はなかった。大事な場面で手を洗っていた母親は39.3％、水の塩素消毒をしていたのは3.2％だった。多変量の分析では、母親の年齢が24〜34歳であること（オッズ比0.38）、大事な場面での手洗い（0.20）、石けんと水の使用（0.09）、水の容器にしっかりふたをすること（0.17）、きれいな容器（0.47）、はしかの予防接種（0.07）、30分未満で水を汲めること（0.26）、トイレがあること（0.28）が、下痢の少なさと関連していた。\n【ポイント・注意点】著者らは、この地域の下痢の負担は大きく、政府や地元当局、支援団体が連携してWASHの取り組みを強める必要があると結論づけている。ただし横断研究のため因果関係は分からず、思い出しの偏りや望ましい答えをしやすい偏りも考えられる。知識や実践を測る尺度の信頼性が低かった点も、結果を読む際の注意点となる。調査は世界保健機関（WHO）の水と衛生の点検表をもとにした質問票を使い、16人の調査チームが現地の言葉で行った。この試験では、手洗い教育、塩素消毒、その両方、対照の4つの群で、今後効果が比べられる予定だ。","2026-11-24","PLOS ONE","https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0363559"],["退院後の子の追跡 弱い立場の家庭ほど連絡が遅れる ウガンダ6074人","カナダのサイモン・フレーザー大学やブリティッシュコロンビア小児病院などの研究者は、敗血症の疑いでウガンダの6病院に入院した5歳未満の子6074人の退院後の追跡を分析した。予定から60日超遅れた追跡は全体の18.9％で、低栄養やHIV、母親の学歴の低さ、2時間超の移動、予定外の退院などと関連した。遅れは死亡とは関連しなかったが、再入院の把握の少なさと関連していた。","\n【概要】カナダのサイモン・フレーザー大学とブリティッシュコロンビア小児病院、ウガンダの研究者らが、PLOS ONE誌に、子どもの退院後の死亡を調べる研究で、追跡の遅れがどんな家庭で起き、結果にどう影響するかを分析した研究を発表した。\n【背景】低・中所得国では、重い病気で入院した子どもが退院後に亡くなる例が少なくない。こうした退院後の死亡を調べる研究では電話などで家族を追跡するが、連絡がつきにくい家庭があると、データが偏るおそれがある。\n【詳細】研究は、2017年7月から2020年3月に敗血症の疑いでウガンダの6病院に入院した5歳未満の子の前向きコホートを二次分析した。登録された6545人のうち6190人が生きて退院し、追跡できなかった116人（1.9％）を除く6074人を分析した。退院後2、4、6か月に連絡をとり、予定から60日を超えて完了した場合を「遅れ」とした。2か月ごとの単位1万7951件のうち、3392件（18.9％）が遅れていた。遅れと関連したのは、腕の周囲長で測った低栄養（オッズ比1.30）、HIV（1.46）、呼吸の苦しさ（1.15）、意識の異常（1.22）、2時間を超える移動（1.39）、母親の学歴の低さ（1.94）、母親のHIV（1.38）、蚊帳がないこと（1.36）、処理していない水（1.42）、予定外の退院（1.72）などだった。6か月以内に376人が亡くなり、その70.7％は最初の60日以内だった。遅れは死亡とは関連しなかった（ハザード比0.97）が、最初の再入院の把握が少ないこと（0.53）と関連していた。\n【ポイント・注意点】著者らは、追跡の難しさは社会的に弱い立場の家庭に集中しており、欠けたデータが結果を偏らせうると指摘し、今後の研究では感度分析を行うべきだとしている。一方で、小さな死亡の差を見るには対象数が足りず、通常の診療にそのまま当てはまるとは限らない。関連は因果関係を意味しない点にも注意が必要だ。研究チームは、質の高い医療を目指す仕組みには確かなデータが欠かせないとも記している。","2026-11-24","PLOS ONE","https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0362607"],["メタの和解策 10代のSNS利用への効果は限定的 米1803人の端末データ","米メタ社が複数の州との和解で約束した10代向けのSNS利用制限について、効果は限られるとする研究結果を、米シアトル小児研究所などが医学誌JAMAに発表した。10代1803人のスマートフォンの利用記録を分析すると、インスタグラムとフェイスブックはSNS利用時間全体の約2割にとどまり、残りの約8割はスナップチャットやTikTok、YouTubeだった。他社が同じ制限を取り入れなければ、夜間の利用などへの効果は小さいと研究者は指摘している。","\n【概要】\n米メタ社が複数の州との和解で最大170億ドルを支払い、自社のSNSに大きな変更を加えることになった。米シアトル小児研究所などのチームは、この和解策が10代のSNS利用に与える影響は限られるとする研究レターを医学誌JAMAに発表した。研究を率いたディミトリ・クリスタキス博士は、制限は正しい方向への一歩だが、他社が続かなければ大きな違いは生まないとデータは示していると述べている。\n\n【背景】\n10代のSNS利用、とくに深夜の利用は睡眠を妨げるとして懸念されてきた。今回の和解では、1日の利用時間の上限、夜間の利用の遮断、通知の制限といった対策が盛り込まれた。ただし対象はメタ社のアプリに限られ、他社の参加を前提とした第2段階は、他社が加わらない限り進められない。\n\n【詳細】\n研究チームは、米国の大規模な脳発達研究「ABCD研究」に参加するアンドロイド端末の利用者1803人について、2020年11月から2025年8月に集めた端末の利用データを分析し、3つの対策の最大の効果を見積もった。メタ社のアプリ（インスタグラムとフェイスブック）は1日のSNS利用時間の約20％で、残る約80％はスナップチャット、TikTok、YouTubeが占めた。1日2時間の利用上限をメタ社のアプリだけに適用すると対象になる10代は7.7％だが、5つのアプリ全体に広げると63.1％に増える。午前0時から6時までの利用遮断は、メタ社のアプリでは利用者の77.8％、5つ全体では88.3％に影響する。一方、第1段階では午後10時から0時までは制限がなく、この2時間の利用量は0時から6時までとほぼ同じだった。午後10時から午前7時までの通知停止は、メタ社のアプリで64.4％、5つ全体なら86.2％が対象になる。\n\n【ポイント・注意点】\n米ストーニーブルック大学のローレン・ヘイル教授は、深夜の利用制限は睡眠に役立つはずだが、他社のアプリが同じ制限をしなければ10代は単に別のアプリへ移るだけかもしれないと指摘する。制限をすり抜ける方法を10代がどこまで見つけるかも分からないという。クリスタキス博士は、深夜の画面は脳を興奮させ、睡眠の質を乱すため、午後10時以降の制限が重要だと強調する。なお、両氏はSNSをめぐる訴訟で専門家証人を務めている。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-meta-settlement-limited-impact-teen.html"]]};

function curCat(){return cats[catIdx]}
function curItems(){return itemsOf(curCat())}
function curArtIdx(){const n=curItems().length;if(!n)return 0;let i=artIdxMap[curCat().id]||0;if(i>=n)i=n-1;if(i<0)i=0;return i}
function renderStage(dir){
  cats=allCats(); if(catIdx>=cats.length)catIdx=cats.length-1; if(catIdx<0)catIdx=0;
  const c=curCat(), items=curItems(), ai=curArtIdx();
  const total=cats.reduce((s,x)=>s+(DATA[x.id]||[]).length,0);
  document.getElementById('heroText').innerHTML="<b>今日のまとめ — 全"+cats.length+"ジャンル・"+total+"件。</b> タイトルと概要は日本語、カードの「和訳全文を読む」で全文が開きます。新しい順に並べ、48時間より古い記事はグレー表示です。";
  document.getElementById('catName').textContent=c.name;
  document.getElementById('catDesc').textContent=c.desc||"";
  document.getElementById('catCount').textContent="ジャンル "+(catIdx+1)+" / "+cats.length;
  document.getElementById('catDots').innerHTML=cats.map((x,i)=>'<button class="dot'+(i===catIdx?' active':'')+'" data-cat="'+i+'" aria-label="'+x.name+'へ移動"></button>').join('');
  document.querySelectorAll('#catDots .dot').forEach(d=>{d.onclick=()=>{const n=+d.dataset.cat; if(n!==catIdx){const dd=n>catIdx?'down':'up'; catIdx=n; renderStage(dd);}}});
      const slot=document.getElementById('cardSlot');
  if(!items.length){
    slot.innerHTML='<article class="card"><div class="empty"><div class="big">✦</div><p><b>'+c.name+'</b> は追加されたばかりの項目で、まだ記事がありません。</p><p>毎日の更新でこの項目の記事が集まると、ここに表示されます。<br>上スワイプで他のジャンルへ移動できます。</p></div></article>';
    document.getElementById('artDots').innerHTML=""; document.getElementById('artCount').textContent="0 / 0"; return;
  }
  const it=items[ai], a=it.a, old=isOld(a[3]);
  slot.innerHTML='<article class="card'+(old?' old':'')+(dir?' anim-'+dir:'')+'">'
    +'<img class="ph" src="'+IMGS[c.img]+'" alt="'+c.name+'のイメージイラスト">'
    +'<div class="cbody"><div class="meta"><span class="badge'+(old?' oldb':'')+'">'+(old?'少し前':'NEW')+'</span><span>'+a[3]+'</span><span>'+(ai+1)+' / '+items.length+'</span></div>'
    +'<h3>'+a[0]+'</h3><p class="sum">'+a[1]+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="openArticle(\''+c.id+'\','+it.oi+')">和訳全文を読む</button>'
    +'<button class="btn ghost" onclick="quickMemo(\''+c.id+'\','+it.oi+',this)">メモ保存</button>'
    +'<button class="btn ghost" onclick="shareArticle(\''+c.id+'\','+it.oi+')">共有</button></div>'
    +'<div class="src">出典：'+a[4]+'<br><a href="'+a[5]+'" target="_blank" rel="noopener">原文を開く</a></div></div></article>';
  document.getElementById('artDots').innerHTML=items.map((x,i)=>'<span class="dot'+(i===ai?' active':'')+'"></span>').join('');
  document.getElementById('artCount').textContent="記事 "+(ai+1)+" / "+items.length;
  requestAnimationFrame(fitCard);
}

function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;
  const sum=card.querySelector('.sum'), h3=card.querySelector('h3'), ph=card.querySelector('.ph');
  let ss=14, hs=Math.min(21, Math.max(17, window.innerWidth*0.044)), phh=ph?Math.round(ph.getBoundingClientRect().height):0; const ph0=phh;
  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }
    if(hs>13){ hs-=0.5; if(h3) h3.style.fontSize=hs+'px'; continue; }
    break;
  }
}
window.addEventListener('resize', fitCard);
function nextArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i>=n-1)return;artIdxMap[curCat().id]=i+1;renderStage('next')}
function prevArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i<=0)return;artIdxMap[curCat().id]=i-1;renderStage('prev')}
function nextCat(){if(catIdx>=cats.length-1)return;catIdx++;renderStage('down')}
function prevCat(){if(catIdx<=0)return;catIdx--;renderStage('up')}
/* ===== スワイプ操作（スクロールではなくスワイプで移動） ===== */
const stage=document.getElementById('stage');
let sx=null, sy=null, swipedAt=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;
  swipedAt=Date.now();
  if(Math.abs(dx)>Math.abs(dy)){ dx<0?nextArt():prevArt(); } else { dy<0?nextCat():prevCat(); }
});
stage.addEventListener('click',e=>{ if(Date.now()-swipedAt<120){e.stopPropagation();e.preventDefault();} },true);
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')nextArt(); else if(e.key==='ArrowLeft')prevArt();
  else if(e.key==='ArrowDown'){e.preventDefault();nextCat();} else if(e.key==='ArrowUp'){e.preventDefault();prevCat();}
});
/* ===== 項目の追加 ===== */
document.getElementById('addCatBtn').onclick=()=>{document.getElementById('newCatName').value="";document.getElementById('newCatDesc').value="";document.getElementById('addDlg').showModal()};
document.getElementById('addCatSave').onclick=()=>{
  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast("項目名を入力してください");return}
  const desc=document.getElementById('newCatDesc').value.trim()||"追加された項目";
  const id='custom-'+Date.now();
  extraCats.push({id:id,name:name,desc:desc,img:'hero'}); DATA[id]=[];
  cats=allCats(); catIdx=cats.length-1;
  document.getElementById('addDlg').close(); renderStage('down');
  toast("項目「"+name+"」を追加しました");
};
/* ===== 記事ダイアログ・メモ・共有 ===== */
function openArticle(cat,idx){
const c=allCats().find(x=>x.id==cat); const a=DATA[cat][idx];
document.getElementById('dlgIn').innerHTML=`<img src="${IMGS[c.img]}" alt=""><div class="meta" style="margin-top:10px"><span>${c.name}</span><span>${a[3]}</span></div><h3>${a[0]}</h3><p class="sum" style="font-size:14px">${a[1]}</p><div class="full">${a[2]}</div>
<p class="src" style="margin-top:12px">出典：${a[4]} — <a href="${a[5]}" target="_blank" rel="noopener">${a[5]}</a></p>
<div class="memoBox"><label style="font-weight:800;font-size:14px">ひとことメモ</label><textarea id="memoText" placeholder="気づいたこと、作りたいもの、家族への共有メモなど"></textarea>
<div class="actions"><button class="btn primary" onclick="saveMemo('${cat}',${idx})">このメモを保存</button><button class="btn ghost" onclick="shareArticle('${cat}',${idx})">iPhoneで共有</button><button class="btn ghost" onclick="document.getElementById('dlg').close()">閉じる</button></div></div>`;
document.getElementById('dlg').showModal();
}
function quickMemo(cat,idx,btn){const a=DATA[cat][idx];memos.unshift({cat,title:a[0],note:"",date:a[3]});updateMemoUI();btn.textContent="保存しました";btn.classList.add('saved');toast("メモに保存しました（このページを開いている間）")}
function saveMemo(cat,idx){const a=DATA[cat][idx];const note=document.getElementById('memoText').value.trim();memos.unshift({cat,title:a[0],note,date:a[3]});updateMemoUI();toast("メモを保存しました");document.getElementById('dlg').close()}
function updateMemoUI(){document.getElementById('memoCount').textContent=memos.length;const area=document.getElementById('memoList');
if(!memos.length){area.innerHTML='<p class="sum">まだメモがありません。記事の「メモ保存」をタップしてください。</p>';return}
area.innerHTML=memos.map(m=>`<div class="memoItem"><b style="font-size:14px">${m.title}</b><div style="font-size:13px;color:var(--muted)">${m.note||"（ひとことメモなし）"} ・ ${m.date}</div></div>`).join('')}
function exportMemos(){if(!memos.length){toast("まだメモがありません");return}const txt="MAI topic メモ — 2026-11-10\n\n"+memos.map((m,i)=>`${i+1}. ${m.title}\n${m.note||""}\n`).join("\n");const b=new Blob([txt],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="mai-topic-memo-2026-11-10.txt";a.click();URL.revokeObjectURL(u)}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}} try{await navigator.clipboard.writeText(text);toast("コピーしました — メモアプリなどに貼り付けできます")}catch(e){toast("共有できませんでした")}}
function shareArticle(cat,idx){const a=DATA[cat][idx];shareText(a[0],`${a[0]}\n\n${a[1]}\n\n出典：${a[4]} ${a[5]}`)}
function shareMemos(){if(!memos.length){toast("まだメモがありません");return}shareText("MAI topic メモ",memos.map(m=>`・${m.title} ${m.note}`).join("\n"))}
document.getElementById('sharePage').onclick=()=>shareText("MAI topic","MAI topic — 2026年11月26日朝版（全"+cats.length+"ジャンル）");
document.getElementById('memoBtn').onclick=()=>{updateMemoUI();document.getElementById('memoDlg').showModal()};
updateMemoUI();
renderStage();
</script>

<script>
try {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
} catch (e) {}
</script>
