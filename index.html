取り組みが進んでおり、日本でも各研究の情報を生かした、より大規模な解析や、異なる地域・集団での結果の検証が重要だとしている。\n【詳細】JBiCCには、国立成育医療研究センター、北海道大学、東北大学東北メディカル・メガバンク機構、東北医科薬科大学、千葉大学、浜松医科大学、愛媛大学、東京大学、山形大学、大阪大学、九州大学という、国内9つの出生コホート研究を行う研究機関が参加し、合わせて5万6000組を超える母子が研究対象となっている。各コホートでは、妊娠期の栄養状態や喫煙などの生活習慣、妊娠・出産の経過、出生時の状態、子どもの身体発育や神経発達など多様な情報を集めている。共同解析では、研究課題に応じて項目や定義を調整し、各コホートの解析結果を統合する方法と、個人情報の保護に配慮して個人単位のデータを統合する方法を使い分ける。これまでに、妊娠中の喫煙と妊娠高血圧症候群の関連や、妊娠前のやせ・妊娠中の体重増加不足と在胎不当過小児（SGA）の出生の関連、SGAと子どもの運動協調機能との関連などを報告してきた。\n【ポイント・注意点】すべての項目が全コホートで共通して測られているわけではない。今回の論文は新しい発見ではなく、研究基盤の全体像を示した「コホート・プロファイル」で、論文の掲載日は2026年10月8日。今後は連携を深め、異なる地域や集団の結果の共通点や違いを明らかにして、母子保健施策や予防の取り組みに役立つ根拠を積み重ねるという。","2026-11-19","東京大学大学院医学系研究科","https://www.m.u-tokyo.ac.jp/news/PR/2026/release_20261119.pdf"],["まれな脳の発達の病気の子に個別の遺伝子治療を カナダ・マギル大が道筋","カナダ・マギル大学の研究チームは、まれな神経発達症の子どもに個別の遺伝子治療を届けやすくする枠組みを発表した。患者の血液から同じ変異を持つ脳細胞を作り、病気を調べて治療の候補を試す。実例として、クリーフストラ症候群の子ども1人のために実験的なRNA治療を開発し、細胞で試した。人での試験にはさらに研究が必要だという。論文はThe American Journal of Human Geneticsに掲載された。","\n【概要】まれな神経発達症を持つ子どもに、一人ひとりに合わせた遺伝子治療を届けやすくするための枠組みを、カナダ・マギル大学の研究チームがThe American Journal of Human Geneticsに発表した。遺伝子の診断と個別の治療の検討を結び付ける道筋を示している。患者自身の細胞を使って治療の候補を試す点が特徴だ。\n【背景】記事によると、こうした病気の原因となる遺伝子の変化はごく少数の患者にしか見られないことがあり、多くの子どもに治療への現実的な道がない。論文の題は「神経発達症のための臨床診断と介入遺伝学の統合」。チームは、診断から個別の治療の検討までを一続きにする仕組みを提案した。\n【詳細】筆頭著者で同大の博士課程のジュリア・マッキントッシュ氏は、診断を手がかりに遺伝子に基づく治療を設計する方法だと説明する。上席著者のカール・エルンスト教授は、マギル大学とケベック州のCHUサント＝ジュスティーヌの協力による成果だとし、世界の遺伝子診断の拠点にも役立つことを期待している。流れはまず血液を採り、そこから患者と同じ遺伝子変異を持つ脳細胞を作る。この細胞を使って、実験室で病気を調べ、治療の候補を試す。方法を示すため、チームはクリーフストラ症候群の子ども1人のために実験的なRNA治療を開発して試した。クリーフストラ症候群は、発達の遅れや知的障害、話すことやコミュニケーションの難しさを起こすことがある、まれな遺伝性の病気だ。\n【ポイント・注意点】この実験的な治療は実験室の細胞で試されただけで、人で試すまでにはさらに研究が必要だ。著者らは、必要な技術の多くはすでにあり、課題はそれらを医療の仕組みに組み込み、より多くの患者が恩恵を受けられるようにすることだとしている。記事は治療の効果を示す数値や、実用化の時期の見通しを示していない。マッキントッシュ氏は神経学・脳神経外科学科に、エルンスト教授は精神医学科に所属し、教授は「ザ・ニューロ」の介入遺伝学ユニットの長も務める。記事は、この論文が査読を経たものだとしている。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-approach-aims-treatment-accessible-children.html"],["ジャンクフードは子どもの心と学業に影響 豪州の17研究をまとめたレビュー","豪フリンダース大学の研究チームは、オーストラリアの子どもと若者の食生活と健康の関係を調べた17の研究をまとめた。エネルギーが高く栄養の乏しい食べ物や甘い飲み物を多くとると、心の健康や幸福感、学業成績が悪い傾向があった。果物や野菜、全粒穀物、魚の多い食事は、心の健康や認知、学業の良さと関連した。心臓や代謝への影響の結果はまちまちだった。論文はCurrent Nutrition Reportsに掲載。","\n【概要】子ども時代や思春期の食生活の悪さが、心の健康や認知、学業成績と関連していることを、オーストラリア各地のデータをまとめたレビューで豪フリンダース大学の研究チームが示した。論文はCurrent Nutrition Reportsに掲載された。研究には同大医学・公衆衛生学部などの研究者が加わった。\n【背景】記事によると、別の研究では8〜13歳の子どもの3人に1人が心の健康の問題を訴えている。オーストラリアの子どもの慢性疾患の負担の多くは、食生活の悪さや長すぎるスクリーン時間、運動不足といった変えられる行動によって生じているとされる。\n【詳細】レビューは17の研究の結果をもとにしている。西オーストラリア州のレイン研究に参加した親子のデータや、南オーストラリア州、ビクトリア州などの子どもの食事の情報が含まれる。エネルギーが高く栄養の乏しい食べ物や甘い飲み物を多くとることは、若者の心の健康や幸福感、学業成績の悪さと関連していた。果物、野菜、全粒穀物、魚の多い健康的な食事は、心の健康や認知、学業の良さと関連した。一方、心臓や代謝の健康については結果がまちまちで、著者らは食事の定め方をより標準化する必要があるとしている。筆頭著者のゼゲイェ・アベベ・アビテウ博士は、添加物や保存料、飽和脂肪、砂糖、塩の多いジャンクフードを控えれば早くから良い習慣が身につくと述べ、親や教育者、若者への食の教育が必要だとした。上席著者のヨハネス・メラク准教授は、子どもが育つ大切な時期に健康的な食事には明らかな利点があると述べた。\n【ポイント・注意点】著者らは、早い時期から健康的な食事を促す的を絞った介入や公衆衛生の取り組みを求め、食事や食べ物の入手を左右する社会経済的な要因への対処も必要だとする。炎症を減らす可能性がある抗酸化作用のある食品にも注目している。生活費の高騰が健康的な選択を難しくしているとも指摘した。結果はレビューによる関連で、記事は全体の参加者数や効果の大きさを示しておらず、因果関係かどうかも述べていない。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-junk-food-affects-cognition-mental.html"],["「前世を覚えている子」報道の裏側 選択の偏りの可能性を研究者が指摘","子どもが前世を覚えているとする報道について、因果推論の専門家ホルヘ・アンドレス・デルガド＝ロン氏がThe Conversationで解説した。米バージニア大学の研究部門は60年以上にわたり事例を集めてきたが、予期せぬ死ほど次の誕生までの期間が短いという結果は、報道に残りやすい死ほど照合で見つかりやすいという偏りで説明できる可能性があるという。筆者は前向きの研究が必要だとする。","\n【概要】「子どもは前世を覚えているのか」という見出しの報道について、因果推論の専門家ホルヘ・アンドレス・デルガド＝ロン氏が解説サイトThe Conversationで背景を論じ、Medical Xpressに転載された。自身の研究の報告ではなく、論考の形をとっている。データの集め方そのものが結果をゆがめうる点に注意を促す内容だ。\n【背景】米バージニア大学の知覚研究部門（DOPS）は60年以上にわたり、前世を思い出しているように見える子どもの情報を集めてきた。デジタル化されたデータベースには2254件の記録があり、1件あたり200を超える項目がある。公開データとして出された照合済みの1678件から、DOPSの研究者は、予期せぬ死ほど次の誕生までの「中間期間」が短いという関連を報告し、広く報じられた。\n【詳細】筆者は、照合に使われる報道の記録にはニュースになりやすい死ほど残りやすいため、この選択の偏りがパターンを説明しうると指摘する。また筆者は、3歳のときにスペインの闘牛士だったと話し、腰の上のあざを指したという子どもの例を紹介している。家族は9年前にエクアドルのキトに住んでおり、両親ともスペインを訪れたことはなかった。中南米でこうした事例が研究されることはまれだという。記事は生物学の話題にも触れ、マイケル・レビン氏の扁形動物の実験、連想による記憶が世代を越えて伝わる可能性を示した2023年の線虫の研究、まだ発表されていない10歳の共同研究者によるチョウの研究を紹介している。偏りの問題については、元DOPS所長のジム・タッカー氏が2026年4月のシンポジウムで示した予備的な結果も紹介された。最初にバージニア州の母親を手近に集めて調べたところ、タッカー氏は割合が高すぎると考えたという。そこで11項目の評価を作り、5〜13歳の子を持つ英語を話す米国の母親を全国を代表するように調べたところ、6.9%がこうした感情的に意味のあるやり取りがあったと答えたという。\n【ポイント・注意点】筆者は、こうした報告は生まれ変わりを立証するものではなく、子どもの発達を前向きに追うコホート研究が必要だとしている。記事は全国調査で調べた母親の人数を示していない。子どもの発達の研究として受け止めるには、慎重さが必要な話題だといえる。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-children-reincarnation-headlines.html"],["VRの「脱出ゲーム」で理科を学ぶ中学生 自分で操作した生徒の伸びが大きく","米ジョージア大学の研究者は、7年生（日本の中学1年生に相当）85人が仮想現実（VR）の脱出ゲームと読む活動を組み合わせて科学の基本を学ぶ授業を調べた。VRの中で自分で物を操作した生徒は、級友の操作を画面で見ていた生徒より、実験室の安全や器具の知識の伸びが有意に大きかったが、差は比較的小さかった。協働の場面では、家で主に英語を話す生徒が議論を主導しがちだった。論文はEducation and Information Technologiesに掲載。","\n【概要】VRのゴーグルをつけた中学生が「アインシュタインの幽霊」を科学の実験室から脱出させる。そんな脱出ゲーム型の授業で、自分で仮想空間を操作した生徒の方が、見ているだけの生徒より学びが大きかったことを、米ジョージア大学の研究者が報告した。論文はEducation and Information Technologiesに掲載された。\n【背景】研究を率いたのは、同大教育学部のアイチュー・エリシャ・ディン准教授。ディン氏は研究者になる前、台湾で英語を教えていた。生徒はゲームの中で戸棚を探し、装置を調べ、謎を解きながら、科学的な方法や実験室の安全、実験の進め方を学ぶ。ゴーグルは高価なため、チームは生徒がVRと読む活動などを順番に回る「ステーション・ローテーション」の形をとった。\n【詳細】ディン氏は、VRと従来の読む活動を組み合わせて科学の基本的な実践を学ぶ7年生85人を調べた。一部の生徒は仮想空間で直接物を操作し謎を解き、ほかの生徒は共有画面で級友の様子を見た。研究者は、級友を見ることで協力や言葉のやり取りが促され、複数の言語を使う生徒に役立つと予想していた。しかし結果は、直接参加した生徒の方が、実験室の安全や器具の知識で有意に大きな伸びを示した。ただし、その差は比較的小さかった。ディン氏は、協働学習が役立つとする研究が多いだけに驚いたと話す。仮想空間に体で関わることには、見ているだけでは再現しきれない学びの機会がある可能性があるという。また協働の場面では、家で主に英語を話す生徒が議論を主導しがちで、複数の言語を使う生徒の一部は黙ったままだった。\n【ポイント・注意点】複数の言語を使う生徒は14人だけで、言語の違いに関する結果は予備的なものとされている。記事は効果の大きさや統計の数値を示していない。ディン氏は、複数の言語を使う生徒が十分に参加し、自分の考えを言葉にする力を得られるよう、言葉での説明に加えて絵や体の動き、実物を使った実演も取り入れることを勧め、教師が生徒の貢献が大事にされていると感じられる場を作ることを求めている。","2026-11-18","Phys.org","https://phys.org/news/2026-11-science-virtual-room.html"],["赤ちゃんが日常で見る顔に「典型的な表情」はまれ 米カンザス大の研究","米カンザス大学などの研究チームは、生後6〜17か月の乳児の家庭で毎月1時間ずつ撮った録画を分析し、赤ちゃんが日常で目にする表情を調べた。感情研究でよく使われる大げさな笑顔やしかめ面のような典型的な表情はまれで、最も多い喜びでも、顔全体が見える時間の12%にとどまった。感情は文脈の中で学ばれるとして、研究のあり方に疑問を投げかけている。論文はCommunications Psychologyに掲載された。","\n【概要】乳児の感情の理解を調べる研究でよく使われる大げさな表情を、赤ちゃんが日常生活で目にすることはまれだと、米カンザス大学の研究者らが報告した。論文はCommunications Psychologyに掲載された。論文の題は、6〜17か月の乳児が目にする顔には仮説上の典型的な感情表現がほとんど含まれない、という趣旨だ。\n【背景】感情の研究では、喜びを表す歯を見せた大きな笑顔や、怒りを表す大きなしかめ面など、進化の中で保たれた普遍的な感情と結び付けられる「典型的な表情」が、乳児の実験にもよく使われてきた。こうした表情は、赤ちゃんの感情の理解を調べる道具として広く使われている。研究チームは、赤ちゃんが実際の家庭でどのような顔を見ているのかを確かめた。\n【詳細】筆頭著者のケイティ・ホーマン助教が、ジェフリー・M・ジラード准教授と共同で研究を率いた。チームは、生後6〜17か月の乳児の家庭で毎月1時間ずつ撮影した既存の録画データを使い、乳児が目にした顔と表情を記録した。データの多くは米ラトガース大学の研究者が集めて記録したもので、ノースイースタン大学とマサチューセッツ総合病院のリサ・フェルドマン・バレット氏、カリフォルニア大学デービス校のリサ・M・オークス氏も加わった。その結果、典型的な表情を赤ちゃんが見ることはまれだった。最も多かったのは喜びの表情だったが、乳児が顔全体を見られた時間に限っても、完全に一致したのはその12%にとどまった。\n【ポイント・注意点】ホーマン氏は、顔の動きは文脈によって意味が変わり、感情の学びは状況の中に埋め込まれていると主張する。赤ちゃんはより幅広い手がかりから学んでいるとみられるという。今回の結果は家庭での日常の経験を調べたもので、赤ちゃんが実験の課題で感情を見分けられるかを扱ったものではない。記事は乳児の人数や録画の総時間を示していない。現在は、「気持ち悪い」などの養育者の感情に関わる言葉との関係を調べており、この言葉の研究はラトガース大学のシャノン・M・ブレイディ氏が率いている。","2026-11-17","Medical Xpress","https://medicalxpress.com/news/2026-11-babies-rarely-exaggerated-facial-emotion.html"],["子ども時代のスクリーン時間、8年後の認知と関連 フィンランドの追跡研究","フィンランドのユヴァスキュラ大学の研究チームは、PANIC研究の260人を8年間追い、子ども時代のスクリーン時間が長いほど10代での認知処理が良い傾向を見つけた。研究者は、時間の長さより画面で何をするかが大事だと指摘する。女子では軽い身体活動、男子では指導のある運動が作業記憶と関連した。結果は関連を示すもので、因果関係ではない。論文はPediatric Exercise Scienceに掲載。","\n【概要】フィンランドのユヴァスキュラ大学の研究チームが子どもたちを8年間追跡したところ、子ども時代のスクリーン時間が長いほど、思春期の認知処理が良い傾向が見られた。スクリーン時間は常に害があるという思い込みに疑問を投げかける結果で、論文はPediatric Exercise Scienceに掲載された。\n【背景】研究は長期にわたるPANICプロジェクトの一部で、子ども時代の身体活動や座って過ごす時間、スクリーン時間が、のちの認知機能とどう関係するかを調べた。スクリーン時間は害があると考えられがちだが、チームは長期的な関係を追跡データで確かめた。\n【詳細】分析対象は260人（女子124人、男子136人）で、思春期の評価時の平均年齢は15.8歳だった。身体活動と座って過ごす時間は、質問票と、心拍と動きを測る装着型の機器の両方で測った。認知は、学習、注意、作業記憶を調べるCogStateの検査で評価した。筆頭著者で博士課程の研究者ペトリ・ヤランコ氏は、大事なのはスクリーン時間に何をしているかだと述べる。著者にはマルヤ・H・レッパネン氏、ティモ・A・ラッカ氏、エーロ・A・ハーパラ氏らが名を連ねる。性別による違いもあり、女子では子ども時代の軽い強度の身体活動が多いほど、男子では組織的なスポーツなど指導のある運動が多いほど、思春期の作業記憶が強かった。意外なことに、指導のない身体活動が少ないと答えた10代の方が認知の成績が良かった。一方、装着型の機器で測ると、全体の身体活動や座っている時間と認知との関連は見られなかった。記事は、機器では勉強や問題解決をしているのか、ただ休んでいるのかを区別できないためだと示唆している。\n【ポイント・注意点】結果は関連を示すもので、因果関係ではない。スクリーン時間を増やせば考える力が伸びるとか、運動を減らすと認知に良いということを示すものではない。介入研究や、身体活動の強度についてのさらなる研究が必要とされる。記事は効果の大きさを示していない。研究者は画面で何をしているかという中身に目を向けるべきだと示唆しており、時間の長さだけで良し悪しを決めることには慎重さが求められる。","2026-11-17","ScienceDaily","https://www.sciencedaily.com/releases/2026/11/261116014725.htm"],["学校のスマホ禁止で学力は伸びる？ 米国の分析では効果は「控えめ」","米国では40を超える州が学校での携帯電話を制限する法律を作った。ハーバード大学教育政策研究センターの研究は、4〜10年生の数学と読解の得点を過去5学年度分、4600校の330万人で分析し、一日中ポーチに携帯電話を閉じ込める厳しい制限の学校では学力の伸びが「控えめ」に大きく、年に1〜2週間分の学びに相当すると推計した。一方、全米経済研究所（NBER）の別の研究は、試験の得点への効果は「ほぼゼロ」としている。","\n【概要】学校でのスマートフォン禁止が子どもの学びを伸ばすのかについて、米国で相次ぐ研究の結果をAP通信がまとめ、Phys.orgが掲載した。厳しい禁止には「控えめ」な効果があるという研究と、効果は「ほぼゼロ」とする研究があり、評価は分かれている。\n【背景】記事によると、ここ数年で米国の40を超える州が学校での携帯電話を制限する法律を作った。ただし法律の中身は州によって大きく異なり、ルールや取り締まりはばらばらだという。携帯電話と学びの関係ははっきりしないと記事は述べている。\n【詳細】ハーバード大学教育政策研究センターが率い、同大のトーマス・ケイン教授らが著者となった研究は、全米の4600校、330万人の4〜10年生について、過去5学年度の数学と読解の得点を分析した。携帯電話を一日中鍵付きのポーチに入れる厳しい制限の学校では、制限のない似た学校と比べて学力の伸びが「控えめ」に大きく、その差は年に1〜2週間分の学びに相当すると推計された。この上乗せは、スマートフォンが普及してから続く年ごとの得点低下の約半分にあたる。ケイン教授は、禁止は伸びに良い効果があるが「万能薬ではない」と述べた。一方、5月に出された全米経済研究所（NBER）の研究は、別の標準テストの得点や携帯電話の位置情報、教員への調査、ポーチの提供会社のデータを使い、試験の得点への効果は「ほぼゼロ」と結論づけた。ただし高校では、特に数学で3年間に「控えめな良い効果」が見られた。著者の一人であるスタンフォード大学のトーマス・ディー氏は、初期の結果はおおむね期待外れで、数年分の小さく不安定な推計から先を見通すことには慎重であるべきだと話す。\n【ポイント・注意点】サンディエゴ州立大学の心理学者ジーン・トウェンギ氏は、予備の携帯電話や、ポーチに携帯の形をした石を入れるといった抜け道があり、取り締まりが弱いことが多いと指摘する。ノートパソコンでSNSを使う例もあるという。ケイン教授は、学校の外での使用こそが「大きな問題」だとし、SNS企業の利用データが子どもの学業成績と結び付けて調べられたことはないと述べた。長期的な効果はまだ分からない。","2026-11-17","Phys.org","https://phys.org/news/2026-11-school-students-gains-modest.html"],["小さな赤ちゃんを「カンガルーケア」で守る 49試験をまとめた最新レビュー","コクランの最新レビューは、低出生体重児や早産児を肌と肌を合わせて抱き、母乳育児と早期退院を組み合わせる「カンガルーケア」が、通常の新生児ケアより死亡や重い感染症をおそらく減らすと結論づけた。49の無作為化比較試験、7724人の新生児を含み、2016年版の2倍を超える研究数となった。特に資源の乏しい環境で効果がはっきりしていた。WHOは1日8時間以上を勧めている。","\n【概要】低出生体重や早産で生まれた赤ちゃんへの「カンガルーケア」が、死亡や重い感染症をおそらく減らすことを、コクランの最新のシステマティック・レビューが示した。カンガルーケアは、肌と肌を合わせて赤ちゃんを抱くこと、頻繁で母乳だけの授乳、適切な場合の早期退院を組み合わせたものだ。\n【背景】前回の2016年版のレビューは、世界保健機関（WHO）の指針の根拠となった。WHOは現在、1日に少なくとも8時間のカンガルーケアを勧め、可能なら長時間の肌の触れ合いを促している。\n【詳細】今回のレビューには、低出生体重児または早産児7724人を含む49の無作為化比較試験が入った。研究数は2016年版の2倍を超え、論文はコクラン・システマティック・レビュー・データベースに掲載された。通常の新生児ケアと比べて、カンガルーケアは入院中の死亡や院内感染、敗血症をおそらく減らし、母乳だけで育てる割合を高め、低体温の発生を減らす可能性もあった。効果は特に資源の乏しい環境で明らかで、根拠の多くは低・中所得国の研究から得られた。筆頭著者でスウェーデン・エーレブロー大学のエマ・オルソン博士は、最も弱い新生児の死亡が減ったことが最も印象的な結果だと述べ、試験の数が前回の更新の2倍になったことで根拠が強まったと話した。\n【ポイント・注意点】共著者の米バーモント大学のロジャー・ソル博士は、どれだけ行えば十分か、多いほど良いのか、どう提供するのが最善かは、まだ確信を持って言えないと話す。長い時間ほど効果が大きいかを判断する根拠は不十分だった。高所得国では根拠の確かさが低く、死亡率がすでに非常に低い新生児集中治療室での当てはまりは今後の課題だ。毎日長時間の触れ合いはすべての親にとって現実的ではない可能性もあり、著者らは親子を一緒にいさせる仕組み全体の一部として捉えるべきだとしている。今後は、どんな場面で最もよく効くか、どの赤ちゃんが最も恩恵を受けるか、医療の仕組みの中でどう広げるか、時期や長さで結果が変わるかを調べる必要があるという。","2026-11-16","Medical Xpress","https://medicalxpress.com/news/2026-11-kangaroo-small-babies.html"],["毎日の鉄剤で子どもと10代の鉄欠乏性貧血が減る 114研究を分析","米コーネル大学の研究者が率いたコクランのレビューは、5万人を超える子どもと10代を含む114の研究をまとめ、毎日の鉄剤の服用が鉄欠乏性貧血をおそらく減らすと結論づけた。身長や体重、せきや発熱などのよくある病気には影響がなかった。便の変色や、配合によっては嘔吐が増えることもあった。著者らは、すべての子が毎日鉄をとる必要があるわけではないと強調する。論文はコクランのデータベースに掲載。","\n【概要】毎日鉄剤を飲むことで、子どもと10代の鉄欠乏性貧血がおそらく減ることを、米コーネル大学の精密栄養・健康センターの研究者が率いたコクランのレビューが示した。論文はコクラン・システマティック・レビュー・データベースに掲載された。\n【背景】記事によると、貧血は世界で推定8億7400万人の子どもと女性に影響しており、最も負担が大きいのは幼い子どもで、2019年には5歳未満の子の40%が貧血だった。その約半数は鉄の不足によるものとされる。2016年に最後に更新された世界保健機関（WHO）の指針では、長期的な影響についての根拠が足りないことが示されていた。\n【詳細】レビューは、5万人を超える子どもと10代を含む114の研究をまとめた。鉄だけ、鉄と葉酸、鉄とほかのビタミンやミネラルの組み合わせを毎日飲む方法を調べた。研究の多くはアジアで行われ、5歳未満の子どもが中心だった。鉄だけの服用は、何もしない場合や偽薬と比べて鉄欠乏性貧血をおそらく減らした。鉄と葉酸もおそらく減らすが、この結論は1つの研究だけに基づく。鉄とほかのビタミンやミネラルの組み合わせも減らす可能性があった。一方、鉄だけの服用は、同じ年齢・性別の子と比べた身長や体重に影響せず、せきや発熱、呼吸器の病気などのよくある病気にも影響しなかった。副作用はおおむね軽く、便の変色が増える可能性があった。鉄をほかのビタミンやミネラルと組み合わせると、鉄を含まない同じ補助食品より嘔吐がおそらく増えた。\n【ポイント・注意点】上席著者のサウラブ・メータ博士は、貧血や鉄欠乏そのものを含むいくつかの結果で根拠の確かさが低い、または非常に低いと述べた。著者らは、結果は鉄剤を支持するものの、すべての子どもや10代が毎日鉄をとる必要があるという意味ではないと強調する。個々の栄養の必要や、地域の鉄欠乏や貧血の多さ、製剤の種類を考えて判断すべきだとしている。共著者のジュリア・L・フィンケルスタイン博士も、鉄の不足が心配される地域では鉄剤を続けることをデータが支持すると述べた。","2026-11-16","Medical Xpress","https://medicalxpress.com/news/2026-11-daily-iron-supplements-deficiency-anemia.html"],["親の関わりを感じる10代ほど、ネットいじめの被害者を助けようとする","イスラエルのヘブライ大学などの研究チームは、10代のネット生活を6つの面から調べる43項目の質問票を作り、2つの集団の計617人で試した。親が自分のネット生活に関わり話をしてくれると感じる10代ほど、ネットいじめを目にしたとき共感し、被害者を支えると答えた。親の関わりは、ネットの利用時間や有害な情報に触れる量とはほとんど関係がなかった。論文は国際いじめ予防学術誌に掲載。","\n【概要】親が自分のネット上の生活に関わり、話をしてくれていると感じている10代ほど、ネットいじめを目にしたときに被害者を助けようとすると答える傾向があることを、イスラエルのヘブライ大学エルサレム校などの研究チームが報告した。論文はInternational Journal of Bullying Preventionに掲載された。研究にはテルアビブ・ヤッフォ大学のヒラ・セガル博士も加わった。\n【背景】スクリーン時間、ネットいじめ、子育ては、これまで別々の問題として扱われることが多かった。チームはこれらをまとめて調べるため、10代のデジタル生活を6つの面から調べる43項目の「オンライン行動質問票（OBQ）」を開発した。6つの面は、ネットの利用の量と使い方、有害な情報に触れること、ネットいじめを見たときの気持ち、どう反応するか、親とのやり取りと関わりの受け止め方だ。\n【詳細】質問票は、2つの独立した集団の計617人の若者で試された。参加者は、見た目や成績、体形をからかうといった現実的なネットいじめの場面を示され、どう感じ、どう反応するかを問われた。質問票は2つの集団でほぼ同じ構造を示し、研究の道具として使えることが支持された。親の関わりとやり取りを強く感じている10代ほど、ネットいじめを目にしたときに共感的な気持ちを持ち、被害者を支える反応をすると答えた。一方、親の関わりの受け止め方は、ネットの利用時間や有害な情報に触れる量とは弱い関連しかないか、関連がなかった。研究者は、親の関わりはネットから遠ざけることより、害が起きたときの反応の仕方に結び付いている可能性があるとし、共感的な傍観者を育てるのに利用時間を減らす必要は必ずしもないと示唆している。この質問票は将来、ネットいじめが悪いと分かっていても介入をためらう10代や、いじめを軽く見たり加わったりする10代など、リスクと守りのさまざまなパターンを見分けるのに役立つ可能性があるという。\n【ポイント・注意点】研究は自己申告に基づく一時点の調査で、親の関わりが共感的な行動を生むと断定はできない。研究者は、この質問票は主に研究用であり、広く使うには文化や集団をまたいだ研究や長期の研究が必要だとしている。記事は参加者の年齢や国を示していない。","2026-11-16","Medical Xpress","https://medicalxpress.com/news/2026-11-teens-greater-parental-involvement-cyberbullying.html"],["ペットは子どもの心に良い 親の4人に3人 ただし世話の手伝いも期待","米ミシガン大学C.S.モット小児病院の全国調査で、6〜12歳の子を持つ親1037人の4人に3人が、ペットは子どもの心の健康に役立つと答えた。ペットを飼う家庭では約3分の2の子が餌やりや運動・遊びを手伝い、約半数の親は子どもが毎日世話を手伝うべきだと考えていた。ペットのいない家庭の10人に7人は子どもにペットをせがまれていた。調査の共同責任者は、年齢に合った役割と手本を示すことを勧めている。","\n【概要】多くの親はペットが子どもの心の健康に良いと考える一方、学齢期の子どもには世話を手伝ってほしいと期待していることが、米ミシガン大学ヘルスC.S.モット小児病院の「子どもの健康に関する全国世論調査」で分かった。Medical Xpressが紹介した。\n【背景】調査は7月に行われ、6〜12歳の子を持つ全国を代表する親1037人の回答に基づく。親の4人に3人が、ペットは子どもの心の健康に役立つと答えた。回答した親の3分の2近くは、家にペットがいると答えている。\n【詳細】ペットを飼う親の約3分の2は、子どもが餌やりや、運動や遊びの相手を手伝っていると答えた。ふんの片付けなど掃除を手伝う子は半数に満たず、約8人に1人はどれも手伝っていなかった。親の期待は高く、約半数は子どもが毎日世話を手伝うべきだと考え、3分の1弱は週に数回と答えた。半数近くは子どもが任された役割をほぼいつも果たすと答え、5人に2人はたいてい果たすと答えた。果たさないとき、親が最も多くとる対応は声かけで、約3分の1は別の家族が代わりにやり、4分の1はスクリーン時間を減らすなどの罰を与えていた。ペットをせがんだのに声をかけても世話をしない場合については意見が分かれ、約7人に1人は教訓として手放すべきだとし、5人に2人を超える親は手放すと子どもの心の傷になると考えていた。ペットのいない家庭では、10人に7人の親が子どもにペットをせがまれていた。飼わない理由は、手間がかかる（約5人に2人）、費用（約3分の1）、親が望まない（4人に1人超）、アレルギー（4人に1人近く）、前のペットの死から立ち直れていない（約5人に1人）などだった。\n【ポイント・注意点】調査の共同責任者サラ・クラーク氏は、共感や責任感といった恩恵は、無理のない期待と導き、ペットの世話は家族全体の責任だという認識にかかっていると述べる。世話の役割は子どもの年齢や成熟に合わせ、親がやり方を見せ、ペットを衝動買いしないよう勧めている。飼う準備ができていない家庭では、近所や親戚のペットの世話を子どもに手伝わせる方法もあるという。結果は親の受け止めを尋ねた調査で、ペットの効果を測ったものではない。","2026-11-16","Medical Xpress","https://medicalxpress.com/news/2026-11-national-poll-parents-pets-benefit.html"],["親が子に期待する学歴 通う学校の環境で変わる チリ18万人の分析","フランスのリヨン第2大学などの研究チームは、チリで小学校の8年生から中等学校の10年生へ進む生徒18万3060人のデータを分析し、親が子に期待する教育年数との関係を調べた。学校の特徴の中では、通う家庭の豊かさが最も強く関連し、低所得層の学校の子の親は、最も裕福な学校の親より約0.6年短い教育を期待していた。家庭の収入や子の成績などを考慮しても関連は残った。論文はEducational Psychologyに掲載された。","\n【概要】子どもがどこまで教育を受けるかについての親の期待は、家庭の事情だけでなく、子どもが通う学校の環境とも強く結び付いていることを、フランス、スイス、チリの研究者が報告した。論文はEducational Psychologyに掲載され、Phys.orgが紹介した。学校間の格差が大きい地域ほど、通う小学校と親の期待の結び付きが強いという。\n【背景】研究したのは、フランスのリヨン第2大学心理学研究所のリュディヴィーヌ・ジャマン氏、スイスのヴォー州教育大学のマリーヌ・アスコエ氏、チリのオイギンス大学のバレンティナ・ソフィア・ジャコニ・スモヘ准教授ら。ジャマン氏は、親の期待は子どもが教育をどこまで進むかを予測する最も強い要因の一つだと述べている。\n【詳細】チームは、チリで小学校（8年生）から中等学校（10年生）へ進む生徒18万3060人の追跡データを使った。対象は小学校5931校、中等学校2910校にわたる。家庭の事情、生徒の特徴、学校の環境が、親が子に期待する教育年数とどう関係するかを調べた。農村かどうか、学校の平均点、親による学校の評価などの特徴の中で、最も強く関連したのは学校に通う家庭の豊かさだった。低所得層の学校の子の親は、最も裕福な学校の親より約0.6年短い教育を期待していた。この関連は、家庭の収入、親の学歴、子の成績、以前の親の期待を考慮しても残った。親の学歴と期待の結び付きは、中所得の学校より低所得の学校で強かった。アスコエ氏は、同じ学歴の親でも子の学校によって期待が大きく異なりうると話す。家に本が100冊を超えてある家庭は本がない家庭より期待が高く、娘には息子よりわずかに高い期待が持たれていた。読解より数学の成績の方が、期待と一貫して関連した。\n【ポイント・注意点】ジャコニ・スモヘ氏は、低所得層の多い学校が、進学の道筋や高校卒業後の機会を親に体系的に説明することを提案している。著者らは、親の態度を直接変えるより、情報と学校環境を良くすることを目指すべきだとする。調査は親の考えや願いのすべてをとらえたものではなく、観察研究のため、学校環境が期待を変えるのか、関係が双方向なのかは分からない。","2026-11-15","Phys.org","https://phys.org/news/2026-11-school-environment-plays-key-role.html"]]};

function allCats(){
  const list=CATS.slice();
  Object.keys(DATA).forEach(id=>{ if(!list.some(c=>c.id===id)) list.push({id:id,name:id,desc:"追加された項目",img:"hero"}); });
  extraCats.forEach(c=>{ if(!list.some(x=>x.id===c.id)) list.push(c); });
  return list;
}
let cats=allCats();
let catIdx=0;
const artIdxMap={};
function itemsOf(c){return (DATA[c.id]||[]).map((a,i)=>({a:a,oi:i})).sort((x,y)=>y.a[3].localeCompare(x.a[3]))}
function curCat(){return cats[catIdx]}
function curItems(){return itemsOf(curCat())}
function curArtIdx(){const n=curItems().length;if(!n)return 0;let i=artIdxMap[curCat().id]||0;if(i>=n)i=n-1;if(i<0)i=0;return i}
function renderStage(dir){
  cats=allCats(); if(catIdx>=cats.length)catIdx=cats.length-1; if(catIdx<0)catIdx=0;
  const c=curCat(), items=curItems(), ai=curArtIdx();
  const total=cats.reduce((s,x)=>s+(DATA[x.id]||[]).length,0);
  document.getElementById('heroText').innerHTML="<b>今日のまとめ — 全"+cats.length+"ジャンル・"+total+"件。</b> タイトルと概要は日本語、カードの「和訳全文を読む」で全文が開きます。新しい順に並べ、48時間より古い記事はグレー表示です。";
  document.getElementById('catName').textContent=c.name;
  document.getElementById('catDesc').textContent=c.desc||"";
  document.getElementById('catCount').textContent="ジャンル "+(catIdx+1)+" / "+cats.length;
  document.getElementById('catDots').innerHTML=cats.map((x,i)=>'<button class="dot'+(i===catIdx?' active':'')+'" data-cat="'+i+'" aria-label="'+x.name+'へ移動"></button>').join('');
  document.querySelectorAll('#catDots .dot').forEach(d=>{d.onclick=()=>{const n=+d.dataset.cat; if(n!==catIdx){const dd=n>catIdx?'down':'up'; catIdx=n; renderStage(dd);}}});
      const slot=document.getElementById('cardSlot');
  if(!items.length){
    slot.innerHTML='<article class="card"><div class="empty"><div class="big">✦</div><p><b>'+c.name+'</b> は追加されたばかりの項目で、まだ記事がありません。</p><p>毎日の更新でこの項目の記事が集まると、ここに表示されます。<br>上スワイプで他のジャンルへ移動できます。</p></div></article>';
    document.getElementById('artDots').innerHTML=""; document.getElementById('artCount').textContent="0 / 0"; return;
  }
  const it=items[ai], a=it.a, old=isOld(a[3]);
  slot.innerHTML='<article class="card'+(old?' old':'')+(dir?' anim-'+dir:'')+'">'
    +'<img class="ph" src="'+IMGS[c.img]+'" alt="'+c.name+'のイメージイラスト">'
    +'<div class="cbody"><div class="meta"><span class="badge'+(old?' oldb':'')+'">'+(old?'少し前':'NEW')+'</span><span>'+a[3]+'</span><span>'+(ai+1)+' / '+items.length+'</span></div>'
    +'<h3>'+a[0]+'</h3><p class="sum">'+a[1]+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="openArticle(\''+c.id+'\','+it.oi+')">和訳全文を読む</button>'
    +'<button class="btn ghost" onclick="quickMemo(\''+c.id+'\','+it.oi+',this)">メモ保存</button>'
    +'<button class="btn ghost" onclick="shareArticle(\''+c.id+'\','+it.oi+')">共有</button></div>'
    +'<div class="src">出典：'+a[4]+'<br><a href="'+a[5]+'" target="_blank" rel="noopener">原文を開く</a></div></div></article>';
  document.getElementById('artDots').innerHTML=items.map((x,i)=>'<span class="dot'+(i===ai?' active':'')+'"></span>').join('');
  document.getElementById('artCount').textContent="記事 "+(ai+1)+" / "+items.length;
  requestAnimationFrame(fitCard);
}

function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;
  const sum=card.querySelector('.sum'), h3=card.querySelector('h3'), ph=card.querySelector('.ph');
  let ss=14, hs=Math.min(21, Math.max(17, window.innerWidth*0.044)), phh=ph?Math.round(ph.getBoundingClientRect().height):0; const ph0=phh;
  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }
    if(hs>13){ hs-=0.5; if(h3) h3.style.fontSize=hs+'px'; continue; }
    break;
  }
}
window.addEventListener('resize', fitCard);
function nextArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i>=n-1)return;artIdxMap[curCat().id]=i+1;renderStage('next')}
function prevArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i<=0)return;artIdxMap[curCat().id]=i-1;renderStage('prev')}
function nextCat(){if(catIdx>=cats.length-1)return;catIdx++;renderStage('down')}
function prevCat(){if(catIdx<=0)return;catIdx--;renderStage('up')}
/* ===== スワイプ操作（スクロールではなくスワイプで移動） ===== */
const stage=document.getElementById('stage');
let sx=null, sy=null, swipedAt=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;
  swipedAt=Date.now();
  if(Math.abs(dx)>Math.abs(dy)){ dx<0?nextArt():prevArt(); } else { dy<0?nextCat():prevCat(); }
});
stage.addEventListener('click',e=>{ if(Date.now()-swipedAt<120){e.stopPropagation();e.preventDefault();} },true);
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')nextArt(); else if(e.key==='ArrowLeft')prevArt();
  else if(e.key==='ArrowDown'){e.preventDefault();nextCat();} else if(e.key==='ArrowUp'){e.preventDefault();prevCat();}
});
/* ===== 項目の追加 ===== */
document.getElementById('addCatBtn').onclick=()=>{document.getElementById('newCatName').value="";document.getElementById('newCatDesc').value="";document.getElementById('addDlg').showModal()};
document.getElementById('addCatSave').onclick=()=>{
  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast("項目名を入力してください");return}
  const desc=document.getElementById('newCatDesc').value.trim()||"追加された項目";
  const id='custom-'+Date.now();
  extraCats.push({id:id,name:name,desc:desc,img:'hero'}); DATA[id]=[];
  cats=allCats(); catIdx=cats.length-1;
  document.getElementById('addDlg').close(); renderStage('down');
  toast("項目「"+name+"」を追加しました");
};
/* ===== 記事ダイアログ・メモ・共有 ===== */
function openArticle(cat,idx){
const c=allCats().find(x=>x.id==cat); const a=DATA[cat][idx];
document.getElementById('dlgIn').innerHTML=`<img src="${IMGS[c.img]}" alt=""><div class="meta" style="margin-top:10px"><span>${c.name}</span><span>${a[3]}</span></div><h3>${a[0]}</h3><p class="sum" style="font-size:14px">${a[1]}</p><div class="full">${a[2]}</div>
<p class="src" style="margin-top:12px">出典：${a[4]} — <a href="${a[5]}" target="_blank" rel="noopener">${a[5]}</a></p>
<div class="memoBox"><label style="font-weight:800;font-size:14px">ひとことメモ</label><textarea id="memoText" placeholder="気づいたこと、作りたいもの、家族への共有メモなど"></textarea>
<div class="actions"><button class="btn primary" onclick="saveMemo('${cat}',${idx})">このメモを保存</button><button class="btn ghost" onclick="shareArticle('${cat}',${idx})">iPhoneで共有</button><button class="btn ghost" onclick="document.getElementById('dlg').close()">閉じる</button></div></div>`;
document.getElementById('dlg').showModal();
}
function quickMemo(cat,idx,btn){const a=DATA[cat][idx];memos.unshift({cat,title:a[0],note:"",date:a[3]});updateMemoUI();btn.textContent="保存しました";btn.classList.add('saved');toast("メモに保存しました（このページを開いている間）")}
function saveMemo(cat,idx){const a=DATA[cat][idx];const note=document.getElementById('memoText').value.trim();memos.unshift({cat,title:a[0],note,date:a[3]});updateMemoUI();toast("メモを保存しました");document.getElementById('dlg').close()}
function updateMemoUI(){document.getElementById('memoCount').textContent=memos.length;const area=document.getElementById('memoList');
if(!memos.length){area.innerHTML='<p class="sum">まだメモがありません。記事の「メモ保存」をタップしてください。</p>';return}
area.innerHTML=memos.map(m=>`<div class="memoItem"><b style="font-size:14px">${m.title}</b><div style="font-size:13px;color:var(--muted)">${m.note||"（ひとことメモなし）"} ・ ${m.date}</div></div>`).join('')}
function exportMemos(){if(!memos.length){toast("まだメモがありません");return}const txt="MAI topic メモ — 2026-11-10\n\n"+memos.map((m,i)=>`${i+1}. ${m.title}\n${m.note||""}\n`).join("\n");const b=new Blob([txt],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="mai-topic-memo-2026-11-10.txt";a.click();URL.revokeObjectURL(u)}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}} try{await navigator.clipboard.writeText(text);toast("コピーしました — メモアプリなどに貼り付けできます")}catch(e){toast("共有できませんでした")}}
function shareArticle(cat,idx){const a=DATA[cat][idx];shareText(a[0],`${a[0]}\n\n${a[1]}\n\n出典：${a[4]} ${a[5]}`)}
function shareMemos(){if(!memos.length){toast("まだメモがありません");return}shareText("MAI topic メモ",memos.map(m=>`・${m.title} ${m.note}`).join("\n"))}
document.getElementById('sharePage').onclick=()=>shareText("MAI topic","MAI topic — 2026年11月21日朝版（全"+cats.length+"ジャンル）");
document.getElementById('memoBtn').onclick=()=>{updateMemoUI();document.getElementById('memoDlg').showModal()};
updateMemoUI();
renderStage();
</script>

<script>
try {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
} catch (e) {}
</script>
</body>
