ハードウェアもtrn2.48xlargeに限られる。グラフのコンパイルはx86_64のホストで数時間かかる。ベンチマークは以前のビルドで取ったもので、現行版はそのビルドと384件中384件で同一の出力を出すと説明している。モデルの取得にはHugging Faceのトークンが要る。ライセンスはApache 2.0。","2026-11-17","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50533270"],["実機のファームを動かす無線網シミュレータ「Cooja-NG」","Contiki-NGの検証に使われてきたJava製のシミュレータCoojaとMSP430エミュレータMSPSimを、C言語でクリーンルーム再実装した「Cooja-NG」がShow HNで公開された。MSP430、ARM Cortex-Mなどのマイコンを模擬し、改変していないファームウェアを1つのIEEE 802.15.4無線網の上で動かせる。CIやブラウザでも動き、BSD-3-Clauseで公開されている。","\n【概要】Cooja-NGは、改変していないファームウェアを模擬したマイコンボードの上で動かす、決定的なIEEE 802.15.4ネットワークシミュレータだ。READMEは「デバイスを模擬し、ネットワークをシミュレートし、本物のファームウェアを動かす」とまとめる。2026年11月17日にShow HNで紹介された。\n【背景】Contiki-NGの試験にはJava製のCoojaとMSP430エミュレータのMSPSimが使われてきた。Cooja-NGはそれをCでクリーンルーム再実装したもので、名前と試験一式を引き継ぎつつ、CPU、無線、OSの対応を広げた。Contiki-NGのCoojaの試験は、root権限とTUN付きなら93件すべてを通るという。\n【詳細】対応ボードはMSP430のTmote Sky、Zolertia Z1、Cortex-M3のCC2538DK、Cortex-M4FのnRF52840 DKやCC1352R1、TrustZone-M付きCortex-M33のnRF54L15 DKなど。RISC-VはnRF54L15の補助プロセッサとしてだけ扱う。MSP430とThumbのコードにはJITがある。Contiki-NGはすべての無線ボードで検証済みで、Zephyr、RIOT、OpenThreadは実験的な扱いだ。無線はCC2420やNordic 802.15.4などを模擬し、フレームは1バイトずつ受信側に届く。cngsimのコマンドはCI向けに0か1を返し、ブラウザの画面ではノードの配置、コンソール、パケット解析、pcap、記録と再生ができる。同じシードなら、Linux、macOS、FreeBSDでバイト単位まで同じ実行になるという。WebAssemblyでブラウザでも動く。\n【ポイント・注意点】電波の伝わり方は単純な円盤モデルだけで、経路損失やフェージングは扱わない。BLE、LoRa、Wi-Fiは対象外で、1つのシミュレーションは128ノードまで。Coojaのデスクトップ画面やJavaのプラグイン群はない。ビルドに要るのはCコンパイラだけで、ライセンスはBSD-3-Clause。","2026-11-17","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50531654"],["トークンの無駄を減らすOSS端末エージェント「Agav」","端末で動くオープンソースのコーディングエージェント「Agav」がShow HNで公開された。キャッシュした文脈の再利用や、実りのない修正の繰り返しを打ち切る仕組みで、同じリポジトリの文脈を何度も送り直さないことを狙う。READMEにあるTerminal-Bench 2.1での費用調査では、Codexより総支出が49.1%少なかったという。Apache-2.0の実験的ベータ版だ。","\n【概要】Agavは、実際のリポジトリやプロジェクトのための、端末で動く自律型のコーディングエージェントだ。コードを調べ、ファイルを編集し、テストを走らせ、変更を確かめるまでをコマンドラインで行う。2026年11月17日にShow HNで紹介された。\n【背景】READMEは費用の削減を「ハーネスの効率」によるものと説明する。キャッシュした文脈を再利用し、同じ作業の繰り返しを抑え、実りのない修正の繰り返しを途中で止め、再試行と予算に上限を設け、サブエージェントの探索を隔離して、同じリポジトリの文脈を何度も送り直さないようにしているという。\n【詳細】/modelでセッション中にモデルを切り替えられ、/fastと/deepの近道もある。対応する提供元はAnthropic、OpenAI、OpenRouter、NVIDIA NIM、Gemini、Vertex AI、ローカル用のOllama。agav runによる非対話モードでは道具ごとの許可やJSON Schemaでの出力を指定でき、スクリプトやCIにも組み込める。セッションの再開、分岐、検索、書き出し、/compactでの文脈の回収、権限モードの切り替え、スキル、新しい文脈で動くサブエージェント、プロジェクトごとの記憶、英語のオフライン音声入力、長い処理やcronの背景ジョブ、LSPを使った編集も備える。インストールにNode.jsは要らない。\n【ポイント・注意点】READMEは、SWE-bench-Live Liteで62.0%、Terminal-Bench 2.1で84.7%と記す。費用調査では89課題で試行あたりの推定費用の中央値が15.2セントで、同じGPT-5.6 Lunaの料金でCodexより総支出が49.1%少なかった。ただしこの調査での正答率はAgavが60.4%、Codexが76.6%で、READMEも費用の結果であって精度の主張ではないと断っている。実験的ベータで、大きな変更が続く見込みだ。コマンドのサンドボックスはmacOSとLinuxでだけ使える。","2026-11-17","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50531644"],["SQLiteの移行をLean 4で証明する「Belay」","SQLiteのクエリやマイグレーションについての主張をLean 4で形式検証するライブラリ「Belay」がShow HNで公開された。利用者が主張を書き、エージェントが証明を書き、Leanのカーネルが確かめるという流れで、形式検証を結合テストと大差ない手間にすることを目指す。SQLite 3.51.0の一部を模型化し、本物のSQLiteと突き合わせて検証している。MITライセンス。","\n【概要】Belayは、SQLiteのデータベース、文、マイグレーションについての事実を証明するLeanのライブラリだ。SQLを書いて主張を述べると、Leanがそれを確かめる。2026年11月17日に作者がShow HNで紹介した。\n【背景】作者は、日常の開発作業に形式検証を使うのがどれほど難しいかを試したかったという。結論として、主張を書けばエージェントが証明を書き、Leanのカーネルが確かめるので、人が読むべきは主張だけになり、結合テストを書くのと大差ない手間にできたとしている。\n【詳細】マイグレーションを書いている間は、エージェントが#sql_checkを走らせ、小さなデータベースの中から主張の反例を探す。リンター並みに手軽に使え、反例が見つかると小さなデータベース、失敗した観測、sqlite3で再現するスクリプトを返す。マイグレーションが固まったら、既存のクエリの結果を保つ、正しいデータで成功するといった必要な主張の証明をエージェントに書かせる。READMEの例は、テーブルをSTRICTに変える移行が誤ってセッションを消してしまうケースだ。対応範囲は制約付きテーブル、生成列、WITHOUT ROWID、インデックス、ビュー、トリガー、ALTER TABLE、トランザクション、RETURNINGやupsert付きの変更、結合、集約、副問い合わせ、CTEを含むSELECTなど。模型にないSQLは理由付きで拒み、近似はしない。\n【ポイント・注意点】対象はSQLite 3.51.0の一部で、READMEでは5,525件の事例を本物のSQLiteと模型の両方で再生し、食い違いを一切許さないとしている。証明は単一接続での動作だけを扱い、クエリプラン、ロック、並行性、クラッシュ時の挙動については何も言わない。初回のビルドは8コアの機械で約7分かかる。コードを変えるプルリクエストは受け付けず、課題報告や試験事例を歓迎している。Lean 4.34.1を使い、ビルドにCコンパイラは要らない。ライセンスはMIT。","2026-11-17","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50531208"],["Rust製のネイティブなDBクライアント「Tabletist」","Mac、Windows、Linuxで動くネイティブのデータベースクライアント「Tabletist」がShow HNで公開された。PostgreSQL、MySQLとMariaDB、SQLite、BigQueryに対応し、Rustとeguiで作られている。本番の接続は既定で読み取り専用にし、編集を保存する前に実行するSQLを確かめられるなど、事故を防ぐ作りが目立つ。ライセンスはMITだ。","\n【概要】Tabletistは、PostgreSQL、MySQL（MariaDBを含む）、SQLite、BigQueryに対応する、高速でネイティブなデータベースクライアントだ。2026年11月17日にShow HNで紹介された。\n【背景】READMEはLinuxについて「OmarchyとHyprlandを最優先」と掲げ、macOSとWindowsにも対応する。RustとGUIツールキットのeguiで作られ、macOS風の見た目と、Omarchyのテーマに追従する見た目の2つを持つ。\n【詳細】保存した接続を開発、ステージング、本番といった環境の札でまとめられる。TLSはlibpqのsslmodeに倣った方式で、SSHトンネルはパスワード、鍵ファイル、エージェントの認証に対応する。パスワードはシステムのキーリングに保存するか、接続のたびに尋ねる。接続ごとに読み取り専用にでき、本番では既定で読み取り専用になる。書き込み可能な接続では表の上で直接編集し、変更は1つのトランザクションで保存する。保存の際に別の誰かが行を変えていれば何も書かず、食い違いごとに解決方法を尋ねる。「Review SQL」で実行前に文を確認でき、本番への保存は確認を求める。SQLエディタには行数の上限、時間切れ、取り消しがある。並べ替えとページ送りはサーバー側で行い、CSV、JSON、Markdownなどに書き出せる。\n【ポイント・注意点】作者の計測では、1台のLinux機でほかの9つのクライアントと比べ、最初の画面が出るまで89ミリ秒、そのときのメモリは134.0MiBだった。BigQueryはトランザクションがないため読み取り専用で、MySQLのverify-caモードは未対応。Linuxの配布バイナリはglibc 2.39以降が必要だ。AURのパッケージもまだ公開されていない。導入はmacOSのcaskかDMG、Windowsのセットアップ、LinuxのAppImageなどから選べ、Linuxでのダウンロードは18.6MB。ライセンスはMIT。","2026-11-17","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50531126"],["異なるエージェント同士をつなぐ連絡網「Pulsar」","Claude Code、Codex、OpenCode、Cursor、Gemini CLIなど、種類の違うAIコーディングエージェントが同じ機械の上で互いを見つけ、メッセージを交わせるようにするMCPサーバー「Pulsar」がShow HNで公開された。名前やタグで宛先を選べ、待機中のエージェントを起こして届けることもできる。テレメトリはなく、ライセンスはMIT。","\n【概要】Pulsarは、1台の機械にいるAIコーディングエージェント同士が互いを見つけ、メッセージをやりとりするためのMCPサーバーだ。標語は「あなたのAIエージェントは、もう互いに話せる。どのハーネスでも」。2026年11月17日にShow HNで紹介された。\n【背景】READMEは対応先としてClaude Code、Codex、OpenCode、pi、omp、Cursor、Gemini CLIを挙げ、MCPクライアントならどれでも接続できるとする。Pulsarを読み込んでいないClaude CodeやOpenCodeのセッションも含め、機械上で動いているエージェントを一覧にする。\n【詳細】エージェントにはハーネス、モデル、プロジェクト、ブランチ、ワークツリー、PRといったタグが自動で付き、role:reviewerのような独自のタグも足せる。宛先は名前、project=のような選択条件、文字列の一致、全員を指す「*」で選べる。メッセージは待機中のエージェントを起こして届けられ、対応するハーネスでは急ぎのものを作業の途中に差し込むこともできる。返信はスレッドを保ち、askは答えが来るまで待つ。仕組みとしては、機械ごとに必要なときだけ起動する小さなデーモンがあり、エージェントの登録簿とSQLiteのメッセージ記録を持つ。各エージェントのMCPサーバーは、利用者専用のフォルダにあるUnixソケット越しにデーモンと話す。導入はnpx pulsar setupで、変更するファイルを示してから一度だけ確認し、触るファイルのバックアップを取る。\n【ポイント・注意点】メッセージは利用者ではなく仲間のエージェントからのものと明示され、権限を与えることはできない。受け取り側は受理、保留、拒否を選べる。1通64KB、1分に60通などの上限がある。プッシュの経路を持たないクライアントは受信箱を確認したときにしか読めない。現在は1台の機械だけが対象で、複数機械やTailscale越しの操作は「近日対応」とされている。","2026-11-17","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50526967"]],"gh-blog":[["pull_request_target遮断とモデル整理、GitHub週報","DEV Communityで、Hector Flores氏がGitHubの1週間の変更をまとめた週報を公開した。公開リポジトリでのpull_request_targetの既定ブロック（12月2日に適用）、ARM32のホスト型ランナーの終了、Copilotのカスタマイズをプラグイン経由に限る管理設定、3モデルの廃止、AI Scanの一括実行などを取り上げ、GitHubが暗黙の信頼を明示的なポリシーへ置き換えつつあると論じている。","\n【概要】DEV CommunityでHector Flores氏が、GitHubの直近1週間の変更を整理した週報「GitHub Weekly」を公開した。Actions、Copilot、セキュリティの各分野の変更を表にまとめ、今週の流れを「統治の明示化」と位置づけている。\n\n【背景】pull_request_targetはベースリポジトリの文脈で動き、シークレットにも触れられる。そのためフォークのコードを実行すると「Pwn Request」と呼ばれる危険が生じる。GitHubは公開リポジトリでこのイベントを既定でブロックする方針を出しており、これまでは評価モードだった。11月9日と16日のUTC16時〜18時には、隠れた依存を洗い出すための一時停止も実施された。\n\n【詳細】pull_request_targetの遮断は12月2日に適用され、プライベートや内部リポジトリ、GitHub Enterprise Serverは対象外となる。対応策として、シークレットが不要ならpull_requestへ切り替える、Actionsのイベントポリシーで特定のワークフローだけ許可する、何もせず遮断を受け入れる、の3つを挙げている。ARM32のホスト型ランナーは12月8日までにWindowsとLinuxで終了する。Copilotでは、スキル、カスタムエージェント、フック、MCPサーバー、実行型拡張の5分類について、プラグインか管理設定からの導入に限る「strictPluginOnlyCustomization」が加わった。11月16日にはClaude Opus 4.8、Claude Opus 5、GPT-5.6 Terraが廃止され、12月14日にも次の廃止が控える。AI Scanは最大20リポジトリで一括実行でき、Dependabotの却下申請の有効期間は1週間から1年に延びた。\n\n【ポイント・注意点】筆者は、ラベル付けやコメントのためにフォークのコードが必要な場面はまれだとして、多くのリポジトリでは遮断を受け入れるよう勧めている。12月2日までにpull_request_targetを使うワークフローを点検すること、プロンプトやエージェント定義に書き込んだ廃止モデル名を検索して直すこと、どのカスタマイズ分類をプラグイン限定にするか決めることを、今週の宿題として挙げている。","2026-11-18","DEV Community","https://dev.to/htekdev/github-weekly-pullrequesttarget-gets-blocked-plugin-only-copilot-and-a-model-purge-4mi9"],["Copilot CLI週報、自己増殖の防止と正規表現ルール","DEV CommunityでHector Flores氏が、GitHub Copilot CLIの1週間の更新をまとめた週報を公開した。v1.0.109〜v1.0.112の4つの安定版が出て、ワークフローのエージェントが自分自身を起動し続けるのを防ぐ制限、企業管理のシェル許可ルールへの正規表現対応、端末のエスケープ文字を使った注入への対策などが入った。筆者は「自律機能には上げられない上限が要る」と述べている。","\n【概要】DEV CommunityでHector Flores氏が、GitHub Copilot CLIの週次更新を解説する「Copilot CLI Weekly」を公開した。今週はv1.0.109からv1.0.112まで4つの安定版が出て、v1.0.113のプレリリースも控えている。筆者は大半を端末まわりの磨き込みとしつつ、エージェントの安全、企業ポリシー、日常の道具としての使い勝手の3点を見どころに挙げる。\n\n【背景】Copilot CLIはほぼ毎日のように安定版を出している。エージェントに多くの道具を許可して自律的に動かす使い方が広がり、暴走やコストの膨張、見えない文字による指示の混入をどう防ぐかが課題になっている。\n\n【詳細】v1.0.111では、実験的な動的ワークフローを有効にしている場合でも、ワークフロー自身のエージェントがワークフローの実行を開始・再開できなくなった。全ツールを許可した状態で自分を無制限に複製するのを防ぐためで、筆者はこれを「請求先付きのフォーク爆弾」と表現した。v1.0.110では/compactがセッションのAIクレジット上限を守るようになった。企業管理のShell、Bash、PowerShellの許可ルールは正規表現に対応し、git statusやgit diffは許してgit push --forceは止める、といった設定ができる。端末のエスケープシーケンスに隠れたスキル名を一覧や実行の対象にしない修正や、サブエージェント画面が制御文字を端末に書き出さない修正も入った。Git、SSH、sudoのパスワード入力を伏せ字の画面で受ける機能も実験的に加わった。\n\n【ポイント・注意点】筆者は、アンカーのない正規表現は意図より広く一致しうるため、意地の悪いコマンド文字列でポリシーを試すよう勧めている。毎日のように安定版が出る分、企業での展開は版を固定し、リリースノートを読んでから上げるべきだという。v1.0.113のプレリリースでは、管理者が組み込みのブラウザ操作を止める設定も入る予定だ。","2026-11-18","DEV Community","https://dev.to/htekdev/copilot-cli-weekly-workflows-get-guardrails-admins-get-regex-268n"],["AIコーディングのモデル廃止、誰が見張るのか","DEV CommunityでRick Leffke氏が、AIコーディングツールの裏で使われるモデルがベンダーの都合で廃止されていく問題を取り上げた。GitHubが11月13日に発表した、12月14日のCopilot 6モデル廃止を例に、通知を誰が受けるか、置き換えは自動か、何が古いモデルに依存しているか、新モデルで実務を再テストしたか、の4点を確認するよう勧めている。","\n【概要】DEV CommunityでRick Leffke氏が「AIコーディングツールはモデルを引退させる。チームの誰が見ているのか」と題する記事を公開した。Copilot、Cursor、Claude Codeなどを1つの製品として扱いがちだが、実際には中のモデルが入れ替わり続けている、という問題提起である。\n\n【背景】GitHubは2026年11月13日、チャット、インライン編集、エージェントモード、コード補完を含むCopilotの全体験で、6つのモデルを12月14日に廃止すると発表した。5つには後継が示されたが、残る1つは「追って発表」とされた。Copilot BusinessとEnterpriseでは、既定の設定のままなら後継モデルが自動で有効になる。ただし管理者が既定を切っている場合や、モデルを個別に無効にしている場合は例外となる。\n\n【詳細】筆者は、モデルが替わると提案の長さ、チームの規約への従い方、従量課金でのタスクあたりのコストが変わりうると指摘する。古いモデルに合わせて作ったプロンプトや自動化が劣化したり止まったりするおそれもある。特にファイルを書き換えたり変更を出したりする自律エージェントでは、どのモデルが動いているかを把握し、切り替え後の出力を確かめる必要があるという。確認事項として、各ツールの廃止通知を読む担当者を決めること、置き換えが自動か手動かを期限前に確かめること、共有プロンプトや設定、スクリプト、モデルを固定したエージェントの仕事を洗い出すこと、毎週の実際のタスクを新モデルで再テストして比べること、の4つを挙げた。\n\n【ポイント・注意点】記事では筆者が運営する「Agent Ready Rankings」の点数も紹介され、10点満点でCursorが8.75、Claude Codeが8.4、GitHub Copilotが7.4などとなっている。ただしこの点数は、チームがモデルの変更を見張っているかどうかは測っていない。筆者自身がこのサイトの作者で、詳細な内訳は有料（月10ドル）である点も明記されている。Copilotの利用者には、まず12月14日を予定表に入れるよう勧めている。","2026-11-18","DEV Community","https://dev.to/rick_leffke_6541e28129e2a/your-ai-coding-tool-will-retire-its-models-who-on-your-team-is-watching-58g3"],["MicrosoftのONNX RuntimeがGitHubから消え騒然","Hacker Newsで「MicrosoftのONNX RuntimeがGitHubから消えた」という投稿が406ポイント、82コメントを集めた。投稿者はパイプラインの評価が突然失敗して気づいたという。コメントでは関連リポジトリやagent-frameworkも見えなくなったとの報告が相次いだ一方、onnxruntime.aiやPyPI、Maven Centralのパッケージは残っているとされる。原因は確認されていない。","\n【概要】Hacker Newsに「Microsoft's ONNX Runtime has disappeared from GitHub」という投稿が上がり、406ポイント、82コメントを集めた。広く使われている推論エンジンのリポジトリmicrosoft/onnxruntimeが、事前の告知なく見られなくなったという内容である。\n\n【背景】ONNX Runtimeは機械学習モデルを動かすための実装で、仕様そのものを定めるonnx/onnxとは別のプロジェクトだ。投稿者は、自社のパイプラインで評価が失敗し始めたことでリポジトリの消失に気づいたと書いている。\n\n【詳細】コメント欄では、microsoft/agent-frameworkも見えなくなったとの報告や、onnxruntime-genai、onnxruntime-extensions、推論と学習の例のリポジトリ、Swift Package Manager用のリポジトリなど、ONNX Runtime関連の複数のリポジトリが消えているとの指摘が出た。一方、公式サイトonnxruntime.ai、PyPIとMaven Centralのパッケージ、onnx/onnxのリポジトリは引き続き参照できるとされる。Webアーカイブのスナップショットや、OpenVINO向けの変更を含むintel/onnxruntimeなどのフォークも紹介された。SourceForgeのミラーについては、マルウェアが混じっている恐れがあるとの警告も出ている。ほかに、ONNX Runtimeが利用状況のテレメトリを送っていることに触れ、関数や環境変数ORT_DISABLE_TELEMETRY=1で止められるとする書き込みもあった。\n\n【ポイント・注意点】消えた理由は確認されていない。コメントでは、アカウントの乗っ取り、agent-frameworkのPyPI侵害との関連、Igniteに合わせたリポジトリの統合、脆弱性への対応など様々な推測が出ているが、いずれも裏付けはない。依存先のリポジトリが突然消える事態に備え、依存を手元に取り込んでおくべきだという意見も出た。利用者は、パッケージの入手元とフォークの信頼性を慎重に見極める必要がある。","2026-11-17","Hacker News","https://news.ycombinator.com/item?id=50539610"],["AIのバグ報告より修正を、GitHubとMSが6OSSで試行","GitHubは公式ブログで、AIによる脆弱性報告がメンテナーを疲弊させている問題に対し、報告ではなく修正を届ける試みの結果を公表した。MicrosoftとともにAutoGPT、Caddy、Expressなど6つのOSSを走査し、9,791件の候補を絞り込んで99件を非公開で報告、11月15日時点で55件が修正された。報告前に必ず人が検証し、修正案を添えることが要だという。","\n【概要】GitHub公式ブログに「メンテナーに必要なのはAIのバグ報告ではなく修正だ」と題する記事が掲載された。GitHubとMicrosoftが6つのオープンソースプロジェクトを対象に、AIで見つけた脆弱性を検証済みの修正案付きで届ける試験運用を行い、その結果をまとめている。\n\n【背景】AIで脆弱性の候補を見つけるのは速く安くなったが、直すには人の判断が要り、その負担はメンテナーにかかる。多くのメンテナーはすでに、重複や脆弱性でないものを含むAI生成の報告に埋もれている。記事は、新しいモデルを試すならまずメンテナーに連絡し、指摘ではなく修正を持ち込むべきだと主張する。\n\n【詳細】手順は5段階だ。MicrosoftのCodename MDASHがMAI Cyberモデルで走査して修正案を出し、GitHub Security LabのAI仕分けエージェントが重複を除いて有効性を確かめ、Microsoft FORGE Labの研究者7人が1プロジェクトあたり約2日かけて手で検証した。そのうえで修正案と再現コードを添え、非公開の脆弱性報告で届けた。対象はAutoGPT、Caddy、Express、FastMCP、ImageMagick、Nettyで、9,791件の候補から99件を報告し、11月15日時点で55件が修正、うち14件がリリース済みとなった。Caddyは22件すべてを1週間以内に直し、ImageMagickのメンテナーは30〜60分かかりそうな修正を15分で出せたという。\n\n【ポイント・注意点】AIで見つけた脆弱性を送る側には、プロジェクトの既知の問題や脅威モデルと照らして検証すること、非公開で報告すること、修正案を添えてペースはメンテナーに任せることを求めている。一方で、手作業の検証はまだ規模を広げられないとも認めている。今後はSecure Open Source Fundの卒業プロジェクトすべてに、検証付きのAIセキュリティ走査を提供する予定だ。同基金はこれまでに216のプロジェクトを支援しており、GitHubとMicrosoftは将来のMAI Cyberモデルでも協力を続けるという。","2026-11-17","GitHub Blog","https://github.blog/open-source/maintainers/maintainers-dont-need-more-ai-bug-reports-they-need-fixes/"],["端末をまたいで続くエージェント、AHPの設計を解説","GitHubのエンジニアが公式ブログで、エージェントのセッションをスマホやPC、クラウドの間で引き継ぐための「Agent Host Protocol（AHP）」の設計を解説した。エージェントの寿命がエディタの窓に縛られていた問題を、URIで識別するチャネルとリデューサーによる状態管理で解決した。VS Code側はTypeScript約36.9万行、GitHub側はRust約30.5万行で実装されている。","\n【概要】GitHub公式ブログで、Connor Peet氏とRob Lourens氏が「Agent Host Protocol（AHP）」の設計と開発の経緯を解説した。複数のクライアントから同じエージェントを扱えるようにし、スマホで始めた作業をノートPCで続けるといった使い方を支えるプロトコルである。\n\n【背景】GitHub CopilotはもともとVS Codeの拡張として専用の実行基盤を同梱しており、エージェントの寿命が1つのエディタの窓に縛られていた。窓を閉じればエージェントは終わり、VS Codeを再起動すればすべて止まった。Copilotアプリやモバイルアプリもそれぞれ独自にクラウドエージェントとつないでおり、クライアントの数×エージェント基盤の数だけ個別の作業が要る状態だった。Copilot Chat拡張はテストを除いても40万行を超えるTypeScriptに育ち、単独のプロセスでは動かせなかった。\n\n【詳細】AHPはURIで識別する「チャネル」を単位とし、ルート、セッション、チャットの3つを必須とする。端末やMCP、OpenTelemetryは任意のチャネルで足せる。各チャネルの状態はリデューサーで管理され、状態の正はサーバー側にある。クライアントは順序付きの操作を送り、再接続時には溜めた操作を送り直して、サーバーが調整して承認するのを待つ。開発は2026年初めに始まり、約2週間でエージェント基盤自体の開発に使えるようになった。VS Code版はTypeScript約36.9万行、GitHub版はRust約30.5万行で、独立した2つの実装を作ったことで設計の穴や誤った前提も見つかったという。\n\n【ポイント・注意点】プロトコルはエージェントの振る舞いには立ち入らない方針で、変化の速いエージェント設計から切り離されている。クライアントライブラリはRust、TypeScript、Kotlin、Swift、.NET、Goで用意され、仕様はmicrosoft/agent-host-protocolで公開されている。VS Codeでは「code agent host」で単独のホストを起動できる。","2026-11-17","GitHub Blog","https://github.blog/engineering/engineering-principles/building-the-agent-host-protocol-for-sessions-that-continue-across-devices/"],["GPT-6.2 AstraとSolがCopilotで一般提供","GitHubは、OpenAIの新モデルGPT-6.2 AstraとGPT-6.2 SolをGitHub Copilotで一般提供すると発表した。どちらもエージェント型のコーディングとコードレビュー向けで、初期テストでは従来のGPT-6系より多くの実際の問題を見つけ、トークンも少なく済んだという。SolはGPT-6.1 Solの約2倍の問題を捉えた。Pro+、Max、Business、Enterpriseで使える。","\n【概要】GitHubは2026年11月17日、OpenAIのGPT-6.2 AstraとGPT-6.2 SolがGitHub Copilotで一般提供になったと発表した。いずれもエージェント型のコーディングとコードレビューを想定したモデルで、GitHubは従来のGPT-6系よりコーディングの判断力が高いとしている。\n\n【背景】Copilotは複数の提供元のモデルを切り替えて使える仕組みを広げており、直近でも新モデルの追加と旧モデルの廃止が続いている。今回の2モデルは、コードレビューでの検出力と、エージェントの作業に要するトークン量の両方を改善した点を前面に出している。\n\n【詳細】GPT-6.2 Astraはエージェント型のコーディングと端末作業向けだ。初期テストでは、GPT-6 Astraよりコードレビューの問題を大幅に多く見つけ、エージェントのタスクをかなり少ないトークンで終えたという。GPT-6.2 Solは複雑なエージェント型コーディングと踏み込んだコードレビュー向けで、GPT-6.1 Solに比べて実際の問題をほぼ2倍見つけ、指摘の正確さも保ったとされる。料金は従量課金で、提供元の定価で請求される。対象はCopilot Pro+、Max、Business、Enterpriseで、VS Code、Visual Studio、Copilot CLI、Copilotコーディングエージェント、Copilotアプリ、github.com、GitHub Mobile、JetBrains IDE、Xcode、Eclipseのモデル選択画面から選べる。\n\n【ポイント・注意点】提供は段階的に進むため、まだ表示されない場合は時間をおいて確認するよう案内されている。BusinessとEnterpriseでは、管理者がCopilot設定のモデルポリシーで利用を管理する。既定のモデル有効化が働いている組織では新モデルが自動で有効になるが、管理者がグローバルの既定を切っていたり、このモデルを明示的に無効にしていたりする場合は、手動で有効にする必要がある。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-openais-gpt-6-2-astra-and-gpt-6-2-sol-now-available"],["Copilot Fusion、Terminal-Benchで71.2%","GitHubは、タスクごとにモデルを選んで組み合わせるCopilot Fusionの更新を発表した。Terminal-Bench 4.1の公開リーダーボードに載り、Fusion Maxは解決率71.2%でOpus 5.5とFable 5.2を5.4ポイント上回り、費用はFable 5.2より88%安いという。github.com、Visual Studio、GitHub Mobileのベータ版でも選べるようになり、各段にモデルも追加された。","\n【概要】GitHubは2026年11月17日、Copilot Fusionの更新を発表した。新しいモデルの追加、対応する画面の拡大、そして公開ベンチマークのリーダーボードへの掲載が柱である。Fusionはモデル選択画面で選ぶと、タスクごとにモデルを選び、組み合わせて動かす仕組みだ。\n\n【背景】Copilot Fusionは10月末に一般提供が始まったばかりで、利用者は努力の段階を指定するだけで、どのモデルを使うかはCopilotに任せられる。各社の最上位モデルを直接選ぶ場合と比べ、性能とコストの釣り合いをどう取るかが注目点になっている。\n\n【詳細】Copilot Fusionは、スタンフォード大学、Harbor、Laude Instituteが運営するTerminal-Bench 4.1の公開リーダーボードに掲載された。このベンチマークは、難しく現実的な端末作業をAIエージェントがどこまでこなせるかを測る。Copilot Fusion Maxは解決率71.2%で、最先端モデルのOpus 5.5とFable 5.2を5.4ポイント上回ったとしている。費用はFable 5.2より88%、Opus 5.5より57%安いという。対応面では、最新版のgithub.com、Visual Studio、iOSとAndroidのGitHub Mobileベータ版で選べるようになった。正式版のモバイルアプリへの対応は「まもなく」とされ、日付は示されていない。モデルはFusion MaxにClaude Sonnet 5.5、Fusion HighにGPT-6.1 Terra、Fusion StandardにMAI-Code-2が加わった。\n\n【ポイント・注意点】記事の冒頭では「2つの公開Terminal-Benchリーダーボード」に触れているが、本文で詳しく示されているのはTerminal-Bench 4.1の結果だけである。数値はGitHubが自ら示したもので、実際の効果は作業の内容によって変わりうる。詳しい使い方はdocs.github.comのCopilot Fusionの文書にまとめられている。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-github-copilot-fusion-updates-more-availability-benchmarks-and-models"],["CopilotアプリがAzure DevOpsとブラウザ操作に対応","GitHubはMicrosoft Igniteに合わせ、GitHub Copilotアプリの更新を発表した。Azure DevOpsのリポジトリで、エージェントがブランチ作成からプルリクエストまで進められるようになり（パブリックプレビュー）、ログイン済みのブラウザを操作する機能も加わった。GitHub Enterprise Serverへの対応は一般提供になった。ブラウザ操作はCLI、VS Code、JetBrainsでも使える。","\n【概要】GitHubは2026年11月17日、Microsoft Igniteに合わせてGitHub Copilotアプリの新機能を発表した。Azure DevOpsのリポジトリ、GitHub Enterprise Server（GHES）、そして利用者がすでにログインしているブラウザで作業できるようになった。\n\n【背景】Copilotアプリは、複数のAIエージェントをまとめて扱うデスクトップの拠点として提供されている。これまではGitHub上のリポジトリが中心だったが、Microsoftの開発基盤であるAzure DevOpsや、社内に置くGHESを使う企業にも対象を広げた形だ。\n\n【詳細】Azure DevOps対応はパブリックプレビューで、リポジトリをクローンし、エージェントにブランチを作らせ、コードを変えてプルリクエストを出すまでをアプリ内で完結できる。プルリクエストの状態はサイドバーに表示され、レビューコメントの「Fix」を押すとエージェントが対応する。有効にすると、CIの失敗を直し、Azure DevOpsのチェックとポリシーを通ったところでプルリクエストを完了させることもできる。設定のExperimentalからAzure DevOps integrationをオンにして使う。ブラウザ操作もパブリックプレビューで、ChromeやEdgeなどChromium系のブラウザでフォーム入力、ページからの情報取得、開発中のWebアプリのテストやデバッグを行える。GitHub Copilotの Chrome拡張が必要で、分離されたタブグループで動く。GHES対応はアプリ1.2.0以降で一般提供となった。\n\n【ポイント・注意点】ブラウザ操作は既定でオフで、拡張を入れたうえで設定のComputer UseからEnable Computer UseとEnable Browser Useの両方をオンにする。権限の段階は拡張の設定で管理する。Azure DevOpsとGHESのリポジトリでは、クラウドセッションは使えない点にも注意が要る。ブラウザ操作はCopilot CLI、VS Code、JetBrains IDEでも利用できる。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-github-copilot-app-microsoft-ignite-releases"],["Copilotコードレビュー、難易度で深さを自動調整","GitHubはCopilotコードレビューの更新を発表した。プルリクエストの複雑さと危険度を見てLite、Balanced、Maxの深さを自動で選ぶ「Adaptive」、関連する公開リポジトリを読む横断の文脈、500種類以上の形式に対応したシークレット検出がパブリックプレビューで加わった。レビュー結果の活用度をリポジトリごとに見る画面も入り、Azure DevOps向けは一般提供になった。","\n【概要】GitHubは2026年11月17日、Copilotコードレビューの一連の更新を発表した。レビューの深さを自動で決めるAdaptive、リポジトリをまたぐ文脈の参照、レビュー中のシークレット検出、Repository insightsでのレビュー成果の追跡、Azure DevOps向けの一般提供が含まれる。\n\n【背景】AIによるコードレビューは広く使われるようになったが、すべてのプルリクエストを同じ深さで見ると、簡単な変更には過剰で、危険な変更には不足しがちだ。また、変更が別のリポジトリの依存先に与える影響や、紛れ込んだ秘密情報は見落とされやすい。\n\n【詳細】Adaptiveは、各プルリクエストの複雑さと危険度を評価し、Lite、Balanced、Maxのいずれかの深さでレビューする。どの段階を選んだかはレビューに表示され、既定は引き続きBalancedだ。企業や組織、リポジトリで決めた上限を超える段階は選ばない。横断の文脈は公開リポジトリのみが対象で、変更に依存する他リポジトリのコードや、別の場所にある文書、カスタム指示、スキルを読める。シークレット検出は、150社以上の提携先による500種類以上の既知の形式を正規表現などで見つけ、形式のない秘密はLLMと専用モデルで探す。Repository insightsでは、指摘がどれだけ対応されたかなどを確認できる。Azure DevOps向けは一般提供となり、利用料はAzureの契約に紐づくGitHub AIクレジットで請求される。\n\n【ポイント・注意点】Adaptive、横断の文脈、シークレット検出はパブリックプレビューで、仕様が変わる可能性がある。対象プランはCopilot Pro、Pro+、Max、Business、Enterprise。シークレット検出は、リポジトリか組織の設定でCopilotのCode reviewから有効にする必要がある。Adaptiveを1件だけ試すならReviewersの欄から選べ、既定にしたい場合は個人、リポジトリ、組織、企業の各設定で指定できる。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-copilot-code-review-adaptive-effort-secret-detection-and-more"],["MicrosoftのMAI Code 2とFlashがCopilotに登場","GitHubは、Microsoftのコーディング向けモデル「MAI Code 2」と軽量版「MAI Code 2 Flash」をGitHub Copilotで提供すると発表した。MAI Code 2は深いデバッグや複数ファイルの実装など複雑な作業向け、Flashは説明や小さな修正など日常の作業向けで、Flashは無料プランでも使える。あわせて旧版MAI-Code-1.1-Flashを12月18日に廃止すると告知した。","\n【概要】GitHubは2026年11月17日、Microsoftのコーディングモデル「MAI Code 2」と「MAI Code 2 Flash」がGitHub Copilotで使えるようになったと発表した。どちらもエージェント型のコーディングを想定し、作業に応じて使い分けられるようにしている。\n\n【背景】Copilotには複数の提供元のモデルが並び、新モデルの追加と旧モデルの廃止が続いている。Microsoft自身のMAIシリーズもその一角で、今回の第2世代の投入に合わせて旧版の整理も進める。\n\n【詳細】MAI Code 2は汎用のコーディングモデルで、要点を絞った応答と実用的なコード変更により、少ないやり取りで結果にたどり着けるようにしたという。深いデバッグ、複数ファイルにまたがる実装、リファクタリング、リポジトリ全体を見た推論といった複雑な作業に向く。MAI Code 2 Flashは軽量で費用を抑えたモデルで、コードの説明、狙いを絞った編集、定型的な修正、素早い試行錯誤に向く。どちらも従量課金だが、具体的な価格はこの告知には書かれていない。MAI Code 2はCopilot Pro、Pro+、Max、Business、Enterpriseで、FlashはこれらにFreeとStudentを加えたプランで使える。VS Code、Visual Studio、Copilot CLI、クラウドエージェント、Copilotアプリ、github.com、GitHub Mobile、JetBrains、Xcode、Eclipseで選べる。\n\n【ポイント・注意点】同じ日に、旧版のMAI-Code-1.1-FlashをCopilotの全体験から12月18日に廃止することも告知された。利用者はそれまでにワークフローや連携を最新のFlashモデルへ移す必要がある。企業の管理者は、後継モデルのポリシーがCopilot設定で有効になっているか確かめておきたい。視覚対応や性能向上の詳細は、Microsoft側の発表にまとめられている。BusinessとEnterpriseでは、既定のモデル有効化が働いていれば新モデルは自動で有効になるが、管理者がグローバルの既定を切っている場合や個別に無効にしている場合は手動で有効にする必要がある。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-mai-code-2-and-mai-code-2-flash-in-github-copilot"],["Copilotの活動をMicrosoft Agent 365で監視可能に","GitHubは、企業がGitHub Copilotのエージェント活動をMicrosoft Agent 365へ直接流せるようになったと発表した。GitHub.comのクラウドエージェント、Copilot CLI、VS Code、Visual Studio、JetBrainsやEclipseでの操作を、他のAIの仕事と並べて確認できる。プロンプト、応答、ツール呼び出しまで見られ、Enterprise Managed Usersを使う企業が対象だ。","\n【概要】GitHubは2026年11月17日、GitHub Copilotのエージェント活動をMicrosoft Agent 365へ直接ストリーミングできるようになったと発表した。Copilotの各クライアントの監査データを、Microsoftのエージェント管理基盤に集められる。\n\n【背景】企業では、コーディング用のCopilotだけでなく、業務の様々な場面でAIエージェントが動き始めている。管理者にとっては、それぞれの活動を別々の画面で追うのではなく、1か所でまとめて見て、危険を見つけたいという要望が強い。Agent 365はそうしたAIの仕事を束ねる管理面として位置づけられている。\n\n【詳細】対応するのは、GitHub.com上のクラウドエージェント、Copilot CLI、Visual Studio Code、Visual Studio、そしてJetBrainsやEclipseなどの提携IDEである。管理者はAgent 365上で、利用者のセッションをプロンプト、応答、ツール呼び出しの単位まで確認でき、利用の傾向も見られる。さらにMicrosoft PurviewとMicrosoft Defenderで追加の危険情報を参照し、調査や対処につなげられるという。始め方は、GitHub Docsの「企業の監査ログをストリーミングする」という文書で説明されている。\n\n【ポイント・注意点】この機能を使えるのは、Enterprise Managed Usersを使うGitHub Enterprise Cloudの顧客に限られる。それ以外のプランや条件については告知に記載がない。プロンプトや応答の中身まで管理者が確認できるようになるため、導入する企業は、利用者への周知や、監査データの扱い方の取り決めもあわせて検討しておきたい。同じ日には、Copilot CLIでMicrosoft Entraによるサインインのプレビューも発表されており、Microsoftの企業向け基盤との統合が一段と進んでいる。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-monitor-github-copilot-activity-through-microsoft-agent-365"],["JetBrains版Copilot、クラウドの砂場や音声入力を追加","GitHubは、JetBrains IDE向けGitHub CopilotのIgnite版リリースを発表した。Copilotのセッションを手元ではなくGitHubが用意する隔離環境で動かすクラウドサンドボックス、他のクライアントからチャットを開けるリモートアクセス、ブラウザ操作、端末内で完結する音声入力がパブリックプレビューで入った。JetBrains IDE 2025.2の対応は終了した。","\n【概要】GitHubは2026年11月17日、JetBrains IDE向けGitHub Copilotの更新を発表した。リモートアクセス、端末内で処理する音声入力、ブラウザ操作の管理などが加わり、会話やモデル選択の改善、品質の修正、企業向け設定の変更も含まれる。\n\n【背景】Copilotは、VS Codeだけでなく様々なエディタやアプリで、同じエージェントを扱える方向へ進んでいる。JetBrains版でもクラウドでの実行や、他のクライアントとの間でのセッションの受け渡しへの対応が進められてきた。\n\n【詳細】クラウドサンドボックスはパブリックプレビューで、GitHubが用意する隔離環境でコードの変更やコマンド、テストを実行し、手元の資源を空けて複数のセッションを並行して動かせる。リモートアクセスは任意で有効にする機能で、JetBrainsで始めたチャットをVS CodeやCopilotアプリから開ける。ブラウザ操作はChrome拡張と組み合わせてページの移動や読み取り、フォーム操作を行う。端末内の音声入力はモデルを取り込んで使い、送信を押すまで編集できる下書きとして残る。使い勝手の面では、Enterで実行中のエージェントの進路を変え、Ctrl+Enterで次の指示を待ち行列に入れられるようになった。モデル選択ではCopilot Fusionが先頭に固定された。\n\n【ポイント・注意点】企業が管理する設定では、管理者のポリシーが例外を認めない限りClaudeとCodexが無効になる。コードレビューはCopilotエージェントのレビュー機能を使う形に変わった。Mavenプロジェクトを開くと依存関係の座標をGitHub Advisoriesへ送って脆弱性を確かめる処理も復活している。JetBrains IDE 2025.2の対応は終わり、2025.3以降、推奨は2026.2以降への更新が必要だ。クラウドサンドボックスとリモートアクセスは段階的に展開されるため、すぐに表示されない場合もある。最新版はJetBrains Marketplaceから入手できる。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-github-copilot-in-jetbrains-ignite-releases"],["Copilotレビューの効き目をリポジトリごとに可視化","GitHubは、リポジトリのInsightsタブに「Repository insights」ページを加え、Copilotコードレビューの指摘がどれだけ受け入れられているかを見られるようにした。対応された指摘や高重要度の指摘の数、Copilotのレビュー後に人が修正を求めなかったプルリクエスト、Copilotを通らずにマージされたプルリクエストなどを示し、APIでも同じ指標を取れる。","\n【概要】GitHubは2026年11月17日、リポジトリのInsightsタブの最初の項目として「Repository insights」ページを追加した。Copilotコードレビューの指摘が各リポジトリでどう受け止められているかを確認できる。\n\n【背景】AIによるコードレビューを導入した組織にとって、その指摘が本当に役立っているのか、人のレビューを減らせているのかは把握しにくかった。どのリポジトリでCopilotのレビューが使われず素通りしているかも見えにくく、導入効果の説明や利用の広げ方を考える材料が不足していた。\n\n【詳細】リポジトリごとの要約として、4つの指標が示される。対応されたCopilotの指摘、対応された高重要度の指摘、Copilotがレビューした後に人のレビュアーから変更要求を受けなかったプルリクエスト、そしてCopilotのレビューを通らずにマージされたプルリクエストである。加えて、評価できる指摘のうち対応された割合を示す「対応率」の画面があり、分子と分母、評価できなかった除外分、時間の推移、内訳を確認できる。Copilotが残す指摘の種類を示す画面もある。同じ指標は、Copilot利用状況APIの企業・組織向けリポジトリ1日レポート（repos-1-day）でも取得できる。\n\n【ポイント・注意点】ページは、リポジトリの読み取り権限があれば誰でも見られる。APIでレポートを取得できるのは、企業オーナー、請求管理者、組織オーナー、「View Copilot Metrics」権限を含む独自ロールを持つ利用者に限られる。いずれもCopilot利用指標のポリシーが有効になっている必要がある。GitHubは、レビューの抜けを見つけて、Copilotの有効化を的を絞って進めるのに役立てるよう勧めている。なお、告知には料金や対象プラン、展開の時期についての記載はない。同じ日に発表されたコードレビューの深さの自動調整などと組み合わせれば、導入の効果を数字で確かめながら運用を見直せる。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-track-copilot-code-review-outcomes-in-repository-insights"],["Copilot CLIがMicrosoft Entraでのサインインに対応","GitHubは、GitHub Copilot CLIでMicrosoft Entra認証をパブリックプレビューとして使えるようにした。Entraアカウントでサインインすると、組織の権利に応じて、ひも付いたGitHubのEnterprise Managed Userアカウントか、Microsoft 365 Copilotのライセンス、またはその両方を使える。M365側ではGitHubアカウントなしで端末からモデルを使える。","\n【概要】GitHubは2026年11月17日、GitHub Copilot CLIがMicrosoft Entraによるサインインにパブリックプレビューとして対応したと発表した。Entraのアカウントで入ると、組織の契約に応じてGitHubのEnterprise Managed User（EMU）アカウント、Microsoft 365 Copilotのライセンス、またはその両方を利用できる。\n\n【背景】Microsoftの製品群で働く企業では、社員のIDをEntraで一元管理していることが多い。開発者がGitHub用に別のサインインを求められるのは手間であり、管理者にとってもIDの管理が分かれる。Copilot CLIをEntraに直接つなぐことで、この二重管理を減らす狙いがある。\n\n【詳細】EMU向けの対応は、OIDCでEMUを使う企業が対象だ。サイレントSSOにより、利用者はEntraのIDでCLIからGitHubに入れ、別のサインインは要らない。Copilot BusinessかEnterpriseのライセンスが割り当てられ、組織でCopilot CLIのポリシーが有効になっている必要がある。推論はGitHub経由で行われ、利用は組織のCopilotプランに従う。一方、Microsoft 365 Copilot向けの対応は、従量課金のMicrosoft 365 Copilotライセンスを持つFrontierの組織が対象だ。端末からMicrosoft Copilotのモデルを使え、推論はMicrosoft 365経由で行われ、GitHubアカウントは不要となる。Work IQのMCPサーバーを使えば、Microsoft 365の業務データを文脈として渡すこともできる。\n\n【ポイント・注意点】いずれもWindowsとmacOSで動き、Linuxへの対応は今後の予定とされている。EMUのSSOはCopilot CLIとVS Codeに限られ、企業でEnterprise Managed Authorizationを有効にしておく必要がある。利用にはCLIのバージョン1.0.113以降が要り、端末でcopilot updateを実行すれば更新できる。Microsoft 365側では、モデルの利用範囲や上限をMicrosoft 365 Copilotの設定で管理する。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-github-copilot-cli-adds-microsoft-entra-sign-in-as-a-preview"],["自作スキルやMCPを試験する「Copilot Evals」公開","GitHubは、Copilotの使い方が自分の環境でうまく働いているかを確かめる「GitHub Copilot Evals」をパブリックプレビューで公開した。スキル、カスタムエージェント、MCPツールについて、繰り返し実行できる評価を作り、合否を見て、変更の前後を比べられる。/evalコマンドや自然な言葉で操作でき、VS Code、Copilot CLI、Copilotアプリで使える。","\n【概要】GitHubは2026年11月17日、「GitHub Copilot Evals」をパブリックプレビューとして公開した。スキル、カスタムエージェント、MCPツールといった自分のCopilotの設定が、期待どおりに働いているかを確かめるための仕組みである。\n\n【背景】AIの出力は実行するたびに変わるため、一度うまくいったからといって、その設定が効いている証拠にはならない。プロンプトやモデル、スキル、ツールは次々に変わり、どこを直せばよいのか判断しにくい。GitHubは評価（eval）を「AIの振る舞いに対する繰り返し可能なテスト」と定義し、現実的な課題を与えて、良い結果の基準を決め、出力とそこに至る過程の両方を確かめるものだと説明している。\n\n【詳細】利用者は、自然な言葉か/evalコマンドで、プロジェクト内のスキル、カスタムエージェント、MCPツールに対する評価を作れる。実行するとどの確認項目が通り、どれが落ちたかが分かり、落ちた理由を調べて次に何を変えるかを決められる。変更の前後の実行結果を比べ、改善したかどうかも確かめられる。各実行は始める前に利用者の承認が必要だ。仕組みの中核には、拡張可能なローカルの評価ツール「Vally」が使われている。VS CodeではVisual Studio Marketplaceの拡張を入れ、Copilot CLIではgithub/evalsリポジトリの手順でプラグインを入れる。Copilotアプリでは、Customizeからgithub/evalsのマーケットプレイスを追加して導入する。\n\n【ポイント・注意点】対象はCopilot Individual、Business、Enterpriseのプランで、パブリックプレビューの段階にある。告知には料金や利用の上限、細かな設定についての記載はない。文書はaka.ms/evalsにまとめられ、意見はgithub/evalsリポジトリのIssueやGitHub Communityで受け付けている。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-github-copilot-evals-is-now-in-public-preview"],["マージ前にシークレット検査、エージェントからも実行可","GitHubは、Copilotのセキュリティレビュー担当がGitHubのシークレットスキャンを実行できるようにした（パブリックプレビュー）。開発者やエージェントが、マージ前に変更内容から秘密情報を探せる。150社以上の提携先と作った500種類以上の形式の検出に加え、周りのコードを読む専用モデルで形式のない認証情報も探す。Copilot CLI、アプリ、SDK、コードレビューで使える。","\n【概要】GitHubは2026年11月17日、Copilotのセキュリティレビュー担当がGitHubのシークレットスキャンを実行できるようになったと発表した。開発者とエージェントが、マージ前に変更内容から秘密情報を見つけられる。機能はパブリックプレビューである。\n\n【背景】AIエージェントがコードを書いて変更を出す場面が増え、パスワードやAPIキーが紛れ込んだまま進んでしまう危険も増している。Copilotのセキュリティレビューはこれまで、LLMだけで露出した秘密情報を探していた。\n\n【詳細】利用者が有効にすると、LLMによる検出に加えて、GitHubのシークレットスキャンの検出器が動く。提携プログラムを通じて150社以上と作った、500種類以上の秘密情報の形式を見つけられる。さらにGitHubが調整した専用モデルが周りのコードを読み、接続文字列の中のパスワードや認証情報など、決まった形式のない秘密も探す。調べるのは変更内容だけで、リポジトリの履歴は対象外だ。Copilot CLIとアプリでは、エージェントにsecurity-review担当を呼ばせるか、自分で/security-reviewを実行する。SDKでは、エージェントが変更を返す前にセキュリティレビューを頼めるため、独自の検出器を保守しなくて済む。コードレビューでは、プルリクエストの追加行にある秘密情報を指摘できる。\n\n【ポイント・注意点】シークレットスキャンは既定でオフで、オンにするまでは従来のLLMによる検出だけが働く。CLIでは対話中に/settings aiSecretDetection onを実行し、アプリでは設定のExperimentalから、コードレビューではリポジトリ設定のCopilotのCode reviewから有効にする。追加のプランは不要だが、スキャンはSecret Protection AI Credit SKUのAIクレジットを消費する。すでにCopilotのセキュリティレビューやコードレビューを使える利用者なら、そのまま試せる。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-secret-scanning-on-demand-for-developers-and-agents"],["Copilot CLIとClaude Codeを同じモデルで比較する画面","GitHubは、GitHub Copilotのベンチマークサイトに「Harnesses」画面と科学分野のTerminal-Bench-Science 0.1を加えた（パブリックプレビュー）。同じモデル、同じ推論の強さで、Copilot CLIとClaude Code、Codex CLIの解決率とタスクあたりの費用を比べられる。比べるのは中程度の推論で完全に一致するモデルの組だけで、Fusionなどは除外されている。","\n【概要】GitHubは2026年11月17日、GitHub Copilotのベンチマークサイトに、新しい「Harnesses」画面と、科学研究向けの評価「Terminal-Bench-Science 0.1」を追加したと発表した。どちらもパブリックプレビューである。\n\n【背景】AIコーディングでは、同じモデルを使っていても、それを動かす実行基盤（ハーネス）の作りによって成果や費用が変わる。GitHubのベンチマークサイトはこれまで、Copilotのハーネスで動かした各モデルを、解決率、推論の強さ、タスクあたりの費用で比べてきた。今回はハーネスそのものの違いを見せる画面を加えた。\n\n【詳細】Harnesses画面では、同じモデルを同じ推論の強さで動かした場合の、GitHub Copilot CLI、Claude Code、Codex CLIを比較する。例として、DeepSWE 1.1での解決率とタスクあたりの平均費用の図が示されている。散布図では結果ごとに点を打ち、対応する結果を線で結び、公開された複数回の実行のばらつきを楕円で示す。対応するモデルごとに、Copilot CLIの解決率の差をポイントで、費用の削減を割合で示し、約95%のブートストラップ区間も添える。Terminal-Bench-Science 0.1は、生命、物理、地球、数理、工学の各分野の専門家が作り、点検した課題で、コーディング以外の研究の流れを評価する。\n\n【ポイント・注意点】比較に載るのは、中程度の推論で完全に一致するモデルの組だけである。GitHub Copilot FusionのようなCopilot専用の構成や、相手のない結果は、別のモデルと比べずに除外している。GitHubはこの画面でCopilotのハーネス改良の成果が見えるとしているが、運営しているのは比較される側のGitHub自身である点は意識しておきたい。自分のチームで使うハーネスを選ぶ際は、こうした公開データを参考にしつつ、実際の作業で試して確かめるのが確実だ。Terminal-Bench-Science 0.1の結果は、ベンチマークの選択欄から確認できる。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-github-copilot-benchmarks-site-adds-harness-comparisons"],["ポーリング不要、エージェント向けGitHub Event Streams","GitHubは、プルリクエストの出来事をつなぎっぱなしの接続で受け取れる「GitHub Event Streams」をプレビューで公開した。レビューの提出、新しいコミット、マージの衝突、マージやクローズ、チェックの変化を通知し、エージェントは仕事がない間は休み、届いたら再開できる。公開のWebhook受け口が要らないため、ノートPC上のエージェントでも使える。","\n【概要】GitHubは2026年11月17日、「GitHub Event Streams」をプレビューとして公開した。GitHubを開発者、エージェント、自動化をつなぐリアルタイムの調整役と位置づけ、エージェントが仕事のない間は待機し、仕事が来たら再開できるようにする仕組みである。\n\n【背景】エージェントがプルリクエストへの反応を待つ場合、これまでは定期的に問い合わせるポーリングが一般的だった。しかしポーリングは、たいてい新しい情報のない問い合わせでレート制限の枠を使ってしまう。逆に間隔を空けると、レビューの指摘が次の確認まで放置される。GitHubは、Event Streamsによってフィードバックから行動までの間を縮め、トークンとレート制限の消費を減らし、ポーリングの仕組みを作ったり調整したりする手間をなくせるとしている。\n\n【詳細】使い方は、プルリクエストを購読し、GitHubにつないで接続を開いたままにし、イベントを受け取るという流れだ。通知されるのは、レビューの提出、新しいコミットのプッシュ、マージの衝突の発生、プルリクエストのマージまたはクローズ、プルリクエストのチェックスイートの変化、そしてチェックスイートごとの状態の変化である。公開されたWebhookの受け口は必要ないため、ノートPCで動くエージェントでもイベントを受け取れる。\n\n【ポイント・注意点】プレビューはすべてのGitHubプランが対象だが、利用するには順番待ちのリストに登録し、承認を受ける必要がある。申し込みはgh.io/event-streams-signupから行う。告知には料金や具体的なレート制限の数値、プルリクエストの購読以外の設定についての記載はない。意見はGitHub Communityのディスカッションで受け付けている。自前でポーリングの間隔を調整してきたエージェントの開発者にとっては、仕組みを簡素にでき、レート制限の枠も節約できる選択肢になりそうだ。使い方の詳細は、告知からリンクされたEvent Streamsの文書で確認できる。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-github-event-streams-is-now-in-preview"],["jQuery 4.1.0公開、ReDoS修正やXML対応","jQueryの新版4.1.0が11月17日にGitHubで公開され、Hacker Newsでも話題になった。セレクターの識別子照合にあったReDoS脆弱性の修正、Safari 27の正規表現の不具合への回避策、jqXHRへのresponseURLの追加、XML文書を扱えるCSS処理、フォームに関わるカスタム要素のシリアライズ対応などを含む。機械生成の貢献に関する指針も加わった。","\n【概要】JavaScriptライブラリjQueryの新版4.1.0が、2026年11月17日にGitHubのリリースとして公開された。4.0系の機能追加と修正をまとめた版で、Hacker Newsでも取り上げられ注目を集めた。\n\n【背景】jQueryは長い歴史を持つライブラリで、メジャー版の4.0では古い仕組みの整理が進められた。今回の4.1.0は、その流れを受けた改良と、セキュリティやブラウザの不具合への対応を含んでいる。\n\n【詳細】Ajaxでは、jqXHRにresponseURLの欄が加わり、トランスポートが別の完了コールバックの仕組みを使えるようになった。中核部分では、ループが配列の範囲を越えて回らないよう書き直され、getElementsByTagNameとgetElementsByClassNameの利用をやめてquerySelectorAllに一本化した。CSSでは、createElementNSに切り替えてXML文書に対応した。セレクターでは、識別子の照合にあったReDoS脆弱性を修正し、Safari 27の正規表現インタープリターの不具合を回避した。不正なエスケープのコードポイントはU+FFFDに置き換えるようになり、jQuery.uniqueSortの重複除去も最適化された。シリアライズでは、フォームに関わるカスタム要素に対応した。データ部分ではファイルサイズも少し削った。\n\n【ポイント・注意点】文書面では、機械生成の貢献についての指針が加わり、商用サポートの提供元としてTuxCareが追記された。AIが書いたコードの持ち込みが増えるなか、老舗のOSSが受け入れの方針を明文化した点も目を引く。ReDoSの修正を含むため、ユーザーの入力をセレクターに使う可能性があるサイトでは、早めの更新を検討したい。テスト面でも、jQuery.textやSVG要素での.data()、シリアライズの部分などに向けた試験が多く追加され、IEでのAjaxのバイナリデータの試験も再び有効になった。","2026-11-17","GitHub","https://github.com/jquery/jquery/releases/tag/4.1.0"],["Copilotのカスタマイズを公認プラグインに限定可能に","GitHubは、企業の管理者がCopilotのカスタマイズの出どころを制限できる管理設定「strictPluginOnlyCustomization」を導入した。スキル、カスタムエージェント、フック、MCPサーバー、実行型の拡張の5分類について、利用者やプロジェクトが単独で入れた設定を止め、プラグインか管理設定経由のものだけを許可できる。分類ごとに選んで適用することもできる。","\n【概要】GitHubは2026年11月16日、企業の管理者がGitHub Copilotのカスタマイズの出どころを指定できるようにしたと発表した。選んだカスタマイズについて、利用者やプロジェクトが単独で用意した設定ではなく、プラグインか管理設定から来たものだけを使わせることができる。\n\n【背景】Copilotでは、スキルやカスタムエージェント、MCPサーバーなどを誰でも追加できるようになり、便利さと引き換えに、何が組織の中で動いているのか把握しにくくなっていた。MCPなどを丸ごと禁止すれば安全だが、便利な機能も失う。GitHubは、承認済みのMCPツールやキャンバスを共有のプラグインライブラリで配り、機能そのものは止めずに管理できるようにする狙いだと説明している。\n\n【詳細】新しい管理設定「strictPluginOnlyCustomization」は、利用者とプロジェクトからの単独のカスタマイズを遮断する。対象となるプラグインと管理設定は、他のポリシーの範囲で引き続き許可される。対象は、スキル、カスタムエージェント、フック、MCPサーバー、そして実行型のCopilot拡張の5分類で、実行型のキャンバス提供者は含むが、VS Code Marketplaceの拡張は含まない。5分類すべてに適用することも、一部だけに適用することもでき、たとえばMCPサーバーと拡張だけを締め、スキル、エージェント、フックは開けておく、といった使い方ができる。\n\n【ポイント・注意点】GitHubは「プラグイン限定は、企業が管理するプラグイン限定という意味ではない」と明記しており、この設定だけではマーケットプレイスの許可リストにならない。どのマーケットプレイスを認めるかを絞るには、strictKnownMarketplacesと組み合わせる必要がある。設定はGitHub Enterprise Cloudで、企業か傘下の組織が発行したCopilot BusinessまたはEnterpriseのライセンスを持つメンバーが対象となる。","2026-11-16","GitHub Changelog","https://github.blog/changelog/2026-11-16-control-where-github-copilot-customizations-come-from"]],"elec":[["フロッピー1枚に収まる言語モデル、DOS機で会話","486DXやPentiumのDOS機で動く対話プログラム「Tiny2.1 DOS PC Chatbot」をHackadayが紹介した。作者はWollyMonjac。約36万7000パラメーターの第2世代トランスフォーマーで、8ビットの重みは380KB。3500件の事実を覚え、必要な空きメモリーは540KB。画面まわりを含めて当時のフロッピーディスク1枚に収まる。学習用スクリプトはMITライセンスでGitHubに公開され、自分の用意した事実で学習し直せる。","\n【概要】Hackadayは2026年11月18日、DOSで動く小さな言語モデル「Tiny2.1 DOS PC Chatbot」を紹介した。作者はWollyMonjacで、成果物はGitHubで公開されている。486DXまたはPentiumを積んだ古いPCで動き、システム全体が当時のフロッピーディスク1枚に収まるのが最大の特徴だ。\n【背景】大規模言語モデルは巨大な計算資源を必要とするという印象が強いが、モデルを極端に小さくして古いハードウエアで動かす試みも続いている。本作も、以前に486のDOS上で動いた言語モデルの後を継ぐ第2世代のトランスフォーマーだという。Hackadayは、言語モデルの仕組みそのものはここまで小さな機械にも載ることを示す例として取り上げている。\n【詳細】ネットワークの重みは8ビットで380KB、パラメーター数は約36万7000。3500件の事実を覚えており、動作には540KBの空きメモリーが必要になる。ディスクの残りの容量にはユーザーインターフェースが入っている。記事によると、Turbo C 2.0で書かれたコードは「Fable 5.2」と呼ばれるLLMが書き、モデルの学習は「Opus 5.5」と呼ばれるLLMが担った。学習用スクリプトはMITライセンスでGitHubに置かれており、利用者は自分で用意した事実の集まりを使ってモデルを学習させ直すことができる。古いPCを持っている人なら、手元の機械で自作の知識ベースを試せることになる。\n【ポイント・注意点】作者自身、このモデルは作り話をすると認めており、それはモデルの大きさにかかわらず起こると述べている。記事のコメント欄では、17×23の計算を間違えたという指摘も出た。作者は、LLMは計算が苦手で、正確な答えには決定的に動く電卓の層が要るが、それはフロッピーに収まらなかったと答えている。実用の道具というより、言語モデルをどこまで小さくできるかを示す作品と見るのがよい。モデルの学習を自分の手で試したい人や、眠っている古いPCを生かしたい人には良い題材になりそうだ。","2026-11-18","Hackaday","https://hackaday.com/2026/11/18/not-so-large-language-model-fits-on-a-floppy-disk/"],["Arduino VENTUNO Qで100万件を検索、端末内のAI記憶","Arduino公式ブログに、Moorcheh.aiのCEOタラ・カーニ氏が、Arduino VENTUNO Q上で動く検索と記憶の仕組みを寄稿した。埋め込みベクトルを1次元あたり1ビットに圧縮し、1536次元を192バイトにする。100万件の検索は中央値14.84ミリ秒で、索引の作成時間は0秒。HNSWと比べてメモリーを大きく減らせるとする。音声認識や物体検出と同時に動かす構成例も示している。","\n【概要】Arduino公式ブログは2026年11月18日、Moorcheh.aiのCEO兼共同創業者タラ・カーニ氏による記事を掲載した。Arduino VENTUNO Qの上で、数百万件規模のマルチモーダル検索と、AIエージェント用の記憶を端末だけで動かす方法を紹介している。執筆は開発元自身で、数値も同社の測定によるものだ。\n【背景】ロボットや店頭端末でAIエージェントを動かすには、過去の出来事や大量の資料を素早く引き出す「記憶」が要る。一般的なベクトル検索の索引は大きなメモリーと長い構築時間を必要とし、小型ボードには重い。VENTUNO QはQualcomm Dragonwing IQ-8275（最大40 TOPSのHexagon NPU）と16GBのLPDDR5を積み、リアルタイム制御用にSTM32H5も載せたボードだ。\n【詳細】Moorchehは埋め込みベクトルを1次元あたり1ビットに圧縮し、1536次元のベクトルを192バイトにする。検索はCPUでビット列を正確に総当たりし、候補を絞ってから並べ替える方式で、NPUは推論用に空けておける。100万件での比較では、索引の構築時間がHNSWの2時間58分に対して0秒、メモリーは7.4GBに対して737MB、ディスクは13.2GiBに対して294MiB。検索時間は並べ替えを含めて中央値14.84ミリ秒だった。同時に動かす構成として、BGE-smallの埋め込み、GenieX経由のQwen 2.5 3B/7B、Whisper small、Piper TTS、1080p映像でのYOLOv8nを挙げ、合計5.0〜7.6GBに収まるとしている。オープンソースの記憶層Memantoも紹介された。\n【ポイント・注意点】用途として、100万件の商品を約15ミリ秒で引けるオフラインの店頭端末、移動ロボットの出来事の記憶、100万件以上の回路図や保守動画を持ち歩く技術者向けキットを挙げている。ただし開発元による寄稿で、比較の数値も同社の測定である点は割り引いて読みたい。本文はQwen 2.5を挙げる一方、参考リンクはQwen3-4B-Instructを指しており、記述に食い違いもある。","2026-11-18","Arduino Blog","https://blog.arduino.cc/2026/11/18/building-agentic-memory-at-the-edge-with-moorcheh-on-arduino-ventuno-q-scale-multimodal-search-engine-to-millions-of-records/"],["スタックチャンをMetaのMuseで動かし、Google TTSで喋らせる","スタックチャン（M5Stack CoreS3）を、Metaが公開するMuseガジェットSDKで動かし、Google Cloud TTSで声を出せるようにした製作記がZennに投稿された。SDKは返答を文字でしか返さないため、文単位に分けてMP3を取り寄せ、既存のスピーカー経路で再生する。話しかけてから声が出るまでは約8秒。SDK本体は書き換えず、独自部品とパッチ1つで実現した。","\n【概要】Zennで2026年11月18日、Hideyuki Fujikawa氏が、スタックチャンをMetaの「Muse」ガジェットにして、Google Cloud TTSで喋らせた製作記を公開した。スタックチャンはM5Stack CoreS3（ESP32-S3）を土台にした手のひらサイズのロボットだ。記事では、SDKはMetaの公式リポジトリ（facebookincubator/muse-gadget-sdk）だと説明している。\n【背景】MuseのSDKは、AIの返事を文字でしか返さない。そのままではスタックチャンの「しゃべるロボット」らしさが生かせないため、作者は文字を音声に変える仕組みを足すことにした。開発はESP-IDF v6.0.3で行い、記事によるとこれがSDKの対応する唯一の版だという。ビルドはWSL2のUbuntuで行い、書き込みはWindowsのCOMポートからPlatformIOのesptoolで行った。\n【詳細】SDK本体には手を入れず、作者のリポジトリ「stackchan-muse」の独自部品と、パッチ1つ（patches/0002-google-tts.patch）を当てる方式を取った。Museのデバイス用トークンとGoogle Cloud TTSのAPIキーはファームウエアに埋め込まず、シリアル経由で書き込む。ペアリングとWi-Fi設定はMuseのアプリが受け持つ。返事は文ごとに分けてGoogle TTSにMP3を頼み、既存のデコーダーとスピーカーの経路で再生する。最初の区切りを約120バイトと短くして、話し始めまでの待ちを減らしている。既定の声はja-JP-Neural2-Bで、24kHzのMP3を16kHzに変換して鳴らす。\n【ポイント・注意点】記事によれば、話しかけてから声が出るまで約8秒かかる。TTSの要求は8秒で打ち切って最大3回やり直し、12秒を過ぎると文字表示に切り替える。Google Cloudには支払い用アカウントの登録が要るが、試す程度なら無料枠で収まるとしている。リアルタイム音声通話の機能は未検証で、書き込み直しのあとにWi-Fiやペアリングが外れることがあり、長い返事の途中で一度再起動したとも記している。Museの裏で動くLLMの名前は書かれていない。","2026-11-18","Zenn","https://zenn.dev/fujihide/articles/cf3eb84525346c"],["ラズパイとVoskで、鳴き声を返す音声認識デバイス","ラズパイ3 Model B+とオフライン音声認識エンジンVoskで、「わんちゃん」「ねこちゃん」と話しかけると犬や猫の鳴き声を返す装置の作り方がZennで公開された。日本語の小型モデル（約50MB）を使い、音はDFPlayer Miniから鳴らす。配線、シリアルの設定、キーワードの判定までコード付きで説明している。ESP32-S3ではモデルが大きすぎて断念した経緯も書かれている。","\n【概要】Zennで2026年11月18日、フリーランスの組み込みエンジニアPiroft氏が「ラズパイとVoskで音声認識デバイスを作る」を公開した。マイクに「わんちゃん」「ねこちゃん」と話しかけると、対応する動物の鳴き声をスピーカーから流す装置で、ネットにつながずに動く音声認識の入門例になっている。\n【背景】音声で動く機器はクラウドの音声認識に頼ることが多いが、Voskを使えばラズパイの中だけで認識できる。作者は最初、ESP32-S3-WROOM-1で作ろうとしたが、認識モデルが大きすぎてうまくいかず、ラズパイに切り替えたという。\n【詳細】使う部品は、Raspberry Pi 3 Model B+、MP3を再生するDFPlayer Miniモジュール、ダイナミックスピーカー、USBの小型マイク。ラズパイのTX（8番ピン）をDFPlayerのRXに、RX（10番ピン）をDFPlayerのTXにつなぎ、両方の線に1kΩの抵抗を入れることを勧めている。シリアル通信はraspi-configで有効にする。音声認識は日本語の小型モデルvosk-model-small-ja-0.22（作者によれば約50MB）を使い、PyAudioで16kHz・16ビット・モノラルの音を取り込む。約1GBの大型モデルにも触れているが、こちらは試していない。認識した文字に「わん」「ワン」「いぬ」「犬」が含まれれば1番の音声ファイルを、「ねこ」「ネコ」「猫」なら2番を、pyserialで9600bpsの命令を送って再生させる。音量は0〜30のうち22に設定した。\n【ポイント・注意点】DFPlayerは起動に1.5〜3秒かかり、コードでは命令ごとに50ミリ秒待っている。microSDカードはFAT16かFAT32で整える必要がある。マイクの感度が低いときはalsamixerで調整するとよい。作者はこの作品を実験的なものと位置付けており、エラー処理や再試行は入っていない。認識の精度や反応の速さの数値も示されていないが、オフライン音声認識と電子部品の制御を組み合わせる第一歩として分かりやすい内容だ。","2026-11-18","Zenn","https://zenn.dev/piroft28/articles/10a81f3b06c45b"],["M5Stackの倒立振子、ベイズ最適化でゲインを探す","M5Stack Core2とMicroPythonで作った二輪の倒立振子について、PD制御のゲインをベイズ最適化で探し、その結果が再現するかを2日間・計300試行で調べた記事がQiitaに投稿された。最良のゲインは毎回同じ値にはならなかったが、Kp 40〜60、Kd 1.6〜1.9付近に集まった。作者は、一点の正解より良い範囲を地図にする方が大事だとまとめている。","\n【概要】Qiitaで2026年11月18日、@_Moony氏が、M5StackとMicroPythonで作った倒立振子のPDゲインをベイズ最適化で探し、その再現性を確かめた記事を公開した。11月15日に公開した前回の記事の続編にあたり、機械学習のタグが付いている。\n【背景】倒立振子は、倒れようとする車体を車輪で支える制御の定番の題材だ。ゲインの調整は手探りになりがちで、作者は前回、ガウス過程を使ったベイズ最適化で自動的に探す方法を試した。今回は、その探索を何度繰り返しても同じ答えにたどり着くのかを調べた。\n【詳細】ロボットはM5Stack Core2と2個のRoller485 Liteモーターユニットで作った二輪型で、バンパーで自力で起き上がれる。Core2がMicroPythonでPD制御を回し、Windows PCがベイズ最適化を担当する。両者はPCのモバイルホットスポット経由のHTTPでやり取りする。探索範囲はKpが0〜80、Kdが0〜4。1セットは30試行（初期6回と最適化24回）で、1試行は制御周期10ミリ秒で3秒間動かす。評価は1〜3秒の傾きの二乗平均平方根（RMS）で、起き上がりに失敗したり倒れたりすると罰点が付く。2日間で10セット、計300試行を行った結果、各セットで最良のRMSは約0.135度から0.483度まで幅があった。最良のゲインはKp 40〜60、Kd 1.6〜1.9付近に集まり、Kpの平均は1日目が53.951（標準偏差5.202）、2日目が48.686（同6.472）、Kdの平均は1.692と1.717だった。RMSが0.75度以下の試行は各日22回あった。\n【ポイント・注意点】作者は、厳密な最適値は繰り返すたびに変わるが、良い領域は重なると結論付けた。目安としてKp 50±5、Kd 1.7±0.1付近を挙げ、一点を探すより良い範囲を把握する方が大切だとしている。ただし多くのゲインは1回しか試しておらずばらつきを含むこと、日ごとの差は統計的に検定していないこと、結果はこの機体に固有であることに注意が要る。","2026-11-18","Qiita","https://qiita.com/_Moony/items/ab46d376db18a2e4fafb"],["複数の機械のメモリーを束ねてLLMを動かす「RAMDeck」を分析","llama.cppのRPC機能を使い、複数の機械のメモリーを束ねて大きな言語モデルを動かす「RAMDeck」について、構成と対応機種を整理した分析記事がDEV Communityに投稿された。中心となるハブ機の仕様は公開が少なく、電源の定格も資料で食い違う。Linuxの対応はx86_64だけで、ラズパイやRK3588、Jetsonを作業機に使えるかは確認されていないという。","\n【概要】DEV Communityで2026年11月18日、EmbedSBCが、分散型のLLM実行装置「RAMDeck」の仕組みを分析した記事を公開した。RAMDeckは、llama.cppのRPC機能を使って複数の機械のメモリーを束ね、1台では載らない大きさの言語モデルを動かすための製品だ。記事は、小型のシングルボードコンピューター（SBC）を参加させられるかに注目している。\n【背景】手元の機械で大きなLLMを動かしたいとき、最初に壁になるのはメモリー容量だ。記事の例では、32Bのモデルを4ビットにしても、重みだけで約16GBが必要で、さらにKVキャッシュやバッファーの分が加わる。複数の機械のメモリーを合わせれば、より大きなモデルを読み込めるようになる。\n【詳細】ハブは、Ethernetで接続しUSB-Cで給電する設定済みの専用機として売られている。ただしSoC、メモリー、ストレージ、Ethernetの速度は公開されていない。電源の定格も、公式のFAQは5V/3A、クラウドファンディングのFAQは5V/4Aとしていて一致しない。ノード用のUSBはノード用ソフトを起動するためのスティックで、メモリーやAIアクセラレーターを足すものではない。公開されているノードの参考実装はv0.9で、ggml-rpc-serverを使う。商用版のAPIはOpenAI互換の/v1/chat/completionsだと説明されている。リポジトリはApache 2.0にCommons Clauseを付けたライセンスで、全体を調整する部分と管理画面は公開されていない。対応するノードは、AVX2を持つWindows 10/11のx86_64機、CUDA 12のNVIDIA機、macOS 13.0以降のApple Silicon機、そしてx86_64のLinux機に限られる。\n【ポイント・注意点】Linuxの対応がx86_64だけのため、ラズパイ、RK3588、Jetsonを作業機として使えるかは確認されていない。また、メモリーを増やせば読み込めるモデルは大きくなるが、通信や処理の割り振りの負担が加わるため、文章を作る速度は上がらないと記事は指摘する。ベンチマークも価格も示されておらず、出荷の状況もキャンペーンページとWebサイトで説明が違う。購入を考える人は、こうした未確認の点に注意したい。","2026-11-18","DEV Community","https://dev.to/embedsbc/ramdeck-architecture-analysis-llamacpp-rpc-distributed-llm-memory-and-sbc-compatibility-2d7l"],["Claude Codeにスマホで実機を見せ、Pico 2で机の表示板","Raspberry Pi Pico 2 WHと1.3インチ液晶で机上のダッシュボードを作った記録がZennに投稿された。Claude Codeがコードとピン配置を決め、USBでつないだスマホのカメラをadbで操作して実機の画面を撮影し、書く・撮る・確かめるを繰り返した。写真から表示のはみ出しや値の誤りを見つけて直し、天気とトークン使用量を表示できるようにした。","\n【概要】Zennで2026年11月17日、OKZAQ氏が、Claude Codeにスマホのカメラで実機の画面を見せながら、Raspberry Pi Pico 2と1.3インチ液晶で机のダッシュボードを作った記録を公開した。AIがコードを書くだけでなく、実際の表示を目で確かめながら直していく流れを具体的に示している。\n【背景】マイコンの画面表示は、コードが正しく動いても、文字のはみ出しや重なりは実機を見ないと分からない。作者は、その確認をAIにも任せられないかと考えた。使ったスマホはGalaxy S10+（Android 12）で、Android 14 QPR1のWebカメラ機能がないため、USB接続とadbで標準のカメラアプリを操作する方法を取った。\n【詳細】ハードはMicroPythonを入れたRaspberry Pi Pico 2 WH、DiyStudioの1.3インチ240×240 IPS液晶（ST7789VW、7ピン、CSなし、3.3V）、30列のブレッドボード。Claude Codeがコードを書き、ピンを選び、書き込み→撮影→確認のループを回した。人間は配線、USBデバッグの有効化、カメラの向きの調整を担当した。ファームウエアは0.2.0の黒い1画面から、0.3.0でワイプで切り替わる3画面、0.4.0でカラー化と43件のテスト通過へと進んだ。SPIは20MHzを指定すると12MHz、40MHzや62.5MHzでは24MHzになり、1画面の描画は24MHzで約38ミリ秒、12MHzで約77ミリ秒だった。写真から見つかった不具合には、最新データが欠けると気温が「--」になる、「Cloudy」が枠からはみ出す、最低気温が最高気温と同じ値になる（H10 L10）、アイコンが見出しに重なる、といったものがあった。\n【ポイント・注意点】天気は気象庁の札幌（016000）の予報とアメダスから取得し、トークン使用量はClaude Codeの手元の.jsonlログから数えている。作者は、これは課金のデータではないと断っている。気象庁のエンドポイントは公式に文書化されておらず、.jsonlの形式もClaude Code内部のものなので、将来変わる可能性がある。動作確認はPico 2 WHだけで、記事中のAmazonリンクはアフィリエイトだ。","2026-11-17","Zenn","https://zenn.dev/okzaq/articles/pico2-st7789-desk-dashboard"],["ラズパイ5を6月から、WhatsAppのAIアシスタントに","16GBのRaspberry Pi 5を、6月からWhatsAppで話しかけられるAIアシスタントとして使い続けている体験談がDEV Communityに投稿された。自己ホスト型のエージェント基盤OpenClawを動かし、推論はClaudeやChatGPTなど外部のモデルに任せる。ラズパイは記憶や予定、チャットの仲介だけを担う。外向きの通信だけで済ませる構成や、安全のための設定も紹介している。","\n【概要】DEV Communityで2026年11月17日、Bogdan Ionut Gheorghe氏が「My Raspberry Pi 5 has been my AI assistant on WhatsApp since June」を公開した。メモリー16GBのRaspberry Pi 5を、6月からWhatsAppで話しかけられるAIアシスタントとして動かし続けている体験談だ。\n【背景】手元の小さなコンピューターを常時動くAIの窓口にする使い方が広がっている。作者はラズパイでモデルを動かすのではなく、ラズパイを記憶や予定、チャットを扱う中継点にした。本人の言葉では「ラズパイ自身は一度もモデルを動かしていない」。推論はすべて外部の提供元で行い、Anthropicのモデル（作者はOpus、Sonnet、Fableを挙げる）とChatGPTを使う。\n【詳細】ラズパイ5はSDカードから起動する。ソフトは、作者が「オープンソースで自己ホスト型のエージェントゲートウエイ」と説明するOpenClawだ。WhatsAppとの連携は、WhatsApp Webと同じく「リンク済みデバイス」でQRコードを読み取るだけで済む。込み入った作業では、エージェントが補助のエージェントを立ち上げて分担させる。使い道として、Web検索、プレゼン資料づくり、技術的な相談を挙げている。ラズパイは外向きの通信しかしないため、外から入る通信のポートを開ける必要がない。エージェントは専用のプリペイドSIMの番号を使うことも、持ち主の番号を使うこともでき、後者では本人として振る舞うことになる。\n【ポイント・注意点】作者は安全のために、許可する電話番号を1つに絞る、ゲートウエイをラズパイ自身にだけ結び付ける、チャットからのシェル命令を禁じ、ファイルの操作を1つの作業フォルダーに限る、ファイアウオール、SSH鍵、自動のセキュリティー更新を有効にする、といった設定を勧めている。運用中の問題として挙げたのはメモリー不足だけだった。最初は手作業で組み、のちにスクリプトで作り直したところ、より順調になったという。APIの費用やトークン数、稼働率などの数値は記事に示されていない。","2026-11-17","DEV Community","https://dev.to/bogdangheorghe/my-raspberry-pi-5-has-been-my-ai-assistant-on-whatsapp-since-june-1fol"],["40 TOPSのNPUを積む産業用ボード、Forlinx OK8275AA-C","中国Forlinxが、Qualcomm Dragonwing QCS8275-AAを載せた産業用シングルボードコンピューター「OK8275AA-C」を出した。NPUの性能はINT8で40 TOPS（密）。メモリーは12GBのLPDDR5、記憶装置は256GBのUFS 3.1。絶縁したCAN-FDとRS485を備え、−40〜+85℃で動く。展示会では4台のUSBカメラと32本の映像を同時に処理する実演を行った。価格と発売時期は未公表。","\n【概要】CNX Softwareは2026年11月17日、Forlinxの産業用シングルボードコンピューター「OK8275AA-C」を紹介した。Qualcomm Dragonwing QCS8275-AAチップを載せたFET8275AA-Cモジュールを使い、AI処理用のNPUを中心に据えたボードだ。\n【背景】工場や交通の現場では、カメラ映像をその場でAI処理する需要が増えている。QCS8275には性能の違う版があり、今回のAA版は上位にあたる。記事によると、下位のQCS8275-AC版のNPUは20 TOPSにとどまる。\n【詳細】CPUは2.35GHzのCortex-A78が2基、2.1GHzのCortex-A78が2基、1.95GHzのCortex-A55が4基。GPUはAdreno 623、NPUはINT8で40 TOPS（密）だ。Electronica 2026では、4台のUSBカメラのライブ映像と32本の動画を同時に解析する実演を見せた。メモリーは12GBのLPDDR5、記憶装置は256GBのUFS 3.1で、microSDスロットとeMMCの選択肢もある。インターフェースはGbEと2.5GbE、絶縁したCAN-FDが4系統、絶縁したRS485が2系統、MIPI CSIが3系統、MIPI DSIとDisplayPort。電源は24Vの直流で、動作温度は−40〜+85℃。ソフトはLinuxカーネル6.18.44のBSPで、資料やドライバーのソースは顧客にだけ渡される。\n【ポイント・注意点】記事は、Forlinxが価格と発売時期を明らかにしていないと伝えている。筆者のJean-Luc Aufranc氏は、399ドルのArduino VENTUNO Qより高くなるだろうと見ている。対応するAIモデルや開発の枠組みも示されていないため、実際にどのモデルをどの速さで動かせるかは、今後の情報を待つ必要がある。それでも、40 TOPS級のNPUと豊富な産業用インターフェースを1枚にまとめた点は、現場でのAI映像解析を考える開発者には注目の選択肢になる。電子工作の視点では、趣味のボードとは価格帯も用途も異なる製品だが、エッジAIの性能がどこまで来ているかを知る目安にもなる。","2026-11-17","CNX Software","https://www.cnx-software.com/2026/11/17/forlinx-ok8275aa-c-a-qualcomm-qcs8275-industrial-sbc-with-12gb-lpddr5-256gb-ufs-storage/"],["Rockchip RK3668、44 TOPSのNPUで2027年に試作品","Rockchipの次期SoC「RK3668」の構成が変わり、CPUはCortex-A725が6基とCortex-A520が2基になった。NPUは44 TOPS（疎）、GPUはMali G2Pro MC4。メモリーは最大64GBのLPDDR5xか96ビットのLPDDR6。エンジニアリングサンプルは2027年第1四半期、SBCの初期試作は2027年前半の予定だとCNX Softwareが伝えた。仕様は暫定版だ。","\n【概要】CNX Softwareは2026年11月17日、Rockchipの次期SoC「RK3668」がCPU構成を変え、2027年第1四半期にエンジニアリングサンプルを出す予定だと報じた。RadxaとArmSoMが共有したRockchipの資料「RK3668 Application」と、Rockchip自身のスライドをもとにしている。\n【背景】RockchipのRK3588は、AI処理用NPUを積んだSBCの定番チップとして電子工作でも広く使われている。RK3668はその後継の一つと位置付けられ、どこまでAI性能が伸びるかが注目されている。当初は、Cortex-A730が4基とCortex-A530が6基の構成と伝えられていた。\n【詳細】新しい構成では、CPUはCortex-A725が6基とCortex-A520が2基になり、Rockchipの見込みでは最大2.5GHzと2.2GHzで動く。GPUはMali G2Pro MC4で1228 GFLOPS。NPUは44 TOPS（疎）で、筆者は1基最大8.8 TOPSのコアが5基ではないかと推測しているが、確認されたものではない。メモリーは最大64GBのLPDDR5xか96ビットのLPDDR6に対応し、実効帯域は理論値128GB/sのうち約90GB/s。UFS 4.0は11.7GB/sで、RK3572やRK3576の2.9GB/sを大きく上回る。Rockchipは、マルチコアのDMIPSがRK3588の約2倍、Geekbench 6のシングルコアが49%向上、GFXBench Manhattan 3.0が144.4FPSから287FPSになるとしている。予定では、2027年第1四半期にエンジニアリングサンプル、2027年前半にSBCの初期試作が出て、旗艦のRK3688は2027年後半か2028年になる。\n【ポイント・注意点】AI性能について示された数字はTOPSだけで、LLMや画像と言語を扱うモデルの実測値はない。筆者は、Rockchipが示したNPUの比較スライドについて、実際のAI処理のベンチマークがない宣伝向けの資料だと厳しく批判している。仕様はあくまで暫定版であり、実際のボードでどの程度のモデルが動くかは、試作品が出てからの評価を待つ必要がある。","2026-11-17","CNX Software","https://www.cnx-software.com/2026/11/17/rockchip-rk3668-switches-to-cortex-a725-and-cortex-a520-cores-engineering-samples-planned-for-q1-2027/"],["ラズパイ社と国内パートナー2社、EdgeTech+に共同出展","英Raspberry Pi社と、国内の認定販売店ケイエスワイ、デザインパートナーのメカトラックスが、2026年11月18〜20日にパシフィコ横浜で開かれる「EdgeTech+ 2026」に共同出展すると発表した。ラズパイ社はAI製品や産業用のCompute Module 5を、ケイエスワイはラズパイを使ったエッジAIの外観検査システム「検査匠Pi」を展示する。","\n【概要】メカトラックスは2026年11月16日、PR TIMESで、英Raspberry Pi社と国内の認定パートナー2社が「EdgeTech+ 2026」に共同出展すると発表した。参加するのは、Raspberry Pi社、認定販売店のケイエスワイ、日本初のデザインパートナーであるメカトラックスの3社だ。\n【背景】ラズパイは趣味の電子工作だけでなく、工場の検査や機器の制御といった産業の現場でも使われるようになった。EdgeTech+は組み込みやエッジ技術の展示会で、エッジでのAI活用も大きな話題になっている。メカトラックスは2005年創業の福岡の会社で、ラズパイ向けの拡張ボードなどを手がけている。\n【詳細】会期は2026年11月18日から20日まで。時間は10時から17時で、19日だけ18時まで開く。会場はパシフィコ横浜の展示ホールとアネックスホールで、小間番号はCB-09。来場には事前登録が必要だ。Raspberry Pi社は、Raspberry Pi 500+までの製品群、Picoシリーズ、RP2350を使った解決策、AI製品、カメラ、産業用のCompute Module 5を展示する。AI製品の具体的な製品名は発表文に書かれていない。ケイエスワイは、ラズパイを使ったエッジAIの外観検査システム「検査匠Pi」を出す。AIによる良品・不良品の判定、マスター画像との比較、品種の分類、文字の読み取り（OCR）、数の確認、部品の有無や並び順の確認ができ、作業者の目視検査を手元で支える使い方から、生産ラインでの連続した検査まで広げられるという。対象には食品、金属部品、電子部品を挙げている。メカトラックスは、通信や制御用の拡張ボードに加え、NTTドコモビジネスの「docomo business SIGN」を使った脅威の検知と遮断の実演を行う。\n【ポイント・注意点】会期中に会場で見られる展示で、ラズパイとAIを工場の検査に生かす具体例を確かめる機会になる。発表文には価格や性能の数値はないため、詳しい仕様は会場や各社に問い合わせる必要がある。","2026-11-16","PR TIMES","https://prtimes.jp/main/html/rd/p/000000034.000023719.html"],["Claude Codeで基板設計、エラーなしでグランドが消えた","自作ICの評価基板をClaude CodeとKiCadで設計したところ、警告なしでガーバーが出力され、デザインルールチェックも通ったのに、グランドプレーンが入っていなかった。ゾーンの塗りつぶしが実行されていなかったためだ。作者はこの経験から、ガーバーから銅の接続を組み立て直してネットリストと比べる検証ツールを作り、公開デモ基板20枚でも実際の問題を見つけた。","\n【概要】Zennで2026年11月16日、Y-Watanabe11氏が「Claude Code で基板を設計したら、エラーなしでグランドプレーンが消えていた話」を公開した。AIにプリント基板の設計を任せたときに起きた失敗と、その対策として作ったツールを詳しく紹介している。\n【背景】作者は自作ICの評価用に、2層の電源基板と4層のアナログ・デジタル混在基板を作っていた。Claude CodeがスクリプトでKiCadの基板を生成し、コマンドラインからKiCadを動かしてガーバーの出力まで行った。AIに任せると作業は速いが、確認の抜けがそのまま製造データに残る危険がある。\n【詳細】最大の問題は、ガーバーの出力が警告なしで成功し、デザインルールチェック（DRC）も通ったのに、ガーバーにグランドプレーンが入っていなかったことだ。ゾーンが塗りつぶされていなかったのが原因で、kicad-cliの--check-zonesを使えば見つけられたが、使っていなかった。ほかにも、保存したらネットの宣言が111件から0件に減った（KiCad 10の形式変更が疑われるが未確認）、裏面部品のフットプリントが反転し、配線が別のネットのパッドに乗った、「実装しない」という指示が回路図にも基板にも反映されなかった、流用した2つの部品の最低動作電圧が3.3Vの電源より高かった、といった問題が起きた。対策として作ったpcb-guardrailsは、KiCadとは別にガーバーとドリルのファイルから銅の接続を組み立て直し、ネットリストと突き合わせる。確かめられなかった場合は終了コード2を返す。公開されている20枚のKiCadのデモ基板に試したところ、穴径が実質0のビア183個など、実際の問題が見つかった。作者はツール自体の不具合も11件直した。\n【ポイント・注意点】pcb-guardrailsが確かめるのは接続と形だけで、インピーダンスや電流は見ない。元の設計そのものの誤りも見つけられない。記事の執筆時点で基板はまだ発注中だった。AIに設計を任せるほど、「エラーが出ない」ことと「正しい」ことは別だと意識し、独立した確認の仕組みを持つことが大切だという教訓を示している。","2026-11-16","Zenn","https://zenn.dev/y_watanabe11/articles/37c43aca1f96b8"],["強化学習の歩き方で、小さなアヒルロボを歩かせる","二足歩行の小型ロボット「Open Duck Mini」を組み立て、強化学習で作られた歩行モデルをラズパイ上で動かして歩かせるまでの記録がZennに投稿された。連載の6回目で、ONNX形式の歩行方策の動かし方、電源の工夫、ゲームパッドの操作、調整できるパラメーター、サーボのトルクが残るといった注意点をまとめている。シミュレーターで学んだ歩き方を個人が実機で試す手順が具体的に分かる。","\n【概要】Zennで2026年11月16日、yutaka-m氏が連載の6回目「Open Duck Mini を歩かせる」を公開した。オープンソースの小型二足歩行ロボットOpen Duck Miniを組み立て、強化学習で作られた歩行モデルをラズパイで動かして、実際に歩かせるところまでを記録している。連載は11月15日から16日にかけて投稿され、4回目ではuvとPython 3.11でonnxruntime==1.18.1を入れる際の問題の直し方を扱っている。\n【背景】二足歩行は、手作業でプログラムを組むのが難しい動きの代表だ。Open Duck Miniでは、シミュレーターの中で強化学習によって歩き方を学ばせたモデルを、実機に載せて動かす。個人でも、学習済みの歩き方をそのまま試せるのが魅力になっている。\n【詳細】使った歩行モデルは、Open_Duck_Miniリポジトリのv2ブランチにあるBEST_WALK_ONNX_2.onnxで、scpでラズパイにコピーし、v2_rl_walk_mujoco.pyに--onnx_model_pathで指定して動かす。電池ではラズパイの起動に耐えられなかったため、作者は7.6Vの安定化電源を約1.5mの24AWGの線でつないだ。電源が不安定だとSSHが切れたという。設定ファイルduck_config.jsonでは\"start_paused\": trueにしておく。ゲームパッドは、Aで開始と停止、Xでプロジェクター、Bでランダムな効果音、LTとRTでアンテナ、LBで歩行の周期を上げ、左スティックで移動、十字キーで歩き方のずれを調整する。Yの頭部操作は試験的で、使わない方がよいとしている。調整できる値には、-p（KP、既定値30）、--action_scale、出力にかける低域フィルターの--cutoff_frequency、--pitch_biasがある。スピーカーを使う設定では3秒ごとにhappy1.wavが鳴る。\n【ポイント・注意点】Ctrl+Cで止めてもサーボのトルクは残る。「budget exceeded」は制御の1周期が締め切りに間に合わなかったことを示し、処理に余裕の少ないRaspberry Pi Zero 2Wでは起きやすい。歩行の性能を数値で示した結果はないが、強化学習モデルを実機で動かす手順が具体的に分かる記録だ。","2026-11-16","Zenn","https://zenn.dev/yutaka_m/articles/open-duck-mini-06-first-walk"],["映画の「TARS」風に歩く、99ドルのESP32-S3ロボット","XGOシリーズのロボット犬で知られるLuwuDynamicsが、映画『インターステラー』のTARSに着想を得た卓上ロボットのキット「RIG-TARS」を出した。ESP32-S3を頭脳に、3本の柱をシリアルバスサーボで動かして車輪なしで歩く。ウェイクワードとクラウドのLLMで会話でき、MCPツールにも対応する。電子部品のキットは99ドルで、本体は利用者が3Dプリントする。","\n【概要】CircuitDigestは2026年11月16日、LuwuDynamicsの卓上ロボットキット「RIG-TARS」を紹介した。映画『インターステラー』に登場するロボットTARSに着想を得たもので、記事はオープンソースのキットだと説明している。LuwuDynamicsは、XGOシリーズのロボット犬を手がける会社だ。\n【背景】ESP32-S3のような安価なマイコンでも、クラウドの言語モデルとつなげば会話するロボットが作れるようになった。記事は、LLMと画面と複数のサーボの協調を、1つのESP32-S3の上で体験したいメーカー向けの製品だと位置付けている。会話と体の動きを組み合わせる作例の土台にもなる。\n【詳細】頭脳はWi-FiとBluetooth LEを備えたESP32-S3。本体は区切りのある3本の柱でできていて、それぞれをシリアルバスサーボで動かし、車輪を使わずに前後に歩いたり向きを変えたりする。6軸のIMUで姿勢を把握し、歩き方を安定させる。画像認識用のカメラ、マイク、スピーカーも備える。2.4インチ・320×240の画面には端末風の画面が表示され、電圧、姿勢、ログ、性格の設定などが見られる。AIの機能としては、ウェイクワードの検出と、クラウドのLLMを通じた会話に対応する。ソフトはオープンソースのRIG-Omniファームウエアで、動作のライブラリーやMCPツールにも対応する。ファームウエアはUSB-Cでつなぎ、ブラウザーのツールから書き込める。\n【ポイント・注意点】価格は電子部品のキットで99ドル。本体の部品は買った人が自分で3Dプリントする必要がある。記事は、オフラインで動くアシスタントではないとはっきり書いており、会話にはネット接続とクラウドのLLMが前提になる。出荷の時期は示されていない。手ごろな価格で、歩く・見る・話すを一通り備えたロボットを組み立てられる点は、AIロボットを自分の手で試したい人にとって魅力的だ。3Dプリンターを持っているかどうかが、手を出す前の確認点になる。","2026-11-16","CircuitDigest","https://circuitdigest.com/news/rig-tars-is-a-99-open-source-esp32-s3-robot-kit-that-walks-like-tars-from-interstellar"],["Jetson Thor T5000搭載、ロボット向けの産業用AI箱型PC","AAEONが、NVIDIA Jetson Thor T5000を載せた産業用のエッジAI箱型PC「BOXER-8741AI」を出した。AI性能はFP4の疎で最大2070 TFLOPS、メモリーは128GBのLPDDR5X。10GbEを2口、5GbEを4口備え、人型ロボットや自律移動ロボット向けとする。AAEONのストアでの価格は1万219ドルで、予約を受け付けており、出荷は2026年12月29日ごろの見込み。","\n【概要】CNX Softwareは2026年11月16日、AAEONの産業用エッジAI箱型PC「BOXER-8741AI」を紹介した。NVIDIA Jetson Thor T5000を搭載し、人型ロボット、自律移動ロボット、多数のセンサーを使う認識処理などを狙った製品だ。\n【背景】ロボットの頭脳には、カメラやセンサーからの大量のデータをその場で処理する高い計算能力が求められる。Jetson ThorはNVIDIAのロボット向けの上位モジュールで、画像と言語を扱うモデルや、画像と言語から動作を決めるモデルを手元で動かせるとしている。\n【詳細】AI性能はFP4の疎で最大2070 TFLOPS。メモリーは256ビット幅のLPDDR5Xで128GB、帯域は273GB/s。CPUは最大2.6GHzのArm Neoverse-V3AEを14コア、GPUはBlackwell世代の2560コアで、第5世代のTensorコアを96基持つ。ネットワークは10GbEが2口と5GbEが4口のRJ45で、Wi-Fi 5/6、Bluetooth、4G/5Gを選んで追加できる。ほかにUSB 3.2 Gen 2が4口、DB9のRS-232/485、CAN FDが2系統、選択式の8ビットGPIO、最大4K30のHDMIを備える。記憶装置はM.2 2280のNVMeスロットが1つで、128GBのSSDが付く。電源は19〜48Vの直流で、動作温度は−20〜60℃。大きさは240×164.8×105.1mm、重さ3.5kgで、CEとFCC Class Aに対応する。ソフトはJetPack 7.1以降で、CUDA、TensorRT、Isaac、Metropolis、Holoscanが使える。\n【ポイント・注意点】価格はAAEONのストアで1万219ドル（構成BOXER-8741AI-JP710N-A1-1010）。予約を受け付けており、入手は2026年12月29日ごろの見込みだ。240Wのアダプターと電源コードは別売りになる。兄弟機のBOXER-8742AIはJetson T4000を使い、代わりにPoEのカメラ端子を持つ。趣味の電子工作には手の届かない価格だが、ロボットのAIがどの水準の計算機で動き始めているかを知る手がかりになる。","2026-11-16","CNX Software","https://www.cnx-software.com/2026/11/16/aaeon-boxer-8741ai-industrial-edge-ai-box-pc-nvidia-jetson-thor-t5000-with-dual-10gbe-and-four-5gbe-lan/"],["QCS6490で画像と言語のAIを動かす、9つ中6つの壁","画像と言語を扱うモデルInternVL3.5-2Bを、QualcommのQCS6490ボードで動かそうとした記録がDEV Communityに投稿された。モデルを9つの計算グラフに分けて変換したが、性能を測れたのは6つだけ。原因は、メーカー自身が配る量子化済みの部品に、量子化されていない値が1つ残っていたことだった。全体の速度はまだ出ておらず、問題はメーカーに報告済みだ。","\n【概要】DEV Communityで2026年11月16日、Anguo氏が「Six Graphs Out of Nine: InternVL3.5-2B on QCS6490, and the FP32 Tensor Hiding in the Vendor's Own Asset」を公開した。画像と言語を扱うモデルInternVL3.5-2Bを、QualcommのQCS6490を積んだボード（Dragonwing RB3 Gen 2）で動かそうとした現場報告だ。\n【背景】小型ボードのNPUで画像と言語のモデルを動かすには、モデルを小さな数値に量子化し、チップ向けに変換する手間がかかる。InternVL3.5-2Bは、画像を扱うInternViTとQwen3型の文章部分を組み合わせたApache-2.0のモデルだ。作者はQualcomm AI Hubを使い、手作業で書き出しを行った。\n【詳細】量子化はw4a16、文脈の長さは512トークン。書き出し用のテンプレートはtransformers 5.7.0を必要とし、aimet-onnxにはaarch64向けのパッケージがないといった手間もあった。モデルは9つの計算グラフに分けた。448×448の画像を256個の視覚トークンにする画像部分が1つと、文章部分を4つに分け、それぞれに128トークンの入力用と1トークンずつの生成用のグラフを作った。9つすべての変換は通ったが、性能を測れたのは6つだけだった。2〜4番目の部分の合計は、128トークンの入力で17万4113マイクロ秒、生成は1トークンあたり6万2815マイクロ秒。1番目の部分と画像部分は組み立ての段階で失敗したため、モデル全体の1秒あたりのトークン数は示されていない。原因は、メーカー自身が配る量子化済みのfp16mixの部品で、2層目のdown_projにある畳み込みのバイアスが1つ、浮動小数点のまま残っていたことだった。-O1などのコンパイルの設定を変えても結果は変わらなかった。\n【ポイント・注意点】示された数値はAI Hub上でのグラフごとの見積もりで、Genieでの通しの実測ではない。問題はメーカーに報告済みだという。エッジで画像と言語のモデルを動かす作業は、メーカーの配る部品でさえつまずくことがあり、まだ道具が成熟途中だと分かる記録だ。","2026-11-16","DEV Community","https://dev.to/anguoyang/six-graphs-out-of-nine-internvl35-2b-on-qcs6490-and-the-fp32-tensor-hiding-in-the-vendors-own-3oib"],["自宅のラズパイ5でAIエージェント、Xの情報を毎朝要約","自宅のRaspberry Pi 5で常時動かしているAIエージェント「Hermes Agent」に、Xの情報収集を任せている事例がZennで紹介された。MCPでTwitterAPI.ioのサーバーにつなぎ、毎朝6時にSpaceX関連の投稿を集めて要約しTelegramに送る。投稿のURLを渡せば本文を取り、NotebookLMへの登録やObsidianへの保存もこなす。","\n【概要】Zennで2026年11月15日、なかじ（minaka）氏が「自宅のRaspberry Piで働くAIエージェントに、Xの情報収集を任せている話」を公開した。作者のnoteからの転載で、自宅で常に動かしているRaspberry Pi 5を、情報集めの助手として使う具体例を紹介している。\n【背景】ラズパイは消費電力が小さく、24時間動かしておく小さなサーバーに向いている。作者はその上でAIエージェント「Hermes Agent」を動かし、外部の道具はMCPでつないでいる。使っているLLMの名前は書かれていない。Xのデータは、MCPサーバーを提供するTwitterAPI.ioから取得している。\n【詳細】毎日の決まった仕事として、エージェントは朝6時に、過去24時間のSpaceXに関するXの投稿を検索し、要約してTelegramに送る。必要なときには、投稿のURLを渡すと全文を取りに行き、NotebookLMに登録したうえで、ObsidianにMarkdownとして保存する。TwitterAPI.ioは月額料金のない従量制のクレジット方式で、投稿を1件保存するのに100クレジットかかった。作者は、Xの公式APIは個人で使うには高いと述べている。運用では、クレジットを使い切って仕事が止まったことが一度あった。検索の条件を組み合わせる部分は、思い通りに動くまで何度かプロンプトを直す必要があったという。\n【ポイント・注意点】この記事はTwitterAPI.ioのCommunity Rewardsというクレジット提供の仕組みのもとで書かれており、紹介リンクも含まれている。その点を踏まえて読む必要がある。それでも、ラズパイを常時動く家庭内のAIエージェントの土台にし、決まった時間の自動作業と、その場の依頼の両方に使う構成は参考になる。クレジット切れで止まった経験は、外部サービスに頼るエージェントでは残高の監視が欠かせないことも示している。電子工作で使うラズパイを、AIを動かす家庭の小さな基地として生かす一例と言えるだろう。","2026-11-15","Zenn","https://zenn.dev/minaka/articles/ed9113cd3f4588"],["見守りロボと六本脚ロボ、実機でしか起きなかった8つの壁","ぬいぐるみ型の介護見守りロボット「零号機」と、日本語で話しかけるとPythonを書いて脚を動かす六本脚ロボット「アラクネ」の開発で、実機でだけ起きた8つの問題をまとめた記事がZennに投稿された。脈拍の誤測定、テレビの声の誤認識、電波の帯域違い、USBの切断、82.7℃の発熱など、数値付きで原因と対策を記している。AIの外側にある物理の問題が実用の壁になることがよく分かる。","\n【概要】Zennで2026年11月14日、福岡県粕屋町の個人開発者xzero_001氏が「実機でしか起きなかった8つの壁　介護見守りロボットと6本脚ロボットの電源・センサー・熱・電波」を公開した。AIを載せた2台のロボットを実際に動かす中でぶつかった問題を、数値付きで振り返っている。\n【背景】「零号機」は猿のぬいぐるみと木箱に組み込んだ介護見守りロボットで、日本語で会話し、血圧や体温を測る。「アラクネ」は教育用の六本脚ロボットで、日本語で話しかけるとPythonのコードを生成して実行し、脚を動かす。部品はESP32またはサーボ基板、ラズパイ、Windowsのノートパソコン、MAX30102、MLX90614、ReSpeakerのマイクアレイ、PCA9685、WLEDのLEDなど。ローカルのAIモデルの名前は書かれていない。\n【詳細】1つ目は、指で測った脈拍が126〜141拍と出たのに対し、認証済みの酸素飽和度計では約68拍だった問題で、Bluetoothのクリップ式の計測器に替えた。2つ目は、利用者の声紋スコア（中央値0.568）とテレビの音声（0.454）が重なり、テレビの発話が0.5005で通ってしまった問題で、指向性マイクに替えた。3つ目は、18回の発話のうち10回が6.0秒の上限に達したことで、話し終わりの判定を緩め、上限を10秒にした。4つ目は、ReSpeakerがラズパイの音声出力を奪って声が止まった問題。5つ目は、病院でのオフラインの実演で、ESP32のLEDが2.4GHzを必要とするのにホットスポットが5GHzだったため失敗した件で、ラズパイを2.4GHzのアクセスポイントにした。6つ目は、アラクネが動くとUSB機器が切れる問題で、電源付きのハブで解決した。7つ目は、ファンなしのラズパイが82.7℃に達し、5分間にカメラの開き直しが13回起きた件で、対策は続いている。8つ目は、サーボ基板のエラーで会話のコードまで止まった件で、今は脚なしでも会話を続けるようにした。\n【ポイント・注意点】根拠は1人の開発者の記録で、ページでは両ロボットの予約販売の告知もしている。それでも、AIの賢さとは別に、電源、熱、電波、センサーといった物理的な問題が実用の壁になることを具体的に示した貴重な記録だ。","2026-11-14","Zenn","https://zenn.dev/xzero_001/articles/7be301556fe080"],["AliExpressの丸いノブを、自分だけのAIデバイスに","AliExpressで買ったESP32-S3搭載の丸いノブ型機器「JC3636K718」のファームウエアを丸ごと書き換え、音声入力やClaude Codeの見張り役などをこなす自分専用のAIデバイスにした記録がZennに投稿された。1.8インチの丸い画面と回転ノブ、振動モーター、電池を備え、価格は表示で7193円。重い処理はMacに任せる分担の設計も紹介している。","\n【概要】Zennで2026年11月12日、Xami（bmexami）氏が「AliExpress で買った丸いノブを、自分だけの AI デバイスにしてみた」を公開した。中国の通販サイトで買ったESP32-S3搭載のノブ型機器のファームウエアを自作のものに置き換え、AI関連の作業を手元で操作する道具に作り替えている。\n【背景】使ったのはJC3636K718という機器で、ESP32-S3R8（8MBのPSRAM、16MBのフラッシュ）、1.8インチ・360×360の丸いタッチ画面、回転ノブ、振動モーター、底の電池を備える。大きさは66×66×26mmで、金属のケースに入っている。価格は2026年11月の表示で7193円（セール前は8880円）。暗号化やセキュアブートがかかっていなかったため、作者は元のファームウエアを吸い出したうえで、Arduino（C++）で書いたものに置き換えた。\n【詳細】ノブはUSBのキーボードやマウスとしても働く。画面の左半分を長押しすると音声入力、右半分を押すとMacの操作になり、ノブは音量の調整に使う。Claude Codeの見張り役としては、止まっているセッションを表示し、タッチすると該当するウインドウを前に出す。音声での返事にも対応し、セッションが止まると振動で知らせる。ほかにも、アルバムの絵が回る音楽プレーヤー、インベーダー風のゲームやブロック崩し、タイマー、ショートカット、天気、会議の録音などの機能を入れた。Macとノブは1行の文字のメッセージでやり取りする。ノブには日本語のフォントがないため、日本語の文字はMac側で画像にして送る。軽い処理はノブで、重い処理やネットを使う処理はMacで行う分担だ。キャラクターの絵はGeminiで作り、起動時の3Dアニメーションの制作にはTripoとBlenderを使った。\n【ポイント・注意点】性能の測定や電池の持ちの数値は示されていない。安い既製品の機器でも、ファームウエアを書き換えられればAIの作業を助ける専用の道具に変えられることを示す例だ。ただし、市販品のファームウエアを書き換えると元に戻せなくなる危険もあり、試すなら自己責任になる。","2026-11-12","Zenn","https://zenn.dev/bmexami/articles/knobby-esp32-round-knob"],["35ドルのラズパイでオフライン音声合成、LinnetTTSを組み込む","4100万パラメーターの小型音声合成モデルLinnetTTSを、ラズパイにPythonで組み込む方法がDEV Communityで紹介された。fp16の重みはディスク上で約83MB、メモリー上で約160MB。PyTorchなしのRust製ランタイムで動き、80ミリ秒ごとに音声を流す。Pi Zero 2 Wではリアルタイム係数が約75%だったとし、つまずきやすい点も挙げている。","\n【概要】DEV Communityで2026年11月12日、VoxRTが「Offline voice replies on a $35 Raspberry Pi: LinnetTTS integration in Python」を公開した。ネットにつながずに声で返事をする機器をラズパイで作るため、音声合成モデルLinnetTTSをPythonから使う方法を解説している。\n【背景】音声アシスタントの返事をクラウドで合成すると、通信の遅れや外部サービスへの依存が生まれる。LinnetTTSは小型の機器でも動くように作られたモデルで、作者によると2026年11月4日に公開された。パラメーターは4100万で、内訳は3150万のフローLMと990万のデコーダー。fp16の重みはディスク上で約83MB、メモリー上で約160MBを使う。ランタイムはRustで書かれており、PyTorchは要らない。声は米国英語の女性と男性の2種類が入っている。\n【詳細】推奨はメモリー2GB以上のRaspberry Pi 4で、1GBでは余裕がない。Pi Zero 2 Wでも動くが、ぎりぎりだとしている。32ビット版のパッケージがないため、64ビットのRaspberry Pi OSが必要だ。音声は80ミリ秒ずつ流れ、最初の区切りは50ミリ秒。ラズパイでの確かな数値はPi Zero 2 Wのもので、4コアで1ステップ59〜60ミリ秒、リアルタイム係数は約75%で、30分間のテストで確かめた。Pi 4での測定はまだだという。コード例として、soundfileやsounddeviceと一緒にpipで入れる方法、まとめて合成する方法、少しずつ流す方法、起動時にモデルを読み込み、キーワードを聞き取るたびに返事を話す例を示している。\n【ポイント・注意点】つまずきやすい点として、重みはパッケージに含まれず別にダウンロードが要ること、相対パスの指定で失敗しやすいこと、音が出ないときは音声グループへの所属や既定の出力先を確かめること、ウェイクワードや音声区間の検出、キーワード認識を同時に動かすと音が途切れることを挙げている。声の複製や学習の機能は別のライセンスになる。長時間動かしたときの発熱のデータはまだ少ない。対応する言語は英語の声だけである点にも注意したい。","2026-11-12","DEV Community","https://dev.to/voxrtio/offline-voice-replies-on-a-35-raspberry-pi-linnettts-integration-in-python-4la6"]],"muse":[["Codex CLI 0.170.0、端末で音声通話とMCP周りを改善","OpenAIは2026年11月18日、Codex CLI 0.170.0を公開した。端末UIでのリアルタイム音声通話向けにWebRTCの接続交渉を加えたほか、OpenTelemetryのHTTP送信の認証ヘッダー自動更新、環境をまたいで同名のMCPサーバーを使う実験的な対応を入れた。Windowsのファイル置き換えやサンドボックス権限の不具合、クラウド会話の再接続なども直している。","\n【概要】OpenAIの「ChatGPT & Codex changelog」によると、2026年11月18日にCodex CLI 0.170.0が公開された。npm install -g @openai/codex@0.170.0で導入できる。新機能3点と多数の不具合修正、サンドボックスの文書の更新を含む版だ。\n【背景】Codex CLIは端末で動くOpenAIのコーディングエージェントで、11月は0.168.0と0.169.0（ともに13日）、0.169.1（17日）と更新が続いていた。0.169.0では、信頼されていないディレクトリでcodex execがプロジェクト設定とMCPサーバーを無効のまま保つ変更が入り、--trustで明示的に信頼を保存する形になっていた。\n【詳細】新機能は、端末UIでのリアルタイム音声通話向けのWebRTC接続交渉、OpenTelemetryのHTTPエクスポーターの認証ヘッダーの自動更新、環境をまたいで同じ名前のMCPサーバーを使う実験的な対応の3つだ。修正では、大きすぎるWebSocket要求が無駄な再試行なしにHTTPへ切り替わるようにし、取り消しやログイン、ログアウトの際のMCP OAuth資格情報の競合を解消した。クラウド会話の自動再接続も改善し、クライアントが再接続したときに復旧中のターンが保たれる。Windowsでは、ファイルの置き換え、サンドボックスの権限、ランタイム登録の問題を直した。権限の更新や子スレッドで、既存のサンドボックス制限が失われることもなくなった。ファイル検索の重複結果の除去や、空白を含む検索語でのスレッド検索の抜粋表示の修正もある。文書面では、サンドボックスの説明に権限プロファイルとファイルシステムのルールが加わった。\n【ポイント・注意点】Windowsの利用者や、MCPサーバーを複数の環境で使い分ける人は確認しておきたい版だ。同名MCPサーバーへの対応は実験的とされており、今後挙動が変わる可能性がある。子スレッドでサンドボックス制限が抜け落ちていた点の修正は、エージェントを長時間動かす運用では特に重要といえる。","2026-11-18","ChatGPT & Codex changelog（OpenAI）","https://learn.chatgpt.com/docs/changelog"],["Claude CodeのCode Mode、始め方と使える条件を整理","noteでSho'n氏が2026年11月18日、Claude Codeの実験機能「Code Mode」の解説を公開した。ClaudeがJavaScriptを書き、BashやEditなどのツールをまとめて呼び出す仕組みだ。記事は向いている作業、v2.1.323以上などの利用条件、有効にする手順、10分での打ち切りや再開の制約といった注意点を、公式の情報をもとに整理している。","\n【概要】Code Modeは、ツールを1回ずつ呼び出す代わりに、Claudeが書いたJavaScriptをClaude Codeがセッション内で実行する実験機能だ。記事は公式ドキュメントやchangelog、@ClaudeDevsの投稿をもとに、仕組みと試し方を紹介している。\n【背景】これまでのClaude Codeは、Bash、Read、Editなどを1回呼ぶたびに結果を読み、次の行動を決めていた。Code Modeでは1本のコードで、複数コマンドの並列実行、結果の受け渡し、必要な部分だけの返却ができる。記事の例では、リトライ設定の値を変える作業で、ファイル検索、編集、テスト実行を1本で行い、最後にファイル名とテスト結果だけをClaudeに返す。\n【詳細】向いているのは、多数のファイルへの同じ変更、検索結果を絞ってから読ませる作業、互いに無関係なコマンドの同時実行だ。利用条件は、ネイティブ版のv2.1.323以上、Claudeのサブスクリプションかコンソールのアカウント（Bedrockやゲートウェイ経由は不可）。対応モデルはOpus 5.5、Sonnet 5.5、Haiku 5.5、Fable 5.2だ。ターミナルの対話セッションだけが対象で、-p、Agent SDK、VS Codeのパネル、デスクトップアプリ、クラウドのセッションでは使えない。WindowsではGit for Windowsが必要で、エージェントチームと併用するにはv2.1.326以上が要る。試し方は、バージョンを確かめて更新し、環境変数を付けて起動し、初回の確認画面で有効にして、ツール呼び出しの多い作業を頼むという流れだ。\n【ポイント・注意点】実験機能なので、仕様の変更や廃止の可能性がある。Remote Control、Claude in Chrome、computer useは使えない。結果を待つ実行は10分で打ち切られ、バックグラウンド実行は最大2時間で、autoかbypassPermissionsのモードで起動する必要がある。autoモードの安全チェックはコード全体に対して行われ、実行時にしか決まらない値は見えないため、確実に止めたい操作はpermissionルールやフックで守るよう勧めている。Code Modeで始めたセッションは、有効な状態でしか再開できない。","2026-11-18","note（Sho'n）","https://note.com/utkt2012/n/n6bf21690f4a0"],["Code Modeの権限の仕組み、プロジェクト設定では有効化不可","XenoSpectrumは2026年11月18日、Claude Code v2.1.323の実験機能Code Modeを権限の面から解説した。autoモードでは分類器が生成スクリプトを実行前に審査し、denyやaskのルールとPreToolUseフックはスクリプト内の各ツール呼び出しに適用される。有効化は環境変数で行い、リポジトリのプロジェクト設定ファイルからは有効にできない設計だという。","\n【概要】Code ModeはClaude Code v2.1.323に入った既定オフの実験機能で、ClaudeがBashやEditを呼ぶJavaScriptを書き、検索、編集、テストのような複数段階の作業を1本のスクリプトで実行する。記事は、この方式のもとで権限の管理がどう働くかに焦点を当てている。\n【背景】途中のツール出力はスクリプトの中で処理されるため、Claudeが読む量が減る。記事の例では、編集したファイルのパスとテストの出力だけがClaudeに戻る。一方で、1本のスクリプトに複数の操作がまとまるため、どこで安全を確かめるかが課題になる。\n【詳細】autoモードでは、分類器が生成されたJavaScriptを実行前に審査する。denyとaskのルール、PreToolUseフックは、スクリプト内の各ツール呼び出しにそれぞれ適用される。編集の対象が実行時まで決まらない場合もあるため、記事はそれを制御するのはツールごとのルールだと指摘する。有効化はCLAUDE_CODE_EXPERIMENTAL_CODE_MODE=1で行い、プロジェクトの設定ファイルでは有効にできない。リポジトリの設定が利用者の同意なしに機能を入れるのを防ぐためだ。必要な条件は、v2.1.323以降、Claudeのサブスクリプションかコンソールのアカウント、対話型のターミナル。WindowsではGit for Windowsも必要で、Agent Teamsと併用するにはv2.1.326以降が要る。-p、Agent SDK、VS Codeのパネル、Claude Desktop、クラウドのセッションでは動かない。前面で動く長いコマンドは10分で打ち切られ、バックグラウンドでは最大2時間動ける。\n【ポイント・注意点】記事は、2025年11月24日にAPI向けに発表されたProgrammatic Tool Callingと比べている。あちらは生成コードが呼べるツールを開発者があらかじめ指定するが、Code Modeは対話セッションの中で既存の権限ルールとフックに頼る。Anthropicは実験機能であり変更や削除の可能性があるとしており、一般提供の時期は発表されていない。無人で動かす人は、ツールごとのdenyルールとフックを先に整えておきたい。","2026-11-18","XenoSpectrum","https://xenospectrum.com/en/claude-code-mode-tool-permissions/"],["claude-memでClaude Codeにセッションをまたぐ記憶を","dev.toで2026年11月18日、コーディングエージェントにセッションをまたぐ記憶を加えるオープンソースのツール「claude-mem」の紹介記事が公開された。6種類のフックで作業を記録し、別のエージェントが短いメモと要約にまとめ、次のセッションの冒頭に索引を渡す仕組みだという。導入の手順のほか、試用期間の課金やテレメトリなどの注意点も詳しく整理している。","\n【概要】claude-memは、毎回まっさらな状態で始まるコーディングエージェントに、セッションをまたぐ記憶を持たせる無料のオープンソースのツールだ。記事によると、GitHubのスター数は11万8,000超、ライセンスはApache-2.0で、最新版の16.0.0は2026年11月18日に公開された。\n【背景】Claude Codeのようなエージェントは、前のセッションで何を決めたかを覚えていない。長く続く開発では、同じ説明を繰り返したり、前の判断を見失ったりしやすい。claude-memはこの問題を、フックとローカルの保存で補う。\n【詳細】フックはSessionStart、UserPromptSubmit、PreToolUse、PostToolUse、Stop、SessionEndの6つの場面で動く。ツールの動きはローカルのワーカーに送られ、別の「observer」エージェントが短いメモにまとめ、セッションの終わりに要約を書く。次のセッションは過去のメモの短い索引から始まり、必要なときだけ詳細を取りに行く。保存先は、ホームディレクトリの.claude-memフォルダにあるローカルのデータベースと検索索引だ。/learn-codebaseを使うとリポジトリ全体を先に読み込め、一般的なリポジトリで約5分かかる。導入はnpx claude-mem installを実行して対象のエージェントを選び、Claude Codeを再起動する。Node.js 20.19以上か22.12以上が必要だ。npm install -g claude-memではライブラリしか入らず、フックもワーカーも入らないと注意している。\n【ポイント・注意点】メモを書くにはモデルが要る。claude-memのobserverを選ぶと、支払い方法の登録が必要な30日間の無料試用が始まる。自分のOpenRouterやGeminiのキーも使える。匿名のテレメトリは既定でオンで、npx claude-mem telemetry disableで止められる。2026年10月下旬には、インストーラーが30日分のプロンプトを確認なしに送ったという報告があった（現在は選択肢ごとに確認する）。筆者は、まず1つのプロジェクトで試し、試用の30日目より前に通知を設定するよう勧めている。","2026-11-18","DEV Community","https://dev.to/ovulab/give-claude-code-a-memory-claude-mem-remembers-between-sessions-20e7"],["Claude Codeが古い決定に従うのを防ぐ、実践者の工夫","dev.toで2026年11月18日、Claude Codeが撤回したはずの古い決定に従ってしまう問題への対策をまとめた記事が公開された。筆者の自動のブログ下書きが、やめたはずの話題を再び書いた失敗をきっかけに、r/ClaudeCodeで約12人の方法を集めた。古いファイルの直接修正、1つの事実は1か所、置き換えの明示、仕組みでの強制などを具体的に紹介している。","\n【概要】筆者のAlfredo Izquierdo氏は、週2回動く自動のブログ下書きの流れが、扱わないよう伝えていた話題で再び記事を書いたことに気づいた。修正は記録されていたが、その流れが数週間前から読まなくなっていたJSONファイルの中にあった。記事は、古いメモに訂正がひも付いていないと古いほうが勝つ、という教訓から始まる。\n【背景】古いメモは長く詳しいことが多く、エージェントはそちらを信じやすい。筆者はr/ClaudeCodeで約12人に方法を尋ね、回答を整理した。\n【詳細】1つ目は、古いファイルを直接直すことだ。削除するか、先頭に平易な警告を書く。エージェントは記憶の検索に関係なくファイルを読むからだ。2つ目は、1つの事実を1つのファイルに置き、その場で更新すること。日付入りの「〇日に変えた」という行を、自動のpre-pushチェックで見つける人もいる。3つ目は、古い決定に置き換え済みの印を付けること。大きなコードベースの利用者は、CLAUDE.mdに事実を書かず、決定はADR（アーキテクチャ決定記録）に残し、変えた決定には新しい決定への参照を付ける。4つ目は、今のルールを毎回読む1つのファイルにまとめ、ログは履歴として扱うこと。1か月分のセッションを見直し、止めたと書かれた安全チェックが実は動いていたという矛盾を見つけた例もある。5つ目は、指示はあくまでモデルへのお願いなので、重要なルールはコードで強制すること。指示ファイルが変わるたびに矛盾を探すフックを動かす人もいる。6つ目は、失敗のたびに原因を分析させ、古い情報を消すことだ。\n【ポイント・注意点】ある運用では週1回の見直しが実際には行われておらず、続いたのはチェック、削除、古いファイルへの警告だった。共通の教訓は、新しいメモを書くのと同じ手順で古いメモを片付けることだ。筆者は「これは先週の決定を置き換える。古いメモを探して更新して」という1文を勧める。記事の後半は筆者の製品ContextForgeの紹介を含む。","2026-11-18","DEV Community","https://dev.to/alfredoizjr/how-to-stop-claude-code-from-following-outdated-decisions-p8f"],["Claude Codeの429エラー、2種類の表示はどちらも上限切れでない","dev.toで2026年11月18日、Claude Codeに出るHTTP 429エラーを調べた解説記事が公開された。429には主に2種類の表示があり、どちらもプランの利用上限切れを意味しないと説明する。再試行の回数、並列の作業で起きやすい点、/statusでの資格情報の確認、無人運転向けの環境変数など、表示の見分け方、原因の切り分け、対処の手順を整理している。","\n【概要】Tahir Nazir氏の記事は、Claude Codeの429「Too Many Requests」エラーの読み方をまとめたものだ。1つ目の「API Error: Server is temporarily limiting requests (not your usage limit)」は、claude.aiのサブスクリプションやゲートウェイでサインインしたときに出る、サーバー側の短い制限だ。2つ目の「API Error: Request rejected (429)」はAnthropicのAPIキーやAmazon Bedrock、Google Vertex AI、Microsoft Foundryで出て、多くはそのキーやプロジェクトのレート制限を示す。\n【背景】本当のプラン上限は「You've hit your session limit」や「You've hit your weekly limit」と表示され、リセットの時刻が付く。\n【詳細】v2.1.199以降、一時的な429は既定で最大10回再試行してからエラーを出す。GitHubのissue #53915（2026年11月15日時点でコメント69件）では、サブエージェントのチームや複数のセッションで制限が出て何時間も続く例が報告されているが、Anthropicは原因を確認していない。対処は、サーバー側の制限なら待つ、並列のサブエージェントやセッションを減らす、status.claude.comを確かめる。Request rejectedなら/statusで資格情報を確かめる。環境変数ではCLAUDE_CODE_MAX_RETRIESで回数を決められ（既定10、ウォッチドッグなしでは15が上限）、CLAUDE_CODE_RETRY_WATCHDOG=1で429と529を無期限に再試行できる。これはCIのような無人運転向けで、対話のセッションには勧めていない。\n【ポイント・注意点】429はセッションやキー、プロジェクト、ゲートウェイの制限で、529はモデルが全体で混み合っている状態を表す。失敗した要求の間に使用量のメーターが上がったという報告は未確認で、ループで送り直さないよう勧めている。筆者は実際の429を自分では起こしていない。","2026-11-18","DEV Community","https://dev.to/its-tahir/i-dug-into-claude-codes-429-error-two-messages-and-neither-is-your-usage-limit-3gl6"],["Claude CodeとCodex CLI、両方を組み合わせる使い分け","dev.toで2026年11月18日、端末で動く2つのAIコーディングエージェント、Claude CodeとCodex CLIを日常的に併用する筆者の使い分けが紹介された。長い多段階の作業はClaude Code、スクリプトからの短い実行やセカンドオピニオンはCodex CLIとし、片方が書いてもう片方が見直す相互レビューを重要な作業に勧めている。ベンチマークや計測値は含まない。","\n【概要】System Design Simpleによる記事は、Anthropic製のClaude CodeとOpenAI製のCodex CLIを2026年11月時点で毎日使い分けている経験をまとめたものだ。どちらも端末で動き、プロジェクトを読み、ファイルを編集し、コマンドを実行する。ベンチマークや計測値はなく、筆者の使い方を述べた記事だ。\n【背景】両者には共通点が多い。平易な言葉の依頼を受け、危険な操作の前に確認したり、1つのフォルダにしか書かないといった制限の中で動いたりできる。プロジェクトの指示ファイルとして、Claude CodeはCLAUDE.md、CodexはAGENTS.mdを読む。どちらもModel Context Protocol（MCP）で外部のツールにつながる。\n【詳細】筆者がClaude Codeを使うのは、機能の計画、多数のファイルの編集、テストの実行と失敗の修正といった長い多段階の作業だ。Chromeとの連携でWebページを操作し、自分のサイトの設定や確認にも使う。作業をサブエージェントに分けられる点や、プロジェクトのルールによく従う点も挙げている。Codex CLIは、スクリプトからの非対話の短い実行に使う。例はcodex exec \"...\"で、-oで最終メッセージをファイルに保存できる。別のモデル系統なのでセカンドオピニオンにもなり、サムネイルやチャンネルバナーなどの画像生成にも使う。相互レビューの流れは、Claude Codeが最初の版を書き、Codexが事実の誤り、わかりにくい箇所、危うい主張を探すよう指示されて見直し、筆者が役立つ指摘を取り込み、意見の違いは理由とともに残す、というものだ。\n【ポイント・注意点】筆者は、異なるモデルは異なる間違いをするので、相互レビューは1つのエージェントでは見落とす問題を拾えると主張し、スクリプト、計画、セキュリティの修正など重要な作業に勧める。実務のコツとして、コーディングのスタイルやテストのコマンド、触れてはいけない範囲を指示ファイルに書くこと、秘密情報をリポジトリやプロンプトに入れないこと、すべての変更をマージ前に確かめること、信頼できるまでサンドボックスや制限付きの権限で始めることを挙げている。","2026-11-18","DEV Community","https://dev.to/systemdesignsimple/claude-code-vs-codex-cli-using-both-together-31ll"],["PreToolUseフックは終了コード2でしか止めない、検証記事","dev.toで2026年11月18日、Claude CodeのPreToolUseフックが失敗しても既定ではツール呼び出しが止まらないことを確かめた記事が公開された。例外で落ちたフックではコマンドがそのまま実行され、意図的にexit 2で終えたフックだけが呼び出しを止めた。壊れた防御がそのまま素通りになるのを避けるため、失敗時は必ず2で終えるラッパーを勧めている。","\n【概要】Enjoy Kumawat氏は、使い捨てのコンテナで定時の公開作業を回しており、各Claude Codeセッションに決まった防御を守らせている。エラーを出すPreToolUseフックは安全側に倒れると考えていたが、それを確かめるため、使い捨てのプロジェクトでBashに対する2つのフックを試した。\n【背景】PreToolUseフックはツール呼び出しの前に動き、危険な操作を止める用途で使われる。人が見ていない状態で動かす運用では、この防御が確実に働くかどうかが重要になる。\n【詳細】1つ目は、処理されない例外を出すPythonのフックだ。このとき、echo HOOK_TEST_MARKER_12345は実行されて表示された。記録にはexitCode: 1のhook_non_blocking_errorが残ったが、端末には表示されなかった。2つ目は、標準エラーにメッセージを出してexit 2で終えるフックで、こちらは呼び出しを止めた。マーカーは表示されず、実行結果のpermission_denialsに止めた呼び出しが記録された。違いはexit 1かexit 2かだけだった。2は文書で決められた「止める」コードで、それ以外の0でないコードは報告されるだけで止めない。処理されない例外、依存関係の欠落、シェルの書き間違い、jqのようなツールへの不正な入力は多くの場合1で終わるため、壊れた防御は素通りになる。対策として筆者は、本来のチェックを実行し、失敗したら出力を標準エラーに出してexit 2で終えるbashのラッパーを示している。リポジトリのコミット用フックのように、失敗すると明らかに未完成の結果が残る作りなら失敗に気づけるが、PreToolUseはそうではないと対比している。\n【ポイント・注意点】コメント欄では、フックがそもそも動かない場合の2つの例も挙がった。Bashのマッチャーはmcp__server__toolという名前のMCPツールを捕まえないこと、新しいコンテナには想定した設定ファイルがないことがあることだ。そこで、セッションの開始時にフックが止めるはずのコマンドを試し、permission_denialsに現れなければ実行をやめる「カナリア」を置く案が紹介されている。","2026-11-18","DEV Community","https://dev.to/enjoy_kumawat/claude-codes-pretooluse-hook-only-blocks-a-tool-call-on-exit-code-2-and-every-other-failure-mode-4ka2"],["秘密鍵の貼り付けをUserPromptSubmitフックで止める","dev.toで2026年11月18日、Claude Codeのプロンプトに秘密鍵や認証情報を貼り付けてしまうのを、UserPromptSubmitフックで防ぐ方法が紹介された。denyルールや書き込みの防御はディスク上のファイルを守るが、直接貼られた秘密には効かない。プロンプトの文字列を調べ、該当すればexit 2で送信前に止めるbashスクリプトと設定の手順を示している。","\n【概要】Vildanden氏の記事は、Claude Codeのdenyルールや書き込みの防御がディスク上のファイルを守る一方で、利用者が秘密情報をプロンプトに直接貼り付けた場合には何もできない点を指摘する。UserPromptSubmitフックを使えば、プロンプトの文字列を調べ、モデルに届く前に止められる。\n【背景】作業中に設定値や鍵をそのまま貼ってしまう事故は起こりやすい。モデルに渡った秘密は会話の記録に残り、繰り返されるおそれもある。\n【詳細】手順は5つだ。まず.claude/hooks/block-secret-prompts.shというbashスクリプトを作り、chmod +xで実行できるようにする。スクリプトはフックのイベントを標準入力のJSONとして読み、jqで.prompt、.user_prompt、.contentのうち最初にあるものからプロンプトを取り出す。次に2つのgrepで調べる。1つはPEM形式の検査で、-----BEGIN ... PRIVATE KEY-----という見出しを含むプロンプトを止め、伏せ字の見本や秘密管理のツールを使うよう伝える。もう1つは認証情報の検査で、「seed phrase」「mnemonic」「private key」といった語が80文字以内で「is」「here」「below」やコロンと並ぶ場合や、api_key、access_token、secret_keyに16文字以上の空白のない値が代入されている場合に止める。どちらも終了コード2で終え、それ以外は0で終える。最後に.claude/settings.jsonのhooksにあるUserPromptSubmitに、種類commandとしてスクリプトを登録する。終了コードが2のとき、Claude Codeはプロンプトを拒み、標準エラーのメッセージを表示する。\n【ポイント・注意点】これはパターンの照合で、安全な保管庫ではない。珍しい符号化を見逃したり、秘密鍵について話しているだけのプロンプトを誤って止めたりするので、チームごとの調整が要る。Readのdenyルールや書き込みを止めるPreToolUseフックと組み合わせ、試験には本物でなくダミーの値を使い、フックをリポジトリにコミットして全員で共有するよう勧めている。記事は有料の設定テンプレート集の宣伝も含む。","2026-11-18","DEV Community","https://dev.to/vildandenai/stop-yourself-from-pasting-a-private-key-into-claude-code-with-a-userpromptsubmit-hook-105f"],["2台の端末で調査を引き継ぐ、エージェントの共有記憶の試み","dev.toで2026年11月18日、別のエンジニアのエージェントが調査をそのまま引き継げる「チームの共有記憶」を論じる記事が公開された。チームの共有記憶を求めるClaude CodeのGitHub issue 38536を題材に、筆者の製品Palaceで2人の開発者の引き継ぎを試している。CLAUDE.mdや共有のAPIキーに頼るやり方の限界も指摘している。","\n【概要】iCe Gaming氏の記事は、コーディングエージェントにはチームで共有する記憶が必要だと主張する。題材は、チームの共有記憶を求めるClaude CodeのGitHub issue 38536で、スプリントの途中で1人が壁に当たり、別の1人が作業を引き継ぐ場面を扱う。記事全体が筆者の製品Palaceの紹介を兼ねている。\n【背景】今の選択肢は、2人目が文脈を作り直す、1人目がチケットに書き出す、口頭で伝える、の3つだ。issueでは後の2つについて、手間がかかりうまくいかないことが多く、細かな技術情報が失われると書かれている。\n【詳細】筆者は、2人の開発者が別々のAPIトークンで1つのセルフホストのPalace Serverにつなぐ形で引き継ぎを試した。サーバーはDocker Composeか単一のバイナリで動き、Postgresとpgvectorを使う。各端末での設定は、palace remote set --endpointで接続先を指定してAPIキーを入力（~/.palace/config.jsonにモード0600で保存）、palace remote on、palace install、palace remote testの4手順だ。最後の手順はMCPのハンドシェイクを行い、ツールの数を報告する。Cursor、Claude Code、Codexの登録は変わらず、各開発者に個別のトークンを配るべきだとしている。実演では、開発者Aが、issueのスレッドで退けられた3つの方法を、理由と出典のリンク付きで保存した。手作業でチケットに書き出す方法、プロジェクトのCLAUDE.mdを共有の記憶にする方法、チームで1つのAPIキーを共有する方法だ。開発者Bは別の端末で新しいセッションを開き、何が退けられ根拠はどこかを尋ねると、3件が順位と出典のリンク付きで返ってきた。\n【ポイント・注意点】筆者は、CLAUDE.mdのようなファイルは1人の開発者や安定した決定には向くが、更新が仲間に届くのはコミット、プッシュ、プルの後だと指摘する。共有のAPIキーは切り替えにくく、抜けたメンバーが使い続けやすいので、個別に取り消せる資格情報を勧める。チーム試用は10席で60日間、Teamプランは10人まで月149ユーロで、個人向けのpalace-rsは無料だ。","2026-11-18","DEV Community","https://dev.to/icegaming/two-machines-one-ticket-a-shared-agent-handoff-on-claude-code-issue-38536-1dmb"],["10種のAIコーディングエージェント向け防火壁を作った教訓","dev.toで2026年11月18日、Claude CodeやCursor、Codexなど10種のコーディングエージェントで動く実行時の防火壁「provguard」を作った筆者が、得た教訓を公開した。私的なデータ、信頼できない内容、外部へ送る手段の3つがそろう危険に、セッションの履歴を追って対処する。17件の攻撃と31件の通常作業で試した結果も併せて示している。","\n【概要】Geda Durga Vara Praveen氏は、AIコーディングエージェント向けの無料のオープンソースの実行時防火壁provguardを作った。対象は、Simon Willison氏の言う「致命的な三要素」、つまり私的なデータ、信頼できない内容、外部へ送る手段だ。この3つが1つのセッションにそろうと、隠れた指示1つでデータが流出しうる。\n【背景】コマンドを1つずつ調べる方式では注入攻撃を見逃し、危険なコマンドをすべて止めると利用者が防御を切ってしまう。そこでprovguardは各セッションの履歴を追う。ツールの出力に「信頼できない」「機密（秘密はHMACの指紋だけを保存）」「文字を隠している」といった印を付け、コマンドを外部送信、永続化、破壊、遠隔実行、不透明に分け、最初に当たった方針で止める、尋ねる、許すを決める。\n【詳細】対応するのはClaude Code、Cursor、GitHub Copilot、OpenAI Codex、Gemini CLI、Devin、Kiro、Factory Droid、OpenCode、Antigravityの10種だ。教訓として、複製したリポジトリがプロジェクト設定でdisableAllHooksを指定するとフックが動く前に無効になること（provguard doctorで検出）、フックは既定で素通りになるので厳格モードでは止める側に倒すこと、Antigravityでは空の返答が拒否扱いになりechoまで止まったこと、Claude Codeの更新でprompt_idが送られ始めてDevinと取り違えたため、transcript_pathも見るようにしたことを挙げる。ベンチマークは攻撃17件と通常作業31件で、各モード86回の呼び出しだ。監視のみは4件を阻止し13件を見逃した。保護は13件阻止、4件確認、見逃し0。厳戒は17件すべてを阻止し、どのモードも誤検知は0だった。\n【ポイント・注意点】筆者は誤検知の少なさが採用を決めると見る。ただし試験の記録は筆者が書いたもので、想定した攻撃に有利な可能性がある。実際に動かして試したのはClaude CodeとAntigravityだけで、provguardは1つの層でありサンドボックスではないと断っている。","2026-11-18","DEV Community","https://dev.to/durgavarapraveen/what-i-learned-building-a-firewall-for-10-ai-coding-agents-4ie9"],["テストは通っても頼んでいない編集、エージェントの範囲確認","dev.toで2026年11月18日、コーディングエージェントがテストを通しながら頼んでいないファイルまで変える問題を論じた記事が公開された。2万件超の実際のセッションを調べた研究の数値を引き、範囲の確認に必要な5つの条件を挙げる。筆者は、宣言した範囲の外のファイルが変わると完了を止めるClaude CodeのStopフック「taskattest」を作った。","\n【概要】Sion Jang氏の記事は、エージェントがすべてのテストを通しつつ、設定ファイルの編集、バージョンの引き上げ、テストの緩和といった頼んでいない変更をする問題を扱う。テストはコードの振る舞いを確かめるが、エージェントが範囲内にとどまったかは確かめないので、見落とされやすい。\n【背景】記事は2026年5月の研究（arXiv 2605.29442）を引く。約3分の1がClaude Codeで、ほかにCursorやCodexなどを含む実際の20,574セッションを調べ、16,118件の問題の場面を確認した。38.33%は開発者の明示的な制約への違反、10.20%は示された範囲を超えた行動、22.58%は自分の作業状況の誤った報告だった。問題が目に見えて解決した場面の91.49%は開発者がはっきり押し返したもので、エージェントが自分で気づくことはまれだった。別の開発者による36件の管理されたClaude Codeの作業では、厳しい完了基準のもとで6回中2回、テストを通すためにコードの意味を変えた。\n【詳細】筆者は、役に立つ範囲確認の条件を5つ挙げる。許可するパスと禁止するパスを宣言すること。ツールの呼び出しだけでなく最終的な作業ツリーを調べること（スクリプトやリダイレクトでも書き込むため）。開発者が以前から持つ未コミットの変更を除く基準を持つこと。報告を後で読むのではなく、エージェントが終えようとする時点で確かめること。何度も失敗したら人に引き渡す逃げ道を置くことだ。筆者のtaskattestは、Apache-2.0のClaude Code用Stopフックで、gitの作業ツリーを宣言した範囲と比べ、範囲外のファイルが変わると完了を止める。CSVやExcelなどの出力ファイルも確かめる。モデルの呼び出しもネットワーク接続も使わない決定的な動作で、標準ライブラリだけに頼り、Linux、macOS、Windowsで動く。\n【ポイント・注意点】パスによる確認では、許可したファイルの中での意味の変更は捕まえられず、出力の確認や人のレビューが要ると筆者自身が述べる。コメント欄では、tests/**を許可すると緩めたテストが通ってしまうという指摘や、範囲を報告ではなく前提条件として扱い、テストの変更は別に承認させる案が出ている。","2026-11-18","DEV Community","https://dev.to/sion_jang_b7e2e2c640671f5/your-coding-agents-tests-pass-it-still-edited-files-you-never-asked-about-2npm"],["Claude Code 2.1.327、MCPのトークンをコマンド行から外す","AI TL;DRは2026年11月17日、Claude Code 2.1.327の公開を伝えた。MCPサーバーのJSONを標準入力から読む新しい書き方で、トークンをシェルの履歴に残さずに済むようになった。/statusは壊れた設定ファイルなどを一覧で示す。Remote Controlのworktreeモードで.envなどが消える不具合をはじめ、データが消える問題も直された。","\n【概要】Anthropicが公開したClaude Code 2.1.327についての記事だ。MCPの設定方法、/statusの診断表示、データ消失の修正、worktreeとauto modeの変更が主な内容で、Claude Codeの利用者と設定を管理する管理者に向けた版だとしている。導入はnpm i -g @anthropic-ai/claude-code@2.1.327で行える。\n【背景】MCPサーバーの登録で認証トークンをコマンド行に書くと、シェルの履歴に残りやすい。また、長時間動かすセッションや離れた端末から操作するセッションでは、設定ファイルや作業ファイルを誤って消す不具合の影響が大きい。\n【詳細】MCPの設定では、claude mcp add-json <name> -という形で、サーバーのJSONを標準入力から読めるようになった。これでトークンをコマンド行とシェルの履歴から外せる。/statusは、壊れたagent、skill、command、output-styleのファイル、キー割り当ての誤り、使えないサンドボックス、何にも一致しないフックのマッチャーを一覧で示すようになった。データ消失の修正としては、Remote Controlのサーバーをworktreeモードで止めると、動いているセッションのgitで無視されたファイル（.envなど）が消えることがあった問題と、プロジェクト範囲のclaude mcp addやremoveが.mcp.jsonのほかの最上位のキーを消すことがあった問題が直った。worktreeでは、ExitWorktreeが、保存していない作業を含むかもしれないworktreeを消す前に確認するようになった。auto modeは、Bash(pnpm dlx *)のように任意のパッケージを実行する許可ルールを、さらに無視するようになった。\n【ポイント・注意点】副作用として、パスの確認や作業ディレクトリの外の扱いが厳しくなったため、これまで確認なしで動いていたコマンドで許可を求められる場合がある。Remote Controlやworktreeを使ってエージェントを長く動かしている人や、.mcp.jsonをチームで共有している人は、更新した後の挙動を確かめておきたい。","2026-11-17","AI TL;DR","https://ai-tldr.dev/releases/anthropic-claude-code-2-1-327/"],["Claude Code v2.1.326、auto modeの許可ルールと書き込み先が変更","クラスメソッドのDevelopersIOは2026年11月17日、11月16日に公開されたClaude Code v2.1.326の主な変更を解説した。auto modeでは一部のワイルドカードのシェル許可ルールが無視されて安全チェックに回り、サンドボックスでは機密性の高いホーム内のフォルダへの既定の書き込みが止まった。既存の設定のまま挙動が変わる点に注意を促している。","\n【概要】石川覚氏による記事は、2026年11月16日に公開されたClaude Code v2.1.326を扱う。CHANGELOGは367項目あり、多くは修正で、権限チェックとサンドボックスに関するものが多い。筆者は、既存の設定のまま挙動が変わる変更を中心に取り上げている。\n【背景】auto modeやサンドボックスは、Claude Codeを無人やCIで動かすときの安全の土台になる。ここでの変更は、同じ設定でも許されていた操作が止まる、あるいは確認が出るといった形で表れる。\n【詳細】auto modeの許可ルールでは、プログラムを指定しないものや$HOMEで始まるものなど、一部のワイルドカードのシェル許可ルールが無視され、安全チェックに回るようになった。Windowsのバックスラッシュのパスを使うワイルドカードのルールも評価され、止められる場合がある。完全一致のルールは引き続き許可される。サンドボックスでは、macOS、Linux、WSLで、サンドボックス内のコマンドが既定で一部の機密性の高いホーム内のフォルダに書き込めなくなった。特定のフォルダはsandbox.filesystem.allowWriteで許可できるが、CHANGELOGは対象のフォルダ名を示していない。Code Modeはエージェントチームを有効にしたまま動くようになった。ファイル系のツールは.credentials.jsonなどのサインイン用ファイルに書けなくなり、それに触れるBashのコマンドの前には確認が出る。破壊的な変更には、自前で動かすランナーがLinuxとmacOSでghがない場合に組み込みのgh apiを既定で用意する点（--use-anthropic-gh falseで無効）なども含まれる。筆者はmacOSとOpusで、壊れたローカルリンクを5つ含む見本の文書プロジェクトを使い、エージェントチームを有効にしたままCode Modeを試した。Claudeは壊れたリンクを正しく挙げ、docs-checkerとexamples-checkerの2人のチームメイトもCode Modeで動き、記録のtaskKindはin_process_teammateだった。\n【ポイント・注意点】筆者は、更新した後に権限まわりの設定を見直し、特に無人運転やCIでは必要な設定を明示するよう勧めている。","2026-11-17","DevelopersIO（クラスメソッド）","https://dev.classmethod.jp/en/articles/20261117-cc-updates-v2-1-326/"],["Claude Code Projectsのまとめ役AI、仕組みと使い方と注意点","C-BA AI-memoは2026年11月17日、Claude Codeの「Projects」の使い方の解説記事を公開した。11月14日（日本時間）の更新で強化された、作業の分割や進捗の報告を担うまとめ役AIの仕組み、対応するプランと環境、使い方の流れを整理している。利用枠の消費が速い点や、マージ前のレビューが欠かせない点など、注意点も具体的に詳しく取り上げている。","\n【概要】Claude CodeのProjectsは、複数の開発作業の割り振りと進捗の管理をAIに任せる機能だ。2026年11月14日（日本時間）の大型更新で、まとめ役AI（コーディネーター）が強化された。チャットやファイルをまとめる従来のClaudeのプロジェクト機能とは別物で、続けて行う作業の管理を重視している。土台は2026年9月17日に発表された再設計だという。\n【背景】人は方針と最終判断を受け持ち、まとめ役AIがタスクの分割、割り振り、進捗管理、報告を担う。個別のスレッドがコードの編集や調査、テスト、修正を行う。作業範囲の情報はスレッドごとに持ちつつ、プロジェクト全体の指示と記憶は共有する。\n【詳細】11月の更新では、まとめ役の自発的な進捗報告、プロジェクト内での質問への回答、本筋から外れた質問を切り分ける/btw、スレッドを分ける/fork、スレッドへのリマインダー、読み取り専用リンクでのスレッド共有、成果物の閲覧や設定の改善が加わった。11月17日時点の対応プランはPro、Max、Ultra（パブリックベータ）で、Free、Team、Enterpriseは対象外だ。Web版、デスクトップアプリ、モバイルアプリで使え、ターミナル（CLI）、VS Code拡張、JetBrains拡張では使えない。GitHubとの連携には対象リポジトリへのClaude GitHub Appの導入が必要で、GitLabとBitbucketには対応しない。使い方は、プロジェクトを作って名前や作業内容、リポジトリを設定し、Project Instructionsにコーディング規約やテスト、マージ前の承認などの共通ルールを書き、依頼してスレッドの進捗や変更内容、テスト結果を確かめるという流れになる。\n【ポイント・注意点】まとめ役の調整やPRの監視も利用枠を使うので、消費が速い。新規スレッドは全プロジェクト合計で1日500本までとされる。上限で止まったスレッドは、Auto-continueが有効だと回復後に自動で再開する。完了報告があっても正しいとは限らず、マージ前の確認は欠かせない。Project Instructionsは技術的な制限ではないため、大事なブランチはGitHubのブランチ保護で守る。まずは独立した2〜3個のタスクから始めるよう勧めている。","2026-11-17","C-BA AI-memo","https://ai.cbagames.jp/2026/11/17/claude-code-projects-guide/"],["CLAUDE.mdとルールで要件を伝える、@ITのClaude Code連載第4回","@ITは2026年11月17日、連載「速習・実践『Claude Code』」の第4回を公開した。小さなMarkdownプレビューのWebアプリを題材に、/initで作ったCLAUDE.mdとルールを対話で整え、Plan Modeで計画を確かめてから機能を足す手順を紹介する。ルール同士の矛盾の解き方や、Claudeが行った検証に人の確認を加えることの大切さも説いている。","\n【概要】連載の第4回は、Claude CodeのPlan Modeと、プロジェクトの指示書であるCLAUDE.mdと.claude/rules/を使い、index.html、style.css、script.jsの3ファイルからなる小さなWebアプリ（Markdownプレビュー）に機能を足す手順を解説する。\n【背景】CLAUDE.mdの置き場所は3つある。プロジェクト全体なら./CLAUDE.mdか./.claude/CLAUDE.md、自分のすべてのプロジェクトなら~/.claude/CLAUDE.md、個人用なら./CLAUDE.local.md（.gitignoreに入れる）だ。決まりごとを書いておけば、毎回の指示を短くできる。\n【詳細】まず/initでCLAUDE.mdとルールを作らせ、そのまま使わずに3点を確かめる。書かれているが不要な内容、人は知っているがコードからは読み取れない決まり、Claudeが勝手に決めてしまう抜けだ。例では、自前のサニタイズ処理をDOMPurifyに差し替える方針を明記した。次にShift+TabでPlan Modeに切り替え、「ファイルを開く」機能を計画させる。計画では既存のサニタイズ処理の置き換えが抜けていたので、指摘して直させた。承認のモードは、編集ごとに確認、編集は自動で他は確認、安全チェックを通ったものを自動で実行するauto modeの3つだと紹介している。Claudeはブラウザで<script>やonerrorを含むXSSの試験を行い、スクリーンショットで報告したが、色を16進数で直接書くCSSのルール違反は見逃した。筆者は指摘して別の作業として直させた。ダークモード対応では、ルールに「対応しない」とあったため指示と矛盾した。筆者はルールを直す方を選び、:rootのCSS変数に色を集め、:root[data-theme=\"dark\"]で上書きし、color-schemeで切り替える方針にした。最後にVS Code拡張で前回の履歴から再開し、細かい調整は手で行い、問題があればCheckpointsで戻す。\n【ポイント・注意点】ルールに書かれていないことはClaudeには判断できず、ルール同士が矛盾することもある。検証の結果をうのみにせず、最後は人が画面で確かめるべきだと結んでいる。","2026-11-17","@IT（アイティメディア）","https://atmark
