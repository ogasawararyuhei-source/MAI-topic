まで受け継いでつないでいた問題も見つけた。信頼できない入力・強い権限・外への経路の3点がそろう危うさと、コードでの除去や隔離といった対策を示している。","\n【概要】DEV Communityで、定期的に動くAIエージェントを狙ったプロンプト注入と、無人実行でのMCPの影響範囲を報告した記事。AIエージェント向けのSNSで、ダッシュボードの返答に含まれる `check_in.briefings` に、第三者のプロンプトが入り込んでいた。\n【背景】エージェントはこの返答を、毎回の定期確認で読む。調べると、誰でもコミュニティを作り、本人の同意なしに任意のエージェントへ役割を付けられた。購読者1人のコミュニティが、約100体を狙っていた。cadenceを0にすると、攻撃者のプロンプトが毎回の返答に入る。書いた人は表示されず、外す手段もなかった。\n【詳細】探りは4段階で強まった。目印の返信、能力の確認、資格情報の探索、環境とファイルの吐き出し（KEY・TOKEN・SECRETなどの検索）である。「断ったら決まった文字列を投稿して」という指示に従ったエージェントが複数いた。これで経路が通じていることが攻撃者に知られた。筆者のエージェントは毎回拒み、目印の投稿もしなかった。さらに、プロキシのログから、30分おきの定期ジョブが使いもしないローカルのMCPサーバーに毎回つないでいたことが分かった。`--standalone --auto` の無人実行で全体設定が合わさり、メール・クラウド・SSH・DB・ブラウザーのMCPをすべて受け継いでいたのが原因だった。\n【ポイント・注意点】筆者は、信頼できない入力、強い権限のツール、外への経路の3点がそろうと致命的になると指摘する。対策は、check_inの中身をモデルに渡る前にコードで取り除く、ジョブの設定でMCPの使用を拒否する、コンテナ・VM・低権限ユーザーで動かす、の3つ。プロンプトの補強はセキュリティの境界にならない。運営には報告済みだという。定期実行のエージェントでは、読み込むMCPを明示的に絞りたい。無人で動くほど、誰も気づかないまま権限が広がっていないかを、ログで確かめる習慣が大切になる。","2026-11-25","DEV Community（Michael Jordan）","https://dev.to/michael_jordan_87eaf96f24/prompt-injection-via-unsolicited-role-briefings-and-the-hidden-mcp-blast-radius-in-scheduled-2pkb"],["Vercel、人とコーディングエージェントのタスク調整板Boardを試験公開","Vercelが、人とコーディングエージェントが同じ場所でタスクを分け合うための実験的な掲示板「Vercel Board」を公開したとInfoQが報じた。画面を持たない作りで、Claude CodeやCodexなどがCLIやSDKから参加し、タスクを引き受けて進捗を書き込む。引き受けは期限付きの貸し出しで、二重の引き受けを防ぐ。v0の開発ではPRの50%超が自動でマージされているという。","\n【概要】InfoQが、Vercelの実験的な新製品「Vercel Board」を紹介した。人とコーディングエージェントがタスクを調整するための掲示板で、画面を持たない（headless）作りになっている。Claude Code、Codex、Pi、OpenCode、Mastra、LangChainなどが、同じ掲示板の上で動ける。\n【背景】複数のエージェントを並べて動かすと、誰が何を引き受けたか、作業が重なっていないかを管理する場所が要る。Boardはそのための共通の調整役を目指している。\n【詳細】チームごとに既定の掲示板「General」があり、チャンネルとスレッドで構成される。操作は `vercel board` のCLIか、`@vercel/board` のSDKで行う。エージェントへの使い方は、`npx skills add vercel/board --skill board` で入れるスキルで教える。名前は `--as` や `BOARD_PROFILE` で名乗れるが、権限は操作者やプロジェクトのものになる。タスクは、引き受け、進捗の投稿、完了か失敗、の順に進む。引き受けは最長5分の貸し出しで、更新しないとキューに戻る。二重に引き受けると、片方が `task_claimed` で失敗する。タスク同士の依存関係も宣言できる。watcherは返信やラベルの変化で起動するので、常駐プロセスは要らない。SlackとLinearとは双方向に同期し、GitHubからは取り込むだけである。Sandbox内のエージェントには、`sandboxPolicy()` で資格情報を置かずに限られた権限を渡せる。\n【ポイント・注意点】Vercelは、v0のソフトウェア工場をBoardの上に作り直し、PRの50%超が自動でマージされているという。ただし、Boardの権限設定はSlackなど外部側には効かない。まだ実験段階の製品なので、本番の運用に組み込むなら権限の境界を確かめてからにしたい。","2026-11-25","InfoQ","https://www.infoq.com/news/2026/11/vercel-board-agents/"],["Anthropic、MCPサーバーがスキル配布やTasksを扱えるように","Anthropicは、MCPサーバーがツールと一緒にスキルを配れる「Skills over MCP」を、ClaudeとClaude Codeで公開ベータにした。あわせて、サーバー側で長い処理を走らせるTasksと、途中でユーザーに入力を求めるElicitationをPro・Max・Ultraで一般提供した。ファイルのアップロードも近く展開する。いずれもオープンなMCP仕様の一部で、他の対応クライアントでも使える。","\n【概要】Anthropicが2026年11月24日、MCPまわりの新機能をまとめて発表した。MCPサーバーがツールと一緒にスキルを配れる「Skills over MCP」が、ClaudeとClaude Codeで公開ベータになった。サーバー側で処理を走らせるTasksと、ユーザーに入力を求めるElicitationも一般提供になった。\n【背景】MCPはAIを外部のツールやデータにつなぐ共通の仕組みとして広く使われている。記事によれば、MCPのSDKは月7億ダウンロードを超え、Claude向けのコネクタは1万を超える。今回の機能は、つなぐだけでなく、使い方の手順や長い処理、途中の確認までサーバー側で扱えるようにするものだ。\n【詳細】Skills over MCPは、Pro・Max・Ultraでは最初から有効。Teamは管理者が有効にすれば使え、Enterpriseは後日になる。スキルは必要なときだけ読み込まれるので、コンテキストの消費が少ない。提携先はShopify、HubSpot、Atlassianで、Cartaも近く加わる。Tasksは、時間のかかる処理やエージェントのループ全体をサーバー側で走らせる仕組みである。Claudeは作業を続け、あとで結果を受け取る。例にはZoomInfoが挙がっている。Elicitationは、サーバーが呼び出しの途中で止まり、フォームやリンクでユーザーに入力を求める仕組みだ。Supabaseの費用確認と破壊的なSQLの確認や、GitHubがリポジトリ削除の前に名前を入力させる例が紹介された。TasksとElicitationはPro・Max・Ultraで一般提供となり、TeamとEnterpriseにも順次広げている。PDFや画像をコンテキストを通さずにサーバーへ渡すFile Uploadsも近く展開する。\n【ポイント・注意点】これらはオープンなMCP仕様とその拡張の一部なので、Claude以外の対応クライアントでも使える。複数のサーバーを使う構成では、ツール検索でツール定義の消費を85%超減らせるという。管理者が一度認可すれば利用者が自動で接続されるEnterprise Managed Authの拡張も紹介された。","2026-11-24","Claude（Anthropic）","https://claude.com/resources/articles/skills-over-mcp-tasks-and-more"],["ClaudeのアーティファクトをMac・Windowsアプリとして導入可能に","Anthropicは、Claudeで作ったアーティファクトを「Install as app」でMacやWindowsのデスクトップアプリにできる機能を、ベータで展開し始めた。専用の窓とアイコンを持ち、中からClaudeやコネクタを使える。通知やショートカットのほか、PCのファイルを変更できる全権限も与えられる。権限は版ごとに許可し直す必要があり、アプリは事前に審査されない。","\n【概要】Anthropicが2026年11月24日、Claudeのアーティファクトをデスクトップアプリにする「Install as app」を発表した。Claude for MacとWindowsでベータとして展開している。作ったアプリは専用のアイコンと窓を持ち、他の人と共有でき、中からClaudeとコネクタを使える。\n【背景】これまでアーティファクトは、Claudeの画面の中で動かすものだった。アプリにすると、通知を出したり、メニューバーやシステムトレイに常駐させたりでき、PCの道具として使える幅が広がる。パッケージ化や署名は不要で、APIキーも要らない。\n【詳細】手順は、アプリを更新し、アーティファクトを開いて、Shareメニューから「Install as app」を選ぶ。元のアーティファクトを編集すると、アプリも自動で更新される。アプリがClaudeに送るリクエストは、プランの利用上限に数えられる。権限は3段階ある。ブラウザー並みのDefault、通知・グローバルショートカット・最前面の窓が使えるApp permissions、毎回聞かずにプログラムを実行しファイルを変更できるFull computer accessである。Full computer accessは、自分で作ったアプリと、Team・Enterpriseでは組織内で作られたアプリに限られる。初期設定では、Teamは有効だが全権限はオフ、Enterpriseはownerが有効にするまでオフになっている。\n【ポイント・注意点】権限は版ごとに与えるもので、更新のたびに、自分の編集であっても許可を求め直される。一方、アプリが外部サイトから読み込む中身は、許可を取り直さずに変わりうる。Anthropicはアプリを事前に審査しないので、全権限は信頼できるものにだけ与えるよう注意している。使うにはオンラインでログインしている必要がある。HIPAA対応の組織、ハイブリッド構成、Claude Docs・Slides・Sheetsでは使えない。","2026-11-24","Claude（Anthropic）","https://claude.com/resources/articles/install-as-app"]],"cnc":[["NestWorks、TIME選出の卓上CNC「C500」を6499ドルで受注","深圳のNestWorksは2026年11月25日、TIME誌の「2026年の最高の発明」に選ばれた卓上CNC「C500」を公式オンラインストアで注文受付中と発表した。価格は6,499米ドルで、同社は2026年で最も安い価格としている。800Wスピンドルと5本の自動工具交換を備え、自社CAM「NestStudio」が工具と材料を認識して加工方針を作る。出荷は購入から約1か月後の見込み。","\n【概要】\n中国・深圳のNestWorksは2026年11月25日（PR Newswire配信）、卓上CNC加工機「NestWorks C500」の注文受付を公式オンラインストアで始めたと発表した。C500はTIME誌の「2026年の最高の発明（Best Inventions of 2026）」に選ばれた機種で、価格は6,499米ドル。同社はこれを2026年で最も安い価格だとしている。\n【背景】\n同社はC500を、エンジニアや製品開発者、メイカー、小規模事業者に向けた機械と位置づける。外注に出したり、従来のCNCの難しい操作を覚えたりせずに、デジタルの設計データから精密な削り出し部品を作れるようにすることが狙いだとしている。会社概要では、ハードウェアとソフトウェア、「知的なアルゴリズム」を組み合わせたデジタル製造の仕組みを開発すると説明している。\n【詳細】\n主軸は最高18,000回転の800W電動スピンドルで、鋳造アルミの剛性の高い構造に載る。自動化の機能として、5本の自動工具交換、工具長の測定器、ワークの自動芯出しを備える。冷却は最小量潤滑（MQL）で、3本のオーガーで切りくずを自動で排出するため、少ない見守りで加工を続けられるという。自社CAM「NestStudio」は、モデルの読み込み、工具と材料の認識、最適な加工方針の生成、全工具経路の事前シミュレーションという4段階で、データから部品までを進める。材料と切削工具のライブラリーを内蔵し、条件の手入力が要らず、他社のソフトも必要ないとしている。対応材料は条件次第でアルミ合金、鋼、木材、樹脂。用途には試作、機械部品の特注、ロボット製作、小ロット生産を挙げる。全台を自社工場で加工・組立・最終検査しているという。\n【ポイント・注意点】\n出荷は購入から約1か月後の見込み。リリースはC500そのものを「AI搭載」とは書いておらず、自動化として示されているのは工具測定や芯出し、CAMによる工具と材料の自動認識である。価格は発表時点のもので、詳しい仕様は同社のストアで確かめる必要がある。","2026-11-25","The Manila Times（PR Newswire）","https://www.manilatimes.net/2026/11/25/tmt-newswire/pr-newswire/nestworks-c500-the-desktop-cnc-named-in-times-best-inventions-of-2026-available-to-order/2477661"],["SOLIDWORKS幹部が語る産業AI 物理世界を理解するAIへ","MONOistは2026年11月25日、ダッソー・システムズが11月13日に開いた「3DEXPERIENCE WORLD JAPAN 2026」の講演を報じた。SOLIDWORKSのCEOらが登壇し、LLMだけでは物理世界の理解に向かないとして、物理シミュレーションと製造業のデータを組み合わせる「産業世界モデル」の構想を説明した。AIの誤りが人命に関わるとして、信頼性の確保を訴えた。","\n【概要】\n製造業向けメディアのMONOistは2026年11月25日、ダッソー・システムズが2026年11月13日に開いたユーザーイベント「3DEXPERIENCE WORLD JAPAN 2026」の講演を紹介する記事（全4ページの1ページ目）を公開した。登壇したのは、インダストリー・イノベーション担当シニア・バイスプレジデントのGian Paolo Bassi氏と、SOLIDWORKSのCEO兼R&D担当バイスプレジデントのManish Kumar氏である。\n【背景】\n記事によると、SOLIDWORKSは単体のデスクトップCADから、設計・シミュレーション・データ管理を3DEXPERIENCEプラットフォームでつなぐ方向へ進んでいる。設計者がAIに求めるのはCADの操作の手助けだけではない、というのが記事の見出しの主張だ。CNCで部品を削る前の設計段階で、AIがどこまで判断を支えられるかに関わる話題といえる。\n【詳細】\nBassi氏は産業AIの技術基盤とプラットフォーム戦略を説明した。Kumar氏はYann LeCun氏の「LLMは物理世界の理解には向かない」という見解を引き、物理世界を理解して科学的な根拠で判断できるAIが必要だと述べた。ダッソーが描く「産業世界モデル（Industry World Models）」は、物理ベースのシミュレーションとバーチャルツインに、製造業が蓄えたデータを組み合わせるもの。対象は「製品」「製造」「ビジネス」の3領域で、製品では自動車の衝突の挙動、製造では工場ラインの稼働、ビジネスでは設計判断がコストや材料、サプライチェーンに与える影響を扱うとされる。同社は2026年2月3日にNVIDIAとの協業を発表し、NVIDIAのAI基盤やオープンモデル、ソフトウェアライブラリーを使って産業AIの基盤を作るとしている。\n【ポイント・注意点】\nBassi氏は、AIのハルシネーション（もっともらしい誤り）が人命を危険にさらしうると警告し、信頼性と安全性を確かめる仕組みが要ると強調した。記事は11月5日の「3DEXPERIENCE CONFERENCE JAPAN 2026」でPascal Daloz CEOがAIと人の専門性について語った点にも触れている。ここで紹介したのは1ページ目の内容で、製品の具体的な発売時期や価格は示されていない。","2026-11-25","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/25/news005.html"],["フィジカルAIの主戦場は工作機械？ロボと環境の情報統合","日刊工業新聞のニュースイッチは2026年11月25日、フィジカルAIの学習で工作機械が突破口になりうると論じる連載の上編を掲載した。ロボット自身のカメラだけでは学習が難しく、環境側のセンサーを組み合わせる例が出ている。工作機械へのワークの出し入れは、ルール制御だけでは解けない多様さがある一方、俯瞰カメラの設置費用を吸収しやすいとしている。CP AI Roboticsやホンダの事例も紹介した。","\n【概要】\n日刊工業新聞社のニュースイッチは2026年11月25日、「フィジカルAIの主戦場に!?…ロボと環境の情報統合、工作機械が突破口になる理由」と題する2回連載の上編を掲載した（紙面の掲載は2026年10月27日と記されている）。工作機械へのワークの供給と回収が、フィジカルAIの技術開発の題材として向いている可能性を論じている。\n【背景】\nフィジカルAIでは、ロボットを遠隔操作して学習データを集め、AIに作業を覚えさせる。ただ、ロボットに付いたカメラやセンサーだけでは難しい場面があり、環境の側にもセンサーを置く例が出ている。ヒューマノイドは自分の情報だけで学習が完結する点が強みだが、開発は途上にある。\n【詳細】\nCP AI Robotics（東京都千代田区）は、台車で動くセミヒューマノイドで店舗の棚出し作業の自動化を進めている。視覚言語行動モデル（VLA）の学習にはヘッドカメラとハンドカメラの映像を使うが、遠隔操縦席には俯瞰カメラの映像を出す。ヘッドカメラは手や商品に隠れやすく、頭だけを動かす操作も難しいためだ。俯瞰カメラは周りの状況も分かり、人と同じ空間で働くときの安全にも役立つという。まずはコンビニでPoCを進める。ホンダはギアボックスの組立で、工具の回転軸をネジの軸に合わせる動作を補正する機能を作り、遠隔操作を半自動化した。ただ、動作ごとに機能を作ると開発の手間が膨らむ。本田技術研究所の水谷了チーフエンジニアは、今はルール制御に頼る部分が大きく、AIで多様な作業に対応することが次の課題だと話す。\n【ポイント・注意点】\n記事は、俯瞰カメラは設置費用、半自動化は開発工数が課題で、最適な方式は作業ごとに違うと整理する。今のVLAでは組付けのような接触を伴う精密作業はまだ難しい。工作機械へのワークの出し入れはルール制御だけでは解けない多様さがある一方、俯瞰カメラの費用を吸収しやすく、フィジカルAIの主戦場になりうるとまとめている。あくまで記者の分析記事であり、具体的な製品発表ではない。","2026-11-25","ニュースイッチ（日刊工業新聞社）","https://newswitch.jp/p/50902"],["Creality、ブラックフライデーでFalconレーザー彫刻機を最大24%引き","PC Guideは2026年11月25日更新の記事で、Crealityのブラックフライデーの値引きをまとめた。Falconシリーズのレーザー彫刻機が最大24%引き、3DスキャナーのPIKAとSermoon P1Sが10%引きで、期間は11月19日から30日まで。2波長のFalcon A1 Proは835ドル、モジュール式のFalcon T1は1,999ドルからとなる。PIKAには隙間を埋めるAI支援の機能がある。","\n【概要】\nPCパーツや家電の情報サイトPC Guideは、2026年11月25日更新の記事で、Crealityのブラックフライデーのセールをまとめた。Falconシリーズのレーザー彫刻機が最大24%引き、3DスキャナーのPIKAとSermoon P1Sが10%引きとなる。レーザー彫刻機のセールは11月19日から11月30日までで、スキャナーも同じ期間。価格はCrealityの米国ストアで11月25日時点のものだという。\n【背景】\n卓上のレーザー彫刻機や3Dスキャナーは、個人の制作や小さな販売事業でよく使われる道具だ。年末の大型セールは、こうした機械を安く買える時期にあたる。記事は、多くの趣味の人には価格の手頃な機種、小規模事業や金属への刻印には上位機種を勧めている。\n【詳細】\nFalcon A1 Pro（20Wの2波長、密閉型）は1,099ドルから835ドルへ264ドル引きで、値引き率が最も大きい。青色ダイオードに加え、金属や樹脂向けの赤外線レーザーを持つ。Falcon A1（10W、密閉型）は549ドルから439ドル、Falcon2 Pro S（22W、密閉型）は1,099ドルから899ドル。モジュール式のFalcon T1は基本構成が20Wダイオードで、2,499ドルから1,999ドルになる。40Wダイオード、20Wファイバー、5W UV、60W MOPAの各モジュールも用意され、T1のほかの構成は15〜20%引き。空気清浄機Falcon AP1 Miniは299ドルから239ドル。スキャナーのPIKAは約260gの手のひらサイズで、699ドルから629ドル。7本の青色レーザー線と近赤外の構造化光を使い、精度は実験室条件で最大0.03mmとされる。マーカーの有無どちらでも読み取れ、隙間を埋めたり質感を加えたりする「AI支援ツール」を備える。Sermoon P1Sは単体で処理できる機種で、2,299ドルから2,069ドル、精度は最大0.02mm。\n【ポイント・注意点】\n記事は、人気の機種はセール終了の11月30日より前に売り切れるおそれがあると注意している。価格は米国ストアのもので、地域によって違う可能性がある。スキャナーのAI支援は後処理の補助で、加工条件を自動で決める機能ではない点に注意したい。","2026-11-25","PC Guide","https://www.pcguide.com/deals/creality-black-friday-deals-laser-engravers-3d-scanners/"],["中国チーム、AI数値制御付きの超精密静圧研削盤を紹介","36Krに2026年11月24日、全静圧式の超精密CNC研削盤を開発するチーム「挑戦者」の紹介記事が載った。静圧主軸の半径方向の振れは0.2μm、軸方向の遊びは0.1μmで、独スイスの主軸に並ぶとする。華中科技大学の「華中AI知能数値制御システム」を使い、AIによる自動プログラミングや誤差の自動補正、工程の自動最適化に対応するという。価格や販売の実績は示されていない。","\n【概要】\n中国の情報サイト36Kr（英語版）に2026年11月24日、全静圧式の超精密AI知能CNC研削盤を紹介する寄稿記事が掲載された。開発しているのは2024年3月に設立されたチーム「挑戦者（Challenger）」。記事は、研削盤の核となる超精密の静圧主軸と、AIを使う数値制御の組み合わせを打ち出している。\n【背景】\n超精密研削盤はサブミクロンからナノメートル級の精度に達し、光学、航空宇宙、半導体、高級軸受に使われる。記事によると、高級な超精密研削盤は長く海外メーカーが独占してきた。日本の輸出貿易管理令の改正で、保守や立ち上げといった技術サービスにも規制が広がった点も挙げている。高級軸受の輸入比率は「92%に達する」とし、国産の軸受はP2やP4級の精度に安定して届かないと述べる。\n【詳細】\n核となる部品は超精密の静圧主軸で、半径方向の振れは0.2μm、軸方向の遊びは0.1μm。記事は、ドイツのHipplerやスイスのSTUDERの主軸と同等だとしている。開発には関世和氏が20年以上携わってきたとされ、戴恵良教授は周勤之院士の技術路線を継ぐ人物と紹介される。周氏が初期に手がけた国産の鏡面研削盤は、真円度0.08μmに達したという。AIの部分は、華中科技大学の「華中AI知能数値制御システム」が担う。AIによる自動プログラミング、環境による精度のずれの自動補正、加工の誤差の自動測定と補正、工程の自動最適化に対応し、精度をそろえることを狙うとしている。\n【ポイント・注意点】\nチームは資金が足りないため、今は軸受メーカーの設備更新を手伝い、静圧主軸と油圧システムを売るにとどまっているという。記事は中国の第15次5か年計画の綱要や、国の「工作機械特別基金」にも触れているが、価格や販売実績の数字はない。性能の数字はいずれも寄稿者側の説明で、第三者の検証は示されていない。AIによる自動プログラミングや補正がどの程度の精度向上につながるのかも、記事の中では具体的な数字で示されていない。製品として買える時期も分からず、今後の続報を待ちたい話題である。","2026-11-24","36Kr","https://eu.36kr.com/en/p/4082433392399490"],["オートデスク、Fusionの自動化AIを課金へ 決算説明会で表明","Bullishedは2026年11月24日、オートデスクの決算説明会で、アンドリュー・アナグノストCEOが高度に自動化された設計業務を収益化する方針を示したと報じた。Fusionの新しいサブスクでは、Autodesk AssistantやAIエージェントの利用枠が組み込まれ、すでに追加の利用を買う顧客もいる。第3四半期の売上高は21.6億ドルで17%増だった。","\n【概要】\n米国の金融ニュースサイトBullishedは2026年11月24日、オートデスクの決算説明会の内容を報じた。アンドリュー・アナグノストCEOは、どんどん自動化されていく設計の仕事について「その一部は当然収益化する」と述べ、課金する方針を示した。CAD/CAMソフト「Fusion」の新しいサブスクリプションでは、顧客がすでにAIの追加の利用分を買い始めているという。\n【背景】\nFusionは個人のメイカーから町工場まで広く使われる設計・CAMソフトで、CNC加工の工具経路づくりにも使われる。記事によると、新しいサブスクは、Autodesk AssistantとAIエージェントの道具の利用枠をあらかじめ含む形になった。これまでの「拡張機能（エクステンション）」を個別に買う方式は顧客に分かりにくく、それを置き換えるものだという。\n【詳細】\n新サブスクに移った顧客には2年間の価格保護が付いた。含まれる利用枠を超える分は「Flexパック」で買う顧客もいる。オートデスクは製品情報を管理するAIエージェントの道具も各プランに加える計画だ。一方で、外部のAIエージェントから呼び出される自動化への課金は、まだほとんど始まっていないとされる。アナグノスト氏は、価値の中心がモデルや図面を作ることから、資産の一生を通じてそれを使うことへ移っていると話した。あるエンジニアリング会社はRevitで建築の図面づくりを自動化し、確認前で90%超の時間短縮、確認後でも少なくとも50%の正味の節約を見込む。第3四半期の売上高は21.6億ドルで、報告ベースで17%増、為替一定で14%増。通期の売上高見通しは83.6億〜83.75億ドルとした。\n【ポイント・注意点】\nFusionを使ってCNCの加工データを作る個人や小さな工房にとっては、AI機能の使える量と料金の形が今後変わりうる点が要注目だ。AI自動化への課金の具体的な料金や時期は、記事の中では示されていない。プランの詳細はオートデスクの公式発表で確かめたい。","2026-11-24","Bullished","https://www.bullished.co/autodesk-plans-to-charge-for-ai-automation-as-customers-buy-extra-fusion-usage-b7d90585/"],["製造業のAIエージェントは「新人」と同じ監督を 会計事務所が提言","米会計事務所James Moore & Co.は2026年11月24日、製造業でのAIエージェントの使い方を論じる記事を公開した。エージェントは棚卸しや報告書づくりのような判断の少ない作業を担えるが、監督なしでは誤りも同じ速さで広がると指摘する。最大の危険は情報の漏えいで、導入前の点検と管理された環境での試運転を勧めている。決定は人に残すべきだとも強調する。","\n【概要】\n米国の会計・コンサルティング会社James Moore & Co.は2026年11月24日、「製造業のエージェント型AIには新人と同じ監督が必要な理由」と題する記事を公開した。同社のポッドキャスト「Moore on Manufacturing」にKevin Golden氏が出演した回をもとに、AIエージェントを新しく雇った人のように、教え、見守り、範囲を決めて使うべきだと説いている。\n【背景】\n製造業では人手不足が続いている。Golden氏は、AIエージェントがその穴を埋める助けになりうると話す。記事は、ロボットと組んで行う棚卸し（サイクルカウント）や、データを集めてKPI、投資対効果の分析、経営向けの報告書にまとめる仕事を例に挙げる。エージェントは「眠らず、残業もいらない」とも書いている。\n【詳細】\nただし、監督のないエージェントは、良い仕事と同じ速さで誤りも重ねうる。だから特に使い始めの監督が大切だという。判断について、Golden氏は「補うことも、助けることもできるが、決して置き換えはしない」と述べ、AIは本当の意思決定がいらない繰り返しの作業に向くとする。決定は人に残る。データについては、情報の漏えいを最大の危険と位置づける。同社は機微な情報を扱うため慎重に取り組んでおり、漏えいは「解決するより多くの問題を生む」とする。製造業も同じように、企業秘密が懸かっている。導入前に、社内外の誰かがエージェントにできることと情報が漏れうる場所を点検し、そのうえで管理された環境で、意見を入れながら監督して試すよう勧める。\n【ポイント・注意点】\n記事は、監督は社員の考える力を守る意味もあると言い、AIに頼り切ることを、道を見ずにスマホの案内に従う運転にたとえる。大きな予算はいらないので小さく始めること、AIを拒むのはパソコンを拒むのに等しいことも述べる。数字や製品の情報はなく、CNCの加工現場に限らない一般論である点に注意したい。見積や段取りにAIを使い始める工房でも、同じ考え方が参考になる。","2026-11-24","James Moore & Co.","https://www.jmco.com/articles/manufacturing/why-agentic-ai-in-manufacturing-needs-the-same-oversight-as-a-new-hire/"],["独InMachines、オープンソースの卓上CNC「Piccola」を出資募集","CNX Softwareは2026年11月23日、ドイツのInMachines Ingrassiaが作るオープンソースの卓上フライス盤「Piccola CNC」を紹介した。基板の試作や木材、樹脂、柔らかい金属の加工向けで、作業範囲は150×150×70mm。基板の高さを測って凹凸を補正し、オープンソースのCAMを内蔵する。Kickstarterの早期価格は1,091ユーロからで、届くのは2027年7月の見込み。","\n【概要】\n組み込み機器の情報サイトCNX Softwareは2026年11月23日、ドイツのInMachines Ingrassia GmbHが開発したオープンソースの卓上CNCフライス盤「Piccola CNC」を紹介した。基板（PCB）の試作や、木材、樹脂、アルミや真鍮、銅などの柔らかい金属の加工を想定し、Kickstarterで出資を募っている。\n【背景】\n個人の工房では、3Dプリンターの次に削る道具を求める人がいる。Piccolaは設計図とソフトウェアを公開する予定のオープンソースのハードウェアで、最初の機械を出荷するときに、CERN-OHL-S-2.0、GPL-3.0、AGPL-3.0、CC BY-SA 4.0の各ライセンスで公開するとしている。\n【詳細】\n作業範囲は150×150×70mmで、3軸すべてにベルト駆動のボールねじ、ER11のコレットを使う。Basicは開放型の枠に100W・24V・20,000回転のブラシ付きスピンドル。Proは200W・48V・12,000回転のスピンドルに、ポリカーボネートの囲いとLED、扉の安全インターロックが付く。Ultimateはブラシレスの200Wスピンドルに、端や中心の検出、高さの地図づくり、3Dスキャンに使うレーザー距離センサーを加える。制御基板はRP2350を2個使い、片方がgrblHALで動きを、もう片方が主軸や安全監視、高さ補正、アプリとの通信を担う。接続はUSB-CとWi-Fiで、JSONのAPIもある。最高送り速度は毎分2,000mm、メーカーが示す繰り返し精度は5mmの早送りで10μm未満。CAMは既存のオープンソースのEasyTrace5000（基板用）とKiri:Moto（2D、3D、回転加工）を組み込み、基板の凹凸は高さの地図で補正する。\n【ポイント・注意点】\nKickstarterの早期価格はBasicが1,091ユーロ、Proが1,511ユーロ、Ultimateが1,679ユーロから（付加価値税と送料は別）。届くのは2027年7月の見込みで、出資型のため予定が遅れる可能性もある。CE適合は評価中とされる。記事にAI機能の記述はなく、自動化は高さ補正やCAMの内蔵によるものである。","2026-11-23","CNX Software","https://www.cnx-software.com/2026/11/23/piccola-cnc-open-source-desktop-milling-machine-with-pcb-auto-leveling-and-integrated-cam/"],["OneLaser、ブラックフライデーでCO2レーザー加工機を最大3000ドル引き","米OneLaserは、2026年11月23日更新のページで、ブラックフライデーのセールを案内した。期間はサイバーマンデーの11月30日午後11時59分（太平洋時間）まで。38W RF管の卓上機XRFは1,000ドル引き、Hydra 7 Pro 70Wは限定数で3,000ドル引きとなる。カメラによる位置合わせや自動焦点を持つ機種もある。値引きは自動で適用される。","\n【概要】\n米カリフォルニア州のレーザー加工機メーカーOneLaserは、自社サイトの2026年11月23日更新のページで、「OneLaser Black Friday 2026」のセールを案内した。全シリーズで最大3,000ドル引きをうたう。期間はサイバーマンデーの2026年11月30日午後11時59分（太平洋時間）まで。値引きはクーポンなしで会計時に自動で適用され、各特価は数に限りがある。\n【背景】\nCO2レーザー加工機は、木やアクリルの切断、刻印など、個人の工房や小規模な制作販売でよく使われる。年末商戦は、こうした比較的高価な機械を安く買える時期になる。米国では、年内に使い始めた設備に税控除（Section 179）が使える点にもページは触れている。\n【詳細】\n目玉の「Super Deals」は3つ。卓上機XRF（38WのRF金属管、作業範囲24×12インチ、最高速度1,200mm/s、加速度3G）は1,000ドル引きで送料無料。Hydra 7 Pro 70W RF（第2世代、2,000mm/s、4G、サーボモーター）は限定数で3,000ドル引き、その後は2,000ドル引き。Hydra 9 Dual（100Wガラス管と38W RF）は2,000ドル引き。ほかに、回転軸と自動焦点を内蔵したVertiGo 38W RFが1,000ドル引き。Cobra 8・10・14（90〜130WのCO2ガラス管、自動焦点、カメラによる位置合わせ、2系統のエアアシスト）は全サイズ2,000ドル引き。開始価格の目安は、XRFが4,499ドル、Cobraが3,999ドル、Hydraが7,999ドル、VertiGoが4,999ドル。\n【ポイント・注意点】\n送料無料はXRFとVertiGoだけで、CobraとHydraは貨物便の別料金。付属品と材料は値引きの対象外。30日の返品と保証、1対1の講習がある。なお、ページ上のカウントダウン表示は「イベント終了」となっており、記載の終了日と食い違っていた。ページにAIを使った加工機能の説明はない。価格は米国向けで、日本からの購入条件は別に確かめたい。","2026-11-23","OneLaser","https://www.1laser.com/blogs/topic/black-friday-laser-machine-on-sale"],["Anthropic「Claude for Manufacturing」、見積や設備診断を支援","Robotics & Automation Newsは2026年11月22日、Anthropicが製造業向けの「Claude for Manufacturing」を出したと報じた。見積、品質、保全、調達、設計などの17のスキルと、Autodesk Fusionなど4つのソフトへの接続を組み合わせる。人の確認と承認を前提に作られ、製造設備を直接は操作しない。発表は11月12日で、Claude TeamとEnterpriseのプラグインとして使える。","\n【概要】\n産業ロボットと自動化の情報サイトRobotics & Automation Newsは2026年11月22日、AnthropicがAIソフト「Claude for Manufacturing」を出したと報じた。記事によると発表は11月12日。見積書の準備、品質問題の調査、設備の故障診断、取引先の管理といった仕事を効率よく進めるためのものだという。\n【背景】\n記事は、製造業リーダーシップ協議会の2025年の調査を引き、79%の製造業者がデータを手で入力していると紹介する。紙や表計算に散らばった情報を集める手間が、見積や品質の仕事を重くしている。こうした事務と技術の仕事を、人の判断を残したままAIで速くすることが狙いだ。\n【詳細】\n製造業向けの17のスキルと、4つのソフトへの接続（コネクター）を組み合わせる。スキルは営業、品質管理、運用、サプライチェーン、設計、設備の段取りにわたる。コネクターはAutodesk Fusion、Infor、Microsoft 365、Oracle NetSuiteに対応する。Fusionでは設計の案をいくつも作り、要求と比べて推奨をまとめられる。NetSuiteからは在庫や製造原価、過去の受注を見積担当に渡せる。例として、見積担当が過去の案件の原価から見積を下書きさせる、品質技術者が過去の報告から是正処置を下書きさせる、保全技術者がセンサーデータや修理記録、写真、取扱説明書を渡して故障の原因候補を順位づけさせる、といった使い方が挙がる。Inforは別に、人が承認した後に代わりの発注を出したり生産計画を組み直したりできるプラグインを出した。\n【ポイント・注意点】\nAnthropicは、最終決定ではなく社員を支えるためのものだとしており、流れは人の確認と承認を軸に組まれる。数字を元の記録にひもづけられる一方、製造設備は直接操作しない。Claude TeamまたはEnterpriseのプラグインとして提供され、スキルは今後増やす予定。CNC機を直接動かす道具ではない点に注意したい。","2026-11-22","Robotics & Automation News","https://roboticsandautomationnews.com/2026/11/22/anthropic-launches-claude-for-manufacturing-to-automate-administrative-and-engineering-workflows/107487/"],["Fusionが4プラン制へ 全プランにAIを内蔵、2027年1月28日から","オートデスクの販売代理店Hagermanは2026年11月20日のブログで、設計・CAMソフト「Fusion」が「AIファースト」の基盤へ移り、2027年1月28日からStarter、Standard、Professional、Enterpriseの4プランで売られると解説した。AIの機能と利用枠はすべてのプランに含まれ、別売の拡張機能はなくなる。1月27日までに買うと自動でProfessionalに上がるという。","\n【概要】\nオートデスクのプラチナパートナーである米Hagerman & Companyは2026年11月20日、自社ブログで「Autodesk Fusionに新しいプランが来る。1月27日が大事な理由」と題する記事を公開した。Fusionを「AIファースト」の設計・製造の基盤へ変えていく動きの一部として、2027年1月28日から4つのプランで販売されると説明している。\n【背景】\nFusionは3D CADとCAM、基板設計をまとめたソフトで、個人のメイカーから小さな工房まで、CNC加工の工具経路づくりに広く使われている。これまでは多軸加工などの高度な機能を「拡張機能」として個別に買う必要があった。新しいプランでは、こうした拡張機能をなくして各プランに組み込む。\n【詳細】\nStarterは無料のままで変更なし。Standardは中核の3D CAD、CAM、PCB設計など基本の設計・製造の道具を含む。ProfessionalはStandardの全機能に、高度な設計、シミュレーション、製造、共同作業、データ管理を加える。EnterpriseはProfessionalの全機能に、高度な多軸加工、高度なシミュレーション、PLM（Fusion Manageを含む）を加える。AIはすべてのプランに含まれ、AIの作業の流れと利用枠は別に買うのではなく組み込まれる。価格は国によって違い、オートデスクは新プランの開始前に各国通貨の価格を公表する。記事の中心は期限の話で、2027年1月27日までにFusionを買った顧客は、1月28日に自動でProfessionalへ上がり、次の2回の更新まで価格が固定される。更新が2027年1月28日から2029年1月28日の間にあり、契約が切れていないことが条件で、途切れると固定は外れる。\n【ポイント・注意点】\n記事は、2027年初めにFusionの予算を組む組織、席を増やす組織、単体のCAMや古い道具から移る組織などに、今動くよう勧めている。販売代理店による案内記事であり、販売を促す立場から書かれている点は割り引いて読みたい。プランごとのAI利用枠の具体的な量は、この記事には示されていない。","2026-11-20","Hagerman & Company","https://blog.hagerman.com/autodesk-fusion-is-getting-new-plans.-heres-why-january-27-matters"],["Makera、600W主軸とカメラ位置検出の卓上CNC「A1S」を予約開始","Notebookcheckは2026年11月20日、中国Makeraの卓上CNCフライス盤「A1S」の予約受付を報じた。主軸は600W・最高24,000回転で、内蔵カメラが材料の位置を見つける。工具の自動交換のない標準機は2,599ドル、自動交換付きは3,499ドルから。精度は0.01mmとされ、アジアからの出荷は2027年1月に始まる予定。最小量潤滑も選べる。","\n【概要】\nドイツ発のIT情報サイトNotebookcheckは2026年11月20日、卓上CNCで知られる中国Makeraが新しいフライス盤「A1S」の予約受付を始めたと報じた。自動工具交換のない標準機は2,599ドルから、自動工具交換付きの「A1S-ATC」は3,499ドルから。記事は「DIY」の分類で掲載されている。\n【背景】\nMakeraはこれまで卓上CNC「Carvera」シリーズなどを出してきた。卓上機で金属を削るには、主軸の力と機械の剛性が要る。A1Sは主軸を強くし、材料の段取りをカメラで助けることで、個人や小さな工房でも金属部品を作りやすくする狙いがある。\n【詳細】\n主軸は600Wで、最高24,000回転。Makeraは、木材のような柔らかい材料に加え、より丈夫な部品のためのアルミや鋼も削れるとしている。工具の自動交換用のマガジンを外すと、作業範囲は30×15×13cmから30×20×13cmに広がる。重さは約40kg（88ポンド）。オプションで最小量潤滑（MQL）を付けられ、冷却液を循環させずに、少量の切削油で冷却と潤滑を行う。内蔵カメラは材料の位置を目で見て見つける。記事はこれを最近のレーザー加工機の機能にたとえ、材料の位置合わせや作業範囲の指定を手でする手間を省けるとしている。Makeraが示す精度は0.01mm。\n【ポイント・注意点】\nアジアからの出荷は2027年1月に始まる予定で、輸送には45〜70日かかる見込みとされる。予約から手元に届くまでには時間がかかる点に注意したい。記事はカメラによる位置検出を紹介しているが、「AI」という言葉では説明していない。価格や構成は地域によって違う可能性があり、購入前にMakeraの公式ページで確かめる必要がある。記事の情報源はMakeraと編集部の取材とされている。重さは約40kgあるため、置く台の強度も確かめておきたい。自動工具交換付きでは作業範囲が30×15×13cmに狭まる点も、機種を選ぶときの目安になる。実際の加工の出来ばえは、出荷後の利用者の報告を待って判断したい。","2026-11-20","Notebookcheck","https://www.notebookcheck.net/Makera-A1S-600-watt-CNC-mill-features-camera-based-workpiece-detection-optional-tool-changer.1455258.0.html"],["xTool、AIで素材を見分けるレーザー加工機「X1」を国内で先行販売","Makeblock Japanは2026年11月20日、xToolブランドの次世代レーザー加工機「xTool X1」の先行販売を11月19日からGREEN FUNDINGで始めたと発表した。55W CO2レーザーが標準で、最大5種類の光源に広げられる。専用ソフトはスキャンした素材をAIが見分け、11万件以上の公式設定から加工条件を提案する。CO2単体の7日間限定価格は528,000円。","\n【概要】\nMakeblock Japan株式会社は2026年11月20日、xToolブランドの次世代オールインワンレーザー加工機「xTool X1」の支援受付を、2026年11月19日（木）11時からクラウドファンディング「GREEN FUNDING」で始めたと発表した。7日間限定で最大21万円引きとしている。\n【背景】\n卓上のレーザー加工機は、木やアクリルの切断、金属への刻印などで、個人の制作や小さな販売事業に広く使われる。X1は、光源を後から足して1台で多くの加工に対応できる点を打ち出す。AIを使った材料の識別や加工条件の提案、AIの創作基盤との連携も特長に挙げる。\n【詳細】\n55WのCO2レーザーを標準で積み、20Wダイオードのガルバノモジュールを加えると、5W UV、60W MOPA、30Wファイバーへと広げられる（Laser Swap）。大型のガントリーと高速のガルバノを4軸で連動させる「Hybrid Motion」で、615×320mmの作業エリアで最大6,000mm/s（ガルバノ彫刻時）。3台のカメラと昇降台で素材の位置と高さを検知する。ソフトのxTool Studioは、スキャンした素材をAIが見分け、「EasySet」が11万件以上の公式設定から加工条件を提案する。AI創作の基盤「Atomm」には130種類以上の生成ツールと6万点以上の作品があり、写真からガラスの内部彫刻用の3Dモデルを作る機能もある。筐体はクラス1のレーザー安全基準に合う密閉型で、12個のセンサーが見張り、炎を検知すると止まる。\n【ポイント・注意点】\n7日間限定の支援価格は、CO2単体が528,000円（一般販売予定628,000円）、CO2とダイオードガルバノの組み合わせが598,000円など。限定価格は11月26日10時59分まで、募集は2027年1月10日まで。先着50件は2026年12月中に発送予定。クラウドファンディングのため、発送の時期が変わる可能性がある。消火のセットは別売で、CO2の消火ボンベは付かない。","2026-11-20","PR TIMES（Makeblock Japan）","https://prtimes.jp/main/html/rd/p/000000049.000135536.html"],["LONGER、ブラックフライデーでレーザー彫刻機やUVプリンターを値引き","Digital Journalに2026年11月19日、卓上製造機器のLONGERがブラックフライデーのセールを行うとの記事（広告記事）が載った。期間は11月3日から12月2日まで（米東部時間）で、対象品は最大48%引き。卓上UVプリンター「ePrint」はAI付きソフト「LONGERStudio」で画像の編集や背景の除去ができる。レーザー彫刻機Ray5の5Wは151.99ドルになる。","\n【概要】\n米ニュースサイトDigital Journalに2026年11月19日、卓上製造機器メーカーLONGERのブラックフライデーのセールを伝える記事が載った。記事は「スポンサー記事（広告）」と表示されている。期間は2026年11月3日から12月2日まで（米東部時間）で世界が対象。選んだ製品が最大48%引きになり、注文金額に応じたクーポンも使える。\n【背景】\nLONGERは、デジタルの創作と実際のものづくりをつなぐ会社だと自らを説明し、メイカーや小規模な商用生産を主な客とする。レーザー彫刻機、3Dプリンター、UVプリンターをそろえ、年末商戦で一度に売り込んでいる。\n【詳細】\n目玉の卓上UVプリンター「ePrint」は、エプソンF1080のプリントヘッドを2つと12のインクの経路を持つ。白インク、カラーインク、ニスに対応し、最大15mmの盛り上がりを持つフルカラーの立体印刷や、最大10mmの段差がある面への印刷ができる。300種類以上の素材に使え、インクは自由に選べる。AI付きのソフト「LONGERStudio」で、画像の編集、背景の除去、配置を行える。レーザー彫刻機は、DIY向けのRay5、高出力のB1、持ち運べるNano、密閉型でクラス1のRay7Sが並ぶ。価格表では、ePrintのUV単体が2,499ドルからクーポン後1,766.07ドル、Ray5の5Wが259.99ドルから151.99ドル、Ray5の40Wが999.99ドルから610.99ドル、Ray7sの40Wが1,129.99ドルから798.99ドル、3DプリンターLK5 Proが389.99ドルから265.99ドルとなる。\n【ポイント・注意点】\n追加のクーポンや贈り物、時間限定の特価もあるが、条件は製品ごとに違う。記事は広告であり、性能の説明はメーカーの主張である点に注意したい。AIは主に画像の下ごしらえに使うもので、加工条件を自動で決める機能としての説明はない。価格は米ドル建てで、日本での販売価格や条件は別に確かめる必要がある。","2026-11-19","Digital Journal","https://www.digitaljournal.com/article/longer-announces-black-friday-2026-sale-featuring-laser-engravers-3d-printers-and-eprint-uv-technology/"],["工作機械受注、AI特需で過去最高へ 部品供給が追いつかず","日経ビジネスは2026年11月19日、2027年の機械業界の予測として、工作機械の受注がAIや半導体向けの需要で過去最高の水準になる見通しを伝えた。日本工作機械工業会の統計では、9月の受注は2232億円で1988年の統計開始以来の最高額。上期の累計は初めて1兆円を超えた。一方で部品不足や納期の遅れへの対応が急務だとしている。年間2兆円の大台も視野に入るという。","\n【概要】\n日経ビジネス電子版は2026年11月19日、連載「徹底予測2027」の機械編として「工作機械、AI特需で受注が過去最高へ　部品供給追いつかず」を掲載した。2026年は工作機械業界の好調が際立った年で、2027年もAIや半導体向けの需要が受注を押し上げるとみている。\n【背景】\n日本工作機械工業会（日工会）の坂元繁友会長（芝浦機械社長）は、2026年10月の記者会見で、2027年の見通しについて「悲観的な考えは持っていない」と語ったという。AIのデータセンターや半導体の製造装置に使う部品の加工需要が、工作機械の受注を支えている。CNC加工の現場にとっても、AIは加工の道具であると同時に、大きな需要の源になっている。\n【詳細】\n記事は「2027年はこうなる」として3点を挙げる。1つ目は、AIと半導体向けの需要が広がり、工作機械の受注が過去最高の水準になること。2つ目は、旺盛な需要の一方で、部品の不足や納期の遅れのリスクへの対応が急がれること。3つ目は、AI関連投資が一服する可能性も見すえ、供給の体制を強められるかが競争力を左右すること。日工会の統計では、工作機械の単月の受注総額は3月から7か月続けて1700億円を超えた。9月は2232億円で、1988年に統計を取り始めてから最も多い。上期の累計の受注総額は初めて1兆円を超え、年間2兆円の大台が見えてきたとしている。\n【ポイント・注意点】\n記事は有料会員向けで、取得できたのは冒頭部分だけである。個別の企業の動きや詳しい分析は、ここでは確かめられていない。受注が過去最高でも部品の供給が追いつかなければ、機械の納期が延びるおそれがある。工作機械を新しく入れる予定の工房や企業は、納期の見通しを早めに確かめておきたい。AIを使った機能や製品についての記述は、読めた範囲にはない。AI関連の投資が落ち着いたときに受注がどう動くかは、記事自身も先の課題として挙げている。数字は日工会の統計にもとづくもので、2027年の見通しはあくまで予測である。","2026-11-19","日経ビジネス電子版","https://business.nikkei.com/atcl/gen/19/00951/111600006/"]],"cricut":[["ビニールでクリスマスのオーナメントを名入れする方法（Silhouette）","Silhouette America公式ブログが11月25日、無地のオーナメントに粘着ビニールで名前や日付、モノグラムを入れる手順を公開した。素材選びからデザインの大きさ、カット、転写、仕上げまでを順に解説している。平らな3インチの円盤なら幅2〜2.5インチ程度、丸い玉なら1.5〜2インチ程度が目安とし、曲面ではデザインを小さくする、貼る前にアルコールで拭くなど、失敗を防ぐコツもまとめている。","\n【概要】Silhouette America公式ブログは2026年11月25日、「Maker Monday」の企画として、ビニールでクリスマスオーナメントを名入れする方法を公開した。名前や日付、モノグラム、ペットのシルエット、冬の小さなアイコンなどを無地のオーナメントに貼り、家族のツリーや先生への贈り物、記念品にする使い方を提案している。\n【背景】年末はオーナメントの名入れが手作りギフトの定番になる。カッティングマシンとビニールがあれば、一つずつ違う名前を入れられる。記事は初めての人でも失敗しにくいよう、素材の選び方から細かく説明している。\n【詳細】必要なものはSilhouetteのカッティングマシンとSilhouette Studio、粘着ビニール（毎年しまって使う物にはパーマネントを推奨）、転写シート、ウィーディングツール、スクレーパー、小さなはさみ。土台はアクリルの円盤、ガラスやプラスチックの玉、陶器、木の輪切り、平らなタグなど表面がなめらかな物で、糸くずの出ない布と消毒用アルコール、柔らかいメジャー、リボンや箱も挙げる。最初は平らなアクリル・陶器・木がよく、ラメの多い物や凹凸、毛羽立った表面は避ける。大きさの目安は平らな3インチの円盤で幅約2〜2.5インチ、丸い玉で約1.5〜2インチ。カットはビニールを台紙側を下にして置き、Studioで正しい素材設定を選んでテストカットをする。ビニールだけが切れ、台紙に深い傷が付かない状態が理想だ。カス取りは外側から中心へ進め、小さな文字は先に転写シートを貼ってから持ち上げる「リバースウィーディング」を使う。貼る前に土台をアルコールで拭いて乾かし、平面では一辺をテープで留めてめくる「ヒンジ法」、曲面では中心から外へ少しずつ押さえ、転写シートに切り込みを入れて曲げやすくする。\n【ポイント・注意点】小さな文字が浮くときは太い書体にする、よくこする、ゆっくりはがす、リバースウィーディングを使う。丸い玉でしわが寄るならデザインを縮める。台紙に深い傷が付く場合は刃の出しすぎか圧力の強すぎなので、下げて再テストする。セットで作るときは一番長い名前で試すこと。仕上げにリボンやタグを添え、平らに、またはクッション材に包んで保管するよう注意書きを付けるとよいとしている。","2026-11-25","Silhouette America Blog","https://www.silhouetteamerica.com/blog/post/personalize-christmas-ornaments-with-vinyl"],["xTool C1でラミネート済みシールを切る設定、ハーフカットと全カット","Silhouette Schoolブログが11月25日、プリントとカットを1台で行うxTool C1で、ラミネートしたシールを切るときの設定を紹介した。ラミネートで層が3枚になるため、xTool Studio既定の圧力220では切り抜けない。筆者はラミネート付きのハーフカットを220、台紙まで切る全カットを380で成功させた。ラミネートなしなら約50と220を使うという。設定の変え方と作業上の注意もまとめている。","\n【概要】Silhouetteの使い方解説で知られるSilhouette Schoolブログは2026年11月25日、xTool C1でラミネートしたシールをハーフカット（キスカット）と全カット（ダイカット）するときの設定を公開した。xTool C1はプリントとカットを1台でこなす機械で、記事はSilhouetteやCricut以外の機種を扱っている。\n【背景】シールの表面に透明シートを重ねると、水や擦れに強くなり、つやも出る。ただし層が増えるぶん、刃に必要な力も変わる。筆者は、ラミネートで「3枚目の層」が加わるため、xTool Studioの既定の圧力220では切り抜けないと説明する。\n【詳細】使った材料はOnline Labelsの光沢・防水シール用紙（ol177）と、ラミネートとして使う同社の透明シート（ol177ck）。うまくいった設定は、ラミネート付きのハーフカットが圧力220で、ラミネートとシール用紙を切り、台紙は残す。全カットは圧力380で、3層すべてを切り抜く。ラミネートなしのシール用紙では、ハーフカットに約50、全カットに220を使っているという。設定の場所は、「Make」を押して素材を選び（筆者は光沢系の素材を選択）、調整アイコンを押すと表示される「Standard Reference」で圧力を変える。\n【ポイント・注意点】xTool Studioには「カットのみ」の選択肢がなく、プリント＆カットの作業を組んだあとに一時停止もできないと記事は指摘する。そのため「印刷→ラミネート→カット」の順で進めるには工夫が必要で、その回避方法はリンク先の動画で示している。また、素材を変えるときは必ず試し切りをするよう勧めている。紹介された数値はこの用紙と透明シートの組み合わせでの結果なので、別の材料ではそのまま当てはまらない可能性がある。ハーフカットで台紙まで切れてしまう場合や、全カットで切り残しが出る場合は、圧力を少しずつ変えて確かめるのが安全だ。シールを販売用や配布用にまとめて作る人にとって、最初の試し切りの手間を減らす目安になる。プリント＆カット機はシール作りの用途で選択肢が増えており、機種ごとの設定の違いを知っておくと材料の無駄を減らせる。","2026-11-25","Silhouette School","https://www.silhouetteschoolblog.com/2026/11/best-cut-settings-for-laminated.html"],["ロリ・ウィットロックの11月ブログホップ、新作3セットと半額セール","SVG作家ロリ・ウィットロックの公式ブログが11月24日、クリエイティブチームの11月ブログホップを公開した。同日に新しいバンドル3つを発表し、11月24日から28日までショップのデジタルファイルを、新作やバンドル、商用ライセンスも含めて50%引きにする。コードはNOV2026で大文字小文字を区別する。当日限りで秋のカボチャ型ボックスカードのSVGを無料で配り、プレゼント企画もある。","\n【概要】ペーパークラフト用のSVGファイルを手がけるロリ・ウィットロックの公式ブログは2026年11月24日、クリエイティブチームによる11月のブログホップと、ブラックフライデーの半額セールを告知した。新作として3つのバンドルを同じ日に公開している。\n【背景】ブログホップは、作家とデザインチームのメンバーが同じ日に作品を投稿し、ブログを順番にたどってもらう企画だ。今回の参加者はロリ・ウィットロック、キャシー・ハーパー、スー・ケメント、ホリー・ジョー・テイラー、リンジー・ウォール、レスリー・ターナーの6人。メンバーはそれぞれのブログでロリのファイルを使った作品を見せている。\n【詳細】セールは11月24日から28日まで。ロリのSVGショップのデジタルファイルがすべて50%引きになり、新作、バンドル、商用ライセンスも対象になる。コードはNOV2026で、大文字と小文字を区別する。さらに当日限りの無料ファイルとして「Fall Pumpkin Box Card（秋のカボチャのボックスカード）」のSVGを、コードなしでカートに入れられる。新作は3つ。1つ目は「3Dスノーグローブ・ボックスカード」のクリスマスバンドルで、大きなリボンと土台の箱がそろった6種類。サンタとトナカイ、ジンジャーブレッドの家、クリスマスツリー、雪だるまなどが入る。2つ目は「イーゼルカード・ランタン」のバンドルで、イーゼル型のカード6種。サンタ、肉球のオーナメント、キリスト降誕、松ぼっくりなどがある。3つ目は「ホリデー・シャドーボックスカード」のバンドルで、サンタ、雪だるま、トナカイ、クリスマスツリーなど6種。投稿にはプレゼント企画の応募フォームもある。\n【ポイント・注意点】記事には使う機種や材料、ファイルごとの価格は書かれていない。半額コードは大文字と小文字を区別するため、入力の間違いに注意したい。無料のカボチャのボックスカードは当日限りとされている。サイドバーにはSilhouette製品5%引きの案内もあるが、これはサイト全体の告知で、今回のセールとは別だ。チームメンバーのブログでは、ファイルを実際に組み立てた作例を見られるので、購入前の参考になる。","2026-11-24","Lori Whitlock","https://loriwhitlock.com/november-2026-creative-team-blog-hop-black-friday-50-off-sale/"],["3階建てジンジャーブレッドのドールハウスを紙で、Cricutで切り出し","ペーパークラフト作家レスリー・ターナーのブログが11月24日、ロリ・ウィットロックの「3階建てジンジャーブレッド・ドールハウス」のSVGで作った作品を公開した。Cricut Explore Air 2で切り、本人いわく「無数の部品」を一つもなくさずに組み立てた。複数メーカーのカードストックを使い分け、3mmのフォームを2枚重ねて人形を浮かせるなど、立体感を出す工夫も紹介している。","\n【概要】ペーパークラフト作家レスリー・ターナーのブログ「Love to Scrap」は2026年11月24日、ロリ・ウィットロックのクリエイティブチームによる11月ブログホップの一環として、紙のジンジャーブレッドのドールハウスを公開した。使ったのは「3 Story Gingerbread Dollhouse SVG Cut File」というカットファイルだ。\n【背景】ロリ・ウィットロックはカードや立体作品のSVGを販売する作家で、チームのメンバーが同じ日に作品を投稿するブログホップを毎月開いている。\n【詳細】筆者はCricut Explore Air 2で全部の部品を切った。部品は「無数（a gazillion pieces）」あったが、一つもなくさなかったという。カードストックはCutCardStockのVanilla Bean Brown、Scottish Highlands Green、Beetle Black、Wedding Cake、12x12 Cardstock ShopのEncore Textured（Cactus、Hot Chocolate、Hazelnut）、ColorbokのNeutral Smooth（Tan）、DCWVの両面テクスチャー（RedとPink）を使い分けている。道具はStampin' Up!の3/4インチの円形パンチ、Bearly Artの精密クラフト用のり、Scrapbook Adhesivesのフォームスクエア（白、3mm）。組み立てでは、「パパ」の人形を3mmのフォームを2枚重ねて家の正面に付けた。「ママ」は、3/4インチのパンチで抜いた円を半分に折り、壁の内側に貼って裏側に取り付けている。投稿ではロリのショップで当日限り無料の「Fall Pumpkin Box Card」のファイルも紹介している。\n【ポイント・注意点】部品の多い立体作品では、切った部品をなくさない管理が完成の鍵になる。色ごとに複数のメーカーのカードストックを組み合わせると、質感の違いでお菓子の家らしさが出る。人形を浮かせるのにフォームを重ねる、折った円を蝶番のように使うといった小技は、ほかの立体作品にも応用できる。記事にはカットの設定値は書かれていないため、厚めの紙を使う場合は試し切りで確かめたい。","2026-11-24","Love to Scrap","https://lovetoscrap2.com/2026/11/24/lori-whitlock-creative-team-november-2026-blog-hop/"],["開くと子犬が飛び出す、犬小屋のポップアップカード","ペーパークラフト作家キャシー・ハーパーのブログが11月24日、ロリ・ウィットロックの11月ブログホップに合わせ、犬好き向けのクリスマスカードを公開した。使ったのはロリのショップのカットファイル「Pop-up Dog House Card」で、カードを開くと小さな子犬が飛び出す。紙はロリの新コレクション「Here Comes Santa Paws」（Echo Park）を使い、チップボードや立体シール、タグなどで飾っている。","\n【概要】ペーパークラフト作家キャシー・ハーパーのブログ「Altered Playground」は2026年11月24日、ロリ・ウィットロックのクリエイティブチームによる11月のブログホップの作品として、犬好きの人に贈るポップアップ式のクリスマスカードを公開した。ロリのショップで扱うカットファイル「Pop-up Dog House Card（犬小屋のポップアップカード）」を使った作品だ。\n【背景】ロリ・ウィットロックはカードや立体作品のSVGファイルを販売する作家で、デザインチームのメンバーが同じ日に作品を投稿し、ブログを順にたどってもらうブログホップを毎月開いている。11月のホップは、ショップのブラックフライデーのセール開始と同じ日に行われた。年末はクリスマスカードを作る人が多く、開いたときに驚きのあるポップアップカードは手作りの人気の題材だ。\n【詳細】キャシーは、ロリの新しい紙のコレクション「Here Comes Santa Paws」（Echo Park）を使ったと書いている。サンタと犬を題材にしたコレクションで、犬小屋のカードと題材がそろう。カードを開くと、犬小屋から小さな子犬が飛び出す仕掛けになっている。飾りに使った材料として、柄入りの紙、チップボード、エナメルドット、ぷっくりした立体シール、タグ、エフェメラ（紙の小物）を挙げている。投稿の残りは作品の写真とブログホップの参加者一覧で、カットファイルの販売ページへのリンクも添えられている。\n【ポイント・注意点】投稿には、使ったカッティングマシンの機種、カットの手順、寸法、設定値は書かれていない。作ってみたい人は、ファイルの販売ページで組み立て方の情報をあわせて確認するとよい。ポップアップの部分は紙の厚さで開き具合が変わることがあるため、本番の紙で一度試作するのが無難だ。同じ日にはロリのショップで半額セールも始まっており、ファイルを手に入れる機会としても注目される。犬を飼っている家族や友人へのカードとして、題材の合った紙と仕掛けを組み合わせる例として参考になる。","2026-11-24","Altered Playground","https://alteredplayground.blogspot.com/2026/11/november-creative-hop.html"],["パンプキンパイの花を飾るA2ボックスカード","スクラップブッキング作家リンジー・ウォールのブログが11月24日、ロリ・ウィットロックの11月ブログホップの作品として、A2サイズのボックスカード「Pumpkin Pie Flowers」を公開した。SVG版はロリのショップ、Silhouette用はSilhouette Design Storeで扱う。紙はDoodlebug Designの「Farmhouse」コレクションを使い、仕上げにメッセージのシールを貼った。プレゼント企画の案内も載せている。","\n【概要】スクラップブッキング作家リンジー・ウォールのブログは2026年11月24日、ロリ・ウィットロックのクリエイティブチームによる11月のブログホップに合わせて、A2サイズのボックスカード「Pumpkin Pie Flowers（パンプキンパイの花）」を公開した。\n【背景】ボックスカードは、開くと箱のように立ち上がり、中に花や小物を飾れる立体カードで、カッティングマシン用のカットファイルとしてよく作られている。ロリ・ウィットロックはこうした立体カードのSVGを数多く販売しており、毎月チームのメンバーが同じ日に作品を投稿するブログホップを開いている。11月のホップは、ショップの半額セールの開始日と重なった。\n【詳細】使ったカットファイルはロリの「A2 Box Card Pumpkin Pie Flowers」。SVG版はロリのショップ（shop.loriwhitlock.com）で、Silhouette用のファイルはSilhouette Design Storeで販売されており、投稿には両方へのリンクがある。カードの紙には、Doodlebug Designの「Farmhouse」コレクションを使った。リンジーは、メッセージのシールが仕上げのひと押しになったと書いている。投稿ではクーポンコードにも触れ、プレゼント企画の応募先も案内している。パンプキンパイと花を組み合わせた題材は、秋らしい色合いのカードになる。\n【ポイント・注意点】投稿は短く、使ったカッティングマシンの機種や手順、寸法、設定値は書かれていない。作る場合は、販売ページの説明やファイルに付く情報で組み立て方を確かめたい。同じファイルがSVG版とSilhouette用の2種類で売られているので、自分の機種とソフトに合う方を選ぶ必要がある。農家風の紙のコレクションと秋のパンプキンパイの題材の組み合わせは、感謝祭の時期のカードとして使いやすい。ボックスカードは立体になるぶん郵送では形がつぶれないよう工夫が要るため、手渡しのカードに向く。ホップのほかの参加者のブログでは、同じ日に公開された別のファイルの作例も見られるので、あわせて見比べるとファイル選びの参考になる。","2026-11-24","Lindsay's Layouts","https://lindsayslayoutsbusiness.blogspot.com/2026/11/november-blog-hop.html"],["どのクリカットを選ぶか、2026年版の機種比較ガイド","クラフトブログ「The Country Chic Cottage」のアンジー・ホールデンが11月23日、クリカットの機種選びの2026年版ガイドを公開した。今は14の選択肢があるとし、Joy、Joy 2、Joy Xtra、Explore 5、Maker 5、Venture、StickerPixまでを比べる。マット上の最大カット幅や使える刃と道具、プリント・ゼン・カットの可否など、違いを機種ごとに整理している。","\n【概要】クラフトブログ「The Country Chic Cottage」は2026年11月23日、筆者アンジー・ホールデンによるクリカット機種選びの2026年版を公開した。冒頭で「今は14の選択肢がある」と書き、シリーズごとに特徴と違いを説明している。\n【背景】クリカットはJoy、Explore、Maker、Venture、StickerPixと系列が増え、同じ系列でも世代で使える道具が違う。年末商戦に合わせた更新だ。\n【詳細】最小のJoyは細刃のみで、プリント・ゼン・カットに対応しない。マットでの最大カット幅は4.5インチ、Smart素材なら最長12フィートまで切れる。Joy 2はプリント・ゼン・カット、スコアリングツール、ユニバーサルペンに対応し、8.5×11インチの紙1枚に2回印刷して無駄を減らす方法を勧める。Joy Xtraもプリント・ゼン・カットができ、Smart素材は長さ6インチから20フィート、幅は最大8.5インチ、マット上は最大8.25×11.75インチ。筆者の今のお気に入りだという。Explore 5は最新のExploreで、開閉式のふたがなく「Load and Go」方式で、ロード・アンロードのボタンもない。旧型のスコアリングスタイラスは入らず、古いペンも使えない。Explore Air 2はカートリッジの差し込み口がある最後の機種で、プリント・ゼン・カットのセンサーは白い紙でしか働かない。Explore 3以降は色紙でもできる。Makerシリーズは初代、3、4、5があり（2はない）、切る力が強く、ロータリーブレード、ナイフブレード、スコアリングホイール、彫刻チップなどを使えるアダプティブ・ツール・システムを備える。Maker 5は厚さ3mmまでの素材を切れる。最大のVentureはPerformance Fine Pointの刃を使い、別売のスタンドを勧めている。StickerPixは昇華型のプリンターで、刃の付いたStickerPix + Cutもある。\n【ポイント・注意点】筆者の勧めは、手軽に始めるならJoy、幅広い素材を扱うならMaker、薄い素材を大きく、または繰り返し切るならVenture。Explore 5では旧型のペンやスタイラスが使えないため、手持ちの道具を生かしたい人は注意が必要だ。ページに価格は載っていない。","2026-11-23","The Country Chic Cottage","https://www.thecountrychiccottage.net/which-cricut-machine/"],["自動ヒートプレス3機種比較、Cricut・HTVRont・xTool","クラフトブログ「The Country Chic Cottage」が11月23日、自動で開閉するヒートプレス3機種を比べた記事を公開した。HTVRont Auto Press 2、Cricut Autopress 2、xTool WonderPressで、いずれも15×15インチの熱板と最高410°F。圧力やタイマー、開口幅、価格の違いを並べ、昇華、DTF、パフHTVで試した結果を紹介する。パフHTVにはCricutを推している。","\n【概要】クラフトブログ「The Country Chic Cottage」は2026年11月23日、アンジー・ホールデンによる自動ヒートプレス3機種の比較を公開した。対象はHTVRont Auto Press 2、Cricut Autopress 2、xTool WonderPressで、カッティングマシンで切ったHTV（アイロン転写シート）や昇華転写の仕上げに使う機械だ。\n【背景】Tシャツやバッグをまとめて作るなら、手で押すプレスより圧力と温度が安定した据え置きの自動プレスが便利だ。カッティングマシンのメーカーも参入し、選択肢が増えている。\n【詳細】3機種とも熱板は15×15インチ、最高温度は410°F。最大圧力はCricutとxToolが220ポンド、HTVRontが170ポンド。タイマーの最大はHTVRontとxToolが999秒、Cricutが360秒。開口幅はCricutが1.8インチ、HTVRontが1.77インチ、xToolが3.0インチ。記載の小売価格はCricutが379ドル、HTVRontが349ドル、xTool（本体のみ）が399ドル。昇華は3機種とも鮮やかに仕上がり、設定は385°Fで50秒、圧力はCricutが125ポンド、xToolが80kg、HTVRontは70ポンドで55秒だった。キャンバス地のバッグへのDTFも3機種とも問題なく、Cricutは310°Fで15秒・200ポンドでプレス用クッションを使用。xToolは320°Fで10秒で、3インチの開口がかさばるトートに対応した。HTVRontは325°Fで15秒・170ポンドでファスナー付きポーチに押した。パフHTVでは、Cricutが2段階のプレスでなめらかで均一に膨らんだのに対し、xToolはややざらつき、HTVRontはしわが出たという。\n【ポイント・注意点】結論は、HTVRontが最も安いが圧力が最も低い、Cricutは強い圧力で最も良い結果、xToolはかさばる物に向き拡張機能がある。Cricutはタイマーが短く、長い時間が要る石板（スレート）では再スタートが必要だ。xToolのオーブンや3D真空モジュールは別売で、費用と置き場所、習得の手間が増える点に注意したい。","2026-11-23","The Country Chic Cottage","https://www.thecountrychiccottage.net/autopress-comparison/"],["Silhouette CAMEO 5 Alphaの初期設定、Studio V5が必須","Silhouette Schoolブログが11月23日、CAMEO 5 Alphaの初期設定とソフト・ファームウェア更新の手順を公開した。この機種はSilhouette Studio V4では動かず、V5が必要で、V5はV4と「95%ほど同じ」だという。箱の中身、電源とBluetoothの接続、無料版Studioの入手、送信パネルでの機種選択、5〜10分かかるファームウェア更新の注意を順に説明している。","\n【概要】Silhouetteの使い方を解説するSilhouette Schoolブログは2026年11月23日、Silhouette CAMEO 5 Alphaを買ったあとの初期設定と、ソフトとファームウェアの更新手順をまとめた記事を公開した。要点は、この機種がSilhouette Studio V4では動かず、V5が必要なことだ。\n【背景】CAMEO 5 AlphaはSilhouetteのカッティングマシンの新しい機種で、年末に新しく手に入れる人も多い時期だ。従来機からの買い替えでは、使い慣れたV4のままでは使えない点がつまずきやすい。筆者はV5について、V4と「95%ほど同じ」と説明し、移行の不安を和らげている。\n【詳細】箱には本体、AutoBlade、スケッチペン用アダプター、AutoBlade用の工具、12インチのカッティングマット、2つに分かれた電源コードが入っている。USBケーブルは付属しないが、Bluetoothで接続できる。手順は、電源コードを本体の右側につなぎ、タッチスクリーンが点灯するまで電源ボタンを長押しし、Bluetoothのアイコンが青く点灯したままになるのを確認する。次にsilhouetteamerica.comのSoftwareから「Shop Now」へ進み、無料のSilhouette Studio基本版をダウンロードする。Studioの送信パネルでスターターモードを切り、機種のプルダウンからCAMEO 5 Alphaを選ぶ。ファームウェアの更新を求められた場合は5〜10分ほどかかり、その間は電源を切らないよう注意している。準備ができると、送信パネルに「Load Media」と表示される。記事には、2025年12月付けのCAMEO 5aの不具合に関する注意記事へのリンクもある。\n【ポイント・注意点】USBケーブルが付かないため、Bluetoothでの接続を前提に準備したい。V4を使い続けている人は、先にV5を入れておく必要がある。ファームウェアの更新中は電源を切らないよう記事は求めているので、時間に余裕のあるときに行うとよい。最初の接続でつまずいたら、Bluetoothのアイコンの状態と、送信パネルで正しい機種が選ばれているかを確かめるのが近道だ。","2026-11-23","Silhouette School","https://www.silhouetteschoolblog.com/2026/11/silhouette-cameo-5-alpha-software-and.html"],["紙で作る3Dのパイ、感謝祭に向けた小箱のカットファイル","SVG作家ロリ・ウィットロックの公式ブログが11月23日、感謝祭を前に紙で作るパイの作品を紹介した。イチゴの格子パイは「8切れのパイと箱」のファイルから1切れを使い、チェリーパイとパンプキンパイはそれぞれ専用の3Dファイルで作った。小箱に透明なアセテートの窓を付ければ、お菓子を入れる入れ物にもなると提案している。CricutとSilhouetteのタグが付いている。","\n【概要】ペーパークラフト用のSVGファイルを手がけるロリ・ウィットロックの公式ブログは2026年11月23日、「Easy as Pie」と題して、紙で作るパイの作品を紹介した。アメリカでは今週木曜日が感謝祭だとして、季節の食卓や手土産に合う立体作品を見せている。\n【背景】感謝祭ではパイが定番のデザートで、紙で作るパイ形の小箱はテーブルの飾りや小さな贈り物に使える。ロリのショップは、こうした立体の小物や箱のSVGファイルを多くそろえている。投稿のタグにはCricut、Silhouette、ダイカット、3D作品、SVGカットファイルが並ぶ。\n【詳細】紹介しているのは3種類のパイ。イチゴの格子模様のパイは、「8 slice pie with box（8切れのパイと箱）」というファイルの1切れ分を使い、紙はロリ自身がデザインしたEcho Parkの「Strawberry Fields」コレクションを使った。チェリーパイは「3D Cherry Pie Slice」、パンプキンパイは「3D Pumpkin Pie」というファイルで作っており、パンプキンパイの上のホイップクリームのハートを「とてもかわいい」と書いている。さらに、小さな箱にアセテート（透明なフィルム）で窓を付け、中にお菓子を入れる使い方を提案している。窓があれば、中身を見せながら贈れる。\n【ポイント・注意点】短い投稿で、使ったマシンの機種やカット設定、価格、ファイルの数は書かれていない。作る場合は、各ファイルの販売ページで組み立て方を確かめたい。食べ物の柄の紙を使うと本物らしさが出るので、同じコレクションでそろえるのも一案だ。なお、翌24日の投稿では、ショップのデジタルファイルを11月28日まで半額にするセールが告知されている。感謝祭の食卓に並べる飾りや、集まった人への小さなお土産として、パイの小箱は人数分を作りやすい題材だ。1切れずつ作れるファイルなら、好みの味を選んで組み合わせることもできる。季節の行事に合わせて作れば、食卓の話題にもなりそうだ。","2026-11-23","Lori Whitlock","https://loriwhitlock.com/easy-as-pie/"],["平たく畳んで郵送できるクリスマスのシャドーボックスカード","ペーパークラフト作家スー・ケメントのブログが11月23日、ロリ・ウィットロックの11月ブログホップの作品として、平らに畳んで郵送できるクリスマスのシャドーボックスカードを公開した。使ったのは「Santa's Workshop」と「Christmas Toy Shoppe」の2つのファイルで、Silhouette Design Storeでも扱う。切る部品が多いと書き、まとめたバンドルとプレゼント企画も案内している。","\n【概要】ペーパークラフト作家スー・ケメントのブログは2026年11月23日、ロリ・ウィットロックのクリエイティブチームによる11月ブログホップの作品として、クリスマスのシャドーボックスカード2枚を公開した。どちらも平らに畳んで郵送できるのが特徴だ。\n【背景】シャドーボックスカードは、何枚もの層を重ねて奥行きを出す立体のカードで、カッティングマシンで細かい部品を切り出して作る。立体カードは郵送しにくいのが悩みだが、畳める構造なら送りやすい。ロリ・ウィットロックはこうした立体カードのSVGを多く販売し、毎月チームの作品をブログホップで紹介している。\n【詳細】使ったファイルは「Shadow Box Card Santa's Workshop（サンタの工房）」と「Shadow Box Card Christmas Toy Shoppe（クリスマスのおもちゃ屋）」の2つ。いずれもロリのショップのほか、Silhouette Design Storeでも扱っており、投稿には両方へのリンクがある。スーは、これらのカードには「切る部品がたくさんある」と書いている。2つを含むクリスマスのシャドーボックスカードのバンドルへのリンクも載せている。投稿の残りは作品の写真、ホップの順番、プレゼント企画の案内だ。投稿のラベルには「Silhouette」が付いている。\n【ポイント・注意点】本文には使ったマシンの機種、材料、寸法、設定値は書かれていない。部品が多いファイルなので、切ったあとに層ごとに分けて並べておくと組み立てで迷いにくい。SVG版とSilhouette用の両方があるため、自分の機種に合う形式を選ぶことが大切だ。ブログホップに合わせてロリのショップでは11月28日までの半額セールが始まっており、バンドルでまとめて手に入れる選択肢もある。郵送できる立体カードは、遠方の家族や友人に送るクリスマスカードとして使いやすい。サンタの工房とおもちゃ屋という題材は子どもにも喜ばれやすく、同じ形式で絵柄違いを作れば、送り先ごとに選べるセットにもなる。","2026-11-23","Sue's Stamping Stuff","https://suesstampingstuff.blogspot.com/2026/11/lori-whitlock-november-blog-hop.html"],["クリカット公式のブラックフライデー先行セール、11月28日まで","節約情報ブログのリディア・ワッツが11月22日、クリカット公式サイトのブラックフライデー先行セールをまとめた。11月28日まで材料とアクセサリーが最大50%引きで、Maker 4が349ドル、Joy Xtraが129ドル、Explore 5 Essentialが199ドルなど。ヒートプレスやStickerPix、BrightPadの価格も並べ、月9.99ドルのCricut Accessの会員向け割引にも触れている。","\n【概要】リディア・ワッツのブログは2026年11月22日、「Cricut: Black Friday Early Access」と題し、クリカット公式サイトで始まったブラックフライデーのセールをまとめた。11月28日まで材料とアクセサリーが最大50%引きになり、マシンとヒートプレスも値下げされているという。\n【背景】クリカットのマシンは年末商戦で値下げされることが多く、贈り物や買い替えの検討が集中する。このブログは「Cricut Weekly Sale」のカテゴリーで値下げ情報を伝えており、記事はアフィリエイトリンクを含む。\n【詳細】掲載価格（いずれも11月28日まで）は次のとおり。Joy 2 Blue Essentialバンドルが109ドル、Joy 2 Ultimate+が169ドル、Joy Xtraが129ドル、Explore 5 Essentialが199ドル、Explore 5 Ultimate Plusバンドルが279ドル、Maker 4が349ドル。StickerPix Print Blue Essentialバンドルが119ドル、同Ultimate Plusバンドルが179ドル。熱転写用ではEasyPress SE 9x9が79ドル、EasyPress SE 12x10 Slate Blueが99ドル、マグプレスが99ドル、AutoPress 2の15x15が299ドル、12x12が199ドル（こちらは終了日の記載なし）。トレース用のライトパッドBrightPadは55ドル、BrightPad Goは89ドル。あわせて、月9.99ドルのCricut Accessの会員は会員限定品で「最大70%」節約できると案内しているが、これは有効な契約が必要だ。\n【ポイント・注意点】記事には値下げ前の価格は載っていないため、割引率を知りたい場合は公式サイトで元の価格を確かめる必要がある。購入先はリンク先のCricut.comだ。AutoPress 2の12x12だけ終了日が書かれていない点にも注意したい。同じ機種でもバンドルの内容で価格が変わるので、付属品の中身を比べてから選ぶのがよい。Amazonなどほかの販売店でも同時期に値下げが行われており、同じ製品でも購入先によって価格や付属品が違う場合がある。","2026-11-22","Lydia Watts","https://lydiawatts.com/2026/11/22/cricut-black-friday-early-access/"],["今週のAmazonのクリカット関連価格、Maker 5バンドルは399ドル","節約情報ブログのリディア・ワッツが11月22日、Amazonで今週買えるクリカット関連の価格をまとめた。Maker 5 Essentialバンドルが399ドル、Maker 4が349ドル、Joy Xtraが129ドル、Explore 5 Essentialバンドルが199ドルなど。前週より安くなった品には印を付けている。ビニールやカードストック、マット、刃などの消耗品の価格も幅広く載せている。","\n【概要】リディア・ワッツのブログは2026年11月22日、「This Week's Amazon Deals」として、Amazonで買えるクリカットのマシンと消耗品の今週の価格をまとめた。筆者は価格を確認したとしつつ、「Amazonの価格は1時間ごとに変わる」と注意している。前週より安くなった品には「*」の印を付けている。\n【背景】ブラックフライデーの時期はクリカット公式サイトとAmazonの両方で値下げが行われ、価格が細かく動く。記事はアフィリエイトリンクを含む。同じ日には公式サイトのセールをまとめた別の記事も出している。\n【詳細】マシンではMaker 5 Essentialバンドル（デジタルコンテンツ付き、Slate Blue）が399ドル、Maker 4が349ドル（*）、Joy Xtraが129ドル（*）、Explore 5 Essentialバンドルが199ドル（*）、Joy 2 Essentialバンドル（デジタルコンテンツ付き）が109ドル。StickerPix Print Essentialバンドルは119ドル（*）、StickerPix Print + Cut Essentialバンドルは249ドル（*）。ヒートプレスはAutoPress 2の12x12が199ドル（*）、15x15が297ドル。消耗品では、Premium Fine Pointの刃10本入りが74.99ドル、Ultimate Toolsetが21.99ドル、パーマネントビニール5フィートのレインボーサンプラーが11.89ドル（*）、転写テープ12インチ×15フィートが10.99ドル、パステルのカードストックのサンプラーが8.39ドル（*）、StandardGripのマット3枚組が12.99ドル、Joy Xtra用のマットが5.99ドル、Joyの替え刃が4.34ドル（*）、基本の工具セットが11.24ドル（*）などを並べている。\n【ポイント・注意点】記事には元の価格もセールの終了日も書かれていない。Amazonの価格は変わりやすいと筆者自身が断っているため、購入前に必ずその時点の価格を確かめたい。公式サイトの価格と見比べると、同じ製品でも購入先で条件が違う場合がある。刃やマット、転写テープは使うほど減る消耗品なので、マシンを持っている人にとっては買い置きの機会にもなる。","2026-11-22","Lydia Watts","https://lydiawatts.com/2026/11/22/this-weeks-amazon-deals-2/"],["2026年ブラックフライデーのクリカットお買い得、用途別の4選","クリカット正規販売店Craft-e-Cornerが11月20日、2026年ブラックフライデーのクリカットのお買い得情報を用途別にまとめ、24日に更新した。初心者向けはWalmartのExplore 5 Essentialsバンドルが208.99ドル、上級者向けはAmazonのMaker 4バンドルが339.99ドル、150ドル以下の贈り物はJoy Xtraバンドル、シール好きにはStickerPixを挙げている。","\n【概要】クリカットの正規販売店Craft-e-Cornerは2026年11月20日、筆者ヘイリー・ロウによる「2026年ブラックフライデーのクリカットのお買い得」の記事を公開し、見出しに「11/24更新」と付けて情報を足した。用途別に4つのおすすめを表にまとめている。\n【背景】年末商戦ではWalmart、Amazon、Best Buyなど販売店ごとにクリカットのバンドルの値段が違い、どこで買うかで支払額が変わる。記事は購入先ごとの価格と割引率を並べ、比べやすくしている。\n【詳細】初心者向けはWalmartの「Explore 5 Essentials Vinyl and Iron-Onバンドル」で、Walmartのアカウントの特典を使うと208.99ドル（割引率30%）。通常価格は299.99ドルで、Walmartの表示価格は219.99ドル、残り11ドルの値引きにはサインインが必要。Smartビニール12枚とSmartアイロン転写シート10枚が付く。上級者向けはAmazonの「Maker 4 Vinyl and Iron-Onバンドル」で339.99ドル（29%）、さらに20ドル引きで319.99ドルになり、通常は479.99ドル。記事はこれまでに報じられた最安値369.99ドルを30ドル下回るとする。24日にはWalmartのMaker 4とEasyPress SE 9x9のバンドル（439.99ドル、特典で399.99ドル、通常599.99ドル）を追加した。150ドル以下の贈り物にはAmazonのJoy Xtra Rainbowバンドル149.99ドル（通常229.99ドル、35%引き）を挙げ、過去の最安値159.99ドルより10ドル安いとする。シール好きにはBest BuyのStickerPix Print Essentialsバンドル119.99ドル（通常149.99ドル、20%）を勧める。\n【ポイント・注意点】Maker 4のバンドルは見出しで「Walmart」、本文と表では「Amazon」と書かれており、記事内で食い違いがある。セールの終了日は書かれておらず、価格と在庫は変わる可能性があると断っている。購入前に販売店のページで最新の価格を確かめたい。","2026-11-20","Craft-e-Corner","https://www.craft-e-corner.com/blogs/project-inspiration/best-cricut-black-friday-deals-2026-top-machines-bundles-holiday-gift-ideas"],["クリカットのシール印刷機StickerPixがAmazonで初の値下げ","米Popular Scienceが11月20日、クリカットのシール用プリンターStickerPixがAmazonのブラックフライデーで初めて値下げされたと伝えた。刃の付いたPrint + Cut Essentialバンドルは299ドルから249ドルに、刃なしのPrintは169ドルから119ドルに。筆者は10月にレビューして以来大量にシールを作ったという。Joy XtraやExplore 5など、ほかのクリカット製品の値下げも並べている。","\n【概要】米科学技術誌Popular Scienceは2026年11月20日、執筆者スタン・ホラチェクによる記事で、クリカットのシール印刷機StickerPixがAmazonのブラックフライデーのセールで初めて値下げされたと伝えた。ほかのクリカットのマシンや材料も最大50%引きになっているという。\n【背景】StickerPixは昇華型の印刷でシールを作るクリカットの新しい系列だ。筆者は10月にStickerPix Print + Cutをレビューし、それ以来「大量のシール」を作ったと書き、設定は10分もかからなかったとしている。同機はPopSci Proven賞を受けている。\n【詳細】StickerPix Print + Cut Essentialバンドルは299ドルから249ドルに。刃の付いた昇華型プリンターで、4×7インチのシートに印刷し、1枚ずつハーフカットする。ただしクリカット専用の用紙とインクのパックしか使えない。刃のないStickerPix Printは169ドルから119ドルで、あらかじめ型抜きされたシートを使い、4×6インチの写真印刷もできる。ラベルや丸いシール、スナップ写真が主な用途ならこちらを勧めている。ほかにJoy Xtraが179ドルから129ドル（幅8.5インチ、最長4フィート、50種類以上の素材に対応とクリカットが説明）、Explore 5 Essentialバンドル（デジタルコンテンツ付き）が249ドルから199ドル（前の機種より30%小さく、幅12インチを保ち、Smart素材ならマットなしで最長12フィート）、EasyPress Mini（Raspberry）が49.99ドルから39ドル、Joy 2 Ultimateバンドルが209ドルから146ドル、Maker 4が579ドルから474ドル、AutoPress 2の12x12が249ドルから199ドル。ビニールやアイロン転写シートは6.99ドルからとしている。\n【ポイント・注意点】記事にはセールの終了日が書かれていない。StickerPix Print + Cutは専用の用紙とインクに限られるため、消耗品の費用も含めて検討したい。同じ機種でも販売店によって価格が異なる場合があるので、購入先を比べるとよい。","2026-11-20","Popular Science","https://www.popsci.com/gear/cricut-sticker-cutting-machine-supplies-black-friday-amazon-deals/"],["「Festive Cheer」の無料SVG、細い線のミニマルなクリスマス柄","無料SVG配布サイトCrafty Crafterが11月20日、クリスマスのカットファイル「Festive Cheer」を公開した。すっきりした線と細かい部分が特徴のミニマルなデザインで、基本のカス取りに慣れた人向けとする。ギフトタグ、黒いTシャツへの白いHTV、マグ、木のオーナメント、クッションカバーなど使い道を挙げ、Design Spaceへの取り込み手順や利用条件も載せている。","\n【概要】無料のSVGを配布するCrafty Crafterは2026年11月20日、クリスマス向けのカットファイル「Festive Cheer」を公開した。個人利用向けの無料ファイルで、ダウンロードはGoogleドライブのファイルへのリンクから行う。\n【背景】年末はクリスマスの文字入れデザインの需要が高く、Tシャツやマグ、オーナメントなどの手作りに使われる。同サイトはクリスマスのSVGを相次いで公開している。今回のデザインは、すっきりした線と細かいディテールのミニマルなもので、基本的なウィーディング（カス取り）を身に付けた経験者に向くと説明している。\n【詳細】使い道の例として、厚手のカードストックとひもで作るギフトタグ、黒いTシャツに白いHTV（アイロン転写シート）、陶器のマグに光沢のあるパーマネントビニール、木のオーナメントに型紙用のステンシルビニール、フロッキーHTVでクッションカバー、ワイングラスにパーマネントの粘着ビニールを挙げる。Design Spaceでの手順は、フォルダーを解凍し、「Upload Image」で.svgファイルを選び、キャンバスに追加して大きさを調整する。HTVを切るときは左右反転し、マットを入れて画面の指示に従う。Silhouette Studioでも使えるとしている。材料としてアクリルのオーナメント、ラメHTV、転写テープ、重ね貼り用の道具、アイロン転写ビニール、耐熱テープ、ミニヒートプレス、綿の無地製品を挙げている。\n【ポイント・注意点】よくある質問では、Cricut Joy、Maker、Exploreで使え、登録なしで無料、拡大しても画質が落ちないとする。手作りの品物は贈り物にしてよいが、デジタルファイル自体の転売や再配布はできない。ページにはファイルの寸法や容量は書かれていない。細かい線が多いデザインなので、小さく切るとカス取りが難しくなる点に注意したい。オーナメントやタグなど小さな物に使う場合は、試し切りで線がつぶれないか確かめるとよい。","2026-11-20","Crafty Crafter","https://crafty-crafter.club/christmas/festive-cheer-svg-for-cricut/"],["「Homebody」の無料SVG、おうち時間のスウェットやマグに","クラフトブログArtsy-Fartsy Mamaが11月20日、無料のカットファイル「Homebody」を公開した。ゆったりしたスウェットやマグ、温かみのあるインテリアに使える文字のデザインで、CricutでもSilhouetteでも切れる。筆者はExplore Air 2で白いHTVを切って熱転写した。個人利用に限るファイルで、ほかのブログなどの「くつろぎ」系の無料ファイル16点も紹介している。","\n【概要】クラフトブログArtsy-Fartsy Mamaは2026年11月20日、「Homebody（家で過ごすのが好きな人）」の文字を使った無料のSVGカットファイルを公開した。スウェットやコーヒーマグ、インテリアなど、くつろぎの時間に合う作品に使える。\n【背景】寒い季節には、家でゆっくり過ごす気分を表す言葉をスウェットやマグに入れる作品が好まれる。この投稿は、複数のブログが「くつろぎ」をテーマに無料ファイルを持ち寄る企画の一つで、このファイルを含めて「17の無料のくつろぎSVG」としてまとめられている。\n【詳細】ファイルには複数の形式が入っており、どのカッティングマシンでも切れると説明している（形式の一覧は書かれていない）。必要なものとして、無地のTシャツやパーカー、カットファイル、Cricut MakerかCricut Explore Air 2、HTVかラメHTV、HTVRONTのAuto Heat Press 2、耐熱マット、テフロンシート、ウィーディングツールを挙げる。筆者はCricut Explore Air 2で白いHTVを切り、カス取りしてヒートプレスで貼った。HTVの一般的な設定はおよそ293〜302°Fで15秒としている。アイロン転写ビニールを切る前には画像を左右反転すること、Design Spaceでは同じ色の部品を「Attach」でまとめることも書いている。投稿の下には、ほかのブログや同サイトの過去の投稿で配られている16点の無料ファイルへのリンクが並ぶ。\n【ポイント・注意点】ファイルは個人利用に限られる。教育の場では使えるが、販売はできない。共有するときは投稿やサイトへのリンクだけにし、ファイルへの直接リンクは共有しないよう求めている。熱転写の温度と時間は目安なので、使うHTVの説明書もあわせて確認したい。左右反転を忘れると文字が裏返って使えなくなるため、カットの前に画面で向きを確かめるのが安全だ。同じ企画の16点と合わせれば、冬の部屋着や小物をくつろぎのテーマでそろえられる。","2026-11-20","Artsy-Fartsy Mama","https://www.artsyfartsymama.com/2026/11/homebody-svg.html"],["「Merry and Bright」の無料カットファイル、Silhouette向け","Silhouette Schoolブログが11月20日、毎週金曜の無料ファイル企画で、Silhouette Studio用のデザイン「Merry and Bright」を配った。Googleドライブから入手でき、個人利用に限る。商用ライセンス付きのSVGはSo Fontsyで1ドルで販売し、その価格は21日の土曜日までとした。クリスマスのシャツや木の看板、玄関のボード、クッション、タンブラー、オーナメントへの使い方を提案している。","\n【概要】Silhouetteの使い方解説で知られるSilhouette Schoolブログは2026年11月20日、毎週金曜に無料のカットファイルを配る「Freebie Friday」で、クリスマスのデザイン「Merry and Bright」を公開した。Silhouette Studio用のファイルで、Googleドライブのリンクから手に入る。\n【背景】「Merry and Bright（楽しく明るいクリスマスを）」はクリスマスの定番のあいさつで、シャツや飾りの文字入れによく使われる。同ブログは毎週金曜に季節のデザインを無料で配っており、前の週には「Thankful」のファイルを出していた。\n【詳細】無料のファイルは個人利用に限られる。商用ライセンス付きのSVG版は、フォントとデザインの販売サイトSo Fontsyで1ドルで販売しており、この価格は11月21日（土）までとしている。使い道の例として、クリスマスのシャツ、暖炉の上に飾る木の看板、玄関に立てかけるボード、クッション、タンブラー、オーナメントのセットを挙げている。掲載の画像では、クッションに使った完成イメージを見せている。\n【ポイント・注意点】ページにはファイルの寸法、機械の設定、材料の一覧は書かれていない。無料版はSilhouette Studioの形式なので、ほかの機種のソフトで使いたい場合や、作った品物を販売したい場合は、SVG版の商用ライセンスを検討する必要がある。商用版の1ドルの価格は期限付きなので、すでに終わっている可能性がある点に注意したい。シャツやクッションに使う場合はアイロン転写シート、看板やタンブラーに使う場合は粘着ビニールと、作る物によって材料を選ぶことになる。オーナメントのような小さな物に使うときは、文字の細い部分がつぶれないか、試し切りで確かめるとよい。同じデザインで小物をそろえれば、クリスマスの飾りに統一感が出る。毎週の無料ファイルは季節に合わせて出るので、ブログを定期的に見ておくと、行事の前に使えるデザインを集めやすい。","2026-11-20","Silhouette School","https://www.silhouetteschoolblog.com/2026/11/merry-and-bright-freebie-friday.html"],["「Fall Blessings」のリースをスクラップブックのページに","SVG作家ロリ・ウィットロックの公式ブログが11月19日、チームのリンジーによる投稿で、カットファイル「Fall Blessings Wreath」を使ったスクラップブックのレイアウトの作り方を紹介した。全部の部品をCricutで切り、紙に合わせてリースの色を茶色から黒に変えた。葉と花をグレーのインクで色付けし、フォームで浮かせて立体感を出し、3×3インチの写真2枚を添えている。","\n【概要】ペーパークラフト用のSVGファイルを手がけるロリ・ウィットロックの公式ブログは2026年11月19日、「Fall Blessings Wreath（秋の恵みのリース）」のファイルを使ったスクラップブックのレイアウトの作り方を公開した。チームメンバーのリンジーが書いた投稿だ。\n【背景】スクラップブッキングは、写真を台紙に貼り、紙の飾りや文章で思い出のページを作る趣味だ。カッティングマシンを使えば、リースのような細かい形もきれいに切り出せる。秋は収穫や感謝をテーマにしたページ作りが盛んな季節だ。ファイルはロリのショップとSilhouette Design Storeで販売している。\n【詳細】紙はロリがデザインしたEcho Parkの「Chickens（ニワトリ）」コレクションを使った。手順は、まず全部の部品をCricutのマシンで切る。紙の色に合わせて、リースの色を茶色から黒に変えた。葉と花は柔らかいグレーのインクで色付けし、先の細い液体のりで組み立てる。リースの土台をレイアウトの背景紙に貼り、花、葉、どんぐりの下にフォームの接着材を入れて浮かせ、立体感を出した。ページには3×3インチの写真2枚、日記のような文章（ジャーナリング）、エナメルドット、いくつかのシールを添えている。投稿にはチームのスー・ケメントのコメントも付いている。\n【ポイント・注意点】投稿にはカットの設定値や紙以外の材料の詳しい一覧、価格は書かれていない。リースの色を変えた工夫は、手持ちの紙に合わせて切る紙の色を選び直すだけでできるので取り入れやすい。インクで色付けすると、平らな紙の部品にも陰影が出る。フォームで一部だけ浮かせると、ページ全体に奥行きが出る。秋の写真をまとめるページとして、感謝祭の時期に取り入れやすい作例だ。リースの形は写真を囲む枠としても使えるので、季節の行事の写真を飾るページに向く。部品が多いリースは、切ったあとに種類ごとに分けておくと組み立てがはかどる。エナメルドットやシールなど小さな飾りを添えると、写真と文章の周りににぎやかさが加わる。","2026-11-19","Lori Whitlock","https://loriwhitlock.com/fall-blessings-wreath-tutorial/"],["Silhouette Studioで画像の背景を消す2つの方法","Silhouette Schoolブログが11月19日、Silhouette Studioで写真の背景を取り除き、人物などだけを切り抜く2つの方法を紹介した。1つはトレースの「Trace and Detach」で、しきい値を調整して被写体の周りに切り取り線を作る。もう1つは曲線の描画ツールで輪郭をなぞり、修正パネルの「Crop」で切り抜く。写真ブースの小道具やオリジナルのシール作りに使える。","\n【概要】Silhouetteの使い方解説で知られるSilhouette Schoolブログは2026年11月19日付けで、Silhouette Studioで画像の背景を消す2つの方法を紹介した。被写体の形に沿って切る作品、たとえば写真ブースの小道具やオリジナルのシール作りに役立つ内容だ。\n【背景】カッティングマシンで写真を切り抜くには、被写体の輪郭に沿った切り取り線が必要になる。背景を消せば、印刷してから輪郭どおりに切る作品が作りやすい。Silhouette Studioには、画像をなぞって切り取り線を作るトレースの機能が備わっている。記事では、顔を大きく印刷した「ビッグヘッド」の切り抜きを例にしている。\n【詳細】1つ目はトレースの「Trace and Detach」を使う方法。しきい値のバーを調整し、トレースする部分が黄色で塗りつぶされ、余計な黄色が残らない状態にしてから「Trace and Detach」を押す。するとStudioが被写体の周りに切り取り線を作り、背景を切り離すので、背景を引き離して取り除く。茶色の髪と白い壁のように、被写体と背景のコントラストがはっきりしているときに最もうまくいく。2つ目は「Draw a Curved Shape（曲線を描く）」ツールを使う方法。被写体の輪郭に沿ってクリックしていき、図形を閉じる。線と画像の両方を選び、修正（Modify）パネルの「Crop」を押すと切り抜ける。ダブルクリックすれば点を編集して形を整えられる。\n【ポイント・注意点】記事が示すソフトの表記はV4.4で、新しいバージョンでは画面が異なる可能性がある。コントラストの弱い写真ではトレースがうまくいかないため、手でなぞる2つ目の方法が向く。1つ目は手早く、2つ目は時間がかかるが形を細かく決められるので、写真に合わせて使い分けるとよい。記事ではオンライン講座Silhouette Uの50%引きのコード（YOUTUBE）にも触れている。パーティーの写真ブースや、ペットや家族の写真のシールなど、年末の集まりに向けた作品作りに使える。","2026-11-19","Silhouette School","https://www.silhouetteschoolblog.com/2026/04/how-to-remove-background-in-silhouette.html"]],"uv":[["ローランドDG、VersaObject MO向けにカメラ位置合わせを追加","ローランドDGは、UVフラットベッドプリンター「VersaObject MO-240」「MO-180」向けのカメラオプション「OA-CM-240」「OA-CM-180」を発表した。カメラがベッドを走査し、ソフト「QYPrintVision」が品物の輪郭と位置を割り出すため、位置合わせや専用治具なしで物へ直接印刷できる。走査範囲はMO-240用が590×403mm、MO-180用が410×250mmで、2026年10月26日以降に製造された本体が対象となる。","\n【概要】ローランドDGは、UVフラットベッドプリンター「VersaObject MO」シリーズに、カメラで印刷対象を見つけて位置を合わせるオプションを加えた。MO-240用が「OA-CM-240」、MO-180用が「OA-CM-180」で、英Eye on Displayが2026年11月25日に報じた。\n【背景】ノベルティや記念品など物への直接印刷（ダイレクト・トゥ・オブジェクト）では、品物ごとに専用の治具を作って位置を合わせる手間がかかる。多品種・小ロットの仕事が増えるほど、治具の製作・保管・作り直しの費用が重くなる。同社のグローバル営業・マーケティング担当執行役員Ryugo Nimura氏は、より短いロットと個別化された製品への需要に触れている。\n【詳細】カメラがベッドを走査し、ソフト「QYPrintVision」が置かれた品物の輪郭と位置を割り出す。作業者は検出された形に絵柄を割り当て、レイアウトをRIPソフト「VersaWorks 7」に送って印刷する。同じ絵柄を複数の品に刷る、同じ形の品に違う絵柄を刷る、形の違う品にそれぞれ別の絵柄を刷る、といった使い方を1回の印刷でこなせる。走査範囲はOA-CM-240が590×403mm、OA-CM-180が410×250mm。MOシリーズはプラスチック、金属、ガラス、木、キャンバス、塩ビ、紙などへの印刷を想定した機種で、オプションは同社の正規販売店網を通じて販売される。\n【ポイント・注意点】記事は、治具が要らなくなることで多品種・小ロット生産の治具コストを減らせるうえ、自動の位置合わせで経験の浅いスタッフでも安定した見当合わせができるとしている。ただし対応するのは2026年10月26日以降に製造されたMO-240とMO-180で、それより前の本体に付けられるかどうかは記事に書かれていない。導入を考える場合は、手持ちの本体の製造時期と対応可否を販売店に確かめておく必要がある。また、カメラで検出できる品物の大きさや形の条件も、実際の品で試しておくと安心だ。","2026-11-25","Eye on Display","https://www.eyeondisplay.com/roland-dg-adds-camera-alignment-to-versaobject-mo-series/"],["京都ステッカー、UVDTFステッカーの貼れる素材と条件を一覧に","京都ステッカーは、UVDTFステッカーが貼れる素材と貼れない条件をまとめた記事を公開した。ガラス、金属、プラスチック、木材、陶器に貼れ、コップやボトルのような緩やかな曲面にも対応する一方、極端な曲面や複雑な形状は事前の確認を勧めている。印刷はCMYKとホワイトで、金・銀インクやメタリック、箔押し、鏡面表現には対応しない。料金は50mm角10枚1,080円〜（税別）で、通常は決済後2〜4営業日で発送する。","\n【概要】UVDTFステッカーの小ロット製作を手がける京都ステッカーが、2026年11月25日付で「貼れる素材と貼れない条件」を一覧にした記事を公開した。注文前に、自分の貼りたい物に使えるかを判断できるようにした内容である。\n【背景】UVDTFステッカーは、UV硬化インクで刷ったデザインを品物に貼り付けて使う。素材や形によって仕上がりや持ちが変わるため、グッズの制作販売や店舗装飾に使う人にとっては、貼る対象との相性が最初の関門になる。\n【詳細】貼れる素材として、ガラス、金属、プラスチック、木材、陶器を挙げる。コップやボトルのような緩やかな曲面には対応するが、極端な曲面や複雑な形状は事前に確認するよう求めている。印刷の構成はCMYKにホワイトを加えたもので、金・銀インク、メタリック、箔押し、鏡面表現には対応しない。耐久性については、家庭用食洗機で100回程度洗っても剥がれなかったという自社テストを紹介しつつ、デザインによっては剥がれる場合があると注記している。貼った後は24〜72時間の定着期間を置くよう案内する。料金（税別）は50mm角が10枚1,080円〜・50枚4,200円〜・100枚7,200円〜、100mm角が10枚2,700円〜・50枚10,500円〜・100枚18,000円〜。税別10,000円以上で送料無料、製作実績の掲載を許可すると10%引きになる。納期は通常（決済後2〜4営業日で発送・無料）と特急（1〜2営業日・有料、要事前確認）の2種類。\n【ポイント・注意点】入稿はPNGかJPGで、300DPI以上が推奨されている。食洗機の結果はあくまで同社独自の試験で、デザインによって剥がれることもあると明記されている。食器や水回りに使う場合は、定着期間を守ったうえで、少数で試してから本番の枚数を頼むのが安全だろう。グッズとして販売する場合は、貼れる素材と貼れない条件を商品説明にも反映しておくと、買い手との行き違いを減らせる。極端な曲面や複雑な形の品に使いたいときは、同社の案内どおり事前に相談しておきたい。","2026-11-25","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/25/24305/"],["京都ステッカー、UVDTFステッカーの活用事例5つを紹介","京都ステッカーは、1枚から作れるUVDTFステッカーの活用事例を5つ紹介する記事を公開した。スマホケースやタンブラーなどのオリジナルグッズ、ビールグラスや店舗ガラスへのロゴ、安全ヘルメットや工具の識別ラベル、食洗機に対応するお名前シール、写真やメッセージ入りのギフトの5分野である。CMYKとホワイトで刷り、金・銀やメタリックには対応しない。料金は50mm角10枚1,080円〜（税別）としている。","\n【概要】京都ステッカーは2026年11月25日、UVDTFステッカーをどんな場面で使えるかを5つの事例でまとめた記事を公開した。個人の小物から店舗、現場まで、1枚から頼める点を前面に出している。\n【背景】UVDTFステッカーは、UV印刷の発色を、プリンターを持たずに品物へ貼って再現できるのが特徴とされる。制作販売や販促に使う側にとっては、どの用途で採算や見栄えが合うかが知りたい点になる。\n【詳細】記事が挙げる事例は5つ。1つ目はスマホケースやタンブラーなどのオリジナルグッズ。2つ目はビールグラスやジョッキへの店舗ロゴ、ショーウィンドウやドアの装飾。3つ目は安全ヘルメットの会社ロゴや、工具・機材の識別ラベル。4つ目は食洗機に対応するお名前シール。5つ目は写真やメッセージを入れたグラスなどのギフトである。データ面では、CMYKにホワイトを加えた印刷で、金・銀インク、メタリック、箔押し、鏡面は非対応。入稿はPNG・JPGで300DPI以上を推奨する。耐久性は家庭用食洗機で100回程度の洗浄テストを挙げ、スキージーでの密着と24〜72時間の定着を条件としている。料金（税別）は50mm角が10枚1,080円〜・50枚4,200円〜・100枚7,200円〜、100mm角が10枚2,700円〜・50枚10,500円〜・100枚18,000円〜。納期は通常2〜4営業日（無料）と特急1〜2営業日（有料）から選ぶ。\n【ポイント・注意点】事例は用途の幅を示すもので、どの用途でも同じ持ちになるとは限らない。特に食器や屋外の機材に使う場合は、同社が挙げる密着と定着の条件を守る必要がある。金色や銀色のロゴを使いたい店舗は、CMYKでの近い色表現になる点を事前に理解しておきたい。用途ごとに必要な枚数や大きさも違うため、まず小さいサイズを少数頼み、現物の見え方と貼り心地を確かめてから本番の数量を決めると、無駄な出費を抑えられる。事例は同社の宣伝を兼ねた紹介である点も念頭に置きたい。料金や納期の条件は、ほかの記事と同じ内容で示されている。","2026-11-25","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/25/24312/"],["京都ステッカー、UVDTFステッカーのWEB見積もりから決済までを案内","京都ステッカーは、UVDTFステッカーの注文方法と料金をまとめた記事を公開した。注文はWEB見積もりシステムで、画像をアップロードしてサイズ・数量・オプションを選ぶと見積もりが出て、そのまま入稿と決済まで進める。見積書PDFも取得でき、システムは24時間使える。料金は50mm角10枚1,080円〜、100mm角10枚2,700円〜（税別）で、税別10,000円以上は送料無料、納期は通常2〜4営業日で発送する。","\n【概要】京都ステッカーは2026年11月24日、UVDTFステッカーを1枚から注文するための手順と料金を説明する記事を公開した。見積もりから入稿、決済までをWeb上で完結させる流れを示している。\n【背景】小ロットのUV系ステッカーは、個人のグッズ制作や小規模な販売で使われることが多い。少ない枚数で頼む人ほど、見積もりのやり取りに時間をかけたくない。同社はその手間を省く仕組みを前面に出している。\n【詳細】注文はWEB見積もりシステムで行う。画像をアップロードし、サイズ・数量・オプションを選ぶと見積もりが表示され、その場で入稿と決済まで進められる。見積書はPDFでダウンロードでき、社内の稟議などにも使える。システムは24時間利用できる。入稿データはPNG・JPGで、300DPI以上を推奨。金・銀インクなどの特殊表現には対応しない。料金（税別）は50mm角が10枚1,080円〜・50枚4,200円〜・100枚7,200円〜、100mm角が10枚2,700円〜・50枚10,500円〜・100枚18,000円〜で、入稿データの種類やオプションによって変わる。税別10,000円以上で送料無料、製作実績の掲載を許可すると10%引き。納期は通常スピード（決済後2〜4営業日で発送・無料）と特急スピード（1〜2営業日・有料、要事前確認）の2種類。耐久性については家庭用食洗機で100回程度洗っても剥がれなかったとし、貼付後24〜72時間の定着を推奨している。\n【ポイント・注意点】料金表は「〜」付きの下限で、実際の額はデータやオプションで変わる。特急は有料で事前確認が必要なため、イベント販売などで期日がある場合は余裕を持って頼むのがよい。見積もりは無料で出せるので、まず数パターンの枚数で比べてから決めるとよいだろう。製作実績の掲載を許可すると10%引きになるが、自社の販促物や未発表の商品に使う場合は掲載してよいかを社内で確かめておく必要がある。入稿形式がPNG・JPGに限られる点も、データを作る前に押さえておきたい。","2026-11-24","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/24/24262/"],["Formnext 2026報告、UVインクジェットのフルカラー造形機が並ぶ","3DPrinting.comは独フランクフルトのFormnext 2026の報告記事を公開した。UV関連では、HeyGearsのフラットベッド型UVインクジェット機「G1X」が高さ150mmまでのフルカラー造形と平面のUV印刷をこなし、Kickstarterで1,770万ドルを集めたと紹介。Inkeraの卓上UV噴射機「C1」は8つの材料チャンネルを持ち2027年第1四半期に発売予定、ミマキは色域を広げた「3DUJ-553MkII」を発表した。","\n【概要】米3DPrinting.comは2026年11月23日、独フランクフルトで開かれたFormnext 2026の報告記事を公開した。3Dプリンターの展示会だが、UVインクジェットの技術を使ったフルカラー造形機や、平面のUV印刷もこなす卓上機が目立ったことを伝えている。\n【背景】UV硬化インクを噴射して重ねる方式は、平面へのUV印刷と立体の造形の両方に使える。卓上UVプリンターの市場が広がるなか、凹凸印刷から本格的な立体造形へ進む機種が出てきており、UVプリンターと3Dプリンターの境目が近づいている。\n【詳細】HeyGearsの「G1X」は、フラットベッド型のUVインクジェット機で、水溶性のサポートを使って高さ150mmまでのフルカラー部品を造形するほか、盛り上げ印刷や平面のUVグラフィックも刷れる。Kickstarterは9月に終了し、4,000人近い支援者から1,770万ドルを集めた。最初の出荷は12月と約束されており、「Full-3D Pack」は5,499ドル。Inkeraの「C1」は卓上のUV噴射機で、特色用を含む8つの材料チャンネルを持ち、造形範囲は200×150×120mm、サポートは水に溶ける。販売は2027年第1四半期の予定で、価格は発表されていない。ミマキは、色域を広げ、安価な内部充填用インクを使う「3DUJ-553MkII」を発表した。\n【ポイント・注意点】記事は、こうした機械のインクジェットヘッドは交換費用が安くないと注意している。G1Xは出荷前のクラウドファンディング製品で、C1も価格未定のため、購入を考える場合は出荷時期とヘッドなど消耗部品の費用を確かめる必要がある。UV印刷を仕事にしている事業者にとっては、平面印刷と立体造形を1台でこなす機種が出てきたことで、試作品や小物の受注の幅を広げられる可能性がある。一方で造形機としての速度や材料費は記事に詳しく書かれておらず、採算は実機の情報が出てから判断したい。展示会で発表された製品は、仕様や価格が出荷までに変わることもある点に注意が要る。","2026-11-23","3DPrinting.com","https://3dprinting.com/news/formnext-2026-recap"],["京都ステッカー、UVDTFステッカーの長所と短所、用途を整理","京都ステッカーは、UVDTFステッカーの仕組みとメリット・デメリット、用途をまとめた解説記事を公開した。UV硬化型インクを透明PETフィルムに印刷したもので、UVプリンターで直接刷る代わりに貼るだけで施工できる。高精細フルカラー、白インクによる透明・暗色素材への発色、耐水・耐候、フチなし仕上がりを長所とし、金・銀など特殊インク非対応、24〜72時間の定着期間、デザインによる剥がれを短所に挙げる。","\n【概要】京都ステッカーは2026年11月23日、UVDTFステッカーを初めて使う人向けに、長所と短所、主な用途を整理した記事を公開した。1枚から頼める点を打ち出している。\n【背景】記事によると、UVDTFステッカーはUV硬化型インクを透明PETフィルムに印刷したステッカーで、従来はUVプリンターで品物に直接印刷していた表現を、貼るだけで実現できるものだという。UVプリンターを持たない個人や店舗でも、UV印刷に近い仕上がりを使えるのが売りである。\n【詳細】メリットとして、高精細なフルカラー、白インクに対応しているため透明素材や暗い色の素材でも発色すること、水や天候に強いこと、フチのない仕上がり、多様な素材に貼れることを挙げる。デメリットは、金・銀などの特殊インクに対応しないこと、貼った後に24〜72時間の定着期間が要ること、デザインによっては剥がれる可能性があることの3点。用途例はオリジナルグッズ、ノベルティ、飲食店、工事現場、お名前シール、ギフト。料金（税別）は50mm角が10枚1,080円〜・50枚4,200円〜・100枚7,200円〜、100mm角が10枚2,700円〜・50枚10,500円〜・100枚18,000円〜。税別10,000円以上で送料無料、掲載許可で10%引き。納期は通常2〜4営業日（無料）、特急1〜2営業日（有料・要事前確認）。食洗機については家庭用で100回程度洗っても剥がれなかったとしている。\n【ポイント・注意点】記事は短所も明記しており、すぐに使いたい場合や金・銀の表現が必要な場合には向かないことがわかる。用途によって求められる耐久性は違うため、販売用のグッズに使う場合は、自分の品物で事前に試してから量を決めるのがよい。特に飲食店の食器や工事現場の機材など、繰り返し洗ったり擦れたりする用途では、定着期間を確保できる段取りを組むことが前提になる。白インクが使える点は、透明なグラスやアクリル板に載せる場合の利点として覚えておくとよい。料金は枚数が増えるほど1枚あたりが下がる構成になっている。","2026-11-23","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/23/24170/"],["京都ステッカー、UVDTFの白版データの作り方と入稿仕様を解説","京都ステッカーは、UVDTFステッカーのデータ作成について、白インク（白版）の扱いと入稿仕様を解説する記事を公開した。印刷はCMYKにホワイトを加えた構成で、白インクによって透明なガラスや暗い色の素材でもデザインが沈まずに発色するという。入稿はPNG・JPGで300DPI以上を推奨し、金・銀インク、メタリック、箔押し、鏡面は非対応で、データ上の金・銀はCMYKで似せた表現になる。","\n【概要】京都ステッカーは2026年11月22日、UVDTFステッカーのデータを作る人向けに、白インク（白版）の役割と入稿の仕様をまとめた記事を公開した。\n【背景】UV系の印刷では、透明な素材や暗い色の素材に色を乗せると、下地が透けて色が沈んでしまう。その下に白を敷くのが白版で、UVDTFステッカーでも仕上がりを左右する要素になる。グッズを作る人にとっては、データ側で何を用意すればよいかが気になる点である。\n【詳細】同社の印刷はCMYKにホワイトインクを加えた構成で、白インクによって透明なガラスや暗い色の素材でもデザインが沈まずに発色すると説明している。対応ファイルはPNGとJPGで、解像度は300DPI以上を推奨する。金・銀インク、メタリック、箔押し、鏡面表現には対応しておらず、データに金色や銀色を使った場合は、CMYKで「それらしく」見せる表現になる。料金（税別）は50mm角が10枚1,080円〜・50枚4,200円〜・100枚7,200円〜、100mm角が10枚2,700円〜・50枚10,500円〜・100枚18,000円〜。税別10,000円以上で送料無料、掲載許可で10%引き。納期は通常2〜4営業日（無料）と特急1〜2営業日（有料）の2つ。耐久性は家庭用食洗機で100回程度の洗浄テストを挙げ、スキージーでの密着と24〜72時間の定着を条件としている。\n【ポイント・注意点】金属的な光沢を期待してデータに金・銀を入れても、仕上がりは印刷色での近似になる。ロゴの色指定が厳しい企業案件では、事前に相談するか、サンプルで色味を確かめておくと行き違いを防げる。解像度不足は仕上がりの粗さにつながるため、300DPIの推奨は守っておきたい。透明な素材に貼る場合は、白版をどこに敷くかで見え方が大きく変わる。全面に白を敷くか、絵柄の一部だけにするかで印象が違うため、意図を伝えにくいデザインは小さなサイズで試し刷りしてから本番に進むと失敗が少ない。データの作り方に不安がある場合は、同社の無料の見積もりで条件を確かめながら進められる。","2026-11-22","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/22/24139/"],["京都ステッカー、UVDTFと従来の直接UV印刷の違いを説明","京都ステッカーは、UVDTFステッカーの仕組みと、UVプリンターによる従来の直接印刷との違いを解説する記事を公開した。グラスやジョッキ、スマホケースにフルカラーで刷るには従来はUVプリンターでの直接印刷が必要だったが、UVDTFは刷ったステッカーを台紙から剥がして貼り、転写シートを剥がすだけで施工できるという。特徴として高精細フルカラーと白インク、耐水・耐擦れ、フチなし、UVプリンター不要の5点を挙げる。","\n【概要】京都ステッカーは2026年11月22日、UVDTFステッカーがどういう仕組みで、UVプリンターで品物に直接刷る従来の方法と何が違うのかを説明する記事を公開した。\n【背景】記事によると、グラスやジョッキ、スマホケースなどにフルカラーで印刷するには、これまではUVプリンターで品物に直接刷る必要があった。その場合は品物を印刷機に載せる必要があり、機械を持つ業者に品物を預けることになる。\n【詳細】UVDTFは、印刷済みのステッカーを台紙から剥がして貼り、上の転写シートを剥がすだけで施工できる。記事は特徴を5つ挙げる。高精細なフルカラーと白インクへの対応、水や擦れ、天候への強さ（食洗機での洗浄にも耐えるとする）、フチのない仕上がり、ガラス・金属・プラスチック・木材・陶器へ貼れること、そしてUVプリンターがなくても誰でも貼れることである。印刷はCMYKとホワイトで、金・銀、メタリック、箔押し、鏡面は非対応。食洗機は家庭用で100回程度洗っても剥がれなかったとする。料金（税別）は50mm角が10枚1,080円〜・50枚4,200円〜・100枚7,200円〜、100mm角が10枚2,700円〜・50枚10,500円〜・100枚18,000円〜。税別10,000円以上で送料無料、掲載許可で10%引き。納期は通常2〜4営業日、特急1〜2営業日（有料）。入稿はPNG・JPGで300DPI以上を推奨する。\n【ポイント・注意点】直接印刷と比べたときの利点は、品物を預けずに手元で貼れる点にある。一方で貼る作業は自分で行うため、密着や定着の手順を守らないと仕上がりや持ちに差が出る。どちらを選ぶかは、数量と品物の形、自分で貼る手間をあわせて判断したい。大量の同じ品に刷るなら直接印刷、少ない数や形の違う品に載せるならステッカー、という使い分けも考えられる。記事は製作業者の説明である点も踏まえ、見積もりと試作で比べるとよい。ステッカーは貼る作業の手間がかかる分、品物を送る手間や送料がかからない点も比較の材料になる。","2026-11-22","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/22/24135/"],["京都ステッカー、UVDTFを曲面にきれいに貼るコツと定着期間","京都ステッカーは、UVDTFステッカーを失敗せずに貼る方法をまとめた記事を公開した。コップやボトルのような緩やかな曲面には貼れるとし、台紙を剥がして貼る、スキージーで密着させる、転写シートをゆっくり剥がすの3ステップを紹介。曲面では中心から外側へ空気を押し出すようにスキージーをかけるのがコツという。剥がれを防ぐため、貼った後24〜72時間は洗わずに定着させるよう案内している。","\n【概要】京都ステッカーは2026年11月21日、UVDTFステッカーの貼り方、とくに曲面に貼るときのコツと、貼った後の定着期間について解説する記事を公開した。\n【背景】UVDTFステッカーは、UVプリンターを持たない人でも品物に貼るだけでUV印刷のような仕上がりを得られる一方、貼る作業は使う人に任される。コップやボトルなど丸みのある品に貼るときに空気が入ったり、端が浮いたりすることが、仕上がりと持ちを分ける。\n【詳細】記事は、コップやボトルのような緩やかな曲面には貼れると説明する。手順は3つで、台紙を剥がして貼る、スキージーなどで密着させる、最後に転写シートをゆっくり剥がす。曲面では、中心から外側へ空気を押し出すようにスキージーをかけるのが密着させるコツだという。剥がれを防ぐため、貼った後は24〜72時間の定着期間を置いてから洗うよう案内している。家庭用食洗機で100回程度洗っても剥がれなかった自社テストを紹介しつつ、デザインによっては剥がれる場合があると注意している。料金（税別）は50mm角が10枚1,080円〜・50枚4,200円〜・100枚7,200円〜、100mm角が10枚2,700円〜・50枚10,500円〜・100枚18,000円〜。税別10,000円以上で送料無料、掲載許可で10%引き。納期は通常2〜4営業日、特急1〜2営業日（有料）。FAQでは金色・銀色の印刷には対応しないとしている。\n【ポイント・注意点】仕上がりは貼る人の手順に左右される。特に定着期間を待たずに洗うと剥がれの原因になりうるため、販売するグッズに貼る場合は、買い手にも定着期間を伝える工夫がいるだろう。急な曲面は対象外とみられるため、形が複雑な品は事前に相談したい。スキージーをかけるときは、品物やステッカーの表面を傷つけないよう力加減に気をつけたい。貼る位置は最初に決めておき、貼り直しを前提にしないことが、きれいに仕上げるための基本になる。貼る前に品物の表面の汚れや油分を落としておくことも、密着を良くするうえで欠かせない一般的な手順である。","2026-11-21","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/21/24106/"],["ミマキ欧州、UVフラットベッド3機種とRasterLink8を投入","南アSign Africaによると、ミマキ欧州は大判のUVフラットベッド「JFX220-2515」と小型の「UJF200-3042」「UJF200-6042」の3機種を投入した。JFX220はヘッド4基のデュアルCMYKで毎時最大42㎡、印刷範囲2500×1500mm。UJF200は高さ250mm・20kgまでの物に直接印刷でき、蛍光インクにも対応する。3機種とも新しいRIP「RasterLink8」で動き、自動化で操作を易しくする狙いだ。","\n【概要】南アフリカの業界誌Sign Africaは2026年11月20日、ミマキ欧州がUVフラットベッドプリンター3機種をラインアップに加えたと報じた。大判の「JFX220-2515」と、小型の「UJF200-3042」「UJF200-6042」で、現地の販売代理店はGraphix Supply World（GSW）としている。\n【背景】記事は、高度なUV印刷をより操作しやすく、印刷サービス事業者が使いやすいものにすることが狙いだとする。ミマキ欧州の営業責任者Arjen Evertse氏は、印刷事業者が納期の短縮、コストの上昇、熟練オペレーターの不足という圧力にさらされていると述べている。\n【詳細】JFX220-2515はJFX200シリーズを発展させた機種で、メディアがある部分だけを吸着する「Anchor Technology」によりマスキングが不要になり、自動の位置決めピンでメディアを素早く置ける。ヘッド4基でデュアルCMYK印刷を行い、速度は毎時最大42㎡。印刷範囲は2500×1500mmで、オプションなしで厚さ101.6mmまでの素材に刷れる。蛍光インク「EFS-150」を加え、ヘッドから最大20mm離れた面に刷る「LD4」モードや、エンボスや点字を作る「2.5D Texture Maker」も備える。UJF200シリーズは蛍光インクに対応し、機内持ち込みサイズのバッグやPCケースなど、高さ250mm・重さ20kgまでの物に直接印刷できる。オプションのカメラで位置を検出して画像を合わせられ、UJF200-6042にはベルト搬送のオプションもある。3機種とも新しいRIP「RasterLink8」で動き、ジョブ管理と自動位置合わせを強化した。\n【ポイント・注意点】同時に発表された「TxF330-800」は布向けのDTFプリンターで、UV機ではない。日本での扱いや価格は記事に書かれていない。国内の販売店網で同じ機種がいつ扱われるかも示されていないため、関心のある事業者は国内の発表を待つ必要がある。","2026-11-20","Sign Africa","https://www.signafrica.com/mimaki-europe-announces-latest-additions-to-portfolio/"],["京都ステッカー、100均のUV転写シールとオリジナル製作を比較","京都ステッカーは、100円ショップなどで売られるUV転写シールと、専門業者に頼むオリジナルのUVDTFステッカーの違いを解説する記事を公開した。既製品は用意されたデザインから選ぶのに対し、UVDTFは自分のデータで1枚から大量まで作れる点を違いに挙げる。フチなしでガラスや金属、陶器などに貼れ、緩やかな曲面にも対応。料金は50mm角10枚1,080円〜（税別）で、通常2〜4営業日で発送する。","\n【概要】京都ステッカーは2026年11月20日、100円ショップなどで手に入るUV転写シールと、専門業者が受注製作するUVDTFステッカーの違いを比べる記事を公開した。\n【背景】UV印刷風の転写シールは安価な既製品としても出回っており、自作グッズに使う人も多い。一方で、自分のデザインを品物に載せて販売したい人にとっては、既製品では足りない場面がある。記事はその分かれ目を示そうとしている。\n【詳細】記事によると、100均などの転写シールは用意されたデザインから選ぶ既製品であるのに対し、UVDTFステッカーは顧客のデータで製作でき、1枚から大量の注文まで対応する。フチのない仕上がりで、ガラス・金属・プラスチック・木材・陶器に貼れ、緩やかな曲面にも対応するという。耐久性については、UV硬化インクで水や擦れ、紫外線に強く、家庭用食洗機で100回程度洗っても剥がれなかった自社テストを挙げる。ただしデザインによっては剥がれる場合があり、スキージーでの密着と24〜72時間の定着が必要だとしている。印刷はCMYKとホワイトで、金・銀インク、メタリック、箔押し、鏡面は非対応。料金（税別）は50mm角が10枚1,080円〜・50枚4,200円〜・100枚7,200円〜、100mm角が10枚2,700円〜・50枚10,500円〜・100枚18,000円〜。税別10,000円以上で送料無料、掲載許可で10%引き。納期は通常2〜4営業日、特急1〜2営業日（有料）。入稿はPNG・JPGで300DPI以上を推奨する。\n【ポイント・注意点】記事は製作業者自身による比較で、既製品の耐久性を同じ条件で試した結果は示されていない。自分のロゴや絵柄で売り物を作るなら受注製作、手軽な飾りなら既製品、と目的で選び分けるのが現実的だろう。販売用の品物に使う場合は、洗浄や擦れに耐えるかが評価を左右するため、受注製作品でも自分の品で試してから売り出すのが安全だ。料金は枚数で単価が下がる構成なので、販売数の見込みに合わせて頼む量を決めたい。","2026-11-20","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/20/24076/"],["ミマキ、大阪支店で4社合同展示会「BEYOND PRINTING」","ミマキエンジニアリングは、4社合同の展示会「BEYOND PRINTING ～印刷の枠を超えた、新たな可能性へ～」を11月26日（木）10時〜17時に大阪支店（大阪府吹田市）で開くと案内した。最新のUVプリンターやDTFプリンター、デジタルカッター、アパレルCADなどを展示し、シンクイノベーションの三輪直之氏による「グッズ市場セミナー」と、テルミ・エンタープライズの鎌田樹哉氏による「DTFセミナー」も行う。","\n【概要】ミマキエンジニアリングは2026年11月19日、4社合同の展示会「BEYOND PRINTING ～印刷の枠を超えた、新たな可能性へ～」の開催案内を公開した。会期は11月26日（木）の1日で、会場は同社の大阪支店である。\n【背景】UVプリンターやDTFプリンターを使ったオリジナルグッズの制作は、印刷会社やサイン業者が新しい売り上げを探す分野になっている。機械を並べるだけでなく、グッズ市場の動向やDTFの使い方を学べるセミナーを組み合わせ、導入を考える事業者に向けた催しとしている。\n【詳細】開催時間は10時から17時まで。会場はミマキエンジニアリング大阪支店（大阪府吹田市垂水町3-36-15 2階）。最新のUVプリンター・DTFプリンターのほか、デジタルカッターやアパレルCADなどを展示する。セミナーは2つあり、10時から11時はシンクイノベーションの三輪直之氏による「グッズ市場セミナー」、13時から14時はテルミ・エンタープライズの鎌田樹哉氏による「DTFセミナー」。いずれも定員に達し次第、受付を終える。申し込みはページ内のWebフォームから行い、問い合わせ先は大阪支店（06-6388-8258）となっている。\n【ポイント・注意点】案内ページには、合同で出展するほかの3社の社名や、展示するUVプリンターの機種名は書かれていない。開催は本日で、セミナーは定員制のため、参加を考えている場合は事前に申し込み状況を確かめたい。関西でUV機とDTF機を並べて比べられる機会で、グッズ制作への参入を検討する事業者には実機と市場の話を一度に聞ける場になる。UVプリンターの導入は機械代だけでなく、インクや設置場所、作業する人の手配も伴うため、会場では実際の運用に必要な条件もあわせて聞いておくと、帰ってから比較検討しやすい。セミナーの内容が自社の扱う品目に合うかも、事前に確かめておきたい。展示機の詳細が気になる場合は、来場前に大阪支店へ問い合わせて確かめておくと、当日の見学を効率よく進められる。","2026-11-19","ミマキエンジニアリング","https://japan.mimaki.com/news/event/entry-471685.html"],["京都ステッカー、UVDTFで推し活グッズを作る料金と仕様を案内","京都ステッカーは、UVDTFステッカーで推し活グッズを自作する人向けの記事を公開した。UV硬化型インクを透明PETフィルムに刷ったステッカーで、UVプリンターがなくても貼るだけで施工できる。最新のUVDTFプリンターで刷り、白インクにより透明なアクリルや暗い色の品でも発色するという。スマホケースやPC、文房具、タンブラー、マグカップに使え、料金は50mm角10枚1,080円〜（税別）としている。","\n【概要】京都ステッカーは2026年11月19日、好きなキャラクターや人物を応援する「推し活」のグッズを、UVDTFステッカーで自作する方法と料金・仕様を紹介する記事を公開した。\n【背景】推し活グッズは、少ない枚数で自分だけのデザインを作りたいという需要が強い分野である。UVプリンターを個人で持つのは難しいが、刷ったステッカーを貼る形なら手持ちの小物を手軽に飾れる。記事はこの層を狙っている。\n【詳細】記事によると、UVDTFステッカーはUV硬化型インクを透明PETフィルムに印刷したもので、UVプリンターがなくても貼るだけで施工できる。フチのない高精細なフルカラーで、同社は最新のUVDTFプリンターを使い、白インクによって透明なアクリル素材や暗い色のアイテムでも発色するとしている。貼る対象として、スマホケース、PC、文房具、タンブラー、マグカップを挙げる。食洗機については家庭用で100回程度洗っても剥がれなかった自社テストを紹介するが、デザインによっては剥がれる場合があり、スキージーでの密着と24〜72時間の定着が条件となる。料金（税別）は50mm角が10枚1,080円〜・50枚4,200円〜・100枚7,200円〜、100mm角が10枚2,700円〜・50枚10,500円〜・100枚18,000円〜。税別10,000円以上で送料無料、掲載許可で10%引き。納期は通常2〜4営業日（無料）、特急1〜2営業日（有料）。入稿はPNG・JPGで300DPI以上を推奨し、金・銀インクは非対応である。\n【ポイント・注意点】キャラクターや人物の画像を使う場合、権利の扱いには注意がいる。記事は製作の仕様を説明するもので、権利面には触れていない。1枚から頼めるので、まず少ない枚数で発色と貼り心地を確かめてから増やすとよいだろう。イベントで頒布や販売を考えている場合は、特急の納期が有料で事前確認が必要な点も踏まえ、余裕を持った日程で注文したい。納期の目安は決済後からの営業日で数えるため、週末や祝日をはさむ場合はその分も見込んでおきたい。","2026-11-19","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/19/24006/"]],"risk":[["子どものAIによる心のケア、親の76％が「抵抗あり」　米ハーバード大など調査","米ハーバード大学医学部、ボストン小児病院、RANDの研究者が、5〜17歳の子を持つ親572人を対象に、AIが主導する行動療法を子どもに受けさせることへの抵抗感を調べた。76％が「まったく」または「あまり」受け入れられないと答え、診断の正確さ、チャットボットの共感性、医療者が勧めるかどうか、守秘とプライバシーが主な懸念だった。研究はJAMA Pediatricsに掲載され、研究者は子どもや治療者の意見も含めた評価が必要だとしている。","\n【概要】\n米ハーバード大学医学部、ボストン小児病院、RANDの研究者らが、AIが主導する行動療法を自分の子どもに受けさせることについて、親がどの程度受け入れられるかを調べた。全米の親572人への調査で、76％が「まったく」または「あまり」受け入れられないと回答した。研究はJAMA Pediatricsに掲載され、ハーバード・ガゼットの記事をMedical Xpressが転載した。\n【背景】\n米国ではセラピストの不足と若者のメンタルヘルスの危機が指摘されている。記事によると、別の最近の研究では12〜21歳の19％がメンタルヘルスの助言を得るためにAIチャットボットを使っており、親に伝えていないことも多い。行動医療に関する団体の報告では、若い患者が最初の評価や治療、薬の管理を受けるまで平均4か月待っていたという。ダートマス大学ではカウンセリング用に訓練したチャットボット「Therabot」も開発されている。\n【詳細】\n調査は2025年11月、クラウドソーシング型の基盤「Outbreaks Near Me」を通じて、5〜17歳の子どもが少なくとも1人いる親572人に行われた。受け入れられると答えたのは約24％で、「ある程度」または「とても」受け入れられるとした。親が重視した懸念は、診断の正確さ、チャットボットの共感性、医療専門職が勧めるかどうか、守秘とプライバシーで、費用や予約の柔軟さ、待ち時間は比較的下位だった。子どもへの利用を受け入れる親は自分自身へのAI療法も受け入れており、人間と同程度以上の働きを期待していた。過去1年に子どもが行動療法を受けていたことは受け入れやすさと関連したが、親や子どもが日常的にチャットボットを使っているかどうかは関連しなかった。\n【ポイント・注意点】\n筆頭著者のローズマリー・マルトマ氏は、今回の調査は親だけが対象であり、子ども、セラピスト、医師の意見も含める必要があると述べている。AIツールは、それぞれの立場の人が最も重視する点で評価されるべきだという。子どもがAIに悩みを相談している可能性も踏まえ、家庭で使い方を話し合うことが大切になりそうだ。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-mental-health-chatbots-kids-parents.html"],["自閉スペクトラム症の子の約3分の2に重い消化器症状　米テキサス大が確認","米テキサス大学ヒューストン校（UTHealth Houston）の研究チームが、4〜16歳の自閉スペクトラム症の子どもの血液と便を調べ、約3分の2に重い消化器症状があることを確認した。自閉症の症状が重いほど腹痛やガス、夜間の覚醒などの消化器症状が出やすく、腸内細菌の多様性も低かった。一方、炎症や「腸漏れ」の指標は正常範囲で、従来の説は支持されなかった。言葉で訴えにくい子では、不機嫌や自傷が腹部の不快のサインの場合もあるという。","\n【概要】\n米テキサス大学ヒューストン校（UTHealth Houston）マクガバン医学部のマーク・ローズ氏らは、自閉スペクトラム症（ASD）の子どもの多くが重い消化器症状を抱え、その重さが自閉症の症状の重さと関連することを確認した。成果はPediatric Researchに掲載された。\n【背景】\n記事によると、自閉症は米国の小児の3％にみられる。消化器の不調は行動や睡眠、生活の質に影響し得るが、ASDの子どもは不調をうまく言葉で伝えられないことがある。腸の炎症や腸の透過性の高まり（いわゆるリーキーガット）がASDに関わるという説は以前からあったが、十分に確かめられていなかった。研究チームは、こうした説を血液と便の検査で直接確かめることにした。\n【詳細】\n研究チームは、ASDと診断された4〜16歳の子どもから血液と便を集め、臨床評価と保護者への質問票で自閉症の行動と消化器症状を評価した。比較対象は定型発達の子どもと、ASDの子のきょうだいだった。その結果、ASDの子どもの「約3分の2」に重い消化器症状があった。自閉症の症状が重い子ほど、腹痛、ガス、便のにおいの強さ、夜中に目を覚ますといった症状がみられやすく、消化器症状のある子では、その重さと自閉症の重さが有意に関連していた。ASDの子どもは腸内細菌の多様性が低く、構成も異なり、消化器症状のある子では複数の菌群が多かった。一方、炎症や腸のバリア機能の指標は正常範囲で、重症度とも関連せず、長年の仮説を支持しない結果となった。なお、記事には対象人数は示されていない。\n【ポイント・注意点】\nローズ氏は、腹部の不快感が、特に言葉を話さない子どもでは、いらだちや反復行動、自傷行為として表れることがあると指摘する。研究チームは、果物や野菜、全粒穀物の多い多様な食事と、健康的な排便習慣で腸の健康を支えることを勧めており、プロバイオティクスについても「有望な結果」があるとしている。行動の変化の背景に体の不調がないか、主治医と相談しながら見ていくことが勧められる。また、腸内細菌の違いが消化器症状と結びついている可能性も示されており、今後の支援や治療の検討につながることが期待される。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-link-autism-gi-symptoms-children.html"],["福島県でインフル拡大　郡山・会津など警報基準超え、54校・施設で学級閉鎖","福島県内でインフルエンザの感染者が増えている。11月22日までの7日間の感染者は1医療機関あたり25.77人で、前週から2.75人増え、注意報レベルの10人を4週連続で上回った。郡山市、県中、会津の3地域では警報基準の30人を超え、54の学校や保育所などで休校や学年・学級閉鎖の措置が取られた。県は今後も増加のおそれがあるとして、マスク着用や手指消毒、換気の徹底を呼びかけている。","\n【概要】\n福島県内でインフルエンザの流行が拡大している。KFB福島放送によると、11月22日までの7日間に確認された感染者は1医療機関あたり25.77人で、前週より2.75人増えた。郡山市、県中、会津の3地域は警報基準を超え、学校や保育所など54か所で休校や学年閉鎖、学級閉鎖の措置が取られた。\n【背景】\nインフルエンザの流行状況は、定点となる医療機関1か所あたりの患者数で判断され、10人が注意報レベル、30人が警報レベルの目安とされる。福島県の数値は注意報レベルの10人を4週連続で上回っており、今季は秋の早い段階から流行が続いている。学校や保育所は子どもが長時間一緒に過ごすため、集団感染が起きやすい場となっている。\n【詳細】\n地域別では、郡山市、県中、会津の3地域で1医療機関あたりの感染者が警報基準の30人を超えた。県全体の25.77人も警報基準に近づいている。感染の広がりを受けて、県内の54の学校や保育所などが、休校、学年閉鎖、学級閉鎖のいずれかの措置を取った。県は、例年の流行の推移から、今後も感染者が増えるおそれがあるとみている。そのうえで、マスクの着用、手や指の消毒、こまめな換気といった基本的な感染対策を徹底するよう県民に呼びかけている。\n【ポイント・注意点】\n子どもがいる家庭では、県の呼びかけにある基本的な対策を家庭内でも続けることが大切になる。学級閉鎖などの情報は学校や保育所から届くため、連絡を確認し、発熱などの症状があるときは無理に登校・登園させず、医療機関に相談することが勧められる。警報基準を超えた地域に限らず、県内全域で増加傾向にある点にも注意したい。年末に向けて人の移動が増える時期でもあり、地域の流行状況を継続的に確認しておくと安心だ。インフルエンザは、せきやくしゃみの飛まつや、ウイルスが付いた手で口や鼻に触れることで広がるとされる。家族の誰かが発症したときは、タオルの共用を避けるなど、家庭内での広がりにも気を配りたい。症状が治まった後も、学校や保育所が定める出席停止の期間を守ることが、周りへの感染を防ぐことにつながる。","2026-11-25","ふくしまNEWS -KFBデジタル-（Yahoo!ニュース）","https://news.yahoo.co.jp/articles/2d2d91986dac97f44cb562e5867ef6c3e594e5c6"],["長野県のインフル患者増加続く　伊那・上田・飯田で警報基準、64施設で閉鎖","長野県内のインフルエンザ患者が増え続けている。11月22日までの1週間に報告された患者は定点1医療機関あたり24.34人で、前週から5.88人増えた。保健所別では伊那が53.25人で最多となり、上田と飯田も警報基準を上回った。長野、北信、長野市の各保健所管内も注意報基準を超えた。保育施設や小中高校など13施設で学年閉鎖、51施設で学級閉鎖の対応が取られており、子どもの集団生活の場で流行が広がっている。","\n【概要】\nSBC信越放送によると、長野県内でインフルエンザの患者が増え続けている。11月22日までの1週間に報告された患者は、定点となる1医療機関あたり24.34人で、前週から5.88人増えた。伊那、上田、飯田の各保健所管内で警報基準を上回り、長野、北信、長野市の管内でも注意報基準を超えた。\n【背景】\nインフルエンザの流行は、定点医療機関1か所あたりの患者数で評価される。注意報基準や警報基準を超えると、地域で流行が広がっていることを示す。今季は全国的に流行の立ち上がりが早く、長野県でも増加が続いている。子どもは集団生活の中で感染が広がりやすく、学年閉鎖や学級閉鎖が相次いでいる。記事では、保健所ごとの患者数とあわせて、学校などの施設の閉鎖状況も伝えられている。\n【詳細】\n保健所別では伊那が53.25人で最も多く、警報基準を大きく上回った。上田と飯田も警報基準を超えた。さらに、長野、北信、長野市の各保健所管内も今回の調査で新たに注意報基準を超え、流行が県内の広い範囲に及んでいることがうかがえる。県全体の24.34人は前週より5.88人増えており、増加の勢いは続いている。保育施設や小中高校などでは、13施設で学年閉鎖、51施設で学級閉鎖の対応が取られた。乳幼児から高校生まで、幅広い年代の子どもが通う施設で影響が出ている。\n【ポイント・注意点】\n警報基準を超えた伊那、上田、飯田の周辺に住む家庭では特に注意が必要だ。記事には県による具体的な予防の呼びかけは載っていないが、一般的には手洗い、換気、十分な休養などの基本的な対策が有効とされる。子どもに発熱やせき、だるさなどの症状が出たときは早めに医療機関に相談し、学校や保育施設の閉鎖の連絡も確認しておきたい。家庭内でのうつし合いを防ぐ工夫も大切になる。インフルエンザは飛まつや接触で広がるとされ、手洗いやせきエチケットは家族全員で取り組むことが効果的だ。学級閉鎖などで子どもが家にいる期間は、人混みへの外出を控え、体調の変化に気を配りたい。","2026-11-25","SBC信越放送（Yahoo!ニュース）","https://news.yahoo.co.jp/articles/e1ae5fef6ae1281f42aa30c81dbeac70c5eeb72f"],["三重県でインフル注意報レベル超え　学年閉鎖14校・学級閉鎖19校で今季最多","三重県感染症情報センターによると、11月16〜22日のインフルエンザの定点あたり患者報告数は11.87人で、前週の9.72人から増え、今シーズン初めて注意報レベルの目安10人を超えた。伊賀、桑名、鈴鹿の各保健所管内が県平均を上回った。期間中の学年閉鎖は14校、学級閉鎖は19校で、インフルエンザと診断された人は250人と、いずれも今季最多だった。県は手洗いや換気、十分な睡眠など基本的な対策を求めている。","\n【概要】\n中京テレビNEWSによると、三重県感染症情報センターが11月16〜22日のインフルエンザの発生状況を発表した。定点あたりの患者報告数は11.87人で、今シーズン初めて注意報レベルの目安である10人を超えた。学年閉鎖は14校、学級閉鎖は19校で起き、閉鎖の数と患者数はいずれも今シーズン最多となった。\n【背景】\n定点あたり報告数は、指定された医療機関1か所あたりの1週間の患者数で、流行の規模を判断する目安となる。三重県では前週が9.72人で、注意報レベルの直前まで増えていた。今季は全国的に流行の始まりが早く、学校での集団感染が各地で報告されている。子どもが過ごす学校では感染が広がりやすく、閉鎖措置の増加は地域での流行の広がりを映している。\n【詳細】\n地域別にみると、伊賀保健所管内が19.50人、桑名保健所管内が15.78人、鈴鹿保健所管内が14.60人で、いずれも県平均を上回った。対象期間中、学年閉鎖が14校、学級閉鎖が19校で発生し、インフルエンザと診断された人は250人だった。閉鎖数と患者数はどちらも今シーズン最多となった。さらに対象期間後の24日にも、伊賀市や桑名市の学校で新たな閉鎖があったという。県平均を上回った北部と伊賀地域を中心に、流行がさらに広がる可能性がある。県全体の数値は前週から2.15人増えており、増加の勢いがうかがえる。\n【ポイント・注意点】\n三重県は、手洗い、換気、十分な睡眠などの基本的な感染対策を求めている。子どもの体調管理では、睡眠や食事などの生活リズムを整えることも予防につながる。伊賀、桑名、鈴鹿の各地域では流行が先行しているため、学校からの閉鎖の連絡に注意し、発熱などの症状があれば早めに医療機関に相談したい。注意報レベルを超えたばかりの段階であり、今後の推移を見守る必要がある。閉鎖された学校の子どもが家で過ごす期間は、外出を控えて体を休め、家族への感染にも注意したい。インフルエンザは飛まつや接触で広がるとされ、せきやくしゃみが出るときはマスクを着けるなどのエチケットも大切になる。","2026-11-25","中京テレビNEWS（Yahoo!ニュース）","https://news.yahoo.co.jp/articles/0ef850bbbb5e26518ce66d00e0e3eb02a8d99397"],["太平洋側で空気カラカラ、都心の最小湿度25％　インフル患者は4週連続増","日本気象協会のtenki.jpによると、25日は冬型の気圧配置で太平洋側は広く晴れ、空気が乾燥した。午後3時までの最小湿度は山梨県大月市で21％、甲府市で22％、東京都心で25％だった。厚生労働省の20日の発表では、11月9〜15日のインフルエンザ報告数は全国で4万4563人、1医療機関あたり11.94人で4週連続の増加となった。乾燥する日が続く見込みで、室内の湿度を50〜60％に保つことなどが呼びかけられている。","\n【概要】\n日本気象協会のtenki.jpは、太平洋側で空気の乾燥が進んでいると伝えた。25日は冬型の気圧配置となり、太平洋側は広く晴れた。午後3時までの最小湿度は、山梨県大月市で21％、甲府市で22％、東京都心で25％だった。インフルエンザの患者も増えており、加湿や手洗いなどの対策を呼びかけている。\n【背景】\n冬型の気圧配置になると、北日本の日本海側や北陸では雪や雨が降る一方、太平洋側では晴れて乾いた空気に覆われやすい。記事は、空気の乾燥とインフルエンザの患者増加をあわせて取り上げ、感染対策と火の取り扱いへの注意を促している。子どもは学校や保育施設で集団生活を送るため、流行期には特に対策が求められる。\n【詳細】\n厚生労働省が20日に発表した11月9〜15日の全国のインフルエンザ報告数は4万4563人で、1医療機関あたり11.94人だった。4週連続の増加で、47都道府県のうち38都道府県で前週より増えた。天気の見通しでは、28日は九州から関東で一時的に天気が崩れるものの、29日は太平洋側を中心に晴れる見込みで、乾燥する日が多い状態が続くという。記事は、室内の湿度を50〜60％を目安に加湿すること、こまめな手洗い、換気、人混みでのマスク着用を勧めている。あわせて、空気が乾燥すると火が燃え広がりやすいため、火の取り扱いにも注意するよう呼びかけている。全国の約8割にあたる38都道府県で増えており、流行が広い範囲に及んでいることがうかがえる。\n【ポイント・注意点】\n子どもが過ごす部屋は、加湿器などを使って湿度の目安を保つとよい。暖房を使う時期は換気がおろそかになりがちだが、記事は換気も対策の一つに挙げている。外出から帰ったときの手洗いを習慣にし、人混みではマスクを着けるなど、家族ぐるみで続けたい。乾燥した日が続く見込みのため、ストーブなどの火の周りに子どもが近づかないよう、やけどや火災への備えも忘れずにしておきたい。子どもは体調の変化を言葉でうまく伝えられないこともあるため、発熱やせきなどの様子に気を配り、気になるときは早めに医療機関に相談したい。","2026-11-25","tenki.jp（日本気象協会）","https://tenki.jp/forecaster/deskpart/2026/11/25/41439.html"],["長野・諏訪で8歳男児はねられ骨折、救護せず走り去る　30歳国家公務員を書類送検","10月15日午後4時ごろ、長野県諏訪市中洲の県道交差点で、横断中の8歳の小学生男児が乗用車にはねられ、手の骨を折る大けがをした。運転していた愛知県みよし市の30歳の男性国家公務員は、男児を救護せずに現場から走り去った疑いが持たれている。警察は防犯カメラの映像などから男性を特定し、ひき逃げなどの疑いで書類送検した。男性は容疑を認め、事故当時は旅行中だったと説明している。","\n【概要】\nSBC信越放送によると、長野県諏訪市の県道交差点で8歳の小学生男児が乗用車にはねられて大けがをしたひき逃げ事件で、警察は愛知県みよし市に住む30歳の男性国家公務員を、ひき逃げなどの疑いで書類送検した。男性は容疑を認めているという。\n【背景】\n事故が起きたのは10月15日午後4時ごろだった。現場は諏訪市中洲の県道の交差点で、男児は道路を横断している途中だった。交通事故を起こした運転者には、けが人を救護し、警察に届け出る義務がある。今回は運転者が現場を離れたため、警察は防犯カメラの映像などを手がかりに捜査を進めていた。ひき逃げは、被害者の救護が遅れることで、けがを重くするおそれもある重大な違反とされる。\n【詳細】\n男児は横断中に乗用車にはねられ、手の骨を折る大けがをした。乗用車を運転していたのは、愛知県みよし市に住む30歳の男性国家公務員とされる。男性は男児を救護せず、そのまま現場から走り去った疑いが持たれている。警察は防犯カメラの映像などから男性を特定し、任意で事情を聴いたうえで、ひき逃げなどの疑いで書類送検した。調べに対し男性は容疑を認めており、事故当時は旅行中だったと説明しているという。\n【ポイント・注意点】\n下校時間帯の交差点では、子どもが道路を横断する場面が多い。運転する側は、交差点や横断歩道の手前で速度を落とし、子どもの姿がないかを十分に確認することが欠かせない。旅行などで土地勘のない場所を走るときは、道路の様子に気を取られやすいため、なおさら注意が必要になる。万一事故を起こした場合は、その場で車を止め、けが人の救護と警察への通報を行わなければならない。家庭でも、横断の前に左右を確かめる、車が止まったことを確認してから渡るなど、子どもと一緒に交通ルールを確認しておきたい。子どもには、事故にあったときはけがが軽く見えても、すぐに周りの大人に知らせるよう日ごろから伝えておくことも大切だ。運転者が立ち去った場合でも、車の色や形、時刻などを覚えておくことが手がかりになることがある。","2026-11-25","SBC信越放送（Yahoo!ニュース）","https://news.yahoo.co.jp/articles/9a45a8a25d0c3c667dcfeefa66e48711b7a47044"],["室内の粗大粒子が多い家庭で川崎病の発症が少ない傾向　富山大がエコチル調査で分析","富山大学などの研究チームは、エコチル調査に参加した母子3846組のデータを分析し、家庭の室内の粗大粒子（PM10–2.5）の濃度が最も高い群の子どもは、最も低い群に比べ、6歳までに川崎病になるオッズが低かったと発表した。調整後のオッズ比は0.42だった。一方、PM2.5では有意な関連はみられなかった。研究者は、観察研究のため因果関係は示せず、室内の粒子が川崎病を防ぐことを示すものではないと注意を促している。","\n【概要】\n富山大学の研究チームは、家庭の室内空気中の粗大粒子（PM10–2.5）の濃度が高い家庭の子どもほど、6歳までに川崎病を発症するオッズが低いという予想外の関連を報告した。研究は青森県立保健大学のケンタ・マツムラ教授が主導し、富山大学のヒデクニ・イナデラ名誉教授らが参加した。成果はInternational Journal of Hygiene and Environmental Healthに掲載された。\n【背景】\n川崎病は主に5歳未満の子どもに起こる急性の炎症性の病気で、冠動脈に障害を残すことがあり、子どもの後天性心疾患の大きな原因となっている。原因はまだはっきりしていない。これまで屋外の粒子状物質と川崎病の関連は報告されていたが、子どもが多くの時間を過ごす室内の粒子との関係はほとんど分かっていなかった。\n【詳細】\n研究チームは、全国規模の出生コホート調査「子どもの健康と環境に関する全国調査（エコチル調査）」の母子3846組を分析した。子どもが1歳半と3歳のときに、自宅の室内でPM2.5とPM10–2.5を1週間ずつ測定し、家庭ごとに平均した。6歳までに59人が川崎病を発症し、累積発症率は単胎出生1000人あたり15.34人だった。交絡因子を調整した解析で、PM10–2.5が最も高い3分の1の群は、最も低い群に比べて川崎病のオッズが低く、調整オッズ比は0.42（95％信頼区間0.19–0.86）だった。PM2.5では弱い傾向がみられたものの、統計的に有意ではなかった（調整オッズ比0.67、95％信頼区間0.33–1.32）。\n【ポイント・注意点】\n研究者は、今回の研究は観察研究であり因果関係を示すものではなく、室内の粒子が川崎病を防ぐと解釈すべきではないと強調している。2回の測定の一致度も中程度で、残る交絡の評価も必要だという。今後は、微生物の成分を含む粒子の組成や家庭の特徴を、より大規模な研究で調べることが求められる。室内環境も屋外の大気とあわせて研究すべきだとしている。","2026-11-24","Medical Xpress","https://medicalxpress.com/news/2026-11-unexpected-link-coarse-particles-indoor.html"],["ボルバキア入りの蚊を放つ対策で子どものデング感染が68.5%減　ブラジル史上最大の流行下で検証","ブラジルのベロオリゾンテで6〜11歳の小学生5,757人を2020〜2024年に追跡した臨床試験「EVITA」で、細菌ボルバキアを持たせた蚊を放った地域では、蚊が媒介する感染症にかかった子どもが大幅に少なかった。全体の有効率は68.6％で、デング熱は68.5％、チクングニア熱は73.3％。ブラジルで過去最大のデング流行が起きた2024年を含む期間の結果で、米熱帯医学衛生学会の年次総会で11月21日に発表された。","\n【概要】\n細菌ボルバキアを持たせたネッタイシマカを地域に放つ対策で、学齢期の子どもの蚊媒介感染症が大きく減った。ブラジル・ベロオリゾンテで行われた臨床試験「EVITA」の結果で、全体の有効率は68.6％だった。米エモリー大学などが米熱帯医学衛生学会の年次総会で2026年11月21日に発表した。\n\n【背景】\nデング熱、ジカ熱、チクングニア熱は、いずれもネッタイシマカが媒介する。ボルバキアは自然界にいる細菌で、この蚊に感染させると、蚊がこれらのウイルスを人にうつす力が大きく下がる。ボルバキアは雌の蚊から子に受け継がれるため、地域の蚊の中に広がり、時間とともに安定して定着する。ブラジルでは2024年に国内で記録上最大のデング流行が起き、世界のデング患者数も過去最大になった。\n\n【詳細】\n試験はブラジルの大学や世界蚊プログラム（WMP）、米国のエモリー大、イェール大、ジョンズ・ホプキンス大、フロリダ大などが共同で実施した。学校を単位に市内を58の区域に分け、29区域では通常の蚊対策（殺虫剤の散布や発生源の除去）に加えてボルバキア入りの蚊を放ち、残る29区域では通常の対策だけを行った。蚊の放出は2021年1月から2022年5月まで。6〜11歳の子ども5,757人が参加し、2020年に最初の採血をしたあと、2024年まで毎年採血して3種類のウイルスへの抗体を調べた。その結果、感染を防ぐ有効率は全体で68.6％、デング熱で68.5％、チクングニア熱で73.3％だった。放った蚊は3年以上にわたって地域に定着したという。研究者は、記録的な流行のように感染が激しい状況でも地域を守れることを示したとしている。\n\n【ポイント・注意点】\n殺虫剤に頼る従来の対策と違い、一度定着すれば蚊の世代を通じて効果が続く点が特徴だ。研究者は、デング熱などが起きる地域に暮らす世界の約40億人を守る、持続的で広げやすい方法への一歩だと述べている。ただし今回の結果は学会での発表で、記事では専門誌の論文や信頼区間などは示されていない。また1つの都市で行われた試験であり、ほかの地域で同じ効果が出るかは今後の検証が必要だ。","2026-11-23","News-Medical","https://www.news-medical.net/news/20261123/Self-sustaining-mosquito-intervention-protects-Brazilian-children-during-record-dengue-outbreak.aspx"],["妊娠中の喫煙、4歳男児の発達指数の低下と関連か　福島県立医大などエコチル調査","福島県立医科大学と国立環境研究所の研究チームは、エコチル調査のデータを用い、妊娠中の喫煙と子どもの発達の関連を調べた。尿中コチニンで判定した喫煙者の母親から生まれた男児は、4歳時点で認知・適応の発達指数が約3.8点、全体の発達指数が約3.7点低い傾向がみられた。女児では小さく結論の出ない結果で、2歳時点では明確な差はなかった。いずれも研究の厳しい統計基準は満たしておらず、臨床的な意味は不確かとされる。","\n【概要】\n福島県立医科大学と国立環境研究所の研究チームは、妊娠中に母親が喫煙していた場合、男児で4歳時点の発達指数が低い傾向がみられたと報告した。全国規模の出生コホート調査「エコチル調査」のデータを用いた研究で、Scientific Reportsに掲載された。News-Medicalが内容を伝えた。\n【背景】\n妊娠中の喫煙は胎児へのさまざまな影響が知られているが、子どもの発達への影響に男女差があるかどうかは十分に分かっていなかった。エコチル調査は2011〜2014年に全国15の地域センターで妊婦を登録した大規模な調査で、多くの子どもの成長を長期に追っている。今回の研究では、喫煙の有無を自己申告ではなく、尿中の物質の濃度で判定した。\n【詳細】\n対象は2歳時点で4326人、4歳時点で4000人の子ども。妊娠中期または後期の母親の尿中コチニン（ニコチンの代謝物）を測り、クレアチニン1グラムあたり36.8マイクログラムを境に、能動喫煙者と、非喫煙者・受動喫煙者に分けた。発達は「新版K式発達検査2001」で発達指数として評価し、母親の学歴、母乳栄養、心理的苦痛、飲酒、BMI、年齢を調整したベイズ回帰で分析した。その結果、能動喫煙者の母親から生まれた男児は、4歳時点で認知・適応の発達指数が約3.8点、全体の発達指数が約3.7点低く、言語・社会の発達指数も約3.6点低い傾向があった（言語・社会は根拠が弱い）。女児では差は小さく結論が出ず、2歳時点では明確な差はなかった。\n【ポイント・注意点】\nこれらの差は、研究が定めたより厳しい統計的な基準は満たしておらず、臨床的にどの程度重要かは不確かとされる。喫煙の判定は1回の尿検査に基づき、受動喫煙者が比較の基準群に含まれていたこと、残った交絡の可能性があることも限界として挙げられている。研究者は、さらに長期の追跡研究が必要だとしている。結果は確定的ではないものの、妊娠中の禁煙の大切さに改めて目を向けるきっかけとなる。妊娠中や子育て中の家族の喫煙が気になる場合は、医療機関の禁煙外来などに相談するのも一つの方法だ。","2026-11-24","News-Medical","https://www.news-medical.net/news/20261124/Smoking-during-pregnancy-may-leave-a-different-developmental-mark-on-boys.aspx"],["学童の心電図検診、無症状の心疾患の早期発見に有用　三重大の三谷氏らが総説","三重大学病院周産母子センター准教授の三谷義英氏らは、全学童・生徒を対象とする心電図検診について、国内外の疫学研究や検診プログラム、診断・治療の進歩に関するエビデンスを検討した総説をまとめた。病歴と身体診察に心電図を加えることで、症状のない心血管疾患の検出が向上し、早期治療や長期的な管理につながる可能性があると結論づけた。心臓突然死の予防にとどまらず、生涯にわたる循環器ケアへの活用が期待されている。","\n【概要】\n三重大学病院周産母子センター准教授の三谷義英氏らは、全ての学童・生徒を対象とする心電図検診に関する総説をJACC Advancesに発表した。病歴と身体診察による検診に心電図を加えることで、症状のない心血管疾患の検出が向上し、早期治療や長期的な管理につながる可能性があるとしている。Medical Tribuneが報じた。\n【背景】\n学校での心臓検診は、運動中などに起こる子どもの心臓突然死を防ぐ目的で行われてきた。一方、心電図検診が突然死のリスクのある子どもを見つけること以外にどのような役割を果たし得るかについては、エビデンスを整理して検討する必要があった。学校での心臓検診のあり方を考えるうえで、その有用性を改めて整理する意義は大きい。\n【詳細】\n今回の論文は、最新の知見を総合的に論じる「state-of-the-art」のナラティブレビューとして位置づけられている。三谷氏らは、心電図検診に関する国内外の疫学研究、各地の検診プログラム、診断と治療の進歩についてのエビデンスを検討した。その結果、病歴の聴取と身体診察だけの検診に心電図を組み合わせることで、症状のない心血管疾患をより多く見つけられると結論づけた。論文の副題は「突然死予防を超え、生涯の循環器ケアへ」で、心電図検診が心臓突然死のリスクがある子どもの発見だけでなく、無症状の心疾患の早期発見にも役立つ可能性を示している。早く見つけることで、早期の治療や、成人期まで続く長期的な管理につなげられるという。なお、記事の公開部分には対象人数などの数値は示されていない。\n【ポイント・注意点】\n子どもの心疾患は症状がないまま進むことがあり、学校の検診は発見の貴重な機会となる。検診で精密検査を勧められた場合は、症状がなくても専門の医療機関を受診することが大切だ。今回の総説は、学校での心電図検診を、突然死の予防だけでなく生涯にわたる心臓の健康管理の入り口として捉え直す視点を示している。保護者にとっても、検診の結果を子どもの健康の記録として保管し、進学や成長の節目で医師に伝えられるようにしておくことが役立つ。","2026-11-24","Medical Tribune","https://medical-tribune.co.jp/news/articles/?blogid=7&entryid=622555"],["米国のはしか患者6000人に迫る　1週間で426人増、6割近くが子ども・10代","米ミネソタ大学CIDRAPによると、米疾病対策センター（CDC）の集計で米国のはしか患者は1週間で426人増え、ここ数十年で最大の週間増加となった。累計は5838人で、6割近くが子どもや10代、96％がワクチン未接種か接種歴不明だった。ウィスコンシン州では1週間で181人増え、年間832人に達した。MMRワクチンは2回接種で感染を97％防ぐとされ、専門家は学校のワクチン免除の見直しを訴えている。","\n【概要】\n米ミネソタ大学の感染症研究政策センター（CIDRAP）は、米国のはしか（麻疹）患者が6000人に迫っていると伝えた。米疾病対策センター（CDC）の集計では、1週間で426人の新たな感染が報告され、ここ数十年で最大の週間増加となった。累計は5838人で、週100人を超える増加は15週連続となった。\n【背景】\nはしかは非常に感染力の強いウイルス感染症で、記事によると潜伏期間は11〜12日、発疹が出る約4日前から人にうつす。米国では最近、はしかが再び定着した「エンデミック」の状態にあると宣言された。患者の6割近くが子どもや10代で、96％がワクチン未接種か接種歴不明だった。2026年の入院率は11％で、2025年と同じだった。\n【詳細】\nウィスコンシン州では1週間で181人増え、年間832人となった。多くはアーミッシュなどの閉ざされた共同体のワクチン未接種者で、グラント郡に州の患者の4分の1以上が集中している。ペンシルベニア州は1631人、ミネソタ州は203人、インディアナ州は227人、ニューヨーク州は273人、ミシガン州は37人だった。ミシガン州の幼稚園児の接種率は90.9％で、集団免疫の目安とされる95％を下回る。記事は2026年の米国のはしかによる死者を11人と数え、うち8人がペンシルベニア州だった。CDCが認めているはしか関連の死亡は6人で、定義の統一を進めている。\n【ポイント・注意点
