-glm-or-kimi-settings-what-breaks-and-fixes-2l0p"],["指示ファイルを1つに、Claude CodeとCodexで同じルールを読ませる","Claude CodeはCLAUDE.md、CodexはAGENTS.mdを読むため、両方を使うと2つの指示ファイルが食い違いやすいという問題に対し、正本を1つにして他はそれを指すようにする方法をまとめたdev.to記事です。両者のファイルの探し方の違いを比べ、取り込みの仕組みがあるClaude Code側から正本を参照させる方法や、道具ごとの違いの書き分け方を説明しています。","\n【概要】\nDroidActor Dotori氏が2026年11月19日にdev.toで公開した記事です。Claude CodeとCodex CLIの両方を使う開発者が抱えやすい、指示ファイルの二重管理という問題を取り上げ、正本を1つにして他の場所はそれを指すだけにする方法をまとめています。\n\n【背景】\nClaude Codeは`CLAUDE.md`を、Codexは`AGENTS.md`を読みます。2つを別々に保つと、片方だけ直されて食い違い、エージェントがルールを破る原因になります。筆者が自分のホームフォルダを調べると、中身が同じでもリンクではない別々の2ファイルがあり、コピーで管理する手間が表れていたといいます。\n\n【詳細】\nClaude Codeは`CLAUDE.md`だけを読み、全体用は`~/.claude/CLAUDE.md`で、`@パス`による取り込みを4段まで使えます。Codexは`AGENTS.override.md`、`AGENTS.md`、代替名の順に探して最初に見つかったものを使い、全体用は`~/.codex/AGENTS.md`で、取り込みの仕組みはありません。代替名は`project_doc_fallback_filenames`で指定できます。\n取り込みができるのはClaude Codeだけなので、筆者は`AGENTS.md`を正本にし、`CLAUDE.md`には`@AGENTS.md`とClaude専用の内容だけを書く形を勧めています。すでに`CLAUDE.md`が正本なら、`~/.codex/config.toml`に`project_doc_fallback_filenames = [\"CLAUDE.md\"]`を加えます。\n\n【ポイント・注意点】\n1つのファイルで違いを扱うには、冒頭で両方の道具が読むと明記し、表記の違いは1行の条件で書き分けます。機能の違いは、共通のルールと道具ごとの節に分け、止める基準は共通の節に、その手段だけを道具ごとの節に書きます。設定後はClaude Codeで`/context`を実行し、メモリファイルの一覧に出ているか確かめます。リンクはあるのに読まれていない状態が最もよくある失敗だといいます。","2026-11-19","DEV Community","https://dev.to/droidactor/one-instruction-file-claude-and-codex-4o9a"],["awesome-copilotのスキル6本、Claude Codeに入れる前に見る点","GitHubのawesome-copilotにあるスキル6本を、Claude Codeにコピーする前にfrontmatterを読み比べたdev.to記事です。4本はnameとdescriptionしか持たず、git-commitだけが互換性と使えるツールを指定していました。その指定がClaude Codeの書式と違う点や、Gitのバージョン要件、コピー後に壊れるパスなど、移すときの注意点を整理しています。","\n【概要】\nClaude Code、Codex、Cursorの拡張機能の一覧サイトを運営するSkillselion氏が、2026年11月19日にdev.toで公開した記事です。github/awesome-copilotにあるスキル6本について、Claude Codeにコピーする前にfrontmatterを読み比べた結果をまとめています。筆者はGitHubやAnthropicとは関係がないと明記しています。\n\n【背景】\nスキルは`SKILL.md`を含むフォルダで、ほかの道具向けに作られたものもコピーすればClaude Codeで使えることがあります。ただし、書式や前提が違うと、そのままでは期待どおりに動きません。\n\n【詳細】\n対象は、一覧サイトで導入数の多い5本と、前提条件の節を持つ唯一のweb-design-reviewerです。6本のうち4本は`name`と`description`だけを設定し、prdは`license`を加え、git-commitだけが`compatibility`と`allowed-tools`を設定していました。\ngit-commitの`compatibility`は、`git add`の`--resolved`にGit 2.56以上が必要だとしています。筆者の環境はGit 2.52.0でしたが、手順3の代替手段で古い版でも動きます。`allowed-tools: shell(git:*)`という書き方は、Claude Codeのスキルのページでは見当たらない形で、Claude Codeの例は`Bash(git add *)`のようにBashツールを使います。Claude Codeは`license`と`compatibility`を受け付けますが、それに基づく動作はしないため、`git --version`で自分で確かめる必要があります。\n\n【ポイント・注意点】\nexcalidraw-diagram-generatorはリポジトリ内の相対パスでPythonのスクリプトを呼ぶため、`.claude/skills/`にコピーするとパスが壊れます。GitHubの文書はスキルを検証していないとしているため、追加する前に各フォルダを読むことが勧められています。","2026-11-19","DEV Community","https://dev.to/skillselion/what-the-frontmatter-of-six-githubawesome-copilot-skills-tells-you-before-you-copy-them-into-3mb2"],["Azure上のClaude Codeに課金前の確認を挟むプラグインaz-brake","AIエージェントは1つのコマンドで課金されるAzureのリソースを作れるため、費用のかかる操作の前に必ず確認を求めるClaude Codeのプラグイン「az-brake」を作った筆者の記事です。PreToolUseフックでAzure CLIのコマンドを調べ、課金対象の作成や起動を見つけると承認を求めます。予算アラートでは間に合わない理由や、意図的な限界も説明しています。","\n【概要】\nMuhammad Mairaj氏が2026年11月19日にdev.toで公開した記事です（もとはMediumに掲載）。Azure上でClaude Codeを使うときに、費用のかかる操作の前に必ず確認を挟むプラグイン「az-brake」を作った経緯と仕組みを紹介しています。記事はAIの支援を受けたと明記されています。\n\n【背景】\n筆者がチャットで費用の計画に「はい」と答えると、Claude Codeはリソースグループとストレージアカウントを作りました。問題は起きませんでしたが、その承認は後に続くコマンドと結び付いておらず、計画がずれて大きな構成や2つ目のアカウントになっても同じ「はい」で通っていたはずだと筆者は指摘します。予算アラートは使用量のデータを後から見てメールを送るもので、筆者の試験では数時間後も記録に反映されておらず、人が読むより速く動くエージェントには間に合いません。\n\n【詳細】\naz-brakeは`PreToolUse`フックを使います。シェルのコマンドが動く前に、Azure CLIのコマンドが課金対象を作成または起動するかを調べ、該当すればClaude Code通常の承認画面を出し、リソースの種類や名前、サイズや場所の指定を示します。仮想マシン、ディスク、ストレージ、AKS、SQL、Cosmos DB、Redisなど約50種類を対象とし、起動や拡張、デプロイなど何でも作れるコマンドの前でも確認します。`--what-if`の試行や、一覧、削除、ログイン、リソースグループの作成などは確認なしで通します。料金は表示しません。利用者の単価や割引が見えないためです。\n\n【ポイント・注意点】\nこのフックは内部で失敗するとコマンドを通す設計で、詰まるブレーキは外されてしまうという考えによります。また、コマンドの文字列しか見ないため、`bash -c`経由やTerraform、ポータルでの操作は捉えられず、筆者は安全の境界ではなく減速帯だとしています。95件の単体試験などを行いましたが、試したのはWindowsだけで、対話の承認画面やPowerShell、macOS・Linuxでは未確認です。導入には`/plugin install`を使い、Node 20以上が必要です。","2026-11-19","DEV Community","https://dev.to/thisismairaj/a-brake-for-claude-code-on-azure-ask-before-anything-that-costs-money-3fi3"],[".envの読み取りを禁じてもgrepで見えた、Claude Codeの権限検証","Claude Codeの設定で.envファイルの読み取りを禁止しても、grepで秘密の値が表示されてしまったという検証記事です。禁止のルールはReadツールにしか効かず、ファイル名を指定する形のBashの禁止も、エージェントがファイル名を書かずに検索したため素通りしました。最終的にgrepそのものを禁じて止めましたが、ファイルを守るには読める道具をすべて洗い出す必要があると結論づけています。","\n【概要】\nEnjoy Kumawat氏が2026年11月19日にdev.toで公開した記事です。Claude Codeに「.envを読むな」と設定したとき、実際に何がそれを止めるのかを試した結果、Readツールの禁止をすり抜けてgrepで秘密の値が表示されたことを報告しています。\n\n【背景】\n筆者のプロジェクトには、`GITHUB_TOKEN`と`DEV_TO_API`を使うMCPサーバーがあり、どちらも`server.py`の隣の`.env`に置かれています。エージェントに秘密のファイルを読ませないことは基本的な対策ですが、その設定がどこまで効くのかを確かめるため、使い捨てのフォルダで実験しました。\n\n【詳細】\nフォルダには偽の`.env`（`SECRET_KEY=sk-test-marker-9f3a1c`）と、`\"deny\": [\"Read(./.env)\"]`を含む設定ファイルを置きました。`claude -p`で`.env`を読むよう頼むと拒否され、`permission_denials`に記録されました。\n別のセッションで、grepで`SECRET_KEY`を探すよう頼むと、何も拒否されず秘密の値がそのまま表示されました。モデル自身も、このルールはReadツールにだけ効き、シェルのコマンドには効かないと述べました。\n最初の対策の`Bash(grep*.env*)`は効きませんでした。モデルが実行したのは`grep -rn \"SECRET_KEY\" .`で、コマンドに`.env`という名前が出てこず、ファイル名で照合する型には何も当たらなかったためです。効いたのはコマンドそのものを禁じる`\"Bash(grep:*)\"`で、次の試行は拒否されました。\n\n【ポイント・注意点】\nこの方法は`.env`に触れるものだけでなく、すべてのgrepを止めてしまいます。権限の仕組みが、どのファイルを読むかではなくコマンドの文字列で照合するためです。筆者は教訓として、Readの禁止はファイルではなく道具を守るだけであること、ファイル名に基づくBashの型はエージェントがファイル名を書く前提に立っていること、コマンドの禁止は穴をふさぐが大ざっぱであることを挙げ、ファイルを守るにはディスクを読めるすべての道具を特定して制限する必要があるとしています。","2026-11-19","DEV Community","https://dev.to/enjoy_kumawat/i-denied-read-access-to-env-but-grep-still-found-it-7jk"]],"cnc":[["Mastercam 2027の概要公開、AIのCopilotと多軸を強化","英国の加工系メディアMTDCNCは2026年11月19日、CAMソフトの次期版「Mastercam 2027」でMastercamが打ち出す機能を報じた。柱は多軸加工の強化、より強力なバリ取りツール、AI支援「Mastercam Copilot」、EverPath Technologyによるリアルタイムのツールパス体験の先行公開の4つ。複雑な部品を効率よくプログラムしたい製造業に応えるものとするが、記事に具体的な数値や詳しい仕様はない。","\n【概要】\n英国の加工系メディアMTDCNCは2026年11月19日、CAM（コンピューター支援による加工プログラム作成）ソフトの次期版「Mastercam 2027」について、Mastercamが打ち出す機能の概要を伝えた。強化点として、多軸加工の機能強化、より強力なバリ取りツール、AIによる支援機能「Mastercam Copilot」、そしてEverPath Technologyによるリアルタイムのツールパス体験の先行公開が挙げられている。\n\n【背景】\nCNC加工の現場では、形状の複雑な部品をいかに短い時間でプログラムするかが大きな課題になっている。記事は、今回の版を「複雑な部品をより効率よくプログラムしたい製造業への回答」と位置づけ、生産現場の要求に合わせた「よりスマートなワークフロー」を支えるものだと説明している。CAMソフト各社がAIアシスタントを相次いで載せるなか、Mastercamも主力製品の新版でAI支援を前面に出した形だ。\n\n【詳細】\n多軸加工については「強化された多軸機能」とされ、バリ取りについては「より強力なツール」とされている。Mastercam Copilotは、プログラミング作業の中で利用者がより賢く作業できるよう助けるAI支援として紹介されている。また、EverPath Technologyの「リアルタイムのツールパス体験」を初めて披露するとしており、ツールパスの扱い方そのものに手を入れる姿勢がうかがえる。記事はMastercamの発信をもとにした短い紹介で、各機能がどの操作をどこまで自動化するのかといった中身には踏み込んでいない。\n\n【ポイント・注意点】\n今回の記事には、処理時間の短縮率などの数値は一切含まれていない。記事自身も、投資額や運用実績、顧客名、対象業種などは明らかにされていないと記している。Copilotが具体的に何をするのか、EverPathの「リアルタイム」がどの程度の速さを指すのかは、現時点では分からない。導入を考える工場や個人の利用者は、正式なリリースノートや実機でのデモを確かめてから評価するのが無難だ。AIによる支援が付いても、生成されたツールパスの確認と最終判断は人が担う点も変わらない。","2026-11-19","MTDCNC","https://mtdcnc.com/news/mastercam-uk/mastercam-2027-targets-faster-smarter-part-programming/"],["AWS、ロボットセルのプログラムをAIで数時間に短縮へ","米AWSは2026年11月18日、ロボットセルの立ち上げを支援する「Physical AI Production Designer」を公開した。製品の設計データとロボットや治具のモデルから仮想のセルを組み、AIエージェントが作業の割り当てや動作の順番を決め、ロボットのプログラムとPLCのコードを出力する。開発に協力した製造業で最大8週間かかっていた作業を数時間にする狙い。ただし効果の数値は供給側の見積もりで、独立した検証や価格はまだ公表されていない。","\n【概要】\n加工分野のAI専門メディアmachinetoolnews.aiは2026年11月19日、Amazon Web Services（AWS）が11月18日に公開した「Physical AI Production Designer」を報じた。設計指針とGitHubのリポジトリの形で提供され、ロボットセルのプログラム作成を自動化するものだ。開発に協力した製造業では、この作業に最大8週間かかっていたといい、AWSはそれを数時間に縮めることを目指すとしている。\n\n【背景】\n工作機械への材料の出し入れや組み立てなどに使うロボットセルは、立ち上げのたびにロボットの動作やPLC（制御装置）の論理を組む必要があり、熟練した技術者の手間がかかる。複数のロボットが並ぶ自動車のラインではとくに負担が大きい。\n\n【詳細】\nまず製品ライフサイクル管理（PLM）のデータ、つまり部品形状や材料、製造工程の情報を読み込み、ロボット、治具、エンドエフェクターのモデルと組み合わせて仮想のセルを作る。AIエージェントがロボットへの作業の割り当て、動作の順番、インターロックの配置を担い、ロボット本来のプログラムとPLCのコードを出力する。生成したコードは各社の仮想コントローラーと物理モデルの上で動かし、衝突や順番の誤り、通信の不具合、インターロックの問題を実機の前に確かめる。繰り返し作業向けの決まったプログラムと、品種の切り替えが多い現場向けに学習させた制御の2つの方式があり、安全機能は安全PLCに残す。供給側の見積もりでは、計画の期間が24か月から15か月に、セルあたりの処理量が10%以上増え、工場あたり約5,000万ユーロの価値になるという。\n\n【ポイント・注意点】\n記事は、これらの数値が供給側の見積もりで、独立に検証された運用結果ではないと明記している。5,000万ユーロの算出方法も示されていない。対応するロボットの銘柄やコントローラー、PLMの種類は導入ごとに確認が必要で、他のロボット言語にはアダプターが要る場合がある。プログラムは技術者が確認して承認する必要があり、安全設計や実機での検証をAIが置き換えるものではない。価格も公表されていない。","2026-11-19","machinetoolnews.ai","https://machinetoolnews.ai/aws-physical-ai-production-designer/"],["Makeraの卓上CNC「A1S」、世界で予約受付を開始","卓上CNCのMakeraは2026年11月19日、金属も削れる卓上CNC「A1S」の世界での予約受付を11月18日に始めたと発表した。主軸は600Wで最高2万4000回転、アルミや真ちゅうを精度よく削り、鋼にも耐える剛性があるという。手で工具を替える版と12本の自動工具交換の版があり、カメラと自動測定で材料の位置合わせを行う。予約価格は2,779ユーロからで、早期予約は12月4日まで。発表文にAIの機能についての記載はない。","\n【概要】\n卓上CNCを手がけるMakeraは2026年11月19日、ドイツ・フランクフルト発の発表で、新型の卓上CNC「A1S」の世界での予約受付を11月18日に自社サイトで始めたと明らかにした。早期の予約期間は12月4日までとなっている。ものづくりを趣味や小さな事業で行う人の作業台で、金属の切削までこなせることを売りにしている。\n\n【背景】\n3Dプリンターの次の工作機械として、机に置ける小型のCNCが個人や小さな工房に広がりつつある。各社は工具の自動交換や自動の測定を取り入れ、設定の手間を減らすことで、経験の浅い人でも金属加工に取り組めるようにしている。A1Sも同じ流れにある製品で、ドイツで開かれた展示会Formnextに合わせて発表された。\n\n【詳細】\n主軸は600Wで、最高2万4000回転に達する。発表文では、アルミや真ちゅうを精度よく削り、鋼にも対応できる剛性があると説明している。手早く手で工具を替える「Quick-Tool Change」版と、12本の工具を自動で替える「12-Tool ATC」版の2つがあり、後者は荒削り、仕上げ、穴あけ、彫刻を人の手を介さずに続けて行える。「Smart Vision System」と自動の測定によって、材料の位置、高さ、水平、向きの合わせを行う。別売りで、圧縮空気で細かい霧を切削部に吹き付けるMQLキットも用意する。専用のCAMソフト「Makera Studio」は材料に合わせて切削条件を選び、削る前にツールパスを模擬できる。すぐ削れる作品データを共有する「Makerables」も用意している。\n\n【ポイント・注意点】\n予約価格はA1Sが2,779ユーロ（希望小売価格3,529ユーロ）、A1S ATCが3,749ユーロ（同4,599ユーロ）。発表文は、これがすべての段階で最も安い予約価格だとしている。一方で、発表文にはAIの機能についての記載はなく、カメラの仕組みも位置合わせと測定の機能として説明されているだけだ。鋼への対応も剛性の説明にとどまっており、実際の加工の速さや仕上がりは、出荷後の評価を待って判断したい。","2026-11-19","PR Newswire（Makera）","https://www.prnewswire.com/news-releases/makera-opens-global-pre-orders-for-a1s-desktop-cnc-bringing-metal-cutting-to-the-makers-bench-302945349.html"],["工作機械の受注、AI特需で過去最高へ　部品不足が課題","日経ビジネスは2026年11月19日、2027年の機械業界の予測として、AIと半導体関連の需要で工作機械の受注が過去最高の水準に向かう一方、部品の供給が追いつかないと報じた。日工会の統計では、月の受注総額が3月から7か月続けて1700億円を超え、9月は統計開始以来最高の2232億円だった。上半期の累計は初めて1兆円を超え、年2兆円も視野に入る。ただしAI関連の投資が鈍る可能性もあるとしている。","\n【概要】\n日経ビジネス電子版は2026年11月19日、連載「徹底予測2027」の機械編として、工作機械の受注がAI特需で過去最高に向かう一方、部品の供給が追いついていないとする記事を掲載した。記事は、AIと半導体の関連設備の需要が広がり、受注が過去最高の水準になっていると整理したうえで、部品不足と納期遅れの恐れを差し迫った課題に挙げている。\n\n【背景】\nAI向けのデータセンターや半導体の製造装置が増えると、その部品を削り出す工作機械の需要も高まる。2026年はJIMTOFでAIを使った機能が多く披露された年でもあり、AIは機械に載る技術であると同時に、機械そのものを買う理由にもなっている。\n\n【詳細】\n日本工作機械工業会の会長で、芝浦機械社長の坂元繁友氏は10月の記者会見で、2027年の業界の見通しについて悲観的な見方はしていないと述べたという。記事によると、2026年は工作機械業界にとって際立った年になった。日工会の統計では、月の受注総額が3月から7か月続けて1700億円を超えた。9月の受注は2232億円で、統計を取り始めた1988年以来、月として最も高い額だった。上半期の受注の累計は初めて1兆円を超え、年間で2兆円も視野に入っているという。記事の予測の要点としては、AIや半導体関連の需要拡大で受注が過去最高の水準になること、強い需要の一方で部品不足と納期遅れの恐れがあることが挙げられている。\n\n【ポイント・注意点】\n記事は、AI関連の投資が鈍る可能性もあるとして、供給体制の強化が競争力を左右すると指摘している。好調な受注がそのまま売り上げにつながるかは、部品の確保と納期の守り方にかかっている。受注の数字が強いほど、部品を作る側の生産能力が追いつくかどうかが問われることになる。なお記事の後半は有料会員向けで、部品不足の具体的な分析や各社の例は無料の範囲では読めない。個人や小さな工房にとっても、工作機械や交換部品の納期が延びる可能性は、設備の購入や更新を計画するうえで頭に入れておきたい。","2026-11-19","日経ビジネス電子版","https://business.nikkei.com/atcl/gen/19/00951/111600006/"],["三菱電機がFA新ブランド、AIで工場の「自律操業」へ","三菱電機は2026年11月18日、FAシステム事業の新ブランド「Serendie Automation」を立ち上げると発表した。AIエージェント、フィジカルAI、データ共創基盤「Serendie Automation MAPs」の3つを組み合わせ、2003年に打ち出した「e-F@ctory」の知見を引き継ぎながら工場全体の自律化と最適化を目指す。パートナー制度も改める。人手不足や熟練技能の継承が背景にある。","\n【概要】\nビジネス＋ITがYahoo!ニュースで2026年11月18日に配信した記事によると、三菱電機は同日、FAシステム事業の新ブランド「Serendie Automation」を立ち上げると発表した。AIエージェント、フィジカルAI、データ共創基盤「Serendie Automation MAPs」を組み合わせ、工場全体の自律化と最適化を目指す。同社はこのブランドで「自律操業ソリューション」の実現を掲げ、顧客やパートナーとの共創を進める方針だ。\n\n【背景】\n三菱電機はCNC（数値制御装置）やPLCなどの工場自動化機器を手がけ、2003年に「e-F@ctory」を打ち出してデータを生かした現場の改善を進めてきた。製造業では人手不足、熟練技能の継承、需要の変動への対応、脱炭素など課題が複雑になっており、同社は設備、工程、部門をまたいだ情報の連携が必要だと説明している。新ブランドは、e-F@ctoryで蓄えたFA機器や制御の技術、FAとITの連携、現場改善の知見を、デジタル基盤「Serendie」で進化させる位置づけだ。\n\n【詳細】\n新ブランドは3つの要素でできている。1つ目のAIエージェントは工場の運営やスタッフの業務を支え、人を減らすのではなく人の力を生かす「Proactive」な運用への転換をうたう。2つ目のフィジカルAIは、環境の変化に応じた機械やロボットの動作を支え、変化のある現場でも安全を確保しながら装置の自律稼働と自律制御を実現するとしている。3つ目のSerendie Automation MAPsは、データをAIの活用へつなぐ共創基盤で、ブランドの中核として、AIアプリの提供、利用者と供給者の共創、データ基盤づくりの場になるという。パートナー制度も、従来の「e-F@ctory Alliance」を「Serendie Automation Partners」に改め、「AI・テクノロジー」「ソリューション」「インテグレーション」の3つの区分を設ける。\n\n【ポイント・注意点】\n同社は2026年7月にソニーセミコンダクタソリューションズと、製造現場の自動化と無人化を支える新会社の設立も発表している。今回はブランドと構想の発表で、個々の製品やサービスの価格、提供時期は記事では示されていない。今後どの機能がいつ使えるのかを見ていく必要がある。","2026-11-18","ビジネス＋IT（Yahoo!ニュース）","https://news.yahoo.co.jp/articles/e76d8109871aa538112dc03eb29ab6a1bce4817e"],["JIMTOF視察記、工作機械各社の生成AIは「売った後」へ","マクニカは2026年11月18日、JIMTOF2026の視察記を公開した。工作機械各社のアフターサービスと生成AIの展示に絞り、マザック、DMG森精機、ブラザー、ファナック、スター精密など12社を比べている。マニュアルを読ませたAIで問い合わせ対応を短期間で作れるようになった一方、執筆者が見た範囲で生成AIのサービスを出していたのはDMG森精機だけだった。回答のばらつきや顧客ごとの知識の扱いを課題に挙げている。","\n【概要】\n技術商社のマクニカは2026年11月18日、2026年10月26日から31日に東京ビッグサイトで開かれた「JIMTOF2026（第33回日本国際工作機械見本市）」の視察記を公開した。世界22か国・地域の1,134社が出展したなかで、装置メーカーのアフターサービスと顧客支援でのデジタル活用、とくに生成AIの展示に絞って各社の説明をまとめている。\n\n【背景】\n記事によれば、汎用の精度では中国や台湾のメーカーが迫り、機械単体の性能で差をつけにくくなっている。そのため、買った後の使いやすさが問われるようになった。マニュアルや取扱説明書、部品表をAIに読ませれば、問い合わせへの対応や知識の検索を短期間で作れるようになったことも、各社の展示を後押ししている。\n\n【詳細】\nヤマザキマザックは顧客向けクラウド「Mazak iCONNECT」の問い合わせ欄にAIエージェントを載せ、11月中旬ごろに無償で提供する予定とされた。DMG森精機は顧客向けポータル「my DMG MORI」のAI「Service Agent」を展示し、追加料金なしで使える。ブラザー工業は「SPEEDIO」の運用を支えるAIチャット付きのWebサービスを参考出展した。芝浦機械はAIアシスタント「LEO」を2027年春にまず米国で出す予定だ。ファナックは「フィジカルAI CNC」としてMCPサーバーを展示し、手描きの絵をAIが清書してGコードにし、模擬で確かめる流れをチャットから実行した。3D CADデータと素材寸法から工程を自動で作る対話型の機能は2027年8月末に出す予定という。スター精密の会話型ソフト「PU Advance」は15万円の買い切りだ。\n\n【ポイント・注意点】\n執筆者が見た範囲で生成AIの顧客支援サービスをすでに出していたのはDMG森精機だけで、多くは参考出展か来年以降の予定だった。工業製品では毎回同じ答えが返ることが前提になるため、回答のばらつきが課題とされる。顧客ごとの機械や履歴の知識をどう生かすか、AIチャット単体では売りにくいという商売の形も論点に挙がった。記事は展示と説明員の話に基づくもので、各社の正式な発表と異なる場合があると断っている。","2026-11-18","マクニカ","https://www.macnica.co.jp/business/ai_iot/columns/150752/"],["Google、ロボットアームをAIで立ち上げるプラグイン公開","FabSceneによると、Googleは2026年11月17日、開発ツール「Google Antigravity」向けに、ロボットアームの立ち上げと制御をAIエージェントに任せる「Robotics」プラグインを公開した。対象は安価な6軸アーム「SO-ARM101」など3機種で、コードはApache License 2.0で公開。YAMと深度カメラの立ち上げは約10分で済んだという。利用にはGoogle AI ProかUltraの契約が必要になる。","\n【概要】\n電子工作とものづくりのメディアFabSceneは2026年11月18日、Googleが11月17日に開発ツール「Google Antigravity」向けの「Robotics」プラグインを公開したと報じた。ロボットアームの立ち上げと制御をAIエージェントに任せるもので、対象は安価な6軸アーム「SO-ARM101」、I2RTの「YAM」、Frankaの「FR3 Duo」の3機種。コードはApache License 2.0のもとでGitHubに公開されている。\n\n【背景】\nロボットアームを動かすには、ドライバーの導入やカメラの認識、校正といった下準備が欠かせず、個人の工作では最初の壁になりやすい。CNCや3Dプリンターと同じく、机の上で使える機械をAIの助けで扱いやすくする動きが広がっており、今回のプラグインもその一つといえる。\n\n【詳細】\nプラグインは4種類のスキルで構成される。立ち上げのスキルはドライバーの導入、カメラの検出、アームの校正、動作の確認を行う。シミュレーションのスキルは物理シミュレーター「MuJoCo」で作業の環境を作り、実機の前に検証する。制御のスキルはGeminiの空間認識で物体を見つけ、カメラの映像を見ながらアームを動かす。アプリ作成のスキルは、制御用のソフトやシミュレーションをまとめて作る。Googleの例では、YAMと深度カメラの立ち上げが約10分で終わった。別の例では、コンベヤーの菓子を箱に仕分ける作業をMuJoCoで確かめ、実機で約1時間安定して動かしたという。プラグインは、前の週に発表された「Gemini 4 Hydrogen」で使うことを想定している。外部の評価では8つの作業で58点を取り、より安いトークン単価で「Gemini 4 Argon」と同じ程度の成績だったとされる。\n\n【ポイント・注意点】\n使うには有料の「Google AI Pro」か「Google AI Ultra」の契約が必要で、画像認識のスキルにはGemini APIのキーも要る。READMEでは、ロボットのそばを離れず、すぐに電源を切れる状態にしておくよう注意を促している。CNCではなくロボットアーム向けの話だが、AIに機械の準備と制御を任せる際の手順や安全の考え方は、工作機械の自動化にも通じる部分がある。","2026-11-18","FabScene","https://fabscene.com/new/news/google-antigravity-robotics-plugin-so-arm101-mujoco/"],["ファナック米国、CNCでのAI活用の構想を動画で紹介","英MTDCNCは2026年11月16日、ファナック・アメリカのPaul Lee氏に聞いた動画記事を公開した。会話の指示からCNCのプログラムを作る、加工条件を仮想で試す、機械のエラーの原因を突き止めるといったAIの使い道を紹介し、AIを作業者の「副操縦士」として試行錯誤を減らすものと位置づけている。ただし記事は、これらの技術はまだ商用で使えない可能性があると断っており、数値や仕組みの詳細は示していない。","\n【概要】\n英国の加工系メディアMTDCNCは2026年11月16日、「AIは製造業を根本から変えられるか」と題した動画記事を公開した。同社のClinton Perry氏が、ファナック・アメリカのPaul Lee氏にAIの使い道を聞いたもので、会話の指示からCNCのプログラムを作ること、加工条件を仮想で試すこと、機械のエラーの原因を突き止めることなどが挙げられている。\n\n【背景】\nファナックは2026年10月のJIMTOF2026で、生成AIとCNC（数値制御装置）を連携させる「フィジカルAI CNC」を掲げ、各社の注目を集めた。CNCの世界では、条件出しの試行錯誤や、アラームが出たときの原因探しに熟練者の経験が欠かせず、人手不足のなかでそれをどう補うかが課題になっている。今回の動画は、その方向性を米国の担当者の言葉で説明したものだ。\n\n【詳細】\n記事は、AIを作業者の「副操縦士」と位置づけ、試行錯誤を減らし、よりよい判断を助けるものだと説明している。挙げられた使い道は、会話の形の指示からCNCのプログラムを作る、加工のパラメーターを仮想の環境で試す、機械のエラーの原因を特定するといったものだ。Lee氏は「私たちが開発するものは、基本的に、制御装置に何ができて、すべてが何を意味するのかを理解している技術になる」と話している。記事の冒頭では、仕上げ面の予測、衝突の防止、サイクルタイムの最適化といった姿も描かれているが、これは実演された機能ではなく、思い描く未来として示されている。\n\n【ポイント・注意点】\n記事は、これらの技術は「まだ商用で使えない可能性がある」と明記している。数値や性能の比較、仕組みの説明は含まれておらず、短い要約と動画の紹介にとどまる。そのため、どの機能がいつ、どの制御装置で使えるようになるのかは分からない。会話でプログラムを作る機能は便利に聞こえるが、実機に送る前に人が確かめる手順がどう組み込まれるのかも、今後の発表で確かめたい点だ。試行錯誤を減らすという狙いが、実際の現場でどこまで効くかも注目される。","2026-11-16","MTDCNC","https://mtdcnc.com/event/fanuc-europe/can-ai-radically-change-manufacturing-fanuc-shows-what-could-be-next/"],["ブラザー、工作機械にAIチャット　年度内の提供目指す","中部経済新聞は2026年11月14日、ブラザー工業が工作機械の利用者向けWebサービスの一つとしてAIチャットを始めると報じた。機械のマニュアルやコールセンターの対応の知見をもとに、問い合わせに最適な答えを自動で示す。早ければ年度内に開発を終え、検証を経て出す方針。トラブル時の生産停止を短くする狙いで、10月の工作機械見本市で開発中のサービスを紹介した。将来はAIが最適化を提案するサービスも目指す。","\n【概要】\n中部経済新聞は2026年11月14日、名古屋に本社を置くブラザー工業が、工作機械の利用者向けWebサービスの一つとして、人工知能（AI）によるチャットサービスを始めると報じた。利用者からの問い合わせに対し、工作機械のマニュアルやコールセンターでの対応の知見をもとに、最適な答えを自動で示す。早ければ年度内に開発を終え、検証を経てから提供する方針だという。\n\n【背景】\n工作機械の現場では、熟練者をはじめとする人手の不足が深刻になっている。これまでは、トラブルが起きるとオペレーターがマニュアルから当てはまる箇所を探して読み解く必要があり、その手間が大きかった。ブラザーは、AIのチャットで問題を円滑に解決できるよう支えることを狙う。10月に東京で開かれた工作機械の大規模な見本市にブースを出し、開発中のこのサービスを紹介した。\n\n【詳細】\n工作機械事業を担当する常務執行役員の寺倉達雄氏は「生成AIの進化で、問われたことに対して、われわれが持つ取扱説明書やマニュアル、故障時の対応ノウハウを正確に自動で回答できるようになってきた」と話している。AIのチャットによって、加工や機械のトラブルで生産が止まる時間を短くし、生産性の向上につなげる考えだ。同社のサービスは、機械の稼働の状況を離れた場所から監視して解析する機能をすでに備えている。将来は、機械の状態を見ながらAIが最適化を提案するサービスの提供を目指すという。記事の写真では、AIチャットサービスを始める予定の機械として工作機械「SPEEDIO」が紹介されている。\n\n【ポイント・注意点】\n提供の時期は「早ければ年度内に開発を終える」とされており、実際に使えるのは検証の後になる。料金や対応する機種の範囲は記事では示されていない。工作機械の分野では生成AIで問い合わせに答えるサービスの展示が相次いでいるが、毎回同じ正確な答えを返せるかが実用の鍵になる。取扱説明書の知識をもとに答える仕組みのため、個々の利用者の機械や履歴をどこまで反映できるかも今後の論点になる。導入を考える利用者は、正式な提供の発表を待って中身を確かめたい。","2026-11-14","中部経済新聞","https://www.chukei-news.co.jp/news/2026/11/14/OK0002611140101_01/"]],"cricut":[["感謝祭の食卓をCricutで！席札・マット・ランナー案","Cricut公式ブログが11月19日、感謝祭の食卓を手作り小物で整える記事を公開した。席札、ランチョンマット、テーブルランナー、ナプキンリング、グラスタグを、葉やかぼちゃ、七面鳥といった一つのモチーフでそろえるのが基本の考え方だ。6段階のセッティング手順、素材ごとの使い分け、Design Spaceでの設定のコツまでまとめており、手持ちの食器や布を生かして統一感のある食卓を作りたい人に役立つ内容になっている。","\n【概要】\nCricut公式ブログは11月19日、Beth Baty氏による記事を公開した。感謝祭の食卓に置く席札、ランチョンマット、テーブルランナー、ナプキンリング、グラスタグをCricutで作るアイデア集だ。手持ちの食器やリネンを生かしながら、葉・かぼちゃ・七面鳥など一つのモチーフを繰り返して統一感を出すことを勧めている。\n\n【背景】\n感謝祭は家族や友人が一つの食卓を囲む行事で、席の案内や飾りの準備が欠かせない。記事はまず1席に1つの小物を作り、時間があれば足していく進め方を示し、2〜3点をそろえれば雰囲気は十分に出ると説明している。\n\n【詳細】\nテーブルの整え方は6段階で、ランナーかクロスを敷き、マットと皿、カトラリーとナプキン、グラスとタグ、席札、最後にセンターピースの順に置いていく。席札は折ったカード型や葉の形、かぼちゃ形などを紹介。マットは布にアイロン接着シートで柄を貼る方法と、紙で切る方法がある。子ども席向けには七面鳥や三目並べ、「感謝していること」を書く欄の付いた塗り絵マットも挙げている。スタイル例は木や麻を使う素朴な雰囲気、白い布と緑のファームハウス風、白いかぼちゃと金を合わせた青と白の3つだ。素材は、カードストックが席札やナプキン帯、布ものにはアイロン接着シート、グラスなど滑らかな面には永久粘着ビニールを使う。薄い木材を切ったり彫ったりするにはCricut Makerが必要になる。ナプキンリングは葉を付けたカードストックの帯、グラスタグは脚付きグラスに差し込む切り込み入りの形で、食後の楽しみとしてMardoodles Companyの感謝祭用フォトブース小道具も挙げている。\n\n【ポイント・注意点】\nDesign Spaceでは、名前の文字を「Draw」にしてアタッチで固定し、折り目にはスコア線を入れる。アイロン接着素材はカット前にミラーをオンにする。布のマットやランナーでは、皿で隠れないよう文字を端寄りに置くとよい。グラスのデカールは縁より下に貼り、口が触れる部分を避ける。大人用の布マットは12×18インチの長方形が出発点の目安だが、先に卓と皿の寸法を測るよう勧めている。","2026-11-19","Cricut公式ブログ","https://cricut.com/blog/thanksgiving-crafts-with-cricut/"],["Silhouette Studioだけで写真の背景を消す2つの方法","Silhouette Schoolは11月19日、Silhouette Studioだけで写真の背景を取り除く2つの方法を紹介した。Photoshopなど別のアプリは使わない。背景との明暗差がはっきりした写真は「トレースして切り離す」機能で一気に処理し、背景が込み入った写真は曲線ツールで輪郭をなぞって切り抜く。大きな顔の切り抜きやフォトブース用の小道具、自作ステッカーなど、形に沿って切る作品全般に応用できる手順だ。","\n【概要】\nSilhouette Schoolは11月19日、Silhouette Studioの中だけで写真の背景を取り除く手順を2通り紹介した。PhotoshopやCanvaなど外部アプリは使わず、写真の性質に合わせて方法を選ぶのが要点だ。\n\n【背景】\n筆者はこの技を、イベントで使う大きな顔の切り抜きに使っている。ただ、フォトブースの小道具や自作ステッカーなど、被写体の形に沿って切る作品なら何にでも使えると説明している。本文に必須のソフト版は書かれていないが、画像のタグには「Silhouette Studio V4.4」とある。\n\n【詳細】\n方法1は「トレースして切り離す」。白い壁の前に立つ人物のように、被写体と背景の明暗差がはっきりした写真に向く。画像を開いてトレースパネルを出し、しきい値のバーを動かして被写体が塗りつぶされた状態にする。被写体の外に黄色が出ると余分なカット線ができるので避ける。「トレースして切り離す」を押すとトレースが消えたように見えるが、実際には被写体の周りにカット線ができ、背景から切り離されている。あとは不要な背景を引きはがせばよい。筆者の例では、頭部しか使わないため頭だけをトレースした。\n方法2は「曲線を描く」ツールを使う。背景がごちゃついている写真や、明暗差が小さい写真向けだ。被写体の外周をクリックして点を打ちながら一周し、始点に戻って閉じた図形にする。髪やあご、耳の周りは特に丁寧に進める。描いた線と元画像を両方選び、右側の「Modify」パネルで「Crop」を押すと、線の外側が消えて背景が透明になる。\n\n【ポイント・注意点】\nどちらを使うかは写真の明暗差と背景の複雑さで決める。トレース方式は、しきい値をきれいに合わせることが仕上がりを左右する。曲線方式では、髪やあごの周りにゆっくり点を置くほど輪郭がきれいになる。切り抜いた後に画像をダブルクリックすると点の編集画面が開き、縁を手で直せる。筆者もあご付近の点を動かして黒い縁を消していた。外部のアプリを行き来せず、作業が1つのソフトで完結するのも利点だ。","2026-11-19","Silhouette School","https://www.silhouetteschoolblog.com/2026/04/how-to-remove-background-in-silhouette.html"],["Cricut幹部が1万株売却、株価は52週高値付近","Investing.comは11月19日、Cricutの主席会計責任者ライアン・ハーマー氏が11月16日にクラスA普通株1万株を1株8.70ドル、総額8万7000ドルで売却したと報じた。同社株は52週高値9.70ドルに近い水準で、過去1年で95%上昇している。記事は第3四半期決算が市場予想を上回ったことにも触れており、新製品の投入と海外市場の成長で売上が再び伸びに転じたと伝えている。","\n【概要】\n投資情報サイトのInvesting.comは11月19日、カッティングマシン大手Cricut（NASDAQ: CRCT）の主席会計責任者ライアン・ハーマー氏が、11月16日に同社のクラスA普通株1万株を売却したと報じた。売却価格は1株8.70ドルで、総額は8万7000ドルになる。\n\n【背景】\n記事によると、Cricutの株価は52週高値の9.70ドルに近い水準にあり、過去1年で95%上昇した。Cricut Maker 5の発売など新製品が続くなか、同社の業績や株価に関心を持つ制作者や小規模事業者もいる。記事はAIの支援で作成され、編集者が確認したと明記している。\n\n【詳細】\n同じ11月16日には、ハーマー氏の納税に充てるため、同社がクラスA株1776株を源泉徴収した。評価額は1株8.65ドル、総額1万5362ドルで、2024年12月19日に付与された譲渡制限付き株式ユニット（RSU）の権利確定に伴うものだ。一連の取引の後、ハーマー氏が直接保有するクラスA株は30万2652株になる。記事は直近のニュースとして第3四半期決算も取り上げている。1株利益は0.13ドルで、アナリスト予想の0.05ドルを約160%上回った。売上高は1億8860万ドルで、予想の1億6436万ドルを約14.75%上回った。同社はこの結果を新製品の投入と海外市場の成長によるものとし、売上が再び伸びに転じたと説明している。投資家はこれらを好意的に受け止めているという。\n\n【ポイント・注意点】\nInvesting.comの分析ツールInvestingProは、同社株が適正価値に比べて「割高」に見えると評価している。さらに12件の分析の要点を有料会員向けに用意しているという。ページ上の株価表示には-3.74%という変化率が出ているが、いつ時点の数字かは書かれていない。幹部の株式売却には、今回のように納税や報酬制度に伴うものも含まれる。売却という事実だけで会社の見通しを判断しないほうがよい。投資判断に使う場合は、会社の開示資料を直接確かめたい。","2026-11-19","Investing.com","https://www.investing.com/news/insider-trading-news/cricut-principal-accounting-officer-sells-87000-in-stock-93CH-5037892"],["xTool Omniで1回の印刷に複数のUVインク設定","Silhouette Schoolは11月18日、UVフラットベッドプリンターのxTool Omniで、1回の印刷ジョブに異なるインクモードを組み合わせる方法を解説した。xTool Studioは独自のインクモード作成に公式には対応していないが、レイヤーを重ねれば実現できる。陶器タイルに高光沢のニスを厚く乗せる手順と、透明アクリルの表と裏に別々の絵柄を刷る手順の2つを紹介している。","\n【概要】\nSilhouette Schoolは11月18日、xTool Omni（O1 Omni）でインクモードを組み合わせて刷る方法を紹介した。デュアルヘッドのUVフラットベッドプリンターで、1回の印刷ジョブの中に複数のインク設定を混ぜて使う。\n\n【背景】\nOmniには、白い素材向けの「カラーのみ」、白の上に色を刷る「白＋カラー」、透明アクリルの裏から見せる「カラー＋白」、凹凸を出す「Flat Raised」系などのモードがある。ただしFlat Raisedではインクごとの層の数を変えられない。xTool Studioは独自のインクモード作成に公式には対応していないが、筆者はレイヤーを重ねれば実現できるとしている。\n\n【詳細】\n陶器タイルに高光沢のニスを乗せる手順はこうだ。まずUVフラットベッドモードに切り替えて台をスキャンし、素材の位置を確かめる。デザインを読み込んで素材に合わせ、位置合わせにはスマートマスクも使える。デザインを選んでインクモードを「Flat Raised: 白＋カラー＋ニス（光沢）」にし、出てくるポップアップは設定項目がないので無視する。次にデザインを複製し、上に重なった複製だけを選んでモードを「ニス（光沢）」、層の数を2にする。画面右下に重なったレイヤーが表示されれば、それが独自のインクモードになる。両面印刷では、「カラー＋白」と「白＋カラー」の2層を同じ素材の上に正確に重ねる。こうすると白が中央に挟まり、表と裏のどちらから見ても文字が左右反転しない。\n\n【ポイント・注意点】\n陶器のように細かい穴のある素材は、光沢ニスの下に空気が入りやすい。Flat Raisedモードの厚い白の下地がこれを防ぐ。既定より多くニスを重ねると、ガラスのような強い光沢が出る。筆者の陶器コースターは2層のニスで仕上げた。両面印刷はレイヤーのまとめ方を誤るとプレビューの見え方がおかしくなるので注意が要る。会員制のSilhouette Uでは課題50.2として3回シリーズで扱い、レーザーでのアクリル切り出しや、1枚ずつ名前と番号を入れる方法も解説している。","2026-11-18","Silhouette School","https://www.silhouetteschoolblog.com/2026/11/how-to-print-different-uv-ink-modes-in.html"],["自宅でビニールTシャツ作り、必要な道具を総点検","Silhouette Americaの公式ブログは11月18日、自宅でビニールTシャツを作るのに必要な道具をまとめた記事を公開した。衣類には看板用の粘着ビニールではなくアイロン転写用のHTVを使うことを強調し、カッティングマシン、刃、マット、除去ツール、加熱プレスなど基本の8点を挙げている。初心者と上級者の装備の違い、7段階の作業の流れ、よくある失敗7つにも触れた入門ガイドだ。","\n【概要】\nSilhouette Americaの公式ブログは11月18日、Silhouetteのカッティングマシンで自宅でもTシャツを作れるよう、必要な道具を整理した記事を公開した。最も大事な点として、看板やデカール用の粘着ビニールは布に定着しないため、衣類には熱転写ビニール（HTV）を使うよう強調している。最初から全部をそろえる必要はないとも書いている。\n\n【背景】\nHTVには無地、ラメ、フロッキー、メタリック、運動着向けのストレッチなど種類が多く、それぞれ刃の深さや温度が異なる場合がある。どの機種がTシャツに最適という順位は付けておらず、道具の対応表へのリンクを示している。\n\n【詳細】\n基本の道具は、カッティングマシン、HTV、対応する刃、条件によって要るカッティングマット、余分なビニールを取る除去ツール、加熱プレスまたは家庭用アイロン、保護シートと耐熱の作業面、デザインと反転に使うSilhouette Studioの8点。これに無地のシャツが加わる。除去ツールはフック型だと「e」や「a」の内側など小さな部分を取りやすい。加熱プレスはアイロンより温度が安定し、圧も均一にかかる。ただし、すべてのHTVがアイロンに対応しているわけではない。Studioの基本版は無料だ。作業の流れは、デザインを作る、衣類に合うHTVを選ぶ、反転する、刃とマットを準備して試し切りする、カットして除去する、メーカーの指示どおりに圧着する、指定の段階で台紙をはがす、の7段階になる。\n\n【ポイント・注意点】\nよくある失敗として、粘着ビニールを買ってしまう、刃が合わない、生地を確かめない、どのHTVもアイロンで貼れると思い込む、高度な付属品を早く買いすぎる、不向きな台の上で圧着する、試し切りを省く、の7つを挙げている。生地の素材がHTVの仕様に合うか、洗濯表示も含めて事前に確かめたい。初心者には、マシン、対応する刃、無地HTV1本から始め、読みやすい書体の簡単なデザインを選ぶよう勧めている。なお、記事中の手順解説へのリンクはまだ未公開の仮置きだった。","2026-11-18","Silhouette America公式ブログ","https://www.silhouetteamerica.com/blog/post/tools-needed-to-make-vinyl-shirts-at-home"],["レトロなサンタのラベル、贈り物包装に無料SVG","SVG配布サイトのCrafty Crafterは11月18日、ミッドセンチュリー調のサンタのラベルを無料のSVGで公開した。「北極からの特別便」を思わせる赤と白の懐かしいデザインで、色ごとにレイヤーが分かれているため、ビニールでの色分けやスクリーン印刷のステンシルにも使える。ギフトタグやクッキー缶のラベル、マグのデカールなど贈り物まわりの作例が多く、個人利用に限り登録なしで入手できる。","\n【概要】\n無料のカットファイルを配布するCrafty Crafterは11月18日、「サンタのレトロラベル」のSVGを公開した。ミッドセンチュリー調の懐かしいクリスマスデザインで、赤と白の配色が多く、「北極」をテーマにした贈り物の包装を意識した作りになっている。\n\n【背景】\n伝統的なホリデーの雰囲気を好む人向けのデザインだ。レイヤーが分かれているので、ビニールで色を分けて貼ったり、スクリーン印刷のステンシルとして使ったりできる。プレビュー画像には「Vintage North Pole Special Delivery Label」という題が付いている。\n\n【詳細】\n主な形式はSVGで、どの大きさにしても線がぼやけないベクター形式だ。Silhouette Studioの標準版を使う人向けにDXF版にも触れており、上位のデザイナー版ならSVGをそのまま読み込める。対応機種としてCricut Joy、Maker、Exploreを挙げている。作例は、カードストックを重ねたギフトタグ、黒いシャツやキャンバス地に白いHTVを貼った布の袋、光沢のある永久粘着ビニールのマグ用デカール、クリスマスカードの封筒、手作りクッキー缶のラベル、木製オーナメントの裏板など。紙の作品には80lbのカードストック、精密用のカッティングマット、ボーンフォルダー、粘着の強い転写シートを、ビニールにはOracal 651、転写シート、スクレーパー、表面を拭くアルコールシートを勧めている。\n\n【ポイント・注意点】\nダウンロードした圧縮フォルダは、展開してからSVGを読み込む。素材に合わせて大きさを調整し、HTVを使うときはカット前に反転させる。サイト独自の「SVG Doctor」で、余分な点やレイヤーの不具合を事前に確かめるよう勧めている。ライセンスは個人利用に限られる。贈り物にする手作り品は作ってよいが、データの再販や再配布はできない。ページ内には完成品の販売を勧める段落もあり記述が一貫していないため、販売を考える場合は利用条件を直接確かめたい。","2026-11-18","Crafty Crafter","https://crafty-crafter.club/christmas/santa-retro-label-svg-for-cricut/"],["色を変える勇気！秋の祝福リースでスクラップ帳","カットファイル作家のLori Whitlockのブログに、「Fall Blessings Wreath」のカットファイルを使ったスクラップブックのページ作例が載った。リースの部品はすべてCricutで切り出し、紙の色に合わせて茶色の予定を黒に変えたのが見どころだ。葉や花をグレーのインクで縁取り、立体テープで浮かせて奥行きを出す。写真2枚と日記、エナメルドットで仕上げる流れを紹介している。","\n【概要】\nカットファイル作家のLori Whitlockのブログに、秋のリース「Fall Blessings Wreath」を使ったスクラップブックのページ作例が掲載された。投稿には11月18日と19日の2つの日付が並んでいる。部品はすべてCricutで切り出し、元のデザインとは違う配色に作り替えた点が見どころだ。\n\n【背景】\nこのカットファイルはLori Whitlockのショップと、Silhouette Design Storeで販売されている。用紙にはLori Whitlockが手がけたEcho Park社の「Chickens」コレクションを使った。作り手は、元の茶色を紙の色に合わせて黒に変えるのをためらったという。それでも紙から浮かんだイメージを信じて進めたと振り返っている。完成したページは、リースを中心に写真と文章を並べた秋の記録になっている。\n\n【詳細】\n手順は、まずリースの部品をすべてCricutで切り出し、リースの色を茶色から黒に変える。次に葉や花の縁を柔らかいグレーのインクで色付けし、先の細い液体のりで組み立てる。土台のリースを台紙に貼ったら、花や葉、どんぐりなどの一部の下に立体テープを入れて浮かせ、立体感を出す。最後に細部を足して全体の色をまとめる。ページは3×3インチの写真2枚、日記の文章、エナメルドット、ステッカーで仕上げた。必要な材料は、Chickensコレクションの用紙、グレーのインク、細口の液体のり、立体テープ、写真2枚、日記の文章、エナメルドット、ステッカーとされている。\n\n【ポイント・注意点】\n作り手は、決まった色にこだわらず思い切って変えてよいと助言している。途中の段階ではリースがハロウィンの飾りのように見えることがある。それでも最後の細部を加えると秋らしくまとまるので、途中で手を止めずに進めるのがコツだという。立体テープを使うと、平面のカットでもページに奥行きが出る。なお、カットファイルは有料で、Lori Whitlockのショップか Silhouette Design Storeで購入する必要がある。","2026-11-18","Lori Whitlock","https://loriwhitlock.com/fall-blessings-wreath-tutorial/"],["昇華タンブラーの型紙をソフトなしで最速印刷","Silhouette Schoolは11月16日、昇華転写用のタンブラー型紙をデザインソフトを開かずに印刷する方法を紹介した。完成済みの型紙ファイルをプレビューで開き、プリンター側のユーティリティーで用紙、向き、媒体、反転を設定するだけで済む。筆者のBrother SP-1では全体で約2分だった。ストレート型とテーパー型の取り違えや、反転設定の二重オンなど、つまずきやすい点にも触れている。","\n【概要】\nSilhouette Schoolは11月16日、昇華転写用のタンブラー型紙をすばやく印刷する方法を紹介した。Silhouette Studioなどのデザインソフトで大きさや位置を合わせずに、型紙ファイルから直接印刷する。筆者はこれを「文字どおり最速」の方法と呼んでいる。\n\n【背景】\n販売されているタンブラー用の型紙は、すでに寸法が整っているものが多い。筆者はSo Fontsyの秋柄の型紙を例に、20ozのストレート型タンブラーに合わせて実演した。プリンターは小型の昇華プリンターとしてリンクを示したBrother SP-1を使っている。Silhouette Studioで寸法を測ったり位置を合わせたりする手間を省けるのが、この方法の利点だ。作業はパソコンのプレビュー画面とプリンターの設定画面だけで進む。\n\n【詳細】\n手順は5つ。まず正しい型紙を選ぶ。多くのファイルはストレート型とテーパー型の両方があり、テーパー用をストレート型に使うと大きな白い隙間が残る。次にファイルをダウンロードして展開し、フォルダを開く。ファイルをダブルクリックしてプレビューを開き、「ファイル」から「プリント」を選ぶ。昇華プリンターを選ぶとプリンター独自のユーティリティーが開き、そこで設定を行う。確かめる項目は、用紙サイズ8.5×11インチ、型紙が縦に流れる縦向き、昇華転写紙向けの媒体の種類、品質は下書きでなければ標準、反転、透かしオフの6つだ。媒体はプリンター任せにせず自分で選ぶ。\n\n【ポイント・注意点】\n昇華転写は図柄を左右反転させる必要があるが、反転の項目は1つだけオンにする。2つオンにすると打ち消し合って元に戻ってしまう。メニューの名前はプリンターの機種やMacとWindowsで違う。フチなし印刷はすべての昇華プリンターにあるわけではないが、少し背が高いか太いタンブラーで白い隙間を防ぐのに役立つ。筆者はその設定場所をSilhouette Uの動画で解説しており、同サイトでは昇華の原価と価格を計算する無料の計算機も提供している。記事にはアフィリエイトリンクが含まれる。","2026-11-16","Silhouette School","https://www.silhouetteschoolblog.com/2026/11/the-fastest-way-to-print-sublimation.html"],["Cricutで木を切る！機種・刃・設定と写真オーナメント","Jennifer Makerは、Cricutで木材を切る方法を、写真入りの重ねオーナメント作りを通して解説した。バルサ材ならMaker系の機種とナイフブレード、薄い突き板ならMaker・Explore・Ventureとディープポイントブレードという組み合わせを整理している。材料設定、マットの選び方、テープでの固定、切れ残りの確かめ方まで、木を切るときに失敗しやすい点を具体的にまとめている。","\n【概要】\nクラフトブログのJennifer Makerは、Cricutで木を切る方法を解説する記事を公開した。ページには11月15日と16日の日付が並び、動画のプレミア公開は11月15日となっている。長方形、丸、四角の写真入り重ねオーナメントを作りながら、機種・刃・木材の組み合わせとDesign Spaceの設定を説明している。\n\n【背景】\n木材は紙やビニールと違い、何度も刃を往復させて切る必要がある。どの機種でどの木が切れるかも限られる。記事は、バルサ材はMaker系だけ、突き板はExploreやVentureでも切れると整理した。バスウッドは、このデザインの小さな穴をうまく切れないため勧めていない。\n\n【詳細】\nバルサ材（12×6インチ、厚さ1/16インチ）は、Maker系専用のナイフブレードとドライブハウジングで切る。筆者はCricut Maker 4を使った。木目のある厚みが魅力だが幅が6インチしかなく、層ごとに別のマットで切る。設定は、実際の厚さより厚い「Balsa - 3/32\"（2.4mm）」を圧力「既定」で選ぶ。往復回数と圧が増え、成功率が上がったという。Cricutの突き板（12×12インチ）は薄くしなやかで、ディープポイントブレードを使い「Natural Wood Veneer」を圧力「強め」で切る。オーナメントの2枚が1枚のマットに収まる。写真はPrint Then Cutで、塗り足しを付けて最高画質で印刷する。\n\n【ポイント・注意点】\n木には紫のStrongGripマット、ビニールや写真用紙には緑のStandardGripマットを使う。バルサは3〜9インチの目盛りの間に置き、見せたい面を下にして切る。四辺をマスキングテープで留めてブレイヤーでならし、白いスターホイールは右端に寄せて跡を防ぐ。マットを外す前に切れ具合を確かめ、切れていなければ同じ線でもう一度切る。初回はナイフブレードを校正する。切断には時間がかかるので、そばを離れずパソコンをスリープさせないこと。穴が小さくなりすぎるため、デザインは縮小しない。","2026-11-15","Jennifer Maker","https://jennifermaker.com/cutting-wood-with-cricut/"],["トナカイを積み上げた木！森の雰囲気の無料SVG","Crafty Crafterは11月15日、トナカイを積み重ねてクリスマスツリーの形にした無料SVG「Reindeer Christmas Tree」を公開した。伝統的な雰囲気に遊び心を加えたデザインで、線がすっきりしていて除去しやすいのが特徴だ。白いHTVのTシャツ、アクリルのオーナメント、金色のパジャマ、木の飾り板など6つの作例を挙げ、個人利用なら登録なしで入手できる。","\n【概要】\n無料SVG配布サイトのCrafty Crafterは11月15日、「Reindeer Christmas Tree」のカットファイルを公開した。プレビュー画像の題は「Reindeer Tower Christmas Tree」で、トナカイを塔のように積み上げてツリーに見立てた、森の雰囲気のあるデザインだ。\n\n【背景】\n伝統的なクリスマスの雰囲気に、現代的な遊び心を足したデザインと紹介されている。線がすっきりしているので幅広い素材や腕前に合い、細かいカットでも除去しやすいという。冬の飾りや衣類に、森の要素を加えたい人向けの素材だ。\n\n【詳細】\n形式はベクターのSVGで、拡大縮小しても画質が落ちない。Cricut Design SpaceとSilhouette Studioで使え、対応機種はCricut Joy、Maker、Exploreとされている。ダウンロードは圧縮フォルダなので、展開してから読み込む。作例は6つある。黒いTシャツに白のHTVを貼ってくっきりさせたもの、アクリルの素材に永久粘着ビニールを貼ったオーナメント、金色のメタリック・アイロン接着ビニールを使ったおそろいのパジャマ、光沢の永久粘着ビニールを貼ったマグやギフトボックス、緑と茶のビニールを重ねた木の飾り板、綿の布にHTVを圧着したティータオルだ。おすすめの材料には、ラメHTV、転写シート、曲面に重ねて貼るための道具、綿100%の無地素材、耐熱テープ、小さな部分用のミニ加熱プレスが挙がっている。\n\n【ポイント・注意点】\n色を変えたい場合はDesign Spaceでグループを解除する。素材に合わせて大きさを調整し、HTVではカット前に反転させる。マットに載せる素材ごとに切断設定を合わせることも必要だ。サイトの「SVG Doctor」で、余分な点やレイヤーの問題を事前に確かめるよう勧めている。ライセンスは個人利用に限られ、登録なしでダウンロードできる。贈り物など手作りの品を作るのはよいが、データそのものの再販や再配布はできない。","2026-11-15","Crafty Crafter","https://crafty-crafter.club/christmas/reindeer-christmas-tree-svg/"],["ミッキーのクリスマス柄、無料SVGで冬の小物作り","Crafty Crafterは11月14日、ミッキーをクリスマス仕様にした無料SVGを公開した。線がすっきりしていて初心者でも除去しやすいと紹介し、白いHTVのTシャツ、ココア用のマグ、アクリルのオーナメント、名前入りの靴下、窓のデカールなど7つの作例を挙げている。マグやオーナメントでは気泡を押し出す道具の使用を勧めている。個人利用なら登録なしで入手できる。","\n【概要】\n無料SVG配布サイトのCrafty Crafterは11月14日、ディズニーのミッキーをクリスマス風にしたカットファイルを公開した。おなじみのキャラクターと祝祭の雰囲気を組み合わせたデザインで、細かいビニールでも除去しやすいすっきりした線になっているという。\n\n【背景】\n冬の手作り小物は、家族おそろいの服や贈り物など作る機会が多い。人気キャラクターの柄は、服から食器、飾りまで使い道が広い。ファイルはGoogleドライブのリンクから圧縮フォルダで配布され、展開してから読み込む方式になっている。\n\n【詳細】\n形式はベクターのSVGで、大きさを変えても画質が落ちない。Cricut Joy、Maker、Exploreに対応し、Silhouette StudioからSilhouetteの機種でも使える。作例は、黒いTシャツに白いHTVを貼った季節のシャツ、光沢の永久粘着ビニールを貼ったココア用のマグ、透明なプラスチックやアクリルのオーナメント、下に名前を入れた靴下、カードストックのギフトタグ、12月の来客を迎える窓のデカール、クリスマスの朝のおそろいパジャマの7つ。布ものにはEasyWeedのHTV、綿のTシャツやキャンバス地のトート、耐熱テープ、ミニ加熱プレスを勧めている。マグやオーナメントには、光沢の永久粘着ビニール、陶器のマグ、転写シート、こすって圧着する道具を挙げている。\n\n【ポイント・注意点】\nDesign Spaceでは画像をアップロードしてからキャンバスに追加し、作品に合わせて大きさを調整する。HTVを使うときはプレビューで反転させる。布には耐熱テープ、細かいビニールには転写シートを使う。マグやオーナメントでは、こすって圧着する道具で気泡を押し出す。カットがうまくいかないときは、サイトのCricut切断設定ガイドを参照するよう案内している。ライセンスは個人利用のみで、登録なしで入手できる。贈り物の手作りはよいが、データの再販や再配布はできない。キャラクター柄なので、完成品を販売用に使うのは避けたい。","2026-11-14","Crafty Crafter","https://crafty-crafter.club/christmas/mickey-christmas-svg-for-cricut/"],["ホリデー映画好きに！映画鑑賞の夜を彩る無料SVG","Crafty Crafterは11月14日、心温まるホリデー映画をテーマにした無料SVG「Hallmark Christmas Movies」を公開した。太くはっきりした線で除去しやすく、映画の夜のおそろいの服やシークレットサンタの贈り物を想定している。ジャンパー、ステンレスの携帯タンブラー、マグ、トートバッグ、クッション、アクリルのオーナメントの6つの作例を挙げ、個人利用なら登録なしで入手できる。","\n【概要】\n無料SVG配布サイトのCrafty Crafterは11月14日、「Hallmark Christmas Movies SVG for Cricut」を公開した。ほっこりした気持ちになれるホリデー映画をテーマにしたデザインで、映画を観る夜のおそろいの服や、シークレットサンタの贈り物など季節の作品を想定している。\n\n【背景】\n年末は家族や友人と季節の映画を観る機会が増える。テーマ性のあるデザインは、こうした集まりの小物作りに向いている。ページでは、線が太くはっきりしているので初心者でも除去しやすいと説明している。季節の映画にちなんだ小物をそろえたい人に合う素材だ。\n\n【詳細】\n形式はベクターのSVGで、拡大縮小しても画質が落ちない。ダウンロードは圧縮フォルダで、展開してから読み込む。Cricut Design Spaceで使えるほか、Silhouette Studioではライブラリのメニューから読み込める。よくある質問では、Cricut Joy、Maker、Exploreに対応するとしている。作例は6つ。黒いTシャツに白いHTVを貼った季節のジャンパー、ステンレスに永久粘着ビニールを貼った携帯タンブラー、光沢の永久粘着ビニールを使った陶器のマグ、季節の市に持っていくトートバッグ、映画の一気見用の名前入りクッション、ラメHTVで飾ったアクリルのオーナメントだ。材料には、EasyWeedのHTV、耐熱テープ、光沢の永久粘着ビニール、耐水の粘着ビニール、転写シート、陶器や綿の無地素材を勧めている。\n\n【ポイント・注意点】\nカットの前に、貼る面に合わせて大きさを調整する。アイロン接着のHTVを使う場合は反転させる。サイトの「SVG Doctor」で余分な点やレイヤーの問題を確かめてから切るよう勧めている。ライセンスは個人の手作り向けで、登録は不要。贈り物などの手作り品は作れるが、データの再販や再配布はできない。タイトルに特定の放送局の名前が入っているので、完成品を売る場合は商標の扱いに気を付けたい。","2026-11-14","Crafty Crafter","https://crafty-crafter.club/christmas/hallmark-christmas-movies-svg/"],["パジャマのズボンに昇華転写、散らし柄で自分仕様","Jennifer Makerは、白いポリエステルのパジャマのズボンに冬柄のPNGを昇華転写する方法を紹介した。一つの柄を繰り返すのではなく、ポケットや縫い目、裾、ウエストにも小さな図柄を散らすのが特徴だ。印刷はGoogleドキュメントで行い、Cricut EasyPressとEasyPress Miniで1枚ずつ圧着する。ゴーストを防ぐテープ留めや、場所ごとの圧着のコツを詳しく説明している。","\n【概要】\nJennifer Makerは、白いパジャマのズボンを昇華転写で自分だけの柄にする方法を公開した。ページには11月13日と14日の日付が並び、動画のプレミア公開は11月13日だ。冬をテーマにした7種類の無料PNG（Design #860）を印刷し、ズボンのあちこちに散らして圧着する。\n\n【背景】\n昇華転写はポリエステルに色を染み込ませる技法で、記事は綿以外の素材としてポリエステル100%、または65%以上の混紡を挙げている。プリンターは昇華用に改造したEpson EcoTank ET-2800を使った。一つの柄を繰り返すのではなく、ポケット、縫い目、裾、ウエストにも個別の図柄を配置するのが特徴だ。\n\n【詳細】\n印刷はGoogleドキュメントで行う。縦向き、余白0.5インチ、用紙は昇華紙に合わせ、画像の縦横比を固定して大きさを変え、「テキストの折り返し」で自由に動かせるようにする。印刷設定は最高画質、マットフォト用紙、左右反転をオンにし、インクが乾くまで触らない。EasyPressは400°F（204°C）、40秒に設定し、Miniは「high」にする。図柄の周りに1/2インチ以上の白を残して切り、大きな図柄から並べて隙間を小さなもので埋め、配置を写真に撮っておく。前面は、プレス用パッドを差し込み、新しいカードストックを敷いて予備プレスし、図柄を下向きにしっかりテープで留めてから、肉屋紙をかぶせて40秒押す。ポケットは裏地との間に折ったカードストックを挟み、ゴムの入ったウエストには直接押し当てない。\n\n【ポイント・注意点】\n窓を開けて扇風機で換気し、生地は長く熱を持つので耐熱手袋を使う。大きな図柄と上部にはEasyPress、小さな図柄や下の方にはMiniを使い分ける。筆者は約7割をMiniで押した。インクの移りを防ぐため、カードストックと肉屋紙は毎回新しくする。ゴースト（にじみの二重像）を防ぐにはテープをきつく留め、プレスはまっすぐ持ち上げる。Lサイズでは大10・中20・小30ほどの図柄を使った。洗濯は24時間待ってから、裏返して冷水で洗う。","2026-11-13","Jennifer Maker","https://jennifermaker.com/personalize-pajama-pants/"]],"uv":[["ミマキ、大阪支店で4社合同展 最新UV機やグッズ市場セミナー","ミマキエンジニアリングは2026年11月19日、大阪支店（大阪府吹田市）で11月26日に開く4社合同展示会「BEYOND PRINTING ～印刷の枠を超えた、新たな可能性へ～」の案内を公開した。最新のUVプリンターやDTFプリンター、デジタルカッター、アパレルCADなどを紹介し、グッズ市場とDTFをテーマにした2つのセミナーも行う。申し込みはWebフォームで受け付け、セミナーは定員に達し次第締め切る。","\n【概要】\nミマキエンジニアリングは2026年11月19日、4社合同の展示会「BEYOND PRINTING ～印刷の枠を超えた、新たな可能性へ～」を大阪支店で開くと案内した。開催は11月26日（木）の10時から17時までで、会場は大阪府吹田市垂水町3-36-15の同社大阪支店2階である。最新のUVプリンター、DTFプリンター、デジタルカッター、アパレルCADなどを紹介するとしている。\n\n【背景】\nミマキはUVインクジェットプリンターを主力の一つとするメーカーで、各地の拠点で導入を考える事業者向けの展示や相談の場を設けている。今回の案内は「印刷の枠を超えた」という題のとおり、看板や印刷の領域に加え、グッズ制作やアパレルまでを視野に入れた構成になっている。UVプリンターを使った小ロットのグッズ制作に関心を持つ事業者にとっては、実機と周辺機器をまとめて確かめられる機会といえる。\n\n【詳細】\n当日は2つのセミナーが予定されている。10時から11時は「グッズ市場セミナー」で、講師はシンクイノベーション株式会社代表取締役の三輪直之氏。13時から14時は「DTFセミナー」で、講師は株式会社テルミ・エンタープライズ代表取締役の鎌田樹哉氏である。セミナーは定員に達し次第、受付を終了する。参加の申し込みは、案内ページにあるWebフォーム（Microsoft Forms）から行う。問い合わせ先は大阪支店（電話06-6388-8258、FAX06-6388-8265）。\n\n【ポイント・注意点】\n案内ページには「4社合同」と書かれているが、参加する4社の社名は載っていない。展示するUVプリンターの機種名も示されていないため、特定の機種を確かめたい場合は事前に大阪支店へ問い合わせるのが確実だ。セミナーは定員制のため、グッズ制作やDTFの話を聞きたい人は早めの申し込みが望ましい。UV機とDTF機、カッターを組み合わせたグッズ制作の流れを、一度に比べて見られる点が今回の展示会の特徴といえる。開催は1日だけなので、日程の確認も忘れずにしたい。","2026-11-19","ミマキエンジニアリング","https://japan.mimaki.com/news/event/entry-471685.html"],["オリジナルプリント.jp、UV印刷のハンドクリーム3種を提供","イメージ・マジックは2026年11月19日、オンデマンドプリントサービス「オリジナルプリント.jp」で、写真やイラスト、企業ロゴをフルカラーで印刷できるハンドクリーム全3種の提供を11月12日に始めたと発表した。印刷方式はUV硬化インクジェットで、100個入り1セットから注文でき、1個あたり税込886円からとしている。冬の記念品や販促品、クリエイターの物販などでの利用を見込む。","\n【概要】\n株式会社イメージ・マジック（東京都文京区、東証グロース上場）は2026年11月19日、オンデマンドプリントサービス「オリジナルプリント.jp」で、オリジナルデザインを印刷できるハンドクリーム全3種の提供を始めたと発表した。提供開始日は11月12日。印刷方式はUV硬化インクジェットプリントで、写真やイラスト、企業ロゴなどをフルカラーで印刷できる。\n\n【背景】\nUV硬化インクジェットは、インクに紫外線を当ててその場で硬化させる方式で、紙以外の容器や雑貨にも直接印刷しやすい。オリジナルプリント.jpは2,500種類以上のアイテムを扱い、1点からの小ロット注文にも対応するサービスである。今回の商品は、UVプリントの得意な「物への直接印刷」を、冬の季節需要に合わせた日用品に広げた例といえる。\n\n【詳細】\n商品はジャー容器30g（販売名IMハンドクリームJ30）、チューブ30g（IMハンドクリームT30）、チューブ50g（IMハンドクリームT50）の3種類。ジャー型は口が広く最後まで使い切りやすく、30gのチューブは持ち運びやすい大きさ、50gのチューブは日常使いやノベルティ、ギフト向けとしている。いずれも100個入り1セットから注文でき、価格はプリント代込みで1個あたり税込886円から。天然由来の保湿成分として、アルガンオイル、ホホバ種子油、スクワラン、ミツロウを配合した。入稿は商品ページの「デザインツール」から行い、専用ソフトがなくてもWeb上でデータを作り、仕上がりを確かめながら発注できる。\n\n【ポイント・注意点】\n用途として、販売品、販促品、ノベルティ、周年記念品、クリエイターの物販などを挙げている。最小ロットは100個のため、1点ものの記念品より、配布や販売を前提とした数量向けの商品である。発表には納期の記載がないため、イベントや年末の配布に合わせる場合は、注文前に所要日数を確認しておく必要がある。UVプリントの受託サービスが、化粧品のような消耗品にまで対象を広げている動きとして注目される。","2026-11-19","PR TIMES（イメージ・マジック）","https://prtimes.jp/main/html/rd/p/000000191.000085001.html"],["京都ステッカー、UVDTFステッカーで推し活グッズ 1枚から","ステッカー製作の京都ステッカーは2026年11月19日、UVDTFステッカーで推し活グッズを自作する方法を料金と仕様付きで紹介した。透明PETフィルムにUV硬化インクで印刷したステッカーを転写する方式で、UVプリンターを持たなくても1枚から注文できる。CMYKに白を加えたフルカラーで、50×50mmの10枚は税別1,080円から。食洗機約100回の自社テスト結果も示した。","\n【概要】\nステッカーと印刷物を手がける京都ステッカーは2026年11月19日、ブログ記事「【1枚から】UVDTFステッカーで推し活グッズを自作！料金と仕様」を公開した。UVDTFステッカーを使えば、UVプリンターを持っていなくても、スマホケースやタンブラーなどに自分のデザインを貼って推し活グッズを作れると説明している。注文は1枚から受け付ける。\n\n【背景】\nUVDTFは、透明なPETフィルムにUV硬化インクで印刷し、台紙をはがして対象物に押し付けたあと転写シートを取る方式である。UVプリンターで直接印刷するには機械が必要だが、UVDTFならステッカーを買って貼るだけで、立体物や曲面にもフルカラーの図柄を載せられる。小ロットのグッズ制作の手段として注目されている。\n\n【詳細】\n印刷はCMYKに白インクを加えたフチなしのフルカラーで、白を使うことで透明アクリルや暗い色の物にも色が映える。対応する素材はガラス、金属、プラスチック、木材、陶器で、円筒のようなゆるい曲面にも貼れる。金・銀、メタリック、箔、鏡面の表現には対応しない。料金は税別の参考価格で、50×50mmが10枚1,080円から、50枚4,200円から、100枚7,200円から。100×100mmは10枚2,700円から、50枚10,500円から、100枚18,000円から。税別1万円以上で送料無料、製作実績の掲載を許可すると10%引きになる。納期はデザイン確定と決済のあと、通常（無料）で2〜4営業日以内、特急（有料）で1〜2営業日以内に発送する。\n\n【ポイント・注意点】\n耐久性について、同社のテストでは家庭用食洗機で約100回洗っても剥がれなかったとしているが、デザインによっては剥がれる場合があるとも書いている。貼るときはスキージーでしっかり押さえ、洗う前に24〜72時間の定着期間を置くよう勧めている。入稿はPNGかJPGで、300DPI以上が推奨。料金はデータの種類や個別カットなどのオプションで変わるため、正確な額はWeb見積もりで確かめる必要がある。","2026-11-19","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/19/24006/"],["ミマキ、UV硬化インクジェットのフルカラー3D機「3DUJ-553MkII」","ミマキエンジニアリングは2026年11月17日、UV硬化インクジェット方式のフルカラー3Dプリンタ「3DUJ-553MkII」を発表し、独フランクフルトのFormnext 2026で世界初公開した。従来機「3DUJ-553」の後継で、色域の体積は従来機比で約1.4倍。造形物の内部用に新開発した低コストのインフィルインクや、次のジョブを自動で始めるスマートリレー機能を備える。販売開始は2027年春の予定。","\n【概要】\nミマキエンジニアリング（長野県東御市）は2026年11月17日、UV硬化インクジェット方式のフルカラー3Dプリンタ「3DUJ-553MkII」を発表した。従来機「3DUJ-553」の後継機で、11月17日に開幕したドイツ・フランクフルトの展示会「Formnext 2026」で世界初公開した。販売開始は2027年春の予定で、価格は発表に記載がない。\n\n【背景】\n同社は平面向けのUVインクジェットプリンターで知られるが、同じUV硬化インクジェットの技術を立体造形にも応用している。従来機は「1,000万色以上の色表現」を特長としてきた。今回はその色表現をさらに強め、あわせて造形にかかる費用を下げることを狙った。\n\n【詳細】\n色域の体積は、同社が指定した条件での比較で従来機の約1.4倍となった。鮮やかな色と深みのある濃い色を出せるようになり、ブランドカラーやキャラクター固有の色の再現性を高めた。木目、皮革調、カーボン柄、大理石調などの素材感や模様も再現できるという。新しく開発したインフィルインクは、造形物の内部を埋めるための低コストのインクで、外側のフルカラー表現は保ったまま、内部に従来のカラーインクを使わずに済む。内部の体積が大きい造形物ほど効果が大きい。スマートリレー機能では、次のジョブをあらかじめ予約しておくと、今の造形が終わった後に自動で始まる。テーブル奥の空きスペースを使う仕組みのため、造形できる大きさは空き面積によって変わる。夜間など人がいない時間も稼働できる。\n\n【ポイント・注意点】\n想定する用途は、フィギュアやグッズ、製品の形や色、質感を確かめるモックアップ、デザイン検証や社内レビュー、顧客へのプレゼンテーション、大型模型、アート作品、インテリア装飾品など。必要な数だけ作ることで在庫の負担を抑えられるとしている。同社は2026年8月に3Dデータ修正ソフト「Mimaki 3D Print prep Pro ver2」をウェブサービスとして提供し始めており、データの準備から造形までを支える取り組みを進めている。","2026-11-17","ミマキエンジニアリング","https://japan.mimaki.com/news/product/entry-471548.html"],["新興Inkera、卓上のUVマテリアルジェッティング機「C1」","3Dプリンター新興のInkeraは、初の製品となる卓上フルカラー3Dプリンター「C1」をFormnext 2026で披露した。紫外線で硬化する液体材料を噴射して積み重ねるUVマテリアルジェッティング方式で、1,000万色以上を表現できるという。造形範囲は200×150×120mmで、CMYK、白、透明、サポート、特色の8つの材料チャンネルを持つ。商用販売は2027年第1四半期の予定で、価格は未定。","\n【概要】\n3Dプリンターの新興企業Inkeraは、最初の製品となる卓上フルカラー3Dプリンター「C1」を、ドイツ・フランクフルトで開かれた展示会Formnext 2026で披露した。米3DPrinting.comが2026年11月17日に報じた。方式はUVマテリアルジェッティングで、1,000万色以上の色で物を造形できるという。ブースはホール12.1のB11。\n\n【背景】\n色を噴射するタイプのフルカラー造形機は、高価で大きく複雑なため、これまで主に業務の現場に限られてきた。C1は、それを机の上で使えるようにすることを目指している。UVマテリアルジェッティングは、プリントヘッドから液体材料の小さな滴を出し、紫外線を当てて一層ずつ硬化させる方式で、UVインクジェットプリンターと同じ原理を立体に応用したものである。\n\n【詳細】\n造形範囲は200×150×120mm。材料チャンネルは8つで、シアン、マゼンタ、イエロー、ブラックのCMYKに、白、透明、サポート材、特色を加えた構成だ。特色のチャンネルは、CMYKの混色では出しにくい色に充てるもので、印刷のたびに色をそろえやすくする。色は材料と一緒に置かれるため、あとから塗るのではなく物そのものに色が入る。Inkeraは、プリントヘッド、UV硬化、インクの流れ、動作、スライス、サポート生成を連携させ、どの高さでも色と形を合わせる必要があると説明している。サポートは水に溶けるタイプで、顔や文字、細かい縁などの繊細な部分を守る。仕上げは不透明、ガラス調、光沢に対応する。\n\n【ポイント・注意点】\n用途として、個人向けのフィギュア、キャラクターモデル、ギフト、授業での制作、製品コンセプト、小ロットの試作を挙げ、クリエイターやデザイナー、スタジオ、教育関係者、小規模な製品チームを対象とする。同社CPOのHazel氏は、アーティストにとって「だいたい合っている」では十分ではないと述べた。商用販売は2027年第1四半期の予定で、価格と予約の詳細は後日発表される。現時点では価格が分からず、出荷前の製品である点に注意したい。","2026-11-17","3DPrinting.com","https://3dprinting.com/news/inkera-brings-full-color-uv-material-jetting-3d-printing-to-the-desktop-with-the-c1/"],["Soyang Europe、UVロール機LIYU Platinum PCTと内照布の組合せ","英国のメディア販売会社Soyang Europeは2026年11月17日、UVロールtoロールプリンター「LIYU Platinum PCT」と、自社の内照式向けテキスタイル「ST-601 RCY」の組み合わせを紹介した。最大3.2m幅の印刷で鮮やかな色と細部を出せるとし、ライトボックスや店舗ディスプレー、展示会グラフィック向けに提案する。布は環境負荷の低さも意識して開発したという。体験センターでの実演予約も受け付ける。","\n【概要】\n英国ランカシャーに拠点を置くSoyang Europeは2026年11月17日、UVロールtoロールプリンター「LIYU Platinum PCT」と、同社の内照式（バックリット）向けテキスタイル「ST-601 RCY」を組み合わせた事例を発表した。同社は、色の鮮やかさと、光を当てたときの見栄えの良さを大判ディスプレー市場に届けられるとしている。\n\n【背景】\nSoyang Europeは、デジタル印刷向けの広幅・超広幅メディアや表面材を製造・販売する会社で、倉庫には130万平方メートルを超える在庫を持ち、翌日配送に対応する。姉妹会社のSoyang Hardwareは、富士フイルム、リコー、ミマキ、Jetrixなどのブランドの印刷機材を扱う。今回の発表は、プリンターとメディアを組み合わせて提案する同社の売り方の一例である。\n\n【詳細】\nLIYU Platinum PCTは、最大3.2メートルの印刷幅で、正確で彩度の高い色と細かい描写を出せるとされ、大型のディスプレー制作に向く。ST-601 RCYと組み合わせると、一般的な内照式の素材よりもコントラストがはっきりし、見た目の迫力が増すと同社は主張している。光と色の関係を変える「一段の変化」とも表現した。ST-601 RCYは環境への配慮を意識して開発された布で、性能を保ちながら環境負荷の低い素材へ移る業界の流れを反映したものだという。商業面と環境面の両方の期待に応える組み合わせと位置付けている。\n\n【ポイント・注意点】\n想定する用途は、ライトボックス、小売店のディスプレー、展示会のグラフィックで、小売、イベント、ビジュアルマーチャンダイジングの事業者が、色の深みと耐久性の向上を得られるとしている。関心のある業界関係者は、Soyang Experience Centreで個別の実演を予約できる。なお、発表文には色の再現性や耐久性を示す具体的な数値は載っておらず、効果の説明は同社の主張にとどまる。導入を検討する場合は、実演で実物を確かめるのがよい。","2026-11-17","Texintel","https://texintel.com/press-room/soyang-11-26-ph-soyang-europe-unveils-striking-backlit-results-with-liyu-platinum-pct-and-st-601-rcy-textile-pairing"],["エプソン、C!Print Madrid 2027に出展 UV平台機V4000も","エプソンは、2027年1月12日から14日にスペインのIFEMA Madridで開かれる展示会「C!Print Madrid 2027」に出展すると発表した。英Texintelが2026年11月16日に伝えた。A3昇華転写機「SureColor F300」のスペイン初披露を目玉とし、省スペース向けのA1+サイズのUVフラットベッド機「SureColor V4000」やDTF機「SureColor G9000」も並べ、多素材のカスタマイズを提案する。","\n【概要】\nエプソンは、スペインの展示会「C!Print Madrid 2027」に出展すると明らかにした。英Texintelが2026年11月16日、マドリード発のエプソンのプレスリリースとして伝えた。会期は2027年1月12日から14日、会場はIFEMA Madrid。目玉は小型の昇華転写プリンター「SureColor F300」のスペイン初披露で、UVフラットベッドプリンター「SureColor V4000」も紹介する。\n\n【背景】\nC!Print Madridは、視覚コミュニケーション、テキスタイル印刷、パーソナライズを扱うスペインの主要な見本市である。エプソンは今回、テキスタイル、硬い素材、販促品、サインにまたがる「多素材のカスタマイズ」を全体のテーマに掲げ、短納期・中小ロットの生産を後押しする構えだ。UV機を含む複数の方式を一つのブースで見せる構成になっている。\n\n【詳細】\n展示機のうちUVプリンターはSureColor V4000で、A1+サイズのフラットベッド機である。設置場所が限られる企業向けに、生産性と省スペースを両立させる機種として紹介する。F300はA3の昇華転写機で、小規模事業者やサービス業者がA4からA3へ広げ、より大きな衣類や多様な品物に印刷できるようにする。SureColor G9000は高生産のDTF機で、綿、ポリエステル、ナイロン、混紡、革、硬い面への熱転写に使う。ブースは、実機の技術実演、個別の事業相談、来場者が仕上がりを確かめられる体験ゾーンの3つで構成する。\n\n【ポイント・注意点】\nエプソンの商業・産業印刷部門のビジネスマネージャー、Jordi Yagües氏は、業界はより機動的なモデルへ移っており「汎用性が差を生む」と述べた。来場者には、事業を自信と財務の安定を持って多角化する道具を見つけてほしいという。来場登録はC!Print Madridの公式サイトで受け付けている。今回の発表は新製品の発表ではなく出展の案内であり、V4000の価格や仕様の更新については触れていない点に注意したい。","2026-11-16","Texintel","https://www.texintel.com/press-room/epson-11-26-cmp-epson-reinforces-its-commitment-to-personalisation-at-cprint-madrid-2027"],["米Gadgeteer、2026年の卓上UVプリンター5選を公開","米ガジェットサイトThe Gadgeteerは2026年11月14日、卓上UVプリンターのおすすめ5機種を公開した。総合1位はxToolの「O1 Omni」、初めての1台にはeufyMakeの「E1」、スマホケースなど小物向けにはProcoloredの「V4」を推す。クラウドファンディング中のMorphoとHeyGears「G1X」も、出荷前の注意点を添えて取り上げた。用途ごとの選び方も示している。","\n【概要】\n米国のガジェット情報サイトThe Gadgeteerは2026年11月14日、Vincent Nguyen氏による記事「The 5 Best Desktop UV Printers to Buy in 2026」を公開した。卓上UVプリンター5機種を、価格や仕様とともに比べている。すでに買える3機種と、クラウドファンディング中の2機種を分けて紹介している点が特徴だ。\n\n【背景】\n卓上UVプリンターは、ここ1〜2年でメーカーの参入が相次ぎ、個人や小規模事業者が木や金属、アクリルなどに直接印刷してグッズを作れるようになった。一方で、機種ごとに印刷できる大きさや方式、インクの扱いが大きく異なり、出荷前のクラウドファンディング製品も多い。記事はこうした状況を踏まえた購入ガイドである。\n\n【詳細】\n総合1位はxTool O1 Omniで、ブラックフライデー価格は2,249ドルから（定価2,499ドル）。印刷面は330×420mm、高さ150mmまでの物に対応し、UV印刷、UV DTF、衣類向けのDTGやDTFまでこなす。重さは41.1kgで、エディションは工場出荷時に決まり後から変えられない。eufyMake E1は1,999ドル（Basic Bundleの定価2,409ドル）で、印刷面330×420mm、高さ100mmまで。白インクを最大5mm盛る立体表現が特徴だが、カートリッジは暗号チップ付きで、他社インクを使うと保証が切れる。Procolored V4は2,299ドルで、印刷範囲は120×170mmと小さいが、ボトル式のインクで運用費を抑えやすい。Morpho（late pledge 2,159ドル）は出荷時期の見直し中、HeyGears G1X（早期価格3,299ドル）はKickstarterで支援募集中である。\n\n【ポイント・注意点】\n記事は、多用途に売るならO1 Omni、初めてならE1、小物中心ならV4、密閉型の台と詰め替えインクを求めるならMorpho、色を重視して将来3D造形も考えるならG1Xを勧めている。MorphoとG1Xはまだ出荷されておらず、支援にはリスクが伴う。表示価格はセール期間中のもので、今後変わる可能性がある。インクの費用や保証の条件まで含めて比べることが大切だ。","2026-11-14","The Gadgeteer","https://the-gadgeteer.com/2026/11/14/the-5-best-desktop-uv-printers-to-buy-in-2026/"],["ミマキ欧州、ハイブリッドUV機UJ330H-160の各国の反応を紹介","ミマキの欧州法人は2026年11月13日、ロールtoロールと平台の両方に印刷できるハイブリッドUVプリンター「UJ330H-160」について、欧州の販売網の声をまとめた記事を公開した。英国では普通のドアから搬入できる小ささ、イタリアでは扱いにくいロール素材への対応、北欧では「真の平台」志向からハイブリッドへの変化が語られた。外注を減らし納期を縮めたい需要が背景にあるという。","\n【概要】\nミマキの欧州法人Mimaki Europeは2026年11月13日、記事「How Hybrid UV Printing Is Opening New Opportunities Across Europe」を公開した。数か月前に発売したハイブリッドUVプリンター「UJ330H-160」について、欧州各地の販売パートナーから聞いた見方をまとめている。UJ330H-160は、ロールtoロールと硬い板材（フラットベッド）の両方に1台で印刷できる機種である。\n\n【背景】\n記事によると、印刷事業者がハイブリッド機を選ぶ理由は、外注を減らすこと、納期を縮めること、扱える仕事を広げることにある。限られた床面積で多様な仕事をこなしたい看板・グラフィック業者にとって、1台で両方に対応できる点が評価されているという。\n\n【詳細】\n英国とアイルランドでは、販売代理店Hybrid ServicesのAndrew Edwards氏が、本体の小ささが最大の魅力だと述べた。標準的な片開きのドアからも搬入でき、「設置面積の小ささが人々をその気にさせた」という。用途には、厚めのマグネット素材の販促サインや、革やウインドーフィルムなどの繊細なロール素材がある。真空ベルト搬送のため、ピンチローラーの跡が残らない。イタリアでは独占輸入元BompanのRachele Bompan CEOが、市場は汎用性の高い技術による新しい用途を求めていると語り、他の機械では安定して送れない産業用ロール素材も扱えると説明した。ドイツ語圏ではMimaki DeutschlandのHisashi Takeuchi氏が、効率と床面積の最適化、投資価値を挙げた。\n\n【ポイント・注意点】\n北欧では、スウェーデンの販売店Color SystemsのMagnus Edfeldt氏が、約10年前は顧客の10人に9人ほどが「真のフラットベッド」を求めたが、最近はハイブリッドを求める客が増えたと話した。手頃な機種の登場で小規模な看板業者も買い手に加わっている。記事は、ハイブリッドUV印刷が専門的な選択肢から、柔軟性と自社生産を求める事業者の実用的な道具へ移りつつあると結んでいる。ただし内容は販売側の見方であり、導入の数や効果を示す数値は示されていない。","2026-11-13","Mimaki Europe","https://www.mimakieurope.com/news/hybrid-uv-printing-opportunities-europe/"]],"risk":[["給食で乳アレルギーの症状 栄養士が規格書を改ざん 板橋区","東京都板橋区教育委員会は11月17日、区立中学校で7月に乳製品のアレルギーがある生徒が給食後に体調不良を訴えた事故について、学校栄養士が食材の製品規格書の乳製品表示を修正テープで消し、改ざんして保護者に示していたと発表した。給食のウインナーに乳製品が含まれていた。教職員はエピペンを使わず経過観察にとどめており、区は規格書を複数人で照合することや、迷ったらエピペンを使う対応の徹底などを再発防止策に挙げた。","\n【概要】東京都板橋区教育委員会は2026年11月17日、区立中学校で起きた給食のアレルギー事故について、学校栄養士が食材納入業者の製品規格書を改ざんしていたと発表した。教育新聞が11月19日に報じた。乳製品のアレルギーがある生徒の給食に、乳製品を含むウインナー（チョリソー）が使われていた。\n\n【背景】事故は7月3日の午後1時過ぎに起きた。生徒は「気持ち悪い」と話し、飲み込みにくさを訴えて一人で保健室へ向かった。養護教諭はエピペンを用意したが使わず、経過を観察した。生徒は午後2時過ぎに授業へ戻ったものの再び体調不良を訴え、保健室が空いていなかったため別室で休み、社会のテストを受けてから帰宅した。\n\n【詳細】7月6日に保護者が来校し、給食に乳製品が入っていなかったか確認を求めた。学校栄養士が示した規格書は、アレルゲン欄の乳製品の表示を修正テープで消してコピーしたものだった。保護者が業者に直接確認して乳製品が入っていたことが分かり、改ざんが明らかになった。区によると、栄養士は規格書を手引きに基づいて書面で照合しておらず、乳製品は入っていないと思い込んでいた。年度途中の採用で、研修や支援も不十分だったという。栄養士は8月に退職した。教職員の側にも、給食がアレルギー除去食だという認識が強く、症状をアレルギーではないと思い込んでエピペンを使わなかった問題があったとされる。\n\n【ポイント・注意点】区は再発防止策として、発注時に必ず規格書を取り寄せて原材料を確認してから発注すること、規格書を複数の職員で照合すること、栄養士の採用時の研修内容と支援体制を見直すこと、判断に迷う場合でもエピペンを使い救急搬送するなどの対応を徹底することを挙げた。食物アレルギーのある子どもを学校に通わせる家庭では、給食の原材料を確認する手順や、症状が出たときに学校がどう動くのかを改めて確かめておきたい。エピペンは処方を受けた子どもの症状が出たときに使う薬であり、迷ったときに使わずにいることの危うさが改めて示された。家庭からも、主治医の指示や使う目安を学校と共有しておくとよい。","2026-11-19","教育新聞","https://kyobun.co.jp/article/2026111903"],["登校中の小学生 飲酒運転の車にはねられ軽傷 山形市","11月19日午前7時45分ごろ、山形市中桜田の市道の信号がある丁字路交差点で、道路を横断していた登校中の男子小学生が、右折しようとした乗用車にはねられた。男児は病院に運ばれたが、軽傷とみられ命に別条はない。運転していた50歳の会社員の男は、呼気1リットルあたり0.5ミリグラム以上のアルコールが検出され、酒酔い運転の疑いで現行犯逮捕された。男は出勤途中だったという。通学時間帯に起きた飲酒運転の事故として報じられた。","\n【概要】2026年11月19日午前7時45分ごろ、山形市中桜田の市道で、登校中の男子小学生1人が乗用車にはねられた。YBC山形放送が同日に伝えた。男児は病院に搬送されたが、軽傷とみられ、命に別条はないという。\n\n【背景】事故が起きたのは朝の通学時間帯で、現場は信号のある丁字路の交差点だった。乗用車は西に向かって右折しようとしたところ、道路を横断していた男児をはねたとみられている。通学路の交差点で、右左折してくる車と横断中の子どもが交わる場面での事故だった。\n\n【詳細】警察官が現場に着いた際、運転手から酒の臭いがしたため検査をしたところ、呼気から1リットルあたり0.5ミリグラム以上のアルコールが検出された。警察は、山形市平清水の会社員、高橋伸介容疑者（50）を酒酔い運転の疑いで現行犯逮捕した。容疑者は当時、出勤途中だったという。警察が事故の詳しい状況を調べている。朝の出勤時に酒が残ったまま、あるいは飲んだ状態でハンドルを握った車が、登校中の子どもの列に向かってきた形になる。\n\n【ポイント・注意点】今回は男児のけがが軽く済んだが、通学の時間帯は大人の通勤の時間帯とも重なる。子どもには、信号が青でも、横断歩道を渡る前と渡っている間に右左折してくる車がないかを確かめる習慣を、繰り返し伝えておきたい。運転する側は、前夜に飲んだ酒が翌朝まで残ることも含めて、飲酒したら運転しないことを徹底する必要がある。学校や地域では、交差点など危険な場所の見守りや、通学路の点検をあらためて見直すきっかけにしたい。家庭でも、子どもと一緒に実際の通学路を歩き、どの交差点で車が曲がってくるのか、どこで立ち止まって確認すればよいのかを話し合っておくと、具体的な注意につながる。今回の事故では、横断していた男児を右折の車がはねたとみられている。右折する車の運転手は対向車に気を取られ、横断歩道の歩行者を見落としやすいとされる。子どもには、車の運転手と目を合わせ、相手が止まったのを確かめてから渡るよう教えておくと、身を守る助けになる。","2026-11-19","Yahoo!ニュース（YBC山形放送）","https://news.yahoo.co.jp/articles/b6ffb60d589d7dd7dd67718550507922f4882eb4"],["岡山県内の小学校など6校でインフルとみられる集団風邪 72人","岡山県と岡山市、倉敷市は11月19日、県内の小学校や高校の計6校でインフルエンザとみられる集団風邪が発生し、患者は計72人にのぼったと発表した。対象は笠岡市の大井小、玉野市の田井小、新見市の塩城小、岡山市の幡多小と興陽高、倉敷市の西阿知小。各校は学年閉鎖や学級閉鎖を行い、最長で21日まで続く予定。学校での集団発生が相次ぐ時期となり、家庭でも体調の変化への目配りが求められる。","\n【概要】岡山県、岡山市、倉敷市は2026年11月19日、県内の6校でインフルエンザとみられる集団風邪が発生したと発表した。山陽新聞デジタルが同日伝えた。患者は計72人で、各校は学年閉鎖や学級閉鎖を行い、最長で21日まで続ける予定だ。\n\n【背景】発表は県と、保健所を設置する岡山市、倉敷市がそれぞれの所管分をまとめたもの。対象は小学校5校と高校1校で、子どもが集団で過ごす学校で同時に発生が報告された。学年・学級閉鎖は、学校の中で感染がさらに広がるのを抑えるための措置になる。\n\n【詳細】発生したのは、県の所管が笠岡市の大井小学校、玉野市の田井小学校、新見市の塩城小学校の3校。岡山市が幡多小学校と興陽高校の2校、倉敷市が西阿知小学校の1校だった。6校の患者は合わせて72人。学年閉鎖や学級閉鎖の期間は学校によって異なり、最も長いところで21日までとなっている。記事では、患者の具体的な症状や、入院した人がいるかどうかについては触れられていない。\n\n【ポイント・注意点】学年・学級閉鎖は、休みの間に外出を控えて回復と感染の広がりの抑制に充てるための措置であり、閉鎖中に人の多い場所へ出かけると、その意味が薄れてしまう。家庭では、子どもの発熱やせき、だるさなどの変化に早めに気づき、具合が悪いときは無理に登校させずに医療機関に相談したい。手洗いやせきエチケットといった基本的な対策を、家族全員で続けることも大切になる。同じ学校や近くの学校で閉鎖の知らせがあったときは、きょうだいの体調にも気を配り、登校の再開の時期については学校からの連絡を確かめたい。県や市の発表は、地域での流行の広がりを知る手がかりにもなる。集団生活の場では、一人の発症をきっかけに同じ学年や学級に広がりやすい。熱が下がったあとも、登校をいつから再開できるかは学校の決まりや医師の判断に従いたい。家族が看病するときは、タオルや食器を分けるなど、家の中での広がりを抑える工夫も役立つ。学校からの閉鎖の連絡や、県や市が出す流行の情報にも目を通しておきたい。","2026-11-19","Yahoo!ニュース（山陽新聞デジタル）","https://news.yahoo.co.jp/articles/730c9677f3fd29947a85c43ea53b2e43d316591f"],["米国はしか排除失う 「死亡率」知らない人が6割 世論調査","米国がはしか排除の認定を失ったなか、米アネンバーグ公共政策センターが11月6〜8日に成人1028人に行った調査で、はしかにかかった子どもがどのくらいの割合で亡くなるかを「分からない」と答えた人が59％に上った。MMRワクチンが自閉症を引き起こすという説を「誤り」と答えたのは64％で、17％は「正しい」と答えた。必要な接種回数を正しく2回と答えた人は34％にとどまり、病気とワクチンについての知識の穴が浮き彫りになった。","\n【概要】米アネンバーグ公共政策センターは、はしかとワクチンに関する成人の知識を調べた世論調査の結果を公表した。メディカル・エクスプレスが2026年11月19日に伝えた。米国がはしかの排除状態を失ったと発表されたばかりのなかで、病気の危険性やワクチンについての理解に大きな穴が残っていることが示された。\n\n【背景】汎米保健機構（PAHO）は11月17日、米国がはしかの排除の基準を満たさなくなったと発表した。米国は2000年からこの状態を保ってきた。米疾病対策センター（CDC）によると、2026年の確定患者は11月12日時点で5412人にのぼり、2025年の通年の2290人を大きく上回っている。\n\n【詳細】調査は11月6〜8日に成人1028人を対象に行われた。子ども向けのMMRなどのワクチンが自閉症を引き起こすという説について、64％が「誤り」、17％が「正しい」、19％が「分からない」と答えた。はしかにかかった子どもがどのくらいの割合で死亡するかについては59％が分からないと答え、最も近い「約1000人に1人」を選んだのは9％だった。CDCは死亡を1000人あたり1〜3人と見積もっている。子どもに必要なMMRの接種回数を正しく2回と答えたのは34％で、49％は分からないと答えた。CDCによると、有効性は1回で93％、2回で97％とされる。\n\n【ポイント・注意点】はしかは子どもの命に関わることがある感染症で、予防の中心は決められた回数の予防接種になる。調査は、重さや接種回数といった基本的な情報が十分に伝わっていない現状を示している。日本の家庭でも、母子健康手帳で子どもの接種歴を確かめ、受け忘れがあればかかりつけ医に相談しておきたい。海外への渡航を予定している場合も、事前の確認が大切になる。記事によると、米国の保健福祉長官が信頼できる公衆衛生の情報を出していると「確信していない」と答えた人は61％で、この割合は2025年2月から変わっていない。情報の受け取り方が揺れるなかで、正しい知識をどう届けるかも課題になっている。調査の誤差は信頼度95％でプラスマイナス3.5ポイントとされる。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-measles-status-knowledge-gaps-disease.html"],["米コロラド州でインフル入院が週157人 乳幼児の受診も多く","米コロラド州で11月14日までの1週間のインフルエンザによる入院が157人となり、前年同じ週の44人の3倍を超えた。今季は子ども1人の死亡が報告され、今季のワクチンを受けていない小学生の年代だった。10月の入院率は生後6か月未満で10万人あたり約12人、6か月〜4歳で約11人。5歳未満の救急受診のうちインフルが約4.8％を占め、大人の1％強を大きく上回る。生後6か月未満は接種できないため、周りの大人の接種が守りになる。","\n【概要】米コロラド州で、11月14日までの1週間のインフルエンザによる入院が157人に達した。メディカル・デイリーが2026年11月19日に伝えた。前年の同じ週の44人の3倍を超え、10月4日からの今季の累計は689人で、前年同時期の107人を大きく上回っている。\n\n【背景】コロラド州では昨季、子どものインフルエンザによる入院が過去最多の1169人にのぼり、8人の子どもが亡くなった。全体の入院は5931人で、12月27日までの週に855人の山を迎えた。今季は感謝祭を前にして、昨季を上回る速さで入院が増えている。\n\n【詳細】今季はこれまでに、子ども1人のインフルエンザによる死亡が報告された。デンバー都市圏の外に住む小学生の年代の子どもで、今季のワクチンを受けていなかった。10月の入院率は、生後6か月未満の乳児で10万人あたり約12人、6か月から4歳の子どもで約11人だった。5歳未満の子どもの救急受診のうち、インフルエンザは約4.8％を占め、大人の1％強を大きく上回る。直近の週の子どもの入院は前週の21人から16人に減った。型が分かった例では157件のうち156件がH1N1だった。新型コロナの入院は58人から87人に、RSウイルスは6人から15人に増えた。米疾病対策センター（CDC）は、今季の重さを全年齢で「低い」と評価している。\n\n【ポイント・注意点】生後6か月未満の赤ちゃんはインフルエンザのワクチンを受けられないため、親や祖父母、世話をする人が接種して周りから守ることが大切だと記事は伝えている。米国では対象の子どもが無料で接種を受けられる制度もある。乳幼児は救急受診が多い年代で、年末に向けて人が集まる機会が増える時期には、家族の体調管理と予防接種を早めに考えておきたい。今季の流行はH1N1が中心で、救急受診に占めるインフルエンザの割合は1.36％から1.76％に、検査で陽性となった割合は9.1％から10.4％に上がった。日本でも各地でインフルエンザの患者が増えており、子どもの発熱やぐったりした様子が続くときは早めに受診したい。","2026-11-19","Medical Daily","https://medicaldaily.com/colorado-flu-hospitalizations-157-week-november-2026-481441"],["乳児用バウンサーが使用中につぶれる恐れ 米国で約412台回収","米消費者製品安全委員会（CPSC）は11月19日、中国の事業者が「Kidsview」の名で米アマゾンで販売した乳児用バウンサー約412台のリコールを発表した。使用中につぶれて乳児がけがをする恐れがある。2022年8〜10月製造の品で、つぶれた報告が7件あり、うち2件は乳児の頭が床などに当たり、1人が受診した。CPSCは直ちに使用をやめ、販売元に連絡して返金を受けるよう呼びかけている。","\n【概要】米消費者製品安全委員会（CPSC）は2026年11月19日、乳児用バウンサー（揺れる椅子）約412台のリコールを発表した。使用中につぶれ、乳児がけがをする恐れがあるためだ。販売元は中国の事業者で、「Kidsview」の名で販売していた。\n\n【背景】対象はカーキ色の「Kidsview」の乳児用バウンサーで、動物のおもちゃをつり下げたバーが付いている。2022年8月、9月、10月に製造された品で、布の座面の裏に縫い付けられたラベルの日付が「2022/08」「2022/09」「2022/10」で始まるものが該当する。2022年8月から2023年11月まで米アマゾンで、60〜170ドルで売られた。製造は中国。\n\n【詳細】販売元には、使用中につぶれたという報告が7件寄せられた。このうち2件は、乳児の頭がその下の床などに当たったもので、1人の消費者が乳児に医療機関の診察を受けさせた。CPSCは消費者に対し、直ちに使用をやめて販売元に連絡するよう求めている。返金はアマゾンのギフトカードで行われる。手続きでは、日付のラベルを確認したうえで座面に油性ペンで「RECALLED」と書き、日付のラベルが見えるように写真を撮って、電子メールで送るよう案内している。\n\n【ポイント・注意点】バウンサーは、乳児を寝かせたり座らせたりして、大人が手を離す場面で使われることが多い道具だ。つぶれれば、首のすわっていない月齢の子どもが頭を打つことにもつながる。家庭で同じような品を使っている場合は、製品名や製造時期を確かめたい。海外の通販サイトで買った育児用品は、国内の回収情報には載らないことがあるため、販売国の当局の発表に目を通すことも役立つ。リコールの対象でなくても、床の上など落ちたり倒れたりしても危険が少ない場所で使い、乳児から目を離さないことが基本になる。今回は製造から数年がたった製品のリコールで、すでに使い終えて人に譲ったり、中古で手に入れたりした場合もありうる。お下がりやフリマで手に入れた育児用品は、製品名で回収情報を調べる習慣をつけておくと安心だ。","2026-11-19","米消費者製品安全委員会（CPSC）","https://www.cpsc.gov/Recalls/2027/Kidsview-Recalls-Infant-Bouncers-Due-to-Risk-of-Collapse-and-Impact-Injury-to-Infants"],["強力磁石が外れる恐れ ロボット型磁石おもちゃ約10万個回収","米消費者製品安全委員会（CPSC）は11月19日、ロボットの形をした磁石のおもちゃ約10万1282個のリコールを発表した。手足を引っ張って外すと強力な磁石が出てきて、子どもが飲み込む恐れがあり、おもちゃの義務基準にも違反している。飲み込んだ磁石同士が腸の壁を挟んでくっつくと、穴が開いたり腸がねじれたりして、命に関わることがある。けがの報告はないが、直ちに使用をやめ、子どもから遠ざけるよう求めている。","\n【概要】米消費者製品安全委員会（CPSC）は2026年11月19日、「CHE-US」のロボット型の磁石のおもちゃ約10万1282個のリコールを発表した。手足を引き離すと強力な磁石が出てきて、子どもが飲み込む恐れがあり、おもちゃの義務基準に違反している。\n\n【背景】対象はロボットの形をした磁石の棒人形で、5体または10体のセットで売られた。色は紫、青、黄、赤、緑。1体につき両手両足に1個ずつ、合わせて4個の小さな磁石が入っている。包装の裏には「X004N3MGCB」と印刷されている。2025年4月から2026年8月まで米アマゾンで9〜18ドルで販売された。販売元は中国の事業者で、製造も中国だ。\n\n【詳細】CPSCによると、強力な磁石を飲み込むと、磁石同士や金属の物と引き合って消化管の中にとどまることがある。その結果、腸に穴が開いたり、ねじれたり、詰まったりするほか、血液の感染（敗血症）を起こし、死亡につながるおそれがある。これまでにけがの報告はない。CPSCは消費者に対し、直ちに使用をやめて子どもの手の届かない所に置き、販売元に連絡するよう求めている。全額返金の手続きでは、おもちゃをごみに捨てた状態の写真を送ったうえで、処分するよう案内している。\n\n【ポイント・注意点】磁石は1個だけなら気付かれにくいが、2個以上を飲み込むと腸の壁を挟んでくっつくことがあり、外から見ても分かりにくい。磁石を使ったおもちゃが壊れたり、部品がなくなったりしていないか、ふだんから確かめたい。年上のきょうだいのおもちゃを小さな子どもが口に入れることもある。数が合わない、子どもが飲み込んだかもしれないと思ったときは、様子を見ずに医療機関に相談することが大切になる。今回のおもちゃは、1体に4個の磁石が入り、5体または10体のセットで売られていたため、1セットに20個から40個の磁石が含まれる計算になる。小さく光る磁石は、子どもがお菓子と間違えて口に入れることもある。片付けのときに数を数えるなど、なくなった磁石に早く気づける工夫も役立つ。","2026-11-19","米消費者製品安全委員会（CPSC）","https://www.cpsc.gov/Recalls/2027/CHE-US-Recalls-Magnetic-Robot-Toys-Due-to-Risk-of-Serious-Injury-or-Death-from-Magnet-Ingestion-Violate-Mandatory-Standard-for-Toys"],["子ども用パジャマが燃えやすさの基準に不適合 米国で回収","米消費者製品安全委員会（CPSC）は11月19日、子ども用パジャマのセット約1309着のリコールを発表した。子どもの寝間着に義務づけられた燃えにくさの基準を満たしておらず、重いやけどにつながる恐れがある。2026年3〜8月に米アマゾンで約20ドルで売られた「Qpancy」ブランドの品で、サイズは4〜5歳向けから10〜11歳向けまで。けがの報告はないが、直ちに着用をやめて返金を受けるよう求めている。","\n【概要】米消費者製品安全委員会（CPSC）は2026年11月19日、「Qpancy」ブランドの子ども用パジャマのセット約1309着のリコールを発表した。子どもの寝間着に義務づけられている燃えにくさの基準を満たしておらず、重いやけどにつながる恐れがあるためだ。\n\n【背景】対象は、子ども用のおそろいのパジャマのセットで、前ボタンで胸ポケット付きの長袖の上着と半ズボンに、人形用のおそろいのパジャマが付く。柄は、多色の猫、ピンクのリボン、ピンクと白のしまのリボン、ピンクと白のしまの4種類。サイズは120（4〜5歳向け）から150（10〜11歳向け）まで。ブランド名は首のラベルに、サイズは脇の縫い目のラベルに記されている。\n\n【詳細】このパジャマは2026年3月から8月まで、米アマゾンで約20ドルで売られた。販売元は中国の事業者で、製造も中国。これまでにけがの報告はない。CPSCは消費者に対し、直ちに着用をやめ、販売元に連絡して全額の返金を受けるよう求めている。手続きでは、パジャマを半分に切って使えない状態にし、その写真を電子メールで送ったうえで処分するよう案内している。\n\n【ポイント・注意点】子どもの寝間着は、寝るときだけでなく、朝や夜に家の中でくつろいで過ごす時間にも長く着る衣類だ。米国では子どもの寝間着に燃えにくさの基準があり、今回の品はこれを満たしていなかった。寒くなり暖房器具を使う季節を迎え、火の近くで遊ぶ子どもの服に火が移る危険にも気を付けたい。海外の通販サイトで買った子ども服は、国内の回収情報には載らないことがあるため、販売国の当局の発表を確かめることも役立つ。ストーブなどの周りに柵を置いて近づけないようにするなど、服に頼らない対策もあわせて考えたい。今回の品は、人形とおそろいで着られるデザインで、子どもが喜んで着る種類の服でもある。かわいらしさや値段だけでなく、子どもの寝間着として安全に作られているかどうかにも目を向けたい。購入した国や販売サイトの回収情報を時々確かめることも、家庭でできる対策の一つになる。","2026-11-19","米消費者製品安全委員会（CPSC）","https://www.cpsc.gov/Recalls/2027/Qpancy-Recalls-Childrens-Pajama-Sets-Due-to-Risk-of-Serious-Injury-or-Death-from-Burn-Hazard-Violate-Mandatory-Standards-for-Childrens-Sleepwear"],["鉄剤の毎日服用で子どもの鉄欠乏性貧血リスク76%減 コクラン","0〜19歳の子どもに鉄剤を毎日飲ませると、何も飲まない場合や偽薬と比べて鉄欠乏性貧血の相対リスクがおよそ76%下がる可能性が高いとする系統的レビューが、コクランのデータベースに掲載された。114件の研究を調べ、101件・5万325人分を統合して分析した。一方、成長やせき、発熱への影響はほとんどなく、副作用を報告した研究も少ないため、安全性について確かなことは言えないとしている。研究の多くはアジアで行われていた。","\n【概要】子どもと10代が鉄剤を毎日飲むことで鉄欠乏性貧血を防いだり治したりできるかを調べた系統的レビューが、コクラン・システマティック・レビュー・データベースに掲載され、医療系メディアのNews-Medicalが2026年11月19日に紹介した。鉄剤を毎日飲むと、飲まない場合や偽薬と比べて鉄欠乏性貧血の相対リスクがおよそ76%下がる可能性が高いという。\n\n【背景】鉄剤は子どもの貧血の予防や治療に使われているが、効果の大きさや体への負担については研究ごとに結果がばらついていた。今回のレビューは、もともとの鉄の状態や貧血の有無を問わず、0〜19歳を対象にした研究をまとめて評価したものである。マラリアが流行する地域の研究は対象から外した。\n\n【詳細】114件の研究を調べ、そのうち101件・5万325人分を統合して解析した。鉄剤を毎日飲むと鉄欠乏性貧血は減る可能性が高い一方、貧血全体や鉄欠乏そのものへの効果は「非常に不確か」とされた。鉄と葉酸を一緒に飲むと鉄欠乏と鉄欠乏性貧血が減る可能性が高いが、根拠は225人を対象にした1件の研究だけである。鉄にほかのビタミンやミネラルを加えると、それらだけを飲む場合より鉄欠乏性貧血は減る可能性が高いが、嘔吐のリスクが上がるかもしれない。成長やせき、発熱、呼吸器の病気には、ほとんど影響がなかった。副作用として便の色が変わることが挙げられたが、これも根拠は非常に不確かだという。\n\n【ポイント・注意点】鉄欠乏性貧血を直接測った研究は17件にとどまり、病気の発生や副作用を報告した研究はそれぞれ全体の9%と12%しかなかった。このため、安全性について確かな結論は出せないとしている。研究の多くはアジアで行われ、アフリカの研究は少なく、ほかの地域にそのまま当てはまるとは限らない。すでに貧血や鉄欠乏がある子どもほど効果が大きい可能性も示されたが、根拠は限られている。副作用や味、文化的な受け入れやすさが、飲み続けられるかどうかに影響することもある。子どもに鉄剤を飲ませるかどうかは、自己判断せず医師に相談したい。","2026-11-19","News-Medical","https://www.news-medical.net/news/20261119/Iron-may-cut-childhood-iron-deficiency-anemia-risk-by-7625.aspx"],["子どもの電動自転車事故が急増 脳損傷は普通の自転車の2倍","米スタンフォード大学などの研究チームが、米国の主要な小児病院6施設で2023年1月〜2026年3月に治療を受けた18歳未満の1万3307人の記録を分析し、医学誌JAMAに発表した。電動自転車による負傷は3か月ごとに33％、電動キックボードは15％のペースで増えていた。脳損傷の割合は電動の乗り物で非電動の約2倍。電動自転車の負傷者の約4分の1、電動キックボードの半数近くが12歳未満だった。","\n【概要】米スタンフォード大学などの研究チームは、子どもや10代の電動自転車と電動キックボードによる負傷の推移と重さを調べた論文を、医学誌JAMAに発表した。ITmedia NEWSが2026年11月18日に伝えた。電動の乗り物による負傷は、非電動を大きく上回るペースで増えていた。\n\n【背景】研究チームは、2023年1月から2026年3月までに米国の主要な小児病院6施設で治療を受けた18歳未満の患者1万3307人の電子カルテを分析した。対象は電動と非電動の自転車とキックボード、それに非電動のスケートボードによる負傷だ。論文は2026年11月2日にオンラインで公開された。\n\n【詳細】電動自転車による負傷は四半期ごとに33％、電動キックボードによる負傷は15％のペースで増えていた。集中治療室への入院や手術が必要な骨折の割合は、非電動の自転車で4％、非電動のキックボードで2％だったのに対し、電動自転車は8％、電動キックボードは5％だった。脳損傷の割合は電動自転車で10％、電動キックボードで9％と、非電動の約2倍にのぼった。電動自転車で負傷した患者の17％は入院が必要だった。さらに、電動自転車の負傷者の約4分の1、電動キックボードの負傷者の半数近くが12歳未満の子どもだった。\n\n【ポイント・注意点】電動の乗り物は速度が出やすく、けがが重くなりやすいことが数字で示された。対象年齢に満たない子どもが乗っている実態もうかがえる。日本でも電動キックボードなどを目にする機会が増えている。子どもに乗らせる場合は、年齢や体格に合っているかを確かめ、ヘルメットをかぶらせることが欠かせない。贈り物として選ぶ前に、乗れる場所や交通のルールを家族で確かめておきたい。研究の対象は治療を受けた子どもに限られ、軽いけがで病院に行かなかった例は含まれていない。それでも、病院で治療が必要になったけがの中で、電動の乗り物の割合が増え、しかも重いけがの割合が高いことは見過ごせない。走る場所が混んでいないか、速度を出しすぎていないかにも大人が目を配りたい。","2026-11-18","ITmedia NEWS","https://www.itmedia.co.jp/news/article/2611/18/2000003265/"],["下校中の小学生3人が酒気帯び運転の車にはねられる 枕崎市","11月18日午後3時半すぎ、鹿児島県枕崎市桜山本町の国道225号と市道の交差点で、横断歩道を渡っていた小学生3人が軽乗用車にはねられた。小学3年の男子児童2人が頭や腰を打って救急搬送されたが、命に別状はない。警察は運転していた50代の男を酒気帯び運転の疑いで現行犯逮捕した。男は飲酒運転をして横断中の児童をはねたことを認めているという。下校の時間帯に起きた飲酒運転による事故だ。","\n【概要】2026年11月18日午後3時半すぎ、鹿児島県枕崎市桜山本町の国道225号と市道の交差点で、横断歩道を渡っていた小学生3人が軽乗用車にはねられた。MBC南日本放送が同日伝えた。小学3年の男子児童2人が頭や腰を打って救急搬送されたが、命に別状はないという。\n\n【背景】事故は子どもたちが学校から帰る時間帯に起きた。児童は横断歩道を渡っている途中だった。近所の住民は、児童が「横断歩道の真ん中で倒れていた」と話し、通りがかった人が介抱していたと説明している。\n\n【詳細】警察は、軽乗用車を運転していた50代の男を、酒気帯び運転の疑いで現行犯逮捕した。男は取り調べに対し、飲酒運転をして横断中の児童をはねたことを認めているという。警察が、事故当時の詳しい状況を調べている。横断歩道は、歩行者が優先される場所だが、子どもたちはそこで車にはねられた。\n\n【ポイント・注意点】横断歩道を正しく渡っていても、運転する側が酒を飲んでいれば事故は防ぎきれない。飲酒運転は、子どもの通学路をはじめ、あらゆる場所で重大な事故につながる。運転する人は、飲んだら運転しない、運転する人には飲ませないことを徹底する必要がある。子どもには、横断歩道でも車が止まってくれるとは限らないことを伝え、渡る前に左右を確かめ、近づく車が止まるのを見てから渡るよう教えておきたい。下校の時間帯は友達と一緒で注意がそれやすく、複数で渡るときほど一人ひとりが車を見ることが大切になる。学校や地域では、通学路の横断歩道での見守りや、危険な交差点の点検をあらためて考える機会にしたい。家庭でも、通学路で車が多く通る場所や、見通しの悪い場所を親子で確かめておくとよい。記事によると、近所の住民の話として、通りがかった人が倒れた児童を介抱していたという。事故の現場に居合わせたときは、まず安全を確かめたうえで、119番への通報や、けがをした子どもへの声かけといった、できる範囲の手助けをすることも大切になる。けがをした子どもは、その場で元気そうに見えても、頭を打っている場合は後から具合が悪くなることもあるため、受診につなげることが欠かせない。","2026-11-18","Yahoo!ニュース（MBC南日本放送）","https://news.yahoo.co.jp/articles/171a6d125cf2e5f3e42988125a4f87098778a666"],["抗菌薬アレルギーとされた子 多くは実はアレルギーでない","米国では子どもの約20人に1人がペニシリンのアレルギーとカルテに記録されているが、その多くは実際にはアレルギーではないとする解説を、医師らが発表した。ウイルス感染中に出た発疹などが誤ってアレルギーと記録されることが多い。誤った記録のために効き目の劣る抗菌薬が使われると、耐性菌などの感染や入院の長期化につながる。2024年の研究では、外来で評価を受けた子どもの91％で記録が外された。","\n【概要】子どもの多くが、実際にはアレルギーがないのにペニシリンなどの抗菌薬のアレルギーと記録されているとして、医師らが見直しを呼びかけた。メディカル・エクスプレスが2026年11月18日に、解説サイト「ザ・カンバセーション」の記事を転載した。根拠となる研究は英国の一般診療の専門誌に掲載された。\n\n【背景】米国では、子どもの約20人に1人のカルテにペニシリンのアレルギーが記録されている。だが研究によると、こうした子どもの大半は本当のアレルギーではない。多くの記録は、ウイルスに感染している間に抗菌薬を飲み、そのときに出た発疹をきっかけに付けられる。嘔吐や頭痛、発熱、関節の痛みがアレルギーの症状と取り違えられることもある。\n\n【詳細】誤った記録があると、子どもはより効き目の劣る、幅広い菌に作用する抗菌薬を使われやすくなる。その結果、MRSAやC.ディフィシルといった感染の危険が高まり、入院が長引いたり医療費がかさんだりする。2024年の研究では、外来やかかりつけ医で評価を受けた子どもの91％でアレルギーの記録が外された。記事は、かかりつけ医が子どもを3つに分けて扱う方法を紹介している。症状がアレルギーらしくない子や、その後に同じ薬を問題なく使えた子、家族のアレルギーだけで記録された子は、追加の検査なしで記録を外せる。軽い発疹だけだった子は、見守りのもとで1回服用し、反応がなければ外す。アナフィラキシーなど重い反応があった子は、小児のアレルギー専門機関に紹介する。\n\n【ポイント・注意点】記事は、重い扁桃炎の10歳の子を例に挙げ、第一選択の抗菌薬が使えない不利益を示している。子どもに「薬のアレルギー」があると言われている場合、いつ、どんな症状が出たのかを記録しておき、本当にアレルギーなのかをかかりつけ医に相談してみたい。英国には、病院で誤ったペニシリンのアレルギーの記録を外すための指針もある。一方で、アナフィラキシーや口の中などに及ぶ重い発疹が出たことがある子どもは、自己判断で薬を試さず、専門の医療機関で評価を受ける必要がある。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-children-allergic-antibiotics-allergy.html"],["子どもの不安・うつの診断が4倍に 英国620万人の記録を分析","英マンチェスター大学などの研究チームは、イングランドの子どもと若者620万人以上のかかりつけ医の記録を分析し、不安やうつの記録が2001〜2019年の間におよそ4倍に増えたと英医学誌に発表した。10〜18歳で初めて記録される人は年に1000人あたり6人から24人に増えた。近年の受診者も、20年前と同じように自傷による入院などの重い転帰の危険が高く、軽い例が増えただけではないと研究者は指摘する。","\n【概要】英マンチェスター大学などの研究チームは、イングランドの子どもと若者の不安やうつの記録が、2001年から2019年の間におよそ4倍に増えたとする研究を英医学誌ランセット・サイキアトリーに発表した。メディカル・エクスプレスが2026年11月18日に伝えた。研究者は、本当に治療を必要とする子どもが増えていると指摘している。\n\n【背景】子どもの心の不調が増えているという報告に対しては、軽い例まで病気として扱う「過剰な医療化」ではないかという見方もあった。研究チームは、2001年から2023年までのかかりつけ医の匿名の記録をもとに、620万人以上の子どもと若者を分析した。\n\n【詳細】10〜18歳で、不安やうつが初めて記録される人は、2001年の年1000人あたり6人から、2019年には24人に増えた。2001年から2023年の間に初めて不安やうつの診断や症状が記録された約38万人を追跡したところ、近年に受診した若者も、20年前に受診した若者と同じように、同年代と比べて自傷による入院や、飲酒や薬物の問題といった重い転帰の危険が高かった。受診する年齢は下がる傾向にあり、増え方は豊かな地域と貧しい地域で同じだった。この集団では、自閉スペクトラム症やADHDの記録の割合も3倍近くに増え、専門の精神保健サービスに紹介される割合は2倍以上だった。抗うつ薬を処方される割合は2001年から2005年に半分になり、その後は横ばいだった。\n\n【ポイント・注意点】筆頭著者は、今かかりつけ医を受診する子どもが臨床的に弱い立場でなくなっているわけではないと述べている。子どもの不安や落ち込みは、軽く見ずに早めに相談することが大切だ。家庭では、眠りや食欲、登校の様子の変化に気を配り、気になるときはかかりつけ医や学校の相談窓口につなぎたい。研究は匿名化されたかかりつけ医の記録に基づくもので、治療を必要とする子どもが受診につながったときの姿を映している。抗うつ薬の処方を始めた子ども1人あたりの処方の回数は約50％増えたという。相談先が限られるなかで、早く支援につなぐ仕組みづくりが求められている。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-mental-health-crisis-children-real.html"],["子どもの肥満対策は2本立てで 12万人の体格を追った研究","ノルウェー科学技術大学などの研究チームは、ノルウェーの子ども12万4470人の2歳から13歳までの身長と体重の記録を分析し、肥満を防ぐには、肥満の子への個別の支援と、子ども全体に向けた幅広い対策の2つが要ると発表した。4〜8歳で肥満だった子の38〜51％は13歳でも肥満だった一方、13歳で肥満の子の多くは幼いころ標準や過体重だった。体格だけで将来を予測するのはほぼ不可能だという。","\n【概要】ノルウェー科学技術大学などの研究チームは、子どもの肥満を防ぐには、肥満の子どもへの個別の支援と、子ども全体に向けた幅広い対策の2つが必要だとする研究を、小児科の専門誌に発表した。メディカル・エクスプレスが2026年11月18日に伝えた。\n\n【背景】研究チームは、ノルウェーのトロンハイムとベルゲンで1991年から2017年に、子どもの健診や学校の保健で集めた身長と体重の記録を使い、子ども12万4470人を分析した。2歳、4歳、6歳、8歳、13歳の時点の体格の区分が、どのように移り変わるかを調べた。\n\n【詳細】4歳、6歳、8歳の時点で肥満だった子どものうち、38〜51％は13歳でも肥満だった。一方で、13歳で肥満の子どもの大半は、幼いころは標準体重か過体重だった。幼い年代では、そもそも標準や過体重の子どもの数がずっと多いためだ。4歳、6歳、8歳で過体重だった子どもが13歳で肥満になっていたのは8〜10％で、6歳で過体重だった子どもの62％は13歳では標準体重に戻っていた。研究者は、幼いころのBMIだけで、標準や過体重の子のうち誰が肥満になるかを予測するのは「ほぼ不可能」だとしている。\n\n【ポイント・注意点】研究チームは、肥満のある幼い子どもには、それ以上体重が増えないよう個別に支援すること、あわせて子ども全体に向けた幅広い予防を進めることを勧めている。過体重の子だけを対象にしても効果は小さいとみられ、学校の看護師が過体重を保護者に知らせる取り組みも見直しを求めた。学校は授業や保護者会、日々の生活を通じて、健康的な食事と体を動かす習慣を支えられるという。ノルウェーで子どもへの不健康な食品の広告を禁じていることも、幅広い対策の例に挙げた。家庭では、体重の数字だけにとらわれず、家族ぐるみで食事と運動の習慣を整えたい。研究に使われたのは、ノルウェーの子どもの健診と学校の保健の記録で、30年近くにわたる大規模なデータだ。幼いころの体格が一時的に重くても、その後に標準へ戻る子どもが多いことは、保護者にとって過度に心配しすぎないための材料にもなる。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-obesity-young-people.html"],["年末のおもちゃ選び 窒息やボタン電池の誤飲に注意を","米テキサス大学ヒューストン健康科学センター（UTHealth Houston）の専門家が、年末の贈り物シーズンに向けて安全なおもちゃの選び方を助言した。小さな部品やビー玉、風船による窒息が多く、ボタン電池や磁石を飲み込むと体の中でやけどや腸の詰まりを起こし、命に関わることもあるという。対象年齢の表示を守り、電池のふたはねじでしっかり留める、何より大人がそばで一緒に遊ぶことが最も大切だとしている。","\n【概要】米テキサス大学ヒューストン健康科学センター（UTHealth Houston）の専門家が、年末の贈り物の季節に向けて、子どもの安全なおもちゃの選び方を助言した。ニュース・メディカルが2026年11月18日に伝えた。窒息や誤飲などのけがを防ぐ具体的な注意点を挙げている。\n\n【背景】おもちゃによるけがで多いのが窒息で、特に小さな部品やビー玉、風船、壊れたおもちゃのかけらが原因になる。鋭い角や壊れたおもちゃは切り傷やすり傷を招く。ボタン電池や磁石を飲み込むと、体の中のやけどや消化管の詰まりを起こし、重い場合は命に関わる。病院では、全地形対応車（ATV）や電動キックボードなど、動力付きの乗り物による重いけがが目立って増えているという。\n\n【詳細】乗り物のおもちゃでは、最初に乗るときからヘルメットなどの安全具を着けさせることで、救急外来に行かずに済むことがあるとしている。購入時には、作りがしっかりしていて子どもの発達に合っているか、米国の安全基準に合っていることを示す表示があるかを確かめる。表示を確認することは、有害な化学物質や鉛を含む塗料が使われているかもしれない偽物を避けることにもつながる。対象年齢の表示は、発達に合っているかと、小さな部品などの危険の両方を表している。「0〜3」に赤い丸の表示は、3歳未満には危険な小さな部品があるという意味で、「提案ではなく警告だ」としている。電子玩具やリモコンのボタン電池は、電池のふたをねじでしっかり留め、予備の電池は子どもの手の届かない所にしまう。飲み込んだ疑いがあれば、緊急の受診が必要になる。\n\n【ポイント・注意点】専門家は、年齢に合ったおもちゃを選ぶことに加えて、大人がそばで見守り、一緒に遊ぶことが最も大切な安全対策だとしている。一緒に遊ぶことは子どもの発達にもよい。年上のきょうだい向けの贈り物に小さな部品がないかにも気を配りたい。贈り物を選ぶときは、子どもの年齢だけでなく体の大きさも考え、安全の表示や説明書を読むことも勧めている。小さな部品の大きさを確かめる器具を使えば、窒息の危険を見分けやすくなるという。","2026-11-18","News-Medical","https://www.news-medical.net/news/20261118/Expert-advice-on-choosing-safe-toys-for-the-holiday-season.aspx"],["新型コロナの症状が重かった10代ほど論理的思考の点が低め","オーストリアの研究チームは、12〜16歳の3860人を調べ、新型コロナにかかったときの症状が重かった10代ほど、論理的に考える力や数の力の検査の点が低い傾向があったと英科学誌に発表した。女子では言葉の力でも同じ傾向がみられた。一方、感染したかどうかや回数とは関係がなかった。ただし差は小さく、成績のばらつきのうち新型コロナで説明できるのは1％未満で、因果関係は示せないとしている。","\n【概要】オーストリアのカール・ランドシュタイナー保健科学大学などの研究チームは、新型コロナにかかったときの症状が重かった10代ほど、論理的に考える力などの検査の点が低い傾向があったとする研究を、英科学誌サイエンティフィック・リポーツに発表した。ニュース・メディカルが2026年11月18日に伝えた。\n\n【背景】研究は、オーストリアのニーダーエスターライヒ州で12〜16歳（平均13.5歳）の3860人を調べた横断研究だ。データは2024年4〜10月に集めた。感染したかどうかや回数、最も重かったときの症状を9段階で本人に答えてもらい、標準化された検査で思考力や手先の器用さなどを測った。年齢や性別、学校の種類の影響を取り除いて分析した。\n\n【詳細】参加者の83.9％が少なくとも1回は感染したと答え、感染した人の平均の回数は約1.6回だった。症状の重さの平均は9段階で2.9だった。症状が重かった人ほど、全体として論理的に考える力と数の力の点が低く、女子では言葉の力の点も低かった。最も軽かった人と最も重かった人の差は、平均100点の尺度で論理的思考が約5.4点、数の力が2.9点、女子の言葉の力が7.2点だった。一方、感染したかどうかや回数は、成績と意味のある関係がなかった。年齢や教育などを考えに入れると、新型コロナに関わる要因で説明できるのは、それぞれの成績のばらつきの1％未満だった。運動の能力との関係は主な分析ではみられなかった。\n\n【ポイント・注意点】研究は一時点の調査で、感染歴は本人の申告に基づき、感染前の検査の結果もないため、因果関係は示せないと研究チームは述べている。感染の日付やワクチン接種歴、持病も分かっていない。差は小さく、個々の子どもに当てはめて心配する段階ではないが、重い症状を防ぐことの意味を考える材料にはなる。機械学習を使った分析でも、論理的思考と女子の言葉の力についての結果は支持された。症状の重さが7以上の人を除いた分析でも、論理的思考との関連は残った。手先の器用さや長期の記憶との関連も示唆されたが、確認が必要だとしている。","2026-11-18","News-Medical","https://www.news-medical.net/news/20261118/COVID-19-and-the-teenage-brain-Why-the-severity-of-symptoms-may-matter.aspx"],["妊娠中にはしか 生まれた子の8割に先天性麻疹 米CDC報告","米国疾病対策センター（CDC）が、妊娠中にはしか（麻疹）にかかった女性112人とその赤ちゃんの経過をまとめた速報を発表した。女性の98%はワクチン未接種か接種歴が不明で、23%が入院した。発疹が出てから14日以内に生まれた赤ちゃん19人のうち42%が早産で、ウイルス検査を受けた16人の81%にあたる13人が先天性麻疹とされた。MMRワクチンは妊娠中には打てないため、妊娠前の接種が大切だという。","\n【概要】妊娠中にはしか（麻疹）にかかった女性とその赤ちゃんがどうなったかをまとめた米国疾病対策センター（CDC）の速報が医学誌「NEJM Evidence」に載り、医療系メディアのNews-Medicalが2026年11月18日に紹介した。生まれた赤ちゃんには早産や新生児集中治療室（NICU）への入院が多く、先天性麻疹と判断された例も目立った。\n\n【背景】米国でははしかの流行が続いている。はしかなどを防ぐMMRワクチンは生ワクチンのため、妊娠中には勧められない。母子を守るには、妊娠前に接種を済ませておくことと、地域全体の接種率を高く保つことが頼りになる。\n\n【詳細】調査は米国の16地域のデータを使い、2025年1月1日から2026年9月28日までを対象にした。はしかと確定した妊婦は112人で、110人（98%）はワクチン未接種か接種歴が不明で、96%は50人以上の集団発生に関係していた。26人（23%）が出産以外の理由で入院し、11人（10%）が肺炎、2人が呼吸不全になった。曝露後に免疫グロブリンを使った記録がある人はいなかった。母親に発疹が出てから14日以内に妊娠が終わった21例では、生きて生まれたのが19人、死産と流産が1例ずつだった。19人のうち8人（42%）がNICUに入院し、8人（42%）が早産で、うち6人は34週より前に生まれた。ウイルス検査を受けた16人のうち14人が陽性で、13人が先天性麻疹の定義に当てはまった。症状が出た陽性の赤ちゃんは6人で、うち1人には髄膜脳炎に合う兆候があった。\n\n【ポイント・注意点】CDCは、免疫のない妊婦がはしかにさらされた場合は点滴の免疫グロブリンで発症予防を図り、さらされた新生児には生まれてすぐ免疫グロブリンを使うよう勧めている。今回の数字は速報で、妊娠の結果が分からない例も多く、比べる対照群もないため、妊婦がはしかにかかったときのリスクをそのまま示す値ではない。先天性麻疹の全国共通の定義もまだない。妊娠を考えている人は、自分の接種歴を確かめておきたい。","2026-11-18","News-Medical","https://www.news-medical.net/news/20261118/What-happens-to-a-baby-when-its-mother-catches-measles-during-pregnancy.aspx"],["はしかを持って生まれる赤ちゃん 米国で13人 医師が懸念","米国で、母親が妊娠中にはしかにかかり、生まれた時点で赤ちゃんが感染している「先天性はしか」が、2025年初めから2026年9月末までに13人報告されたことが、米医学誌に掲載された公衆衛生の警告で分かった。同じ期間に妊婦の感染は112人確認され、ほぼ全員がワクチン未接種か接種歴不明だった。米国小児科学会は、出産直前に母親が感染した場合、赤ちゃんの25〜30％が感染しうるとしている。","\n【概要】米国で、生まれた時点ではしかに感染している赤ちゃんの報告が出ており、医師らが懸念を強めている。AP通信の記事を、メディカル・エクスプレスが2026年11月17日に伝えた。米医学誌NEJMエビデンスに掲載された公衆衛生の警告によると、先天性のはしかは2025年初めから2026年9月末までに13人が米疾病対策センター（CDC）に報告された。\n\n【背景】CDCによると、米国のはしかの患者は過去2年で7500人を超えた。全米で最も大きな流行はペンシルベニア州で起きている。集団のMMRワクチンの接種率が95％に達すると流行は起きにくいとされるが、多くの地域がその水準を下回っている。2025〜26年度の幼稚園児の接種率は全国で92.4％だった。\n\n【詳細】警告によると、同じ期間に妊婦のはしかの確定例は112人で、ほぼ全員がワクチンを受けていないか、接種歴が分からなかった。米国小児科学会は、母親が出産直前にはしかにかかった場合、赤ちゃんの25〜30％が感染する可能性があるとみている。先天性のはしかでは、発熱や黄疸、はしかの発疹が出る。重い合併症には肺炎や脳炎のほか、何年もたってから発症し、通常は命を落とす脳の病気、亜急性硬化性全脳炎（SSPE）がある。\n\n【ポイント・注意点】MMRの1回目は通常、生後12〜15か月で受けるが、流行地域では生後6か月から受けられる。ワクチンは妊娠中には打てない。ワクチンを受けていない妊婦がはしかにさらされた場合は、6日以内であれば抗体の治療を受けられるという。妊娠を考えている人は、妊娠前に自分の接種歴や抗体の有無を確かめておくことが、生まれてくる子どもを守ることにつながる。家族の接種歴もあわせて確かめておきたい。今回の13人という数は暫定値とされる。妊婦の感染はほぼすべてがワクチンを受けていない人か、受けたかどうかが分からない人だった。はしかの流行が広がると、自分でワクチンを受けられない赤ちゃんや妊婦が危険にさらされる。周りの人が接種を済ませておくことが、こうした弱い立場の人を守る盾になる。","2026-11-17","Medical Xpress","https://medicalxpress.com/news/2026-11-doctors-babies-born-measles.html"],["コンゴのエボラ流行6か月 子ども1737人死亡 ユニセフ報告","日本ユニセフ協会は11月17日、コンゴ民主共和国東部でのエボラ出血熱の集団発生から6か月の子どもへの影響を発表した。11月4日時点で18歳未満の2959人が感染し、1737人が亡くなった。感染者の28％、死者の35％が子どもで、感染した5歳未満児の約72％が死亡した。子どもの死亡の約80％は治療センターの外で起きている。2280人以上の子どもが親や養育者を失うなどした。","\n【概要】日本ユニセフ協会は2026年11月17日、コンゴ民主共和国東部で起きているエボラ出血熱の集団発生から6か月がたち、子どもたちに深刻な影響が出ているとするユニセフの発表を伝えた。感染は新たな地域にも広がっている。\n\n【背景】今回の集団発生は、8州の67保健区域に影響し、51区域で感染が続いている。規模と死者数はいずれもコンゴ民主共和国で記録された中で過去最大で、世界でも過去2番目だという。同国では2026年、1490万人が人道支援を必要とし、そのうち800万人が子どもだ。\n\n【詳細】11月4日時点で、18歳未満の2959人が感染し、1737人が死亡した。子どもは感染者の28％、死者の35％を占める。5歳未満児は感染者の14％、死者の21％で、感染した5歳未満児の約72％が亡くなった。子どもの死亡の約80％はエボラ治療センターの外で起きており、入院した5歳未満児の3人に1人は24時間以内に亡くなった。確認された感染の53％超は女性と女児だった。2280人以上の子どもが親や養育者を失うか、家族と離ればなれになった。ほかの保健サービスも滞り、北キブ州では施設での出産が前年より約18％減り、南キブ州でははしかワクチン1回目の接種率が最大7.6％下がった。約7500校、児童約250万人の学校で感染予防策がとられていない。イツリ州の調査では子どもの81％が恐怖やストレスを感じていた。\n\n【ポイント・注意点】ユニセフは、約2万1000人の子どもに心のケアなどを届け、16か所の保育施設で支援している。感染症の流行は、病気そのものに加えて、予防接種や出産の支援の遅れ、教育の中断、家族との別れを通じて子どもを危険にさらす。早く治療につなぐ仕組みを整えることが、子どもの命を守る鍵になる。感染予防策がとられていない学校がある一方で、35万5000人を超える子どもが安全に学ぶための支援を受けた。ツォポ州では3種混合ワクチンの3回目の接種が約11％減ったという。親の89％がストレスの増加を訴えており、家族全体への支えも求められている。","2026-11-17","PR TIMES（日本ユニセフ協会）","https://prtimes.jp/main/html/rd/p/000002800.000005176.html"],["インフル予防接種は時期が大事 2回接種の子は早めに","インフルエンザの予防接種は受ける時期によって守りの強さが変わるとして、米国のHealthDayが接種の目安をまとめ、Medical Xpressが2026年11月17日に掲載した。米国疾病対策センター（CDC）などは9月か10月を勧めている。初めて接種する生後6か月〜8歳の子どもなど2回接種が必要な子は、4週間以上あけて2回打つため早めに始めるよう呼びかけた。時期を逃しても、流行中なら1月以降でも打つ価値はあるという。","\n【概要】インフルエンザの予防接種は、受ける時期によって守りの強さが変わる。米国の健康情報サービスHealthDayが接種のタイミングについての専門家の助言をまとめ、医療系メディアのMedical Xpressが2026年11月17日に掲載した。2回の接種が必要な子どもは、早めに1回目を受けるよう勧めている。\n\n【背景】記事は、予防接種がインフルエンザにかかるリスクを下げる最も効果的な方法だとしている。米国でインフルエンザが最も広がるのはふつう12月から2月で、5月ごろまで続く年もある。体が十分な免疫を作るには時間がかかるため、流行の山が来る前に接種を済ませることが大切になる。\n\n【詳細】米国疾病対策センター（CDC）などの専門家は、米国のほとんどの人にとって9月か10月が接種に最もよい時期だとしている。薬局では7月や8月から接種できることもある。65歳を超える人では、ワクチンの効果がひと月に6〜11%ずつ下がるという研究の推計があり、早すぎると流行の終わりまで効果がもたない恐れがある。ほとんどの大人と子どもにとって8月が早すぎるわけではないが、9月か10月のほうが安心だという。子どもについては、初めて接種する生後6か月〜8歳など2回の接種が必要な子は早めに始め、2回の間を少なくとも4週間あけるよう勧めている。1回目をできるだけ早く受ければ、流行の山の前に守りを整えやすい。妊娠後期の女性は、早めに接種すると胎盤を通して赤ちゃんに抗体が渡り、生まれる前から守りを与えられる可能性がある。\n\n【ポイント・注意点】早い時期を逃しても、地域でウイルスが広がっているうちは、1月以降でも接種する価値があるという。まだかかっていなければ、遅い接種でも役に立つ。ワクチンは流行期の後半に品切れになることもあるため、待ちすぎずに受けられるときに受けるほうがよいとしている。記事は米国の目安で、日本の接種時期や回数は、かかりつけ医や自治体の案内で確かめたい。どの時期が自分や子どもに合うかは、医療者に相談するよう勧めている。","2026-11-17","Medical Xpress","https://medicalxpress.com/news/2026-11-flu-shots-maximum.html"]],"dev":[["米国がはしか排除の地位を失う 成人の知識の空白も調査で判明","米国は2000年から保ってきたはしか排除の地位を、2026年11月17日に汎米保健機構から認められなくなった。ペンシルベニア大学アネンバーグ公共政策センターが11月6〜8日に成人1,028人を調べたところ、子どもがはしかで亡くなる割合を「わからない」とした人が59%、必要なワクチンの回数が2回だと正しく答えた人は34%にとどまった。子どもを守る予防接種への理解の不足が浮かび上がった。","\n【概要】米国は2000年以来、はしか（麻疹）の排除状態にあると認められてきたが、2026年11月17日、汎米保健機構（PAHO）は米国がもはやその基準を満たしていないと発表した。ペンシルベニア大学アネンバーグ公共政策センター（APPC）は同じ時期、はしかとワクチンに関する成人の知識を調べた結果を公表した。\n【背景】米疾病対策センター（CDC）によると、2026年の米国のはしか確定例は11月12日時点で5,412件で、2025年の年間2,290件を大きく上回っている。CDCは麻疹・おたふくかぜ・風疹の混合ワクチン（MMR）の1回目を生後12〜15か月、2回目を4〜6歳で接種するよう勧めており、有効性は1回で約93%、2回で約97%とされる。\n【詳細】調査は調査会社SSRSが11月6〜8日、確率抽出のオンラインパネルで成人1,028人に行い、誤差は±3.5ポイントだった。子ども向けのMMRワクチンが自閉症を引き起こすという説を「誤り」と答えた人は64%、「正しい」は17%、「わからない」は19%で、2024年9月〜2026年8月の4回の調査（「誤り」65〜68%、「正しい」12〜14%）と比べ、「正しい」がやや多かった。はしかに感染した子どもが亡くなる割合については59%が「わからない」と答え、CDCの推計（感染した子ども1,000人に1〜3人）に最も近い「約1,000人に1人」を選んだのは9%だった。子どもに必要な接種回数を正しく「2回」と答えた人は34%で、49%は「わからない」と答えた。保健福祉長官の発信を信頼できないとする人は61%だった。\n【ポイント・注意点】APPCは、ワクチンについての誤った思い込みがMMR接種を勧める意向の低さと結び付いているという過去の研究を紹介している。全米医学アカデミーは2004年に、WHOの諮問委員会は2025年に、MMRと自閉症の因果関係を否定する見解を示している。今回の調査は一時点の聞き取りで、因果関係を示すものではない。子どもの命を守る予防接種について、正確な情報を届ける必要性が改めて示された。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-measles-status-knowledge-gaps-disease.html"],["知的障害のある子の行動問題、CBDオイルに上乗せの効果なし","知的障害と重い行動の問題がある6〜18歳の131人を対象に、オーストラリアの3つの小児病院で行われた二重盲検の比較試験で、大麻由来成分カンナビジオール（CBD）のオイルは偽薬と比べて行動を改善しなかった。いら立ちの点数はどちらの群も同じように下がり、不安や睡眠、引きこもりにも差はなかった。一方、肝臓の酵素の一時的な上昇はCBDの群に多かった。米医学誌JAMA Pediatricsに掲載された。","\n【概要】知的障害があり、重い行動の問題を抱える子どもや10代に、大麻由来の成分カンナビジオール（CBD）のオイルを使っても、偽薬（プラセボ）以上の効果はみられなかった。Daryl Efron氏らのチームが米医学誌JAMA Pediatricsに発表した。\n【背景】知的障害のある子どもには、いら立ち、攻撃的な行動、自傷といった重い行動の問題がよくみられ、学びや日常生活、生活の質に影響する。医師は抗精神病薬や興奮剤、抗うつ薬を処方することが多いが、裏付けは限られ、副作用の危険も大きい。そのため代わりの選択肢としてCBDへの関心が高まっていたが、質の高い証拠は少なかった。\n【詳細】試験はオーストラリアの3つの小児病院で、6〜18歳の131人を対象に行われた。論文の題名は「知的障害のある若者の重い行動の問題に対するカンナビジオール」で、8週間毎日使う維持期の前後に、親が子どもの行動を評価した。参加者は純粋なCBDオイルか、見た目が同じ偽薬のオイルを毎日使い、子ども、家族、医師のいずれも、試験が終わるまでどちらを使ったか知らなかった。いら立ちの点数はCBDの群で32.2から21.7へ、偽薬の群で30から19.2へ下がったが、差は統計的に意味のあるものではなかった。不安、睡眠の乱れ、人との関わりを避ける様子、親の子育てのストレスでも、CBDの上乗せの効果は見られなかった。下痢、疲れ、吐き気などの副作用はCBDの群の63%、偽薬の群の61%に出た。肝臓の酵素の一時的な上昇はCBDの群で4.6%と、偽薬の群の1.5%より多く、てんかんの薬バルプロ酸ナトリウムと併用した場合に目立った。\n【ポイント・注意点】両方の群が同じように改善したことは、期待や時間の経過による変化が大きいことを示している。記事は、医師がこの結果を使い、不確かな効果と、薬の飲み合わせや費用の問題を家族と一緒に比べて判断できると指摘している。市販のCBD製品に頼る前に、主治医とよく相談することが大切になりそうだ。研究はオーストラリアの子どもを対象にしたものである。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-cbd-oil-behavioral-benefit-youths.html"],["子どもの片頭痛、自宅での耳の迷走神経刺激に初期の手応え","中国の南方医院などのチームは、7〜18歳の片頭痛の患者11人が自宅で耳に電気刺激を当てる「経皮的耳介迷走神経刺激（taVNS）」を4週間試した結果を発表した。72回の発作で使われ、薬を使わずに2時間後に痛みが消えたのは36.11%の発作だった。重い副作用はなく、皮膚の軽い反応が2回あった。ただし比べる群のない小規模な試験で、研究者は偽の刺激と比べる本格的な試験が必要だとしている。","\n【概要】中国の南方医院と協力機関の研究チームは、片頭痛のある子どもと10代が自宅で使える「経皮的耳介迷走神経刺激（taVNS）」について、安全に使えて効果の手がかりもあるとする初期の研究結果を、専門誌Neuromodulationに発表した。研究者自身による解説がMedical Xpressに掲載された。\n【背景】迷走神経は脳と体の多くの器官を結ぶ神経で、耳の一部の皮膚にもその枝が通っている。耳の表面から弱い電気で刺激する方法は、薬に頼らない治療の候補として研究が進んでいる。子どもの片頭痛は症状の出方の個人差が大きく、自然に軽くなることもある。\n【詳細】研究は、7〜18歳の患者11人を対象にした、比べる群のない探索的な試験だった。参加者は発作の時に、左耳のくぼみ（耳甲介）に電極を当て、1回30分の刺激を自宅で自分で行い、これを4週間続けた。対象になった発作は72回だった。皮膚の軽い一時的な反応が2回あったほかは、重い副作用は報告されなかった。痛みの点数は発作の間に下がっていく傾向を示し、薬を使わずに2時間後に痛みが消えたのは36.11%の発作だった。過去の記録と比べ、発作の長さや月の片頭痛の日数も減った。心拍の揺らぎ（心拍変動）も無線の心電計で調べたが、複数の検定の補正後には意味のある変化はなく、研究者は今のところ心拍変動を治療の効き目を示す確かな目印には使えないとしている。研究者は、脳卒中後の運動の回復に向けたtaVNSの手順や、子どもの慢性片頭痛にtaVNSを使った症例の報告など、これまでの取り組みも紹介している。\n【ポイント・注意点】研究者は「痛みの軽減や長期の変化をtaVNSだけによるものと断定できない」と述べ、期待による効果や自然な回復の影響を認めている。次の目標は、偽の刺激と比べる十分な規模のランダム化比較試験だという。研究者自身も今回の結果を、あくまで最初の一歩と位置づけている。解説の執筆者は迷走神経に関する事業を営む人物と紹介されており、その点も踏まえて読む必要がある。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-home-based-auricular-vagus-nerve.html"],["子どもの肥満を防ぐ2つの方策 ノルウェー12万人の記録から","ノルウェー科学技術大学などのチームは、1991〜2017年の12万4,470人の身長・体重の記録を分析し、4・6・8歳で肥満だった子の38〜51%が13歳でも肥満だった一方、13歳の肥満の多くはそれ以前に普通体重か過体重だった子から出ていたと報告した。研究者は、肥満の幼児への個別の支えと、すべての子に向けた広い予防の2本立てを勧めている。小児科の専門誌Acta Paediatricaに掲載された。","\n【概要】ノルウェー科学技術大学（NTNU）とサンクトオラフ病院、ノルウェー公衆衛生研究所などのチームは、幼児期の体格の区分が13歳での肥満にどうつながるかを大規模な記録で調べ、子どもの肥満を防ぐための2つの方策を示した。成果は小児科の専門誌Acta Paediatricaに掲載された。\n【背景】子どもの肥満は世界的な課題で、どの子に支援を集中すべきかが議論になってきた。ノルウェーでは子どもの健康センターや学校の保健サービスが、成長に合わせて身長と体重を測っている。論文の題名は「子ども時代の体格指数の区分の移り変わりと13歳での肥満の確率」で、R.エーデゴール氏らがまとめた。トロンハイム市も研究に加わった。\n【詳細】チームは、トロンハイムとベルゲンで1991〜2017年に集められた12万4,470人の記録を後ろ向きに分析した。測定は2、4、6、8、13歳の時点で行われていた。4・6・8歳で肥満だった子のうち、13歳でも肥満だったのは38〜51%で、最も危険が高い集団だった。過体重だった子では、13歳で肥満になったのは8〜10%にとどまり、6歳で過体重だった子の62%は13歳までに普通体重に戻っていた。一方、13歳で肥満だった子の多くは、幼い頃は普通体重か過体重だった。人数の多いこの集団から多くの肥満が生まれるためで、幼い頃の体格指数（BMI）だけでは、誰が将来肥満になるかを見分けるのはほぼ不可能だという。\n【ポイント・注意点】研究者は、肥満のある幼児には一人ひとりに合わせた効果的な支えを、それ以外の子には学校での食育や体を動かす機会など、全員を対象にした予防を勧めている。小学3年生の測定後に過体重を親に伝える連絡の意義は疑わしいとも指摘した。ノルウェーの子ども向け不健康食品の広告禁止も広い対策の例に挙げられた。ただし観察研究で、2都市のデータに基づくため、他の国にそのまま当てはまるとは限らない。記事には過体重と肥満を分けた具体的な基準の値や、1991〜2017年の間の測り方の変化などの詳しい限界は書かれていない。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-obesity-young-people.html"],["「ちゃんと食べてる？」幼い子の食事に父親も支えを求める","スウェーデンのウプサラ大学は、生後10〜24か月の子を持つ初めての父親21人に聞き取りを行い、父親が子どもの食事を大事だと感じつつ、食べる量が少ない時や関心を示さない時に迷っていることを明らかにした。子どもの自由な探索と十分に食べさせることの間で揺れ、体重の増えにくい子の父親ほど不安が強かった。多くの父親が、場面ごとの具体的な助言を求めていた。PLOS ONEに掲載された。","\n【概要】スウェーデンのウプサラ大学の研究チームは、幼い子どもの食事に関わる初めての父親たちが、どんなことに迷い、何を求めているかを聞き取りで調べ、科学誌PLOS ONEに発表した。父親たちは食事の場面での具体的な支えを望んでいた。\n【背景】子どもの食事に関するこれまでの研究の多くは母親を対象にしており、父親の経験や役割はよく分かっていなかった。スウェーデンでは育児休業を取って子どもの食事を担う父親も多く、父親の関わりは大きくなっている。子どもの健康センターは大切な役割を担うが、子どもが大きくなるにつれて保健サービスとの接点は減っていく。論文の題名は「初めての父親としての食事の世話：スウェーデンの生後10〜24か月の子の父親を対象にした質的研究」である。\n【詳細】研究を率いたのは、同大学の食品学・栄養学部の博士課程の学生、イルバ・トルネル・ル・プリオル氏。生後10〜24か月の子を持つ初めての父親21人に聞き取りを行った。父親たちは子どもの食事を大切で、同時に難しいものと感じていた。子どもが思ったより食べなかったり、食べ物に興味を示さなかったりすると不安になった。子どもに自由に食べ物を探らせることと、十分な量を食べさせることの釣り合いを取ろうとしており、もっと食べるよう促すべきか、量を子どもに任せるべきかが、繰り返し出てくる問いだった。体重が少ない子や体重が増えにくい子の父親は食事の場面でより迷いが大きく、体の大きな子の父親には同じほどの心配は見られなかった。\n【ポイント・注意点】多くの父親が、さまざまな食事の場面への対応について、よりはっきりした実用的な助言を求めていた。研究者は、子どもの保健サービスが父親の支援の必要に目を向けるきっかけになればと話している。ただし21人への聞き取りによる質的な研究で、スウェーデンに限られるため、結果をそのまま一般化することはできない。また、体重が少ない子や増えにくい子の父親が何人いたかは記事に示されておらず、体重に関する違いは聞き取りの中で見えた傾向であって、測った数値に基づくものではない。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-child-fathers-young-children-habits.html"],["10代の不安・うつの受診が4倍に 英国38万人の記録で「本物の危機」","英マンチェスター大学などのチームは、イングランドのかかりつけ医の記録から、10〜18歳で初めて不安やうつが記録された約38万人を分析した。初めての受診は2001年から2019年にかけて年1,000人あたり6人から24人へと約4倍に増え、より幼い年齢で受診するようになっていた。自傷などで入院する危険は20年前と同じく高いままで、研究者は軽い悩みの「医療化」では説明できないとしている。","\n【概要】英マンチェスター大学が率いる研究チームは、イングランドの子どもと若者の不安やうつの記録が大きく増えていることを示し、それが軽い悩みまで病気扱いする「過剰な医療化」ではなく、本当に支援が必要な若者の増加だとする分析を、精神医学誌The Lancet Psychiatryに発表した。\n【背景】子どもや若者の心の不調の増加については、助けを求める基準が下がった、あるいは普通の悩みまで病気として扱うようになったためだという見方もあった。\n【詳細】チームは、匿名化されたかかりつけ医（プライマリケア）の記録のデータベースCPRDを使い、入院の記録とつなげて分析した。データベースには620万人を超える子どもと若者が含まれ、そのうち2001〜2023年に初めて不安やうつの診断・症状が記録された10〜18歳の約38万人を対象にした。初めての受診は2001年から2019年にかけて年1,000人あたり6人から24人へと約4倍に増え、受診する年齢も時代とともに下がっていた。増え方は豊かな地域と貧しい地域でほぼ同じだった。不安やうつで受診した若者のうち、自閉症やADHDの記録がある割合は約3倍になり、専門の精神保健サービスへの紹介は2倍以上になった。抗うつ薬を処方される割合は2001〜2005年に半分になった後は横ばいだったが、処方された子では使う期間が長くなり、治療を始めた子1人あたりの処方は約50%増えた。共著者のビッキー・タクシアルキ博士は「今かかりつけ医を受診する子どもは、臨床的に弱さが減っているわけではない」と話し、ケンブリッジ大学のタムシン・フォード教授も、最近の受診者の問題が軽くなっている証拠はほとんどないとしている。\n【ポイント・注意点】自傷、アルコールや薬物の乱用で入院する危険は、同年代と比べて一貫して高く、20年前の受診者とほぼ同じだった。研究者は、軽い例が増えたのなら深刻な結果の危険は下がるはずだとし、本当に臨床的な支援が必要な若者が増え続けていると結論づけた。ただし観察研究で原因は示せず、記録の付け方の変化の影響も考えられる。結果はイングランドのものである。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-mental-health-crisis-children-real.html"],["抗菌薬アレルギーと記録された子の多くは実はアレルギーなし","英国の医師2人がThe Conversationに寄せた解説によると、米国の子どもの約20人に1人はペニシリンアレルギーと記録されているが、その多くは本当のアレルギーではない。ウイルス感染中の発疹などが誤って薬のせいにされ、大人になっても記録が残る。2024年の研究では、外来やかかりつけ医で体系的に見直した子の91%で記録を外せた。筆者らは症状に応じた3つの段階での見直しを提案している。","\n【概要】英国の医師、レベッカ・ペイン氏とマノハール・ジョイシー氏は、抗菌薬（抗生物質）へのアレルギーがあると記録された子どもの多くが、実際にはアレルギーではない可能性が高いと警告する解説をThe Conversationに寄せた。Medical Xpressが転載した。筆者らは関連する論文を英国一般診療誌（BJGP）に発表している。\n【背景】解説は、ひどい扁桃炎で受診した10歳の男の子の例から始まる。母親はペニシリンも名前が「マイシン」で終わる薬も使えないと話したが、どちらも扁桃炎の第一選択の薬で、治療が難しくなった。米国の子どもの約20人に1人は、カルテにペニシリンアレルギーと記録されているという。\n【詳細】こうした記録の多くは、ウイルス感染の最中に始まる。抗菌薬を飲んでいる時に出たウイルス性の発疹や、吐き気、頭痛、発熱、関節の痛みが、薬のせいだと誤って考えられ、一度記録されると大人になっても残ることがある。誤った記録のある子は、効き目の劣る、より広い範囲に効く抗菌薬を使われやすく、MRSAやC.ディフィシルなどの感染の危険が高まり、入院期間や医療費も増える。2024年の研究では、外来やかかりつけ医での体系的な見直しが安全に行え、評価した子の91%で記録を外せた。筆者らは3つの段階を提案している。症状がアレルギーらしくない子や、その後同じ薬を問題なく使った子、家族のアレルギーで記録された子は、検査なしで記録を外せる。軽い発疹だけの子は、医師らの管理のもとで1回だけ自宅で服用して様子を見る。アナフィラキシーなど重い反応があった子や、重いぜんそくの子は専門医に紹介する。\n【ポイント・注意点】筆者らは、医師に相談せずに親が同じ薬を再び与えてはいけないと注意している。子どもが元気な時に記録を見直せるか、かかりつけ医に尋ねることを勧めている。2段階目の自宅での服用は、かかりつけ医か診療所の薬剤師が見守る必要があり、1週間後に家族に連絡して反応がなければ記録を外す。記録を外した場合は、家族にはっきりした説明と書面での確認を渡し、ほかの医療者にも共有するべきだという。英国では病院向けの手引きがすでにある。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-children-allergic-antibiotics-allergy.html"],["手術前のテレビゲームで子どもの不安の高まりが小さく 米エール大","米エール大学の麻酔科のチームは、全身麻酔を受ける4〜14歳の子どもに、手術台に取り付ける投影装置で運転のゲームを遊んでもらうランダム化比較試験を行った。ゲームをした子は、通常の対応の子に比べて麻酔をかける前の不安の高まりがはっきり小さかった。子どもは平均約1分遊んでから麻酔のマスクを着け、多くは眠りに落ちるまで遊び続けた。手術室の職員の受け止めもおおむね好意的だった。","\n【概要】米エール大学の麻酔科のチームは、手術の直前に子どもにテレビゲームを遊んでもらうと、麻酔をかける前の不安の高まりを抑えられるとするランダム化比較試験の結果を、臨床麻酔の専門誌Journal of Clinical Anesthesiaに発表した。\n【背景】手術前の子どもの不安はよく見られ、術後の回復の難しさと関連することが知られている。受け身で見るだけの画面やタブレットではなく、部屋の状況を感じ取りながら能動的に関われる道具を使いたいというのが、チームの狙いだった。\n【詳細】試験の責任者は同大学の麻酔科の助教、アンソニー・ロンギーニ医師。全身麻酔で処置を受ける4〜14歳の子どもを、ゲームを使う群と通常の対応の群に分けた。使ったのは「BERT」と呼ぶ持ち運べる装置で、プロジェクターを手術台に取り付け、ベッドの足元に画面を置く。遊ぶのは暴力的でも複雑でもないレゴ・バットマンのレースゲームで、車はコースから外れないため、子どもは自分で操作しても任せたままでもよい。子どもはふつう約1分遊んでから麻酔のマスクを着け、多くは麻酔が効いて眠りに落ちるまで遊び続けた。ゲームをした子は、通常の対応の子と比べ、麻酔の導入前の不安の高まりがはっきり小さかった。手術室の職員への聞き取りでも、おおむね熱心な支持が得られ、職員は患者ごとに装置の設置と片付けを手伝った。研究に加わっていない同大学医学部のアッシャー・マークス医師は、実際の現場で使うことに目を向けた点を評価し、従来の医療を補うデジタルな取り組みの未来を垣間見せるものだと述べた。\n【ポイント・注意点】論文はハリソン・プラブダー氏らによるもので、題名は麻酔導入への子どもの協力も改善したとしているが、記事には参加人数や不安の点数などの具体的な数字は示されていない。比べた通常の対応の詳細や不安の測り方も記事からは分からない。ロンギーニ医師は、次はどの方法がどの子に最も合うかを見極めたいと話している。チームは今もBERTを使い続け、手術前の不安への効果を見守っている。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-video-games-presurgery-anxiety-children.html"],["ダウン症の免疫の過剰な働きを抑える薬 第2相試験で手応え","米コロラド大学アンシュッツ医療キャンパスのリンダ・クルニック研究所は、ダウン症で炎症性の皮膚病がある10代と大人に、免疫の信号を抑える薬トファシチニブを16週間使う第2相試験を行った。安全性の目標を満たし、血液の炎症の指標が下がり、皮膚の病気も改善した。注意力や記憶などの検査も良くなったが、研究者は認知を改善する証拠ではないと慎重だ。Cell Reports Medicineに掲載された。","\n【概要】米コロラド大学アンシュッツ医療キャンパスのリンダ・クルニック・ダウン症研究所は、ダウン症の人に見られる免疫の過剰な働きを薬で抑える第2相臨床試験の結果を、医学誌Cell Reports Medicineに発表した。安全性の目標を満たし、炎症の指標や皮膚の病気に改善が見られた。\n【背景】ダウン症は21番染色体が1本多いことで起こる。この染色体にはインターフェロンという免疫の信号を受け取る受容体の遺伝子があり、同研究所のこれまでの研究で、ダウン症の人ではインターフェロンの信号が慢性的に強く、免疫の乱れが広く起きていることが分かっていた。\n【詳細】試験では、関節リウマチなどに使われるJAK阻害薬トファシチニブを、炎症性の皮膚病（化膿性汗腺炎や円形脱毛症）があるダウン症の10代と大人に、1日2回、16週間使った（希望者は40週まで延長）。比べる群のない試験だった。安全性の確認、皮膚科の評価、血液の分子の分析、神経心理の検査で経過を見た。筆頭著者はアンジェラ・ラチュビンスキー氏、責任著者はホアキン・エスピノサ氏。安全性は事前に決めた目標を満たし、一般の人と同じような安全性の傾向だ
