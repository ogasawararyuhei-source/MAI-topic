<style>

:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;display:flex;flex-direction:column;height:100dvh;overflow:hidden;transition:background .35s ease,color .35s ease}
body::before{content:"";position:fixed;inset:0;background:var(--pattern);pointer-events:none;opacity:var(--pattern-op,.5)}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
[data-theme="steampunk"]{--bg:#e6d7b8;--pattern:radial-gradient(circle at 12% 20%,rgba(141,100,40,.16) 0 26px,transparent 27px),radial-gradient(circle at 88% 78%,rgba(141,100,40,.13) 0 38px,transparent 39px),repeating-linear-gradient(0deg,rgba(90,62,25,.05) 0 1px,transparent 1px 26px);--pattern-op:1;--card:#f8eed3;--ink:#2e2010;--muted:#77603c;--line:#a97f3f;--accent:#9c4a12;--accent2:#2f5d50;--accent-ink:#fff6df;--soft:#efdfba;--old:#97835f;--top-bg:#2a1a0c;--top-ink:#f2dfae;--radius:8px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\2699  \2699  \2699";--shadow:0 14px 34px rgba(62,40,8,.28)}
[data-theme="witch"]{color-scheme:dark;--bg:#161022;--pattern:radial-gradient(circle at 18% 12%,rgba(233,213,255,.20) 0 1.5px,transparent 2.5px),radial-gradient(circle at 72% 22%,rgba(233,213,255,.14) 0 1px,transparent 2px),radial-gradient(circle at 42% 66%,rgba(196,181,253,.12) 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 84%,rgba(233,213,255,.16) 0 1px,transparent 2px),radial-gradient(circle at 6% 88%,rgba(196,181,253,.12) 0 1px,transparent 2px);--pattern-op:1;--card:#241a3d;--ink:#f1eaff;--muted:#bdaee0;--line:#5b4595;--accent:#a678ff;--accent2:#e9d5ff;--accent-ink:#1d1233;--soft:#2f2350;--old:#8d81ad;--top-bg:#0e0919;--top-ink:#efe6ff;--radius:20px;--font-display:"IM Fell English","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\263E  \2726  \263D";--shadow:0 14px 34px rgba(0,0,0,.5)}
[data-theme="dnd"]{--bg:#e7d9b4;--pattern:repeating-linear-gradient(45deg,rgba(158,43,37,.05) 0 2px,transparent 2px 18px),radial-gradient(circle at 85% 10%,rgba(158,43,37,.10) 0 30px,transparent 31px);--pattern-op:1;--card:#f7ecc9;--ink:#332216;--muted:#7d6248;--line:#8c6a3f;--accent:#9e2b25;--accent2:#a97b00;--accent-ink:#fdf3d8;--soft:#eee0b6;--old:#9a8a72;--top-bg:#471611;--top-ink:#f7e7bd;--radius:4px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\265E  \2726  \265E";--shadow:0 14px 30px rgba(71,22,17,.30)}
[data-theme="celtic"]{--bg:#e3dfc6;--pattern:repeating-linear-gradient(0deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px),repeating-linear-gradient(90deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px);--pattern-op:1;--card:#f6f2dc;--ink:#20331e;--muted:#5d7050;--line:#77873f;--accent:#2e6b34;--accent2:#a8842a;--accent-ink:#fbf7e2;--soft:#e7e5c8;--old:#93a086;--top-bg:#17351f;--top-ink:#efeccb;--radius:14px;--font-display:"Uncial Antiqua","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\16DA  \2726  \16DB";--shadow:0 14px 30px rgba(23,53,31,.26)}
[data-theme="greek"]{--bg:#f2eee3;--pattern:repeating-linear-gradient(90deg,rgba(29,95,138,.06) 0 1px,transparent 1px 34px),radial-gradient(circle at 90% 0%,rgba(185,138,28,.10) 0 60px,transparent 61px);--pattern-op:1;--card:#fffdf6;--ink:#1e2c38;--muted:#66727c;--line:#b3923c;--accent:#1d5f8a;--accent2:#b98a1c;--accent-ink:#ffffff;--soft:#ece7d7;--old:#a3a8ad;--top-bg:#fdfbf4;--top-ink:#1e2c38;--radius:2px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\03A9  \2766  \03A9";--shadow:0 14px 30px rgba(30,44,56,.18)}
.top{flex:none;position:relative;z-index:30;background:var(--top-bg);color:var(--top-ink);border-bottom:3px double var(--line)}
.topin{max-width:1080px;margin:auto;padding:10px 16px 4px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.logo{font-family:var(--font-display);font-weight:900;font-size:23px;letter-spacing:.06em}.logo span{color:var(--accent2)}
[data-theme="witch"] .logo span,[data-theme="steampunk"] .logo span{color:var(--accent)}
.date{font-size:10px;opacity:.75;white-space:nowrap}
.topbtns{display:flex;gap:8px;flex:none}.pill{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.themes{max-width:1080px;margin:auto;padding:6px 16px 10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.themes-label{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;opacity:.8}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;opacity:.85}
.theme-btn .gly{margin-right:5px}
.theme-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
.stage-wrap{flex:1;min-height:0;max-width:1080px;width:100%;margin:auto;padding:10px 16px 12px;display:flex;flex-direction:column;position:relative;z-index:1}
.herostrip{flex:none;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;box-shadow:var(--shadow)}
.herostrip img{width:74px;height:52px;object-fit:cover;border-radius:calc(var(--radius) * .6);flex:none}
.herostrip p{margin:0;font-size:13px;color:var(--muted)}.herostrip b{color:var(--ink);font-family:var(--font-display)}
.catbar{flex:none;display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.catbar .navbtn{flex:none}
.catinfo{flex:1;text-align:center;min-width:0}
.catinfo h2{margin:0;font-family:var(--font-display);font-size:clamp(19px,4.6vw,27px);line-height:1.25;letter-spacing:.03em}
.catinfo p{margin:1px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catcount{flex:none;font-size:12px;background:var(--soft);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-weight:700}
.navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800;box-shadow:var(--shadow)}
.navbtn:active{transform:scale(.97)}
.dots{flex:none;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:transparent;padding:0}
.dot.active{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.stage{flex:1;min-height:0;touch-action:none;position:relative}
#cardSlot{height:100%}
.card{height:100%;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
.card::after{content:var(--orn);position:absolute;top:6px;right:12px;font-size:13px;letter-spacing:.3em;color:var(--accent2);opacity:.85;pointer-events:none}
.card.old .ph{filter:grayscale(1)}
.card .ph{width:100%;height:30%;min-height:120px;object-fit:cover;display:block;flex:none}
[data-theme="steampunk"] .card .ph{filter:sepia(.35) contrast(1.05)}
[data-theme="witch"] .card .ph{filter:saturate(.85) hue-rotate(-12deg) brightness(.92)}
[data-theme="dnd"] .card .ph{filter:sepia(.25) saturate(1.1)}
[data-theme="celtic"] .card .ph{filter:saturate(1.05) hue-rotate(6deg)}
[data-theme="greek"] .card .ph{filter:saturate(.92) brightness(1.04)}
.cbody{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.badge{background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:999px;font-weight:800}.badge.oldb{background:var(--old)}
.card h3{margin:0;font-size:clamp(17px,4.4vw,21px);line-height:1.45;font-family:var(--font-display);font-weight:700}
.sum{font-size:14px;color:var(--muted);margin:0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.btn{border:0;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800}
.btn.primary{background:var(--accent);color:var(--accent-ink)}.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.saved{background:var(--accent2);color:var(--accent-ink)}
.src{font-size:11px;color:var(--muted);word-break:break-all}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;color:var(--muted)}
.empty .big{font-size:34px;color:var(--accent2)}
.pager{flex:none;display:flex;align-items:center;gap:10px;margin-top:10px}
.pager .navbtn{flex:1}
.artdots{flex:none;display:flex;gap:5px;max-width:34vw;flex-wrap:wrap;justify-content:center}
.artcount{flex:none;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.hint{flex:none;font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.addcat{flex:none;text-align:center;margin-top:6px}
.addcat button{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700}
@keyframes inNext{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes inDown{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes inUp{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
.anim-next{animation:inNext .28s ease}.anim-prev{animation:inPrev .28s ease}.anim-down{animation:inDown .28s ease}.anim-up{animation:inUp .28s ease}
dialog{border:2px solid var(--line);border-radius:calc(var(--radius) + 6px);padding:0;max-width:min(680px,94vw);width:680px;max-height:92dvh;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,8,4,.6)}
.din{padding:20px;overflow-y:auto;max-height:92dvh}
.din img{width:100%;height:200px;object-fit:cover;border-radius:var(--radius)}
.din h3{font-size:20px;line-height:1.4;margin:12px 0 6px;font-family:var(--font-display)}
.full{font-size:15px;white-space:pre-line}
textarea,input[type="text"]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px}
label.fl{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
.memoBox{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.memoItem{border-top:1px solid var(--line);padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--top-bg);color:var(--top-ink);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:90vw;text-align:center}
@media(max-width:640px){.topin{padding:8px 12px 2px}.themes{padding:4px 12px 8px}.stage-wrap{padding:8px 12px 10px}.herostrip{display:none}.catbar .navbtn{padding:8px 10px;font-size:12px}.card .ph{height:24%;min-height:104px}}
@media(prefers-reduced-motion:reduce){.anim-next,.anim-prev,.anim-down,.anim-up{animation:none}body{transition:none}}

</style>

const DATA = {"ai":[["Krea、工程別AIエージェント「Krea Bots」のベータを開始","生成AIスタジオのKreaが、制作工程ごとに専門のAIエージェント「Krea Bots」のベータ版を始めた。ブランドデザインや映像編集、SNS運用など工程別のBotがチャットで連携し、最初のBot「ディレクター」が計画を立てて専門Botを呼び出す。登録者には1,000ドル分のクレジットが付与される。ウェイトリスト登録が必要なベータ版で、生成AIを制作の実作業に組み込む新しい形として注目される。","\n【概要】生成AIスタジオのKreaが、制作工程ごとに担当を持つAIエージェント「Krea Bots」のベータ版を開始し、公式ページでウェイトリスト登録の受け付けを始めた。登録者には1,000ドル分のクレジットが付与される。Botは「顔・担当・記憶を持つAIの同僚」という位置づけだ。【背景】これまでの生成AIツールは、画像や動画を1枚ずつ作る単発の作業が中心だった。しかし実際の制作現場では、企画から編集、公開まで工程が連なり、担当者同士の引き継ぎが発生する。Kreaはこの工程の流れ自体をAIエージェントに担わせる方向に踏み出した。【詳細】用意されたのは9体の専門Botで、ブランドデザイナー、イメージメーカー、ビデオ編集、SNS運用、3Dモデリング、絵コンテ、サウンドデザインといった制作工程ごとに分かれている。チャットでBotをメンションすると仕事を依頼でき、自分の担当工程を終えると次の工程を別のBotへ引き継ぐ。最初のBot「ディレクター」が仕事の計画を立て、必要な専門Botを呼ぶ流れだ。公式ページの例では、クリエイティブディレクターの「North」が全体を指揮し、ソーシャル担当の「Ping」が投稿の作成や返信を担う。各Botは3種類の記憶を持ち、開始前に読み込む。フィードバックから学んだ仕事のコツ、プロジェクトごとのメモ、ワークスペースのハウススタイルの3つだ。他のチームメンバーがBotに教えた内容は、Botの利用者が承認してから反映される。Botの内側には、考えるモデルや自分のコンピューター、接続したアプリ、取り組む brief があり、SlackやMeta広告、Figma、ブラウザーなどと連携する。公式ページは「Botの作業43時間、あなたの作業7分」とうたっている。【ポイント・注意点】既存のKrea Agentとの違いは、Botが一つの担当に固定され、指示を一度書けば毎回それに従う点だ。現時点ではベータで利用にはウェイトリスト登録が必要。生成AIを制作の実作業に組み込む現場では、工程ごとのエージェント分担という方向性が示された形だ。実際にどこまで人の手を離れて回るかは、ベータでの利用を通じて見えてくるだろう。","2026-11-14","Krea","https://www.krea.ai/bots-beta"],["HeyGen、判定特化モデル「Decision 1」をAPIで公開","AIアバター動画のHeyGenが、テキスト・画像・動画を分類し、はい／いいえの評価や独自基準での採点を返す判定特化モデル「HeyGen Decision 1」をAPIで公開した。1リクエストで最大400問の名前付き質問を送れ、同期応答で結果が返る。Googleも別の判定特化モデルを発表しており、大量コンテンツの自動仕分けの選択肢が広がりつつある。大量コンテンツの仕分けに使える。","\n【概要】AIアバター動画のHeyGenが、テキスト・画像・動画を分類し、はい／いいえの評価や独自基準での採点を返す「HeyGen Decision 1」を公式ドキュメントで公開した。APIエンドポイントは同期応答で、1リクエストにつき最大400問の名前付き質問を送れる。【背景】生成AIで大量のコンテンツを作れるようになる一方で、出来上がったものを自動で仕分けたり、品質を判定したりする需要が高まっている。生成そのものではなく、判定に特化したモデルをAPIとして切り出す動きが各社で出てきた。HeyGenの発表もその流れの一つだ。【詳細】質問タイプは3種あり、1回の呼び出しで混在できる。真偽確率を返す「noul」、候補から1つを選ぶ「choice」、1〜10段階の基準で採点する「score」だ。モデルは「heygen-decision-1」で、プレビュー版の「heygen-decision-1-turbo」も用意されている。入力はテキストやJSONを中心に、画像は最大4枚、動画は1本を追加できる。ターボ版では画像100枚・動画10本に拡大されるが、全APIキーへの開放は今後の予定だ。エンドポイントはPOST /v3/models/decisionsで、同期応答のためポーリングやWebhookは不要だ。コンテキストの目安は標準モデルが約13万トークン、ターボ版が約26万トークンで、リクエスト全体は16MiB以内に収める必要がある。判定結果は各質問ごとに確率付きで返り、リクエストの振り分け、結果の順位付け、人のレビュー要否の判定などに使える。【ポイント・注意点】利用にはassets:writeスコープ付きのAPIキーが必要で、試用キーとOAuthは未対応。規定のリクエスト上限は、同一ワークスペース内で同一ユーザーが所有するAPIキー間で毎秒50件を共有する形だ。確率や確信度は参考値であり、高い値でも間違っている場合があるため、しきい値は自分の用途のラベル付き事例で確かめることが推奨されている。Googleも別の判定特化モデルを発表しており、大量コンテンツの自動仕分けの選択肢が増えつつある。","2026-11-14","HeyGen","https://developers.heygen.com/docs/models/heygen-decision"],["OpenAI「ChatGPT Wallet」、AIエージェントが買い物まで代行","OpenAIが、AIエージェント「Dots」がユーザーの代わりに買い物を済ませる決済機能「ChatGPT Wallet」を発表した。エージェントが商品選びから支払いまで進め、決済前にはユーザーが内容と合計、カードを確認し、顔認証や指紋で承認する。まずは米国のChatGPT Pro加入者の一部が対象で、エージェントは実際のカード情報を見ない仕組みだ。カードの特典や保護も維持される。","\n【概要】OpenAIが、AIエージェントがユーザーの代わりに買い物を済ませる決済機能「ChatGPT Wallet」を発表した。エージェントが何を買うべきかの判断を手伝い、支払いまで完了させる。まずは少数の米国ChatGPT Pro加入者が対象となる。【背景】AIエージェントは調べものや文章作成から、実際の行動へと広がりつつある。買い物はその代表例だが、決済にはカード情報の扱いや最終確認の仕組みが欠かせない。OpenAIは支払いの部分を切り出して、専用の仕組みとして提供し始めた。毎週12億人がChatGPTを使うとされ、多くが商品の調査や比較、購入の判断に使っているという。【詳細】対象はまず、18歳以上の米国ChatGPT Pro加入者の一部で、米国のVisa、Mastercard、American Expressのカードが使える。カードを一度登録すれば、購入のたびに支払い情報を入力し直す必要はない。決済の前にはユーザーが商品の内容と合計金額、使うカードを確認し、顔認証や指紋で承認する。承認のたびに、ユーザーがエージェントに許可した購入の明確な記録が残る。承認後、決済ネットワークが支払いトークンを発行する。これは実際のカード情報の代わりとなるもので、カード番号やセキュリティコード、有効期限を持つ。支払いは選んだカードに請求され、実際のカード情報は企業やエージェントと共有されない。カードの既存の特典や、対象となる紛争時の保護も維持される。OpenAIはあわせて、企業向けの「Commerce Partner Playbook」も公開し、エージェント経由の購入を受け入れるための手引きを示している。【ポイント・注意点】将来的には、支出の上限や購入の種類、期間といった条件を決めておくことで、購入をすべてエージェントに任せられるようになる見込みだ。ただし現時点では、承認のひと手間が安全弁になる設計で、承認画面の確認を習慣づけることが前提になる。まずは対象を絞った提供で、広がり方は今後の運用次第だ。","2026-11-13","OpenAI","https://openai.com/index/introducing-chatgpt-wallet"],["Perplexity、判定モデル「Decider v1.3」をオープンソース化","Perplexityが、判定に特化したモデル「Decider v1.3」と「Decider Flash v1.3」をオープンソース化した。新版の目玉は「locate」機能で、探している内容を言葉で伝えると、一致する箇所を正確に返してくれる。大量のセキュリティログの点検やバグ修正の手助けを主な用途として推奨しており、OpenRouterでは1週間無料で使える。","\n【概要】Perplexityが、判定に特化したモデル「Decider v1.3」と「Decider Flash v1.3」をオープンソース化した。新版で最も重要な能力は「locate」で、ユーザーが探しているものを言葉で説明すると、正確に一致する箇所を返してくれる。【背景】文章を生成するモデルとは別に、大量の文書やログの中から該当箇所を見つけ出し、正しいかどうかを判定するモデルへの需要が高まっている。セキュリティの現場では、膨大なログを人の目だけで点検するのは限界があり、判定モデルが実務の助けになる。【詳細】DeciderはTypeSafe AIの「Jev」に着想を得た判定モデルで、二値や多クラスの分類と順序付き・順序なしのラベルに対応し、確率を返す。用途は、出力の品質や安全性の判定、要求の振り分け、モデレーションやセキュリティ、フィルタリングやタグ付け、検索結果の順位付けなど幅広い。大きなモデルはQwen3.8-27Bを土台にし、小さなFlashはQwen3.5-4Bへ蒸留したもので、両モデルともApacheライセンスでHugging FaceやOpenRouter、PerplexityのDecisions APIから利用できる。locateは、名前付きエンティティの認識や個人情報の特定、抜粋型の質問応答のために、状態の中から一致する文字列をその開始位置と終了位置とともに返す。見つからなければ空のリストを返す。1回のリクエストでlocateと分類、採点を組み合わせることもできる。評価では、63件の分類タスクで平均精度91.6％を記録し、社内の本番分類器を6.54ポイント上回った。7つの領域すべてでJev 1.14を上回り、金融では最大12.9ポイント、法律では9.3ポイントの差がついた。【ポイント・注意点】判定モデルの精度は用途やデータによって変わるため、導入時には自分の現場のデータで試すことが欠かせない。社内では200超のタスクからなる評価セットをゼロショットで測っており、特定のタスクに合わせた調整なしでの性能を重視している。無料期間を活用して、ログ点検やバグ調査の実務でどれだけ役立つかを見極めたい。","2026-11-13","Perplexity","https://www.perplexity.ai/hub/blog/perplexity-decider"],["Devin、Teamsプラン刷新でデスクトップを全員に開放","Cognitionが、AIコーディングエージェントDevinのチーム向けTeamsプランを刷新した。これまで有料だったデスクトップアプリ「Devin Desktop」をチーム全員が追加費用なしで使えるようになり、自社モデルSWE-2の無料セッションも各ユーザーに2件まで同時提供される。シングルサインオンや費用管理など管理者向け機能も強化された。無料セッションは各ユーザー2件まで同時利用できる。","\n【概要】Devinを開発するCognitionが11月12日、チーム向けのTeamsプランを刷新した。これまで有料だったデスクトップアプリ「Devin Desktop」をチーム全員が追加費用なしで使えるようになった。新しい「Freeモード」では、自社開発のコーディングモデルSWE-2を利用した無料セッションが各ユーザーに2件まで同時提供される。【背景】AIコーディングエージェントをチーム全体に広げるうえで、1人あたりの追加料金は導入の壁になりやすい。デスクトップを全員に開放することで、開発メンバー全員が同じ環境でエージェントを使えるようになり、チームでの利用が進みやすくなる。【詳細】無料分を超えた分は追加料金で利用できる。デスクトップとCLIでのSWE-2無料利用は、Teams・Pro・Maxの各プランで恒久機能になる。SWE-2は同社で最も進んだコーディングモデルで、最先端モデルに近い性能を、その一部ほどのコストで出すとしている。管理者向けには、OktaやMicrosoft Entra IDなどSAML・OIDC準拠のIDプロバイダーとつなぐシングルサインオンに対応し、接続後はメールログインを無効にできる。ユーザーごとの利用上限を3段階で設定できる費用管理機能も加わり、上限を超えた申請を管理者の承認待ちにするか、設定した最大値まで自動承認するかを選べる。Devin Coachは、送信前にプロンプトへの助言も行い、小さな作業には軽いモードを提案する。医療分野向けには、保護健康情報の取り扱いに関する標準的な契約書をTeams顧客が設定画面から請求できるようになった。【ポイント・注意点】注意点が2つある。Teamsプランの利用枠付きシートの廃止は30日後に予定され、プランの上限はすでに200から100シートへ引き下げられている。スタートアップ向けには最大6万5,000ドルのクレジットが得られる支援プログラムもある。日本のチームにとっては、デスクトップの追加料金が消えたことで、AIエージェントを開発メンバー全員に配る場合のコスト構造が変わる変更だ。","2026-11-12","Cognition","https://devin.ai/blog/devin-teams-plan"],["AIがTCP/IPの脆弱性99件を90時間で発見、防御にも課題","セキュリティ企業Forescoutの研究組織Vedere Labsが、一般に入手できるAIモデルを使った脆弱性調査で、TCP/IPスタック10種から90時間で99件の脆弱性を発見したと発表した。うち66件が新規で、52％が重大または高の深刻度だった。2020〜21年の手作業では18か月を要した調査が大幅に短縮され、AIによる脆弱性発見の高速化が示された。防御側の対応が問われている。","\n【概要】セキュリティ企業Forescoutの研究組織Vedere Labsは11月12日、一般に入手できるAIモデルを使った脆弱性調査の成果を公式ブログで公表した。組み込みソフトウェア向けに専用のAIハーネスを作り、TCP／IPスタック10種へ実行したところ、90時間で99件の脆弱性を発見した。【背景】TCP／IPスタックはあらゆる機器の通信の土台で、欠陥があれば広範囲に影響する。2020〜21年に手作業で行った同種の調査は18か月を要した。AIに調査を任せることで、この作業を大幅に短縮できるかが試された。【詳細】発見された99件のうち33件は過去の調査結果の再発見で、66件が新規だった。54件はベンダーと保守者に報告済みで、内訳はオープンソースのTCP／IPスタック20件とプロプライエタリなスタック34件、修正済みはプロプライエタリ分のうち5件だけだ。発見された脆弱性の52％は重大または高の深刻度で、29％はスタックの中核部分に影響する。内訳はメモリ破壊48件、整数関連27件、入力検証16件、制御フローやロジック8件だった。調査時間の内訳は、AIによる独立した解析が10時間、動的な検証が約80時間だ。使われたモデルはClaudeファミリーで、はじめの段階ではSonnet 4.6、動的な検証ではOpus 4.6から5のあいだが使われた。静的解析ではSemgrepやJoern、バイナリの変換にはGhidraを使い、Joernのルールは32件用意された。静的解析では362件の候補検出に約935ドルを要し、1候補あたり平均2.58ドルだった。動的解析を含めた総モデル費は約1,200〜2,300ドルで、手作業を担う上級研究者の人件費と比べると、同社の推計でおよそ100分の1だ。【ポイント・注意点】ただし、この比較にはAIハーネスの設計や解析ルールの構築・調整の工数は含まれていない。過去の開示実績から、今回見つかった供給網の欠陥は数十社・数百製品に影響する可能性があると同社は述べている。AIによる脆弱性発見の高速化は防御側にも攻撃側にも等しく使えるため、パッチ運用の加速が実務上の対応の核心になる。","2026-11-12","Forescout","https://www.forescout.com/research-labs/finding-critical-infrastructure-bugs-with-off-the-shelf-ai/"],["AIペネトレ基盤「Cairn」悪用、自律攻撃25件を確認","Palo Alto NetworksのUnit 42が、オープンソースのAIペネトレーション基盤「Cairn」を攻撃者が自律運用した実態を公表した。2026年8〜9月に中国語圏の攻撃者が25件の作戦に使い、少なくとも19組織が標的になった。25作戦のうち10組織で不正アクセスやデータ取得に成功しており、攻撃の自動化が一般企業にも届く脅威になっている。認証強化と露出削減が防御の出発点になる。","\n【概要】Palo Alto Networksの脅威調査チームUnit 42は11月12日、攻撃者がオープンソースのAIペネトレーション基盤「Cairn」を自律運用した実態を公式ブログで公表した。2026年8〜9月に中国語圏の攻撃者がCairnを25件の作戦に使用し、少なくとも19組織が標的になった。Unit 42はこの活動を「CL-STA-1238」として追跡している。【背景】ペネトレーションテスト用のAI基盤は、もともと防御側が脆弱性を見つけるための道具だ。ところが同じ仕組みを攻撃者が使うと、標的と目標を与えるだけで、計画・実行・記録をAIが自分で進める自律攻撃が成立してしまう。攻撃の自動化が現実のものになった事例だ。【詳細】各作戦ではAIモデルに標的と目標が与えられ、計画・実行・記録を自分で進めた。Cairnは共有の「黒板」に発見を書き込み、事実と意図のグラフとして蓄積しながら、推論と探索のループを繰り返す。各作戦は3〜7段階で進み、偵察やWebアプリの悪用、認証情報の収集、権限昇格、内部ネットワークへの侵入と定着といった段階をたどった。攻撃者は香港のサーバーから改造版のCairnを動かし、米国に中継と準備の拠点を置いていた。作戦の長さは20分から50時間超に及ぶ。使用されたモデルは中国のZhipu GLM 5.2が13件、DeepSeek V4 Flashが8件、DeepSeek V4 Proが4件だった。確認された成果では、25作戦のうち10組織で不正アクセスまたはデータ取得に成功した。【ポイント・注意点】標的は半導体サプライチェーン7組織、防衛と防衛政策3組織、市民社会4組織に集中している。米教職員組合では会員記録100万件超とCRM連絡先約3万1,000件、職員のパスワードハッシュへのアクセスが記録された。半導体企業では、本番環境の認証情報を総当たりで奪い、無断で管理者アカウントと永続的なAPIトークンを作られた。産業オートメーションのメーカーでは約15万件の内部文書が対象になった。Unit 42はこの活動を中国関連の情報収集活動と中程度の確度で評価し、実行者は1人か少人数のチームだった可能性が高いとしている。攻撃の自動化は一般企業にも到達する脅威で、認証強化と露出削減が防御の出発点になる。","2026-11-12","Palo Alto Networks Unit 42","https://unit42.paloaltonetworks.com/cairn-framework-ai-autonomous-attacks/"],["首相官邸でフィジカルAI会合、2040年にロボット1,000万台目標","高市総理が11月12日、首相官邸でフィジカルAI関連企業との意見交換会を行った。総理はフィジカルAIを「日本成長戦略」の「戦略17分野」に位置づけ、2040年までに1,000万台規模のAIロボット導入と、世界シェア3割超となる20兆円の市場獲得を目標に掲げた。製造・小売・家庭での社会実装と人手不足対策が政策の柱になる。企業からは一貫支援や基盤開発の加速、データ集積の仕組み、複数年の導入支援が求められた。","\n【概要】首相官邸の公式ページによると、高市総理は11月12日、総理大臣官邸でフィジカルAI関連企業との意見交換会を行った。総理は会合で、フィジカルAIを「日本成長戦略」の「戦略17分野」に位置づけていることを述べた。そのうえで、2040年までに1,000万台規模のAIロボット導入を目標に掲げ、世界シェア3割超となる20兆円の市場獲得も目標に据えた。【背景】身体を持つAI、いわゆるフィジカルAIは、工場や店舗、家庭で実際に体を動かすロボットとして、人手不足への対応が期待されている。日本はロボットや部品の製造に強みがあり、この分野を成長戦略の柱に据える動きが進んでいる。【詳細】総理は会合で、「フィジカルAIは、人の仕事を奪うものではなくて、人とロボットが協調する現場を実現して、特に地域で深刻化している人手不足を解消するもの」だと述べた。現場で働く人の肉体的な負荷や危険の大きい業務を減らし、創造的で付加価値の高い仕事で活躍する未来も創っていけるとしている。また「関係性構築型」のフィジカルAIにも触れ、日本ならではの創造性を活かせると述べた。日本にはものづくりの文化や精密さへの情熱、品質への誇りを土台とした「現場力」があり、それが勝ち筋となるデータもあるとしている。出席企業からは、国産ロボット・主要部品の研究開発から量産拠点整備までの一貫支援、国産AI基盤の開発加速、GENIACのようなデータ集積の仕組み、複数年にわたる導入支援などの意見が提出された。【ポイント・注意点】製造・小売・家庭でのロボット社会実装と人手不足対策が政策の柱に置かれた。城内大臣は、フィジカルAIへの国内投資を引き出すため、今日の指摘を「日本成長戦略実行計画」に反映させ、国の支援の内容や必要な予算額を予見可能な形で明らかにするよう求められた。目標の数字は大きいだけに、具体的な支援の中身が問われる。総理は、フィジカルAIの社会実装を進めることで、地域の人手不足の解消につなげる考えを示した。出席した企業は、ロボットや部品の開発、AI基盤の整備などに取り組んでいる。","2026-11-12","首相官邸","https://www.kantei.go.jp/jp/105/actions/202611/12ikenkoukan.html"],["Google、GeminiアプリをApple CarPlayに対応","Googleが、GeminiアプリをApple CarPlayに対応させたと発表した。Android AutoやGoogle搭載車への提供に続く拡大で、iPhoneユーザーは車載画面からGemini Liveと音声で自然に会話できる。通勤中のカレンダー確認や未読メールの要約読み上げなどが想定され、車内での会話はiPhoneのGeminiアプリと同期される。車内での会話はiPhoneと同期される。","\n【概要】Googleは11月11日、GeminiアプリをApple CarPlayに対応させたと公式ブログで発表した。Android AutoやGoogle搭載車への提供に続く拡大で、iPhoneユーザーは車載画面からGemini Liveと音声で自然に会話できる。【背景】車の中は、運転中に手がふさがるため、音声アシスタントが最も力を発揮する場所の一つだ。これまでGeminiの車内利用はAndroid側が先行していたが、iPhoneユーザーにも同じ体験が広がることになった。毎日の通勤は平均で約1時間ハンドルを握る時間だとされ、その時間を有効に使いたいという狙いがある。【詳細】画面のアイコンをタップすると直近の会話を再開でき、新しい会話を始めることも可能だ。使い道としては、通勤中にカレンダーを確認する、Gmailと連携して未読メールの要約を読み上げてもらう、プレゼンの予行練習を音声で行う、といったパターンを公式が例示している。たとえば「今日の予定はどうなっているか」「未読メールを要約して」「四半期の発表を練習させて」といった声かけが想定されている。車内での会話はiPhoneのGeminiアプリと同期される。駐車後にチャット履歴から続きを参照できる。メール要約に使うDaily Brief機能は、事前に有効化する必要がある。18歳未満と欧州経済領域、ナイジェリアでは利用できない条件付きだ。提供はこの日から全世界のiOSのGeminiユーザーへ順次広がり、Gemini Liveの対応言語すべてが対象だ。【ポイント・注意点】利用には3点の準備が必要だ。iPhoneのGeminiアプリを最新版へ更新すること。マイク権限を許可すること。そして車に接続する前に、スマホ側でGemini Liveを一度使っておくこと。対応言語はGemini Liveの対応言語に準じる。本格的なドライブシーズンを前に、iPhoneでも車内でのAI音声アシスタントが選択肢に加わった形だ。CarPlay対応により、iPhoneユーザーも車内でGemini Liveを音声で使えるようになった。通勤中の1時間を有効に使いたいという狙いがある。","2026-11-11","Google","https://blog.google/innovation-and-ai/products/gemini-app/gemini-on-apple-carplay/"],["ElevenLabs、会議メモ・音声入力アプリ「ElevenAI」を発表","音声AIのElevenLabsが、ニューヨークで開いた自社サミットで、企業向けアプリ「ElevenAI」を発表した。対面を含む話し声を聞き取り、会議のメモと次のアクションを作るAIチームメイトという位置づけで、音声認識には最新モデルScribe v3を使う。無料の先行アクセスは11月11日時点で開始済みだ。会議終了後には出席者ごとの要約とアクション項目を配布し、通話中の補足情報の共有も備える。","\n【概要】音声AIのElevenLabsは11月11日、ニューヨークで開いた自社サミットで、企業の従業員向けアプリ「ElevenAI」を発表した。ElevenAIは対面を含む話し声を聞き取り、会議のメモと次のアクションを作るAIチームメイトという位置づけだ。音声入力と会議メモには最新の音声認識モデルScribe v3を使う。【背景】会議の記録や要約は、多くの職場で手間のかかる作業になっている。録音から文字起こし、要約、タスクの抽出までを一つのアプリにまとめることで、会議後の整理を減らす狙いがある。音声モデルを自社で開発するElevenLabsが、この分野に本格参入した。【詳細】会議終了後には出席者ごとの要約とアクション項目を配布する。通話中にリアルタイムで補足情報を共有する支援も備える。録音には同意と通知の仕組みが組み込まれている。無料の先行アクセスは11月11日時点で開始済みだ。サミットでは併せて、対話の順番制御や場面ごとのモデル選択を行う「Interaction Engine」、顧客を記憶する「Memory」、会話の前後作業を自動化する「Routines」なども発表された。パートナープログラムは44か国・550社超の体制で開始し、NVIDIAとの提携拡大も示されている。対面の会話も聞き取る設計のため、オンライン会議だけでなく、同じ部屋での打ち合わせの記録にも使える。【ポイント・注意点】会議メモと音声入力を1つのアプリにまとめた製品は国内でも複数あるが、音声モデルを自社開発するElevenLabs製という点が差になるかが見どころだ。録音の同意や通知の仕組みが組み込まれているとはいえ、実際の会議で使う際には、参加者への周知を忘れないようにしたい。先行アクセスで使い勝手を確かめ、自分の現場の会議の進め方に合うかを見極めるのがよい。ElevenAIは、音声AIを会議の現場に持ち込む製品で、録音から要約、タスクの抽出までを一つのアプリでまかなう。先行アクセスで使い勝手を確かめ、自分の現場の会議の進め方に合うかを見極めるのがよい。","2026-11-11","labmemo","https://labmemo.com/ai-news-roundup-2026-11-14/"]],"gh-pop":[["「rea」：エージェントがあらゆるものをリバースエンジニアリング","エージェントに既存のソフトウェアを調べさせるツール「rea」が、GitHubのトレンドで注目を集めている。アプリの振る舞いからネイティブバイナリまで、調査対象の仕組みをAIエージェントが読み解く。スター数は約45万9,000で、1週間で約1万9,000増えた。開発者がこの手法を自分の現場でも試したいと考えている表れといえる。幅広い技術やプラットフォームに対応する点も支持を集めている。","\n【概要】「rea」は、AIエージェントを使って既存のソフトウェアをリバースエンジニアリングするツールだ。アプリの振る舞いからネイティブバイナリまで、調査対象の仕組みをAIエージェントが読み解く。GitHubではスター数が約45万9,000に達し、直近1週間で約1万9,000増え、24時間でも約2,351増えている。フォーク数は約11万2,000で、TypeScriptで書かれている。【背景】AIエージェントが既存のソフトウェアを扱うには、まずその仕組みを理解しなければならない。ソースコードが手元にない場合、アプリの振る舞いやバイナリから推測するリバースエンジニアリングが必要になる。エージェントがこの調査を担うことで、開発者は仕組みの把握をAIに任せられるようになる。【詳細】「rea」は、エージェントに調べさせて学ばせることで、人が一から読み解く手間を減らす。幅広い技術やプラットフォームに対応し、調査の対象を選ばない点も支持を集める理由の一つだ。スター数の伸びは、エージェント時代のリバースエンジニアリングの定番になりつつあることを示している。エージェントに仕組みを調べさせる発想は、コードの読解だけでなく、アプリの挙動やバイナリの解析にも応用できる。開発者が自分の現場でもこの手法を試したいと考えている表れといえる。【ポイント・注意点】注意点として、調査の対象が他社の製品である場合、利用規約や法的な扱いに注意が必要で、自分のソフトウェアや調査が認められた対象に使うのが前提だ。リバースエンジニアリング自体は正当な用途も多いが、対象のライセンスや利用条件を確認したうえで使うことが大切だ。エージェントに調査を任せる場合も、最終的な判断は人が行う必要がある。reaの支持は、エージェントに調査を任せる発想が、開発者のあいだで広がりつつあることを示している。アプリの振る舞いからネイティブバイナリまで、対象を選ばない点も評価されている。調査の結果は、既存のソフトウェアの仕組みを把握する手がかりになる。","2026-11-14","GitHub","https://github.com/morluto/rea"],["「sherlock」：ユーザー名からSNSアカウントを探す定番ツール","ユーザー名からSNSアカウントを探すツール「sherlock」が、GitHubのトレンドで再び注目を集めている。Python製で、スター数は約11万1,000、直近1週間で約1万2,000増えた。長年の定番ツールとして知られ、OSINTの調査でユーザー名から複数のSNSのアカウントを横断的に探せる点が評価されている。多数のSNSを一度に確認できる点が評価されている。","\n【概要】「sherlock」は、ユーザー名からSNSアカウントを探すツールで、GitHubのトレンドで再び注目を集めている。Python製で、スター数は約11万1,000、直近1週間で約1万2,000増えた。長年の定番ツールとして知られ、OSINTの調査でユーザー名から複数のSNSのアカウントを横断的に探せる点が評価されている。【背景】インターネット上で同じユーザー名が複数のサービスで使われることは珍しくない。調査の現場では、ユーザー名を手がかりに、どのサービスにアカウントがあるかを調べる作業が欠かせない。sherlockはこの作業を自動化し、多数のSNSを一度に確認できる。【詳細】sherlockは、入力されたユーザー名を多数のSNSで検索し、存在するアカウントを一覧で表示する。Pythonで書かれており、コマンドラインから手軽に使える。調査の対象がどのサービスにアカウントを持っているかを、短時間で把握できる。長年にわたって使われ続けている定番ツールであり、OSINTの入門としても広く紹介されている。スター数の増加は、調査の需要が高まっていることを示している。【ポイント・注意点】注意点として、他人のアカウントを調べる行為は、目的や対象によっては問題になる。公開情報の調査であっても、プライバシーへの配慮が欠かせない。自分のアカウントの確認や、調査が認められた業務での利用にとどめることが大切だ。ツールの使い方を学ぶ際には、まず自分のユーザー名で試すのがよい。ユーザー名の調査は、セキュリティの現場や、自分のアカウントの確認にも使われる。多数のSNSを一度に確認できるため、調査の手間を大きく減らせる。調査を始める際には、まず自分のユーザー名で試し、表示される結果の見方に慣れるのがよい。公開情報の調査であっても、対象のプライバシーへの配慮は欠かせない。調査の結果は一覧で表示されるため、どのサービスにアカウントがあるかをひと目で把握できる。長年にわたって使われ続けている定番ツールであり、OSINTの入門としても広く紹介されている。","2026-11-14","GitHub","https://github.com/sherlock-project/sherlock"],["「t3code」：スマホからClaude Codeなどを操るツール","「t3code」は、Claude CodeやCodexなどをあらゆるコンピューターやスマートフォンから操作できるツールで、GitHubのトレンドで注目を集めている。TypeScript製で、スター数は約6万、直近1週間で約9,600増えた。外出先からスマホでエージェントを動かしたい開発者の需要に応えたものだ。フォーク数は約1万800で、複数のエージェントに対応する点も特徴だ。","\n【概要】「t3code」は、Claude CodeやCodexなどをあらゆるコンピューターやスマートフォンから操作できるツールで、GitHubのトレンドで注目を集めている。TypeScript製で、スター数は約6万、直近1週間で約9,600増え、24時間でも約1,269増えている。フォーク数は約1万800だ。【背景】AIコーディングエージェントは、開発者の作業を大きく変えつつある。ただし、エージェントを動かすには、通常はパソコンの前で操作する必要がある。外出先や移動中にエージェントを動かしたいという需要は、開発者のあいだで高まっている。【詳細】t3codeは、Claude CodeやCodexなどを、スマートフォンや別のコンピューターから操作できるようにする。外出先からスマホでエージェントに指示を出し、作業の進み具合を確認できる。TypeScriptで書かれており、複数のエージェントに対応する点が特徴だ。開発者の作業環境がパソコンに縛られなくなり、移動中でもエージェントを活用できる。スター数の伸びは、モバイルからエージェントを操る需要の大きさを示している。【ポイント・注意点】注意点として、リモートからエージェントを操作する場合、認証情報やアクセスの管理が重要になる。スマートフォンからの操作では、誤って指示を送らないよう確認の手順を設けることが大切だ。エージェントがコードを変更する権限を持つため、操作の範囲をあらかじめ決めておくのがよい。外出先からスマホでエージェントを動かせるようになると、移動時間や待ち時間を活用できる。エージェントがコードを変更する権限を持つため、操作の範囲をあらかじめ決めておくのがよい。開発の現場では、エージェントへの指示を出すタイミングが作業の流れを左右する。外出先でも指示を出せることで、作業の待ち時間を減らせる。認証情報の管理にも注意し、端末の紛失時に備えておきたい。複数のエージェントに対応する点も特徴で、使い分けたい開発者にとって便利だ。まずは一つのエージェントから試し、使い勝手を確かめるのがよい。","2026-11-14","GitHub","https://github.com/pingdotgg/t3code"],["「dsh-our-free-model」：無料で使えるAIモデルへの入口","「dsh-our-free-model」は、ログインやAPIキーなしでAIモデルを使えるようにするツールで、GitHubのトレンドで注目を集めている。DeepSeek V4.1 FlashやKimi K3を無料で使え、スター数は約7万4,000、直近1週間で約8,800増えた。2026年9月24日に作られたMITライセンスのプロジェクトだ。76のプロバイダーにも対応する。","\n【概要】「dsh-our-free-model」は、ログインやサインアップ、APIキーなしでAIモデルを使えるようにするツールだ。DeepSeek V4.1 FlashやKimi K3を無料で使える。GitHubではスター数が約7万4,000で、直近1週間で約8,800増えた。2026年9月24日に作られたMITライセンスのプロジェクトだ。【背景】AIモデルを使うには、通常はアカウント登録やAPIキーの取得が必要になる。手軽に試したい開発者にとって、この手間は小さくない。無料で使えるモデルへの入口を整えることで、AIの利用を広げる狙いがある。【詳細】このツールは、OpenCode ZenのゲートウェイとKilo AIの公開ゲートウェイを経由して、モデルに直接つなぐ。第三者の中継を挟まない設計だ。自分のAPIキーを持っている場合は、76のプロバイダーにも対応する。トークンの節約機能もあり、40KBのgit diffでは90％のバイトを削減できたというテスト結果が示されている。ローカルでOpenAI互換のゲートウェイとして動かすこともできる。無料枠の利用にはGitHubへのログインとリポジトリへのスターが必要な「EACチャンネル」がある。無料枠の上限は出口IPごとに決まり、上限を超えると429エラーが返り、6時間の窓が開く。【ポイント・注意点】注意点として、npmの素の名前のパッケージは公式ではないため、スコープ付きの「@ebony-vinyl/dsh-our-free-model」を使う必要がある。無料枠の上限や仕組みは変わる可能性があるため、利用前にREADMEで最新の情報を確認したい。自分のAPIキーを使う場合は、キーの管理にも注意が必要だ。無料で使えるモデルへの入口が整うことで、AIの利用を試すハードルが下がる。自分のAPIキーを持っている場合は、76のプロバイダーにも対応するため、使い分けができる。トークンの節約機能は、大量の差分を扱う開発者にとって便利だ。無料枠の上限や仕組みは変わる可能性があるため、利用前にREADMEで最新の情報を確認したい。","2026-11-14","GitHub","https://github.com/Ebony-Vinyl/dsh-our-free-model"],["「VoiceStudio」：完全ローカルの音声クローン代替ツール","「VoiceStudio」は、ElevenLabsのオープンソースで完全ローカルな代替となる音声クローンのツールで、GitHubのトレンドで注目を集めている。Python製で、スター数は約11万、直近1週間で約7,000増えた。クラウドに音声を送らず、自分のコンピューターだけで音声の複製や生成ができる点が評価されている。ローカルで動くため利用料金の心配もない。","\n【概要】「VoiceStudio」は、ElevenLabsのオープンソースで完全ローカルな代替となる音声クローンのツールだ。Python製で、スター数は約11万、直近1週間で約7,000増えた。クラウドに音声を送らず、自分のコンピューターだけで音声の複製や生成ができる点が評価されている。【背景】音声の複製や生成は、クラウドサービスを使うのが一般的だった。ただし、音声データを外部に送ることに抵抗がある場合や、利用料金を抑えたい場合には、ローカルで動く選択肢が求められる。VoiceStudioはこの需要に応えたものだ。【詳細】VoiceStudioは、音声のクローンや生成を自分のコンピューターだけで完結させる。クラウドに音声データを送らないため、プライバシーの面で安心できる。ローカルで動くため、利用料金の心配もない。Pythonで書かれており、オープンソースとして公開されている。スター数の伸びは、ローカルで動く音声AIへの関心の高さを示している。音声の複製は、ナレーションや読み上げ、音声アシスタントなど、さまざまな用途に使える。【ポイント・注意点】注意点として、音声の複製は他人の声を勝手に使うと問題になる。自分の声や、利用が認められた声だけを使うことが前提だ。ローカルで動かすには、コンピューターの性能も必要になる。利用前にREADMEで動作条件を確認し、自分の環境で動くかを確かめたい。音声AIをローカルで動かす流れは、プライバシーやコストを気にする利用者のあいだで広がっている。VoiceStudioはその選択肢の一つで、オープンソースとして公開されている。ElevenLabsの代替として注目される背景には、クラウドへの依存を減らしたいという需要がある。ローカルで完結する設計は、ネットワークが使えない環境でも動く利点がある。まずは短い音声から試し、品質を確かめるのがよい。ローカルで動くため、利用料金の心配がなく、自分のペースで試せる。クラウドに音声データを送らない点は、プライバシーを気にする利用者にとって大きな利点だ。","2026-11-14","GitHub","https://github.com/debpalash/VoiceStudio"],["「orca」：複数のコーディングエージェントを一元管理","「orca」は、Claude CodeやCodexなどのコーディングエージェントを自分のサブスクリプションで動かし、複数のエージェントをまとめて管理できるツールで、GitHubのトレンドで注目を集めている。TypeScript製で、スター数は約12万4,200、直近1週間で約6,500増えた。デスクトップ、モバイル、リモートのランタイムに対応し、どこからでもエージェントを動かせる。","\n【概要】「orca」は、Claude CodeやCodexなどのコーディングエージェントを自分のサブスクリプションで動かし、複数のエージェントをまとめて管理できるツールだ。TypeScript製で、スター数は約12万4,200、直近1週間で約6,500増え、24時間でも約1,287増えている。フォーク数は約7,900だ。【背景】複数のコーディングエージェントを使い分ける開発者は増えている。ただし、エージェントごとに画面や操作が分かれていると、管理が煩雑になる。複数のエージェントを一つの場所で動かし、まとめて管理できる仕組みが求められている。【詳細】orcaは、Claude CodeやCodexなどのコーディングエージェントを、自分のサブスクリプションで動かせる。デスクトップ、モバイル、リモートのランタイムに対応し、どこからでもエージェントを動かせる。複数のエージェントを一つの画面で管理できるため、作業の切り替えがしやすい。TypeScriptで書かれており、オープンソースとして公開されている。スター数の伸びは、複数のエージェントをまとめて使いたい開発者の需要を示している。【ポイント・注意点】注意点として、エージェントを自分のサブスクリプションで動かす場合、各サービスの利用規約や料金体系を確認する必要がある。複数のエージェントを同時に動かすと、利用量が増えることもある。まずは一つのエージェントから試し、使い勝手を確かめるのがよい。複数のエージェントを一つの画面で管理できるため、作業の切り替えがしやすい。デスクトップ、モバイル、リモートのランタイムに対応し、どこからでもエージェントを動かせる。自分のサブスクリプションで動かすため、追加の契約を結ばずに使える場合もある。エージェントを使い分ける開発者にとって、まとめて管理できる点は大きな利点だ。まずは一つのエージェントから試し、使い勝手を確かめるのがよい。エージェントの数が増えるほど、管理の手間も増えるため、一元管理の価値が高まる。スター数の伸びは、複数のエージェントをまとめて使いたい開発者の需要を示している。","2026-11-14","GitHub","https://github.com/stablyai/orca"],["アリババ、AIコードレビュー「open-code-review」を公開","アリババが、社内で2年以上使ってきたAIコードレビューアシスタント「open-code-review」をオープンソース化した。Go製でApache-2.0ライセンス、スター数は約5万1,169だ。決定的なパイプラインとLLMエージェントを組み合わせ、行単位のコメントを付ける。50のOSSリポジトリと200件の実際のPRで評価され、Claude Codeと同じモデルでより高い精度を示した。","\n【概要】アリババが、社内で2年以上使ってきたAIコードレビューアシスタント「open-code-review」をオープンソース化した。Go製でApache-2.0ライセンス、スター数は約5万1,169、フォーク数は約3,815だ。2026年5月18日に作られたプロジェクトで、社内では数万人の開発者が使い、数百万件の欠陥を検出してきたという。【背景】コードレビューは、ソフトウェアの品質を保つために欠かせない作業だ。ただし、人の目だけで大量のコードを点検するのは限界がある。AIにレビューを任せることで、見落としを減らし、開発の速度を上げる狙いがある。【詳細】このツールは、決定的なパイプラインとLLMエージェントを組み合わせ、行単位のコメントを付ける。「ocr scan」コマンドでファイル全体のレビューもできる。評価では、50の人気OSSリポジトリと200件の実際のPR、10言語、80人以上のシニアエンジニアが注釈を付けた1,505件の正解データを使った。Claude Codeと同じモデルで比較したところ、精度とF1スコアで上回り、トークン使用量は約9分の1、速度も速かった。ただし、再現率は意図的に低く抑えられている。インストールは「npm install -g @alibaba-group/open-code-review」で行う。OpenAIとAnthropicのAPIに対応し、GitHub ActionsやGitLab CI、Gerritとも連携できる。【ポイント・注意点】注意点として、再現率が低く抑えられているため、AIのレビューだけで品質を保証することはできない。人のレビューと組み合わせて使うことが前提だ。評価の結果は特定の条件でのものであり、自分のプロジェクトで同じ結果が得られるとは限らない。まずは小さなPRから試し、指摘の質を確かめるのがよい。AIのレビューは、人のレビューを補う位置づけで使うのがよい。指摘の質はプロジェクトによって変わるため、まずは小さなPRから試すのがよい。トークン使用量が約9分の1とされる点は、コストを抑えたいチームにとって利点だ。","2026-11-14","GitHub","https://github.com/alibaba/open-code-review"],["OpenAI、セキュリティスキャンCLI「codex-security」を公開","OpenAIが、セキュリティスキャンのCLIツール「codex-security」をオープンソース化した。コマンド「cs」でコードを走査し、脆弱性の検出から修正パッチの生成、修正の検証までを一貫して行える。スター数は約1万3,470で、2026年7月13日に作られたApache-2.0ライセンスのプロジェクトだ。検出から修正、検証までを一つのツールで完結させる。","\n【概要】OpenAIが、セキュリティスキャンのCLIツール「codex-security」をオープンソース化した。コマンド「cs」でコードを走査し、脆弱性の検出から修正パッチの生成、修正の検証までを一貫して行える。スター数は約1万3,470、フォーク数は約1,045で、2026年7月13日に作られたApache-2.0ライセンスのプロジェクトだ。【背景】ソフトウェアの脆弱性は、見つけるだけでなく、修正して検証するまでが一連の作業になる。これまでは検出と修正が別々のツールに分かれていることが多かった。検出から修正、検証までを一つのツールで完結させることで、セキュリティ対応の手間を減らす狙いがある。【詳細】このツールは、コマンドラインの「cs」コマンドとTypeScriptのSDKで提供される。インストールは「npm install --global @openai/codex-security」で行い、「cs login」でログインしてから「cs scan .」でスキャンを実行する。標準スキャンと深いスキャンの2種類があり、重複した指摘をまとめる。検出された脆弱性の検証や修正パッチの生成、修正の検証までを行い、SECURITY.mdの草案作成や脅威モデルの保存にも対応する。結果はSARIFやJSON、CSVで出力でき、LinearやJira、GitHubと連携して追跡できる。Codex Security Cloudは任意の追加機能だ。対応するモデル提供元はOpenAIのほか、BedrockやOpenRouter、Fireworksなどがある。動作にはNode.js 22.13以上または24.x、26.xとPython 3.10以上が必要だ。【ポイント・注意点】注意点として、一部のサイバー関連のリクエストには、Trusted Access for CyberやDaybreakの承認が必要になる場合がある。週1回のGitHub Actionでのスキャンは1回あたり約5ドルとされている。スキャンの結果はあくまで参考であり、最終的な判断は人が行う必要がある。","2026-11-14","GitHub","https://github.com/openai/codex-security"],["「plannotator」：計画書や差分に注釈を付けてエージェントへ返す","「plannotator」は、計画書や仕様書、差分に注釈を付けてエージェントにフィードバックを返すためのローカルツールで、GitHubのトレンドで注目を集めている。Apache-2.0ライセンスで、スター数は約1万781、2025年12月28日に作られた。Claude CodeやCodex、Copilot CLIなど複数のエージェントに対応する。ブラウザー上で動くローカルのレビュー画面で注釈を付ける。","\n【概要】「plannotator」は、計画書や仕様書、差分に注釈を付けてエージェントにフィードバックを返すためのローカルツールだ。Apache-2.0ライセンスで、スター数は約1万781、フォーク数は約801、2025年12月28日に作られたプロジェクトだ。【背景】AIエージェントに計画書や仕様書を作らせたあと、人が内容を確認して修正を伝える作業は欠かせない。ただし、チャットで指摘を伝えるだけでは、どの部分を指しているのかが分かりにくい。文書や差分に直接注釈を付けて返すことで、エージェントへの指示を明確にする狙いがある。【詳細】plannotatorは、ブラウザー上で動くローカルのレビュー画面で、計画書や仕様書、Markdown、HTMLに注釈を付けられる。差分やPRのレビューにも対応し、注釈を付けたフィードバックをエージェントに送る。対応するエージェントはClaude CodeやCodex、Copilot CLI、Gemini CLI、OpenCode、Kiro、Droid、Ampなど幅広い。「Plannotator Inbox」では、エージェントからのメッセージや質問、ファイル、レビューを一つの画面に集め、返信が次のターンとして届く。MCPにも対応する。テレメトリや分析機能はなく、計画書や差分は既定でローカルに置かれる。インストールは「curl -fsSL https://plannotator.ai/install.sh | bash」で行う。【ポイント・注意点】注意点として、インストールスクリプトを直接実行する前に、内容を確認する習慣をつけたい。ローカルで動くツールだが、エージェントへのフィードバックの内容によっては、外部のモデルに情報が送られる場合もある。機密情報を含む文書を扱う際には、利用するモデルの設定を確認することが大切だ。エージェントへのフィードバックは、注釈の形で具体的に伝えることで、修正の精度が上がる。対応するエージェントが多いため、自分の使っているエージェントで試せる場合が多い。まずは小さな計画書から試し、注釈の付け方に慣れるのがよい。","2026-11-14","GitHub","https://github.com/backnotprop/plannotator"],["AWS、ローカルで動くAWS APIエミュレーターを公開","AWSが、AWSのAPIをローカルで再現するエミュレーター「aws-emulator」をオープンソース化した。Rust製でCC0-1.0ライセンス、スター数は約7,832だ。AWSアカウントなしで、追加の利用料もかからずにAWSのAPIを試せる。2026年11月12日には1日で2,133スター増え、トレンド1位になった。サービスごとの再現度はリリースごとにスコアで示される。","\n【概要】AWSが、AWSのAPIをローカルで再現するエミュレーター「aws-emulator」をオープンソース化した。Rust製でCC0-1.0ライセンス、スター数は約7,832、フォーク数は約312、2026年9月11日に作られたプロジェクトだ。2026年11月12日には1日で2,133スター増え、その日のトレンド1位になった。【背景】AWSのサービスを開発やテストで使うには、通常はAWSアカウントが必要になる。クラウド上で試すと利用料がかかり、テストのたびにコストを気にする場面もある。ローカルでAWSのAPIを再現できれば、アカウントなしで開発やテストを進められる。【詳細】このエミュレーターは、AWSのAPIをローカルで動かし、AWSアカウントなしで、追加の利用料もかからずに試せる。サーバーモードと組み込みモードの2種類があり、組み込みモードではRustのテストで1テストごとに独立したインスタンスを使える。サーバーは自己署名証明書で127.0.0.1:9297のHTTPSで提供される。エージェント向けのスキルもあり、「aws agent-toolkit add-skill --skill-name aws-emulator」で追加できる。AWS CLI 2.35.0以上が必要だ。サービスごとの再現度はリリースごとにスコアで示され、未対応の部分はissuesで追跡されている。テレメトリは既定でオンだが、リクエストやレスポンスの内容、コード、認証情報、個人データは送られない。無効化は「--telemetry off」や環境変数、設定ファイルで行える。【ポイント・注意点】注意点として、ソースからビルドするには100GB以上のディスク容量とマルチコアのCPUが必要だ。本番環境やセキュリティテストには向かないと明記されている。再現度はサービスによって異なるため、利用前に自分の使うサービスのスコアを確認したい。ローカルでの開発やテストの用途にとどめるのがよい。ローカルでAWSのAPIを試せることで、開発やテストのたびにクラウドの利用料を気にせずに済む。サービスごとの再現度はリリースごとにスコアで示されるため、利用前に自分の使うサービスの状況を確認できる。","2026-11-14","GitHub","https://github.com/aws/aws-emulator"]],"gh-new":[["「ANR」：GPUのフレーム生成をオープンに再現する試み","「ANR」は、NVIDIAのDLSSなどに相当するフレーム生成や超解像、レイ再構成をオープンに再現するプロジェクトで、2026年11月11日に作られた。C++製で、スター数は約1,707だ。フレーム生成はベータ版で、超解像とレイ再構成は近日公開とされている。対応GPUはNVIDIAのRTX 20〜50シリーズやAMD、Intel Arcなど幅広い。比較用のツールも用意されている。","\n【概要】「ANR」は、NVIDIAのDLSSなどに相当するフレーム生成や超解像、レイ再構成をオープンに再現するプロジェクトだ。C++製で、スター数は約1,707、フォーク数は29、2026年11月11日に作られた。フレーム生成はベータ版で、超解像とレイ再構成は近日公開とされている。【背景】ゲームのフレーム生成や超解像は、これまでGPUメーカーごとの専用技術が中心だった。オープンな実装があれば、対応するGPUの幅が広がり、開発者やユーザーの選択肢が増える。ANRはこの分野のオープンな再現を目指している。【詳細】ANRには3つの機能がある。フレーム生成の「ANR FG」はベータ版で、超解像の「ANR SR」とレイ再構成の「ANR RR」は近日公開とされている。ソースコードは近日公開とされている。比較用のツール「nr-record」では、ANR FGとDLSS-G、DLSS、FSR、XeSSの録画を比べられる。対応GPUはNVIDIAのRTX 20〜50シリーズとGTX 16シリーズ、AMDのRX 5000〜9000シリーズとSteam Deck、Intel ArcのAシリーズとBシリーズだ。Windows 10と11、LinuxとSteamOSではProton経由で動く。パッケージは「anr-fg-full」と、OptiScalerを使う人向けの「anr-fg-addon」の2種類がある。F6キーで録画の開始と停止、F9キーで次の8フレームを切り替える。1フレームあたりの録画サイズは、3840×2160で約26MB、1806×972で約6MBだ。【ポイント・注意点】注意点として、超解像とレイ再構成はまだ公開されておらず、ソースコードも近日公開とされている。ベータ版のため、動作や品質は変わる可能性がある。利用前にREADMEで最新の対応状況を確認し、自分のGPUが対象かどうかを確かめたい。オープンな実装があれば、対応するGPUの幅が広がり、開発者やユーザーの選択肢が増える。ベータ版のため、動作や品質は変わる可能性がある。利用前にREADMEで最新の対応状況を確認したい。","2026-11-11","GitHub","https://github.com/apex-compute/ANR"],["「yogurt」：ボットを呼ばないプライベートな会議メモ","「yogurt」は、Granolaの代替となるプライベートなAI会議メモのアプリで、2026年11月10日に作られた。ElectronとTypeScript製でMITライセンス、スター数は約1,389だ。会議にボットを呼ばず、マイクとシステム音声を録音して文字起こしと要約を行う。記録はローカルで完結する設計だ。文字起こしにはwhisper.cppを使い、要約はローカルのオープンウェイトモデルで行う。","\n【概要】「yogurt」は、Granolaの代替となるプライベートなAI会議メモのアプリだ。ElectronとTypeScript製でMITライセンス、スター数は約1,389、フォーク数は70、2026年11月10日に作られた。会議にボットを呼ばず、マイクとシステム音声を録音して文字起こしと要約を行う。【背景】オンライン会議のメモを取るために、会議にボットを招待するサービスが広がっている。ただし、ボットが会議に参加することに抵抗がある場合や、記録をローカルに置きたい場合には、別の選択肢が求められる。yogurtはこの需要に応えたものだ。【詳細】yogurtは、会議にボットを呼ばず、自分のマイクとシステム音声を録音して文字起こしと要約を行う。ライブの文字起こしや要約、話者名の表示に対応し、ZoomやTeams、Meetで使える。ただし、話者名の表示はMacのみだ。99言語に対応し、録音のリマインダーや、出典付きの回答、フォルダーや検索、Markdownでの書き出しも備える。ローカルのMCPサーバーは読み取り専用で、既定ではオフになっている。通話が終わると自動で録音を止める。文字起こしにはwhisper.cppのlarge-v3-turboを使い、対応するMacではAppleのSpeechAnalyzerも使える。要約はGemma 4やgpt-oss、Qwen3などのローカルで動くオープンウェイトモデルをllama.cppで動かす。動作にはmacOS 14.4以上のApple Silicon、Windows 10の2004以降、Ubuntu 22.04以上のいずれかと8GBのメモリが必要だ。【ポイント・注意点】注意点として、セットアップでは約5GBのメモリ用モデルをダウンロードし、最適なモデルではさらに14GB以上が必要になる。録音する際には、参加者への周知を忘れないようにしたい。Frigadeが作ったプロジェクトで、プライベートな会議メモの選択肢として注目される。録音する際には、参加者への周知を忘れないようにしたい。プライベートな会議メモの選択肢として注目される。","2026-11-10","GitHub","https://github.com/FrigadeHQ/yogurt"],["「GestaltX」：iPhoneの設定値を編集するMobileGestaltエディタ","「GestaltX」は、iPhoneやiPadの設定値MobileGestaltを編集するエディタで、2026年11月9日に作られた。SwiftとSwiftUI製でGPL-3.0ライセンス、スター数は約7,514だ。地域コードやApple Intelligenceの機能フラグ、Dynamic Islandや常時表示などの設定を変更できる。iOS 27.x専用で、書き込み前には自動でバックアップが作られる。","\n【概要】「GestaltX」は、iPhoneやiPadの設定値MobileGestaltを編集するエディタだ。SwiftとSwiftUI製でGPL-3.0ライセンス、スター数は約7,514、フォーク数は約2,630、2026年11月9日に作られた。地域コードやApple Intelligenceの機能フラグ、Dynamic Islandや常時表示などの設定を変更できる。【背景】iPhoneの設定には、通常の設定画面では変更できない内部の値がある。MobileGestaltはその一つで、端末の機能や表示を決める設定値を保持している。GestaltXはこの値を編集するためのツールだ。【詳細】GestaltXでは、地域コードの選択やApple Intelligenceの機能フラグ、オンデバイスのSiri、Dynamic Islandや常時表示、HDR、壁紙の視差効果、モデル名、チャイム、充電制限、タップしてスリープ解除、カメラコントロール、アクションボタン、衝突SOS、Apple Pencil、ステージマネージャーなどを変更できる。CacheExtraのフィールドエディタも備える。書き込み前には毎回自動でバックアップが作られ、ハードウェアのなりすましからの復旧にも対応する。対象はiPhone 11〜15とSEの第2〜3世代だ。署名には証明書とプロビジョニングプロファイルが必要で、App Groupの設定も求められる。アドホックのIPAはSideStoreやAltStore向けに用意されている。【ポイント・注意点】注意点として、対象はiOSとiPadOSの27.xのみで、26.xではオンデバイスでのアクセスに対応していない。セキュリティ研究や教育目的で、自分の端末だけに使うことが前提とされている。設定の変更は不安定さや復元の原因になる場合があるため、事前にバックアップを取ることが大切だ。設定の変更は、端末の機能や表示を自分の好みに合わせる手段になる。ただし、内部の値を変える行為には不安定さのリスクが伴う。事前にバックアップを取り、自分の端末だけに使うことが大切だ。","2026-11-09","GitHub","https://github.com/huamidev/GestaltX"],["「agentes-chat」：AIエージェントが参加するSlack代替","「agentes-chat」は、AIエージェントがチャンネルやDMに参加するセルフホスト型のSlack代替で、2026年11月9日に作られた。TypeScript製でAGPL-3.0ライセンス、スター数は約1,375だ。エージェントは役割や予算を持って参加し、ClaudeやChatGPT、Gemini、Grok、OpenRouterなどのモデルを使える。セルフホストで自分の環境で管理できる。","\n【概要】「agentes-chat」は、AIエージェントがチャンネルやDMに参加するセルフホスト型のSlack代替だ。TypeScript製でAGPL-3.0ライセンス、スター数は約1,375、フォーク数は241、2026年11月9日に作られた。エージェントは役割や予算を持って参加し、ClaudeやChatGPT、Gemini、Grok、OpenRouterなどのモデルを使える。【背景】チームのチャットにAIエージェントを参加させる動きが広がっている。ただし、クラウドのチャットサービスにエージェントを組み込むと、データの扱いやコストの管理が課題になる。セルフホストでエージェントを動かせれば、自分の環境で管理できる。【詳細】agentes-chatでは、エージェントがチャンネルやDMに役割や担当者、予算を持って参加する。モデルはClaudeやChatGPT-Codex、Gemini、Grok、OpenRouterから選べる。MCPツールや自分のコンピューターとブラウザー、ルーティンやメモリ、承認の仕組みも備える。マージやデプロイ、機微な操作は人の承認を待つ。承認のカードがチャットに表示される。モデルの呼び出しはすべて予算を決めて記録される。メンションされていないメッセージには、ルーターが最大4人のエージェントを選んで対応する。LinearやSentry、Notion、Stripeとはワンクリックで連携でき、Composio経由でDriveやカレンダー、Slackなどにもつなげられる。SKILL.mdからスキルを読み込み、Obsidianのインポートに対応したWikiやタスクボードも備える。Grok BotやChatGPTのdots、OpenBot.runなどからのインポートにも対応し、14言語で使える。【ポイント・注意点】注意点として、セルフホストで動かすには、PostgreSQLが唯一の依存関係とされている。Tailscaleを使えば約10分でプライベートなHTTPS環境を作れるとされている。商用利用には別途ライセンスが必要だ。まずは自分の環境で試し、エージェントの動きを確認するのがよい。","2026-11-09","GitHub","https://github.com/agentes-chat/agentes-chat"],["「S2Arm」：SwitchのゲームをiPhoneでネイティブ実行","「S2Arm」は、自分のSwitchのゲームをiPhoneやiPad、Macでネイティブに動かすプロジェクトで、2026年11月8日に作られた。C#製でApache-2.0ライセンス、スター数は約2,901だ。ARM64への書き換えで、グラフィックスはMetalに直接出力する。iPhone 17 Pro MaxではSwitch 2のゲームがフル60fpsで動いたとされている。","\n【概要】「S2Arm」は、自分のSwitchのゲームをiPhoneやiPad、Macでネイティブに動かすプロジェクトだ。C#製でApache-2.0ライセンス、スター数は約2,901、フォーク数は525、2026年11月8日に作られた。ARM64への書き換えで、グラフィックスはMetalに直接出力する。【背景】Switchのゲームを別の端末で動かすには、エミュレーターを使う方法が一般的だった。ただし、エミュレーターでは性能や互換性の課題がある。ゲームをARM64のネイティブコードに書き換えることで、iPhoneやMacで直接動かす狙いがある。【詳細】S2Armは、自分のSwitchのゲームをARM64に書き換え、グラフィックスをMetalに直接出力して動かす。ライブラリ全体を一つのアプリで管理でき、Appの枠を一つだけ使う。MacとWindows向けのグラフィカルなランチャーもあり、AIから「s2armctl」で操作できる。調査した211タイトルでは、初回のビルド成功率が95％だった。実機でのテストはiOSで4,700回超、macOSで1,000回超行われた。iPhone 17 Pro Maxでは、Switch 2のゲームがフル60fpsで動き、持続時でも37〜43fps、1フレームあたり約0.15Jだったとされている。16GBのMacBook Air M3でのビルド時間は、23.5GBのアクションRPGで6.4分、12GBの生活シミュレーションで8.6分、17.5GBのオープンワールドで34分だった。対象はiOSとiPadOSの18以上、MacはAppleシリコンのmacOS 15以上だ。【ポイント・注意点】注意点として、64ビットのAArch64のみに対応し、32ビットには対応していない。AndroidとHarmonyOSは近日対応とされている。自分のゲームとキーを持っていることが前提で、無料で提供され、寄付は受け付けていない。入手はs2arm.comかGitHubからのみとされている。","2026-11-08","GitHub","https://github.com/jhaizhou-ops/S2Arm"],["「Hookshot」：ゼルダ時オカSwitch 2版をPCへ静的再コンパイル","「Hookshot」は、ゼルダの伝説 時のオカリナのSwitch 2版をC言語へ静的再コンパイルし、WindowsやLinuxのプログラムとして動かすプロジェクトで、2026年11月5日に作られた。C++製でGPL-3.0ライセンス、スター数は約9,200だ。Switch 2のグラフィックスをVulkanで再構築している。自分のコピーからPC上でビルドする仕組みだ。","\n【概要】「Hookshot」は、ゼルダの伝説 時のオカリナのSwitch 2版をC言語へ静的再コンパイルし、WindowsやLinuxのプログラムとして動かすプロジェクトだ。C++製でGPL-3.0ライセンス、スター数は約9,200、フォーク数は836、2026年11月5日に作られた。Switch 2のグラフィックスをVulkanで再構築している。【背景】古いゲームを現代のPCで動かすには、エミュレーターを使う方法が一般的だった。ただし、エミュレーターでは性能や互換性の課題がある。ゲームのコードを静的に再コンパイルすることで、PCのネイティブプログラムとして動かす狙いがある。【詳細】Hookshotは、ゼルダの伝説 時のオカリナのSwitch 2版をC言語に静的再コンパイルし、WindowsやLinuxのプログラムとして動かす。コンソールのシステムソフトウェアを再実装し、Switch 2のグラフィックスをVulkanで再構築している。自分のコピーからPC上でビルドする仕組みで、リポジトリにはゲーム本体やキー、実行ファイルは含まれていない。必要なのはゲームプログラムの「0400486024DEC000」、更新データのv131072、ビルドの「e0f3ccfa」だ。動作にはWindows 10か11の64ビット、またはglibc 2.35以上のLinux、AVX2対応のCPU、Vulkan 1.3とメッシュシェーダー対応のGPUが必要で、VRAMは8GB以上、メモリは16GB以上が推奨される。ビルド中は約60GBの空き容量が必要で、ビルド時間は10〜45分だ。コキリの森でのプレイや音声、コントローラー、キーボード、セーブ、ゲーム内メニュー、フレーム生成、アップスケーリングが動く。v2.0.2ではちらつきが修正された。【ポイント・注意点】注意点として、新しいエリアに初めて入るときにカクつく場合がある。ハイラル平原や城下町、カカリコ村、ダンジョンには到達できるが、ライティングや影、クラッシュなどの既知の不具合がある。一部のユーザーから、リリースファイルがトロイの木馬として検出されたという報告があるが、READMEではそうではないと説明されている。利用前にREADMEで最新の対応状況を確認したい。","2026-11-05","GitHub","https://github.com/NotRexed/Hookshot"],["「poki」：AIエージェントが実際のiPhoneを操作する","「poki」は、AIエージェントが実際のiPhoneを操作するツールで、2026年11月5日に作られた。AGPL-3.0ライセンスで、スター数は約1,214だ。脱獄なしで、追加のハードウェアも不要で、画面を読み取り、タップや入力、スクロールを実際のアプリで行う。支払いや削除、Walletの操作は必ず承認を求める。iOS 27以上ではネイティブの制御、iOS 18〜26ではXCTestのセッションを使う。","\n【概要】「poki」は、AIエージェントが実際のiPhoneを操作するツールだ。AGPL-3.0ライセンスで、スター数は約1,214、フォーク数は210、2026年11月5日に作られた。脱獄なしで、追加のハードウェアも不要で、画面を読み取り、タップや入力、スクロールを実際のアプリで行う。【背景】AIエージェントがスマートフォンを操作するには、通常はエミュレーターや専用のハードウェアが必要になる。実際のiPhoneを直接操作できれば、開発者やユーザーの手間が減る。pokiはこの需要に応えたものだ。【詳細】pokiは、ローカルのMCPサーバーとエージェントで、実際のiPhoneを操作する。脱獄や追加のハードウェアは不要で、画面を読み取り、タップや入力、スクロールを実際のアプリで行う。支払いや削除、Walletの操作は必ず承認を求める。MacやWindowsのPCから一度インストールすれば、あとはiPhone単体で動く。無料のApple Accountでの署名は7日間有効で、Poki Setupが更新する。対象はiOS 18以上で、iPhone XSやXR、SEの第2世代以降に対応し、iOS 27でテストされている。iOS 27以上ではネイティブの制御、iOS 18〜26ではXCTestのセッションを使う。モデルは、ChatGPT PlusやProへのサインインが最も手軽で、AnthropicやOpenAI、Gemini、DeepSeek、OpenRouterのAPIキーや、自分のOpenAI互換サーバーも使える。Claudeのサブスクリプションではサインインできないため、AnthropicのAPIキーが必要だ。【ポイント・注意点】注意点として、画面の内容は選んだモデルサービスに送られるため、プライバシーの扱いに注意が必要だ。音声を使うには音声モデルのキーが必要で、アクションボタンの長押しで話しかけられる。ショートカットやSiriにも対応している。まずは自分のiPhoneで試し、操作の範囲を確認するのがよい。","2026-11-05","GitHub","https://github.com/JosssphZhou/poki"],["「gputaskman」：GPUの中身を見るhtop風ツール","「gputaskman」は、GPUの中身をhtopのように表示するターミナルUIのツールで、2026年11月3日に作られた。Python製でMITライセンス、スター数は約3,180だ。WindowsのNVIDIAやAMD、LinuxやWSL、macOSのApple Siliconに対応し、プロセスごとのGPUメモリやエンジンの動き、読み込まれたモデルファイルを確認できる。","\n【概要】「gputaskman」は、GPUの中身をhtopのように表示するターミナルUIのツールだ。Python製でMITライセンス、スター数は約3,180、フォーク数は155、2026年11月3日に作られた。WindowsのNVIDIAやAMD、LinuxやWSL、macOSのApple Siliconに対応する。【背景】GPUでAIモデルを動かす際、どのプロセスがどれだけのメモリを使っているかを確認するのは、トラブルの切り分けに欠かせない。ただし、標準のツールだけでは、モデルファイルごとの内訳まで見るのは難しい。gputaskmanはこの需要に応えたものだ。【詳細】gputaskmanは、ターミナルUIでプロセスごとのGPUメモリやエンジンの動き、読み込まれたランタイムやモデルファイル、LLMのバッファーの内訳を表示する。WindowsではNVIDIAとAMDのテレメトリとIntelのWDDM、LinuxとWSL、macOSのApple Siliconに対応する。インストールは「uv tool install gputaskman」や「pipx install gputaskman」で行い、「gtm」という短いコマンドでも使える。ポータブルなWindowsのZIPやLinuxのtarballも用意されている。カウンターは実測値だが、分類やGGUFの内訳は推定値だ。llama.cppやnvidia-smiとの照合では、たとえばllama-serverのQwen2.5-1.5Bで1.19GBと1218MiBという一致が確認されている。【ポイント・注意点】注意点として、まだ実験的なソフトウェアとされている。VRAMのダンプやゲームのテクスチャの列挙は行わず、対象はローカルのGPUワークロードのみで、クラウドには対応していない。署名なしのビルドには.sha256ファイルが添付されている。まずは自分の環境で試し、表示される値が期待通りかを確認するのがよい。GPUの利用状況を把握することで、モデルの実行時のトラブル切り分けがしやすくなる。カウンターは実測値だが、分類やGGUFの内訳は推定値である点には注意したい。","2026-11-03","GitHub","https://github.com/shanselman/gputaskman"],["「exact」：一度書けばWeb・Mac・iOS・Linuxで動くUI基盤","「exact」は、一度書けばWebやmacOS、iOS、Linuxでネイティブに動くUI基盤で、2026年11月2日に作られた。RustとTypeScript製でMITライセンス、スター数は約4,131だ。UIは小さな宣言型言語「Contract」で書き、データの処理はTypeScriptかRustで行う。エージェントが各ホストでビルドや実行、テストを行える設計だ。","\n【概要】「exact」は、一度書けばWebやmacOS、iOS、Linuxでネイティブに動くUI基盤だ。RustとTypeScript製でMITライセンス、スター数は約4,131、フォーク数は100、2026年11月2日に作られた。UIは小さな宣言型言語「Contract」で書き、データの処理はTypeScriptかRustで行う。【背景】アプリを複数のプラットフォームで動かすには、通常はプラットフォームごとに作り直す必要がある。WebViewを使えば共通化できるが、性能や見た目の課題がある。exactは、WebViewを使わずに各プラットフォームでネイティブに動く仕組みを目指している。【詳細】exactでは、UIをContractという小さな宣言型言語で書き、データの処理をTypeScriptかRustで行う。Contractのコンパイラがコンパクトな計画に変換する。Webでは約20KBのランタイムで動く一つのESモジュールが実際のDOMを駆動する。macOSやiOS、Linuxでは、RustのランナーとレイアウトカーネルがAppKitやUIKit、GPUの描画を使う。WebViewやJSのブリッジは使わず、最初のピクセルが表示される前にアプリのJSは動かない。エージェント向けには10の操作が用意され、「scripts/agent.mjs」でツリーやスクリーンショット、タップ、入力、状態、レイアウト、ログ、時計などを操作できる。エージェントが持つ時計で「clock +60000」や「clock settle」といった操作ができ、タイミングによるテストの不安定さを避けられる。テストは操作スクリプトで、どのホストでも同じように実行できる。【ポイント・注意点】注意点として、まだプレ1.0で、変更が頻繁にあり、APIの安定性や後方互換性はないとされている。READMEによると、新しいエージェントがTODOアプリを作り、WebやmacOS、iOSシミュレーターでテストを通すまでに約57分かかった。冷えた状態から最初のフレームが表示されるまでの目標は100msとされている。まずは小さなアプリから試すのがよい。","2026-11-02","GitHub","https://github.com/expo/exact"],["「Henge」：iPhoneでmacOSを動かすエミュレーター","「Henge」は、iPhoneやiPadでmacOSを動かすエミュレーターで、2026年11月2日に作られた。C言語製でGPL-2.0-or-laterライセンス、スター数は約2,260だ。QEMUを使わず独自のJITやMMU、デバイスを持ち、Appleの復元イメージをダウンロードしてMacのように復元する。iPhone 17 Proでは約15秒でロック画面に到達した。","\n【概要】「Henge」は、iPhoneやiPadでmacOSを動かすエミュレーターだ。C言語製でGPL-2.0-or-laterライセンス、スター数は約2,260、フォーク数は190、2026年11月2日に作られた。QEMUを使わず独自のJITやMMU、デバイスを持ち、Appleの復元イメージをダウンロードしてMacのように復元する。【背景】iPhoneでmacOSを動かすには、通常はハイパーバイザーが必要になる。ただし、iOSはアプリにハイパーバイザーを与えない。Hengeは、独自のJITやMMU、デバイスでmacOSをエミュレートする仕組みだ。【詳細】Hengeは、QEMUやVirtualization.frameworkを使わず、独自のJITとMMU、デバイスでmacOSをエミュレートする。Appleの復元イメージをダウンロードし、復号やパッチを当てずにMacのように復元する。グラフィックスは仮想GPUをMetalで再生し、SafariやElectronのアプリも描画できる。画面はMagic Trackpad 2として動き、2本指のスクロールや3本指のスワイプでSpacesやMission Controlを操作できる。音量ボタンでクリックや右クリック、ドラッグもできる。iPadではキーボードやマウス、USB-C経由の外部ディスプレイも使える。コピー＆ペーストや共有フォルダーにも対応する。iPhone 17 Proでは、macOSが約15秒でロック画面に到達し、Discordも約15秒で開いてログインし、メッセージを送れた。【ポイント・注意点】注意点として、サイドロードにはSideStoreやAltStore、TrollStoreが必要で、iOSとiPadOSの17以上、A14やM1以上のチップが求められる。JITにはStikDebugやTrollStore、脱獄、またはiOS 26以上のStikJITヘルパーが必要だ。Sequoiaでは約43GBの空き容量が必要で、Macには4GBか6GB、8GBのメモリが割り当てられる。macOS内でのApple Accountへのサインインは失敗し、一度の起動で動かせるMacは一つだけだ。iPadでの対応は新しく、実機での確認はまだ十分ではない。まずは小さな用途から試すのがよい。","2026-11-02","GitHub","https://github.com/Leviidev/Henge"]],"gh-blog":[["CopilotにGoogle「Gemini 4 Hydrogen」が一般提供開始","Googleの最新Flashモデル「Gemini 4 Hydrogen」がGitHub Copilotで一般提供を開始した。高速で効率的なエージェント型コーディングやツール利用、複数段階の作業に向けたモデルで、Gemini 3.8 Flashより指示への追従性が向上したという。CopilotのProやBusiness、Enterpriseなど幅広いプランで使え、VS CodeやJetBrains、Xcode、モバイルなど各画面のモデル選択欄から選べる。","\n【概要】Googleの最新Flashモデル「Gemini 4 Hydrogen」が、2026年11月13日にGitHub Copilotで一般提供を開始した。高速で効率的なエージェント型コーディングやツール利用、複数段階の作業に向けたモデルで、Gemini 3.8 Flashと比べて指示への追従性が改善されているという。利用料金は従量課金のもとでプロバイダーの定価が適用される。【背景】Copilotのモデル選択肢はこの秋に急速に広がっている。11月10日にはGemini 4 Carbon、11月9日にはAnthropicのClaude Fable 5.2が一般提供となっており、Hydrogenはその流れに続く追加だ。開発者は作業の性質に合わせてモデルを選べるようになり、GitHubはモデルを固定せず使い分ける方向を強めている。【詳細】HydrogenはCopilot Pro、Pro+、Max、Business、Enterpriseの利用者が選べる。Visual Studio Code、Visual Studio、Copilot CLI、GitHub Copilotコーディングエージェント、Copilotアプリ、github.com、iOSとAndroidのGitHub Mobile、JetBrains IDE、Xcode、Eclipse、Copilot SDKのモデル選択欄に表示される。展開は段階的で、すぐ表示されない場合は後で確認するよう案内されている。管理者はCopilot設定のモデルポリシーで利用可否を管理でき、既定では新しいモデルは自動的に有効になる。【ポイント・注意点】速さと効率を売りにするモデルだが、複雑な推論や大規模なコードベースの作業にはCarbonやFable 5.2など上位のモデルが向く場合がある。料金は従量課金のため、使い分けの前に各モデルの単価を確認しておくとよい。段階的展開のため、自分の環境に表示される時期にはばらつきがある。モデルはVS CodeやJetBrainsなど、開発者がふだん使う画面のほぼすべてで選べる。","2026-11-13","GitHub Changelog","https://github.blog/changelog/2026-11-13-gemini-4-hydrogen-in-github-copilot"],["任天堂のDMCAでSwitch関連217リポジトリがGitHubから削除","任天堂がGitHubに送った4件のDMCA通知により、Switch関連のリポジトリ約217件が削除された。対象はSwitchの改造チップ用ファームウェアと、エミュレーターのYuzuやその派生のCitron Neoで、通知は11月6日付でGitHubのDMCAアーカイブに公開された。Switch 2のエミュレーターは今のところ対象外だが、Yuzuのコードとつながりがあるため今後の動きに注意が必要だ。","\n【概要】任天堂がGitHubに送った4件のDMCA通知により、Nintendo Switch関連のリポジトリ約217件が削除された。対象はSwitchの改造チップ（モドチップ）用ファームウェアと、エミュレーターのYuzuやその派生版Citron Neoで、通知は2026年11月6日付でGitHubの公開DMCAアーカイブに掲載された。【背景】任天堂は2024年にYuzuの開発元Tropic Hazeとの訴訟を240万ドルの和解金で終えており、Yuzuの開発はその時点で終わっている。今回はその残存コピーや派生、さらにモドチップのファームウェアにまで対象が広がった。モドチップは本体に半田付けしてセキュリティーを迂回する装置で、PicoflyはTeam-Xecuter製チップの代替品として知られる。【詳細】最大の削除はPicoflyのファームウェアで、親リポジトリとフォークを含め144件が対象となった。Citron Neoは親リポジトリとフォーク計72件が削除され、Yuzuのコピー2件も通知の対象になった。任天堂は通知の中で、Switch本体とゲームが技術的保護手段（TPM）で守られており、これらのリポジトリがその迂回に当たると主張している。GitHubは通知を受けてネットワーク全体を無効化した。【ポイント・注意点】削除後もPicoflyやHWFLYのファームウェアの一部はGitHub上に残っているとの報道もあり、完全に消えたわけではない。Switch 2のエミュレーターEglantineやLichiiはYuzuのコードベースとつながりがあるため、次の対象になる可能性が指摘されている。任天堂は最近、Switch 2の脱獄に使われた脆弱性も修正している。通知はGitHubの公開DMCAアーカイブで誰でも確認でき、削除の経緯が記録として残っている。任天堂は2月にもSwitchエミュレーター13件をまとめて対象にし、8月にはSuyu関連の311件に措置を取ったことが報じられている。今後の動きにも注意したい。","2026-11-12","XDA Developers","https://www.xda-developers.com/nintendo-dmca-crackdown-wipes-over-200-switch-projects-off-github-switch-2-emulators-safe/"],["GitHub Universe 2026総括、Copilotは調整役へと進化","GitHub Universe 2026の発表をパートナー視点で整理した解説記事が公開された。目玉はエージェント中心の作業空間となったCopilotアプリと、モデル選択を「労力の度合い」に置き換えるCopilot Fusionの一般提供だ。複数リポジトリを束ねるCopilot Projectsや、AIによるセキュリティー検出の拡張も並び、開発の主役がコード生成から「成果物の完成」へ移ったことが強調されている。","\n【概要】GitHub Universe 2026の発表内容をパートナー視点で総括する解説が、2026年11月12日に公開された。中心にあるのは、Copilotがコード補完の道具から、エージェントとツールを束ねる調整役のプラットフォームへ変わったという見立てだ。発表はオーケストレーション、エージェント対応の作業手順、セキュリティー、基盤の4テーマに整理されている。【背景】GitHubは10月28日のUniverseで、Copilotアプリ、Copilot Fusion、Copilot Projects、Copilot Automationsなどを一斉に発表した。背景には、AIエージェントが大量のコードを生み出す時代に、人の仕事が「書くこと」から「指示して確認し、仕上げること」へ移っているという認識がある。記事はこの転換を「意図から完成したソフトウエアへ」と表現している。【詳細】Copilot FusionはStandard・High・Maxの労力レベルを選び、裏側で最適なモデルを組み合わせる。Fusion MaxはArtificial Analysisのコーディングエージェント指数で60点を記録し、Claude CodeとOpus 5.5 Maxの62点に2点差まで迫りながら、1タスクあたりのAPI費用は半分以下とされる。Copilot Projectsは複数リポジトリの作業を一か所に集約する。セキュリティーではAI Scanの拡張、AIによるプッシュ保護、パッケージファイアウォール、到達可能性分析が並んだ。基盤では年間でCPUコア400万、高速ストレージ160PB、ネットワーク50Tb/sを追加したとされる。【ポイント・注意点】料金面では、GitHub Enterpriseの利用者が別途のCopilot契約なしにCopilot機能を使えるようになり、AIクレジットの従量課金に移る。Fusionの30%割引は11月30日までとされ、12月以降の予算には注意が必要だ。ProjectsやコードレビューMaxはプレビュー段階のため、仕様は今後変わる可能性がある。","2026-11-12","SoftwareOne","https://www.softwareone.com/en/channel-partner/articles/2026/11/12/github-universe-2026-for-partners"],["GitHubのシークレット検出がCloudflareトークンに対応","GitHubのシークレットスキャンが、Cloudflareのサービストークンを検出できるようになった。新たに検出対象となったのは「cloudflare_access_service_token」で、公開リポジトリで見つかったパートナーシークレットは発行元であるCloudflareへ自動で報告される。個人のシークレットは公開・非公開どちらのリポジトリでもアラートが出る。","\n【概要】GitHubのシークレットスキャンが、Cloudflareのサービストークンを新たに検出できるようになった。2026年11月12日の変更履歴で案内された。検出対象は「cloudflare_access_service_token」で、リポジトリ内に誤って置かれた認証情報を見つける仕組みがまた一つ広がった。【背景】シークレットスキャンは、APIキーやトークンといった秘密情報がコードに紛れ込むのを自動で見つけるGitHubの機能だ。対応する秘密情報の種類は順次追加されており、今回はCloudflareのアクセス用サービストークンが加わった。AIエージェントが大量のコードを書くようになり、認証情報の混入リスクが高まっていることも背景にある。【詳細】Cloudflareのサービストークンはパートナーシークレットとして扱われ、公開リポジトリで見つかった場合はシークレットスキャンのパートナーシッププログラムを通じて発行元のCloudflareへ自動で報告される。ユーザーシークレットは公開・非公開を問わず、見つかればシークレットスキャンのアラートが生成される。対応する秘密情報の一覧はGitHubのドキュメントで確認でき、検出結果への意見はコミュニティーディスカッションで受け付けている。【ポイント・注意点】検出されるのはあくまで既知の形式のトークンで、すべての漏洩を防げるわけではない。トークンをコードに直書きしない運用や、短命なトークンの利用、万が一漏れた場合の即時ローテーションと組み合わせることが大切だ。AIエージェントにコードを書かせる場合も、生成物に認証情報が混ざっていないか確認する習慣を持ちたい。シークレットスキャンは、APIキーやパスワードといった秘密情報がリポジトリに誤って置かれるのを自動で見つけるGitHubの機能だ。対応する秘密情報の種類は順次追加されており、検出結果はアラートとして開発者に通知される。漏洩に気づいたら、まず該当トークンを無効化して新しいものに置き換えるのが基本で、公開リポジトリでは特に注意が必要だ。","2026-11-12","GitHub Changelog","https://github.blog/changelog/2026-11-12-secret-scanning-adds-a-detector-for-cloudflare"],["個人リポジトリにもIssueの種類と項目が一般提供","GitHubが11月11日、個人アカウントのリポジトリでもIssueの種類（タイプ）と項目（フィールド）が一般提供になったと発表した。これまで組織限定だった計画機能が個人にも広がり、Issueに「バグ」「タスク」「機能」の種類を付けたり、優先度や期限などの項目を入れたりできる。追加料金やプランによる差はなく、Projectビューでの絞り込みや一括編集、APIからの操作にも対応する。","\n【概要】GitHubは2026年11月11日、個人アカウントが所有するリポジトリで、Issueの種類（タイプ）と項目（フィールド）が一般提供になったと変更履歴で発表した。これまで組織だけが使えた計画機能が、個人の開発者にもそのまま広がった。追加料金はなく、プランによる差もないという。【背景】Issueの種類は2025年4月に組織向けに、項目は2026年7月に組織向けに提供が始まっていた。個人の開発者も、Claude CodeやCodex、Cursorといったエージェントが次々にIssueを作るようになり、タイトルとラベルだけでは整理しきれなくなっていた。今回の拡大は、個人の作業量が小さなチーム並みになった現実を認めたものといえる。【詳細】種類は既定でバグ・タスク・機能の3つで、アカウントごとに最大25種類まで作れる。項目は優先度・工数・開始日・目標日の4つが既定で、最大25項目まで追加でき、テキスト・数値・日付・単一選択・複数選択の5形式がある。項目は種類ごとに表示を変えることもできる。Projectビューでは種類や項目を列にして並べ替えや絞り込み、グラフ化、一括編集ができる。検索では「field.priority:high」のような書式が使える。RESTとGraphQLのAPIにも対応し、項目の変更時にはwebhookが飛ぶ。Issueの中からラベルやマイルストーンを直接作れるようにもなった。【ポイント・注意点】項目はIssue専用で、プルリクエストには付けられない。URLのパラメーターやIssueテンプレートで項目をあらかじめ入れることも今はできない。種類や項目は上限いっぱいまで作るものではなく、既定の3種類と4項目に必要なものを1〜2個足す程度から始めるのがよい。種類の削除は元に戻せないため、まずは無効化で様子を見るのが安全だ。種類と項目は、エージェントが量産するIssueを人がさばくための土台にもなる。エージェントが作ったIssueはタイトルが似通いがちだが、種類と優先度が付けば、まず読むべきものから順に処理できる。個人開発でも、週に一度Projectビューを眺めるだけで、遅れている作業が見えるようになる。","2026-11-11","VibeFix","https://vibefix.work/en/explore/github-issue-types-fields-personal-accounts-november-2026"],["GitHub、エージェント作業手順の一般提供を開始","GitHubが、自然言語のMarkdownで書いた指示をGitHub Actionsのワークフローに変換してコーディングエージェントに実行させる「エージェントワークフロー」を一般提供にした。エージェントは読み取り専用から始まり、変更は別のジョブが適用する。6月のパブリックプレビューからの進化で、1回の実行あたりのAIクレジット上限は既定で1,000（10ドル相当）に設定されている。","\n【概要】GitHubは、自然言語のMarkdownで書いた指示をGitHub Actionsのワークフローに変換し、コーディングエージェントに実行させる「エージェントワークフロー」を一般提供にした。2026年10月28日の発表を伝える記事が11月11日に公開された。Issueの振り分けやCI失敗の分析といった、判断を要する定型作業をエージェントに任せるための仕組みだ。【背景】この仕組みはGitHub Nextのオープンソース実験として始まり、2026年6月にパブリックプレビューに入っていた。従来のActionsが再現性のあるビルドやテストに向くのに対し、解釈や生成を要する作業はエージェントに任せるという使い分けが、GitHubの公式FAQにも示されている。【詳細】開発者はMarkdownにYAMLのフロントマターを付けて作業を記述し、プロジェクトがそれを標準のActionsワークフローにコンパイルする。エージェントはサンドボックス化されたコンテナー内で動き、エージェントワークフローファイアウォールの背後で実行される。変更案は脅威検出ジョブが事前に走査する。エージェントは読み取り専用で始まり、書き込みは別ジョブが専用のトークンで行う。費用はAIクレジットが1つ0.01ドルで、1回の実行の上限は既定で1,000クレジット（10ドル相当）。「gh aw forecast」コマンドで月額の見積もりが出せる。Actions Runner ControllerやDocker-in-Dockerにも対応し、Free・Team・Enterpriseで利用できる。既定のCopilot CLIエンジンを使うにはCopilotライセンスが必要だ。【ポイント・注意点】保護は自動で万全になるわけではない。FAQによれば、直接の書き込み権限や作成者が追加した独自ジョブには保護が及ばないため、書き込みジョブの前にレビューを必須とする環境保護ルールの追加が推奨されている。実際に試した開発者は、Issue振り分けの既定予算を大きすぎるとして100クレジット・15ターン・10分に絞った例もある。コード変更やプルリクエスト作成への利用は慎重に検討したい。","2026-11-11","SimpleProg","https://simpleprog.com/news/github-makes-agentic-workflows-generally-available-with-isolation-and-e1a96149"],["GitHub、11月9日にActionsとWebhookの性能低下","GitHubで11月9日、ActionsとWebhookの性能低下が起きた。午前10時（UTC）に調査が始まり、Actionsは11時6分、Webhookは11時45分に緩和された。平均26%のWebhook配信が遅れ、最大30%に達した。原因は、11月7日からKafkaブローカーの動きを遅くしていた不具合のあるホストで、対象ブローカーを停止して対応した。同日朝と前日にも別の障害が起きていた。","\n【概要】GitHubで2026年11月9日、ActionsとWebhookの性能低下が発生した。GitHub Statusの記録によれば、午前10時（UTC）に調査が始まり、10時47分に緩和策が適用され、Actionsは11時6分、Webhookは11時45分に緩和された。エージェントの実行開始やWebhookによる起動に遅れが出た。【背景】この障害は単発ではなかった。同じ9日の午前5時59分から9時9分までは、匿名ユーザーからの急増によるタイムアウト増加が起きており、前日8日の10時36分から12時32分にもAPIリクエストの性能低下があった。約30時間で3件の障害が続いた形で、エージェントを常駐させている利用者ほど影響を受けやすい状況だった。【詳細】GitHubの事後報告によれば、ジョブキューのクラスターの1つが低下し、Webhook配信、Actionsのワークフロー実行、Dependabotや依存関係グラフの更新が遅れた。緩和まで平均26%のWebhook配信が遅延し、最大で30%に達した。原因は、11月7日からクラスター内のKafkaブローカー1台の動きを遅くしていた不具合のあるホストで、対象ブローカーをサービスから外すことで対応した。Actionsは30分以上古いイベントを開始しないため、一部のワークフロー実行は開始されなかった。【ポイント・注意点】遅れたWebhookや実行開始の遅れは、エージェント側の不具合と見分けがつきにくい。10時から11時45分の時間帯に失敗した実行は、まずWebhookの配信記録や実行開始時刻と照らし合わせてから原因を切り分けるのがよい。緩和後に再送した処理が元の処理と重なって二重実行になる恐れもあるため、重複した実行やプルリクエストがないか確認しておきたい。GitHubは、タイムアウトの2件については詳細な根本原因分析を後日共有するとしている。ActionsとWebhookの事案については、記事の時点では原因の公表がなかった。原因が分からない間は、失敗の切り分けに実行時刻の記録が頼りになる。","2026-11-09","Automater","https://automater.ai/news/github-actions-webhooks-degraded-november-9-agent-run-starts/"],["GitHub Actions、9日夜にも障害　実行の28%に影響","GitHub Actionsで11月9日夜にも性能低下が起きた。18時7分から18時59分（UTC）の間、一部のワークフロー実行が開始・更新・状態報告できなくなり、影響を受けた実行は平均28%、最もひどい時間帯では65%に達した。原因は、Actionsの中核データベースをデータセンターから新しいクラウドリージョンへ移行する計画作業で、トラフィックを元のリージョンに戻して緩和した。","\n【概要】GitHub Actionsで2026年11月9日18時7分から18時59分（UTC）にかけて性能低下が発生し、一部のワークフロー実行が開始・更新・状態報告を正しく行えなくなった。GitHub Statusによれば、影響を受けたワークフロー実行は平均28%で、最もひどい時間帯には65%に達した。同日午前のWebhookとActionsの障害とは別の事案だ。【背景】原因は、Actionsの中核データベースをGitHubのデータセンターから新しいクラウドリージョンへ移行する計画作業だった。移行中のトラフィックが設定された上限に収まらなくなり、Actionsの処理能力が落ちた。計画作業が本番の障害につながった形で、GitHubはトラフィックの一部を元のリージョンに戻すことで影響を緩和した。【詳細】影響はActions本体にとどまらず、Webhook、Pages、Copilotのコードレビューといった依存サービスにも二次的な影響が出た。18時23分にはWebhookの性能低下、18時24分にはActionsとChecks APIのエラー増加が報告され、18時59分の投稿で緩和と監視への移行が案内された。GitHubはこの事案についても、詳細な根本原因分析を後日共有するとしている。【ポイント・注意点】この日は午前にもActionsとWebhookの障害があり、11月9日はGitHubの自動化まわりが終日不安定だった。夜の時間帯に失敗したCIやエージェントの実行は、自分のコードの問題と決めつけず、まずこの時間帯と照らし合わせるのがよい。移行作業に伴う障害は今後も起こり得るため、重要な実行の前にはGitHub Statusを確認する習慣が役立つ。GitHubのステータスページには、この日の午前と夜の2件のほか、11月10日のGit操作とプルリクエストの障害、11月11日の複数製品への影響、11月12日のWebhook APIの障害も記録されている。11月上旬はGitHubの不安定な日が続いており、CIの失敗を見たときはまずステータスを確認するのがよい。","2026-11-09","GitHub Status","https://www.githubstatus.com/incidents/tp8cghg7tlc4"],["LinuxカーネルのREADME、AIへの厳しい警告を追加","LinuxカーネルのREADMEに、AIコーディングアシスタント向けの厳しい警告が加わった。貢献する前に必ずコーディングアシスタント向け文書を読むよう求める内容で、ライセンスや帰属、開発者証明書の順守が記されている。Hacker Newsでは109ポイントを集めたが、コメント欄の話題はむしろ同日に起きたGitHubの障害に集中し、504や503エラーが報告された。","\n【概要】LinuxカーネルのソースツリーにあるREADMEに、AIコーディングアシスタント向けの節が加わり、貢献する前に必ずコーディングアシスタント向けの文書を読むよう求める厳しい警告が書かれた。Hacker Newsに投稿され、109ポイントと約113件のコメントを集めた。【背景】カーネルのREADMEは、新規開発者やメンテナー、ハードウエアベンダーなど貢献者の種類ごとに案内をまとめたものになっている。そこにAI向けの節が加わったのは、AIが生成したパッチの投稿が増え、ライセンスや帰属、開発者証明書（DCO）の順守を改めて求める必要が出てきたためとみられる。警告は「CRITICAL」と強調されている。【詳細】READMEが求める文書には、ライセンスや帰属、AIツールが順守すべきDCOの扱いが書かれているという。Hacker Newsのスレッドでは、警告そのものよりも同日に起きたGitHubの障害の話題が大半を占めた。リポジトリやコミットページで504や503エラーが出て、リリースのダウンロードやCI、Terraformのジョブが壊れたとの報告が並んだ。ステータスページはしばらく緑色のままだったという批判も出た。コメントの中には、エージェントが毎日数百回もプライベートリポジトリへ自動コミットしていると書いた利用者もいた。【ポイント・注意点】AIによる貢献が増えるほど、受け手側のルールも厳しくなる流れが見える。カーネルへのパッチ投稿をAIに任せる場合は、事前に文書を読み、DCOの署名など手順を守る必要がある。GitHubの障害時にステータスページが遅れることもあるため、つながらない時は第三者の監視情報もあわせて確認するとよい。カーネルのREADMEがAI向けの節を設けたことは、AIによる貢献が無視できない量になった証拠でもある。投稿する側は、AIに生成させたパッチでも、内容を理解して責任を持つことが求められる。DCOへの署名は、投稿者がライセンス条件を理解し、配布する権利があることを示すものだ。AIに任せきりにせず、人が目を通す習慣が大切だ。","2026-11-08","xhtml.jp","https://www.xhtml.jp/g/g652345/p/p8978694892"],["GitHub公式解説、新Git基盤「Rubicon」の仕組み","GitHubが新しいGitストレージ基盤の設計を公式ブログで解説した。社内では「Rubicon」と呼ばれるもので、1つのリポジトリに5,000体のエージェントが同時に作業し、毎秒7,200回のプッシュを送っても読み取りの遅延が小さいという内部テストの結果が示された。オブジェクトをAzure Blob Storageに置き、参照の更新だけをRef-CASという複製ログで順序付ける設計が核になっている。","\n【概要】GitHubは2026年11月5日、新しいGitストレージ基盤の設計を公式エンジニアリングブログで公開した。社内で「Project Rubicon」と呼ばれるもので、内部テストでは1つのリポジトリに対して5,000体のエージェントが同時に作業し、毎秒7,200回のプッシュを送っても読み取りの遅延が小さいままだったという。【背景】コーディングエージェントが増え、1つのリポジトリへの書き込みが爆発的に増えることが見込まれている。従来のGitストレージでは、大量の同時書き込みをさばくのが難しくなる。GitHubはGitHub Universeでこの新基盤を発表し、その設計思想を3回シリーズの最終回として解説した。設計の原則は「調整を最小限にする」と「ストレージと計算を分ける」の2つだ。【詳細】Gitのオブジェクトは不変で内容から名前が決まるため、順序を決めずに書き込める。そこでオブジェクトはパックにまとめてAzure Blob Storageに置き、ブランチやタグの指す先といった参照の更新とパックの一覧だけを、Ref-CASという複製ログサービスで順序付ける。読み書きは使い捨て可能な仮想レプリカの群が担当し、裏側で圧縮ノードがパックを統合する。リポジトリの99.99999%はすでにAzureへ移行済みで、参照の書き込み対象を個別の参照に絞るなどの橋渡しも終えている。現在は限定プライベートプレビューで、来年早々の広い展開が予定されている。【ポイント・注意点】毎秒7,200回という数字はGitHub自身の内部テストによるもので、独立した検証はまだない。設計目標として2桁以上の規模拡大を掲げている点にも注意が必要だ。単一オブジェクトの取得や複数リージョンへのレプリカ配置など、残る改善も挙げられている。エージェント時代の基盤として注目すべき発表だが、実力は一般提供後の利用者の検証を待つ段階だ。シリーズの前回では、99.99999%のリポジトリをAzureへ移す橋渡しや、書き込み対象を個別の参照に絞る工夫が解説されていた。今回の記事はその続きで、設計の全体像を締めくくっている。","2026-11-05","GitHub Blog","https://github.blog/engineering/architecture-optimization/inside-githubs-new-git-storage-architecture/"]],"elec":[["M5Stack、組込展示会でESP32とローカルAIを披露","M5Stackがembedded world 2026のブースで、積み重ね式ESP32エコシステムの広がりを披露した。Home Assistantとの連携や端末側で画像認識などを行うAIボックス、LoRa通信、産業用パネルに加え、Raspberry Pi 5に24 TOPSの加速性能を足すAIアクセラレーターも紹介された。約400種類の製品をそろえ、センサー類だけでも200種類以上あるという。","\n【概要】M5Stackがembedded world 2026のブースで、積み重ね式ESP32コントローラーのエコシステムがローカルAIやLoRa通信、産業制御、Raspberry Piの加速へ広がっている様子を披露した。Elektorによるブース取材記事が公開された。5cm角の積み重ね式という基本形はそのままに、用途の幅が大きく広がっている。【背景】M5StackはこれまでStickやCoreといった小型コントローラーと、センサーや表示などのユニットを組み合わせる作り方で知られてきた。営業・マーケティング責任者のアレン・チャオ氏によれば、現在は約400種類の製品があり、そのうちセンサー類が200種類以上を占め、毎週金曜日に新製品を出すペースを続けているという。【詳細】ブースではHome Assistantと組み合わせたデモや、画像認識・物体検出・ジェスチャー検出を端末側で処理するAIボックスが紹介された。クラウドへ往復せずに判断できるため、スマートホームや産業監視に適した方向性だ。LoRa通信ではセンサーノードと中央パネルをつないだデモもあった。Raspberry Pi向けのAIアクセラレーターは、M5StackのAI-8850 LLMアクセラレーターM.2キットと同じ系統で、Raspberry Pi 5にM.2カードとHATアダプター経由で24 TOPSの加速性能を足す。ESP32-P4搭載のCore P4やTab5といった端末も並んだ。【ポイント・注意点】手軽な電子工作の道具でありながら、表示やモジュール式I/O、PoE対応の電源まわりを備え、軽い産業制御や試験装置、環境監視にも使える中間的な位置づけだ。ただし本格的なPLCの置き換えではなく、あくまで試作から小規模な導入に向けた道具として捉えるのがよい。ローカルAIの性能も用途次第で、重い処理はクラウドとの使い分けが要る。M5Stackの製品は、センサーや表示、通信、電源などのユニットを積み重ねて組み立てる作り方が特徴で、配線の手間を減らして試作を速く進められる。今回の展示は、そうした作り方が産業の現場にも届き始めたことを示すものだ。","2026-11-12","Elektor Magazine","https://www.elektormagazine.com/news/m5stack-embedded-world"],["ラズパイ公式ギフトガイド、Pico 2とAI HAT+ 2を紹介","Raspberry Piの公式ホリデーギフトガイドが公開された。4.80ポンドからのマイコンPico 2や、バックライト付きメカニカルキーボードの高級一体型パソコンPi 500+、Raspberry Pi 5で画像AIを端末側で動かすAI HAT+ 2などが取り上げられた。初心者向けのPi 400から環境センサーやレゴ連携の追加基板まで、幅広い層を対象にした内容になっている。","\n【概要】Raspberry Piの公式ホリデーギフトガイドが公開された。4.80ポンドからのマイコンPico 2や、バックライト付きメカニカルキーボードを備えた高級一体型パソコンPi 500+、Raspberry Pi 5向けのAI HAT+ 2などが取り上げられ、初心者から上級者までを対象にした内容になっている。【背景】毎年恒例のギフトガイドは、ホリデーシーズンに向けてメーカーや教育関係者、趣味の利用者に向けた買い物の目安となる。今年はAI HAT+ 2とAIカメラの組み合わせが目立つ位置にあり、クラウドに頼らない端末側の画像AIへの関心の高まりがうかがえる。【詳細】入門向けにはRaspberry Pi 400が57.60ポンド、より高性能なPi 500が172.80ポンドで紹介され、最上位のPi 500+はバックライト付きのキーボードを備えた一体型パソコンだ。Pico 2は4.80ポンドからで、無線対応や半田付け済みヘッダー付きの派生もある。AI HAT+ 2はAIカメラと組み合わせてRaspberry Pi 5上で画像推論を端末側で行うための追加基板だ。ほかに環境センサーのSense HATや、レゴのモーターとセンサーをつなぐBuild HAT、公式モニターも紹介されている。Pi Hutの「Let it Glow」メーカーアドベントカレンダーは45ポンドで、Pico Hと12日分のLED工作が入っている。【ポイント・注意点】ガイドは価格の目安として参考になるが、価格は2026年中に何度か変わっており、購入前に最新の販売価格を確認するのがよい。AI HAT+ 2は対応するモデルやソフトウエアの経路が決まっており、任意のモデルを加速できるわけではない点にも注意したい。Pico 2は安価だが、用途に合った派生を選ぶ必要がある。ギフトガイドは毎年恒例の企画で、今年はAI HAT+ 2の扱いが大きい。端末側で画像を認識する用途は、カメラと組み合わせた見守りや工作にも応用できる。購入前に、自分の用途に合う構成かを確認するとよい。","2026-11-12","FOSSwire","https://fosswire.org/news/raspberry-pi-gift-guide-highlights-pico-2-pi-500-and-ai-hat-"],["Muse×Gadget SDK連携の17日間実測記が公開","Raspberry Pi 5をMetaのMuse Gadget SDKでMuseのガジェットとしてつなぎ、17日間動かした連携の実測記録が公開された。室内センサーの読み取りや知識ベースの参照、M5StickS3の追加、デバイス側からMuseを呼ぶ双方向化までを試した。M5StickS3では画面表示はできたが、公式ファームからサーバー側TTSが削除されていたため音声は出なかったという。","\n【概要】Raspberry Pi 5をMetaのMuse Gadget SDKでMuseのガジェットとしてペアリングし、17日間にわたって実際に動かした連携の記録が公開された。室内センサーの読み取りや知識ベースの参照、M5StickS3の追加、デバイス側からMuseを呼ぶ双方向化まで、成功だけでなく失敗も含めてまとめられている。【背景】前編ではRaspberry Pi 5とMuseのBLEペアリングまでが記録された。今回の後編は、ペアリングした2026年10月25日から11月11日までの17日間に、Gadget SDKの経路で実際に何ができたかを実験記録としてまとめたものだ。筆者は「つながった」という事実の先に何を流すかが別問題だと位置づけている。【詳細】実測は4つある。室内センサーではArduino UNO R4 WiFiが測る室温・湿度・気圧をGrafanaにため、Pi上のスキル経由でMuseが読む。知識ベースllm-wikiの参照は11月10日に開通した。M5StickS3はESP-IDF v6.0.3でビルドしてペアリングに成功したが、画面へのテキスト表示はできても音声は出なかった。公式ファームではサーバー側のTTSがPR #12で削除されており、音声を出すにはstart_ttsフックに自前のTTSを差し込む必要がある。デバイス側からMuseを呼ぶ上り経路では、11月2日に作ったmuse-relayがマルチエージェント基盤MulticaからMuseへタスクを渡している。【ポイント・注意点】得られた型は「デバイス上にスキルを置き、MuseがGadget経由で実行して結果を受け取る」というもので、室内センサーでも知識ベースでも同じ型で流用できた。運用上の教訓として、base64でのファイル転送が化けたためheredocで直接書いてsha256で検証する方式に変えたこと、PiのNodeはnvm管理のv24.22.1に一本化したこと、対応ボードは版数まで確認すること（Core2はv1.0のみ、WebフラッシャーはCoreS3のみ）が挙げられている。「ペアリングできた＝音声で会話できる」ではない点は、これから試す人の落とし穴になりそうだ。","2026-11-11","chinng-lab","https://gotosocial.chinng-lab-srv.dev/muse-gadget-sdk-integration-field-notes/"],["M5Stack、16×16 LEDマトリックス搭載「Core Matrix」発表","M5Stackが16×16の白色LEDマトリックスを内蔵した開発キット「Core Matrix」を発表した。ESP32-C61を載せ、Wi-Fi 6とBluetooth LE 5.0、6軸IMU、microSDスロットを備え、54mm角・28.9gの小型ボディーに収めた。価格は29.90ドルで、Arduino IDEやUIFlow2での開発に対応する。通知や状態表示に使える。","\n【概要】M5Stackが、16×16の白色LEDマトリックスを内蔵した新しい開発キット「Core Matrix」を発表した。ESP32を載せた小型のIoTコントローラーで、通知やアイコン、アニメーションの表示に使える。価格は29.90ドルで、2026年11月9日に報じられた。【背景】LEDマトリックスは、センサーの状態や通知を一目で伝えるための手軽な表示方法として、電子工作で広く使われてきた。M5Stackの従来製品ATOM Matrixは5×5のRGBマトリックスだったが、Core Matrixは16×16の単色マトリックスとWi-Fi 6対応の新しいチップへと刷新された。【詳細】心臓部はEspressifのESP32-C61HR8で、32ビットRISC-Vのシングルコアが160MHzで動き、16MBのフラッシュと8MBのPSRAMを備える。無線は2.4GHzのWi-Fi 6とBluetooth LE 5.0に対応する。256個の白色LEDはTM1680ドライバーで制御され、アイコンやアニメーション、状態表示に使える。BoschのBMI270 6軸IMUを内蔵し、傾きや振りを検知してジェスチャー操作もできる。3つのボタンと電源ボタン、パッシブブザー、microSDスロット、USB-C端子、バッテリー接続端子を備える。本体は54×54×11.6mm、重さ28.9g。Arduino IDEとM5StackのUIFlow2での開発に対応し、30ピンのM5-BusやGrove端子で拡張できる。【ポイント・注意点】単色表示のためフルカラーの画面の代わりにはならないが、通知や状態表示だけなら十分だ。価格が手頃で、配線なしでLED表示とセンサー、無線を一体で試せる点が魅力といえる。M5Stackの公式ストアとAliExpressで29.99ドル前後で販売されている。用途を絞って使うのがよさそうだ。LEDマトリックスは、文字や数字を表示するほどではないが、アイコンや簡単な図形、アニメーションで状態を伝えるのに向く。センサーと組み合わせれば、温度や湿度の変化を色や点滅で知らせる表示器にもできる。","2026-11-09","Hackster.io","https://www.hackster.io/news/an-esp32-board-with-a-built-in-16x16-led-matrix-c335dc00a4eb"],["M5StackChan用コントローラー「Core」秋葉原に入荷","M5Stackの「M5StackChan」用メインコントローラー「M5StackChan Core」がマルツ秋葉原本店に入荷し、店頭価格9,069円で販売されている。ESP32-S3を内蔵し、カメラやデュアルマイク、タッチ画面、6軸IMUなどを備える。専用のStackchanアプリが使えるのは純正Coreコントローラーのみで、CoreS3系の非純正モデルでは使えない点に注意が必要だ。","\n【概要】M5Stackの「M5StackChan」用メインコントローラー「M5StackChan Core（M5STACK-C156）」がマルツ秋葉原本店に入荷した。店頭価格は9,069円で、2026年11月9日に報じられた。カメラやマイク、タッチ画面を備えたESP32-S3搭載のIoTコントローラーだ。【背景】M5StackChanは、M5Stackの小型ロボットキャラクター「Stack-chan」の本体として使われる製品だ。標準のユニットと交換できるメインコントローラーが単体で売られることで、既存のStack-chanの心臓部を入れ替えたり、予備として持ったりできるようになる。【詳細】内蔵するのはESP32-S3で、カメラ、近接センサー、スピーカー、RTC、I2Sアンプ、デュアルマイク、静電容量式タッチIPSディスプレイ、電源ボタン、リセットボタン、6軸IMU、3軸磁気センサーを備える。音声の入出力やタッチ操作、動きの検知までを1台に詰め込んだ構成だ。なお、専用のStackchanアプリが対応するのは本製品や標準ユニットなどの純正Coreコントローラーのみで、CoreS3やCoreS3-Lite、CoreS3-SEといった非純正モデルでは使えない点に注意が必要だ。【ポイント・注意点】Stack-chanを動かす人にとっては、純正Coreの単体入手はうれしい知らせといえる。ただし手持ちのStack-chanがCoreS3系の非純正コントローラーで動いている場合は、専用アプリが使えないため、買う前に自分の本体が純正Core対応か確認しておきたい。カメラやマイクを備えるため、音声アシスタントや見守り用途への応用も考えられる。M5StackChanは、M5Stackの小型ロボットとして親しまれてきた製品で、顔の表情や声で応える。純正Coreの単体販売は、壊れた場合の交換や、複数台の用意にも役立つ。カメラとマイクを備えるため、音声で応える工作や、見守り用途への応用も考えられる。","2026-11-09","AKIBA PC Hotline!","https://akiba-pc.watch.impress.co.jp/docs/news/news/2153551.html"],["Pi 5＋AI加速器、軽いモデルではCPUが速いと実測","Raspberry Pi 5にHailo-8アクセラレーターを付けた侵入検知の推論を実測した研究が学術誌に掲載された。軽い多層パーセプトロンではCPUの方が速く、1次元CNNではアクセラレーターが最大10倍超の処理量を出した。アクセラレーターが常に速いわけではなく、モデルの形や実行方法によって境界があることが示された。軽いモデルではCPUが速く、CNNでは加速器が最大10倍超の処理量を出した。","\n【概要】Raspberry Pi 5にAIアクセラレーターを付けると、侵入検知の推論がいつ速くなり、いつ遅くなるのかを実測したオープンアクセスの研究が、2026年11月3日に学術誌「Discover Internet of Things」に掲載された。Hailo-8を載せたPi 5とCPUだけの推論を、2つの公開データセットと3つのモデル群で比べたものだ。【背景】IoTの侵入検知は、攻撃を正確に見つけることと、組み込み機器の限られた処理能力や遅延の中で動かすことの両立が求められる。アクセラレーターを付ければ速くなるという単純な話ではなく、モデルの形や実行方法によって結果が変わることを、実測で示した研究だ。【詳細】軽い多層パーセプトロン（MLP）では、CPUの方が速かった。HailoRTのストリーミング処理量はCPUの0.608倍と0.612倍にとどまり、バッチサイズ256の比較では0.019倍と0.018倍まで落ちた。逆に1次元CNNではアクセラレーターが勝ち、CICIoT2023で最大10.344倍、Edge-IIoTsetで9.605倍の処理量を記録した。量子化に配慮した改良モデルでは、ハードウエア遅延が0.048393ミリ秒から0.042034ミリ秒へ約13.1%減り、HEFファイルも774,274バイトから669,402バイトへ小さくなった。ただし精度面ではEdge-IIoTsetで量子化による低下が大きく、改良モデルでも完全には防げなかった。【ポイント・注意点】実務的な指針として、軽いMLPで処理量を重視するならCPU推論を選び、CNN系のモデルで量子化の影響が許容できるならアクセラレーターが有効になる。TOPSの理論値やパラメーター数だけで判断せず、自分のモデルと実行環境で測ることが大切だ。実験は1種類の機器構成で行われたため、JetsonやCoral TPUなど他の機器では結果が変わる可能性がある。研究チームは、モデルの形や実行方法によって加速の境界が変わることを強調している。実務では、まず自分のモデルでCPUと加速器の両方を測り、どちらが速いか確かめるのが確実だ。","2026-11-07","bioengineer.org","https://bioengineer.org/when-an-ai-accelerator-slows-your-intrusion-detector-raspberry-pi-5-and-hailo-8-put-to-the-test/"],["ラズパイ5の量子化モデル選び、用途とメモリーで決める","Raspberry Pi 5で動かす量子化モデルの選び方を解説した記事が公開された。CPUで文章チャットを始めるなら、小さな指示チューニング済みGGUFモデルをQ4_K_Mで試すのが手堅いという。AI HAT+ 2は約60億パラメーターまでのモデルに対応する別経路で、任意のGGUFを加速するものではない。モデルサイズや量子化の注意点も具体的に示されている。まずは小さなモデルから試すのがよい。","\n【概要】Raspberry Pi 5で動かす量子化モデルを選ぶための実践的な解説が、2026年11月6日に公開された。パラメーター数が最も大きいモデルを追うのではなく、用途とメモリー容量、実行環境に合わせて選ぶのが要点だ。CPUで動く文章チャットなら、小さな指示チューニング済みGGUFモデルをQ4_K_Mで試すのが手堅い出発点とされる。【背景】Pi 5には1GBから16GBまでのメモリー構成があり、4コア2.4GHzのCortex-A76を載せる。モデルファイルの大きさだけでなく、実行時に必要なメモリーや文脈の長さも考慮しないと、動かしてから足りないことが分かる。AI HAT+ 2のような加速器の経路もあり、経路ごとに使えるモデルが違うため、最初に経路を決める必要がある。【詳細】具体例として、Gemma 3 1Bの指示チューニング済みGGUFをQ4_K_Mで使う方法が挙げられている。実行コマンドはllama.cppの「llama cli -hf ggml-org/gemma-3-1b-it-GGUF:Q4_K_M」だ。AI HAT+ 2は8GBのオンボードメモリーを持ち、Raspberry Piによれば約60億パラメーターまでのLLMやVLMに対応するが、任意のGGUFファイルを加速するものではない。モデルサイズの例として、Llama 3.1 8BはQ4_K_Mで4.58GiB、Q5_K_Mで5.33GiB、Q8_0で7.95GiBとされる。すでに量子化されたモデルをさらに量子化し直すと品質が大きく落ちるため、llama.cppの警告にも注意が必要だ。【ポイント・注意点】同じモデルでも量子化の段数で品質と大きさが変わるため、同じモデルの別量子化を比べるのがよい。メモリーに余裕があればQ5_K_Mを試し、答えの改善が見合うか判断する。ファイルサイズはピーク時のメモリー使用量ではないため、SSDに置けてもRAMが増えるわけではない。用途に合わないベースモデルを選ばないよう、指示チューニング済みかどうかも確認しておきたい。","2026-11-06","RottenWiFi","http://rottenwifi.com/quantized-models-on-raspberry-pi-5-match-size-to-your-task/"],["Olimex、有線LAN追加モジュール「UEXT-CH390」を発売","OlimexがRaspberry PiのRP2040・RP2350やESP32系ボードに有線イーサネットを追加する小型モジュール「UEXT-CH390」を発売した。100MbpsのイーサネットをUEXT端子経由で追加でき、ESPHomeに対応する。RP2040向けのドライバーもOlimexが自ら書いて公開した。価格は4.95ユーロで、ハードウエアとファームウエアはオープンライセンスで公開されている。","\n【概要】ブルガリアのオープンハードウエア企業Olimexが、Raspberry PiのRP2040やRP2350、EspressifのESP32系ボードに有線イーサネットを追加する小型モジュール「UEXT-CH390」を発売した。2026年11月5日に報じられた。価格は4.95ユーロで、予約受付が始まっている。【背景】Wi-Fiは便利だが、無線攻撃を避けたい場合や、金属の壁や地下室など電波が届きにくい場所では有線が求められる。Olimexの創業者によれば、そうした要望に応えるための製品だ。ESPHomeに対応しており、Home Assistantと組み合わせて使うことも想定されている。【詳細】WCH製のCH390というSPI-イーサネット変換チップを使い、100Mbpsの有線イーサネットを追加する。基板は50×21mmで、従来のUEXT端子と小型のpUEXT端子の両方を備える。ESP32系のボードではESPHomeでそのまま使える。RP2040ではESPHomeがCH390に対応していなかったため、Olimexが自らドライバーを書き、ESPHome 2026.9.0で検証した例をGitHubに公開した。Pico SDKとlwIPを使った小さなWebサーバーの例もある。ハードウエアはCERNオープンライセンス、ファームウエアはMITライセンスで公開されている。【ポイント・注意点】開発では、CH390の割り込みとリセットがUEXT端子に無いためソフトウエアリセットとポーリングで対応したり、2つのタスクからのSPI同時アクセスで固まる問題を専用タスク内での読み取りに統一したりと、細かな工夫が必要だったという。Wi-Fiが使えない環境のセンサーやリレー制御には向くが、速度は100Mbpsのため、高速な用途には別手段が必要だ。有線接続は、Wi-Fiの電波が届きにくい場所や、無線を避けたい環境で役立つ。Home Assistantと組み合わせれば、センサーやリレーを有線で安定してつなぐことができる。価格が5ユーロを切るため、試しやすい部類といえる。","2026-11-05","Hackster.io","https://www.hackster.io/news/olimex-s-uext-ch390-brings-wired-ethernet-to-raspberry-pi-rp2040-rp2350-and-espressif-esp32-boards-c56db23260c0"],["カラー電子ペーパー開発キット「M5Paper Color」入荷","カラー表示対応の4インチ電子ペーパー開発キット「M5Paper Color」がマルツ秋葉原本店に入荷し、店頭価格15,279円で販売されている。E Ink Spectra 6を採用し、6原色のフルカラー表示ができる。ESP32-S3R8を載せ、マイクやスピーカー、温湿度センサーも備える。4インチのカラー電子ペーパーと1,250mAhのバッテリーを備え、ESP32-S3R8を載せる。","\n【概要】カラー表示に対応した4インチ電子ペーパー開発キット「M5Paper Color（M5STACK-C151）」がマルツ秋葉原本店に入荷した。店頭価格は15,279円で、2026年11月4日に報じられた。E Ink Spectra 6を採用し、6原色のフルカラー表示ができる電子ペーパー開発デバイスだ。【背景】電子ペーパーは目に優しく消費電力が小さいが、従来は白黒や限られた色が中心だった。Spectra 6は赤・黄・青・白の4色の顔料粒子で6原色を出し、カラーの電子ペーパー表示を実現する技術だ。M5Paper Colorはその技術を手軽に試せる開発キットとして登場した。【詳細】4インチのカラー電子ペーパーと1,250mAhのリチウムイオンバッテリーを搭載する。SoCはESP32-S3R8で、フラッシュ16MB、PSRAM 8MB、2.4GHz帯のWi-Fiに対応する。本体は70.8×103.9×8.5mm、重さ73.3gで、電源はUSB Type-C（DC 5V）だ。3つのユーザープログラマブルボタン、電源ボタン、2つのRGB LED、エコーキャンセル付きMEMSマイク、スピーカー、microSDスロット、温湿度センサーを備える。マイクとスピーカーを備えるため、音声を使った工作にも応用できる。【ポイント・注意点】電子ペーパーは書き換えが遅いため、動画や頻繁な画面更新には向かない。表示が変わらない間は電力をほとんど使わない特性を生かし、卓上の情報表示や電子書籍風の端末、カレンダー表示といった用途が向いている。開発キットのため、表示の制御にはArduino IDEなどでの開発が必要だ。価格は15,279円で、電子ペーパー開発の入門としては手頃な部類といえる。電子ペーパーは、表示を変えるときだけ電力を使い、表示が変わらない間はほとんど電力を消費しない。卓上に置いて予定や天気を表示する端末や、電子書籍風の表示器に向いている。カラー化により、予定の種類を色で分けるといった使い方もできる。","2026-11-04","NEWSjp","https://news.jp/i/1490572350446715057?c=428427385053398113"],["BrainChip、Pi 5と脳型AIチップの開発キット発売","BrainChipがニューロモーフィックAIプロセッサーAKD1500とRaspberry Pi 5を組み合わせた開発キットを発売した。キーワードやジェスチャー、物体の認識を端末側で行い、データは機器内に留まる。新しい種類をチップ上で学べ、クラウドでの再学習は不要とされる。開発ツールとモデルは無料で提供される。新しい種類をチップ上で学べ、クラウドでの再学習は不要とされる。","\n【概要】BrainChipが、ニューロモーフィック（脳型）AIプロセッサーのAKD1500とRaspberry Pi 5を組み合わせた開発キット「AKD1500 Raspberry Pi 5 Development Kit」を発売した。2026年10月29日の発表を伝える記事が11月2日に公開された。常時稼働するセンサー用途に向けたもので、キーワードやジェスチャー、物体を端末側で認識できる。【背景】常時稼働するセンサーでは、すべてのデータをクラウドへ送って処理すると遅延や通信量、プライバシーの問題が出る。BrainChipのAKD1500はイベント駆動型の処理で、意味のある変化だけを扱うことで、端末側での学習と認識を目指すプロセッサーだ。Raspberry Pi 5をホストにすることで、開発者はなじみのある環境で試せる。【詳細】キットはRaspberry Pi 5とAKD1500のM.2ボードを組み合わせたもので、キーワードやジェスチャー、物体の認識を端末側で行い、データは機器内に留まる。新しい種類をチップ上で学習でき、クラウドでの再学習は不要とされる。MetaTFのソフトウエアツールとモデルはDeveloper Hubから無料で使える。ベンチマークやデモ、自作アプリ向けのDockerイメージも用意される。キットはBrainChipのショップで販売されており、開発者は後から同じAKD1500チップを自社製品に組み込むこともできる。【ポイント・注意点】発表には、電力と精度を同じ条件で比べた独立した検証結果は含まれていない。チップ上での学習も、任意の学習ができるという話ではなく、対応する種類の追加に限られる。とはいえ、常時稼働のセンサーでクラウド往復を避けたい開発者にとっては、試しやすい入口といえる。まずはデモで認識の精度と応答を確認するのがよさそうだ。AKD1500は、意味のある変化があったときだけ処理するイベント駆動型のチップで、常時稼働しても消費電力を抑えられるという。キーワードやジェスチャーの認識は、スマートホームのセンサーや見守り機器での利用が想定されている。","2026-11-02","TechEnclave","https://techenclave.com/news/items/brainchip-pairs-its-on-device-ai-processor-with-raspberry-pi-5"]],"muse":[["Claude Code Projects、調整役が能動的に報告へ","AnthropicがClaude Code Projectsを更新し、調整役のコーディネーターが積極的に動くようになった。プロジェクトのチャットで質問に答えたり、並行する作業スレッドの進捗を自ら報告したりする。各スレッドは独立したクラウドセッションで、パソコンを閉じた後も作業が続く。パブリックベータはPro・Max・Ultra向けで、TeamやEnterpriseはまだ対象外だ。","\n【概要】AnthropicがClaude Code Projectsを更新し、プロジェクトのコーディネーターが積極的に動くようになった。2026年11月13日の発表を伝える記事が11月14日に公開された。コーディネーターはプロジェクトのチャットで質問に直接答え、並行するスレッドの進捗を自ら報告するようになり、利用者が様子を聞きに行く必要が減った。【背景】Projectsは9月17日に刷新され、1つの会話から複数の作業を指示する形になった。利用者が作業を伝えると、Claudeが内容を整理し、複数のスレッドに分けて並行実行し、結果をまとめる。今回の更新は、その調整役であるコーディネーターをさらに能動的にするものだ。【詳細】プロジェクトは1つの長い会話で、コーディネーターが作業の範囲を決め、スレッドへ振り分け、進み具合を追う。各スレッドは独立したClaude Codeのクラウドセッションで、リポジトリのコピーと独自のGitブランチを持つ。利用できるのはclaude.ai/code、デスクトップアプリ、モバイルアプリで、ターミナルのCLIやVS Code、JetBrainsの拡張機能では使えない。パブリックベータはPro・Max・Ultraプラン向けに段階的に広がっており、TeamやEnterpriseはまだ対象外だ。新しいプロジェクトはコーディネーターも作業スレッドもOpusで動き、作業側は高めの推論、コーディネーター側は低めの推論が既定だ。スレッドは同じプランの利用枠を使うため、並行数が増えると上限に早く達する。1日あたり新しいスレッドは200件までとされる。個別スレッドの読み取り専用共有リンクや、/btwコマンド、/forkコマンド、予約リマインダーなども報じられている。【ポイント・注意点】パソコンを閉じた後もクラウドのスレッドは作業を続けるため、長時間の作業を預ける使い方ができる。ただし並行する分だけ利用枠の消費も早まり、上限に達したスレッドは自動で一時停止して再開する。ローカルでの実行が必要な作業は、Remote Control経由で手元のパソコンに振ることもできる。TeamやEnterpriseの利用者は、まだ提供を待つ必要がある。","2026-11-14","DEV Community","https://dev.to/delimitter/anthropic-upgrades-claude-code-projects-the-coordinator-now-reports-in-chat-while-parallel-ai-27e5"],["Muse、利用者に代わり電話をかける機能を追加","MetaのAIエージェント「Muse」が、利用者に代わって自分で電話をかけられるようになった。レストランの予約や保険会社への問い合わせ、行政手続きの連絡などをMuseが自ら会話して進める。9月から限られた利用者で試験され、11月12日に米国の有料プラン加入者へ広げられた。以前の試験では人間のオペレーターも使われており、個人情報の扱いには注意が必要だ。日本での提供はまだ発表されていない。","\n【概要】MetaのAIエージェント「Muse」が、利用者に代わって自分で電話をかけられるようになった。MetaのAI責任者アレクサンドル・ワン氏が2026年11月12日に発表し、11月14日に報じられた。レストランの予約や保険会社への問い合わせ、通信事業者との交渉、行政手続きの連絡などを、Museが自ら会話して進める。【背景】この電話機能は9月から限られた利用者で試験されていた。Muse自体は9月に買い物や旅行予約、日常の用事を代行する道具として発表され、その後スペースと呼ばれる小さな専用ページ機能も追加された。電話は、画面の外の相手と直接やり取りする機能として広がった形だ。【詳細】利用者は用事を言葉で伝えるだけで、Museが相手先に電話をかけ、予約や問い合わせの会話を進める。対象は米国の有料プラン加入者で、パワープランは月20ドルで毎週5億のMuseトークンが使え、最上位のマキシマムは月100ドルで毎週30億トークンまで増える。以前の試験では、AIだけでなく雇われた人間のオペレーターが利用者に代わって電話をかけていたことがあり、Digital Trendsの報道によれば社内から個人情報の扱いへの懸念が出て、人のオペレーターを使う実験は取りやめになった。Metaは広く提供する前に仕組みの開示と追加の保護策を約束したが、現在の版で人間のオペレーターが関わるかどうかは明らかにされていない。【ポイント・注意点】電話での代行は便利な一方、相手がAIだと知らずに会話する点や、個人情報の扱いには注意が要る。日本での提供はまだ発表されておらず、まずは米国の有料加入者から始まる。料金は週ごとのトークン枠で決まるため、電話を多用すると枠の消費も早まる可能性がある。Museは9月に発表されたMetaのパーソナルAIエージェントで、買い物や旅行の予約、日常の用事を代行する。電話機能は、画面の中だけでは済まない用事にも手を伸ばすものだ。相手がAIと気づかずに話す場面もあるため、提供側の説明責任が問われることになる。日本での提供時期はまだ発表されていない。","2026-11-14","iXBT.com","https://www.ixbt.com/news/2026/11/14/ii-muse-naucilsia-zvonit-po-telefonu-vmesto-celoveka.html"],["MuseがApple Watchに対応、手首から呼び出し可能に","MetaがiOS版のMuseアプリを更新し、Apple Watchへの対応を追加した。腕時計の画面にMuseのキャラクターが表示され、メッセージの入力や音声の聞き取り、通話の開始ができる。専用のコンプリケーションも用意され、アプリを開かずに素早く呼び出せる。対応の詳細はまだ限られている。手首から素早く呼び出せる。対応の詳細はまだ限られているが、短いやり取りに向く。","\n【概要】MetaがiOS版のMuseアプリを更新し、Apple Watchへの対応を追加した。腕時計の画面にMuseのキャラクターが表示され、メッセージの入力や音声の聞き取り、通話の開始ができる。専用のコンプリケーションも用意され、アプリを開かずに素早く呼び出せる。2026年11月14日に報じられた。【背景】Museは9月に発表されたMetaのパーソナルAIエージェントで、スマートフォンやパソコンで利用者の用事を代行する。9月には手のひらサイズの専用端末「Muse Charm」も発表されており、今回の腕時計対応は同じ見た目や考え方を身に付ける道具へ広げる動きといえる。【詳細】腕時計では、Museのキャラクターが画面の中心に表示され、テキストの入力、音声の聞き取り、通話の開始という3つの方法でやり取りできる。コンプリケーションを文字盤に置けば、アプリを開かずにすぐMuseへたどり着ける。記事によれば、腕時計版の見た目は9月に発表されたCharmのデザインに近く、Metaが同じ姿を複数の形に広げていることがうかがえる。現時点で明らかなのはiOSアプリの更新と腕時計対応、入力方法、コンプリケーションの存在までで、追加の機能や対応機種の詳細は示されていない。【ポイント・注意点】腕時計への対応は、短いやり取りを素早く済ませたい場面で便利になる。スマートフォンを取り出さずに頼めるため、外出先での使い勝手が上がりそうだ。ただし、腕時計でできる作業の範囲や、どの国で使えるかはまだ明らかになっていない。日本での提供時期も未確認のため、続報を待つのがよい。腕時計は、短いやり取りを素早く済ませたい場面に向く。スマートフォンを取り出さずに頼めるため、外出先での使い勝手が上がる。Museは9月の発表以来、スマートフォンやパソコンに加え、手のひらサイズの専用端末Charmや腕時計へと、身に付ける道具への広がりを進めている。日本での腕時計対応の時期はまだ明らかになっていない。対応の詳細が分かり次第、続報を確認したい。","2026-11-14","TechJournal","https://www.techjournal.it/watch/meta-muse-apple-watch"],["Museの今を整理、日本の料金とスペースを解説","MetaのAIエージェント「Muse」について、できることや料金、スペース、日本での提供状況を11月14日時点の情報で整理した解説記事が公開された。スペースは11月6日に提供開始、料金は無料から月2,799円のパワー、月13,990円のマキシマムまで。Chrome拡張機能「Muse from Meta」は11月12日に公開された。日本でのビジネス向け機能や独自メールアドレスはまだ未提供だ。","\n【概要】MetaのAIエージェント「Muse」について、できることや料金、スペース、日本での提供状況を2026年11月14日時点の公開情報で整理した解説記事が公開された。Muse自身に調査させてスペースにまとめた内容を、著者が文章化したものだ。スペースの提供開始や日本での料金、Chrome拡張機能までを1本にまとめている。【背景】Museは2026年9月8日に米国で発表され、10月23日に北米以外では初めて日本で提供が始まった。11月6日には言葉で伝えるだけで自分専用の小さなページを作れる「スペース」が、Museが使えるすべての地域で提供開始された。日本ではマネーフォワードMEとの連携も10月26日に始まっている。【詳細】スペースは、旅行プランナーやギフト管理、注文トラッカーなど、言葉で伝えるとMuseが作る自分専用の体験だ。サイドバーやメインタブに置け、つないだアプリから自動で更新される。他の人との共有や共同編集は11月14日時点ではまだ提供されておらず、Metaは検討中としている。料金は基本機能が無料で、有料プランはパワーが月2,799円（毎週5億トークン）、マキシマムが月13,990円（毎週30億トークン）。Chrome拡張機能「Muse from Meta」は11月12日に公開され、バージョン2.0.65、約2.29MiB、41言語対応とされる。自分のChromeのサイドパネルから使い、ログイン済みのサイトで作業を任せられる。音声とアバターは11月上旬に米国から順次提供され、AIグラスやMuse Charmへの音声対応は近日とされる。【ポイント・注意点】Muse for Small Businessは米国とカナダのみで、日本での提供開始は未確認だ。メルカリやチケットぴあとの連携も「進めている」段階で、開始日は確認できていない。Muse独自のメールアドレスも日本では「別途案内」のままだ。記事の中身はMuseに調査させたもので、著者自身がすべてを確認したわけではないと明記されている。料金や提供状況は変わるため、契約前にMuse内の表示で確認するのがよい。","2026-11-14","note（富永淳一）","https://note.com/j_tomi/n/n98bd65f34c69"],["Claude Code、11月13日更新で権限まわりを変更","Anthropicの公式Claude Code変更履歴に、11月13日分の更新が掲載された。VS Codeでのプロンプト提案やAPIキーを作らないConsoleサインイン、サンドボックス内Bashコマンドの権限フロー変更、予約タスクの確認追加など、多数の項目が並ぶ。zstd圧縮レスポンスのセキュリティー修正を含む88件の不具合修正も含まれている。更新も頻繁で11月に入ってからも動きが続いている。","\n【概要】Anthropicの公式Claude Code変更履歴に、2026年11月13日分の更新が掲載された。セキュリティーの修正やVS Codeでの新機能、サンドボックスと権限の扱いの変更など、多数の項目が並ぶ。バージョン2.1.325に当たる更新とみられる。【背景】Claude Codeは週に複数回の更新が続いており、11月9日にはClaude Fable 5.2が既定のFableモデルになり、11月10日にはVertexでの高速モードが追加された。11月12日には実験的なコードモードが加わり、13日の更新はその直後のものだ。常時稼働させる利用者ほど、権限まわりの変更の影響を受けやすい。【詳細】追加されたのは、VS CodeなどでJupyterノートブックを編集した後にセル再実行のヒントを出す機能や、ターミナルでのプロンプト提案（Tabキーで採用）、APIキーを作らないConsoleサインインなどだ。変更点では、サンドボックス内のBashコマンドが既定で通常の権限フローに従うようになり、読み取り専用のGitコマンドは信頼していないリポジトリで事前に確認を求めるようになった。予約タスクや/loopは、許可ツールやフックを宣言するスキルを実行する前に確認を求める。claude remote-controlは、単独で止まったときに終了コード4、登録できないときに69を返すようになり、サービス管理側から再起動しやすくなった。修正されたのは、zstd圧縮レスポンスの復号にあったセキュリティーの問題など、88件の不具合だ。【ポイント・注意点】サンドボックスや権限の既定が変わるため、無人で動かしている設定では、以前は確認なしで通っていた処理が止まる場合がある。サンドボックス内でも確認なしでBashを動かし続けたい場合は、sandbox.autoAllowBashIfSandboxedをtrueにする必要がある。常時稼働の構成では、更新後に動作を確かめておくのがよい。更新は頻繁に行われており、11月12日のChrome拡張機能の公開や11月6日のスペース提供開始など、11月に入ってからも動きが続いている。","2026-11-13","Claude Code Docs","https://code.claude.com/docs/en/changelog"],["Muse Ember、安価なクラウド専用サブエージェント","Metaが11月9日に発表した最小のモデル「Muse Ember」について、クラウドのサブエージェントとして使う場合と自分の機器で動かす場合の費用を比べた解説が公開された。Emberはクラウド専用で重みは公開されておらず、自分の機器では動かせない。知能指数は36点でClaude Haiku 5.5と同じだが、1タスクあたりの費用は約3分の1の0.14ドルだ。","\n【概要】Metaが2026年11月9日に発表した最小のモデル「Muse Ember」について、クラウドのサブエージェントとして使う場合と自分の機器で動かす場合の費用を比べた解説が、11月10日に公開された。Emberはクラウド専用で重みは公開されておらず、自分の機器では動かせない。【背景】MetaはEmberを「最も小さく効率のよいモデル」と位置づけ、エージェントが一日に何度も繰り返す作業、すなわちツール呼び出しやコーディングの小作業、振り分け、抽出、長い文書の読み取りに向けて作った。Metaによれば、EmberはMuse Wonder Fullを使って学習させた初のモデルだという。【詳細】EmberはモデルID「muse-ember-1.0」
