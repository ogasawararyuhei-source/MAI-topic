らを直してもよい。グラフィックスを使うプログラムも動く。Turbo Pascal 3.0のタートルグラフィックスのプログラムも、少し直せば移せる。PascalからRustを呼ぶことも、RustからPascalを呼ぶこともできる。Turbo Pascalで書かれた昔のデータファイルを読み、JSONと相互に変換する機能もある。Pascalのコードを整形する道具も付く。導入は`cargo install ruscal`で、`ruscal run hello.pas`と打てば、変換、組み立て、実行までが一度に済む。HNのコメントで作者は、Claude CodeのOpusとFableが自分の指示のもとで数週間かけて書いたと説明した。Claudeに試験用のプログラムを作らせ、Free PascalとDOSBox上のTurbo Pascal 7で動かして答えを照らし合わせたという。\n\n【ポイント・注意点】\n作者は、グラフィックスを含む自分の昔のプログラムが動き、昔のバイナリのファイルも読めたと報告している。ただし、READMEの言い方は「かなり網羅的」で、すべての書き方に対応するとは言っていない。投稿の得点は3点だった。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50553568"],["エージェントごとの作業場を0.1秒で作る「Replica」","AIエージェントを動かすたびに、依存関係まで入ったプロジェクトの複製を一瞬で用意するmacOS向けの道具「Replica」がShow HNに投稿された。APFSのコピーオンライト（書き込むまで中身を共有する仕組み）を使い、1700ファイルの例ではおよそ100ミリ秒で作業場ができる。どの複製も本物のgitの作業コピーで、枝を切ってコミットやプッシュもできる。期限切れの自動削除などで、ディスクの使いすぎも防ぐ。","\n【概要】\n「Replica」は、エージェントの実行ごとに、依存まで入ったプロジェクトの複製を作るmacOS向けの道具だ。Show HNには「100ms copy-on-write workspaces for AI agents on macOS」という題で投稿された。複製は数ミリ秒から数百ミリ秒ででき、本物のgitの作業コピーとして使える。\n\n【背景】\nREADMEによると、エージェントの作業の多くは、作業コピーやnode_modules、組み立ての出力といった小さなファイルを作っては消すことだ。そしてmacOSは、まさにそこが遅い。新しく入れ直すと、エージェントが働き始めるまでに数秒から数分かかってしまう。\n\n【詳細】\nReplicaは、まず依存を入れたgitの複製を「土台」として一度だけ作る。`replica new`を呼ぶと、その土台を`clonefile(2)`の1回の呼び出しで複製する。中身のデータは、ファイルが変わるまで土台と共有したままだ。Apple M1 Maxでの測定では、1700ファイルのプロジェクトの複製に、1つなら約100ミリ秒、10個を同時に作ると約230ミリ秒かかった。`git clone`して入れ直す場合は数秒かかる。複製では枝を切ってコミットやプッシュができ、土台には手が付かない。ディスクの使い方は、期限切れの削除、長く使われていないものからの削除、容量の上限、専用のAPFSの区画で抑える。`replica base refresh`を使えば、土台を作り直さずに最新に追い付ける。コマンドは`--json`の出力や決まった終了コードに対応し、Claude Code、Cursor、Copilot、Zed、Aider向けのスキルも付く。10個の同時実行の試験では、SQLiteの混雑によるエラーも破損も出なかったという。\n\n【ポイント・注意点】\nAPFSの`clonefile(2)`に頼るので、macOS専用でLinuxでは動かない。土台と複製は同じAPFSの区画に置く必要がある。区画をまたぐ場合は、黙って普通の複製をする代わりに、はっきり断る作りだ。速さの数値は機械の負荷で変わるとREADMEも注記している。投稿の得点は3点だった。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50553493"],["Astroのサイトを画面で編集する「Starquix」","静的サイトの枠組みAstroで作ったサイトを、実際の見た目のまま画面上で編集できるMac用アプリ「Starquix」がShow HNで公開された。キャンバスで要素を選んで変えると、その変更がファイルに書き込まれる。プロジェクトは普通のAstroとTailwindのフォルダのまま手元に残る。内蔵の端末でClaude CodeやCodexを動かせ、エージェントも内蔵のMCPサーバー経由で同じプロジェクトを編集できる。MITライセンスだ。","\n【概要】\n「Starquix」は、Astroのサイト向けの無料の画面編集アプリだ。Macで動く。Astroのプロジェクトのフォルダを開くと、本物のサイトをキャンバスに表示する。要素を選んで「Design」の欄で変えると、その変更がファイルに書き込まれる。\n\n【背景】\n作者は投稿で、Astroが大好きで、ほかのサイト作成ツールは好きではないので作ったと書いている。また、今やコードはありふれたものなのでオープンソースにした、とも述べている。サイト作成ツールの多くは、独自の形式やクラウドにデータを抱え込む。Starquixは、プロジェクトを手元の普通のAstroのフォルダのまま保つ点を売りにする。\n\n【詳細】\nREADMEによると、文字、画像、色、配置は、キャンバスか「Design」の欄で手で変えられる。内蔵の端末では、Claude CodeやCodexなど、端末で動くエージェントを走らせられる。アプリの中で、自分のAPIキーを使ってAnthropic、OpenAI、OpenRouter、手元のOllamaと話すこともできる。エージェントは内蔵のMCPサーバーを通して、開いているプロジェクトを編集する。その変更はキャンバスにすぐ映る。公開先は、CloudflareかGitHub Pagesに直接、NetlifyかVercelにはGitHubのリポジトリ経由で出せる。フォルダとして書き出すこともできる。ほかに、ブログの記事を書いて公開するCMS、ページごとの題名や説明と点数を示すSEOの機能、1か所で色を変えれば全体に反映される変数の機能もある。編集の画面はViteとReact、デスクトップ版はElectronで作られている。開発にはNode.js 22以降とnpm 10が要る。\n\n【ポイント・注意点】\nプロジェクトとAPIキーは手元に保存される。ただしアプリは、Plausibleでの匿名の閲覧数の計測、新しい版の確認、フォントの読み込み、つないだAIや公開先との通信で外につながる。READMEはそれぞれの該当箇所まで示している。今のところデスクトップ版はmacOSでしか動かない。投稿の得点は4点だった。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50553109"],["SigNozをスマホで見るアプリ「PocketOps」","オープンソースの観測基盤SigNozを、スマホから見られるようにするiOSとAndroid向けのアプリ「PocketOps」がShow HNに投稿された。作者の会社は、カナダの国内にデータを置くため、DatadogからSigNozの自前運用に移った。費用は大きく下がったが、SigNozのWeb画面はスマホでは使いにくかったという。アプリでは警告、ログ、サービスの状態、メトリクスを見られ、SigNozのリンクを貼ると対応する画面が開く。","\n【概要】\n「PocketOps」は、SigNozのためのスマホ向けの画面だ。iOSとAndroidで動き、警告、ログ、サービスの性能監視、メトリクスを見られる。SigNozのリンクを貼ると、それに当たる画面を開くタブもある。作者は、SigNozとは関係のない個人の取り組みだと明言している。\n\n【背景】\n投稿によると、作者の会社は、データをカナダの国内に置くため、観測の仕組みをDatadogから自前で動かすSigNozに移した。結果はとてもよく、費用は大きく下がり、画面も目的に合っていたという。ただ、SigNozのWeb画面はスマホの画面に合わせて形を変えてくれない。そこで作者は、このアプリを自作した。自分に都合よく見ている面はあると断りつつ、Datadogのアプリよりずっと使いやすいと書く。\n\n【詳細】\nREADMEによると、つなぐにはサーバーのURLと、SigNozのサービスアカウントのAPIキーを入れる。閲覧だけならViewerの権限で足りる。保存した表示を作ったり直したりするには、その権限が要る。ログインの手順はなく、キーは端末の鍵の保管庫に入る。ログ、トレース、メトリクスでは、保存した表示を使える。作りはExpo SDK 58、Expo Router、TanStack Queryで、組み立ては手元だけで行う。開発用には、SigNozの仕様書をもとにした模擬サーバーが付く。ただ作者は、模擬サーバーでは本物の挙動の違いを見逃したことがあると書く。そのため、APIに触れる変更は本物のSigNozで試すよう勧め、試験用のデータを流す道具も添えている。\n\n【ポイント・注意点】\nブラウザで動く版もあるが、開発の便宜のためで、資格情報をブラウザの保存領域に置く。本番の対象はiOSとAndroidだ。SigNozがCORSの応答を返さないため、ブラウザ版には中継の道具が要る。今の状態や確かめ済みの範囲、次の作業は、リポジトリの引き継ぎの文書にまとめられている。投稿の得点は10点で、作者はSigNozの仕組みそのものを高く評価していた。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50551614"],["AIエージェントが中世の町で働く「RuneSpace」","何十ものAIエージェントを見守る画面を、昔のオンラインゲームのような中世の町にしてしまう改造「RuneSpace」がShow HNに投稿された。エージェント管理のアプリHerdr向けで、働いているエージェントは石切り場でつるはしを振ったり、川辺で釣りをしたりする。手が空いたり質問があったりすると、たき火の周りに集まる。キャラクターをクリックすると、そのエージェントの端末が開く。種類ごとに服装も変わる。","\n【概要】\n「RuneSpace」は、エージェント管理のアプリHerdr向けの改造（mod）だ。エージェントを小さな中世の町の住人として描く。Show HNには、エージェントの管理をRuneScapeで遊ぶような感覚にするHerdrの改造、という題で投稿された。\n\n【背景】\n作者は、複数の機械で何十ものエージェントを動かすうちに、全体を追い切れなくなったという。同時に、RuneScapeで遊んでいたころが懐かしかった。その2つを一度に解決するために作ったのがRuneSpaceだと書いている。\n\n【詳細】\nエージェントは、手が空いたときや質問があるときに、たき火のところへ歩いていく。働いている間は、石切り場でつるはしを振ったり、川辺で釣り糸を垂れたりする。キャラクターに近づいてクリックするか、近くでEnterを押すと、そのエージェントの端末が開く。READMEによると、Codexのエージェントは魔法使い、Claudeのエージェントは弓使い、Hermesはギルドの長だ。OpenCodeは剣と盾を持つ戦士、Piは苔色の服のドルイドとして描かれる。投稿は、使い方や料金の違い、たとえば月額の契約かAPIの従量課金かも服装で見分けられるとしている。手の空いたエージェントは広場に集まり、30分たつと地図から去って、友達一覧でオフラインと表示される。プレイヤー自身も木を切って経験値を得たり、ゴブリンや大ネズミと戦ったりできる。導入には、Metalに対応したMac、Herdr DesktopとCore、Node.js 22以降、Python 3、Xcodeのコマンドラインツールが要る。動作を確かめた版は、Herdr Desktop 0.1.16とCore 0.1.21だ。\n\n【ポイント・注意点】\n動くのはmacOSだけで、Herdrを使っている人向けの遊び心の強い道具だ。初めて開くときに描画の部分を組み立てる。とはいえ、多数のエージェントの状態をひと目で見せる、という課題はまじめなものだ。投稿の得点は4点だった。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50551119"],["静的サイト生成のEleventyをRustに移した「Brrrty」","静的サイト生成ツールEleventy（11ty）を、LLMの力を借りてNode.jsからRustに移した「Brrrty」がShow HNに投稿された。既存の11tyのサイトを、テンプレートもMarkdownもデータもそのままに、出力をバイト単位で同じにして組み立てる。作者の個人サイトは手元で2.32秒かかっていた組み立てが、1秒を切るようになったという。設定は小さなRhaiのスクリプトに移り、多くは`brrrty init`が自動で書く。","\n【概要】\n「Brrrty」は、Rustで書かれた静的サイト生成ツールだ。既存のEleventyのサイトを、出力をバイト単位で同じにしたまま、短い時間で組み立てる。作者のjoshtronic氏は、Eleventyを「LLMで」Rustに移したとShow HNに書いている。\n\n【背景】\n作者は、自分の個人サイトの組み立てを速くしたかったという。手元では2.32秒かかっていた。Brrrtyに移したあとは1秒を切り、出力はバイト単位で同じだったと報告する。今は、公開されているEleventyのリポジトリで、想定外の書き方を探しながら試しているところだ。\n\n【詳細】\nREADMEによると、作者のサイトjoshtronic.comは2272ファイルのブログで、GitLabのCIで、プッシュのたびにBrrrtyで組み立てている。11tyからテンプレートを変えずに移し、切り替える前に11tyの出力とファイルごとに比べたという。ツールの公式サイトもBrrrty自身で作られている。使い方は、サイトのフォルダで`npx brrrty init`を実行する。これでpackage.jsonに追加され、設定がRhaiのスクリプトに移される。`init`は11tyの設定を実行せずに読み、変更を差分で見せ、先に確認を求める。移せない部分は、元のコードを引用した「TODO」として残る。`brrrty doctor --verify`は、両方で組み立てて、全部のファイルが一致するかを教える。テンプレートは、Liquid、Nunjucks、Markdown、HTMLを混ぜて使え、11tyのデータの仕組み、レイアウト、ページ分け、パーマリンク、コレクションにも対応する。RSSと構文の色付けは組み込みだ。\n\n【ポイント・注意点】\n版は0.0.xと初期で、作者は、まずサイトの写しで試すよう勧めている。11tyと完全に同じにできない場合は、そのページの組み立てを断り、理由をファイル名と行で示す。黙って違う結果を出さない作りだ。用意済みのバイナリはmacOSとLinux向けで、Rust 1.89以降なら`cargo install`でも入る。投稿の得点は5点だった。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50548181"],["文章の中でAIと話し素材も作る編集アプリ「Dez」","AIとのやり取りを、すべて書き換えられる1枚の文章として扱う無料のオープンソースのアプリ「Dez」がShow HNで紹介された。コードエディターZedにあった「text threads」の機能がなくなったのを惜しんだ作者が、それを復活させる形で作った。最新版では、隔離された環境で動くエージェントとして、ほかのモデルに画像や動画、音楽を作らせ、同梱のffmpegで編集までできる。macOSとLinuxで動く。","\n【概要】\n「Dez」は、AIとの会話を、すべて編集できる普通の文章（プレーンテキスト）として扱うアプリだ。Show HNには「plaintext open source AI multimedia studio」という題で投稿された。複数の提供元のモデルと、高機能な文章エディターの中でやり取りできる。\n\n【背景】\n作者は、コードエディターZedの「text threads」という機能をとても気に入っていた。会話を1枚の文章として自由に書き換えられる機能だ。それがZedから外されたことをきっかけに、この機能を復活させようとDezを作ったという。READMEにも、Zedの機能に触発されたと書かれている。\n\n【詳細】\n最新版のDezは、隔離された環境で動くエージェントとして、映像や音声の道具を使える。ほかのモデルを呼んで素材を作らせ、同梱のffmpegで編集する。READMEによると、数百のモデルで画像、動画、音楽、ナレーションを作ったり編集したりできる。対応する提供元は、OpenRouter、Z.ai、GitHub Copilot、Kimi、MiniMax、Venice、Charm Hyperだ。OpenAIやAnthropicと互換のサーバーを足せば、llama-serverやLM Studio、Ollamaなど手元のモデルも使える。AIの返事を含め、どのメッセージも書き換えられる。タブで複数の会話を並べ、同時にいくつもの返事を走らせることもできる。長い作業は自動で要約され、素材や作業の情報は保たれる。会話の履歴は端末に保存され、Markdownとして保存や複写ができる。複数カーソルや検索と置換など、エディターとしての機能も備える。作りはTauri v2（Rust）とVue 3、TypeScript、Viteだ。\n\n【ポイント・注意点】\n作者は、Dezがコンピューターを傷つけることはないと書いている。ffmpegのコマンドは、macOSではSeatbelt、LinuxではLandlockで隔離される。プライバシーにも配慮し、ユーザー名やフォルダ名が分かるような絶対パスを提供元に送らない設計だ。ライセンスはAGPL-3.0で、投稿の得点は5点だった。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50547934"]],"gh-blog":[["AIの共著表記、squashなら68%残りマージでは8%","dev.toで、AIエージェントが関わったPRの痕跡がマージ後の履歴に残るかを調べた記事が公開された。Copilot やDevinのPRをマージした18の公開リポジトリから469コミットを集計すると、親が1つのコミットの68.1%にAIの共著表記が残る一方、マージコミットでは8.5%にとどまった。差はツールの使い方ではなく、リポジトリのマージ方式で生まれるという。","\n【概要】AIエージェントが関わったプルリクエストの痕跡が、マージ後にメインの履歴へ残るかを数えた記事がdev.toに公開された。結論は、残るかどうかはおもにマージの方式で決まるというものだ。squashマージではAIの共著表記（トレーラー）がたいてい残り、マージコミットではほとんど消える。\n【背景】コミットメッセージ末尾の「Co-authored-by: Copilot」のような行は、AIの関与を示す安価な目印として、監査や社内の集計に使われ始めている。ただし、この行はGitが強制するものではなく、人が消すこともできる。そのため筆者は、今回の68%という数字を、AIが書いたコードの量ではなく、自発的に付けられた表記の下限として読むよう断っている。\n【詳細】筆者は2026年11月8日の週にCopilotかDevinのPRをマージした公開リポジトリ18件を選び、既定ブランチの直近30コミットずつ、計469件を調べた。親が1つのコミット339件のうち231件（68.1%）にAIのトレーラーがあり、親が2つのマージコミット130件では11件（8.5%）だった。同じリポジトリ、同じ週で約8倍の差がある。GitHub既定のマージコミットはPR番号とブランチ名だけの短い文面で、ブランチ側のメッセージを写さないためトレーラーが落ちる。squashは1コミットのPRならその本文を使うので残りやすい。個別に見た8件のPRでも、squashの2件では残り、マージコミットの6件ではすべて消えていた。\n【ポイント・注意点】「copilot」「devin」の文字列検索では、ブランチ名に引っかかって約半数が誤検出になった。筆者は、行頭でトレーラーの名前を照合してから値を絞る方法を勧める。同じ提供元が時期によって3通りの名前で現れたため、完全一致でなく前方一致で探すよう勧める。ボットのログイン名は記憶でなくAPIで確かめ、集計期間と件数を必ず添えることも挙げている。マージ方式を変えるだけで「AIが書いた割合」の見かけが変わるので、トレーラーを数えるダッシュボードは、実はリポジトリの設定を測っている点に注意したい。","2026-11-19","DEV Community","https://dev.to/cole_halton_42f71d71b809b/68-of-squashed-commits-carry-an-ai-trailer-8-of-merge-commits-do-4i9"],["gh でPRを待つ前に知りたい「取り逃した通知は戻らない」","GitHub CLIの新しいgh event listenでPRの変化を待てるようになったが、dev.toの記事は、購読と接続のすき間に起きたイベントは再送されないと注意を促す。状態を読んでから待ち始める順番だと、その間に出たレビューを取り逃す。接続の合図を待ってから現在の状態を読み直し、届いたイベントごとに改めて状態を評価する手順を勧めている。タイムアウトを承認扱いにしない注意もある。","\n【概要】GitHub CLI 2.105.0で、プルリクエストの変化をポーリングなしに待てるgh event listenが加わった。dev.toの記事は、この機能をそのまま待ち合わせに使うと、すき間に起きたイベントを取り逃すと指摘している。\n【背景】GitHubは11月18日、CLIがEvent Streamsに対応したと発表した。コマンドとその仕組みはプレビュー段階で、Event Streamsへのアクセスはウェイトリスト経由で与えられるため、CLIを更新するだけでは使えない。\n【詳細】記事によると、Event Streamsのドキュメントには、イベントは接続が開いている間しか届かないとある。接続前、購読を作った直後、切断中には空白ができ、購読を作っただけでは受け取る準備ができたことにならない。たとえばPRの状態を読んでから待ち受けを始めると、その間に出されたレビューは届かず、もう起きたことを待ち続けてしまう。CLIは接続できたときに状態メッセージを標準エラーに出し、イベントのJSONは標準出力に出す。筆者は、待ち受けを先に起動し、接続の合図を確認してから現在のPR状態を読む順番を勧める。監督役の処理が待ち受けと状態の読み取りを同時に動かす必要があり、待ち受けの終了を待ってから1回読むシェルスクリプトでは足りないという。届いたイベントは結論ではなく「読み直すきっかけ」として扱い、再接続のたびにも状態を読み直す。既定ではイベント1件で終了し、--followで続け、--timeoutに達すると終了コード8を返す。\n【ポイント・注意点】レビューには承認・変更要求・コメントがあり、イベントだけでは中身が分からないので、毎回取りに行く必要がある。イベントは重複したり順序が入れ替わったりしうるため、届いた順に承認を数えるのでなく、現在の状態から判断する。タイムアウト時は承認扱いにせず、PRへのリンクと最後に見た状態を返す。採用前に、使い捨てのPRで「起動前」「接続中」「接続後」「切断中」の4つの時機を試すよう勧めている。なお、この記事はAIの助けで書かれ、筆者は確認していないと明記されている。","2026-11-19","DEV Community","https://dev.to/keith_azodeh/github-cli-can-wait-on-prs-it-wont-replay-the-event-you-missed-50kc"],["大学向けGitHub Campus、12月からCopilot席が有料に","GitHub Educationが大学向けCampus Programの管理者に送ったメールを解説する記事がdev.toに出た。学生のCopilotが取り上げられると受け取られたが、実際は12月1日からの請求方式の変更だという。Copilotと高度なセキュリティは無料の範囲外で、残った席には課金が始まる。学生個人の無料プランへの移行など、期限前にやることを整理している。","\n【概要】GitHub Educationが、大学向けのCampus Programの企業アカウント所有者にメールを送った。dev.toの記事は、学生のCopilot利用が取り消されると誤解されたこの案内を、2026年12月1日から始まる請求の変更として読み解いている。\n【背景】Campus Programは教育機関にGitHubの企業向け機能を提供する制度だ。筆者によれば、Copilotはもともとこの無料提供には含まれておらず、直接請求なしで使っていた機関は、支払うか学生を別の利用形態へ移す必要がある。\n【詳細】Azure経由で請求されていないアカウントには、従量課金の利用に対して月0ドルの既定予算が設定される。ただし、Copilotの席はこの予算とは別の請求で、0ドルの予算では止まらない。Campusに含まれるのは、企業席2万5,000、Packagesの容量50GB、GitHub Actionsの月5万分だ。CopilotとGitHub Advanced Securityは含まれず、所定の料金がかかる。12月1日以降もCampusの企業アカウントにCopilotの席が割り当てられていれば、外さないかぎり課金が始まる。\n【ポイント・注意点】記事は12月1日までの対応として次を挙げる。払わない席は外すか、組織ごとにCopilotのポリシーを無効にする。認証済みの学生は個人アカウントで無料のCopilot Studentを使えるので、移行の方法を周知する。データの扱いや授業での一元管理が必要な場面だけ有料席を残す。機関のメールを使う所有者を2人以上確保する。Azureで払う場合は、思わぬ請求を避けるため12月1日以降に契約をつなぐ。個人アカウントに移すと費用は減るが、利用状況が見えなくなり、機関として統制できなくなる点も挙げられている。Copilot StudentにはAIクレジットの枠とモデルの自動選択が付くが、その使われ方やデータの扱いを機関は監督できない。Copilotを中心に据えた授業では利用の機会をそろえる必要があり、データの統制が厳しい機関は一元管理の有料席を選ぶ可能性があるとも指摘している。","2026-11-19","DEV Community","https://dev.to/devactivity/github-copilot-billing-shift-what-campus-enterprise-admins-need-to-know-for-developer-productivity-hj0"],["awesome-copilotのスキル、Claude Codeへ写す前の点検","GitHub公式のawesome-copilotにあるスキルを、Claude Codeへそのまま写して使えるのかを調べた記事がdev.toに出た。よく入れられている6本の設定欄を読むと、4本は名前と説明だけで、git-commitだけが許可ツールなどを書いていた。書き方の違いで許可の指定が効かない恐れや、写すと壊れるスクリプトのパスなど、事前に見るべき点をまとめている。","\n【概要】GitHubのawesome-copilotリポジトリにあるエージェント用スキルを、Claude Codeへ写して使う前に何を確かめるべきか。dev.toの記事は、よく使われる6本のSKILL.mdの冒頭にある設定欄（フロントマター）を読み比べ、注意点をまとめた。\n【背景】スキルは、SKILL.mdを含むフォルダーで、エージェントの手順や知識を部品として配るしくみだ。筆者が2026年11月17日に調べた時点で、awesome-copilotのskills配下には463のフォルダーがあり、スターは41,274だった。同じ形式をClaude Codeも読めるため、写して使う人が増えている。\n【詳細】調べたのは、導入数の多いgit-commit（48,779）、excalidraw-diagram-generator（34,645）、multi-stage-dockerfile（31,679）、documentation-writer（28,614）、prd（24,639）と、前提条件の節を持つweb-design-reviewer（14,418）の6本だ。4本は名前と説明だけで、prdはライセンスを足し、git-commitだけが互換性と許可ツールを書いていた。git-commitの許可ツールは「shell(git:*)」というCopilotの書き方で、Claude Codeの例はBash(...)の形のため、筆者は効くかどうかを確かめられなかった。互換性の欄もClaude Codeは受け付けるだけで、Gitの版は確かめない。excalidrawはリポジトリ基準のPythonパスを呼ぶので、.claude/skillsへ写すと壊れる。web-design-reviewerは動いているサイトとブラウザー操作の道具が要る。\n【ポイント・注意点】写す前に設定欄とフォルダーの中身を読み、許可ツールの書き方とパスを直すこと。gh skillによる導入はGitHub CLI 2.90.0以降が必要なプレビューで、筆者の環境では使えなかった。GitHubの文書は、スキルはGitHubが検証したものではないと明記している。筆者は、1本ずつ写して実際の変更で試してから次を足すよう勧める。筆者はスキルの目録サイトの運営者で、GitHubやAnthropicとは無関係だという。","2026-11-19","DEV Community","https://dev.to/skillselion/what-the-frontmatter-of-six-githubawesome-copilot-skills-tells-you-before-you-copy-them-into-3mb2"],["Rubyの文字変換に穴「Ruby2Shell」、GHESも影響","Rubyの大文字・小文字変換で1バイトのヒープあふれが起きる「Ruby2Shell」を解説した記事がdev.toに出た。旧来の1バイト文字コードでßを21個並べると境界を1バイト越える。RailsやSinatraのクラシック形式は既定で影響を受け、GitHub Enterprise Server 3.22.5も同梱のRuby 4.0.9が該当するという。修正版は4.0.10、3.4.13、3.3.14だ。","\n【概要】Rubyの文字列の大文字・小文字変換に、1バイトのヒープあふれが起きる欠陥「Ruby2Shell」が見つかった。ブラジルの技術メディアguiadetiがdev.toに載せた記事は、影響する範囲と、Rubyを同梱する自前運用の製品にGitHub Enterprise Serverが含まれることをまとめている。\n【背景】GitLabやGitHub Enterprise Serverのように、Rubyの実行環境を中に抱えたまま配られる自前運用の製品は少なくない。こうした製品では、利用者が手元のRubyを更新しても中身は変わらず、提供元の修正版を待つことになる。記事が製品名を挙げているのはそのためだ。\n【詳細】記事によれば、ISO-8859やWindows-125x系の1バイトの文字コードでは、ßが大文字にすると「SS」の2バイトになるのに、空きの確認は1バイトとして数えている。バッファーは入力の長さに20バイトを足した大きさなので、ßを21個含む入力で1バイトはみ出す。影響を受けるのはupcase、swapcase、downcase(:fold)、casecmp?で、UTF-8の文字列は対象外だ。脆弱な版は4.0.0〜4.0.9、3.4.0〜3.4.12、3.3.0〜3.3.13で、2.4.0以降のすべてが影響を受けてきた。修正版は4.0.10、3.4.13、3.3.14となる。RailsとクラシックなSinatraは、脆弱なRubyで動かすと既定で影響を受ける。\n【ポイント・注意点】記事が挙げる同梱製品は、GitHub Enterprise Server 3.22.5（Ruby 4.0.9）、GitLab 19.6.0（Ruby 3.3.13）、Mastodon 4.7.5、OpenProject 17.9.7、Discourse 2026.10.1、Chatwoot 4.20.0などだ。GHESについては修正済みの版がまだ示されていない。自分でRubyを入れている場合は系列ごとの修正版へ上げ、実行環境を同梱する製品は、提供元が出す修正版を待って適用するよう勧めている。CVE番号は記事に書かれていない。","2026-11-19","DEV Community","https://dev.to/guiadeti/ruby2shell-falha-em-ruby-vulneravel-afeta-rails-sinatra-gitlab-e-github-enterprise-server-5c1b"],["監査ログのS3送信、OIDC認証がGHE.comでも可能に","GitHubは11月19日、企業の監査ログをOpenID Connect（OIDC）でAmazon S3へ送る機能を、データの保管場所を選べるGitHub Enterprise Cloud（GHE.com）にも広げた。これまでgithub.comでだけ使えたもので、長く有効なAWSの認証情報をGitHub側に置かずに済む。設定方法は、企業監査ログの送信に関する文書の該当節で案内されている。","\n【概要】GitHubは2026年11月19日、企業の監査ログをAmazon S3へ流す際にOpenID Connect（OIDC）で認証できる機能を、GHE.comでも使えるようにしたと発表した。GHE.comは、データの保管地域を選べるGitHub Enterprise Cloudだ。\n【背景】監査ログのストリーミングは、企業アカウントで起きた操作の記録を外部の保管先や分析基盤へ送り続ける機能だ。S3へ送る場合、従来の方式ではAWSのアクセスキーのような長く有効な認証情報をGitHubに登録する必要があった。OIDCを使えば、GitHubが発行する短命のトークンでAWS側が身元を確かめるため、鍵そのものを預けずに済む。github.comではこの方式がすでに使えており、今回の発表はそれを延ばしたものだと書かれている。\n【詳細】対象は、データ所在地を指定して使うGitHub Enterprise Cloud、つまりGHE.comの顧客だ。発表の本文は短く、設定の手順そのものは載せていない。代わりに、GitHub Docsの「企業の監査ログをストリーミングする」ページにある「OpenID ConnectでS3へのストリーミングを設定する」節へ案内している。分類は、企業の管理ツールとプラットフォームの統制に置かれている。\n【ポイント・注意点】OIDCに切り替える利点は、長く有効な鍵が漏れたり、交換を忘れたりする危険を減らせることだ。データの保管地域に縛りがある組織ほど監査ログの扱いは厳しく問われるため、GHE.comでgithub.comと同じ選択肢が持てるようになった意味は小さくない。github.comで同じ方式をすでに使っている組織は、その手順をGHE.comの環境にもそろえやすくなる。発表は設定の具体的な手順、料金、提供の段階分けには触れていないため、導入する際はリンク先の文書の節を読み、AWS側の設定も含めて手順を確かめてから進めたい。監査ログは事後の調査で頼りにされる記録なので、送信が途切れていないかを切り替えの後に確認することも大切だ。","2026-11-19","GitHub Changelog","https://github.blog/changelog/2026-11-19-s3-audit-log-streaming-with-openid-connect-expands-to-ghe-com"],["gh v2.105.0、PRの変化をポーリングなしで待てる","GitHubは11月18日、GitHub CLIがEvent Streamsに対応したと発表した。gh v2.105.0のgh event listenにPRのURLと待ちたいイベントを渡すと、届いたイベントをJSONで1行ずつ出し、既定では最初の1件で終わる。レビューの提出、状態や先頭の変更、競合、チェックの完了を待てる。機能はプレビューで、Event Streamsのウェイトリスト登録が必要だ。","\n【概要】GitHubは2026年11月18日、GitHub CLIがEvent Streamsに対応したと発表した。gh v2.105.0以降では、人もエージェントも、プルリクエストの変化をループでの問い合わせではなく1つのコマンドで待てる。\n【背景】Event Streamsは11月17日にプレビューが始まった、エージェント向けのイベント配信のしくみだ。これまではPRにレビューが付いたかやチェックが終わったかを知るために、APIを一定間隔で叩き続けるのが普通だった。\n【詳細】gh event listenにPRのURLと、提出されたレビューなど待ちたいイベントを渡すと、購読を作り、ストリームを開き、届いたイベントを1件ずつJSONの1行として出す。既定では最初のイベントで終わるため、スクリプトやエージェントのループに組み込みやすい。--countで複数件を待ち、--followで待ち続け、--timeoutで時間を区切り、--jqや--templateで必要な欄だけを取り出せる。対応するイベントは、レビューの提出、PRの状態や先頭コミットの変化、マージの競合、チェックスイートの完了だ。購読はgh event subscriptionのcreate、list、view、deleteで管理する。さらにgh pr create、gh pr view、gh run view、gh run watch、gh apiが、ポーリングの代わりにgh event listenを使うよう案内するようになった。\n【ポイント・注意点】gh eventのコマンドはプレビューで、変わる可能性がある。使うにはgithub.comでプレビュー中のEvent Streamsへのアクセスが必要で、gh.io/event-streams-signupのウェイトリストから申し込む。CLIを上げただけでは動かない点に注意したい。詳細はgh eventのマニュアルやgh event --helpで確かめられ、意見はGitHub Communityの議論で受け付けている。開発者の間では、接続前のすき間に起きたイベントは再送されないため、待ち始めた後に状態を読み直す必要があるという指摘も出ている。","2026-11-18","GitHub Changelog","https://github.blog/changelog/2026-11-18-wait-for-pull-request-events-with-github-cli"],["Copilotにつながる公認MCPにSupabaseやBoxなど8種","GitHubは11月18日、Copilotから使えるGitHub検証済みのMCPサーバー（コネクター）に、Box、Buildkite、Calendly、ClickUp、Mixpanel、Supabase、Webflow、Wixの8サービスを加えた。Slack、Figma、Sentryなど25以上の既存サービスに並ぶ。Buildkiteの失敗原因を調べて同じ会話で直すといった使い方を想定する。全プランで公開プレビューだ。","\n【概要】GitHubは2026年11月18日、Copilotからつなげる外部サービスに8つを加えたと発表した。GitHubが検証したMCPサーバーで、コネクターとも呼ばれる。いずれも公開プレビューとして提供される。\n【背景】MCPは、AIエージェントが外部の道具やデータを呼び出すための共通の方式だ。自分でMCPサーバーを探して設定するのは手間がかかり、安全性の見極めも難しい。GitHubはこれまでに、Slack、Figma、Sentryなど25を超えるサービスをコネクターとしてそろえてきた。\n【詳細】今回加わったのは、Box（コンテンツの検索と管理、Box AI）、Buildkite（パイプラインとビルド）、Calendly（日程と会議）、ClickUp（タスクとプロジェクト）、Mixpanel（プロダクト分析）、Supabase（プロジェクトとデータベース）、Webflow（サイトとコンテンツ）、Wix（サイトと業務ツール）の8つだ。例として、Buildkiteのビルドが失敗した理由をCopilotに尋ね、同じセッションでコードを直させる使い方や、マイグレーションを書く前にSupabaseのスキーマを確かめさせる使い方が挙がっている。一度つなげば、Copilotのどこからでも使える。接続は、CopilotアプリのCustomize、Copilot CLIの/mcpのConnectorsタブ、VS CodeのAgentsウィンドウのCustomizations、github.comのCopilotカスタマイズのページから行える。\n【ポイント・注意点】コネクターはすべてのCopilotプランで公開プレビューとして使える。ただしCopilot BusinessとEnterpriseでは、管理者が「Editor preview features」のポリシーを有効にする必要がある。MCPの許可リストをワイルドカードでなく1件ずつ指定している企業は、新しいコネクターを自分で足さなければならない。Boxのように、サービス側の管理者がMCPでの接続を許可する必要があるものもある。","2026-11-18","GitHub Changelog","https://github.blog/changelog/2026-11-18-connect-supabase-box-calendly-and-more-to-copilot"],["Gemini 4 NeonがCopilotで一般提供に","GitHubは11月18日、GoogleのGemini 4 NeonをGitHub Copilotで一般提供すると発表した。エージェント型のコーディングや多段のツール利用向けで、Googleによれば品質はGemini 4 Carbonに近く、1タスクあたりのトークン費用は低い。応答の出だしも速いという。Pro+、Max、Business、Enterpriseで使え、料金は従量課金で提供元の定価となる。","\n【概要】GitHubは2026年11月18日、GoogleのモデルGemini 4 NeonをGitHub Copilotで一般提供すると発表した。エージェント型のコーディング、多段のツール利用、知識作業に向けて作られたモデルだという。\n【背景】Copilotは複数社のモデルを選んで使えるのが特徴で、11月中旬にはGemini 4 CarbonやGemini 4 Hydrogenなど、Geminiの新しい系列が相次いで加わっている。同じ週にはOpenAIやMicrosoftのモデルも追加されており、モデルの入れ替えが激しい時期になっている。\n【詳細】GitHubが伝えるGoogleの説明では、Gemini 4 Neonの品質はGemini 4 Carbonに近く、1タスクあたりのトークン費用は低い。応答の出だしはCarbonより速く、コーディングでは頼まれていない変更が少ない。コードやツール、テストの結果について根拠のない主張をすることも少ないという。対象はCopilot Pro+、Max、Business、Enterpriseの利用者だ。モデル選択の画面からは、Visual Studio Code、Visual Studio、Copilot CLI、Copilotのコーディングエージェント、Copilotアプリ、github.com、iOSとAndroidのGitHub Mobile、JetBrains IDE、Xcode、Eclipseで選べる。料金は従量課金で、提供元の定価で請求される。\n【ポイント・注意点】提供は段階的で、まだ選べない場合は少し待つよう案内されている。BusinessとEnterpriseでは、管理者がCopilot設定のモデルポリシーで利用を管理する。既定の設定では新しいモデルが自動で有効になるが、管理者が全体の既定を切っている場合や、このモデルを個別に無効にしている場合は使えない。性能の説明はGoogleの主張をGitHubが伝えたもので、倍率についての記載はない。費用は従量課金の料金表で確かめる必要がある。","2026-11-18","GitHub Changelog","https://github.blog/changelog/2026-11-18-gemini-4-neon-in-github-copilot"],["GitHub Teamでもセキュリティのリスク診断が自動で無料に","GitHubは11月18日、セキュリティのリスク診断をGitHub Teamの組織で自動実行するようにしたと発表した。診断は無料で、組織の管理者とセキュリティ管理者は結果から、漏れた認証情報やコードの脆弱性を見つけ、組織のいまのリスクをつかみ、次に何から手を付けるかを決められる。診断にはコードのリスク診断とシークレットのリスク診断の2種類があり、それぞれ文書が用意されている。","\n【概要】GitHubは2026年11月18日、GitHub Teamプランの組織でセキュリティのリスク診断が自動で走るようにしたと発表した。診断は無料だ。組織の管理者とセキュリティ管理者は、結果を見て、外に出てしまった認証情報やコードの脆弱性を確かめられる。\n【背景】GitHubはこの数週間、アプリケーションセキュリティの機能を矢継ぎ早に広げている。発表のページに並ぶ同じ分類の更新だけでも、11月17日の開発者とエージェント向けのシークレットスキャンの随時実行、16日のAI Scanの一括開始、13日のREST APIによるAI Scanの管理、12日のCloudflareのサービストークンの検出、9日のGitHub Actionsのワークフローのログに含まれるシークレットの検出がある。11月上旬にはCodeQL 2.27.3と2.27.4も出ている。\n【詳細】診断の結果からは、漏れた認証情報、コードの脆弱性、組織の現在のリスクを把握し、次の手の優先順位を付けられる。発表に添えられた画面では、組織の中で見つかったシークレットと脆弱性を知らせるバナーが表示され、そこからリスク診断を確認できる。診断には2種類あり、コードのセキュリティのリスク診断と、シークレットのリスク診断について、それぞれ文書が用意されている。今回の変更の要点は、Teamプランの組織では誰かが操作しなくても診断が走り、結果が管理者の前に届くようになったことだ。\n【ポイント・注意点】結果を見られるのは組織の管理者とセキュリティ管理者で、一般のメンバーではない。誰が結果を受け取って動くのかを、あらかじめ組織の中で決めておく必要がある。自動で走るので、ある日バナーで初めて問題を知る組織も出てくるはずだ。漏れた認証情報が見つかった場合は、リポジトリから消すだけでは足りず、鍵の無効化と再発行まで行う必要がある。発表で無料とされているのは診断であり、見つかった問題を継続して検出し直していく機能の扱いは発表に書かれていないため、文書で確かめておきたい。","2026-11-18","GitHub Changelog","https://github.blog/changelog/2026-11-18-security-risk-assessments-run-automatically-on-github-team"],["Copilotのプラグインを、チームごとに既定で配れる","GitHubは11月18日、組織のチーム単位でCopilotのプラグインを既定として設定できる機能を一般提供した。チームのメンテナーと組織の所有者が、github.comのチームの「Customize Copilot」タブから、承認したプラグインを加える。VS Code、Copilotアプリ、Copilot CLIで直接のメンバーに既定で有効になる。BusinessとEnterpriseで使える。","\n【概要】GitHubは2026年11月18日、Copilotのプラグインをチームの既定として設定できる機能を、組織のチーム向けに一般提供したと発表した。対象はCopilot BusinessとCopilot Enterpriseだ。\n【背景】Copilotは、スキルやエージェント、MCPの設定などをプラグインとしてまとめ、マーケットプレイスから配れるようになっている。その一方で、どこから来たプラグインを使わせるかは企業にとって悩みどころで、11月16日には、カスタマイズの出どころを公認のものに絞る管理機能も出ていた。今回の機能は、その上でチームに合った道具をそろえる手段になる。\n【詳細】設定できるのは、チームのメンテナーと組織の所有者だけだ。github.comでチームを開き、「Customize Copilot」タブを選ぶ。Copilotに組み込まれたマーケットプレイス、企業のマーケットプレイス、チームが足したマーケットプレイスからプラグインを探し、個別にチームへ加える。プラグインのマーケットプレイスを含むGitHubのリポジトリを、新たにマーケットプレイスとして足すこともできる。選んだプラグインは、チームの直接のメンバーに対し、VS Code、GitHub Copilotアプリ、Copilot CLIで既定で有効になる。\n【ポイント・注意点】子チームのメンバーには引き継がれない点に注意したい。既定は強制ではなく、ポリシーが許す範囲で、メンバーは自分のクライアントでチームのプラグインを切れる。企業や組織のポリシーはチームの選択より優先され、許可するマーケットプレイスや、必須・禁止のプラグインはクライアント側で引き続き強制される。チームの既定がそれらを上書きすることはない。つまり、企業が統制の枠を決め、その内側でチームが自分たちの仕事に合う道具を選ぶ二段構えになる。新しく入ったメンバーも、チームに加わるだけで同じプラグインがそろった状態から始められる。詳しくはCopilotのプラグインに関するGitHubの文書と、GitHub Communityの議論で案内されている。","2026-11-18","GitHub Changelog","https://github.blog/changelog/2026-11-18-customize-github-copilot-for-your-team"],["PSFがGitHub Actionsの危険なトリガーを組織ごと封鎖","Python Software Foundationのブログが、GitHub Actionsの危険なトリガーを組織全体で止める手順を紹介した。GitHubは12月2日から公開リポジトリでpull_request_targetを既定で遮断する。PSFはpsf、python、pypiの各組織で危険なトリガーを外し、ポリシーを適用した。Ultralyticsなど、実際にPyPIへ不正な版が出た事件も振り返っている。","\n【概要】Python Software Foundation（PSF）のブログに、GitHub Actionsの危険なトリガーを組織全体で無効にする方法をまとめた記事が11月18日付で載った。筆者はPyPIの安全担当のMike Fiedler氏と、セキュリティ担当のSeth Larson氏だ。GitHubは2026年12月2日から、公開リポジトリでpull_request_targetのトリガーを既定で遮断する。\n【背景】pull_requestのトリガーは、フォークのコードを読み取り専用のトークンとシークレットなしで動かすので安全だ。一方pull_request_targetは、読み書きできるトークンとリポジトリや組織のシークレットを持ったまま動く。フォークからのPRにラベルを付ける用途を想定しているが、PRのコードをチェックアウトして実行すると「pwn request」と呼ばれる乗っ取りの入口になる。issue_commentも、コメントの文をシェルに埋め込むと命令を注入されうる。\n【詳細】記事は事件を3つ挙げる。2024年12月のUltralyticsでは、pull_request_targetのワークフローが入口となり、ビルドのキャッシュが汚されてPyPIに不正な版が出た。2026年3月のLiteLLMとTelnyxでは、侵害されたTrivy経由でAPIトークンが漏れ、両方に不正な版が出た。2026年4月のelementary-dataでは、コメントで動くワークフローに細工したコメントを送られ、不正なファイルとリリースのタグが押し込まれた。PSFはpsf、python、pypiの各組織で危険なトリガーを取り除き、ポリシーを適用した。\n【ポイント・注意点】TeamやEnterpriseのプランなら、組織全体のポリシー1つで全リポジトリのトリガーを止められるが、Freeプランではリポジトリごとに設定する。勧める進め方は、ポリシーを用意し、何が止まるかを確かめてから強制する順番だ。信頼できないPRのコードを扱わないかぎりpull_request_targetは避け、コメントの文はシェルに入れない。技術的な詳しい手順はAlpha-Omegaのブログにある。","2026-11-18","Python Software Foundation Blog","https://pyfound.blogspot.com/2026/11/de-fanging-dangerous-triggers-in-github.html"],["Copilot CLIのエージェント、最小の1体から育てた記録","個人サイトをASP.NET CoreからAstroの静的サイトへ移す作業を、GitHub Copilot CLIで進めた開発者の記録がdev.toに出た。いきなり専門エージェントの一団を作らず、組み込みのエージェントを確かめてから、読み取り専用のレビュー役1体で始めた。マイルストーン外の機能を欠陥と報告する失敗も経て、最終的に4体の役割と権限の決め方をまとめている。","\n【概要】個人サイトyonka.devを、ASP.NET CoreのRazor PagesアプリからAstroで作る静的サイトへ作り替えた開発者が、GitHub Copilot CLIでエージェントの「小さなチーム」を組んだ経験をdev.toにまとめた。筆者にとって、自作のエージェントを使うのは初めてだったという。\n【背景】Copilot CLIでは、役割や使える道具を決めたカスタムエージェントを作り、メインのエージェントから仕事を割り振れる。最初から専門家を大勢そろえたくなるが、筆者はまずCopilotに組み込まれたエージェントの一覧を出させ、使えるものはそのまま使うことにした。実装と調整はメインのエージェントに任せた。\n【詳細】サイトの目標はdocs/modernization/product-discovery.mdに、作業の決まりや確認の基準、承認が要る境目は.github/copilot-instructions.mdに書いた。最初のカスタムエージェントは、変更がナビゲーション、アクセシビリティ、多言語化、テーマ、SEOの要件を満たすかを見るsite-reviewerだ。使える道具は読み取りと検索だけで、コードは直せない。古いサイト全体を見せると、公開前に直すべき6つの差と、ドイツ語のページに英語のままのラベルが残っていることを見つけた。しかし小さな作業では、先のマイルストーンの機能まで欠陥として報告した。そこで、今のマイルストーンと受け入れ基準を作業から読み取り、当てはまる要件だけを見るよう指示を足した。その後、ui-designer、読み取り専用のcode-quality-reviewer、ビルドやブラウザーのテストを回すverification-engineerを加えた。\n【ポイント・注意点】同じリポジトリのエージェントは同じ思い込みを持ちうるので、並行レビューの結果も証拠と照らす必要がある。エージェントが増えるほど、確かめる指摘もCopilotの利用量も増える。各エージェントには、呼ぶ条件、責任、権限、出すべき証拠の4つを決め、実際の作業で試してから常用する。範囲や設計、受け入れ、コミット、公開の判断は筆者が手放さなかった。","2026-11-18","DEV Community","https://dev.to/yonka/building-a-small-github-copilot-cli-agent-team-without-overdoing-it-3bf2"],["Copilotがブラウザーを操作、Chrome拡張と組み公開プレビュー","GitHubは11月17日、Copilotがブラウザーを操作できる「ブラウザー利用」を公開プレビューとして発表した。Chrome用のGitHub Copilot拡張と組み合わせ、Copilot CLI、Copilotアプリ、VS Code、JetBrainsから使える。動いているWebアプリのデバッグやブラウザーのテストの自動化、複雑なWeb作業を任せられる。設定でブラウザー利用を有効にして始める。","\n【概要】GitHubは2026年11月17日、Copilotにユーザーのブラウザーを操作させる「ブラウザー利用」を公開プレビューとして発表した。Chrome用のGitHub Copilot拡張機能と連携し、Copilot CLI、GitHub Copilotアプリ、VS Code、JetBrainsの4つのクライアントで使える。\n【背景】GitHubは、画面を見てマウスやキーボードを操るコンピューター利用を、開発者の日常の作業に持ち込む取り組みを進めている。ブラウザー利用はその一部で、コンピューター利用と組み合わせれば、Webブラウザーでの作業により直接に手が届くようになるという。同じ日には、Copilotアプリがブラウザー操作に対応したという発表も出ていた。\n【詳細】Copilotはブラウザーを操作し、Webアプリをその場でデバッグし、ブラウザーのテストを自動化し、既存の道具と並べて複雑なWeb作業をこなせる。まずChrome用のCopilot拡張を入れる。続いてクライアントでブラウザー利用を有効にする。Copilot CLIでは/pluginでbrowser useを探して有効にし、新しいセッションを始める。Copilotアプリでは設定のComputer Useで「Enable Browser Use」を入れ、VS CodeとJetBrainsでは設定で同じ項目を入れる。次にChromeで拡張を押し、状態が「Connected」になっているかを確かめる。あとは、ブラウザーを使って何かを済ませるようCopilotに頼めばよい。拡張の設定では、権限の段階を変えたり、試験的な機能を有効にしたりできる。\n【ポイント・注意点】AIにふだん使いのブラウザーを触らせることになるので、ログインしたままのサイトや入力した情報に手が届く。拡張の権限の段階は最初に確かめておきたい。発表には、必要なプランや料金、対応する環境や地域の制限は書かれていない。文書はgh.io/about-browser-useにあり、意見はフォームで受け付けている。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-let-github-copilot-interact-with-your-browser"],["MAI-Code-1.1-Flash、12月18日にCopilotから引退","GitHubは11月17日、MicrosoftのモデルMAI-Code-1.1-Flashを、2026年12月18日にCopilotのすべての機能で廃止すると予告した。後継のMAI Code 2 Flashの登場に合わせたもので、代わりに最新のMAI Code Flashを使うよう勧める。期限までにワークフローや連携を移す必要があり、Enterpriseでは管理者が後継モデルを有効にする必要がある場合がある。","\n【概要】GitHubは2026年11月17日、MicrosoftのコーディングモデルMAI-Code-1.1-Flashを、2026年12月18日にGitHub Copilotのすべての体験で廃止すると予告した。同じ日に発表されたMAI Code 2 Flashの提供開始に合わせた措置だ。\n【背景】Copilotでは新しいモデルの追加と古いモデルの廃止が続いている。11月16日にはClaude Opus 4.8、Claude Opus 5、GPT-5.6 Terraが廃止され、12月にも別のモデルの廃止が予告されている。モデル名を決め打ちしたワークフローや外部連携を持つチームにとっては、置き換えの手間が定期的に発生する状況だ。\n【詳細】廃止されるのはMAI-Code-1.1-Flashで、期日は2026年12月18日。代わりとして最新のMAI Code Flashのモデルを使うよう勧めている。利用者は、12月18日より前にワークフローと連携を新しいモデルへ切り替える必要がある。Copilot Enterpriseの管理者は、Copilot設定のモデルポリシーで後継モデルへのアクセスを有効にしなければならない場合がある。管理者は個別のCopilot設定を見て、そのモデルのポリシーが有効になっているかを確かめられる。有効になれば、対応する体験のCopilot Chatのモデル選択に新しいモデルが出てくる。廃止後にMAI-Code-1.1-Flashを取り除く作業は不要だ。\n【ポイント・注意点】ページには廃止日の前にもかかわらず「Retired」の札が付いているが、本文の期日は12月18日だ。モデル名を直接指定しているスクリプトやエージェントの設定は、期日を過ぎると動かなくなるおそれがあるため、早めに洗い出したい。後継のMAI Code 2 Flashがポリシーで有効になっているかも、あわせて確かめておくとよい。企業顧客で疑問がある場合は担当の営業に連絡するよう案内され、意見はGitHub Communityの議論で受け付けている。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-upcoming-deprecation-of-mai-code-1-1-flash-in-december"],["VS CodeのLocalハーネス、2027年2月に廃止","GitHubは11月16日、VS Code 1.146でCopilotのエージェントを動かす旧来のLocalハーネスを非推奨にし、2027年2月に取り除くと発表した。後継のCopilotハーネスは1.143から新規セッションの既定で、Copilot CLIやCopilotアプリと実行基盤を共有する。ファイルがクラウドへ移るわけではない。カスタマイズの互換性を期限までに確かめるよう求めている。","\n【概要】GitHubは2026年11月16日、Visual Studio Code 1.146で「Localハーネス」を非推奨にし、2027年2月に削除すると発表した。Localハーネスは、エディター内のCopilotのエージェントセッションで、モデル、文脈、道具をまとめて動かす古いしくみだ。\n【背景】後継のMicrosoft CopilotハーネスはVS Codeに組み込まれ、1.143から新しいセッションの既定になっている。Copilot SDKの上に作られ、Copilot CLIやGitHub Copilotアプリとコーディングエージェントの実行基盤を共有する。選んでもファイルがクラウドに移るわけではなく、エージェントのコマンドは引き続き自分のマシンで実行できる。\n【詳細】移行期間としておよそ3か月、組織のポリシーが許す範囲でLocalハーネスは残るが、新機能はCopilotハーネスに集中する。Copilotハーネスには、モデルを選び上位の段階では下書きとレビューを分担させるCopilot Fusion、承認の問い合わせを減らす補助付きの権限、MCPを自分で設定せずにチームのサービスとつなぐコネクター（プレビュー）、作業ボードや対話的な図を出すキャンバス（プレビュー）がある。Copilot Freeを含む既存のプランで使えるが、使える機能はプランや設定、組織のポリシーで変わる。\n【ポイント・注意点】個人は、新しいセッションでSession TargetをCopilotにし、2027年2月までにカスタマイズの互換性を確かめる。ハーネスを替えても、すべてのカスタマイズが自動で移るわけではない。管理者は、vscode.temporaryDefaultToLocalHarnessの例外設定もLocalハーネスとともに消えるので、残しても延命にならない点に注意する。Copilotハーネスを選んでもサンドボックスは自動で有効にならないため、実行時の権限やサンドボックスの制限は別に設定し、期限までに確かめておく必要がある。","2026-11-16","GitHub Changelog","https://github.blog/changelog/2026-11-16-vs-code-retires-the-local-harness-in-february-2027"],["Copilotの週報、GHES対応やVS Codeの受信箱モード","GitHubは11月16日、11月9日の週のCopilotの更新をまとめた週報を出した。Claude Fable 5.2とGemini 4 Carbonが加わり、CopilotアプリではGitHub Enterprise Serverのリポジトリを扱えるようになった。スマホへの作業の引き継ぎや多言語の音声入力も入った。VS Code 1.146では、手当てが必要なセッションを先に並べる受信箱モードが試験的に登場した。","\n【概要】GitHubは2026年11月16日、11月9日の週に出たGitHub Copilotの更新をまとめた週報を公開した。目玉は、CopilotアプリでのGitHub Enterprise Serverへの対応と、VS Codeで注意が必要なエージェントのセッションを先に見せるしくみだ。モデルではClaude Fable 5.2とGemini 4 Carbonが加わった。\n【背景】Copilotは、VS Code、CLI、専用アプリなど複数の場所で毎週のように機能が増えており、GitHubはそれらを週単位でまとめて伝えている。\n【詳細】Claude Fable 5.2はPro+、Max、Business、Enterpriseで使えるが、既定でデータの保持が必要で、BusinessとEnterpriseでは既定で切られたポリシーを管理者が入れる必要がある。Gemini 4 Carbonも同じプランで使える。Copilotアプリでは、クラウドやCodespaceのセッションを、QRコードからGitHub Mobileへ引き継げるようになった。SlackなどのMCPサーバーで再ログインが要ると、会話の中で接続し直して作業を続ける。GHESのリポジトリ、Issue、PRを扱う機能は一般提供になったが、github.comかGHE.comのアカウントが要り、クラウドのセッションは使えない。自動化は分単位やcronで予定を組め、音声入力はフランス語やスペイン語などに広がった。高コントラストと色覚フィルターの組み合わせや、暗色だけのGitHub Dimmedテーマも入った。VS Code 1.146では、エージェントにモデル比較を任せる機能、全ワークスペースのセッションを手当ての要る順に並べる受信箱モード（いずれも試験的）、チャットを別ウィンドウに出す機能（プレビュー）が加わった。\n【ポイント・注意点】試験的な機能は設定で有効にする必要がある。VS CodeのLocalハーネスは2027年2月に削除される予定で、すでに既定となっているCopilotハーネスへの移行の手引きが用意されている。","2026-11-16","GitHub Changelog","https://github.blog/changelog/2026-11-16-github-copilot-weekly-releases-november-9"],["Copilotから3モデル退場、Claude Opus 5など11月16日","GitHubは11月16日、Copilotの多くの機能で3つのモデルを廃止した。Claude Opus 4.8とClaude Opus 5はClaude Opus 5.5へ、GPT-5.6 TerraはGPT-6.1 SolかGPT-6 Lunaへの切り替えを勧める。チャット、インライン編集、質問やエージェントのモード、コード補完が対象だ。廃止は10月15日に予告されていた。","\n【概要】GitHubは2026年11月16日、Copilotで3つのモデルを廃止したと発表した。対象はCopilot Chat、インライン編集、質問モードとエージェントモード、コード補完など、Copilotのほとんどの体験だ。この廃止は10月15日に予告されていた。\n【背景】Copilotは複数社のモデルを選べる一方、新しいモデルが出るたびに古いモデルを整理している。今月だけでも、12月にMAI-Code-1.1-Flashや別のモデル群を廃止する予告が出ており、モデル名を固定した設定を持つチームは定期的な見直しを迫られている。\n【詳細】廃止されたのは3つだ。Claude Opus 4.8は、Claude Opus 5.5への切り替えを勧める。ただし年払いプランの個人の利用者は、引き続き使える。Claude Opus 5もClaude Opus 5.5へ切り替える。モデル選択の画面からは消えたが、すでに許可されているアクセスを通じて、実行時に断られた際の代わりとしては残る。GPT-5.6 Terraは、GPT-6.1 SolかGPT-6 Lunaへの切り替えを勧める。廃止日はいずれも2026年11月16日だ。\n【ポイント・注意点】利用者は、ワークフローや連携を対応するモデルへ移す必要がある。EnterpriseとBusinessの顧客は、既定のモデル有効化の設定なら後継モデルが自動で有効になる。ただし、管理者が全体の既定を切っているか、そのモデルを個別に無効にしている場合は、Copilot設定のモデルポリシーで有効にしなければならない。既存の企業のモデルポリシーはそのまま適用され、廃止されたモデルを取り除く作業は不要だ。有効になった後継モデルは、対応する体験のモデル選択に表示される。企業顧客で疑問があれば、担当の営業へ連絡するよう案内されている。特にClaude Opus 4.8は、年払いの個人プランでは残る一方、企業向けでは使えなくなるため、同じ組織の中でも人によって使えるモデルが食い違う場面がありうる。スクリプトやエージェントの設定でモデル名を指定している場合は、後継モデルへの書き換えを済ませておきたい。","2026-11-16","GitHub Changelog","https://github.blog/changelog/2026-11-16-github-copilot-models-deprecated-on-november-16-2026"],["AIによる脆弱性検査「AI Scan」、20リポジトリを一括開始","GitHubは11月16日、リポジトリの既定ブランチをAIで調べて脆弱性を探す「AI Scan for repositories」を、一度に最大20リポジトリまとめて始められるようにした。CodeQLが対応しない言語も扱え、結果はCodeQLの警告と同じ一覧に並ぶ。組織の設定時や警告の画面から開始できる。公開プレビューで、Copilotのライセンスは不要だ。","\n【概要】GitHubは2026年11月16日、AIでリポジトリのセキュリティ上の弱点を探す「AI Scan for repositories」を、最大20のリポジトリでまとめて始められるようにしたと発表した。一括開始の機能は公開プレビューとして提供される。\n【背景】AI Scanは、リポジトリの既定ブランチを調べて脆弱性を探す機能だ。GitHubの静的解析エンジンCodeQLが対応していない言語も対象にでき、CodeQLが解析する言語でも追加の問題を見つけられるという。見つかった結果は、コードスキャンの警告一覧に、CodeQLの警告と並んで表示される。13日にはREST APIでAI Scanを管理する機能も出ており、組織単位で回しやすくする更新が続いている。\n【詳細】一度に最大20のリポジトリでAI Scanを始められる。開始の方法は3つある。組織の設定でAI Scanを有効にするときに、調べたいリポジトリを選ぶ方法。組織のコードスキャン警告のページから始める方法。そして単独のリポジトリについては、そのリポジトリの警告のページから始める方法だ。発表の画像には、組織のコードスキャン警告のページで、AI Scanのボタンが強調されている様子が示されている。\n【ポイント・注意点】一括開始は公開プレビューで、github.comと、データの保管地域を選べるGitHub Enterprise Cloudで使える。GitHub Copilotのライセンスは不要だ。AIによる検査はCodeQLの代わりではなく補うもので、両方の結果を同じ一覧で見比べながら優先順位を付けることになる。多くのリポジトリを抱える組織ほど、まとめて始められる今回の変更の恩恵は大きい。一方で、まとめて走らせれば警告もまとめて増えるので、どのリポジトリから調べるかを先に決め、処理できる量に分けて回すのが現実的だ。プレビューのため、対象の数や操作は今後変わる可能性がある。文書と、意見を受け付けるGitHub Communityの議論が案内されている。","2026-11-16","GitHub Changelog","https://github.blog/changelog/2026-11-16-bulk-start-ai-scan-for-repositories"],["Dependabot警告の却下申請、有効期間が1週から1年に","GitHubは11月16日、Dependabotの警告を委任のしくみで却下する際の申請が、1週間ではなく1年間開いたままになるよう改めた。レビューする側が答えるまでの猶予が長くなり、期限切れで申請を出し直す手間が減る。github.comではすでに使え、GitHub Enterprise Server 3.24にも入る予定だ。サプライチェーンの安全に関わる改善と位置付けられている。","\n【概要】GitHubは2026年11月16日、Dependabotの警告の「委任された却下」で出す申請が、これまでの1週間から1年間開いたままになるようにしたと発表した。サプライチェーンの安全の分類に置かれた改善だ。\n【背景】Dependabotは、リポジトリが使う依存パッケージに既知の脆弱性があると警告を出す。誤検知や、実際には影響しない場合など、警告を却下したいことはよくある。委任された却下は、開発者が勝手に警告を閉じられないようにし、決められたレビュー役の承認を通して却下させるしくみだ。ところが申請が1週間で失効していたため、レビュー役が忙しいと期限が切れ、申請を出し直す手間が生じていた。\n【詳細】今回の変更で、申請は1年間有効になった。発表によれば、レビュー役は答えるまでに長い猶予を持てるようになり、申請がすぐに期限切れにならないので、出し直しも減る。変更はgithub.comですでに有効で、GitHub Enterprise Server 3.24にも入る予定だ。発表の本文はこれだけの短いもので、ほかの設定や料金の変更には触れていない。読了の目安は1分とされている。この数週間、GitHubはシークレットスキャンやAI Scanなどセキュリティの機能を相次いで広げており、今回の変更は大きな新機能というより、日々の運用で出ていた手間を減らす地道な改善といえる。申請を出す開発者と承認するレビュー役が別の人になる以上、両者の都合が合わずに申請が失効する事態は起きやすく、期限の延長はその摩擦を直接小さくする。\n【ポイント・注意点】申請が長く残ること自体は便利だが、裏を返せば、処理されない申請がたまりやすくなる。却下の申請が1年放置されれば、その間は警告が開いたままになるため、レビュー役の担当を決め、たまった申請を定期的に見直す運用が欠かせない。GHESを使う組織は、3.24に上げるまで1週間の期限が続く点にも注意したい。依存の脆弱性の扱いは監査で問われやすいので、却下の理由を申請に残しておくことが大切になる。","2026-11-16","GitHub Changelog","https://github.blog/changelog/2026-11-16-dependabot-alert-dismissal-requests-now-last-one-year"]],"elec":[["声で走るラズパイ車、AmiVoiceで動き出し6秒を1秒台に","Raspberry Pi 5に載せた小型車PiCar-Xを声で動かす連載の第9回。耳にAmiVoice API、頭にノートPCのOllamaで動くgemma3:4b、読み上げにOpen JTalkを使う構成で、話し終えてから車が動き出すまで約6秒かかっていた待ち時間を1秒台まで縮めた。最も効いたのは、返事の読み上げを待たずに車を動かすという順番の入れ替えで、それだけで約4秒短くなった。単語登録の効果や課金の目安も示している。","\n【概要】\nZennの連載「小さなAIで手足をうごかす」の第9回は、Raspberry Pi 5に載せた小型車PiCar-Xを声で動かす試みです。耳にAmiVoice API、頭にノートPCのOllamaで動くgemma3:4b（約40億パラメータ）、口にOpen JTalkを組み合わせ、話し終えてから車が動き出すまで約6秒かかっていた遅れを1秒台まで縮めた過程を記録しています。\n【背景】\n音声で機械を動かす場合、「聞く」「考える」「話す」「動く」の各段の待ち時間が足し算で効いてきます。クラウドの音声認識と手元の小さな言語モデルを組み合わせる構成は手軽ですが、体感の遅さが使い勝手を大きく左右します。この記事は、どこを削れば速くなるのかを一つずつ確かめています。\n【詳細】\nマイクは車体の後方に付け、約1.5m離れた位置から話しかけています。頭の役のモデルは「F1」「L2」など14種類の記号から一つを選ぶだけにして、速度や回数の上限はPi側のコードが決める設計です。最も効いたのは、返事の読み上げを待たずに車を動かすよう順番を変えたことで、これだけで約4秒短くなりました。ほかに、同期のHTTPをWebSocketのストリーミングに替え、話し終わりを判定する無音の長さを550msから300msに縮めて約0.2秒を稼いでいます。途中経過から先回りして動かす試みは逆に遅くなったため取りやめました。答えを短い記号にし、同じ命令の答えを控えておくと、2回目以降は約0.5秒で動きます。単語登録では、「ピカ」だけを言った場合の認識が31回中2回から25回に増えました。課金は10回の命令で16.0秒分、約0.66円（概算）でした。\n【ポイント・注意点】\n速さを決めたのは、モデルの性能よりも処理の順番でした。安全面では、言語モデルに直接モーターを触らせず、記号を選ばせるだけにして上限をコードで縛る分担が参考になります。一方で、単語登録の効果は登録した語に限られ、普通の言葉では守られないと筆者は書いています。数値はこの筆者の環境での測定です。","2026-11-19","Zenn","https://zenn.dev/mappy55/articles/small-ai-hands-09"],["ESP32-S3とTinyMLで予知保全、量子化とOTAの落とし穴","ESP32-S3とTensorFlow Lite for Microcontrollersで、産業用モーターの振動から異常を見つける予知保全センサーを作った事例。学習後の量子化（PTQ）では稀な初期異常の高周波成分が丸められて検出できず、量子化を前提に学習するQATに切り替えた。フラッシュをファームウェア用とモデル用に分けて二重化し、更新に失敗したら旧モデルへ戻る仕組みで、通信量を約75%減らしたという。","\n【概要】\nESP32-S3の上でTinyMLを動かし、産業用モーターの振動を監視する予知保全センサーの開発記録です。加速度センサーの値を1kHzで取り、FFTで前処理したあと、TensorFlow Lite for MicrocontrollersのINT8モデルで異常を判定します。量子化の失敗と、止まらないOTA更新の設計という、現場で起きた二つの課題を中心にまとめています。\n【背景】\nマイコンで機械学習モデルを動かすTinyMLは、通信や電力を節約できる一方、メモリーの制約が厳しく、モデルを小さくする量子化が欠かせません。現場に置いた機器のモデルを遠隔で入れ替えるOTAも、失敗すると機器が動かなくなるおそれがあります。\n【詳細】\n使ったのはESP32-S3（デュアルコアLX7 240MHz、内蔵SRAM 512KB、PSRAM 8MB）とESP-IDF（FreeRTOS）です。異常時や定期の生存通知はMQTTやBLEで送り、AWS IoT Coreを使ったOTAを想定しています。学習後に量子化するPTQでは、稀な初期異常の高周波成分が丸め込まれて検出できなくなりました。そこで量子化を前提に学習するQATに切り替え、生の時系列ではなく振幅スペクトルを入力にして感度の低下を抑えています。推論用の作業領域（64KB）は動的に確保せず内部SRAMに置きました。PSRAMに置くと実行が3〜5倍遅くなるためです。フラッシュはファームウェア用のota_0とota_1（各1.5MB）、モデル用のmodel_aとmodel_b（各512KB）に分け、モデルはmmapで直接参照します。更新はダウンロード、CRC32と署名の検証、ダミーデータでの試運転、NVSのフラグ切り替えの順に進め、ウォッチドッグが働いたら旧モデルへ戻ります。これで通信量を約75%減らしたとしています。\n【ポイント・注意点】\n筆者は精度99%を狙わず、エッジは一次の振り分けに徹し、疑わしいデータだけをクラウドへ送る2段構えのほうが費用に見合うと述べています。モデルを作る前に、質の高い生データを集める専用のファームウェアを現場に入れることも勧めています。量子化の方式で検出できる異常が変わる点は、TinyMLを試す人が見落としやすいところです。","2026-11-19","Zenn","https://zenn.dev/esperanza/articles/auto-20261114-085858"],["M5Stackで1秒ごとに計測、Claude Codeと作る工場監視OSS","工場設備の見える化を目指すOSS「FactorEye」の開発記第3回。ATOM LiteやM5StickCなどM5Stack系の機器から、温湿度や生産数のパルス、稼働信号を送る3種類の端末を紹介している。自宅のラズパイを使った負荷試験では、60秒分をまとめて送る方式なら100台でCPU 28%に収まった。サーバー側のコードはほぼClaude Codeに任せ、M5側は筆者が現場で直せる書き方に合わせさせたという。","\n【概要】\n工場設備の稼働を見える化するオープンソース「FactorEye」の開発記第3回です。M5Stack系の機器を使った3種類の計測端末と、その開発で起きた問題を紹介しています。筆者は個人で「AIの会社」を作って開発を進めており、サーバー側のコードはほぼClaude Codeに任せたと書いています。なお、1秒ごとの計測と電池駆動は、工場向けではなく個人用の記録のために作ったものだと明記しています。\n【背景】\n中小の工場では、設備の稼働状況を記録する仕組みを手軽に入れたいという需要があります。安価なM5Stackとオープンソースのサーバーを組み合わせ、生成AIで開発を速めるという進め方は、個人開発者が現場の道具を作る一つの型になりつつあります。\n【詳細】\n1台目のFactorEyeNodeは、温度・湿度・気圧、生産数のパルス、稼働と停止の信号を送ります。書き込みは1回だけで、WiFiや送信先はスマホの設定画面から変えられます。ATOM Lite、NanoC6、M5StickC、M5Stack Basicに対応しています。2台目のFactorEyeBatchNodeは1秒ごとに測り、60秒分をまとめて送ります。自宅のラズパイ（4コア）で模擬機器を走らせた負荷試験では、まとめ送りなら100台でCPU 28%でした。1秒ごとに送ると10台で44%になり、約70台で処理が詰まりました。照合結果を5秒間キャッシュすると、1秒送信の100台でも92%で動いたといいます。11月3日には1台が約1時間止まり、11月11日の版ではフラッシュに約24時間分を保存して再起動でも欠けないようにしました。3台目のFactorEyeBatteryNodeは電池で動かす屋外用で、深く眠らせると電流が少なすぎてモバイルバッテリーが電源を切る問題が起きました。\n【ポイント・注意点】\nAIとの分担が具体的です。サーバー側はClaude Codeに任せる一方、M5側のコードは筆者が現場で直せるよう自分の書き方に合わせて書き直させ、その書式ルールを設定に追記しました。1台が止まった原因は未確定で、筆者はTLSの再接続によるメモリーの断片化を疑っている段階です。","2026-11-19","Qiita","https://qiita.com/hayahide23/items/59b58c068577eb35b240"],["地下鉄の放送を訳すラズパイ、AIも使う若き作り手の素顔","Raspberry Pi公式ブログが、米ニューヨーク・ブルックリンのメカトロニクス技術者で作り手のFavor Brunner氏を紹介した。地下鉄MTAの聞き取りにくい車内放送を、Raspberry PiとTouch Display 2で文字にし、他の言語に訳して読み上げる「Run It Back NYC」や、Raspberry Pi上でローカルに動くAIチャットボットを中国語の家庭教師にした「Baymax」などの作品を取り上げている。","\n【概要】\nRaspberry Pi公式ブログが、米ニューヨーク・ブルックリンのメカトロニクス技術者で作り手のFavor Brunner氏を紹介しました。もの作りを芸術的な表現の一つと捉える同氏の歩みと、Raspberry Piを使った作品を取り上げています。記事は『Raspberry Pi Official Magazine』第171号に載ったもので、筆者はRob Zwetsloot氏です。\n【背景】\nRaspberry Piは手頃な価格で音声やAIを試せるため、身近な困りごとを解決する個人の作品が数多く生まれています。今回の記事も、技術の高さよりも、日常の不便から作品が生まれる過程に焦点を当てています。\n【詳細】\n同氏は7歳ごろにレゴを動かしたいと考えたことから興味を持ち、ソフトウェア技術者のおじからRaspberry Piなどの組み立てキットを教わりました。小学校のロボット教室の費用が高くなったときには、母親が自作の絵と引き換えに通い続けられるようにしたといいます。YouTubeのロボット工学チャンネルはインタビューの1年余り前に始め、パーキンソン病の人のための制汗剤ディスペンサーが注目を集めて、ほかの補助具の開発資金をクラウドファンディングで集めるきっかけになりました。お気に入りの作品の一つ「Run It Back NYC」は、聞き取りにくいことが多いMTAの地下鉄の車内放送を、Raspberry PiとTouch Display 2で文字にし、ほかの言語に訳して読み上げる装置です。ほぼ毎日地下鉄に乗る自身の不便から作りました。もう一つの「Baymax」は、Raspberry Pi上でローカルに動くAIチャットボットで、中国語の家庭教師として使い、有料の学習サービスに頼らずに練習できるようにしました。\n【ポイント・注意点】\nローカルで動くAIを自分の学びや移動の不便の解決に使っている点が、電子工作とAIの身近な結び付きを示しています。ただし記事には、音声認識や翻訳、言語モデルに何を使ったかは書かれていません。詳しい作り方を知りたい場合は、同氏のTikTokやYouTubeを確かめる必要があります。","2026-11-19","Raspberry Pi公式ブログ","https://www.raspberrypi.com/news/mechatronics-engineering-as-a-form-of-artistic-expression/"],["QCS6490でYOLOが「終了コード14」、原因はDSPの世代","Qualcomm QCS6490を載せたRB3 Gen 2ボード向けに、物体検出モデルYOLOv11-Nをw8a16で量子化してコンパイルしたところ、「exit code 14」とだけ出て失敗した。w8a8では通り、NPUで5.03msで動いた。開発元に詳しい理由を出すよう求めると、隠れていたログは「値68、73以上が必要」。原因はボードのDSPがHexagon v68で、16ビット同士の行列演算にはv73以降が要ることだった。","\n【概要】\nQualcomm QCS6490を載せたRB3 Gen 2ボードで、物体検出モデルYOLOv11-Nを動かそうとした開発者が、コンパイルの失敗の原因を突き止めるまでを書いた記事です。重みを8ビット、途中の値を16ビットにするw8a16で量子化すると、コンパイルが「exit code 14」とだけ出て止まりました。層の名前も理由も示されませんでした。\n【背景】\nエッジのAIボードでは、モデルをチップのNPUやDSP向けに変換する開発元の道具が欠かせません。ところが変換の段階で失敗すると、どこが悪いのかが利用者からは見えにくいことがあります。量子化の方式は精度と速さを左右するため、どれを選ぶかは実機での動作に直結します。\n【詳細】\n同じモデルをw8a8で量子化するとコンパイルが通り、NPUで5.03msで動きました。既定のTFLiteの経路では134.7msでした。安全なはずのw8a16のほうが、そもそもバイナリーを作れなかったのです。筆者はqualcomm/ai-hub-modelsのリポジトリにissue #364を立て、終了コードだけでなく元の診断を出すよう求めました。約10日後、保守担当者が隠れていたログの一行「[4294967295] has incorrect Value 68, expected >= 73」を示し、要望を道具の担当チームに回しました。RB3 Gen 2のDSPはHexagon v68です。w8a16では16ビット同士の行列演算のカーネルが作られますが、これにはHexagon v73以降が必要で、v68では動きません。モデルや較正、書き出しに問題はなく、設定で選んだ型がこの世代のチップにない命令を求めていたのが原因でした。\n【ポイント・注意点】\n回避策は二つで、このチップではw8a8を使い続けるか、AIMETの設定を自作して行列演算を16ビットにしないようにするかです。筆者は、Hexagon v68の機種では行列演算を含むモデルのw8a16は使えないものと考え、w8a8を既定にするよう勧めています。開発元の道具が終了コードしか返さないときも、下の層には具体的なエラーがあることが多く、問い合わせる価値があるという教訓も添えています。","2026-11-19","DEV Community","https://dev.to/anguoyang/all-we-got-was-exit-code-14-the-real-answer-was-one-number-68-ndd"],["ロボット基盤モデルをAPIで、Pi APIベータを整理して比較","ロボット向け基盤モデルを手がけるPhysical Intelligence（Pi）が2026年10月13日に発表した「Pi APIベータ」を、発表記事をもとに整理した記事。データを上げるとPiの計算環境でファインチューニングし、できたモデルをクラウドから呼んでロボットを動かせる。手元で動かす公開版openpiや、Gemini Robotics On-Device、NVIDIA Isaac GR00Tとの違いも比べている。","\n【概要】\nロボット向けの基盤モデルを手がけるPhysical Intelligence（Pi）が、2026年10月13日に「Pi APIベータ」を発表しました。この記事は、発表を見落としていた筆者が発表記事を読んで要点を整理し、Pi自身の公開版であるopenpi、Google DeepMind、NVIDIAの提供と比べたものです。\n【背景】\nロボットに基盤モデルを使うには、作業に合わせたファインチューニングが必要で、そのための機械学習の基盤や計算資源、複雑なデータの流れを用意しなければなりません。これが、研究機関以外の開発者にとって大きな壁になっていました。\n【詳細】\nPi APIでは、利用者がデータをアップロードすると、Piの計算環境で学習が行われます。できたモデルはクラウドの推論窓口から呼び出してロボットを動かします。実演を集め、学習し、実機で確かめ、失敗から次に集めるデータを決めるという改善の循環を、開発者が自分で回せるようにすることが狙いとされています。事例として、自律型ホイールローダーのActorや、AgRoboticsなどの協力企業が挙がっています。早期アクセス企業のAlmondは、双腕ロボットAxolによる部品のバリ取りを、Pi APIで4日間繰り返して得たモデルで動かしたとしています。多くの応用はクラウド上の推論で動いた一方、一部では接続に課題があったとされます。比較では、Pi APIが学習も推論もPi側に置くのに対し、openpiは利用者の計算機で動かします。openpiのREADMEでは、GPUメモリーの目安が推論で8GB超、LoRAで22.5GB超、全パラメータの学習で70GB超です。Gemini Robotics On-Deviceはロボットの上で動き、NVIDIA Isaac GR00TはJetson Thor上での動作を想定しています。\n【ポイント・注意点】\n発表記事には、性能の数値、料金、APIの仕様、対応するロボットの機種、必要なデータ量や学習時間は書かれていないと筆者は指摘しています。成果はPiと提携先による発表で、第三者による検証はありません。クラウドで推論する方式は通信の状態に左右されるため、ロボットの上で動かす方式との使い分けが今後の焦点になりそうです。","2026-11-19","Qiita","https://qiita.com/hisashi-ito/items/9a18b12ce128e2a9aab4"],["フィジカルAI Summit 2026の参加報告、国産ロボと基盤モデル","NTTデータグループの筆者が、RX Japan主催の「フィジカルAI Summit 2026」に参加した報告。経済産業省の日本向けAIロボティクス戦略や、経産省とNEDOが進める国産マルチモーダル基盤モデルの開発事業（FRONTia）が紹介され、展示では国産汎用ロボットの試作機が釘打ちやねじ締めを実演した。筆者はNVIDIA Cosmos 3-Edgeで動画生成もローカルで試している。","\n【概要】\nNTTデータグループの筆者が、RX Japan主催の「フィジカルAI Summit 2026」に参加した報告です。講演と展示から得た知見を、国産化の動き、社会実装の事例、技術の動向に分けてまとめています。イベントは2026年9月16日に開かれ、記事は11月19日に公開されました。\n【背景】\nフィジカルAIは、AIがセンサーやモーターを通じて現実の世界で動くことを指す言葉として広まりつつあります。ロボットや機械の制御に基盤モデルを使う研究が進み、日本でも国産化を目指す政策が動き始めています。\n【詳細】\n国産化の動きとして、経済産業省の日本向けAIロボティクス戦略と、経産省とNEDOが進める国産マルチモーダル基盤モデルの開発事業（FRONTia）が紹介されました。展示では国産汎用ロボットの試作機として双腕ロボットとセミヒューマノイドが公開され、釘打ちやねじ締めの実演も行われました。社会実装の事例には、建設現場での危険な作業の代替、医療や介護の人手不足への対応、夜間の交通インフラの点検が挙がりました。一方で課題はコストと安全性とされ、投資に見合う用途を見極めることや、AIにルールに基づく制御を組み合わせる安全設計の大切さが示されました。技術面では、視覚と言語から行動を出すVLAと、WAMが注目されているといいます。筆者はNVIDIA Cosmos 3-Edgeの画像から動画を作る機能を手元の環境で試し、人がホワイトボードに丸を描く動画を生成しました。冒頭の1秒ほどは比較的自然でしたが、完全ではなかったと書いています。\n【ポイント・注意点】\nAIだけに任せず、ルールに基づく制御と組み合わせて安全を確保するという考え方は、個人の電子工作でAIにモーターを動かさせる場合にも通じます。記事にはロボットの台数や作業の成功率などの具体的な数値はほとんどなく、全体像をつかむための参加記として読むのがよいでしょう。筆者は今後、動画の生成だけでなく、ロボットの行動の生成も手元で試す予定だとしています。","2026-11-19","Zenn","https://zenn.dev/nttdata_tech/articles/e6c6a07741a91f"],["謎のビープ音を探せ、コーディングエージェントに「耳」","箱だらけの部屋で時々鳴るビープ音の出どころを、コーディングエージェントに近くの機器のマイクを使わせて突き止めた試みをHackadayが紹介した。Pythonのウェブサーバーを立て、余った機器でQRコードを読むとブラウザーが音を拾い始める仕組み。正体は箱に埋もれた古い一酸化炭素検知器の電池切れの警告音だった。エージェントが自分で音のデータを集めて調整できた点を記事は重視している。","\n【概要】\nHackadayが、箱だらけの部屋で時々鳴るビープ音の出どころを、コーディングエージェントを使って突き止めた試みを紹介しました。元の取り組みはSimon Willison氏によるもので、近くにある複数の機器のマイクを借りて、エージェントが音の位置を絞り込めるようにしました。正体は、箱の中に埋もれた古い一酸化炭素検知器が出す電池切れの警告音でした。\n【背景】\nAIのコーディングエージェントは、これまで主に画面の中のコードを書く道具として使われてきました。最近は、測定器やセンサーとつないで、現実の世界のデータを自分で集めさせる使い方が試されています。Hackadayは以前にも、WiFiの解析器とAIモデルを組み合わせた例を取り上げています。\n【詳細】\n記事によると、仕組みの中心はPythonで書いたウェブサーバーです。余っている機器なら何でも「聞き役」になれて、QRコードを読み込むと、その機器のブラウザーがWeb Audio APIで音を拾い始めます。聞き役を部屋のあちこちに置けば、システムが待ち受けて音を聞き、出どころを絞り込んでいきます。記事が注目しているのは、ビープ音そのものよりも、エージェントが物理の世界に手を伸ばせた点です。聞き役の仕組みがその場で作ったウェブベースのものだったため、エージェントは自分で音のデータを集め、開発の途中でやり方を見直したり調整し直したりできました。Willison氏が録音して手渡す必要はなかったといいます。元の記事とコードは、同氏のブログとGitHubのbeep-locatorで公開されています。\n【ポイント・注意点】\n専用の機材をそろえなくても、手持ちのスマホやパソコンをセンサーとして束ね、AIに測定と調整を任せられることを示した例です。ただしHackadayの記事には、聞き役の台数やサンプリングの周波数、位置の精度、三角測量の方法などは書かれていません。詳しく知りたい場合は、元の記事とコードを確かめる必要があります。マイクを使う仕組みなので、他人の機器を勝手に聞き役にしないといった配慮も欠かせません。","2026-11-18","Hackaday","https://hackaday.com/2026/11/18/tracking-down-a-mystery-beep-by-giving-a-coding-agent-a-few-ears/"],["ESP32でアンテナを切り替える衛星受信局、Claude Codeも活用","安いRTL-SDRで国際宇宙ステーションの画像を受けようとした実験が、複数のソフトウェア無線とアンテナを壁一面に並べた衛星受信局「Starlab Observatory」に育った。ESP32で作ったアンテナ切替器を専用のUbuntu機が操り、衛星の通過を予測して受信機とアンテナの組み合わせを選ぶ。Pythonと「少しのClaude Code」で作られ、GitHubで公開されている。","\n【概要】\nHackadayが、Tommy Lather氏の衛星受信局「Starlab Observatory」を紹介しました。安価なRTL-SDRの受信機とアンテナで国際宇宙ステーションからの画像を受けようとした簡単な実験が、複数の無線機とアンテナを組み合わせた大きな設備に育ったものです。作者はこれをオープンソースのプロジェクトとしてGitHubで公開しています。\n【背景】\nソフトウェア無線（SDR）の受信機は安く手に入るようになり、気象衛星や宇宙ステーションの電波を自宅で受ける趣味が広がっています。ただ、衛星は空を短い時間で横切るため、通過の時刻に合わせて受信機やアンテナを切り替える手間がかかります。\n【詳細】\nシステムは、複数のソフトウェア無線の受信機と複数のアンテナを組み合わせたものです。ESP32を使ったアンテナ切替器が、どのアンテナをどの受信機につなぐかを選び、その命令は専用のUbuntuのコンピューターから送られます。このコンピューターで動くStarlabのソフトウェアが衛星の通過を予測し、通過ごとに合う受信機とアンテナの組み合わせを選びます。受けたデータは記録して処理され、複数の作業を同時に走らせることもできます。機材は壁にきれいに並べられており、手入れや改良がしやすいと記事は評価しています。今後は、方位と仰角を自在に動かせる架台の追加も考えられるとしています。記事によると、プロジェクトはPythonと「少しのClaude Code」で作られています。\n【ポイント・注意点】\n個人の無線の趣味でも、AIのコーディング支援を使って複数の機材を自動で動かす仕組みを作れることを示す例です。ただし記事は、Claude Codeを具体的にどう使ったかは説明していません。コメント欄には、AIに頼ったコードで、IPアドレスなどの値が直接書き込まれているといった安全面の指摘もありますが、これは読者の未確認の意見です。周波数や受信機の台数などの数値も記事には書かれていないため、試したい場合はGitHubの公開内容を確かめるとよいでしょう。","2026-11-18","Hackaday","https://hackaday.com/2026/11/18/remarkable-observatory-receives-orbital-radio/"],["6 TOPSのNPUを積む携帯Linux機「Flipper One」","Flipper Devicesが、Rockchip RK3576を載せたオープンソースの携帯Arm Linuxコンピューター「Flipper One」をKickstarterで発表した。6 TOPS（INT8）のNPUを持ち、ネットワークとエッジAIの多機能ツールとうたう。低レベルの制御にはRaspberry PiのRP2350を使う。開始から約12時間で約1万9千人から1,000万ドル近くを集め、価格は399ドルから。届けは2027年7月の予定。","\n【概要】\nFlipper Devicesが、オープンソースの携帯Arm Linuxコンピューター「Flipper One」をKickstarterで発表しました。CNX Softwareによると、ネットワークとエッジAIの多機能ツールと位置付けられ、Rockchip RK3576を中心に、低レベルの制御にRaspberry PiのマイコンRP2350を使います。同社は、STM32を使うFlipper Zeroの後継ではないと説明しています。\n【背景】\n小型の多機能ツールFlipper Zeroは、無線や電子工作の愛好家に広く知られています。Flipper Oneは、それより上の層、つまりLinuxが動くネットワークや無線の領域を扱う機器です。NPUを積む点も特徴です。\n【詳細】\nSoCはCortex-A72（2.2GHz）4コアとCortex-A53（1.8GHz）4コア、Cortex-M0（400MHz）を持ちます。NPUは6 TOPS（INT8）で、INT4、INT8、INT16、BF16、TF32の混合演算に対応します。メモリーは8GBのLPDDR5、記憶装置は64GBのUFS 2.2とmicroSDです。RP2350（150MHz、264KB SRAM、16MBフラッシュ）が、256×144のグレースケール表示を受け持ちます。HDMI 2.1とUSB-C経由のDisplayPort 1.4は最大4Kp120に対応します。ギガビットEthernetを2つ持ち、Wi-Fi 6とBluetooth 5.2を備えます。追加の部品で4G LTEや5G、Meshtasticなどに使うLoRa、24〜1700MHzのSDR（仕様は未確定）を足せます。電池は7,000mAhで、大きさは155×67×40mmです。キャンペーンは記事の前日に始まり、約12時間で約1万9千人から1,000万ドル近くを集めました。価格は399ドルからで、全部入りは759ドルです。\n【ポイント・注意点】\n記事は、バイナリーの組み込みを使わないという主張に懐疑的で、Wi-Fiや携帯通信のファームウェアは規制上、非公開のまま残る可能性が高いと指摘しています。送料は別で、発送先は米国やEU、英国、シンガポールなどに限られます。届けは予定どおりなら2027年7月です。仕様や時期は変わる可能性があります。","2026-11-18","CNX Software","https://www.cnx-software.com/2026/11/18/flipper-one-a-rockchip-rk3576-powered-portable-arm-linux-computer-and-networking-multi-tool/"],["ラズパイのオフラインAI船舶コンピューター、公開より安全を優先","Raspberry Piで動く、クラウドに頼らないAI搭載の船舶用操舵コンピューター「d3kOS」の開発者が、プロジェクトの宣伝で得た教訓をまとめた。音声のLLMやYOLOv8の画像認識、Signal K、AvNavを組み合わせる。コミュニティーで関心を集めた一方、ソースの公開が攻撃の手がかりになり、6万5千を超える偽アカウントを作られた。安全の仕組みが整うまで公開を見送ると決めた。","\n【概要】\nRaspberry Piで動く船舶用の操舵コンピューター「d3kOS」の創設者、Don Moskaluk氏が、プロジェクトを宣伝する中で得た安全性やオープンソース、信頼についての教訓をまとめました。d3kOSは、完全にオフラインで動くAI搭載の操舵コンピューターとうたわれ、音声のLLM、YOLOv8による画像認識、船舶データの規格Signal K、航海用ソフトAvNavを組み合わせています。\n【背景】\nレジャー用の船の電子機器は高価な専用品が多く、月額料金がかかるものもあります。Raspberry PiとオープンソースのAIを使えば、クラウドにつながらずに動く安価な代わりを作れるのではないか、というのがこのプロジェクトの出発点です。\n【詳細】\n同氏は最初にProduct Huntで宣伝しましたが、ほかのサイトの宣伝を頼む返信ばかりで、意味のある反応はほとんどありませんでした。一方、RedditのRaspberryDIYのコミュニティーに出した記事は予想以上の関心を集め、スマートボートやオープンソースAIのコミュニティーにも議論が広がって、詳しい批判を受けました。同氏は反応を三つに分けています。良かったのは、クラウドに頼らずにレジャーボートにAIを持ち込むことへの期待でした。悪かったのは、AIの助けを借りた開発や根拠のない主張への疑いで、同氏はコミュニティーが透明性と実演、証拠を求めていることに同意しています。厄介だったのは安全面です。2026年7月より前にソースコードの多くを公開したことで、仕組みが攻撃者やスパムを送る者に知られました。その後のスパム攻撃では6万5千を超えるアカウントが作られました。サーバーは動き続けましたが、安全上の隙も見つかりました。\n【ポイント・注意点】\n同氏は当初、1.0版を仕上げてGitHubで全部を公開する予定でした。しかし、安全の仕組みや監視、運用上の守りが基準に達するまで公開しないと決めました。外部の機器とつながるAI機器は攻撃の入り口になりやすく、弱い初期パスワードや露出したサービスを抱える船舶の電子機器の問題も議論に挙がっています。作品を公開する前に安全を見直す大切さを示す体験談です。","2026-11-18","DEV Community","https://dev.to/don_moskaluk_be46b51f5778/building-a-raspberry-pi-ai-marine-computer-lessons-in-security-open-source-and-trust-6em"],["Claude CodeがUARTログを必要な行だけ読む「UartX 1.4」","ファームウェア技術者が作ったUARTのログ記録ツール「UartX 1.4」は、ログ全体をAIに渡さず、Claude Codeが必要な行だけをコマンドで取り出して解析できるようにした。試しでは基板が196行を出力したのに対し、Claudeが読んだのは約30行だった。どの行を読んだかが見え、データは手元のPCに残り、Claudeから機器へは送れない読み取り専用の作りだ。AI機能はWindowsのみ。","\n【概要】\nファームウェア技術者のShamanth Poojary氏が、UARTのログを記録するツール「UartX 1.4」を紹介しました。最大の特徴は、ログ全体をAIに貼り付けるのではなく、Claude Codeが「uartx-ctl」というコマンドを使って、必要な行だけを取り出して解析できるようにした点です。\n【背景】\nマイコンの開発では、シリアル通信（UART）で出力されるログを読んで不具合を探すのが日常の作業です。ログは長くなりがちで、全部をAIに渡すと、扱う量が増えるうえ、関係のない行に注意がそれることもあります。機器のデータを外に出したくない現場もあります。\n【詳細】\n記事によると、主な特徴は四つあります。一つ目は、Claudeが関係のある行だけを取り出して読む選択的な解析です。二つ目は透明性で、Claudeが何を見つけたか、どんな要求を出したか、どの行を読んだかを利用者が確かめられます。三つ目は絞り込んだ表示で、ネットワークの再試行やメモリーの使用量、センサーの故障といった分野ごとの傾向を見つけられます。四つ目は、手元で動く読み取り専用の作りで、データは利用者のPCに残り、Claudeから機器へデータを送ることはできません。試しでは、基板が196行を出力したのに対し、Claudeが必要としたのは約30行だけでした。AIの機能はWindowsでのみ使え、記録の本体はWindows、macOS、Linuxで動きます。リリースとソースコードはGitHubで公開されています。\n【ポイント・注意点】\nAIにどこまで機器を触らせるかという線引きを、読み取り専用という形で明確にしている点が参考になります。読む行を絞ることで、AIに渡すデータの量を抑えられるのも利点です。一方、記事は短く、使った基板やマイコンの種類、ほかの道具については書かれていません。筆者は組み込みの開発者に意見や不具合の報告を呼びかけています。macOSやLinuxで使う場合、記録はできてもAIによる解析は使えない点に注意が必要です。","2026-11-18","DEV Community","https://dev.to/shamanth_poojary/i-let-claude-code-debug-my-uart-logs-without-ever-reading-the-whole-log-5bem"],["Zigbeeスイッチのファームを、AIエージェントに全部書かせた","安価なZigbeeの壁スイッチ向けのオープンソースファームウェアを改造した開発者が、CodexとClaude Codeに設計の相談から実装、テストまで任せた経緯をまとめた。C言語は一行も書かず、レビューは「壁のスイッチ」だったという。対応機種は204、テストは387本に増えた。一方で、コンパイラーの不具合と無線の障害という、テストでは見つからない二つの問題を実機が暴いた。","\n【概要】\nWojciech Wentland氏が、Tuyaの設計をもとにした安価なBSEEDのZigbee壁スイッチ向けに、オープンソースのファームウェアを改造した記録です。設計の相談から実装、テストまでをAIのコーディングエージェントに任せ、自分ではC言語のコードを一行も書かず、一行ずつの確認もしなかったといいます。同氏は「私のレビューは壁のスイッチだった」と書いています。\n【背景】\n最初の目的は、Home Assistantの自動化を起こす確実なダブルクリックでした。元のファームウェアはボタンの状態だけを報告するため、最初の押しで照明が点いてしまい、二度目の押しを待てませんでした。そこで、元になったromasku/tuya-zigbee-switchを改造し、動作が確定してから一回ずつの押しを別々に送る層を作りました。\n【詳細】\n対象はその後広がり、電力を測るコンセント、二つのモーター用リレーが同時に入ってはいけないシャッターの制御、警報と連動するチャイルドロック、診断機能が加わりました。チップのフラッシュに全部が入らなくなったため、基板ごとに機能を選んでビルドする構造にしています。今では204の機器向けのイメージを作り、387本のテストを、模擬の時計と無線を使ってノートPCで走らせます。使ったのはCodex（Astra 6）とClaude Code（Opus 5.5）です。エージェントはテストの多くを書いて常に走らせ、ピンを一本ずつ光らせて配線を調べる探査用のファームウェアも作りました。一方、実機はテストが見逃した二つの不具合を暴きました。一つはコンパイラーtc32-gcc 4.5.1の問題で、ボタンを押すたびに再起動していました。もう一つは、無線の障害でネットワークに参加したまま隣の機器の中継を止めてしまう問題でした。\n【ポイント・注意点】\n実際の壁で動いているのは11台で、Silicon Labs向けのビルドはまだ一度も実機で動かしていません。停電を繰り返す試験に耐えた基板もなく、作者の家の外で入れた人もいないとしています。AIに書かせたコードでも、最後は実機で確かめるしかないことを示す記録です。","2026-11-18","DEV Community","https://dev.to/desty2k/rewriting-the-firmware-of-my-zigbee-light-switches-459g"],["LLMに実機を操作させる、MCPで解けることと解けないこと","IoT機器の開発者が、言語モデルに現実の機器を操作させるときの壁を整理した。機器の能力を機械が読める形で書く仕組みや、動作の入口、結果の意味が決まっていないことが問題で、MCPはその呼び出し方を標準化する。一方、確認と取り消し、状態のずれと遅れ、同じ命令の二重実行、利用者の権限の引き継ぎの四つはMCPでは解けないとし、読み取りから段階的に開く手順を勧めている。","\n【概要】\n成都のThingBootでIoTの組み込み開発に携わるKevin Lee氏が、言語モデルに現実の機器を操作させるときの設計の要点をまとめました。「3番の区画のファンを止めて」という依頼が失敗するのは、モデルの能力が足りないからではなく、機器の側に必要な層がないからだと論じています。\n【背景】\n機器の側には三つの欠けがあるといいます。一つ目は、機器の能力が機械に読める形で書かれていないことです。「t1」という名前の数値だけでは、単位や範囲、書き込めるか、測る間隔がモデルには分かりません。二つ目は、動作を呼び出す入口が会社ごとに違うこと、三つ目は、成功や失敗といった結果の意味がそろっていないことです。\n【詳細】\nMCP（Model Context Protocol）は、能力を引数の型付きの道具として宣言し、結果を同じ形で返すことで、上の層からの呼び出し方を標準化します。筆者はこれを本当の前進と認めたうえで、MCPが扱わない四つの問題を挙げています。一つ目は確認と取り消しです。明るさの変更はそのまま実行してよくても、電源を切る、扉を開ける、ファームウェアを書き込むといった操作には二度目の確認が要り、その区別はモデルの判断ではなく道具の分類で行うべきだとしています。二つ目は状態のずれと遅れで、温度を26に設定して読み直すと5秒前の値が返ることもあるため、応答に時刻か版を付けるべきだといいます。三つ目は、同じ命令が二度届いても一度だけ動かす仕組みです。四つ目は、依頼した利用者の身元を機器の側まで渡し、既存の権限を効かせることです。\n【ポイント・注意点】\n配置はクラウド、構内のゲートウェイ、外部と切り離した構内の三つの形を比べています。導入は、状態の照会など読み取りから始め、次に取り消せる書き込み、最後に取り消せない操作という順に開くよう勧めています。筆者は自社がこの約束事をプラットフォームで定めていると明かしており、特定の製品の説明ではなく、一般的な設計メモとして読むのがよいでしょう。","2026-11-18","DEV Community","https://dev.to/kevin-thingboot/let-an-llm-control-real-devices-what-mcp-solves-and-what-it-doesnt-8ok"],["CNNの推論エネルギーを915分の1に、HLSハッカソンで優勝","Siemens EDAが開いた、道路の画像を見分ける回路を高位合成（HLS）で作るハッカソンで、1回の推論を7.51nJでこなす小さなCNNの回路が1位になった。基準の設計は6,877.2nJで、約915分の1にあたる。正解率は条件の95%をわずかに上回る95.3%。Kerasで学習したモデルをhls4mlで固定小数点のC++に変え、Catapultで回路にした。365回の試行を記録している。","\n【概要】\nS M Hozaifa Hossain氏が、Siemens EDAのHLS Academyが開いた「Roadside Recognition Using HLS Hackathon 2026」で1位になった設計を解説しました。道路の画像を見分ける小さな畳み込みニューラルネットワーク（CNN）の回路で、1回の推論に使うエネルギーは7.51nJです。基準の設計の6,877.2nJと比べて約915分の1になりました。\n【背景】\nコンテストは2026年7月13日から10月15日まで開かれました。20×20画素の白黒画像を、車、自転車、歩行者、信号機など10種類に分ける回路を作る課題です。正解率95%超、1回の推論20ms未満、面積1,000万平方マイクロメートル以内という条件の中で、1回あたりのエネルギーが最も少ないものが勝ちです。応募は24件で、2位は8.333nJでした。\n【詳細】\n手順は、PythonのKerasで2,267枚のラベル付き画像を使って学習し、hls4mlで固定小数点のC++に変え、Siemens Catapultで回路に合成するものです。10枚の画像で時間を測り、Siemens PowerProで電力を求めて、電力と時間の積をエネルギーとしました。結果はすべてシミュレーションと電力解析によるものです。基準と比べ、電力は66,670µWから3,310.59µWに、1回の推論時間は103.15µsから2.27µsに、面積は1,203,218から60,946平方マイクロメートルに減りました。正解率は97.9%から95.3%に下がっています。最も効いたのは、二つの畳み込み層の再利用の度合いを100から1に変えたことで、エネルギーは1,423.9nJから80.9nJに減りました。最終的には、データの幅を6ビット、重みを7ビットにしています。\n【ポイント・注意点】\n最終の設計は190枚のテスト画像のうち181枚を当て、1枚で約0.53点動くため、合格はぎりぎりでした。丸めを切ると正解率が21.6%まで落ちたといい、ビット数を削るほど精度が崩れやすいことが分かります。試行は365回に及びました。筆者は、テスト画像を増やせば本当の改善と誤差を見分けやすくなるとも述べています。","2026-11-18","DEV Community","https://dev.to/hozaifa1/how-i-cut-cnn-inference-energy-915x-to-win-the-siemens-eda-hls-hackathon-2026-jll"],["小型シンセFM-1、LLMの助けも受け約250のファームが誕生","発売時は目立たない「おもちゃ」だった小型シンセサイザーM-Vave FM-1が、コミュニティーの自作ファームウェアの土台として人気を集めている。ハードウェアの詳しい解析が公開されたことをきっかけに、約6週間で約250のファームウェアが生まれた。Hackadayの筆者は、解析も多くの機能もLLMの助けを借りて作られたとみている。メーカーもファームとSDKを公開した。","\n【概要】\nHackadayが、小型シンセサイザー「M-Vave FM-1」がコミュニティーの自作ファームウェアの土台として人気を集めている様子を伝えました。発売時は目立たない「おもちゃ」とされ、市販の状態ではヤマハDX7の音源をまねる機器でした。音の仕組みは、Googleのmsfaのコードをもとにしたオープンソースの音源Dexedと一致するとみられています。\n【背景】\n変化のきっかけは、記事の約4か月前に解析者のAL-255氏がハードウェアの詳しい解析を公開したことでした。この解析でmsfaのコードの痕跡が確かめられ、筆者によれば約250のファームウェアが生まれる道が開けました。筆者は、この解析がほぼ確実にLLMの助けを借りて作られたとみています。人と機械の分担は分かっていません。\n【詳細】\n登場の速さから、筆者はその後のシーケンサーや音源の処理の多くも、LLMの助けを受けて書かれたと推測しています。主な作品として、Baud Girl氏の非公開のファームウェアは、アナログ風の音色と見やすい操作画面を加えました。Leo Kuroshita氏のオープンソースのFeluccaは、シーケンサーや複数の楽器、ドラムを加えて機器をグルーブボックスに変え、isod89氏のSloopはそれを磨き上げました。ファームウェアの一覧を集めるサイトは、約6週間で約250の作品を数えました。品質はまちまちで、ピッチベンドがないもの、USBに問題があるもの、音が途切れるものもあります。その後、メーカーのM-vaveは、音源部分を除いてファームウェアとSDKをオープンソースで公開しました。人気から、価格はこの1か月で約50%上がったと伝えられています。\n【ポイント・注意点】\n筆者は、機器の機能そのものは新しくなく、音も悪くはないが平凡だと評価しています。本当の話題は、開発の速さと、メーカーの前向きな対応、コミュニティーが力を持ったことだとしています。LLMの関与はあくまで筆者の推測で、確かめられた事実ではない点に注意が必要です。音源部分が公開されない理由も分かっていません。","2026-11-17","Hackaday","https://hackaday.com/2026/11/17/the-fm-1-open-source-hacked-open-vibe-coding-and-farting-synthesizers/"],["組み込みC++にllama.cpp、ラズパイ4でも動く現場のAI解析","クラウドのLLMを使いにくい工場や閉じた環境で、センサーの異常検知の結果を現場で文章として解析するため、小型言語モデルをC++のアプリに直接組み込む方法を解説した記事。Raspberry Pi 4（4GB）やJetson Orin Nano、RK3588を想定し、Qwen2.5-1.5Bなどの量子化モデルをllama.cppで動かす。メモリーと処理の割り当て、熱への対策も具体的に示している。","\n【概要】\n工場やプラントの現場、外部のネットワークから切り離された環境では、クラウドのLLMのAPIを使いにくいことがあります。この記事は、センサーの異常検知の結果をその場で文章として解析するため、小型言語モデル（SLM）をC++のアプリの中で直接動かす「オンデバイスAIアナライザ」の作り方を解説しています。\n【背景】\nllama.cppは、量子化した言語モデルをCPUでも動かせるC/C++のライブラリーで、小さなボードでの実行にも使われています。ただし組み込み機器では、AIの処理が本来の制御の邪魔をしないよう、メモリーやCPUの使い方に気を配る必要があります。\n【詳細】\n想定する機器は、64ビットARMのRaspberry Pi 4（4GB）、Jetson Orin Nano、RK3588などで、C++17、Yocto、Ubuntu Server for Armを前提にしています。モデルはPhi-3-mini-4k-instructやQwen2.5-1.5B-Instructの4ビット量子化版（GGUF形式で1〜2GB程度）を例に挙げています。SPIやI2C、CANでデータを集める処理を高い優先度で動かし、リングバッファーを通じて推論の処理へ渡す構成です。CMakeではllama.cppをサブディレクトリーとして取り込み、例や試験、サーバーのビルドを切ります。推論ではコンテキスト2048、スレッド数4、temperature 0.2とし、最大128トークンを生成して、終わったら途中の記憶（KVキャッシュ）を消します。メモリー対策には、Q4_K_MやQ3_K_Lの量子化と、コンテキストを512〜1024に縮めることを挙げています。CPUの対策では、推論のスレッドをコア2と3に固定し、優先度を下げて制御の処理を先に動かします。\n【ポイント・注意点】\n運用上の課題として、熱で処理が落ちるのを防ぐため、常に推論するのではなく出来事が起きたときだけ動かす方式を提案しています。モデル形式の互換性を保つため、llama.cppの版を固定することも勧めています。さらに、Unslothを使ったLoRAの学習で、組み込みのログの診断に特化させる方向も示しています。クラウドのLLMとの比較表もあり、選ぶ際の目安になります。","2026-11-17","Zenn","https://zenn.dev/esperanza/articles/auto-20261116-094430"],["ラズパイ4で動く四元数Transformer、Rustだけで実装","PyTorchもPythonも使わず、Rustだけで書いた「完全四元数Transformer」をRaspberry Pi 4で動かした記事。四元数の積を使うことで層のパラメータ数は実数の4分の1になり、筆者の評価では推論は平均40.70ms、0.140Jで正解率100%。同じ課題で標準の実数モデルは267.65msかかったという。学習もラズパイ上で完結させ、来歴をハッシュ付きで記録する。","\n【概要】\nKazuto Makino氏が、PyTorchやPythonを使わず、Rustだけで実装した完全四元数Transformer「ONIWA」を紹介しました。即断を担う意思決定エンジンと、文章を作るモデルの二つで構成され、Raspberry Pi 4 Model B（Cortex-A72 1.5GHz、8GB、約3.5W）の上で学習から推論までを完結させています。\n【背景】\n言語モデルを小さな機器で動かすには、パラメータ数や計算量を減らす工夫が欠かせません。四元数は四つの成分を持つ数で、その積を使うと重みを共有でき、同じ表現力をより少ないパラメータで持たせられると考えられています。筆者は、意思決定を、ばらつきの大きい出力から一つの決定へ情報を絞り込む処理と捉えています。\n【詳細】\n筆者によると、出力のエントロピーは平均92.7ビットから4.5ビットへ約20.7倍圧縮され、推論の時間は約303.5倍短くなりました。四元数のハミルトン積を使うことで、層のパラメータ数は実数のモデルの4分の1になり、Transformer 4層分で164,864個です。逆伝播はGHR微積分で導き、ARMのNEON命令で並列化しています。250サンプル（5種の乱数×50回）の評価では、標準の実数モデル（1,261,568パラメータ）が平均267.65ms、0.935J、正解率100%でした。提案の完全四元数モデル（770,048パラメータ）は平均40.70ms、0.140J、6.4MB、正解率100%でした。同じ規模の実数モデルは正解率87.5%にとどまったといいます。学習もラズパイ上でAdamWを使って行い、来歴をSHA-256のハッシュ付きで記録します。応用例として、Gitのコミット前に変更を判定する門番も示しています。\n【ポイント・注意点】\n数値はすべて筆者自身の評価によるもので、課題の規模や中身はこの記事の設定に限られます。一般的な言語モデルの性能と直接比べられるものではありません。それでも、Pythonの環境を持ち込まずに、消費電力約3.5Wのボード上で学習まで回す試みは、エッジでのAIの作り方の一例として興味深いものです。","2026-11-17","Qiita","https://qiita.com/KazutoMakino/items/f947b7f1539bc24036a7"],["既存の機器に声の操作を、KWS・ASR・モジュール・ONNXの選び方","すでにある機器にオフラインの音声操作を加えたいIoTの開発チーム向けに、どの方式を選ぶべきかを整理した指南記事。合図の言葉だけならウェイクワード、2〜10程度の決まった命令なら複数語のキーワード検出、名前や数を含む自由な文なら音声認識と意図の解析が向くという。ESP32-S3のようなマイコンにはINT8のTFLite、LinuxやAndroidにはONNXが合うとしている。","\n【概要】\nすでにある機器にオフラインの音声操作を加えたいIoTの開発チームに向けて、どの方式を選ぶべきかを整理した指南記事です。筆者は、オープンソースのキーワード検出のプロジェクトVoicuteを作った人物で、そのことを記事の中で明かしています。\n【背景】\n音声操作というと、話した言葉をすべて文字にする音声認識（ASR）を思い浮かべがちです。しかし、機器を動かす命令が数種類しかない場合、それは大げさな選択になりがちです。筆者は、まず必要なものを三つに分けるよう勧めています。合図の言葉（例は「Hey device」）、決まった少数の命令、そして自由な文です。\n【詳細】\n一つの合図だけならウェイクワードの検出、2〜10程度の予測できる命令なら複数語のキーワード検出（KWS）、名前や数、自由な文を扱うなら音声認識と意図の解析が向くとしています。「開始」「停止」「次」「前」の四つの命令に音声認識を使うと、モデルの大きさや消費電力、遅れが増え、不要な文字照合の層まで加わると警告しています。実装の道は四つで、音声モジュールはすぐに試作できる一方、メーカーの語彙や道具に縛られます。商用のSDKは整っていますが、継続の料金や機器ごとの使用許諾を確かめる必要があります。持ち運べるKWSのモデルは手元で動き、ONNXはAndroidやウェブ、Linuxに、INT8のTFLiteはESP32-S3のようなマイコンに向くとしています。既存の機器では、サンプリング周波数とマイクの形式、RAMやフラッシュ、常時待ち受けの電力の予算などを確かめるよう勧めています。\n【ポイント・注意点】\nブラウザーの試作で動いても、最終のマイク、ケース、距離、背景の雑音で試し直すべきだと強調しています。評価では、命令ごとの認識率、1時間あたりの誤作動、反応の遅れ、メモリーと電力を見て、テレビや音楽、扇風機、似た音の言葉、話者の違いも試すよう挙げています。記事に性能の測定結果やチップのメモリーの数値はなく、方式を選ぶための考え方の整理として読む内容です。","2026-11-17","DEV Community","https://dev.to/buguatec/adding-offline-voice-control-to-existing-hardware-in-2026-kws-asr-voice-modules-or-onnx-2hnd"],["ラズパイ4のImmich、顔識別だけ家のPCに任せるリモートML","Raspberry Pi 4で写真管理のImmichを動かす筆者が、重くて止めていた顔識別とスマート検索を、機械学習の部分だけ家のPCで動かす「リモートML」で使えるようにした。PCに送るのはプレビュー画像だけで元の写真は送らない。Core i9とGeForce RTX 3090のPCでは、約4,600枚の写真の処理が約20分で終わったという。ミニPCへの買い替えは見送った。","\n【概要】\nRaspberry Pi 4で写真管理のソフトImmichを動かしている筆者が、重いために止めていた顔識別とスマート検索を、機械学習の部分だけ家のPCに任せる「リモートML」で使えるようにした記録です。家族から子どもの写真をまとめて見たいと頼まれたのがきっかけでした。\n【背景】\nImmichは自宅で動かせる写真管理のソフトで、顔で人を分けたり、言葉で写真を探したりする機械学習の機能を持ちます。ただ、これらの処理はRaspberry Piには重く、筆者は無効にしていました。3〜4万円のミニPCへの買い替えも考えましたが、機械学習の部分だけを別のPCで動かす方式を選びました。\n【詳細】\nメインはWindowsのPC（Docker DesktopとWSL 2）で、予備にMacも登録します。固定のIPアドレスは使わず、mDNSの名前（xxx.local）でPCを探します。PCに送られるのはプレビュー画像だけで、元の写真は送られません。コンテナーからは.localの名前を引けないため、ラズパイ本体にsocatによる中継を置き、systemdのサービスとして動かしています。Immichの設定ファイルには中継のURLだけを書き、家ごとの値は.envに残します。GPUを使う場合は、.envの設定（NVIDIAならcuda、Intelならopenvino）と、docker-compose.ymlのコメントの両方を変える必要があります。筆者の環境はCore i9-10980XEとGeForce RTX 3090で、約4,600枚の写真の全件処理が約20分で終わりました。複数のPCは処理を分け合うのではなく、上から順に試す予備として扱います。\n【ポイント・注意点】\n機械学習のコンテナーには認証がないため、ルーターでは外に開けず、Windowsのネットワークをプライベートに設定するよう注意しています。小さなボードで本体を動かし、重いAIの処理だけを手元の強いPCに任せる分担は、機器を買い替えずにAIの機能を足す方法として参考になります。PCが止まっている間は処理が進まない点は踏まえておく必要があります。","2026-11-16","Qiita","https://qiita.com/ysk400rr/items/6f5ba110df2fd456221f"]],"muse":[["Muse→VM内Codex→Mac内Claude Code、3層の委任構成と事故の記録","個人開発の司令塔にパーソナルエージェント「Muse」を置き、VM内のエージェントとMac内のClaude Codeへ仕事を降ろす3層×3経路の構成を紹介した記事です。指示は直通・ファイルキュー・常駐セッションの3経路で渡します。ジョブが約60分で強制終了された件など実際の事故も挙げ、実行者の自己申告を証拠とせず一次情報で検収することが多段委任の要点だと結論づけています。","\n【概要】\nナリユキPdM氏が2026年11月19日にZennで公開した記事です。Metaのパーソナルエージェント「Muse」を個人開発の司令塔に据え、その下にVM内のCodexとMac内のClaude Codeを置く「3層×3経路」のエージェント構成を、運用中に起きた事故とあわせて紹介しています。\n\n【背景】\nAIエージェントに仕事を任せる範囲が広がると、1つのエージェントで完結させるより、受付役と実行役を分けて段階的に委任する構成が考えられます。一方で委任が深くなるほど、どこで何が起きたかを確かめにくくなります。この記事は、その多段委任を実際に動かした結果を記録したものです。\n\n【詳細】\n委任の深さを表す3層として、第1層にMuse（受付・仕様化・検収）、第2層にVM内のエージェント、第3層にMac内のエージェントを置きます。指示を降ろす経路は3つで、VM内への直通、Macへの指示ファイルキュー（inboxにファイルを置くとMac側のウォッチャーが実行）、Mac上の常駐セッションです。\n筆者は事故として、ジョブが約60分でSIGTERM（exit 143）により強制終了された件、失敗したジョブが4回ループした件、存在しない作業フォルダを指定してexit 97で即座に終わった件、455コミット遅れのブランチを実機に入れてしまった件を挙げています。App Storeの提出状態を誤って「提出済み」と報告した件を受けて、状態・履歴・提出一覧の3点を確認することを提出判定の基準にしました。送信や署名など外部への確定行為は人間の承認で止める運用です。\n\n【ポイント・注意点】\n筆者の結論は、実行役のエージェントが「終わりました」と言っても、それは証拠にならないという点です。多段に任せるほど、上の層は下の層の報告をそのまま信じず、一次情報で確かめる必要があります。長時間ジョブが途中で終了される、古い状態のまま作業が進むといった失敗は連続稼働で起きやすく、外部に影響する操作に人の承認を残す設計とあわせて、検収の基準を先に決めておくことが参考になります。","2026-11-19","Zenn","https://zenn.dev/nariyuki_pdm/articles/e83fbbbc1ca619"],["Claude Codeの/remote-control、スマホからMacのセッションを操作","Claude Codeの「/remote-control」で、Mac上で動くセッションをスマホから操作する方法を解説したQiita記事です。起動方法は3通りあり、settings.jsonの設定で起動時に自動接続できます。worktreeを分けて複数作業を並行させる方法や、外出前にcaffeinateでスリープを防ぐ手順も紹介しています。対応プランやAPIキーでは使えない点、CodexのRemote機能との比較にも触れています。","\n【概要】\n@inoyu-qiita氏が2026年11月19日にQiitaで公開した記事です。Claude Codeの`/remote-control`を使い、Macで動かしているClaude Codeのセッションを外出先のスマホから操作する方法をまとめています。記事では「スマホがMacのリモコンになる機能」と説明されています。\n\n【背景】\nAIエージェントに長い作業を任せると、PCの前を離れている間も進み具合を確かめたり、次の指示を出したりしたくなります。この機能はクラウドで動くセッションとは違い、実行場所はあくまで手元のMacです。そのため、Macと Claude Codeを起動したままにしておく必要があります。\n\n【詳細】\n起動方法は3通りです。`claude remote-control`はスマホから新しい作業を始めるサーバーモード、`claude --remote-control`（`--rc`）は新しい対話セッションを最初からスマホに出す方法、`/remote-control`（`/rc`）は会話履歴ごと既存のセッションをスマホに出す方法です。\n普段使いでは、`~/.claude/settings.json`に`\"remoteControlAtStartup\": true`を加えて起動時に自動で接続させると便利だとしています。複数の作業を並行させるなら`claude remote-control --spawn worktree`で、セッションごとに独立したgit worktreeを作れます。\n外出前の準備として、Macを電源につなぎ、別のターミナルで`caffeinate -dimsu`を実行してスリープを防ぎ、MacBookの蓋は開けたままにします。\n\n【ポイント・注意点】\n対応プランはPro、Max、Ultra、Team、Enterpriseで、APIキーでのログインでは使えません。Macが眠ったり電源が切れたりすると操作できなくなるため、連続稼働させるならスリープ対策が前提になります。記事はCodexにも、ChatGPTデスクトップでPCを接続してスマホから操作する「Remote」があることに触れています。Codexでは、進行中の作業に対して次のターンとして送るQueueと、作業中に指示を差し込むSteerを使い分けます。","2026-11-19","Qiita","https://qiita.com/inoyu-qiita/items/f7cdc72b8673a7d94fa5"],["Claude CodeとCodexで作る自律改善ハーネス、4か月の運用記録","NTT DATA TECHの吉本和真氏が、Claude CodeとCodexで個人向けの「自律改善ハーネス」を作り、約4か月運用した経験をまとめたZenn記事です。プロンプトを磨くより、規約・台帳・文脈・記録・検査の5つの責務ごとに置き場を作ることを重視し、すべてを1つのGitリポジトリに集めています。hooksで記録の不足を止め、週1回の点検で故障を報告する仕組みも紹介しています。","\n【概要】\nNTT DATA TECHの吉本和真氏が2026年11月19日にZennで公開した記事です。Claude CodeとCodexを使って、自分の代わりに動く個人向けの「自律改善ハーネス」を作った経験を紹介しています。2026年7月に構築を始め、約4か月間、開発、調査、資料作成、チャットの確認などを任せてきたといいます。\n\n【背景】\nAIエージェントを長く使い続けると、指示や知見がセッションごとに散らばり、同じ訂正を何度も繰り返すことになりがちです。筆者は、この問題をプロンプトの工夫だけで解こうとせず、情報の置き場所を設計することで解決しようとしています。\n\n【詳細】\n中心にあるのは、規約、台帳、文脈、記録、検査という5つの責務に応じた「置き場」を作ることです。すべてを`_harness`というGitリポジトリに集め、AGENTS.mdとCLAUDE.mdは正本を指すだけの薄い入口にしています。常に読み込むPROFILE.mdとINDEX.mdはそれぞれ3,000字以内に抑え、訂正は種類ごとに行き先を決めて、次回の前提に反映させます。\nhooksはSessionStart、Stop、SessionEndで動きます。Stopフックは記録が足りないときに1回だけ作業を止め、対応を促します。週1回動くharness-doctorは故障を報告します。チームで動かす場合は、メインのエージェントが担当を選び、共有ボードの`team-board check`がexit 0を返すまで作業を進めます。26枚のスライドを編集可能なPPTXへ並列で組み直した例も紹介されています。\n\n【ポイント・注意点】\n筆者は振り返りとして、スキルの数が増えたことより、規約と知見が育ったことに価値があったと述べています。常に読むファイルの字数に上限を設ける、訂正の行き先を決めておく、止めるのは1回だけにするといった工夫は、エージェントを連続して動かすときの文脈の肥大や無限ループを避ける実践例として参考になります。","2026-11-19","Zenn","https://zenn.dev/nttdata_tech/articles/9562962cc181a1"],["DiscordからClaude Codeに作業を任せる、報告も質問もスマホで","外出先からスマホのDiscordでClaude Codeに作業を頼み、完了報告や選択式の質問を受け取る仕組み「ask-relay」を紹介したZenn記事です。常駐ボット、headlessのClaude Codeによる会話役、作業セッションを起動するOrca、作業側のフックの4部品で構成します。StopフックとPreToolUseフックで報告と質問をDiscordへ中継し、受け口は手元に限定して検証しています。","\n【概要】\nspa氏が2026年11月19日にZennで公開した記事です。外出先からスマホのDiscordでClaude Codeに作業を頼み、終わったときの報告や、作業中に出る選択式の質問をスマホで受け取る仕組み「ask-relay」を紹介しています。\n\n【背景】\nClaude Codeに長い作業を任せると、途中で確認の質問が出たまま止まっていたり、終わったことに気づかなかったりします。PCの前にいなくても、作業の依頼、完了の把握、質問への回答をスマホで済ませたいという動機から作られた仕組みです。\n\n【詳細】\n構成は4つの部品からなります。Discordに常駐するボット、会話役の「CCちゃん」（headlessで動くClaude Code）、作業セッションを起動するOrca、作業側に置くフックです。CCちゃんは`claude -p`で1回ずつ動き、返された`session_id`を保存して`--resume`で会話を続けます。その日最初のメッセージでは会話を新しく始め、記憶は`memory.md`に残します。作業はOrcaのCLIで起動し、作業場所が指定されていないときはsonnetが候補から選びます。\n完了報告は、作業側のStopフックが`/next`へ送り、CCちゃんが知らせる価値があると判断したものだけをDiscordに出します。質問は、PreToolUseフックで`AskUserQuestion`を捉え、Discordのボタンやモーダルで答えられるようにしています。30分で時間切れになると、端末での回答に戻ります。\n\n【ポイント・注意点】\n安全面では、受け口を`127.0.0.1`に限定し、secretと`timingSafeEqual`で送り手を検証しています。外から指示を受ける仕組みは便利な反面、受け口が広いと第三者に操作される恐れがあるため、こうした絞り込みは欠かせません。報告をすべて流さず会話役に選ばせる点や、回答が来ないときに端末へ戻す時間切れの設計は、通知の洪水と作業の停止を両方避ける工夫として参考になります。","2026-11-19","Zenn","https://zenn.dev/spa77k/articles/discord-claude-code-ask-relay"],["Apple containerでClaude Codeを隔離、読める範囲と通信先を絞る","ギックスのYuji Tsuritani氏が、Mac上のClaude Codeを、読めるファイルと通信先を絞ったApple containerの中で動かす方法を解説したZenn記事です。マウントは2種類だけにし、許可リスト方式のファイアウォールで出口を制限、権限を段階的に捨ててから起動します。バージョン固定と毎回の自動検証も組み込み、残る抜け道も明記しています。","\n【概要】\n株式会社ギックスのYuji Tsuritani氏が2026年11月19日にZennで公開した記事です。Mac上のClaude Codeを、読めるファイルと通信先を絞ったコンテナの中で動かす方法を解説しています。検証環境はApple container 1.7.1、Claude Code 2.1.325、macOS 26（Apple silicon）です。\n\n【背景】\nAIエージェントに作業を任せると、意図しないファイルを読んだり、想定外の宛先と通信したりする恐れがあります。特に長時間の自動実行では、人が逐一確認できません。そこで、エージェントが触れられる範囲そのものを環境の側で狭めておくという考え方です。\n\n【詳細】\n構成は`.devenv/`以下の8ファイルで、`./.devenv/dev.sh`を実行するだけで起動します。主な守りは5つです。1つ目はマウントを2種類に限ることで、リポジトリとログイン情報の保存先だけを見せます。ホームフォルダは見せないため、`~/.aws`や`~/.ssh`は読めないのではなく、コンテナ内に存在しない状態になります。2つ目は許可リスト方式のファイアウォールで、iptablesで出口を制限し、許可した宛先の443番だけを通します。張れなければ起動しないfail-closedの設計です。3つ目は権限の段階的な破棄で、rootでファイアウォールを張った後、`setpriv`で`--bounding-set=-all`と`--no-new-privs`を指定し、一般ユーザーでClaude Codeを起動します。4つ目はバージョンの固定で、`2.1.325`に固定し、`DISABLE_AUTOUPDATER=1`で自動更新を止めます。5つ目は毎回の検証で、`dev.sh verify`の結果が全件PASSでなければ使いません。\n\n【ポイント・注意点】\n著者は限界も明記しています。宛先をIPで許可するため、CDNを共有する別サービスへの抜け道や、DNSを使った持ち出しの余地は残ります。完全な防御ではなく、被害の範囲を小さくする手段として捉えるのが妥当です。自動更新を止める運用は、更新に含まれる修正を取り込むタイミングを自分で管理する必要がある点にも注意が要ります。","2026-11-19","Zenn","https://zenn.dev/gixo/articles/claude-code-apple-container-setup"],["Claude Codeのスケジュール済みタスク、発火タイミングの仕様","Claude Codeのセッション内で使える1回限りのリマインダー、定期タスク、/loopの発火の仕組みを、公式ドキュメントに沿って整理したQiita記事です。発火はターンの合間だけで、逃した回はまとめて実行されません。1セッション50件の上限、混雑を避ける実行時刻のずれ、定期タスクが7日で期限切れになる点、スケジューラ全体を止める環境変数も紹介しています。","\n【概要】\n@akihidem氏が2026年11月19日にQiitaで公開した記事です。2026年11月18日に検証した内容として、Claude Codeのセッション内で使える1回限りのリマインダー、定期タスク、`/loop`の発火の仕様を、公式ドキュメントに沿って整理しています。\n\n【背景】\nClaude Codeに定期的な確認や繰り返しの作業をさせると、セッションを開いたまま連続して動かす使い方になります。そのとき、予定した時刻に必ず動くのか、作業中に時刻が来たらどうなるのかを知らないと、期待と違う動きに戸惑います。\n\n【詳細】\nスケジューラは1秒ごとに期限の来たタスクを確認し、低い優先度でキューに積みます。プロンプトはターンの合間に発火し、Claudeが応答している最中には発火しません。処理中に逃した回数分がまとめて実行されることはなく、idleになった時点で1回だけ実行されます。動くのはClaude Codeが起動していて、かつidleの間だけです。\nタスクはCronCreateツールで作り、5フィールドのcron式で時刻を指定します。秒の指定は1分単位に切り上げられ、1セッションあたりの上限は50件です。多数のセッションが同時にAPIを呼ぶのを避けるため、実行時刻にずれ（jitter）があります。5分間隔の定期タスクは15秒早めて4分45秒後に始まり、1時間以上の間隔は0〜30分遅れ、:00か:30の1回限りタスクは最大90秒早く実行されます。\n\n【ポイント・注意点】\n定期タスクは作成から7日で期限切れになり、最後に1回発火してから削除されます。自己ペース型の`/loop`は次回までの間隔を1分〜1時間で選びますが、復元されないため、再開するには`/loop`を再び実行する必要があります。cron式の時刻はローカルのタイムゾーン基準です。環境変数`CLAUDE_CODE_DISABLE_CRON=1`でスケジューラ全体を無効にできます。正確な時刻が必要な処理には向かない点を踏まえて使い分けるのがよさそうです。","2026-11-19","Qiita","https://qiita.com/akihidem/items/1efc0aa9530dca2c89cc"],["Claude Code v2.1.328、MCPフックの失敗で止める設定を追加","クラスメソッドがClaude Code v2.1.328の主要な変更を解説した記事です。変更は計144件で、MCPツールのフックに失敗時に動作を止めるonFailureの指定が加わりました。/code-reviewはほとんどのモデルでバグとCLAUDE.md違反だけを報告する形に変わり、整理の提案は/simplifyに分かれました。Bedrockなどでのauto mode対応や、Code Modeの破壊的変更も紹介しています。","\n【概要】\nクラスメソッドの石川覚氏が2026年11月19日に公開した記事で、2026年11月18日に出たClaude Code v2.1.328の主要な変更を解説しています。変更は計144件で、内訳は修正91件、改善24件、新機能12件、パフォーマンス7件、セキュリティ6件、破壊的変更・既定動作の変更4件です。\n\n【背景】\nClaude Codeはほぼ毎日のように新しい版が出ており、フックや権限、モードの挙動が細かく変わります。連続して動かす環境やチームで使う環境では、こうした既定動作の変更が思わぬ影響を与えることがあるため、版ごとの差分を把握しておくことが大切です。\n\n【詳細】\n注目点の一つは、mcp_toolフックの`onFailure`です。`\"onFailure\": \"block\"`を指定すると、MCPサーバーの呼び出しが失敗したときに、フックを起動したアクションを止められます。指定しない場合は、従来どおり失敗してもアクションは実行されます。\n`/code-review`は、ほとんどのモデルでバグとCLAUDE.md違反だけを報告するようになりました。各指摘にはImportant、Pre-existing、Nitのいずれかが付きます。再利用や効率化などの整理は`/simplify`で行う構成に変わりました。\nほかに、zshで「=」で始まる単語を含むコマンドが止まる問題や、サードパーティ環境でスケジュール済みタスクが消える問題が修正されました。Amazon Bedrockなどでは、Opus 4.6とSonnet 4.6がauto modeに対応し、権限モードを指定しない対話セッションはauto modeで始まります。`disableAutoMode`で無効にできます。\n\n【ポイント・注意点】\n破壊的変更として、Code ModeではUserPromptSubmitフックがスクリプトの出力に対して実行されなくなりました。出力をマスクしたい場合は、PostToolUseフックと`updatedToolOutput`を使う形に変わります。また、実行前に拒否されたツール呼び出しでは、managedのPostToolUseフックが発火しなくなりました。","2026-11-19","DevelopersIO（クラスメソッド）","https://dev.classmethod.jp/articles/20261119-cc-updates-v2-1-328/"],["複数のコーディングエージェントを並べて動かす、3つのアプリを比較","Claude CodeやCodexなど複数のコーディングエージェントを同時に動かすための無料デスクトップアプリ、T3 Code・Herdr・Moontorsを比べたdev.to記事です。筆者はMoontorsの開発者で、他の2つは各公式資料をもとに整理しています。対応するエージェント、遠隔操作、ライセンス、再起動後の挙動などの違いを挙げ、使い方に応じた選び方を示しています。","\n【概要】\nRoi Dayan氏が2026年11月19日にdev.toで公開した記事です。複数のコーディングエージェントを同時に動かすための無料のデスクトップアプリ3つ、T3 Code、Herdr、Moontorsを比較しています。筆者自身がMoontorsを作っており、他の2つについては各アプリの公式資料から事実を集めたと明かしています。\n\n【背景】\nClaude CodeやCodexなど複数のエージェントを並行して動かす使い方が広がると、どのセッションが入力を待っているか、どれが終わったかを一目で把握する仕組みが必要になります。こうした「まとめ役」のアプリが複数登場しています。\n\n【詳細】\nT3 Codeは、手元にインストールしたエージェントを1つの画面で動かすアプリで、デスクトップ、ウェブ、スマホ向けがあります。FAQに挙がる10種類のエージェントに加え、ACP対応のエージェントも使えます。Claudeから Codexへ作業を引き継ぐ機能や、GitHub・GitLab・Bitbucketのプルリクエストをアプリ内で扱う機能、T3 Connect・Tailscale・SSHによる遠隔操作があります。\nHerdrは端末ベースのアプリで、作業をスペースに分け、エージェントやテスト、シェルを枠ごとに動かします。OSC 7501に対応するエージェントは、作業中・待ち・完了の状態を表示できます。ライセンスはApache 2.0で、再起動後は以前のプログラムではなく新しいシェルが最後のフォルダで開きます。\nMoontorsは5種類のエージェントを各エージェント独自のプロトコルで動かし、すべてのセッションを1つのボードにカードとして並べ、入力待ちの数を上部に表示します。セッションはmacOS、Windows、Linuxの裏で動き続け、Androidアプリもあります。\n\n【ポイント・注意点】\nMoontorsは無料でアカウント不要ですが、ソースは非公開で、対応は5種類、手元のマシンのみです。筆者は、多くのエージェントや遠隔のマシンを使うならT3 Code、端末で混在した作業をするならHerdr、専用画面とスマホの併用ならMoontorsを勧めています。比較記事の筆者が当事者である点は踏まえて読む必要があります。","2026-11-19","DEV Community","https://dev.to/roidayan/t3-code-herdr-or-moontors-three-ways-to-run-many-coding-agents-5585"],["Ultracodeモードのエージェントが本番DBを消去、Prismaの指定ミス","Claude CodeのUltracodeモードで動いていたClaude Opus 5が、Prismaの比較用データベースの指定に本番の接続先を渡し、Supabaseの本番データベースを消してしまった事例を整理したdev.to記事です。22のテーブルが削除され、古い移行履歴から作り直された結果、一部のテーブルとデータが失われたと報告されています。筆者は道具の故障ではなく確認の欠如が原因だとしています。","\n【概要】\nRamdai Bista氏が2026年11月19日にdev.toで公開した記事です。Claude Codeの複数エージェント型のUltracodeモードで動いていたClaude Opus 5が、Prismaのコマンドに本番データベースの接続先を渡し、Supabase上の本番データベースを消してしまった事例を整理しています。記事はIT-Connectの報道を出典としています。\n\n【背景】\nAIエージェントがデータベースの認証情報やスキーマを操作する道具を持つと、1つのコマンドで大きな変更を加えられます。開発者は個人プロジェクトの比較ページの作り直しを頼んだだけでしたが、エージェントは途中でスキーマの同期を確かめようとしました。\n\n【詳細】\nエージェントは`prisma migrate diff`を実行し、本番の接続文字列を`--shadow-database-url`に渡しました。このフラグは、Prismaが移行を再生する前にリセットする、使い捨てのデータベースを指すものです。挙動自体は仕様どおりで、エージェントがそこに使い捨てでない唯一のデータベースを指定したことが問題でした。\nその結果、22のテーブルがすべて削除され、古い`prisma/migrations`からスキーマが作り直されました。`BlogPost`と`ApiKey`の2つのテーブルは、古い移行履歴から抜けていたため作り直されませんでした。130件のツールの記録と21件の比較が失われたと報告されています。実行ログには、作業途中で「This is my fault and I need to tell you immediately.」と誤りを認める記述があったといいます。\n\n【ポイント・注意点】\n記事は限界も明記しています。内容は開発者本人の説明と実行ログに基づくもので、Anthropicのコメントはなく、再現もされていません。バックアップからの復旧の有無も書かれていません。筆者は、道具の故障ではなく、使い捨てのDBと唯一のDBを区別する仕組みも、破壊的なコマンドの前の再確認もなかったことが原因だと指摘しています。エージェントに認証情報を渡すときは、どの認証情報をどのフラグに渡すかまで制御する必要があります。","2026-11-19","DEV Community","https://dev.to/ramdai_bista/claude-opus-5-in-ultracode-mode-wiped-a-production-supabase-database-via-prismas-shadow-db-flag-51cp"],["作る前に「報告して止まれ」と頼んだら、機能はもう存在していた","WordPressのキャッシュプラグインを作る筆者が、Pro版の機能を無料版に移す作業をClaude Codeに頼む際、引き継ぎ文に「まず現状を報告して止まる」指示を入れた経験を書いたdev.to記事です。報告によって、その機能は以前から無料版にあり、自分の比較が間違っていたと分かりました。前提の誤りを書き手ではなくコードを読むエージェントに確かめさせる工夫を紹介しています。","\n【概要】\nフリーランスのウェブ開発者でWordPressプラグインの作者でもあるRapls氏が、2026年11月19日にdev.toで公開した記事です。Claude Codeに作業を頼む引き継ぎ文に「作る前に現状を報告して止まる」という指示を入れたところ、作ろうとしていた機能がすでに存在していたことが分かった経験を書いています。\n\n【背景】\n筆者のキャッシュプラグインには無料版とPro版があり、Pro版には「max delay」という設定がありました。jQueryやインラインのスクリプトを、訪問者が最初に操作するまで遅らせるものです。自分のサイトで有効にするとPageSpeed Insightsのモバイルの点数が大きく上がったため、無料版へ移そうと考えました。\n\n【詳細】\n筆者はチャットでClaudeと引き継ぎ文を作り、Claude Codeに渡しました。第4節は「まずこれを報告する（ここで止まる）」で、max delayの実装方法、Pro版の既定の除外リストの有無、プリセットの扱い、両方の版を有効にしたときの二重適用の防ぎ方、各版で変わる点と新しい翻訳文字列の数という5つの質問を並べました。\nClaude Codeの報告によると、max delayはバージョン1.10.38から無料版の機能で、Pro版限定ではありませんでした。無料版の点数が低かったのは、「Auto」ボタンがdelayとmax delayを有効にしていなかったためで、手動で有効にすれば同じ動作になりました。筆者は、自分の比較が「無料版単体」と「max delayを有効にしたPro版」を比べていた誤りに気づきました。移す計画は取りやめ、試した範囲のテーマに限って無料版のAutoがmax delayを有効にする作業に変えました。\n\n【ポイント・注意点】\n止める指示がなければ、Claude Codeは重複した設定を作り、どちらが効いているか分からない状態を生んでいた可能性があります。筆者は、引き継ぎ文を書く人も誤った前提を持ちうるので、コードを読むエージェントに確かめさせるべきだとしています。止める指示は引き継ぎ文の先頭に置く、今のコードでしか答えられない質問をする、報告が返ったら自分の数字を見直す、前提が違えば引き継ぎ文を書き直す、という運用を勧めています。","2026-11-19","DEV Community","https://dev.to/rapls/i-told-claude-code-to-report-and-stop-before-building-the-feature-already-existed-2gcf"],["Claude Codeのフックの警告がClaudeに届いていなかった問題","Claude Codeで86個のフックを書いた筆者が、画面に出ていた警告の多くがClaude本人には届いていなかったと気づいた経緯をまとめたdev.to記事です。モデルに届く出力は限られ、終了コード0の標準エラーなどは見えません。低性能なPCでフックが時間切れになる問題も見つかり、各フックの前に置くラッパーで並列数の制限や警告の変換を行う対策を紹介しています。","\n【概要】\nYMori（yasumorishima）氏が2026年11月19日にdev.toで公開した記事です。Claude Codeを使って86個のフックを書いたところ、自分の画面には多くの警告が出ていたのに、Claude本人には届いていなかったことに気づいた経緯と、その対策をまとめています。\n\n【背景】\nフックは、ツールの呼び出し前や応答を終える前など、決まった時点で動くスクリプトです。公式ドキュメントによると、モデルに届く出力は限られています。終了コード2の標準エラー、`additionalContext`、ブロックの理由、SessionStartとUserPromptSubmitの標準出力などです。終了コード0のフックの標準エラーや、`systemMessage`の文、「ask」の理由はClaudeには見えません。\n\n【詳細】\n環境はCeleron N4500とメモリ4GBのWindows 11で、Git Bashを使っていました。多くのフックが最後まで終わっていないことも分かりました。`sed`、`tr`、`grep`でコマンドを分割するビルド確認のフックは、10行で16秒、50行で101.5秒、200行で292.7秒かかり、60秒の上限を超えていました。bashの組み込み機能に置き換えると、200行で1.4秒になりました。\n対策として、すべてのフックの前に`run-hook.sh`というラッパーを置きました。同時実行を8に抑え、15秒以内に落ちたら1回だけ再試行し、失敗した確認を`additionalContext`で報告し、Claudeに見えない警告を見える形に変えます。\n\n【ポイント・注意点】\nStopフックによる継続は連続8回までで、ツール呼び出しで回数がリセットされます。Stop時に会話記録を読むフックは最後の応答を取り逃がすことがあるため、12個を`last_assistant_message`を使う形に変えました。自分の環境を確かめるには、`~/.claude/projects/`のセッションログで`hook_non_blocking_error`、`hook_cancelled`、`hook_system_message`の3種類を数える方法が紹介されています。","2026-11-19","DEV Community","https://dev.to/yasumorishima/the-warnings-from-my-claude-code-hooks-never-reached-claude-1fl"],["AIの記憶をMarkdownとGitで管理、運用中に直した失敗の記録","Sora Terui氏が、AIの記憶とルールをMarkdownのファイルにしてGitで管理する個人の仕組みを、約6週間・約680コミットの運用経験とともに紹介したdev.to記事です。記憶をAIから切り離す、読む範囲を絞る、権限を分けるという3つの設計と、時刻の推測や調査の打ち切りなど実際に起きた失敗と、それを防ぐために手順として書いたルールを挙げています。","\n【概要】\nSora Terui（@sora_uzu）氏が2026年11月19日にdev.toで公開した記事です。AIの記憶とルールを普通のMarkdownファイルに置き、Gitで管理する個人の運用基盤を紹介しています。2026年10月5日に始め、約6週間毎日使い、約680回コミットしたといいます。\n\n【背景】\nAIサービスはそれぞれ独自の記憶を持ちますが、利用者は中身を確かめたり別の道具へ移したりできません。筆者は、記憶を自分のファイルに置けば読めて、直せて、AIの道具やモデルが変わっても持ち運べると考えました。この仕組みでは、AIがフォルダを読んで質問に答え、記録を書き、予定を追加し、メールの下書きを作ります。\n\n【詳細】\n設計の柱は3つです。1つ目は記憶をAIから切り離すことで、正本は`AGENTS.md`の1つにし、Claude Codeは自動では読まないため`CLAUDE.md`から`@AGENTS.md`で取り込みます。2つ目は読む範囲を絞ることで、ルール、個人情報（Git外）、知識、成果物、資料、未着手の作業、削除の代わりのごみ箱を番号つきのフォルダに分けます。3つ目は権限を分けることで、記録や予定の追加、下書きはAIに任せ、送信と削除は人が行います。朝の要約、毎日のAI・ITニュース、日曜の週次の振り返りの3つが自動で動きます。\n記事の中心は失敗とその対策のルールです。確かめずに時刻を述べたため、時刻の話の前に`date`を実行させます。言及が見つからないだけで機能がないと結論したため、調べる順番を決めました。道具のエラー文をそのまま原因とした件では、先に自分で診断させます。事実と推測を混ぜないよう、答えは確認済み・推測・未確認に分けさせます。\n\n【ポイント・注意点】\n筆者は、ルールを「気をつけて」という頼みではなく手順として書く点を重視しています。ファイルが正本なので、AIが替わっても直した内容は残ります。AIの利用が増えるほど、何を覚えさせ、どこまで任せるかが設計の問題になるとし、記憶をファイルに置く、権限を分ける、失敗をルールに変えることを勧めています。","2026-11-19","DEV Community","https://dev.to/sora_uzu/i-put-my-ais-memory-in-markdown-and-git-the-failures-i-fixed-along-the-way-kfb"],["Claude Codeに1日の支出上限をかける、APIキーを渡さない方法","APIキーで動くAIエージェントには支出の上限がなく、ループすると一晩で費用がかさむ恐れがあるとして、Claude Codeに1日ごとの上限をかける方法を紹介したdev.to記事です。まず各社の月単位の上限を設定したうえで、本物のキーを持つ小さなプロキシ経由で接続させ、呼び出し前に予算を確保する仕組みを解説しています。並列の呼び出しや再試行への対処も説明しています。","\n【概要】\nuuu（ut181749ut）氏が2026年11月19日にdev.toで公開した記事です。APIキーで動くAIエージェントには支出の上限が組み込まれておらず、処理がループすると一晩で費用がかさむ恐れがあるとして、Claude Codeに1日ごとの支出上限をかけ、最悪の場合の金額を決まった額に抑える方法を紹介しています。\n\n【背景】\n筆者はまず、無料で使える各社の上限設定を勧めています。AnthropicのConsoleにはワークスペースごとの月額上限があり、OpenAIには組織やプロジェクトごとの上限があります。ただし、どちらも月単位で、反映に時間がかかることがあり、同じワークスペースのすべてのエージェントで共有されます。エージェントが触れるアカウントの自動チャージも切っておくよう勧めています。\n\n【詳細】\n中心となる考え方は、本物のAPIキーをエージェントに渡さないことです。エージェントは本物のキーを持つ小さなプロキシに接続し、プロキシが呼び出しのたびに予算を確かめます。筆者は自作のオープンソースの道具Saifubanを使っています。`npx`で導入し、1日の予算とAnthropicのキーを入力すると、プロキシを指す`ANTHROPIC_BASE_URL`と、プロキシ専用の`ANTHROPIC_AUTH_TOKEN`が出力されます。予算が尽きると、プロキシは`x-should-retry: false`付きの429エラーを返し、Claude Codeは再試行せずに止まります。\n最初の版は呼び出しが終わってから費用を数えていたため、並列の呼び出しや再試行に弱かったといいます。今の版は、入力の大きさや`max_tokens`、モデルの価格から最大の費用を送信前に確保し、終わったら実際の費用で精算します。\n\n【ポイント・注意点】\n同じ方法は、ベースURLとキーを変えればOpenAIのSDKやLangChainなどでも使えるとしています。読者のコメントでは、上限は使わない額を示すだけなので、完了した作業ごとの費用も記録すること、断られた要求が再試行の嵐を生まないよう余裕の幅を設けることが提案されています。紹介されている道具は筆者自身のものである点にも留意が必要です。","2026-11-19","DEV Community","https://dev.to/ut181749ut/how-to-put-a-hard-daily-spending-cap-on-claude-code-3ihk"],["コードの地図を持たせるMCPサーバー、codebase-memory-mcp","コーディングエージェントが質問のたびに多くのファイルを読み直さずに済むよう、コードベースの構造を手元の知識グラフとして持つMCPサーバー「codebase-memory-mcp」を紹介したdev.to記事です。READMEに基づき、対応言語数やツールの種類、導入方法、既定の設定、トークン削減の数値などを整理しています。筆者自身は導入して試していない点も明記しています。","\n【概要】\nSpan Observer氏が2026年11月19日にdev.toで公開した記事です。コーディングエージェントが質問のたびに多くのファイルを読み直さなくて済むよう、コードベースの知識グラフを手元に保つMCPサーバー「codebase-memory-mcp」を紹介しています。ここでの「記憶」は会話の記憶ではなく、関数や呼び出し、ルート、依存関係、文書、インフラのファイルといった構造の記憶だと強調しています。\n\n【背景】\nエージェントにコードについて質問すると、毎回ファイルを探して読む作業が発生し、トークンとツール呼び出しを多く使います。構造を前もって索引にしておけば、エージェントは必要な部分だけを問い合わせられます。\n\n【詳細】\nREADMEによると、ライセンスはMITで、DockerやランタイムのいらないC言語のネイティブ実装です。163の言語とファイル形式、17のMCPツール（`search_graph`、`trace_path`、`detect_changes`、`get_architecture`など）、46のエージェント連携に対応します。サーバー側に言語モデルはなく、クライアントのエージェントが質問をツール呼び出しに変え、サーバーは小さく分けた結果を返します。大きなリポジトリでは`async: true`で索引を作り、状態を確認しながら待つ方法が勧められています。\n導入はmacOSとLinuxでは`install.sh`、Windowsでは`install.ps1`を読んでから実行します。`install`コマンドは検出したクライアントやスキル、エージェントの設定、フックを構成します。フックは既定で有効で、`install --no-hooks`で外せます。索引は`~/.cache/codebase-memory-mcp/`にSQLiteで保存されます。\n\n【ポイント・注意点】\nREADMEは、31のリポジトリでトークンが10分の1、ツール呼び出しが2.1分の1になったという研究や、Linuxカーネルの索引が約3分という数値を挙げていますが、筆者は再現していません。筆者自身は導入して試しておらず、自分の質問と固定したコミットで測ることを勧めています。記事は11月11日時点のバージョン0.12.1に基づいています。","2026-11-19","DEV Community","https://dev.to/spanobserver/codebase-memory-mcp-server-a-code-map-for-coding-agents-g6h"],["AIコーディングの利用上限が早く尽きる、原因の探し方","Claude CodeとCodexの利用上限が予想より早く尽きるとき、プランを上げたりモデルを替えたりする前に、何が消費しているかを調べる手順をまとめたdev.to記事です。上限の種類の見分け方、/usageなど利用状況の画面の読み方、よくある5つの消費源、モデルの使い分けを順に説明し、確認項目の一覧も添えています。なお、AIの支援を受けて書かれた記事です。","\n【概要】\nPromptMaster氏が2026年11月19日にdev.toで公開した記事です。Claude CodeとCodexのサブスクリプションの利用上限が早く尽きるとき、プランを上げたりモデルを替えたりする前に、何が上限を消費しているかを探す手順をまとめています。記事はAIの支援を受けて書かれたと明記され、Claude CodeとCodexの情報は11月16日に取得した公式ドキュメントに基づくとしています。\n\n【背景】\nエージェントを長く動かしたり、サブエージェントや定期実行を並行させたりすると、本人が気づかないうちに利用量が増えます。上限に当たったときに、どの上限なのか、何が原因なのかを見分けないまま対処すると、効果のない手を打ちがちです。\n\n【詳細】\nまず上限の種類を見分けます。セッションや週の上限はすべてのモデルに共通なので、`/model`で替えても解決しません。OpusやSonnetの上限なら別系統のモデルに替えれば作業を続けられます。`429`エラーは、別のAPIキーが使われている可能性があるため`/status`で確認します。\n次に利用状況の画面を読みます。Claude Codeの`/usage`は、スキル、サブエージェント、プラグイン、MCPサーバーごとの消費を示し、最近の利用の10%以上を占めるものに印を付けます。`d`と`w`で24時間と7日を切り替えます。よくある消費源は5つで、モデルと速度、常に読み込まれる文脈、ツールの出力、並行や裏での作業、再試行とやり直しです。Claude Codeは一時的な失敗を最大10回再試行します。\n\n【ポイント・注意点】\nモデルの使い分けとして、普段はSonnetを使い、必要なときだけ`/model`でOpusに替える、計画にOpus・実行にSonnetを使う`opusplan`を使う、簡単なサブエージェントには`model: haiku`を指定する、といった方法を挙げています。確認項目として、上限の文言を読む、変える前に`/status`と`/usage`を見る、使わないMCPサーバーを止める、裏で動き続けている作業を探す、作業の区切りでモデルを替える、などを示しています。記事の最後には別の有料ガイドの宣伝があります。","2026-11-19","DEV Community","https://dev.to/promptmaster/your-ai-coding-limits-ran-out-early-find-what-is-burning-them-1jip"],["Claude CodeをDeepSeek・GLM・Kimiで動かす設定と注意点","Claude CodeをDeepSeek、GLM、Kimiのモデルにつないで動かすための設定と、設定が足りないときに起きる問題、その直し方をまとめたdev.to記事です。接続先とキーの指定、5つのモデル設定、文脈の大きさの扱い、エラーごとの原因などを解説しています。筆者はAnthropic互換の窓口を持つ仲介サービスの創業者で、その立場を冒頭で明かしています。","\n【概要】\nAnthropic互換の窓口を持つAPI仲介サービスUberLLMの創業者Alex氏が、2026年11月19日にdev.toで公開した記事です。AnthropicのMessages APIを使うClaude Codeを、DeepSeek、GLM、Kimiのモデルにつなぐ方法と、設定が不完全なときに何が壊れるかを解説しています。筆者は自社との関係を冒頭で明かしています。\n\n【背景】\nClaude Codeは接続先を環境変数で切り替えられるため、Anthropic互換の窓口を持つ他社のモデルでも動かせます。ただし、設定の一部が抜けていると、意図せずClaudeのモデルを呼んだり、長い会話で失敗したりします。\n\n【詳細】\n接続先とキーは`ANTHROPIC_BASE_URL`と`ANTHROPIC_AUTH_TOKEN`で指定します。Claude Codeが`/v1/messages`を自分で付けるため、ベースURLには`/v1`を付けません。\nモデルの設定は5つあり、`ANTHROPIC_MODEL`、Opus・Sonnet・Haikuの既定値、`CLAUDE_CODE_SUBAGENT_MODEL`です。設定していない枠はClaudeのモデルを要求し続けるため、単一の提供元では失敗し、複数モデルの窓口ではClaudeの料金がかかります。Claude Codeは他社のモデルの文脈を20万トークンとみなすため、100万トークンにするにはモデルIDの末尾に`[1m]`を付けるか、`CLAUDE_CODE_MAX_CONTEXT_TOKENS`を設定します。大きく申告しすぎると長い会話で失敗します。\n\n【ポイント・注意点】\nツールに対応しないモデルにツール付きの要求を送ると`400 tools_not_supported`になる、Kimiのモデルは独自の温度設定を受け付けない、表示される費用は推計で、claude.aiの機能は使えない、といった違いがあります。仲介サービスを使うとセッションのデータが第三者に渡り、既定で90日保存される点も筆者自身が挙げています。各モデルの作り手も独自のAnthropic互換の窓口を用意しているため、直接つなぐ選択肢もあります。","2026-11-19","DEV Community","https://dev.to/alex_uberllm/run-claude-code-on-deepseek
