<style>

:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;display:flex;flex-direction:column;height:100dvh;overflow:hidden;transition:background .35s ease,color .35s ease}
body::before{content:"";position:fixed;inset:0;background:var(--pattern);pointer-events:none;opacity:var(--pattern-op,.5)}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
[data-theme="steampunk"]{--bg:#e6d7b8;--pattern:radial-gradient(circle at 12% 20%,rgba(141,100,40,.16) 0 26px,transparent 27px),radial-gradient(circle at 88% 78%,rgba(141,100,40,.13) 0 38px,transparent 39px),repeating-linear-gradient(0deg,rgba(90,62,25,.05) 0 1px,transparent 1px 26px);--pattern-op:1;--card:#f8eed3;--ink:#2e2010;--muted:#77603c;--line:#a97f3f;--accent:#9c4a12;--accent2:#2f5d50;--accent-ink:#fff6df;--soft:#efdfba;--old:#97835f;--top-bg:#2a1a0c;--top-ink:#f2dfae;--radius:8px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\2699  \2699  \2699";--shadow:0 14px 34px rgba(62,40,8,.28)}
[data-theme="witch"]{color-scheme:dark;--bg:#161022;--pattern:radial-gradient(circle at 18% 12%,rgba(233,213,255,.20) 0 1.5px,transparent 2.5px),radial-gradient(circle at 72% 22%,rgba(233,213,255,.14) 0 1px,transparent 2px),radial-gradient(circle at 42% 66%,rgba(196,181,253,.12) 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 84%,rgba(233,213,255,.16) 0 1px,transparent 2px),radial-gradient(circle at 6% 88%,rgba(196,181,253,.12) 0 1px,transparent 2px);--pattern-op:1;--card:#241a3d;--ink:#f1eaff;--muted:#bdaee0;--line:#5b4595;--accent:#a678ff;--accent2:#e9d5ff;--accent-ink:#1d1233;--soft:#2f2350;--old:#8d81ad;--top-bg:#0e0919;--top-ink:#efe6ff;--radius:20px;--font-display:"IM Fell English","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\263E  \2726  \263D";--shadow:0 14px 34px rgba(0,0,0,.5)}
[data-theme="dnd"]{--bg:#e7d9b4;--pattern:repeating-linear-gradient(45deg,rgba(158,43,37,.05) 0 2px,transparent 2px 18px),radial-gradient(circle at 85% 10%,rgba(158,43,37,.10) 0 30px,transparent 31px);--pattern-op:1;--card:#f7ecc9;--ink:#332216;--muted:#7d6248;--line:#8c6a3f;--accent:#9e2b25;--accent2:#a97b00;--accent-ink:#fdf3d8;--soft:#eee0b6;--old:#9a8a72;--top-bg:#471611;--top-ink:#f7e7bd;--radius:4px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\265E  \2726  \265E";--shadow:0 14px 30px rgba(71,22,17,.30)}
[data-theme="celtic"]{--bg:#e3dfc6;--pattern:repeating-linear-gradient(0deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px),repeating-linear-gradient(90deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px);--pattern-op:1;--card:#f6f2dc;--ink:#20331e;--muted:#5d7050;--line:#77873f;--accent:#2e6b34;--accent2:#a8842a;--accent-ink:#fbf7e2;--soft:#e7e5c8;--old:#93a086;--top-bg:#17351f;--top-ink:#efeccb;--radius:14px;--font-display:"Uncial Antiqua","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\16DA  \2726  \16DB";--shadow:0 14px 30px rgba(23,53,31,.26)}
[data-theme="greek"]{--bg:#f2eee3;--pattern:repeating-linear-gradient(90deg,rgba(29,95,138,.06) 0 1px,transparent 1px 34px),radial-gradient(circle at 90% 0%,rgba(185,138,28,.10) 0 60px,transparent 61px);--pattern-op:1;--card:#fffdf6;--ink:#1e2c38;--muted:#66727c;--line:#b3923c;--accent:#1d5f8a;--accent2:#b98a1c;--accent-ink:#ffffff;--soft:#ece7d7;--old:#a3a8ad;--top-bg:#fdfbf4;--top-ink:#1e2c38;--radius:2px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\03A9  \2766  \03A9";--shadow:0 14px 30px rgba(30,44,56,.18)}
.top{flex:none;position:relative;z-index:30;background:var(--top-bg);color:var(--top-ink);border-bottom:3px double var(--line)}
.topin{max-width:1080px;margin:auto;padding:10px 16px 4px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.logo{font-family:var(--font-display);font-weight:900;font-size:23px;letter-spacing:.06em}.logo span{color:var(--accent2)}
[data-theme="witch"] .logo span,[data-theme="steampunk"] .logo span{color:var(--accent)}
.date{font-size:10px;opacity:.75;white-space:nowrap}
.topbtns{display:flex;gap:8px;flex:none}.pill{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.themes{max-width:1080px;margin:auto;padding:6px 16px 10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.themes-label{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;opacity:.8}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;opacity:.85}
.theme-btn .gly{margin-right:5px}
.theme-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
.stage-wrap{flex:1;min-height:0;max-width:1080px;width:100%;margin:auto;padding:10px 16px 12px;display:flex;flex-direction:column;position:relative;z-index:1}
.herostrip{flex:none;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;box-shadow:var(--shadow)}
.herostrip img{width:74px;height:52px;object-fit:cover;border-radius:calc(var(--radius) * .6);flex:none}
.herostrip p{margin:0;font-size:13px;color:var(--muted)}.herostrip b{color:var(--ink);font-family:var(--font-display)}
.catbar{flex:none;display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.catbar .navbtn{flex:none}
.catinfo{flex:1;text-align:center;min-width:0}
.catinfo h2{margin:0;font-family:var(--font-display);font-size:clamp(19px,4.6vw,27px);line-height:1.25;letter-spacing:.03em}
.catinfo p{margin:1px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catcount{flex:none;font-size:12px;background:var(--soft);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-weight:700}
.navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800;box-shadow:var(--shadow)}
.navbtn:active{transform:scale(.97)}
.dots{flex:none;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:transparent;padding:0}
.dot.active{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.stage{flex:1;min-height:0;touch-action:none;position:relative}
#cardSlot{height:100%}
.card{height:100%;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
.card::after{content:var(--orn);position:absolute;top:6px;right:12px;font-size:13px;letter-spacing:.3em;color:var(--accent2);opacity:.85;pointer-events:none}
.card.old .ph{filter:grayscale(1)}
.card .ph{width:100%;height:30%;min-height:120px;object-fit:cover;display:block;flex:none}
[data-theme="steampunk"] .card .ph{filter:sepia(.35) contrast(1.05)}
[data-theme="witch"] .card .ph{filter:saturate(.85) hue-rotate(-12deg) brightness(.92)}
[data-theme="dnd"] .card .ph{filter:sepia(.25) saturate(1.1)}
[data-theme="celtic"] .card .ph{filter:saturate(1.05) hue-rotate(6deg)}
[data-theme="greek"] .card .ph{filter:saturate(.92) brightness(1.04)}
.cbody{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.badge{background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:999px;font-weight:800}.badge.oldb{background:var(--old)}
.card h3{margin:0;font-size:clamp(17px,4.4vw,21px);line-height:1.45;font-family:var(--font-display);font-weight:700}
.sum{font-size:14px;color:var(--muted);margin:0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.btn{border:0;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800}
.btn.primary{background:var(--accent);color:var(--accent-ink)}.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.saved{background:var(--accent2);color:var(--accent-ink)}
.src{font-size:11px;color:var(--muted);word-break:break-all}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;color:var(--muted)}
.empty .big{font-size:34px;color:var(--accent2)}
.pager{flex:none;display:flex;align-items:center;gap:10px;margin-top:10px}
.pager .navbtn{flex:1}
.artdots{flex:none;display:flex;gap:5px;max-width:34vw;flex-wrap:wrap;justify-content:center}
.artcount{flex:none;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.hint{flex:none;font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.addcat{flex:none;text-align:center;margin-top:6px}
.addcat button{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700}
@keyframes inNext{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes inDown{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes inUp{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
.anim-next{animation:inNext .28s ease}.anim-prev{animation:inPrev .28s ease}.anim-down{animation:inDown .28s ease}.anim-up{animation:inUp .28s ease}
dialog{border:2px solid var(--line);border-radius:calc(var(--radius) + 6px);padding:0;max-width:min(680px,94vw);width:680px;max-height:92dvh;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,8,4,.6)}
.din{padding:20px;overflow-y:auto;max-height:92dvh}
.din img{width:100%;height:200px;object-fit:cover;border-radius:var(--radius)}
.din h3{font-size:20px;line-height:1.4;margin:12px 0 6px;font-family:var(--font-display)}
.full{font-size:15px;white-space:pre-line}
textarea,input[type="text"]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px}
label.fl{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
.memoBox{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.memoItem{border-top:1px solid var(--line);padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--top-bg);color:var(--top-ink);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:90vw;text-align:center}
@media(max-width:640px){.topin{padding:8px 12px 2px}.themes{padding:4px 12px 8px}.stage-wrap{padding:8px 12px 10px}.herostrip{display:none}.catbar .navbtn{padding:8px 10px;font-size:12px}.card .ph{height:24%;min-height:104px}}
@media(prefers-reduced-motion:reduce){.anim-next,.anim-prev,.anim-down,.anim-up{animation:none}body{transition:none}}

</style>

const DATA={"ai": [["AIがAI開発そのものを加速 — METRがAnthropicで約1.9倍の加速を報告", "独立評価機関METRは11月5日、Anthropic社内でのAI研究開発の加速について、現地調査に基づく評価を公表しました。よく定義された課題におけるモデル能力の伸びは、2025年10月以降、それ以前の期間の約1.9倍（区間1.5〜2.8倍）の速さになり、その約8割はAIが研究者を支援した効果の可能性があると分析しています。ただし帰属には大きな不確実性があり、完全自律的な自己改善の証拠ではないとも明確に留保しました。", "独立した評価団体METRは11月5日、Anthropic社内でのAI研究開発の加速について評価を公表しました。2025年8月12日から10月29日にかけて同社内で行った現地調査に基づくもので、Reutersでも報じられています。第三者がフロンティア企業の内側に入り、AIがAI開発自体をどれだけ速めているかを検証した、現時点では数少ない事例です。\n\n数字の中身はこうです。よく定義された課題におけるモデル能力の向上ペースは、2024年3月〜2025年10月の期間と比べて約1.9倍（区間1.5〜2.8倍）になったと推定されました。さらにMETRは、その加速の約8割はAIが研究者を支援したことによる可能性があるとしています。ただしこの帰属は主観的な判断を含むもので、METR自身が「相当に不確実だ」と強調しています。\n\n評価には限界もあります。伏せられた証拠があること、ベンチマークの設計自体の影響、より複雑な課題については知見が不十分なことなどが制約として挙げられています。測れたのは「よく定義された課題」の範囲であり、研究開発のあらゆる工程にそのまま当てはまる数字ではありません。\n\nそれでも注目されるのは、フィードバックループの可能性です。より有能なモデルが研究者を助け、その研究者がさらに強いモデルを作り、研究の生産性がもう一段上がる。こうした循環が続けば、開発ペースそのものが変わり得ます。一方で、計算資源、データ、実験の回し方、監督体制、信頼性といった要素が、やがて律速になる可能性も指摘されています。\n\n重要な留保として、これは完全自律的な自己改善の証拠ではありません。最も重要な学習工程では依然として人間の研究者が中心であり、AIはまだ自律的に大きな貢献をしている段階ではない、とMETRは述べています。「約2倍」という数字は確定した測定値ではなく、不確実性を伴う本格的な推定として受け止めるのが妥当です。\n\n今後の焦点は、他のフロンティア企業でも同様の加速が独立した評価で確認されるかどうかです。1社の、それもアクセス範囲に限りがある評価だけで一般化はできません。加速が続けば開発の時間軸そのものが変わるため、継続的な検証が待たれます。", "2026-11-08", "AI Nextia / METR報告", "https://www.ainextia.com/insights/ai-news-today-november-5-2026/"], ["OpenAI、脆弱性研究で948件の権限昇格エクスプロイトを自動生成", "OpenAIは11月4日、自律的な脆弱性研究パイプラインの成果を公表しました。Linuxカーネルの候補所見2,308件を分析し、テスト環境で1,724件を再現、948件についてはローカル権限昇格のエクスプロイトを生成。候補パッチの作成までを一貫した流れで行いました。翌11月5日には専用モデル「GPT-6 Cyber」も発表され、防御側の自動化が大規模に進む一方、検証と悪用防止の枠組みが同時に問われています。", "OpenAIは11月4日、自律的な脆弱性研究パイプラインの成果を公表しました。対象はLinuxカーネルで、脆弱性の発見、再現、エクスプロイトの検証、候補パッチの生成、そして人間のセキュリティレビューまでを、構造化された1つの研究パイプラインに束ねた取り組みです。キャンペーンの費用はAPI利用料で約120万ドルだったとされています。\n\n数字を順に追うと、まず2,308件の候補所見を特定・分析し、テスト環境で1,724件の脆弱性を実際に再現しました。さらに948件については、ローカル権限昇格のエクスプロイトを生成しています。権限昇格とは、通常の利用者権限で動くプログラムが欠陥を突いて管理者（root）権限を奪う攻撃のことで、侵入後の被害を大きく広げるため、深刻度が高い部類です。見つけて終わりではなく、メンテナがレビューできるよう候補パッチまで用意した点も特徴です。\n\n翌11月5日には、この研究のための専用モデル「GPT-6 Cyber」が発表されました。従来のサイバーモデルよりベンチマーク性能が向上したとされ、LinuxやFirefoxの脆弱性研究への貢献も報告されています。ただし利用は認可された防御的研究の範囲内に限られ、高機能な設定は承認された利用者に限定されます。一般向けのセキュリティサービスとして誰でもすぐ導入できるものではありません。\n\n受け止め方には注意も要ります。再現できたことやパッチ候補を作れたことは、すべての所見が本番環境で受理され、修正済みになったことと同義ではありません。OpenAI自身、メンテナと人間のレビューは依然として不可欠だとしています。防御側の優位は「どれだけ多く見つけられるか」から「検証し、優先順位を付け、協調して開示し、修正まで回せるか」へ移っていく、という構図がこの事例から見えてきます。\n\n候補パッチまで自動で用意されることは、メンテナ側のレビュー負担を下げ、修正までの時間短縮にもつながる可能性があります。\n\nこの規模が意味するのは、調査できる弱点の桁が変わることです。人手だけでは到底さばき切れない候補を、機械が再現と検証まで進め、人間は判断と修正に集中する。防御側が大規模な発見にどう体制で応えるか、その設計力の差がこれからはっきりしてくるはずです。", "2026-11-08", "AI Nextia / OpenAI報告", "https://www.ainextia.com/insights/ai-news-today-november-5-2026/"], ["DeepMindのエージェント、旧式RSA暗号の弱点2件を発見", "Google DeepMindは11月6日、人間の暗号研究者と協働したAIエージェントが、1024ビットRSAに関する未知の弱点2件を発見したと発表しました。1つは署名のパディングに関するもの、もう1つはバッチ因数分解の効率化で、条件によっては従来法より約1,600倍高速という推定も示されています。ただし倍率は理論上の推定であり、現代の暗号が破られたわけではありません。1024ビット鍵は主要用途では既に使われていません。", "Google DeepMindは、人間の暗号研究者と協働したAIエージェントが、1024ビットRSAに関する未知の弱点2件を発見したと発表しました。DeepMindの科学担当VP Pushmeet Kohli氏が11月6日に公表したもので、チームにはUC San DiegoのNadia Heninger氏やInriaのEmmanuel Thomé氏といった学術側の暗号研究者も加わっています。エージェントは人間の監督のもとで動いていました。\n\nRSAは、古いデジタル署名や鍵交換の背後にある数学の仕組みで、数字は鍵の長さを指します。1つ目の弱点は署名のパディングに関するものです。パディングとは、署名の前にメッセージへ余分な構造を巻き付けて偽造を難しくする仕掛けですが、攻撃者が署名ブロックの約半分を制御できる場合、その防御効果がほぼなくなるという指摘です。攻撃者が短いフィンガープリントしか制御できない場合でも、エージェントが作り出したアルゴリズムは、最良の公表手法より約1,600倍高速だと推定されています。\n\n2つ目はバッチ因数分解です。同じビット長の鍵が多数ある場合、1回の高コストな事前計算を複数の鍵に使い回すことができ、追加の鍵1件あたりの平均コストがおよそ30分の1に下がるというものです。鍵が大量に存在する状況ほど効いてくる性質です。\n\nただし、倍率などの数字は理論上の推定であり、端から端まで実測されたものではありません。実際に動いた部分は、学術チームが既に破っていた1024ビット鍵に対するサンドボックス内の再現で、そこでは鍵を直接因数分解するよりCPU時間を3.5分の1に抑えたと報告されています。DeepMindも、現代の2048ビット鍵などは影響を受けないとしています。\n\n実務上の受け止めは「棚卸し」であって「パニック」ではありません。古い内部サービスや組み込み機器など、1024ビット証明書で署名や鍵交換をしているものが残っていないかを確認するのが今週の仕事です。直感と試行錯誤に頼っていた暗号解析の工程を、機械が担い始めている点こそが本質的な変化です。", "2026-11-08", "BYOBot AI Newsstand", "https://byobot.ai/ai-news/ai-daily-newsstand-november-8-2026"], ["OpenAI Images 2.6公開 — 高速化とGIF生成、全プランで利用可", "OpenAIは11月4日、画像生成の新版「Images 2.6」を発表しました。生成速度が従来より約50%向上し、繰り返し編集しても被写体や構図、ブランド要素の一貫性が保たれやすくなり、短いアニメーションGIFも作れるようになりました。提供範囲はChatGPTの全サブスクリプション層、Codex、APIに広がっています。1枚の出来栄えよりも「同じ被写体で何度も作り直せる」再現性が価値になる、中小事業者に直接効く更新です。", "OpenAIは11月4日、画像生成の新版「Images 2.6」を発表しました。中小事業者向けのまとめ記事でも、今週最も分かりやすい改善として筆頭に挙げられています。\n\n主な変更は3点です。第1に生成速度で、従来より約50%速くなりました。第2に編集の一貫性です。キャラクターや商品、ロゴといった要素が、修正を重ねるたびに少しずつ崩れていく現象を抑え、被写体や構図が保たれやすくなりました。第3に、短いアニメーションGIFを作成できるようになったことです。マスコットや商品写真、簡単なスケッチをループアニメーションにできます。\n\n提供範囲も広がりました。ChatGPTのすべてのサブスクリプション層で世界的に利用でき、デスクトップ、モバイル、Webに対応します。CodexとAPIでも利用できるとされ、API版はSVGファイルの書き出しも可能で、Webサイトや印刷物にそのまま落とし込めます。\n\n試すなら、自分の商品写真から短いループを作るのが手軽な入口です。「製品・ラベル・色は正確にそのまま保ち、背景の光だけを動かす」といった指示が向いています。ただし注意点として、AIは小さな文字を「改善」して書き換えてしまうことがあります。ラベルの細かい表記は原寸で必ず確認してください。生成物には、ブランド面・事実面・権利面のチェックが依然として必要です。\n\n制作販売で画像素材を作る用途にも直接効く更新です。価値の中心は、印象的な1枚を当てることから、商品画像や絵コンテ、販促コンセプトを同じ見た目のまま何度も反復できるワークフローへ移っています。\n\n中小事業者向けのまとめがこれを今週の筆頭に置いた理由の一つは、高額なプランに閉じられていない点です。追加料金なしに、契約中のプランのまま試せる改善は、派手な新機能の多い週の中では限られていました。OpenAIの画像生成ガイドでも、GIFやSVGの書き出しの選択肢が案内されています。\n\nメールマガジンやSNS投稿に埋め込む短いループ素材は、静止画よりも目を引きますが、撮影や編集のコストが壁でした。手持ちの商品写真から生成できる今回の方式は、その入口の費用を大きく下げます。まず1枚、自分の商品で試してみるのが現実的な第一歩です。", "2026-11-08", "Lilach Bullock", "https://www.lilachbullock.com/ai-news-this-week-for-small-business-8-november-2026/"], ["Gemini Omni 1.2 Flash一般提供 — 動画15秒・価格は約30%低下", "Google DeepMindは11月5日にGemini Omni 1.2 Flashのモデルカードを公表し、一般提供が始まりました。テキスト、画像、音声、動画から、音声付き動画を生成・編集できるモデルです。クリップは最大15秒（従来10秒）になり、価格は前版より約30%低下したと報じられています。今回の変更で重要なのは長さよりも価格で、720pで1秒あたり約0.07ドル相当とされます。会話しながら動画を編集できる点も特徴です。", "Google DeepMindは11月5日にGemini Omni 1.2 Flashのモデルカードを公表し、一般提供が始まりました。テキスト、画像、音声、動画を入力として、音声付きの動画を生成・編集できるモデルです。\n\n今回の変更で重要なのは、長さよりも価格です。クリップは最大15秒（従来10秒）に伸びましたが、価格は前版より約30%低下したとGoogleは述べており、第三者報道では720pで1秒あたり約0.07ドル相当と伝えられています。以前はコスト面で見送った動画ワークフローが、検討に値する価格帯に入ってくる可能性があります。\n\n編集の仕方も特徴的です。タイムライン上でクリップを手作業で引き回すのではなく、会話で「何を変えるか」を伝えて編集する方式です。生成される動画にはSynthIDの透かしが入り、AI生成コンテンツであることを識別できるようになっています。動画の中で人が言う内容を変えることも技術的には可能ですが、Googleは当面その利用を制限しているとのことです。\n\n配布先としては、Geminiアプリ、YouTube、Google Flow、AI Studio、Google Workspaceなどがモデルカードに挙げられています。ただし、自分のアカウントでいつ使えるようになるかの日付は約束されていないため、販促計画をこれ前提で立てる前に、実際の利用可否を確認したほうが安全です。\n\n評価の物差しにも注意が要ります。BYOBotのまとめによれば、本モデルはArenaの画像から動画への変換リーダーボードで首位（1502）にデビューしたものの、これは群衆の好みによるランキングであり、自分の商品が正しく描けるかどうかの指標ではありません。また、顧客やクライアント、スタッフが言っていないことを言わせる編集は、冗談でも避けるべきです。短尺の商品紹介やSNS動画の制作コストを下げる可能性は十分にありますが、フレームごとの確認は省けません。\n\nBYOBotのまとめは、この値下げを「半年前に棚上げしたワークフローを、もう一度検討する価値がある変化」と位置づけています。会話で編集できる手軽さと合わせて、短い動画を継続的に作る小規模なチームほど、恩恵を受けやすい更新だといえます。", "2026-11-07", "Lilach Bullock / BYOBot", "https://www.lilachbullock.com/ai-news-this-week-for-small-business-8-november-2026/"], ["Anthropic、Claude Enterpriseにセキュリティセンター — 推論フックのGAとMCP認証の基盤も", "Anthropicが企業向けの統制機能を相次ぎ強化した。Claude Enterpriseにセキュリティセンターが加わり、プロンプトやツール呼び出しを自社のDLPツール経由にできる「推論フック」が一般提供に。さらに、企業管理のMCP認証でClaude自体がID発行者になれる機能も案内された。エージェントを業務に入れる前提として、監査と統制の部品がそろってきた。", "概要\nAnthropicはClaude Enterpriseにセキュリティセンターを追加し、あわせて推論フック（inference hooks）の一般提供を開始した。推論フックは、プロンプトとツール呼び出しを自社のDLP（情報漏えい防止）ツールを経由させる仕組みだ。さらに別の案内では、企業が管理するMCP認証において、ClaudeがID発行者（identity issuer）として機能できることも示された。\n\n背景\nエージェントが社内システムに接続して実作業を行うようになると、問題はモデルの賢さから「誰の権限で、何を見て、何を実行したか」へ移る。MCPはエージェントとツールの接続規格として広がっており、その認証と監査を誰が担うかが企業導入の詰まりどころだった。\n\n詳細\nセキュリティセンターは、企業管理者がClaudeの利用状況やセキュリティ設定を一元的に把握するための画面だ。推論フックが一般提供になったことで、送信されるプロンプトやツール呼び出しを、DLPなど既存の検査基盤に通してから処理させる構成が取りやすくなる。MCP認証でClaudeがID発行者になれる機能は、企業管理の認証基盤とエージェントの接続を橋渡しするものだ。\n\nなぜ注目か\n米司法省のタスクフォース発足に見られるように、AIの内部統制は規制側の関心事にもなっている。統制機能の充実は、規制対応というより「大企業がエージェントを本番に入れるための前提条件」として競争軸になりつつある。\n\nポイント・注意点\n推論フックを挟む構成では、検査基盤側の遅延や障害がそのままエージェントの応答性に影響する。どの範囲を通し、何を記録するかは設計次第だ。機能の提供範囲やプラン条件は、Claudeのヘルプセンターや管理画面で確認したい。\n\n同じ週の周辺の動きも、この方向を補強している。Bamのブリーフによれば、Claudeは企業管理のMCP認証でID発行者を担えるようになり、Claude Code自体にもフォークごとの推論努力量や、サインイン有効期限を出力に含めるといった管理寄りの更新が入った。派手なモデル発表の影で、運用と統制の部品が着実に積み上がっている。", "2026-11-07", "AI & Agents Daily Briefing / Anthropic発表", "https://ai.melgene.com/2026-11-07?lang=en"], ["Kimi K3.1 Proの重みがHugging Faceで公開 — 2.8兆パラメータの巨大MoE", "Moonshot AIが約束どおりKimi K3.1 Proの重みをHugging Faceで公開した。総パラメータ2.8兆、実行時アクティブ104BのMoEで、コンテキストは約105万トークン、画像入力にも対応する。Artificial Analysisの知能指数では46.5と、ダウンロード可能なモデルの首位に立つ。中国の輸出規制ドラフトの閾値を超える規模としても注目される。", "概要\nMoonshot AIは10月23日の予告どおり、Kimi K3.1 Proの重みを公式Hugging Faceアカウントで公開した。リポジトリの作成記録は11月2日で、11月5日朝に公開が確認されている。APIは従来どおりkimi-k3.1-proとして提供され、価格は100万トークンあたり入力2ドル／出力10ドル、キャッシュ入力0.20ドルだ。\n\n背景\nK3.1 Proは10月23日にAPIが先行公開され、重みの公開が予告されていた。今回の公開で、自前で動かせる最大級の選択肢が加わった。中国では商務部公告第48号のAI輸出カタログ案が11月15日までパブリックコメント中で、2兆パラメータを超えるモデルが閾値の一つとされる。K3.1 Proの2.8兆はこの水準を上回る。\n\n詳細\nモデルカードによれば、総パラメータ2.8兆、トークンごとにアクティブになるのは104BのMixture-of-Experts構成だ。コンテキスト長は1,048,576トークン。テキストに加えて画像入力に対応し、視覚エンコーダMoonViT-V2（401M）を備える。重みはMXFP4、活性化はMXFP8で量子化されている。Terminal-Bench 4.0のスコアは65.7%。推奨ランタイムはvLLM、SGLang、TokenSpeedで、HuaweiもAtlas A3／Ascend 950での推論対応を表明している。ライセンスは独自のKimi K3.1 Pro Licenseで、Model-as-a-Service事業者は関連会社と合わせて12か月の収益が2,000万ドルを超える場合、別途契約が必要とされる。\n\nなぜ注目か\nAA知能指数v5で46.5を記録し、ダウンロード可能なモデルの中で首位に立つ。API価格は前世代K3より33%低い。オープンな重みとしては異例の規模と性能の組み合わせで、自前ホスティングを検討するチームにとって現実的な候補になった。\n\nポイント・注意点\n2.8兆パラメータの実行には大規模な推論基盤が前提だ。輸出カタログ案では、公開済み技術には除外規定がある一方、閾値を超える新規リリースには登録が必要とされ、Moonshotの手続きも注視されている。ライセンス条件、特に商用サービスでの利用範囲は導入前に確認したい。", "2026-11-05", "China AI Ledger / Hugging Face", "https://medium.com/@dev.hashmap/china-ai-ledger-2-kimi-k3-1-pro-weights-apple-qwen-and-tencent-hy4-cc8ecba7037c"], ["Baidu、ERNIE 5.5 Flash Baseの重みを公開 — あえて「素」の基盤モデル", "Baiduが11月5日、ERNIE-5.5-Flash-Baseの重みを公開した。総パラメータ280B、アクティブ14BのスパースMoEで、33.5兆トークンで事前学習されたチェックポイントは事後学習を一切含まない「ベースモデル」そのもの。自分たちでファインチューニングや強化学習を行いたい研究・開発チームに向けた提供だ。後継の事後学習版Flashも予告されている。", "概要\nBaiduは11月5日、ERNIE-5.5-Flash-Baseの重みを公開した。総パラメータ280B、入力ごとにアクティブになるのは14BというスパースなMixture-of-Experts構成で、33.5兆トークンで事前学習されている。Hugging FaceではFP8とBF16の形式が提供される。\n\n背景\n多くのモデル公開がチャット調整済みの完成品を出す中、Baiduは意図的にベースモデルを選んだ。このチェックポイントは事前学習の終端そのもので、中間学習も事後学習も含まれていない。自分たちのデータでSFTやRLを回したいラボにとって、調整の自由度が最も高い形だ。\n\n詳細\n学習時コンテキストは最大128K、ファインチューニングと推論では最大100万トークンまで対応する。ライセンスは独自のERNIE 5.5 Flash Base Model License Agreement v1.0。Baiduは事後学習済みのFlash版を後日公開するとしている。\n\n市場での位置づけ\nFlash級モデルのAPI価格競争は激しい。DeepSeek Flash、MiniMax Flash、8月26日から提供中のZhipu GLM-5.3-Flashなど、国際価格で入力0.15ドル前後に並ぶ。Baiduの今回の一手はAPI価格ではなく、オープンなベースモデルの供給側に打ったものだ。\n\nポイント・注意点\nベースモデルはそのままではチャット用途に使えず、指示チューニングなどの追加学習が前提になる。逆に言えば、独自の事後学習パイプラインを持つチームには、素性の良い出発点になる。ライセンスの利用条件は商用利用の前に確認しておきたい。\n\nベースモデルという選択の意味も考えたい。調整済みモデルはすぐ使える反面、出した側の味付けが固定されてしまう。素のチェックポイントは、研究機関や企業のラボが自前のデータと方針で学習を設計できる余白を残す。派手さはないが、実験材料として長く使われるのはこの種の公開であることが多い。提供形式としてFP8とBF16の両方が用意されている点も、異なる推論環境への配慮として実務的だ。", "2026-11-05", "China AI Ledger / Baidu発表", "https://medium.com/@dev.hashmap/china-ai-ledger-2-kimi-k3-1-pro-weights-apple-qwen-and-tencent-hy4-cc8ecba7037c"], ["NVIDIA、世界モデル「Cosmos 3」の重みを公開 — 1台のワークステーションGPUでも動作", "NVIDIAが11月5日、対話型の世界シミュレーション向けモデルCosmos 3のオープンウェイト・チェックポイントをHugging Faceで公開した。行動を与えるとカメラやLiDARが次に見るはずの映像を生成する「世界モデル」で、自動運転とロボティクスの学習を実環境ではなくシミュレーションで回す用途を狙う。最小構成はワークステーションGPU1台で動くという。", "概要\nNVIDIAは11月5日、Cosmos 3のオープンウェイト・チェックポイントをHugging Faceに公開した。対話型の世界シミュレーションのためのモデル群で、用途は自動運転とロボティクスだ。モデルカードと開発者向け解説があわせて公開されている。\n\n背景\n世界モデルとは、ある行動を取ったときにセンサーが次に何を見るかを生成するモデルだ。ロボットのポリシーは、実物の車両や駐車場ではなく、シミュレーション相手に訓練できる。実環境での試行はコストもリスクも高いため、学習を仮想側へ寄せる動きが強まっている。\n\n詳細\n今回公開されたのは対話型の世界シミュレーション向けチェックポイントで、運転とロボティクスの用途が示されている。BYOBotの評価では「小さいが静かに有用な一手」とされ、最小構成はワークステーションGPU1台で動くという点が強調されている。大規模な計算資源を持たない小さなチームでも買えるハードウェアで試せることが、配布の眼目だ。\n\nなぜ注目か\nホスト型サービスの値下げと違い、公開された重みは取り消せない。いったん出回れば、誰でも手元で改変し、組み込み、検証できる。世界モデルのような基盤部品がオープンに供給されることで、ロボティクス開発の参入障壁が下がる。\n\nポイント・注意点\n世界モデルの品質は、そのまま学習相手としての信頼性に直結する。シミュレーションで学んだポリシーが実環境で通用するかは別途検証が要る。公開された構成やライセンスの詳細はモデルカードで確認したい。\n\nBYOBotはこの週の動きを「2種類の安さが来た」と総括した。一つはGoogleのようにホスト型の能力を値下げする安さで、棚上げしていたワークフローを再検討させる。もう一つは、NVIDIAのように小さなチームでも買えるハードウェアで動く重みを配る安さだ。前者は採用が速いが、後者は誰にも取り消せない。世界モデルのような部品が後者の形で供給されることの意味は大きい。\n\n運転とロボティクスという用途の明示も、汎用の映像生成との差別化になっている。", "2026-11-05", "BYOBot AI Newsstand / NVIDIA発表", "https://byobot.ai/ai-news/ai-daily-newsstand-november-8-2026"], ["米司法省、「Super Intelligence Task Force」を発足 — AIの取締りを本格化", "米司法省が11月5日、Super Intelligence Task Force（超知能タスクフォース）を発足させた。外国勢力や国際犯罪組織、納税者や重要インフラを狙う詐欺への対処を掲げ、Stanley Woodward司法次官補らが率いる。新たな規制を作るのではなく、執行を担う組織で、企業側の内部統制が後から問われる時代の到来を示している。企業統治の観点でも見逃せない動きだ。", "概要\n米司法省は11月5日、Super Intelligence Task Forceを発足させた。責任者はStanley Woodward司法次官補とStephen Weiss司法次官補代理。発表は、外国勢力、国際犯罪組織、そして納税者や重要インフラを狙う詐欺を主な対象として掲げている。\n\n背景\nWeiss氏は、企業が「SI技術が意図どおりに振る舞うよう、強固な内部統制を実践する」ことを求める発言をしている。焦点は新技術そのものの禁止ではなく、それを出す企業側の管理体制だ。Nextgovが組織の構成を詳しく報じている。\n\n詳細\n今回の枠組みはルール作りではなく執行だ。誰かに新しい義務が課されるわけではなく、遵守すべき新基準が生まれるわけでもない。生まれるのは、能力の高いシステムを出した企業に内部統制があったかどうかを、検察が後から問う関心だ。その検証は、企業のログを好意的でない読み手が精査する形で行われる。\n\nなぜ注目か\nエージェントが実世界で行動する時代、事故や悪用の責任の所在は「モデルの性能」から「出す側の管理」へ移りつつある。タスクフォースの発足は、その転換を米国の執行当局が公式に示したものだ。\n\nポイント・注意点\n実務上の保険は、後から提出しても恥ずかしくない監査証跡を残すことだ。エージェントに権限を持たせるシステムほど、誰が何を承認し、何が実行されたかの記録が重要になる。今すぐ新しい届出が必要になる話ではないが、ログと統制の整備は先手で進める価値がある。\n\n実務への含意は地味だが具体的だ。能力の高いシステムを出す企業は、「出した後の管理」を問われる前提で、決定の記録、権限の設計、実行ログの保全を平時から整えておく必要がある。タスクフォースの対象には詐欺対策も含まれるため、AIを使った詐欺への執行強化という側面もある。新しい許認可が増える話ではないぶん、既存の執行がどこまで及ぶかが見どころになる。\n\n対象が外国勢力や犯罪組織、詐欺とされる点も、AIをめぐる執行が安全保障と経済犯罪の文脈で進むことを示している。", "2026-11-05", "BYOBot AI Newsstand / 米司法省発表", "https://byobot.ai/ai-news/ai-daily-newsstand-november-8-2026"], ["Agility RoboticsがNasdaq上場 — 初のヒューマノイドロボット株、評価額は約25億ドル", "ヒューマノイドロボット企業Agility Roboticsが11月5日、NasdaqにティッカーAGLTで上場した。SPAC合併による上場で約4.65億ドルを調達し、上場前の評価額は約25億ドル。初のヒューマノイドロボット専業株として注目される一方、2026年上期の売上は17.4万ドルで大半が関連当事者向けとされ、評価額と実績の距離も話題になっている。期待と実績の距離が、そのまま今後の検証材料になる。", "概要\nAgility Roboticsは11月5日、NasdaqでティッカーAGLTとして取引を開始した。SPAC（特別買収目的会社）との合併を通じた上場で、約4.65億ドルを調達した。上場前評価額は約25億ドルとされる。\n\n背景\nAgilityは倉庫や工場向けの二足歩行ロボットDigitで知られる企業だ。ヒューマノイドロボットはAIブームの「身体」の部分として投資家の関心を集めてきたが、専業企業の上場例はなく、AGLTはその最初の事例になった。\n\n詳細\n注目すべきは数字の落差だ。報告された2026年上期の売上は17.4万ドルで、その大半は関連当事者向けだったという。上場前の評価額約25億ドルと比べると、現在の収益規模は極めて小さい。期待が先行する典型的な構図で、BYOBotも「初のヒューマノイドロボット株」という見出しとともにこの数字を並べて伝えている。\n\nなぜ注目か\n公開市場に専業のヒューマノイド企業が出たことで、今後は四半期ごとの開示を通じて、導入台数や収益化の実態が検証可能になる。実証実験の華やかさではなく、継続的な売上が立つかどうかが株価の材料になる段階に入った。\n\nポイント・注意点\nSPAC上場は調達と引き換えに開示の厳しさも伴う。関連当事者向け売上の比率が高いうちは、外部顧客への展開ペースが最大のチェックポイントだ。ロボット業界全体の温度感を測る指標としても、今後の決算が注視される。\n\nこの落差は、ヒューマノイド分野全体の現在地でもある。倉庫や工場での実証は進むが、収益の柱になるほどの導入規模にはまだ遠い、というのが開示数字の正直な読み方だ。裏を返せば、公開企業になったことで、今後は受注や導入台数の伸びを四半期ごとに検証できる。期待先行の相場から実績の相場へ移る過程そのものが、この銘柄の物語になる。\n\n倉庫などの現場で人型ロボットが継続的に働く姿を示せるかどうかが、評価を持続させる条件だ。導入は実証から本番へ移る段階にあり、台数と稼働の開示が増えるほど、物語先行の価格づけは実績に合わせて修正されていく。", "2026-11-05", "BYOBot AI Newsstand", "https://byobot.ai/ai-news/ai-daily-newsstand-november-8-2026"], ["Thinking Machines、Inkling 2 Smallを発表 — 594Bの巨大MoE、重みはApache 2.0で来週公開", "Thinking Machines Labが第2世代モデルInkling 2 Smallを発表した。総パラメータ594B、実行時アクティブ17BのMoEで、画像入力と推論の努力量調整に対応する。当面は同社の学習基盤Tinker上でのみ利用でき、外部の安全性テストが終わり次第、Apache 2.0で重みを公開する予定だ。同社申告の指標では第1世代から大幅な向上をうたう。", "概要\nThinking Machines Labは11月5日、第2世代モデルInkling 2 Smallを発表した。Mixture-of-Experts構成で総パラメータは594B、1回のリクエストでアクティブになるのは約17Bだ。画像入力に対応し、推論にかける努力量（effort）を調整できる。\n\n背景\n同社は元OpenAI CTOのMira Murati氏が率いることで知られる新興ラボで、学習基盤Tinkerを軸にモデルを提供してきた。Inkling 2 Smallはその第2世代にあたり、まずはTinkerのPlaygroundやサンプリング、ファインチューニングで使える形で出された。重みは現時点では非公開だ。\n\n詳細\n同社の申告では、Artificial Analysis知能指数で31を記録し第1世代を大きく上回るほか、SWE-Bench Pro v2（Hard）で86.3%、DeepSWE v1.1で72.1%をうたう（いずれも同社申告値）。外部の安全性テストが完了次第、来週にもApache 2.0ライセンスで重みを公開する計画だ。公開されれば、コーディングとエージェント用途に使える大型オープンモデルがまた一つ増える。\n\nなぜ注目か\n594Bという規模のモデルをApache 2.0で出す計画は、商用利用の自由度を重視する流れに沿う。Tinkerという学習基盤とセットで提供する点も、モデルそのものより「調整して使う」体験を売る同社の戦略を表している。\n\nポイント・注意点\n現時点の性能数値はすべて同社申告で、独立検証はこれからだ。重みの公開時期も「来週」という予告ベースであり、安全性テストの結果次第ではずれ込む可能性がある。Tinker外での利用可否を含め、続報を確認したい。\n\n提供形態にも同社らしさが出ている。モデル単体を配るのではなく、自社の学習基盤Tinkerでのサンプリングやファインチューニングと一体で出すことで、「調整して使う」体験そのものを商品にしている。重みがApache 2.0で公開されれば、Tinkerの外でも検証が一気に進む。第三者の評価機関による測定も始まっており、同社申告の数字がどこまで再現されるかが最初の関門になる。", "2026-11-05", "AI & Agents Daily Briefing / Thinking Machines発表", "https://ai.melgene.com/2026-11-07?lang=en"], ["OpenAI、GPT-6 Cyberを承認制で提供開始 — Daybreak Red顧客へ段階拡大へ", "OpenAIは11月5日、GPT-6 Cyberを承認済み顧客向けに開いた。セキュリティ用途に特化したと見られるGPT-6系のモデルで、一般提供ではないため、SW Architectは11月の「ローンチ」には数えていない。Fortuneの報道では、今後数週間でDaybreak Redの全顧客へ対象が広がる見通しだという。能力の高いモデルを信頼できる利用者から段階的に出す流れが続いている。", "概要\nOpenAIは11月5日、GPT-6 Cyberを承認済み顧客向けに提供開始した。一般のAPI利用者がすぐ使えるものではなく、対象は審査を経た顧客に限られる。GPT-6系では9月3日のAstra、10月26日のTerraに続く展開で、Cyberはそのセキュリティ特化の位置づけと見られる。\n\n背景\n最先端モデルの公開方法は「一斉リリース」から「信頼できる利用者への段階提供」へ移っている。Googleも最上位のGemini 4 Carbonをサイバー防衛関係者に限定している。防御側に先に渡し、悪用リスクを見極めながら広げるのが、両社に共通する型だ。\n\n詳細\n利用条件や性能の詳細は限られた範囲でしか公表されていない。Fortuneは、GPT-6 Cyberが今後「数週間」でDaybreak Redの全顧客に広がる見通しだと報じている。DaybreakはOpenAIのセキュリティ関連プログラムで、Redはその顧客層を指す。SW Architectは、承認制であることを理由に、この提供を11月の正式ローンチとしては数えていない。\n\nなぜ注目か\n既存記事で伝えたように、OpenAIは脆弱性研究でのエクスプロイト自動生成など、攻撃と防御の両面でAIの能力を伸ばしている。防御専用に近い形で強いモデルを出すことは、その能力を「守る側の道具」として先に社会実装する試みだ。\n\nポイント・注意点\n承認の基準や対象範囲は公表情報が少なく、外部からは見えにくい。段階拡大の「数週間」という見通しも報道ベースだ。一般提供に至るかどうかは、初期顧客での運用結果次第だろう。セキュリティ担当者にとっては、自社が対象に含まれるかを確認する価値がある。\n\n段階提供の型はOpenAIの他の動きとも重なる。SW Architectの整理では、GPT-6系のRosalindも10月30日に「信頼できるアクセス」の形で提供が始まっている。Altman氏は9月1日、Astra以降のモデルは安全性とアライメントの作業のために必要に応じてペースを落とすと述べていた。Cyberの承認制は、その方針の具体例だと位置づけられる。", "2026-11-05", "SW Architect / OpenAI発表", "https://www.swarchitect.net/en/ai-launches-2026-11/"], ["GPT-6 Astraが別モデルの重みを直接編集し数学精度が7.9%→48.1%に", "11月4日のCleartextのブリーフィングで紹介された、MITの研究として報じられた内容です。GPT-6 Astraが別のモデル（Qwen）の重み行列を直接読み、重要なパラメータを特定して書き換えたところ、数学ベンチマークの精度が7.9%から48.1%に上がったとされます。変更したのは全体の0.016%のみで、再学習も勾配降下も行っていません。ファインチューニングとは異なる「重み空間プログラミング」という手法の報告です。", "11月4日のCleartextのブリーフィングで紹介された研究です。MITの研究として報じられており、GPT-6 Astraが別のモデル（Qwen）の内部を直接「手術」したという内容で注目を集めました。\n\nまず用語を押さえます。重みとは、モデル内部に並ぶ膨大な数値パラメータのことで、行列の形で保持されています。通常、モデルの振る舞いを変えるにはファインチューニング、つまり追加の学習（勾配降下）でこれらの数値を少しずつ調整します。今回の手法はそれとは異なり、AstraがQwenの重み行列を直接読み、どのパラメータが重要かを見極めて、狙った箇所だけを書き換えたとされています。「重み空間プログラミング」と呼ばれる所以です。\n\n結果として、数学ベンチマークの精度が7.9%から48.1%に上がったと報じられています。変更したのは全体の0.016%のみで、再学習も勾配降下も行っていません。膨大なパラメータのうち、ごく一部が特定の能力に大きく効いている可能性を示す結果です。\n\n留保も重要です。この編集はゼロショットではありません。前向き計算（モデルを実際に走らせて出力を確かめる計算）や、練習問題の利用が前提でした。また、試行回数が少ない場合は改善が乏しかったことも報告されています。つまり「一度読み取って一発で直した」という話ではなく、試行と確認を伴う工程だった、という読み方が正確です。\n\nそれでも、ファインチューニングとは異なる「モデルがモデルを手術する」手法として、今後追うべきテーマだと番組は位置づけています。能力改善の手段が「学習させる」以外にも広がり得ることを示した点に、この報告の面白さがあります。\n\n勾配降下とは、学習の際にモデルの誤差を減らす方向を計算し、パラメータを少しずつ動かしていく手続きのことです。通常の学習もファインチューニングも、この仕組みの上に成り立っています。今回はその過程を一切使わず、完成済みのモデル内部の数値を直接書き換えたという点が、異例だといわれる理由です。\n\nなお、この内容はブリーフィング番組で紹介された研究の報告であり、詳細な条件や再現性の検証は今後の続報を待つ段階です。精度の跳ね上がりという数字だけを切り取らず、前提となった試行の回数や練習問題の使い方とセットで読む必要があります。", "2026-11-04", "Cleartext AI Revolution", "https://www.cleartext.fm/ai/episodes/2026-11-04"], ["Tencent Hy4正式リリース — 初の視覚対応Hunyuan旗艦、重みは「近日」公開", "Tencentが11月4日、言語モデルHy4の正式リリースを発表した。同社Hunyuanライン初の視覚理解対応モデルで、画像や図表の読み取りに加え、GUIとコマンドラインの両方でコンピュータを操作できる。Artificial Analysisの知能指数は34.6。価格は低めに設定されたが、モデルの重みはまだ公開されておらず、「近日中」とされる。価格は供給元で幅があり、TokenHubでは年末まで半額だ。", "概要\nTencentは11月4日付の公式投稿で、言語モデルHy4の正式リリースを発表した。8月28日のPreview版に続く正式版で、Tencent CloudのTokenHubのほか、WorkBuddy、CodeBuddy、Yuanbao、WeCom、imaといった自社サービスに組み込まれた。APIはOpenRouterなど外部プラットフォームからも利用できる。\n\n背景\nTencentは自らHy4を「世界の主要なオープンソースモデルに並ぶ」と位置づける。ただし記事本文では、モデルの重みとシステムカードを「近日中に」公開すると述べるにとどまり、具体的な日付は示されていない。Hugging Faceのtencent/Hy4は11月6日朝時点で非公開で、小型版のHy4 Flashも「近日リリース予定」とされる。\n\n詳細\nHy4はHunyuanラインで初めて視覚理解に対応し、画像、図表、視覚的な数学問題を扱える。さらにGUIとコマンドラインの両方でコンピュータを操作する能力を持つ。Artificial Analysis（AA）のモデルページではコンテキスト長100万トークン、出力速度は毎秒94トークンとされる。AA知能指数v5では34.6で、首位のKimi K3.1 Pro（46.5）を11.9ポイント下回る。Tencentの自己申告では、金融分野の専門家ブラインド評価（213人、579タスク）でHy4が3.04と、DeepSeek-V4.1-Flash（2.97）などを上回った。内部測定の幻覚率も12.95%から7.2%に下がったという。\n\n価格\n価格は情報源で異なる。AAは100万トークンあたり入力0.83ドル／出力2.50ドル、Tencentの投稿はPreviewと同じ約0.90／2.70ドル、OpenRouter上のTencent Cloud価格は0.417／1.251ドルと表示されている。TokenHubは年末まで50%割引中だ。\n\nポイント・注意点\n注目点は、中国の大手プラットフォーム企業が視覚とコンピュータ操作を備えた旗艦モデルを低価格で出したことだ。一方で、重みが未公開のためAAはHy4をプロプライエタリに分類しており、「オープン」をうたうかどうかは重みの公開を待つ必要がある。性能数値も現時点では同社の自己申告が中心で、独立した検証はこれからだ。", "2026-11-04", "SW Architect / Tencent発表", "https://www.swarchitect.net/en/ai-launches-2026-11/"], ["Meituan、LongCat-2.5を発表 — 1.6兆パラメータ、国産チップで学習したマルチモーダルMoE", "Meituanが11月2日、LongCat-2.5を技術ブログで発表した。総パラメータ1.6兆、アクティブ約48Bの巨大MoEで、視覚を多段階の離散トークンとして扱うネイティブ・マルチモーダル設計を採る。コンテキストは100万トークン。長期のエージェント型コーディングや視覚的コーディング、デザイン、3Dを用途に掲げ、学習と推論は国産アクセラレータ上で行われたとされる。", "概要\nMeituanは11月2日付の技術ブログでLongCat-2.5を発表した。総パラメータ1.6兆、トークンごとにアクティブになるのは約48B。視覚情報を多段階の離散トークンとして取り込むネイティブなマルチモーダルモデルで、コンテキスト長は100万トークンだ。\n\n背景\n中国の消費インターネット大手が巨大モデルを出す流れが続いている。Meituanは生活サービスの大手だが、LongCatシリーズで基盤モデル開発を本格化させており、今回は学習とW4A4推論の両方を国産アクセラレータ上で実施したと明記した点が特徴だ。輸出管理の文脈で、計算資源の調達先がモデルの売り文句になる時代を映している。\n\n詳細\n用途として掲げるのは、長期間にわたるエージェント型コーディング、視覚的コーディング、デザイン、3Dだ。プロモーション価格のAPIは100万トークンあたり、非キャッシュ入力0.30ドル、キャッシュ入力0.006ドル、出力1.20ドルとされる。China AI Ledgerの価格比較では、Flash級とKimi Pro級の間の価格帯に位置する。\n\nなぜ注目か\n1.6兆という規模、マルチモーダル、100万コンテキストという仕様は、中国のオープン寄り巨大モデルの標準装備になりつつある。親会社の事業基盤を持つプレイヤーがこの規模を出してきたことで、競争は研究機関系ラボだけのものではなくなっている。\n\nポイント・注意点\n現時点の情報はMeituanの技術ブログと価格ページが中心で、独立したベンチマーク評価はこれからだ。重みの公開範囲やライセンスなど、外部の開発者がどこまで使えるかも続報を待ちたい。\n\n書きぶりにも注目したい。Ledgerは、学習と推論を国産の計算資源で回したという記述が、中国の巨大モデル発表では今や「標準の一文」になったと評している。性能や価格と同じ水準で、計算資源の出自がモデルの物語の一部になっている。Meituanのように本業が消費向けサービスの企業がこの規模を出すこと自体、基盤モデル競争の裾野の広がりを示している。", "2026-11-02", "China AI Ledger / Meituan技術ブログ", "https://medium.com/@dev.hashmap/china-ai-ledger-2-kimi-k3-1-pro-weights-apple-qwen-and-tencent-hy4-cc8ecba7037c"], ["Apple Intelligenceが中国で始動 — Siriや作文ツールにAlibabaのQwenを搭載", "Appleは中国向けApple Intelligenceの第一弾を発表した。開発者ベータは11月4日から、一般向けは12月のiOS 27.3で提供される。端末上の機能はApple自社モデルが担う一方、パートナーのAlibabaのQwenをSiriや作文ツール、Visual Intelligenceから呼び出せる構成で、中国市場向けに大手テックのモデルが世界の消費者向けOSに入る初の本格事例となる。", "概要\nAppleの中国ニュースルームは10月31日、Apple Intelligenceの第一弾機能を発表した。iOS開発者ベータは11月4日に始まり、中国の一般ユーザーには12月のiOS 27.3で提供される。ライブ翻訳、作文ツール（Writing Tools）、Visual Intelligence、クリーンアップ、Genmoji、メールや通知の要約、より自然なSiriといった機能が含まれる。\n\n背景\n中国では生成AIサービスに規制当局への届出が必要で、Appleは現地パートナーと組む道を選んだ。今年に入ってからのCAC（国家インターネット情報弁公室）への届出を経て、今回の開始にこぎ着けたとされる。中国のラボのモデルが世界的な消費者向けOSの中核機能に入る、最も明確な商業事例だとChina AI Ledgerは評している。\n\n詳細\n端末上で動く機能はApple自社の生成モデルが担う。一方でAlibabaと提携し、中国のユーザーはSiri、作文ツールの「Compose with Qwen」、Visual Intelligenceの「Ask Qwen」を通じてQwenを呼び出せる。写真やPDFについての質問にも対応する。利用はオプトイン方式で、Alibabaはリクエストと応答を学習に使わないとしている。\n\n注意点\n今回の提供には、WWDC 2026で発表された次世代のApple Intelligence機能や「Siri AI」は含まれない。あくまで第一弾の機能セットであり、目玉のSiri刷新は別途のタイミングになる。\n\nポイント\nAlibabaにとっては巨大な流通経路の獲得であり、Appleにとっては規制対応とパートナー確保の両立だ。中国市場でAI機能を出すための「現地モデル連携」という型が、今後ほかの海外メーカーにも広がるかどうかが焦点になる。日本を含む他地域の提供形態とは異なる点にも注意したい。\n\n提供の段階設定にも目を向けたい。まず開発者ベータで検証を進め、12月の一般提供に広げる順序は、規制対応と品質確認を両立させるための進め方だ。中国のユーザーが世界の主要OSのAI機能に触れる最初の機会になるだけに、初期の使われ方が今後の展開を左右する。", "2026-10-31", "China AI Ledger / Apple中国発表", "https://medium.com/@dev.hashmap/china-ai-ledger-2-kimi-k3-1-pro-weights-apple-qwen-and-tencent-hy4-cc8ecba7037c"], ["快手の動画生成AI「Kling」、約198億元の資金調達を完了 — 評価額は150億ドル規模", "Kuaishou（快手）の動画生成AI事業Klingが、約198億元（約29億ドル）の資金調達を完了した。7月に設定された上限204.5億元には届かなかったものの、プラットフォーム子会社級の大型調達だ。Alibaba CloudやBaidu、国のAIファンドなども参加したとされ、Klingの2026年第2四半期の売上は8.5億元を超えたと報じられている。上場条件に関する条項も注目点だ。", "概要\nKuaishouが10月30日に提出した書類によれば、北京Klingは約198.0億元（約29億ドル）の出資申込を完了した。7月に設定された上限204.5億元は下回った。Kuaishouの投資ビークルLucky Labsは調達後も株式の66.68%、議決権の52.45%を保持する。\n\n背景\nKlingはKuaishou傘下の動画生成AI事業で、テキストや画像から動画を作るサービスとして急成長してきた。7月時点の資料では取引前の評価額は150億ドルとされた。今回の参加者として報道に名前が挙がるのはKingdee、MetaXなどで、Alibaba Cloud、Baidu、国のAIファンドも参加者に含まれるとされる。\n\n詳細\nKlingの2026年第2四半期の売上は8.5億元を超えたと報じられている。投資家にはIPOに連動した償還権が付いており、上場条件が満たされなければ年8%の単利で償還を求められる条項があるという。\n\nなぜ注目か\n動画生成は計算コストが大きく、プラットフォーム子会社の規模で資金を集める段階に入った。親会社の流通力と外部資本を組み合わせる形は、中国の基盤モデル事業の資金調達の型の一つになりつつある。\n\nポイント・注意点\n償還条項は上場への時計が動いていることを意味し、今後のIPO日程と条件が焦点になる。なお本記事はデータの紹介であり、投資判断の助言ではない。評価額や参加者の顔ぶれは報道ベースの情報で、最終条件は公式開示で確認したい。\n\n今後の焦点は上場への道筋だ。償還条項は、投資家が出口の時期に敏感であることを示す。動画生成は学習にも推論にも計算コストが重く、売上の伸びと資金消費のバランスが常に見られる領域だ。親会社Kuaishouの流通とブランドを持ちながら、独立した上場主体として評価されるかどうか。参加者に国のAIファンドが含まれる点も、この事業が産業政策の文脈に置かれていることをうかがわせる。\n\n調達額が上限に届かなかった点も、熱狂一辺倒ではない投資家の温度をうかがわせる。", "2026-10-30", "China AI Ledger / 快手開示資料", "https://medium.com/@dev.hashmap/china-ai-ledger-2-kimi-k3-1-pro-weights-apple-qwen-and-tencent-hy4-cc8ecba7037c"], ["Mistral Large 4の重みが公開 — コンテキストはLarge 3の4倍、100万トークンに", "Mistral AIが10月29日、Large 4の重みを公開した。10月6日にAPIプレビューが始まっていた同モデルのダウンロード提供で、コンテキスト長はLarge 3の256Kから4倍の100万トークンに拡大。価格は100万トークンあたり入力0.70ドル／出力2.10ドルに設定された。今後はこのモデルを土台に、特化型モデルの世代が展開されるという。欧州発のオープンな旗艦としての存在感もある。", "概要\nMistral AIは10月29日、旗艦モデルLarge 4の重みを公開した。Large 4は10月6日にAPIプレビューが始まっており、今回でダウンロードして使える形が加わった。価格は重み公開に合わせて100万トークンあたり入力0.70ドル／出力2.10ドル（キャッシュ入力0.07ドル）とされた。\n\n背景\n前世代のLarge 3にはAA知能指数v5の測定がないため、性能の直接比較は難しい。代わりに公表されているのはコンテキストと価格の変化で、コンテキストは256Kから100万トークンへ4倍に広がり、価格は1.4倍になった。長文脈を必要とする用途を正面から取りに来た更新だ。\n\n詳細\nAA知能指数v5では26.1（High）、タスクあたりコストは2.06ドルとされる。Mistralは、Large 4が新しい特化型・最適化モデルの世代の土台になると表明している。サイバーセキュリティ向けの派生モデルは、企業のデザインパートナー限定でプレビュー中だ。完全な技術レポートは「近日公開」とされる。\n\nなぜ注目か\n欧州のラボとして、旗艦の重みを公開する姿勢を維持した点が大きい。100万トークンの文脈と控えめな価格は、長い文書やコードベースを丸ごと扱う用途で選択肢になる。\n\nポイント・注意点\n知能指数の絶対値は最上位グループには届いておらず、性能最優先なら他社旗艦が上だ。Large 4の価値は、公開された重み、長文脈、価格の組み合わせにある。技術レポートが出れば、学習や設計の詳細も含めて評価が固まってくる。\n\nもう一つの文脈は、欧州発のオープンな旗艦という位置取りだ。米中の巨大モデルがAPI中心に閉じていく中で、重みを公開し続ける大手は限られる。特化型の派生をこの土台から展開するという宣言は、単発の公開ではなく、モデル群としてのエコシステムを作る意図の表れだ。サイバーセキュリティ版がパートナー限定プレビューというのも、能力の高い派生ほど出し方を慎重にする最近の型に沿っている。\n\n重みの公開はAPIプレビュー開始から約3週間後のことだった。", "2026-10-29", "SW Architect / Mistral発表", "https://www.swarchitect.net/en/ai-launches-2026-11/"], ["Gemini 4 Carbonが首位を維持 — AA知能指数60.0、ただし利用はサイバー防衛関係者のみ", "Googleが10月28日に発表したGemini 4 Carbonは、Artificial Analysisの知能指数v5で60.0を記録し、言語モデルの首位を維持している。同シリーズのArgonを9.6ポイント上回り、タスク単価も約22%安い。ただしアクセスはサイバー防衛関係者に限られたままで、一般の開発者や企業向けの提供時期は示されていない。11月上旬のランキングでもこの構図は変わっていない。", "概要\nGemini 4 CarbonはGoogleが10月28日に発表した最上位の言語モデルだ。Artificial Analysis知能指数v5のHigh設定で60.0を記録し、11月上旬時点でも言語モデルの首位に立つ。同じGemini 4シリーズのArgon（High、50.4）を9.6ポイント上回る。\n\n背景\nGoogleはGemini 4シリーズを段階的に出しており、Argonは10月13日に一般提供が始まった。一方、Carbonは発表以来、サイバー防衛関係者に利用を限定した状態が続く。最強モデルをまず防御側に渡すという出し方は、能力とリスクのバランスを取るための意図的な段階設定と見られる。\n\n詳細\n価格は導入価格で100万トークンあたり入力2ドル／出力10ドル、その後は4ドル／20ドルになる（終了日は示されていない）。タスクあたりコストはAAの試算で7.76ドルで、Argonの9.95ドルより約22%安い。導入価格で換算すると約3.88ドルになる。性能が高いのに単価が安いという、通常とは逆の関係になっている。\n\nなぜ注目か\n11月4〜5日にHy4やGPT-Image-2.6など新モデルが相次いでも、言語モデルの序列は動かなかった。首位モデルの利用が限定されているため、実務では「最も賢いモデルは存在するが使えない」という状況が続いている。\n\nポイント・注意点\nGoogleは開発者、企業、消費者への提供を「近日中」とするが日付はない。Argonの導入価格は11月30日までで、12月1日から4ドル／20ドルに上がる点も、使い分けを考える際の材料だ。Carbonの一般提供が始まるまでは、AAの数値はあくまで到達点の目安として見るべきだろう。\n\n開発者にとっての実務的な意味は、当面は「計画に入れられない最強モデル」だということだ。AAの首位は設計の到達点を示すが、製品に組み込めるのはArgonなど提供中のモデルに限られる。Googleが「近日中」と言い続ける間、競合の旗艦がその座を狙う構図も続く。Carbonの一般提供の時期は、年末のモデル選びを左右する変数の一つだ。", "2026-10-28", "SW Architect / Google発表", "https://www.swarchitect.net/en/ai-launches-2026-11/"]], "gh-pop": [["NVIDIA/auto-ontology — エージェントに「認定済みの指標定義」を渡す基盤", "NVIDIAのオープンライブラリ。企業のメタデータからオントロジーを構築し、 conflictingする指標定義を調整したうえで、MCP・CLI・API経由で分析エージェントに提供する。質問は認定済み定義と照合されてSQLになり、回答には由来が付く。スター獲得ペースが1日360から1,500へ跳ね上がり、計測史上最大級の加速としてWhatsTrendingが報告した。", "概要\nNVIDIA/auto-ontologyは、企業のメタデータを分析エージェント向けの「文脈レイヤー」に変えるオープンライブラリだ。メタデータからオントロジー（概念と関係の体系）を構築し、部門ごとに食い違う指標定義を調整し、MCP、CLI、APIのいずれかで公開する。\n\n詳細\nエージェントが投げた質問はSQLに変換され、認定済みの指標定義とデータの系譜（lineage）と照合される。回答には由来（provenance）が必ず付く。つまり「売上」という言葉が会社の中で何を指すかを、エージェントが勝手に解釈せず、認定済みの定義で答えるための基盤だ。\n\n数字\nWhatsTrendingの計測では、11月4〜9日の5日間で7,502スターを獲得し、ペースは1日360スターから1,500スターへ上昇した。これは同サービスの計測で最大の自己加速幅だ。11月9日時点のスター総数は10,360。GhTrendsの週間集計（11月2〜8日）でも9,584スターを集めている。\n\nなぜ注目か\n分析エージェントの失敗の多くは、モデルの能力ではなく「指標の意味の不一致」から来る。定義の正典を先に作るという地味だが効くアプローチが、大企業のデータ基盤担当者の共感を呼んだと見られる。\n\nポイント・注意点\n効果はメタデータの整備度に依存する。定義の調整（認定）自体は組織的な作業であり、ツールを入れれば自動で終わるものではない。まず自社の指標定義がどれだけ散らかっているかを確認するところから始めたい。\n\n企業データの現場では、「売上」の定義が部門ごとに違うことは珍しくない。四半期の切り方、返品の扱い、社内取引の相殺――食い違いの置き場は無数にある。分析エージェントがそのままSQLを書けば、もっともらしいが定義の違う数字が返ってくる。auto-ontologyが認定済み定義を先に固定するのは、この種の静かな事故を防ぐためのものだ。GitTrendも「データ上に意味的でグラフベースの推論レイヤーを構築するフレームワーク」と分類している。", "2026-11-09", "WhatsTrending Acceleration Report", "https://whatstrending.ai/repos/weekly"], ["google/elephant-goldfish-model — 仕様は「全知の書き手」と「何も知らない査読者」で作る", "Googleが公開した、コードの前に設計を行うためのオープンソース・プラグイン。深い文脈を持つエージェントが仕様の草案を書いたあと、文脈ゼロの査読サブエージェントが草案を白紙の状態で読み、暗黙の前提を突く。人間がトレードオフを決めて承認するまで、コードは存在しない。Claude Code、Codex、Antigravityに導入でき、スターは約1.5万に伸びた。", "概要\ngoogle/elephant-goldfish-modelは、Googleが公開した「設計してからコードを書く」ためのオープンソース・プラグインだ。名前は、全部を覚えている象と、すぐ忘れる金魚の対比を思わせる。Claude Code、Codex、Antigravityにインストールできる。\n\n詳細\n流れはこうだ。まず深い文脈を持つエージェントが、これから作る機能の仕様草案を書く。次に、文脈ゼロの査読サブエージェントがその草案を冷たい目で読み、書かれていない前提を突く。最後に人間がトレードオフを判断し、承認する。コードが存在するのはその後の話だ。\n\n数字\nWhatsTrendingの計測では11月4〜9日の5日間で3,774スターを獲得し、スター総数は15,058に到達した。前週の速い組には入っていなかった新規の顔で、絶対ペースの上位10件に食い込んでいる。\n\nなぜ注目か\nエージェントにいきなり実装させる失敗の多くは、仕様の前提が共有されないまま進むことから来る。「書く側は全知、読む側は無知」という役割分担で前提を炙り出す設計は、レビューの仕組み化として汎用性がある。\n\nポイント・注意点\n仕様フェーズに時間を割く分、小さなタスクでは過剰になり得る。査読サブエージェントの指摘を採用するかどうかは結局人間の判断であり、承認のボトルネックが移るだけにならない運用が要る。\n\n象と金魚の対比が示すのは、記憶の非対称を意図的に作ることだ。書く側は文脈を抱えすぎると前提を省略しがちで、読む側が何も知らないからこそ、書かれていない前提が浮かび上がる。人間同士の設計レビューでも起きるこの現象を、エージェントの役割分担として型にした点に新規性がある。承認を人間が握る設計も、暴走を防ぐ安全弁として素直だ。\n\n仕様駆動の開発支援は、GitHubのspec-kitのようなツール群でも勢いがある領域だ（GitDiscoverの週間集計でもspec-kitは上位に入っていた）。コード生成の速度が上がるほど、間違った仕様を速く実装する失敗のコストも上がる。前工程に査読を挟む設計は、その失敗への保険として位置づけられる。", "2026-11-09", "WhatsTrending Acceleration Report", "https://whatstrending.ai/repos/weekly"], ["morluto/rea — エージェントにアプリを渡すと仕組みを解読", "GhTrendsで今週もスター増加数1位を維持するmorluto/reaは、ソースコードのないソフトウェアをコーディングエージェントに調べさせるためのツールキットです。ネイティブバイナリ、Webサイト、Electronアプリ、.NETアセンブリなどを対象に、機能がどう動くかを再構成し、すべての主張に根拠と限界を添えて返します。週間ランキング（11月2〜8日）では+24,105スターで首位となり、「エージェントに調べさせる」用途の代表格になっています。", "GhTrendsの11月7日版で1位、週間ランキング（11月2〜8日）でも+24,105スターで首位を維持したのがmorluto/reaです。11月6日の確定した集計窓でも1日+3,390スターを集めており、勢いが続いています。\n\nreaは、ソースコードのないソフトウェアをコーディングエージェントに調べさせるためのツールキットです。手元にあるけれど中身の分からないプログラムについて、「この機能はどういう仕組みで動いているのか」をエージェントに調査させ、説明として受け取る、という使い方を想定しています。\n\n対象は幅広く、ネイティブバイナリ、Webサイト、Electronアプリ、.NETアセンブリなどが挙げられています。ネイティブバイナリの解析にはHopperやGhidraといった既存の解析ツールが使われます。解析はローカルで実行され、同じツールをターミナルから直接使うこともできます。実装はTypeScriptです。\n\n設計で目を引くのは、結論の出し方です。機能の仕組みを再構成して返す際に、すべての主張に根拠と限界を添えることになっています。エージェントの調査結果は流暢でも当てにならないことがあるため、「どこまで分かり、どこからが推測か」を明示させる工夫は、実務で使ううえでの信頼性に直結します。\n\nreaの人気は、エージェントの仕事が「コードを書く」ことから「既存のものを理解する」ことへ広がっている流れを象徴しています。ソースを失った社内ツールや、仕様書のないレガシーシステムの棚卸しなど、現実の現場には「調べる」仕事が大量にあります。試す場合は、まず小さなツールを対象に、根拠付きの説明がどこまで当たるかを検証しながら読むのが向いています。\n\n補足すると、HopperやGhidraは、機械語を人間が読める形へ戻すための解析ツールで、リバースエンジニアリングの現場で長く使われてきました。reaは、その専門的な工程の担い手を、人間からエージェントへ広げたものと見ることができます。\n\nGhTrendsの読みどころメモでも、上位3件の顔ぶれは変わらなかったとされており、reaの首位は一過性の話題ではなく、継続した関心の表れだと読み取れます。", "2026-11-08", "GhTrends Daily", "https://www.ghtrends.dev/daily/2026-11-07/"], ["storytold/craft-anything — アプリやゲームを調べ、自分の版を作る", "週間・日次ともに2位を維持するstorytold/craft-anythingは、アプリやゲームの仕組みを実地調査ツールで調べたうえで、指定した技術スタックで自分のバージョンをエージェントに作らせるリポジトリです。純粋なRust製で、見える範囲の情報だけから再現するクリーンルーム方式が特徴です。「理解してから作る」という流れが、単なるコード生成と違う点として評価されており、隣のreaと並んで人気を集めています。", "storytold/craft-anythingは、GhTrendsの週間・日次ランキングともに2位を維持するリポジトリです。11月7日版の日次でも2位につけ、11月6日の集計窓では+2,842スターを集めました。首位のreaとテーマが隣り合っており、この2つが今週の「調べるエージェント」人気を分け合う形です。\n\n考え方は明快です。まず対象のWebサイト、アプリ、ゲームがどう動くかを、実際の検査ツールを使って調べます。その理解をもとに、利用者が指定した技術スタックで自分のバージョンをエージェントが構築し、原物と突き合わせながら磨いていきます。「理解してから作る」という順序が、思いつきでコードを生成するのと違う点として評価されています。\n\n技術的には、純粋なRust製のクリーンルーム・エンジンです。クリーンルーム方式とは、内部の実装を覗き見るのではなく、外から見える振る舞いだけを手がかりに再現するやり方を指します。ビルドは利用者自身のClaude Codeを通じて実行され、用意された314のツールはCLIとしてもMCPとしても使えます。\n\nreaとの違いを整理すると、reaは「解読して、根拠つきで説明する」ところまでを担い、craft-anythingは「調べてから、自分の版を作る」ところまで進むプロジェクトです。調べるだけでは足りず成果物が欲しい場合に、こちらが選択肢になります。\n\nなお、プロジェクトは初期アルファの段階です。完成度は発展途上にあるため、試す場合は小さな対象から始め、原物との突き合わせ結果を見ながら進めるのが現実的です。\n\nクリーンルーム方式には、もう一つの意味合いもあります。元の実装を見ずに仕様と振る舞いだけから作り直すため、成果物が元のコードのコピーにはならない、という考え方に立つ設計です。調べる対象と作る成果物の間に、明確な線を引いています。\n\n生成して終わりではなく、原物と突き合わせて差分を潰していく工程が品質を左右します。エージェントに「作らせる」だけでなく「比べさせる」ところまで含めた設計が、このプロジェクトの主張です。週間ランキングでreaに次ぐ2位という位置は、「理解する」ことへの関心が「生成する」ことへの関心に並び始めたことを示しています。", "2026-11-08", "GhTrends Weekly", "https://ghtrends.dev/weekly/"], ["cloudflare/security-audit-skill — エージェントをセキュリティ監査人に", "Cloudflareが公開したcloudflare/security-audit-skillは、コーディングエージェントをセキュリティ監査人に変えるスキルです。まずコードベースの構造と信頼境界を地図化し、未調査の領域には独立した探索エージェントを送り、見つかった候補は別の新しい検証エージェントが否定を試みます。検証を残ったものだけがレポートに載る二段構えで誤検知を減らす設計が注目され、日次ランキングで3位に入りました。", "cloudflare/security-audit-skillは、Cloudflareが公開したスキルで、コーディングエージェントをセキュリティ監査人に変えるものです。GhTrendsの日次ランキングで3位に入り、11月6日の集計窓では+2,265スターを集めました。スキルとしてインストールして使う形で、実装はJavaScriptです。\n\n仕組みは段階を踏みます。最初に、コードベースのアーキテクチャと信頼境界を地図化します。信頼境界とは、システムの中で「ここから先は信用できる入力、ここからは信用できない入力」と線を引く場所のことで、脆弱性はこの境界の扱いを誤ったところに生まれやすいとされます。全体像を先に描くことで、監査の抜け漏れを減らす狙いです。\n\n次に、まだ調査されていない領域には、独立した探索エージェントが送り込まれます。そして候補が見つかると、別の新しい検証エージェントがその候補を引き継ぎ、今度はそれを否定しようと試みます。否定を生き残ったものだけが、完全なソース追跡とともにレポートに載ります。\n\nこの「自分で自分の発見を交差検証させる」設計が、ブログやSNSでも特に注目されています。エージェントによる監査の弱点は、もっともらしい誤検知を大量に出すことですが、発見役と検証役を分け、検証側に反証の役割を与えることで、その問題に正面から対処しています。\n\n試す際は、自分のコードベースの限定された範囲から始めるのが現実的です。レポートに残るのは検証を通過した候補だけなので、読み解く側の負担が下がる点も実務上の利点です。\n\nここで「スキル」とは、エージェントに特定の役割と作業手順をまとめて与える仕組みのことです。今回はその中身がセキュリティ監査であり、普段のコーディングエージェントが、インストールするだけで監査人の手順に沿って動くようになります。\n\n地図化の段階では、コードベースのどこが未調査かも可視化されるため、監査の範囲そのものを人が確認しやすくなります。監査は、間違えると実害が出る用途です。だからこそ、この「疑ってかかる検証役」の仕掛けは、セキュリティに限らず、他のエージェント活用にも転用できる考え方として注目されています。", "2026-11-08", "GhTrends / Ageshio", "https://ageshio.dev/"], ["vercel-labs/agent-browser — AIエージェント向け高速ブラウザCLI", "11月8日のトレンドで1位になったvercel-labs/agent-browserは、AIエージェントにブラウザ操作をさせるためのネイティブRust製CLIです。Chrome for Testingのバイナリを自分で管理するため、重い自動化スタックを用意しなくても、エージェントにブラウザ制御を組み込めます。導入はnpm、Homebrew、Cargoのいずれかから可能で、当日+190スターを集めました。エージェントの周辺インフラの軽量化を示す1件です。", "Ageshioの11月8日版で当日1位になったのが、Vercel Labsのvercel-labs/agent-browserです。当日+190スターを集めました。\n\n役割をひと言でいうと、AIエージェントにブラウザ操作をさせるための道具です。エージェントがWebページを開き、内容を読み、必要な操作を行うには、チャットやコード生成とは別に、ブラウザを制御する層が必要になります。いわばエージェントの「目と手」にあたる部分です。\n\n実装はネイティブRust製のCLIで、軽量さが売りです。特徴として、Chrome for Testing（自動化用途に用意されたChrome）のバイナリをツール側で自分で管理します。利用者がブラウザ本体の調達やバージョン合わせに悩まされずに済むため、導入と運用の摩擦が下がります。\n\nインストールはnpm、Homebrew、Cargoのいずれからでも可能です。主要なパッケージ管理の経路が一通り揃っているため、既存の開発環境に組み込みやすい形になっています。\n\n重い自動化スタックなしにエージェントへブラウザ制御を組み込みたい開発者向けのプロジェクトで、エージェント本体の進化と並行して、こうした周辺インフラの整備と軽量化が進んでいることを示す事例です。本格的な自動化基盤を組む前の小さな検証や、エージェントにWeb調査をさせる用途の足場として注目されています。\n\nエージェントがブラウザを使う場面は、情報収集だけではありません。Webアプリの画面を開いて動作を確認したり、フォームへの入力やクリックといった操作を行ったりと、「ソフトウェアを実際に触って確かめる」工程全般に広がっています。\n\nChrome for Testingは、自動化やテストの用途に向けて安定したバージョンで提供されるChromeです。普段使いのChromeとは別に用意されるため、自動更新で挙動が変わるといった事故を避けられます。その調達と管理をCLI側が担う設計により、利用者はブラウザのバージョン差異を意識せずに済みます。\n\nCLIという形式も見逃せません。画面を持つアプリではなくコマンドで叩ける道具であるため、エージェントの処理の流れの中へ組み込みやすく、スクリプトからの自動実行とも相性が良い形です。", "2026-11-08", "Ageshio Radar", "https://ageshio.dev/"], ["pingdotgg/t3code — すべてのコーディングエージェントを操る「一つの操作盤」", "T3チームによるオープンソースのコントロールサーフェス。自分のマシンに入っているClaude Code、Codex、Cursor、Grok Build、OpenCodeなど複数のコーディングエージェントを、スマホ・Web・デスクトップの各アプリから自分のサブスクリプションのまま操れる。11月2〜8日の週に13,534スターを集め、週間ランキング3位に入った。スター総数は5万を超えている。", "概要\npingdotgg/t3codeは、T3チームが公開したオープンソースのコントロールサーフェス（操作盤）だ。新しいエージェントをまた一つ提供するのではなく、すでに自分のマシンにインストール済みのコーディングエージェント群を、一つの画面から動かすための層を提供する。11月2〜8日の週間スター獲得数は13,534で、GitHub週間ランキングの3位に入った。\n\n詳細\n駆動できるエージェントはClaude Code、Codex、Cursor、Grok Build、OpenCode、Antigravity、fxなど。利用は自分のサブスクリプション経由で、モバイルアプリ、Webアプリ、Electron製デスクトップアプリのいずれからも操作できる。GhTrendsの解説では、賭けているのは性能とオープンさで、「もし方向性がぶれても、コードはすべてそこにありフォークできる」ことが売りだとされる。\n\n背景\nコーディングエージェントが乱立する中、開発者の手元では「どのエージェントにどのタスクをやらせるか」の管理自体が負担になってきた。t3codeはその統合レイヤーを狙う。リポジトリは2026年2月に作られ、スター総数は5万超（Findarepo調べでは約52K）に達している。\n\nなぜ注目か\nエージェントの競争が「単体の性能」から「束ねて使う体験」へ広がっていることの表れだ。既存記事のstablyai/orcaがワークツリー単位でエージェントを比較するのに対し、t3codeは日常の操作盤として常駐する位置を狙う。\n\nポイント・注意点\n自分のサブスクリプションを使う設計上、認証情報の扱いは各エージェント側の仕組みに委ねられる。対応エージェントの顔ぶれは変わりやすいので、導入時はREADMEで最新の対応状況を確認したい。\n\n読み解きの補助としてGhTrendsは、t3codeの賭けは性能とオープンさにあると評する。統合レイヤーは各エージェントの仕様変更に引きずられる立場でもあるが、すべてがオープンソースであるため、追随もフォークもコミュニティの速度で進む。操作盤の座を巡っては、ワークツリー比較に強いorcaのような競合もおり、「束ね方」の流儀の違いが見比べどころになる。", "2026-11-08", "GhTrends Weekly", "https://www.ghtrends.dev/weekly/"], ["vercel-labs/agent-desktop — アクセシビリティツリーでデスクトップを操るCLI", "Vercel Labsが公開した、AIエージェントにデスクトップ操作の「手」を与えるCLIとCライブラリ。OSのアクセシビリティツリー経由でアプリを読み取り、操作可能な要素ごとに安定した参照（ref）を返すため、ピクセルの座標当てに頼らずに操作できる。macOS、Windows、Linux対応で、11月2〜8日の週に12,126スターを獲得し週間4位に入った。", "概要\nvercel-labs/agent-desktopは、AIエージェントがデスクトップアプリを読み、操作するためのCLIおよびCライブラリだ。Vercel Labs製でRustで書かれている。11月2〜8日の週に12,126スターを集め、週間ランキング4位。スター総数は約19K（Findarepo調べ）に達した。\n\n詳細\n仕組みの核はOSのアクセシビリティツリーだ。スナップショットを取得すると、操作可能なすべての要素に安定したrefが付いたJSONが返る。エージェントはそのrefを指定して操作し、再度スナップショットを取って結果を検証する。画面のピクセルマッチングを使わないため、ウィンドウ位置や解像度の変化に強い。対応OSはmacOS、Windows、Linuxで、npmからインストールでき、x64とARM64のネイティブバイナリが同梱される。\n\n背景\nブラウザ操作の自動化は進んだが、ネイティブのデスクトップアプリはエージェントの空白地帯だった。既存記事のvercel-labs/agent-browserがブラウザ向けCLIだったのに対し、agent-desktopはその発想をOS全体へ広げたものだ。同じVercel Labsから両方が出ている点も興味深い。\n\nなぜ注目か\n「見て、指して、確かめる」という検証可能な操作ループを、座標ではなく意味のある要素参照で実現したことが評価されている。エージェントの到達範囲がブラウザの外へ広がる流れの代表例だ。\n\nポイント・注意点\nアクセシビリティツリーの情報量はアプリ側の実装に依存し、要素情報が乏しいアプリでは操作精度が落ちる。デスクトップ全体への操作権限を与える性質上、実行環境の分離や承認フローの設計は利用者側の責任になる。\n\nこの方式の利点は再現性だ。座標ではなく要素の参照で操作するため、同じ手順を繰り返し実行したり、失敗した箇所を特定したりしやすい。反面、アクセシビリティ情報の提供はアプリ側の作りに依存し、情報が欠けた要素はエージェントにも見えない。ブラウザ自動化でいうDOMの役割を、OS全体に広げる試みだと捉えると分かりやすい。", "2026-11-08", "GhTrends Weekly", "https://www.ghtrends.dev/weekly/"], ["mattpocock/skills — コードを書く前に「正しい質問」をさせるスキル", "TypeScript教育者Matt Pocock氏が公開した、コーディングアシスタント向けのスキル集。曖昧な要件のまま実装に走るのではなく、着手前に詳しい質問を投げて要件を固めることに振った内容で、氏の.agentsディレクトリから切り出された「実務家のためのスキル」をうたう。スター総数は31万を超え、11月2〜8日の週にも9,231スターを集めた。質問で要件を固めるという地味な工夫が、31万スターの支持を集めた。", "概要\nmattpocock/skillsは、コーディングアシスタントに「実装前に正しい質問をする」振る舞いを教えるスキル集だ。作者はTypeScriptの教育者として知られるMatt Pocock氏。GitDiscoverは「Skills for Real Engineers. Straight from my .agents directory（実務エンジニアのためのスキル。私の.agentsディレクトリからそのまま）」という紹介文を伝えている。\n\n詳細\n狙いは単純で、曖昧な依頼を受けたエージェントが間違ったものを作ってしまう前に、詳細な質問で要件を明確化させることだ。エージェントの能力不足ではなく「聞き取り不足」が失敗の原因になる場面は多く、そこに絞ったスキル設計になっている。主要言語はShellで、各種エージェント環境に組み込める形で提供される。\n\n数字\nスター総数は11月9日時点で318,491（WhatsTrendingのスナップショット）。11月4〜9日の5日間で7,072スターを集め、ペースも1日882から1,414へ加速している。GhTrendsの週間集計でも9,231スターで上位に入った。\n\nなぜ注目か\n派手な自律性ではなく「確認する謙虚さ」をスキルとして切り出した点が、実務開発者の実感に合致したのだろう。エージェントスキルという形式が、プロンプト集から「振る舞いの設計」へ進化している例でもある。\n\nポイント・注意点\n質問を増やすほど対話の往復は増える。要件が明確な小さなタスクでは過剰になる場合があり、使い分けは利用者側に委ねられる。自分のワークフローに合うスキルだけを選んで入れるのが現実的だ。\n\nスキルの中身が「質問」である点も象徴的だ。エージェントの道具立ては、検索、実行、生成へと広がってきたが、工程のいちばん上流にある「聞き取り」は長らく人間の勘に任されていた。失敗の芽を実装前に摘むこの位置取りは、コードレビュー以前の品質管理として、多くのチームの実感に合うのだろう。配布形式がスキルという軽い部品であることも、試しやすさにつながっている。", "2026-11-08", "GhTrends Weekly", "https://www.ghtrends.dev/weekly/"], ["D4Vinci/Scrapling — サイト改修に耐えるWebスクレイピング・フレームワーク", "Python製のWebスクレイピング・フレームワーク。単発のリクエストから大規模クロールまでを扱い、特長はページ構造が変わっても同じ要素を見つけ直そうとする適応型パーサーだ。小さなサイト改修のたびに収集スクリプトが壊れる問題への回答として支持を集め、スター総数は約10万に到達。11月2〜8日の週に7,979スターを獲得した。サイト改修で壊れる収集スクリプトの悩みに、正面から応えた。", "概要\nD4Vinci/Scraplingは、PythonのWebスクレイピング・フレームワークだ。Findarepoの説明では「単一のリクエストから大規模な処理まで何でも扱う最良のスクレイピング・フレームワーク」をうたう。スター総数は約100K（11月9日時点で99,855、WhatsTrending調べ）に達している。\n\n詳細\n最大の特長は適応型のパーサーだ。対象ページの構造が変わっても、以前に取得した要素と同じものを再発見しようと試みる。データ収集の現場では、サイトの小さなリデザインのたびにセレクタが壊れてスクリプトが止まることが日常茶飯事で、Scraplingはその痛点に正面から取り組んでいる。\n\n数字\nWhatsTrendingの計測では、11月4〜9日の5日間で5,072スターを獲得した。それ以前の計測ウィンドウがなく、突如として高速成長組に現れた形だ。GhTrendsの週間集計（11月2〜8日）では7,979スターを獲得し11位に入っている。\n\n背景\nエージェントがWebから情報を取る場面が増えるほど、収集層の信頼性が全体の品質を決める。LLMの推論部分ではなく、その手前の「確実に取る」部分への需要が伸びていることが、老舗ジャンルの再浮上を後押ししている。\n\nポイント・注意点\n適応型のパーサーといえども、サイト側の大幅な変更やアクセス制御には限界がある。対象サイトの利用規約やrobots.txtの確認、アクセス頻度の配慮といった、スクレイピング一般の作法は従来どおり必要だ。\n\n適応型パーサーの考え方は、人間が要素を探す手順に近い。クラス名が変わっても、テキストや位置関係といった複数の手がかりから「あの要素」を推測する。もちろん万能ではなく、ページの意味そのものが変われば追随できない。それでも、軽微な変更のたびに人間がセレクタを直す作業を減らせるなら、運用コストの差は大きい。GitDiscoverも「単一リクエストから本格的なクロールまで扱う包括的なフレームワークで、コミュニティの支えが育っている」と評している。", "2026-11-08", "GhTrends Weekly", "https://www.ghtrends.dev/weekly/"], ["deepseek-ai/deepseek-harness — 「すべてがプラグイン」のDeepSeek製エージェント基盤", "DeepSeek公式のエージェント・ランタイム。能力を交換可能なプラグインとして組み立てる設計を掲げ、実行用のWebインターフェースを備える。開発者プレビューの段階で、スター総数は27.6万に達し、11月2〜8日の週にも7,933スターを集めた。周辺にはAndroidクライアントや無料モデル用プラグインなど、コミュニティ製の派生プロジェクトが急速に育っている。", "概要\ndeepseek-ai/deepseek-harness（通称DSH）は、DeepSeekが公開したエージェント・ランタイムだ。キャッチフレーズは「Everything is a Plugin（すべてはプラグイン）」。エージェントの能力を差し替え可能な部品として構成し、Webインターフェースから実行できる。GhTrendsは開発者プレビューであり、実験する開発者向けにインターフェースの変更があり得ると注記している。\n\n詳細\n位置づけは、モデルの周りに「道具と実行環境」を組み立てる土台だ。この基盤の上に、後述するようなコミュニティ製の派生が次々に乗っている。リポジトリ自体は比較的新しく、GitTrendの週間分析では「創設から120日以内の新規参入」として上位50件に数えられた。それでいてスター総数は276K（Findarepo調べ）に達している。\n\n数字\n11月2〜8日の週に7,933スターを獲得し、週間12位（GhTrends）。基盤本体の成長に加えて、同じ週のランキングにはDSH向けのプロトタイプやクライアントが複数入り、エコシステムとしての厚みが見えた週になった。\n\nなぜ注目か\nモデルAPIの提供者が、自らエージェントの実行基盤まで公開する動きは、利用者を自社エコシステムに取り込む戦略だ。プラグイン形式は、その周りに第三者の部品市場を作るための布石でもある。\n\nポイント・注意点\n開発者プレビューであるため、プラグインのインターフェースや仕様は変わり得る。本番組み込みより、まず構成の考え方を学ぶ素材として触るのが向いている。派生プロジェクトを使う場合は、それぞれの出所と権限要求を確認したい。\n\nエコシステムの広がりは数字にも出ている。同じ週のランキングには、DSH向けの自律エージェント試作dsh-superagent-prototype、Androidクライアントdsh-Go、無料モデル用プラグインdsh-our-free-modelが並んだ。本体が速く伸び、周辺部品が即座に生えるという二段の成長は、プラットフォーム化しつつあるプロジェクト特有の姿だ。", "2026-11-08", "GhTrends Weekly", "https://www.ghtrends.dev/weekly/"], ["sherlock-project/sherlock — ユーザー名で400超のSNSを横断検索するOSINTの定番が再浮上", "2018年公開の老舗ツールが、週間ランキングに再び顔を出した。ユーザー名を一つ入れると400以上のソーシャルネットワークやサイトで同じ名前の登録を探し、結果をファイルやCSVに書き出す。OSINT調査の定番として定着しているPython製CLIで、スター総数は約10.2万。11月2〜8日の週に7,847スターを集めた。公開から8年近い老舗が、週間上位に返り咲いた。", "概要\nsherlock-project/sherlockは、ユーザー名からソーシャルメディアのアカウントを横断的に探すコマンドラインツールだ。400を超えるソーシャルネットワークやサイトを対象に、同一のユーザー名が登録されているかを調べ、一致をファイル、CSV、スプレッドシートに書き出す。\n\n詳細\n複数の名前を一度に渡すことも、特定のサイトだけに絞ることも、プロキシ経由で実行することもできる。GitDiscoverも「サイバーセキュリティとOSINTの専門家にとって価値のあるツール」と評している。自分のアカウントの棚卸しや、調査対象の公開情報の確認といった使い方が想定されている。\n\n数字\nリポジトリは2018年に作られた古参で、スター総数は約102K。GhTrendsの週間集計（11月2〜8日）では7,847スターを獲得して13位、GitTrendの分析でも8,376スターで上位に入った。公開から8年近く経っての再浮上だ。\n\n背景\nエージェント時代のツールが上位を占める週にあって、古典的なOSINTツールが伸びたのは示唆的だ。本人確認やなりすまし対策への関心の高まりと、エージェントに調査をさせる際の「手足」として実績のあるツールが再評価されている面がある。\n\nポイント・注意点\n同じ名前の別人が引っかかることは避けられず、一致はあくまで手がかりに過ぎない。調査対象や用途によっては法務・倫理上の配慮も必要で、自分のアカウントの確認など正当な目的の範囲で使うべきツールだ。\n\n息の長さの理由は、役割の分かりやすさにある。やることは一つ、名前から登録先を探すことだけだ。その単機能が、セキュリティ診断、なりすまし調査、自分のアカウント棚卸しといった複数の現場で使い回されてきた。AIエージェントが調査業務を担う場面でも、検証可能な実績のある古典ツールが「手」として選ばれやすい。新しい波が古い道具を持ち上げる、今週らしい一例だ。\n\n週間ランキングではAIエージェント系が並ぶ中で、古典的な調査ツールとして異彩を放った。", "2026-11-08", "GhTrends Weekly", "https://www.ghtrends.dev/weekly/"], ["JiaFeiMiao-K-Cat/DiscImageStudio — CDやBlu-rayの盤面に写真を「焼く」Windowsツール", "画像をCD、DVD、単層Blu-rayの物理的な制約に沿ったデータ配置に変換し、焼いたディスクの目に見える盤面に絵が浮かび上がるようにするデスクトップツール。Windows向けが本編で、LinuxとmacOS向けの実験的なCLI版もあり、ISOやRAW、WAV+CUEイメージをオフラインで生成できる。11月2〜8日の週に7,557スターを獲得した。AI一色のランキングで光る、物理メディアの職人芸。", "概要\nJiaFeiMiao-K-Cat/DiscImageStudioは、写真を光ディスクの「盤面アート」に変えるWindowsデスクトップツールだ。画像をCD、DVD、単層Blu-rayの物理的制約に合わせたデータ配置へ変換し、実際に焼いたディスクの目に見える面に画像が現れるようにする。\n\n詳細\n光ディスクはデータを螺旋状に記録し、記録の有無が光の反射を変える。その特性を逆用し、絵になるようデータの配置を設計するのが基本アイデアだ。実験的なコマンドライン版はLinuxとmacOSで動き、ISO、RAW、WAV+CUEのイメージをオフラインで生成でき、任意のライティングソフトで焼ける。\n\n数字\nGhTrendsの週間集計（11月2〜8日）で7,557スターを獲得し14位に入った。GitTrendの分析でも、創設から120日以内の新規参入として週間上位50件に数えられている。AIエージェント一色のランキングの中で、物理メディアを相手にした職人芸的なツールが目立つ存在になった。\n\nなぜ注目か\n実用性というより「仕組みの面白さ」が共有された形だ。記録メディアの物理層をハックする発想は、ストレージがクラウドに寄った時代だからこそ新鮮に映る。週間の多様性を示す一例でもある。\n\nポイント・注意点\n実際に盤面へ描くには対応するドライブとメディアでの書き込みが必要で、再生用データとしての実用は限定的だ。実験版CLIの対応範囲も発展途上と見られ、成果物はアートや実験として楽しむ位置づけが合っている。\n\n仕組みをもう少し噛み砕くと、ディスク上のデータの有無は反射率の違いとして読み取り側に見える。その分布を絵になるよう設計すれば、盤面に模様が浮かぶ。かつてドライブの記録面に絵を描く試みはあったが、本ツールは通常のデータ記録の物理制約に合わせて配置を計算する点に工夫がある。実用という物差しでは測れないが、「できる」ということ自体が面白さになる種類のソフトウェアだ。\n\n実装はC#で、Windows向けが本編という位置づけだ。", "2026-11-08", "GhTrends Weekly", "https://www.ghtrends.dev/weekly/"], ["debpalash/VoiceStudio — 完全ローカルのElevenLabs代替をうたう音声ワークスペース", "オープンソースの音声制作ワークスペース。音声デザイン、文字起こし、吹き替え、長編のナレーション制作までを一つのアプリで試せる。完全ローカル動作を掲げ、クラウド音声サービスの代替を狙う。スター総数は約10.4万に達し、11月2〜8日の週にも6,704スターを集めて上位に食い込んだ。対応言語や品質はエンジンとハードウェア次第とされる。制作の前工程を手元で回せる統合環境として支持を集めた。", "概要\ndebpalash/VoiceStudioは、オープンソースで完全ローカル動作を掲げる音声ワークスペーチだ。Findarepoは「オープンソースで完全ローカルなElevenLabs代替、音声クローン…」と紹介している。スター総数は約104Kに達している。\n\n詳細\n一つの作業画面で、音声デザイン、文字起こし、吹き替え、そして長編のナレーションものの制作まで、複数の音声ワークフローを自分の素材で試せる。GhTrendsの解説によれば、支える言語の範囲や出力品質は、選ぶエンジンとハードウェアに左右される。クラウドに音声を送らずに済む点が、未公開素材や個人情報を扱う制作現場には魅力になる。\n\n数字\n11月2〜8日の週に6,704スターを獲得（GhTrends調べ、週間17位）。Findarepoの7日間集計でも+7.0Kとほぼ一致しており、単発のバズではなく週を通じて伸びたことがうかがえる。\n\nなぜ注目か\n音声AIはクラウドAPIが主流だが、課金とプライバシーの両面からローカル回帰の需要が根強い。制作の前工程を手元で回せる統合環境は、その受け皿になる。\n\nポイント・注意点\n品質はエンジンとGPUなどのハードウェアに依存し、クラウド最高水準とそのまま互角とは限らない。音声クローンは本人の同意が前提の技術であり、他者の声を使う際の権利処理は利用者の責任だ。\n\nローカル完結の意味は、料金だけではない。未発表の原稿、顧客の音声、個人の録音といった素材は、クラウドに送ること自体が心理的にも契約的にも重い場合がある。文字起こしと吹き替えとナレーションを一つの画面で行き来できることも、試行錯誤の多い制作の前工程では効いてくる。エンジン選択で対応言語や品質が変わる設計は、用途に応じて道具を使い分ける前提の現実的な作りだ。\n\n音声制作は収録、編集、整音、書き出しと工程が多く、ツールの行き来自体が負担になりやすい。工程を一つの作業画面に寄せる設計は、個人や小規模チームの制作フローに合う。ローカル動作であれば、ネット環境に左右されず試行錯誤を続けられる点も大きい。", "2026-11-08", "GhTrends Weekly", "https://www.ghtrends.dev/weekly/"], ["pbakaus/impeccable — AI生成UIの「量産顔」を直すデザイン語彙", "コーディングエージェント向けのデザイン・ガイダンス。AIが生成するインターフェースがどれも同じテンプレート顔になる問題に対し、製品の事実をPRODUCT.mdに記録し、整形・批評・仕上げ・動きなど24の共有コマンドと、モデル呼び出しなしで動く61の決定論的検出ルールで対処する。スター総数は約10.6万、週間でも6,534スターを集めた。検出はモデル呼び出しなし、ルールベースで回す設計だ。", "概要\npbakaus/impeccableは、コーディングエージェントのための「デザインの語彙」を提供するプロジェクトだ。キャッチフレーズは、AIモデルが生成しがちな「量産型SaaS顔」を直すことにある。主要言語はRustで、スター総数は106,193（11月9日時点、WhatsTrending調べ）。\n\n詳細\n使い始めに/impeccable initを一度実行すると、製品の確かな事実がPRODUCT.mdに記録され、以降の生成の前提になる。そのうえで、形作り、批評、磨き、モーションなどを担う24の共有コマンドが使える。さらに61の決定論的検出ルールがCLIまたはブラウザ拡張で動き、モデル呼び出しもAPIキーも要らない。AIの好みではなく、検証可能なルールで「AIっぽさ」を検出するのが流儀だ。\n\n数字\nGhTrendsの週間集計（11月2〜8日）で6,534スターを獲得し18位。WhatsTrendingの計測でも11月4〜9日に4,682スターと、異なる窓でも安定した伸びを示した。\n\nなぜ注目か\n生成UIの均質化は、バイブコーディングの普及とともに誰もが感じる問題になった。それを「センス」ではなく、製品事実の記録と検出ルールという工学的な手段で扱う点が、開発者コミュニティの支持を集めている。\n\nポイント・注意点\nルールで検出できるのは定型的な「兆候」までで、最終的な良し悪しは人間の目が要る。PRODUCT.mdの記録が薄いとガイダンスの効きも弱くなるため、初期設定に手を抜かないことが導入の成否を分ける。\n\nFindarepoの紹介文は「あなたのコーディングエージェントのためのデザイン語彙。polishやbolderで方向づけし、レビューで確かめる」と要約している。語彙という表現が要点で、エージェントに「いい感じにして」ではなく、共有された言葉で指示できる状態を作るのが狙いだ。検出ルールがモデルを使わない点も、CIに組み込みやすい実務的な利点になる。\n\ninitで土台を作り、コマンドで回すという手順の型も、導入の分かりやすさに寄与している。", "2026-11-08", "GhTrends Weekly", "https://www.ghtrends.dev/weekly/"], ["Nutlope/hallmark — 「機械製UIの兆候」をリントするデザインスキル", "Claude Code、Codex、Cursor、OpenCode向けのデザインスキル。48種の素材カタログから3つのテーマを配り、生成結果を実ブラウザで「機械製UIの兆候」と照合してチェックする。見出し上の飾りや、ページ末尾の申込フォームといった定型を検出し、最後は文脈を持たないレビュアーが判定する。スター総数は約5.1万、週に5,720スターを集めた。今週は「AI生成UIの均質化を直す」系が複数同時に伸びた。", "概要\nNutlope/hallmarkは、ページが「機械で作られた顔」になることを拒むデザインスキルだ。対応するホストはClaude Code、Codex、Cursor、OpenCode。主要言語はCSSで、スター総数は50,948（11月9日時点、WhatsTrending調べ）。\n\n詳細\n仕組みは三段構えだ。まず48の素材からなるカタログから3つのテーマを配る。次に生成結果を実ブラウザで開き、機械製UIの兆候――すべての見出しの上に付く飾りの眉、すべてのページの最後に置かれる申込フォームなど――と照合する。最後に、文脈を持たない新鮮な目レビュアーが最終判断を下す。\n\n数字\nGhTrendsの週間集計（11月2〜8日）で5,720スターを獲得し21位。WhatsTrendingでも11月4〜9日に3,995スターと計測され、コーディングエージェント／Claude Code系ツールの中でも速い組に入った。\n\nなぜ注目か\n同じ週にimpeccableやunslopといった「AI生成UIの均質化を直す」系が複数伸びており、テーマとしての盛り上がりが見える。hallmarkはスキルという軽い形式で、テーマ配布とブラウザ実査を組み合わせた点が特徴だ。\n\nポイント・注意点\n兆候チェックは定型の検出には強いが、プロジェクト固有の文脈までは見ない。素材カタログから外れた表現が必要な場面では、人の手による調整が前提になる。まず自分の生成物で試し、どの兆候が実際に引っかかるかを知るのが早い。\n\nWhatsTrendingの集計では、コーディングエージェント系とClaude Code／Codex系ツールのうち今週速かった3件に、orca、impeccableと並んでhallmarkが数えられ、3件で15,529スターを分け合った。「生成する道具」の次に「整える道具」が来るという流れは、このカテゴリ全体の成熟を示している。\n\nテーマを「配る」という言い方も特徴で、ゼロから悩むのではなく、選ばれた素材の組み合わせから始めることで、量産顔から外れるきっかけを作っている。", "2026-11-08", "GhTrends Weekly", "https://www.ghtrends.dev/weekly/"], ["Gathin23/cleanyourtv — Wi-Fi越しにAndroid TVを「静かなホーム画面」へ", "広告だらけのAndroid TVやGoogle TVのホーム画面を、Apple TV風の落ち着いた画面に変えるキット。同じWi-Fi越しにADBスクリプトでテレビをバックアップし、テレメトリやスポンサー枠、プリインストールアプリを削除ではなく無効化する。そのうえで4つのアプリを置く小さなランチャーを導入する。復元スクリプトで全手順を元に戻せる。スター約5.4万。", "概要\nGathin23/cleanyourtvは、広告や宣伝枠に埋もれたAndroid／Google TVのホーム画面を、静かな画面に作り替えるキットだ。Findarepoは「Wi-Fi越しにAndroidやGoogle TVの肥大化を解消し、Apple TV風のホームにする」と紹介している。スター総数は約54K。\n\n詳細\n手順は安全側に倒してある。まず同じWi-Fiネットワーク越しにADBスクリプトでテレビをバックアップする。次にテレメトリ、スポンサー行、プリインストールアプリを「アンインストールするのではなく無効化」する。最後に、ドックに4つのアプリを置く小さなランチャーを導入する。すべての手順は復元スクリプトで元に戻せる。Xiaomi、TCL、Sonyなどについてテスト済みリストが同梱される。\n\n数字\nGhTrendsの週間集計（11月2〜8日）で5,236スターを獲得し23位。Findarepoの7日間集計でも+5.8Kとされ、週間を通じて伸びた。エージェント関連が並ぶランキングで、生活密着のツールがこの位置に入るのは目立つ。\n\nなぜ注目か\nスマートTVのホーム画面の広告化への不満は広く共有されている。「削除ではなく無効化＋復元可能」という慎重な設計が、失敗を恐れる一般ユーザーの心理に合ったのだろう。\n\nポイント・注意点\nADB接続や開発者向け機能を使うため、機種によっては手順の調整が要る。無効化の影響範囲はテスト済みリストで確認し、まずバックアップと復元手順を確保してから実行するのが安全だ。メーカーのアップデートで設定が戻る可能性もある。\n\nテレビという身近な不満に、慎重な作法で応えた点が評価された。バックアップを取り、削除ではなく無効化にとどめ、復元手段を用意する。派手な自動化より「元に戻せること」を前面に出す設計は、家族共用の機器を触る心理的なハードルを下げる。対応機種リストが同梱されているのも、試す側の不安を減らす工夫だ。週のランキングでは珍しい、生活家電のソフトウェアである。", "2026-11-08", "GhTrends Weekly", "https://www.ghtrends.dev/weekly/"], ["google/skills — Google公式のスキル集が週間トレンド入り", "Googleが公開している、Google製品や技術に関するエージェント向けスキルのリポジトリ。11月8日のGitHubトレンドで上位に入り、その日の表示で443スターを集めた。スター総数は約2.35万で、11月6日からの2日間でも1,000超を増やしている。大手プラットフォーム自身がスキル形式で自社技術の使い方を配る流れの象徴として注目される。プラットフォーム側の標準化の動きとしても注目だ。", "概要\ngoogle/skillsは、Googleが公開するエージェント向けスキルのリポジトリだ。主要言語はPython。11月8日朝のGitHubトレンド（日次）で3位に表示され、その日のスターは443、総数は23,532だった（luongnvのトレンドダイジェスト調べ）。\n\n背景\nエージェントに特定の仕事の進め方を教える「スキル」という形式は、Claude CodeやCodexなどの普及とともに標準部品になりつつある。個人開発者のスキル集が大きく伸びる一方で、プラットフォーム側が公式スキルを出す動きも始まっており、google/skillsはその代表例だ。GitDiscoverも「Google製品と技術への関連性」によってトレンド入りしたと分析している。\n\n数字\n11月6日に22,518スターだったものが、8日には23,532スターへ。2日間で1,014スター（+4.5%）増えた。同期間の個人発スキル集ほどの爆発ではないが、公式リポジトリとしては堅調な伸びだ。\n\nなぜ注目か\nスキルは「どのモデルを使うか」と並んで、エージェントの実力を決める要素になってきた。プラットフォーム自身が自社技術の作法をスキルとして配れば、エージェントがGoogle製品を扱う精度は底上げされる。配布形式の主導権争いとしても意味がある。\n\nポイント・注意点\n内容はGoogle製品・技術に特化しており、汎用のスキル集とは性格が違う。自分のスタックに関係するスキルがあるかを確認し、必要なものだけを取り込む使い方が現実的だ。更新頻度や対象製品の広がりは今後のチェックポイントになる。\n\nスキルの配布をめぐっては、個人の職人芸と公式の標準化が並走し始めている。mattpocock/skillsのような個人発の大型スキル集と同じ週に、Google公式のリポジトリがトレンド入りした対比は分かりやすい。エージェントの振る舞いを決める「作法」の置き場として、公式スキルは今後の基準点になり得る。\n\n対象が自社製品に限られるぶん、内容の正確さは公式ならではの強みになる。", "2026-11-08", "GitHub Trending Digest (luongnv)", "https://luongnv.com/news/trending/index.html"], ["milind-soni/OpenMausBot — 連絡先が全員コーディングエージェントのチャット", "11月7日版で4位に初登場したmilind-soni/OpenMausBotは、ローカルファーストのオープンソース・チャットアプリです。サイドバーの連絡先がすべて実在のコーディングエージェントで、自分のマシン上でClaudeやCodexとして動作し、それぞれに個性とモデル、接続済みアプリがあります。友人にメッセージする感覚で仕事を頼め、作業の様子を見守ることができ、重要な手順は承認してから実行されます。", "milind-soni/OpenMausBotは、GhTrendsの11月7日版で4位に初登場したオープンソースのチャットアプリです。11月6日の集計窓では+2,044スターを集め、CoddyKitの集計でも10月30日時点の7,809スターから9,984スターへと伸びています。実装はTypeScriptです。\n\n発想の新しさは、チャットの相手がエージェントであることです。サイドバーに並ぶ連絡先はすべて実在のコーディングエージェントで、各エージェントは自分のマシン上でClaudeやCodexとして動作します。それぞれに個性とモデル、クラウドコンピュータ、接続済みアプリが割り当てられています。\n\n使い方は、友人にメッセージする感覚に近づけられています。仕事を言葉で頼み、作業が進む様子をその場で見守り、重要な手順については承認してから実行させる、という流れです。エージェントへの指示が「コマンドを実行する」操作から「人に頼む」会話へ置き換わっている点が、このアプリの核です。\n\nローカルファーストであることも特徴です。エージェントは自分のマシン上で動くため、データの置き場所や実行環境を自分の管理下に置けます。\n\n「エージェントをチャットの相手として常駐させる」という発想が新鮮だと評価されています。必要なときだけ道具を起動するのではなく、連絡先として常にそこにいて、話しかければ動き出す。エージェントとの付き合い方の形そのものを提案するプロジェクトとして、今後の広がりが注目されます。\n\nGhTrendsはこのアプリを「Grok Botの精神を受け継ぐもの」と表現しています。連絡先ごとにモデルや接続アプリが異なるため、頼む内容に応じて相手を選ぶ、という分業の形も生まれます。人に仕事を頼むときに適性で相手を選ぶ感覚に近いものです。\n\n重要な手順で承認を挟む設計は、常駐型エージェントの安全性の要でもあります。常にそばにいて動き続けられる相手だからこそ、「ここからは人の判断」という線引きが、利便性と引き換えではなく前提として組み込まれています。自分のマシン上で動く構成は、データの置き場所だけでなく、外部サービスの都合で挙動が変わる影響を受けにくい面もあります。", "2026-11-07", "GhTrends Daily", "https://www.ghtrends.dev/daily/2026-11-07/"], ["thedotmack/claude-mem — 108Kスターの永続メモリエンジン", "thedotmack/claude-memは、コーディングエージェントのセッション文脈を保存・圧縮し、次のセッションに注入する永続メモリエンジンです。スター数は108,282に達し、10月30日時点から2日間で+2,688と今も伸び続けています。役割は、エージェントがセッションをまたぐと文脈を失う問題の解決です。タスクごとにClaude Code、Codex、OpenCodeなどを使い分けながら、単一の記憶層を共有する使い方が広がっています。", "thedotmack/claude-memは、コーディングエージェントのための永続メモリエンジンです。CoddyKitの分析によれば、スター数は108,282に達しました。10月30日時点の105,594スターから、わずか2日間で+2,688という伸び方をしており、規模の大きさと勢いの両方を備えています。\n\n解決しようとしている問題は単純で、しかし根が深いものです。コーディングエージェントは、セッションが終わると文脈を失います。前回の作業で何を決め、どこまで進み、何を試して失敗したのか。次のセッションでは、それを毎回説明し直すか、諦めてゼロから始め直すことになります。\n\nclaude-memの役割はこの断絶を埋めることです。セッションの文脈を捕捉し、AIで圧縮したうえで、将来のセッションに関連する履歴を戻します。丸ごと保存するのではなく圧縮して注入する点が肝で、限られた文脈枠の中に、過去の判断や経緯を持ち込めるようになります。\n\n使われ方にも変化が見えます。タスクごとにClaude Code、Codex、OpenCodeなどを使い分けながら、記憶の層は単一のものを共有する。道具は作業に応じて変えても、文脈は切らさないという運用です。CoddyKitは、このような基盤層が少数の勝者に集約されつつあることの例としてclaude-memを挙げています。\n\nエージェントの性能競争がモデルの賢さだけでなく「どれだけ長く文脈を保てるか」に移ってきたことの表れであり、2026年11月時点の標準的な構成になりつつある、と記事は分析しています。\n\n圧縮という工程が重要なのは、セッションの冒頭に流し込める情報量には上限があるからです。過去の履歴を丸ごと渡せば、本来の作業に使うべき文脈の枠が埋まってしまいます。要点だけを残す圧縮があってこそ、長期の記憶は実務に耐えるものになります。新しいセッションの開始時に、関連する履歴が戻ってくることで、前回の決定事項や試行錯誤を引き継いだ状態から作業を始められます。\n\nCoddyKitは同じ分析の中で、t3codeの操作面など他の基盤プロジェクトの成長にも触れ、基盤層が少数の定番に固まりつつあると見ています。claude-memは、その中核の一つに数えられています。", "2026-11-02", "CoddyKit", "https://www.coddykit.com/pages/blog-detail?id=5130012&slug=github-trending-november-2026-from-a-7k-star-local-first-ai-team-to-a-42k-star-m"]], "gh-new": [["stablyai/orca — 複数のコーディングエージェントを艦隊のように運用", "OPC RadarのGitHub最新一覧（2026年11月9日更新）に載ったstablyai/orcaは、Claude CodeやCodexといったコーディングエージェントの「艦隊」を運用するためのツールです。自分のサブスクリプションを使ってエージェント群を動かし、デスクトップ、モバイル、リモートランタイムで利用できます。複数のエージェントを並行して走らせる運用が一般化する中で、その管理面を担う新顔として注目されています。", "stablyai/orcaは、OPC RadarのGitHub最新一覧（2026年11月9日更新）に載ったリポジトリです。新しいツールですが、担っている役割はコーディングエージェント本体ではなく、その「運用」の側です。\n\nOrcaは、Claude CodeやCodexといったコーディングエージェントの「艦隊」を運用するためのツールと位置づけられています。エージェントは、利用者自身のサブスクリプションを使って動かします。道具の側が新たな利用枠を売るのではなく、手持ちの契約の範囲で、複数のエージェントを束ねて使う発想です。\n\n利用環境はデスクトップ、モバイル、リモートランタイムに対応します。エージェントの作業は長時間に及ぶことも多いため、席を離れてもモバイルから様子を確認できる形は、並行運用とは相性の良い組み合わせです。\n\n背景には、エージェントの使い方の変化があります。1つのエージェントを起動して結果を待つ段階から、複数を並行して走らせる段階へ移ると、進捗の確認、作業の割り振り、止まったものの発見といった「管理」の手間が、本体の作業とは別に発生します。能力を持つエージェントは揃ってきた一方で、その群れを扱う層はまだ薄い、というのが現状です。\n\n複数のエージェントを並行して走らせる運用が一般化する中で、その管理面を担う新顔としてOrcaは注目されています。エージェントそのものの性能競争とは別の、運用・管理の層に新しいプロジェクトが現れ始めたこと自体が、この分野の成熟を示す材料です。\n\n自分のサブスクリプションで動かすという形は、ツールごとに利用枠を買い足すのではなく、手持ちの契約を使い倒す発想です。複数のエージェントツールを併用する人ほど、枠や進捗の管理は煩雑になりがちでした。\n\nリモートランタイムという言葉は、手元のPCから離れても処理を走らせ続けられる実行環境を指します。エージェントの作業は、開始から終了まで時間のかかるものも多いため、実行する場所と確認する場所を分ける考え方とは相性が良い。モバイル対応は、その確認の窓口を手元に置くためのものです。\n\n新着一覧に管理ツールが載ること自体、選ぶ側の目が「次の層」に向き始めた証拠です。本体の性能そのものではなく、回し方で差がつく段階に入りつつある、という読み方ができます。", "2026-11-09", "OPC Radar", "https://radar.incidental.site/channel/repos/"], ["zortos293/Lichii — Switch／Switch 2エミュレータの新フォーク", "GitDiscoverの新着ランキングに登場したzortos293/Lichiiは、作成から約8日の新しいリポジトリで、1日あたり約852スターの勢いで伸びています。yuzuなどの系譜を引く実験的なNintendo Switch／Switch 2エミュレータのフォークで、改名後も既存のセーブデータや設定、シェーダーキャッシュを引き継げる点が売りです。C++製で、GhTrendsの日次ランキングでもトップ10に入るなど、新着ながら大きな注目を集めています。", "zortos293/Lichiiは、GitDiscoverの新着ランキングに登場した、作成から約8日の新しいリポジトリです。1日あたり約852スターの勢いで伸びており、GhTrendsの日次ランキングでも8位（1日+1,590スター）に入るなど、新着としては異例の注目度です。\n\n中身は、Nintendo SwitchとSwitch 2を対象とする実験的なオープンソース・エミュレータです。系譜としてはEglantine、Eden、yuzu、Sudachiといった既存プロジェクトの流れを引くフォークで、実装はC++で書かれています。エミュレータの分野はこうしたフォークの分岐が繰り返されてきた領域で、Lichiiもその系譜の新しい枝です。\n\n利用者にとっての売りは、移行のしやすさです。改名後も古いデータディレクトリや設定キーをそのまま保持するため、セーブデータ、設定、シェーダーキャッシュを捨てずに引き継げます。育てた環境を失うことが乗り換えの最大の障壁になりがちな分野だけに、この配慮は支持を集める理由になっています。\n\nビルドはWindows、Linux、macOS向けに用意されています。なお、ゲームソフトや鍵、ファームウェアは含まれていないため、それらは利用者側で用意する前提です。\n\n実験的な段階のプロジェクトであり、互換性や安定性はこれから検証されていく局面です。それでも「既存の資産を引き継げる新フォーク」という打ち出しが、短期間で大きな関心を集めた事例として目を引きます。\n\nエミュレータとは、ゲーム機のハードウェアの働きをソフトウェアで再現し、PCなどの上でそのゲームを動かす仕組みのことです。互換性を高める作業は長期戦になりやすく、プロジェクトの継続性そのものが、利用者にとって大きな関心事になります。C++製という実装言語も、性能を求められるこの分野では一般的な選択です。\n\nシェーダーキャッシュの引き継ぎも、細部ながら効く配慮です。これは描画のたびに発生する変換処理の結果を蓄えたもので、残せるかどうかは移行直後の快適さに直結します。系譜を引くフォークが短期間にこれだけのスターを集めた事実は、既存利用者の受け皿としての需要の大きさを示しています。", "2026-11-08", "GitDiscover Newcomers", "https://gitdiscover.org/newcomers"], ["l0ng-ai/openidea — 作成18日で7.8KスターのTypeScript新星", "GitDiscoverが「最近作成（18日）・速い勢い」として挙げた、TypeScriptのリポジトリl0ng-ai/openideaです。生まれて間もないながらスター数は7.8Kに達し、1日あたり170を超えるペースで伸びています。新着リポジトリの中では、README、ライセンス、コントリビューターといった基本的な信頼シグナルが揃っている点も評価されています。勢いのある新着を探す際の候補として、まず中身と更新頻度を確認したい1件です。", "l0ng-ai/openideaは、GitDiscoverが「最近作成（18日）・速い勢い」として挙げたTypeScriptのリポジトリです。作成から18日という若さながら、スター数は7.8Kに達しています。\n\n勢いの指標は、1日あたり170を超えるペースと示されています。新着リポジトリは星の伸びが一時的に偏ることも多く、数字だけで判断するのは早計ですが、短期間にこれだけの支持が集まったこと自体は注目材料です。\n\nもう一つの評価点は、基本的な信頼シグナルが揃っていることです。READMEで内容が説明され、ライセンスが明示され、コントリビューターの存在が確認できる。新着プロジェクトではこの当たり前が欠けていることも珍しくなく、採用や検証に進む前の最低条件として効いてきます。\n\nもっとも、GitDiscover自身の見立ても慎重です。勢いのある新着を探す際の候補として挙げつつ、「まず中身と更新頻度を確認したい1件」と位置づけています。スター数の伸びは関心の量であって、品質や継続性の保証ではありません。\n\n見極める際は、コミットの履歴が途切れていないか、Issueへの反応があるか、READMEの説明と実装が一致しているか、といった地味な確認が有効です。18日という若いプロジェクトでは仕様変更も速いので、評価するなら小さく試してから、という順序が安全です。\n\nGitDiscoverの新着ランキングは、作成間もないリポジトリの中から勢いのあるものを拾い上げる場です。通常のトレンドでは埋もれがちな「生まれたて」のプロジェクトに光を当てる場です。\n\n信頼シグナルの中身も確認しておきます。READMEは「何をするものか」の説明であり、ライセンスは「どう使ってよいか」の条件、コントリビューターは「誰が関わっているか」の手がかりです。この3つが揃うことは、検証に進むための最低条件です。TypeScript製である点も、Web系の開発者にとっては読みやすく、検証しやすい条件の一つです。\n\n数字の読み方には注意が必要です。初期の急伸は話題性に引っ張られることも多く、数週間後に更新が続いているかどうかが、本当の評価を分けます。作成18日という若さは可能性であると同時に、未成熟さでもあります。評価は急がず、まず中身を読むところから始めるのが安全です。", "2026-11-08", "GitDiscover Newcomers", "https://gitdiscover.org/newcomers"], ["deepseek-ai/dsh-superagent-prototype — リポジトリを見張り、会話にPRで答える自律エージェント試作", "DeepSeekの研究用プロトタイプ。対象のGitHubリポジトリを継続的に見張り、依頼が来たら専用のエージェントセッションで作業し、元の会話スレッドに通常はプルリクエストで答える。GitHubに加えてFeishuの通知にも対応し、人間の手が必要な箇所を示すWebパネルを備える。DeepSeek Harness向けに作られた実験コードで、週間16,000級のスターを集めた。", "概要\ndeepseek-ai/dsh-superagent-prototypeは、DeepSeekが公開した研究用プロトタイプだ。一つのGitHubリポジトリを担当する「能動的なコーディングエージェント」を、DeepSeek Harness（DSH）向けのパッケージとして実装したもの。READMEでは研究コードであると明記されている。GitTrendの週間分析では、創設から120日以内の新規リポジトリとして週間上位50件に入った。\n\n詳細\nエージェントはGitHub、そして任意でFeishuを聞き取り、依頼されると作業項目を開き、自分のエージェントセッションの中で作業する。結果は元の会話に返され、通常はプルリクエストの形を取る。人間がまだ必要な箇所はWebパネルで示される。「チャットで頼むと裏で勝手に進めて答えが返る」という、常駐型エージェントの具体像を公式側が試作した点が新しい。\n\n数字\nスター総数は約21K（Findarepo調べ）。7日間で+16Kと計測され、GhTrendsの週間集計（11月2〜8日）でも11,090スターを獲得して5位に入った。公開から日の浅い試作としては異例の集まり方だ。\n\nなぜ注目か\nエージェントの主戦場が「対話のたびに起動する道具」から「常駐して見張る同僚」へ移る流れを、モデル提供者自身の試作が示した。土台のDSHとあわせ、DeepSeekのエージェント戦略の見本になっている。\n\nポイント・注意点\nあくまで研究用プロトタイプで、本番のリポジトリを無監視で任せる段階のものではない。人間の手が必要な箇所を示す設計自体が、完全自律ではなく監督付き自律を前提にしている。試す場合は影響の小さいリポジトリで、権限を絞って始めるべきだ。\n\n常駐型の設計で問われるのは、権限と停止の仕方だ。リポジトリを見張り続けるエージェントは、利便性と引き換えに「いつでも作業を始められる存在」になる。Webパネルで人間の出番を示す作りは、その緊張への一つの答えだ。公式の試作が出たことで、サードパーティの常駐エージェントも設計の比較対象を得たことになる。", "2026-11-08", "GhTrends Weekly", "https://www.ghtrends.dev/weekly/"], ["ccch1mneyyy/dsh-Go — DeepSeek HarnessをAndroidでそのまま動かす非公式クライアント", "DeepSeek Harness（DSH）をポケットに入れる非公式Androidクライアント。アプリ内にUbuntuとNode.jsの環境を構築し、root化もTermuxもなしにDSHエンジンをスマホ自体で実行する。SSH経由で別のDSHインスタンスにつなぐこともできる。約2週間前に作られたばかりでスターは約1.6万、1日で1,774スターを集める勢いだ。", "概要\nccch1mneyyy/dsh-Goは、DeepSeek HarnessをAndroid上でネイティブに動かす非公式クライアントだ。GitDiscoverの新規ランキングによれば、リポジトリが作られてから約14日（11月8日時点）。言語はDartで、スター総数は15.9K、24時間で1,774スターを集めた。\n\n詳細\n仕掛けは、アプリ内部にUbuntuとNode.jsの環境をインストールし、DSHエンジンを端末上で動かすこと。rootもTermuxも要らない。SSHで別の場所にあるDSHインスタンスへ切り替えることもできる。チャット画面ではモデルの切り替え、画像、音声入力、ツールの承認に対応し、共有カード、暗号化されたリプレイリンク、デスクトップペット（マスコット）機能まで付いている。対応はAndroid 8以降。\n\n数字\nGhTrendsの週間集計（11月2〜8日）では10,837スターを獲得し6位。公式の基盤（deepseek-harness）や試作（dsh-superagent-prototype）と並んで、DSHエコシステムだけで週間の上位3席を占める一角になった。\n\nなぜ注目か\nエージェントの実行基盤が公開されると、モバイルへの移植がこれほど速く現れる。モデル提供者の公式アプリを待たずにコミュニティがクライアントを作る速度が、エコシステムの勢いを測る指標になっている。\n\nポイント・注意点\n非公式クライアントであり、アプリ内に実行環境を丸ごと抱える性質上、権限や配布元の確認は必須だ。DSH側の仕様変更に追随できない期間もあり得る。使う場合は公式情報とあわせて、端末側のセキュリティ設定を見直したい。\n\n「スマホでエージェントを動かす」ことの意味は、外出先での確認や承認をその場で済ませられることにある。承認待ちで止まっていた作業をポケットから再開できるなら、エージェントの稼働率は上がる。アプリ内に実行環境を抱える分、端末のストレージやバッテリーへの負荷は避けられないが、それでも「持ち歩ける実行基盤」という発想の提示として目を引く。", "2026-11-08", "GitDiscover Newcomers", "https://gitdiscover.org/newcomers"], ["Ebony-Vinyl/dsh-our-free-model — 入れるだけで無料のfrontierモデルが並ぶDSHプラグイン", "DeepSeek Harness（dsh）向けのプラグイン。インストールするだけで、ログインも登録もAPIキーもなしに、DeepSeek V4.1 FlashやKimi K3といったfrontierモデルがモデル選択欄に並ぶ。無料レーンはOpenCodeのZenやKilo AIの公開ゲートウェイから取得され、更新のたびに取り直される。スターは約6.6万と、新顔ながら週間上位に食い込んだ。", "概要\nEbony-Vinyl/dsh-our-free-modelは、DeepSeek Harnessのシェル向けプラグインだ。売り文句は単純で、インストールすればモデルピッカーに無料のfrontierモデルが並び、ログイン、サインアップ、APIキーのいずれも要らない。GitTrendの週間分析で、創設から120日以内の新規リポジトリとして上位50件に入った。\n\n詳細\n無料レーンの供給元は、OpenCodeのZenとKilo AIの公開ゲートウェイで、リフレッシュのたびに再取得される。ローカルにOpenAI互換のリレーポートも開くため、ほかのツールから同じモデル群を呼ぶこともできる。利用統計はマシン上に留まる設計だ。対象モデルとして挙がっているのはDeepSeek V4.1 FlashとKimi K3など。\n\n数字\nスター総数は約66K（Findarepo調べ）。GhTrendsの週間集計（11月2〜8日）では10,594スターを獲得して7位に入った。dsh本体、superagent-prototype、dsh-Goとともに、同じ週のランキングにDSH関連が4件並ぶ結果になった。\n\nなぜ注目か\n「キーを用意する」というAIツール導入の最初の壁を、プラグイン一つで飛ばしてしまう発想が刺さった形だ。無料ゲートウェイの存在を、エコシステム側が部品として取り込む動きでもある。\n\nポイント・注意点\n無料レーンの供給は外部ゲートウェイの都合に左右され、継続性や利用条件は供給元次第だ。経路に他者の基盤を通す以上、機密性の高い入力を流す用途には向かない。統計がローカルに留まる設計は評価できるが、実際の通信範囲は導入前に確認したい。\n\n仕組みの肝は、無料の入口を「束ね直す」ことにある。公開ゲートウェイという既存の供給を、モデルピッカーという日常の接点につなぎ替えた。似た発想の部品は他のエコシステムにも広がり得るが、供給元の条件変更ひとつで前提が崩れる危うさと表裏一体だ。試用の敷居を下げる実験として、どこまで持続するかが次の見どころになる。", "2026-11-08", "GhTrends Weekly", "https://www.ghtrends.dev/weekly/"], ["qybaihe/bla — AIリバースエンジニアリングへの「対抗 shield」、毒を盛り exhaustさせ幻覚させる", "REAのようなAIリバースエンジニアリング・エージェントから、バイナリやElectronアプリ、JSバンドル、Python、WebAssemblyを守る対抗防御シールド「BLA（Blind LLM Agents）」。手法はPoison（毒入れ）、Exhaust（消耗）、Hallucinate（幻覚誘発）の三つ。AIに読ませると要領を得なくなる仕掛けで、約2週間前に公開され3.6Kスター、1日887スターの勢いだ。", "概要\nqybaihe/blaは、AIエージェントによるリバースエンジニアリングへの対抗をうたう防御ツールだ。名前のBLAはBlind LLM Agentsの略。守る対象はバイナリ、Electronアプリ、JavaScriptバンドル、Python、WebAssembly。GitDiscoverによれば作られてから約14日（11月8日時点）で、スターは3.6K、24時間で887スターを集めている。\n\n背景\n週間ランキングの首位は、エージェントにアプリを解析させるmorluto/reaだった。解析する側が急速に強くなるほど、「解析されたくない側」の需要も生まれる。blaはその需要に正面から応えたプロジェクトで、タグにもadversarial-aiが掲げられている。\n\n詳細\n防御の考え方は「Poison → Exhaust → Hallucinate」。AIエージェントが読みに来たときに、毒性のある手がかりで誤らせ、リソースを消耗させ、存在しない構造をあるように錯覚させる。堅い暗号化ではなく、エージェントの推論そのものを狂わせる方向の防御であることが特徴だ。\n\nなぜ注目か\nAIエージェントの能力向上は、攻める側と守る側の両方の道具を生む。今週のランキングでは攻撃側のreaと防御側のblaが同時に伸びており、エージェント時代の「矛と盾」が同じ週に可視化された。\n\nポイント・注意点\nエージェントを誤らせる仕掛けは、正規の解析や自社でのデバッグまで巻き込む可能性がある。対象や強度の設定を誤ると、自社製品の保守性を損なう。あくまで防御目的で、自社資産に限定して使うべき類のツールだ。\n\nトピックにはclaude-codeやcursorといった、守る相手の名前そのものも並ぶ。解析エージェントの実名を挙げて対抗を宣言する書き方は、この種の攻防がすでに具体的な製品同士の話になっていることを示す。週の首位が解析ツールのreaだったタイミングも重なり、攻守の双方に市場の目が向いた週になった。\n\n攻めの道具が伸びた週に、守りの道具も伸びた。", "2026-11-08", "GitDiscover Newcomers", "https://gitdiscover.org/newcomers"], ["NotRexed/Hookshot — 『ゼルダの伝説 時のオカリナ』Switch 2リメイクのネイティブ再コンパイル", "『ゼルダの伝説 時のオカリナ』のNintendo Switch 2リメイクを、ネイティブ再コンパイルする野心的なプロジェクト。作られてからわずか約3日で2.6Kスターを集め、24時間で1,288スターという新規ランキング屈指の勢いを見せた。C++製で、同じ週には別のオカリナや『ティアーズ オブ ザ キングダム』の再コンパイル系も次々に現れている。往年の名作を新ハード素材で作り替える試みに、開発者が集まった。", "概要\nNotRexed/Hookshotは、『ゼルダの伝説 時のオカリナ』のNintendo Switch 2リメイクをネイティブに再コンパイルするプロジェクトだ。GitDiscoverの新規ランキングでは「作られて3日」（11月8日時点）とされ、スター2.6K、フォーク252、24時間の増加は1,288スターに達した。\n\n背景\n往年のゲームをモダンな環境で動かす「再コンパイル」の流れは近年加速しており、エミュレーションではなく、元のプログラムを現代のプラットフォーム向けに作り替える手法への関心が高い。同じ週の新規ランキングには、『ティアーズ オブ ザ キングダム』の静的再コンパイルや、エミュレータなしで時のオカリナをWindowsで動かす別プロジェクトも並んでおり、テーマとしての一群をなしている。\n\n詳細\n主要言語はC++。対象がSwitch 2リメイクという新しい素材である点が目新しい。再コンパイル系のプロジェクトは一般に、利用者自身が正規に入手したゲームデータを前提とし、ゲームファイル自体は同梱しない形を取る（同種のプロジェクトではその旨が明記されている）。\n\nなぜ注目か\n公開3日でのフォーク252という数字は、見物ではなく「一緒に作る側」に回りたい開発者が多いことを示す。新しいハードのリメイク作品を題材にしたことで、再コンパイル・コミュニティの関心が一気に集まった。\n\nポイント・注意点\nこの種のプロジェクトは権利面の線引きが繊細で、データの入手経路を含め、正規の範囲での利用が前提だ。完成度も初期段階と見るべきで、実プレイ目的より、技術的な進捗を追う対象として捉えるのが適切だろう。\n\n再コンパイルの文化では、題材選び自体がコミュニティへの呼びかけになる。誰もが知る名作であること、素材が新しいこと、その両方が「参加したい」気持ちを刺激したのだろう。公開から日が浅いプロジェクトの常で、進捗の速さと失速の速さは紙一重だが、フォークの多さは本気の参加者の存在を示している。\n\n公開直後の勢いは、新規ランキングの中でも際立っていた。", "2026-11-08", "GitDiscover Newcomers", "https://gitdiscover.org/newcomers"], ["heydamir/unslop — 「AIっぽいUI」を設計された画面に直すClaudeスキル", "バイブコーディングで生まれた「AIっぽい」インターフェースを、デザインされた画面に整えるClaude向けスキル。紫のグラデーション、光彩、絵文字ラベル、ばらついた余白といった典型的な兆候を画面から監査し、製品に合った設計方向を定めて、パスごとに修正していく。約10日前に公開され、スターは約1.18万、週間でも6,712スターを集めた。公開10日で1万スター超、生成UIの整形需要が可視化された。", "概要\nheydamir/unslopは、Claude CodeとCodexで使えるスキルで、「AIの見た目（slop）」をインターフェースから取り除くことを目的とする。GitDiscoverによれば作られて約10日（11月8日時点）。スター総数は約11.8K、週間では6,712スターを集め（GhTrends）、新規と成長の両方で上位に入った。\n\n詳細\n進め方は、まず画面を監査して「AIらしさ」の兆候――紫色のグラデーション、グロー（光彩）、絵文字のラベル、不均一な余白など――を洗い出す。次に製品の内容から設計の方向を定め、パスを重ねて画面を直していく。対応はNext.js、React、Vue、プレーンなHTMLなどで、実在サイトのリンクだけから始めることもできる。\n\n背景\nAI生成UIの均質化への不満は今週の大きなテーマで、impeccableやhallmarkといった同種のプロジェクトも同時に伸びた。unslopはその中でも「実在の画面を監査してから直す」という入口の分かりやすさが特徴だ。\n\nなぜ注目か\n公開10日でのこの伸びは、バイブコーディングの利用者自身が「AIっぽさ」を課題だと感じている証拠だ。生成の次は「整える」工程が製品化しつつある。\n\nポイント・注意点\n監査が検出するのは典型的な兆候であり、ブランド固有の表現まで自動で決まるわけではない。設計方向の設定に製品理解が要る点は他ツールと共通で、最終判断は人間の目が担う。\n\n入口が「実在サイトのリンクでもよい」という点も広がりに効いたはずだ。素材を用意する手間なしに、まず監査だけを試せる。監査結果の具体性――紫のグラデーションや絵文字ラベルといった、誰もが「あるある」と思える兆候の言語化――が、課題の共有を助けている。整える工程がスキルという軽い形で流通し始めたこと自体、今週の小さな転換点だ。\n\n配布先がClaude CodeとCodexの双方である点も今どきの作法で、特定のホストに閉じない形で「整える工程」が流通すれば、生成UIの見た目の底上げはエコシステム全体で進む。", "2026-11-08", "GitDiscover Newcomers", "https://gitdiscover.org/newcomers"], ["JuneYaooo/rea-video — 動画をショット単位で「逆向」し、撮ったか生成かコードかを見分ける", "あらゆる動画をショットごとに逆向きに解析し、それが実写か、AI生成か、コードで作られたかを見分け、再現方法まで教えてくれるツール。rea系の発想を動画に広げたもので、約10日前に公開され4.2Kスターを集めた。24時間で651スター増と、新規ランキングでも勢いがある。映像制作やAIGC検出の文脈で注目される。生成元の判定と再現手順の提示を、一つの道具にまとめた。", "概要\nJuneYaooo/rea-videoは、動画をショット単位で逆向きに解析するツールだ。実写で撮られたもの、AIで生成されたもの、コードで作られたもののいずれであるかを見分け、どうすれば再現できるかを提示する。GitDiscoverによれば作られて約10日（11月8日時点）で、スター4.2K、フォーク601、24時間の増加は651スターだった。\n\n背景\n今週のGitHubでは、エージェントにソフトウェアを解析させるreaやcraft-anythingが上位を占め、「作られたものを読んで仕組みを理解する」こと自体がテーマになった。rea-videoはその対象を映像に広げたものだ。タグにはagent-skills、ai-video、aigc-detectionなどが並ぶ。\n\n詳細\n解析単位はショット（カット）だ。映像をカットごとに分け、それぞれの生成方法を判定し、再現のための手順を示す。映画や動画制作の現場では「この表現はどうやって作ったか」が常に問われ、生成AIの混入を見分ける必要性も高まっている。両方向の需要に応える位置取りだ。\n\nなぜ注目か\n生成動画の見分けは、プラットフォームや報道にとって実務課題になりつつある。検出と再現を一体にした点が、単なる判定ツールとの違いだ。\n\nポイント・注意点\n判定の精度は対象のジャンルや生成手法に左右され、断定の根拠はショットごとの検証が要る。解析結果はあくまで手がかりとして扱い、権利や出典の判断は人間側で行うべきだ。\n\nGitDiscoverはこのプロジェクトについて、映像の分析と再現を可能にし、映画・映像制作の現場に影響し得ると評している。実写か生成かという問いは、報道や権利の現場では年々切実になっている。判定だけ、あるいは生成だけの道具は増えたが、「読んで、見分けて、作り直し方まで示す」という往復を一つの流れにした点が目新しい。\n\n判定と再現が一体であることは、学習用途にも効く。どう作られたかを知ることが、そのまま作り方の教材になるからだ。", "2026-11-08", "GitDiscover Newcomers", "https://gitdiscover.org/newcomers"], ["valentderah/totk-pc-recomp — 『ティアーズ オブ ザ キングダム』をPCへ静的再コンパイル", "『ゼルダの伝説 ティアーズ オブ ザ キングダム』を、WindowsとLinuxのx86-64環境でネイティブに動くよう静的に再コンパイルするプロジェクト。描画はVulkanで、ゲームファイルは含まれない。約10日前に作られたばかりで5.9Kスターを集め、同じ週に現れた複数のゼルダ系再コンパイル・プロジェクトの一角をなす。大作の再コンパイルに、フォーク481の参加希望者が集まった。", "概要\nvalentderah/totk-pc-recompは、『ゼルダの伝説 ティアーズ オブ ザ キングダム』の静的再コンパイル版だ。ターゲットはWindowsとLinuxのx86-64で、レンダラーはVulkan。ゲームファイルは含まれないことが明記されている。GitDiscoverによれば作られて約10日（11月8日時点）で、スター5.9K、フォーク481を集めている。\n\n背景\n静的再コンパイルは、元のプログラムを解析して現代のプラットフォーム向けの実行形式に作り替える手法で、エミュレーションとは異なるアプローチだ。今週の新規ランキングには、時のオカリナの再コンパイル系が複数、Switch 2エミュレータのフォークなど、任天堂タイトルをめぐるプロジェクトが集中した。\n\n詳細\n対象タイトルの規模を考えると、再コンパイルの作業量は膨大で、コミュニティ分担が前提になる。フォーク481という数字は、見物客より参加希望者が多いことの表れだ。24時間のスター増は245と、派手ではないが堅実に伸びている。\n\nなぜ注目か\n現行世代の大作タイトルが題材になった点が新しい。再コンパイル技術の適用範囲が、レトロゲームから大規模な現代タイトルへ広がろうとしている。\n\nポイント・注意点\nゲームファイルは含まれず、利用には正規の入手が前提だ。完成度は初期段階のはずで、実プレイより技術検証の対象と見るべきだろう。権利関係の線引きについても、プロジェクト側の説明を確認したい。\n\n静的再コンパイルという手法自体にも触れておきたい。実行時に翻訳するエミュレーションと違い、事前にプログラムを作り替えるため、完成すればネイティブな性能が期待できる反面、移植の作業量は膨らむ。大作であればなおさらで、コミュニティの継続力が成否を分ける。同じ週に同種の挑戦が複数立ったことで、知見の共有も進みやすい。\n\n対象が現行の大作であるぶん、権利と技術の両面で注目が集まりやすく、進捗の透明性がコミュニティの信頼を左右する。", "2026-11-08", "GitDiscover Newcomers", "https://gitdiscover.org/newcomers"], ["Djihads80/Eglantine — Switch 2エミュレータの源流、作られて約10日で5.4Kスター", "実験的なNintendo Switch 2エミュレータ「Eglantine」のリポジトリ。既存記事で紹介したLichiiは、このEglantineやEden、yuzu、Sudachiの系譜からフォークしたもので、その源流の一つがこのプロジェクトだ。約10日前に作られ、C++で書かれ、5.4Kスターと591フォークを集めている。Switch 2エミュレーションをめぐる開発競争の激しさを示す。", "概要\nDjihads80/Eglantineは、実験的なNintendo Switch 2エミュレータだ。GitDiscoverによれば作られて約10日（11月8日時点）で、スター5.4K、フォーク591、24時間の増加は242スター。主要言語はC++だ。\n\n背景\nSwitch 2のエミュレーションは、ハードの世代が新しいだけに開発が集中している領域だ。GhTrendsの既存記事でも触れたとおり、Switch／Switch 2エミュレータのLichiiは、Eglantine、Eden、yuzu、Sudachiの系譜からフォークし、旧来のデータディレクトリや設定キーを引き継ぐことでセーブデータや設定を持ち越せることを売りにしていた。その源流側のプロジェクトがEglantineであり、フォーク元と派生が同じ時期に注目を集める構図になっている。\n\n詳細\nフォーク591という数は、本体側の開発に合流しようとする動きの多さを示す。エミュレータ開発は、カーネルやグラフィックスの互換を一つずつ潰していく地道な作業の集積であり、コミュニティの厚みが進捗を決める。\n\nなぜ注目か\n派生プロジェクトの評判が、先に源流への関心を呼び戻すという循環が見える。エコシステムの中心がどこにあるかは、スターの付き方で刻々と変わる。\n\nポイント・注意点\n実験的な段階のエミュレータであり、動作の完成度は限定的と見るべきだ。ゲームや鍵、ファームウェアは含まれないのがこの種のプロジェクトの通例で、利用は正規の範囲に限られる。\n\nLichii側の紹介では、フォーク元の系譜としてEglantineの名が挙がっていた。派生が注目を集めると源流が掘り起こされるのは、オープンソースではよくある循環だ。エミュレータの開発はフォークと統合の繰り返しで進んできた歴史があり、どの系統が主流になるかは互換性の実績で決まっていく。本体の更新ペースと、派生側の取り込み合戦の双方が今後の見どころだ。\n\nフォークの多さは、実験の分岐がそのまま開発の母数になるこの領域の性格を表している。", "2026-11-08", "GitDiscover Newcomers", "https://gitdiscover.org/newcomers"], ["wangzan101/Mika — AndroidのアプリとWebを操作するオンデバイスAIエージェント", "Android上で動き、アプリとWebを操作して用事を片付けるオンデバイスAIエージェント。クラウドに送らず端末側でエージェントを回す発想で、10月末から11月初めにかけて一気にスターが伸び、一時は1日1,000超のペースを記録した。言語はKotlin。勢いは落ち着き始めたが、新規ランキングに残る注目作だ。急伸と失速の両方が数字で追える、バズの標本のような一作。", "概要\nwangzan101/Mikaは、Android向けのオンデバイスAIエージェントだ。端末上のアプリとWebを操作して、利用者の代わりにタスクをこなすことを目指す。主要言語はKotlin。GitDiscoverの新規ランキングに掲載され、WhatsTrendingのスター計測でも大きな動きが記録された。\n\n詳細\n計測の推移がこのプロジェクトの物語だ。WhatsTrendingによれば、10月30日〜11月4日の窓では5,855スター（1日あたり1,171）を集める急伸を見せた。その後、11月4〜9日の窓では1,700スター（1日340）までペースが落ち、「失速」組に分類されている。バズの山と、その後の定着度合いが数字で追える例だ。\n\n背景\nスマホをエージェントの実行場所にする試みは増えている。dsh-Goがハーネスを端末に持ち込んだのに対し、Mikaは端末のアプリ操作そのものをエージェントの仕事にしている。画面とアプリをまたぐ自動化は、モバイルOSの権限設計と正面から関わる領域だ。\n\nなぜ注目か\nオンデバイスであることは、プライバシーと応答速度の両面で意味がある。一方で、OS側の制約やバッテリー、誤操作時の影響など、モバイル特有の難しさも背負う。その現実を、これだけの注目が集まったことで多くの開発者が考え始めた。\n\nポイント・注意点\n急伸後のペース低下は珍しいことではなく、評価は「残るかどうか」で決まる。アプリ操作の自動化は権限の範囲が広くなりがちで、試す場合は対象アプリと許可範囲を慎重に選ぶべきだ。\n\nWhatsTrendingの「失速」分類は否定的な評価ではない。前の窓で1日1,171スターという異常な伸びを記録した反動であり、直近でも1日340スターは決して小さくない。公開直後の爆発から日常の成長へ移れるかどうかが、プロジェクトの地力を測る物差しになる。端末操作エージェントという難しい領域で、利用者の期待をどこまで裏切らずに済むかが問われる。\n\nオンデバイス実行は、通信が不安定な環境でも動き続けられる点でも意味がある。", "2026-11-08", "GitDiscover Newcomers", "https://gitdiscover.org/newcomers"], ["sarpstar/cinecode — コードで映画を作る、AIエージェントが脚本からMP4まで", "「コードで作る映画」がコンセプトのプロジェクト。AIコーディングエージェントが脚本を書き、すべてのフレームをコードで構築し、音響を設計して、MP4として渡してくれる。短編映画、長尺のYouTube動画、広告、解説動画、ミュージックビデオまでを対象に掲げる。作られて約5日で1.5Kスター、271フォークを集めた。脚本、絵、音までコードで束ねる大胆な工程設計が目を引く。", "概要\nsarpstar/cinecodeは、映像制作をコード生成の仕事として扱うプロジェクトだ。説明文は明快で、AIコーデ
