,"幼い子どもが「前世」を語るという報告を、科学はどう扱えるのか。因果推論の専門家ホルヘ・アンドレス・デルガド＝ロン氏がThe Conversationに寄せた解説が掲載された。米バージニア大学の研究部門は60年以上こうした事例を集め、2,254件の記録を持つ。予期しない死ほど生まれ変わりまでの期間が短いという分析結果について、筆者は報道を手がかりに照合したことによる偏りの可能性を指摘している。","\n【概要】幼い子どもが「前世の記憶」を語るという報告を、科学的にどう扱えるのかを論じた解説記事が掲載された。筆者はエクアドル出身で、因果推論を専門とするホルヘ・アンドレス・デルガド＝ロン氏。The Conversationに掲載された記事の転載である。\n\n【背景】米バージニア大学の知覚研究部門（DOPS）は、前世を覚えているように見える子どもの記録を60年以上集めてきた。データベースには2,254件の記録があり、1件あたり200を超える項目が含まれる。記事は、エクアドル・キトに住む3歳の男の子が、スペインで牛に腹を突かれた闘牛士だったと話した例も紹介している。ただしこの例はDOPSのデータには含まれず、確かめられていない親の証言である。\n\n【詳細】研究者らは照合済みの1,678件をオープンデータとして公開し、予期しない死ほど生まれ変わりまでの「中間期間」が短いという関連を見いだした。これに対し筆者は、予期しない死は報道されやすく、照合に報道記録を使ったことによる選択の偏りが原因かもしれないと指摘する。また、元DOPS所長のジム・タッカー氏が2026年4月のシンポジウムで示した暫定結果では、5〜13歳の子を持つ英語話者の米国の母親を全国から代表するように選んだ調査で、6.9%が子どもとの間でこうした感情的に意味のあるやりとりがあったと答えた。DOPSの分析では、異性として前世を語る子どもは、性別に典型的でない特徴を示す割合が有意に高かった。DOPSのフィリップ・コッツォリーノ氏は、こうした子ども、特にトラウマを生き延びたように見える子どもで、エピジェネティックな痕跡を探す計画だという。\n\n【ポイント・注意点】筆者は、こうした報告は生まれ変わりを証明するものではないとはっきり述べている。6.9%という数字は暫定的なもので、母親の報告を数えたものであり、前世の記憶が本物であることを示すものではない。記事で触れられたプラナリアや線虫、チョウでの記憶の受け渡しの研究も、人の前世の記憶とは別の話である。筆者は、親に子どもの様子を長く尋ねる発達のコホート研究で、こうした語りと他の特徴との関係を調べることを提案している。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-children-reincarnation-headlines.html"],["赤ちゃんが見る表情、研究用の誇張顔はまれ 家庭の録画分析","感情研究で使われる誇張された表情を、赤ちゃんは日常でほとんど見ていない。米カンザス大学などの研究チームが、生後6〜17か月の乳児の家庭で毎月1時間ずつ撮った録画を分析した。乳児が顔全体を見る機会自体が少なく、仮説上の「普遍的な表情」とぴったり一致する場面はまれだった。最も多い喜びの表情でも、顔全体を見ていた時間の約12%にとどまった。感情の学びは文脈に大きく頼ると研究者は考えている。","\n【概要】感情研究の実験でよく使われる、誇張された「典型的な表情」を、赤ちゃんは日常生活でほとんど目にしていないことが分かった。米カンザス大学のケイティ・ホーマン助教とジェフリー・ジラード准教授が共同で率い、ラトガース大学、ノースイースタン大学、カリフォルニア大学デービス校の研究者も加わった。論文は「Infants' facial input from 6 to 17 months rarely includes hypothesized expressive emotion prototypes」と題し、学術誌Communications Psychologyに掲載された。\n\n【背景】赤ちゃんがどのように感情を学ぶかを調べる研究では、喜びや怒りなどを大げさに表した顔の写真がよく使われてきた。こうした表情は、文化を超えて共通する感情の表れだという仮説に基づいている。しかし、乳児が実際の暮らしの中でどんな顔をどれだけ見ているかは、よく分かっていなかった。\n\n【詳細】チームは、生後6〜17か月の乳児の家庭で毎月1時間ずつ撮影された既存の録画データを分析した。乳児が顔や表情を見る頻度を分類し、仮説上の普遍的な表情と完全に一致する場面があるかを調べた。その結果、乳児が顔全体を見ること自体が少なかった。誇張された表情とぴったり一致する場面について、ホーマン氏は「本当にまれ」だと述べている。最も多かった喜びの表情でも、顔全体を見ていた時間の約12%にとどまった。現実の表情は幅が広く、同じ顔の動きでも状況によって意味が変わっていた。\n\n【ポイント・注意点】著者らは、感情の学びは文脈に深く根ざしており、乳児は言葉、身ぶり、動き、触れ合いなど、さまざまな手がかりを使っているのだろうと考えている。ホーマン氏は現在、乳児が見る顔と、養育者が使う「気持ち悪い」「ばっちい」といった感情の言葉との関係を調べている。記事には対象となった乳児の人数や録画の本数は書かれていない。今回の結果は、乳児がどう感情を学ぶかを証明したものではなく、これまでの研究で使われてきた刺激が日常を代表しているかに疑問を投げかけるものである。","2026-11-17","Medical Xpress","https://medicalxpress.com/news/2026-11-babies-rarely-exaggerated-facial-emotion.html"],["画面時間の長い子、10代で認知処理が良好 フィンランド8年追跡","フィンランドのユヴァスキュラ大学の研究チームが、子ども260人を8年間追跡した。子ども時代に画面を見る時間が長かった人ほど、平均15.8歳の時点で認知処理の成績が良い傾向があった。女子は軽い運動、男子は指導のある運動が多いほど作業記憶が良かった。一方、腕などにつける機器で測った全体の運動量や座っている時間は、認知の成績と関連しなかった。因果関係は確かめられていない。","\n【概要】フィンランドのユヴァスキュラ大学の研究チームが、子どもを8年間追跡し、運動や画面を見る時間と10代の認知機能との関係を調べた。子ども時代に画面を見る時間が長かった人ほど、思春期に認知処理の成績が良い傾向があった。論文は学術誌Pediatric Exercise Scienceの2026年38巻3号に掲載された。筆頭は博士課程の研究者ペトリ・ヤランコ氏で、ティモ・A・ラッカ氏やエーロ・A・ハーパラ氏らも加わった。\n\n【背景】研究は、子どもの運動と栄養を長く調べているフィンランドの「PANIC研究」の一部として行われた。画面を見る時間は子どもの発達に悪いと言われることが多いが、長期にわたって実際に測った研究は限られている。\n\n【詳細】対象は260人（女子124人、男子136人）で、思春期の評価時の平均年齢は15.8歳だった。運動や座っている時間は、質問票と、心拍と動きを記録する身につける機器の両方で測った。認知機能は、学習、注意、作業記憶を測るCogStateという検査で調べた。その結果、子ども時代を通じて画面を見る時間が長いほど、思春期の認知処理の成績が良かった。女子では軽い運動が多いほど、男子では指導や監督のある運動が多いほど、作業記憶が良かった。質問票では、指導のない運動が少ない10代ほど認知処理の成績が良い傾向もあった。一方、機器で測った全体の運動量や座っている時間は、認知の成績と関連しなかった。著者らは、機器では勉強しているのか休んでいるのかなど、実際に何をしているかまでは分からないためだと説明している。ヤランコ氏は「画面時間は子どもや若者の認知処理を支えうる」と述べ、考える力を引き出す運動と画面時間のバランスを求めている。\n\n【ポイント・注意点】結果は関連を示したもので、因果関係ではない。著者らは、因果や男女差を確かめるには介入研究が必要だとしている。画面で何をしていたかが時間の長さより大切かもしれないが、内容は直接測っておらず、仮説の段階にとどまる。対象はフィンランドの比較的小さな集団で、ほかの国にそのまま当てはまるとは限らない。","2026-11-17","ScienceDaily","https://www.sciencedaily.com/releases/2026/11/261116014725.htm"],["はしかから乳児を守る 生後6か月からの早期接種は安全","米国ではしかの流行が続くなか、米ミネソタ大学CIDRAPのワクチン・インテグリティ・プロジェクトが、生後6〜11か月の乳児への早期接種「ゼロ回目」に関する報告書を出した。母親から受け継いだ抗体は生後数か月で減るため、乳児は無防備になりやすい。デンマークの乳児6,540人の臨床試験などから、早期接種で副反応が増える証拠はないとした。ただし、12〜15か月からの通常の2回接種は引き続き必要という。","\n【概要】米国ではしか（麻疹）の流行が続くなか、米ミネソタ大学の感染症研究政策センター（CIDRAP）のワクチン・インテグリティ・プロジェクトが、乳児への早期接種に関する特別報告書「Protecting US Infants from Measles: Understanding the Zero Dose」を発表した。生後6〜11か月で打つ「ゼロ回目」の接種は安全で、流行地では乳児を守る手段になるとしている。\n\n【背景】記事によると、米国では今年、45州で5,400件を超えるはしかの症例と10人の死亡が報告された。汎米保健機構は、米国が26年以上保ってきたはしか排除の地位を取り消した。通常、MMRワクチンは生後12〜15か月から接種する。しかし、母親から受け継いだ抗体は生後数か月で減っていくため、その間の乳児ははしかに無防備になりやすい。\n\n【詳細】報告書は、海外渡航する乳児や、流行地に住む・訪れる生後6〜11か月の乳児に、早期の「ゼロ回目」接種を勧めている。MMRの有効性は、生後9か月より前に打つと58%、9〜11か月で打つと83%とされる。安全性については、デンマークの乳児6,540人を対象にした無作為化臨床試験で、生後5〜7か月でのMMR接種はプラセボと比べて副反応が多くなかった。また15件の安全性研究のレビューでも、9か月より前に打った乳児と、より大きくなってから打った乳児で、有害事象のリスクに差はなかった。共著者のハイディ・モリーン氏は「MMRワクチンは安全で、はしかによる重い病気や合併症を防ぐのに非常に効果的だ」と述べている。\n\n【ポイント・注意点】MMRは発熱を起こすことがあり、一部の子では熱性けいれんと関連してきたが、報告書はそのリスクは非常に低く、6〜11か月で高くなるデータはないとした。12か月未満で得た免疫は長続きしにくい可能性があるため、早期に打った乳児も、12〜15か月からの通常の2回接種を受ける必要がある。これは臨床ガイドラインではなく報告書の評価であり、接種するかどうかは子どものかかりつけの医療者と相談するよう勧められている。","2026-11-17","Medical Xpress","https://medicalxpress.com/news/2026-11-measles-cases-mount-highlights-safety.html"],["6歳未満の貧困率21.3% ヒューストンが大都市圏で最悪","米ライス大学キンダー都市研究所が、ヒューストン地域の経済的な上昇の機会についての報告書を出した。10郡からなるヒューストン都市圏では、6歳未満の子どもの21.3%が貧困線を下回って暮らしており、米国の大都市圏上位10の中で最も高かった。16〜24歳で学校にも仕事にも属さない若者も13.3%で、やはり上位10の中で最も多い。報告書は2040年までに目指す4つの目標を提案している。","\n【概要】米ライス大学のキンダー都市研究所が、ヒューストン地域の経済的な上昇の機会に関する報告書の第2部「Economic Mobility in the Houston Area: Part 2: A Proposal of Four North Stars」を発表した。地域の連合組織が2040年までに目指す、測ることのできる4つの目標を提案している。報告書の筆頭はハサン・アハメド氏らである。\n\n【背景】幼い時期の貧困や住む地域の環境は、子どもの育ちとその後の人生に影響すると考えられている。報告書の第1部では、2014〜16年の原油価格の暴落のあと、ヒューストンが石油への依存が小さい都市圏に比べて雇用や収入の伸びで後れを取ったことが示されていた。\n\n【詳細】10郡からなるヒューストン都市圏では、6歳未満の子どもの21.3%が貧困線を下回って暮らしていた。これは米国の大都市圏上位10の中で最も高い。6歳未満の子がいる世帯のうち、機会に恵まれた地域に持ち家がある世帯は30.6%で、上位50都市圏の中で下位4分の1に入った。16〜24歳で学校にも仕事にも属さない若者は13.3%で、上位10都市圏で最も多かった。30〜34歳が世帯主の世帯のうち、働いて得る収入で郡と世帯の構成に合わせた生活水準を満たせるのは59.5%だった。各目標は、誰でも確かめられる公開の全国データと組み合わされており、ほかの地域とも比べられる。同大学経済的流動性センターのフラヴィオ・クーニャ所長は、成功とは何か、どう測るかについて合意する必要があると話した。\n\n【ポイント・注意点】この枠組みは議論の出発点として示されたもので、最終的な目標ではない。採用するか、修正するか、別の目標にするかは連合組織が決める。ひとつの指標で経済的な上昇の機会をとらえることはできず、住宅、教育、健康、雇用などをまたいだ取り組みが必要とされる。指標で状況の改善は見られても、それが取り組みの成果かどうかまでは判断できないと研究者は注意している。次の報告では、個々の取り組みが効果を上げているかをどう評価するかを扱う予定だ。","2026-11-17","Phys.org","https://phys.org/news/2026-11-houston-large-metros-child-poverty.html"],["胎児期と幼少期の環境、子の健康に幅広く影響 欧州HELIX","スペインのバルセロナ世界保健研究所（ISGlobal）とフランスの国立保健医学研究所が、胎児期の69、子ども時代の129の環境要因と、6〜11歳と12〜18歳の11の健康指標との関連を一度に調べた。胎児期の6、子ども時代の42の要因が複数の健康指標と関連した。妊娠中の母親の喫煙は、子のBMIの高さや行動面の問題、思春期のADHD症状と関連していた。関連は因果を示すものではない。","\n【概要】スペインのバルセロナ世界保健研究所（ISGlobal）が主導し、フランスの国立保健医学研究所（Inserm）と行った研究で、胎児期と子ども時代に受ける多くの環境要因が、子どもから思春期までの健康に幅広く関わっていることが分かった。欧州の「HELIX」プロジェクトの一環で、学術誌Science Advancesに掲載された。筆頭著者はアウグスト・アンギタ＝ルイス氏である。\n\n【背景】人が生涯に受ける環境の影響全体は「エクスポソーム」と呼ばれる。これまでの研究は、ひとつの要因とひとつの病気の関係を調べるものが多かった。今回は、多くの要因と多くの健康の結果を同時に調べる方法をとった。\n\n【詳細】調べたのは、胎児期の69の要因と子ども時代の129の要因で、食事、運動、睡眠、たばこの煙、屋内外の大気汚染、化学物質、金属、まちの作りなどを含む。健康の結果は6〜11歳と12〜18歳で測った11の指標で、BMIや血圧、ADHDや内向的・外向的な問題行動、ぜんそくや喘鳴、皮膚炎や鼻炎が含まれる。その結果、胎児期の6つ、子ども時代の42の要因が、複数の健康の結果や領域と関連していた。4つの領域すべてと関連する要因はなかったが、選ばれた要因の約3分の1は複数の領域と関連した。妊娠中の母親の喫煙は、幼少期と思春期のBMIの高さや外向的な問題行動、思春期のADHD症状の多さと関連していた。妊娠中の母親の肉の摂取量の多さは、いくつかの心の健康の結果や、子どものぜんそく、喘鳴、皮膚炎と関連していた。幼少期に見られた関連の多くは、思春期にも残っていた。\n\n【ポイント・注意点】著者ら自身が、この研究は「これらの要因が健康の結果を引き起こすことを示すものではない」と述べている。関係を確かめ、要因を変えることで健康の道筋が変わるかを調べるには、より大きく多様な集団での研究が必要だという。チームは関連を見られる公開の対話型アトラスも出しており、今後の研究の仮説づくりに使えるとしている。参加者の人数は記事には示されていない。","2026-11-16","Medical Xpress","https://medicalxpress.com/news/2026-11-early-life-environmental-factors-linked.html"],["カンガルーケアで小さな赤ちゃんの死亡が減る コクラン","低出生体重児や早産児に肌と肌を触れ合わせる「カンガルーケア」の効果を、49件の無作為化比較試験、7,724人の新生児のデータで見直したコクランの最新レビューが出た。カンガルーケアは入院中の死亡を減らし、院内感染や敗血症のリスクを下げる可能性が高いという。完全母乳を増やし、低体温を減らす可能性もある。ただし、1日にどれだけ続けるのが最適かは、証拠が足りていない。","\n【概要】低出生体重児や早産児に対する「カンガルーケア」の効果を見直した、コクランの系統的レビューの最新版が発表された。題は「Kangaroo mother care to reduce morbidity and mortality in low birthweight infants」で、Cochrane Database of Systematic Reviewsに掲載された。カンガルーケアは入院中の死亡を減らし、院内感染や敗血症のリスクを下げる可能性が高いという。筆頭はスウェーデン・エーレブルー大学のエマ・オルソン博士で、米バーモント大学のロジャー・ソル博士も加わった。\n\n【背景】カンガルーケアは一般に、生まれて早い時期から肌と肌を長く触れ合わせ、頻繁に母乳だけを与え、状態が許せば早めに退院させるケアを指す。2016年版のレビューは世界保健機関（WHO）の指針の根拠になった。今回は、その時から研究の数がおよそ2倍に増えた。コクランのレビューは、複数の臨床試験の結果を決まった手順で集めて評価するもので、医療の指針づくりで重く見られている。\n\n【詳細】レビューは49件の無作為化比較試験を対象とし、低出生体重または早産の新生児7,724人を含む。その結果、カンガルーケアはおそらく入院中の死亡を減らし、院内で起こる感染や敗血症のリスクを下げることが分かった。また、母乳だけで育てる割合を高め、低体温を減らす可能性もある。効果は特に資源の限られた地域ではっきりしており、証拠の多くもそうした地域から得られたものだった。オルソン博士は、最も弱い新生児の一部で死亡が減ったことを「最も目を引く結果」だと述べている。\n\n【ポイント・注意点】WHOの現在の指針は1日8時間以上のカンガルーケアを勧めているが、時間を長くするほど効果が大きいのか、どのくらいが最適なのかを判断する証拠は足りなかった。高所得国での証拠の確かさは低く、死亡率がすでに非常に低い先進的な新生児集中治療室にどこまで当てはまるかは分かっていない。毎日長時間の肌の触れ合いは、すべての親や養育者にとって実行できるとは限らない。ソル博士は、いつ、誰に、どう行うのが最善かについて、さらに研究が必要だとしている。","2026-11-16","Medical Xpress","https://medicalxpress.com/news/2026-11-kangaroo-small-babies.html"],["親が関わる10代ほど、ネットいじめの被害者を助けようとする","イスラエルのヘブライ大学などの研究チームが、10代のネット生活を測る43項目の質問票を作り、2つの集団の計617人で試した。成果はいじめ防止の国際学術誌に掲載された。親がネットでの生活に関わり、よく話していると感じている10代ほど、ネットいじめの場面に共感的に反応し、被害者を支えようとする意図を示した。一方、親の関わりはネットの利用時間や有害な内容に触れる量とはほとんど関連しなかった。","\n【概要】イスラエルのヘブライ大学のアリエル・クナフォ＝ノアム氏らと、テルアビブ・ヤッフォ大学のヒラ・セガル博士の研究チームが、10代のネットでの経験とネットいじめへの反応を測る新しい質問票を作った。親の関わりが大きいと感じている10代ほど、いじめの被害者を助けようとする傾向があった。論文は学術誌International Journal of Bullying Preventionに掲載された。\n\n【背景】ネットいじめを防ぐには、利用時間を減らすことが大切だと考えられがちだ。しかし、10代のネット生活のどの部分が、いじめを見たときの反応と結びついているのかは、十分に分かっていなかった。\n\n【詳細】チームは43項目からなる「オンライン行動質問票（OBQ）」を作った。ネットの利用、有害な内容に触れること、ネットいじめへの反応、そのときにとろうとする行動、親の関わりの感じ方など、10代のネット生活の6つの面を扱う。2つの独立した集団、計617人の10代で試したところ、質問票の構造はおおむね一貫していた。参加者は、見た目や成績、体型をからかう現実的なネットいじめの場面を読み、どう感じ、どう行動するかを答えた。その結果、親がネットでの生活に関わり、よく話していると感じている10代ほど、いじめに対して同情的な気持ちを示し、目撃したときに被害者を支える行動をとろうとしていた。一方、親の関わりは、ネットの利用時間や有害な内容に触れる量とはほとんど、または全く関連しなかった。著者らは、共感や、傍観せずに動く行動を育てるのに、ネットの利用全体を減らす必要はないかもしれないとしている。\n\n【ポイント・注意点】調査は本人の自己申告を1時点で集めたもので、親の関わりが共感的な行動を生むという因果関係は示せない。測ったのは助けようとする「意図」で、実際に助けたかどうかではない。研究者らは、この質問票は主に研究用の予備的な道具であり、広く使うには文化をまたいだ研究や長期の研究が必要だとしている。参加者の年齢の幅は記事に書かれていない。","2026-11-16","Medical Xpress","https://medicalxpress.com/news/2026-11-teens-greater-parental-involvement-cyberbullying.html"],["ペットは子の心に良いと親の4人に3人 米ミシガン大調査","米ミシガン大学C.S.モット小児病院の全国調査「Mott Poll」で、6〜12歳の子を持つ親1,037人の4人に3人が、ペットは子どもの心の健康に良いと答えた。ペットのいる家庭の約3分の2では、子どもがえさやりや運動・遊びを手伝っている。一方、手伝いを繰り返し怠ったらペットを手放すべきと考える親は約7人に1人で、手放すと子どもの心の傷になると考える親は5人に2人を超えた。","\n【概要】米ミシガン大学のC.S.モット小児病院が行う「子どもの健康に関する全国調査（Mott Poll）」で、親の4人に3人が、ペットは子どもの心の健康に良いと考えていることが分かった。多くの親は、学齢期の子どもにペットの世話を手伝うことも期待していた。報告の題は「Choice or chore: Involving children in pet care」である。\n\n【背景】ペットは子どもの仲間となり、共感の心を育てる助けになるとよく言われる。今回の調査は、6〜12歳の子を持つ親1,037人から回答を得たもので、全国を代表するように集めたとされる。\n\n【詳細】ペットのいる家庭（親の3分の2近く）では、約3分の2が、子どもがえさやりや運動・遊びを手伝っていると答えた。後片付けを手伝う子は半数に満たず、約8人に1人はどの世話も手伝っていなかった。約半数の親は毎日の手伝いを、3分の1弱は週に数回の手伝いを期待していた。子どもが手伝いをしなかったとき、最も多い対応は声かけで、約3分の1はほかの家族が代わり、約4分の1は画面時間を減らすなどの罰を与えていた。手伝いを繰り返し怠ったらペットを手放すべきだと考える親は約7人に1人で、手放すと子どもの心の傷になると考える親は5人に2人を超えた。ペットのいない家庭では、10人に7人が、子どもにペットを欲しがられたことがあると答えた。飼わない理由は、時間（約5人に2人）、費用（約3分の1）、欲しくない（4人に1人超）、アレルギー（4人に1人近く）などだった。共同責任者のサラ・クラーク氏は、ペットは子どもに仲間を与え、共感を育てる助けになると述べている。\n\n【ポイント・注意点】クラーク氏は「ペットは衝動買いや、家族で話し合っていないサプライズであってはならない」と話す。調査は、子どもの年齢と成熟度に合わせて仕事を決める、やり方を見せる、なぜ大切かを説明することを勧めている。結果は親の回答によるもので、子ども自身の声は含まれない。6〜12歳の子の親だけが対象で、誤差の幅などは記事に示されていない。","2026-11-16","Medical Xpress","https://medicalxpress.com/news/2026-11-national-poll-parents-pets-benefit.html"],["毎日の鉄剤、子どもと10代の鉄欠乏性貧血を減らす コクラン","米コーネル大学の研究者らが率いたコクランのレビューで、毎日の鉄剤の服用が、乳児から10代までの鉄欠乏性貧血をおそらく減らすことが分かった。114件の研究、5万人を超える子どもと若者が対象で、多くはアジアの5歳未満の子どもだった。一方、鉄剤だけでは、同じ年齢・性別の子と比べた身長や体重に影響はなかった。著者らは、すべての子どもに毎日の鉄剤が必要という意味ではないとしている。","\n【概要】米コーネル大学の精密栄養・健康センターの研究者らが率いたコクランの系統的レビューで、毎日の鉄剤の服用が、乳児、子ども、10代の鉄欠乏性貧血をおそらく減らすことが示された。筆頭著者はクリパ・ラジャゴパラン博士、責任著者はサウラブ・メータ博士で、ジュリア・L・フィンケルスタイン博士も加わった。題は「Daily iron supplementation for prevention or treatment of iron-deficiency anaemia in infants, children, and adolescents」である。\n\n【背景】記事によると、世界で約8億7,400万人の子どもと女性が貧血の影響を受けており、2019年には5歳未満の子どもの40%が貧血だった。貧血のおよそ半分は鉄の不足によるものとされる。\n\n【詳細】レビューは114件の研究、5万人を超える子どもと若者を対象とした。多くはアジアで行われ、5歳未満の子どもに注目したものだった。調べたのは、毎日の鉄剤のみ、鉄と葉酸、鉄とほかのビタミン・ミネラルの3つの方法である。その結果、鉄剤のみは、何もしない場合や偽薬と比べて、鉄欠乏性貧血をおそらく減らした。鉄と葉酸もおそらく減らすが、これは1件の研究に基づく。鉄とほかのビタミン・ミネラルも減らす可能性がある。一方、鉄剤のみでは、同じ年齢・性別の子と比べた身長や体重に影響はなかった。せきや発熱、呼吸器の病気にも影響はなかった。副作用では、鉄剤で便の色が変わることが増える可能性があり、ほかのビタミン・ミネラルと一緒にとる場合は、鉄を含まないものと比べて嘔吐がおそらく増えた。\n\n【ポイント・注意点】貧血や鉄欠乏そのものを含め、いくつかの結果では証拠の確かさが低い、または非常に低いとされた。著者らは、この結果は必要な場合の鉄剤の使用を支えるもので、すべての子どもや若者に毎日の鉄剤が必要という意味ではないとしている。一人ひとりの栄養の必要、その地域での鉄欠乏や貧血の多さ、剤形を考えて判断すべきだという。記事は認知や発達への影響については触れていない。","2026-11-16","Medical Xpress","https://medicalxpress.com/news/2026-11-daily-iron-supplements-deficiency-anemia.html"],["胎内と幼少期の肥満、長く続く免疫の弱さを招く マウス研究","米ペンシルベニア大学の研究チームが、母親の胎内や生後早い時期に高脂肪の食事にさらされると、免疫が長く弱くなることをマウスで示した。肥満の若いマウスでは、抗体を作るのを助けるT細胞の一種が育ちにくく、ワクチンの効きが弱かった。原因は未熟なT細胞でA20という酵素の遺伝子の働きが抑えられることだった。成果は学術誌Nature Immunologyに掲載された。研究者は、生後早い時期が大切な窓だとみている。","\n【概要】米ペンシルベニア大学ペレルマン医学部の研究チームが、母親の胎内や生後早い時期に高脂肪の食事にさらされると、免疫の働きが長く弱くなることをマウスで示した。論文は「Maternal and early life obesity programs CD4+ T cell fate to impair vaccine immunity」と題し、学術誌Nature Immunologyに掲載された。共同責任著者は病理学のホルヘ・エナオ＝メヒア教授と小児科のサラ・ヘンリクソン助教である。\n\n【背景】子どもの肥満が重い呼吸器のウイルス感染と結びつくことは、以前から知られていた。しかし、幼い時期の肥満が免疫の仕組みをどのように変えるのかは、よく分かっていなかった。\n\n【詳細】チームは子どもの肥満を再現したマウスを使った。胎内や生後早い時期に高脂肪の食事にさらされたマウスでは、免疫の弱さが長く続いた。肥満の若いマウスでは、効果的な抗体の反応を進める免疫細胞の種類が少なく、ワクチンへの反応が弱かった。直接の原因は、未熟なT細胞が「T濾胞ヘルパー細胞」へ育つ割合が減り、炎症を起こしやすい種類のT細胞が増えたことだった。さらにこの変化は、未熟なT細胞の中で酵素A20の遺伝子の働きが抑えられる、という書き換えにさかのぼることが分かった。人の側では、A20の遺伝子が片方欠けるまれな遺伝性の病気の患者5人の免疫細胞を調べ、T濾胞ヘルパー細胞が大きく不足していることを確かめた。これは肥満の若いマウスと似た状態だった。エナオ＝メヒア教授は「母親と生後早い時期の食事は、発達中のT細胞を長く書き換える環境の信号になる」と述べている。\n\n【ポイント・注意点】主な証拠はマウスの実験によるもので、人のデータは遺伝性の病気の患者5人分にとどまる。高脂肪の食事を受けた人での影響は確かめられていない。研究者らは、うまく設計された薬でこの弱さを元に戻せる可能性を示唆しているが、試された結果ではない。マウス実験の数は記事に示されていない。","2026-11-16","Medical Xpress","https://medicalxpress.com/news/2026-11-early-life-exposure-obesity-term.html"],["発達の遅れを起こすまれな病気、ビタミンB12で改善 線虫で","ドイツのマックス・プランク老化生物学研究所の研究チームが、発達の遅れや成長の障害、低身長を起こすまれな遺伝性の病気「フェルヘイ症候群」の手がかりを線虫で見つけた。関連する遺伝子に変異のある線虫は成長が遅く体が小さかったが、ビタミンB12を加えると発達の異常が改善した。患者の血液でも似た代謝の変化が見られた。成果はNature Communicationsに掲載されたが、人で効くかはまだ確かめられていない。","\n【概要】ドイツのマックス・プランク老化生物学研究所の研究チームが、発達の遅れや成長の障害、低身長を起こすまれな遺伝性の病気「フェルヘイ症候群」について、ビタミンB12が手がかりになる可能性を線虫で示した。論文は「Vitamin B12 alleviates spliceosomopathy via phospholipid remodeling」と題し、学術誌Nature Communicationsに掲載された。ケルン大学病院の小児神経科医も加わった。\n\n【背景】フェルヘイ症候群は、RNAの「スプライシング」に関わる遺伝子と結びついている。スプライシングは、遺伝情報を写したメッセンジャーRNAを切り整えてつなぐ過程である。チームはもともと、寿命に関わる未知の遺伝子を線虫で探していて、この病気に関連するスプライシング遺伝子の変異に行き当たった。\n\n【詳細】変異を持つ線虫は成長が遅く、体が小さいままだった。遺伝子のスクリーニングと代謝の分析から、この変異がビタミンB12に依存する代謝の経路を乱していることが分かった。ビタミンB12を加えると、これらの経路は正常に戻り、線虫の発達の異常も改善した。さらに、公開されている人の細胞のデータと、フェルヘイ症候群の患者の血液を調べたところ、似た代謝の変化が見られた。筆頭著者のヨナタン・ケルシュバッハ氏は「RNAの処理という基本的な過程の変化が、これほど狙いの絞られた影響を持つとは驚いた」と述べている。研究所長のアダム・アンテビ氏は、モデル生物の基礎研究が人の病気に新しい見方をもたらす良い例だとしている。\n\n【ポイント・注意点】ビタミンB12の補給がフェルヘイ症候群の人の症状を改善するかは、まだ確かめられていない。主な証拠は線虫によるもので、患者の治療を考えるにはさらに研究が必要とされる。記事には調べた患者の人数や年齢は書かれていない。著者らは、スプライシングに関わる病気では代謝の乱れがこれまで考えられていたより大きな役割を持つかもしれないとしているが、これは今後の可能性の段階にとどまる。","2026-11-16","ScienceDaily","https://www.sciencedaily.com/releases/2026/11/261115085552.htm"],["ADHDは呼吸や時間の感じ方にも 米神経科学会で4つの発表","米国の子どもの約9人に1人がADHDの診断を受けている。米国神経科学会の年次大会「Neuroscience 2026」で、ADHDに関する4つの研究が発表された。ADHDのある若い成人には特有の呼吸のパターンがあること、慢性的に時間に追われる感覚があること、ADHDの子どもと10代の脳の鉄が少ないこと、薬が飲酒の問題を減らしうることが報告された。いずれも学会発表の段階である。","\n【概要】米国神経科学会の年次大会「Neuroscience 2026」で、ADHD（注意欠如・多動症）が脳だけでなく体や知覚、行動に広く関わることを示す4つの研究が発表された。記事によると、米国の子どもの約9人に1人がADHDの診断を受けている。\n\n【背景】ADHDは注意や行動の問題として語られることが多いが、体の働きや時間の感じ方などとの関係は、まだ十分に分かっていない。司会を務めたジョージタウン大学の認知神経科学者チャンダン・ヴァイディヤ氏は、ADHDは多くの脳と体の変数に影響する、より広い全身の状態だと述べている。大会では、呼吸、時間の感覚、脳の鉄、飲酒という異なる切り口から、ADHDの広がりを探る発表がそろった。\n\n【詳細】1つ目は、イスラエルのワイツマン科学研究所のティムナ・ソロカ氏の発表で、ADHDのある若い成人には、ADHDのない人と区別できる呼吸のパターンがあり、そのパターンは刺激薬で変わることを報告した。2つ目は、カリフォルニア州立大学フレズノ校のケリー・カラスコ氏で、ADHDのある人は、いつも遅れを取っているという慢性的な時間の焦りを感じていると報告した。3つ目は、カリフォルニア大学サンディエゴ校のジョナサン・アハーン氏で、ADHDの子どもと10代の脳の画像では、対照群に比べて脳の鉄の量が少なく、時間とともに影響を受ける特定の脳の領域も見つかったと報告した。4つ目は、フロリダ大学のアマンダ・エルトン氏で、ADHDとアルコール使用障害の両方がある若い成人では、ADHDの薬が飲酒の問題を減らす助けになりうると報告した。\n\n【ポイント・注意点】記事には学術誌の名前がなく、これらは査読を経た論文ではなく学会での発表と見られる。どの研究についても、参加者の人数や詳しい方法は記事に示されていない。年齢についても「若い成人」「子どもと10代」とあるだけである。記事の要約部分は大規模言語モデルが自動で作ったものだと明記されている。いずれも初期段階の報告として、慎重に受け止める必要がある。","2026-11-14","Medical Xpress","https://medicalxpress.com/news/2026-11-adhd-effects-perception-behavior.html"],["PFASのPFOS、低濃度でも胚の初期発達を乱す 幹細胞モデル","スウェーデンのカロリンスカ研究所の研究チームが、ヒトの幹細胞から作った初期胚のモデルを使い、「永遠の化学物質」と呼ばれるPFASの影響を調べた。3種類のうちPFOSの影響が最も強く、妊婦の血中濃度に当たる1リットルあたり7ナノモルでも、胚に似た構造の成長が遅く小さかった。精子や卵子のもとになる細胞では746の遺伝子の働きが変わっていた。実際の妊娠で起きるかは確かめられていない。","\n【概要】スウェーデンのカロリンスカ研究所の研究チームが、ヒトの幹細胞から作った初期胚のモデルを使い、「永遠の化学物質」と呼ばれる有機フッ素化合物（PFAS）が、着床直後の発達を乱すことを示した。論文は「PFOS disrupts the development of early germline and surrounding embryonic soma at environmentally relevant exposure levels」と題し、学術誌Human Reproduction Openに掲載された。研究を率いたのは、同研究所の女性と子どもの健康部門のジョアン・ペドロ・アルヴェス＝ロペス助教である。\n\n【背景】PFASは分解されにくく、環境や人の体に長くとどまる。妊娠中の母親の体にもあり、胎児への影響が心配されているが、人の発達のごく初期にどう作用するかは調べにくかった。\n\n【詳細】チームは、規制対象となっている3種類のPFAS、PFOS、PFOA、PFHxSを調べた。ヒトの多能性幹細胞から、胚が着床した直後の発達を再現する立体のモデルを作った。このモデルでは、精子や卵子のもとになる始原生殖細胞もできる。実験は4日間行った。その結果、3種類のうちPFOSの影響が最も強かった。胚に似た構造は、何も加えないものより成長が遅く、小さいままだった。これは試した最も低い濃度、1リットルあたり7ナノモルでも起きた。この濃度は、スウェーデンのSELMA研究で妊婦の血清から測られたPFOSの濃度に合わせて選ばれた。始原生殖細胞はできたものの、遺伝子の働きは大きく変わっており、最も低い濃度でも746の遺伝子が対照と異なり、発達や細胞の信号に関わる過程が抑えられていた。アルヴェス＝ロペス氏は、PFOSが低い濃度でも、人の胚と生殖細胞の発達の基本的な過程を乱しうると述べている。\n\n【ポイント・注意点】このモデルは、人の胚や子宮の環境を完全に再現するものではない。長期的な影響を確かめるには、動物モデルや人の疫学データが必要とされる。今回の変化が実際の人の妊娠で起きるかどうかは示されていない。まだ性質の分かっていないPFASは多く、著者らはこのモデルをそれらの選別に使えるとしている。","2026-11-13","Medical Xpress","https://medicalxpress.com/news/2026-11-chemical-disturbs-early-stem-cell.html"],["湿疹のある子は睡眠の問題が多め 2万6千人の記録を分析","アトピー性皮膚炎（湿疹）のある子どもは、睡眠の問題を抱えやすいことが、0〜21歳の2万6,000人を超える子どもの診療記録の分析で分かった。米国アレルギー・ぜんそく・免疫学会の2026年の年次大会で発表された。湿疹のある子は約15%で、そのうち約12%に睡眠の問題があり、湿疹のない子の約10%より多かった。研究者は、湿疹の診察で睡眠についても尋ねるよう勧めている。","\n【概要】アトピー性皮膚炎（湿疹）のある子どもは、睡眠の問題を抱えやすい傾向があることが、2万6,000人を超える子どもの診療記録の分析で分かった。研究は米国アレルギー・ぜんそく・免疫学会（ACAAI）の2026年年次大会で発表され、学術誌Annals of Allergy, Asthma & Immunologyに掲載された。率いたのはACAAI会員のサマンサ・サンダーマイヤー博士で、題は「Scratching the Surface: Sleep Disturbance in Children with Atopic Dermatitis in an Urban Population – A Retrospective Analysis」である。\n\n【背景】湿疹はかゆみなど皮膚の症状として注目されがちだが、睡眠は子どもの成長や毎日の調子に深く関わる。湿疹と睡眠の問題がどの程度重なっているのかを、都市部の大きな集団で調べた。\n\n【詳細】研究は、2024年1月から2026年1月までにかかりつけの診療所を受診した、0歳から21歳までの子ども2万6,000人超の診療記録を振り返って調べたものだ。湿疹、睡眠の問題、ぜんそくや花粉症などほかのアレルギーの病気、心の健康の状態の診断を探した。その結果、約15%の子どもに湿疹があり、全体の約10%に睡眠の問題の診断があった。湿疹のある子どもでは約12%に睡眠の問題があり、湿疹のない子どもの約10%より多かった。湿疹と睡眠の関連は、心の健康の状態やほかのアレルギーの病気があるかどうかに関係なく、似た程度に見られた。サンダーマイヤー博士は、湿疹は子どもの全体的な健やかさと関わっていると述べ、「皮膚の症状だけでなく、睡眠についても尋ねることの大切さを示している」と話した。\n\n【ポイント・注意点】研究は過去の記録をさかのぼる観察研究で、関連を示しただけで因果関係は分からない。記録された診断に頼っているため、診断されていない睡眠の問題は見落とされている可能性がある。対象は都市部のひとつの診療の場に限られ、ほかの地域に当てはまるかは分からない。差は12%と10%と小さく、統計的な数値は記事に示されていない。","2026-11-12","Medical Xpress","https://medicalxpress.com/news/2026-11-link-eczema-problems-kids.html"],["妊娠中の山火事の煙、幼い子のぜんそくと関連 米北カリフォルニア","米北カリフォルニアで生まれた正期産の子ども1,097人を調べた研究で、妊娠中に山火事の煙などの大気汚染にさらされると、幼い時期のぜんそくと関連することが分かった。妊娠4〜6か月のPM2.5、妊娠7〜9か月と出生前後の山火事由来の汚染が多いほど、ぜんそくが多かった。米国アレルギー・ぜんそく・免疫学会の年次大会で発表された。筆頭著者はアン・グエン医師。因果関係は証明されていない。","\n【概要】妊娠中に山火事の煙などの大気汚染にさらされることが、生まれた子の幼い時期のぜんそくと関連していることが、米北カリフォルニアの子どもを対象にした研究で分かった。論文は「Effect of Prenatal Wildfire Exposure on Asthma Development」と題し、学術誌Annals of Allergy, Asthma & Immunologyに掲載され、米国アレルギー・ぜんそく・免疫学会（ACAAI）の2026年年次大会で発表された。筆頭著者はアン・グエン医師である。\n\n【背景】北カリフォルニアでは2017〜2020年に大規模な山火事が相次いだ。妊娠中の大気汚染が子どもの呼吸器に影響する可能性は指摘されてきたが、山火事の煙に絞ってみた研究は多くない。\n\n【詳細】対象は北カリフォルニアで生まれた正期産の子ども1,097人である。うち108人は、母親が2017〜2020年の山火事の時期に妊娠していた「B-SAFE」研究の参加者で、残る989人は2017〜2019年に山火事の影響を受けた地域からカリフォルニア大学デービス校医療センターで生まれた子どもで、カルテの確認によって加えられた。研究者らは、妊娠中と出生後の母親の大気汚染への毎日のばく露を推定し、微小粒子状物質PM2.5と、山火事の煙による汚染を分けて調べた。子どもの年齢と性別、出生時の妊娠週数、ぜんそくの家族歴、妊娠中のたばこの煙へのばく露を調整した。その結果、妊娠中期（4〜6か月）のPM2.5が多いほど、幼い時期のぜんそくと関連していた。妊娠後期（7〜9か月）と出生前後の山火事由来の汚染が多いことも、幼い時期のぜんそくと関連していた。\n\n【ポイント・注意点】この研究は関連を示したもので、煙がぜんそくを引き起こすことを証明したわけではない。効果の大きさなどの数値は記事に示されていない。グエン医師は「妊婦は山火事がいつ起きるかを選べない」としたうえで、煙の多い日は屋内にいて窓を閉め、空気清浄機を使うことを勧めている。","2026-11-12","Medical Xpress","https://medicalxpress.com/news/2026-11-wildfire-pregnancy-linked-asthma-young.html"],["子どもは肌の色に気づいている 人種の話は幼いうちから","子どもは肌の色の違いに気づかない「カラーブラインド」ではない。人種や言語、識字を研究する3人の研究者がThe Conversationに寄せた解説が掲載された。生後3か月の乳児でも肌の色や顔立ちの違いに気づき、2〜3歳で人種に良い・悪いの意味づけをし始めるという。筆者らは、3歳ごろから人種差別について話し始められるとし、日常の会話や絵本を通じた関わり方を提案している。","\n【概要】子どもは肌の色の違いに気づかない「カラーブラインド」ではなく、幼いうちから人種について話すことが大切だとする解説記事が掲載された。筆者は、人種、言語、文化、識字を研究するウィントレ・フォックスワース・ジョンソン氏、マリア・G・レイハ氏、サバ・カーン・ヴラッハ氏の3人で、The Conversationに掲載された記事の転載である。\n\n【背景】大人の中には、子どもは人種の違いを気にしないので、話題にしない方がよいと考える人もいる。筆者らは、こうした「色を見ない」態度は、子どもから人種について話すための言葉を奪ってしまうと指摘する。\n\n【詳細】記事によると、生後3か月の乳児でも肌の色や顔立ちの違いに気づき、2〜3歳の子どもは人種に良い・悪いの意味づけをし始める。幼い子どもは人種の違いに好奇心を持つのがふつうで、自分と似た見た目の友だちを選び始めたり、人種への偏りを身につけたりすることもある。はっきり話し合わないと、子どもは固定観念や、不平等の原因について誤った思い込みを持ちうるという。筆者らは、教育者や養育者は3歳ごろの子どもとも人種差別について話し始められるとしている。具体的には、大人がまず自分の暮らしや地域で人種がどう働いているかを、地域や国の歴史を含めて見つめ直すこと、肌の色や民族、文化、言葉について日常やメディアの中で自然に話すこと、有色の人々が楽しく暮らす姿を描いた絵本をそろえることを勧めている。絵本の例として、低学年向けの『The Talk』（2022年）や、4〜7歳向けの『Rez Kid』（2025年）などを挙げた。子どもが不公正に気づき、変える方法を考えて行動できるよう助けることも挙げた。\n\n【ポイント・注意点】この記事は筆者らの見方に基づく解説で、系統的なレビューではない。引用されている研究の多くはリンクで示されるだけで、方法や参加者の人数、効果の大きさは記事に書かれていない。3歳で人種差別について話すという勧めも、教室での経験と一般的な研究に基づくものである。米国の事情を前提にしている点にも注意が必要だ。","2026-11-12","Phys.org","https://phys.org/news/2026-11-children-colorblind-early-conversations-essential.html"],["思春期が来ないXYの姉妹 全ゲノム解析で原因遺伝子を特定","ベトナムで、XY染色体を持ちながら外性器が女性型で、思春期が来ない姉妹の原因が、豪ハドソン医学研究所などの全ゲノム解析で分かった。姉妹はCYB5Aという遺伝子に、父と母から1つずつ異なる変異を受け継いでいた。どちらの変異も単独では害がないが、組み合わさると性ホルモンを作るのに必要なたんぱく質ができなくなると予測される。この性分化の違いは世界で4例目という。成果は臨床内分泌学の専門誌に掲載された。","\n【概要】ベトナムで、XY染色体を持ちながら外性器が女性型でテストステロンが低い姉妹について、原因となる遺伝子の変化が見つかった。ハノイの医師とオーストラリアのハドソン医学研究所の研究者による成果で、論文は「Biallelic CYB5A disruptions in 46, XY DSD: Novel missense and deep intronic variants」と題し、The Journal of Clinical Endocrinology & Metabolismに掲載された。\n\n【背景】家族は、姉に思春期が来ないことから、ハノイの専門医に姉妹を連れて行った。最初の遺伝子検査では原因が見つからなかった。性分化の違い（DSD）は、体の性の発達が典型的な道筋と異なる状態をまとめた呼び方である。\n\n【詳細】ハドソン医学研究所では、博士課程のシリン・モラディ・ファード氏が、DSDの専門家ヴィンセント・ハーレー教授の指導のもとで遺伝子を解析した。たんぱく質を作る部分の検査では結論が出なかったため、チームはゲノム全体を読み、調べる範囲を約300万塩基から約30億塩基に広げた。その結果、姉妹はそれぞれ、CYB5Aという遺伝子に、父と母から1つずつ異なる変異を受け継いでいた。どちらの変異も単独では害がないが、組み合わさるとこの状態を起こす。鍵となったのは、たんぱく質を作る部分から離れた場所にある変異で、実験ではRNAに余分な部分が入り込み、早い段階で止まる合図ができた。これにより、性ホルモンを作るのに必要なたんぱく質ができなくなると予測される。スイスのAIを使った解析でも、同じ結果が再現された。この種類の性分化の違いが確認されたのは世界で4例目である。\n\n【ポイント・注意点】ハーレー教授は、2つの変異を組み合わせて持つ例は「この病気では初めて」だと述べている。臨床研究者のウイエン・レー博士は、家族が今後の妊娠で、体外受精などを通じた出生前の診断を考えられるとした。一方、結論は1つの家族に基づくもので、記事も「この家族にとても特有」としている。治療や臨床経過については記事に書かれていない。","2026-11-12","Medical Xpress","https://medicalxpress.com/news/2026-11-rare-genetic-discovery-sex-differences.html"]]};

  const list=CATS.slice();
  Object.keys(DATA).forEach(id=>{ if(!list.some(c=>c.id===id)) list.push({id:id,name:id,desc:"追加された項目",img:"hero"}); });
  extraCats.forEach(c=>{ if(!list.some(x=>x.id===c.id)) list.push(c); });
  return list;
}
let cats=allCats();
let catIdx=0;
const artIdxMap={};
function itemsOf(c){return (DATA[c.id]||[]).map((a,i)=>({a:a,oi:i})).sort((x,y)=>y.a[3].localeCompare(x.a[3]))}
function curCat(){return cats[catIdx]}
function curItems(){return itemsOf(curCat())}
function curArtIdx(){const n=curItems().length;if(!n)return 0;let i=artIdxMap[curCat().id]||0;if(i>=n)i=n-1;if(i<0)i=0;return i}
function renderStage(dir){
  cats=allCats(); if(catIdx>=cats.length)catIdx=cats.length-1; if(catIdx<0)catIdx=0;
  const c=curCat(), items=curItems(), ai=curArtIdx();
  const total=cats.reduce((s,x)=>s+(DATA[x.id]||[]).length,0);
  document.getElementById('heroText').innerHTML="<b>今日のまとめ — 全"+cats.length+"ジャンル・"+total+"件。</b> タイトルと概要は日本語、カードの「和訳全文を読む」で全文が開きます。新しい順に並べ、48時間より古い記事はグレー表示です。";
  document.getElementById('catName').textContent=c.name;
  document.getElementById('catDesc').textContent=c.desc||"";
  document.getElementById('catCount').textContent="ジャンル "+(catIdx+1)+" / "+cats.length;
  document.getElementById('catDots').innerHTML=cats.map((x,i)=>'<button class="dot'+(i===catIdx?' active':'')+'" data-cat="'+i+'" aria-label="'+x.name+'へ移動"></button>').join('');
  document.querySelectorAll('#catDots .dot').forEach(d=>{d.onclick=()=>{const n=+d.dataset.cat; if(n!==catIdx){const dd=n>catIdx?'down':'up'; catIdx=n; renderStage(dd);}}});
      const slot=document.getElementById('cardSlot');
  if(!items.length){
    slot.innerHTML='<article class="card"><div class="empty"><div class="big">✦</div><p><b>'+c.name+'</b> は追加されたばかりの項目で、まだ記事がありません。</p><p>毎日の更新でこの項目の記事が集まると、ここに表示されます。<br>上スワイプで他のジャンルへ移動できます。</p></div></article>';
    document.getElementById('artDots').innerHTML=""; document.getElementById('artCount').textContent="0 / 0"; return;
  }
  const it=items[ai], a=it.a, old=isOld(a[3]);
  slot.innerHTML='<article class="card'+(old?' old':'')+(dir?' anim-'+dir:'')+'">'
    +'<img class="ph" src="'+IMGS[c.img]+'" alt="'+c.name+'のイメージイラスト">'
    +'<div class="cbody"><div class="meta"><span class="badge'+(old?' oldb':'')+'">'+(old?'少し前':'NEW')+'</span><span>'+a[3]+'</span><span>'+(ai+1)+' / '+items.length+'</span></div>'
    +'<h3>'+a[0]+'</h3><p class="sum">'+a[1]+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="openArticle(\''+c.id+'\','+it.oi+')">和訳全文を読む</button>'
    +'<button class="btn ghost" onclick="quickMemo(\''+c.id+'\','+it.oi+',this)">メモ保存</button>'
    +'<button class="btn ghost" onclick="shareArticle(\''+c.id+'\','+it.oi+')">共有</button></div>'
    +'<div class="src">出典：'+a[4]+'<br><a href="'+a[5]+'" target="_blank" rel="noopener">原文を開く</a></div></div></article>';
  document.getElementById('artDots').innerHTML=items.map((x,i)=>'<span class="dot'+(i===ai?' active':'')+'"></span>').join('');
  document.getElementById('artCount').textContent="記事 "+(ai+1)+" / "+items.length;
  requestAnimationFrame(fitCard);
}

function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;
  const sum=card.querySelector('.sum'), h3=card.querySelector('h3'), ph=card.querySelector('.ph');
  let ss=14, hs=Math.min(21, Math.max(17, window.innerWidth*0.044)), phh=ph?Math.round(ph.getBoundingClientRect().height):0; const ph0=phh;
  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }
    if(hs>13){ hs-=0.5; if(h3) h3.style.fontSize=hs+'px'; continue; }
    break;
  }
}
window.addEventListener('resize', fitCard);
function nextArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i>=n-1)return;artIdxMap[curCat().id]=i+1;renderStage('next')}
function prevArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i<=0)return;artIdxMap[curCat().id]=i-1;renderStage('prev')}
function nextCat(){if(catIdx>=cats.length-1)return;catIdx++;renderStage('down')}
function prevCat(){if(catIdx<=0)return;catIdx--;renderStage('up')}
/* ===== スワイプ操作（スクロールではなくスワイプで移動） ===== */
const stage=document.getElementById('stage');
let sx=null, sy=null, swipedAt=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;
  swipedAt=Date.now();
  if(Math.abs(dx)>Math.abs(dy)){ dx<0?nextArt():prevArt(); } else { dy<0?nextCat():prevCat(); }
});
stage.addEventListener('click',e=>{ if(Date.now()-swipedAt<120){e.stopPropagation();e.preventDefault();} },true);
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')nextArt(); else if(e.key==='ArrowLeft')prevArt();
  else if(e.key==='ArrowDown'){e.preventDefault();nextCat();} else if(e.key==='ArrowUp'){e.preventDefault();prevCat();}
});
/* ===== 項目の追加 ===== */
document.getElementById('addCatBtn').onclick=()=>{document.getElementById('newCatName').value="";document.getElementById('newCatDesc').value="";document.getElementById('addDlg').showModal()};
document.getElementById('addCatSave').onclick=()=>{
  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast("項目名を入力してください");return}
  const desc=document.getElementById('newCatDesc').value.trim()||"追加された項目";
  const id='custom-'+Date.now();
  extraCats.push({id:id,name:name,desc:desc,img:'hero'}); DATA[id]=[];
  cats=allCats(); catIdx=cats.length-1;
  document.getElementById('addDlg').close(); renderStage('down');
  toast("項目「"+name+"」を追加しました");
};
/* ===== 記事ダイアログ・メモ・共有 ===== */
function openArticle(cat,idx){
const c=allCats().find(x=>x.id==cat); const a=DATA[cat][idx];
document.getElementById('dlgIn').innerHTML=`<img src="${IMGS[c.img]}" alt=""><div class="meta" style="margin-top:10px"><span>${c.name}</span><span>${a[3]}</span></div><h3>${a[0]}</h3><p class="sum" style="font-size:14px">${a[1]}</p><div class="full">${a[2]}</div>
<p class="src" style="margin-top:12px">出典：${a[4]} — <a href="${a[5]}" target="_blank" rel="noopener">${a[5]}</a></p>
<div class="memoBox"><label style="font-weight:800;font-size:14px">ひとことメモ</label><textarea id="memoText" placeholder="気づいたこと、作りたいもの、家族への共有メモなど"></textarea>
<div class="actions"><button class="btn primary" onclick="saveMemo('${cat}',${idx})">このメモを保存</button><button class="btn ghost" onclick="shareArticle('${cat}',${idx})">iPhoneで共有</button><button class="btn ghost" onclick="document.getElementById('dlg').close()">閉じる</button></div></div>`;
document.getElementById('dlg').showModal();
}
function quickMemo(cat,idx,btn){const a=DATA[cat][idx];memos.unshift({cat,title:a[0],note:"",date:a[3]});updateMemoUI();btn.textContent="保存しました";btn.classList.add('saved');toast("メモに保存しました（このページを開いている間）")}
function saveMemo(cat,idx){const a=DATA[cat][idx];const note=document.getElementById('memoText').value.trim();memos.unshift({cat,title:a[0],note,date:a[3]});updateMemoUI();toast("メモを保存しました");document.getElementById('dlg').close()}
function updateMemoUI(){document.getElementById('memoCount').textContent=memos.length;const area=document.getElementById('memoList');
if(!memos.length){area.innerHTML='<p class="sum">まだメモがありません。記事の「メモ保存」をタップしてください。</p>';return}
area.innerHTML=memos.map(m=>`<div class="memoItem"><b style="font-size:14px">${m.title}</b><div style="font-size:13px;color:var(--muted)">${m.note||"（ひとことメモなし）"} ・ ${m.date}</div></div>`).join('')}
function exportMemos(){if(!memos.length){toast("まだメモがありません");return}const txt="MAI topic メモ — 2026-11-10\n\n"+memos.map((m,i)=>`${i+1}. ${m.title}\n${m.note||""}\n`).join("\n");const b=new Blob([txt],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="mai-topic-memo-2026-11-10.txt";a.click();URL.revokeObjectURL(u)}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}} try{await navigator.clipboard.writeText(text);toast("コピーしました — メモアプリなどに貼り付けできます")}catch(e){toast("共有できませんでした")}}
function shareArticle(cat,idx){const a=DATA[cat][idx];shareText(a[0],`${a[0]}\n\n${a[1]}\n\n出典：${a[4]} ${a[5]}`)}
function shareMemos(){if(!memos.length){toast("まだメモがありません");return}shareText("MAI topic メモ",memos.map(m=>`・${m.title} ${m.note}`).join("\n"))}
document.getElementById('sharePage').onclick=()=>shareText("MAI topic","MAI topic — 2026年11月19日朝版（全"+cats.length+"ジャンル）");
document.getElementById('memoBtn').onclick=()=>{updateMemoUI();document.getElementById('memoDlg').showModal()};
updateMemoUI();
renderStage();
</script>

<script>
try {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
} catch (e) {}
</script>
