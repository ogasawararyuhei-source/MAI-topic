it.itmedia.co.jp/ait/articles/2611/17/news006.html"],["Claude Codeが待っているとWindowsの通知で知らせる、導入不要","dev.toで2026年11月17日、Claude Codeが許可の確認で止まったときなどにWindowsのトースト通知を出す方法が紹介された。Windows PowerShell 5.1に組み込まれたWinRTの通知機能を使うので、追加の導入は要らない。PermissionRequestとStopのフックの設定例と、全角のダッシュでスクリプトが壊れた失敗など3つの落とし穴を解説している。","\n【概要】筆者のFred氏は、Claude Codeのセッションを2〜3本同時に動かすことが多く、許可の確認で止まったセッションに15分気づかないことがあった。筆者はWindows PowerShell 5.1に組み込みのWinRTの通知クラスを使い、何も入れずに通知を出した。検証環境はClaude Code 2.1.316とWindows 11だ。\n【背景】フックには選択肢がある。PermissionRequestは許可の確認が出たとき、Stopは毎ターンの終わりに動く。筆者は「今すぐ必要」の合図にPermissionRequestを使う。このフックは通知を足すだけで判断はしないので、端末の確認画面は変わらない。\n【詳細】%USERPROFILE%\\.claude\\notify.ps1は、フックのJSONを標準入力から読み、通知の見出しを「Claude Code - 」とcwdのフォルダ名にする。シェルのコマンドは80字を超えると77字と「...」に切り詰め、それ以外はツール名か「Done」を出す。通知のTagにセッションIDを入れ、セッションごとに1件を差し替える。失敗してもフックのエラーにならないよう必ずexit 0で終える。settings.jsonでは、PermissionRequestとStopの両方でpowershell.exeを10秒のタイムアウトで動かし、-NoProfile -ExecutionPolicy Bypass -Fileにスクリプトのパスとwaitingかdoneを渡す。\n【ポイント・注意点】落とし穴は3つあった。PowerShell 5.1はBOMのない.ps1をWindows-1252として読むため、全角ダッシュのUTF-8のバイトが曲がった引用符に化け、文字列が途中で切れた。スクリプトをASCIIだけにするのが対策だ。Tagに空の文字列を入れるとエラーになるので、確かめてから入れる。async: trueではclaude -pで何も出ず、PowerShellの起動に約607〜673ミリ秒かかり先にセッションが終わったと推測している。通知から確認に答えたり端末を前に出したりはできず、PowerShell 7は未検証。","2026-11-17","DEV Community","https://dev.to/fxdgif/a-windows-toast-when-claude-code-needs-you-with-nothing-to-install-and-the-dash-that-broke-it-3f2m"],[".claude/settings.local.jsonのパスワード、探し方と防ぎ方","dev.toで2026年11月17日、Claude Codeの.claude/settings.local.jsonにパスワードが残る問題の点検と対処をまとめた記事が公開された。「今後は確認しない」で許可したコマンドが秘密ごと保存される仕組みと、Apiiroの報告にある数値を示し、組織内の検索、資格情報の交換、追跡の停止、再発の防止までの手順を具体的なコマンドで解説している。","\n【概要】Ennote SecurityのためにSerge Zhuravel氏が書いた記事だ。Claude Codeでコマンドに「Yes, and don't ask again」を選ぶと、そのコマンドが許可ルールとして.claude/settings.local.jsonに保存される。コマンドにパスワードが含まれていれば、ルールにも残る。\n【背景】記事はApiiroの報告を報道経由で引いている。公開のGitHubで103,617リポジトリに104,185個のファイルがあり、1,122個に少なくとも1つ、計1,379個の秘密が含まれていた。古い版や共有の設定、履歴を合わせると1,994リポジトリで2,539個に上る。Claude Codeは無視ルールをグローバルなgitの除外ファイルに足すが、それは1台の端末だけのもので、仲間の複製やCIには効かず、すでに追跡中のファイルにも効かない。\n【詳細】点検では、gh search code --owner 組織名 --filename settings.local.jsonで組織全体を探し、各複製ではgit ls-files、履歴ではgit log --all --full-historyを使う。PGPASSWORD=や-pでのパスワード指定、bearerトークン、資格情報入りのURLを含むallowの項目に印を付ける。対処の順序は、まず元のサービスで資格情報を交換する（ファイルを消しても何も無効にならない）、コミット以降の見覚えのないログインを調べる、git rm --cachedで追跡をやめて.gitignoreに足す、必要なら履歴を消す、だ。\n【ポイント・注意点】予防策は、リポジトリの.gitignoreとテンプレートへの追加、PGPASSWORD=\"$DB_PASSWORD\"のように変数を使い個別のコマンドではなくパターンを許可すること、/permissionsで保存済みのルールを見直すこと、Gitleaksの独自ルールをCIでも動かすことなどだ。実害は証明されておらず、Anthropicはファイルは手で作られコミットされたものだとしつつ改善を検討しているという。記事は自社製品の紹介も含む。","2026-11-17","DEV Community","https://dev.to/ennote/passwords-in-claudesettingslocaljson-find-rotate-prevent-43j7"],["Cursorが侵害を確認、偽のClaude Code拡張が配布される","BleepingComputerは2026年11月14日、AIコードエディターのCursorが、Fireworks AIから盗まれた資格情報を足がかりに、自社のマーケットプレイス経由で悪意あるClaude Code拡張機能が配られたと認めたと報じた。改ざん版は約11時間公開され、最大5,000人が受け取った可能性がある。Anthropic正規の拡張とOpen VSXは影響を受けていないという。","\n【概要】Visual Studio Codeを基にしたAIコードエディターのCursorは、金曜日の事故報告で侵害を公表した。攻撃者はAI基盤を提供するFireworks AIの資格情報を盗み、それを使ってCursorのマーケットプレイスで悪意あるClaude Code拡張機能を配った。\n【背景】攻撃者はFireworks AIのアクセスキーを手に入れ、CursorがFireworksと情報を共有していた読み取り専用の保管場所からデータを写した。そこには、Privacy Modeを使っていない利用者の、主に2025年のAIコーディングエージェントの記録があった。Cursorによると、記録が漏れた利用者は0.05%未満、API資格情報が漏れた顧客は0.01%未満だ。攻撃者はその資格情報で、保管済みの本番以外のソースコード、限られたサポート情報、製品の利用指標、顧客の連絡先、一部の会話の要約、顧客がサポートに渡した資格情報も持ち出した。\n【詳細】10月29日、攻撃者は盗んだ資格情報で、CursorのVS Codeマーケットプレイスを支えるキャッシュに、Claude Code拡張のバージョン2.1.312と2.1.313の無許可の複製を置いた。これらは約11時間公開されていた。改ざん版は、システムの情報を集め、攻撃者のSSH鍵を入れ、SSHの有効化を試み、永続化を設定して、消えにくいSSHの裏口を作ろうとした。Cursorは、該当版を求めた最大5,000人が悪意あるビルドを受け取った可能性があると見積もる。Anthropicの正規の拡張とOpen VSXは侵害されておらず、本番の基盤、公式のアプリ配布、顧客のコードリポジトリ、Privacy Mode利用者のコードとプロンプトも影響の外だという。Cursorは資格情報の無効化と交換、推論の通信のFireworksからの移管、マーケットプレイスの作り直し、本番基盤の再展開を行った。\n【ポイント・注意点】記事は、Wizが「Black October」と呼ぶAI開発基盤への一連の攻撃の1つと位置づける。Railwayの侵害では約74万ドルの不正なAI利用料が発生し、Northflank、Lightning AI、OpenCode、Warp、Notionなども被害を受けた。","2026-11-14","BleepingComputer","https://www.bleepingcomputer.com/news/security/cursor-confirms-security-breach-led-to-malicious-claude-code-extension/"],["Claude Code・Codex・Gemini CLIの週報、11月15日の週","dev.toで2026年11月14日、Claude Code、Codex、Gemini CLIの1週間の更新をまとめた週報が公開された。対象は計9つのリリースで、Claude Codeが4つ、Codexが4つ、Gemini CLIが1つ。Claude Codeでは権限とサンドボックスの4つの穴をふさいだv2.1.321を最も重要とし、Fable 5.2の追加やCode Modeの登場も伝えている。","\n【概要】週報は、端末で動く3つのコーディングエージェントの更新を並べたもので、合計9つのリリースを扱う。内訳はClaude Codeがv2.1.321、v2.1.322、v2.1.323、v2.1.325の4つ、Codexが0.167.1、0.167.2、0.168.0、0.169.0の4つ、Gemini CLIがv0.68.0の1つだ。\n【背景】これらのツールはほぼ毎週更新され、権限やサンドボックスの扱いも変わる。何が変わったかを横に並べて確かめる意味は大きい。\n【詳細】Claude Codeのv2.1.321は4つの穴をふさいだ。読み取り専用のBashコマンドが確認なしにサンドボックスの外で動けたこと、Bashの権限チェックが別のフォルダを基準に書き込みを判断して確認が出なかったこと、ディレクトリへのcpやmvで書かれたファイルにdenyルールなどが効かなかったこと、MCPのOAuth要求がリダイレクトで別のホストにリフレッシュトークンなどを送りえたことだ。Claude Fable 5.2（claude-fable-5-2）を既定のFableモデルにし、100万トークンの文脈で、価格は100万トークンあたり入力8ドル、出力40ドルとした。v2.1.322はVertexのglobal、us、euでfast modeを使えるようにし、v2.1.323は実験的なCode Mode、plugin.jsonのengines[\"claude-code\"]、TypeScriptのフックの型チェックなどを加えた。v2.1.325は、zstdで圧縮された応答の復号に関するセキュリティの問題や、異常終了の後に再開したセッションから最近のターンが消える問題を直した。Codexは0.168.0で横の会話を並べるtui_workspace、アニメーションGIFの生成、端末の通知の設定を加え、0.169.0では信頼されていないディレクトリでcodex execがプロジェクト設定とMCPサーバーを無効のまま保つようにし、--trustで信頼を保存できるようにした。\n【ポイント・注意点】週報は、Claude Codeで最も優先すべきものをv2.1.321の4つの修正とする。権限まわりの穴は長時間の自動運転で影響が大きいので、まずここを確かめたい。","2026-11-14","DEV Community","https://dev.to/aicoding-guide/this-week-in-claude-code-codex-and-gemini-cli-week-of-november-15-2026-4pmm"]],"cnc":[["Mastercam Copilot、言葉で操るCAMの現在地と限界","加工とAIの専門メディアMachineToolNews.aiが、Mastercamのシニア・アプリケーション・エンジニアJesse Trinque氏への単独インタビューを掲載した。CAMソフトの中で音声や文章によって指示できる「Mastercam Copilot」について、加工グループや工程の作成、送り速度と主軸回転数の調整、プログラムファイルの点検といった現在の機能と、形状の選択やツールパスの検証はまだできないという限界を具体的に説明している。","\n【概要】\n加工とAIの専門メディアMachineToolNews.aiは2026年11月18日、MastercamのJesse Trinque氏（シニア・アプリケーション・エンジニア、在籍13年）への単独インタビューを掲載した。テーマは「会話型CNCプログラミング」で、同社のAIアシスタント「Mastercam Copilot」で何ができて何ができないのかを整理している。\n\n【背景】\n会話型プログラミングは、もともと案内付きのメニューや入力欄を指す言葉だった。AIの登場で、CAMソフトの中で日常の言葉を使い、音声や文章で指示したり技術的な助言を受けたりできるようになった。Trinque氏は、熟練の機械加工者が引退していく人材不足とこの流れを結び付けている。\n\n【詳細】\nCopilotが現在できるのは、対応する加工機グループと加工工程の作成、ミル・旋盤・ルーターの対応工程での主送り速度と主軸回転数の調整（確認手順付きで、変更は元に戻せる）、技術情報や学習動画の検索、複数手順を自動化する簡単なスクリプトの生成である。ファイルを開いたときなどに点検し、クーラント設定の誤り、ワーク座標の不一致、工具の刃長を超える切込み深さといった問題を知らせる機能もある。例えば「既定の機械でミルの加工機グループを作り、輪郭加工と2D高速加工を入れて」と一文で指示できる。一方、形状の選択、ステップオーバーなどの切削条件の設定、ツールパスの検証は現時点ではできない。ツールパスやファイルの削除もできず、氏はこれを組み込みの安全策と説明している。\n\n【ポイント・注意点】\n同社は生産性向上を数値では示しておらず、効果は部品や作業内容によるとしている。送り速度や回転数が材料・工具・機械に合っているかの判断は、引き続きプログラマーの責任だ。今後は状況を踏まえた自動化、送り速度と回転数の推奨、Sandvikグループとの連携強化に取り組むが、いずれも将来の優先事項であり現在の機能ではない。編集部は、繰り返し作業の時間をアシスタントあり・なしで測ることを勧めている。","2026-11-18","MachineToolNews.ai","https://machinetoolnews.ai/conversational-cnc-programming-mastercam/"],["JIMTOF2026を振り返る、AIで知能化する工作機械","製造業向けメディアMONOistが、10月に東京ビッグサイトで開かれた第33回日本国際工作機械見本市「JIMTOF2026」を振り返る記事を掲載した。22の国と地域から1134社が出展した会場で見えた技術的な注目点として、AIやデジタルツインによる工作機械の知能化と、人手不足などの現場課題への対応の2つを挙げ、ファナック、三菱電機、オークマのAI関連展示を紹介している。","\n【概要】\nMONOistは2026年11月17日、JIMTOF2026で見えた技術的な注目点を整理する記事を掲載した。第33回日本国際工作機械見本市には22の国と地域から1134社が出展し、来場者は延べ11万5103人だった。記事はAIを使った工作機械の知能化を大きな流れの一つとして取り上げている。\n\n【背景】\nJIMTOFは2年に1度の工作機械の国際見本市である。製造現場では人手不足や熟練技能の継承、作業者の負担軽減が課題となっている。今回はAI、デジタルツイン、ロボットを組み合わせた展示が多く、加工プログラムの作成や機械の診断にAIを使う提案が目立った。記事の筆者は元工作機械エンジニアで、技術者の目で会場を見て回り、各社の展示を横断して流れを整理している。\n\n【詳細】\n記事は注目点を2つ挙げている。1つ目は工作機械の知能化と高度化で、AIやデジタルツインを使った判断機能、加工プロセスの自動化、積層造形（AM）への応用が並んだ。2つ目は現場課題への具体的な対応で、人手不足、技能継承、作業負担、省エネなどへの解決策が示された。AI関連の展示として、ファナックはオペレーターの自然言語による指示からNCプログラムの作成や修正を支援する構想を紹介した。三菱電機は、AIが加工タスクを計画し、CNC工作機械とヒューマノイドロボットを連携させる仕組みを見せた。オークマは、AIによる機械診断と工場診断に加え、工作機械と対話できるAIエージェント機能を紹介し、突発的な停止の防止や作業者不足の補完をねらうとした。\n\n【ポイント・注意点】\n紹介された内容の多くは構想や参考出展の段階で、製品化の時期や仕様はこの記事からは分からない。自然言語でNCプログラムを扱う、ロボットと工作機械をAIでつなぐといった方向は、各社に共通する流れとして押さえておきたい。DIYの卓上CNCとは規模が違うが、言葉で加工を指示する考え方は個人向けのCAMソフトにも広がりつつあり、今後の動きを見るうえでの手がかりになる。","2026-11-17","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/17/news013.html"],["GibbsCAM 2027登場、AIのCAM AssistとCopilotを強化","インドの製造業メディアThe Machine Makerが、Sandvik傘下のGibbsCAMの新版「GibbsCAM 2027」を詳しく紹介した。推論モデルで動くGibbsCAM Copilot、CloudNCのAIアドオン「CAM Assist 2.0」による3軸と3+2軸の加工戦略づくり、up2partsと開発したAIによる自動CAMなどを取り上げている。新機能を紹介するウェビナーは11月19日に2回開かれる予定だ。","\n【概要】\nThe Machine Makerは2026年11月16日、GibbsCAM 2027の新機能を紹介する記事を掲載した。GibbsCAMはSandvikグループのCAMソフトで、2027版はIMTS 2026（シカゴ）とAMB 2026（シュトゥットガルト）で発表された。段取りの確認、シミュレーションの見直し、3D・多軸の加工戦略を強化し、AIを使う機能も加えている。\n\n【背景】\nCNCのプログラミングは熟練者に頼る部分が大きく、繰り返し作業の負担が課題になっている。CAMメーカー各社は、AIに下準備を任せつつ最終判断は人が持つ形の支援機能を相次いで出している。\n\n【詳細】\nGibbsCAM Copilotは推論モデルで動き、画像や資料へのリンクを受け付け、次の質問の候補も示す。CloudNCのAIアドオン「CAM Assist 2.0」は、GibbsCAMの中で3軸と3+2軸の機械向けに加工戦略を組み立てる。戦略エディターで機械、材料、工具を設定し、AIの提案を確認・修正・承認してからツールパスがGibbsCAMに戻る仕組みだ。up2partsと開発した「autoCAM」はAIでCAMプログラミングを自動化し、プログラミング時間を最大70%減らすことをめざす。工具管理の「ToolManageriQ」には送り速度と回転数を最適化するAIが組み込まれている。ほかに、シミュレーションで途中の時点に戻れる機能、穴の自動分割、VoluMillの回転加工対応などが加わった。\n\n【ポイント・注意点】\nCAM Assistは追加料金のオプションで、戦略は一つずつ人が確認して承認する前提になっている。「最大70%」はめざす目標値で、実際の効果は部品や現場によって変わる。新機能を紹介するウェビナー「Discover What's New in GibbsCAM 2027」は、11月19日（木）の米東部時間午前10時と午後2時の2回開かれる。CET（中央ヨーロッパ時間）ではそれぞれ午後4時と午後8時にあたる。","2026-11-16","The Machine Maker","https://themachinemaker.com/show-reports/clearer-setup-faster-validation-and-ai-assisted-programming-the-new-gibbscam-2027-and-cam-assist/"],["チタンも削る卓上CNC「C500」、Formnextに出展","中国・深圳のNestWorksが、卓上CNC「C500」をドイツ・フランクフルトのFormnext 2026に出展すると発表した。C500は米TIME誌の「2026年の最高の発明」に選ばれた機種で、最高1万8000回転の800W主軸、5本の自動工具交換、自動プロービングを備える。CAMソフト「NestStudio」で設計からツールパスまでの流れを簡単にし、標準Gコードや他社のCAD/CAMにも対応する。","\n【概要】\nNestWorksは2026年11月16日、卓上CNC「C500」をFormnext 2026に出展すると発表した。会期は11月17日から20日まで、会場はフランクフルト・アム・マインで、ブースはホール11.0のD69である。C500は先ごろ、米TIME誌の「Best Inventions of 2026」に選ばれた。\n\n【背景】\n同社は、専用の機械、複雑な作業手順、外部の加工業者への依存が、試作や製品開発を遅らせていると指摘する。小さな技術チームや個人のつくり手、製品開発者でとくにその影響が大きいという。C500は、入門向けの卓上CNCと複雑な産業用設備の間を埋め、精密加工を小さな作業場に持ち込むことをねらう。\n\n【詳細】\n主な仕様は、最高1万8000回転の800W主軸、最大80cm³/分の材料除去量、5本を収める自動工具交換装置、自動プロービングと工具長測定、潤滑と切りくず排出の仕組みの内蔵である。ソフト面では、同社のCAMソフト「NestStudio」が、デジタルの設計データからツールパスまでの流れを簡単にする。標準のGコードと他社のCAD/CAMソフトにも対応しており、経験のある利用者は使い慣れた道具で加工できる。用途としては、動く試作品、特注部品、小ロット生産を社内でつくり、試行を速めることを挙げている。外部に頼らず社内で作れることで、つくり手がプロジェクトを自分の手で管理しやすくなるという。\n\n【ポイント・注意点】\nこの発表は企業のプレスリリースで、性能の数値は同社の公表値である。価格や出荷時期についてはこのリリースでは触れていない。リリースはAIを前面に出しておらず、加工を簡単にする役割は、CAMソフトと工具交換やプロービングなどの自動化機能が担う形になっている。同社はハードウェア、ソフトウェア、アルゴリズムを組み合わせて精密加工を多くの人に届けることを掲げている。会場で実機を見られる機会は限られるため、出展後の実機レビューや第三者による加工テストを待って評価したい。","2026-11-16","PR Newswire","https://www.prnewswire.com/news-releases/time-pramierte-nestworks-c500-prasentiert-desktop-cnc-fertigung-auf-der-formnext-2026-302939013.html"],["製造業向け「Claude for Manufacturing」、見積や保全を支援","MachineToolNews.aiが、Anthropicの製造業向けプラグイン「Claude for Manufacturing」を紹介した。17の専門スキルと4つのソフトウェア接続を持ち、見積、品質管理、保全、調達、設計、生産報告の6分野で、情報集めや分析、提案の下書きを担う。CNC機の故障原因の候補を記録から挙げるといった使い方ができる一方、生産設備やCNC機を直接動かすことはしないと明記している。","\n【概要】\nMachineToolNews.aiは2026年11月16日、Anthropicが11月12日に発表した「Claude for Manufacturing」を紹介した。17の専門スキルと4つのソフトウェア接続を持つプラグインで、既存のERPや設計、業務システムを置き換えるのではなく、それらと一緒に使う前提で作られている。\n\n【背景】\n町工場や加工現場では、見積や不具合の調査、報告書づくりに多くの時間がかかる。記事は、このプラグインが質問に答えるだけでなく実務の作業を進めることを目的とし、Claudeが情報を集めて分析し提案を下書きして、技術者や見積担当、生産管理者が確認・承認する形だと説明している。\n\n【詳細】\n対象は6分野である。見積では顧客の依頼を読み、足りない情報を見つけ、過去の原価と比べて見積を準備する。品質管理では検査不合格を調べ、是正処置の報告書を下書きする。保全では設備記録やセンサーの出力、技術資料からCNC機の故障原因の候補を挙げる。ほかに調達、Autodesk Fusionを使った設計案の比較、生産報告がある。接続先はAutodesk Fusion、Infor、Microsoft 365、Oracle NetSuiteの4つで、専用の接続がないソフトも書き出したファイルで扱える。Inforには業務システムで承認済みの変更を行える別のプラグインもある。例えば鋼材の納入が遅れたとき、影響を受ける注文を特定し、ほかの拠点の材料を確かめて対応を準備するが、変更は権限のある社員が承認してから行われる。\n\n【ポイント・注意点】\n記事は、このプラグインが生産設備を直接動かさず、CNC機やロボットも制御しないと明記している。故障の候補を挙げても、故障の確認や修理はしない。時間短縮や見積の精度、投資効果について独立に検証された数値は公表されていない。使えるのはClaudeのTeamとEnterpriseの利用者で、製造業向けの別料金は示されていない。記事は、見積や是正処置の報告書など一つの業務から試し、作業時間や修正の回数を比べることを勧めている。","2026-11-16","MachineToolNews.ai","https://machinetoolnews.ai/claude-for-manufacturing-ai/"],["オープンな卓上CNC「Piccola」、Kickstarterで開始","独InMachinesのオープンソース3軸卓上フライス盤「Piccola CNC」が11月17日にKickstarterで支援募集を始めた。Makers101によると、開始当日に37人から5万8199ユーロが集まり、目標を超えた。150×150×70mmの加工範囲でアルミや真ちゅう、基板を削れるとし、高さマップによる補正や、Kiri:MotoとEasyTrace5000を使うCAM一体型アプリも備える。","\n【概要】\nメイカー向けメディアMakers101は、ドイツInMachinesの卓上CNC「Piccola CNC」のKickstarter開始を報じた（記事は11月15日公開、17日に更新）。Piccolaはオープンソースの3軸卓上フライス盤で、2026年11月17日に支援募集が始まった。米太平洋時間17日午後2時55分の時点で、37人が5万8199ユーロを支援し、2万7507ドルの目標を上回った。\n\n【背景】\nInMachinesはハンブルク近郊のシュヴァルツェンベックにある企業で、2015年からオープンソースのハードウェアを公開してきた。3Dプリンターを持つ人の次の一台として、学校やメイカースペースにも売り込んでいる。同社は、出荷時にファームウェアとソフトウェアを含む機械全体をオープンソースとして公開するとしている。\n\n【詳細】\n全モデル共通で加工範囲は150×150×70mm、全軸に1204ボールねじ、ER11コレット、最大移動速度は毎分2000mm、接続はUSB-CとWi-Fiである。モデルはBasic（100W・2万回転）、扉付き筐体のPro（200W・1万2000回転）、ブラシレス主軸とプロービングを加えたUltimateの3種類。工具長の検出と高さマップによる補正を全モデルが備え、基板のそりを補正できる。CAMと機械制御を一つにしたデスクトップアプリがあり、基板用のツールパスにはEasyTrace5000、2D・3D・回転加工にはKiri:Motoを使う。支援額はBasicの1091ユーロから。どの返礼も2027年7月のお届け予定である。Founder Editionは3モデル合わせて40台限定だ。\n\n【ポイント・注意点】\n記事は、100Wや200Wの主軸では金属を浅く削ることになり、加工に時間がかかると指摘する。繰り返し精度の数値はメーカーの公表値で、検証されていない。CEマーキングとPL cの安全評価は最終段階で未完了、米国の認証も手続き中で、学校には書類がそろうまで待つよう勧めている。","2026-11-15","Makers101","https://makers101.com/piccola-cnc-kickstarter/"],["AIと作るオープンソースCAD「SolidCraft」、5週間で150万DL","ものづくりメディアFabSceneが、個人開発のオープンソース3D CAD「SolidCraft」の開発者に取材した記事を掲載した。v0.1.0の公開から約5週間で配布ファイルのダウンロードは約150万回、GitHubのスターは約1万6000に達した。AIエージェントがCADを操作するためのMCPサーバーを公開当初から備え、アプリ内でAIと対話する画面も加えている。","\n【概要】\nFabSceneは2026年11月14日、オープンソースのパラメトリック3D CAD「SolidCraft」の開発者、Brennen Herbruck氏への書面取材を掲載した。2026年10月9日にv0.1.0を公開してから約5週間で、GitHubの配布ファイルは11月13日時点で約150万回ダウンロードされ、スターは約1万6000に達した。\n\n【背景】\nHerbruck氏は米ミシガン州に住み、本業は家族の農業関連事業でAIと自動化を統括している。SolidCraftはAIを使って非常に速いペースで開発されている。10月9日から11月12日のv0.41.0までに正式リリースは58回を数え、11月10日から12日には1日に約200件のプルリクエストが取り込まれた。\n\n【詳細】\nSolidCraftは、スケッチ、寸法と拘束、押し出しや回転で立体を作り、作業履歴をタイムラインに残すパラメトリックCADである。Windows、macOS、Linux、FreeBSD向けのビルドとブラウザー版があり、ライセンスはMITとApache-2.0から選べる。公開当初から、AIエージェントがCADを操作するためのMCPサーバーを備え、10月15日のv0.13.0ではアプリ内でAIエージェントと対話する画面を加えた。MCPサーバー経由でモデリングされた探査ローバー「SELENE」は、タイムラインが3323ステップに及ぶ。v0.40.0では形状処理の中核を、NVIDIAのSMLibをRustに移植した「SolidCore」に置き換えた。日本語表示にも対応している。\n\n【ポイント・注意点】\n記事が触れている出力形式は、ロボットシミュレーター向けのURDFの書き出しと、FreeCADやRhinoのファイルの読み込みである。CNC加工用のツールパス（CAM）や、STLなど加工・造形向けの出力については記事に記述がない。そのため、CNCのデータ作りに使えるかどうかは、利用者が書き出し機能を自分で確かめる必要がある。開発の速度が非常に速いため、使うときは版の変化にも注意したい。","2026-11-14","FabScene","https://fabscene.com/new/interview/solidcraft-open-source-cad-ai-1-5m-downloads-brennen-herbruck/"],["InforとClaudeが連携、加工現場の材料不足や停止に対応","MachineToolNews.aiが、InforとAnthropicの提携で生まれた「Infor Industry AI for Claude」が加工現場でどう役立ちうるかを3つの場面で解説した。製造指示、部品表、在庫の情報をもとに、材料不足、機械の突然の停止、仕入れ先の遅れに対応する案を示し、承認された変更をInforに書き戻す。ただし扱うのは計画や調達の業務で、CNCのプログラミングではない。","\n【概要】\nMachineToolNews.aiは2026年11月13日、InforとAnthropicの提携（11月12日発表）を取り上げ、加工現場での3つの使い道を解説した。Claudeを製造業の業務システムにつなぎ、普段の言葉で質問し、提案を確認し、Inforのシステムの中で操作を承認できるようにするものだ。\n\n【背景】\n加工現場では、機械が空いていても材料が届いていない、機械が止まって複数の仕事に影響が出る、といった場面で情報集めに時間がとられる。記事はこの連携を、工作機械そのものではなく、計画、調達、調整のための道具と位置づけている。\n\n【詳細】\nClaudeは製造指示、部品表、在庫の情報にアクセスでき、答えは利用者の役割、拠点、権限に応じて変わる。最初の利用者は生産計画、購買、顧客対応の担当である。1つ目の場面は材料不足で、払い出し済みの材料、在庫、入荷予定の発注を調べ、仕事をいつ始められるかを判断しやすくする。2つ目は予定外の停止で、ほかの設備の空きを探し、手当てが必要な注文を見つける。工具や治具、機械の適否、検査の要否は引き続き技術者が決める。3つ目は仕入れ先の遅れで、影響を受ける製造指示と顧客注文をたどり、代わりの仕入れ先や材料を検討して購買の手当てを提案する。\n\n【ポイント・注意点】\n記事は3つの場面を利用の例として示しており、顧客の実績ではない。接続の出発点はM3で、Velocity Suiteの一部顧客に提供され、利用には自社のClaudeライセンスと管理者による有効化が必要だ。価格や投資効果の数値は公表されていない。変更はすべて利用者が明示的に承認する必要があり、操作はシステムに記録される。CNCのプログラミングは対象外である。記事は導入の助言として、材料不足のような身近な問題一つから始めること、在庫記録や発注、入荷予定日の正確さを確かめること、スケジュールに使うなら工程手順と現在の能力のデータを正しく保つこと、調査と解決にかかる時間などで効果を測ることを挙げている。","2026-11-13","MachineToolNews.ai","https://machinetoolnews.ai/infor-industry-ai-for-claude-shop-floor/"],["マザックとABEJA、加工工程を設計するAIエージェント開発","製造現場ドットコムが、ヤマザキマザックとABEJAによるフィジカルAIの共同開発を報じた。ABEJA Platformを使い、加工方法や加工順序、切削条件を自動で設計・提案するAIエージェント、生産スケジュールを最適化するAIエージェント、ロボットの行動学習環境の3つに取り組む。対話型CNC「MAZATROL」の構造化された加工情報を学習に使い、熟練者の暗黙知の継承をめざす。","\n【概要】\n製造現場ドットコムは2026年11月12日、ヤマザキマザックとABEJAが製造現場へのフィジカルAI実装に向けて共同開発を進めると報じた。名古屋市東区のマザックアートプラザで合同記者会見が開かれ、ABEJAの「ABEJA Platform」を使って、加工工程や生産スケジュールを最適化するAIエージェントと、ロボットの行動学習環境を開発すると発表した。\n\n【背景】\n航空宇宙、半導体、EVといった分野が伸びる一方で、多品種少量生産や短納期への対応が求められている。少子高齢化で働き手が減り、熟練技術者の不足が技能継承の課題になっている。山崎高嗣社長は「止まらない生産の実現」につなげたいと述べ、フィジカルAIによる自律化で設備稼働率と生産性を高め、コストを下げて顧客の収益向上をめざすとした。\n\n【詳細】\n共同開発のテーマは3つある。1つ目は加工工程を最適化するAIエージェントで、加工方法、加工順序、切削条件などを自動で設計・提案する。学習には、対話型CNC「MAZATROL」の構造化された加工情報（素材、工程、形状、工具、切削条件など）を使い、判断の背景まで学ばせる。2つ目は生産スケジュールのAIエージェントで、特急の注文、設備の突然の停止、材料の入荷遅れに対応し、担当者の変更判断と当時の状況を学ぶ。これは加工セルの管理システム構想の中核機能と位置づけられている。3つ目はVLA（視覚・言語・行動）モデルなどを使ったロボットの行動学習環境で、データ収集から学習、評価、実機での検証、再学習までを一貫して行えるようにする。テレオペレーション（遠隔操作）や人の作業の模倣学習も検証する。\n\n【ポイント・注意点】\nまず自社工場の加工プログラムでAIモデルを作り、顧客の加工プログラムや運用データで追加学習させて現場に合わせる方針だ。澤田氏は、フィジカルAIはすぐに商品化して稼働率向上に結び付ける段階ではないとの認識を示している。記事中で会見日は10月16日とされ、MAZATROLの開発期間の表記にも「40年以上」と「45年以上」の揺れがある。","2026-11-12","製造現場ドットコム","https://seizougenba.com/node/14554"],["CNC稼働監視「Chatter」がオープンソース化、ラズパイで動く","CNC向けソフトを手がけるToolpathが、工作機械の稼働状況をリアルタイムで表示するツール「Chatter」をMITライセンスでオープンソース化した。Raspberry Piでも動き、インターネットなしで工場内のネットワークだけで使えるため、機械のデータが外に出ない。Brother、Haas、FANUC、Siemens SINUMERIK、MTConnect対応機に接続でき、1年分の稼働履歴を記録できる。","\n【概要】\nToolpathは2026年11月12日、CNC工作機械の稼働状況をリアルタイムに表示するツール「Chatter」をオープンソースにしたと発表した。ライセンスはMITで、コードはGitHubで公開されている。同社は「どのコンピューターでもRaspberry Piでも動く」としている。\n\n【背景】\nChatterはもともと別のツールで、のちにToolpathに加わった。同社は、工場がサブスクリプションや他社のクラウドに頼らずに自分の機械のデータを扱えるように、コードを公開したと説明している。小さな工場や個人の工房でも、手元の機材で機械の状態を見える化しやすくなる。\n\n【詳細】\nインストール後は工場内のネットワークで動き、インターネットには接続しないため、機械のデータは工場の外に出ない。利用者はコードを読んで改造でき、今ある機材で動かせる。各機械を稼働中、待機、アラーム、オフラインで表示し、プログラム、工具、主軸回転数、主軸負荷、加工数も示す。Brother、Haas、FANUC、Siemens SINUMERIK、MTConnectのエージェントを持つ機械に接続でき、ネットワークを走査して機械を見つけられる。1年分の履歴を保存し、グラフ、稼働時間、加工数、アラームを確認できる。プログラムファイルの閲覧・送信・取得・削除とアップロード履歴の機能もある。閲覧者、オペレーター、管理者の権限と、履歴にもとづく独自の通知ルールも設定できる。今回の版では、Raspberry Pi Zero 2 Wでも動くこと、一人ずつのログイン、アラームの説明表示などを打ち出した。\n\n【ポイント・注意点】\nRaspberry Piでの更新は数クリックで済み、更新ファイルには署名があるため、壊れたダウンロードは入らない。Dockerを使うコンピューターでは2つのコマンドで更新でき、Windows、Mac、Linux向けのDockerパッケージが用意されている。導入と更新の手順書は、プロジェクトの文書サイトにまとめられている。不具合の修正も行ったというが、内容の一覧は示されていない。","2026-11-12","Toolpath","https://toolpath.com/blog/chatter-open-source"]],"cricut":[["HTVで自宅オリジナルTシャツ！公式の手順まとめ","Silhouette America公式ブログが、熱転写ビニール（HTV）で自宅でオリジナルTシャツを作る手順を9段階で解説した。Silhouette Studioでのデザインから反転、テストカット、カス取り、プレス、剥離、多色の重ね貼りまでを順に紹介する。温度や時間の具体的な数値は示さず、HTVメーカーの指示に従うよう繰り返し求めている点が特徴で、よくある失敗と洗濯時の注意もまとめている。","\n【概要】Silhouette America公式ブログは2026年11月18日、熱転写ビニール（HTV）を使って自宅でカスタムTシャツを作る方法を段階的に解説する記事を公開した。デザイン作成からカット、カス取り、プレス、多色の重ね貼りまでを一通りたどれる内容だ。\n\n【背景】記事はまず、HTVと粘着ビニールの違いを強調する。粘着ビニールは布に接着しないため、Tシャツには熱で圧着するHTVを使う必要がある。初めての人には、単色のシンプルなデザインから始めるよう勧めている。\n\n【詳細】必要な道具は、対応するSilhouetteのカッティングマシン、素材に合った刃、必要に応じたカッティングマット、HTV、Silhouette Studio、清潔なTシャツ、カス取りツール、ヒートプレスまたはメーカーが認める家庭用アイロン、保護シートなど。手順は9段階で、Silhouette Studioでのデザイン作成（例としてデザインID D-1292795を挙げる）、通常のHTVを裏面からカットするための鏡像反転、刃とカット設定の準備、テストカット、カス取り、位置合わせ、プレス、剥離、多色の場合の重ね貼りと続く。通常のHTVは一般にキスカット（台紙を切らずに表面だけを切る）で切ると説明し、剥離はホット・ウォーム・コールドのどのタイプかに合わせるよう求める。多色デザインは色ごとに別々にカットし、1層ずつ位置を合わせてプレスする。\n\n【ポイント・注意点】記事は温度、プレス時間、圧力、刃の深さ、速度といった具体的な数値を示していない。すべてHTVメーカーの説明と、機種ごとのツール対応ガイドに従うよう案内している。よくある失敗として、粘着ビニールを使ってしまう、反転し忘れる、テストカットを省く、圧力が不均一、熱や時間を当て推量で決める、といった例を挙げる。グリッターやメタリックなど特殊なHTVは重ね方が異なる場合があるので、事前に確認が必要だ。洗濯は裏返して行い、強い熱や刺激の強い洗剤は避けるよう勧めている。","2026-11-18","Silhouette America Blog","https://www.silhouetteamerica.com/blog/post/how-to-make-custom-vinyl-t-shirts-at-home"],["ハンドメイド店の冬支度！統一感ある包装アイデア","Silhouette America公式ブログが、ハンドメイド販売者向けにホリデーシーズンの包装アイデアを7項目で紹介した。色やフォントを絞った統一デザイン、ブランドタグ、ステッカーやシール、お礼カード、会計台の準備などを取り上げる。素材の使い分けや、印刷・カット・仕分け・組み立ての順で進めるまとめ作業のコツも具体的に示しており、販売シーズン前の準備に役立つ内容だ。","\n【概要】Silhouette America公式ブログは2026年11月18日、小規模事業者やハンドメイド作家向けに、ホリデー向け包装のアイデアを紹介する記事を公開した。タグ、ステッカー、お礼カード、ラベルを統一感のあるデザインでそろえると、商品がより洗練され、贈り物として選ばれやすくなると説く。\n\n【背景】年末の手作り市やネット販売では、商品そのものに加えて包装の見栄えが購入の決め手になりやすい。記事は特定の機種名を挙げず、カッティングマシンを使った量産を前提に、無理なくそろえられる方法をまとめている。\n\n【詳細】1つ目は統一デザインを作ること。メインカラーとアクセントカラーを1色ずつ、季節のモチーフを1つ選び、店名用と商品情報用のフォントを1種類ずつに絞る。2つ目はブランドタグで、店名を上、商品情報を中央、季節の飾りを下に置く共通テンプレートを勧める。素材は丈夫な中厚手のカードストックか、ロゴやQRコードを入れるならPrint & Cut。3つ目はステッカーとシールで、屋内の短期用途なら印刷用ステッカー紙、耐久性が必要なら印刷用ビニール、瓶などには粘着ビニールと使い分ける。ほかに、お礼カードやお手入れカード、QRコードカード、ギフトメモの作り分け、クラフト袋や透明袋での簡単なギフト仕立て、会計台の準備を挙げている。\n\n【ポイント・注意点】まとめ作業は「印刷、カット、仕分け、組み立て」の順で進める。各バッチの前に送信パネルで素材プロファイルを選び、マットの有無や向き、刃が設定と合っているかを確認する。用紙の厚さやビニールの仕上げ、刃の状態が変わるたびにテストカットを行うことも求めている。厚手のカードストックが切り抜けない場合は、刃の深さを大きく上げる前に、圧力を上げるか重ね切りを試すよう勧める。光沢素材ではトンボ周りの反射を抑えることも大切だ。お礼カードやシールなど消費の多いものは、売上の見込みより多めにカットしておくとよいとしている。始めるなら、ロゴシール1種、お礼カード1種、タグのテンプレート1種の基本セットからでよいという。","2026-11-18","Silhouette America Blog","https://www.silhouetteamerica.com/blog/post/small-business-packaging-ideas-for-the-holidays"],["手作り市のブース看板をカッティングマシンで作る","Silhouette America公式ブログが、ホリデーマーケット向けのブース看板をSilhouetteで作る方法を解説した。価格表示、商品カテゴリーのラベル、QRコード表示、卓上サインの4種類を、統一感のあるセットとして作る考え方を示す。カードストックやビニールなど素材の使い分け、カットの順番、文字が多すぎるなどのよくある失敗もまとめている。年末の出店準備に役立つ。","\n【概要】Silhouette America公式ブログは2026年11月17日、年末のハンドメイドマーケットで使うブース看板の作り方を紹介した。何を売っているか、いくらか、どう払えるか、贈り物に向くかが一目で伝わる看板を、Silhouetteのマシンでセットとして作るよう勧めている。\n\n【背景】混み合う会場では、来場者が足を止める数秒で情報が伝わるかが売上を左右する。記事は看板をばらばらに作るのではなく、フォントと色、アイコンをそろえたひとまとまりとして計画することを重視する。\n\n【詳細】素材は、テントカードや吊り下げタグにカードストック、アクリル板や木製ブロックには粘着ビニール、小さなラベルには印刷用ステッカー紙か印刷用ビニールを使う。計画段階では、目玉商品、セール品、名入れ、会計、包装といったテーブルの区画を決め、短い文言を考え、素材ごとにカットリストを作る。作例は4つ。1つ目の価格表示は、コントラストを高くし、数字の周りに余白をとる。2つ目のカテゴリーラベルは、先生への贈り物やオーナメントなどの分類名を、数フィート離れても読める大きさにする。3つ目のQRコード表示は、支払いやオンラインショップ、特注の受付に使い、印刷した実物を様々な角度と距離から読み取りテストする。4つ目の卓上サインは、ラッピング可や名入れ受付、会計場所を示す。\n\n【ポイント・注意点】カットはカードストック、色別のビニール文字、最後に印刷してカットするラベル類の順で進め、完成した看板は区画ごとに封筒や袋に分けておく。練習で並べたテーブルを写真に撮れば、当日の設営チェックリストになる。よくある失敗は、文字が多すぎる、価格が小さい、デザインの様式がばらばら、QRコードが読み取れない、設営の手順がない、の5つ。QRコードの上にビニールやグリッター、反射しやすいラミネートを重ねないこと、Print & Cutのトンボ周辺に絵柄を置かないことにも注意したい。なお、記事は看板の具体的な寸法やフォントの大きさ、カット設定までは示していない。","2026-11-17","Silhouette America Blog","https://www.silhouetteamerica.com/blog/post/diy-booth-signs-for-holiday-markets"],["犬好きへの贈り物に！クリスマス犬トーテム無料SVG","無料SVG配布サイトCrafty Crafterが、犬を縦に積み重ねた「ドッグトーテム」のクリスマス用カットファイルを公開した。登録不要で個人利用に限り無料。アクリルオーナメント、家族おそろいのシャツ、犬用バンダナ、マグカップ、ギフトタグ、木製サインの6つの作例と素材、6段階の作り方を紹介し、Cricut各機種とSilhouette Studioで使えるとしている。","\n【概要】無料SVG配布サイトのCrafty Crafterは2026年11月17日、クリスマス向けの「ドッグトーテム」デザインのSVGカットファイルを無料公開した。犬好きへの贈り物や、サイン、カード、靴下、タグなどの飾りに使えるデザインとして紹介している。\n\n【背景】同サイトはこの時期、クリスマス関連の無料SVGをほぼ毎日公開している。ペットをモチーフにしたデザインは家族やペット仲間への贈り物として人気が高く、今回のファイルもその需要を狙ったものだ。\n\n【詳細】ファイル形式はSVGで、ダウンロードしたフォルダを解凍してから取り込む。Cricut Joy、Cricut Maker、Cricut Exploreに対応し、一般的なベクター画像としてSilhouette Studioにも読み込める。SVGなので品質を落とさずに拡大縮小できる。作例は6つで、パーマネントビニールで飾るアクリルオーナメント、黒いTシャツに白のHTVを貼る家族おそろいのシャツ、アイロン接着ビニールで作る犬用バンダナ、光沢パーマネントビニールで飾る陶器のマグカップ、ギフトタグ、廊下用の木製サイン。素材として、衣類にはストレッチHTV、綿のTシャツ、EasyWeed HTV、ミニヒートプレスを、マグなど硬い面には光沢パーマネントビニール、オーブン対応の陶器マグ、転写テープ、防水ビニールを挙げる。手順は、フォルダの解凍、Cricut Design Spaceへのアップロード（またはSilhouette Studioへの読み込み）、素材に合わせたサイズ調整、HTVの場合は鏡像反転、素材に合わせたマシン設定、カットと組み立ての6段階だ。\n\n【ポイント・注意点】ライセンスは個人利用のみで、登録は不要。贈り物など手作りの品として形にするのは認められているが、デジタルファイル自体の再販や再配布はできない。カット前には、同サイトの「SVG Doctor」ツールでファイルを点検し、余分なノードやレイヤーの問題を見つけておくよう勧めている。ページにはよくある質問5項目と、関連する無料SVG集へのリンクもある。","2026-11-17","Crafty Crafter","https://crafty-crafter.club/christmas/christmas-dog-totem-svg-for-cricut/"],["開けて驚く！クリスマスの飛び出すカード作例10選","手芸ニュースサイトCraftGossipのカード作り部門が、開くと中身が広がる「エクスプローディングカード」と、ふたを外すと側面が開く「エクスプロージョンボックス」のクリスマス作例を10本紹介した。Cricut向けの3層ボックスや無料SVG付きの写真オーナメント入りボックス、カッティングマシンなしで作れる手切りの作例まで、難易度別に選べる。郵送時の注意にも触れている。","\n【概要】手芸ニュースサイトCraftGossipのカード作り部門は2026年11月17日、クリスマス向けの「エクスプローディングカード」の作例とチュートリアル10本をまとめた記事を公開した。簡単な折りカードから、何層にもなるボックスまで幅広く集めている。\n\n【背景】エクスプローディングカードには2種類ある。折りたたんだ中身が開くと広がるカードと、ふたを外すと側面が倒れて中が現れる箱型のエクスプロージョンボックスだ。驚きのある仕掛けがクリスマスの贈り物に向いている。\n\n【詳細】10本の内訳は次のとおり。包装されたプレゼントの形で、開くとクマのあいさつが現れる無料印刷カード。模様紙とツリーのスタンプを使った折りカード。3層のボックス。The Crazy Cricut Ladyによる、キャンディケインやリボンのパネルで飾ったCricut向けの3層ボックス。ギフトカードやメッセージを入れられるポケット付きボックス。We R Memory KeepersのExplosion Boardを使い、6つの箱を組む上級者向けの作例。カードストックと定規、カッター、のりだけで作る、カッティングマシンを使わない手切りのボックス。写真オーナメント用のポケットや花びら形の封筒を備え、無料SVGファイルが付くminorDIYのボックス。クリスマス用にアレンジできるスクウォッシュフォールドの技法。完成サイズが3.5×3.5×2.5インチになるギフトカードホルダーの有料PDFチュートリアル。\n\n【ポイント・注意点】記事は、初めてなら簡単な折りカードから始め、飾り付けの前に折り方やふたのはまり具合を試すよう勧めている。かさばる飾りは折り目の近くに付けないこと、飾り付けたエクスプロージョンボックスを郵送する場合は保護用の外箱が必要になることにも触れている。カッティングマシンを持つ人はCricut向けの作例や無料SVG付きの作例を、持たない人は手切りの作例を選ぶとよい。最後の作例は有料のチュートリアルでEtsyで販売されている点にも注意したい。","2026-11-17","CraftGossip","https://stamping.craftgossip.com/10-exploding-christmas-card-ideas-and-tutorials-for-a-festive-surprise/2026/11/17/"],["ChatGPTで絵柄を編み物風に！質感プロンプト術","カッティングマシン情報ブログSilhouette Schoolが、ChatGPTの質感プロンプトで平面のPNGデザインを手編みやクロスステッチ、キルト風に見せる方法を紹介した。形と色は保ったまま表面の質感だけを変える手法で、11種類の効果のうち2つは無料で配布。UVプリンターでの印刷例に加え、ステッカーや昇華転写、DTFなどにも使えるとしている。プロンプト本文は動画側で入手する形だ。","\n【概要】カッティングマシンの使い方を発信するSilhouette Schoolは2026年11月17日、ChatGPTの「質感プロンプト」を使い、平面のPNGデザインを手編み、クロスステッチ、キルト風に見せる方法を動画付きで紹介した。プロンプトは表面だけを変え、形や色はそのまま保つという。\n\n【背景】手芸らしい温かみのある質感は人気が高いが、デザインを一から描き直すのは手間がかかる。記事は、手持ちのデザインを生成AIで加工して、作品の幅を広げる方法として提案している。チャンキーニット、クロスステッチ、キルト、レザーなど合わせて11種類の効果があり、そのうち刺しゅうとチャンキーニットの2種類はSilhouette Uの無料ツール・素材のコーナーで公開されている。\n\n【詳細】手順は、質感プロンプトをコピーしてChatGPTに貼り付け、できれば背景が透明なPNGをアップロードする。処理は1～2分ほどで終わる。縁などの細部が気になる場合は、最初からやり直さず、仕上がりの良い縁にするよう追加で頼むと別案が出る。完成したら透明背景のPNGとして保存する。記事ではこれをxTool Studioに取り込み、xTool O1 Omni Dualで印刷した。クロスステッチやチャンキーニットには「テクスチャ」、キルトには「レリーフ」を使い、キルト柄の印刷には10～12分ほどかかった。白を含むデザインだったため、インクモードは白とカラーに設定している。\n\n【ポイント・注意点】記事の中心はUVプリンターでの印刷だが、加工したPNGはUVプリンターがなくても、昇華転写、DTF、DTG、ステッカー、普通紙への印刷に使えると著者は述べる。UVプリンターでは実際に凹凸が出るが、平面の印刷でも編み物や刺しゅう風の見た目は再現できる。HTVで作るフェイク刺しゅうワッペンの関連記事にも誘導している。レリーフ機能はxToolアカウントのクレジットを消費する点に注意が必要だ。プロンプトの文面そのものは記事本文には載っておらず、動画や配布素材から入手する形になっている。","2026-11-17","Silhouette School","https://www.silhouetteschoolblog.com/2026/11/chatgpt-texture-prompts-make-design.html"],["おそろいコーデに！ミニーのクリスマス無料SVG","無料SVG配布サイトCrafty Crafterが、ミニーマウスのシルエットとクリスマスの装飾を組み合わせたカットファイルを無料公開した。家族おそろいの服や手作りギフトを作る人向けで、クッションカバー、イブボックス、Tシャツ、マグ、オーナメント、トートバッグの6作例と素材、6段階の作り方を紹介。個人利用に限り登録不要で使える。ファイル再配布は禁止で、カット前の点検も勧めている。","\n【概要】無料SVG配布サイトのCrafty Crafterは2026年11月16日、ミニーマウスのシルエットに伝統的なクリスマスの装飾を合わせたSVGカットファイルを無料公開した。家族おそろいの服や手作りの贈り物を作る人に向けたデザインとして紹介している。\n\n【背景】同サイトはこの時期、キャラクターものや動物ものなど、クリスマス向けの無料SVGを連日公開している。家族で同じ柄の服を着る「おそろいコーデ」は年末の定番で、手軽に使える無料デザインの需要が高い。\n\n【詳細】ファイルは.svg形式で、ダウンロードしたフォルダを解凍してから使う。Cricut Design SpaceとSilhouette Studioで使え、Cricut Joy、Cricut Maker、Cricut Exploreに対応する。ベクター形式なので画質を落とさずにサイズを変えられるが、寸法は記載されていない。作例は6つ。赤いベルベットのクッションカバーに白のフロッキーHTV、木箱で作るクリスマスイブボックスに光沢パーマネントビニール、黒いTシャツに白のHTV、陶器のマグに光沢パーマネントビニール、透明アクリルのオーナメントにグリッターHTV、そしてホリデー用のトートバッグ。素材は、衣類・布用に高品質なグリッターHTV、一般的なアイロン接着ビニール、耐熱テープ、綿のトートバッグやTシャツ。硬い面用には光沢パーマネント粘着ビニール、透明転写テープ、アクリルオーナメントの素材、圧着用スクレーパーを挙げる。手順は、解凍、Design Spaceへの取り込み、アイロン接着素材ならカットプレビューで鏡像反転、Silhouette Studioへの読み込み、ビニールの種類に合わせたカット設定、プレスや貼り付けの前の不要部分の除去の6段階。\n\n【ポイント・注意点】個人の手芸目的なら登録不要で無料。贈り物などの手作り品は作ってよいが、デジタルファイルの再販や再配布は禁止されている。キャラクターを題材にしたデザインなので、ライセンスの範囲を守り、個人利用にとどめるよう注意したい。カット前には同サイトの「SVG Doctor」ツールでファイルを点検するよう勧めている。","2026-11-16","Crafty Crafter","https://crafty-crafter.club/christmas/minnie-christmas-svg-for-cricut/"],["左右どちらの角にも！ドア枠飾りの無料デザイン","JenniferMakerが、ドア枠の角を飾る重ね貼りカードストックの「ドアコーナートッパー」を紹介した。1つの無料デザインを左右反転するだけで右角にも左角にも使え、雪だるま、ツリー、トラックの3種類を用意。仕上がりサイズや必要な余白、機種ごとのカット上限、層ごとの貼り合わせ順まで詳しく解説している。ページの最終更新は11月14日で、同日に解説動画も公開された。","\n【概要】クラフトブログのJenniferMakerは、ドア枠の角に飾る重ね貼りのカードストック作品「ドアコーナートッパー」の作り方を公開した。ページの最終更新日は2026年11月14日で、同日にはMerry Maker Mingle 2026の一環として動画も公開されている。1つの無料デザインを左右反転させれば、右角にも左角にも使えるのが特長だ。\n\n【背景】ドアの角に飾る装飾は、壁に穴を開けずに季節感を出せる手軽な飾りとして人気がある。今回はデザイン番号847として、雪だるま、ツリー、トラックの3種類が用意された。\n\n【詳細】材料は12×12インチ・65ポンドのカードストック5～8枚、雪やツリー用の青緑のカードストック（任意）または白のグリッターカードストック、壁に付けるための練り消し状の粘着材や小さなコマンドストリップ。著者はCricut Maker 4を使ったが、Maker、Explore、Venture、Joyの各シリーズでも作れる。仕上がりは雪だるまが8.72×10.16インチ、ツリーが9.24×11.08インチ、トラックが8.72×10.16インチ。ドア枠の横木から上に約5インチ、縦の枠の内側から約3インチはみ出すので、事前に場所を測る。12×12インチ用紙では高さ・幅とも11.5インチ未満、Cricut Joyでは4.5×5.19インチ未満、Joy Xtraでは8.5×9.81インチ未満に収める。カット設定は、無地のカードストックは「Medium Cardstock」で圧力を強め、グリッターは「Glitter Cardstock」で圧力を強める。\n\n【ポイント・注意点】左角に飾る場合は、Design Spaceで「左右反転」を選ぶだけでよい。サイズを変えるときは縦横比を固定する。マットから外す前に角を少しめくって切れているか確かめ、足りなければもう一度カットする。組み立ては、層を表向きに重ねてから裏返し、1層ずつ裏にのりを付けて、L字型の支えのパーツで位置を合わせる。層の数は雪だるまが8、ツリーが7、トラックが6。飾る面は平らな場所が向いており、取り外したい場合は塗装面に優しい粘着材や剥がせるストリップを上辺と側辺に使うよう勧めている。","2026-11-14","JenniferMaker","https://jennifermaker.com/flexible-door-corner-topper/"],["ビニールシートで暮らしを飾る9つのアイデア","Silhouette America公式ブログが、カッティングマシンで切った粘着ビニールを使った住まいの装飾アイデアを9つ紹介した。壁のデカール、収納ラベル、名入れサイン、鏡やガラス、植木鉢、写真立て、キッチンの容器、季節の飾り、家具のアクセントまで、面ごとにパーマネントと再剥離タイプの使い分けを示す。食品に触れる面への注意も詳しく、初心者向けのデザイン例も紹介する。","\n【概要】Silhouette America公式ブログは2026年11月13日、Silhouetteのマシンで切った粘着ビニールを使い、住まいを飾るアイデアをまとめた記事を公開した。貼る面の素材、一時的か長く使うか、湿気や日光、手で触れる頻度などの条件に合わせてビニールを選ぶよう勧めている。\n\n【背景】粘着ビニールは手軽に模様替えができる素材だが、選び方を誤ると剥がすときに壁を傷めたり、すぐに剥がれたりする。記事はまず、布用の熱転写ビニール（HTV）とは別物であることを確認したうえで、用途別の選び方を整理している。\n\n【詳細】アイデアは9つ。壁のデカールやアートは再剥離タイプを基本とし、塗装が完全に乾いた壁に貼る。収納ラベルは頻繁に変えるなら再剥離、長く使うならパーマネント。名入れのウェルカムサインは、塗装済みの木やガラス、アクリルに貼る。鏡やガラスは汚れを落としてから貼り、視界や安全に関わる部分は避ける。植木鉢は釉薬がかかったものや塗装済みのものが向き、素焼きのテラコッタは難しい。ほかに写真立て、キッチンの容器、季節の飾り、家具のアクセントを挙げる。手順は、場所を決めて寸法を測り、Silhouette Studioでサイズを合わせ、テストカットのあとに本番のカットとカス取りを行い、転写テープで中心から外へ圧着して、低い角度でゆっくり剥がす流れだ。初心者向けのデザインとして、Split Monogram Letter W（デザイン番号D-1274972）を紹介している。\n\n【ポイント・注意点】装飾用のビニールは、食品に触れても安全、食洗機や電子レンジに対応、耐熱といった性質を当然には備えていない。キッチンの容器では外側だけに貼り、食品や熱から離すよう注意を促す。通常の粘着ビニールは色の面を上にしてカットし、一般に鏡像反転は不要だ。剥がすときは小さな範囲で試し、無理な力や金属の工具は避ける。賃貸の壁にパーマネントを使う、テストカットを省く、といった失敗にも注意したい。まずは収納ラベルや名入れの瓶、玄関のサインなど小さな作品から始めるよう勧めている。","2026-11-13","Silhouette America Blog","https://www.silhouetteamerica.com/blog/post/vinyl-sheets-for-home-decor-projects"],["ツリー形の雪だるまトリオ！冬の無料SVG","無料SVG配布サイトCrafty Crafterが、クリスマスツリーの形に並んだ雪だるまのカットファイルを無料公開した。黒いTシャツへの白HTV、陶器のマグ、木製コースター、トートバッグ、アクリルオーナメント、ティータオルの6作例を紹介し、冬のマーケット向けの品にも使えるとしている。CricutとSilhouetteに対応し、個人利用に限り登録不要。寸法の記載はない。","\n【概要】無料SVG配布サイトのCrafty Crafterは2026年11月13日、雪だるまをクリスマスツリーの形に並べたSVGカットファイルを無料公開した。Tシャツやマグ、オーナメントなど、冬の手作り品に幅広く使えるデザインとして紹介している。\n\n【背景】雪だるまはクリスマスから冬の終わりまで長く飾れるモチーフで、年末の贈り物や冬のマーケットで売る品にも使いやすい。同サイトはこの時期、クリスマス向けの無料SVGを連日公開しており、本作もその1つだ。\n\n【詳細】ファイルはSVG形式で、品質を落とさずに拡大縮小できる。ダウンロードはzipフォルダで届くので、まず解凍する。Cricut Design SpaceとSilhouette Studioで使え、Cricut Joy、Maker、Exploreに対応する。作例は6つで、黒いTシャツに白のHTVを貼ったお祝いのシャツ、陶器のマグに光沢パーマネントビニール、靴下に入れる小さな贈り物になるHTVを使った木製コースター、ラッピング代わりの帆布のトートバッグ、粘着ビニールを重ねたアクリルオーナメント、キッチンのティータオル。アクリルオーナメントは冬のマーケット向きだとしている。推奨素材は、衣類をきらびやかにするグリッターHTV、アクリルオーナメントの素材、正確に重ねるための道具、硬い面にきれいに貼るための転写テープの4つ。手順は、zipを解凍してSVGを取り出し、Cricut Design Spaceのアップロードボタンから読み込み、キャンバスに配置して、HTVでアイロン接着する場合は鏡像反転、素材に合わせてサイズを調整する流れだ。Silhouette Studioでも直接開ける。\n\n【ポイント・注意点】個人の手芸目的なら登録不要で無料で使える。贈り物などの手作り品にするのは認められているが、デジタルファイル自体の再販や再配布はできない。マーケットでの販売を考える場合は、このライセンスの範囲で問題がないか確かめておきたい。ページにはよくある質問が5項目あるが、具体的な寸法やカット設定は記載されていないので、素材に合わせてテストカットで確認するとよい。","2026-11-13","Crafty Crafter","https://crafty-crafter.club/christmas/christmas-tree-snowmen-svg/"],["感謝のかぼちゃ！金曜恒例の無料カットファイル","Silhouette Schoolが毎週金曜の無料配布企画で、「Thankful」の文字を入れたかぼちゃのデザインを公開した。秋の木製サインや玄関マット、シャツ、キッチンタオル、クッションに使えると提案している。Silhouette Studio形式のファイルがGoogleドライブで配布され、無料版は個人利用のみ。商用利用には1ドルのSVGを案内しているが、期限付きの価格のため現在の条件は確認が必要だ。","\n【概要】カッティングマシン情報ブログのSilhouette Schoolは2026年11月13日、毎週金曜恒例の無料配布企画「Freebie Friday」で、「Thankful（感謝）」の文字を入れたかぼちゃのデザインを公開した。感謝祭を前にした秋の飾りや衣類に使えるデザインだ。\n\n【背景】Silhouette Schoolは、Silhouetteのカッティングマシンの使い方を中心に発信している人気ブログで、金曜日には毎週カットファイルを無料で配っている。米国では11月下旬に感謝祭があり、「感謝」をテーマにした飾りや衣類の需要が高まる時期だ。\n\n【詳細】著者は、木製のサイン、玄関マット、シャツ、キッチンタオル、クッションなどへの使用を提案している。ファイルはSilhouette Studio形式のデザインで、Googleドライブで共有されている。ページ内の「無料のThankful Silhouette Studioデザインを入手」というリンクから開く。プレビューとして、幅1920ピクセルのJPG画像と、シャツに使った例のPNG画像が掲載されている。ファイルのサイズや寸法、カット設定は記載されていない。商用利用したい場合は、So Fontsyで商用ライセンス付きのSVGを1ドルで購入するよう案内しており、この価格での提供は2026年11月14日の土曜日までとされていた。\n\n【ポイント・注意点】無料で配布されるファイルは個人利用に限られる。マーケットで売る品に使うなど商用で使う場合は、有料の商用ライセンス版が必要になる。1ドルでの提供期限はすでに過ぎているため、現在の価格や条件は配布元で確認したい。また、無料版はSilhouette Studio形式なので、Cricutなど他社のマシンで使いたい場合は、SVG版の入手を検討する必要がある。ページの手順説明は省かれており、ファイルの開き方やカット方法の解説はない。記事にはアフィリエイトリンクが含まれ、対象の購入があると著者に紹介料が入る旨も明記されている。","2026-11-13","Silhouette School","https://www.silhouetteschoolblog.com/2026/11/thankful-freebie-friday-silhouette-cut.html"],["クリカットで本当に節約できる？作るか買うかの判断","Cricut英国公式ブログが、Cricutで名入れギフトや飾りを自作して費用を抑える考え方を解説した。名入れ品は既製品だと割高になりやすい一方、機械を持っていて安価な素材で複数作るほど節約しやすいと説明する。マグやトート、Tシャツなどのギフト例、行事別の活用法、素材とまとめ作業のコツ、自作が得にならない場合まで整理している。具体的な価格や節約額の数字は示していない。","\n【概要】Cricutの英国向け公式ブログは2026年11月13日、Cricutで名入れのギフトや飾りを作って費用を抑える方法を解説した記事を公開した。既製の名入れ品は割高になりがちで、すでにマシンを持ち、安い無地の素材を使い、複数を作るときに自作の節約効果が出やすいとしている。\n\n【背景】注文で名入れ品を買うと、無地の品の代金に加えて、デザインの手間、製作、包装、販売者の利益が上乗せされる。記事は、無地の品を買って自分で名入れすればその部分を抑えられると説く一方、自分の時間や材料費も含めて同じ条件で比べることを強調している。\n\n【詳細】ギフト例として、誕生日や先生へのお礼、ホリデー、新居祝いに使える名入れマグ、小さなデザインを複数に使い回せるトートバッグ、アイロン接着素材やDTF転写、印刷できるアイロン接着素材、昇華転写やInfusible Inkで作るTシャツを挙げる。缶クーラーや飲み物用の容器、ギフトタグや包装、季節のサインや額入りの言葉、玄関マット、クッションなどの飾りも紹介する。行事別では、誕生日、先生、結婚式、ホリデーの使い方を示し、結婚式では1つのデザインをまとめて複製する方法を勧める。素材については、用途の広いまとめ買い向きの無地品を選ぶ、できるだけ単色デザインにする、似た作品をまとめて作る、端切れを素材・色・大きさで整理して再利用する、高価な素材は目立つ部分だけに使う、といったコツを挙げる。タグやカードの飾り、ステッカー、ラベル、封筒の飾りは、端切れの活用に向くという。\n\n【ポイント・注意点】急いで必要な場合、道具や材料がない場合、かかる時間が節約額に見合わない場合は、注文した方がよいと明記している。作る前に、材料費、数量、時間、手持ちの材料、デザインを簡単にできるかを確かめるよう勧める。記事には具体的な価格や節約額の数字は示されておらず、例として挙げられているのはマグを5個作る、10～20個をまとめて作るといった数量だけだ。結論として、買うと名入れが高くつくが作るのは簡単な品が、自作に最も向いているとまとめている。","2026-11-13","Cricut Blog（英国）","https://cricut.com/blog/gb/how-to-save-money-with-cricut/"],["サンタのステッカーをSilhouetteで作る手順","デザイナーLori Whitlockのブログで、クリエイティブチームのNoelene Apap氏がサンタ柄のステッカーシートの作り方を紹介した。HTVRONTの印刷用ビニールステッカー紙に印刷し、Silhouetteのプリント&カット機能でトンボを使って切り抜く。用紙サイズの設定やトンボの位置調整、プリンター設定の注意点、カットの数値まで具体的だ。デザインファイルは有料。","\n【概要】カットファイルのデザイナーとして知られるLori Whitlockのブログで2026年11月13日、クリエイティブチームのNoelene Apap氏が、サンタ柄のステッカーシートを作るチュートリアルを公開した。印刷した絵柄をSilhouetteのカッターで切り抜く「プリント&カット」を使う作例で、完成したステッカーで瓶を飾る例も紹介している。\n\n【背景】プリント&カットは、プリンターで印刷した絵柄の周りに印刷された「トンボ」をカッターが読み取り、絵柄の形どおりに切り抜く機能だ。多色の絵柄を手軽にステッカーにできるため、季節の飾りや贈り物の包装に人気がある。\n\n【詳細】材料は、Loriのショップで販売されているSanta StickersのデザインファイルSVGまたはSilhouette形式、HTVRONTの8.5×11インチの印刷用ビニールステッカー紙、プリンター、Silhouetteのカッティングマット。手順は、まずPNGをSilhouetteのソフトに読み込み、用紙サイズは既定の一覧にないため8.5×11インチのカスタムサイズに設定する。右側のパネルで「プリント&カット」を開き、「トンボを有効にする」を選ぶ。トンボの余白調整のつまみを左いっぱいに動かすと、印刷できる範囲を広く使える。プリンターのトレイの用紙サイズも合わせる。著者は普段A4を使っているため、レターサイズに変更したという。印刷した用紙をマットに載せ、カット素材を印刷用ビニールに設定して、圧力15、刃の深さ1、速度5でカットし、台紙からステッカーを剥がす。\n\n【ポイント・注意点】印刷前に、プリンターの設定を光沢かマットかのビニールの種類に合わせることが重要で、設定を誤るとにじみやぼやけの原因になると注意している。カットの数値は紙の厚さによって変わるとしており、使う用紙に合わせて調整が必要だ。プリンターやカッターの機種名は記事に書かれていない。デザインファイルは有料で、記事にはアフィリエイトリンクが含まれ、コード「LORI」でSilhouetteの製品とカットファイルが5%割引になると案内している。","2026-11-13","Lori Whitlock","https://loriwhitlock.com/santa-stickers-tutorial/"],["粘着ビニールとビニール印刷の基本を総まとめ","Silhouette America公式ブログが、粘着ビニールとビニール印刷の初心者向けガイドを公開した。刃で切るだけのカットと、プリンターで印刷してから切り抜くPrint & Cutの違いを整理し、パーマネント、再剥離、印刷用の3種類の特徴を説明。素材選びの5つの問いと、2つの作業の流れ、よくある失敗5つもまとめている。通常のビニールは家庭用プリンターのインクが定着しにくい点にも触れる。","\n【概要】Silhouette America公式ブログは2026年11月12日、粘着ビニールとビニール印刷の基本を初心者向けにまとめたガイドを公開した。粘着ビニールは、ガラス、ラミネート加工の木、プラスチックのタンブラー、塗装した壁などの硬い面に、常温で貼れる裏のりつきの素材だと説明している。\n\n【背景】ビニールはカッティングマシンの代表的な素材だが、種類が多く、熱で布に圧着するHTVとの違いや、印刷できるかどうかで初心者が迷いやすい。記事は、刃で切るだけの「カット」と、プリンターで印刷してから切り抜く「プリント&カット」の違いを最初に整理し、Silhouetteのカッティングマシン自体は印刷しないことも強調している。\n\n【詳細】ビニールの種類は3つ。パーマネントは接着が強く、長く使うラベルやサイン、デカールに向くが、屋外での耐久性は製品によって異なる。再剥離タイプは接着が穏やかで、壁の飾りや賃貸住宅、季節の飾りに向くが、面によってはのりが残ることもある。印刷用はプリント&カットに使い、パーマネントと再剥離の両方がある。必要な道具はカッティングマシン、対応する刃、必要に応じたカッティングマット、粘着ビニール、転写テープ、カス取りツール、スクレーパー、Silhouette Studioで、プリンターは印刷用ビニールを使う場合だけ必要になる。作例として、水筒や弁当箱のラベル、収納ラベル、窓のデカール、サインや家の飾り、教室や季節の飾り、印刷したステッカーの6つを挙げる。\n\n【ポイント・注意点】ビニールを選ぶときは、どのくらい持たせたいか、屋内か屋外か、貼る面の種類、単色か多色か、将来剥がす必要があるか、の5つを考えるよう勧める。カットとプリント&カットの作業の流れはそれぞれ6段階で示され、印刷後はインクを素材の説明どおりに乾かす必要がある。よくある失敗は、印刷用と通常のビニールの混同、面に合わない接着剤の選択、どのプリンターでも使えると思い込むこと、テストカットの省略、すべてのビニールが防水・食洗機対応だと思い込むこと。通常の粘着ビニールは家庭用プリンターのインクが定着しにくい点にも注意したい。","2026-11-12","Silhouette America Blog","https://www.silhouetteamerica.com/blog/post/beginner-guide-adhesive-vinyl-vinyl-printing"],["ツリーを運ぶレトロカー！クリスマス無料SVG","無料SVG配布サイトCrafty Crafterが、クリスマスツリーを載せて走るヴィンテージカーのレトロなカットファイルを無料公開した。トートバッグ、コースター、セーター、木製オーナメント、グリーティングカード、クッションカバーの6作例を紹介する。販売用に作るなら高品質なHTVと丁寧な重ね貼りを勧めており、個人利用に限り登録不要で使える。SVG Doctorでの点検も勧める。","\n【概要】無料SVG配布サイトのCrafty Crafterは2026年11月12日、クリスマスツリーを屋根に載せたヴィンテージカーを描いたレトロ調のSVGカットファイルを無料公開した。贈り物の名入れ、家の飾り付け、ホリデーマーケット向けの手作り品に使えるデザインとして紹介している。\n\n【背景】ツリーを車に載せて運ぶ図柄は、欧米のクリスマスの風物詩として近年人気のモチーフだ。同サイトは11月に入ってから、トラックや車を題材にしたクリスマス向けの無料SVGを続けて公開している。\n\n【詳細】ファイルはSVG形式のベクターデータで、画質を落とさずにサイズを変えられる。Cricut Design SpaceとSilhouette Studioで使え、Cricut Joy、Maker、Exploreに対応する。ダウンロードはzipフォルダなので、アップロードの前に解凍する。寸法やファイルサイズは記載されていない。作例は6つで、生成りの綿のトートバッグに濃い緑のHTV、陶器のマグやタイルの素材に光沢パーマネントビニールで作るコースター、黒いTシャツに白のHTVで作るセーター風の名入れ服、グリッターHTVで飾る木製オーナメント、高品質なカードストックで切るグリーティングカード、柔らかな手触りのビニールで作るクッションカバー。素材は、衣類・布用にEasyWeed HTV、綿のTシャツや帆布のトート、ヒートプレスかミニヒートプレス、飾り・硬い面用に光沢パーマネント粘着ビニール、陶器のタイルやマグ、転写テープを挙げる。手順は、解凍、Design Spaceのアップロードボタンから取り込み、キャンバスに配置してHTVなら鏡像反転、素材に合わせたマシンの素材設定、マットをセットしてカット、の流れだ。\n\n【ポイント・注意点】完成品を販売するなら、高品質なHTVを使い、重ね貼りをきれいに仕上げるよう勧めている。ただしライセンスは個人の手芸利用で、手作り品の贈り物は認められているが、デジタルファイルの再販や再配布は禁止だ。カット前には、同サイトの無料ツール「SVG Doctor」でファイルを点検し、余分なノードやレイヤーの問題を確かめておくとよい。","2026-11-12","Crafty Crafter","https://crafty-crafter.club/christmas/christmas-tree-car-svg-for-cricut/"],["新しいCricut紙素材を10作品で試した設定の記録","JenniferMakerが、Cricutの新しいカードストックや特殊紙をCricut Maker 4で実際に切り、どの素材設定がうまくいったかを報告した。自身の無料作品10点で試し、バリューカードストック、メタリック、グリッター、パール、フレークグリッター、シマーの各紙について、成功した設定と失敗例を具体的に紹介。新しい工具キット3種にも触れ、テストカットの重要性も強調する。","\n【概要】クラフトブログのJenniferMakerは、Cricutの新しいカードストックと特殊紙を、自身の無料作品10点を使ってCricut Maker 4で切り比べ、どの設定がうまくいったかを報告する記事を更新した。ページの最終更新日は2026年11月12日となっている。\n\n【背景】Cricutの素材はDesign Spaceで素材名を選ぶと推奨設定が呼び出されるが、新しい素材では既定の設定で切り抜けないことがある。記事は、実際の作品でどの設定を選べばよいかを示す実践的な記録だ。\n\n【詳細】バリューカードストックは、滝のカードでは専用の設定だと2回目のカットが必要になり、「Medium Cardstock」で圧力を強めるとうまく切れた。重ねるハチドリの作品の1層目は粘着の強いマットに替えるまできれいに切れず、細かい層には「Medium Cardstock – Intricate Cuts」で圧力を強める設定が合った。メタリックペーパーは「Metallic Paper」「Foil Paper (0.36 mm)」「Holographic Cardstock」の3つでよく切れ、ハチドリでは「Foil Paper (0.36 mm)」が最もきれいだった。フォイルグリッター紙は「Smooth Glitter」では切り抜けず、「Glitter Cardstock」で圧力を強めると成功。グラデーショングリッター紙は「Glitter Cardstock」の標準の圧力で切れた。フレークグリッターは専用設定だと破れたが、「Flake Glitter」で圧力を強めると成功した。シマーペーパーは「Shimmer Paper」で圧力を強めた。\n\n【ポイント・注意点】パールペーパーは長い曲線なら専用の設定で問題なかったが、細かい木の部分では表面の光沢層が芯から剥がれ始めたため、とても細かいデザインには勧めないとしている。結果は刃やマット、デザインによって変わるため、本番の前に必ずテストカットをするよう求めている。工具では、Classic Tool Set、Paper Tool Kit、Iron-On and Vinyl Tool Kitの3つの新しいキットが登場したことにも触れている。新素材を買ったばかりの人は、記事の設定を出発点にして自分の環境で試すとよい。","2026-11-12","JenniferMaker","https://jennifermaker.com/cricut-materials-and-tools/"],["ガラスにビニールを泡なしで貼る水貼りのコツ","Silhouette Schoolが、粘着ビニールをガラスに気泡なしで貼る「水貼り」の方法を紹介した。水1/2カップに食器用洗剤1滴を混ぜた液を薄く吹き付け、位置を直しながら中心から外へ圧着して水と空気を押し出す。Oracal 651を使った12段階の手順と、転写テープを剥がす前に最低45分待つといった注意点をまとめている。タイルなど水を吸わない面にも応用できる。","\n【概要】カッティングマシン情報ブログのSilhouette Schoolは2026年11月12日、粘着ビニールをガラスに気泡なしで貼る方法を紹介する記事を掲載した。せっけん水を薄く吹き付けてから貼る「水貼り」で、著者は「泡ひとつない」仕上がりになったとしている。\n\n【背景】ガラスやタイルのような水を吸わない面にビニールを乾いたまま貼ると、空気が入りやすく、一度貼ると位置を直せない。せっけん水の薄い膜があれば、貼ったあとでもビニールを少し動かして位置を直せ、圧着するときに水と一緒に空気を押し出せる。\n\n【詳細】材料は、細かい霧が出るスプレーボトル、食器用洗剤、水、パーマネント粘着ビニール（記事ではOracal 651）、転写テープ、クッキングシート、イソプロピルアルコール、定規とホワイトボード用ペン、マスキングテープ、スクレーパー。手順は12段階ある。水1/2カップに食器用洗剤を1滴入れてスプレーボトルで混ぜる。デザインをパーマネントビニールでカットしてカス取りし、転写テープを貼ったら、紙の台紙をクッキングシートに替えて位置合わせをしやすくする。ガラスをアルコールで拭いて乾かし、定規で中心を測ってペンで印を付ける。デザインを置いて上辺をマスキングテープで留め、ちょうつがいのようにする。デザインをめくって印を消し、クッキングシートを外したら、ガラスにごく薄く液を吹き付ける。デザインを下ろしてテープを外し、中心から外へ圧着して水と気泡を押し出す。\n\n【ポイント・注意点】水を多く押し出すほど、転写テープを剥がせるまでの乾燥時間が短くなるので、しっかり圧着を続けることが大切だ。乾燥は最低45分待ち、著者は一晩置くことを勧めている。転写テープはゆっくり剥がし、ビニールがガラスに残っているか確かめながら進める。液は「ごく薄く」吹き付けるのがコツで、多すぎると乾くまでに時間がかかる。ガラスのほか、タイルなど水を吸わない面にも同じ方法が使えるとしている。ガラスに付けた中心の印はホワイトボード用ペンなので、貼る直前にきれいに拭き取れる。","2026-11-12","Silhouette School","https://www.silhouetteschoolblog.com/2021/07/how-to-apply-vinyl-to-glass-without.html"]],"uv":[["LONGER、卓上UV「ePrint」を軸に創作機器群を拡充","香港のLONGERは2026年11月18日、レーザー彫刻機・3Dプリンター・UVプリンターをそろえた卓上製作機器ラインアップの拡充をGlobeNewswireで発表した。中心は2基のEpson F1080ヘッドと12インクチャンネルを持つ卓上UVプリンター「ePrint」で、最大15mmの隆起表現や300種超の素材対応をうたう。11月3日〜12月2日にはブラックフライデー価格での販売も実施している。","\n【概要】LONGERは2026年11月18日、香港発のGlobeNewswireプレスリリースで、レーザー彫刻機、3Dプリンター、UVプリンターをそろえた卓上向け製作機器ラインアップの拡充を発表し、The Manila Timesも同日に転載した。中心に据えたのは卓上UVプリンター「ePrint」で、高解像度のカラー印刷、インクの積層表現、フルカラーの3Dレリーフ印刷を1台で行える機種と位置付けている。\n【背景】卓上UVプリンターの市場では、各社が個人クリエイターや小規模事業者向けの機種を相次いで投入している。LONGERはもともとレーザー彫刻機や3Dプリンターを手がけており、今回の発表ではUV印刷をそれらと並ぶ製作手段として打ち出した。用途にはパーソナライズ商品、看板やインテリア、クリエイティブグッズ、小ロット生産を挙げている。\n【詳細】ePrintは2基のEpson F1080プリントヘッドと12のインクチャンネルを備え、白インク、カラーインク、ニスに対応する。デュアルヘッド機はシングルヘッドの「ePrint SE」に比べ、2D印刷で最大2倍、3Dテクスチャ印刷で最大6倍速いとLONGERは説明する。隆起は最大15mm、高低差10mmまでの面に印刷でき、300種類以上の素材に対応し、他社インクも使える「オープンインクシステム」を採用した。標準の印刷台は310×420mmで、310×75mmのミニ台もオプションで用意する。金銀、蛍光、蓄光、刺繍風、ニスなどの特殊効果にも対応し、ソフト「LongerStudio AI」では背景除去、レイアウト、色調整、テキストからのロゴ生成などが使える。ブラックフライデーでは、ePrint Single UVが定価2,499ドルから1,899ドル、Dual UVが3,299ドルから2,499ドル、UV + DTが3,299ドルから2,699ドルになり、クーポンでさらに下がる。\n【ポイント・注意点】性能の数値はいずれもメーカーの公称値で、第三者の検証結果ではない。特殊効果は素材や設定によって使えるかどうかが変わるとされているため、販売用の商品づくりに使うなら、狙う素材で試し刷りしてから判断したい。同社のレーザー彫刻機などと組み合わせれば、1つの工房で加工の幅を広げられる点も特徴だ。","2026-11-18","The Manila Times（GlobeNewswire）","https://www.manilatimes.net/2026/11/18/tmt-newswire/globenewswire/longer-brings-laser-engraving-3d-printing-and-advanced-uv-printing-together-in-its-expanded-desktop-creative-manufacturing-lineup/2472920"],["販促品のAAkron Line、Inkcups「X5-T」で曲面への直接印刷を強化","インドの印刷専門誌Print3 Magazineは2026年11月18日、北米の販促品サプライヤーAAkron Lineが、Inkcupsのフラットベッド型ダイレクト・トゥ・オブジェクト（DTO）プリンター「X5-T High Throw」を導入したと伝えた。最大25%の曲面や凹凸面に刷れ、X5-Tだけで1日約4,000〜5,000個を生産すると見込む。24時間納期の注文増に応えるための投資だ。","\n【概要】インドの印刷専門誌Print3 Magazineは2026年11月18日、北米の販促品サプライヤーAAkron Lineが、Inkcupsのフラットベッド型ダイレクト・トゥ・オブジェクト（DTO）プリンター「X5-T High Throw」を導入したと報じた。記事の副題では「先進的なUVフラットベッド印刷技術」への投資と表現している。\n【背景】AAkron Lineは北米に複数の拠点を持つ同族経営の販促品サプライヤーで、900点を超える商品を扱う。Inkcupsとの関係は消耗品の購入から始まり、その後、同社の円筒型とフラットベッド型のDTO機を導入して、24時間納期の注文に対応してきた。2026年初めには、より速い生産サイクルと曲面を含む多様な商品に対応するため、新しいDTO機を探し始めたという。\n【詳細】X5-Tは2026年4月、テネシー州の製造拠点に設置された。最大25%の曲面、凹面、凹凸面に印刷でき、記事では取っ手付きのマグ、段付きのドリンクウェア、ストレスボール、スポーツ用品が例に挙がっている。X5-Tだけで1日におよそ4,000〜5,000個を生産すると同社は見積もる。取扱商品の約40%をX5-Tで、別の約40%を円筒型DTO機「Helix」で印刷している。設置とトレーニングは約2日で、実際の顧客注文を使って訓練した。テネシー拠点のアシスタント・プラント・マネージャー、Justin Wilkins氏は「DTOなら転写シートや箔を待つ時間がない」と話し、Inkcupsのサポートの迅速さも評価している。記事は、X5-Tを、ヘッドを素材に近づける必要がある従来の大型UVフラットベッド機と対比している。\n【ポイント・注意点】販促品ビジネスでは、短納期と商品数の多さに同時に応える必要がある。曲面に直接刷れる機種は、転写の工程を省いて流れを短くできる点が強みだ。一方、生産数量はユーザー企業の見積もりで、インクの方式は記事本文では明記されていない。導入を検討する際は、扱う商品の形状と必要な日産数を照らし合わせることが大切になる。AAkron Lineは2027年に創業60周年を迎える。","2026-11-18","Print3 Magazine","https://www.print3.in/aakron-line-expands-direct-to-object-printing-capabilities-with-inkcups-x5-t-high-throw-printer/"],["ColDesi、DTF・UV DTF機の保守キット定期便を開始","米フロリダ州タンパのColDesiは、DTFプリンターとUV/DTFプリンターの所有者向けに、保守キットを定期的に届けるサブスクリプションサービスを始めた。Screen Printing Magazineが2026年11月18日に伝えた。機種に合わせたキットが決まった間隔で自動配送され、加入者は10%引きで購入でき、米本土内はUPS Ground Saverの送料が無料になる。配送頻度の変更や一時停止、解約もできる。","\n【概要】Screen Printing Magazineは2026年11月18日、米ColDesiが、DTFプリンターとUV/DTFプリンターの所有者向けに「保守キット定期購入サービス」を始めたとするプレスリリースを掲載した。申し込みはsubscriptions.coldesi.comで受け付ける。\n【背景】ColDesiはフロリダ州タンパに拠点を置き、業務用のデジタル印刷機、刺しゅう機、カスタマイズ用機器を提供する企業だ。UV DTFは、UVインクで印刷したフィルムを硬い物に貼って転写する方式で、タンブラーや雑貨の装飾に使われている。こうした機械を安定して動かすには、ヘッド周りの清掃や部品交換などの定期保守が欠かせず、交換用品の把握と発注の手間が利用者の負担になりやすい。\n【詳細】新サービスでは、所有する機器に合わせた保守キットが、利用者の決めたスケジュールで自動的に届き、毎回発注し直す必要がない。加入者は保守キットを10%引きで購入でき、米国本土内ではUPS Ground Saverによる配送が無料になる。配送頻度の変更、一時停止、解約も利用者が行える。キットは、ColDesiが扱う対応DTF機とUV/DTF機向けに作られている。利用者はサイト上で自分の機器に合うキットを選び、定期配送の間隔を設定する。ColDesiは、部品の管理や再注文にかかる時間を減らせるサービスだと説明し、定期保守を補い、トレーニングや技術サポートなど同社の顧客支援を広げる取り組みの一つと位置付けている。\n【ポイント・注意点】UV系の機械は、日々の手入れが印刷品質を左右する。消耗品を切らさない仕組みは、少人数で回す制作販売の現場ほど効果が大きい。ただし、節約効果やダウンタイムの削減は企業側の主張で、第三者の検証はない。対象はColDesiの対応機に限られ、他社機の利用者は使えない。送料無料も米国本土内の配送に限られる点に注意したい。配送の間隔を自分の機械の稼働量に合わせて決めておけば、保守の抜けを防ぐ助けになりそうだ。","2026-11-18","Screen Printing Magazine","https://screenprintingmag.com/coldesi-introduces-maintenance-kit-subscription-service-for-dtf-and-uv-dtf-printers/"],["ローランドDGの「Make Your Mark」、The Drum B2B Awardsで3部門受賞","UVプリンターなどを手がけるローランド ディー.ジー.は2026年11月18日、2026年4月に発表したグローバルブランド刷新と「Make Your Mark」キャンペーンが、The Drum B2B Awards 2026で3部門を受賞したと発表した。シルバー2部門とブロンズ1部門で、世界の数千人のユーザーへの聞き取りを基にしたメッセージづくりと、顧客の成果物に焦点を当てた表現が評価された。","\n【概要】ローランド ディー.ジー.は2026年11月18日、PR TIMESで、同社のグローバルブランド刷新と「Make Your Mark」キャンペーンがThe Drum B2B Awards 2026で3部門を受賞したと発表した。Photography & Illustration部門とCorporate Positioning部門でシルバー、Brand Positioning部門でブロンズを獲得した。\n【背景】受賞の対象は、2026年4月に発表したグローバルブランドの刷新と、新しいブランドメッセージ「Make Your Mark（長く残る感動を生み出す）」の展開だ。同社はこの刷新を通じ、ハードウェア、サプライ、ソフトウェア、サービスを一体で提供する「トータルソリューション」への事業転換を示している。UVプリンターや大判プリンターのメーカーが、製品単体ではなく、顧客の成果物を軸に自社を語り直した形だ。\n【詳細】メッセージは、世界の数千人のユーザーへのインタビューや調査を基に作られた。ユーザーは製品の性能だけでなく、自らの仕事や成果物への誇りや自信を重視していたという。Webサイトや動画では、顧客とその成果物や用途に焦点を当て、写真と色彩を効果的に使っている。キャンペーンはWebサイト、SNS、主要な国際業界イベントを通じて世界各国で展開されている。グローバルマーケティング Vice PresidentのDan Wilson氏は「驚きや感動をもたらす成果物を創造するために重要なのは、テクノロジーだけではありません」と述べた。さらに、3部門で評価されたことについて、同社の歴史や強みを受け継ぎながら進化する姿が伝わったものと受け止めている、とコメントしている。\n【ポイント・注意点】今回の発表は製品の新発売ではなく、ブランドとマーケティングに関する受賞のニュースだ。UVプリンターを使う事業者にとっては、メーカーが機器、消耗品、ソフト、サービスを一体で提供する方向を強めている点が読み取れる。導入を検討する際は、本体の性能に加え、インクや保守、ソフトの支援まで含めて比べる視点がいっそう大切になりそうだ。","2026-11-18","PR TIMES（ローランド ディー.ジー.）","https://prtimes.jp/main/html/rd/p/000000135.000095799.html"],["MAW、ローランドDGの円筒UV機「VersaObject RC-300」を国内初導入","オリジナルグッズ製作サービス「ME-Q」を運営する株式会社MAWは2026年11月17日、ローランド ディー.ジー.製のシリンドリカルUVプリンター「VersaObject RC-300」を国内で初めて導入したと発表した。ボトルやタンブラーの側面に360°のフルカラー印刷ができ、製版が要らないため試作や小ロット、多品種の製作に向く。今後は同機種の追加導入も予定している。","\n【概要】オリジナルグッズ製作サービス「ME-Q」を運営する株式会社MAWは2026年11月17日、PR TIMESで、ローランド ディー.ジー.製のシリンドリカルUVプリンター「VersaObject RC-300」を国内導入第1号として導入したと発表した。ボトルやタンブラーへの360°フルカラーUV印刷に対応する。\n【背景】ステンレスボトルやタンブラーなどの円筒形の商品は、ノベルティや自社ブランド商品として需要が高い。一方、版を作る従来の印刷方法では、少ない数量や多品種の製作に費用と手間がかかりやすい。製版がいらないデジタルUV印刷は、こうした小ロットの需要に合う方法として注目されている。\n【詳細】RC-300は、円筒形の製品を回転させながら側面に360°のフルカラー印刷を行う。対象はステンレスボトル、タンブラー、化粧品容器、ガラス製品などだ。印刷方式は螺旋状に刷る「ヘリカル印刷方式」で、最大1,200dpiに対応し、CMYKに加えてホワイトやグロスのインクも使える。「製版を必要としないデジタルUV印刷方式」のため、試作や小ロット、多品種の製作に向くと同社は説明している。MAWは企業ノベルティ、OEM製品、オリジナルブランド商品の相談を受け付けるほか、持ち込んだ容器への印刷の相談にも応じる。今後は同機種を追加で導入し、小ロットから大口注文まで対応できる生産体制を整える予定だ。\n【ポイント・注意点】印刷できるかどうかは、素材、形状、表面処理によって異なる。また、食洗機に対する耐久性はメーカーが追加で検証している段階で、保証はされていない。飲料容器として繰り返し洗う商品を企画する場合は、この点を事前に確認しておく必要がある。国内初の導入事例として、円筒物への直接UV印刷が受託製作の現場にどう広がるかが注目される。持ち込み容器への対応は、自社の容器を持つブランドにとって使いやすい選択肢になりそうだ。ME-Qで円筒物の製作をどこまで受けられるようになるかも、今後の注目点となる。","2026-11-17","PR TIMES（株式会社MAW）","https://prtimes.jp/main/html/rd/p/000000415.000072705.html"],["LONGERのブラックフライデー、UV機「ePrint」が1,899ドルから","3DPrinting.comは2026年11月17日、LONGERのブラックフライデーセールを紹介した。UVプリンター「ePrint」のSingle UVは定価2,499ドルが1,899ドルになり、注文額に応じた5〜8%のクーポンを使うと1,766.07ドルになる。セールは11月3日から12月2日まで世界で行われ、レーザー彫刻機や3Dプリンターも値引きの対象だ。価格は11月16日時点のもの。","\n【概要】3D印刷情報サイトの3DPrinting.comは2026年11月17日、LONGERのブラックフライデーセールの内容をまとめた記事を掲載した。UVプリンター「ePrint」は1,899ドルから、レーザー彫刻機「Ray5」は159.99ドルからで、レーザー彫刻機やプリンターは最大38%引きになる。さらにクーポンコードで5〜8%が差し引かれる。\n【背景】年末商戦期は卓上UVプリンター各社が値下げを競う時期で、個人や小規模事業者が機材をそろえる好機になっている。なお、3DPrinting.comはLONGERの有料ブラックフライデーパートナーで、記事内のリンク経由の購入で手数料を得ると明記している。価格は11月16日時点のものだ。\n【詳細】セールとクーポンは米東部時間で11月3日から12月2日まで世界で実施され、価格は米ドル建て。クーポンは注文額に応じた段階式で、BF5は全注文5%引き、BF6は299ドル以上で6%、BF7は899ドル以上で7%、BF8は1,999ドル以上で8%引きとなる。ePrintはSingle UV、Dual UV、UV + DTの3構成。Single UVは定価2,499ドルがセールで1,899ドル、BF7適用で1,766.07ドル。Dual UVは3,299ドルが2,499ドル、BF8で2,299.08ドル。UV + DTは3,299ドルが2,699ドル、BF8で2,483.08ドルになる。ePrintは物に直接カラー印刷でき、LONGERは最大15mmの隆起表現と300種超の対応素材をうたう。UV + DT版は硬い面への印刷に加え、布、DTG、UV DTFにも対応するという。このほか、Ray5、Ray2、Ray7、Ray7sの各レーザー彫刻機や、FDM方式の3Dプリンター「LK5 Pro」も値下げされている。\n【ポイント・注意点】記事は販売パートナーによる紹介で、性能はメーカーの公称値だ。購入時はクーポンの条件となる注文額と、構成ごとの対応工程を確かめたい。布やUV DTFまで1台で扱いたいならUV + DT版、硬い素材への直接印刷が中心ならSingle UVやDual UVというように、用途から構成を選ぶのが現実的だ。","2026-11-17","3DPrinting.com","https://3dprinting.com/news/longer-black-friday-2026/"],["ローランドDGA、年末の設備投資を提案 UV機の特別価格も","米ローランドDGAは2026年11月17日、PR Newswireで年末の設備投資を勧める記事を配信した。インク費の削減例や外注の内製化、米国の税制「セクション179」に触れ、UV直接印刷機「VersaObject」の特別価格や、UVプリンター/カッター「TrueVis LG-640」の年内購入での割引を紹介した。白インクやスポットニスなど、UV機で付加価値を高められる点も強調している。","\n【概要】米カリフォルニア州アーバインのRoland DG Americas（ローランドDGA）は2026年11月17日、PR Newswireで「来年まで待たないで：今こそデジタルプリンターに投資すべき理由」と題した記事を配信した。年末の設備投資を後押しする内容で、UVプリンターの販促も含まれている。\n【背景】米国には、事業者が対象設備の購入費を、使い始めた年に一括で控除できる税制「セクション179」があり、年末は設備の購入を検討する時期になりやすい。記事は、リース契約の形によってはリースした設備にも適用されうると説明している。\n【詳細】インク費の例として、年に約40,000平方フィート（54インチロールで月約5本）を出力する店が、TrueVis VG3-540からVG4-540に替えると、年間のインク費が約11,200ドルから約6,800ドルに下がり、39.3%、年約4,400ドルの削減になるとしている。外注にかかる費用を、遅れや品質の問題、利益の取り分と比べて内製化を考えるようにも促した。UVプリンターについては、特色や仕上げを加えて高い価格設定を支え、パッケージ試作や販促品の市場に参入できると説明する。隠ぺい力の高い白インクで窓や包装、バックライト向けの印刷をラミネートなしで行えるほか、スポットニスや疑似エンボスにも触れている。年末の特典は、TrueVis XP-640とXGシリーズの保証を1年延長して計3年、タンブラーや記念品、販促品などに刷れるUV直接印刷機「VersaObject」の特別価格、UVプリンター/カッター「TrueVis LG-640」の年内購入での割引だ。LG-640は特色、テクスチャ、箔をステッカーや包装に加えられるという。\n【ポイント・注意点】特典の終了日は「年末」とだけ書かれ、具体的な日付は示されていない。インク費の削減額はメーカーの試算例で、実際の効果は出力量や用途で変わる。税制の扱いは個別の条件によるため、米国で購入を検討する事業者は専門家に確認したうえで判断したい。","2026-11-17","PR Newswire（Roland DG Americas）","https://www.prnewswire.com/news-releases/dont-wait-until-next-year-why-now-is-the-time-to-invest-in-a-digital-printer-302941588.html"],["組織内印刷部門、フラットベッド機の設置に壁を壊して対応","Wide-Format Impressionsは2026年11月17日、大学など組織内の印刷部門がフラットベッド型の大判プリンターを設置した工夫を紹介する記事を転載した。フラットベッド印刷を提供する部門は2024年の29%から2026年に45%へ増え、最も伸びたサービスになった。各部門は壁を壊したり扉を広げたりして場所を確保しており、搬入経路を事前に測る大切さが語られている。","\n【概要】大判印刷の専門メディアWide-Format Impressionsは2026年11月17日、「How Do You Fit a Flatbed?（フラットベッド機をどう収めるか）」と題した記事を掲載した。In-plant Impressions編集者のBob Neubauer氏の記事を転載したもので、大学や公共機関の組織内印刷部門が、UV機を含むフラットベッド型の大判プリンターをどう設置したかを紹介している。\n【背景】同誌の2026年の調査によると、フラットベッド型の大判印刷は組織内印刷部門で最も伸びたサービスで、提供する部門の割合は2024年の29%から2026年には45%に増えた。板材に直接刷る需要が広がる一方、大型の機械を既存の建物に入れることが課題になっている。\n【詳細】SUNY BrockportはRicoh Pro TF6251が狭い廊下を通らず、向かいの倉庫側の壁に穴を開けて搬入し、あとでふさいだ。Pittsburg State UniversityはMimaki JFX200-2513EXのために壁を壊して頭上扉を付け、車両グラフィックの作業にも役立てている。San José State Universityは場所を節約するため、小型のUVフラットベッド機Xanté X-55を選んだ。University of West Georgiaは耐力壁でない壁を撤去し、空調と電源を強化し、搬入口を6フィートから8フィートに広げた。Utah State Universityは大型のオフセット印刷機を売ってRicoh Pro TF6251とColexのカッターの場所を作り、フラットベッドの仕事が最も伸びて常勤職を新設したという。East Baton Rouge Parish Schoolsは、ハイブリッド機は思った以上に場所を取り、4×8フィートの板なら全体で約25フィートが要るとして、狭い場合は本格的なフラットベッドを勧める。\n【ポイント・注意点】記事が挙げる助言は、入口や廊下、扉の寸法を機種選びの前に測ること、設置面積だけでなく周囲の作業空間も見ること、電源と換気を計画すること、3〜5年先を見て建物を改修することだ。最も多い障害は戸口だったという。記事にはラテックス機も含まれ、すべてがUV機ではない点に注意したい。","2026-11-17","Wide-Format Impressions","https://www.wideformatimpressions.com/article/how-do-you-fit-a-flatbed/"],["LONGER「ePrint」の20種超の表現技法、独3Dnativesが紹介","独3Dnativesは2026年11月16日、LONGERの卓上UVプリンター「ePrint」が20種類を超える表現技法を組み合わせられる点を紹介した。2基のヘッドと計12インクチャンネル、310×420mmの印刷面、最大15mmの隆起を備え、刺繍風の盛り上げや木・石の質感、鏡面のような光沢などを作れる。AI機能を備えた専用ソフトや2種類の構成も併せて紹介している。","\n【概要】3D印刷専門メディア3Dnativesのドイツ語版は2026年11月16日、Carol Sambrano氏の記事で、LONGERの卓上UVプリンター「ePrint」が20種類以上の創作技法を組み合わせ、卓上でのパーソナライズを可能にすると紹介した。\n【背景】LONGERはおよそ10年にわたりレーザー彫刻機や3Dプリンターを作ってきたメーカーだ。卓上UVプリンターは、物に直接フルカラーで刷るだけでなく、インクを重ねて立体的な質感を出せる点が注目され、個人や小規模事業者の商品づくりに広がっている。\n【詳細】ePrintはフルカラー印刷と3Dレリーフ印刷のための卓上UVフラットベッド機で、2基のプリントヘッドと計12のインクチャンネルを持つ。記事は、2ヘッド構成でインクの吐出量が倍になり、チャンネルを組み合わせて多くの効果を出せると説明する。100万色以上を表現でき、色解像度は最大1,440dpi（メーカー公称）、印刷面は310×420mm。1,600万画素のカメラで印刷台を読み取り、物の輪郭を検出して、印刷前に範囲を確認できる。木、アクリル、革、金属、ガラスなど300種以上の素材に対応し、インク層を重ねて最大15mmの隆起を作る。構成は、直接UV印刷と質感表現に特化した「Dual-UV」と、UV直接、UV-DTF、DTF、DTGの4工程を扱える「UV+DTF」の2種類。記事が挙げる技法は、刺繍風の盛り上げ、木や石の表面質感、インクとニスによる鏡面光沢、両面への着色、1つのデザイン内でのつや消しと光沢の対比、蛍光印刷、ネイルデザインなどだ。ソフト「LONGER Studio」は、テキストからのロゴ生成や画像生成、背景除去、素材を認識して設定を提案するAI機能を備え、2Dから3Dレリーフへの変換や一括印刷にも対応する。\n【ポイント・注意点】記事に価格は書かれておらず、期間限定のブラックフライデー価格に触れるのみだ。色数や解像度はメーカーの公称値なので、商品化を考えるなら実際に使う素材での仕上がりを確かめたい。","2026-11-16","3Dnatives","https://www.3dnatives.com/de/longer-eprint-kreative-techniken-desktop-personalisierung-16112026/"],["印刷業界週報、UV対応フィルムとEpsonのUVヘッドを取り上げる","プリントヘッド販売のAllprintheadsは2026年11月15日、11月9〜15日の印刷業界ニュースをまとめた週報を公開した。UV関連では、UVインクにも対応する両面印刷フィルム「Drytac PrintDuo」と、I3200系のUV対応ヘッド「Epson I3200-U1」を取り上げた。曲面や凹凸のある立体物に刷るEpsonの「ContourJet」を欧州で公開する予定なども紹介している。","\n【概要】プリントヘッドの販売店Allprintheadsは2026年11月15日、11月9日から15日までの印刷業界の動きをまとめた週報を公開した。UVに関わる話題は多くないが、UV印刷にも対応するフィルムの新製品と、UV対応のEpson製プリントヘッドを取り上げている。\n【背景】この週報は、各ニュースに「プリントヘッドの観点」の注記を付け、機械の保守に携わる人に向けて読み解いている点が特徴だ。UVプリンターではノズル面の近くにLEDランプがあるため、使うメディアによってヘッドへの負担が変わる。\n【詳細】Drytacは11月11日、10ミルの白いつや消しフィルム「PrintDuo」を発売した。ポリプロピレンとポリエステルの多層構造で、両面に印刷できる。不透明度99.9%と反りにくさをうたい、エコソルベント、ラテックス/レジン、UVの各インクに対応し、3種類の窓用粘着材と組み合わせる。週報は、ノズル面の近くにLEDランプを持つUVヘッドでは、密度の高い合成メディアの負荷が大きいと指摘する。最初の仕事では霧状の飛び散りやサテライト滴に注意し、ワイプの間隔を詰めるよう勧めている。関連してEpsonの「I3200-U1」を、I3200系のUV対応版として紹介し、販売価格を1,390ドルとしている。このほか、Epsonは2027年2月2〜4日のC!Print Lyonで、6軸ロボットにPrecisionCore S800ヘッドを載せて曲面や凹凸のある立体物に刷る「ContourJet」を公開する予定だ。ORAFOLは、Roland DGのTrueVIS XP-640を基にした交通標識用プリンターの改良版を紹介し、インクカートリッジにIDチップを付けて残量を検知できるようにした。\n【ポイント・注意点】週報はプリントヘッドを売る企業の発信で、I3200-U1の紹介は自社の販売商品とも結び付いている。ContourJetのインク方式は記事に書かれていない。UVプリンターの利用者にとっては、新しいメディアを使い始めるときにヘッドの状態とワイプの設定を見直すという実務的な注意点が参考になる。","2026-11-15","Allprintheads","https://www.allprintheads.com/blogs/news/allprintheads-industry-news-what-moved-in-print-this-week-november-9-15-2026"],["ミマキ、販促品・工業製品向けUVフラットベッド「UJF200」2機種","World Imaging Newsは2026年11月13日、ミマキエンジニアリングのUVインクジェットフラットベッドプリンター「UJF200-3042」「UJF200-6042」を紹介した。販促品や工業製品の加飾向けで、厚さ250mm・重さ20kgまでの対象物に刷れる。従来機より最大約2倍の生産効率をうたい、カメラによる位置合わせやコンベヤーとつなぐベルトのオプションも用意する。","\n【概要】画像・印刷業界のメディアWorld Imaging Newsは2026年11月13日、ミマキエンジニアリングが販促品や工業製品の加飾向けに、フラットベッド型UVインクジェットプリンター「UJF200-3042」と「UJF200-6042」を発表したと伝えた。記事に載ったプレスリリースの日付は2026年9月となっている。\n【背景】ノベルティや工業製品への名入れや加飾では、多品種の対象物を効率よく刷り分けることが求められる。両機種は、ミマキのグラフィック向けプリンター「330シリーズ」の高精細ヘッドを載せ、こうした需要に応える位置付けだ。\n【詳細】蛍光ピンクと蛍光イエローのインクに対応し、アクセントカラーとして使える。オプションのカメラユニットは、対象物ごとの形と位置を検出して画像を合わせる。オプションのベルトユニットは、コンベヤーなど生産ラインの機器とつないで搬送や回収を行える。生産効率は従来機より最大で約2倍とされ、これはA3のカラーのみの仕事を標準モードで行い、準備、印刷、取り外しまでを含めた比較に基づく。対象物は厚さ250mmまで、重さ20kgまで対応し、機内持ち込みサイズのバッグやデスクトップPCの筐体などに直接印刷できる。最大印刷範囲は、3042がA3（420×300mm）、6042がA2（420×610mm）。本体寸法（幅×奥行×高さ）は3042が1,380×1,166×798mm、6042が1,680×1,166×798mm、重さはそれぞれ171kgと187kg。両機種とも2026年10月に発売する予定とされ、ラスベガスのPRINTING United Expoで披露される。最初の出展は9月15日に東京・池袋で開かれるオリジナルグッズビジネスショーと案内されている。\n【ポイント・注意点】記事に価格は書かれておらず、問い合わせはミマキの米国サイトに案内されている。生産効率の数値は特定の条件での比較で、刷る物や設定によって結果は変わる。カメラとベルトはオプションのため、自動化の度合いに応じて構成を選ぶ必要がある。","2026-11-13","World Imaging News","https://worldimagingnews.com/mimaki-announces-ujf200-3042-and-ujf200-6042-flatbed-uv-printers/"]],"risk":[["佐賀県がインフル注意報 昨年より9日早く20歳未満が約7割","佐賀県は11月18日、インフルエンザの流行発生注意報を出した。昨年より9日早い発令となる。9〜15日の1週間に県内24の定点医療機関から報告された患者は379人で、1医療機関あたり15.79人と基準値の10を超えた。年齢別では0〜9歳が149人、10代が109人で、20歳未満が全体の約7割を占める。高齢者施設と保育施設では集団発生もあった。県は手洗いや換気、人混みを避けることを呼びかけ、早めの受診相談を勧めている。","\n【概要】佐賀県は11月18日、インフルエンザの流行発生注意報を発表した。昨年より9日早い。11月9〜15日の1週間に県内24の定点医療機関から報告された患者は379人で、前週より171人増えた。1医療機関あたりでは15.79人となり、注意報の基準値である10を上回った。前週の約1.8倍にあたる。\n【背景】県内の今シーズンの流行期入りは第37週（9月7〜13日）で、2007年以降の記録では2019年と並んで最も早かった。その後も患者の報告が続き、今回の注意報につながった。高齢者施設と保育施設では集団発生も起きており、子どもから高齢者まで幅広い世代に影響が出ている。\n【詳細】保健福祉事務所別では唐津が45.25人で最も多く、杵藤、佐賀中部、鳥栖、伊万里の順に続いた。簡易検査の結果はA型が376人とほぼすべてで、B型は1人、型不明は2人だった。年齢別では0〜9歳が149人、10代が109人で、20歳未満が全体の約7割を占めた。小中学校や高校などでは108人が欠席し、学級閉鎖や学年閉鎖は10件にのぼった。記事は症状の特徴にも触れ、抗ウイルス薬は発症から48時間以内に使うと効果があること、予防接種にも効果があることを説明している。\n【ポイント・注意点】患者の多くが子どもや若い世代で、学校や保育の場で広がっている。県は手洗いや換気を徹底し、人混みを避けるよう呼びかけている。発熱などの症状が出た場合は、早めにかかりつけ医に相談することを勧めている。抗ウイルス薬が効果を発揮しやすい時間には限りがあるため、子どもの様子がおかしいと感じたら受診を先延ばしにしないことが大切だ。予防接種をまだ受けていない家庭は、接種についてかかりつけ医と相談するとよい。今季は流行期入りが2007年以降の記録で最も早い水準となったうえ、保育施設での集団発生や、学級閉鎖・学年閉鎖10件と、子どもの集まる場での広がりが目立つ。家庭と学校の双方で手洗いや換気を心がけ、熱やせきのある子どもは無理をさせずに休ませることが、周りへの広がりを抑える助けになる。","2026-11-18","佐賀新聞","https://www.saga-s.co.jp/articles/-/1832751"],["チャイルドシート義務 身長が低い6歳以上にも拡大を検討","道路交通法で6歳未満に義務づけられているチャイルドシートの使用を、身長が低い6歳以上にも広げる方向で検討が進んでいる。警察庁は年内をめどに検討会の報告書をまとめる予定。2024年には福岡県で、シートベルトを着けていた7歳と5歳の女児が事故で腹部などを圧迫されて亡くなった。JAFは使用の目安を身長140cm未満から150cm未満に引き上げており、北海道の保護者からは明確な基準を求める声などが上がっている。","\n【概要】道路交通法は6歳未満の子どもにチャイルドシートの使用を義務づけている。この対象を「身長が低い6歳以上」にも広げる方向で検討が進んでいる。警察庁は年内をめどに検討会の報告書をまとめる予定で、北海道の保護者からはさまざまな声が上がっている。\n【背景】見直しのきっかけの一つが、2024年に福岡県で起きた事故だ。シートベルトを着けていた当時7歳と5歳の女児が、事故で腹部などを圧迫されて亡くなった。この事故を受け、6歳以上でも背が低い子どもはシートベルトが首などに食い込む危険があると指摘されている。JAFは使用の目安を「身長140cm未満」から「150cm未満」に引き上げた。\n【詳細】JAFの実験動画では、子どもがシートベルトだけで衝突すると、体が前に投げ出され、ベルトが首や腹に強く食い込む様子が分かる。JAF札幌支部の安藤純一さんは、腰ベルトが腹にかかると内臓を傷める重傷につながると話し、体格に合ったシートを選ぶよう訴えている。記者が背の低い子どもと同じ頭の高さで座ってみると、ベルトが直接首に当たった。保護者からは「年齢や学年ではなく身長などの明確な基準がよい」という声のほか、新しく買うのは負担になるという声も出た。ダスキンレントオール北見ステーションでは背もたれのないタイプを月額1,980円で貸し出しており、購入前に試す人が多いという。\n【ポイント・注意点】法律の義務が6歳未満までだからといって、6歳を過ぎた子どもにシートベルトだけで十分とは限らない。ベルトが首や腹にかかっていないか、実際に座らせて確かめることが大切だ。JAFの目安である身長150cm未満を参考に、体格に合ったシートを選びたい。購入の負担が気になる場合は、レンタルで試してから選ぶ方法もある。JAFの安藤さんが指摘するように、腰ベルトが腹にかかった状態で衝突すると内臓を傷めるおそれがある。福岡県の事故のように、ベルトを着けていても命に関わることがある。警察庁の検討会がまとめる報告書の内容を待つだけでなく、今の子どもの身長とベルトの位置を家庭で一度確かめておきたい。","2026-11-18","STVニュース北海道（Yahoo!ニュース）","https://news.yahoo.co.jp/articles/0d2474b2986765b31f8fd201a252631057822293"],["チャイルドシートで58%がヒヤリ 1〜4歳児の親1000人調査","チャイルドシートブランドCYBEXの日本総代理店CTP JAPANは、チャイルドシートを使う1〜4歳児の親1,000人の調査結果を発表した。長く使えるタイプを選んだ人は68.3％だったが、52.0％が途中で買い替えや買い替えの検討を経験していた。ヒヤリハットを経験した人は58.0％で、子どもが嫌がった際に19.7％がハーネスを少し緩めていた。81.0％が何かしらの不安を抱えており、専門家はハーネスの位置などの定期的な点検を勧めている。","\n【概要】チャイルドシートブランドCYBEXの日本の正規輸入総代理店であるCTP JAPAN株式会社は11月18日、1〜4歳児の親1,000人を対象にした調査の結果を発表した。新生児から4歳以上まで使える長く使えるタイプを選んだ人は68.3％だった。一方で、買い替えた人が30.2％、買い替えを考えた人が21.8％で、合わせて52.0％にのぼった。\n【背景】調査は2026年10月16〜19日に楽天インサイトがインターネットで行った。対象は、月1回以上子どもを車に乗せてチャイルドシートを使ったことがある1〜4歳児の親である。子どもの成長に合わせて、シートをどう正しく使い続けるかが問われている。\n【詳細】3〜4歳児の親が買い替えを考えた時期は「3歳」が52.1％で、理由は「身体が大きくなった」が44.8％で最も多かった。使っていて困ったことがある人は75.2％で、「ハーネスから腕を抜いた・抜こうとした」が36.5％だった。事故になりかけて冷やりとした経験（ヒヤリハット）がある人は58.0％で、シートから抜け出す、のけぞって暴れるといった例が挙がった。子どもが嫌がったとき、19.7％がハーネスを少し緩め、22.3％が正しく座らせるのを諦めかけた。何かしらの不安がある人は81.0％で、「ベルトの締め具合が分からない」が57.6％を占めた。\n【ポイント・注意点】モータージャーナリストの岩貞るみこさんは、対向車のはみ出しなど防ぎきれない事故もあると指摘する。そのうえで、ハーネスの位置、体の支え、ヘッドレストの高さを定期的に確かめ、成長に合わせて買い替えも考えるよう助言している。子どもが嫌がってもハーネスを緩めないことが大切だ。調査では、半数を超える親がベルトの締め具合が分からないと答えており、正しい使い方が十分に伝わっていない実情がうかがえる。腕がハーネスから抜けていないか、シートから抜け出せる状態になっていないかを、乗せるたびに確かめる習慣をつけたい。3歳ごろに体が大きくなって合わなくなることも多いため、成長の節目でシートが体に合っているかを見直すことも欠かせない。なお、この発表は企業のプレスリリースで、自社の新製品の宣伝も含まれている。","2026-11-18","PR TIMES（CTP JAPAN株式会社）","https://prtimes.jp/main/html/rd/p/000000038.000135228.html"],["スキー場のエスカレーター巻き込み事故 消費者事故調が防止策","消費者安全調査委員会（消費者事故調）は11月18日、ウインタースポーツの本格シーズンを前に、スキー場のベルトコンベヤー式エスカレーターで起こりうる巻き込み事故の防止策を公表した。昨年12月に北海道小樽市のスキー場で5歳の男児が巻き込まれて死亡した事故などを受けた対応で、事業者に監視員の配置などを求め、利用者には立った姿勢での利用と、衣服のひもの巻き込みへの注意を呼びかけた。","\n【概要】消費者安全調査委員会（消費者事故調）は11月18日、ウインタースポーツの本格シーズンを前に、スキー場のエスカレーターで起こりうる巻き込み事故の防止策を公表した。対象は「スノーエスカレーター」などと呼ばれるベルトコンベヤー式の移動設備で、事業者と利用者の双方に注意を呼びかけている。\n【背景】昨年12月、北海道小樽市のスキー場で、当時5歳の男児がこの設備に巻き込まれて死亡した。消費者事故調はこの事故などを受け、今年3月から関連する設備の調査を始めていた。設備は初心者向けのエリアや、駐車場とゲレンデの間などに置かれ、利用者はベルトの上に立ったまま雪の上を移動する。\n【詳細】ベルトは降り口で機械の内部に引き込まれる構造になっている。そのため、利用者が転んだり座り込んだりすると、衣服や腕が巻き込まれるおそれがある。調査では、降り口付近のベルトに利用者の衣服が巻き込まれた際、自動停止装置が作動の条件を満たさず、止まらなかったことが確認された。これを踏まえ、消費者事故調は事業者に対し、運行前に監視員を配置すること、停止装置が作動するかを確認すること、緊急時の救助手順と役割分担を確認することを求めた。\n【ポイント・注意点】利用者には、立った姿勢で使うことと、衣服のひもなどが機械に巻き込まれないよう注意することを呼びかけている。降り口で転んだり座り込んだりすると巻き込まれるおそれがあるため、子どもを連れてスキー場に行く際は、乗る前に服のひもなどが垂れていないかを確かめ、降り口で立ち止まったり座り込んだりしないよう声をかけたい。停止装置があっても条件によっては止まらない場合があることを知っておくことも大切だ。この設備は初心者向けのエリアに置かれることがあり、スキーに慣れていない子どもが乗ることも考えられる。消費者事故調は今年3月から調査を進め、停止装置が働かなかった事例を確かめたうえで今回の防止策をまとめた。事業者による監視員の配置や救助手順の確認と、利用者の正しい使い方がそろってこそ、事故を防ぎやすくなる。","2026-11-18","リスク対策.com（時事通信）","https://www.risktaisaku.com/articles/-/117311"],["米国など3か国がはしか排除認定を失う ユニセフが接種強化訴え","日本ユニセフ協会は11月18日、ボリビア、メキシコ、米国が麻疹（はしか）の排除国認定を失ったと発表されたことを受け、ユニセフが予防接種の強化を訴える声明を出したと伝えた。米国では今年5,400件を超える症例が確認され、1989〜1991年の再流行以来の多さとなった。症例の96％はワクチン未接種か接種状況不明の人で、5〜19歳が40％を占める。ユニセフは各国に高い接種率の維持を求めた。","\n【概要】日本ユニセフ協会は11月18日、ユニセフ（国連児童基金）の声明を発表した。11月17日にボリビア、メキシコ、米国が麻疹（はしか）の排除国認定を失ったと発表されたことを受け、ユニセフはこれまでの成果が失われつつあり、子どもの命が危険にさらされるおそれがあると警鐘を鳴らした。\n【背景】汎米州保健機関（PAHO）が招集した独立委員会が、11月10日から13日にかけて米州の国と地域を審査した。排除認定の喪失は、同じ遺伝子型・系統のウイルスの感染が国内で12か月以上途切れずに続いた場合に起こる。2025年11月にはカナダが認定を失い、米州全体も地域としての認定を失っていた。\n【詳細】米国では、米疾病対策センター（CDC）によると今年5,400件を超える症例が確認され、1989〜1991年の再流行以来、年間で最も多い。症例の96％はワクチン未接種または接種状況が不明な人で、5歳未満が18％、5〜19歳が40％を占める。メキシコでは今年1万3,900件以上の症例が確認され、2025年初めの集団発生以来、1〜4歳の子どもが最も大きな影響を受けている。ボリビアでも今年100件以上の症例が出ている。ユニセフのキャサリン・ラッセル事務局長は、はしかワクチンは2000年以降、約5,900万人の命を救ってきたと述べた。\n【ポイント・注意点】はしかは世界で最も感染力の強い病気の一つで、高熱や重い発疹、肺炎、脳炎を起こし、死に至ることもある。ユニセフは、コロナ禍の後の免疫の空白や誤情報、ワクチンへのためらいなどで多くの子どもが守られていないと指摘し、接種率がわずかに下がるだけでも集団発生の原因になり得るとしている。各国政府には高い接種率の維持やサーベイランスの強化、ワクチンへの信頼の回復を求めている。一方で、米州は過去に2度はしかの排除を達成し、直近では2024年に認定を取り戻した。ボリビア、メキシコ、米国は予防接種やサーベイランス、集団発生への対応を強化しているという。欧州・中央アジアでも2026年1月に英国やスペインなど6か国が認定を失っている。","2026-11-18","PR TIMES（日本ユニセフ協会）","https://prtimes.jp/main/html/rd/p/000002802.000005176.html"],["インドネシアの無償給食で生徒607人が下痢 鶏肉料理を疑う","インドネシア中部ジャワ州プルウォレジョ県ピトゥルの2校で、政府の無償栄養給食（MBG）を食べた生徒607人が集団で下痢などを訴えた。内訳は高校が426人、中学校が181人。給食の調理施設は配送を止め、保健当局が食品と水の検体を採って検査している。鶏肉の漬け込みから2回目の調理までの時間が長かったことが疑われており、当局は正式な検査結果を待っている。県知事も現地に向かった。","\n【概要】インドネシアのニュースサイトKoranjuri.comによると、中部ジャワ州プルウォレジョ県ピトゥル郡の2校で、政府の無償栄養給食プログラム「MBG（Makan Bergizi Gratis）」の食事をとった生徒607人が集団で下痢を訴えた。影響を受けたのはSMAN 10プルウォレジョの426人と、SMPN 40プルウォレジョの181人である。\n【背景】給食は11月16日（月）に出された。県の事務局長スラント氏は17日に報告を確認し、県知事が現地に向かっていると述べた。調理施設の責任者バングン・クンチョロ氏によると、腹痛や下痢などの症状は火曜日の早朝から出始め、学校の担当者からWhatsAppで連絡を受けて把握したという。\n【詳細】献立は白米、ほうれん草、テンペ、インゲンとキャベツの炒め物、オレンジなどで、鶏肉料理が原因として疑われている。鶏肉は月曜の夜22時から23時半にしょうゆ味の調味料に漬け込まれ、火曜の2時から5時半と6時半から9時半の2回に分けて調理された。漬け込みから2回目の調理までの時間が長かったことが調べられており、2回目の分が疑われている。調理施設は当面すべての配送を止め、県の保健局と地域の保健センターが食品と水の検体を採って検査に回した。国家栄養庁のチームなども調査に入っている。プルウォレジョのSPPI調整役ワフユ・クルニアワン氏も、これらのデータを確認した。テンペは年長の生徒向けにはバラド風、年少の生徒向けにはトマト味で味付けされていた。\n【ポイント・注意点】記事は、保健当局と連携した衛生検査のやり直し、調理施設の徹底した清掃と消毒、ボランティアや職員の働きぶりの点検、衛生や配食の手順の強化を求めている。当局は生徒の回復を見守りながら、原因を確かめるための正式な検査結果を待っている。原因は、検査の結果が出るまでは確定していない。多くの子どもの食事を一度に作る給食では、仕込みから調理、提供までの時間の管理が安全に直結することを示す事例といえる。","2026-11-18","Koranjuri.com","https://koranjuri.com/607-siswa-keracunan-mbg-di-pituruh-purworejo-diduga-dari-olahan-daging-ayam/"],["インド南部で生徒62人が吐き気や息苦しさ 隣接工場の汚染か","インド南部ケララ州コラム県コッティヤムの私立学校で11月18日、生徒62人が吐き気や息苦しさ、気分の悪さを訴えて病院に運ばれた。警察は学校の隣にあるタール混合工場からの汚染が原因の可能性があるとみている。工場は住民の苦情で一度閉鎖されたが、高等裁判所の判断で再開していた。生徒は約8台の救急車で近くの病院に運ばれたが、子どもたちの容体は安定しており、工場は再び閉鎖された。","\n【概要】インドのニュースサイトThe FederalがPTI通信の記事として伝えたところによると、南部ケララ州コラム県コッティヤムの私立学校で11月18日（水）、生徒62人が吐き気や呼吸の苦しさ、気分の悪さを訴えて病院に運ばれた。警察は、学校の隣にあるタール混合工場からの汚染が原因になった可能性があるとしている。\n【背景】このタール混合工場は、住民から汚染についての苦情が出たことで、以前に閉鎖されていた。地元の自治体であるパンチャーヤトは、工場に対して操業停止の通知を出していた。しかし工場の経営側の申し立てを受け、高等裁判所が操業の差し止めを解除したため、工場は再開していた。住民は、生徒の体調不良は工場が操業を再開してから始まったと訴えている。\n【詳細】体調を崩したのは、後期中等教育の最終学年にあたる「プラス・ツー」までの各学年の生徒たちだった。生徒は約8台の救急車で近くの病院に運ばれた。警察の幹部は、重い健康上の問題が出た子どもはいないとし、「現時点で子どもたちは全員安定している」と話した。今回の事態を受けて、工場は再び閉鎖された。警察とパンチャーヤトの当局が対応に乗り出している。記事は、健康面での具体的な助言には触れていない。\n【ポイント・注意点】今回の件は、学校のすぐ隣で操業する施設の影響で、多くの子どもが同時に体調を崩した可能性がある事例だ。住民の苦情でいったん止まった工場が再開した後に症状が出たと住民は訴えており、原因の特定と再発防止が今後の焦点になる。吐き気や息苦しさなどの症状が複数の子どもに一斉に出たときは、校舎の外の環境も含めて原因を疑い、すぐに医療機関につなぐことが大切だといえる。工場をめぐっては、住民の苦情、自治体による操業停止の通知、裁判所による差し止めの解除という経過をたどってきた。学校の隣という場所で再開していた点も含め、警察と自治体がどのように調べを進めるかが注目される。警察によれば、重い症状の子どもがいなかったことは幸いだった。今後、原因の特定と再発の防止が求められる。","2026-11-18","The Federal（PTI）","https://thefederal.com/category/states/south/keralam/keralam-62-students-hospitalised-nausea-tar-mixing-unit-reopens-263335"],["米NY州 子どもへのeバイクの贈り物控えて 小児病院で急増","米ニューヨーク州の当局者と医師は11月17日、バッファローで会見を開き、子どもにeバイクや電動キックボードを年末の贈り物として与えないよう呼びかけた。同州では16歳未満は法律で乗れない。地元の小児病院の受診は2024年の10件から昨年は45件、今年は11月12日時点で151件に増えた。急な加速で事故を起こした14歳の少女2人の体験も紹介された。州は保護者への周知を進める。","\n【概要】米国のWXXI Newsによると、ニューヨーク州の当局者と医師は11月17日、バッファローのエリー郡医療センター（ECMC）で会見を開き、保護者に対して子どもへの年末の贈り物にeバイクや電動キックボードを選ばないよう呼びかけた。同州では16歳未満の子どもは、eバイクや電動キックボードに法律で乗ることができない。\n【背景】これらの乗り物は人気が高まり、エリー郡では衝突による負傷や死亡も増えている。チークトワーガに住む14歳の少女2人は6月、兄のeバイクに乗った際、急な加速に対応できずガードレールに衝突した。1人はひじを骨折し、もう1人は肝臓の裂傷と内臓の打撲を負った。2人とも法律違反だとは知らなかったという。少女の1人は「自分たちには乗れると思っていたが、危険には気づいていなかった」と振り返り、学年の男子の多くがeバイクを好み、警察に注意されても乗り続けていると話した。もう1人は、自分の傷あとを同級生に見せたいと話した。\n【詳細】ECMCの外科部長ジェフリー・ブルワー医師によると、外傷チームは昨年、約78件のeバイクによるけがを治療し、今年は8月までにその数を超えた。バッファローのゴリサーノ小児病院では、2024年に10件、昨年45件だったのが、今年は11月12日時点で151件に達した。頭のけが、骨折、顔のけがなどがあり、手術や小児集中治療室での長い治療が必要な例もあった。ブルワー医師は、体力のある人がこぐ自転車は時速約15マイル、初心者は8〜10マイルなのに対し、多くのeバイクは約28マイルに達すると説明した。車体が重く、事故の多くは車が絡み、ヘルメットをかぶっていない場合も多いという。\n【ポイント・注意点】州の自動車局長官代行は、eバイクは「おもちゃではない」と述べ、車の運転と同じような責任が必要だと強調した。多くの保護者がこの決まりを知らないため、周知を進めているという。自転車の推進団体は、ふつうのペダル式の自転車を選び、子どもに交通ルールを教えるよう勧めている。","2026-11-17","WXXI News","https://www.wxxinews.org/2026-11-17/state-officials-and-medical-experts-warn-parents-to-keep-e-bikes-off-the-kids-holiday-gift-list"],["はしか拡大の米国 生後6か月からの早期接種の安全性を報告","米ミネソタ大学の感染症研究政策センター（CIDRAP）のワクチン・インテグリティ・プロジェクトは、生後6か月の乳児でもMMRワクチンを安全に接種できるとする報告をまとめた。米国では今年5,400件超のはしか症例と10件の関連死が出ている。有効性は9か月未満の接種で58％、9〜11か月で83％で、早い接種で副反応が増える証拠はなかった。旅行を控えた家庭に医師への相談を勧めている。","\n【概要】医療ニュースサイトMedical Xpressによると、米ミネソタ大学の感染症研究政策センター（CIDRAP）の「ワクチン・インテグリティ・プロジェクト」は、生後6か月の乳児でも麻疹・おたふくかぜ・風疹（MMR）ワクチンを安全に接種できるとする報告を公表した。全米ではしかが再び広がるなか、年末の旅行シーズンを前にした発表となった。\n【背景】米国では今年、45州で5,400件を超えるはしかの症例と10件の関連死が記録されている。汎米州保健機関は、26年以上続いた米国のはしか排除の認定を取り消した。通常のMMR接種は生後12〜15か月に始まるが、海外に渡航する生後6〜11か月の乳児や、流行地域に住む・訪れる乳児には、長年「ゼロ回目」の早期接種が勧められてきた。母親から受け継いだ抗体は生後数か月で弱まり、赤ちゃんは守られにくくなる。\n【詳細】報告によると、MMRの有効性は生後9か月未満の接種で58％、9〜11か月では83％だった。早期接種で副反応のリスクが高まる証拠はなかった。デンマークの乳児6,540人を対象にした無作為化試験では、生後5〜7か月での接種による副反応はプラセボと変わらなかった。15件の安全性研究を見直した結果でも、9か月より前に接種した乳児と後で接種した乳児で副反応のリスクに差はなかった。一方、記事は米疾病対策センター（CDC）が今回の流行についてほとんど情報を発信していないと批判している。ペンシルベニア州では、はしかによる死亡が7人に達している。\n【ポイント・注意点】12か月より前の接種で得た免疫は長続きしない可能性があり、ゼロ回目を受けた乳児も12〜15か月から通常の2回接種が必要だ。MMRは発熱を起こすことがあり、一部の子どもで熱性けいれんとの関連が指摘されているが、共著者はそのリスクはごく低く、6〜11か月児で高くなることもないとしている。海外や流行地域に行く予定がある生後6〜11か月の乳児の保護者は、かかりつけ医にゼロ回目の接種について相談するよう勧めている。","2026-11-17","Medical Xpress","https://medicalxpress.com/news/2026-11-measles-cases-mount-highlights-safety.html"],["カンガルーケアで新生児の死亡と院内感染が減少 コクラン解析","低出生体重児や早産児7,724人を含む49件の無作為化比較試験を分析したコクランの最新のレビューで、早期から長時間にわたって肌と肌を触れ合わせるカンガルーケアが、通常の新生児ケアに比べて入院中の死亡を減らす可能性が高いことが示された。院内感染や敗血症のリスクも下がった。WHOは1日8時間以上を勧めているが、どのくらいの時間行うのが最適なのかは、まだ分かっていない。","\n【概要】医療ニュースサイトNews-Medicalによると、コクランは低出生体重児や早産児を対象にしたカンガルーケアのレビューを更新した。49件の無作為化比較試験、7,724人の新生児を分析し、カンガルーケアは通常の新生児ケアに比べて入院中の死亡を減らす可能性が高いと結論づけた。\n【背景】カンガルーケアは、赤ちゃんを養育者の胸の上で早くから、続けて長い時間、肌と肌を触れ合わせる方法だ。頻繁で母乳だけの授乳や、適切な場合の早期退院も含まれる。資源の限られた地域で費用のかからない方法として始まり、世界中に広がった。今回は2016年版の2倍を超える研究を含んでおり、2016年版は世界保健機関（WHO）の指針の根拠になっていた。\n【詳細】レビューでは、カンガルーケアによって院内感染や敗血症のリスクが下がった。母乳だけで育てる割合が増え、低体温の発生が減る可能性もある。死亡の減少はどの環境でも見られたが、高所得の環境では確実性が低く、根拠の多くは低・中所得国から得られている。WHOは現在、1日少なくとも8時間、可能な限り長く肌を触れ合わせることを勧めている。ただ、時間を長くすればさらに効果があるのか、どの程度が最適なのかを判断する根拠は十分ではない。死亡率がすでにとても低い高度な新生児集中治療室にどう当てはまるかも分かっていない。\n【ポイント・注意点】筆頭著者のエマ・オルソン博士は、今回のレビューにより、特に弱い立場の新生児の死亡が減るという根拠が強まったと話す。共著者のロジャー・ソル博士は、どれだけ行えば十分か、多いほどよいのかはまだ不明だとし、病院が新生児ケアの組み立てを見直す必要があることも多いとした。毎日長時間行うのはすべての家族にとって現実的ではないとも指摘されている。著者らは、親と赤ちゃんが一緒にいられる仕組みの一部として考えるべきだとしている。今後の研究では、どのような場合に最もよく効くのか、どの赤ちゃんが最も恩恵を受けるのか、開始の時期や時間の長さが結果にどう影響するのかを調べる必要があるという。","2026-11-17","News-Medical","https://www.news-medical.net/news/20261117/Kangaroo-care-reduces-newborn-mortality-and-serious-hospital-infections.aspx"],["子どもへの毎日の鉄剤で貧血リスク減 よくある病気は増えず","米コーネル大学が主導したコクランの系統的レビューで、子どもが毎日鉄剤を飲むと鉄欠乏性貧血が減る可能性が高く、せきや発熱などのよくある病気は増えないことが分かった。乳児から思春期まで5万人超を含む114件の研究を分析し、その多くはアジアで行われた。研究者は、すべての子どもに鉄剤が必要という意味ではないとして、飲み始める前に医療の専門家に相談するよう求めている。","\n【概要】医療ニュースサイトNews-Medicalによると、米コーネル大学の精密栄養・健康センターが主導したコクランの系統的レビューで、子どもが毎日鉄剤を飲むと鉄欠乏性貧血が減る可能性が高いことが分かった。せきや発熱、呼吸器の病気といったよくある病気が増えることはなかった。\n【背景】鉄欠乏は世界の子どもで最も多い栄養の問題の一つで、放っておくと鉄欠乏性貧血につながる。貧血は世界で推計8億7,400万人の子どもと女性に影響しており、2019年には5歳未満の子どもの40％が貧血で、その約半数は鉄欠乏が原因だった。WHOの指針は2016年に更新されたのが最後で、長期的な影響については根拠が足りないとされていた。貧血を減らすことは、2030年に向けた女性・子ども・思春期の健康に関する世界戦略の目標にもなっている。\n【詳細】レビューは、乳児から思春期まで5万人を超える子どもを対象にした114件の研究を分析した。多くはアジアで行われ、5歳未満の子どもを中心にしている。鉄剤だけを飲む場合は、プラセボや何もしない場合に比べて鉄欠乏性貧血を減らす可能性が高かった。鉄と葉酸の組み合わせも同様だったが、根拠は1件の研究だけだった。鉄剤だけでは身長や体重への影響はなかった。副作用では便の色の変化が多く見られた。鉄剤だけで嘔吐や下痢が増えることはほとんどないとみられるが、便秘への影響は非常に不確かだという。鉄と他の微量栄養素の組み合わせでは嘔吐が増える可能性が高い。副作用の多くは軽かったが、その根拠は不確かだとしている。\n【ポイント・注意点】筆頭著者のクリパ・ラジャゴパラン博士は「毎日の鉄剤は本来の役割を果たしている」と述べた。共著者のジュリア・フィンケルスタイン博士は、鉄欠乏が懸念される場面では使い続けることを支持するデータだとした。ただし研究者は、すべての子どもに毎日の鉄剤が必要だという意味ではないと強調する。一人ひとりの必要性、地域の鉄欠乏の多さ、製品の成分を考えて判断すべきだとし、飲み始める前に医療の専門家に相談するよう勧めている。","2026-11-17","News-Medical","https://www.news-medical.net/news/20261117/Daily-iron-supplements-reduce-anemia-risk-in-children-without-increasing-common-illnesses.aspx"],["幼児期のプラスチック由来化学物質と肝臓 韓国で126人を追跡","韓国の国立がんセンターなどの研究チームは、幼児期に尿から測ったビスフェノールAとフタル酸エステル類の量と、10〜15歳時の肝臓の数値との関係を調べた。126人を追跡した結果、化学物質全体と肝酵素の関連は統計的に有意ではなかったが、3〜5歳の時期には一部の数値が上がる傾向が見られ、男児と女児で傾向が異なる結果も出た。研究チームは、より大規模な研究が必要だとしている。","\n【概要】医療ニュースサイトNews-Medicalによると、韓国の国立がんセンター、梨花女子大学、中央大学などの研究チームは、幼い時期に体に取り込んだ化学物質と、その後の肝臓の健康との関係を調べた研究を科学誌Scientific Reportsに発表した。対象は、プラスチックに使われるビスフェノールA（BPA）と、可塑剤として日用品にも使われるフタル酸エステル類である。\n【背景】子どもは食品の容器やおもちゃ、シャンプー、ローションなどを通じて、ホルモンの働きを乱す化学物質に触れている。子どもは体重あたりで大人より多く食べ、多くの空気を吸うため、影響を受けやすい可能性がある。実験では、これらの物質が酸化ストレスや炎症、脂肪の調節の変化を通じて肝臓の代謝に影響することが示唆されている。\n【詳細】研究では、ソウルの出生コホートの子ども126人（男児62人、女児64人）を対象に、3〜5歳と7〜9歳の時点で尿中のBPAと9種類のフタル酸代謝物を測った。10〜15歳の時点で、肝臓の数値であるAST、ALT、γ-GTPを調べた。その結果、化学物質の混合物全体と肝酵素の関連は統計的に有意ではなかった。3〜5歳の時期には、ばく露が多いほどASTなどが上がる傾向があり、男児ではASTが上がり、女児では下がる傾向が見られた。男児の肝酵素は女児より高かったが、健康な子どもの範囲内だった。7〜9歳の時点ではフタル酸の濃度は3〜5歳より低く、BPAは変わらなかった。この時期も、ばく露が多いほど肝酵素は全体に上がる傾向があったが、有意ではなかった。分子量の小さいフタル酸、特にMiBPがASTへの影響の大きい物質として挙がった。\n【ポイント・注意点】この研究は、因果関係や肝臓の損傷を示したものではない。対象の人数が少ないこと、尿の検体が1回ずつであること、地域が限られることなどの限界があり、一部の結果は偶然の可能性もある。研究チームは、繰り返し測定する大規模な研究が必要だとしている。記事は個人向けの助言は示していない。","2026-11-17","News-Medical","https://www.news-medical.net/news/20261117/From-plastic-toys-to-shampoo-Could-everyday-chemicals-influence-childrens-liver-health.aspx"],["日本AED財団 学校の緊急事態に備える訓練マニュアルを公開","公益財団法人日本AED財団は、学校や幼稚園で子どもが倒れた場面を想定し、教職員が役割を分けて連携する訓練のための「学校緊急事案想定訓練マニュアル」を公開した。心肺蘇生やAEDの手配、119番通報、救急隊の誘導などを同時に進める練習ができ、特別な資器材や専門知識がなくても始められる。役割ごとの振り返りシートも用意し、改善につなげられる。財団は約1年後をめどに改訂を検討する。","\n【概要】公益財団法人日本AED財団は11月17日、学校（幼稚園などを含む）の緊急時の対応力を高めるための「学校緊急事案想定訓練マニュアル」を作成し、公開したと発表した。マニュアルは11月13日に財団のウェブサイトで公開された。「すぐに、だれもが、みんなで」を掲げ、子どもの命を守る学校づくりを支援する。\n【背景】学校では心肺蘇生法やAEDの使い方を学ぶ機会はある。しかし、子どもが倒れた場面を想定し、教職員が役割を分担して組織として連携する訓練は、十分に行われていない学校もある。実際の緊急時には、心肺蘇生やAEDによる救命処置、119番通報、AEDの手配、救急隊の誘導、ほかの子どもの安全確保など、いくつもの対応を同時に進める必要がある。\n【詳細】マニュアルの特長は3つある。1つ目は、特別な訓練用の資器材や専門知識がなくても始められる構成になっていることだ。2つ目は、心肺蘇生、AEDの手配、119番通報、救急隊の誘導、周りの安全確保を想定し、役割分担と同時進行の連携を訓練できることだ。3つ目は、役割ごとの振り返りシートで「できたこと」「改善したいこと」を共有し、次の訓練や体制の改善につなげられることである。財団は、実際に活用した学校や園から意見や感想を募り、約1年後をめどに改訂を検討するとしている。\n【ポイント・注意点】日本AED財団は2016年7月に設立され、AEDの普及や教育、訓練を通じて、心臓突然死から一人でも多くの市民を救うことを目指している。子どもが倒れたときは、救命処置と通報、AEDの手配などを同時に進めなければならない。学校や園は、日ごろから役割を決めて実際に動いてみる訓練を重ね、振り返りを次に生かすことが大切だ。マニュアルは特別な資器材がなくても始められる構成のため、まずは短い時間でも、子どもが倒れた場面を想定して教職員が役割を確かめ合うところから取り組める。財団は活用した学校や園からの意見を募っており、現場の気づきを伝えることが、よりよい改訂にも生かされることになる。","2026-11-17","PR TIMES（日本AED財団）","https://prtimes.jp/main/html/rd/p/000000077.000067895.html"],["米国がはしか排除国でなくなる 保護者が知っておきたいこと","米ABCニュースは、米国がはしかの排除国の認定を失ったことを受け、保護者向けに症状や予防のポイントをまとめた。CDCによると今年は45州とワシントンDCで5,400件を超える症例が出ている。感染者1人がワクチン未接種の人を最大18人感染させる可能性があり、ウイルスは感染者が部屋を出た後も最大2時間空気中に残る。最善の予防はMMRワクチンで、1回目は生後12か月から受けられる。","\n【概要】米ABCニュースは11月17日、汎米州保健機関（PAHO）が米国はもうはしか排除の状態にないと宣言したことを受け、保護者が知っておくべき点をまとめた記事を配信した。米疾病対策センター（CDC）のエリカ・シュワルツ所長は「排除の認定が米国民を守るのではない。守るのはワクチンだ」とする声明を出した。\n【背景】排除の認定は、同じ型のはしかウイルスが12か月以上続けて広がっていないことが条件で、米国は2000年に認定を得ていた。CDCによると、今年はこれまでに45州とワシントンDCで5,400件を超える症例が出ている。2025年の確定症例は2,289件だった。CDCは、米国が排除の認定を取り戻せるよう取り組むとしている。\n【詳細】ストーニーブルック小児病院のアンドリュー・ハンデル医師は、感染者1人がワクチン未接種の人を最大18人感染させうると推定する。ウイルスはせきや息で空気中に広がり、感染者が部屋を出た後も最大2時間とどまることがある。初期の症状はせき、鼻水、赤く涙の出る目、華氏104度（約40度）を超えることもある高熱で、ほかの呼吸器の感染症と似ている。発疹の数日前に頬の内側に白っぽい斑点が出ることがあり、発疹はふつう髪の生え際から下へ広がる。症状は感染から7〜14日後に出る。合併症は短期間で治まるものから命に関わるものまであり、下痢や中耳炎のほか、重い肺炎、脱水、けいれん、脳の感染症、髄膜炎がある。1歳になる前に感染した子どもの一部は、最大10年後に死に至ることもある神経の病気、亜急性硬化性全脳炎（SSPE）を発症することがある。\n【ポイント・注意点】CDCによると最善の予防はMMRワクチンで、1回目は生後12か月、2回目は4〜6歳で受けられる。ハンデル医師はワクチンが安全で効果的だとし、流行を止める最も大切な手段だと話す。がんの子どもや妊娠中の人、免疫が弱い人など接種できない人もいるため、心配があれば医療者に相談するよう勧めている。接種できる年齢の子どもは、時期を逃さずに受けることが大切だ。","2026-11-17","ABC News","https://abcnews.com/GMA/Wellness/parents-measles-outbreaks-spread-us/story?id=137914050"],["台湾CDCが米国全土にはしかの渡航警戒 乳児は早期接種を相談","台湾の疾病管制署（CDC）は11月17日、米国ではしかの症例と関連死が増えていることを受け、米国全土への渡航の健康警示をレベル2「警戒」に引き上げた。妊婦と1歳未満の乳児には流行地域を避けるよう勧め、海外に行く必要がある生後6か月から1歳未満の乳児は、MMRワクチンの早期接種について医師に相談するよう呼びかけた。台湾の幼い子どものMMR接種率は97％を超えている。","\n【概要】台湾の中央通信社の英語ニュースFocus Taiwanによると、台湾の疾病管制署（CDC）は11月17日、米国全土に対する渡航の健康警示をレベル2の「警戒」に引き上げた。米国ではしかの症例と関連の死亡が増えていることが理由である。州ごとに警示を出すのではなく、全土を一括でレベル2とした。\n【背景】米CDCのデータによると、米国では今年5,000件を超えるはしかの症例が報告され、35年で最も多い。11月に入ってからは、ペンシルベニア、ニューヨーク、ウィスコンシンの各州ではしかに関連した死亡が報告された。当局はこれらの流行に関連はないとみている。流行は17州で報告されている。台湾CDCは渡航警示を3か月ごとに見直しており、16日の検討を経て今回の判断に至った。\n【詳細】報道官の林明誠氏は記者会見で、米国の流行は2025年3月以降悪化し、最近は症例が急に増えていると説明した。レベル2の警示のもとでは、妊婦と1歳未満の乳児は、はしかが流行している地域を避けるよう勧められる。どうしても海外に行かなければならない生後6か月から1歳未満の乳児については、麻疹・おたふくかぜ・風疹（MMR）ワクチンを早めに接種すべきかどうかを医師に相談するよう求めた。ワクチンはすぐに効くわけではなく、免疫ができるまでに少なくとも数週間かかるため、出発までに十分な時間をとる必要がある。\n【ポイント・注意点】林氏は、台湾は接種率が高く防疫の対策もあるため、米国の流行が台湾で大きく広がるリスクは比較的低いとした。幼い子ども向けの2回のMMR定期接種の接種率は一貫して97％を超えている。レベル2は国内で流行が起きる危険が高いという意味ではなく、米国へ行く人に出発前の接種歴や免疫の確認と予防策を促すためのものだという。ワクチンは接種してすぐに効くわけではないため、乳児を連れて米国へ行く予定がある家庭は、早めに医師に相談し、出発までに免疫ができる時間を確保することが大切だ。妊娠中の人も、流行地域を避けるよう求められている。","2026-11-17","Focus Taiwan","https://focustaiwan.tw/society/202611170021"],["背を伸ばす目的でがん治療薬 ネットで話題、専門家が危険を警告","一部の膀胱がんに承認され、小児の脳腫瘍で試験的に使われるがん治療薬エルダフィチニブが、子どもの急な身長の伸びと結びつけられ、ネット上で背を伸ばす手段として話題になっている。治療中の15歳男子が約9か月で14.3cm伸びた一方、背骨の変形で手術が必要になった例もある。専門家は、健康な10代が背を伸ばすために使うのは危険だと警告している。TikTokは一部の宣伝アカウントを禁止した。","\n【概要】医療ニュースサイトMedical Xpressは、The Conversationに載ったジャスティン・ステビング氏の解説記事を掲載した。がん治療薬エルダフィチニブが、ネット上で背を伸ばす方法としてもてはやされている現状を取り上げ、その危険を説明している。TikTokは、この薬を宣伝する一部のアカウントを禁止した。実際にどれだけの人が使っているかは分かっていない。\n【背景】エルダフィチニブは、一部の進行した膀胱がんに承認された分子標的薬で、小児の一部の脳腫瘍にも試験的に使われている。脳腫瘍の治療を受けた子どもで急な身長の伸びが見られたことから、身長を伸ばそうとするネット上の動き「ハイトマキシング」の関心を集めた。この薬は、細胞の成長などを調整する受容体（FGFR）の働きを抑える。骨の成長にブレーキをかけるFGFR3を抑えることで、成長が進む可能性がある。\n【詳細】ウィーンの研究者は、この薬を使った脳腫瘍の子ども2人で、異常に速く背が伸びた例を報告した。成長ホルモンや思春期によるものではなかったとみられる。15歳の男子は約9か月で14.3cm伸びたが、背骨の変形など深刻な骨格の異常が起き、矯正の手術が必要になった。骨や筋肉、靭帯、関節は一緒に発達する必要があり、一部だけを速めると変形や背骨の異常な曲がりにつながるおそれがある。薬は血中のリン酸を上げて組織に異常な沈着を起こしたり、視力を脅かす目の問題を起こしたりすることもある。\n【ポイント・注意点】報告は、ほかの治療も受けている重い病気の子どもごく少数に関するもので、健康な10代が安全に最終的な身長を伸ばせるかは示していない。思春期の後には成長板が閉じるため、大人の身長を伸ばせるという信頼できる根拠もない。筆者は、骨が速く伸びることがよい骨の成長とは限らないとし、永続的な骨の損傷や目の障害のリスクは、得られるかもしれない利益をはるかに上回ると警告している。筆者は、この流行の背景に、特に若い男性の間で見た目を「最適化」しようとする動きがあると指摘している。","2026-11-16","Medical Xpress","https://medicalxpress.com/news/2026-11-cancer-drug-touted-online-taller.html"],["妊娠中のワクチンで早産や死産のリスク低下 豪州1.9万人調査","豪アデレード大学などの研究チームは、2020〜2023年に出産した妊婦約1万9,000人を調べ、妊娠中のインフルエンザや百日せきのワクチン接種で早産のリスクが下がることを示した。百日せきの接種は死産のリスクのほぼ50％の低下と関連していた。母親が接種した赤ちゃんは蘇生や早い時期の敗血症が少なく、出生体重も重かった。3種類とも、接種による合併症の増加は見られなかった。","\n【概要】医療ニュースサイトNews-Medicalによると、オーストラリアのアデレード大学と女性・子ども保健ネットワークの研究チームは、妊娠中のワクチン接種が母親だけでなく赤ちゃんも守ることを示す研究結果を発表した。調べた3種類のワクチンのいずれも、合併症の増加とは関連していなかった。\n【背景】研究では、2020〜2023年にアデレードの女性・子ども病院で出産した妊婦約1万9,000人を対象にした。妊娠中の接種率は、インフルエンザが64％、百日せきが74％、新型コロナが29.5％だった。妊娠中の予防接種が赤ちゃんにどのような影響を与えるかを、出産の記録をもとに調べた。\n【詳細】インフルエンザの接種を受けた妊婦では早産のリスクが13％、百日せきの接種では17％低かった。新型コロナの接種でも同じような利点が見られた。百日せきの接種は、死産のリスクがほぼ50％低いことと関連していた。接種を受けた母親から生まれた赤ちゃんは、生まれた直後の蘇生や、早い時期に起きる敗血症が少なかった。出生体重は90〜180グラム重く、生まれる時期も数日遅かった。研究には、筆頭著者のハッセン・モハメッド博士、プラバ・アンドラウィーラ博士、ヘレン・マーシャル教授が関わった。\n【ポイント・注意点】マーシャル教授は、妊娠中の予防接種は、百日せき、インフルエンザ、RSウイルスによる新生児の死亡を含む深刻な結果を防ぐ最も効果的な方法の一つだと述べている。今回の結果は、母親の接種が生まれてくる赤ちゃんの守りにもつながることを示している。妊娠中の人は、接種の時期や種類について主治医とよく相談することが大切だ。百日せきの接種で死産のリスクがほぼ半分になったという結果は、特に注目される。一方、接種率はインフルエンザと百日せきで6〜7割に達していたが、新型コロナは約3割にとどまっていた。接種による合併症の増加がなかったという結果は、接種を迷う妊婦にとって判断の材料の一つになる。なお、記事では研究が掲載された学術誌の名前は示されていない。","2026-11-16","News-Medical","https://www.news-medical.net/news/20261116/Vaccines-protect-more-than-mums-to-be-study-shows.aspx"],["香港でインフル 子どもの死亡が今季3人目 1歳2か月の女児","香港の衛生防護センターは、インフルエンザA型に感染した生後14か月の女児が11月13日に死亡したと発表した。今シーズン3人目の子どもの死亡となる。女児に持病はなく、インフルエンザのワクチンを受けていなかった。今季の子どもの重症例は29件にのぼり、生後6か月から5歳の接種率は27.5％にとどまる。昨年のデータでは、未接種の子どもは重い合併症や死亡のリスクが接種した子どもの約5倍だった。","\n【概要】Kantan.Newsによると、香港の衛生防護センター（CHP）は、インフルエンザA型に感染した生後14か月の女児が11月13日に死亡したと発表した。今シーズンの子どもの死亡は3人目となる。今季の流行は6月下旬に始まって4か月以上続いており、ここ数週間は下向きだが、まだ基準の水準を上回っている。\n【背景】女児にはこれまで知られた持病はなかった。10月26日に発熱とせきが始まり、27日にけいれんを起こした。将軍澳病院に入院した後、容体が急に悪化したため、観塘の基督教聯合医院の小児集中治療室に移された。検査でインフルエンザA型と確認され、急性壊死性脳症という重い脳の合併症と多臓器不全を起こした。インフルエンザのワクチンは受けておらず、集中治療を受けたものの3週間足らずで亡くなった。\n【詳細】CHPは今季、子どものインフルエンザの重症例を29件記録している。22人は回復して退院し、2人は安定、2人は重篤で、3人が死亡した。最初の死亡は8月で、2人目は10月19日にインフルエンザA型に関連した敗血症性ショックで亡くなった12歳の女児だった。CHPの徐德義所長は、リスクの高い人たちへのワクチン接種の重要性を強調した。昨年のデータでは、ワクチンを受けていない子どもは、受けた子どもに比べて重い合併症や死亡のリスクが約5倍だった。\n【ポイント・注意点】10月25日時点で、生後6か月から5歳の子どもの接種率は27.5％にとどまり、学齢期の子どもの接種率も前のシーズンより下がった。今回の女児は持病がなかったにもかかわらず、発熱の翌日にけいれんを起こし、脳症へと急速に悪化した。幼い子どもでもインフルエンザが命に関わる場合があることを示しており、香港の当局は予防の柱としてワクチン接種を勧めている。2人目に亡くなったのは12歳の女児で、乳幼児だけでなく学齢期の子どもでも命に関わる例が出ている。子どもの接種率が伸び悩むなか、接種をどう広げるかが課題となっている。CHPは、ここ数週間の流行は下向きでも、まだ基準を上回っているとしている。","2026-11-14","Kantan.News","https://kantan.news/news/third-child-dies-during-flu-season-in-hong-kong-death-toll-reaches-29"],["交差点で自転車の8歳男児が死亡 両親「守ってあげられなかった」","福岡県朝倉市で1月、自転車で友人宅に向かっていた小学2年の男児2人が、徐行せずに交差点に入った車にはねられ、1人が亡くなった。運転していた被告に有罪判決が言い渡されたのに合わせ、両親が取材に応じた。男児はふだんヘルメットをかぶっていたが、事故の日はかぶっていなかった。父親は子ども向けに自転車の安全を呼びかける活動に参加している。現場の法定速度は時速30キロに下げられた。","\n【概要】読売新聞オンラインによると、福岡県朝倉市で1月に起きた交通事故で8歳の息子を亡くした両親（ともに41歳）が、運転していた被告に有罪判決が言い渡されたのに合わせて取材に応じた。母親は「守ってあげられなかった」と話した。事故では一緒にいた同級生も重いけがを負っており、見通しの悪い交差点での車の運転と、子どもの自転車の安全のあり方があらためて問われている。\n【背景】事故は1月19日午後3時50分ごろ、朝倉市の市道の交差点で起きた。車が徐行せずに交差点に入り、自転車で友人の家へ向かっていた小学2年の男児2人を出合い頭にはねた。当時8歳の男児は頭を強く打って亡くなり、もう1人は骨折などの重いけがをした。被告には11月12日に有罪判決が言い渡された。\n【詳細】亡くなった男児は4人きょうだいの3番目で、自転車のレースで優勝したこともあった。ふだんはヘルメットをかぶっていたが、事故の日はかぶっていなかった。警察から返ってきた自転車は大きくひしゃげ、リュックについた血は何度洗っても落ちなかったという。事故が家族に残した傷の深さがうかがえる。現場は中央線がなく見通しの悪い交差点で、事故の後に「交差点注意」などの路面表示が整えられた。9月には法定速度が時速40キロから30キロに下げられた。\n【ポイント・注意点】父親はその後、子ども向けに自転車の安全運転とヘルメットの着用を呼びかけるイベントにボランティアとして参加している。「ヘルメットを着けていない大人が大多数」だとして、まず大人がルールを守る姿を子どもに見せたいと話し、車と自転車が譲り合う社会を望んでいる。見通しの悪い交差点では車が徐行することはもちろん、自転車に乗る子どもにも、交差点の手前で止まって左右を確かめることや、毎回ヘルメットをかぶる習慣を身につけさせることが大切だ。今回の現場では、事故の後に路面表示が整えられ、法定速度も下げられた。通学路や遊びに行く道に同じような見通しの悪い交差点がないか、親子で一緒に歩いて確かめておくことも、事故を防ぐ助けになる。","2026-11-13","読売新聞オンライン（Yahoo!ニュース）","https://news.yahoo.co.jp/articles/458af107a167ec0e6dc5c2d6b4ae6654597591c6"],["中国でインフル流行が拡大 5〜14歳の陽性率が最も高く","中国疾病予防管理センターは、国内でインフルエンザの流行が広がり、A型のH3N2とH1N1、B型の3種類が同時に流行していると発表した。年齢別では5〜14歳の子どもの陽性率が最も高い。北部では流行はまだ低い水準だが急速に上昇しており、南部は中程度。研究者は11月から3月が流行のピークだとして、子どもなどへの早めのワクチン接種を勧め、「早く受けるほどよい」と話した。","\n【概要】中国の英字紙China Dailyによると、中国疾病予防管理センター（中国CDC）が発表した監視結果で、国内のインフルエンザの流行が広がっていることが分かった。A型のH3N2とH1N1、B型の3種類のウイルスが同時に流行しており、なかでもH1N1が占める割合が増えている。\n【背景】地域別に見ると、北部の省では流行はまだ低い水準だが、急速に上昇している。南部の省では中程度の流行となっている。11月2日から8日の週には、監視対象の病院で、呼吸器の病気の中でインフルエンザの陽性率が最も高く、ライノウイルスがそれに続いた。中国では、これから本格的な流行期を迎えることになる。\n【詳細】年齢別では、5歳から14歳の子どもの陽性率が、すべての年齢層の中で最も高かった。中国CDCの研究者である王大燕氏は記者会見で、インフルエンザなどの呼吸器感染症のピークは11月から3月までだと説明した。そのうえで、重点的に接種すべき人として、乳幼児や子ども、高齢者、慢性の病気がある人、学校や保育施設、高齢者施設、病院で働く人を挙げた。王氏は「今がインフルエンザワクチンを受ける絶好の時期で、早く受けるほどよい」と話した。記事は、患者数や症状、治療薬、学校での具体的な対策については触れていない。\n【ポイント・注意点】学齢期の子どもの陽性率が最も高いことから、学校や家庭を通じた広がりに注意が必要な状況といえる。複数の型が同時に流行していることも今季の特徴だ。専門家が示したように、子どもや乳幼児、子どもと接する学校や保育施設の職員は重点的な接種の対象とされている。流行のピークを前に、早めに接種を済ませることが勧められている。北部の省では流行がまだ低い水準ながら急速に上昇しており、H1N1の割合が増えるなど、流行するウイルスの構成も変わりつつある。子どもの陽性率が最も高い状況で、学校や保育施設で働く人も接種の重点対象に挙げられていることは、子どもを感染から守るうえで、周りの大人の予防も大切であることを示している。","2026-11-13","China Daily","https://www.chinadaily.com.cn/a/202611/13/WS6af700c7e4b03ebf8519c4e6.html"]],"dev":[["ジャンクフードが子どもの認知と心の健康に影響 豪の17研究","オーストラリアのフリンダース大学の研究チームが、同国の子どもと青年の食事パターンを扱った17研究を体系的に見直した。エネルギーが多く栄養の乏しい食品や甘い飲み物を多くとる子どもほど、心の健康や幸福感、学業成績が低い傾向があった。一方、果物や野菜、全粒穀物、魚を多くとる食事は、心の健康や認知機能、学業成績の良さと関連していた。著者らは、健康的な食品の手に入りやすさへの対策を求めている。","\n【概要】オーストラリアのフリンダース大学の研究チームが、同国の子どもと青年が何を食べているかを扱った研究を体系的に見直し、食事の傾向と心の健康、認知、学業成績との関係をまとめた。論文は「What Do Australian Children and Adolescents Eat? A Systematic Review of Dietary Patterns and Adverse Health and Cognitive Outcomes」と題し、学術誌Current Nutrition Reportsに掲載された。\n\n【背景】子どもの食事は体の健康だけでなく、脳の発達や学びにも関わると考えられている。ただし、食事の測り方は研究ごとにばらばらで、全体像がつかみにくかった。今回の筆頭著者はフリンダース大学医学・公衆衛生学部のゼゲイエ・アベベ・アビテウ博士、責任著者は栄養と公衆衛生を専門とするヨハネス・メラク准教授である。\n\n【詳細】対象は17件の研究で、西オーストラリア州の長期調査「Raine Study」の親子のデータのほか、南オーストラリア州やビクトリア州などの子どもの食事を扱った研究が含まれる。分析の結果、エネルギーが多く栄養の乏しい食品や甘い飲み物を多くとることは、心の健康や幸福感の低さ、学業成績の低さと関連していた。反対に、果物、野菜、全粒穀物、魚を多く含む健康的な食事パターンは、心の健康、認知機能、学業成績の良さと関連していた。心臓や代謝に関わる指標については、結果が一定しなかった。\n\n【ポイント・注意点】著者らは、対象を絞った食事の介入、栄養教育、健康的な食品の価格と入手しやすさへの対策を求めている。また、食事を定義し測る方法をもっと標準化する必要があるとも指摘した。今回のレビューは観察研究をまとめたもので、関連は示せても、ジャンクフードが成績や心の不調を直接引き起こすとまでは言えない。参加者の総数や効果の大きさは記事には示されていない。日本の子どもにそのまま当てはまるかも、別に確かめる必要がある。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-junk-food-affects-cognition-mental.html"],["まれな脳の病気の子に治療の道を 診断から治療開発へ一貫","カナダのマギル大学の研究チームが、まれな神経発達症の子どもに治療の道を開くための新しい枠組みを発表した。患者の血液から、その子の遺伝子変異を持つ脳の細胞を作り、病気の仕組みを調べて治療候補を試す。チームは発達の遅れや知的障害などを起こすクレーフストラ症候群の子ども1人のために、実験的なRNA治療を開発して検証した。まだ実験室の細胞での段階で、人への応用には研究が必要という。","\n【概要】カナダのマギル大学の研究チームが、まれな遺伝性の神経発達症の子どもに、より現実的な治療の道筋を示す枠組みを発表した。論文は「Integrating clinical diagnostics with interventional genetics for neurodevelopmental disorders」と題し、The American Journal of Human Geneticsに掲載された。筆頭著者は博士課程のジュリア・マッキントッシュ氏、責任著者は同大学精神医学科のカール・アーンスト教授で、研究にはCHU Sainte-Justineも加わった。\n\n【背景】まれな病気の子どもの多くは、遺伝子の変化がごく少数の患者にしか見られないため、現実的な治療の道筋がない。著者らは、遺伝子診断を検査の「終わり」ではなく、治療を検討する「出発点」にすべきだと主張している。\n\n【詳細】新しい枠組みでは、まず患者の血液から、その子の遺伝子変異を持つ脳の細胞を作る。その細胞を使って病気の仕組みを調べ、治療候補を実験室で試す。遺伝子診断から治療の開発と検証までを、ひとつの流れとして扱えるのが特徴だ。チームはこの方法で、クレーフストラ症候群の子ども1人のために実験的なRNA治療を開発し、検証した。クレーフストラ症候群は、発達の遅れ、知的障害、話すことや意思疎通の難しさを起こすことがある、まれな遺伝性の病気である。マッキントッシュ氏は「診断をもとに遺伝子に基づく治療を設計し、治療への道をより直接的にすることを目指している」と述べた。\n\n【ポイント・注意点】治療は実験室の細胞で試されただけで、人で試すにはさらに研究が必要とされている。記事は1人の患者の事例を紹介するもので、患者数や細胞での効果の数値は示されていない。著者らは、必要な技術の多くはすでにあり、主な課題はそれらを医療制度に組み込むことだとしている。アーンスト教授は、このモデルが世界中の遺伝子診断の拠点でも役立つことを期待していると話した。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-approach-aims-treatment-accessible-children.html"],["「前世を覚えている」子どもの報告、科学はどう扱うか"
