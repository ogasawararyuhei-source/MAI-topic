正すことは、将来その子が必要な薬を使えるようにすることにもつながる。","2026-11-18","Medical Xpress（The Conversation）","https://medicalxpress.com/news/2026-11-children-allergic-antibiotics-allergy.html"],["10代の不安・うつの初診が4倍に 「過剰診断」ではない 英38万人分析","英マンチェスター大学などが英国のかかりつけ医の記録を分析し、不安やうつで初めて記録された10〜18歳の割合が、2001年の1000人当たり6人から2019年には24人へと4倍に増えたと発表した。近年の若者も20年前と同じように自傷での入院などの高いリスクを抱えており、研究者は軽い悩みの増加ではなく、実際の臨床的な必要が増え続けていると指摘し、予防と対応の強化を求めている。","\n【概要】英マンチェスター大学などの研究チームは、イングランドの子どもと若者の不安やうつの初診が大きく増えていることを示す研究を、学術誌The Lancet Psychiatryに発表した（掲載予定）。研究者らは、増加は軽い悩みでの受診が増えたためではなく、本当に支援が必要な若者が増えていることを示すとしている。\n【背景】若者の心の不調の増加をめぐっては、軽い悩みまで病気として扱う「過剰な医療化」が原因ではないかという見方もある。研究チームは、長期の記録を使ってこの点を確かめた。\n【詳細】研究は、かかりつけ医の診療記録データベースCPRD（2001〜2023年）を病院の入院データと結びつけた後ろ向きの集団コホート研究で、イングランドの620万人を超える子どもと若者が含まれる。このうち、2001年から2023年に不安やうつの診断または症状が初めて記録された10〜18歳の約38万人を追跡した。10〜18歳の初診の年間の割合は、2001年の1000人当たり6人から2019年には24人へと4倍になった。近年に受診した若者も、20年前に受診した若者と同じように、自傷による入院やアルコール・薬物の問題といった深刻な結果のリスクが同年代より高かった。軽い例が増えただけなら、こうしたリスクは下がるはずだが、下がっていなかった。ほかにも、初診の年齢が下がったこと、増加の程度が裕福な地域と貧しい地域で同じだったこと、不安やうつと同時に自閉症やADHDが記録される割合がほぼ3倍になったこと、専門の精神保健サービスに紹介される確率が2倍以上になったことが分かった。抗うつ薬を処方される割合は2001〜2005年に半減し、その後は横ばいだが、処方を受けた子1人当たりの処方数は約50%増えた。\n【ポイント・注意点】著者らは、本当に臨床的な支援を必要とする若者が増えている以上、予防と対応をより良くする必要があると訴えている。子どもの気分の落ち込みや強い不安が続くときは、一時的なものと決めつけず、早めに相談することが大切になる。","2026-11-18","Medical Xpress（マンチェスター大学）","https://medicalxpress.com/news/2026-11-mental-health-crisis-children-real.html"],["知的障害のある子の重い行動問題 CBDオイルは偽薬と差なし 豪州の試験","オーストラリアの小児病院3施設で、知的障害と重い行動の問題がある6〜18歳の131人に、大麻由来成分CBD（カンナビジオール）のオイルか偽薬を毎日8週間使ってもらった二重盲検試験で、イライラなどの行動の得点の改善に差はなかった。不安や睡眠、親の育児ストレスにも上乗せの効果はなく、一時的な肝酵素の上昇はCBDで4.6%と偽薬の1.5%より多かった。成果はJAMA Pediatricsに掲載された。","\n【概要】知的障害があり、重い行動の問題を抱える子どもや10代に、大麻に含まれる成分CBD（カンナビジオール）のオイルを使っても、偽薬（プラセボ）を上回る効果はなかったとする試験結果が、学術誌JAMA Pediatricsに掲載された。ダリル・エフロン氏らによる研究で、Medical Xpressが伝えた。\n【背景】大麻にはCBDとTHC（テトラヒドロカンナビノール）が含まれる。THCは酔いをもたらし、精神病などの有害な作用を引き起こすことがある。CBDは不安を和らげたり炎症を抑えたりする可能性が言われ、この10年ほど、根拠が限られるにもかかわらず、自閉スペクトラム症の子の行動の問題にCBDを多く含む医療用大麻が使われるようになった。知的障害のある子どもや10代には、イライラ、攻撃、自傷、家から飛び出すといった重い行動の問題がよく見られる。医師は抗精神病薬や刺激薬、抗うつ薬を使うことが多いが、根拠は限られ、副作用の危険も高い。\n【詳細】試験はランダム化二重盲検で、終了まで参加者も家族も医師も、誰がどちらを使っているか知らされなかった。対象はオーストラリアの小児病院3施設で集めた6〜18歳の131人。純粋なCBDオイルか、見た目が同じ偽薬のオイルを8週間毎日使い、その前後で親がイライラ、不安、睡眠、人との関わり、育児ストレスを評価した。その結果、CBDの子の行動の得点の改善は偽薬の子を上回らなかった。イライラの平均得点はCBDで32.2から21.7へ、偽薬で30から19.2へと下がり、差は有意でなかった。不安、睡眠の乱れ、人との関わりを避けること、育児ストレスにも上乗せの効果はなかった。下痢や疲れ、嘔吐などの副作用は、CBDで63%、偽薬で61%と同じくらいだった。一時的な肝酵素の上昇はCBDで4.6%、偽薬で1.5%と多く、記事によると、抗てんかん薬のバルプロ酸ナトリウムと併用しているときに特に目立った。\n【ポイント・注意点】記事は、偽薬以上の改善がないなら、CBDが費用や危険に見合うのか疑問が生じるとし、医師が家族と、不確かな効果と薬の飲み合わせの危険をはかりにかける材料になるとしている。ほかの薬を飲んでいる子では、自己判断でCBD製品を使わず、主治医に相談することが大切だ。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-cbd-oil-behavioral-benefit-youths.html"],["はしかに感染して生まれる赤ちゃん 米国で13例 医師が警鐘","米国で、妊婦から胎児にはしかがうつる「先天性麻疹」への懸念が高まっている。米疾病対策センター（CDC）の暫定値では、2025年初めから2026年9月末までに13例が報告され、妊娠中のはしか確定例は112例で、ほぼ全員がワクチン未接種か接種歴不明だった。分娩直前に母親が感染すると赤ちゃんの25〜30%が感染しうるという。専門家は妊娠前のMMRワクチン接種を呼びかけている。","\n【概要】米国で、妊娠中の女性から胎児にはしか（麻疹）のウイルスがうつる「先天性麻疹」が報告され、医師たちが警鐘を鳴らしている。AP通信が伝えた。数字は、米疾病対策センター（CDC）の科学者らが著者となり、NEJM Evidenceに掲載された公衆衛生上の警告に基づく。\n【背景】米国では、ワクチン接種率の低下を背景にはしかの大規模な流行が続き、CDCは過去2年で7500例を超える感染を報告している。記事は、米国がはしかの排除状態を失ったと汎米保健機構が発表する見通しだとも伝えていた。\n【詳細】CDCの暫定値によると、2025年初めから2026年9月末までに13例の先天性麻疹が報告された。妊娠中のはしかの確定例は112例で、ほぼ全員がワクチン未接種か接種歴不明の女性だった。この警告は、ミネソタ大学のマイケル・オスターホルム氏が所長を務めるセンターとの協力で公表された。米国小児科学会によると、分娩の少し前に母親がはしかにかかった場合、生まれる赤ちゃんの推定25〜30%が感染する可能性がある。症状には発熱、黄疸、はしかの発疹があり、重い合併症として肺炎や脳炎、数年後に起こりうる、通常は命に関わる脳の病気SSPE（亜急性硬化性全脳炎）がある。専門家は、新生児に重い合併症や死をもたらしうると話している。流行は接種率95%で起こりにくいとされるが、多くの地域でそれを下回っている。全米で最大の流行が起きているペンシルベニア州は、先月、医療者向けの注意喚起を出した。\n【ポイント・注意点】予防の基本は妊娠前のMMRワクチン接種で、母親の抗体を通じて胎児も守られる。MMRは妊娠中には接種できない。ワクチン未接種の妊婦がはしかにさらされた場合、6日以内に抗体の製剤を投与できる。乳児の1回目の接種は通常12〜15か月で行うが、流行地では生後6か月から可能だという。妊娠を考えている人は、自分の接種歴を確かめておくことが大切だ。妊娠中の確定例のほぼ全員が未接種か接種歴不明だったことは、接種の空白が母子の危険に直結することを示している。","2026-11-17","Medical Xpress（AP通信）","https://medicalxpress.com/news/2026-11-doctors-babies-born-measles.html"],["岡山市の小中高5施設でインフル学年・学級閉鎖 児童生徒69人欠席","岡山市で11月16日、小学校・中学校・高校あわせて5施設の児童・生徒69人がインフルエンザとみられる症状で欠席した。中学校1施設は16日から、小学校3施設と高校1施設は17日から学年・学級閉鎖になる。市内の保育園から高校では9月1日以降、のべ400人がインフルエンザとみられる症状で欠席した。岡山県は9月28日から県全域に注意報を出し、マスク着用や手洗いを呼びかけている。","\n【概要】岡山市で11月16日、小学校、中学校、高校あわせて5施設で、児童・生徒69人がインフルエンザとみられる症状で欠席した。KSB瀬戸内海放送が伝えた。このうち中学校1施設は16日から、小学校3施設と高校1施設は17日から、学年閉鎖や学級閉鎖の措置をとる。\n【背景】インフルエンザは例年、冬に向けて患者が増え、学校や保育施設で集団感染が起きやすい。岡山県は9月28日から県内全域にインフルエンザ注意報を出しており、マスクの着用や手洗いなどの対策を呼びかけている。\n【詳細】記事によると、16日に欠席した69人は、いずれもインフルエンザとみられる症状によるもの。閉鎖の措置は、中学校1施設が16日から、小学校3施設と高校1施設が17日からとなる。5施設の内訳は小学校3、中学校1、高校1で、学年閉鎖と学級閉鎖を合わせたもの。69人はこの5施設での欠席者の数で、すべてが検査で確定した患者とは限らない。岡山市内の保育園、幼稚園、小中学校、高校では、9月1日から11月16日までに、のべ400人がインフルエンザとみられる症状で欠席した。この人数は、前の年の同じ時期と比べて685人少ないという。この集計は、保育園や幼稚園から高校までの幅広い年代の施設を対象にしたものだ。今季は前年より少ないものの、学校単位での閉鎖が相次いでおり、地域での流行が続いていることがうかがえる。\n【ポイント・注意点】インフルエンザの流行期には、子どもが急な発熱やせき、のどの痛み、だるさなどを訴えたら、無理に登校させず、早めに医療機関に相談することが大切になる。家庭でも、帰宅後の手洗いや、せきが出るときのマスクの着用といった基本的な対策を続けたい。学年・学級閉鎖の情報は学校や自治体から出されるため、家庭では連絡を確認し、閉鎖中は外出を控えるなどして、家族や周りの人に感染を広げないよう心がける必要がある。家庭内に乳幼児や高齢者がいる場合は、特に注意したい。前年より欠席者が少ないとはいえ、県の注意報の発令から1か月半以上がたっても学年・学級閉鎖が出ており、油断はできない。","2026-11-16","KSB瀬戸内海放送","https://news.ksb.co.jp/article/17054109"]],"dev":[["慢性で複雑な病気の子ほど心の病気の診断が多い 米290万人の分析","米ミズーリ州のチルドレンズ・マーシー・カンザスシティの研究チームは、公的医療保険メディケイドに加入する5〜17歳の子ども290万人のデータを分析し、病気が慢性で複雑になるほど、不安やうつなど心の病気の診断が多くなることを報告した。複雑な慢性疾患のある子では20.0％に診断があり、心臓・神経・腎臓の病気で特にオッズが高かった。成果は小児科学の専門誌『Pediatrics』に掲載された。","\n【概要】米国の公的医療保険メディケイドに加入する子ども290万人を調べた研究で、病気の複雑さと慢性度が増すほど、気分や不安に関わる心の病気の診断が増えることが分かった。研究はチルドレンズ・マーシー・カンザスシティ（米ミズーリ州）のマリア・ニューマスター医師らによるもので、『Pediatrics』に掲載された。\n【背景】複雑な慢性疾患は、医療の利用の多さ、経済的な負担、病気の悪化、生活の質の低下と結び付いている。研究者は、どの病気の種類やどの層の子どもで心の病気が重なりやすいかを知ることが、診察時のスクリーニングや支援の改善、健康の公平さにつながると考えた。病気を抱える子どもの心のケアをどこに重点的に向けるべきかを探る狙いがある。\n【詳細】研究は過去のデータを使った横断研究で、MarketScanメディケイド・データベースから2022年の5〜17歳の子ども290万人を対象にした。不安、うつ、双極性障害、強迫性障害、トラウマ関連障害、自殺・自傷のいずれかの診断があるかを調べ、入院か救急で1回、または外来で2回記録された場合に診断ありとした。子どもは「複雑でも慢性でもない病気」「複雑でない慢性疾患」「複雑な慢性疾患」の3群に分けた。心の病気の診断の割合は、それぞれ7.6％、16.0％、20.0％で、複雑さが増すほど高かった。複雑な慢性疾患のなかでは、心臓（オッズ比1.49）、神経（1.18）、腎臓（1.13）の病気で心の病気の診断のオッズが大きかった。また慢性疾患のある子では、非ヒスパニック系白人の子に比べ、黒人やヒスパニック系の子の方が診断のオッズが低かった。\n【ポイント・注意点】長く続く病気や複雑な病気を抱える子どもでは、体の治療と並んで心の状態にも目を配る必要があることを示す結果だ。ただし1年分のデータを使った横断研究で、病気が心の不調を引き起こすという因果関係を示すものではない。対象はメディケイド加入の子に限られ、人種による差が生じた理由も記事では説明されていない。年齢別の結果や信頼区間も記事には示されていない。","2026-11-20","Medical Xpress","https://medicalxpress.com/news/2026-11-mental-health-medical-complexity-chronicity.html"],["乳児期からのてんかんを起こす希少疾患 原因たんぱく質の「定位置」の仕組みを解明","英リバプール大学などの研究チームは、乳児期早期から重いてんかんと発達の困難を起こす希少疾患「CDKL5欠損症」の原因たんぱく質CDKL5が、神経細胞のシナプスにつなぎ留められる仕組みを突き止めた。たんぱく質の末端のアミノ酸1つを変えるだけで細胞内の位置が変わったという。成果は『Science Advances』に掲載され、治療法を探る新しい手がかりとして期待されている。","\n【概要】英リバプール大学のベン・ゴールト教授らは、フィンランドのヘルシンキ大学の研究者と共同で、CDKL5というたんぱく質が神経細胞のシナプスの骨組みに結び付く、これまで知られていなかった「ドッキング」の仕組みを明らかにした。論文は『Science Advances』に掲載された。\n【背景】CDKL5欠損症（CDD）は、乳児期早期から始まる重いてんかんと、大きな発達上の困難を伴うまれな神経の病気だ。脳の正常な発達に必要なたんぱく質を作るCDKL5遺伝子の変異が原因で、世界で出生4万〜6万人に1人ほどと推定される。CDKL5は長年研究されてきたが、神経細胞の中でどう働き、変異がどう病気につながるのかはよく分かっていなかった。\n【詳細】研究チームは、CDKL5がシナプスの構造の枠組みにつなぎ留められる仕組みを見つけた。たんぱく質の一番端にあるアミノ酸を1つ変えるだけで、神経細胞内での位置が変わったといい、末端の部分が配置に決定的に重要であることを示している。さらにCDKL5は、物理的な力に応じて形を変えるたんぱく質「タリン」に直接結び付くことも分かった。培養細胞でこの結び付きを妨げたり、細胞が生み出す力を弱めたりすると、CDKL5の位置が変わった。研究者は、機械的な力がCDKL5の働く場所に影響しうると考えている。CDDに関わる変異の多くはたんぱく質を短くし、今回見つかったドッキング部分を失わせるため、正しい場所に届かないことも病気の一因になりうるという。筆頭著者のヤスミ・オタニ氏はアミノ酸1つの変化の影響を「驚くべき」ものと述べ、ゴールト教授は、これまでの研究は酵素の働きそのものに注目してきたが、働く場所も重要な要素になりうると話した。\n【ポイント・注意点】酵素の働きだけでなく「どこで働くか」という視点を加えた点が新しい。患者家族の団体CURE5の創設者も、新たな治療の可能性に期待を寄せている。ただし今回の成果は主に培養細胞での実験に基づくもので、生きた脳や患者での効果は示されておらず、治療法が報告されたわけではない。","2026-11-20","Medical Xpress","https://medicalxpress.com/news/2026-11-cell-biologists-uncover-key-mechanism.html"],["爪かみ・皮むしり・抜毛は10代に多く、強い苦痛も 英オックスフォード大","英オックスフォード大学の研究チームは、11〜18歳の生徒5400人超への調査から、爪かみや皮膚むしり、髪を抜くといった「身体集中反復行動」を58.5％が経験し、13％がかなりの苦痛を感じていることを明らかにした。女子やトランスジェンダー・多様な性の若者、不安やうつのある若者、いじめを経験した若者で多かった。成果は『BMJ Mental Health』に掲載された。","\n【概要】英オックスフォード大学の研究チームは、髪を抜く、皮膚をむしる、爪をかむといった「身体集中反復行動（BFRB）」が若者に広く見られ、少なからぬ苦痛の原因になっていると報告した。論文は『BMJ Mental Health』に掲載された。\n【背景】BFRBは、不安やうつを抱える若者やいじめを経験した若者にとって、大きな苦痛のもとになりうる。それにもかかわらず、学校や医療、社会で話題にされることは少なく、当事者は支援を得にくい。別の質的研究では、恥の感情が抜毛のきっかけになり、続けさせ、悪化させていることも示されている。\n【詳細】研究は2年ごとに行われる「OxWell学生調査」を使った横断研究で、主にイングランドのオックスフォードシャーとリバプールに住む11〜18歳の生徒5400人超にBFRBについて尋ねた。少なくとも1つのBFRBがあると答えたのは58.5％で、13％は「かなり」または「非常に」苦痛だと答えた。最も多いのは爪かみ（43.6％）で、皮膚むしり（31.3％）、抜毛（14.5％）が続いた。BFRBのある人の17.6％は2種類以上を持っていた。苦痛を伴う割合は抜毛37％、皮膚むしり29％で、爪かみの11％より高かった。苦痛を伴うBFRBは、トランスジェンダーや多様な性の若者で約4人に1人、女子で約6人に1人と、男子の約18人に1人より多かった。不安とうつのある若者では34％、いじめを経験した若者では27％に見られた。自閉症やADHDのある若者では約5人に1人で、そうでない若者の約2倍だったが、この差は主に感情的な苦痛やいじめの多さで説明できたという。\n【ポイント・注意点】筆頭著者のクレア・マッケイ氏は、BFRBはしばしば若者が困っているサインであり、そのことを尋ねることが有意義な会話のきっかけになりうると述べている。共著者のポリー・ウェイト氏は、恥や偏見が話しにくさを生んでいると指摘する。一方で、一時点の自己申告に基づく調査であり、因果関係は分からない。対象も主に2つの地域の生徒に限られる。","2026-11-20","Medical Xpress","https://medicalxpress.com/news/2026-11-hair-skin-common-young-people.html"],["不利な地域に住む幼児ほど情緒・行動の心配が多く 4歳で最も強く 米ペンシルベニア大","米ペンシルベニア大学とフィラデルフィア小児病院の研究チームは、母子249組を子どもが1歳・2歳・4歳の時点で追跡し、経済や学校の質、汚染、暑さ、交通などを合わせた「地域の不利さ」が大きいほど、子どもの社会情緒面の心配が多いことを示した。関連は家庭の収入に関係なく見られ、黒人や多人種の家庭でより強く、4歳で最も強かった。成果は『JAMA Network Open』に掲載された。","\n【概要】米ペンシルベニア大学とフィラデルフィア小児病院（CHOP）の研究チームは、資源に恵まれない地域に住むことが、幼い子どもの社会情緒面や行動面の心配と結び付いていると報告した。論文は『JAMA Network Open』に掲載された。\n【背景】歴史的に資源を奪われてきた地域では、学校の質や緑地、心身の健康に、恵まれた地域との差が見られる。これまでの研究は地域の不利さを1〜2の指標で調べることが多く、対象も大人や学齢期の子どもが中心だった。今回は複数の指標をまとめた「地域の不利さ」の尺度を作り、幼い子どもを調べた。研究者は、人種による居住の分離や投資の引き揚げの歴史が、黒人や多人種の家庭により大きな不利をもたらしてきたことにも触れている。\n【詳細】研究では、フィラデルフィア都市圏の母子249組を2021年6月から2025年3月まで追跡し、子どもが1歳、2歳、4歳のときに評価した。親が質問票に答え、言葉の遅れや自閉症、ADHD、不安、破壊的行動などの診断がないか医療記録も確認した。地域の不利さは、自宅住所に結び付けた国勢調査に基づく指標で測り、経済的資源、学校の質、汚染、暑さ、安全な屋外空間、貧困、交通の便、住宅の密集度を組み合わせた。その結果、地域の不利さが大きいほど、母親が報告する子どもの社会情緒面の心配が多く、これは家庭の収入に関係なく見られた。関連は黒人や多人種の家庭の子どもでより強かった。不利な地域の子どもは、発達や行動の診断を受けたり支援に紹介されたりするオッズも高かった。困難は年齢とともに目立つようになり、4歳で最も強く表れた。\n【ポイント・注意点】共同責任著者の心理学者レベッカ・ウォーラー氏は、個々の子どもや家族への支援に加え、子どもが暮らす地域そのものへの投資が、生涯にわたる健やかな発達に必要だと述べている。ただし1つの都市圏の249組という規模の観察研究で、因果関係は示されていない。心配の多くは親の報告に基づいている点にも注意が必要だ。対象は妊婦1000人を集めた研究の一部で、効果の大きさの数値は記事に示されていない。","2026-11-20","Medical Xpress","https://medicalxpress.com/news/2026-11-disadvantaged-neighborhood-socioemotional-behavioral-young.html"],["慢性疾患の子と家族はネットの健康情報をどう見る？ 鍵マークを信頼の目印と誤解も","カナダ・サスカチュワン大学の小児リウマチの研究チームは、慢性関節炎などのある10代とその保護者に聞き取りを行い、ネットの健康情報の使い方を調べた。全員がネットを使っていたが、通信の安全を示すHTTPSの鍵マークや、SNSの認証マークを情報の信頼性の目印と誤解する人が多かった。研究は学術誌『Children』に掲載され、研究者がThe Conversationで解説した。","\n【概要】カナダ・サスカチュワン大学の小児リウマチの研究チームは、慢性の病気を抱える10代と保護者が、ネット上の健康情報をどのように探し、評価し、使っているかを聞き取りで調べた。結果は学術誌『Children』に掲載され、研究者自身がThe Conversationに解説記事を寄せた。\n【背景】生涯続く病気のある子どもや家族は、病気についてよくネットで調べる。しかし信頼できる情報とそうでない情報を見分けたり、医学用語を理解したりするのは難しく、誤った情報を信じて治療に悪影響が出るおそれがある。電子的な健康情報を見つけ、評価し、使う力は「デジタルヘルスリテラシー」と呼ばれ、この力が高い人ほど健康的な選択をする傾向がある。\n【詳細】研究チームは、慢性関節炎や関連するリウマチ性の病気のある10代とその保護者に面接した。全員が健康の支えとしてネットやテクノロジーを使っていたが、役立ち具合はさまざまだった。多くはHTTPSの鍵マークやSNSの青い認証マークを信頼の目印にしていたが、鍵マークは通信の安全を、認証マークはアカウントの本人確認を示すだけで、健康情報の正しさを示すものではない。10代は症状の管理や、注射への怖さなど治療の準備の助けを探し、保護者は自分の判断が確かな根拠に支えられているという安心を求めていた。新しい薬の長期的な影響のように、まだ答えがないために情報が見つからないこともあった。10代向けの情報は少なく、年少の子ども向けか難しすぎるものが多かった。研究は、誤情報の見分けにくさ、誤った信頼の目印への依存、医師を装う人への誤った信頼という3つの壁を挙げた。\n【ポイント・注意点】多くの参加者は医療チームを信頼し、決める前にネットの情報を相談しており、医療チームが大事な安全網になっていた。研究者は、子どもや10代に合った情報づくりと、年齢に合った探し方の指導を提案している。ただし記事には参加人数や年齢の範囲が示されておらず、測定した結果ではなく聞き取りに基づく参加者の経験である点に注意が必要だ。","2026-11-20","Medical Xpress","https://medicalxpress.com/news/2026-11-families-children-chronic-illnesses-online.html"],["妊婦と乳児のRSウイルス予防、TikTok動画で質が高いのは半分未満 米研究","米ラトガース大学ニュージャージー医科大学の研究チームは、妊婦向けワクチンや乳児用の長時間作用型抗体など、RSウイルスの予防に関するTikTok動画169本を分析した。質が高いと評価されたのは47％で、医療者の動画は親や保護者の動画より質が高かった。誤情報は3％だったが、内容が混在した不確かな動画は約20％あった。投稿者の半数は医療者だった。成果は『Vaccine』に掲載された。","\n【概要】米ラトガース大学ニュージャージー医科大学の研究チームは、RSウイルス（RSV）の予防接種を扱ったTikTok動画の質を調べ、質の高い情報を伝えている動画は半分に満たないと報告した。論文はワクチンの専門誌『Vaccine』に掲載された。\n【背景】SNSは、人々が病気や健康の話題を知る身近な手段になっている。RSVの予防には、妊婦に接種するワクチン「アブリスボ」や、乳児に使う長時間作用型の抗体「ニルセビマブ（ベイフォータス）」がある。研究チームは、こうした予防策がTikTokでどのような質と語り口で伝えられ、誤情報がどれほど含まれているかを調べた。\n【詳細】研究チームは「RSV vaccine」「RSV jab」「RSV prophylaxis」などの語で検索し、米食品医薬品局（FDA）がニルセビマブを承認した後の2023年7月17日から2025年11月14日までに投稿された動画169本を視聴した。質は1（低い）から5までの「グローバル品質スケール」で評価し、4を超えるものを高品質とした。その結果、高品質の動画は47％（79本）で、得点の中央値は3だった。投稿者は医療者が50.3％で最も多く、親や保護者37.9％、インフルエンサー4.7％、所属不明4.1％、クリニック1.8％、科学者・研究者1.2％と続いた。医療者の動画は親や保護者の動画より質が高かった。内容が混在していたり不確かだったりする動画は約20％あり、誤情報（3％）の6倍多かった。\n【ポイント・注意点】著者らは、医療者が全動画の半分と、根拠に沿った内容の大半を作っていた一方、親や保護者は混在・不確かな内容の割合が大きかったと指摘する。そのうえで、医療者は家族がネットで混在した情報に触れることを前提に、根拠のある情報源へ案内すべきだとしている。ただし検索語で集めたTikTok動画だけを分析した横断的な研究で、ほかのSNSは対象になっていない。また記事中の図では大きな3つの投稿者層157本の内訳が示されており、169本との差は説明されていない。","2026-11-20","Medical Xpress","https://medicalxpress.com/news/2026-11-tiktok-videos-rsv-high-quality.html"],["親のスマホ使用が幼児の言葉の発達の遅れと関連 ポルトガル93家族の研究","ポルトガルのRISE-Healthとアヴェイロ大学の研究チームは、3〜5歳の子がいる93家族を対象に、家族の機能やデジタル機器の使い方と就学前の子どもの発達の関係を分析した。親が仕事以外の時間にスマートフォンを使うこと、子どもの夜間のタブレット使用、過度に密着して依存し合う親子関係が、子どもの言葉（発音）の発達の遅れと関連していたという。使用時間だけでなく、内容や使う場面も影響していた。","\n【概要】ポルトガルのRISE-Healthとアヴェイロ大学の研究チームは、親が仕事以外の時間にスマートフォンを使うことが、就学前の子どもの言葉の発達の遅れと関連しているとする研究をまとめた。欧州のニュースサイト「ユーロニュース」が2026年11月20日に報じた。\n【背景】幼い子どもは、身近な大人との会話や遊びを通して言葉の音を聞き、自分でも試しながら話し方を身につけていく。一方で、家庭ではスマートフォンやタブレットが日常的に使われるようになっている。研究チームは、家族の関係のあり方とデジタル機器の使い方が、就学前の子どもの発達にどう影響するかを調べた。\n【詳細】対象は、3〜5歳の子どもがいるポルトガル語を話す93家族。分析の結果、親の仕事以外の時間のスマートフォン使用、子どもの夜間のタブレット使用、そして「過度に密着し相互に依存した関係」が、子どもの言葉の発達の遅れと結び付いていた。影響は機器に触れる量だけで決まるのではなく、見ている内容の種類や使う状況にも左右されていた。親がスマートフォンに気を取られると、言葉の発達に大切な子どもとの対面のやり取りが減る可能性があるという。また、親子関係が閉じて依存的になりすぎると、子どもの自主性や、言葉を使う場面の多様さが限られ、発音を練習して覚える機会が減るおそれがあると指摘している。RISE-Healthの研究者マリア・イネス・ゴメス氏は、話す、遊ぶ、歌う、お話をするといった日々の関わりで、子どもは意味のある場面の中で言葉の音を聞き、試すことができると説明する。同時に、子どもに答える時間を与え、自分から話し出すのを待つことも同じくらい大切だという。大人がいつも子どもの代わりに答えたり、言いたいことを先回りしたりすると、子どもが参加し、伝え、自立する余地が小さくなり、とくに音韻の発達に影響しうると述べた。\n【ポイント・注意点】研究チームは、親が自分自身のデジタル機器の使い方を見直すよう勧めている。さらに自治体や学校が、生活リズムの組み立て、年齢に合った内容選び、機器の使用の見守り、実際に会話や遊びをする時間づくりの面で親を支えられるとしている。ただし報道は「関連」「影響しうる」と表現しており、因果関係を示したものではない。研究の方法や年齢別の結果、効果の大きさは記事では説明されておらず、対象も93家族と小規模である。","2026-11-20","Euronews","https://www.euronews.com/2026/11/20/parents-mobile-phone-use-outside-work-hours-linked-to-delayed-child-speech-development"],["知的障害のある子の重い行動の問題 CBDオイルは偽薬と差なし 豪州の試験","オーストラリアの3つの小児病院で行われた試験で、知的障害と重い行動の問題がある6〜18歳の131人に、大麻由来成分CBDのオイルか偽薬を使ってもらった。いらいらの得点はどちらの群でも下がったが、群の間に意味のある差はなく、不安や睡眠、親の育児ストレスにも上乗せの効果は見られなかった。肝臓の酵素値の一時的な上昇はCBD群で多かった。成果は『JAMA Pediatrics』に掲載された。","\n【概要】知的障害があり、重い行動の問題を抱える子どもや10代に、大麻由来の成分カンナビジオール（CBD）のオイルを使っても、偽薬と比べて行動面の改善は見られなかった。オーストラリアの3つの小児病院で行われたランダム化試験の結果で、ダリル・エフロン氏らが『JAMA Pediatrics』に発表した。\n【背景】いらいらや攻撃性、自傷などの重い行動の問題は、知的障害のある子どもや10代によく見られる。医師はしばしば抗精神病薬や刺激薬、抗うつ薬を処方するが、根拠は限られ、副作用のリスクも高い。そのため、酩酊作用のない大麻成分であるCBDへの関心が高まっていたが、効果を示す質の高い根拠は乏しかった。\n【詳細】試験は二重盲検のランダム化比較試験で、知的障害と重い行動の問題がある6〜18歳の131人が参加した。参加者は純粋なCBDオイルか、見た目が同じ偽薬を受け取り、家族も医師もどちらかを知らなかった。親は8週間の維持期の始めと終わりに、いらいら、不安、睡眠、人との関わり、自身の育児ストレスを評価した。いらいらの平均得点は、CBD群で32.2から21.7へ、偽薬群で30から19.2へ下がったが、群の間の差は統計的に意味のあるものではなかった。不安、睡眠の乱れ、引きこもり、育児ストレスにも、CBDによる上乗せの効果はなかった。下痢や疲れ、嘔吐などの副作用は、CBD群63％、偽薬群61％とほぼ同じだった。一時的な肝臓の酵素値の上昇はCBD群で多く（4.6％対1.5％）、特に抗てんかん薬のバルプロ酸ナトリウムと併用した場合に目立った。\n【ポイント・注意点】両群とも得点が下がっており、比較対照を置いた試験の大切さもうかがえる。記事は、医師がこの結果をもとに、家族と一緒にCBDの不確かな効果を、費用や副作用、薬の飲み合わせと比べて考えられるとしている。肝臓の酵素値の上昇はまれだが、併用薬がある場合は特に注意が必要だ。なお記事は、比較を「10週間後」とも書いており、8週間の維持期との関係は記事からははっきりしない。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-cbd-oil-behavioral-benefit-youths.html"],["耳への電気刺激で子どもの片頭痛に手応え 家庭で使える方法の初期研究","中国の南方医院などの研究チームは、耳の外側に弱い電気刺激を与える「経皮的耳介迷走神経刺激（taVNS）」を、7〜18歳の片頭痛のある子どもや10代の患者11人が家庭で4週間使う探索的な試験を行った。72回の発作で使い、重い有害事象はなく、2時間後に薬なしで痛みが消えたのは36.11％の発作だった。対照群のない小規模な研究で、研究者は次に偽の刺激と比べる試験を目指すとしている。","\n【概要】中国の南方医院などの研究チームは、耳に弱い電気を流す「経皮的耳介迷走神経刺激（taVNS）」を、片頭痛のある子どもや10代が家庭で安全に使えるかを調べ、初期段階として有望な結果を得た。論文は『Neuromodulation: Technology at the Neural Interface』に掲載され、研究者がMedical Xpressに解説を寄せた。\n【背景】片頭痛は子どもや10代に大きな負担となるが、薬を使わない治療の選択肢は少ない。taVNSは、耳の外側に軽い電気パルスを与える体を傷つけない方法で、研究チームは片頭痛の発作が起きたときに家族が家で使えるかを確かめようとした。あわせて、自律神経の働きを映す心拍変動が治療の効き目の目安になるかも調べた。\n【詳細】研究は対照群を置かない前向きの単群・非盲検の探索的試験で、7〜18歳の患者11人が参加した。参加者は4週間、自宅で1回30分のtaVNSを自分で行い、期間中に72回の発作で使用した。taVNSは実施しやすく、体への負担も少なかった。72回の使用のうち、刺激した場所に軽く一時的な皮膚の反応が2回あっただけで、重い有害事象は報告されなかった。発作中の痛みの得点は下がる傾向を示し、薬を使わずに2時間後に痛みが消えたのは36.11％の発作だった。過去の記録と比べると、4週間の介入期間には発作の平均時間と月あたりの片頭痛の日数が減っていた。探索的に調べた心拍変動は、多重比較の補正後に意味のある変化を示さず、現時点では治療反応の指標にはできないとしている。\n【ポイント・注意点】対照群がないため、痛みの軽減や変化をtaVNSだけによるものとは言えない。子どもの片頭痛は個人差が大きく自然に治まることもあり、期待や偽薬の効果も考えられると研究者自身が注意している。研究チームは次に、十分な人数で偽の刺激と比べるランダム化試験を行いたいとしている。なお解説記事の筆者は、迷走神経に関する団体の創設者であることを開示している。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-home-based-auricular-vagus-nerve.html"],["子どもの心の危機は「本物」 英国で不安・うつの初受診が4倍に 620万人の記録","英マンチェスター大学などの研究チームは、イングランドのかかりつけ医の記録を使い、2001〜2023年に不安やうつが初めて記録された10〜18歳約38万人を調べた。初回の記録は年1000人あたり6人から24人へと4倍に増えたが、自傷による入院などの深刻な結果のリスクは20年前と同じく高いままだった。「軽い例が増えただけ」という見方を否定する結果で、『The Lancet Psychiatry』に掲載予定。","\n【概要】英マンチェスター大学などの研究チームは、不安やうつで助けを求める子どもや10代がこの20年で急増しているのは、若者が気持ちを話しやすくなったからだけでは説明できないと報告した。論文は『The Lancet Psychiatry』に掲載予定として受理されている。\n【背景】若者の不安やうつの増加については、思春期のふつうの悩みを病気として扱いすぎる「過剰な医療化」や、受診のハードルが下がったことが原因だという説が議論されてきた。研究者は、実際には臨床的な支援を必要とする若者が持続的に増えていることを証拠が示していると主張する。\n【詳細】研究は過去の記録を使った集団ベースのコホート研究で、イングランドのかかりつけ医の匿名化記録の大規模データベース（CPRD）を使い、2001〜2023年の620万人超の子どもと若者のデータを分析した。このうち不安やうつの診断や症状が初めて記録された10〜18歳約38万人を、病院の入院データと結び付けて追った。かかりつけ医での不安・うつの初回の記録は、2001年の年1000人あたり6人から2019年の24人へと4倍に増えた。一方、最近受診した若者も、20年前に受診した若者と同じように、自傷やアルコール・薬物の問題による入院などの深刻な結果のリスクが同年代より高く、その差は期間を通じて変わらなかった。受診の年齢は若くなり、増え方は豊かな地域と貧しい地域で同じだった。自閉症やADHDなどの併存の記録は約3倍に、専門の精神医療への紹介は2倍超になった。抗うつ薬を処方される割合は2001〜2005年に半減し、その後は横ばいだった。\n【ポイント・注意点】研究者は、増加が主に軽い例によるものなら深刻な結果のリスクは下がるはずだが、下がらなかったと指摘する。ヴィッキー・タクシアルキ博士は、今受診する子どもの臨床的な弱さは減っておらず、支援が必要な若者がはるかに増えていると述べた。ただし過去の記録に基づく研究で、記録の付け方の変化については記事では触れられていない。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-mental-health-crisis-children-real.html"],["「うちの子、ちゃんと食べてる？」 初めての父親は幼児の食事に支援を求める","スウェーデンのウプサラ大学の研究チームは、生後10〜24か月の子を持つ初めての父親21人に聞き取りを行い、幼い子の食事をどう感じているかを調べた。父親たちは子どもに自由に食べさせることと、十分に食べさせることの間で迷い、食べないときの対応に悩んでいた。体重が増えにくい子の父親ほど迷いが強く、より実用的な助言を求めていた。成果は『PLOS One』に掲載された。","\n【概要】スウェーデンのウプサラ大学の研究チームは、初めて父親になった男性が幼い子どもの食事にどう向き合っているかを聞き取りで調べ、多くの父親が迷いを抱え、より多くの支援を望んでいることを明らかにした。論文は『PLOS One』に掲載された。\n【背景】幼い子どもの食事は喜びにも心配にもなりうる。これまでの子どもの食事の研究は主に母親を対象としており、父親が食事の時間をどう経験し、子どもの食の発達でどんな役割を果たしているかはあまり分かっていなかった。一方で、父親が幼い子どもの世話に積極的に関わる場面は増えており、父親の視点を知ることの重要性が高まっている。\n【詳細】研究チームは、調査時点で生後10〜24か月の子どもを持つ、スウェーデンの初めての父親21人に面接した。父親たちは、子どもが自分で食べ物を探って食べることを認めつつ、十分な量を食べているかを確かめることの間で、バランスを取ろうとしていた。多くは食事を大事だが難しいものと感じ、子どもが思ったより食べなかったり、食べ物に関心を示さなかったりすると不安を覚えていた。子どもが食べ物を拒んだとき、もっと食べるよう促すべきか、子どもに任せるべきかは、繰り返し出てきた問いだった。心配は子どもの成長と結び付いているようで、体重が少ない子や体重が増えにくい子の父親は食事の時間により迷いを感じていたが、体重の多い子の父親には同じほどの心配は見られなかった。何人かの父親は、さまざまな食事の場面への対処について、より明確で実用的な助言を求めていた。\n【ポイント・注意点】筆頭著者のイルヴァ・トーネル・ル・プリオル氏は、子ども保健センターなどの子ども保健サービスが重要な役割を担うと指摘する。子どもが大きくなるにつれてサービスとの接点は減るが、その時期に多くの父親が育児休業を取り、食事の責任を担っている。筆頭著者は、この研究が子ども保健サービスによる父親への支援の必要性に光を当てることを願っている。ただし1か国21人の聞き取りで、結果をどこまで一般化できるかは記事では論じられていない。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-child-fathers-young-children-habits.html"],["手術室でのレースゲームが子どもの麻酔前の不安の高まりを抑える 米エール大","米エール大学麻酔科の研究チームは、全身麻酔で処置を受ける4〜14歳の子どもを対象に、手術台に取り付けたプロジェクターでレースゲームを遊べるようにするランダム化比較試験を行った。ゲームをした子は、通常のケアを受けた子に比べ、麻酔導入前の不安の高まりが大幅に小さかった。手術室のスタッフにも好評だったという。成果は『Journal of Clinical Anesthesia』に掲載された。","\n【概要】米エール大学麻酔科の研究チームは、手術の直前にレースゲームで遊ぶことで、子どもの手術前の不安の高まりを抑えられることを、ランダム化比較試験で示した。論文は『Journal of Clinical Anesthesia』に掲載された。\n【背景】子どもの手術前の不安はよく見られ、ケアを難しくし、回復が大変になることとも関連している。研究を率いたアンソニー・ロンギーニ医師は麻酔科の助教で、エール・ニューヘブン病院で子どもの患者を診ている。研究チームは、手術直前にゲームで遊ぶことが不安の高まりを抑えるかを確かめようとした。\n【詳細】試験の対象は、全身麻酔で処置を受ける4〜14歳の子どもたち。介入群では、持ち運びできる「BERT（ベッドサイド・エンターテインメント・アンド・リラクゼーション・シアター）」というシステムで、レゴのバットマンのレースゲームを映し出した。このゲームを選んだのは、子どもが操作しなくても車がコースを走り続けるため、見ているだけでも遊んでもよいからだという。プロジェクターは手術台に固定し、画面はベッドの足元に置くので、子どもは周りの様子も分かる。対照群は通常のケアを受けた。その結果、BERT群の子どもは、通常のケアの子に比べて麻酔導入前の不安の高まりが大幅に小さかった。多くの子は麻酔が効き始めてもゲームを続け、マスクを着けるまでの約1分間遊び続けたり、うとうとしながら遊んだりする子もいた。手術室のスタッフへの調査でも反応は良く、患者ごとの準備や片付けも手伝ってくれたという。\n【ポイント・注意点】ロンギーニ医師は、次はどの方法がどの子に最も合うかを知ることが課題だと述べ、病院では今もこのシステムを使って効果を見守っている。エール大学医学部の小児科医アッシャー・マークス氏は、実際の現場での運用に目を向けた点を評価した。ただし記事には参加人数や不安の測り方、効果の大きさの数値、盲検化や追跡の有無は示されていない。手術前の不安を和らげる身近な工夫として、今後の詳しい検証が待たれる。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-video-games-presurgery-anxiety-children.html"],["13歳の肥満の多くは幼い頃「普通体重」だった ノルウェー12万人の記録","ノルウェー科学技術大学（NTNU）などの研究チームは、1991〜2017年に記録された子ども12万4470人の身長・体重を分析し、2〜8歳の体格と13歳での肥満の関係を調べた。4〜8歳で肥満だった子の38〜51％は13歳でも肥満だったが、13歳で肥満の子の多くは幼い頃は普通体重か過体重だった。研究者は全員に届く予防策の大切さを訴える。成果は『Acta Paediatrica』に掲載された。","\n【概要】ノルウェー科学技術大学（NTNU）などの研究チームは、幼い頃の体格指数（BMI）と13歳での肥満の関係を調べ、肥満の予防には、リスクの高い子への治療と、すべての子に届く予防策の両方が必要だと結論づけた。論文は『Acta Paediatrica』に掲載された。\n【背景】子どもの肥満は将来の健康問題のリスク要因で、食事や生活習慣と結び付いている。研究チームは、親と子どもに向けた予防の手がかりを得るため、幼児期のBMIが13歳での肥満とどう関係するかを調べた。研究にはNTNUのほか、聖オーラヴ病院、トロンハイム市、ノルウェー公衆衛生研究所が参加した。長い期間の大量の記録を使うことで、幼児期の体格がその後どう変わるかを追うことができた。\n【詳細】データは、トロンハイムとベルゲンの子ども保健クリニックと学校保健サービスで1991〜2017年に集められた、子ども12万4470人の身長と体重の記録だ。測定は2歳、4歳、6歳、8歳、13歳で行われていた。4歳、6歳、8歳のいずれかで肥満だった子のうち、13歳でも肥満だったのは38〜51％だった。同じ年齢で過体重だった子では、13歳で肥満になったのは8〜10％にとどまり、6歳で過体重だった子の62％は13歳までに普通体重になっていた。一方、13歳で肥満の子の大半は、それ以前には肥満ではなく、幼い頃は普通体重か過体重だった。普通体重や過体重の幼児はずっと多いため、後に肥満になる子の総数は大きくなるが、BMIだけでそれが誰かを予測するのはほぼ不可能だという。\n【ポイント・注意点】ロンヌーグ・アストリ・オーデゴール教授は、最もリスクの高い子への治療と、全員に届く効果的な予防の2つが同時に必要だと述べる。グドルン・マリア・ヴァーレル・ビョルネルヴ准教授は、過体重の子に絞った対策は資源の最善の使い方ではないかもしれず、子ども向けの不健康な食品の広告禁止や、学校での運動・食事の取り組みのような幅広い対策の方が効果的だろうとしている。ただし健康記録に基づく観察的な分析で、記事では研究の限界には触れられていない。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-obesity-young-people.html"],["「抗生物質アレルギー」の子の多くは実は違う？ 誤った記録の見直しを専門家が提案","「ペニシリンにアレルギーがある」と記録された子どもの多くは、実際にはアレルギーではない可能性があると、英国の医師レベッカ・ペイン氏らがThe Conversationで解説した。記録の多くはウイルス感染中の発疹などがきっかけで、誤ったまま大人まで残ることもある。2024年の研究では評価を受けた子の91％で記録が外れたといい、かかりつけ医での見直しの手順を示している。","\n【概要】レベッカ・ペイン氏とマノハール・ジョイシー氏は、抗生物質へのアレルギーがあると記録された子どもの多くが、実際にはアレルギーを持っていない可能性があると、The Conversationに解説記事を寄せた。記事はMedical Xpressに転載され、筆者らが『British Journal of General Practice』に発表した論文に基づいている。\n【背景】米国では、子どもの約20人に1人の診療記録にペニシリンのアレルギーが記されている。しかし研究によれば、そうした子どもの大半は本当のアレルギーではないとされる。筆者らは、土曜の夜に重い扁桃炎で受診した10歳の男の子の母親が「ペニシリンも、名前が『マイシン』で終わる薬もだめ」と話す場面を例に挙げる。英国の指針では、扁桃炎にはペニシリンとクラリスロマイシンが第一の選択肢とされている。\n【詳細】子どもの抗生物質アレルギーの記録の多くは、ウイルス感染の最中に始まる。抗生物質を飲んでいる間にウイルスによる発疹が出たり、嘔吐、頭痛、発熱、関節の痛みがアレルギーの兆候と誤解されたりするためだ。一度記録されると外すのが難しく、大人になっても残ることがある。誤った記録があると、効き目が劣り、必要以上に幅広い菌に効く抗生物質が使われ、MRSAやC.ディフィシルなどの感染のリスクが高まり、入院の長期化や医療費の増加にもつながりうる。誤った記録を外す「デラベリング」は外来やかかりつけ医でも有効とされ、2024年の研究では評価を受けた子どもの91％で記録が外れた。筆者らは子どもを3つに分ける。症状がもともとアレルギーらしくない子や家族のアレルギーだけで記録された子は、検査なしで外せる。重い症状のない軽い発疹だった子は、専門職の管理のもとで家で1回服用し、1週間後に連絡して反応がなければ外す。アナフィラキシーなど重い反応があった子は専門の外来に紹介する。\n【ポイント・注意点】筆者らは、親が子どもの体調が良いときに、かかりつけ医に診断の見直しを相談するよう勧めている。記録が外れたら、明確な説明と書面での確認を受けるべきだという。ただしこれは新しい研究の報告ではなく専門家の解説で、自己判断で薬を試すことを勧めるものではない。","2026-11-18","Medical Xpress（The Conversation）","https://medicalxpress.com/news/2026-11-children-allergic-antibiotics-allergy.html"],["まれな代謝の病気の脳の損傷を肝臓の遺伝子を止めて防ぐ 米デューク大がマウスで","米デューク大学などの研究チームは、新生児のスクリーニング対象である遺伝性の代謝の病気「グルタル酸尿症1型」のマウスで、肝臓の遺伝子の働きをsiRNAで止める治療を試した。成体のマウスはすべて生き延び、新生児のマウスも高たんぱくの食事のもとで対照群より生存が良く、脳の損傷も見られなかった。成果は『Science Translational Medicine』に掲載された。","\n【概要】米デューク大学医学部の小児科のカール＝ディミター・ビシグ准教授らは、コロラド大学アンシュッツ校、製薬企業アルナイラム・ファーマシューティカルズと共同で、まれな遺伝性の代謝の病気グルタル酸尿症1型（GA1）による脳の損傷を、肝臓の遺伝子を止めることで防げる可能性をマウスで示した。論文は『Science Translational Medicine』に掲載された。\n【背景】GA1は、必須アミノ酸のリシンをうまく分解できない病気で、子ども時代に有害な代謝物が脳にたまる。これが、特に運動をつかさどる脳の部分の、元に戻らない神経の損傷の主な原因と考えられている。米国ではすべての新生児がGA1の検査を受けるが、標準的な治療はリシンを減らした食事と、急な神経の病気への緊急対応で、特有の治療法はない。患者の約3分の1が重い運動障害を起こし、命に関わる合併症もある。ビシグ氏らは2023年の研究で、脳を傷つける有害な代謝物が肝臓で作られ、血液脳関門を越えることを示していた。\n【詳細】研究チームは、遺伝子の働きを抑える小さなRNA（siRNA）を使い、リシンの分解に関わる肝臓の遺伝子を止めた。この治療を成体のモデルマウスに行うと、すべてのマウスが生き延びた。新生児のモデルマウスでも、高たんぱくの食事のもとで対照群より生存が良かった。治療したマウスでは、脳を含めて代謝物が大きく減り、脳の損傷は見られなかった。さらに組織を調べたところ、血漿中に神経の経過を予測する代謝の目印があり、治療の効き目を見守る手がかりになりうるという。ビシグ氏は、肝臓は循環する代謝物を通じてあらゆる臓器とつながっていると説明している。\n【ポイント・注意点】ビシグ氏は臨床試験に進めることを目指している。siRNAは効果が永続しない方法で、肝臓を標的とするsiRNAの薬はすでに複数が市販されているため、実用化への道筋が描きやすいと述べた。年に2〜3回の注射で常に守られるようになれば、厳しい食事管理を続ける患者にとって大きな変化になるとも話す。ただし今回の結果は前臨床段階のマウスでのもので、人での安全性や効果はまだ確かめられていない。記事にはマウスの数や投与量の詳細は示されていない。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-silencing-liver-gene-brain-rare.html"],["乳児期発症のニーマン・ピック病C型に初の承認薬 米FDA、生存の延長を確認","米食品医薬品局（FDA）は2026年11月17日、乳児期に発症するニーマン・ピック病C型（NPC）に対し、シクロデキストリン（商品名アドラベタデックス）を承認した。NPCは子どもの神経が急速に衰えて死に至るまれな病気だ。後期の試験は臨床の評価項目を満たさなかったが、生存のデータを見直した分析で乳児期発症の患者の生存の延長が示された。米国立衛生研究所（NIH）が20年続けてきた研究の成果だという。","\n【概要】米国立衛生研究所（NIH）によると、米食品医薬品局（FDA）は2026年11月17日、乳児のニーマン・ピック病C型（NPC）の治療薬としてシクロデキストリン（商品名アドラベタデックス）を承認した。大規模な国際臨床試験で参加者の生存を延ばしたとされ、20年前に始まった基礎研究が実を結んだ形だ。\n【背景】NPCは、NPC1遺伝子の変異で、細胞の中で脂質やコレステロールを運ぶたんぱく質が足りなくなる病気だ。細胞内に異常な蓄積が起こり、神経の働きが徐々に衰えて早くに亡くなる。重さには大きな幅があり、大人になって診断されることもあるが、半数は10歳までに見つかり、2歳までに見つかる例が最も経過が悪い。子どもはまず発達の節目の遅れを示し、その後、高齢者の認知症に似た認知の低下が進むことがある。\n【詳細】NIHの研究者は1997年に、原因となる変異が18番染色体のどこにあるかを示した。2006年には、NIHの「ベンチ・トゥ・ベッドサイド」の取り組みとして、NPCの人の経過を追う自然歴研究が始まった。その後、国立小児保健発達研究所（NICHD）のフォーブス・D・ポーター氏がFDAから治験の許可を得て、NIH臨床センターで初期の試験を始めた。2016年には複数の企業と共同研究開発の契約を結び、複数の国と施設で後期の試験を行った。後期の試験は目印となる生体指標では良い結果だったが、承認に必要な臨床の評価項目は満たさなかった。その後、ベーレン・セラピューティクスとラッシュ大学医療センターのエリザベス・ベリー＝クラビス医師と行った生存データの分析で、乳児期に発症した人の生存の延長が示され、承認につながった。NIHの自然歴研究と治療研究のデータが決め手になったという。\n【ポイント・注意点】NIHのジェイ・バタチャリヤ所長は、新しい治療の裏には長年の基礎科学があり、近道はなかったと述べた。ポーター氏は、承認によって家族が共に過ごせる時間が増えると話し、根治を目指す研究を続けるとしている。ただし記事には、試験の参加人数や延びた生存期間の具体的な数値は示されておらず、論文の掲載誌も書かれていない。承認は乳児期に発症した患者が対象である点にも注意が必要だ。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-fda-drug-infantile-onset-niemann.html"],["肥満の10代にチルゼパチド BMI18.5％減、半数超が肥満の基準を下回る","6か国31施設で12歳以上18歳未満の160人が参加した第3相試験「SURMOUNT-ADOLESCENTS」で、週1回の注射薬チルゼパチドを72週間使った群は、BMIが平均18.5％減り、約54％が年齢・性別の肥満の基準を下回った。偽薬群で基準を下回ったのは7％だった。身長の伸びや思春期の進行は正常だった一方、消化器の症状は多かった。成果は『JAMA』に掲載された。","\n【概要】肥満のある10代を対象にした第3相試験「SURMOUNT-ADOLESCENTS」で、週1回の注射薬チルゼパチド（商品名ゼップバウンド）を使った若者の半数超が、肥満の基準を下回るまでBMIを減らした。アーロン・S・ケリー氏らが『JAMA』に発表した。\n【背景】チルゼパチドは、GIPとGLP-1という2つの消化管ホルモンの働きをまねる薬だ。肥満は世界の約8人に1人に、米国の10代では約5人に1人に見られるが、これまでのチルゼパチドの試験の多くは大人が対象で、10代での効果と安全性を確かめる試験が求められていた。\n【詳細】試験はランダム化・二重盲検・偽薬対照で、カナダ、チェコ、イスラエル、イタリア、ポーランド、米国の6か国31施設で、12歳以上18歳未満の160人が参加した。対象は肥満のある人か、高血圧や前糖尿病などの合併症を1つ以上伴う過体重の人で、2対1の割合でチルゼパチドか偽薬に割り付け、72週間続けた。チルゼパチドは2.5mgから始めて4週ごとに増やし、耐えられる最大量として5mg、10mg、15mgのいずれかにした。両群とも運動や食事についての指導を受けた。その結果、チルゼパチド群のBMIは平均18.5％減ったのに対し、偽薬群は0.5％増えた。年齢・性別の肥満の基準を下回ったのはチルゼパチド群の約54％で、偽薬群は7％だった。チルゼパチド群の約80％はBMIを5％以上減らし、体重は偽薬群より平均20.1kg多く減った。血圧や善玉コレステロール、血糖などの指標も改善し、身長の伸びや思春期の進行は正常だった。\n【ポイント・注意点】消化器の症状はチルゼパチド群の81.5％に出たが、多くは軽度から中等度で、偽薬群でも54.9％に見られた。チルゼパチド群の約9.3％は副作用のため早めに使用をやめた。試験は比較的小規模で追跡期間も限られ、長期の安全性や効果の持続、使用をやめた後どうなるかを確かめるには、さらに長い研究が必要だとされている。また記事は、BMIの変化は体重の減少率と同じではない点にも注意を促している。","2026-11-17","Medical Xpress","https://medicalxpress.com/news/2026-11-tirzepatide-teens-obesity-threshold-clinical.html"],["乳児の発達をオンラインで評価 対面検査とほぼ同じ結果に 米UCデービス","米カリフォルニア大学デービス校MIND研究所の研究チームは、自閉症やADHDの可能性が高い乳児の発達をオンラインで評価する道具「TEDI」を、対面の検査と比べた。乳児111人が1か月以内に両方の評価を受け、得点はおおむね一致した。家では赤ちゃんが普段どおりに過ごせたという家族の声も多かった。成果は『Journal of Clinical Child and Adolescent Psychology』に掲載された。","\n【概要】米カリフォルニア大学デービス校（UCデービス）MIND研究所の研究チームは、オンラインで乳児の発達を評価する道具「TEDI」による結果が、研究室での対面の評価とほぼ同じになることを示した。論文は『Journal of Clinical Child and Adolescent Psychology』に掲載された。\n【背景】TEDIは、精神医学・行動科学の准教授ミーガン・タルボット氏が開発した道具で、自閉症やADHDなどの可能性が高い乳児の発達を見守る機会を、特に農村部や支援の届きにくい地域で広げることを目指している。新型コロナの流行中、多くの研究者が子どもの評価をオンラインに切り替えたが、同じ乳児で家庭と研究室の結果を比べた研究は少なかった。\n【詳細】研究チームは乳児111人を集めた。うち33人は自閉症の家族歴、51人はADHDの家族歴があり、27人はどちらの家族歴もなかった。乳児は6か月か9か月、12か月、18か月のいずれかの時点で、1か月以内に研究室での対面評価とオンラインのTEDIの両方を受けた。60分のオンライン評価では小さなおもちゃのセットを使い、検査者がパソコンやスマートフォン、タブレットからビデオで参加して、いないいないばあやシャボン玉、歌などを親に案内した。検査者は言葉の理解、コミュニケーション、遊び、問題解決、自閉症やADHDに関わる行動を評価した。その結果、対面とオンラインの得点はおおむね一致しており、遠隔の評価でも妥当で信頼できるデータが得られることが示唆された。家庭での評価が普段の様子を反映していたかを家族に尋ねると、赤ちゃんが家の方がリラックスし「いつもの様子」に近かったという声や、便利さを評価する声が多かった。\n【ポイント・注意点】研究チームはスペイン語版のTEDIの検証を進めており、オンライン評価と親へのコーチングを組み合わせた研究も始める。ただし記事には一致度を示す統計の数値は示されておらず、家族によっては対面での診断の方が適している場合もあるとされている。","2026-11-16","Medical Xpress","https://medicalxpress.com/news/2026-11-telehealth-tool-yields-infant-scores.html"],["胎児期・幼少期の環境が思春期まで健康に影響 欧州「HELIX」の分析","スペインのバルセロナ世界保健研究所（ISGlobal）とフランスのインセルムの研究チームは、妊娠中の69種と子ども時代の129種の環境要因と、子ども時代と思春期の11の健康指標の関係を一度に調べた。妊娠中の喫煙は子どものBMIの高さや攻撃性などの外在化行動と関連し、関連の多くは思春期まで続いていた。成果は『Science Advances』に掲載され、対話型の地図も公開された。","\n【概要】スペインのバルセロナ世界保健研究所（ISGlobal）とフランス国立保健医学研究所（インセルム）の研究チームは、妊娠中や子ども時代の環境要因が複数の健康の側面と同時に結び付き、その多くが思春期まで続いていることを示した。欧州の「HELIX」プロジェクトの一環で、論文は『Science Advances』に掲載された。\n【背景】食事、たばこの煙、大気汚染など、生涯に受ける環境要因の全体は「エクスポソーム」と呼ばれる。研究チームは、多くの結果を一度に見る手法をとり、子どものエクスポソームと健康の関連を示す公開の対話型の地図も作った。これは仮説を生み出すための道具と位置づけられている。\n【詳細】分析には、妊娠中の69種と子ども時代の129種の曝露のデータと、子ども時代（6〜11歳）と思春期（12〜18歳）に測った11の健康指標を使った。指標は、心臓・代謝（BMIと血圧）、心の健康（ADHD、不安やうつなどの内在化症状、攻撃性や衝動性などの外在化症状）、呼吸器（ぜんそくと喘鳴）、アレルギー（皮膚炎と鼻炎）の4領域に分けた。その結果、妊娠中の6種と子ども時代の42種の曝露が、複数の指標や領域と同時に関連していた。4領域すべてと関連する曝露はなかったが、選ばれた曝露の約3分の1は2つ以上の領域と結び付いていた。妊娠中の母親の喫煙は、幼少期と思春期の両方で子どものBMIの高さと外在化行動の多さに、思春期にはADHD症状の多さにも関連していた。妊娠中の母親の肉の摂取量が多いことは、いくつかの心の健康の指標やぜんそく、子ども時代の喘鳴や皮膚炎と関連していた。幼少期に見られた関連の多くは、思春期にも見られた。\n【ポイント・注意点】研究者は、幼い時期の環境が長く続く健康への影響を持ちうることを示唆するとしている。ただし、これらの曝露が健康の結果を引き起こすことを示したものではない。研究者は、より大規模で多様な集団で、曝露を変えれば健康の道筋が変わるかを確かめる研究が必要だとしている。記事には参加者数や効果の大きさは示されていない。","2026-11-16","Medical Xpress","https://medicalxpress.com/news/2026-11-early-life-environmental-factors-linked.html"],["胎内や幼い頃の肥満の環境が免疫を長く弱める ワクチンの効きも低下 米ペンシルベニア大","米ペンシルベニア大学の研究チームは、胎内や生後早い時期に高脂肪の食事にさらされると、免疫の働きが長く弱まる可能性をマウスで示した。肥満の幼いマウスでは、抗体づくりを助けるT細胞の一種が育ちにくく、ワクチンへの反応が弱かった。酵素A20の遺伝子の働きが抑えられることが原因で、A20が足りない患者5人でも同様の特徴が見られた。成果は『Nature Immunology』に掲載された。","\n【概要】米ペンシルベニア大学ペレルマン医学部の研究チームは、母親のおなかの中や生後早い時期に高脂肪の食事にさらされることが、免疫に長く続く弱さを残す可能性があると報告した。結果は主にマウスによるもので、人での観察も裏付けになっている。論文は『Nature Immunology』に掲載された。\n【背景】子どもの肥満は、インフルエンザや新型コロナなどの呼吸器のウイルスによる死亡や重症化のリスク要因として知られている。また、妊娠前や妊娠中の母親の過体重や肥満は、子どもの肥満のリスク要因でもある。しかし、母親の肥満、幼い時期の肥満、感染しやすさを結び付ける生物学的な仕組みははっきりしていなかった。\n【詳細】研究チームは、幼い時期の肥満のマウスのモデルを使った。肥満の幼いマウスでは、ウイルス感染に対する効果的な抗体の反応を生み、長く続く抗体の免疫を築く免疫細胞のタイプが不足していた。この不足は、ワクチンへの反応の弱さにも表れていた。直接の原因は、未熟なT細胞が「濾胞性ヘルパーT細胞（TFH細胞）」に成熟する力が落ち、代わりに炎症を起こしやすいT細胞が増えることだった。この異常は、未熟なT細胞が作り替えられ、酵素A20の遺伝子の働きが抑えられることから生じていた。人とのつながりを探るため、研究チームはA20遺伝子の片方を失うまれな遺伝性の病気の患者5人の免疫細胞を調べた。A20の量が正常な子どもと大人と比べると、患者では血液中のTFH細胞が大きく不足しており、肥満の幼いマウスとよく似ていた。\n【ポイント・注意点】共同責任著者のホルヘ・エナオ＝メヒア教授は、母親や生後早い時期の食事が、育ちつつあるT細胞を長く作り替える環境の信号になりうると述べた。小児科のサラ・ヘンリクソン助教は、高脂肪の食事が免疫を作り替え、子どもを感染しやすくする、幼い時期の重要な期間があることが分かったと話す。記事は、適切に設計された薬でこの弱さを戻せる可能性も示唆している。ただし主な証拠はマウスのもので、人での食事の影響は確かめられていない。","2026-11-16","Medical Xpress","https://medicalxpress.com/news/2026-11-early-life-exposure-obesity-term.html"]]};

const OLD_CUT="2026-11-07";
function isOld(d){return d<OLD_CUT}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
/* ===== 項目（ジャンル）はデータ駆動：CATS／DATAに足すだけで自動で増えます ===== */
const extraCats=[];
function allCats(){
  const list=CATS.slice();
  Object.keys(DATA).forEach(id=>{ if(!list.some(c=>c.id===id)) list.push({id:id,name:id,desc:"追加された項目",img:"hero"}); });
  extraCats.forEach(c=>{ if(!list.some(x=>x.id===c.id)) list.push(c); });
  return list;
}
let cats=allCats();
let catIdx=0;
const artIdxMap={};
function itemsOf(c){return (DATA[c.id]||[]).map((a,i)=>({a:a,oi:i})).sort((x,y)=>y.a[3].localeCompare(x.a[3]))}
function curCat(){return cats[catIdx]}
function curItems(){return itemsOf(curCat())}
function curArtIdx(){const n=curItems().length;if(!n)return 0;let i=artIdxMap[curCat().id]||0;if(i>=n)i=n-1;if(i<0)i=0;return i}
function renderStage(dir){
  cats=allCats(); if(catIdx>=cats.length)catIdx=cats.length-1; if(catIdx<0)catIdx=0;
  const c=curCat(), items=curItems(), ai=curArtIdx();
  const total=cats.reduce((s,x)=>s+(DATA[x.id]||[]).length,0);
  document.getElementById('heroText').innerHTML="<b>今日のまとめ — 全"+cats.length+"ジャンル・"+total+"件。</b> タイトルと概要は日本語、カードの「和訳全文を読む」で全文が開きます。新しい順に並べ、48時間より古い記事はグレー表示です。";
  document.getElementById('catName').textContent=c.name;
  document.getElementById('catDesc').textContent=c.desc||"";
  document.getElementById('catCount').textContent="ジャンル "+(catIdx+1)+" / "+cats.length;
  document.getElementById('catDots').innerHTML=cats.map((x,i)=>'<button class="dot'+(i===catIdx?' active':'')+'" data-cat="'+i+'" aria-label="'+x.name+'へ移動"></button>').join('');
  document.querySelectorAll('#catDots .dot').forEach(d=>{d.onclick=()=>{const n=+d.dataset.cat; if(n!==catIdx){const dd=n>catIdx?'down':'up'; catIdx=n; renderStage(dd);}}});
      const slot=document.getElementById('cardSlot');
  if(!items.length){
    slot.innerHTML='<article class="card"><div class="empty"><div class="big">✦</div><p><b>'+c.name+'</b> は追加されたばかりの項目で、まだ記事がありません。</p><p>毎日の更新でこの項目の記事が集まると、ここに表示されます。<br>上スワイプで他のジャンルへ移動できます。</p></div></article>';
    document.getElementById('artDots').innerHTML=""; document.getElementById('artCount').textContent="0 / 0"; return;
  }
  const it=items[ai], a=it.a, old=isOld(a[3]);
  slot.innerHTML='<article class="card'+(old?' old':'')+(dir?' anim-'+dir:'')+'">'
    +'<img class="ph" src="'+IMGS[c.img]+'" alt="'+c.name+'のイメージイラスト">'
    +'<div class="cbody"><div class="meta"><span class="badge'+(old?' oldb':'')+'">'+(old?'少し前':'NEW')+'</span><span>'+a[3]+'</span><span>'+(ai+1)+' / '+items.length+'</span></div>'
    +'<h3>'+a[0]+'</h3><p class="sum">'+a[1]+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="openArticle(\''+c.id+'\','+it.oi+')">和訳全文を読む</button>'
    +'<button class="btn ghost" onclick="quickMemo(\''+c.id+'\','+it.oi+',this)">メモ保存</button>'
    +'<button class="btn ghost" onclick="shareArticle(\''+c.id+'\','+it.oi+')">共有</button></div>'
    +'<div class="src">出典：'+a[4]+'<br><a href="'+a[5]+'" target="_blank" rel="noopener">原文を開く</a></div></div></article>';
  document.getElementById('artDots').innerHTML=items.map((x,i)=>'<span class="dot'+(i===ai?' active':'')+'"></span>').join('');
  document.getElementById('artCount').textContent="記事 "+(ai+1)+" / "+items.length;
  requestAnimationFrame(fitCard);
}

function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;
  const sum=card.querySelector('.sum'), h3=card.querySelector('h3'), ph=card.querySelector('.ph');
  let ss=14, hs=Math.min(21, Math.max(17, window.innerWidth*0.044)), phh=ph?Math.round(ph.getBoundingClientRect().height):0; const ph0=phh;
  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }
    if(hs>13){ hs-=0.5; if(h3) h3.style.fontSize=hs+'px'; continue; }
    break;
  }
}
window.addEventListener('resize', fitCard);
function nextArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i>=n-1)return;artIdxMap[curCat().id]=i+1;renderStage('next')}
function prevArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i<=0)return;artIdxMap[curCat().id]=i-1;renderStage('prev')}
function nextCat(){if(catIdx>=cats.length-1)return;catIdx++;renderStage('down')}
function prevCat(){if(catIdx<=0)return;catIdx--;renderStage('up')}
/* ===== スワイプ操作（スクロールではなくスワイプで移動） ===== */
const stage=document.getElementById('stage');
let sx=null, sy=null, swipedAt=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;
  swipedAt=Date.now();
  if(Math.abs(dx)>Math.abs(dy)){ dx<0?nextArt():prevArt(); } else { dy<0?nextCat():prevCat(); }
});
stage.addEventListener('click',e=>{ if(Date.now()-swipedAt<120){e.stopPropagation();e.preventDefault();} },true);
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')nextArt(); else if(e.key==='ArrowLeft')prevArt();
  else if(e.key==='ArrowDown'){e.preventDefault();nextCat();} else if(e.key==='ArrowUp'){e.preventDefault();prevCat();}
});
/* ===== 項目の追加 ===== */
document.getElementById('addCatBtn').onclick=()=>{document.getElementById('newCatName').value="";document.getElementById('newCatDesc').value="";document.getElementById('addDlg').showModal()};
document.getElementById('addCatSave').onclick=()=>{
  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast("項目名を入力してください");return}
  const desc=document.getElementById('newCatDesc').value.trim()||"追加された項目";
  const id='custom-'+Date.now();
  extraCats.push({id:id,name:name,desc:desc,img:'hero'}); DATA[id]=[];
  cats=allCats(); catIdx=cats.length-1;
  document.getElementById('addDlg').close(); renderStage('down');
  toast("項目「"+name+"」を追加しました");
};
/* ===== 記事ダイアログ・メモ・共有 ===== */
function openArticle(cat,idx){
const c=allCats().find(x=>x.id==cat); const a=DATA[cat][idx];
document.getElementById('dlgIn').innerHTML=`<img src="${IMGS[c.img]}" alt=""><div class="meta" style="margin-top:10px"><span>${c.name}</span><span>${a[3]}</span></div><h3>${a[0]}</h3><p class="sum" style="font-size:14px">${a[1]}</p><div class="full">${a[2]}</div>
<p class="src" style="margin-top:12px">出典：${a[4]} — <a href="${a[5]}" target="_blank" rel="noopener">${a[5]}</a></p>
<div class="memoBox"><label style="font-weight:800;font-size:14px">ひとことメモ</label><textarea id="memoText" placeholder="気づいたこと、作りたいもの、家族への共有メモなど"></textarea>
<div class="actions"><button class="btn primary" onclick="saveMemo('${cat}',${idx})">このメモを保存</button><button class="btn ghost" onclick="shareArticle('${cat}',${idx})">iPhoneで共有</button><button class="btn ghost" onclick="document.getElementById('dlg').close()">閉じる</button></div></div>`;
document.getElementById('dlg').showModal();
}
function quickMemo(cat,idx,btn){const a=DATA[cat][idx];memos.unshift({cat,title:a[0],note:"",date:a[3]});updateMemoUI();btn.textContent="保存しました";btn.classList.add('saved');toast("メモに保存しました（このページを開いている間）")}
function saveMemo(cat,idx){const a=DATA[cat][idx];const note=document.getElementById('memoText').value.trim();memos.unshift({cat,title:a[0],note,date:a[3]});updateMemoUI();toast("メモを保存しました");document.getElementById('dlg').close()}
function updateMemoUI(){document.getElementById('memoCount').textContent=memos.length;const area=document.getElementById('memoList');
if(!memos.length){area.innerHTML='<p class="sum">まだメモがありません。記事の「メモ保存」をタップしてください。</p>';return}
area.innerHTML=memos.map(m=>`<div class="memoItem"><b style="font-size:14px">${m.title}</b><div style="font-size:13px;color:var(--muted)">${m.note||"（ひとことメモなし）"} ・ ${m.date}</div></div>`).join('')}
function exportMemos(){if(!memos.length){toast("まだメモがありません");return}const txt="MAI topic メモ — 2026-11-10\n\n"+memos.map((m,i)=>`${i+1}. ${m.title}\n${m.note||""}\n`).join("\n");const b=new Blob([txt],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="mai-topic-memo-2026-11-10.txt";a.click();URL.revokeObjectURL(u)}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}} try{await navigator.clipboard.writeText(text);toast("コピーしました — メモアプリなどに貼り付けできます")}catch(e){toast("共有できませんでした")}}
function shareArticle(cat,idx){const a=DATA[cat][idx];shareText(a[0],`${a[0]}\n\n${a[1]}\n\n出典：${a[4]} ${a[5]}`)}
function shareMemos(){if(!memos.length){toast("まだメモがありません");return}shareText("MAI topic メモ",memos.map(m=>`・${m.title} ${m.note}`).join("\n"))}
document.getElementById('sharePage').onclick=()=>shareText("MAI topic","MAI topic — 2026年11月22日朝版（全"+cats.length+"ジャンル）");
document.getElementById('memoBtn').onclick=()=>{updateMemoUI();document.getElementById('memoDlg').showModal()};
updateMemoUI();
renderStage();
</script>

<script>
try {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
} catch (e) {}
</script>
</body>
