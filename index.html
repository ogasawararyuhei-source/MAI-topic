【ポイント・注意点】\nローカルでは、ファイルがない場合は6秒後に終了コード4、3秒後にファイルが現れた場合はすぐに終了コード0で返ることを確かめています。ただし修正から1日未満のため、修正後のデータはまだなく、停止が消えたとは言えないと認めています。依頼文は文章による指示でフックではないため強制力がなく、親の「止まる前に確かめる」というルールが最後の防御線だとしています。","2026-11-22","DEV Community","https://dev.to/tomxiaoyz/my-review-subagents-said-waiting-for-the-notification-and-handed-back-11-of-21-did-it-and-the-5ee9"],["Claude Codeを持たない人が自分のセッションに話しかける方法","顧客や社内の非開発者が、作業中のClaude Codeセッションにブラウザだけで質問できるCLI「guestpass」の紹介。コマンド1つでCloudflareのquick tunnel経由の公開リンクができ、エージェントは待つ・答えるを繰り返す。動作を確かめたのはClaude Codeだけ。ゲストはエージェントができることを何でも頼めるため、パスワードの設定や共有する相手の選び方に注意が要る。リンクは起動のたびに変わり、PCがスリープすると無効になる。","\n【概要】\nClaude Codeを持たない顧客や社内の人が、手元のPCで動いている作業中のClaude Codeセッションに、ブラウザだけで質問できるようにするCLI「guestpass」を紹介する記事です。MITライセンスで公開されています。\n\n【背景】\n著者は、非開発者がエージェントに直接聞けるようにしたいと考えました。既存の方法はアプリのインストールやサインインを求めるため、相手の負担が大きいことが課題でした。\n\n【詳細】\n`npx guestpass start --password pick-one`を実行し、表示されたリンクを相手に送るだけで使えます。相手がブラウザで質問すると、回答はローカルのエージェントセッションから返ります。経路は、ゲストのブラウザ、Cloudflareのquick tunnel、PC上のGuestPass、エージェントのセッションの順です。ローカルのデーモンが1ページを提供し、quick tunnelで公開アドレスを得ます。Cloudflareのアカウントは不要で、cloudflaredは初回に自動でダウンロードされます。エージェント側は、メッセージを待って出力し終了する`guestpass wait`と、回答を投稿する`guestpass say`を繰り返します。Claude Codeでは、セッションの会話と現在の作業もページに表示されます。スキルやプラグインとして`npx skills add fengyiqicoder/guestpass`で入れられ、依存関係はなく、Node 18以上が必要です。\n\n【ポイント・注意点】\nエンドツーエンドで確かめたのはClaude Codeだけで、Codex、Gemini CLI、Cursor、OpenCodeは検出されるものの未テストです。ゲストはエージェントができること（ファイル、シェル、ログイン）を何でも頼めるため、`--password`を設定し、信頼できる相手にだけリンクを送るよう勧めています。ページは直近20件のメッセージを表示するため、キーを表示したセッションは共有しないこと。リンクは起動のたびに変わり、PCがスリープすると無効になります。手元のPCで動くセッションを外に開く道具なので、使う前に公開範囲をよく考える必要があります。読み取り専用や確認付きのモードは今後の予定です。","2026-11-22","DEV Community","https://dev.to/fengyiqicoder/how-i-let-people-without-claude-code-talk-to-my-claude-code-session-17pn"],["実行前チェックの確認が9,574件中916件から527件に減った","Claude CodeとGitHub Copilot CLIのシェルコマンドを実行前に判定するツール「guard」の作者が、自分の履歴9,574件を4つの版で判定し直し、確認を求めた件数の変化を測った。確認は916件から605件、539件、527件へ減り、拒否は97件から86件になった。減った内訳や、なお確認のまま残る例も示しており、結果は自分の履歴だけのものだと断っている。","\n【概要】\nClaude CodeとGitHub Copilot CLIが実行するシェルコマンドを、実行前に「拒否」「確認」「判断なし」のいずれかに振り分けるツール「guard」の作者が、版を上げたことで確認の件数がどう変わったかを測った報告です。\n\n【背景】\n無人や長時間の運用では、確認を求める回数が多いほど作業が止まりやすくなります。guardは判断なしの場合、ユーザーの権限設定に従います。作者は、判断の範囲を広げる版の変更が、確認（ask）の件数にどれだけ効いたかを確かめました。\n\n【詳細】\n作者自身のClaude Codeの履歴から、BashとPowerShellのコマンド9,574件を同じ集合として、0.4.13、0.4.14、0.4.15、0.4.16の4つの版で判定しました（2026年11月22日に測定）。確認は916件、605件、539件、527件と減り、拒否は97件、86件、86件、86件でした。0.4.13から0.4.14では、312件が確認から判断なしへ、10件が拒否から判断なしへ（すべて一時フォルダ内の削除）、1件が拒否から確認へ移りました。0.4.14から0.4.15では、引用されていない「==」などの未解析の構文67件が確認から判断なしへ移り、1件が判断なしから確認になりました。0.4.15から0.4.16では、$APPDATAや$LOCALAPPDATAを含む12件が確認から判断なしへ移り、Windowsで実際の値を読むようになりました。\n\n【ポイント・注意点】\n例として、「X=rm; $X -rf ~」は0.4.13では確認でしたが、0.4.14以降は拒否になりました。一方「C=\"rm -rf\"; $C ~」は4つの版すべてで確認のままです。作者は、結果は自分の履歴だけのもので他の人の代表ではないと述べ、読者にコマンド例の提供を求めています。測定は作者の指示のもとでAIエージェントが実行したと明記しており、ライセンスはFSL-1.1-ALv2です。","2026-11-22","DEV Community","https://dev.to/boxdawn/my-pre-run-check-for-claude-code-asked-on-916-of-9574-commands-from-my-history-three-releases-3bp6"],["無人で回す自動化を、Surface Laptop Ultraで組み直す構想","M1のMacでlaunchdの定時ジョブを48本動かす著者が、無人の自動化をSurface Laptop Ultra中心に組み直す構想をまとめた。判断とコード修正はClaude Code、公開する文はGemini、書き起こしはWhisperと分けている現状と、週の使用量に応じて止める仕組みを説明。取得・要約などをローカルのgpt-oss-120bに移す計画で、実装と計測はまだない。","\n【概要】\n手元のMacで定時ジョブを48本動かしている著者が、無人で回す自動化を、統合メモリ最大128GBのSurface Laptop Ultraを中心とした構成へ組み直す構想をまとめた記事です。実装や計測の結果はまだなく、計画の記録です。\n\n【背景】\n現状はApple M1・メモリ16GBのMacで、launchdによる定時ジョブを48本動かしています。判断とコード修正は月200ドルのMaxプランのClaude Codeに任せていますが、量の多い軽い仕事がクラウドの週ごとの枠と待ち時間を消費していることが課題です。\n\n【詳細】\nClaudeは起動前に週の使用量を確かめ、60%を超えたら上位モデルを止め、75%を超えたら期日のある仕事だけにし、85%を超えたら定期実行の起動を飛ばします。記事や投稿、台本などの公開する文はGeminiの定額枠に書かせ、待ち行列から10分おきに3本ずつ並列で流しています。深く考える設定では1本4〜10分、節が4〜6本の記事は15〜40分かかります。オーディオブックの音声はGeminiの有料読み上げAPIで作り、1回あたり約11円です。読み上げ音声の書き起こしはM1のMacでWhisper（mediumとsmallの2つ）を使い、282.7秒の音声で約4分かかっています。構想では、取得・要約・抽出を中心に、80GBのGPU1枚で動く大きさとして公開されたgpt-oss-120b（Apache 2.0）をローカルに置き、公開する文と判断はクラウドに残します。外に出したくない情報の処理も移す候補です。\n\n【ポイント・注意点】\n移したあとは、週の使用量、1本あたりの待ち時間、書き起こしの時間を同じ基準で測り、移す前より良くならなかった仕事はクラウドに戻すとしています。使用量のしきい値で段階的に止める仕組みは、連続稼働で枠を使い切らないための工夫として参考になります。ただし構想段階のため、効果はまだ確かめられておらず、ローカルに移す仕事の範囲も今後の計測しだいです。","2026-11-21","Zenn","https://zenn.dev/houchi_unyo/articles/surface-laptop-ultra-hybrid-plan"]],"cnc":[["AVTOKYO、LEDで光るロゴ基板の製造データをGitHubで公開","セキュリティイベントAVTOKYOが、ロゴの目が赤く光る「AVTOKYO 2026 Hackable Board」の設計データをGitHubで公開した。KiCad 10形式の回路図と基板データ、JLCPCB向けのガーバーと注文仕様、3Dプリント用の裏ぶたSTLまで入っている。ATtiny402を足してLEDを点滅させる改造の手順も付く。基板と製造データはCERN-OHL-P-2.0で公開され、基板の販売も認められている。","\n【概要】\nセキュリティイベントのAVTOKYOが、2個のLEDでロゴの目を赤く光らせる基板「AVTOKYO 2026 Hackable Board」の設計データをGitHubで公開した。FabSceneが2026年11月22日に報じた。AVTOKYOは2008年から一般向けに1日開催しているイベントで、2026年は11月21日に東京・渋谷で開かれた。\n\n【背景】\n基板はドット絵のAVTOKYOロゴの形で、外形は最大70×78.5mm。部品を付けずにチャームとして持ち歩くことも、LEDや回路を足して改造することもできる。基本構成は1kΩ抵抗2個、5mm赤色LED2個、CR2032電池ホルダー、スライドスイッチで、スイッチを入れると目が光る。部品表には部品を特定するための秋月電子通商の商品ページが載っている。\n\n【詳細】\nソフトで点滅させたい場合は、マイコンATtiny402と0.22µFのコンデンサーを追加する。ジャンパーJP1とJP2の細い銅パターンを切り、もう一方の端子をマイコン側にはんだ付けする。付属のサンプルはArduino IDEで書かれ、UPDIライターで書き込む。目が1秒光って2秒消える動作を繰り返す。\n製造データはJLCPCBへの発注用に整えてあり、ガーバーのZIP、層数や板厚などの注文仕様、裏面にシリアル番号を印刷する手順が入っている。回路図と基板はKiCad 10形式で、3Dプリンター用の裏ぶたSTLも同梱される。\n\n【ポイント・注意点】\nライセンスは、基板・製造データ・ケースがCERN-OHL-P-2.0、ファームウェアがMIT、文書がCC BY 4.0で、この条件の下で基板を販売してもよい。ただしAVTOKYOの名前とロゴは対象外で、公開したままのこの基板にロゴを使うのは認めるが、ほかの品物に使うには主催者の許可が要る。運営側は、最終版Rev Mを実際に組み立てて書き込んだ確認の記録は残していないと明記している。発注する人は、この点を承知したうえで試作するのがよい。","2026-11-22","FabScene","https://fabscene.com/new/make/avtokyo-2026-hackable-board-led-charm-kicad/"],["日本電子、電子ビーム式の金属3Dプリンター新機種を発表","電子顕微鏡の日本電子（JEOL）が、電子ビームで金属粉末を溶かして造形する3Dプリンターの新機種「JAM-5200EBMPlus」を2026年11月16日に発表した。1本のビームを高速で動かして多数の点を同時に溶かす「マルチドットスキャン」を新たに載せ、材料ごとに造形ユニットを分けた。標準ユニットの造形範囲は直径250×高さ400mm。価格と発売日はまだ公表されていない。","\n【概要】\n電子顕微鏡メーカーの日本電子（JEOL）は2026年11月16日、電子ビームで金属粉末を溶かして部品を造る金属3Dプリンターの新機種「JAM-5200EBMPlus」を発表した。FabSceneが11月21日に報じた。従来機JAM-5200EBMの新型で、金属材料ごとに造形ユニットを分けたことと、新機能「マルチドットスキャン」が主な変更点だ。価格と発売日は公表されていない。\n\n【背景】\n同社によると、航空宇宙、自動車、エネルギー、医療の分野で、金属3Dプリンターの用途は試作から最終製品の製造へ移りつつある。量産で使う側は、造形品質の安定と、より厳しい品質保証や工程管理を求めている。そこで日本電子は、電子顕微鏡や半導体向け電子ビーム描画装置で培ったビーム制御の技術を生かしたという。\n\n【詳細】\n電子ビーム方式では、造形の前に粉末をビームで予熱するため急な温度変化が小さく、部品が反ったり割れたりしにくい。周りの粉末が半ば焼結して部品を支えるのでサポート構造を減らせ、高真空中で造形するため酸化や汚れも抑えられる。\nマルチドットスキャンは、1本のビームを非常に速く多数の位置へ動かし、多くの点を同時に溶かす。入熱を細かく調整でき、金属組織や、下に支えのない張り出し部分の表面が良くなるという。オプションのBSEモニタリングも強化された。反射電子を捉えて層ごとの空洞や形状を画像にするため、造形後のX線CT検査を待たずに欠陥を見つけられる。\n造形ユニットは4種類ある。標準ユニットの造形範囲は直径250×高さ400mm。タングステンのような高融点金属向けの超高温ユニットは、造形面を最高1600℃まで予熱する。少量の粉末で試せる小型の実験用ユニットは、高価な材料の研究開発に向く。\n\n【ポイント・注意点】\n電子ビームを出すカソードは、電子光学系の改良で長寿命化と高出力化が図られた。切削のCNCとは別の付加製造の装置だが、層ごとに撮影して欠陥を見つける品質管理の考え方は、加工データを残して検証する流れと重なる。ただ価格や発売時期は未定のため、導入を考える場合はメーカーのプレスリリースで続報を確かめたい。","2026-11-21","FabScene","https://fabscene.com/new/news/jeol-jam-5200ebmplus-electron-beam-metal-3d-printer/"],["フィジカルAIを阻む製造データの溝、VulcanForms CTOが寄稿","The Robot Reportに、金属AMのVulcanForms CTOのマイク・ケンワージー氏が寄稿した。ロボットが工場で自ら学ぶには、加工条件と品質の結果を結び付けたデータが必要だが、多くの工場はそれを用意できていないと指摘する。調査では、データの相互運用性の欠如を大きな障壁に挙げた製造業者が37％で、2025年の22％から増えた。準備の手順として3つを示している。","\n【概要】\nロボット専門メディアThe Robot Reportに2026年11月21日、金属付加製造のVulcanFormsでCTOを務めるマイク・ケンワージー氏の寄稿が載った。ロボットやフィジカルAIの企業は2026年に入ってすでに約480億ドルを調達したが、工場で完全に自律して動く機械は約束されたものではないと論じている。理由は、ロボットが現場で学ぶための実データを、多くの工場が用意できていないことだ。\n\n【背景】\n筆者が挙げる例は溶接だ。ロボットが自分で腕を上げるには、溶接角度、送り速度、ワークの位置などの条件が仕上がりにどう効くかを理解しなければならない。熟練の技術者はこの勘所を何年もかけて身に付けるが、その多くはロボット側が使える形で記録されていない。経験で調整し、きちんと文書にしていない工程はほかにもある。\n\n【詳細】\n工場は大量の運転データを集めているが、多くは自律学習向けに整理されておらず、集めたまま誰も見ていないものもある。機械が運転条件を記録し、検査結果は品質管理システムにあるといった具合に情報が分かれ、工程の判断と部品品質を結び付けにくい。製造業の団体Manufacturing Leadership Councilの2026年調査では、データの相互運用性の欠如を大きな障壁に挙げた回答が37％で、2025年の22％から増えた。\n筆者が示す準備は3段階だ。1つ目は実際の生産条件を反映したデータを集めること。2つ目は生産条件、検査結果、完成品の品質を一続きにつなぐデジタルスレッドを作ること。部品の識別子をそろえ、対象を1つに絞って始めるよう勧める。3つ目は品質と再現性を軸にフィードバックの仕組みを作り、人が見るべき場面と許容範囲を前もって決めることだ。\n\n【ポイント・注意点】\n筆者は、パラメーターを変えられても結果の品質を評価できないシステムは、単独で判断する段階にないと書く。工程と検査の記録がつながっていない現場では、機械データを新たに集めるより、手持ちの記録を検査結果と結び付ける方が効果が大きい場合があるという。これは装置メーカー幹部の意見記事で、自社製品の宣伝は本文に含まれていない。","2026-11-21","The Robot Report","https://www.therobotreport.com/the-manufacturing-data-gap-holding-back-physical-ai/"],["大理石彫刻ロボの工具経路づくりを自動化、米Monumental Labs","米ブルックリンの石彫スタジオMonumental Labsが、大理石を削るロボットの工具経路を、手作業なしで作るシステムを開発した。彫刻の3Dモデルと石材のデータを入れると、刃の経路と向きを数百万点の単位で計算し、削る前にシミュレーションする。これまでは作品ごとにPowerMillで経路を手で組み、数週間から数カ月かかっていた。ロボットにはKUKA KR240を使う。","\n【概要】\n米ニューヨーク・ブルックリンで石の彫刻や建築装飾を手掛けるMonumental Labsが、大理石を彫るロボットの工具経路を自動で作るシステムを開発した。FabSceneが2026年11月20日に報じた。彫刻の3Dモデルと石のブロックのデータを入力すると、刃の経路と向きを数百万点の単位で計算し、削る前にシミュレーションする。同社で経路の自動化を担当するエレノア・ウィースラー氏がニューヨークのイベントで発表した。\n\n【背景】\n同社はロボットで石を荒削りし、職人が手で仕上げる方法で、ニューヨークの歴史的建築の装飾の修復や等身大の人物像を作ってきた。これまでは作品ごとに、金型やエンジン部品向けに作られたCAM「Autodesk PowerMill」で経路を手で組んでいて、1点に数週間から数カ月かかっていた。工業部品は同じ経路を何千回も使い回せるが、彫刻は1点ごとに形が違う。手作業の経路づくりが規模拡大の壁になっていたと同氏は説明する。\n\n【詳細】\nシステムは石材を小さな立方体（ボクセル）の集まりとして扱い、荒削りと仕上げで計算を分ける。荒削りは上から層ごとに削り、耳やあごの下のように真上から刃が届かない所は傾いた面に沿って削る。仕上げでは残った石を何層かに分け、各層を1つの刃の向きで削れる領域へ自動で分割する。領域の中の経路は、表面に沿った等距離線をたどる。各点では、刃と石とロボットがぶつからない工具の向きと関節角を計算する。\nロボットは産業用のKUKA KR240。デモでは1つのブロックからシルクハットを彫り、続けて同じブロックから、CGの研究で昔から使われる試験モデル「スタンフォード・バニー」を彫り出した。\n\n【ポイント・注意点】\nロボットで彫った後も、表面の仕上げは職人が手で続ける方針だ。同社のWebサイトによると、2023年7月にロボット1台と石工1人で始め、今はデザイナーや彫刻家、技術者など26人の体制になった。ソフトとハードで石の加工を段階的に自動化し、コストを最大90％下げることを目指している。記事の元は同氏の10月6日付の個人ブログで、FabSceneは同社サイトに関連のプレスリリースを見つけられなかったと注記している。","2026-11-20","FabScene","https://fabscene.com/new/news/monumental-labs-autonomous-toolpathing-robotic-marble-carving/"],["Revopoint、6方式の3Dスキャナー「MIRACO 2」をクラファン","3DスキャナーのRevopointが、青色レーザー3方式と近赤外線3方式を1台にまとめたハンディ機「MIRACO 2」のKickstarterを2026年11月18日（米国時間）に始めた。画面とバッテリーを内蔵し、PCなしで撮って確かめられる。最安の早期支援は1494ドル（約24万円）で、2027年1月に発送する予定。精度は複数ライン方式で1回あたり最大0.02mm。STEP形式などで書き出せる。","\n【概要】\n3DスキャナーメーカーのRevopointは、6つのスキャン方式を1台にまとめたハンディ型3Dスキャナー「MIRACO 2」のKickstarterを、2026年11月18日（米国時間）に始めた。FabSceneが11月20日に報じた。画面とバッテリーを内蔵し、PCがなくても撮影と確認ができる。最安の早期支援は、メモリー16GB・ストレージ256GBの構成で1494ドル（約24万円）。通常価格より805ドル（約13万円）安いという。発送は2027年1月の予定。\n\n【背景】\n3Dスキャナーで実物の形を取り込むと、リバースエンジニアリング、寸法検査、金型の補修、3Dプリントといった用途で、CADや加工のデータ作りにつなげられる。対象物の色や素材、大きさによって向く方式が違うため、複数の方式を1台に収めたのが本機の特徴だ。\n\n【詳細】\n方式は青色レーザーが3つ（34本の交差、15本の平行、1本）、近赤外線が3つ（全面投影、VCSELの点パターン、組み合わせ）。組み合わせモードは毎秒最大1000万点を取り込む。黒い物や光る金属には34本、深い穴や溝には1本、人や中〜大型の物には赤外線が勧められている。精度は複数ライン方式で1回あたり最大0.02mm、測れる最小の物は10×10×10mm。別売キットを使うと、本体の2つのカメラで写真測量ができ、最大5×5×5mの物を測れるという。\n本体は6インチの有機ELタッチ画面を備え、重さ960g、内蔵バッテリーは1万mAhで約3時間使える。重い処理は、USB-Cで接続したPCの無料ソフト「Revo Scan 6」が受け持つ。NVIDIAのGPUがあれば、複数ライン方式で最大120fpsになる。書き出しはSTL、3MF、STEPなどに対応する。\n\n【ポイント・注意点】\nマーカーなしのスキャンはPC接続時だけ使える。屋外では、VCSEL方式が10万lux未満、レーザー方式が5万luxまでで使える。上位の32GB・512GB構成の早期価格は1949ドル（約31万円）で、どちらの構成にも2年保証が付く。支援の受付は2027年1月8日まで。一部の性能値やソフトの機能は最終試験の後に変わる可能性があると記事は断っており、クラウドファンディングの性質上、届く時期や仕様の変更にも注意したい。","2026-11-20","FabScene","https://fabscene.com/new/news/revopoint-miraco-2-six-scan-modes-standalone-3d-scanner-kickstarter/"],["三菱電機、CNC工作機械と人型ロボの連携を実演　新ブランド後編","MONOistが三菱電機の新FAブランド「Serendie Automation」の技術展示を後編で伝えた。11月18日の「FA Serendie Days」では、CNC工作機械とヒューマノイドを連携させ、加工機へのテンディング作業を自動で行って無人で連続加工するデモが披露された。尾張旭工場では2026年度からヒューマノイドの実証を始めている。3台のカメラでロボットの位置をμm単位で補正するRaaSのアプリも紹介された。","\n【概要】\n三菱電機は2026年11月18日に「FA Serendie Days」を開き、FA向けの新しい統合ソリューションブランド「Serendie Automation（セレンディオートメーション）」を発表した。MONOistは11月20日の後編で、会場の技術展示を紹介した。前編は、FAシステム事業本部長の都築貴之氏の基調講演とインタビューを扱っていた。\n\n【背景】\n展示で特に注目されたのは、ヒューマノイドなどフィジカルAIに関わるものだった。Serendie Automationのモデル工場として実証を重ねる尾張旭工場では、2026年度から、人の作業をヒューマノイドに代わらせる実証を始めている。会場では、画像から把持の動作を作り出し、AIと既存の制御で一連の作業をこなす実証の様子を紹介した。\n\n【詳細】\nヒューマノイド本体は他社製品だ。担当者は、制御技術との組み合わせや安全機能は三菱電機のノウハウだが、自社でヒューマノイドを出す予定は今のところなく、さまざまな機種から最適なものを選んで実証するとしている。CNC工作機械とヒューマノイドを連携させ、加工機へのテンディング作業などを自動で行い、無人で連続加工できるようにするデモも披露した。\nロボットを買い切りでなくサービスとして提供するRobotics as a Service（RaaS）も紹介された。技術者がつきっきりで調整しなくても早く作業ラインを立ち上げられるよう、制御プログラムなどをアプリとしてパッケージ化して提供する。会場では、3台のカメラの画像を使い、精密な位置決め条件を設定しなくても自分で補正するデモがあった。事前に高精度な調整をしなくても、リアルタイムでμm単位の位置補正ができるという。この自律補正アプリはSDKで提供する。\n\n【ポイント・注意点】\n自律補正は今のところルールベースの画像認識で行っている。担当者は、フィジカルAIを使えばもっと柔軟な仕組みを作れると話している。工作機械の段取りや材料の出し入れを人型ロボットに任せる構想は、人手不足の現場には魅力がある。ただ、どれもまだ実証の段階で、量産の現場で使える時期は示されていない。記事は2ページ構成で、センサー技術の強化は2ページ目で扱われている。","2026-11-20","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/20/news045.html"],["Beckhoff、PC制御40年の歩みとTwinCATのAI機能","MachineToolNews.aiが、独Beckhoffの40年にわたるPC制御の歩みと、今のAI製品とのつながりを整理した。1986年に二重留め切り鋸向けの初のPC制御を納め、1996年にTwinCAT、2003年にEtherCATを出した。同じ基盤の上に、自然言語でPLCのプログラミングを助けるTwinCAT 3 CoAgentや、制御の中で学習モデルを動かす機能など4つのAI製品がある。","\n【概要】\n工作機械とAIの専門メディアMachineToolNews.aiは2026年11月20日、ドイツBeckhoffのPC制御40年の歩みと、それがいまの産業AIにどうつながっているかをまとめた記事を載せた。もとになったのは同社の40周年記事「40 years of PC-based control: A revolution on the shop floor」だ。\n\n【背景】\n同社は1986年、二重留め切り鋸に初めてのPC制御システムを納めた。その後、1989年に「Lightbus」、1995年に「Bus Terminal」、1996年にPC上でPLCとモーション制御を実時間で動かす「TwinCAT」を出した。2003年にEtherCAT、2012年に搬送システムXTS、2018年に磁気浮上のXPlanar、2021年にMX-Systemが続く。\n\n【詳細】\n記事によると、この基盤の上に4つのAI製品がある。「TwinCAT 3 CoAgent for Engineering」は、PLCのプログラミング、I/Oの設定、HMIの開発を支援する。技術者がふだんの言葉で要件を書くと、プロジェクトの文脈を踏まえた提案を返し、Beckhoffの文書も参照する。「CoAgent for Operations」は保守担当者向けで、設定された運転データ、ログや工程値の分析、トラブル対応の提案を扱う。チャット画面はTwinCAT HMIに組み込める。質問の例は「この機械が止まる前に何が変わったか」だ。「TwinCAT Machine Learning」は、学習済みのモデルを実時間の制御環境の中で動かす。重い処理にはGPU対応のサーバー型もある。「Machine Learning Creator」はモデルの作成と学習の一部を自動化し、画像や時系列データに対応する。分類、異常検知、予測に使える。\n\n【ポイント・注意点】\n価格やライセンス費用、効果の実測値は書かれていない。編集部の分析は、技術工数、故障調査の時間、検知の精度や誤報の数など、測れる課題から始めるよう勧めている。既存の機械で使えるかは、コントローラー、TwinCATの版、計算能力、データへのアクセス、ライセンスで決まる。Beckhoffの部品を使っているだけでは導入の準備ができているとは言えない、と注意している。","2026-11-20","MachineToolNews.ai","https://machinetoolnews.ai/beckhoff-pc-based-control-industrial-ai/"],["Flexxbotics、産業AIで改善策を示す「Prescriptive Optimization」","自律製造プラットフォームの米Flexxboticsが、産業AIで隠れた生産能力を見つけ、問題を予測して改善策を示す新機能「Prescriptive Optimization」を発表した。設備、生産、工程の3層の文脈でデータを整理し、使うAIモデルは利用者が選べる。航空宇宙の精密加工の例では、手直しと不良が40％、計画外停止が25％減ったという。対応する装置は1000機種を超える。","\n【概要】\n自律製造プラットフォームを手がける米Flexxboticsは、新しいアプリの選択肢「Prescriptive Optimization」を発表した。産業AIで隠れた生産能力を見つけ、生産上の問題を予測し、性能を上げる手を提案する。発表のデートラインは2026年11月17日（ボストン）で、Today's Machining Worldが11月20日に掲載した。同社によると、独自のノウハウと知的財産を守りながら、AIの提案を統制し監督できるという。\n\n【背景】\n同社は、従来のIIoTはダッシュボード用の設備監視が中心で、産業AIを効かせるには生産全体の理解が要ると主張する。そのため、3層の「Industrial Data Context Stack」を掲げる。設備の文脈は、機械の状態やコントローラーの変数など、プロトコル単位の細かいデータ。生産の文脈は、それを作業指示、製品、工程、工具、仕様、品質結果に結び付ける。工程の文脈は、製品ごとの平常時のふるまいと変数の関係、逸脱のしきい値をまとめたプロファイルだ。\n\n【詳細】\n新機能は4つのソリューションのどれにも追加できる。ソリューションは、ばらばらの機械や検査装置からデータを集める接続、生産量やサイクルタイムや停止を記録する追跡、生産中のデータから基準を作る工程の特性化、人の承認の下でばらつきを先回りして補正する自律工程制御の4つで、単独でも組み合わせても使える。用途には設備停止の予測、品質不良の防止、工程のずれの検知、切削工具の寿命延長が挙がる。AIモデルは持ち込み（BYOM）に対応し、好みの大規模言語モデルや、構内やネット遮断環境で動かすオープンウェイトのモデルも使える。対応する装置は1000機種を超える。\n\n【ポイント・注意点】\n同社によると、AIが出す洞察と生産を動かす権限は構造的に切り離されている。航空宇宙の精密加工の例では、手直しと不良が40％、計画外停止が25％減り、受注できる能力が20％増えたという。ただ、これは自社の発表で、顧客名は出ていない。CTOのタイラー・モデルスキー氏は、目標や変数の範囲を数日から数週間で決められると話している。","2026-11-20","Today's Machining World","https://todaysmachiningworld.com/industry_news/46355/"],["AIと開発した無料CAD「SolidCraft」、6週間で190万DL","FabSceneが、オープンソースの3D CAD「SolidCraft」が急成長した理由を解説するYouTube動画を公開した。米ミシガン州の開発者ブレネン・ハーブラック氏が2026年10月に公開したツールで、11月19日時点で、公開から約6週間でGitHubからのダウンロードが約190万回に達した。開発の多くをAIと進め、1カ月ほどで計算の中核であるカーネルも入れ替えたという。","\n【概要】\nものづくりメディアのFabSceneは2026年11月20日、YouTube動画「SolidCraftが急成長した理由」を公開したと告知した。SolidCraftは、米ミシガン州の開発者ブレネン・ハーブラック氏が2026年10月に公開したオープンソースの3D CADだ。告知によると、11月19日時点で、公開から約6週間でGitHubからのダウンロードが約190万回に達した。\n\n【背景】\n3D CADは、CNCで削る部品や3Dプリントする部品のデータを作る出発点になる道具だ。従来、本格的なCADを一から作るには大きなチームと長い年月が要るとされてきた。SolidCraftは、開発の多くをAIと一緒に進めた点で注目を集めている。個人開発者がAIを使ってどこまでの速さで道具を作れるかを示す例と言える。\n\n【詳細】\n告知によると、GitHubに最初の記録が残ってから2日後には、正式な版のリリースが62回に上っていた。公開から1カ月ほどの間に、形の計算を受け持つ中核の「カーネル」も入れ替えている。動画は、ハーブラック氏への文面インタビューと、AIモデルのClaudeに文章の指示だけでスマートフォンスタンドを設計させたデモを素材にしている。FabSceneは11月14日付で、関連するインタビュー記事も出している。\nCADの文脈でAIが話題になるとき、多くはCADの中でAIが形を作る機能を指す。SolidCraftでは、AIはCADそのものを作る側と、CADで形を作る側の両方に関わっている。\n\n【ポイント・注意点】\n告知ページは短く、機能の一覧、動作環境、ライセンスの詳細はない。ダウンロード数はGitHubからの数で、実際に使っている人の数とは違う。入れ替えの速さは、開発の勢いを示す一方で、データの互換性や安定性がまだ固まっていない可能性もうかがわせる。加工用のデータを作る道具として使うなら、書き出せる形式や寸法の精度を、自分の用途で確かめてから取り入れたい。詳しい経緯は、11月14日のインタビュー記事と動画で確かめられる。","2026-11-20","FabScene","https://fabscene.com/new/infomation/youtube-solidcraft-ai-cad/"],["ロックウェル、制御プログラムをAIが作る「FactoryTalk Conductor」","米Rockwell Automationが年次イベント「Automation Fair 2026」（11月16〜19日、ボストン）で、産業オートメーション向けのAIネイティブな指揮プラットフォーム「FactoryTalk Conductor」を発表した。自然言語で指示すると、配下のAIエージェントが制御プログラムやHMIの画面を作る。CEOのモレット氏は「AIの最大の役割は複雑さを簡素化すること」と述べた。","\n【概要】\n米Rockwell Automation（ロックウェル）は、年次イベント「Automation Fair 2026」（2026年11月16〜19日、現地時間、ボストン）の2日目の基調講演で、産業オートメーション向けのAIネイティブなオーケストレーションプラットフォーム「FactoryTalk Conductor」を発表した。MONOistが11月19日に報じた。オペレーターが自然言語で指示すると、配下のAIエージェントがさまざまなAIモデルや同社の既存製品を使い、制御プログラムやHMIの操作画面を作る。設計から運用、保守まで全体でAIを使えるようになるという。\n\n【背景】\n会長兼CEOのブレイク・モレット氏は、製造業は食品、医薬品、エネルギー、輸送など生活の土台を支える一方、コスト、安全性、機能性に加えて外部環境の急な変化にも対応を迫られていると指摘した。そのうえで、オペレーターが技術と楽に対話し、リスクを抑えて早く立ち上げ、計画外の停止を減らせるようにすることが最大の課題だとし、「AIの最大の役割は、この複雑性を簡素化することにある」と述べた。\n\n【詳細】\n同社は自社とパートナーの技術を自社工場で先に試している。シンガポール工場は2026年、世界経済フォーラムの「Global Lighthouse Network」に認定された。モレット氏によると、この工場では従業員1人当たりの生産性が30％以上上がり、業務に慣れるまでの期間が60％短くなった。\n米ウィスコンシン州ニューバーリンには、敷地約10万m²の新工場を建てる計画で、2027年初めに着工する。モレット氏は、単一の工場として同社で最大かつ最先端になると語った。鉱山大手BHPとは、採掘や精錬から物流までの意思決定を続けて調整する枠組みを共同で設計している。\n\n【ポイント・注意点】\nCNCの加工プログラムそのものではないが、ラインの制御プログラムやHMIの画面を言葉の指示からAIが作るという流れは、三菱電機など国内勢の方向とも重なる。生成された制御コードを誰がどう検証するかが、現場では要になる。提供開始の時期や価格は、この記事の1ページ目には書かれていない。記事は2ページ構成で、「自動化から自律化へ」の議論は2ページ目にある。","2026-11-19","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/19/news026.html"],["Mastercam 2027、AIのCopilotや多軸加工の強化を打ち出す","MTDCNCが、CAD/CAMの次版「Mastercam 2027」で打ち出す機能を伝えた。多軸加工の強化、より強力なバリ取りツール、AIで操作を助けるMastercam Copilot、EverPath Technologyのリアルタイム工具経路の先行公開が柱になる。複雑な部品のプログラミングを、品質や精度を損なわずに効率化するとうたう。投資額や導入実績などの数値は示されていない。","\n【概要】\n工作機械の動画メディアMTDCNCは2026年11月19日、CAD/CAMソフトの次版「Mastercam 2027」で同社が打ち出す機能を伝えた。複雑な部品を、品質、精度、制御を損なわずに効率よくプログラミングする手段として位置付けている。情報のもとは、MastercamのLinkedInへの投稿だと記事は説明している。\n\n【背景】\n記事によると、製造業はプログラミングや段取りの時間を短くし、完成品をより早く出荷するよう、絶えず迫られている。CAMソフトの世界でも、工具経路を作る手間をAIで減らす動きが広がっている。Mastercamは前の版から、AIの支援機能「Mastercam Copilot」を載せてきた。\n\n【詳細】\nMastercam 2027で挙げられている柱は4つだ。1つ目は多軸加工の機能の強化。2つ目は、より強力になったバリ取りツール。3つ目はMastercam CopilotによるAIの支援で、プログラミングの作業をより賢く進めるための手段として示されている。4つ目は、EverPath Technologyのリアルタイムの工具経路の体験を初めて見せることだ。\nMastercamは、これらの開発が、複雑な加工の制御を手放さないまま、将来の生産の要求に備える助けになるとしている。多軸、バリ取り、AI、リアルタイムの工具経路について詳しくは、同社のブログ記事を読むよう案内している。\n\n【ポイント・注意点】\n記事は、この投稿で明かされていない点も明記している。投資額、運用の成果、顧客名、対象の業種、稼働時間などは示されていない。ページには製品の詳しい仕様、価格、提供時期もない。Copilotについては、MachineToolNews.aiの11月18日の記事が、同社エンジニアへのインタビューでできることと限界を詳しく伝えている。リアルタイムの工具経路がどの程度の速さで、どんな加工に効くのかは、ブログや今後の公開情報で確かめる必要がある。導入を考える工場は、今使っている版からの移行の条件や、ポストプロセッサーの互換性も合わせて確認しておきたい。","2026-11-19","MTDCNC","https://mtdcnc.com/news/mastercam-uk/mastercam-2027-targets-faster-smarter-part-programming"],["Mastercam Copilotは何ができるか、開発側に聞く対話型CNC","MachineToolNews.aiが、Mastercamのシニアアプリケーションエンジニアのジェシー・トリンケ氏に、AI機能「Mastercam Copilot」を聞いた。自然言語の指示で機械グループと加工工程を作り、確認のうえで送りや回転数を変え、ファイルの問題を指摘できる。一方で、形状の選択や切削条件、経路の検証は今もプログラマーの仕事で、工具経路やファイルを削除することもできない。","\n【概要】\nMachineToolNews.aiは2026年11月18日、Mastercamでシニアアプリケーションエンジニアを務めるジェシー・トリンケ氏への独占インタビューを載せた。テーマはCAD/CAMのAI機能「Mastercam Copilot」だ。記事によると、Copilotは対応する機械グループと加工工程の作成、確認したうえでの送り速度と主軸回転数の調整、簡単なスクリプトの生成、プログラムファイルの問題の指摘ができる。\n\n【背景】\nCNCのプログラミングは熟練が要る作業で、AIで手間を減らす試みが広がっている。トリンケ氏は同社に13年勤め、5軸加工や複合旋盤の経験を持つ。\n\n【詳細】\n記事の例では、ミルの機械グループに輪郭加工と2D高速加工の工程を含めて、1つの自然言語の指示で作る。ただし、形状の選択、ステップオーバー、その他の切削条件までは決めない。送りと回転数の調整は、Mill、Lathe、Routerの工程で使える。技術情報や講習動画を探したり、いくつかの手順をまとめて自動化する簡単なスクリプトを作ったりもできる。\nファイルの点検では、クーラントの設定ミス、ワーク座標のずれ、工具の刃長より深い切り込みといった問題を指摘する。点検はファイルを開いたときや、選んだ段階で動く。送りや回転数の変更は1件ずつ利用者の確認を待ち、元に戻せる。ただ、その送り速度が材料や工具や機械に合っているかの判断はしない。\n\n【ポイント・注意点】\nCopilotは工具経路、ファイル、大量の形状を削除できず、人の確認、シミュレーション、実機での試し削りの代わりにもならない。プログラミング時間がどれだけ減るかの一律の数字は示されておらず、効果は部品によって違うという。今後の重点として、文脈を理解した自動化、送りと回転数の推奨、Sandvikの製品群との統合を挙げるが、これは開発目標で、今ある機能ではない。編集部は、アシスタントを使った場合と使わない場合の時間を測ってから判断するよう工場に勧めている。","2026-11-18","MachineToolNews.ai","https://machinetoolnews.ai/conversational-cnc-programming-mastercam/"],["機械加工工場のAIエージェント、見積もりや日程で人が握る所","American Machinistに、AIエージェントを機械加工工場のどこで使い、どこを人が握るべきかを整理した寄稿が載った。見積もりの下書き、日程の組み替え案、品質報告書の作成はAIに任せられるが、価格の決定や優先順位、合否の判定と署名は人が行う。始め方として、繰り返しが多く結果を確かめやすい作業を1つ選び、従来の方法と並べて数週間ほど試すよう勧めている。","\n【概要】\n機械加工の専門誌American Machinistに2026年11月18日、AIエージェントを機械加工工場でどう使うかを整理した寄稿が載った。筆者は、インドのAIエンジニアリング企業Groovy Webの創業者兼CEOのクルナル・パンチャル氏だ。AIは見積もりを速くし、日程を効率よく組み、品質報告をこなせるが、一部の仕事は人が責任を持つべきだと論じている。\n\n【背景】\n筆者はエージェントを、目標を受け取り、いくつもの手順をこなし、ほかの道具を使えるソフトと定義する。たとえば見積もりのエージェントなら、見積もり依頼のメールを読み、部品の情報を引き出し、料金表を確かめて返信を下書きする。筆者はこれを「速い若手の助手」と呼び、見積もり担当や品質管理者の代わりではないとしている。\n\n【詳細】\n見積もりでは、依頼から品番と数量を抜き出す、似た過去の仕事を探す、客からまだ聞いていない情報を並べる、標準の料金で下書きを埋める、といった作業が向く。ただ、ありふれて見える公差に治具の問題が潜んでいたり、重要な客には別の利幅を取るべきだったりするので、価格は人が決める。日程では、変化があったときに仕掛かり中の仕事を並べ替え、遅れそうな注文を知らせ、何をなぜ変えたかを平易に要約できる。品質報告では、検査データを客向けの報告書にまとめ、記入漏れを確かめ、限界に近づく測定値を指摘する。ただし部品の合否は決めず、「決して署名してはならない」。\nデロイトの2025年の調査（米国関連企業の幹部600人）では、29％が工場やネットワークの単位でAIや機械学習を使い、23％が試験中だった。生産スケジューリングを投資の1位か2位に挙げた人は35％いた。\n\n【ポイント・注意点】\n筆者は、これは大企業の数字で、小さな工場には平均ではなく上限として読むよう注意している。AIは図面の注記を読み違えたり、古い料金を使ったり、誤って入力された記録を信じたりする。始め方は5段階で、仕事を1つ選び、まずデータを整え、承認のルールを書き、従来の方法と並べて数週間動かし、間違いを記録する。筆者はAI開発を請け負う会社の経営者で、記事内のリンクには自社サービスへのものも含まれる。","2026-11-18","American Machinist","https://www.americanmachinist.com/enterprise-data/article/55419701/ai-agents-on-the-machine-shop-floor-groovy-web"],["米国の切削工具出荷が前年比29.6％増、AI投資も追い風か","米国の切削工具市場報告によると、2026年9月の切削工具の出荷額は2億8760万ドルで、前年同月より29.6％増えた。1〜9月の累計は23億2000万ドルで23.2％増。業界団体の会長は「毎月が新記録」と話し、AIや半導体、データセンターへの投資が記録的な数字の主な要因ではないかとの見方を紹介した。一方で、原料の炭化タングステン合金の不足が続き、工具の値上がりにつながっている。","\n【概要】\nAmerican Machinistは2026年11月18日、米国の切削工具市場の9月の報告を伝えた。9月の切削工具の出荷額は2億8760万ドルで、8月より3.2％、2025年9月より29.6％多かった。1〜9月の累計は23億2000万ドルで、2025年の同じ9カ月より23.2％増えた。データは、製造技術協会（AMT）と米国切削工具協会が毎月まとめる「Cutting Tool Market Report」による。\n\n【背景】\n記事は切削工具を、自動車、航空宇宙、建設、防衛、エネルギーなど幅広い製造業の「主な消耗品」と位置付け、その購入額は製造業全体の動きを測る確かな指標になるとしている。9月も米国の機械加工工場などは購入を増やし続けた。供給管理協会（ISM）の購買担当者景気指数は10月に55.5で、成長を示す50を10カ月続けて上回った。AMTが別にまとめる機械加工の設備の受注も記録的な水準にあり、記事はこれを今後の大量生産の先行きを示すものと見ている。\n\n【詳細】\nAMTの切削工具部会の会長で、工具メーカーBig Daishowaの社長のジャック・バーリー氏は「毎月が新記録だ」と話した。超硬の原料の価格は下がって落ち着いたが、手に入るかどうかにはまだ不安があるという。炭化タングステン合金の不足が続き、工具の値上がりにつながっている。工具会社は需要に応えながら在庫の積み増しも進めている。\nバーリー氏は、AI、半導体、データセンターへの投資が記録的な数字の主な原動力だという見方があると紹介した。そうした建設を支える企業では、受注残も記録的になっているという。記事には、2022年9月から2026年9月までの米国の月ごとの切削工具消費のグラフも載っている。\n\n【ポイント・注意点】\nAIの直接の話ではないが、AIへの投資が工作機械と工具の需要を押し上げているという見方は、CNCに関わる人にとって見逃せない。ただ、AI投資が主因かどうかは「見方」として紹介されているだけで、記事は裏付けの数字を出していない。工具の値上がりや入手難は、小さな工場や個人の加工にも響く可能性がある。","2026-11-18","American Machinist","https://www.americanmachinist.com/news/news/55419779/cutting-tool-demand-up-nearly-30-cutting-tool-market-report-september-2026"],["LK Metrology、三次元測定ソフトがREVOの5軸スキャンに対応","英LK Metrologyが、三次元測定機（CMM）向けソフトの新版「CAMIO 2026 R1」を出した。Renishawの5軸スキャンプローブ「REVO」に本格的に対応し、スイープスキャンなどの多軸の測定手順をCAMIOの中で組んで実行できる。オフラインで手順を作って確かめ、最適化してから機械で動かせる。業界標準のI++/DMEで、他社製のREVO付きCMMともつながる。","\n【概要】\nAmerican Machinistは2026年11月18日、LK Metrologyが三次元測定機（CMM）向けの自社ソフト「CAMIO」の新版「CAMIO 2026 R1」を出したと伝えた。CAMIOは、測定のプログラミング、分析、報告を行うソフトだ。新版は、Renishawの5軸スキャンプローブ「REVO」に本格的に対応した。REVOの同期した5軸の動きとCAMIOの検査機能を組み合わせ、複雑な検査をこなすという。\n\n【背景】\nCNCで削った部品は、CMMで寸法を確かめて初めて品質が保証される。記事によると、CMMメーカーの中には機種をそろえていない所や、REVOを扱わない所があり、大手のソフト会社の多くは測定機そのものを売っていない。LK Metrologyは、5軸スキャンのソフトとREVO対応のCMMの両方を供給できる、とうたっている。\n\n【詳細】\nCAMIOは、門型、横型アーム、ガントリー型のCMMと、タッチトリガープローブ、アナログのスキャンプローブ、レーザースキャナーを扱え、今回REVOが加わった。CAMIOの中でREVOの検査手順を直接組んで実行でき、スイープスキャンやヘッドタッチといった多軸の手法も使える。プローブの動きと測定の経路を最適化し、精度を保ったまま検査時間を縮めるという。オフラインで手順を作って確かめ、最適化してからCMMで動かせるため、生産性が上がり、機械の止まる時間も減るとしている。\n相互運用の面では、メーカーの違うCMMが混在していても1つの検査ソフトで動かせ、ソフトの囲い込みを減らせるという。REVO付きのCMMとは業界標準のI++/DMEのクライアント・サーバー方式でつながる。CAMIOがI++のクライアントとして標準のTCP/IPネットワークに乗り、UCCコントローラーのI++サーバーと直接やり取りする。独自のソフトやハードの改造は要らないという。\n\n【ポイント・注意点】\nAIの機能ではないが、加工後の検査の手順をオフラインで組んでから測るという流れは、CAMで工具経路をシミュレーションしてから削る流れと同じだ。記事はメーカーの発表をもとにしていて、性能の主張を第三者が確かめたものではなく、顧客名も出ていない。価格や提供条件も書かれていない。","2026-11-18","American Machinist","https://www.americanmachinist.com/new-products/product/55419802/cmm-software-supports-five-axis-scanning-lk-metrology"],["JIMTOF2026の2つの潮流、AIの知能化と工程集約","MONOistが、元工作機械エンジニアの視点でJIMTOF2026の技術の流れを読み解いた。22カ国・地域から1134社が出展し、来場者は速報で11万5103人だった。潮流の1つ目はAIやデジタルツインによる工作機械の知能化、2つ目は人手不足などの現場の課題の解決。ファナックは生成AIがNCプログラムまで作るデモを、オークマはAIによる機械診断と加工診断を見せた。","\n【概要】\nMONOistは2026年11月17日、元工作機械エンジニアの視点で「JIMTOF2026（第33回日本国際工作機械見本市）」の技術の流れを読み解く記事を載せた。テーマは「果てなき高度へ 羽ばたく技術」。東京ビッグサイトの改修工事で展示面積は小さくなったが、世界22カ国・地域から1134社が出展し、前回2024年の1268社に次ぐ歴代2位になった。総来場者数は速報値で11万5103人で、前回より約11％少なかった。会期直前には台風30号の進路が心配されていた。\n\n【背景】\n日本工作機械工業会は2026年の工作機械受注総額を2兆円と見込み、業界の活況への期待が高まっている。その一方で、人手不足、技能の継承、環境負荷の低減、サプライチェーンの不安定化といった課題への対応も求められている。展示の注目点は、JIMTOF2022のスマートファクトリー、2024のデジタルツインに続き、今回はAIを実機の動作や制御につなげる「フィジカルAI」に移った。\n\n【詳細】\n筆者は2つの潮流を挙げる。1つ目は工作機械の高度化と知能化で、AIやデジタルツインで判断の機能を高め、複合加工で工程をまとめ、金属AMへ広げる動き。2つ目は、人手不足や作業者の負担軽減など、生産現場の課題の解決だ。\nファナックは、物理に基づく制御と機械学習を組み合わせた「フィジカルAI CNC」を打ち出した。オペレーターが自由に書いた文字をもとに、生成AIがデザインの修正からNCプログラムの作成までを支え、自社の3Dガルバノレーザスキャナーで印字するデモを見せた。三菱電機は、AI加工タスクプランナーが自然言語の作業指示を解析してタスクプランを自動で作り、CNC工作機械とヒューマノイドに仕事を割り振る仕組みを示した。オークマは、故障を事前に見つける「AI機械診断」、工具の折損を防いで工具を長く使う「AI加工診断」、対話できるAIエージェント機能を紹介した。\n\n【ポイント・注意点】\n筆者は、技術の高度化が現場の課題を解き、現場の課題が新しい技術を促すという、2つの潮流のつながりを強調している。どの展示も、言葉で意図を伝えればAIが加工まで運ぶ方向を向いているが、多くは参考出展や実証の段階だ。記事は3ページ構成で、複合加工と機能の拡張は2ページ目以降で扱われている。","2026-11-17","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/17/news013.html"],["Creality、2種のレーザーを積む密閉型「Falcon T1C」を予約開始","Crealityが、15Wの青色ダイオードと5.5Wの赤外線のレーザーを1台に収めた密閉型のガルバノ式レーザー彫刻機「Falcon T1C」を発表した。米国の希望小売価格は1699ドルで、12月21日までの早期予約なら1199ドルになる。加工範囲は120×120mmで、最高速度は6500mm/s、安全基準はクラス1。世界発売は12月22日で、発送の時期はまだ公表されていない。","\n【概要】\nCrealityは2026年11月17日、密閉型のガルバノ式レーザー彫刻機「Falcon T1C」を発表した。15Wの青色ダイオードレーザーと5.5Wの赤外線レーザーを、重さ7.8kgの1台に収めている。Makers101が同日、価格と仕様をまとめた。米国の希望小売価格は1699ドル。12月21日までの早期予約期間に申し込むと、1199ドルになる。\n\n【背景】\nレーザー彫刻機は、木材や革、アクリルへの刻印や切り抜きに使われ、CNCルーターと並ぶ家庭のデジタル工作の定番だ。2種類のレーザーを1台に載せる機種は増えていて、記事はxToolの「F2」と比べている。\n\n【詳細】\n予約は一部を先に払う方式で、本体だけなら手付金は50ドル。残りは世界発売と同じ12月22日午前8時（米太平洋時間）に自動で請求される。空気清浄機AP1Sとのセットは希望小売価格1859ドル、予約価格1259ドルだが、ストアに載っているのは本体だけで、セットの数字はプレスリリースによる。価格は地域で変わり、発送時期はまだ出ていない。\nメーカーの数値では、加工範囲は120×120mmで、別売の延長ベッドを使うと120×480mmになる。最高速度は特定の画像彫刻モードで6500mm/s。スポットはダイオードが0.06×0.05mm、赤外線が0.03×0.03mm。完全に密閉したクラス1で、ワンタッチのオートフォーカスとカメラによる位置合わせを備え、ソフトはFalcon Design Space。対応素材は350種類以上とされる。ダイオードは木、竹、革、暗い色のアクリル向け、赤外線は金属への精密な刻印向けで、金属は切断ではなく刻印になる。\n\n【ポイント・注意点】\n最大の対象物の高さ、カメラの解像度、LightBurnや回転治具への対応、Wi-FiやUSBなどの接続は未公表だ。比較相手のxTool F2は11月17日時点で1299ドル、加工範囲115×115mm、6000mm/sで、すでに販売されている。記事によると、F2はクラス4、T1Cはクラス1として売られている。筆者はT1Cを使っておらず、性能の数字はすべてメーカーのもの。記事にはアフィリエイトリンクが含まれる。","2026-11-17","Makers101","https://makers101.com/creality-falcon-t1c/"],["Liberty図面AI、新旧図面の重要な変更点を見分ける機能を追加","Liberty Dataが、図面業務向けサービス「Liberty図面AI」に、2枚の図面の違いを見つける機能を加えた。AIが形状や位置関係、設計者の意図を踏まえて新旧の図面を比べ、確かめるべき重要な変更と、位置の移動のような軽い変更を分けて色分け表示する。大手自動車メーカーでは検図の工数を90％減らしたという。同社は期間1〜2週間のトライアルも受け付けている。","\n【概要】\nLiberty Dataは2026年11月16日、図面に関わる業務向けのサービス「Liberty図面AI」に、2枚の図面の違いを見つける機能を加えたと発表した。フィジカルAIタイムズが11月17日、MONOistの記事をもとに伝えた。AIは図形の形状や位置関係、設計者の意図を踏まえて新旧の図面を比べ、確かめるべき重要な変更と、位置の移動のような重要度の低い変更を見分ける。\n\n【背景】\n図面の改訂のたびに、新旧を見比べて変更点を確かめる「検図」は、製造業で手間のかかる作業だ。変更がわずかでも、見落とせば加工の誤りや大きな手戻りにつながる。従来の差分の比較では、意味のない線の移動まで拾ってしまい、確認する人が本当に大事な箇所を探し直す必要があった。\n\n【詳細】\n新機能は、変更の種類ごとに色を分けて表示し、確認する人が重要な箇所に目を向けられるようにする。図面の形式や、手書きの文字があるかないかを問わずに比べられることも特徴とされる。\n大手自動車メーカーでは、この機能を入れて検図の工数を90％減らしたという。別のプラントエンジニアリングの案件では、形式の違うPDFの図面どうしの照合や、ベンダーの図面と顧客のP&IDの整合の確認を人の手で行っていた。この業務でも、図面を確かめる時間が短くなった事例が紹介されている。\n同社はトライアルを行っている。最初の打ち合わせから、サンプルの図面で使えるかの確認、試行、結果の報告、成果物の提出までを行い、期間は1〜2週間と案内している。\n\n【ポイント・注意点】\n90％という数字は企業の発表値で、どの業務をどんな条件で測ったかの詳細は記事に示されていない。CNCで削る前の図面の確認は、加工ミスを防ぐ最初の関門で、ここをAIで支える意味は小さくない。ただ、AIが「重要でない」と判断した変更にも、加工に効くものが混じる可能性はある。最終的な判断は人が行う前提で、自社の図面でトライアルを試し、見落としの有無を確かめてから取り入れるのが現実的だ。","2026-11-17","フィジカルAIタイムズ","https://physical-ai-times.com/news/a73fc195e74e/"],["REVOX「SellBOT v2」、図面検索から外注の見積り依頼までAIで","REVOXが製造業向けのクラウドサービス「SellBOT v2」を出した。受け取った図面をもとに、AIで形状や文字から過去の似た図面と見積りの実績を探し、加工工程と材料単価から見積書を作る。新たに外注加工の調達支援を加え、AIが仕入れ先の候補を示し、複数社への一括の見積り依頼と、各社の金額や納期の回答の管理を1つの画面で行えるようにした。内製か外製かの判断から仕入れ先選びまでを支える。","\n【概要】\nREVOXは2026年11月13日、製造業向けのクラウドサービス「SellBOT v2」を出したと発表した。フィジカルAIタイムズが11月17日、ASCII.jpの記事をもとに伝えた。AIによる似た図面の検索や見積書の作成に加え、外注先の候補の提示、複数社への見積り依頼、回答の状況の一元管理を支援する。\n\n【背景】\n受託で部品を削る工場では、図面を受け取るたびに、過去に似た仕事があったか、いくらで受けたかを調べて見積もる作業が欠かせない。自社で作るか外に出すかを決め、外に出すなら仕入れ先を選んで見積もりを取り、回答をまとめる手間もかかる。こうした作業は担当者の経験に頼りがちだ。\n\n【詳細】\nSellBOT v2では、取引先から受け取った図面を起点に、形状や文字の情報を使って、過去の似た図面と見積りの実績を検索できる。加工の工程や材料の単価をもとにした見積書づくりにも対応する。\n今回の版では、これまでの類似図面検索と見積り作成の機能に、外注加工の調達を支える機能を加えた。外に出す場合は、過去の実績などをもとにAIが仕入れ先の候補を示す。利用者は複数の会社に一括で見積りを依頼でき、各社の金額と納期の回答の状況や、案件ごとのチャットでのやり取りを1つの画面で管理できる。対象となる業務には、内製と外製の判断、仕入れ先の選定、見積りの依頼と回答の確認が含まれる。\n\n【ポイント・注意点】\n図面の検索から調達までを1つのサービスの中で扱える点が特徴だ。一方で、フィジカルAIタイムズは、AIが示す仕入れ先の候補がどれほど役に立つか、導入でどれだけ効果が出るかは、発表の内容だけでは評価できないとしている。料金や導入の実績の数字は記事に出ていない。似た図面の検索や見積もりの精度は、蓄えた過去の図面と実績の量と質に左右される。過去のデータが少ない工場では、すぐには効果が出にくい可能性もある。導入を考える工場は、自社のデータでどこまで当たるか、外注先の候補が実際の取引先と合うかを、試用の段階で確かめておきたい。","2026-11-17","フィジカルAIタイムズ","https://physical-ai-times.com/news/79012f667906/"],["Anthropic、製造業向けの「Claude for Manufacturing」を公開","Anthropicが、見積もり、品質問題、設備故障の診断、生産情報を扱う製造業向けプラグイン「Claude for Manufacturing」を公開した。17の専用スキルと4つのコネクターを持ち、Autodesk Fusionで設計案を作って比べることもできる。既存のERPなどは置き換えない。生産設備、CNC工作機械、ロボットは操作しないと明記されている。","\n【概要】\nMachineToolNews.aiは2026年11月16日、Anthropicが製造業向けのAIプラグイン「Claude for Manufacturing」を公開したと伝えた。記事によると、発表は11月12日。見積もり、品質問題、設備故障の診断、生産情報を扱い、17の専用スキルと4つのソフト接続用のコネクターを持つ。既存のERPや設計、業務のシステムを置き換えずに一緒に使う設計だ。\n\n【背景】\n中小の機械加工工場では、見積もりや品質報告などの事務作業が技術者の時間を奪いがちだ。Anthropicは主な用途を6つ挙げる。見積もりでは客の依頼を分析し、足りない情報を見つけ、過去の原価と比べて見積書を用意する。品質管理では検査不合格を調べ、過去の不良を見直し、是正処置の報告を下書きする。保守では設備の記録やセンサーの書き出し、技術文書を調べて、故障の原因を推定する。\n\n【詳細】\n残りの3つは、仕入れ先への見積もり依頼の準備と回答の比較、Autodesk Fusionを使った設計案の生成と比較、出来高や停止時間や原価をまとめた経営向けの報告だ。コネクターはAutodesk Fusion、Infor（購買・在庫・生産）、Microsoft 365（文書・メール・品質手順・報告）、Oracle NetSuite（原価・在庫・受注）の4つ。コネクターのないソフトでも、書き出したデータを使える。ただし記事は、ファイルを介したやり方は機械とのリアルタイムの接続とは違うと注意している。\nコネクターは読み取り専用で、変更を承認のうえで行うには別のInfor用プラグインを使い、権限は利用者のInforの権限に従う。記事は、鋼材の納入が遅れたとき、人が承認してからInforに変更を入れる例を紹介している。\n\n【ポイント・注意点】\nClaude for Manufacturingは生産設備、CNC工作機械、ロボットを操作しないと明記されている。提供先はClaudeのTeamとEnterpriseの利用者で、製造業向けの価格は公表されていない。11月17日には技術ウェビナーが予定されていた。第三者が確かめた生産性や費用、投資対効果の数字はまだ出ていない。編集部は、見積書や是正報告の作成など範囲を絞って試し、従来のやり方と比べるよう勧めている。","2026-11-16","MachineToolNews.ai","https://machinetoolnews.ai/claude-for-manufacturing-ai/"],["DMG森精機、AIの予兆保全やAI CAMを自社イベントで展示","MONOistが、DMG森精機が10月に東京で開いた「東京テクノロジーウィーク」の展示を伝えた。5軸加工機など17台に加え、AIで予兆保全を行う「Condition Agent」、3Dモデルから加工プログラムを自動で作る「CELOS VISUALprogramming 3D」、英CloudNCのAI CAM「CAM Assist」を出展した。自社の工作機械部品に金属AMを使う取り組みも紹介した。","\n【概要】\nMONOistは2026年11月16日、DMG森精機が10月26〜31日に東京グローバルヘッドクォータ（東京・江東区潮見）で開いた自社イベント「東京テクノロジーウィーク」の展示を伝えた。国内初披露を含む5軸加工機や複合加工機、金属積層造形（AM）機など17台に加え、DXのソリューションを展示した。機械加工の前後の工程の生産性を高めるソフト群には、AIを使うものが並んだ。\n\n【背景】\n日本初公開の「DMU 60 eVo 2nd Generation」は、金型、半導体、航空宇宙向けの高速高精度な5軸加工機だ。工具交換は4.5秒で、振動を抑える特殊素材「ミネラルキャスティング」を使う。「DMX 60 U」は累計約5000台を納めた「CMX 50U/70U」の後継で、剛性を50％高め、主軸の最高回転数を毎分8000回転から2万回転に上げた。\n\n【詳細】\n「Condition Agent」は、主軸、送り軸、ツールチェンジャー、パレットチェンジャーなどの経年変化や異常の兆しをつかみ、予兆保全を行う。従来の予兆保全サービス「WALC CARE」の診断対象と分析機能を広げた。「CELOS VISUALprogramming 3D」は、3Dモデルから溝加工などの形状を自動で認識し、同社の機械の剛性データや最適化された加工条件を反映して、加工プログラムを自動で作る。英国CloudNCの「CAM Assist」は、AIが3Dモデルから形状を認識し、加工パス、推奨工具、加工条件を自動で計算する。他社製の工作機械を含む多様な環境に対応する。\nAMでは、ボールねじの部品デフレクターを金型による成形からAMに切り替え、リードタイムと製造コストを大きく減らし、すでに量産している。横形マシニングセンタ「INHシリーズ」では、アングルヘッドホルダーの土台に滑らかに曲がる内部流路を一体で造形し、圧力損失を減らしつつ大幅に小型化した。\n\n【ポイント・注意点】\n同社は、新機種の開発では最低1〜2点のAM部品を採るという目標を持つ。「どう削り出すか」を前提にした設計から「理想の形をどう作るか」への発想の転換を促す訓練でもあると、担当部長の飯山浩司氏は語る。国内の金型メーカーが減り、作れていた金型が突然作れなくなるリスクも考えているという。展示は10月の出来事で、記事の公開日は11月16日。","2026-11-16","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/17/news012.html"]],"cricut":[["妖精とツリーの無料SVG、ストッキングやマグに","Crafty Crafterが、妖精（エルフ）と松の木を組み合わせたクリスマス用の無料カットファイルを2026年11月22日に公開した。登録なしで入手でき、個人の制作用に使える。赤のグリッターHTVを緑の綿のストッキングに貼る、光沢のある永久ビニールをマグに貼るなど、具体的な作例も紹介している。Cricut Joy、Maker、Explore に対応し、Silhouette Studioでも使える。データ自体の再販や再配布は禁止されている。","\n【概要】\nCrafty Crafterは2026年11月22日、妖精（エルフ）と松の木を組み合わせた「Elf Christmas Tree」の無料SVGを公開した。登録なしでダウンロードでき、個人の制作用に使える。年末の飾りや贈り物を、カッティングマシンで手早く作りたい人向けのデータだ。\n\n【背景】\n同サイトは11月に入ってから、クリスマス柄の無料SVGをほぼ毎日公開している。今回もその一つで、作例と材料、手順、よくある質問を1ページにまとめた形式になっている。ほかの記事と同様に、データの不具合を確かめる自社ツール「SVG Doctor」や、Creative Fabricaのアフィリエイトリンクも載っている。\n\n【詳細】\n作例は6つある。赤のグリッターHTVを緑の綿のストッキングに貼る、光沢のある永久ビニールを陶器のマグに貼ってホットココア用のカップにする、重ねたビニールでアクリルのオーナメントを作る、黒のTシャツに白のHTVを貼る、ペンプロッターで描いたカードストックのギフトタグ、アイロン接着ビニールを貼ったエプロンだ。\nDesign Spaceでの手順は、ダウンロードしたファイルを解凍し、SVGを取り込み、HTVなら左右反転し、貼る素材の大きさに合わせてから、マットに載せてカットする。Silhouette Studioでもほぼ同じ手順で使えるという。よくある質問では、Cricut Joy、Maker、Explore のいずれでも使え、SVGは拡大しても画質が落ちないと説明している。\n材料には、EasyWeed系の伸縮するHTV、耐熱の転写テープ、ポリエステルや綿の無地品、光沢のある永久ビニール、貼る前に表面を拭くアルコールシートが挙げられている。\n\n【ポイント・注意点】\n使える範囲は個人の制作に限られる。手作りの品を贈り物にするのはよいが、データそのものを売ったり配ったりしてはいけない。ページにはデザインの寸法が書かれていないため、作る品に合わせて自分で大きさを決める必要がある。HTVを使うときは、カットの前に左右を反転させ忘れないようにしたい。素材ごとのカット設定は、マシンと素材に合わせて自分で選ぶ必要がある。","2026-11-22","Crafty Crafter","https://crafty-crafter.club/christmas/elf-christmas-tree-svg-for-cricut/"],["「サンタは反対」ユーモア柄の無料SVG","Crafty Crafterが2026年11月21日、サンタクロースを題材にしたユーモア柄の無料SVG「Santa Disagrees」を公開した。幼い子どもに「悪い子にしているとサンタに見られている」と説明したことが着想のもとだという。黒のTシャツに白のHTVを貼るクリスマスのセーター、シークレットサンタ用のマグ、窓に貼るデカールなどの作例を紹介している。データは個人の制作用に限られる。","\n【概要】\nCrafty Crafterは2026年11月21日、サンタクロースを題材にしたユーモア柄の無料カットファイル「Santa Disagrees」を公開した。作者は、幼い子どもに「悪い子にしているとサンタに見られている」と説明したことがきっかけで、このデザインを思いついたという。\n\n【背景】\nクリスマス柄の中でも、笑いを誘う図柄は根強い人気があり、記事もこのデザインをユーモア系の需要に向けたものと位置づけている。質感を出したい人には、フロッキー加工のビニールやグリッター素材を勧めている。\n\n【詳細】\n作例には、黒のTシャツに白のHTVを貼るクリスマスのセーター、光沢のある永久ビニールを貼ってシークレットサンタの贈り物にするマグ、トートバッグ、金属の吊り下げオーナメント、ドアや窓に貼るデカール、ワインボトルのラベルが挙がっている。\n材料は、EasyWeedのHTV、綿のTシャツやスウェット、耐熱テープ、小型の熱プレス、光沢のある永久接着ビニール、陶器のマグの無地品、転写テープ、こすって密着させるスクレーパーだ。\nDesign Spaceでの手順は6段階で示されている。ファイルを解凍し、取り込み、大きさを合わせ、HTVなら左右反転する。Silhouette Studioでも使えることを確かめ、粘着力のあるマットを使って刃を良い状態に保つ、という流れだ。よくある質問では、Cricut Joy、Maker、Explore に対応すると説明している。\n\n【ポイント・注意点】\n使える範囲は個人の制作に限られる。手作りの品を贈り物にするのはよいが、データ自体を売ったり配ったりしてはいけない。記事は、カットの前に自社ツール「SVG Doctor」でファイルを確かめるよう勧めている。デザインの寸法は書かれていないため、貼る品の大きさに合わせて自分で調整する必要がある。HTVでは左右反転を、永久ビニールでは貼る面の下ごしらえを忘れないようにしたい。ユーモア柄は贈る相手を選ぶため、受け取る人に合うかどうかも考えて使いたい。","2026-11-21","Crafty Crafter","https://crafty-crafter.club/christmas/santa-disagrees-svg-for-cricut/"],["「Merry and Bright」無料カットファイル配布","Silhouette Schoolが2026年11月20日、恒例の無料データ企画「Freebie Friday」で、クリスマス向けのデザイン「Merry and Bright」をSilhouette Studio用に配った。Tシャツ、暖炉の上に飾る木の看板、玄関に立てかける看板、クッション、タンブラー、オーナメントへの使い方を提案している。無料版は個人の利用に限られ、商用で使いたい人向けに1ドルの有料版も用意されていた。","\n【概要】\nSilhouette Schoolは2026年11月20日、毎週金曜に無料データを配る企画「Freebie Friday」で、クリスマス向けのデザイン「Merry and Bright」を公開した。Silhouette Studio用のファイルで、Googleドライブのリンクから入手できる。\n\n【背景】\nSilhouette Schoolは、Silhouetteのカッティングマシンの使い方を解説する人気ブログだ。Freebie Fridayでは毎週、季節に合ったデザインを1つ無料で配っている。今回は年末に向けて需要が高まる、クリスマスの言葉を題材にした。\n\n【詳細】\n記事が挙げる使い道は、クリスマスのTシャツ、暖炉の上に飾る木の看板、玄関先に立てかける看板、クッション、タンブラー、オーナメントだ。一つのデザインを、布、木、器など異なる素材に使い回せることを示している。\n無料のファイルは個人の利用に限られる。商用で使いたい場合は、So FontsyでSVGと商用ライセンスを1ドルで買えると案内していた。ただし、この1ドルの販売は「2026年11月21日（土）」までとされており、今日の時点ではすでに締め切られている。\n記事にはこのほか、過去に配った無料のカットファイルへのリンクと、Silhouette Schoolのアフィリエイトに関する注記が載っている。\n\n【ポイント・注意点】\n記事には、使うマシンや素材、カット設定が書かれていない。作る品に合わせて、HTV、接着ビニール、カードストックなどの設定を自分で選ぶ必要がある。無料版を使った品を販売するのは、ライセンス上認められない。商用で使うつもりなら、有料版の販売が終わっていることを踏まえ、配布元の最新の案内を確かめたい。ファイルはSilhouette Studio向けとして配られているため、Cricutで使う人は、取り込める形式かどうかを先に確かめておくと安心だ。毎週の企画なので、次の金曜にも別のデザインが公開される見込みだ。","2026-11-20","Silhouette School","https://www.silhouetteschoolblog.com/2026/11/merry-and-bright-freebie-friday.html"],["LEDで光る手作りカード、Cricutで回路まで","Jennifer Makerが、LEDと導電テープで光るカードの作り方を紹介した（ページの最終更新日は2026年11月20日）。冬のクマとクリスマスツリーの図柄を無料で配り、Cricut Maker 4でカードストックを切り、細いペンで回路の目印を描く。押すと回路がつながって光る仕組みで、費用の目安は9〜14ドル、作業時間は約1時間としている。図柄はSVG、DXF、PDFの3形式で用意されている。","\n【概要】\nJennifer Makerは、LEDで光る手作りカードの作り方を解説した。ページには「最終更新日：2026年11月20日」とある。冬のクマとクリスマスツリーの図柄を使い、カードの中に簡単な電気回路を組み込む。カードを押すと回路がつながり、LEDが光る。\n\n【背景】\nJennifer Makerは、Cricutを使った工作を数多く紹介する制作ブログだ。今回の図柄はDesign #850として無料の資料庫で配られており、SVG、DXF、PDFの形式がある。折り線の入った版と入っていない版の両方が用意されている。\n\n【詳細】\n材料は、65ポンドのカードストック5〜7枚、必要に応じて土台用の110ポンドの白いカードストックとグリッターやシマー紙、Chibitronicsの「Launchpad」LEDを3〜7個、専用の電池（またはLEDの入門キット）、幅4mmのChibitronicsの導電布テープだ。\n道具は、Cricutのカッティングマシン（作者はMaker 4を使用）、12×12インチのStandardGripマット、ローラー、スクレーパー、カス取りの道具、0.4mmのFine Pointペン、のり、厚みの出るフォームドット、グルードットで、折り線を付ける道具は任意だ。ペンは、土台のカードに回路の目印を描くのに使う。\n費用の目安は9〜14ドルで、準備に10分、作業に1時間ほどかかるという。難しさは「中くらい」とされている。\n\n【ポイント・注意点】\nできあがるカードはA8の封筒に収まる。作者は、5×7インチのカードには一般にA7の封筒が勧められるとも書き添えている。室内で使うカードには、導電性の塗料は勧めないとしている。回路は導電布テープでつなぎ、押す部分がスイッチの役目を果たす。初めてなら、LEDと電池がそろった入門キットから始めると材料をそろえやすい。図柄は無料だが、資料庫からの入手が前提となる。LEDの数は3〜7個と幅があるので、光らせたい場所の数に合わせて用意したい。紙の厚さによって切り方の設定が変わる点にも気を付けたい。","2026-11-20","Jennifer Maker","https://jennifermaker.com/light-up-card/"],["英国風の一言を添えた無料SVG、タグや小物に","Crafty Crafterが2026年11月19日、「Wish You Nothing But」の言葉をあしらったクリスマス用の無料SVGを公開した。昔ながらの英国のクリスマスカードを思わせる、すっきりした図柄で、カスを取りやすいという。金の永久ビニールをクリーム色のカードストックのギフトタグに貼る、緑のHTVを麻のクッションに貼るなどの作例を紹介している。個人の制作用に限られる。","\n【概要】\nCrafty Crafterは2026年11月19日、「Wish You Nothing But」の言葉をあしらったクリスマス用の無料カットファイルを公開した。繊細な曲線とすっきりした直線を組み合わせ、昔ながらの英国のクリスマスカードを思わせる見た目に仕上げたという。\n\n【背景】\n作者は、このデザインはカス取り（ウィーディング）がしやすいと説明している。言葉だけで季節の気分を伝えられるので、派手な図柄を好まない相手への贈り物にも合わせやすい。文字を中心にしたシンプルな図柄は、カードやタグ、布ものなど幅広い品に使いやすく、初めての人でも扱いやすい。\n\n【詳細】\n作例は6つ挙がっている。金色の永久接着ビニールをクリーム色のカードストックのギフトタグに貼る、深い緑のHTVを麻のクッションに貼る、先生への贈り物にする陶器のマグ、黒のTシャツに深い赤と白のHTVを重ねる、金属調の接着ビニールを透明のアクリルの飾り玉に貼る、カードストックで作った絵をシャドーボックスに入れる、というものだ。\nDesign Spaceでの手順は、取り込むときに「Cut Image」を選び、大きさを変えるときは縦横の比率を固定し、HTVなら左右反転し、素材に合わせて刃を設定する。Silhouette Studioでも使えるという。\n材料には、綿混のTシャツ、EasyWeedのHTV、耐熱テープ、小型の熱プレス、陶器のマグの無地品、光沢のある永久ビニール、転写テープ、こすって密着させるスクレーパーが並ぶ。\n\n【ポイント・注意点】\nよくある質問では、データは個人の利用に限り無料で、データ自体の再販や再配布は認めないと説明している。Cricut Joy、Maker、Explore のいずれでも使える。デザインの寸法は書かれていないため、貼る品に合わせて自分で決める必要がある。比率を固定せずに大きさを変えると文字がゆがむので、記事が勧めるとおり比率は固定したまま調整したい。HTVを使う場合は、カットの前に左右反転を忘れないようにしたい。","2026-11-19","Crafty Crafter","https://crafty-crafter.club/christmas/wish-you-nothing-but-svg-for-cricut/"],["自動熱プレス3機種を比較、Cricut・HTVRont・xTool","The Country Chic Cottageが2026年11月19日、自動で圧着する熱プレス3機種を比べた。HTVRont Auto Press 2、Cricut Autopress 2、xTool WonderPressで、熱板はどれも15×15インチ、最高温度は410°F。価格は349〜399ドル。昇華転写、DTF、発泡（パフ）HTVで試し、パフHTVではCricutだけがむらなく膨らんだとして、作者はこの用途にCricutを勧めている。","\n【概要】\nThe Country Chic CottageのAngie Holdenさんは2026年11月19日、自動で圧着する熱プレス3機種の比較を公開した。HTVRont Auto Press 2、Cricut Autopress 2、xTool WonderPressを、昇華転写、DTF、発泡（パフ）HTVの3つの用途で試している。\n\n【背景】\n3機種とも熱板は15×15インチ、最高温度は410°Fで同じだ。最大の圧力はCricutとxToolが220ポンド、HTVRontが170ポンドとなる。タイマーの上限はCricutが360秒、ほかの2機種は999秒だ。開いたときのすき間はCricutが1.8インチ、HTVRontが1.77インチ、xToolが3.0インチある。記事に載っている価格はCricutが379ドル、HTVRontが349ドル、xToolが本体のみで399ドルだ。操作はCricutが外付けの操作部、HTVRontが立ち上がる画面、xToolが正面のつまみで行う。\n\n【詳細】\n昇華転写では白いポリエステルのシャツを使い、3機種とも385°Fで試した。Cricutは125ポンド・50秒、xToolは80kg・50秒、HTVRontは70ポンド・55秒で、どれも鮮やかに仕上がった。DTFでは、Cricutが310°F・15秒・200ポンド、xToolが厚みのあるトートで320°F・10秒、HTVRontがファスナー付きポーチで325°F・15秒・170ポンドだった。厚みのある品では、xToolが特に優れていたという。\nパフHTVでは、なめらかでむらなく膨らんだのはCricutだけだった。320°F・10秒・最大圧力で、2段階で押している。xToolは265°Fでやや粒が目立ち、HTVRontは170ポンドでしわが寄った。\n\n【ポイント・注意点】\n作者は、パフHTVに使うならCricut Autopressを勧めるとしている。ただし、タイマーの上限が360秒のため、時間のかかる重いスレート素材では途中でかけ直す必要がある。xToolのオーブンや3D真空の追加部品は別料金で、場所を取り、慣れるまでに手間がかかる。HTVRontはいちばん安いが、圧力も最も低い。","2026-11-19","The Country Chic Cottage","https://www.thecountrychiccottage.net/autopress-comparison/"],["ビニールの自作Tシャツ、手順を最初から最後まで","Silhouette Americaが2026年11月18日、熱転写ビニール（HTV）でオリジナルのTシャツを作る手順を公開した。デザインを選んで左右反転し、試し切りをしてから本番を切り、カスを取って熱プレスか認められた家庭用アイロンで圧着する。多色の図柄は1色ずつ重ねる。HTVは接着ビニールとは別物で、温度や時間は製品ごとに違うため、必ずその説明に従うよう求めている。","\n【概要】\nSilhouette Americaは2026年11月18日、熱転写ビニール（HTV）を使ってオリジナルのTシャツを作る手順を解説した。対応するSilhouetteのマシンでHTVを切り、不要な部分を取り除き、熱プレスか、メーカーが認めた家庭用アイロンで布に圧着する流れだ。\n\n【背景】\nHTVは熱と圧力で布に付く素材で、シールのように貼る接着ビニールとは別物だと記事は強調している。必要なものは、対応するマシン、合った刃、HTV、Silhouette Studio、Tシャツ、カス取りの道具、熱プレスか認められたアイロン、HTVのメーカーが勧める場合は当て紙やクッキングシート、硬くて熱に強い台だ。\n\n【詳細】\n手順は次のとおり。まずSilhouette Studioでデザインを選ぶ。記事ではデザインストアの「Born to Shine」（Design ID D-1292795）を例にしている。一般的なHTVは台紙側を下にして切るため、デザインを左右反転させる。ただし特殊な製品には違うものもある。刃、必要ならマット、素材の設定を整えたら、試し切りをして、台紙を切らずにビニールだけを切る「キスカット」になっているか確かめる。\n本番を切ったら、余分な部分を取り除く。細かい文字は特に丁寧に扱う。Tシャツは清潔なものを用意し、必要なら先に一度プレスしてから、台紙を上にして縫い目を避けて置く。温度、圧力、時間はHTVの説明に従って押し、はがすのも説明どおり熱いうち、温かいうち、冷めてからのいずれかで行う。多色の図柄は1色ずつ切って順に押し、先に貼った部分は当て紙で守る。\n\n【ポイント・注意点】\n温度や時間に決まった数値はなく、製品ごとに違う。HTVによっては重ねる順番に制約がある。初めて洗う前に待つ時間が指定されていれば守り、裏返して洗い、高温と強い洗剤は避ける。メーカーが認めていない限り、図柄の上から直接アイロンをかけてはいけない。記事は名前入り、家族の集まり、誕生日、旅行、チーム、季節の行事、仮装の飾りといったTシャツの作例も挙げている。","2026-11-18","Silhouette America","https://www.silhouetteamerica.com/blog/post/how-to-make-custom-vinyl-t-shirts-at-home"],["年末の手作り品を包む、タグとシールの作り方","Silhouette Americaが2026年11月18日、小さな店が年末に使う包装の工夫をまとめた。色は主色と差し色を1つずつ、季節の図柄を1つ、書体は2つに絞り、売り場の看板とそろえるのがこつだという。カードストックのタグ、印刷してから切るラベル、袋を留めるシール、お礼のカードなどの作り方と、まとめて作るときの順番を紹介している。試し切りの勧めなど、作業の注意点も載っている。","\n【概要】\nSilhouette Americaは2026年11月18日、小さな店が年末商戦で使う包装のアイデアを公開した。Silhouetteのデザイン、カードストック、シール用紙、接着ビニール、印刷してから切る「Print & Cut」のラベルを組み合わせ、統一感のある包装をそろえる方法を解説している。\n\n【背景】\n記事は、包装と売り場の看板をそろえることを勧めている。色は主色1つと差し色1つ、季節の図柄は1つ、書体は目立たせる用と読みやすい用の2つに絞る。手作り品を売るマーケットが増える時期に、見た目をそろえて店らしさを出すための考え方だ。\n\n【詳細】\n商品タグは長方形、波形の丸、アーチ、小さな旗の形が使える。中くらいの厚さのカードストックで切るか、ロゴや手入れの説明、QRコードを入れるならPrint & Cutで作る。麻ひも、リボン、ゴム、小さな安全ピンで取り付ける。\nシールは、短い期間の室内用なら印刷できるシール用紙、長持ちさせたいラベルなら印刷できるビニール、瓶やボトルには接着ビニールが向く。ロゴのシール、季節の図柄、商品ラベル、お礼のシールなどがあり、袋や薄紙を留めるのにも使える。同封物には、お礼のカード、手入れのカード、再注文用のQRコードのカード、贈り物用のメッセージがある。\nまとめて作るときは、印刷、カット、仕分け、組み立ての順に進める。\n\n【ポイント・注意点】\nPrint & Cutでは、位置合わせの印の周りを空けておき、光の反射を確かめ、1枚まるごと切る前に試し切りをする。シール用紙、カードストックの厚さ、ビニールの仕上げ、刃のどれかを変えたら、そのたびに試し切りをしたい。設定は、きれいに切れる中でいちばん弱いものを選ぶ。厚いカードストックがはがれないときは、刃を急に深くする前に、圧を上げるか切る回数を増やす。よく使う部品は多めに切っておき、会計の近くに包装の場所を作るとよい。書体を増やしすぎたり、ラベルに情報を詰め込みすぎたりしないよう注意したい。","2026-11-18","Silhouette America","https://www.silhouetteamerica.com/blog/post/small-business-packaging-ideas-for-the-holidays"],["ChatGPTで図柄をニットやキルト風に変える指示文","Silhouette Schoolが2026年11月17日、ChatGPTへの指示文で平らなPNGの図柄を、ざっくりしたニット、クロスステッチ、キルト、革などの質感に変える方法を紹介した。効果は11種類。作者はxTool O1 Omni DualのUV印刷で仕上げ、クロスステッチとニットが特にうまく出たという。昇華転写、DTF、シール、紙にも使えるとしている。","\n【概要】\nSilhouette Schoolは2026年11月17日、ChatGPTに指示文を与えて、平らなPNGの図柄に質感を付ける方法を動画付きで紹介した。ざっくりしたニット、クロスステッチ、キルト、革など、11種類の効果を載せている。このうち刺しゅう風とニット風は、Silhouette Uの無料ツールでも使えるという。\n\n【背景】\nカッティングマシンや印刷機で作る品は、平らな見た目になりやすい。生成AIで図柄そのものに布や糸の質感を描き込めば、印刷するだけで手芸品のような見た目に近づけられる。同ブログは9月にも、刺しゅう風に見えるHTVの記事を出している。\n\n【詳細】\n手順は簡単だ。指示文をChatGPTに貼り付け、PNGを読み込ませ、1〜2分待つ。PNGは背景が透明なものが望ましい。縁の仕上がりがおかしいときは、縁をきれいに仕上げるようChatGPTに頼み直す。\n作者は、できた画像をxTool O1 Omni DualとxTool Studioで印刷した。質感がよく出たのはクロスステッチとニットだった。キルト風の図柄には「Relief（浮き彫り）」の設定を使った。この設定はxToolのアカウントのクレジットを消費し、3Dの見本が表示される。図柄に白が含まれていたため、インクの方式は白とカラーにした。キルト風の印刷には10〜12分ほどかかったという。\n\n【ポイント・注意点】\n作者は、質感を付けたPNGは昇華転写、DTF、DTG、シール、紙にも使えるとしている。UV印刷機がなくても、手持ちの方式に合わせて応用できる。ただし、浮き彫りの設定はクレジットを使うため、何度も試すと消費が増える点に気を付けたい。生成された画像は縁や細部が崩れることがあるので、印刷の前に拡大して確かめておきたい。透明な背景のPNGを用意しておくと、仕上がりが安定しやすい。11種類の効果のうち、刺しゅう風とニット風はSilhouette Uの無料ツールでも試せるので、ChatGPTを使う前に手軽に比べてみるのもよい。","2026-11-17","Silhouette School","https://www.silhouetteschoolblog.com/2026/11/chatgpt-texture-prompts-make-design.html"],["年末マーケットの売り場看板を手作りする4種","Silhouette Americaが2026年11月17日、年末の手作り市で使う売り場の看板の作り方をまとめた。値札、品目の札、支払いや注文用のQRコードの表示、ラッピングや名入れを知らせる卓上の看板の4種類だ。客は数秒で「何か・いくらか・どう払うか」を知りたいとして、遠くから読める文字の大きさや、QRコードを光らせない工夫、作る順番を紹介している。材料はカードストックや接着ビニールなど身近なものだ。","\n【概要】\nSilhouette Americaは2026年11月17日、年末の手作り市（ホリデーマーケット）の売り場に置く看板を、カッティングマシンで手作りする方法を公開した。客は数秒のうちに、それが何か、いくらか、どう払うか、贈り物に向くかを知りたがる。店の人が声をかける前に、看板がその役目を果たせるようにするのがねらいだ。\n\n【背景】\n記事は看板を4種類に分けて解説している。値札、品目の札、QRコードの表示、卓上の看板だ。材料には、カードストック、接着ビニール、印刷できるシール用紙やビニール、転写テープ、スクレーパー、カス取りの道具、小さなスタンド、ダブルクリップ、リボン、麻ひもが挙がっている。\n\n【詳細】\n値札は、中くらいの厚さのカードストックで作る三角の卓上札、アクリルや木の板に接着ビニールを貼ったもの、棚に貼るシール用紙のラベルで作る。地と文字の色の差を大きくし、値段の周りに余白を取り、裏には品目を書いておく。\n品目の札は「オーナメント」「ストッキングに入れる小物」などと書き、アーチ、長方形、波形のタグ、小旗など同じ形をくり返す。季節の飾りは1つにとどめ、数フィート離れても読める大きさにする。\nQRコードは、支払い、店のリンク、名入れの注文、メールマガジンの登録に使う。カードストックの卓上札やアクリルの額に、濃淡の差をはっきり付けて印刷する。卓上の看板では、ラッピングの有無、名入れの相談、手入れの方法、人気の品、会計の場所を知らせる。\n\n【ポイント・注意点】\nQRコードの上にビニールやグリッターを重ねたり、光る仕上げにしたりすると読めなくなる。市の前に、いろいろな角度から読み取りを試しておきたい。作る順番は、カードストック、ビニール、Print & Cutのラベルの順で、売り場の場所ごとに組み立てる。本番の素材で試し切りをし、練習で並べた様子を写真に残すとよい。文字の詰め込みすぎ、小さすぎる値段、ばらばらの見た目、読み取れないQRコードは、よくある失敗だという。","2026-11-17","Silhouette America","https://www.silhouetteamerica.com/blog/post/diy-booth-signs-for-holiday-markets"],["犬が縦に並ぶクリスマス柄、無料のSVG","Crafty Crafterが2026年11月17日、犬を縦に積み上げたトーテム風のクリスマス用無料SVGを公開した。ビニールの色を何層も重ねると立体的に見えるという。透明なアクリルの飾り玉、家族でそろえるTシャツ、犬用のバンダナ、マグ、ギフトタグ、廊下に飾る木の看板などの作例を紹介している。Cricut Joy、Maker、Explore に対応する。データは個人の制作用で、再販や再配布は禁止されている。","\n【概要】\nCrafty Crafterは2026年11月17日、犬を縦に積み上げたトーテム風の図柄「Christmas Dog Totem」の無料カットファイルを公開した。作者は、ビニールの色を何層か重ねて立体感を出す使い方を勧めている。犬好きの家族や友人への贈り物に向いたデザインだ。\n\n【背景】\n同サイトは11月に入ってから、クリスマス向けの無料SVGを続けて公開しており、今回もその一つだ。作例、材料、Design Spaceでの手順、よくある質問を1ページにまとめた、いつもの形式で紹介している。\n\n【詳細】\n作例は6つある。透明なアクリルの飾り玉に永久ビニールを貼る、黒のTシャツに白のHTVを貼って家族でそろえる、犬用のバンダナにアイロン接着ビニールを貼る、光沢のある永久ビニールを貼ったマグ、ギフトタグ、廊下に飾る木の看板だ。\nDesign Spaceでの手順は、ファイルを解凍し、取り込み、素材の大きさに合わせ、HTVなら左右反転し、カードストック、HTV、接着ビニールのそれぞれに合わせてマシンの設定を変える。Silhouette Studioでも使えるという。\n材料には、動きのある布に向く伸縮するHTV、綿のTシャツ、EasyWeedのHTV、小型の熱プレス、光沢のある永久ビニール、オーブンに入れられる陶器のマグの無地品、転写テープが並ぶ。軽く洗うかもしれない品には、水に強いビニールを勧めている。\n\n【ポイント・注意点】\nデータは個人の制作用に限られ、データ自体を売ったり配ったりしてはいけない。Cricut Joy、Maker、Explore のいずれでも使える。デザインの寸法は書かれていないので、作る品に合わせて自分で決める必要がある。バンダナのように伸び縮みする布には、記事が勧めるとおり伸縮するHTVを選びたい。色を重ねる場合は、各層の位置がずれないよう気を付けたい。マグに貼るなら、記事にあるようにオーブンに入れられる無地品を選ぶとよい。HTVを使う品では、カットの前の左右反転も忘れないようにしたい。","2026-11-17","Crafty Crafter","https://crafty-crafter.club/christmas/christmas-dog-totem-svg-for-cricut/"],["ミニーのクリスマス柄、個人用の無料SVG","Crafty Crafterが2026年11月16日、ミニーマウスをかたどったクリスマス用の無料SVGを公開した。リボンの形が目を引く遊び心のある図柄で、そろいの服に向くという。赤のベルベットのクッションに白のフロッキーHTVを貼る、木箱にイブの夜用の名入れをするなどの作例を紹介している。データは個人の制作用に限られ、キャラクターを使った品を販売してよいかには触れていない。","\n【概要】\nCrafty Crafterは2026年11月16日、ミニーマウスのシルエットをかたどったクリスマス用の無料カットファイルを公開した。記事は、誰もが知る遊び心のある図柄で、リボンの形がそろいのクリスマスの服に合うと紹介している。\n\n【背景】\n同サイトはこの時期、クリスマス向けの無料SVGを続けて公開しており、11月14日にはミッキーを題材にしたファイルも出している。キャラクターを使った図柄は人気が高い一方、権利の扱いには気を配る必要がある。\n\n【詳細】\n作例には、赤のベルベットのクッションに白のフロッキーHTVを貼る、木箱に光沢のある永久ビニールで名前を入れて「クリスマスイブの箱」にする、黒のTシャツに白のHTVを貼る、マグ、透明なアクリルのオーナメントにグリッターHTVを貼る、クリスマス用のトートバッグが挙がっている。\n手順は、ファイルを解凍し、SVGを取り込み、アイロン接着の素材ならカットの確認画面で左右反転し、ビニールの種類に合わせてカットの設定を確かめ、貼る前に不要な部分をすべて取り除く。Silhouette Studioでも使えるという。\n材料は、グリッターHTV、標準のアイロン接着ビニール、耐熱テープ、綿のトートやTシャツ、光沢のある永久接着ビニール、透明の転写テープ、アクリルのオーナメントの無地品、こすって密着させるスクレーパーだ。\n\n【ポイント・注意点】\nデータは個人の制作用に限って無料で使え、手作りの品を贈り物にするのはよいが、データ自体の再販や再配布は認められない。記事は、ミニーマウスというキャラクターの図柄を使った品を販売してよいかどうかには触れていない。キャラクターには別に権利があるため、販売は考えず、家族や身近な人への贈り物にとどめるのが無難だ。デザインの寸法は書かれていないので、貼る品に合わせて大きさを決めたい。Cricut Joy、Maker、Explore に対応するとされている。HTVを使う場合は左右反転を忘れず、ベルベットのような毛足のある布では、素材に合った温度と圧力を確かめてから押したい。","2026-11-16","Crafty Crafter","https://crafty-crafter.club/christmas/minnie-christmas-svg-for-cricut/"]],"uv":[["京都ステッカー、UVDTFステッカーの白版対応と入稿仕様を解説","京都ステッカーは2026年11月22日、UVDTFステッカーのデータ作成と入稿仕様を解説する記事を公開した。入稿形式はPNGとJPGで、解像度は300DPI以上を推奨している。CMYKに白インクを加えて印刷するため、透明なガラスや濃い色の素材でも見えやすいとしている。一方で金・銀インクやメタリック、箔押し、鏡面の表現には対応しておらず、金や銀はデータ上の色で表す必要がある。参考価格は50×50mm・10枚で税別1,080円からとなっている。","\n【概要】京都ステッカーは、UV硬化型インクで印刷するUVDTFステッカーについて、データの作り方と白版（白インク）の扱い、入稿の仕様をまとめた記事を2026年11月22日に公開した。注文前に知っておきたい形式や表現の制限、料金や納期の目安を一つのページで確認できる内容になっている。\n【背景】UVDTFステッカーは、UVプリンターを持っていない人でもガラスや金属などに印刷したような仕上がりを得られる方法として、名入れやグッズ制作で使われている。透明な素材や暗い色の素材に貼る場合、白インクを下地に使えるかどうかで見え方が大きく変わるため、白版の扱いはデータ作成の重要な点になる。\n【詳細】入稿できる形式はPNGとJPGで、解像度は300DPI以上が推奨されている。印刷はCMYKに白インクを加えた構成で、透明なガラスや濃い色の素材でもデザインが見えるとしている。金・銀インク、メタリック、箔押し、鏡面仕上げには対応しておらず、金や銀の雰囲気はデータ上の色で表現する必要がある。参考価格（税別）は50×50mmで10枚1,080円〜、50枚4,200円〜、100枚7,200円〜。100×100mmでは10枚2,700円〜、50枚10,500円〜、100枚18,000円〜となっている。税別1万円以上で送料無料となり、制作実績としての掲載を認めると10%割引が受けられる。納期は、無料の通常プランが入金後2〜4営業日で発送、有料の特急プランが1〜2営業日で発送。見積もりはウェブの見積もりシステムで作成し、PDFでダウンロードできる。\n【ポイント・注意点】耐久性について同社は、家庭用食洗機で約100回洗っても剥がれなかったとする試験結果を示しているが、デザインによって結果は異なるとしている。貼った後はスキージーでしっかり押さえ、洗う前に24〜72時間置くよう案内している。コップやボトルのようなゆるやかな曲面には貼れる。金・銀など特殊な表現を前提にしたデザインは、仕上がりのイメージを事前に確かめておきたい。","2026-11-22","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/22/24139/"],["京都ステッカー、UVDTFステッカーの仕組みと直接印刷との違い","京都ステッカーは2026年11月22日、UVDTFステッカーの仕組みと、従来の直接印刷との違いを解説する記事を公開した。UVDTFは透明なPETフィルムにUV硬化型インクで印刷したステッカーで、台紙をはがして貼り、転写シートをはがすだけで使え、UVプリンターは要らない。記事では高精細なフルカラーと白インク、耐久性、貼りやすさ、多素材への対応、ふちのない仕上がりの5つを特徴に挙げ、グッズや飲食店のグラス、建設現場のヘルメットなどの用途を紹介している。","\n【概要】京都ステッカーは2026年11月22日、UVDTFステッカーとは何か、仕組みと従来の直接印刷との違いを説明する記事を公開した。初めてUVDTFを使う人に向けて、作り方の流れ、特徴、使い道、料金の目安を整理している。\n【背景】UVプリンターで物に直接印刷するには、機械をそろえたり、印刷できる大きさや形に合わせたりする必要がある。UVDTFは、あらかじめフィルムに印刷したものを貼る方式で、機械を持たない人でもUV印刷に近い仕上がりを得られる選択肢として広がっている。\n【詳細】記事によると、UVDTFは透明なPETフィルムにUV硬化型インクで印刷したステッカーで、台紙をはがして対象物に置き、上の転写シートをはがすだけで貼れる。UVプリンターは必要ない。特徴として、白インクを使った高精細なフルカラー、耐久性と耐水・耐UV性、貼りやすさ、さまざまな素材への対応、ふちのない仕上がりの5点を挙げている。用途には、スマホケースやタンブラー、マグ、ノートパソコン、文具などのグッズ、飲食店のビールグラスへのロゴ、建設現場のヘルメットのロゴや工具のラベル、学校の名前シール、ギフト用のグラスが示されている。料金の目安は50×50mmで10枚税別1,080円〜、50枚4,200円〜、100枚7,200円〜、100×100mmで10枚2,700円〜、50枚10,500円〜、100枚18,000円〜。税別1万円以上で送料無料、制作実績の掲載を認めると10%割引になる。通常プランは入金後2〜4営業日、有料の特急プランは1〜2営業日で発送する。\n【ポイント・注意点】入稿はPNGまたはJPGで、300DPI以上が推奨される。見積もりはウェブのシステムで作れ、PDFでダウンロードできる。同社は家庭用食洗機で約100回洗っても剥がれなかったという試験結果を示しているが、デザインによって差があるとしている。直接印刷と比べて、少ない枚数から手軽に始めやすい点が利点だが、貼り方や洗うまでの待ち時間など、使う側の扱いも仕上がりの長持ちに関わる。","2026-11-22","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/22/24135/"],["xToolの卓上UV機O1 Omniを独ブログが実機レビュー","ドイツのCaschys Blogは2026年11月21日、xToolの卓上UVプリンター「O1 Omni Printer」のデュアルUV版のレビューを掲載した。デュアルUV版は希望価格3,199ユーロ、キャンペーン価格2,979ユーロ。本体は約40kgで、台板は2種類、高さ15cmまでの物に印刷でき、凹凸は最大7mm。小物は最高画質で10〜15分ほどで仕上がった。結果は優れているが、大きさと価格から用途の限られる機械だと結論づけた。","\n【概要】ドイツのテック系ブログCaschys Blogは2026年11月21日、xToolの卓上UVプリンター「O1 Omni Printer」を実際に使ったレビューを公開した。試したのは2つのヘッドを持つデュアルUV版で、設置から印刷、手入れ、消耗品までを具体的に報告している。\n【背景】卓上UVプリンターは、個人や小規模の店がスマホケースや雑貨に直接印刷できる機械として、各社の新機種が続いている。記事ではeufyMakeのE1とも比べ、どちらがどんな人に向くかにも触れている。\n【詳細】O1 Omniは3つの版で売られている。シングルUVの基本モデルは通常2,399ユーロ（店頭では2,179ユーロのことが多い）。デュアルUV版は希望価格3,199ユーロ、キャンペーン価格2,979ユーロで、印刷が速く、柔らかい白と硬い白のインク、ブラックライトで光る蛍光インクが使える。UV＋DT版は通常3,299ユーロ、キャンペーン価格3,079ユーロで、衣類向けのDTGとDTF印刷にも対応する。本体は約40kg、大きさは約71×37×47cm。台板は33×12cmと33×42cmの2種類で、高さ15cmまでの物に印刷でき、xToolは凹凸を最大7mmまでとしている。設置には電源とUSB-CでのxTool Studioへの接続が必要で、その後は家庭のWi-Fiにつなげる。インクは注射器でカートリッジの管に吸い上げるため時間がかかる。試し刷りでは、陶器のマグネットが約10分、小物は最高画質で10〜15分ほど。約30×40cmのキャンバスは50分近くかかり、その6割以上が下地の白の印刷だった。\n【ポイント・注意点】欠点として、UVインクのにおいがあること、自動の手入れ（SmartCycle 2.0）の音が大きく、休暇モードでも1日に数回、毎回30秒ほど動くことを挙げている。ヘッドが乾かないよう電源を入れたままにする必要もある。基本のUVインクは6本で125ユーロ弱。筆者は結果を高く評価しつつ、大きさと価格から用途の限られる機械だと結論づけた。DTFのヘッドは購入前に選ぶ必要がある。","2026-11-21","Caschys Blog","https://stadt-bremerhaven.de/xtool-o1-omni-printer-alles-drucker-auf-uv-basis-ausprobiert/"],["京都ステッカー、UVDTFで1枚から始めるオリジナルグッズ販売","京都ステッカーは2026年11月20日、UVDTFステッカーを使ってオリジナルグッズを販売する方法と料金・仕様をまとめた記事を公開した。UVプリンターを持たなくても、ガラスや金属、プラスチック、木、陶器などの商品に貼って飾れる点を紹介している。注文は1枚から可能で、50×50mm・10枚は税別1,080円から、100枚は7,200円からが目安。印刷はCMYKと白インクで、金・銀や箔押しには対応しない。食洗機約100回で剥がれなかったとの試験結果も示す。","\n【概要】京都ステッカーは2026年11月20日、UVDTFステッカーを使ったオリジナルグッズの販売について、料金と仕様を説明する記事を公開した。グッズを作って売りたい個人や店に向けて、対応する素材、料金、納期、データの条件、よくある質問をまとめている。\n【背景】グッズに直接UV印刷をするには機械と手間がかかるが、UVDTFステッカーなら印刷済みのフィルムを貼るだけで済む。UVプリンターを持たずに、少ない数から商品づくりを試したい人の選択肢として紹介されている。\n【詳細】UVDTFステッカーは、透明なPETフィルムにUV硬化型インクで印刷したもので、ガラス、金属、プラスチック、木、陶器に貼れる。コップやボトルのようなゆるやかな曲面にも対応する。印刷はCMYKに白インクを加えた構成で、ふちのない仕上がりになる。金・銀、メタリック、箔、鏡面の表現には対応していない。参考価格（税別）は50×50mmで10枚1,080円〜、50枚4,200円〜、100枚7,200円〜、100×100mmで10枚2,700円〜、50枚10,500円〜、100枚18,000円〜。データの種類や個別カットなどのオプションで価格は変わる。税別1万円以上で送料無料、制作実績として掲載を認めると10%割引になる。納期は、無料の通常プランが入金後2〜4営業日、有料の特急プランが1〜2営業日で発送。入稿はPNGまたはJPGで、300DPI以上を推奨している。見積もりはウェブの見積もりシステムで24時間受け付けており、画像を上げて大きさや数、オプションを選ぶと、PDFの見積書をダウンロードできる。\n【ポイント・注意点】よくある質問では、最小注文が1枚であること、曲面にも貼れることを答えている。同社の試験では家庭用食洗機で約100回洗っても剥がれなかったが、デザインによっては剥がれることがあるとしている。スキージーでしっかり押さえ、洗う前に24〜72時間置くことが勧められている。販売する商品に使う場合は、食器など洗う物かどうかを考え、扱い方を買い手に伝える工夫も必要になる。","2026-11-20","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/20/24063/"],["京都ステッカー、100均のUV転写シールと専門業者製作の違い","京都ステッカーは2026年11月20日、100円ショップで売られているUV転写シールと、専門業者が作るオリジナルのUV転写ステッカー（UVDTF）の違いを解説する記事を公開した。100均の品は決まったデザインから選ぶのに対し、業者製作は自分の絵柄で1枚から大量まで注文できる点を違いに挙げている。透明PETにUV硬化型インクで印刷し、ガラスや金属など多くの素材に貼れる。参考価格は50×50mm・10枚で税別1,080円からとしている。","\n【概要】京都ステッカーは2026年11月20日、100円ショップのUV転写シールと、専門業者に頼むオリジナルのUV転写ステッカーの違いを説明する記事を公開した。手軽な市販品と、自分のデザインで作る注文品の使い分けを考える材料になる内容だ。\n【背景】UV転写シールは、100円ショップでも見かけるほど身近になっている。一方で、店のロゴや自作のイラストなど、自分だけのデザインで作りたい場合は、専門業者に注文する方法がある。記事は両者の違いを、デザインの自由度や注文できる数の面から整理している。\n【詳細】記事によると、100均の品はあらかじめ用意されたデザインから選ぶのに対し、業者製作は自分の絵柄を使い、1枚から大量まで注文できる。業者のUVDTFは透明なPETフィルムにUV硬化型インクで印刷し、ふちのない仕上がりになる。ガラス、金属、プラスチック、木、陶器に貼れ、ゆるやかな曲面にも対応する。印刷はCMYKと白インクで、金・銀、メタリック、箔、鏡面は対応しない。参考価格（税別）は50×50mmで10枚1,080円〜、50枚4,200円〜、100枚7,200円〜、100×100mmで10枚2,700円〜、50枚10,500円〜、100枚18,000円〜。税別1万円以上で送料無料、実績掲載の許可で10%割引。通常プランは入金後2〜4営業日、特急プランは1〜2営業日で発送する。用途には、グッズ、飲食店のグラスのロゴ、店先の飾り、ヘルメットのロゴや工具のラベル、学校の名前シール、写真や言葉入りのギフト用グラスを挙げている。\n【ポイント・注意点】同社は家庭用食洗機で約100回洗っても剥がれなかったという試験結果を示す一方、デザインによっては剥がれることがあるとしている。貼った後はスキージーで押さえ、洗うまで24〜72時間置くよう案内している。決まった柄で十分なら市販品、自分の柄や店のロゴを使いたいなら注文品と、目的で選ぶのがよさそうだ。入稿はPNGまたはJPGで、300DPI以上が推奨されている。見積もりはウェブで24時間受け付け、PDFで受け取れる。","2026-11-20","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/20/24076/"],["LONGER、Formnext 2026で卓上UV機ePrintを紹介","3Dnativesは2026年11月19日、フランクフルトで開かれた展示会Formnext 2026で、LONGERの卓上UVプリンター「ePrint」を取材した記事を公開した。記事は、これまで大型で印刷所が主に使ってきたUVプリンターが、机や工房に置ける大きさになってきたと指摘する。LONGERは3Dプリンターで知られるブランドで、マーケティング担当のJenny Zhang氏に、表現できる効果や色、使うソフトについて聞いた様子を動画で伝えている。","\n【概要】3Dプリント専門メディアの3Dnativesは2026年11月19日、Formnext 2026の会場でLONGERの卓上UVプリンター「ePrint」を取材した記事を掲載した。記事の本文は短く、詳しい説明は記事に埋め込まれた動画インタビューで紹介されている。\n【背景】記事は冒頭で、UVプリンターはこれまで大型で、主に印刷所が使うものだったが、今では机や工房に置ける大きさになってきたと述べている。Formnextでもそうした機種が見られたという。LONGERは卓上3Dプリンターで、ものづくりを楽しむ人の間でよく知られたブランドとして紹介されている。\n【詳細】LONGERは今年、ePrintを投入した。記事はこの機械を、オリジナルの品を作りたい人のための小型の機械だと説明している。筆者はLONGERのマーケティング担当、Jenny Zhang氏に会い、この機械で出せる効果、使える色、使うソフトについて話を聞いた。答えは記事の下に埋め込まれた動画で紹介されており、記事の文章には価格や印刷できる大きさ、速さなどの仕様は書かれていない。会場では、LONGERは12.0ホールのA07ブースに出展していた。ページの案内によると、Formnext 2026はフランクフルトで11月17日から20日まで開かれた。記事の最後では、読者に対し、UVプリンターで部品を飾っているか、LONGERというブランドを知っていたかを問いかけている。記事の文章は、動画を見る前の導入にあたる内容になっている。\n【ポイント・注意点】3Dプリンターの展示会に卓上UVプリンターが並んだことは、3Dプリンターを作る会社がUV印刷へ広がっている流れを示している。ただし今回の記事自体には数字の仕様がないため、価格や性能を比べるには、メーカーの公式ページや別の記事で確かめる必要がある。3Dnativesは11月16日にもePrintを取り上げた別の記事を出しており、今回の記事からもリンクしている。卓上UVプリンターを検討している人は、動画で担当者の説明を直接確かめられる。","2026-11-19","3Dnatives","https://www.3dnatives.com/en/longer-eprint-formnext-19112026/"],["LONGERのブラックフライデー、卓上UV機ePrintが1,899ドルから","3DPrinting.comは2026年11月17日、LONGERのブラックフライデーセールの内容をまとめた記事を公開した。卓上UVプリンター「ePrint」は、シングルUV版が通常2,499ドルのところセール価格1,899ドル、デュアルUV版が2,499ドル、UV＋DT版が2,699ドル。クーポンを使うとさらに安くなる。セールは世界向けで、米国東部時間の11月3日から12月2日まで。記事はLONGERが有料の提携先だと明記している。","\n【概要】3Dプリントのニュースサイト3DPrinting.comは2026年11月17日、LONGERのブラックフライデーセールを紹介する記事を公開した。卓上UVプリンター「ePrint」を中心に、レーザー加工機や3Dプリンターのセール価格とクーポンを一覧にしている。価格は11月16日時点のものとしている。\n【背景】年末の商戦期には、卓上UVプリンターやレーザー加工機の値引きが各社で相次ぐ。記事は、LONGERが有料のブラックフライデー提携先であり、記事のリンクから購入されるとサイトに手数料が入ることを明記している。\n【詳細】ePrintはシングルUV、デュアルUV、UV＋DTの3種類。シングルUVは通常2,499ドルがセール価格1,899ドルで、クーポンBF7を使うと1,766.07ドル。デュアルUVは3,299ドルが2,499ドル、BF8で2,299.08ドル。UV＋DTは3,299ドルが2,699ドル、BF8で2,483.08ドルになる。記事によると、ePrintは物に直接カラー印刷でき、盛り上げは最大15mm、対応する素材は300種類以上。UV＋DT版は硬い面、布、DTG、UV DTFの印刷に対応する。クーポンは、BF5が全注文5%引き、BF6が299ドル以上で6%引き、BF7が899ドル以上で7%引き、BF8が1,999ドル以上で8%引き。セール全体ではレーザー加工機やプリンターが最大38%引きで、クーポンでさらに5〜8%安くなる。期間は米国東部時間の2026年11月3日から12月2日までで、世界向け、ドル建てとなっている。同じセールでは、レーザー加工機Ray5の5W版が159.99ドル、3DプリンターLK5 Proが279.99ドルなどとなっている。\n【ポイント・注意点】記事は提携先の宣伝を兼ねているため、価格は公式ストアでも確かめたい。ePrintの3種類は使える印刷方式が違うため、布にも印刷したいかどうかで選ぶ版が変わる。クーポンは購入額で割引率が変わる仕組みなので、高い版ほど割引の効果が大きい。","2026-11-17","3DPrinting.com","https://3dprinting.com/news/longer-black-friday-2026/"],["MAW、ローランドDGの円筒UV機RC-300を国内初導入","大阪の株式会社MAWは2026年11月17日、ローランド ディー.ジー.の円筒形UVインクジェットプリンター「VersaObject RC-300」を国内で初めて導入したと発表した。対象物を回しながら側面に360°のフルカラー印刷ができ、ステンレスボトルやタンブラー、化粧品容器、ガラス製品などに対応する。直径45〜127mm、最大解像度1,200dpiで、版を作らないため試作や小ロットに向く。同機種の増設も予定している。","\n【概要】オリジナルグッズ制作サービス「ME-Q（メーク）」を運営する株式会社MAWは、2026年11月17日付のプレスリリースで、ローランド ディー.ジー.の「VersaObject RC-300」を国内導入第1号として導入したと発表した。ボトルやタンブラーへの360°のUVフルカラー印刷に対応する。\n【背景】ボトルやタンブラーは企業のノベルティやOEM商品、オリジナルブランドの品として需要がある。円筒形の物の側面に一周ぐるりと印刷するには専用の機械が必要で、版を作らないデジタルのUV印刷なら、試作品や少ない数の注文にも応えやすい。\n【詳細】RC-300は、対象物を回しながら側面に印刷する円筒形のUVインクジェットプリンター。リリースでは5つの特徴として、ボトルやタンブラーへの360°の全周印刷、まっすぐな円筒と条件付きでゆるやかなテーパー形状への対応、最大1,200dpiとCMYK・白・グロス・プライマーの使用、ステンレス・ガラス・プラスチックへの印刷（素材と形ごとにテスト印刷が必要）、版の要らないデジタル印刷を挙げている。仕様は、方式がピエゾ式インクジェットのヘリカル印刷、直径45〜127mm、長さ30〜355mm、最大印刷幅300mm、最大テーパー角10°（条件付き）、最大重量3kg、インクはEUV-HB（UV）。MAWは大阪市中央区に本社があり、代表は南條康司氏、2009年4月設立、資本金は500万円。同じ機種の増設も予定しており、問い合わせ先としてME-Qの商品ページを案内している。\n【ポイント・注意点】食洗機への耐性について、リリースは、製品ページの公開時点でメーカーが高密着モードの耐性を試験中だったとしている。2018年のガラスでの試験結果も紹介しているが、RC-300やEUV-Hインクの試験ではないと明記し、食洗機への耐性は保証していない。使う素材や形ごとにテスト印刷が必要な点にも注意したい。対応する形はまっすぐな円筒と条件付きのゆるやかなテーパー形状で、重さ3kgを超える物は扱えない。","2026-11-17","PR TIMES","https://prtimes.jp/main/html/rd/p/000000415.000072705.html"]],"risk":[["米バージニア州で5歳未満の子どもがはしかで死亡 州で今年初 全米の死者は12人以上","米バージニア州保健局は、はしか（麻しん）の検査で陽性となった5歳未満の子どもが死亡したと報告した。同州で今年はしかによる死亡が確認されたのは初めてで、2026年に各州が報告したはしか関連の死者は少なくとも12人となった。同州の患者は今年220人で、その大多数はワクチンを接種していない人だった。米国は数日前に麻しん排除国の認定を失ったばかりで、感謝祭や年末の休暇で家族が集まる時期の感染拡大が心配されている。","\n【概要】\n米バージニア州で、はしか（麻しん）の検査で陽性となった幼い子どもが死亡した。AP通信が報じたもので、当局によると、同州で今年はしかによる死亡が確認されたのは初めてだ。バージニア州保健局は金曜日にこの死亡を報告したが、子どもについては5歳未満であることしか明らかにしていない。\n【背景】\nこの発表のわずか数日前、米国、メキシコ、ボリビアは、はしかを排除した国としての認定を失った。米疾病対策センター（CDC）が把握している2026年の全米の患者数は5,800人を超え、1991年以降で最も多い年となっている。はしかのワクチンは、子どもを守るための基本的な予防手段とされている。\n【詳細】\n2026年に各州が報告したはしか関連の死者は、少なくとも12人にのぼる。ペンシルベニア州が8人（うち1人は先週）、ニューヨーク州が1人、ウィスコンシン州が2人で、これに今回のバージニア州の子どもが加わる。バージニア州では今年220人の患者が報告されており、多くは州の中部に集中している。患者の大多数は、はしかのワクチンを接種していない人だった。来週の感謝祭や、12月のクリスマスなどの休暇で家族が集まる時期を迎え、感染がさらに広がることへの懸念が出ている。専門家によると、ほとんどの大人は追加の接種を必要としないが、追加接種の対象としてふさわしい人もいるという。また、CDCは11月、はしかと妊娠に関する新しい指針を出した。妊婦が感染すると、流産や、生まれつき感染した赤ちゃんの誕生、肺炎などの健康問題の危険が高まることが示されている。\n【ポイント・注意点】\nはしかのワクチンは妊娠中の女性には接種されず、妊娠の前に接種しておくことが勧められている。今回の死亡は、幼い子どもにとってはしかが命に関わる病気であることを改めて示した。ただし、亡くなった子どもの接種歴や詳しい経過は記事では明らかにされていない。家族が集まる休暇の前に、子どもの定期接種が予定どおり済んでいるかを母子手帳などで確かめておきたい。大人も、自分が追加接種の対象になるかどうか、医療機関に相談するとよい。","2026-11-21","AP通信（News4JAX）","https://news4jax.com/health/2026/11/21/virginia-reports-young-child-is-the-states-first-measles-death-in-2026"],["温暖化で乳幼児の脱水リスクが高まる 水分の指針は古いまま 独チームが総説","ドイツのルール大学ボーフムなどの研究チームは、気温の上昇と長く見直されていない水分摂取の指針によって、乳幼児や子どもが急性・慢性の脱水にさらされる危険が高まっているとする総説を学術誌「Frontiers in Public Health」に発表した。乳幼児の体重に占める水分は65〜80%と大人より多く、あるメタ分析では平均60%の子どもが地域の推奨量を満たしていなかった。研究チームは学校での水の提供や日陰の確保などを提言している。","\n【概要】\nドイツのルール大学ボーフム、パーダーボルン大学、聖ヨーゼフ病院の研究者らが、気候変動と子どもの脱水の関係をまとめた総説（ナラティブレビュー）を学術誌「Frontiers in Public Health」に発表した。気温の上昇と、長く見直されていない水分摂取の指針によって、乳幼児や子どもが急性・慢性の脱水にさらされる危険が高まっていると指摘している。\n【背景】\n水分は大人の体重の約40〜50%を占めるが、乳幼児では65〜80%にのぼる。子どもは体重のわりに汗で失う水分が大人より多い。のどの渇きは、体重の約1〜2%が失われたころに起こる。ヨーロッパでは極端に暑い日が20世紀半ばから3倍以上に増え、熱波の気温は地域で平均2.3℃上がった。ユニセフは、排出がこのまま続けば、2050年までに厳しい熱波にさらされる子どもが約8倍になると見込んでいる。\n【詳細】\n研究チームは医学文献データベースMEDLINEを2段階で検索し、2025年11月に始めて2026年3月と8月に更新した。中央ヨーロッパに焦点を当て、観察研究や無作為化比較試験、総説などを整理した。ドイツの2017〜2022年の健康保険のデータでは、気温の上昇と救急入院が関連し、0〜17歳の子どもと65歳を超える大人で危険が高かった。あるメタ分析では、平均60%（±24%）の子どもが地域の推奨する水分量を満たしていなかった。ドイツの調査「EsKiMo II」では、6〜11歳の女子の49%、男子の34%が飲み物の目標に届いていなかった。体重の1〜4%の水分が急に失われると、頭痛や食欲の低下、いらいら、能力の低下が起こり、慢性的な水分不足は腎臓の結石や慢性腎臓病、心臓や血管への負担と関連するという。一方、ドイツとオーストリアの指針は、暑さによる水分の損失について2000年以降、根本的には改められていない。\n【ポイント・注意点】\n研究チームは、幼稚園や小学校での水分補給の教育、無料で水道水を飲める環境、日陰の確保を勧めている。ドイツの学校713校を調べた研究では、5校に1校で校庭に日陰がなかった。ただし、子どもを対象とした長期の無作為化比較試験はなく、熱波の中で中央ヨーロッパの子どもが実際にどれだけ汗をかくかのデータもないなど、根拠には限りがある。暑い時期には、のどが渇く前からこまめに水分をとらせることを心がけたい。","2026-11-21","Bioengineer.org","https://bioengineer.org/pediatric-dehydration-risks-increase-as-climate-change-intensifies-extreme-heatwaves/"],["胎児期のネオニコチノイド系殺虫剤曝露、9歳時の認知機能の低さと関連 阪大200人分析","大阪大学の研究チームは、出生時に採取した臍帯血清200検体でネオニコチノイド系殺虫剤に関連する10化合物を測定し、子どもの神経発達を生後10か月から9歳まで追跡した。幼児期には関連が見られなかったが、9歳時点ではジノテフランの濃度が高いほど処理速度の得点が、アセタミプリドの代謝物の濃度が高いほど知覚推理の得点が低い傾向があった。因果関係は示されておらず、研究チームはさらなる検証が必要だとしている。","\n【概要】\n大阪大学の研究チームが、妊娠中のネオニコチノイド系殺虫剤への曝露と、子どもの認知機能との関連を調べた研究を医学誌「JAMA Network Open」に発表した。出生時に採取した臍帯血清200検体を分析し、子どもの神経発達を生後10か月から9歳まで複数の時点で追跡した。その結果、幼児期には関連が見られなかった一方、9歳時点では一部の化合物の濃度が高いほど、知能検査の特定の項目の得点が低いという関連が見られた。\n【背景】\nネオニコチノイド系殺虫剤は安価で効果が高いことから、世界で最も広く使われている殺虫剤の一つだ。分解が遅く、食品や水を汚染することがある。この殺虫剤はニコチン性アセチルコリン受容体に作用するが、この受容体は人にもあり、胎児期の脳の細胞の成熟に関わっている。日本でのこれまでの研究では、水道水から一年を通してこれらの殺虫剤が検出されており、人が曝露する経路の一つと考えられている。\n【詳細】\n研究チームは、臍帯血清中のネオニコチノイド関連の10化合物を測定し、そのうち殺虫剤のジノテフランと、アセタミプリドの代謝物であるデスメチルアセタミプリドの2つに注目した。どちらも半数を超える検体から検出された。生後10か月から32か月の幼児期については、多重比較の補正を行ったあとでは、いずれの化合物も神経発達の指標との関連は見られなかった。一方、9歳時点では、ジノテフランの濃度が高いほどウェクスラー式知能検査（WISC）の処理速度の得点が低く、デスメチルアセタミプリドの濃度が高いほど知覚推理の得点が低いという関連が見られた。筆頭著者の永田氏は、これまでの研究の多くが神経発達を一つの時点でしか見ていなかったのに対し、今回は複数の年齢で追跡したと説明している。責任著者の土屋氏は、幼児期の結果は学童期の結果ほど一貫していなかったとし、関連は認知の領域と子どもの年齢の両方によって異なる可能性があると述べている。\n【ポイント・注意点】\n今回の研究は関連を示したもので、因果関係は確認されていない。研究チームは、検体数が少なく、測定されたネオニコチノイドの濃度も低かったことから、結果は今後の研究で確かめる必要があるとしている。そのうえで、妊娠中のネオニコチノイドへの曝露が神経発達に与えうる影響を明らかにするため、さらなる研究が必要だと呼びかけている。","2026-11-20","Medical Xpress","https://medicalxpress.com/news/2026-11-insecticide-exposure-pregnancy-linked-cognition.html"],["マラリア抗体L9LS、乳児の感染を78%防ぐもワクチンR21の反応を弱める恐れ マリで試験","米国立アレルギー感染症研究所（NIAID）が開発したマラリアの抗体薬L9LSを、西アフリカのマリで生後1〜12か月の乳児に投与した試験で、熱帯熱マラリア原虫の感染を78%防ぐ効果が確認された。一方、5か月前にL9LSを受けた乳児では、その後に接種したマラリアワクチンR21に対する抗体の反応が、偽薬の乳児より約20〜30%低かった。研究チームは乳児を対象とした大規模な試験の計画を見合わせるとしている。","\n【概要】\nマラリアを防ぐ抗体薬（モノクローナル抗体）L9LSを乳児に投与した臨床試験の結果が、米国熱帯医学衛生学会（ASTMH）の年次総会で発表された。L9LSは安全で忍容性が高く、熱帯熱マラリア原虫の感染を78%防いだ。しかし、L9LSを受けた乳児では、のちに接種したマラリアワクチンR21への抗体の反応が低くなっていた。このため、乳児の大規模な試験は見合わせとなった。\n【背景】\nL9LSは米国立アレルギー感染症研究所（NIAID）が開発した抗体薬で、開発中のマラリアの抗体薬の中で最も進んでいる。これまでにマリとケニアで、より年長の子どもに皮下注射で投与され、高い安全性と効果が示されていた。世界保健機関（WHO）の推計では、2024年にマラリアで亡くなった人は約61万人で、その多くはアフリカの幼い子どもだった。この死者数は10年間ほとんど変わっておらず、薬や殺虫剤への耐性が広がっていることが一因とみられている。\n【詳細】\n第Ib相の試験は2024年から2025年にかけて、マリの3か所で行われた。生後1〜12か月の健康な乳児180人を半数ずつに分け、一方にはL9LSを筋肉注射し、もう一方には偽薬として食塩水を注射した。その結果、L9LSを受けた乳児では、5か月後に接種したR21ワクチンに対する抗体の反応が、偽薬の乳児より約20〜30%低かった。L9LSがR21に含まれるマラリアのたんぱく質に弱く結合することが原因として考えられるが、このたんぱく質はL9LSの主な標的ではない。マリで試験を率いたカスム・カイエンタオ氏は「より大規模な乳児の試験の計画を止めなければならない」と述べた。ASTMH会長のテリー・テイラー氏は、R21の効果が実証されていることから、R21への干渉の可能性は重要な結果だとしている。\n【ポイント・注意点】\nR21の3回の接種を終えていない子ども（おおむね2〜3歳未満）への開発は、抗体の反応の低下が実際に予防効果を弱めるかどうかがわかるまで検討しないという。一方、R21の接種を終えたあとも感染の恐れがある子どもに向けた使い方は引き続き探る。例えば、重いマラリアや貧血で入院した子どもの退院後の予防や、接種後の季節的なマラリア予防薬の代わりとしての使用だ。妊婦への使用を調べることにも関心が寄せられている。","2026-11-20","Medical Xpress","https://medicalxpress.com/news/2026-11-malaria-antibody-infants-lowers-immune.html"],["インフルエンザが4週連続で増加 北海道は警報レベル超え 休業の学校など1542施設","厚生労働省が2026年11月20日に発表した第46週（11月9日〜15日）のインフルエンザ発生状況によると、全国の定点あたり報告数は11.94人で、第43週から4週連続で増えた。都道府県別では北海道が30.63人と最も多く、警報レベルの目安の30人を超えた。休校や学年閉鎖、学級閉鎖などの休業措置をとった学校や保育施設は計1,542施設にのぼった。受験シーズンを迎え、家族も含めた感染予防が呼びかけられている。","\n【概要】\n厚生労働省は2026年11月20日、第46週（11月9日〜15日）のインフルエンザの発生状況を発表した。全国の定点あたり報告数は11.94人で、前週の11.00人から増え、第43週から4週連続の増加となった。都道府県別では北海道が30.63人で最も多く、警報レベルの目安とされる30人を超えた。学校や保育施設での休業措置も前週より増えている。\n【背景】\n今回の全国の数は増え続けているものの、前年同期の37.73人と比べると低い水準にとどまっている。ただし地域による差は大きく、北海道と東北地方で特に多くなっている。受験シーズンが本格化する時期と重なっており、受験生のいる家庭にとっては注意が必要な状況だ。\n【詳細】\n北海道の30.63人に続き、宮城県が24.20人、福島県が23.02人、岩手県が22.83人、青森県が20.88人、山形県が20.54人だった。東北地方では秋田県を除く5県が20人を超えた。最も少なかったのは徳島県の5.24人だった。第46週に報告された学校などの休業措置は、休校が27校、学年閉鎖が413校、学級閉鎖が1,102校だった。休業措置をとった施設は合わせて1,542施設で、前週の1,325施設から増えた。内訳は小学校が1,017施設、中学校が276施設、高校が101施設、保育所が82施設、幼稚園が54施設で、小学校が全体の多くを占めている。第41週から第45週に検出されたウイルスの型は、A型のAH1pdm09が205件（96%）で大半を占め、A型のAH3亜型とB型はそれぞれ4件（2%）だった。\n【ポイント・注意点】\n受験シーズンが本格化するなか、受験生本人だけでなく、家族や周りの人も感染予防を心がけることが呼びかけられている。厚生労働省は、外出後の手洗い、こまめな換気、十分な休養、バランスのとれた食事を勧めている。記事では、厚生労働省のインフルエンザの総合ページや、北海道感染症情報センターによる第46週の総評も紹介されている。流行している地域に住む家庭では、子どもの通う学校や保育施設の休業の情報にも注意しておきたい。","2026-11-20","リセマム","https://resemom.jp/article/2026/11/20/88390.html"],["深夜のスマホ1時間で睡眠26分減 夜のSNSは44分減、女子で影響強く 米10代218人","米ストーニーブルック大学などの研究チームは、13〜18歳の米国の10代218人のスマートフォンにアプリを入れ、平均17.5日間の使用を記録した。深夜の使用が1時間増えるごとに睡眠は約26分、夜間のSNSの使用では約44.4分短かった。女子では夕方から夜の使用が1時間増えるごとに寝つきが82.2分遅く、睡眠が70.8分短かったが、男子では統計的に意味のある関連はなかった。","\n【概要】\n米ストーニーブルック大学のジーナ・マリー・マシュー氏らの研究チームが、10代のスマートフォンの使用と睡眠の関係を調べた研究を「Journal of Adolescent Health」誌に発表した。夜、特に深夜のスマホやSNSの使用が多いほど睡眠が短く、その関連は女子で強かった。研究チームは、10代の睡眠を改善するには、画面を見る時間全体を減らすだけでは足りない可能性があるとしている。\n【背景】\n専門家は、10代は毎晩少なくとも9〜9時間半の睡眠をとるよう勧めている。スマホの使用は寝る時間を遅らせ、頭を冴えさせ、睡眠を妨げることがある。しかし、これまでの研究の多くは、10代が自分で見積もった画面を見る時間に頼っており、正確でないことがあった。\n【詳細】\n研究には13〜18歳の米国の10代218人が参加した。研究チームは、本人のスマホに「RealityMeter」というアプリを入れ、平均17.5日間にわたり、どのアプリをどの種類で、いつ、どれだけ使ったかを記録した。使用は日中、夕方から夜、深夜の時間帯に分け、スマホ全般の使用とSNSの使用に分けて分析した。その結果、1日のスマホの使用が多い10代ほど寝る時間が遅く、睡眠時間が短く、平日と週末の睡眠のずれが大きかった。多くは週末に睡眠不足を取り戻していた。深夜のスマホの使用が1時間増えるごとに睡眠は約26分短く、夜間のSNSの使用が1時間増えるごとに約44.4分短かった。最も強い関連が見られたのは夕方から深夜の使用、特にSNSだった。女子では、夕方から夜の使用が1時間増えるごとに寝つきが82.2分遅くなり、睡眠が70.8分短くなっていたが、男子ではこの関連は統計的に意味のあるものではなかった。男女とも、スマホの使用が多いほど休みの夜に睡眠を取り戻す量が多かった。自分で評価した睡眠の質の悪さと関連したのは夜間のSNSの使用だけで、その影響は小さかった。\n【ポイント・注意点】\nこの研究は観察によって関連を示したもので、因果関係は確かめられていない。研究チームは今後、寝る前後のスマホの使用を控えることや、SNSの使用を減らすことなど、特定の習慣に絞った対策が効果をもつかを確かめる必要があるとしている。こうした対策は、影響を受けやすいとみられる女子に特に役立つ可能性があるという。","2026-11-20","Medical Xpress","https://medicalxpress.com/news/2026-11-late-night-linked-shorter-teens.html"],["アレルギーの始まりは免疫でなく「細胞のエネルギー不足」か 子どもの最大3人に1人が発症","子どもの最大3人に1人がかかるアレルギー疾患は、免疫の異常からではなく、皮膚や腸、鼻、肺などの表面を覆う細胞のエネルギー不足から始まるのではないか。オーストラリアのグリフィス大学などの研究チームが、116の症例対照研究、患者3776人と対照2164人のデータを分析し、こうした仮説を医学誌Allergyに発表した。好酸球性食道炎では13の患者集団すべてで同じ変化が見られたが、因果関係はまだ証明されていない。","\n【概要】オーストラリア・グリフィス大学の臨床免疫学者ピーター・スミス教授らの研究チームは、一部のアレルギーは免疫の異常ではなく、体の表面を守る細胞のエネルギー不足から始まるとする仮説を医学誌Allergyに発表した。共著者はマウントサイナイ、ルーベン、コーク、サウサンプトン、チューリッヒ、マイアミ、シンガポール、アバディーンなどの研究者だ。\n【背景】アレルギー疾患は子どもの最大3人に1人がかかる。これまでアレルギーはまず免疫の異常から始まり、その後に体の表面のバリアが傷つくと教えられてきた。研究チームは、その順番が逆かもしれないと考えた。\n【詳細】チームは、知る限り最大というアレルギーの多層的な分子データを分析した。116の症例対照研究、患者3776人、対照2164人分にあたる。仮説の中心は、皮膚、腸、鼻、肺、食道を覆う上皮細胞の中にあるミトコンドリアだ。これらの細胞のエネルギーが足りないと、警報を出しやすくなり、アレルギーの免疫反応につながる可能性がある。最も強い根拠は好酸球性食道炎で、傷んだミトコンドリアを片付ける細胞の仕組みが、13の独立した患者集団すべてで低下していた。湿疹では、炎症のない皮膚でもバリアや抗酸化の守りの変化が見つかった。一方、すでに起きているぜんそくや鼻ポリープではこの信号は見られず、花粉症では一部にとどまった。加工された食事、大気汚染、マイクロプラスチック、洗剤、食物繊維の不足、早い時期の抗生物質は、いずれも同じ細胞のエネルギーの力に影響している可能性があるという。\n【ポイント・注意点】この仮説は、なぜ一部の子どもが湿疹や食物アレルギー、花粉症、ぜんそくを発症するのかを説明する手がかりになりうる。グリフィス大学のニック・ウェスト准教授は、今の薬は流れの下流で働くため、治療をやめると病気がしばしば戻ると指摘した。次の段階として、アレルギーが出る前の乳児でこれらの細胞を直接測ることを提案している。ただし著者自身が、これは検証すべき仮説であり確立した仕組みではなく、因果関係は証明されていないとしている。","2026-11-20","Medical Xpress","https://medicalxpress.com/news/2026-11-allergies-cells-short-energy-immune.html"],["妊娠中のストレス、時期によって産後うつや乳児の反応に違い 米大学が毎週測定","米ミシガン州立大学の研究チームは、妊娠15週ごろから毎週ストレスを測定し、時期による影響を調べた2つの研究を発表した。妊娠中を通じてストレスが高いほど産後6か月時点のうつのリスクが高く、子ども時代の逆境体験が4つ以上ある女性では、20週のストレスや週ごとの揺れの大きさが、うつの悪化と結びついていた。乳児では、ストレスがコルチゾールの反応に影響する時期が女児と男児で異なっていた。","\n【概要】\n米ミシガン州立大学（MSU）の研究チームが、妊娠中のストレスを毎週測定し、ストレスを受ける時期が母親と乳児にどう影響するかを調べた2つの研究を発表した。1つは母親の産後うつ、もう1つは生後6か月の乳児の生体反応と気質を調べたもので、いずれもストレスの量だけでなく時期が重要であることを示した。妊娠15週という早い時期から毎週測定したのは初めてだという。\n【背景】\n妊娠中にストレスや不安の症状を訴える女性は最大で70%にのぼる。ストレスは母体の健康に影響し、37週未満で生まれる早産とも関連している。これまでの研究では、妊娠中のストレスを一つの時点でしか測っていなかった。\n【詳細】\n母親についての研究は、人間発達・家族学科のエイミー・ナッタル氏らが「Archives of Women's Mental Health」誌に発表した。妊娠中を通じてストレスが高いほど、出産から6か月後の産後うつのリスクが高かった。さらに、子ども時代の逆境体験（ACEs）が4つ以上ある女性では、妊娠20週のストレスが高いことや、週ごとのストレスの揺れが大きいことが、より重いうつと関連していた。乳児についての研究は、心理学科のアリティア・レベンドスキー氏が発表し、生後6か月の乳児を調べた。女児では妊娠中期のストレスが、男児では妊娠後期のストレスが、乳児のコルチゾールの反応にとって影響を受けやすい時期だった。また、女児では妊娠中の平均的なストレスの高さと、中期から後期のストレスが、ぐずりやすい気質と関連していた。男児では、中期から後期のストレスの時期だけがぐずりやすさと関連していた。研究チームは今後、400組近くの母子を対象に、幼少期のストレスの時期が学童期の発達にどう影響するかを調べる研究を進める。この年齢の子どもの約20%には行動上の問題があるという。\n【ポイント・注意点】\nナッタル氏は、今回の結果が妊娠中のストレスの検査や、的を絞った支援につながりうるとしている。研究チームは、ストレスは妊娠中を通して測定すべきであり、子ども時代に大きな心の傷を負った女性には、より的を絞った対応が必要だと提言している。レベンドスキー氏は、性別によって影響を受けやすい時期が異なることは、注意が必要な妊娠の時期を見極め、ストレスが世代を越えて伝わるのを防ぐ取り組みを考えるうえで意味があると述べている。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-prenatal-stress-mothers-infants.html"],["1型糖尿病の「部分寛解」指標、肥満の子では半数以上を見逃す 米422人分析","1型糖尿病の発症初期に自前のインスリン分泌が残る「部分寛解（ハネムーン期）」を判定する一般的な指標IDAA1cについて、米ベイラー医科大学などの研究チームが、診断から1年以内の若年患者422人のデータで精度を検証した。基準値9以下では寛解の約61%しか捉えられず、過体重・肥満の若者では45%にとどまり、半数以上を見逃していた。研究者は個々の患者の評価では慎重に使うべきだとしている。","\n【概要】米ベイラー医科大学などの研究チームは、1型糖尿病の「部分寛解」を見分けるために広く使われる指標IDAA1c（インスリン量で補正したHbA1c）の精度を、米国の若年患者422人のデータで検証した。その結果、従来の基準値では寛解している若者の約4割を見逃し、過体重・肥満の若者では半数以上を見逃していたことがわかった。研究は米国糖尿病学会の学術誌「Diabetes Care」に掲載された。\n【背景】部分寛解は「ハネムーン期」とも呼ばれ、1型糖尿病の診断後もしばらく体が意味のある量のインスリンを作り続ける時期を指す。この時期は血糖管理が良好で低血糖が少なく、長期的な合併症のリスクが低い可能性もあるとされる。残っているインスリン分泌を最も正確に測るのは刺激C-ペプチド検査だが、時間がかかり日常診療には向かない。そこでHbA1cと1日のインスリン量を組み合わせたIDAA1cが使われ、9以下が部分寛解の目安とされてきた。ただしこの指標は主に北欧の集団で作られ、過体重や肥満の多い米国の若者では検証されていなかった。体重が多いとインスリン抵抗性が高まり必要量も増えるため、研究チームは精度が落ちると考えた。\n【詳細】チームは米国の大規模研究「SEARCH for Diabetes in Youth Study」の参加者のうち、診断から1年以内の422人を分析し、刺激C-ペプチド検査の結果を基準としてIDAA1cと比べた。全体では、9以下という基準で部分寛解の若者の約61%、寛解していない若者の約79%を正しく判定した。過体重・肥満の若者に限ると、部分寛解を正しく判定できたのは45%にとどまった。基準値を11.6に引き上げると寛解の検出は増えたが、誤って寛解と判定する例も増え、全体の性能は不十分なままだった。\n【ポイント・注意点】責任著者のマリア・レドンド氏は、IDAA1cは「個々の患者を評価する際、特に過体重や肥満の患者では慎重に使うべきだ」と述べている。研究チームは、部分寛解をより確実に定義し測る方法が必要だとしている。子どもの1型糖尿病の経過や治療の見通しについては、指標の数値だけで判断せず、主治医とよく相談することが大切だ。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-common-diabetes-score-partial-remissions.html"],["10代のうつ、多量の飲酒や大麻の複数の摂取方法と関連 米9817人分析","米テキサスA&M大学の研究チームが、2023年の全米薬物使用・健康調査（NSDUH）に回答した12〜17歳の9817人を分析したところ、飲酒量が多い10代や、喫煙・電子たばこ・食品など複数の方法で大麻を使う10代は、大うつ病エピソードを経験する可能性が「はるかに高い」ことがわかった。研究者は、飲酒・薬物使用とうつを互いにつながった問題として扱い、一緒にスクリーニングするよう勧めている。","\n【概要】米テキサスA&M大学公衆衛生大学院の研究チームは、米国の12〜17歳の若者を対象に、飲酒や大麻の使い方と大うつ病エピソードの関連を調べた。その結果、多く飲酒する10代や、複数の方法で大麻を使う10代は、大うつ病を経験する可能性がはるかに高かった。研究は学術誌「Journal of Substance Use」に掲載された。\n【背景】以前の全国データでは、米国の思春期の若者の約5人に1人が、過去2週間に気分の落ち込みを感じたと答えている。うつも物質使用も、多くは10代のうちに始まる。これまでの研究の多くは、物質を1種類ずつ取り上げ、「使ったかどうか」や使用日数で調べてきた。研究チームは、10代が複数の物質を重なり合う形で使い、それぞれ異なるリスクを抱えている可能性があると考えた。\n【詳細】研究は全米を代表する横断研究で、2023年の全米薬物使用・健康調査（NSDUH）に回答した12〜17歳の9817人のデータを分析した。飲酒はときどき飲む程度から多量・頻繁な飲酒までの幅で測り、大麻は喫煙、電子たばこ（ベイプ）、食品（エディブル）など、使っている方法の数で測った。その結果、飲酒量が多いほど、また大麻を複数の形で使うほど、大うつ病エピソードとの関連が強かった。さらに、飲酒や薬物使用の有無にかかわらず、女子、年齢の高い10代、複数の人種に属する10代で大うつ病が多かった。なお記事では、関連の強さを示す具体的な数値は示されていない。筆頭著者は博士課程のスンヒョン・チョン氏。\n【ポイント・注意点】チョン氏は、保護者や医師、学校関係者が、10代の飲酒・薬物使用とうつを互いにつながった問題として扱うべきだと述べ、物質使用とうつを一緒にスクリーニングすることを勧めている。早く気づけば、よりよい支援につなげられるという。ただし横断研究のため、飲酒や大麻がうつを引き起こすという因果関係までは示していない。子どもの気分の落ち込みや飲酒・薬物の兆しに気づいたら、片方だけでなく両方に目を向け、早めに専門家へ相談したい。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-adolescent-teen-depression-linked-heavier.html"],["スクリーン時間が長い10代、記憶・学習に関わる脳領域が小さい傾向 フィンランド研究","東フィンランド大学の研究チームが、16〜19歳の健康な若者44人の脳をMRIで調べたところ、スクリーン時間やスマート機器の使用が多いほど、記憶や学習に関わる内側側頭葉の灰白質の体積が小さい傾向がみられた。一方、注意や意思決定に関わる前頭葉の一部や、視覚情報を処理する後頭部の領域は大きかった。研究者は過度の使用は有害な可能性があるとしつつ、因果関係や長期的な意味は今後の研究が必要だとしている。","\n【概要】東フィンランド大学の研究チームは、10代後半の若者のスクリーン時間やスマート機器の使用、身体活動、体力と、脳の灰白質の体積との関連を調べた。スクリーン時間が長いほど、記憶や学習に関わる内側側頭葉の灰白質が小さい傾向があった。研究は学術誌「NeuroImage: Reports」に掲載された。\n【背景】脳の灰白質は、思春期のあいだに通常は減っていく。生活習慣が成長期の脳の構造とどう関係するかは、まだよくわかっていない。今回のデータは、東フィンランド大学の「PANIC（子どもの身体活動と栄養）研究」と、クオピオ大学病院の「FitBrain研究」で2018〜2019年に集められた。\n【詳細】対象は16〜19歳の健康な44人（女子25人、男子19人）の横断研究。脳の灰白質の体積はMRIで測り、スクリーン時間、スマート機器の使用、身体活動は質問票で調べた。体力は50メートルシャトルランと立ち幅跳びを組み合わせた点数で評価した。その結果、スクリーン時間が長いほど、記憶と学習に関わる内側側頭葉の灰白質の体積が小さかった。一方で、運動の計画、注意、作業記憶、意思決定に関わる前頭葉の一部や、視覚情報を処理する後頭部の領域は大きかった。身体活動が多いほど右の後頭部の領域が大きく、体力が高いほど注意や感覚の処理に関わる頭頂葉が大きかったが、記憶と学習に関わる海馬や後部帯状回は小さかった。\n【ポイント・注意点】筆頭研究者のハンナマリ・スコグ氏は、スクリーンやスマート機器の過度な使用は、記憶や学習に関わる脳の領域に「有害かもしれない」と述べている。前頭部や後頭部が大きかった点については、注意や動きの計画、視覚処理を求めるゲームやアプリが関係している可能性や、思春期に通常は減る灰白質の「脳の発達の遅れ」を反映している可能性を挙げた。ただし44人と小規模な横断研究のため、因果関係や、体積の違いが良いのか悪いのかは示せない。研究チームも、生活習慣と脳の構造の関係は複雑で、長期的な意味を知るにはさらなる研究が必要だとしている。家庭では、使用時間の長さに気を配りつつ、運動の時間も確保することを意識したい。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-screen-smart-device-usage-adolescent.html"],["ドラベ症候群の希少変異、突然死率がほぼ100%の理由を解明 米ミシガン大","小児期に重いてんかん発作などを起こす希少疾患ドラベ症候群のうち、SCN1B遺伝子のまれな変異をもつ患者は、てんかんに伴う予期せぬ突然死（SUDEP）の割合が「ほぼ100%」とされる。米ミシガン大学の研究チームは、この変異によって本来取り除かれるはずのイントロンが残り、働くタンパク質が作られなくなる仕組みを明らかにした。研究はPNASに掲載され、将来の治療法の手がかりになると期待されている。","\n【概要】米ミシガン大学の研究チームは、ドラベ症候群の中でも特に重い型を引き起こすSCN1B遺伝子のまれな変異「c.449-2A>G」が、なぜこれほど致死的なのかを調べた。この変異では遺伝子の情報が正しく編集されず、働くタンパク質が作られないことがわかった。研究は米科学アカデミー紀要（PNAS）に掲載された。\n【背景】ドラベ症候群はまれな発達性の病気で、てんかん発作、運動やバランスの問題、知的障害、認知の遅れを伴い、てんかんに伴う予期せぬ突然死（SUDEP）のリスクを高める。症例の約90%はSCN1A遺伝子の変異によるが、まれなSCN1B遺伝子の変異では特に重い型になることがある。ドラベ症候群では通常SUDEPの割合が約20%とされるが、今回の変異をもつ患者について、薬理学などの教授ロリ・アイソム氏は「ほぼ100%だった」と述べている。同氏の研究室は以前、SCN1Bを欠くマウスでは神経細胞や心臓の細胞が興奮を調整できず、重いてんかん、不整脈、死に至ることを示していた。\n【詳細】今回の変異は、タンパク質の設計図にならない部分「イントロン」に関わる。イントロンは通常、RNAから取り除かれるが、この変異があると正しく取り除かれずに残ってしまう。その結果、遺伝子が誤った形で編集され、働くSCN1Bタンパク質が作られなくなる。筆頭著者は博士研究員のシュリーヤ・バクシ氏。記事によると、残ったイントロンに注目した研究はまだ少ない。なお記事には、研究の対象数や詳しい方法は示されていない。\n【ポイント・注意点】研究チームは、この変異でイントロンの除去を促せば働くタンパク質を増やせる可能性があるとしている。また、米フィラデルフィア小児病院（CHOP）の研究者と以前に開発した、変異したSCN1B遺伝子を健康なものに置き換える遺伝子治療に加え、より安全な可能性のある方法として、RNAを使う「アンチセンス・オリゴヌクレオチド」の開発も進めている。バクシ氏は「研究はまだ初期段階だが、希望を持っている」と話す。現時点ですぐに使える治療ではなく、ドラベ症候群の子どもの治療や見守りについては、引き続き主治医と相談することが大切だ。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-reveals-rare-mutation-dravet-syndrome.html"],["米国が麻しん排除国の地位を失う 妊婦の死亡リスク10倍、幼稚園児の接種率も低下","汎米保健機構（PAHO）は、米国が麻しん（はしか）の排除状態を正式に失ったとした。流行の拡大とワクチン接種率の低下が背景にある。米ハッケンサック・メリディアン・ヘルスの医師らは、妊娠中の感染で死亡リスクが10倍になるとの分析を紹介し、妊娠前のMMRワクチン接種歴の確認や、子どもの定期接種を予定どおり受けることを呼びかけている。2026年の米国の患者数は5400人を超えている。","\n【概要】汎米保健機構（PAHO）は、米国が麻しん（はしか）の排除状態を正式に失ったとした。記事は、流行の拡大とワクチン接種率の低下によるものだとしている。米ハッケンサック・メリディアン・ヘルスは、特に妊婦と子どもへの影響に懸念を示し、MMR（麻しん・おたふくかぜ・風しん）ワクチンでの予防を呼びかけた。\n【背景】米ジョンズ・ホプキンス大学の麻しん追跡データによると、2026年の米国の患者数は5400人を超え、30%近くが大人だった。米疾病対策センター（CDC）のデータでは、2026年の患者の多くは国内で感染している。CDCによると、2025〜2026年度の幼稚園児のMMR接種率は92.4%に下がり、接種免除は過去最高の4.2%となって、推計28万人の子どもが守られていない状態にある。集団で感染を防ぐには、一般に93〜95%の接種率が必要とされる。\n【詳細】学術誌「NEJM Evidence」に掲載された予備的な分析では、妊娠中に自然に起こる免疫の低下が、死亡リスクの10倍の上昇や重い合併症の増加と結び付けられている。データ中の妊婦の多くはワクチン未接種だった。お腹の中で感染にさらされた赤ちゃんへの長期的な影響はよくわかっていない。これまで大人の多くは子どもの頃の感染で生涯の免疫を持っていたため、米国では先天性の麻しんがほとんど見られなかったことも理由だという。ニュージャージー州では今年これまで大規模な流行をかろうじて避けているが、州保健局によると、学齢期の子どものMMR接種率はオーシャン郡で83.2%、モンマス郡で88.1%と州内で最も低い。\n【ポイント・注意点】産婦人科医のメーガン・ラティガン氏は、女性は「妊娠を考える前にMMRの接種歴を確認すべきだ」と話す。小児科医のメリッサ・ウォラック氏は「接種率の低下が、本来防げる悲劇を招いている」と述べた。小児感染症科のダニエル・ルーダーファー氏は、麻しんは非常に危険で、感染した子どもの約20%が入院を必要とすると指摘する。妊娠を考える人は自分の免疫を確かめ、子どもは定期接種を予定どおり受けることが大切だ。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-measles-status-pregnant-women-children.html"],["頭部CT1回分の被ばくで脳腫瘍リスク1.8倍 子ども370万人超を追跡 米加研究","米カリフォルニア大学デービス校（UC Davis）と同サンフランシスコ校（UCSF）の研究チームが、米国とカナダ・オンタリオ州の子ども370万人超を出生から平均12.3年追跡し、医療画像検査による脳への累積被ばく量と脳腫瘍の関係を調べた。頭部CT1回分に相当する被ばくで脳腫瘍リスクは1.8倍となり、21歳までに子ども1万人あたり約8件の上乗せに相当した。研究者は、絶対リスクは小さく、必要な検査は避けるべきでないとしている。","\n【概要】医療画像検査で受ける放射線が多い子どもほど、脳腫瘍のリスクが高まる可能性があるとする研究が、米医学誌JAMAに掲載された。UC DavisとUCSFが主導し、370万人を超える子どもを対象に、電子カルテから電離放射線を使うすべての画像検査による脳の累積線量を推定した。腫瘍は、見込まれる臨床上の振る舞いに基づき、悪性度の高いものとそうでないものに分けて分析した。\n【背景】CTなど電離放射線を用いる検査は診断に欠かせない一方、子どもへの被ばくの影響が懸念されてきた。上席著者でUCSFの放射線科医のレベッカ・スミス＝ビンドマン氏は、頭部CTについて「過剰に使われており、年々使用が増えている」と指摘している。\n【詳細】対象は米国とカナダ・オンタリオ州の子どもで、出生から平均12.3年追跡した。期間中に1536件の脳腫瘍が診断され、55.7%が男性、64.5%が2〜10歳での診断、82.5%が悪性度の高いタイプだった。追跡中に頭部CTを1回受けた子どもは4.3%、2回は0.9%、3回以上は0.4%だった。頭部CT1回分相当の被ばくで脳腫瘍リスクは1.8倍となり、21歳までに子ども1万人あたり約8件、頭部CT約1266件につき1件の腫瘍の上乗せに相当した。線量が増えるほどリスクは上がり、悪性度の高い腫瘍で関連が強かった。子ども・若者の脳腫瘍の10.1%が医療画像の放射線に起因する可能性があると推定された。\n【ポイント・注意点】筆頭著者のダイアナ・ミリオレッティ教授は、脳腫瘍のリスク自体は小さいままだとし、「医学的に必要な画像検査を避けるべきだという意味ではない」と強調する。研究者は、電離放射線を使う検査は一つひとつ臨床的に正当化し、線量は必要な情報が得られる範囲で合理的に可能な限り低く抑えるべきだとしている。頭部外傷の子どもでは、不適切なCTを減らすために作られ、小児救急で検証されたPECARNの基準の活用が挙げられている。必要な検査は命を救い得るため、すぐに得られる利益と、わずかで遅れて現れるがんのリスクを比べて判断することが求められる。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-children-exposed-medical-scans-higher.html"],["磁石の玩具「フィジェットボール」誤飲で重傷・死亡の恐れ 米CPSCが使用中止を警告","米消費者製品安全委員会（CPSC）は2026年11月19日、Amazon.comで販売された「FZChenrry」ブランドの磁石入りフィジェットボールについて、子どもが飲み込むと重傷や死亡につながる恐れがあるとして、直ちに使用をやめて廃棄するよう消費者に警告した。玩具の強制安全基準に違反する強力な磁石で、販売数は約1372個。販売事業者はリコールや救済措置に応じていない。","\n【概要】米消費者製品安全委員会（CPSC）は、中国の事業者がAmazon.comで販売していた「FZChenrry Magnetic Fidget Balls」について、使用を直ちにやめるよう警告した。製品は強力な磁石で、子どもが誤って飲み込む危険があり、玩具の強制安全基準に違反しているという。警告番号は27-095。事業者による自主的なリコールではなく、CPSCが消費者に直接、使用中止と廃棄を呼びかけたものだ。\n【背景】CPSCは、このボールを子どもが飲み込む恐れのある高出力の磁石に当たると判断している。強力な磁石を飲み込むと、体内で磁石同士が、あるいは金属と引き合い、消化管に留まることがある。その結果、腸に穴が開く、ねじれる、詰まるといった状態や、血液の感染（敗血症）を引き起こし、死亡に至る恐れがある。CPSCは販売事業者に違反通知を出したが、事業者はリコールにも救済措置の提供にも同意していない。\n【詳細】対象は、表面に凹凸のあるシリコン製の磁石ボール8個のセットで、4種類の濃淡の紫色のボールが、黒いファスナー付きの楕円形ケースに入っている。黒、ピンク、緑、多色のセットも販売された可能性がある。2025年2月から2026年9月までAmazon.comで約16ドルで販売され、第三者の販売業者や他のウェブサイトでも売られた可能性がある。販売数は約1372個。販売事業者は中国のFu Zhou Jing Li Xin Xi Ke Ji You Xian Gong Si（屋号Chanlee）で、製造も中国。現時点で事故やけがの報告はない。\n【ポイント・注意点】CPSCは、この製品を持っている人に対し、直ちに使用をやめて廃棄し、売ったり人に譲ったりしないよう呼びかけている。事業者による返金や交換などの救済はない。強力な磁石は複数を飲み込むと体内で引き合うため、見た目には小さな玩具でも重大な結果を招き得る。事故や危険な製品は、CPSCのホットライン（800-638-2772、聴覚障害者向けTTYは800-638-8270、東部時間午前8時〜午後5時30分）やSaferProducts.govに報告できる。","2026-11-19","米消費者製品安全委員会（CPSC）","https://www.cpsc.gov/Warnings/2027/CPSC-Warns-Consumers-to-Stop-Using-FZChenrry-Magnetic-Fidget-Ball-Toys-Immediately-Due-to-Risk-of-Serious-Injury-or-Death-from-Magnet-Ingestion-Violate-Mandatory-Standard-for-Toys"],["工具や電卓のボタン電池が子どもに取り出しやすく 米で約23万個リコール","米消費者製品安全委員会（CPSC）は2026年11月19日、米Hultafors Group North Americaが、照明付きポートフォリオやデジタル角度計、デジタルノギス、建築用電卓など約22万9430個をリコールすると発表した。ボタン電池・コイン電池を使う製品の強制基準に違反し、子どもが電池を簡単に取り出して飲み込む恐れがある。リース法で求められる警告表示もなかった。事故やけがの報告はない。","\n【概要】米ウィスコンシン州のHultafors Group North Americaは、「Custom Leather Craft（CLC）」ブランドの照明付きポートフォリオと、「Johnson Level & Tool」ブランドのデジタル角度計、デジタルノギス、建築用電卓のリコールを発表した。対象は約22万9430個で、リコール番号は27-090。\n【背景】ボタン電池やコイン電池は、子どもが飲み込むと体内で化学的なやけどを起こし、重傷や死亡につながる恐れがある。米国ではこうした電池を使う消費者製品に強制基準があり、リース法（Reese's Law）に基づく警告表示も求められている。今回の製品は電池に子どもが容易に触れられるうえ、製品や包装に必要な警告もなかった。\n【詳細】対象は9モデル。CLCの照明付きポートフォリオ（L217、54.99ドル）、Johnson Levelの12インチデジタル角度計（1750-1200、89ドル）、磁石付きデジタル角度計の2ボタン型（1886-0100、79ドル）と3ボタン型（1886-0200、149ドル）、7インチと11インチの角度計付き定規（1888-0700、1888-1100）、デジタルノギス（1889-0600、74.99ドル）、ドットレーザー付き21インチ水平器・角度計（40-6065、399ドル）、建築用電卓（CALC-1500、63.99ドル）が含まれる。Lowe's、Menards、W.W. Grainger、True Valueなどの金物店やAmazon.comで、2023年2月（一部は2024年3月）から2026年11月まで販売された。製造は中国。事故やけがの報告はない。\n【ポイント・注意点】消費者は直ちに使用をやめ、製品を子どもの手の届かない場所に保管して同社に連絡するよう求められている。返金を受けるには、リコール専用サイトに製品の写真をアップロードし、廃棄して今後使わないことを証明する必要がある。確認されると、小売価格分がVisaのバーチャルギフトカードで支払われる。電池は地域の有害廃棄物の手順に従って廃棄またはリサイクルする。問い合わせは同社（877-722-7026、平日の東部時間午前9時〜午後5時）へ。","2026-11-19","米消費者製品安全委員会（CPSC）","https://www.cpsc.gov/Recalls/2027/Hultafors-Group-North-America-Recalls-Lighted-Portfolios-Angle-Locators-Calipers-and-Calculators-Due-to-Risk-of-Serious-Injury-or-Death-from-Battery-Ingestion-Violate-Mandatory-Standard-for-Consumer-Products-with-Button-Cell-Batteries"],["米陸軍が劣化した爆薬を現地で爆破へ 鉛の粉じん最大161キロ 子どもと妊婦に注意","米陸軍は、アイオワ州ミドルタウンの陸軍弾薬工場に保管され、劣化して極めて不安定になった起爆用の爆薬「アジ化鉛」68樽を現地で爆破処理する。爆発で有毒な鉛の粉じんが最大100マイル（161キロ）先まで運ばれる可能性がある。陸軍は大きな健康影響は見込まれないとしつつ、近くの住民に避難を勧めた。鉛は子どもと妊婦に最も危険で、窓を閉める、子どものおもちゃを拭くなどの対策が呼びかけられている。","\n【概要】米陸軍は、アイオワ州南東部ミドルタウンにあるアイオワ陸軍弾薬工場で、不安定になった爆薬を金曜日の正午に爆破処理する計画だ。爆発によって有毒な鉛の粉じんが最大100マイル（161キロ）先まで運ばれる可能性がある。\n【背景】対象は、大きな軍用の爆薬を起爆させるのに使われる非常に敏感な爆薬「アジ化鉛」だ。陸軍の爆破許可によると、工場にある68樽が劣化して極めて不安定になっている。陸軍は運び出すことは「偶発的な爆発の容認できない危険」があるとし、米環境保護局（EPA）は前の週に緊急の許可を出した。ミドルタウンは州都デモインから約150マイル（241キロ）南にあり、イリノイ州境まで車で10マイル（16キロ）の距離だ。北に約1時間のマスカティンも、粉じんが流れると予測される範囲に入っている。\n【詳細】陸軍が水曜日に公表した評価では、爆破は短い大きな音と、すぐに薄れる鉛を含んだ粉じんの雲を生むが、大きな健康影響は見込まれないという。それでも近くの住民には避難を勧め、現場に最も近い人には一時的な避難先を用意した。窓ガラスが割れる恐れも警告している。陸軍工兵隊は希望した約150人の住民の土壌を爆破前に検査しており、爆破後も検査を行う。鉛が規制値を超えれば清掃を提供するとしている。アイオワ大学公衆衛生学部のパトリック・オショーネシー教授は、北寄りの風が工場のすぐ東の町から粉じんを遠ざけ早く薄める可能性がある一方、より遠くへ広げる可能性もあると指摘し、「どうなるかは誰にも本当にはわからない」と述べた。\n【ポイント・注意点】鉛は子どもと妊婦に最も危険だ。胎児の発達中の脳を傷つけ、学習や行動の問題を引き起こし、早産や流産の危険を高めることがある。陸軍は、とどまる人に窓を閉めて室内の空気を循環させ、爆破後に窓枠や子どものおもちゃを拭くよう勧めた。EPAと米疾病対策センター（CDC）は、玄関で靴を脱ぐ、ペットの足を拭く、幼い子どもを土がむき出しの場所で遊ばせない、家庭菜園の野菜は洗って皮をむくことを推奨している。鉛にさらされてもほとんどの人は症状が出ず、確かめるには血液検査が最もよい方法だという。","2026-11-19","Medical Xpress","https://medicalxpress.com/news/2026-11-army-blast-iowa-toxic-miles.html"],["肥満の10代にチルゼパチド BMIが18.5%減 胃腸の副作用は8割超 72週の臨床試験","肥満の12〜17歳160人を対象に、肥満症治療薬チルゼパチドを72週間投与した第3相試験の結果が米医学誌JAMAに発表された。BMIは平均18.5%減り、偽薬群の0.5%増を大きく上回った。血圧や脂質、血糖なども改善し、身体の快適さに関する生活の質も向上した。一方で有害事象は95.4%に起き、多くが胃腸の症状で、9.3%が副作用で投与を中止した。成長や思春期の進み方に差はなかったが、長期の追跡が必要とされる。","\n【概要】肥満の10代を対象に、週1回注射の肥満症治療薬チルゼパチドの効果と安全性を調べた第3相のランダム化比較試験「SURMOUNT-ADOLESCENTS」の結果が、米医学誌JAMAに掲載された。72週間でBMIが平均18.5%減り、体重以外の健康指標や生活の質にも改善がみられた。\n【背景】米国では10代の約5人に1人が肥満で、米国小児科学会（AAP）は「早期の、集中的で、家族ぐるみの生活習慣治療」を勧めている。成人を対象とした試験SURMOUNT-1では約20%の体重減少が報告されていた。\n【詳細】試験は6か国31施設で行われ、肥満、または肥満に関連する合併症が1つ以上ある過体重の12〜17歳160人が参加した。平均年齢は14.6歳、61.9%が女性で、平均体重は109.7kg、平均BMIは38.6だった。生活習慣の指導に加え、109人がチルゼパチド（最大15mg）、51人が偽薬に割り当てられた。BMIはチルゼパチド群で18.5%減り、偽薬群は0.5%増えた。約8割が5%以上、半数近くが20%以上BMIを減らした。体重と腹囲は偽薬群より20.1kg、16.4cm多く減り、72週の時点で半数以上が年齢・性別ごとの肥満の基準を下回った（偽薬群7.1%）。血圧、脂質、血糖、HbA1c、空腹時インスリンも改善した。生活の質では身体の快適さの得点が10.3点改善したが、社会生活や家族関係では有意な向上はなかった。\n【ポイント・注意点】有害事象はチルゼパチド群の95.4%、偽薬群の82.4%で起き、多くが胃腸の症状だった。吐き気止めの使用は22.2%対3.9%、副作用による中止は9.3%対0%。重い有害事象はチルゼパチド群8人、偽薬群2人で、胆石や胆のう摘出が含まれた。うつや自殺念慮は4.6%対2.0%で、重いものはなかったが、全員に精神科の既往があった。身長や成長、思春期の進み方は両群で同様だった。2型糖尿病の参加者は1人だけで人種の多様性も限られ、試験は製薬会社イーライリリーの資金で行われた。長期の追跡が必要とされている。","2026-11-17","News-Medical","https://www.news-medical.net/news/20261117/Tirzepatides-benefits-for-teens-with-obesity-go-beyond-weight-loss.aspx"],["毎日の鉄剤で子どもの鉄欠乏性貧血が減る 114研究・5万人超を分析 コクラン","米コーネル大学の研究者らが率いたコクランの系統的レビューは、乳児から思春期の若者に毎日鉄剤を飲ませることの効果を、114の研究、5万人を超える子どもと若者のデータで調べた。鉄剤だけを飲んだ場合、何もしない場合や偽薬と比べて鉄欠乏性貧血はおそらく減ると結論づけた。身長や体重、せきや発熱などの病気には影響がなかった。研究者は、すべての子どもに毎日の鉄剤が必要という意味ではないとしている。","\n【概要】\n米コーネル大学の研究者らが率いたチームが、乳児、子ども、思春期の若者に毎日鉄剤を飲ませることが、鉄欠乏性貧血の予防や治療に役立つかを調べた系統的レビューを「コクラン・システマティック・レビュー・データベース」に発表した。114の研究、5万人を超える子どもと若者のデータを分析した。研究の多くはアジアで行われ、5歳未満の子どもを対象としていた。\n【背景】\n貧血は世界で推計8億7,400万人の子どもと女性がかかっており、2019年には5歳未満の子どもの40%が貧血だった。そのおよそ半数は鉄の不足が原因とされる。世界保健
