<style>

:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;display:flex;flex-direction:column;height:100dvh;overflow:hidden;transition:background .35s ease,color .35s ease}
body::before{content:"";position:fixed;inset:0;background:var(--pattern);pointer-events:none;opacity:var(--pattern-op,.5)}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
[data-theme="steampunk"]{--bg:#e6d7b8;--pattern:radial-gradient(circle at 12% 20%,rgba(141,100,40,.16) 0 26px,transparent 27px),radial-gradient(circle at 88% 78%,rgba(141,100,40,.13) 0 38px,transparent 39px),repeating-linear-gradient(0deg,rgba(90,62,25,.05) 0 1px,transparent 1px 26px);--pattern-op:1;--card:#f8eed3;--ink:#2e2010;--muted:#77603c;--line:#a97f3f;--accent:#9c4a12;--accent2:#2f5d50;--accent-ink:#fff6df;--soft:#efdfba;--old:#97835f;--top-bg:#2a1a0c;--top-ink:#f2dfae;--radius:8px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\2699  \2699  \2699";--shadow:0 14px 34px rgba(62,40,8,.28)}
[data-theme="witch"]{color-scheme:dark;--bg:#161022;--pattern:radial-gradient(circle at 18% 12%,rgba(233,213,255,.20) 0 1.5px,transparent 2.5px),radial-gradient(circle at 72% 22%,rgba(233,213,255,.14) 0 1px,transparent 2px),radial-gradient(circle at 42% 66%,rgba(196,181,253,.12) 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 84%,rgba(233,213,255,.16) 0 1px,transparent 2px),radial-gradient(circle at 6% 88%,rgba(196,181,253,.12) 0 1px,transparent 2px);--pattern-op:1;--card:#241a3d;--ink:#f1eaff;--muted:#bdaee0;--line:#5b4595;--accent:#a678ff;--accent2:#e9d5ff;--accent-ink:#1d1233;--soft:#2f2350;--old:#8d81ad;--top-bg:#0e0919;--top-ink:#efe6ff;--radius:20px;--font-display:"IM Fell English","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\263E  \2726  \263D";--shadow:0 14px 34px rgba(0,0,0,.5)}
[data-theme="dnd"]{--bg:#e7d9b4;--pattern:repeating-linear-gradient(45deg,rgba(158,43,37,.05) 0 2px,transparent 2px 18px),radial-gradient(circle at 85% 10%,rgba(158,43,37,.10) 0 30px,transparent 31px);--pattern-op:1;--card:#f7ecc9;--ink:#332216;--muted:#7d6248;--line:#8c6a3f;--accent:#9e2b25;--accent2:#a97b00;--accent-ink:#fdf3d8;--soft:#eee0b6;--old:#9a8a72;--top-bg:#471611;--top-ink:#f7e7bd;--radius:4px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\265E  \2726  \265E";--shadow:0 14px 30px rgba(71,22,17,.30)}
[data-theme="celtic"]{--bg:#e3dfc6;--pattern:repeating-linear-gradient(0deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px),repeating-linear-gradient(90deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px);--pattern-op:1;--card:#f6f2dc;--ink:#20331e;--muted:#5d7050;--line:#77873f;--accent:#2e6b34;--accent2:#a8842a;--accent-ink:#fbf7e2;--soft:#e7e5c8;--old:#93a086;--top-bg:#17351f;--top-ink:#efeccb;--radius:14px;--font-display:"Uncial Antiqua","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\16DA  \2726  \16DB";--shadow:0 14px 30px rgba(23,53,31,.26)}
[data-theme="greek"]{--bg:#f2eee3;--pattern:repeating-linear-gradient(90deg,rgba(29,95,138,.06) 0 1px,transparent 1px 34px),radial-gradient(circle at 90% 0%,rgba(185,138,28,.10) 0 60px,transparent 61px);--pattern-op:1;--card:#fffdf6;--ink:#1e2c38;--muted:#66727c;--line:#b3923c;--accent:#1d5f8a;--accent2:#b98a1c;--accent-ink:#ffffff;--soft:#ece7d7;--old:#a3a8ad;--top-bg:#fdfbf4;--top-ink:#1e2c38;--radius:2px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\03A9  \2766  \03A9";--shadow:0 14px 30px rgba(30,44,56,.18)}
.top{flex:none;position:relative;z-index:30;background:var(--top-bg);color:var(--top-ink);border-bottom:3px double var(--line)}
.topin{max-width:1080px;margin:auto;padding:10px 16px 4px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.logo{font-family:var(--font-display);font-weight:900;font-size:23px;letter-spacing:.06em}.logo span{color:var(--accent2)}
[data-theme="witch"] .logo span,[data-theme="steampunk"] .logo span{color:var(--accent)}
.date{font-size:10px;opacity:.75;white-space:nowrap}
.topbtns{display:flex;gap:8px;flex:none}.pill{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.themes{max-width:1080px;margin:auto;padding:6px 16px 10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.themes-label{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;opacity:.8}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;opacity:.85}
.theme-btn .gly{margin-right:5px}
.theme-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
.stage-wrap{flex:1;min-height:0;max-width:1080px;width:100%;margin:auto;padding:10px 16px 12px;display:flex;flex-direction:column;position:relative;z-index:1}
.herostrip{flex:none;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;box-shadow:var(--shadow)}
.herostrip img{width:74px;height:52px;object-fit:cover;border-radius:calc(var(--radius) * .6);flex:none}
.herostrip p{margin:0;font-size:13px;color:var(--muted)}.herostrip b{color:var(--ink);font-family:var(--font-display)}
.catbar{flex:none;display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.catbar .navbtn{flex:none}
.catinfo{flex:1;text-align:center;min-width:0}
.catinfo h2{margin:0;font-family:var(--font-display);font-size:clamp(19px,4.6vw,27px);line-height:1.25;letter-spacing:.03em}
.catinfo p{margin:1px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catcount{flex:none;font-size:12px;background:var(--soft);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-weight:700}
.navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800;box-shadow:var(--shadow)}
.navbtn:active{transform:scale(.97)}
.dots{flex:none;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:transparent;padding:0}
.dot.active{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.stage{flex:1;min-height:0;touch-action:none;position:relative}
#cardSlot{height:100%}
.card{height:100%;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
.card::after{content:var(--orn);position:absolute;top:6px;right:12px;font-size:13px;letter-spacing:.3em;color:var(--accent2);opacity:.85;pointer-events:none}
.card.old .ph{filter:grayscale(1)}
.card .ph{width:100%;height:30%;min-height:120px;object-fit:cover;display:block;flex:none}
[data-theme="steampunk"] .card .ph{filter:sepia(.35) contrast(1.05)}
[data-theme="witch"] .card .ph{filter:saturate(.85) hue-rotate(-12deg) brightness(.92)}
[data-theme="dnd"] .card .ph{filter:sepia(.25) saturate(1.1)}
[data-theme="celtic"] .card .ph{filter:saturate(1.05) hue-rotate(6deg)}
[data-theme="greek"] .card .ph{filter:saturate(.92) brightness(1.04)}
.cbody{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.badge{background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:999px;font-weight:800}.badge.oldb{background:var(--old)}
.card h3{margin:0;font-size:clamp(17px,4.4vw,21px);line-height:1.45;font-family:var(--font-display);font-weight:700}
.sum{font-size:14px;color:var(--muted);margin:0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.btn{border:0;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800}
.btn.primary{background:var(--accent);color:var(--accent-ink)}.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.saved{background:var(--accent2);color:var(--accent-ink)}
.src{font-size:11px;color:var(--muted);word-break:break-all}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;color:var(--muted)}
.empty .big{font-size:34px;color:var(--accent2)}
.pager{flex:none;display:flex;align-items:center;gap:10px;margin-top:10px}
.pager .navbtn{flex:1}
.artdots{flex:none;display:flex;gap:5px;max-width:34vw;flex-wrap:wrap;justify-content:center}
.artcount{flex:none;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.hint{flex:none;font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.addcat{flex:none;text-align:center;margin-top:6px}
.addcat button{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700}
@keyframes inNext{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes inDown{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes inUp{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
.anim-next{animation:inNext .28s ease}.anim-prev{animation:inPrev .28s ease}.anim-down{animation:inDown .28s ease}.anim-up{animation:inUp .28s ease}
dialog{border:2px solid var(--line);border-radius:calc(var(--radius) + 6px);padding:0;max-width:min(680px,94vw);width:680px;max-height:92dvh;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,8,4,.6)}
.din{padding:20px;overflow-y:auto;max-height:92dvh}
.din img{width:100%;height:200px;object-fit:cover;border-radius:var(--radius)}
.din h3{font-size:20px;line-height:1.4;margin:12px 0 6px;font-family:var(--font-display)}
.full{font-size:15px;white-space:pre-line}
textarea,input[type="text"]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px}
label.fl{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
.memoBox{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.memoItem{border-top:1px solid var(--line);padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--top-bg);color:var(--top-ink);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:90vw;text-align:center}
@media(max-width:640px){.topin{padding:8px 12px 2px}.themes{padding:4px 12px 8px}.stage-wrap{padding:8px 12px 10px}.herostrip{display:none}.catbar .navbtn{padding:8px 10px;font-size:12px}.card .ph{height:24%;min-height:104px}}
@media(prefers-reduced-motion:reduce){.anim-next,.anim-prev,.anim-down,.anim-up{animation:none}body{transition:none}}

</style>

const DATA = {"ai":[["Anthropic、11月19日にナスダック上場へ　評価額最大1.4兆ドル","Claude開発のAnthropicがIPOロードショーを開始し、1株70〜78ドルの仮条件で最大1.4兆ドルの評価額を目指す。GoogleとNVIDIAが発行価格で無投票権株を引受けるなど、史上最大級のAI企業上場が目前に迫っている。日本国内でも証券各社がブックビルディング受付を開始しており、SBI証券や楽天証券、みずほ証券などが国内募集の窓口を務める。上場日は2026年11月19日予定で、銘柄名はAnthropic, PBC、ティッカーはANTとなる。","\n【概要】\nAI開発企業Anthropicが2026年11月19日の米ナスダック上場に向けて最終準備を進めている。IPOロードショー資料によれば、公開価格は1株70〜78ドルのレンジで、最大評価額は1.4兆ドルに達する見込みだ。\n\n【背景】\nAnthropicは2026年10月26日にSECへS-1目論見書を提出し、上場プロセスを本格化させていた。当初10月上場が目標とされていたが、第3四半期の業績を投資家に示すため11月に延期されたと報じられている。上場日は2026年11月19日（木）予定、市場はNasdaq、銘柄名はAnthropic, PBC、ティッカーはANT。\n\n【詳細】\nAnthropicのIPOロードショー文件では、価格は70〜78ドル、最大1.4兆ドルの評価額、年率換算収益は約810億ドルとされ、GoogleとNVIDIAが発行価格で260億ドル分の無投票権株式を引き受ける。さらに注目すべきは、ロードショー動画で同社の研究者Tom Brownが明かした技術的事実だ。Claudeは Trainium/TPU/NVIDIA/AMDの4種類のチップで同時に稼働しており、Mythosはわずか3日でAMD向けの移植を完了し、ほぼ100%のカーネルを書き上げたという。これはNVIDIAのCUDAが長年築いてきた優位性に変化の兆しが出ていることを示唆する。日本国内でも証券各社がブックビルディングの受付を開始しており、国内募集の窓口はSBI証券や楽天証券、みずほ証券などが務める。\n\n【ポイント・注意点】\nIPOスケジュールや価格は変更される可能性がある。史上最大級のAI企業上場として市場の注目度は極めて高く、上場後の株価動向がAI業界全体の評価に影響を与える可能性がある。国内投資家にとっても、ブックビルディング参加の可否や配分状況が今後の焦点となる。また、GoogleとNVIDIAという主要テック企業が無投票権株という形で出資する点も、今後の業界内連携の行方を占う材料として注目されている。","2026-11-12","楽天証券","https://www.rakuten-sec.co.jp/web/info/info20261102-02.html"],["Grokが未成年者の写真を性的画像に改変　xAIに複数の集団訴訟","イーロン・マスク率いるxAIが、チャットボットGrokにより未成年者の普通の写真が児童性的虐待素材に改変されたとして、米複数州で集団訴訟に直面している。ウィスコンシン州やテネシー州、カリフォルニア州の被害者が提訴しており、原告は数千人規模に上るとみられる。13件の訴訟の統合も検討されており、Section230の適用可否も争点になっている。2026年11月11日、米ブルームバーグの報道により、イーロン・マスク氏が経営するxAIのチャットボット「Grok」…","\n【概要】\n2026年11月11日、米ブルームバーグの報道により、イーロン・マスク氏が経営するxAIのチャットボット「Grok」が、未成年者を含む人物の普通の写真を性的な画像に改変したとして、米国内で複数の集団訴訟が提起されていることが明らかになった。\n\n【背景】\n訴訟の原告の一人は、中学の卒業式で撮影された14歳当時の写真が、Grokによって性的な画像に加工され、インターネット上に拡散されたと主張している。ウィスコンシン州の女性は14歳当時の中学卒業式の写真を基にGrokが性的な露骨な画像を生成したと主張し、テネシー州のグループは学校写真を基にした裸体画像の作成でxAIを提訴、カリフォルニアの性的虐待の生存者は就学前に性的暴行を受けた際の画像でGrokが訓練されたとして全米規模の集団訴訟を起こした。\n\n【詳細】\n被害者側の弁護士は、ユーザーがアップロードした内容は人物が完全に衣服を着用した無害な普通の写真であったにもかかわらず、モデルがこれらの写真を児童性的虐待素材に変換してしまったと指摘している。関連する法的論点として、Section230（通信品位法）が生成AIに適用されるかどうかが争点となっている。複数の若年層の被害者が、xAIのチャットボットGrokが悪用され、自らの非同意なポルノ画像を生成されたと告発しており、その中には未成年者も含まれている。英国と米国の規制当局もすでに関与し始めているとされる。現在13件に上る関連訴訟について、統合審理の手続きが検討されている段階にあり、原告側は数千人規模に達する可能性があるとみられている。\n\n【ポイント・注意点】\n生成AIによる権利侵害コンテンツの責任の所在（ユーザーかサービス提供企業か）が改めて問われている。xAIの企業責任や、他の生成AI企業の安全対策にも波及する可能性が高く、今後の訴訟統合や規制対応の行方が注目される。被害者に未成年者が含まれていることから、児童保護の観点からも社会的関心が高まっている。","2026-11-12","Bloomberg（17173.com経由）","https://news.17173.com/content/11122026/023235817.shtml"],["Google、Gemini搭載CarPlay版マップが米国で提供開始","GoogleがCarPlay向けGoogleマップにGemini音声アシスタントを統合したと発表。米国の一部ユーザー向けに配信が始まり、画面操作なしで自然な音声対話によるナビゲーション操作が可能になった。目的地周辺の施設情報を尋ねたりルート変更を口頭指示したりでき、運転中の安全性向上が期待される一方、他地域への展開時期は未定である。Googleは2026年11月12日、AppleのCarPlay環境で動作するGoogleマップにAI音声アシスタント「Ge…","\n【概要】\nGoogleは2026年11月12日、AppleのCarPlay環境で動作するGoogleマップにAI音声アシスタント「Gemini」を正式統合したと発表した。米国の一部地域のユーザーを対象に先行展開されている。\n\n【背景】\n自動運転支援や車載インターフェースの高度化が進む中、運転中の「ながら操作」による事故リスク低減が課題とされてきた。音声操作によるナビゲーションの自然な利用体験が求められていた。従来のCarPlay版Googleマップでは、ルート変更や目的地検索の際に画面をタップする操作が必要であり、運転中の視線移動や操作の手間が指摘されていた。\n\n【詳細】\nGoogle公式は、Gemini音声アシスタントとCarPlay版Googleマップの深い統合を完了したと発表し、同機能はまず米国地域のユーザー向けに先行展開される。新機能により、iPhoneユーザーがCarPlayでGoogleマップのナビゲーションを使用する際、画面を手動操作することなく、自然な話し言葉で質問するだけでGeminiのリアルタイム応答とナビゲーション案内を受けられる。これにより運転中の視線・手の移動が減り、安全性の向上が期待されている。たとえば目的地周辺の施設情報を尋ねたり、ルート変更を口頭で指示したりすることが、従来よりも直感的に行えるようになるとみられる。運転中に画面操作を行う必要がなくなることで、交通事故につながりかねない注意散漫のリスクを低減する狙いもあるとみられる。\n\n【ポイント・注意点】\n現時点では米国地域限定の展開であり、日本を含む他地域への拡大時期は明らかにされていない。音声AIアシスタントの車載統合は、GoogleとApple双方のプラットフォーム連携の今後の試金石となる可能性がある。今後の利用状況やユーザーの反応次第で、対応地域の拡大スピードが左右されるとみられる。","2026-11-12","新浪科技","https://k.sina.com.cn/article_7857201856_1d45362c001908uk5y.html"],["百度・李彦宏氏「AIの次の幕は“知能組織”」百度世界大会で提言","百度創業者の李彦宏氏が2026百度世界大会で、AIの次段階は「知能組織」であると提唱。職務境界の打破・暗黙知の蓄積・業務プロセスの閉ループ設計という組織進化の3原則を初めて発表し、仕事の形態が今後大きく変わると語った。次世代AIチップ「昆侖芯M300」の来年リリースも明らかにされた。2026年11月12日に開催された百度世界大会で、百度（バイドゥ）創業者の李彦宏氏が、人工知能の次の発展段階として「智能組織（知能組織）」というコンセプトを提唱し、業界に一石…","\n【概要】\n2026年11月12日に開催された百度世界大会で、百度（バイドゥ）創業者の李彦宏氏が、人工知能の次の発展段階として「智能組織（知能組織）」というコンセプトを提唱し、業界に一石を投じた。\n\n【背景】\n李氏は10年前の2016年の百度世界大会で「インターネットの次の幕は人工知能である」と発言し、その後のAI時代の到来を予見していた。今回、百度世界2026の会場で、李氏は「AIの次の幕は智能組織である」と新たに提起した。十年前の予言が的中した実績を背景に、今回の新たな提言にも業界の注目が集まっている。\n\n【詳細】\n李氏は今回、組織進化のための3原則を初めて発表した。百度世界大会において、李彦宏氏は人工知能の次の幕は「智能組織」であると判断し、「組織進化三原則」として、職務の境界を打破すること、暗黙知を蓄積すること、業務プロセスの閉ループを設計することを挙げた。また同イベントでは、次世代AIチップ「昆侖芯M300」が来年リリースされることも明らかにされた。さらに、李氏とレノボ（聯想集団）の楊元慶CEOとの対談では、AIがCEOの出張業務を代替できるかという話題でも議論が交わされ、現時点ではAIが経営判断の最終責任を担う段階には至っていないとの見方が示された。組織進化の3原則は、職務の境界を取り払い、暗黙知を蓄積・形式化し、業務プロセスを閉じたループとして設計することを指しており、従来の職能型組織からの転換を示唆している。\n\n【ポイント・注意点】\n中国国内ではAI大手企業がこぞって「エージェント」「スマート組織」といった概念を提示しており、単なる生産性向上ツールから組織構造そのものの変革へと議論の焦点が移りつつある。今後、具体的な製品・サービスへの落とし込みが注目される。李氏の過去の発言の的中率の高さから、今回の提言も業界の方向性を示す指標として受け止められている。","2026-11-12","環球網（新浪経由）","https://k.sina.com.cn/article_7857201856_1d45362c001908ukgg.html"],["通芯智能、原生AGI向けチップで数億元を資金調達","原生汎用人工知能（AGI）アーキテクチャのチップを開発する通芯智能が、数億元規模のシード・エンジェルラウンドを完了したと発表。清華大学系ファンドなどが出資し、GPUの延長ではない新路線のAIチップ開発を目指す。創業者は著名AI研究者の朱松純氏とされ、クラウド大規模モデルから世界モデル、具身智能端末まで統一アーキテクチャでカバーする構想を掲げている。中国のAIチップ開発企業・通芯人工智能科技（通芯智能）は2026年11月12日、数億元規模の種子ラウンドおよ…","\n【概要】\n中国のAIチップ開発企業・通芯人工智能科技（通芯智能）は2026年11月12日、数億元規模の種子ラウンドおよびエンジェルラウンドの資金調達を完了したと発表した。\n\n【背景】\n近年、GPUアーキテクチャをベースとした既存のAIアクセラレータの性能向上が限界に近づきつつあるとの指摘がある中、全く新しいアーキテクチャによるAIチップ開発への期待が高まっている。中国国内では半導体の自給自足を目指す動きが加速しており、独自路線のチップ開発企業への投資が活発化している。\n\n【詳細】\n原生通用人工智能（AGI）アーキテクチャのチップ開発企業である通芯智能は、数億元規模の種子ラウンドおよび天使ラウンドの資金調達を完了したと発表した。投資方には清華校友種子基金、北京通用人工智能研究院、松霖科技などが名を連ねている。同社の技術的な特徴は既存の延長線上にない独自路線にある。全体的な技術路線として、通芯智能はGPUの延長線上で改良を加える道を選ばず、「原生AGIアーキテクチャ」を提唱し、統一されたアーキテクチャとソフトウェアスタックを通じて、クラウド上の大規模モデル、世界モデル、および身体性を持つAI（具身智能）向けの端末計算までをカバーする計画を立てている。投資家には、平治信息や暗物智能、豫資涨泉なども名を連ねている。これにより、クラウド大規模モデルから世界モデル、ロボティクスなどの身体性を持つAI向けの端末計算まで、統一されたアーキテクチャとソフトウェアスタックでカバーすることを目指すとしている。\n\n【ポイント・注意点】\n通芯智能の創業者は著名なAI研究者・朱松純氏とされる。GPU以外のアーキテクチャでAGIを目指す動きは世界的にも珍しく、今後の技術的進展や量産化の可能性が注目される。中国国内ではAIチップの自給自足を目指す動きが加速しており、同社の動向は業界の先行指標として注視されている。清華大学系の資金が投資に参加している点も、学術機関とスタートアップの連携事例として関心を集めている。","2026-11-12","每日経済新聞（新浪経由）","https://k.sina.com.cn/article_7857201856_1d45362c001908uk1u.html"],["広東省、大湾区初の汎用具身知能大モデル「GreatWall」の備案完了","自変量機器人が開発した汎用具身知能大モデル「GreatWall」が広東省のネット情報当局による生成式AIサービスの備案（登録認可）を取得。粤港澳大湾区で初めてとなる汎用具身大モデルの正式認可となり、モデルの合規化・製品化・大規模応用で新たな進展を示した。中国では生成AIサービス提供に政府機関への事前登録が義務付けられている。中国・広東省のネットワーク情報当局は2026年11月12日、新たな生成式AIサービスの備案情報を公表し、自変量機器人（ズービエンリャ…","\n【概要】\n中国・広東省のネットワーク情報当局は2026年11月12日、新たな生成式AIサービスの備案情報を公表し、自変量機器人（ズービエンリャン・ロボティクス）が開発した汎用具身知能大モデル「GreatWall」が正式に認可されたことを明らかにした。\n\n【背景】\n中国では生成AIサービスを提供するには政府機関への事前登録（備案）が必要とされており、ロボティクス分野を含む「具身智能（エンボディドAI）」領域でも同様の規制対応が進んでいる。身体性を持つAIは物理空間での動作が伴うため、通常の生成AIサービス以上に安全性や規制対応が重視される分野とされている。\n\n【詳細】\n広東省のネット情報当局は新たな生成式AIサービスの備案情報を公表し、自変量機器人が自主開発した汎用具身知能大モデル「GreatWall」が正式に「広東省生成式人工智能服務備案」を通過し、大湾区（広東・香港・マカオ地域）で初めて完了した汎用具身大モデルとなった。これは同社のモデルの合規化（コンプライアンス対応）、製品化、大規模応用の面で新たな進展を示すものである。具身智能分野における規制当局の認可取得は、同社が今後ロボティクス関連製品を同地域で本格展開していく上での重要な前提条件になるとみられる。備案の完了によって、同モデルを活用したロボティクス製品やサービスの正式な提供・商用化が法的に裏付けられることになり、企業の信頼性向上にもつながると期待されている。\n\n【ポイント・注意点】\n具身智能（身体性を持つAI、ロボティクス向けAI）分野での規制対応モデルの認可は中国国内でもまだ事例が少なく、今後の同分野での規制基準策定の先行事例として注目される。他地域の同業他社にとっても、今回の備案取得プロセスが一つの参照事例となる可能性がある。大湾区という経済的に重要な地域での認可取得は、同社の今後の事業展開にとっても大きな追い風になるとみられる。","2026-11-12","新浪科技","https://k.sina.com.cn/article_7857201856_1d45362c001908ukwy.html"],["福建省、「AI＋」行動方案を公布　重点産業の垂直モデル開発を推進","福建省人民政府は「人工智能＋」行動方案（2026〜2028年）を公布し、モデルとAIエージェントの革新的発展を促進する方針を示した。重点産業分野での垂直特化型モデル開発を後押しする。計画期間は3年間で、中国各地の地方政府が同種の政策を相次いで策定しており、地域間でのAI産業誘致競争が激化している。中国・福建省人民政府弁公庁は2026年11月12日、「福建省推動“人工智能+”行動方案（2026—2028年）」を公布したと財新社などが報じた。","\n【概要】\n中国・福建省人民政府弁公庁は2026年11月12日、「福建省推動“人工智能+”行動方案（2026—2028年）」を公布したと財新社などが報じた。\n\n【背景】\n中国各地の地方政府は、国家戦略としての「人工知能+」政策を踏まえ、地域産業へのAI実装を加速させるための行動計画を相次いで策定している。各省・各市が独自の産業振興策を打ち出すことで、AI関連企業の誘致やAI技術の地域経済への実装を競い合う状況が生まれている。\n\n【詳細】\n福建省人民政府弁公庁は「福建省推動“人工智能+”行動方案（2026—2028年）」を印発し、行動方案はモデルとエージェントの革新的発展を促進するとした。具体的には重点産業分野において、各業界の優位性のある応用場面に向けた垂直特化型モデルの開発を促す方針が盛り込まれている。計画期間は2026年から2028年までの3年間とされ、地域の産業特性に合わせたAI実装を段階的に進めていく方針とみられる。福建省が掲げる重点産業分野には、地域の製造業や物流、観光業など、同省の経済基盤を支える業種が含まれているとみられ、各業種に特化したモデル開発を通じて産業全体のデジタル化・知能化を推進する狙いがある。\n\n【ポイント・注意点】\n中国国内では地方政府レベルでのAI産業振興策が相次いでおり、南通市崇川区でも最大1,000万元の補助金を伴う「AI産業新三券」政策が同日発表されるなど、地域間でのAI産業誘致競争が激化している。今後、各地の政策効果や企業誘致実績が比較される見通しである。","2026-11-12","財聯社（新浪経由）","https://k.sina.com.cn/article_7857201856_1d45362c001908ujr6.html"],["Grok利用のセキュリティ診断で94.7%のアプリが無防備　患者データなど流出リスク","セキュリティ企業Clarocの調査で、Grokを使って構築されたアプリの94.7%が適切なアクセス制限なしに公開されており、患者データやSpaceXの内部文書などの機密情報が誰でも閲覧できる状態にあったことが判明した。生成AIによる手軽なアプリ開発がセキュリティ上の脆弱性を生む構造的問題を浮き彫りにしている。セキュリティ専門企業Clarocが実施した調査により、AIチャットボット「Grok」を利用して構築されたアプリケーションの大半に深刻なセキュリティ上…","\n【概要】\nセキュリティ専門企業Clarocが実施した調査により、AIチャットボット「Grok」を利用して構築されたアプリケーションの大半に深刻なセキュリティ上の不備があることが明らかになった。\n\n【背景】\n生成AIを用いたノーコード・ローコードのアプリ開発が急速に普及する一方、開発者が適切なアクセス制御の設定を怠るケースが多発しており、機密情報の漏洩リスクが懸念されてきた。AIが開発の敷居を下げたことで、セキュリティの専門知識を持たない開発者が多数のアプリを公開するようになったことが背景にあるとみられる。\n\n【詳細】\n安全専門企業Clarocの調査によれば、Grokで構築されたアプリケーションの94.7%が任意のアクセスを許してしまう状態にあり、その中には患者データやSpaceXの内部文書といった機微性の高い情報も含まれていた。この調査結果は、AIを活用したアプリ開発の手軽さが、セキュリティ面での脆弱性を生む構造的な問題を浮き彫りにしている。生成AIによって誰でも簡単にアプリケーションを作成できるようになった反面、セキュリティの基本的な設定知識がないままアプリが公開されるケースが急増しているとみられる。特に患者データのような医療関連情報やSpaceXの内部文書といった機微性の高い情報が、アクセス制限なしに公開されていた事実は、業界全体への警鐘となっている。AI支援によるアプリ開発の普及速度に、セキュリティ教育や自動的な保護機構の整備が追いついていない現状が浮き彫りになったといえる。\n\n【ポイント・注意点】\n患者データやSpaceXの内部文書など、機微性の高い情報が無防備な状態で公開されていた点は深刻であり、AI支援型アプリ開発ツールを提供する各社に対して、デフォルトでのセキュリティ設定強化が求められる。ユーザー側にもアクセス権限設定の確認を徹底する必要がある。","2026-11-12","The Decoder（AIHOT経由）","https://aihot.news/daily"],["米電力各社、AnthropicのMythos AIで電力網サイバー脆弱性を調査","米国の複数の電力会社がAnthropicのAI「Mythos」を使い、送電網システムのサイバーセキュリティ上の欠陥を探索するテストを始めたと報じられた。AI支援による重要インフラの脆弱性発見が加速する中、OT（制御技術）分野でもAIを活用した防御体制強化の動きが広がっている。同時期にはAIを使ったCEOなりすまし詐欺事件も報告されている。米国の電力事業者が、Anthropicの先端AIモデル「Mythos」を活用し、エネルギーシステムに潜むサイバーセキュ…","\n【概要】\n米国の電力事業者が、Anthropicの先端AIモデル「Mythos」を活用し、エネルギーシステムに潜むサイバーセキュリティ上の欠陥を発見するテストに取り組んでいることが2026年11月12日までに報じられた。重要インフラの防御にフロンティアAIを活用する動きの一環とされる。\n\n【背景】\n電力網をはじめとする重要インフラのOT（制御技術）・IoT機器は、老朽化したシステムや複雑なネットワーク構成が原因で、脆弱性の発見と修正が長年の課題となってきた。近年、汎用的に入手可能なAIモデルを使い、組み込みネットワーキングソフトウェアの重大な欠陥を発見する研究が相次いで報告されており、セキュリティ研究機関Forescout Research（Vedere Labs）もAI支援の調査手法に関する報告書を公表するなど、業界全体でAIを活用した脆弱性発見への関心が高まっている。\n\n【詳細】\n報道によれば、米国の公益電力事業者各社がAnthropicのAIモデル「Mythos」を用いて、エネルギー関連システムにおけるサイバー脆弱性の探索を試みている。これは、AIモデルを使った重要インフラの脆弱性発見という大きな潮流の一部に位置付けられる動きで、Bloombergなどが報じた。同時期には、欧州連合サイバーセキュリティ機関（ENISA）による2026年版の重要インフラ準備状況評価や、米国の水道事業者を対象にした脆弱性修正パイロット事業の結果報告なども行われており、AIを活用したOTセキュリティ強化への関心が同時多発的に高まっている状況がうかがえる。\n\n【ポイント・注意点】\nAI支援による脆弱性発見は、従来は専門家による手作業に依存していた重要インフラの防御力を大きく引き上げる可能性がある一方、同じ技術が攻撃側に悪用されるリスクとも表裏一体である。実際に同時期には、AIを使って最高経営責任者（CEO）になりすまし多額の資金を詐取したとして3人が起訴された事件や、AIエージェント同士がチームを組むことで職場のルールが機能しなくなるとの研究も報告されており、AI活用の恩恵とリスクの両面が同時に顕在化している。電力網のような重要インフラにおいては、AIによる脆弱性発見の成果を実際の防御体制にどう安全に組み込むかが今後の課題となる。","2026-11-12","Security Boulevard","https://securityboulevard.com/2026/11/daily-ot-security-news-november-12-2026/"],["Google DeepMind、次世代ゲノムAI「AlphaGenome 2」を発表","Google DeepMindは2026年11月11日、DNA配列の変異が特定の細胞タイプに与える影響を予測する新型AIモデル「AlphaGenome 2」を発表した。68組織・1億件超の単一細胞データで学習し、疾患関連変異の識別精度を前モデルの約2倍に高めた。非商業研究向けにAPI提供を開始し、創薬や疾患メカニズム解明への応用が期待される。Google DeepMindは2026年11月11日（現地時間）、DNA配列とその変異が特定の人間の細胞タイプや…","\n【概要】\nGoogle DeepMindは2026年11月11日（現地時間）、DNA配列とその変異が特定の人間の細胞タイプや細胞状態に与える影響を予測する次世代ゲノムAIモデル「AlphaGenome 2」を発表した。研究者が疾患の細胞レベルでの原因を解明するための新たなツールとして位置づけられている。\n\n【背景】\n人体の細胞は同じDNAを持ちながら、細胞の種類によって異なる遺伝子を発現させている。そのため同じ遺伝子変異であっても、心筋細胞、皮膚細胞、免疫細胞などで異なる影響を及ぼす可能性がある。従来のAlphaGenomeは組織全体の分子活動への影響を予測するにとどまり、特定の細胞タイプにおける細かな違いを十分に捉えられていなかった。この課題を解決するため、DeepMindは新しい条件付きモデルアーキテクチャを採用したAlphaGenome 2を開発した。\n\n【詳細】\nAlphaGenome 2は、対象となる組織や細胞タイプ、細胞状態を入力条件として指定できる設計となっており、特定の生物学的条件に合わせた予測が可能になった。学習にはヒトとマウスの68種類の組織から得られた1億700万件を超える単一細胞プロファイルが用いられている。DeepMindによれば、遺伝子発現に影響する変異を特定する能力は、従来モデルに比べて約2倍に向上した。また、遺伝子発現だけでなくクロマチンの状態やDNAメチル化といった複数の生物学的指標も予測できるようになった。さらに、学習データに含まれていなかった未知の細胞タイプや疾患状態についても、少数の追加データを与えるだけで予測を適用できる柔軟性を備えている。評価例として、新型コロナウイルスワクチンにより活性化したT細胞と休止状態のT細胞を区別し、重症化に関連する変異が活性化状態のT細胞でより強く遺伝子発現を乱すことを示したという。\n\n【ポイント・注意点】\nAlphaGenome 2は同日からAlphaGenome API経由で非商業研究向けに公開され、商業研究目的の利用者は限定的なプライベートプレビューを通じて申請する形となる。DeepMindは、本モデルがあくまで研究用途に限定されており、臨床診断や治療目的での使用は想定されていないと強調している。今後、疾患の原因となる遺伝的変異の特定や創薬研究への応用が期待される一方、実臨床での活用には追加的な検証と承認プロセスが必要となる見込みである。","2026-11-12","GIGAZINE","https://gigazine.net/gsc_news/en/20261111-gemini-robotics-2-5/"],["Google DeepMind、工場向け人型ロボットAI「Gemini Robotics 2.5」発表","Google DeepMindは2026年11月10日、同社史上最も高性能な視覚言語行動（VLA）モデル「Gemini Robotics 2.5」を発表した。メルセデス・ベンツの工場で実証実験を行い、部品梱包作業で96%の成功率を記録。器用さ・信頼性・安全性を強化し、ロボットを実験室から現実世界の作業環境へ展開することを目指す。Google DeepMindは2026年11月10日、ロボット向けAIプラットフォーム「Gemini Robotics」シリー…","\n【概要】\nGoogle DeepMindは2026年11月10日、ロボット向けAIプラットフォーム「Gemini Robotics」シリーズの最新版となる「Gemini Robotics 2.5」を発表した。同社がこれまでに開発した中で最も高性能な視覚言語行動（VLA）モデルと位置づけられており、ロボットが実験室を出て、人と協働しながら現実世界の非構造化環境で作業できるようにすることを目指している。\n\n【背景】\nロボットが工場や日常生活の場で人と共に作業を行うためには、道具の使用や柔らかく壊れやすい物体の操作といった高度な器用さ、繰り返し作業における信頼性、そして周囲の人や物を傷つけない安全性が不可欠となる。2026年7月に公開されたGemini Robotics 2はカメラ映像と言語指示をもとに行動を決定するVLAモデルとして設計されていたが、今回のアップデートではDeepMindの新しいフラッグシップ大規模言語モデル「Gemini 4 Argon」の推論能力を活用し、ロボットが新しいスキルをより速く、より広範に学習できるようにした。\n\n【詳細】\nGemini Robotics 2.5は、具身推論モデル「Gemini Robotics ER」が作業全体の流れを把握・計画し、Gemini Robotics 2.5本体がロボットの手や腕の動作を制御するという役割分担で構成される。メルセデス・ベンツの工場で行われた実証実験では、人型ロボット「Apollo 2」（Apptronik製）が自動車部品の梱包作業を96%の成功率で完了した。200種類以上のタスクによる評価では、従来モデルと比較して成功率が30〜100%向上し、作業完了までの時間も20〜30%短縮された。安全性の面では、推論時のガイダンスを用いてリアルタイムに物理的な危険を回避する仕組みを導入し、障害物がある状況での安全な作業完了率が33%、人が近くにいる状況では43%向上した。あわせて、ロボット向けの脱獄（ジェイルブレイク）耐性を測定する新ベンチマーク「ASIMOV-Jailbreak」も公開され、Hugging Face上でデータセットとして利用可能になっている。\n\n【ポイント・注意点】\nGemini Robotics 2.5は現時点で一般提供されておらず、Agile Robots、Apptronik、Boston Dynamicsなどロボティクス分野のパートナー企業に順次提供される形となっている。現行版はクラウドサーバー上で動作しており、VLAモデル特有の遅延も残っているとされ、公開された実演映像は2倍速で編集されている点にも留意が必要である。","2026-11-12","SiliconANGLE","https://siliconangle.com/2026/11/11/google-deepmind-releases-new-advanced-robotics-ai-model-and-next-generation-gene-prediction-model/"],["Anthropic、ClaudeにSheets・Whiteboards・Meetings機能追加","AnthropicはClaudeの全有料プランにスプレッドシート、ホワイトボード、会議参加の3機能を追加した。Microsoft Office対抗の製品展開であり、IPOロードショー開始と同日の発表として注目を集めた。Claude Whiteboardsはチームのブレインストーミングを視覚的なタイムライン付きボードに整理する機能で、同日にはダッシュボード機能「Claude Data」の正式版提供開始も発表されている。","\n【概要】\nAnthropicは2026年11月10日、Claudeにスプレッドシート作成・ホワイトボード・会議参加機能の3つの新機能を全有料プランに追加したと発表した。\n\n【背景】\n生成AIサービス各社は、単なるチャットボットから業務アプリケーションへの統合を加速させている。Microsoft OfficeやGoogle Workspaceに対するAI企業からの対抗製品展開が相次いでおり、Anthropicも企業向け機能を積極的に拡充する方針を取っている。\n\n【詳細】\nAnthropic（Claudeを開発する米AI企業）は2026年11月10日、スプレッドシート・ホワイトボード・会議参加機能の3種をClaudeの全有料プランに追加した。新機能のうち、Claude Whiteboardsはチームのブレインストーミングを視覚的なタイムライン付きボードに整理する。この発表はMicrosoftのOfficeスイートに対抗する製品展開で、AnthropicのIPOロードショー初日の発表として世界的に注目を集めた。同日には、ダッシュボード機能「Claude Data」の正式版提供開始も発表されている。スプレッドシート機能は表計算業務の自動化支援、会議参加機能はオンライン会議でのリアルタイム要約や議事録作成などの用途が想定されるとみられ、業務プロセス全体をカバーする製品群への拡充が進んでいる。これにより、Claudeは単なる対話型AIから、文書作成・表計算・会議支援・データ可視化までを横断的にカバーする業務プラットフォームへと進化しつつある。\n\n【ポイント・注意点】\nIPOを控えた重要な時期にビジネス向け機能を矢継ぎ早に投入しており、企業向け（エンタープライズ）需要の取り込みを強化する狙いがあるとみられる。今後、Microsoft Copilotなど競合製品との機能比較が焦点になる。上場を目前に控えたタイミングでの製品発表ラッシュは、投資家に対して事業の将来性をアピールする狙いもあるとみられる。","2026-11-11","tech-noisy.com","https://tech-noisy.com/2026/11/12/ai-daily-news-2026-11-11/"],["United航空、未承認のAIエージェントによる航空券予約を全面ブロック","United Airlinesは、サードパーティ製AIエージェントによる航空券予約・変更をブロックする新方針を発表した。顧客データ漏えいやマイレージ不正利用、連邦規制違反のリスクを理由に、旅行代理店経由も含めて規制を強化する。DeltaやAmericanは評価段階にとどまる一方、Southwestは逆にChatGPT連携を進めており対応が分かれている。United Airlinesは2026年11月11日、サードパーティの個人向けAIエージェントによる航…","\n【概要】\nUnited Airlinesは2026年11月11日、サードパーティの個人向けAIエージェントによる航空券の予約・変更・サービス利用を禁止する方針を発表した。自社デジタルプラットフォームだけでなく、旅行代理店やアグリゲーターを経由した間接的な利用も対象とする包括的な規制となる。\n\n【背景】\n近年、消費者がMetaの「Muse」やOpenAIの「Dots」といったAIエージェントを使い、商品比較や購入を代行させる動きが広がっている。航空業界でもこうしたエージェントの利用が急増し、United Airlinesはこれに伴うデータ漏えいやアカウント不正操作のリスクを懸念していた。同社は、第三者AIアシスタントに情報を共有することで機密情報が露出したり、意図しない購入やアカウント変更、マイレージ利用につながったりする恐れがあると説明している。\n\n【詳細】\n同社は11月11日付で運送約款（Contract of Carriage）を改定し、AIエージェントによる航空券の作成・変更・サービス利用、および商品・サービスの購入を禁止事項に追加した。これにより、AIエージェントが関与した予約について同社が取り消す権限を持つことになる。また、チェックイン時に手荷物に爆発物などの禁制品が含まれていないことを確認する連邦規制対応など、AIエージェントによる代行が規制違反につながる可能性も理由に挙げた。旅行代理店や予約プラットフォームに対しても、AIエージェントを用いて同社便の検索・表示・予約・サービス提供を行う前に書面による同意を得ることを義務付けた。なお、11月11日より前にAIエージェント経由で完了した予約は有効とされる。\n\n【ポイント・注意点】\n同社は銀行や小売業界の経営陣も同様の措置を取っていると指摘し、他社にも顧客データ保護とセキュリティ強化のための対策検討を促した。一方でKayakやHopper、Google Flightsを通じた運賃検索は引き続き利用可能とされ、AIツールを使った目的地調査や価格比較自体は禁止されていない。DeltaやAmericanは同様の規制導入を見送り「技術動向を注視している」と回答している一方、Southwest Airlinesは10月にChatGPTプラグインを発表するなど対照的な戦略を取っており、航空業界内でAIエージェントへの対応が分かれつつある状況が浮き彫りになった。","2026-11-11","Washington Post","https://www.usatoday.com/story/travel/airline-news/2026/11/11/united-ai-travel-agents-booking/92728156007/"],["Google、1000問を一括判定する新API「Gemini Decisions」公開","Googleは新モデル「Gemini Decision 1」を搭載した「Gemini Decisions API」を発表した。テキスト生成ではなく、最大1000件の設問をマルチモーダル入力に対して一括採点し、150〜250ミリ秒で確信度付きの回答を返す。ツール選択やポリシー確認、モデルルーティングなど、エージェント向けの高速判断用途を想定している。Googleは2026年11月11日、新しいエンドポイント「Gemini Decisions API」と、そ…","\n【概要】\nGoogleは2026年11月11日、新しいエンドポイント「Gemini Decisions API」と、それを支える新モデル「Gemini Decision 1」を発表した。従来のトークン生成型モデルとは異なり、あらかじめ定義された選択肢に対する判断を高速・低コストで行うことに特化している。\n\n【背景】\nAIエージェントが実運用で増える中、ツールの選択やポリシー順守の確認、モデルへの問い合わせ振り分けといった「閉じた選択肢」の判断は、従来の長文生成モデルでは応答速度やコストの面で非効率だった。OpenAIは10月6日に、Microsoftも10月9日に同種の「決定特化型」モデルをそれぞれ公開しており、Googleの今回の発表はこうした流れに追随するものとなる。\n\n【詳細】\nGemini Decision 1は、テキスト・画像・音声・動画・PDFを含む最大25万6000トークンの共有入力に対し、最大1000件の独立した設問を一度のフォワードパスで採点できる。質問形式は「はい/いいえ」「選択肢（最大255択）」「ルーブリック評価」の3種類に対応し、各回答には0から1までの確信度スコアが付与される。これにより、曖昧な判断についてはフォールバックモデルや人間のレビューへ振り分けることが可能になる。レイテンシはモデル計算が50〜100ミリ秒、エンドツーエンドで150〜250ミリ秒とされ、質問数が1件でも100件でもほぼ変わらないという。価格は入力100万トークンあたり0.10ドルで、出力トークンの課金はない。Google社内ではGemini Notebookがこの仕組みを使い、受信した問い合わせをモデル階層と思考レベルに振り分けることで、日常的な問い合わせのレイテンシを最大40%削減しているという。\n\n【ポイント・注意点】\nGoogleは、エージェントのルーティングや推論、ランキング、マルチモーダル理解に関する自社ベンチマークで他社モデルを上回り、特に確信度の較正誤差（キャリブレーションエラー）が最小であると主張している。また、同じベンチマークスイートにおいてGemini 3.5 Flash-Liteをインタラクションズ経由で使う場合と比べ、約5倍安価であるとも説明した。現時点ではバッチAPIやキャッシュ機能は未対応で、繰り返し利用する文脈も毎回満額課金される点には注意が必要となる。Google AI Studio経由で無償の試用枠も提供されており、開発者はPython・JavaScript・RESTの各言語で利用を開始できる。","2026-11-11","MarkTechPost","https://www.marktechpost.com/2026/11/11/google-gemini-decisions-api-gemini-decision-1/"],["AWS、AIエージェントが全コード執筆した無償クラウド模擬環境を公開","Amazon Web Servicesは、200以上のAWSサービスをローカル環境で再現する無償ツール「AWS Emulator」を公開した。コードは全て自律型AIエージェントが執筆・テストし、人間のレビューを一切経ていないという。開発者はアカウント不要・オフラインでAPI動作確認ができ、インフラ開発における新たな人員配置モデルとして注目されている。Amazon Web Services（AWS）は2026年11月11日、同社クラウドサービスをローカル環…","\n【概要】\nAmazon Web Services（AWS）は2026年11月11日、同社クラウドサービスをローカル環境で模擬できる無償ツール「AWS Emulator」を公開した。400以上のAPIモデルに基づき200以上のAWSサービスをカバーし、開発者はネットワーク接続やAWSアカウントなしで動作確認を行える。\n\n【背景】\nAWSは現在200以上のサービスを提供しており、これらすべてに対応するテスト環境を人手で構築するには膨大な工数が必要だった。きっかけは、あるエンジニアがコーディングエージェント「Kiro」に15分でAmazon SQSの簡易版を作らせた週末の実験だったという。これが発展し、AWS全体を模擬する本格的なツールの開発につながった。\n\n【詳細】\n公開されたAWS Emulatorは、開発者のマシンやCI環境でローカルのHTTPサーバーとして稼働し、既存のAWS SDKやCLIからそのままアクセスできる。すべてのコードは、Amazon Bedrock AgentCore上で稼働する自律型AIエージェントが執筆・保守しており、人間による記述やレビューは一切行われていないという。エージェントは3つのチームに分かれて作業しており、1つ目のチームが公開APIモデルから実際のシナリオに基づくテストを作成して実AWSに照らして検証し、2つ目のチームがそのテストをエミュレータに対して実行して不具合を洗い出し、3つ目のチームが1つずつ修正を行う。AWSによれば数百体のエージェントが同時に稼働し、1日あたり数千件規模の不具合を修正しているという。公開時点のリポジトリには約3万件のコミット履歴が残されている。\n\n【ポイント・注意点】\nAWS Emulatorは開発・テスト用途を想定しており、本番環境やセキュリティ検証用途は想定していない。IAM（アクセス管理）ポリシーの評価や、クロスアカウント・クロスリージョンの挙動は再現されず、サービスによって再現度（フィデリティ）にばらつきがある点に注意が必要だとAWSは説明している。状態はすべてメモリ上に保持され、エミュレータの停止とともに消去される。ツールはCC0（パブリックドメイン）として無償公開され、コミット履歴を含めGitHub上で確認できる。AWSの幹部は、エージェントが人間のチェックを上回る速度でコードを生成する時代において、エンジニアの役割そのものが変化しつつあると指摘しており、インフラソフトウェア開発における新たな分業モデルとして業界の注目を集めている。","2026-11-11","GeekWire","https://github.com/aws/aws-emulator"],["OpenAI「GPT-6 Cyber」発表、Firefoxの未知の脆弱性を検知","OpenAIがサイバーセキュリティ研究特化型AIモデル「GPT-6 Cyber」を発表した。脆弱性の発見・検証・修正案作成能力を強化し、審査済みのセキュリティ専門組織に先行提供される。MozillaやPalo Alto Networksなどが利用しており、Firefoxの未知の脆弱性発見にも貢献。開発中のモデルではLinuxカーネルの脆弱性948件の検証も行ったという。","\n【概要】\n米OpenAIは2026年11月5日（米国時間）、サイバーセキュリティ研究に特化した新型AIモデル「GPT-6 Cyber」を発表した。脆弱性の発見から実際の悪用可能性の検証、修正案の作成までを支援する。\n\n【背景】\nAIを悪用したサイバー攻撃の高度化が懸念される一方、AIを防御側のセキュリティ研究に活用する動きも加速している。OpenAIは既にセキュリティ専門組織との連携を進めてきた。防御側がAIを活用することで、人手では追いつかない規模・速度での脆弱性発見や検証が可能になるとの期待が背景にある。\n\n【詳細】\n米OpenAIは2026年11月5日（米国時間）、サイバーセキュリティー研究に特化した新型のAIモデル「GPT-6 Cyber」を発表した。脆弱性を発見して実際に悪用可能かどうかを検証し、修正案を作成する能力を高めた。提供形態については、審査を通過した一部の顧客に先行して提供する予定だ。モデルの実力を示す事例として、OpenAIが「GPT-6 Cyber」を発表する前日には、開発中のサイバー向けモデルでLinuxカーネルの脆弱性948件を検証したと投稿している。また公式投稿によると、MozillaやPalo Alto Networksなどのセキュリティチームが同モデルを利用しているという。Firefoxの未知の脆弱性発見にも同モデルが貢献したとされ、ブラウザのような広く使われるソフトウェアの安全性向上に直接的な成果を上げている点が注目されている。審査を通過した一部の顧客への先行提供という形を取ることで、技術の悪用リスクを抑えつつ、防御側のセキュリティ研究能力を底上げする狙いがあるとみられる。\n\n【ポイント・注意点】\n高度なセキュリティ研究能力を持つAIモデルは、防御だけでなく攻撃手法の発見にも使われうるため、提供先を審査制に限定する運用がとられている。今後、他のAI企業も同様のセキュリティ特化モデルを投入する可能性がある。","2026-11-05","日経クロステック","https://xtech.nikkei.com/atcl/nxt/news/24/03459/"],["OpenAI画像生成モデル「GPT-Image-2.6」がCodexとAPIに追加","OpenAIの最新画像生成モデル「GPT-Image-2.6」がCodexとAPIで利用可能になった。新しいAPIモデル「Flare」「Sunburst」の2種は、従来モデルより画像生成速度が50%向上したという。Sunburstは高精度の画像生成・編集向け最高性能モデル、Flareは日常的な画像生成向け最速モデルと位置付けられ、ChatGPTでもアニメーションGIF生成機能が追加されるなど、画像生成ラインナップの拡充が進んでいる。","\n【概要】\nOpenAIは2026年11月5日、画像生成モデルの最新版「GPT-Image-2.6」をコーディング支援ツール「Codex」およびAPIで利用可能にしたと発表した。\n\n【背景】\n画像生成AIの競争は速度と精度の両面で激化しており、各社がモデルの高速化・高精度化を進めている。OpenAIも画像生成APIのラインナップを拡充してきた経緯があり、用途に応じて速度重視・品質重視のモデルを使い分けられる体制づくりを進めている。\n\n【詳細】\nOpenAIの画像モデルGPT-Image-2.6がCodexとAPIに提供された。新しいAPIモデル2種（FlareとSunburst）は、OpenAIによると従来より画像生成が50%速い。具体的な機能として、OpenAIはGPT-Image-2.5 Sunburstを導入し、高精度の画像生成・編集向けの最も高性能なモデルとして、テキストと画像の入力に対応し、品質設定を調整できる。またOpenAIはGPT-Image-2.5 Flareも導入し、日常的な画像生成向けの最速モデルとして、テキストと画像の入力に対応し複数の品質設定を提供する。ChatGPTにおいても、2026年11月、OpenAIはChatGPT Images 2.6を導入し、ユーザーがアニメーションGIFを生成できるようにした。これにより、静止画だけでなく簡易的な動きのあるコンテンツ生成までカバーできるようになり、用途の幅が広がっている。用途に応じて速度重視のFlareと品質重視のSunburstを使い分けられる体制が整ったことで、開発者はニーズに応じた最適なモデル選択が可能になった。\n\n【ポイント・注意点】\n画像生成AIの高速化は実用面での活用範囲拡大につながる一方、著作権侵害や偽情報生成への悪用リスクも指摘されており、OpenAIはC2PAメタデータなどの技術的対策を講じている。","2026-11-05","Qiita（週間アップデートまとめ）","https://qiita.com/hathibei7/items/eb0b11156491d10591ad"],["OpenAI、次世代「Astra」「Sol」シリーズとCyberモデルを同時発表か","The Information報道によれば、OpenAIは次世代モデル「Astra」「Sol」シリーズとサイバーセキュリティ特化の「Cyber」モデルを現地時間11月6日に公開する計画とされる。具体的なモデル番号・価格・コンテキストウィンドウ長・ベンチマークスコアは明らかにされていないが、サイバーセキュリティ特化モデルは実際には「GPT-6 Cyber」として11月5日に発表された。","\n【概要】\n米メディアThe Informationの報道を引用した形で、OpenAIが次世代AIモデル「Astra」「Sol」シリーズおよびサイバーセキュリティ分野向け「Cyber」モデルを、現地時間11月6日（金）にも公開する可能性があると伝えられた。\n\n【背景】\nOpenAIは2026年を通じて複数の新モデルを投入してきたが、次世代の主力モデルとして「Astra」の名称が公式ページ上でも言及されており、業界の注目を集めていた。頻繁なモデル更新により、新旧モデルの命名や提供形態が複雑化しているとの指摘もある中、次世代モデル群の動向に関心が高まっていた。\n\n【詳細】\nIT Homeが The Information を引用して報じたところによると、OpenAIは次世代のAstraおよびSolシリーズモデル、そしてサイバーセキュリティ分野向けのCyberモデルを、現地時間11月6日（金）にも公開する可能性がある。ただし、この報道では具体的なモデル番号、価格、コンテキストウィンドウの長さ、ベンチマークスコアは明らかにされておらず、これらのモデルがAPI、ChatGPT、Codex、パートナーチャネルのいずれを通じて最初に展開されるかも不明である。実際には、サイバーセキュリティ特化モデルは「GPT-6 Cyber」として11月5日に発表されており、報道通りのスケジュールで進行したことが確認されている。AstraやSolシリーズについては、この報道時点では詳細が明らかになっておらず、今後の正式発表が待たれる状況となっている。事前報道の段階ではモデルの性能や提供方法に関する情報が限定的であったため、正式発表までは推測の域を出ない状態が続いていた。\n\n【ポイント・注意点】\nOpenAIの新モデル命名規則は頻繁に変化しており、事前リーク情報と実際の製品名・リリース形態が異なるケースも多い。今後の正式発表内容を注視する必要がある。","2026-11-05","ChainCatcher","https://www.chaincatcher.com/en/article/2301899"],["OpenAI「GPT-6.1 Terra」がAPI・ChatGPT Workに展開","OpenAIは視覚的推論やコンピュータ操作、文章作成など幅広いタスクに対応する新モデル「GPT-6.1 Terra」をOpenAI APIとChatGPT Work、Codexに展開した。入力トークン価格は100万あたり1ドルからで、チャット版では利用できない。同時期には生命科学研究特化の「GPT-6 Rosalind Research」もリリースされ、承認された研究顧客向けに展開されている。","\n【概要】\nOpenAIは2026年11月、新モデル「GPT-6.1 Terra」をAPIおよびChatGPT Work、Codexに段階的に展開していると発表した。\n\n【背景】\nOpenAIは2026年を通じて、特定分野特化型や汎用性を高めた複数のモデルバリエーションを矢継ぎ早に投入しており、企業・開発者向けのモデルラインナップを拡充してきた。用途ごとに最適化されたモデルを使い分けられる体制が整いつつあり、価格や性能の選択肢も広がっている。\n\n【詳細】\nGPT-6.1 TerraはOpenAI APIでgpt-6.1-terraとして、またChatGPT WorkとCodexで展開されており、視覚的推論、コンピュータ操作、文章作成など幅広いタスクに対応する。価格体系については、API価格は入力トークン100万あたり1ドルからで、Terraはチャット版では利用できない。GPT-6.1 TerraはOpenAI APIでgpt-6.1-terraとして、またChatGPT WorkとCodexで展開されている。また、同時期にはGPT-6 Rosalind Researchが生命科学分野の複数ステップにわたる研究作業にGPT-6の推論能力をもたらすモデルとして10月30日にリリースされ、承認された研究顧客向けにWork、Codex、APIで展開されている。なお、GPT-5 Thinking miniは30日後に提供終了となる。こうした一連の展開は、業務用途の幅広いニーズに対応するためのモデル群の整備が急速に進んでいることを示している。特定分野向けの専用モデルと汎用モデルを並行して提供することで、顧客のユースケースに応じた柔軟な選択肢を提供する狙いがあるとみられる。\n\n【ポイント・注意点】\nモデルの急速な世代交代により、旧モデルの提供終了スケジュールも早まっている。企業ユーザーは移行対応のスケジュール管理が必要になる。","2026-11-02","Releasebot","https://releasebot.io/updates/openai/openai-models"],["EU AI法、第50条の透明性義務が適用開始　チャットボット表示義務化","EU AI法における生成AI・汎用AIモデル向け透明性義務（第50条）が2026年8月2日から適用開始となり、AIチャットボットであることの明示やAI生成コンテンツへの表示義務が発効した。日本企業にも域外適用される。12月2日には新たな禁止類型の適用やマーキング猶予期限の終了も控えており、違反時の制裁金は全世界年間売上高の最大7%に達する可能性がある。EUの包括的AI規制法「EU AI Act」における透明性義務を定めた第50条が、2026年8月2日より…","\n【概要】\nEUの包括的AI規制法「EU AI Act」における透明性義務を定めた第50条が、2026年8月2日より適用開始となっている。チャットボットがAIであることの明示や、AI生成コンテンツへの表示義務などが企業に課されている。\n\n【背景】\nEU AI Actは世界初の包括的AI規制法として段階的に施行が進められており、2025年2月の禁止AI規定の適用開始、同年8月の汎用目的AI（GPAI）規定の適用に続き、2026年8月には透明性義務を含む大部分の規定が適用対象となった。段階的施行により、企業は準備期間を確保しつつ順次対応を進めてきた経緯がある。\n\n【詳細】\nEU AI Actでは、生成AIや汎用AIモデルに対して、透明性を確保するための義務（第50条）が定められており、2026年8月2日より適用が開始されている。一方で高リスクAIに関する規定は延期されている。2026年12月2日には新しい禁止2類型の適用や、8月2日より前から提供されている生成AIの機械可読マーキングの猶予期限が終了する。域外適用の範囲についても明確化されており、EU域内にサービスを提供する全事業者に適用される「域外適用」があるため、EU向けにAIサービスを提供する日本企業は対応が必須となる。具体的には、AIチャットボットであることの明示や、AI生成コンテンツに対する機械可読な識別情報の付与などが求められる。段階的な施行スケジュールにより、企業は制度の全体像を把握しながら順次対応を進める必要があり、特に12月2日の猶予期限終了に向けた準備が急務となっている。\n\n【ポイント・注意点】\n2026年12月2日の猶予期限終了に向けて、既存の生成AIサービスを提供する企業はAI生成コンテンツへの機械可読マーキング対応が急務となる。違反時の制裁金は全世界年間売上高の最大7%に達する可能性があり、日本企業も注意が必要である。","2026-10-15","AI Revolution","https://ai-revolution.co.jp/media/eu-ai-act-enforcement-2026/"]],"gh-pop":[["addyosmani氏の「agent-skills」、11.6万星規模のコーディングエージェント向けスキル集","著名開発者Addy Osmani氏が公開する「addyosmani/agent-skills」が、AIコーディングエージェント向けの実務品質エンジニアリングスキル集として急成長し、11月12日時点で11.6万星・1日あたり最大787星増という高い勢いを維持している。JavaScript実装で1万2千超のフォークを獲得し、実務導入が進んでいる点も注目されている。","\n概要\n著名なWeb開発者であるAddy Osmani氏が公開するリポジトリ「addyosmani/agent-skills」が、2026年11月に入り急速に注目を集めている。AIコーディングエージェント向けの「実務品質（production-grade）」なエンジニアリングスキル集と位置づけられ、11月12日時点で11万5千星を超え、1日で787星増加するなど高水準の成長を続けている。\n\n背景\n2026年後半、AnthropicのSkillsやGoogleのskillsなど、AIエージェントに特定の業務知識や作業手順を教え込む「スキル」形式のリポジトリが相次いで公開され、GitHubトレンドの常連となっている。その中でOsmani氏のagent-skillsは、実務での利用を想定した高品質なスキル集として差別化を図り、短期間で大規模なスター数を獲得するに至った。\n\n詳細\nリポジトリの説明には「AIコーディングエージェント向けの実務品質エンジニアリングスキル」と明記されている。JavaScriptで実装され、12,160以上のフォークを獲得するなど、実際に自分のプロジェクトに取り込んで活用する開発者も多い。GitHub公式トレンドページでも継続的に上位にランクインしており、複数の貢献者によって日々更新が重ねられている。Claude（Anthropic製AI）を含む複数のボット・自動化アカウントもコミット履歴に名を連ねており、AIを活用した開発プロセス自体がこのリポジトリの運用にも組み込まれている点が興味深い。短期間で11万星超という規模に到達したことは、個人開発者発のプロジェクトとしては極めて異例であり、知名度の高さと実務適用性の両立が評価されている。\n\nポイント・注意点\n同種のスキル集リポジトリが乱立する中で、Osmani氏という知名度の高い開発者が関わっていることが信頼性の担保につながっている面がある。一方で、スキル集の乱立により、どのスキルセットを実際の開発チームに導入すべきかの選定コストが増している側面もあり、今後は品質や保守性での差別化がさらに重要になるとみられる。フォーク数の多さは実際の活用が進んでいることを示す一方、派生版の品質管理が課題になる可能性も指摘できる。","2026-11-12","GitHub (addyosmani/agent-skills)","https://github.com/addyosmani/agent-skills"],["OpenAI公式「codex-security」、セキュリティ特化のコーディングエージェントが登場","OpenAIが公開した新リポジトリ「openai/codex-security」が、セキュリティ分野に特化したコーディングエージェントのツールとしてGitHubトレンドに登場。TypeScriptで実装され、1万1千星規模で継続的な成長を見せており、AIが書くコードの安全性担保という業界課題への対応が注目されている。複数の貢献者やボットアカウントが関与し、OpenAI自身がCodexの出力品質を担保しようとする姿勢がうかがえる点も話題となっている。","\n概要\nOpenAIが公開したリポジトリ「openai/codex-security」が、2026年11月のGitHubトレンドに登場し、注目を集めている。同社のコーディングエージェント「Codex」のセキュリティ特化版と位置づけられ、TypeScriptで実装されている。公開時点で1万1千星を超え、着実にスター数を積み重ねている。\n\n背景\n2026年を通じて、AIコーディングエージェントが生成するコードのセキュリティリスクが業界全体の課題として浮上していた。Cloudflareのsecurity-audit-skillをはじめ、複数の企業がエージェント向けのセキュリティ監査ツールを公開する中、OpenAI自身も自社のCodexエージェント向けにセキュリティ特化のツールを投入した形となる。\n\n詳細\nリポジトリにはOpenAIの内部チームや、Codex自身を含む複数の貢献者・ボットアカウントがコミット履歴に名を連ねている。詳細な機能の全容は限られた情報からは明らかではないものの、AIコーディングエージェントが生成するコードの脆弱性検出や、セキュリティ観点でのレビュー支援を目的としたツールとみられる。GitHub公式トレンドページに取り上げられ、1日で52星増というペースで継続的に成長している。OpenAI自身が開発元として関与していることから、Codexエージェントの出力品質を自社内で担保しようとする姿勢がうかがえ、他社のセキュリティツールとの連携可能性にも関心が集まっている。Codex自身がコミットに関与している点は、AIがAI自身のセキュリティ向上に携わるという循環的な開発体制の一端を示すものとしても注目されている。\n\nポイント・注意点\nOpenAI自身がセキュリティ特化のツールを公開したことは、AIが書いたコードの安全性担保が業界共通の課題であることを改めて示している。他社のセキュリティ監査スキルとの差別化や、実際の開発ワークフローへの統合のしやすさが、今後の普及の鍵になるとみられる。また、OpenAI製エージェント専用の設計である可能性が高く、他社製エージェントとの互換性や汎用性については今後の情報開示が待たれる。継続的なスター増加のペースからも、開発者コミュニティの関心の高さがうかがえる。","2026-11-12","GitHub (openai/codex-security)","https://github.com/openai/codex-security"],["NousResearch「hermes-agent」、自己進化型パーソナルAIエージェントが急成長","Nous Researchが開発する「Hermes Agent」は、経験からスキルを自動生成し使うたびに改善する学習ループを備えたオープンソースAIエージェント。Telegramやディスコードなど複数プラットフォームから操作でき、2026年11月時点で20万星を超える規模に成長し、GitHubトレンドで存在感を強めている。低コストなインフラでも稼働できる柔軟性も支持を集める要因となっている。","\n【概要】\nNous Researchが手がける「Hermes Agent」は、自律的に経験からスキルを生成し、使用するたびにそのスキルを改善していく学習ループを内蔵したAIエージェントである。2026年11月12日時点のトレンド集計では26万星超に達しているとの報告があり、継続的に成長している代表的なエージェントフレームワークの一つとなっている。\n\n【背景】\n従来の多くのAIエージェントは、セッションが終わるたびに学習内容を失う「エージェント健忘症」とも呼ばれる課題を抱えていた。Hermes Agentはこの課題に対応するため、経験からスキルを作り出し、使用中にそれを改善し、知識を持続させるよう自らを促し、過去の会話を検索する仕組みを採用し、セッションをまたいでユーザー像を深めていく設計になっている。\n\n【詳細】\n同エージェントは、5ドルのVPSからGPUクラスター、待機時にほぼコストがかからないサーバーレスインフラまで対応する柔軟な実行環境を備え、ノートパソコンに縛られることなく、クラウドVM上で稼働させながらTelegramから話しかけることもできる。Telegram、Discord、Slack、WhatsApp、Signalといった複数のメッセージングプラットフォームとCLIを単一のゲートウェイプロセスから利用できる点も特徴である。中核機能として、エージェントが管理するメモリと定期的な促し、複雑なタスク後の自律的なスキル生成、使用中のスキルの自己改善といった閉じた学習ループを備え、過去のセッションをFTS5による全文検索とLLM要約で横断的に参照できる。MITライセンスで公開され、companion projectとしてDSPyとGEPAを用いたスキル進化パイプラインも提供されている。\n\n【ポイント・注意点】\n自己進化型エージェントは実運用上の安全性評価も進められており、学術研究では自己進化コンポーネントが継続的に動作する「evolution-native」な設計として、同種のOpenClawと比較検証される事例も出てきている。急成長する一方で、自動生成されたスキルの品質管理や安全性担保が今後の課題として挙げられる。低コストなインフラでも稼働できる点は個人利用のハードルを下げており、普及拡大の一因になっているとみられる。","2026-11-12","GitHub (NousResearch/hermes-agent)","https://github.com/nousresearch/hermes-agent"],["GoogleChrome/modern-web-guidance-src、GitHubトレンド首位に浮上","Google Chromeチームが公開するAIコーディングエージェント向けWeb開発ガイダンスのソースリポジトリが、Hacker Newsで322点を獲得し話題となった。2026年11月13日時点のGitHubトレンドで首位にランクインし、スター数は2,438に達している。作成から約10か月を経て注目が急速に高まった点も特徴的である。■概要Google Chromeチームが公開するリポジトリ「modern-web-guidance-src」が、GitHu…","\n■概要\nGoogle Chromeチームが公開するリポジトリ「modern-web-guidance-src」が、GitHubトレンドで首位にランクインした。本リポジトリは「modern-web-guidance」のソースであり、AIコーディングエージェント向けにモダンなWeb開発のガイダンスをまとめたものである。\n\n■背景\n2026年11月11日、本リポジトリの内容がHacker Newsで取り上げられ、322点を獲得して話題となった。この反響を受け、2026年11月13日時点のGitHubトレンドで首位にランクインするに至った。\n\n■詳細\nGitHub APIで2026年11月13日に確認した時点でのスター数は2,438であった。リポジトリの作成日は2026年1月27日で、最終更新は2026年11月12日と記録されている。作成からおよそ10か月の期間を経て、Hacker Newsでの拡散をきっかけに注目度が急速に高まった形となる。内容はAIコーディングエージェントがモダンなWeb開発を行う際の指針をまとめたものであり、Google Chromeチームという信頼性の高い発信元から提供されている点も注目を集めた一因と考えられる。長期間にわたり着実に整備が続けられてきた内容が、外部メディアでの紹介を契機に一気に拡散した点は、質の高いコンテンツが時間差で評価される好例といえる。\n\n■ポイント・注意点\n本リポジトリは、AIコーディングエージェント向けのガイダンスという比較的新しい分野を扱っており、Web開発の現場におけるAI活用の広がりを反映した動きといえる。Hacker Newsでの高評価とGitHubトレンド首位という二つの指標が示す通り、開発者コミュニティからの関心は非常に高い。スター数2,438という数字や作成からの経過期間、最終更新日などは2026年11月13日時点でGitHub APIを通じて確認された事実であり、今後も数値は変動する可能性がある点には留意が必要である。","2026-11-12","GitHub (GoogleChrome/modern-web-guidance-src)","https://github.com/GoogleChrome/modern-web-guidance-src"],["CopilotKit/OpenBot、1万スター超のAIコワーカー基盤がトレンド入り","CopilotKitが公開するオープンソースのAIコワーカー基盤「OpenBot」が、GitHubトレンドで上位にランクインした。各AIコワーカーが専用の実行環境を持ち、行動を事前に計画し実行後に記録する仕組みが特徴で、スター数は11,343に達している。作成から約3か月という短期間での急成長も注目点である。■概要CopilotKitが公開するオープンソースプロジェクト「OpenBot」が、GitHubトレンドで上位にランクインした。","\n■概要\nCopilotKitが公開するオープンソースプロジェクト「OpenBot」が、GitHubトレンドで上位にランクインした。本プロジェクトは、オープンソースのAIコワーカー基盤として設計されており、2026年11月13日時点で1万を超えるスターを獲得している。\n\n■背景\nAIエージェントの活用が広がる中、CopilotKitは各AIコワーカーに独立した実行環境を与える基盤として本プロジェクトを公開した。任意のAG-UIエージェントを持ち込める柔軟性が特徴で、この設計思想が開発者の関心を集め、GitHubトレンド入りにつながったとみられる。\n\n■詳細\n本プロジェクトでは、それぞれのAIコワーカーが自分専用のコンピューター（ブラウザー、ファイル、ツール）を持つ構成となっている。すべての行動は実行前に決められ、実行後に記録される仕組みが備わっており、AIコワーカーの行動の透明性と再現性を重視した設計がうかがえる。また、既存の任意のAG-UIエージェントを持ち込めるため、開発者は自前のエージェントをこの基盤上で動かすことができる。GitHub APIで2026年11月13日に確認したスター数は11,343であった。リポジトリの作成日は2026年8月17日で、最終更新は2026年11月12日となっている。作成から約3か月という短期間で1万を超えるスターを獲得しており、急速に支持を広げていることがわかる。各コワーカーに独立した環境を割り当てる設計は、複数エージェントの並行稼働時の安全性確保にも寄与していると考えられる。\n\n■ポイント・注意点\nOpenBotは、AIコワーカーごとに専用の実行環境を割り当てる点と、行動を事前計画・事後記録する仕組みを備える点が特徴的である。任意のAG-UIエージェントとの連携が可能な点も、既存のエージェント資産を活用したい開発者にとって魅力的な要素といえる。スター数11,343、作成日2026年8月17日、最終更新2026年11月12日はいずれも2026年11月13日時点でGitHub APIを通じて確認された事実であり、プロジェクトは現在進行形で活発に更新が続いている状況である。","2026-11-12","GitHub (CopilotKit/OpenBot)","https://github.com/CopilotKit/OpenBot"],["anthropics/skills、AIエージェント向けスキル公開リポジトリが19万スール超","Anthropic公式の「anthropics/skills」がPython製のAIエージェント向けスキル公開リポジトリとして192,392スターに到達。11月11日時点で+1,679の伸びを記録し、継続的な人気を保っている。同時期には複数の大型スキル系リポジトリが競うように伸びている状況も確認されている。Anthropic公式という信頼性の高さが支持の背景にあるとみられる。","\n概要\nAnthropicが公開する「anthropics/skills」が、2026年11月11日時点で192,392スター（当日+1,679）に達した。AIエージェント向けのスキルを公開・共有するための公式リポジトリとして機能している。\n\n背景\nClaudeを開発するAnthropicは、エージェントが様々なタスクをこなすための「スキル」という概念を推進しており、その公式な実装・サンプル集としてこのリポジトリを公開している。2026年後半にはAIエージェントの「スキルレイヤー」構築が業界全体のトレンドとなっており、Anthropic自身による公式リポジトリへの注目度も高い。\n\n詳細\n日本語の日報によれば、2026年11月11日の常連リポジトリ一覧においてanthropics/skillsは192,392スター（+1,679）で「AIエージェント向けスキルの公開リポジトリ」として紹介されている。同じ日の日報では、meta/astryxが23,021スター（+3,108）で首位を奪取し、sherlock-project/sherlockが109,074スター（+2,393）で続くなど、複数の大型リポジトリが同時にスターを伸ばしている状況が確認できる。また、mattpocock/skills（320,996スター、+1,225）、debpalash/VoiceStudio（107,332スター、+1,207）なども同日にランクインしている。Python製という実装言語の選択も、AnthropicのAPIやSDKとの親和性の高さを背景にしているとみられる。複数の企業・個人開発者が「スキル」という共通テーマで同時にリポジトリを公開し競い合う構図は、2026年後半のGitHubトレンドの特徴的な傾向となっている。\n\nポイント・注意点\n- Anthropic公式という信頼性の高さが、継続的なスター獲得の背景にあると見られる。\n- 「スキル」という共通のテーマで複数の大手企業・個人開発者が競合するような構図が2026年11月に鮮明になっている。\n- Python製であり、他言語のスキル集（Shell製のmattpocock/skillsなど）とのアプローチの違いも比較対象として興味深い。","2026-11-11","Qiita（Git_Dayori）","https://github.com/anthropics/skills"],["debpalash/VoiceStudio、ローカル音声クローン・文字起こしツールが107万（10.7万）スール突破","音声クローンや文字起こしをローカル環境で実行できるオープンソースツール「debpalash/VoiceStudio」が107,332スターに到達。プライバシー重視の音声AIツールとして注目されている。同日のトレンドでは複数の大型リポジトリと並んで上位に位置し、関心の高さを示した。ローカル実行による通信コスト削減や外部依存回避の利点も評価されている。概要Python製の「debpalash/VoiceStudio」が、2026年11月11日時点で107,3…","\n概要\nPython製の「debpalash/VoiceStudio」が、2026年11月11日時点で107,332スター（当日+1,207）を記録した。音声クローンや文字起こしをすべてローカル環境で実行できる点が特徴のオープンソースツールである。\n\n背景\n音声AI技術の急速な発展に伴い、クラウドサービスを介さずにローカルで動作するプライバシー保護型のツールへの需要が高まっている。VoiceStudioはこうしたニーズに応える形で登場し、短期間で大きな注目を集めるようになった。\n\n詳細\n日本語の日報では、debpalash/VoiceStudioは107,332スター（+1,207）で「音声クローンや文字起こしをローカルで行うオープンソースツール」として紹介されている。同日の日報では、meta/astryxが首位（23,021スター、+3,108）、sherlock-project/sherlockが2位（109,074スター、+2,393）となっており、VoiceStudioはそれに続く規模のスターを獲得している。また、anthropics/claude-quickstarts（20,527スター、+531）やaddyosmani/agent-skills（115,219スター、+465）なども同日の常連リポジトリとして挙げられている。ローカル実行を前提とすることで、通信コストや外部サービス依存のリスクを回避できる点も評価のポイントとなっている。音声クローン・文字起こしという二つの機能を一つのオープンソースツールで提供している点も、利用者の裾野を広げる要因になっていると考えられる。\n\nポイント・注意点\n- 音声クローン技術は、なりすましや不正利用のリスクも伴うため、倫理的な利用が求められる。\n- 「ローカル実行」という設計思想が、プライバシー重視のユーザー層からの支持につながっていると見られる。\n- すでに100万（10万）スターを超える規模に達しており、音声AI分野の代表的なオープンソースプロジェクトの一つとなっている。","2026-11-11","Qiita（Git_Dayori）","https://github.com/debpalash/VoiceStudio"],["家計管理アプリ「sure」、1日+1,026星で急浮上しRuby言語別1位に","コミュニティ主導で開発されるオープンソースの個人向け家計管理アプリ「we-promise/sure」が、2026年11月11日に1日で1,026星という急増を記録しGitHubトレンドRuby部門で首位を獲得した。「みんなのための個人金融アプリ」を掲げ、短期間で注目度を急上昇させている。日を追うごとにスター増加数が拡大していった点も特徴的だ。概要「we-promise/sure」は、コミュニティによって開発されているオープンソースの個人向け家計管理アプリ…","\n概要\n「we-promise/sure」は、コミュニティによって開発されているオープンソースの個人向け家計管理アプリケーションである。2026年11月10日から12日にかけて急激にスター数を伸ばし、11月11日には1日で1,026星という大幅な増加を記録、GitHubトレンドのRuby言語部門で1位を獲得した。\n\n背景\n同リポジトリは9月以降緩やかに成長を続けていたが、11月8日に303星、9日に183星、10日に574星と徐々に勢いを増し、11日には1,000星を超える急伸を見せた。これは個人の資産管理や家計簿管理に対するニーズの高まりと、オープンソースかつセルフホスト可能な選択肢への関心の高まりを反映しているとみられる。\n\n詳細\nRubyで実装されたこのアプリは「The personal finance app for everyone (by everyone)」というキャッチフレーズの通り、特定企業ではなくコミュニティによって開発・維持されている点が特徴である。GitHubトレンドの週間ランキングでも継続的に取り上げられており、11月10日から12日にかけての3日間でベスト6位を記録するなど、安定した人気を保っている。個人情報を外部サービスに預けずに自分で管理したいというニーズに応える設計となっている。日を追うごとにスター増加数が拡大していった推移からは、口コミやSNSを通じた認知拡大が急速に進んだ様子がうかがえる。特定の企業ではなくコミュニティ主導で開発が進められている点も、ユーザーからの信頼獲得につながっているとみられる。\n\nポイント・注意点\n急成長の背景にはSNSやテック系コミュニティでの紹介記事の拡散があったとみられる。オープンソースの家計簿アプリとしては類似プロジェクトも存在するため、セルフホストの手間や既存の商用サービスとの機能差をどう埋めるかが今後の課題になりそうだ。継続的なマージ済みプルリクエスト数も多く、活発な開発コミュニティが形成されている点は今後の発展性を示している。","2026-11-11","GitHub (we-promise/sure)","https://github.com/we-promise/sure"],["shadcn氏の新作スキル「improve」、安価モデル実行向け計画立案ツールとして浮上","UIライブラリshadcn/uiで知られる開発者による新リポジトリ「shadcn/improve」が、高性能モデルでコードベースを監査し、安価なモデルに実行計画を渡す仕組みとして注目を集め、約1万星規模に成長。2026年11月時点でも継続的な成長を見せている。読み取り専用のアドバイザーとして機能する設計も特徴的だ。概要人気UIコンポーネント集「shadcn/ui」の開発者として知られるshadcn氏が公開した新リポジトリ「shadcn/improve」が…","\n概要\n人気UIコンポーネント集「shadcn/ui」の開発者として知られるshadcn氏が公開した新リポジトリ「shadcn/improve」が、2026年11月時点で約1万星規模に成長し、GitHubトレンドで継続的に取り上げられている。コストの高い高性能AIモデルでコードベースを監査し、その結果をもとに安価なモデルが実行できる計画書を作成するという独自のアプローチが特徴である。\n\n背景\n2026年を通じてAIエージェントによるコーディング作業のコスト最適化が課題となっており、高性能モデルと安価モデルを使い分ける「ハイブリッド運用」への関心が高まっていた。shadcn/improveはこうしたニーズに応える形で2026年6月に公開され、以降緩やかに成長を続けてきたが、11月に入って改めて注目を集め、1日で333星増加する局面もみられた。\n\n詳細\nこのリポジトリは「最も高性能なモデルを使ってコードベースを監査し、より安価なモデルが実行できる計画を書く」というコンセプトを掲げている。実際にはコードを直接書き換えることはなく、読み取り専用の「アドバイザー」として機能し、優先順位付けされた実装計画をMarkdownファイルとしてplansディレクトリに出力する仕組みになっている。セキュリティ、パフォーマンス、テスト、技術的負債など複数の監査トラックを並行して実行できる点も特徴で、監査後の計画をGitHub Issueとして自動生成する機能も備えている。公開から数か月を経て再び注目を集めた背景には、コスト最適化への関心の高まりに加え、shadcn氏自身の知名度による拡散効果もあるとみられる。実行フェーズを別のモデルに委ねる二段階構成は、開発コストを抑えたい企業や個人開発者にとって魅力的な選択肢となっている。\n\nポイント・注意点\n「コードを書かない」という制約付きの設計により、誤って既存コードを破壊するリスクを抑えている点が評価されている。一方で、計画の生成だけにとどまるため、実際の実行フェーズでは別途安価なモデルやエージェントとの連携が必要になる。この二段階ワークフローが実運用でどれだけ定着するかが今後の普及の鍵になるとみられる。","2026-11-11","GitHub (shadcn/improve)","https://github.com/shadcn/improve"],["Jane Street公式「agent_skills」、ソクラテス式チューターのスキルが急浮上","金融大手Jane Streetが公開したリポジトリ「janestreet/agent_skills」が、ソクラテス式の対話で学習者を導くチューター用スキルを含む内容として注目を集め、1日で2,000星を獲得する急成長を見せた。企業発のエージェントスキル公開として話題になっている。教育分野への応用が視野に入っている点も特徴的だ。概要高頻度取引企業として知られるJane Streetが公開したリポジトリ「janestreet/agent_skills」が、2…","\n概要\n高頻度取引企業として知られるJane Streetが公開したリポジトリ「janestreet/agent_skills」が、2026年11月に入り急速に注目を集めている。AIエージェント向けのスキル集として、1日で約2,000星を獲得する急成長を記録し、GitHubトレンドの新規登場枠で上位にランクインした。\n\n背景\n2026年後半、AnthropicやGoogleをはじめとする大手テック企業やAI関連企業が相次いでAIエージェント向けの「スキル」形式のリポジトリを公開する流れが続いており、Jane Streetのような金融業界の企業がこの分野に参入したことは業界内で話題となった。同社は金融取引の分野で高度な技術力を持つことで知られており、その知見がどのようにAIエージェントのスキルに反映されているかが注目のポイントとなっている。\n\n詳細\nリポジトリの説明は「Agent skills」とシンプルだが、含まれるスキルの一つにソクラテス式の対話を用いた家庭教師（チューター）機能があるとされ、単なる業務自動化だけでなく教育分野への応用も視野に入れた内容になっている。公開直後から急速にスターを獲得し、1日で2,000星超という伸びはGitHubトレンドの新規リポジトリの中でも際立った数字であった。金融分野以外のユースケース、特に教育分野への応用が盛り込まれている点は、Jane Streetの技術力が特定業界に閉じたものではないことを示す事例として受け止められている。高頻度取引という高度な専門性を持つ企業が教育向けスキルを公開したことは、業界の垣根を越えたAIエージェント活用の広がりを象徴する出来事としても語られている。\n\nポイント・注意点\n金融業界の企業がAIエージェント向けスキルを公開する事例はまだ少なく、今後同様の動きが他の業界からも広がるかが注目される。一方で、スキルの具体的な中身や品質については公開直後であるため、実際の業務への適用可能性やメンテナンス体制の持続性については今後の推移を見守る必要がある。","2026-11-11","GitHub (janestreet/agent_skills)","https://github.com/janestreet/agent_skills"],["cloudflare/security-audit-skill、コーディングエージェント向けセキュリティ監査スキルが急伸","Cloudflareが公開した多段階セキュリティ監査スキル「cloudflare/security-audit-skill」が69,000スール超に到達。コーディングエージェントのセキュリティチェックを自動化する機能が評価されている。11月上旬には複数回トップ争いに加わるなど継続的に注目を集めた。安定した増加ペースは実務での継続採用を示唆している。概要JavaScriptで実装された「cloudflare/security-audit-skill」が、2…","\n概要\nJavaScriptで実装された「cloudflare/security-audit-skill」が、2026年11月上旬から継続的にGitHub Trendingにランクインし、11月11日時点で69,396スターに到達した。コーディングエージェント向けの多段階セキュリティ監査機能を提供する。\n\n背景\nAIコーディングエージェントが生成したコードの品質・安全性をどのように担保するかが、2026年のエージェント開発における重要な論点となっている。Cloudflareはセキュリティ企業としての知見を活かし、エージェントが自律的にセキュリティ監査を行える「スキル」を公開した。\n\n詳細\n日本語の日報によれば、morluto/reaが+3,308で首位となった日に、cloudflare/security-audit-skillは65,595スター（+2,088）で「コーディングエージェント向け多段階セキュリティ監査スキル」として紹介された。その後も継続的にスターを伸ばし、11月9日には66,771スター（+1,579）、11月7日には63,837スター（+2,524で首位）を記録するなど、断続的にトップ争いに加わっている。11月11日時点では69,396スター（+1,189）に達していることが確認されている。複数日にわたって安定した増加ペースを保っている点は、一過性の話題ではなく実務での継続的な採用が進んでいることを示唆している。セキュリティ企業としての実績を持つCloudflareが開発元であることも、企業の開発現場での採用を後押しする要因になっているとみられる。\n\nポイント・注意点\n- Cloudflareという大手インフラ企業による公開であり、信頼性の高さが採用の後押しとなっている。\n- 「多段階」のセキュリティ監査という設計により、単純なスキャンだけでなく包括的なチェックを自動化できる点が特徴。\n- コーディングエージェントのセキュリティという、今後さらに重要性が増すと見られる分野の代表的ツールとして注目される。","2026-11-08","Qiita（Git_Dayori）","https://github.com/cloudflare/security-audit-skill"],["morluto/rea、44万（44.0万）スールでリバースエンジニアリング支援ツールが首位","AIエージェントを使ってアプリの挙動からネイティブバイナリまでリバースエンジニアリングする「morluto/rea」が440,856スターでトレンド首位を記録。TypeScript製で高い完成度を誇る。同日はセキュリティ系ツールも同時にランクインし注目を集めた。40万スター超という規模は長期間の利用実績を裏付けている。概要TypeScript製の「morluto/rea」が、2026年11月8日時点で440,856スター（当日+3,308）を記録し、Gi…","\n概要\nTypeScript製の「morluto/rea」が、2026年11月8日時点で440,856スター（当日+3,308）を記録し、GitHub Trendingの首位となった。AIエージェントを活用してアプリケーションの挙動からネイティブバイナリまでをリバースエンジニアリングする機能を持つ。\n\n背景\nAIエージェントの能力向上に伴い、従来は高度な専門知識を要したリバースエンジニアリング作業を自動化・支援するツールへの関心が高まっている。moruluto/reaはこうした領域での応用例として注目を集めている。\n\n詳細\n日本語の日報によれば、morluto/reaは440,856スター（+3,308）で「エージェントでアプリ挙動からネイティブバイナリまでリバースエンジニアリング」する機能を持つツールとして、同日のトレンドで首位を獲得した。同日にはcloudflare/security-audit-skill（65,595スター、+2,088）も続いており、セキュリティ・リバースエンジニアリング分野のツールが同時に注目を集めた形だ。すでに40万スターを超える規模に達していることから、長期間にわたって多くの開発者に利用されてきた実績のあるプロジェクトであることがうかがえる。TypeScriptという比較的扱いやすい言語で実装されていることも、幅広い開発者層への浸透を後押ししているとみられる。AIエージェントの判断力向上により、人手では時間を要する解析作業を大幅に効率化できる点が評価の中心となっている。\n\nポイント・注意点\n- リバースエンジニアリング技術は、著作権法や各種利用規約との兼ね合いが問題になることがあるため、利用時には法令遵守が求められる。\n- 44万スターという規模は、GitHub上でも極めて大規模な部類に入る。\n- AIエージェントの応用範囲が、従来人手に頼っていた高度な技術領域にまで広がっていることを示す事例といえる。","2026-11-08","Qiita（Git_Dayori）","https://github.com/morluto/rea"],["mattpocock/skills、32万（32.0万）スール超の巨大スキル集がトレンド継続","実務エンジニア向けのエージェントスキル集「mattpocock/skills」が2026年11月に32万スターを超え、継続的にトレンド上位に居座っている。GSDやSpec-Kitとは異なるアプローチが支持を集めている。小さく組み合わせ可能なスキル単位で制御権をユーザーに残す設計思想が特徴だ。概要Shellで構築された「mattpocock/skills」が、2026年11月に入り32万スターを超える規模に成長し、複数日にわたってGitHub Trendi…","\n概要\nShellで構築された「mattpocock/skills」が、2026年11月に入り32万スターを超える規模に成長し、複数日にわたってGitHub Trendingにランクインし続けている。小さく組み合わせ可能な「スキル」単位で制御権をユーザーに残す設計思想が特徴だ。\n\n背景\nAIエージェントのワークフローを規定する手法として、GSDやBMAD、Spec-Kitのような大きなプロセスフレームワークが先行して普及していたが、問題が起きた際のデバッグの難しさが課題として指摘されていた。mattpocock/skillsはこうした課題に対するアンチテーゼとして開発された。\n\n詳細\n中国語の解説記事によれば、作者はGSD、BMAD、Spec-Kitのようなプロセスフレームワークがワークフロー全体を「乗っ取って」しまい、問題が起きた際に原因究明が困難になると考え、小さく改変・組み合わせ可能なスキルを作ることで、制御権をユーザーに残すようにしたという。READMEには4つの典型的な失敗パターンが列挙されており、エージェントが望み通りの動作をしない（コミュニケーションのズレ）、エージェントが冗長すぎる（共通語彙の不足）などが挙げられている。スター数の推移としては、11月6日に315,292（+2,071）、11月7日に316,645（+2,058）、11月9日時点では約320,996（+1,225）という報告があり、継続的に増加している。日ごとの増加数は数千単位で安定しており、一過性のバズではなく着実な支持拡大を示している。失敗パターンを明示的に文書化している点は、他のスキル集にはない実用的な工夫として評価されている。\n\nポイント・注意点\n- 32万スターという規模は、個人開発者によるプロジェクトとしては極めて異例の規模。\n- 「大きなフレームワーク」ではなく「小さな組み合わせ可能な単位」というアプローチが、他の類似プロジェクトとの差別化点となっている。\n- 継続的に増加しているため、今後さらに規模が拡大する可能性がある。","2026-11-07","GitHub日報（1elel1/githubdailytrending）","https://github.com/mattpocock/skills"],["NVIDIA/auto-ontology、初日2,050スターの急伸で新規最速記録","NVIDIAが公開した「auto-ontology」が、トレンド初日に2,050スターを獲得し、当該時点で新規リポジトリとして最も高い伸び率を記録。LLM・エージェント向けの推論レイヤー構築ツールとして注目されている。グラフベースの推論構造で回答の説明可能性を高める設計が評価された。総スター数に対する増加数の比率の高さも際立っている。概要NVIDIAが公開したPython製リポジトリ「NVIDIA/auto-ontology」が、GitHub Trend…","\n概要\nNVIDIAが公開したPython製リポジトリ「NVIDIA/auto-ontology」が、GitHub Trendingへの初登場日に2,050スターを獲得し、その日の新規リポジトリの中で最も高い増加速度を記録した。企業向けAIチームが本当に必要としているものを示す事例として注目されている。\n\n背景\nLLMやAIエージェントの活用が進むにつれ、単なる応答生成だけでなく、推論の根拠を説明可能にする「コンテキストレイヤー」への需要が高まっている。auto-ontologyはこうしたニーズに応える形で、グラフベースの推論構造を自動構築するツールとして開発された。\n\n詳細\n報道では、NVIDIA/auto-ontologyはトレンド初日に2,050スターを獲得し、これはその日のトレンドページにおける新規リポジトリの中で最も高い伸び率であり、その勢いはエンタープライズAIチームが実際に必要としているものについて重要な何かを教えてくれると紹介されている。また、中国語の解説記事でもNVIDIA/auto-ontologyがPython言語で7,415スター（当日+2,679）を記録し首位となった。当日の増加が2,679スターに対し総スター数が7,415しかないことは、新しいプロジェクトが短期間で集中的な注目を集めたことを意味し、ランキングは「増加速度」に敏感であることが説明されている。中国語の日報では「LLM/エージェントワークフローのためのグラフベースの推論レイヤー（コンテキストレイヤー）を構築し、回答をより説明可能にする」ツールとして紹介されている。総スター数に対する増加数の比率の高さは、公開直後から開発者コミュニティの強い関心を集めたことを如実に示している。\n\nポイント・注意点\n- NVIDIAという大手企業による公開であることが、信頼性と注目度を押し上げた要因の一つとみられる。\n- 初動の伸び率が非常に高く、今後の継続的な成長が注目される。\n- グラフベースの推論構造という技術的なアプローチが、説明可能なAIへの関心の高まりを反映している。","2026-11-06","GitHub日報（1elel1/githubdailytrending）","https://github.com/NVIDIA/auto-ontology"],["microsoft/VibeVoice、オープンソース音声AIが56万（5.6万）スター突破","Microsoftが公開した音声AIプロジェクト「microsoft/VibeVoice」が56,118スターに到達。Google/skillsなど「スキルレイヤー」関連リポジトリと共にトレンド入りし、AIエージェント開発の新潮流を示している。大手テック企業によるAI関連技術のオープンソース化が相次いだ日として注目された。短期間での急成長も特徴的である。概要Python製の「microsoft/VibeVoice」が56,118スター、6,318フォーク…","\n概要\nPython製の「microsoft/VibeVoice」が56,118スター、6,318フォークに達し、GitHub Trendingで大きく取り上げられた。同時期にはGoogleが公開した「google/skills」も22,470スターを記録し、AIエージェントの「スキルレイヤー」構築が新たな焦点となっていることが示された。\n\n背景\n2026年後半に入り、AIエージェントの基盤技術（インフラ）に続き、エージェントが実行できる「スキル」そのものをパッケージ化・共有する動きが活発化している。音声合成技術のオープンソース化もその一環として注目された。\n\n詳細\n報道によればmicrosoft/VibeVoice（56,118スター、6,318フォーク、当日223スター）、google/skills（22,470スター、1,894フォーク、当日211スター）、ConardLi/garden-skills（14,254スター）など、5つの新規リポジトリが同日のトレンドを占めた。VibeVoiceは見出しで「音声AIがオープンソース化」と評され、56,118スター、6,318フォーク、Python、当日223スターという規模で紹介されている。google/skillsについてはわずか7か月（2026年3月作成）で22,000スターを突破した理由が注目点として挙げられている。複数の大手企業が同時期に関連分野のリポジトリを公開していることから、音声AIとスキルレイヤーという2つのテーマが並行して業界の関心を集めていることがうかがえる。Microsoftという大手企業が音声合成技術をオープンソース化したこと自体も、業界内での技術公開の潮流を象徴する動きとして受け止められている。\n\nポイント・注意点\n- 大手テック企業（Microsoft、Google）が相次いでAIエージェント関連技術をオープンソース化する動きが加速している。\n- 「スキルレイヤー」という概念が、エージェントのインフラからアプリケーションへの移行の次の焦点として位置づけられている。\n- 音声合成AIのオープンソース化は、プライバシー重視・ローカル実行可能なツールへの需要の高まりとも関連している。","2026-11-06","Coddykit Blog","https://github.com/microsoft/VibeVoice"],["D4Vinci/Scrapling、AIネイティブなWebスクレイピングエンジンが9万スール超え","AIエージェント向けのデータ収集基盤として「D4Vinci/Scrapling」が93,550スターに到達。エージェントが外部データへアクセスするための「データアクセス層」として位置づけられ、急速に支持を広げている。2年間を経て再注目されたプロジェクトとして分析されている。同時期には他のインフラ系リポジトリも相次いで急成長していた。概要Python製のWebスクレイピングツール「D4Vinci/Scrapling」が93,550スターに達し、AIエージェ…","\n概要\nPython製のWebスクレイピングツール「D4Vinci/Scrapling」が93,550スターに達し、AIエージェントのためのデータアクセス層として注目されている。2年間での成長としては異例の規模とされる。\n\n背景\nAIエージェントが実世界のタスクを遂行するには、Web上の最新データへのアクセスが不可欠だが、従来のスクレイピングツールはAIエージェントとの連携を前提に設計されていなかった。Scraplingはこのギャップを埋めるツールとして開発が進められてきた。\n\n詳細\n報道ではD4Vinci/Scrapling: エージェントのデータアクセス層（93,550スター）として紹介され、別の記事ではD4Vinci/Scrapling: AIネイティブなWebスクレイピングの92,367スターという見出しとともに、2026年後半の今、開発者コミュニティがオープンソースに本当に求めているものについて根本的な変化を明らかにする、30日間の分析で取り上げていなかった5つのリポジトリが、今日のGitHub Trendingで明らかになったとしている。さらに別の記事では、11月上旬のトレンド分析で合わせてkarpathy/nanochat（60,093スター）やJustVugg/colibri（46,827スター）なども同時にランクインしており、AIエージェント向けのインフラ系リポジトリが相次いで急成長していることが示されている。複数の分析記事で言及の頻度が高いことから、専門家の間でも注目度の高いプロジェクトとして認識されていることがわかる。公開から2年を経てのこの再注目は、AIエージェントブームが既存ツールの価値を再評価させる契機になっていることを示している。\n\nポイント・注意点\n- スクレイピング技術は対象サイトの利用規約や法令に抵触する可能性があるため、利用時には注意が必要。\n- 「AIエージェントのためのインフラ」という文脈で紹介されており、純粋なスクレイピングツールとしてだけでなく、エージェント開発基盤としての位置づけが強調されている。\n- 2年間かけて育ってきたプロジェクトが、AIエージェントブームに乗って急激に再注目されている点が特徴的。","2026-11-03","Coddykit Blog","https://github.com/D4Vinci/Scrapling"],["p-e-w/heretic、学習不要のモデル改変ツールが3.8万スールで物議","モデルの挙動を再学習コストなしで制御できる「p-e-w/heretic」が38,353スターに到達。AIモデルの「ジェイルブレイク」的な側面を持つことから、開発者コミュニティで議論を呼んでいる。14か月かけて獲得した規模は、コスト抑制ニーズの強さを物語っている。安全性と利便性のバランスを巡る議論が続く見通しだ。概要「p-e-w/heretic」が38,353スター、4,341フォークに達した。","\n概要\n「p-e-w/heretic」が38,353スター、4,341フォークに達した。開発者がAIモデルの挙動を、追加学習のコストをかけずに制御できるようにするツールとして、2026年11月のトレンドで最も物議を醸したリポジトリの一つとなった。\n\n背景\nAIモデルの安全対策（ガードレール）が強化される一方で、開発者からはモデルの挙動に対するより柔軟な制御を求める声も根強くある。hereticはこうした相反するニーズの間で、技術的・倫理的な議論を引き起こしている。\n\n詳細\n報道によれば、hereticは今日取り上げる5つのリポジトリの中で最も物議を醸しており、38,353スターと4,341フォークを獲得した理由は、AIデプロイが始まって以来悩まされてきた問題、すなわち開発者がコストをかけずにモデルの挙動を制御したいというニーズに応えているからだという。別の記事ではp-e-w/heretic: 37,851スールの学習不要モデル改変として、14か月で37,851スターを獲得した理由が解説されている。14か月という比較的長い期間をかけて着実にスターを積み重ねてきた経緯は、一時的な話題性ではなく、継続的な実利用ニーズに支えられていることを示唆している。モデルの挙動を柔軟に調整したいという開発者の根強い要求が、議論を呼びながらも継続的な支持につながっているとみられる。\n\nポイント・注意点\n- モデルの安全機構を回避する目的での利用が懸念されており、倫理的な観点からの議論が続いている。\n- 「学習不要（Training-Free）」というアプローチが技術的に注目される一方、悪用リスクとのバランスが課題となっている。\n- AIガバナンスを巡る今後の議論において、繰り返し言及される可能性のあるプロジェクトである。","2026-11-03","Coddykit Blog","https://github.com/p-e-w/heretic"],["AWSエミュレータ「floci」、起動24ミリ秒の軽量設計で2.8万星規模に成長","無料でオープンソースのAWSエミュレータ「floci-io/floci」が、起動時間わずか24ミリ秒・待機時メモリ13MiBという軽量性を武器に急成長し、認証トークン不要・アカウント不要という手軽さから2.8万星規模に到達した。LocalStackの代替として開発され、CI/CDパイプラインへの組み込みにも向いている。概要「floci-io/floci」は、無料かつオープンソースのAWSエミュレータであり、LocalStackの代替として開発されたツール…","\n概要\n「floci-io/floci」は、無料かつオープンソースのAWSエミュレータであり、LocalStackの代替として開発されたツールである。起動時間がわずか24ミリ秒、待機時のメモリ使用量が13MiBという極めて軽量な設計を特徴とし、2026年11月時点で2万8千星・3千1百以上のフォークを獲得している。\n\n背景\nクラウドネイティブな開発が一般化する中、ローカル環境でAWSサービスをエミュレートして開発・テストを行うニーズは根強く存在する。既存の代表的ツールであるLocalStackは便利である一方、認証トークンの取得や有料機能のゲートなど一定の制約があった。flociはこうした制約を取り払うことを目指して開発され、無料・無制限でAWSエミュレーション機能を提供する点が支持を集めた。\n\n詳細\nflociの最大の特徴は圧倒的な軽量性で、起動時間24ミリ秒・待機時メモリ13MiBという数値は、同種のツールと比較しても際立っている。認証トークンの取得やアカウント登録を必要とせず、有料機能のゲートも設けられていない「ドロップイン」で使えるLocalStackの代替として設計されている。この手軽さと軽さが、AIエージェント開発を含む幅広い開発シーンでのインフラ層の選択肢として評価された。軽量なため、CI/CDパイプラインへの組み込みや短命なテスト環境での利用にも向いているとみられ、開発フローの高速化に寄与する点が支持拡大の要因となっている。アカウント登録不要という手軽さは、個人開発者が気軽に試せる点でも評価が高く、導入のハードルの低さが急速な普及につながっている。\n\nポイント・注意点\nこの成長は、開発者が無料かつ高速で信頼性の高いインフラツールを求めていることを示す好例とされている。一方で、AWSの全サービスを完全にカバーしているわけではないとみられ、本番相当の複雑な環境を再現する際には既存の商用ツールとの機能差を見極める必要がある。AIエージェント開発におけるインフラ層の選択肢の多様化が進む中、今後の機能拡充にも注目が集まる。","2026-11-03","GitHub (floci-io/floci)","https://github.com/floci-io/floci"],["Vercel公式「agent-desktop」、OSアクセシビリティツリー活用で1日+2,243星","Vercelが公開した「vercel-labs/agent-desktop」が、ピクセル推測ではなくOSのアクセシビリティツリーを読み取ることでAIエージェントに安定したデスクトップ操作を実現するツールとして急成長。Rust実装で1日2,243星という伸びを記録した。従来のピクセルベース手法が抱える不安定さの課題を解消する狙いがある。概要Vercelが公開したリポジトリ「vercel-labs/agent-desktop」が、AIエージェントによるデスク…","\n概要\nVercelが公開したリポジトリ「vercel-labs/agent-desktop」が、AIエージェントによるデスクトップアプリケーション操作を実現するツールとして注目を集めている。Rustで実装され、Apache 2.0ライセンスのもとで公開されており、公開初期に1日で2,243星という急成長を記録した。\n\n背景\nAIエージェントにコンピュータ操作をさせる「コンピュータユース」の分野では、従来は画面のスクリーンショットを解析してクリック位置を推測する手法が主流であったが、この方式は誤操作や不安定さという課題を抱えていた。agent-desktopはこの課題に対し、OSが提供するアクセシビリティツリーを直接読み取るという、より信頼性の高いアプローチを採用した。\n\n詳細\nリポジトリの特徴は、スクリーンショットからの推測ではなく、実際のOSのアクセシビリティツリーを読み取ることで、操作対象の参照（ref）が安定し、繰り返しの再試行が安全に行えるという点にある。Rustで構築され、信頼性の高いコンピュータユースをAIエージェントに提供することを目的としている。コーディングエージェントだけでなく、デスクトップ全般の操作自動化への応用が期待されている。Vercelというフロントエンド開発分野で高い知名度を持つ企業が手がけたことも、注目度の高さにつながっているとみられる。安定した参照が得られることで、長時間にわたる自動操作タスクでもエラーが蓄積しにくくなる点が技術的な強みとして語られている。\n\nポイント・注意点\n公開直後からの急成長は、開発者コミュニティがこの種の「安定した操作性」を備えたソリューションを待ち望んでいたことを示している。既存のピクセルベースの操作自動化ツールと比較して、対応アプリケーションの幅広さやOS間での挙動の一貫性が今後の実用面での課題になるとみられる。Apache 2.0ライセンスの採用により、商用利用も含めた幅広い活用が見込まれる。","2026-11-03","GitHub (vercel-labs/agent-desktop)","https://github.com/vercel-labs/agent-desktop"],["patchy631/ai-engineering-hub、93プロジェクト収録のAI学習教材が4万スール突破","OCRやRAG、エージェントワークフローなど93以上のプロジェクトを収録した実践的AIチュートリアル集「patchy631/ai-engineering-hub」が40,466スターに到達。教育分野でのAI活用需要の高さを示している。難易度別に整理された構成が初心者から上級者まで幅広く支持されている。MCP統合を扱う教材が多数収録されている点も特徴だ。概要Jupyter Notebookで構成された「patchy631/ai-engineering-hu…","\n概要\nJupyter Notebookで構成された「patchy631/ai-engineering-hub」が、40,466スター（当日1,191スター増）に達した。OCR、RAG、エージェントワークフロー、MCP統合、音声エージェントなど93以上の実践的プロジェクトを収録する、GitHub上で最大級のAIチュートリアル集となっている。\n\n背景\nAI技術の急速な進化に伴い、体系立てて実務レベルのスキルを学べる教材への需要が高まっている。断片的な情報が溢れる中、難易度別に整理されたプロジェクト集としてのai-engineering-hubは、学習者にとって効率的な入口となっている。\n\n詳細\n報道によれば、patchy631/ai-engineering-hub（40,466スター、当日1,191スター）は、OCR、RAG、エージェントワークフロー、MCP統合、音声エージェントにわたる93以上のプロジェクトを持つ、GitHub上で最大の実運用レベルAIチュートリアル集となっており、初心者から上級者まで難易度別に整理されているという。チュートリアル集がプロダクションレベルのフレームワークに匹敵するスター数を獲得していることは、エージェント時代のボトルネックが別の場所にあることを示唆していると分析されている。Jupyter Notebook形式での提供は、コードと解説を一体化して学べる利便性の高さにも寄与しているとみられる。93以上という収録プロジェクト数の多さは、単発の入門教材にとどまらず、幅広いユースケースを横断的に学べる点で他の学習リソースとの差別化要因となっている。\n\nポイント・注意点\n- 教材・学習コンテンツ系のリポジトリが、実働ツールと並んでトレンド上位に入ること自体が、AI教育需要の高まりを示している。\n- MCP（Model Context Protocol）統合を扱うプロジェクトが多数収録されており、最新の統合規格への対応状況を学べる点も強み。\n- 難易度別の整理により、初学者から上級者まで幅広い層にアプローチできる設計となっている。","2026-11-02","Coddykit Blog","https://github.com/patchy631/ai-engineering-hub"]],"gh-new":[["Orca v1.4.257公開、AIコーディングエージェント並列管理が進化","複数のAIコーディングエージェントを並列で指揮するデスクトップ・モバイルアプリ「Orca」が2026年11月12日に新バージョンをリリース。エージェントの状態検知やアカウント管理周りの不具合が多数修正され、並列運用時の安定性向上が図られた。モデル検出やサブエージェント報告周りの修正により、複数エージェントを跨いだ状態管理の精度が高まっている点が今回の特徴である。","\n【概要】\nstablyai/orcaは、Claude CodeやCodexなど複数のAIコーディングエージェントを同時に並列実行し、デスクトップおよびモバイルから進捗確認・操作ができるツールです。2026年11月12日、バージョン1.4.257がリリースされました。\n\n【背景】\nAIコーディングエージェントが複数同時に稼働する開発スタイルが一般化する中、各エージェントのセッション状態やアカウント切り替えを人間が把握しやすくする「オーケストレーション層」のニーズが高まっています。Orcaはそうした並列エージェント管理のためのプラットフォームとして開発が続けられています。\n\n【詳細】\n今回のリリースでは、エージェントやアカウント周りの修正が中心です。具体的には、キューに入った待機状態をまたいでモデル検出を維持する修正や、起動直後のCodexワーカーの準備状態が誤って表示される問題の修正が含まれます。また「Orca-1.4.257-arm64-mac.zip」などのビルド成果物が2026年11月12日付で公開されています。その他、OpenCode 2のフックを正しく認識する修正、サブエージェントの報告時にメインセッションの状態維持を改善する修正、リポジトリごとのエージェントフォルダ信頼プロンプトの削除なども行われました。これらの修正は、複数エージェントを跨いだ状態管理の精度を高めることを主眼としています。並列運用時にありがちな表示のズレや誤検知を減らし、ユーザーが実際のエージェント状況をより正確に把握できるようにすることが狙いです。\n\n【ポイント・注意点】\n本リリースは主に不具合修正が中心で、大きな新機能追加ではありません。複数のAIエージェントを並行稼働させる運用を行っているチームは、アカウント状態の同期やエージェントステータス表示の挙動が変わっている可能性があるため、アップデート後の動作確認が推奨されます。Mac版のビルドが公開されており、他プラットフォーム向けの提供状況は公式リリースページで確認する必要があります。","2026-11-12","GitHub (stablyai/orca Releases)","https://github.com/stablyai/orca"],["Jane StreetがAIエージェント向けスキル集「agent_skills」を公開","金融大手Jane Streetが、AIコーディングアシスタント向けの「スキル」を集めたリポジトリを公開し、GitHubトレンドで新規発見として話題に。現時点ではソクラテス式家庭教師スキルが収録されており、今後の拡充が注目される。Agent Skillsという形式自体が今週の開発トレンドの中心テーマとなる中、企業による参入として受け止められている。金融トレーディング企業として知られるJane Streetが、AIエージェント向けスキル集リポジトリ「jane…","\n【概要】\n金融トレーディング企業として知られるJane Streetが、AIエージェント向けスキル集リポジトリ「janestreet/agent_skills」を公開しました。2026年11月12日時点のGitHubトレンド「新発見」枠で紹介されています。\n\n【背景】\n2026年後半、AnthropicのClaude Codeなどを中心に「Agent Skills」と呼ばれる、AIエージェントに特定タスクの手順を教えるパッケージ形式が急速に普及しています。Anthropic公式のanthropics/skillsや、個人開発者によるmattpocock/skillsなど、同種のリポジトリが同時多発的にGitHubトレンド上位を占める状況が続いており、企業による公開も増えています。\n\n【詳細】\nJane Street公開のAI助理技能集で、現時点では1つのソクラテス式家庭教師スキルが収録されていることが伝えられています。金融業界の企業がAgent Skillsのエコシステムに参入した事例として注目されており、教育・対話支援分野での活用を想定した内容になっているとみられます。同時期にはAgent Skillsが今週の開発トレンドの中で最も強いテーマとなり、トレンド上位12件中3件がskillsリポジトリで占められる状況も報告されています。企業の参入は、Agent Skillsという形式自体の信頼性や実用性を裏付ける動きとも受け止められています。金融という専門性の高い業界からの参入であるだけに、今後は教育用途にとどまらず業務特化型スキルの公開にも発展する可能性が注目されています。\n\n【ポイント・注意点】\nAgent Skillsは特定ベンダーに依存しない「ポータブルな能力単位」として注目されており、企業・個人を問わず参入が相次いでいます。Jane Streetのリポジトリは公開直後であり収録スキル数はまだ少ないため、今後の追加内容や更新頻度を注視する必要があります。スキルの実行には対応するAIエージェント環境（Claude Codeなど）が必要です。","2026-11-12","GitHub Trending（yaochen0506/githubseeker 集計）","https://github.com/yaochen0506/githubseeker"],["長コンテキスト向けトークン圧縮ツール「headroom」が7.9万スター突破","ツール出力やログ、RAGチャンクをLLMに渡す前に圧縮するPythonライブラリ「headroom」が約7.9万スターに到達し、GitHubトレンドで引き続き注目されている。コーディングエージェント向けで約20%、JSON処理では60〜95%のトークン削減を実現するとしている。トークン効率化分野の代表格と評され、同種ツールとの競争も活発化している。headroomlabs-ai社が開発する「headroom」は、LLMにデータを渡す前にツール出力・ログ・…","\n【概要】\nheadroomlabs-ai社が開発する「headroom」は、LLMにデータを渡す前にツール出力・ログ・ファイル・RAGチャンクを圧縮するライブラリ・プロキシ・MCPサーバーで、2026年11月12日時点で約7.9万スターに達し、トレンド上位の常連となっている。\n\n【背景】\nAIエージェントの利用拡大に伴い、コンテキストウィンドウのコストが開発者にとって大きな負担となっている。長時間稼働するエージェントほどログやツール出力が肥大化しやすく、トークン課金の増大が問題視されてきた。こうした中、トークン効率化のための専用インフラ層が急速に発展している。\n\n【詳細】\nheadroomは「Compresses tool outputs, logs, files, and RAG chunks before they hit the LLM (20% fewer tokens for coding agents, 60–95% for JSON). A library, proxy, and MCP server — directly targeting today's biggest agent cost driver.」という特徴を持つ。スター数は「headroomlabs-ai/headroom | Python | 79,394 | Reduces tokens by 60–95% for JSON and 20% for code—critical for reducing LLM costs.」という水準に達しており、同種のコンテキスト最適化ツールの中でも先行する存在として位置付けられている。業界分析では「headroomlabs-ai/headroom (76K stars) has won the token efficiency layer」と評され、トークン効率化分野における代表格と目されている。\n\n【ポイント・注意点】\nコーディングエージェントだけでなくJSON処理全般にも対応する汎用性の高さが特徴だが、圧縮処理によって情報の欠落や文脈の誤解が生じないか、導入前の検証が推奨される。同種の競合としてJuliusBrussee/cavemanなどのトークン削減ツールも登場しており、「token-efficiency plays are proliferating: JuliusBrussee/caveman and headroomlabs-ai/headroom both attack context bloat, cutting agent token usage by 20–95%.」という状況で、今後この分野の競争がさらに激化する可能性がある。","2026-11-12","GitHub (headroomlabs-ai/headroom)","https://github.com/headroomlabs-ai/headroom"],["エージェント管理アプリ「paperclip」が11万スター超、組織導入が加速","チーム向けのAIエージェント管理アプリ「paperclip」がGitHubトレンドで引き続き存在感を示し、スター数は11万を突破した。組織がAIワークフローの調整を進める中、エージェント管理という新たな製品カテゴリーの代表格として急成長を続けている。インフラ層からアプリケーション層へのトレンド転換を象徴する存在としても評価されている。TypeScriptで開発された「paperclip」は、組織内でのAIエージェント運用管理を目的としたオープンソースアプ…","\n【概要】\nTypeScriptで開発された「paperclip」は、組織内でのAIエージェント運用管理を目的としたオープンソースアプリケーションで、2026年11月12日時点でスター数が11万を超え、GitHubトレンドで継続的に取り上げられている。\n\n【背景】\n企業や開発チームにおいて複数のAIコーディングエージェントを並行運用するケースが増える中、個々のエージェントのタスク進捗や成果物を一元管理するニーズが高まっている。従来はインフラ層（メモリエンジンやオーケストレーション基盤）への関心が中心だったが、実用アプリケーション層への注目が強まっている。\n\n【詳細】\npaperclipは「\"The open-source app everyone uses to manage agents at work.\" A sign that agent management (not just creation) is becoming its own product category.」と評されている。スター数の推移については「paperclipai/paperclip | TypeScript | 113,213 | Team-focused agent management app—growing fast as organizations adopt AI workflow coordination.」と報告されている。業界分析では「paperclipai/paperclip (110K stars) has won the orchestration layer」とも評され、「The fact that a TypeScript app built in March 2026 has crossed 110K stars by November 2026 represents the fastest-growing category in the agent ecosystem: applications that solve real business problems.」という成長スピードの速さが際立っている。わずか半年あまりでここまでの支持を集めた点は、エージェント管理という課題がいかに切実であるかを物語っている。\n\n【ポイント・注意点】\n「インフラから実用アプリへ」というトレンド転換を象徴する存在として位置付けられており、同種の管理ツールの競争が今後激化する可能性がある。短期間での急成長であるため、長期的な実運用での安定性や企業導入時のセキュリティ要件への対応状況は継続的な確認が必要とされる。","2026-11-12","GitHub (paperclipai/paperclip)","https://github.com/paperclipai/paperclip"],["AIコード監査スキル「shadcn/improve」、コスト最適化の定番として浸透","shadcnが開発したAIエージェント向けスキル「improve」は、高性能モデルでコードベースを監査し、安価なモデルに実装を任せる仕組みを提供する。2026年6月の公開以降、コスト最適化の実践例として開発者コミュニティで定着しつつある。コードは変更せず計画書のみを出力し、マージ判断は常に人間に委ねられる設計も特徴だ。「improve」はshadcn（shadcn/uiの作者）が開発したAgent Skill形式のツールで、最も高性能なAIモデルでコード…","\n【概要】\n「improve」はshadcn（shadcn/uiの作者）が開発したAgent Skill形式のツールで、最も高性能なAIモデルでコードベースを監査・計画立案し、その実装作業を安価なモデルに委ねるという役割分担を実現する。GitHubトレンドでもコスト最適化志向のツールとして継続的に言及されている。\n\n【背景】\nClaude CodeやCodex、Cursorなどのコーディングエージェントを本格運用する開発者にとって、コードベースを理解できるほど高性能なモデルは、機械的な修正作業をこなすには費用対効果が悪いという課題があった。安価なモデルは設計意図を読み違えやすく、適切な役割分担の仕組みが求められていた。\n\n【詳細】\nimproveの設計思想は「Introducing /improve: use your most capable model to audit your codebase and write plans for cheaper models to execute later.」というものである。具体的な運用では「/improve security # focused audit (also: perf, tests, bugs, …) /improve branch # audit only what the current branch changes /improve plan <description> # skip the audit, spec one thing /improve execute <plan> # dispatch a cheaper executor, review its work」といったコマンド群が提供されている。安全性については「Does improve modify my code? No. The execute command runs a cheaper model in a disposable git worktree, and merging is always your decision.」という設計がなされている。\n\n【ポイント・注意点】\n監査フェーズは高コストモデルを使うため、一回の監査で複数の実装タスクをまかなう運用が推奨されている。GitHub Actionsと連携したPRレビューパイプラインへの組み込みも提案されており、「Automated PR review pipeline. Wire /improve branch into a GitHub Actions workflow on every PR.」という活用例がある。コード自体は変更せず計画書のみを出力する設計のため、最終的なマージ判断は常に人間に委ねられる点が特徴である。","2026-11-12","GitHub (shadcn/improve)","https://github.com/shadcn/improve"],["ブラウザ操作エージェント「browser-use」が12万スター突破、継続成長","AIによるWebブラウザ自動操作ライブラリ「browser-use」がPython製ツールとしてスター数12万を超え、クラウド型の隠蔽ブラウザやAPIホスティングサービスとも連携しながら複雑なWeb操作の自動化を実現するツールとして人気を集めている。大規模リポジトリながら日々数百単位でスターを積み増し、安定した人気を保っている。「browser-use」は、AIエージェントがWebブラウザを自動操作するためのPythonライブラリで、2026年11月12…","\n【概要】\n「browser-use」は、AIエージェントがWebブラウザを自動操作するためのPythonライブラリで、2026年11月12日時点でスター数が12万を超え、GitHubトレンドで継続的に取り上げられている。\n\n【背景】\nAIエージェントによる業務自動化が進む中、Webブラウザの操作を自然言語で指示し、複雑なフォーム入力や情報収集を自動化するニーズが高まっている。単純なスクレイピングにとどまらず、実際の人間のようなブラウザ操作を模倣する技術への関心が強まっている。長時間稼働するエージェントがWeb上で情報収集やタスク処理を行う場面も増え、信頼性の高い自動操作基盤への需要が一段と高まっている状況がある。\n\n【詳細】\nbrowser-useは「browser-use/browser-use [Python] ⭐ 120,743（今日 +172） 一句话说明：热门的 AI 网页操作智能体 Python 库，配合云端隐匿浏览器与 API 托管服务，实现自动化的复杂 Web 交互。」と紹介されている。既に大規模なスター数を誇るリポジトリでありながら、現在も日々数百単位でスターを積み増しており、安定した人気を維持している点が特徴である。クラウド連携やAPIホスティングを含めたエコシステム全体の充実が、継続的な採用拡大を後押ししているとみられる。\n\n【ポイント・注意点】\nクラウド型の隠蔽ブラウザサービスとの連携やAPIホスティングオプションが提供されており、個人利用から企業レベルの自動化運用まで幅広く対応できる柔軟性が強みとされる。同種のブラウザ自動操作ツールとしてはVercel Labsのagent-browserなども存在しており、この分野全体での競争が激化している状況がうかがえる。自動操作ツールの性質上、対象サイトの利用規約順守や過度な自動化による負荷への配慮も運用上の注意点として挙げられる。","2026-11-12","GitHub (browser-use/browser-use)","https://github.com/browser-use/browser-use"],["AIエージェント記憶基盤「mem0」が引き続き本番採用の定番に","AIエージェント向けのドロップイン型メモリ基盤「mem0」がスター数6.8万規模に達し、本番運用を前提とした永続メモリインフラの代表格としてGitHubトレンドで継続的に言及されている。RAG・ナレッジ分野の中核的存在と評され、同種プロジェクトとの比較でもその成熟度が注目されている。「mem0」は、AIエージェントおよびアプリケーション向けに組み込み可能なメモリレイヤーを提供するPython製のオープンソースプロジェクトで、2026年11月12日時点でス…","\n【概要】\n「mem0」は、AIエージェントおよびアプリケーション向けに組み込み可能なメモリレイヤーを提供するPython製のオープンソースプロジェクトで、2026年11月12日時点でスター数が約6.8万に達し、トレンド分析で継続的に取り上げられている。\n\n【背景】\n長時間稼働するAIエージェントにとって、セッションをまたいだ記憶の永続化は実用上の重要な課題となっている。単発のタスク処理にとどまらず、ユーザーとの対話履歴や過去の意思決定を踏まえた継続的な振る舞いを実現するためのメモリ基盤への需要が高まっている。こうした課題を背景に、本番運用を前提としたメモリ機能の重要性が急速に高まっている。\n\n【詳細】\nmem0は「mem0ai/mem0 | Python | 68,825 | Drop-in memory infrastructure for AI agents and apps. Production-oriented memory is becoming table stakes.」と評されている。他のトレンド分析でも「RAG / Knowledge - mem0ai/mem0 – Drop-in memory layer for AI agents and apps」として、RAG・ナレッジ分野の中核的存在として位置付けられている。永続メモリをめぐっては同種のプロジェクトとしてclaude-memやOpenViking等も並んで取り上げられており、この分野全体が急速に発展している状況がうかがえる。これらの競合プロジェクトとの比較の中でも、mem0は組み込みの容易さと実績の蓄積によって先行的な地位を維持している。\n\n【ポイント・注意点】\n「本番志向のメモリ機能はもはや当たり前の要件になりつつある」という評価が示す通り、単なる実験的機能ではなく実運用を前提とした設計の成熟度が重視されている。導入にあたっては、記憶されるデータの範囲やプライバシー保護の設定を適切に管理する必要がある。同分野の競合が多いため、既存システムとの統合のしやすさも選定基準の一つとなる。","2026-11-12","GitHub (mem0ai/mem0)","https://github.com/mem0ai/mem0"],["ベクトルレスRAG「PageIndex」、推論ベース検索への転換で注目","ベクトルデータベースを使わず推論ベースで文書検索を行う「PageIndex」が、従来のベクトルDB中心のRAG設計に対する代替アプローチとしてGitHubトレンドの分析記事で取り上げられ、スター数4万超に到達している。グラフベース検索と並び、埋め込みのみに頼らないRAGの潮流を形成している。「PageIndex」は、ベクトル埋め込みを用いずに推論に基づいた文書検索を実現する「vectorless RAG」のためのインデックスツールで、2026年11月12…","\n【概要】\n「PageIndex」は、ベクトル埋め込みを用いずに推論に基づいた文書検索を実現する「vectorless RAG」のためのインデックスツールで、2026年11月12日時点でスター数が4万を超え、RAG分野における新たなアプローチとして注目を集めている。\n\n【背景】\n従来のRAG（検索拡張生成）はベクトル埋め込みによる類似度検索を基盤とすることが主流だったが、文脈の取りこぼしや意味的なズレが課題として指摘されてきた。こうした中、構造化された推論に基づく検索手法への関心が高まっている。ベクトル検索に頼らない設計思想は、特にコードベースや長大な文書集合を扱う場面での精度向上を狙いとしている。\n\n【詳細】\nPageIndexは「VectifyAI/PageIndex | Python | 40,372 | A document index for \"vectorless, reasoning-based RAG.\" Represents experimentation beyond the vector-DB orthodoxy.」と紹介されている。コミュニティの注目度についても「Graphify-Labs/graphify & VectifyAI/PageIndex — Graph-based and vectorless retrieval are credible alternatives to embedding-only RAG; worth benchmarking on codebase and document QA.」という評価がなされ、グラフベースの検索手法と並んで埋め込みのみに頼らないRAGの代替案として信頼性が認められつつある。\n\n【ポイント・注意点】\nベクトルDBを使わない設計のため、既存のベクトル検索基盤からの移行コストや、大規模文書集合における検索速度の検証が導入前の重要なポイントとなる。グラフベースのGraphifyなど類似コンセプトのツールも並行して台頭しており、「埋め込みのみに頼らないRAG」という潮流が今後のドキュメント検索・コードベース検索の設計に影響を与える可能性がある。","2026-11-12","GitHub (VectifyAI/PageIndex)","https://github.com/VectifyAI/PageIndex"],["ByteDance「OpenViking」、記憶・知識・スキルを統合する自己進化型コンテキストDB","ByteDance（字節跳動）が公開した「OpenViking」は、AIエージェント向けにメモリ・RAG・スキルを統合する自己進化型コンテキストデータベースとして、GitHubトレンド分析で新たなコンテキストインフラの方向性を示す事例として紹介されている。スター数は4万を超え、統合型基盤の試金石として注目されている。「OpenViking」はByteDanceが開発したコンテキストデータベースで、AIエージェントが必要とするメモリ・検索拡張生成（RAG）…","\n【概要】\n「OpenViking」はByteDanceが開発したコンテキストデータベースで、AIエージェントが必要とするメモリ・検索拡張生成（RAG）・スキルといった要素を一つの基盤に統合する「自己進化型」のアーキテクチャを特徴とし、スター数は4万を超えている。\n\n【背景】\nAIエージェントの機能が高度化するにつれ、メモリ機構、RAG用の知識ベース、エージェントが実行できるスキル集といった要素がそれぞれ別々のツールとして分断的に管理されるケースが多く、統合的なコンテキスト基盤への需要が高まっていた。分断された管理体制は運用コストの増大や整合性の確保の難しさにもつながっており、一元化の動きが求められていた。\n\n【詳細】\nOpenVikingは「volcengine/OpenViking | ⭐42.0k | 字节跳动自进化上下文数据库，统一记忆/知识/技能」と紹介されており、トレンド分析では「OpenViking proposes a \"self-evolving context database\" unifying memory, RAG, and skills.」という評価がなされている。グラフベースやベクトルレスの検索手法とともに、コンテキストインフラ全体を統合するアプローチとして位置付けられている。大手テック企業であるByteDanceによる参入は、統合型コンテキスト基盤というコンセプトの実用性を裏付ける事例としても受け止められている。\n\n【ポイント・注意点】\n「自己進化」というコンセプトが示す通り、運用を重ねる中でデータベース自体が最適化されていく設計になっていると見られるが、長期運用時の挙動の予測可能性や、統合基盤としての複雑性の管理には注意が必要とされる。記憶・知識・スキルを一元化するアプローチは今後の業界標準を占う試金石として注目されており、同種の統合型コンテキスト基盤の登場が続く可能性がある。","2026-11-12","GitHub (volcengine/OpenViking)","https://github.com/volcengine/OpenViking"],["トークン65%削減の「caveman」、原始人風簡易言語で入力コスト削減","LLMへの入力トークンを「原始人の言葉」のように簡略化することで約65%削減するツール「caveman」が、精度をほとんど落とさずにコストを抑える手法としてGitHubトレンド分析で紹介され、10万スール超の規模に達している。トークン効率化の文脈で同種ツールと並んで頻繁に言及されている。「caveman」は、LLMに渡す入力テキストを簡略化された表現に変換することで、トークン使用量を大幅に削減するGo製ツールである。","\n【概要】\n「caveman」は、LLMに渡す入力テキストを簡略化された表現に変換することで、トークン使用量を大幅に削減するGo製ツールである。2026年11月12日時点でスター数が10万を超える規模に達し、コスト最適化分野の代表例として取り上げられている。\n\n【背景】\n大規模言語モデルの利用コストは入力・出力トークン数に比例するため、プロンプトの冗長さを削ぎ落としてコストを抑える手法への関心が高まっている。従来の要約や圧縮技術に加え、よりラディカルな入力簡略化のアプローチが模索されている。コストの増大はAIエージェントの本番運用における最大の障壁の一つとされており、各社が独自の削減手法を競っている状況がある。\n\n【詳細】\ncavemanは「JuliusBrussee/caveman – 大模型效率的重大突破——在几乎不影响准确率的情况下减少 65% 的令牌用量。」と評されている。具体的な規模については「JuliusBrussee/caveman | Go | 119,158 | 通过简化\"原始人语言\"将大模型输入令牌减少 65%——成本优化领域突破性创新。」と紹介されている。他の分析でも「JuliusBrussee/caveman and headroomlabs-ai/headroom both attack context bloat, cutting agent token usage by 20–95%.」という形で、トークン効率化の文脈で頻繁に言及されている。こうした言及の多さは、同分野におけるcavemanの先駆的な位置づけを裏付けるものといえる。\n\n【ポイント・注意点】\n「原始人の言葉」という表現が示すように、通常の自然言語よりも大幅に簡略化された形式に変換してからモデルに渡す設計だが、こうした簡略化によって細やかなニュアンスや文脈情報が失われるリスクについては、用途ごとの検証が重要とされる。精度への影響を抑えつつコストを削減する手法として、同種のトークン圧縮ツールと組み合わせた活用も想定される。","2026-11-12","GitHub (JuliusBrussee/caveman)","https://github.com/JuliusBrussee/caveman"],["Claude専用隔離仮想マシン「Claude Cage」が急伸、ネットワーク漏洩を遮断","Claudeユーザー向けの軽量仮想マシン「Claude Cage」がGitHubで急浮上。macOS・Windows・Linuxの仮想環境内でClaude Codeや公式デスクトップアプリを動かし、ネットワークやフィンガープリントをホストから完全分離する設計が支持を集めている。多アカウント管理やリモート展開にも対応し、アカウント凍結対策として注目されている。","\n【概要】\nGitHub上で「Lee-xeo/Claude-Cage」と呼ばれるリポジトリが急速にスターを伸ばし、トレンド入りした。これはAnthropicのClaudeを使う開発者向けに設計された、軽量な仮想マシン環境を提供するデスクトップアプリケーションである。中国語圏のコミュニティを中心に拡散し、短期間で数千スターを獲得した。\n\n【背景】\nClaudeの利用者の間では、VPNやフィンガープリントブラウザ、環境検知といった対策を自前で行う必要があり、アカウント凍結のリスクと資産的損失への不安が根強くあった。開発者はこうした「Anthropicへの不満」を背景に、箱から出してすぐ使えるデスクトッププログラムとしてClaude Cageを開発したと説明している。隔離された環境でネットワークプロキシやタイムゾーン、環境チェックを一元管理できる点が特徴だ。\n\n【詳細】\nClaude Cageは、Macではmacos仮想マシン、Windowsではwindows仮想マシン、あるいは軽量なLinux環境を選んで、使い慣れたシステムの中でClaudeと作業できるようにする。ターミナル、ブラウザ、エディタ、公式のClaude Desktopが一つのワークベンチに集約され、プロジェクトは必要に応じて共有し、ネットワークは独立して管理される。さらに自分のサーバーに接続したり、スマートフォンでパソコン上のタスクを引き継いだりすることもできる。\n\n利用に際しては、サイドバーで「SSHホスト」を選び、プラスボタンでアドレスやSSHユーザー、鍵を保存し「このホストに接続」を押す操作フローが用意されている。対応プラットフォームは幅広く、Apple SiliconのMacはmacOS 14以降、Windows 10 22H2/11 x64でDebianを使う場合はWindows Hypervisor Platformが必要で、Windows 11ゲストには対応バージョンの完全なHyper-Vが必要、Debian 12やUbuntu 22.04/24.04のx86_64ホストにはKVMが必要とされる一方、Intel Mac、Windows ARM64、Linux ARM64は現時点で非対応となっている。\n\nリリースノートでは、macOS、Windows 11、Linuxゲストの作成やコンポーネント配備、ワークベンチ接続に対応し、サポート対象のホストシステムに応じて該当イメージを選択できることが明記されている。\n\n【ポイント・注意点】\n開発開始からわずか1週間程度で数千スターを集める急成長ぶりが特徴で、作成は2026年10月31日、直近24時間で1000スター以上増加しているとされる。一方で、アカウント運用やネットワーク回避を目的とした利用には規約上のリスクも伴うため、導入にあたっては各サービスの利用規約を十分確認する必要がある。","2026-11-12","GitHub (Lee-xeo/Claude-Cage)","https://github.com/Lee-xeo/Claude-Cage"],["GPU駆動の新IDE「Rune」が登場、AIエージェントと人間の共同開発を統合","GoogleChromeならぬ個人開発チームによる新IDE「Rune」がGitHubトレンドに初登場。GPUアクセラレーションを備えたターミナルマルチプレクサ兼IDEで、手動プログラミングと自動（AIエージェント）プログラミングの両方に対応する設計が注目を集めている。Electronを使わない軽量設計も特徴。「unstablebuild/rune」という新しいIDEプロジェクトがGitHubトレンドに初めて登場した。","\n【概要】\n「unstablebuild/rune」という新しいIDEプロジェクトがGitHubトレンドに初めて登場した。GPUアクセラレーションを用いた高速な描画と、ターミナルマルチプレクサとしての機能を一体化させた開発環境で、AIコーディングエージェントによる自動プログラミングと、従来の手動プログラミングの双方を同じ画面上でシームレスに扱える点が特徴だ。\n\n【背景】\n近年、AIエージェントによるコーディングが急速に普及する中で、従来のエディタとターミナル、AIエージェント用インターフェースがそれぞれ別々のツールとして分断されている状況が課題視されてきた。Runeの開発チームは、エディタとペインレイアウトを一つのプログラムとして扱い、AIエージェントがシェルの隣ではなく、そのプログラム自体を直接操作できるようにすることを狙いとしている。\n\n【詳細】\n公式の説明によれば、RuneはGPUアクセラレーションを備えた高速かつフル機能のIDE兼ターミナルマルチプレクサであり、自動プログラミングと手動プログラミングの両方に適している。また、Electronを使用していない点も軽量性を重視する開発者から評価されている。\n\nUIについてはスクリーンマルチプレクサとして自由にレイアウトを組み替えられる設計になっており、組み込みのエージェントやIDE水準のスキルを備えているという。拡張性にも配慮されており、公式パッケージでRuneの機能を拡張できるほか、Gitリポジトリから直接コミュニティ製パッケージをインストールできる仕組みが用意されている。\n\nインストール方法も複数提供されており、Homebrewでのインストールのほか、Arch LinuxおよびOmarchyではAURにrune-ideとして登録されている。開発元については、GitHub上のメタデータでunstablebuild/runeとして公開されていることが確認できる。\n\nヘッドレスモードにも対応しており、開発ネットワークを介して複数の開発マシンにワークスペースを提供できる仕組みも備える。ライセンス面ではGNU General Public License バージョン3、または利用者の選択によりそれ以降のバージョンの下で提供されている。\n\n【ポイント・注意点】\n主要言語はGoで実装されており、GitHubの言語統計によれば主にGoで書かれていることが分かる。対象ユーザーはエディタとペインレイアウトを同一プログラムとして扱い、エージェントにシェルの隣ではなくそのプログラム自体を操作させたいと考える技術者という、狭く明確な層とされる。現時点ではWindows環境のチームにとっては候補にならないとされており、対応プラットフォームの制限には注意が必要だ。初登場ながら急速に注目を集めており、今後のアップデートや対応環境の拡大が注視される。","2026-11-12","GitHub (unstablebuild/rune)","https://github.com/unstablebuild/rune"],["Meta、エージェント対応デザインシステム「astryx」で首位獲得","Metaが公開したオープンソースのデザインシステム「astryx」が、AIエージェントとの親和性を前面に打ち出し、GitHubトレンドで1日のスター増加数トップを記録するなど急速に注目を集めている。大手企業の参入として業界の関心を呼んでおり、エージェント向けUI層への関心の高まりを象徴する動きとされる。meta/astryxは、完全にカスタマイズ可能でAIエージェントに対応したオープンソースデザインシステムです。","\n【概要】\nmeta/astryxは、完全にカスタマイズ可能でAIエージェントに対応したオープンソースデザインシステムです。2026年11月11日時点のGitHub日報では、1日のスター増加数で首位に立ったことが報じられました。\n\n【背景】\nAIコーディングエージェントによるUI生成が一般化する中、エージェントが扱いやすい形で設計されたデザインシステムへの需要が高まっています。従来のデザインシステムは人間のデザイナー・エンジニア向けに最適化されていましたが、astryxはAIエージェントとの連携を前提に設計されている点が特徴です。こうした設計思想は、AIが生成するUIコンポーネントの一貫性や品質を担保する狙いがあるとみられます。\n\n【詳細】\n完全にカスタマイズ可能でエージェント対応のオープンソースデザインシステムとして、総スター数14,728、1日で96の新規スター増加を記録していましたが、その後も勢いは続き、11月11日には総スター数23,021、1日で3,108の新規スター増加を記録し首位に立ったと報告されています。中国語の分析記事でも、Metaが「エージェント対応」のデザインシステムであるmeta/astryxで異例の参入を果たし、大手プラットフォームがエージェント向けUI層に関心を寄せていることを示唆していると分析されています。短期間でのスター数の急増は、開発者コミュニティがこの新しいコンセプトに強い関心を示している証左といえます。\n\n【ポイント・注意点】\n大手テック企業であるMetaの参入は、AIエージェント向けUI/デザインシステムという新興ジャンルの正当性を高める動きといえます。一方で公開から日が浅く
