確認してから使うとよい。まずは試してから乗り換えるのが安心だ。","2026-11-15","GitHub","https://github.com/anefzaoui/misterdownloadmanager"],["DeepSeek APIの静的チャットデモ","DeepSeek APIを使う静的チャットデモ「chat-demo」が、DeepSeek公式から公開された。バックエンドが不要で、ブラウザから直接APIに接続する。リリース物のindex.htmlを開くだけで利用でき、ストリーミング返信や深い思考、音声入出力、Markdownや数式、Mermaidの表示に対応している。APIの使い方を示すデモは、開発者が試す際の手がかりになり、手軽さが求められていた。","\n【概要】DeepSeek APIを使う静的チャットデモ「chat-demo」が、DeepSeek公式から公開された。バックエンドが不要で、ブラウザから直接APIに接続する。リリース物のindex.htmlを開くだけで利用でき、ストリーミング返信や深い思考、音声入出力、Markdownや数式、Mermaidの表示に対応している。2026年11月12日に作られ、スター数は4462で、ライセンスはMITだ。サーバーを用意せず、静的なファイルだけで動くため、配布や試用が手軽だ。【背景】APIの使い方を示すデモは、開発者が試す際の手がかりになる。このデモはサーバーを用意せず、静的なファイルだけで動くため、配布や試用が手軽だ。DeepSeekのAPIキーを入れるだけで、チャットや検索、音声の機能をブラウザから試せる。スマート検索やリンクの読み取り、音声入出力に対応し、試せる機能が幅広い。【詳細】スマート検索やリンクの読み取り、音声入力と読み上げに対応し、返信はMarkdownや数式、Mermaidで表示できる。APIキーと会話の履歴は、ブラウザのlocalStorageとIndexedDBに保存される。サーバー側にデータが残らない設計だ。APIキーと会話の履歴はブラウザ内に保存され、サーバー側にデータが残らない設計だ。【ポイント・注意点】APIキーはブラウザ内に保存されるため、共用端末での利用には注意が必要だ。APIの利用には料金がかかる場合がある。静的なデモのため、高度な機能や本格的な運用には向かない。あくまでAPIの使い方を試すための見本として使うのがよい。静的なデモのため高度な機能や本格的な運用には向かず、見本として使うのがよい。共用端末ではAPIキーの扱いに注意し、利用後は保存した情報を消しておくと安心だ。料金がかかる場合もあるため、試す前に利用条件を確認しておきたい。まずは見本として気軽に触ってみるのがよいだろう。今後、対応する機能が増えれば、さらに試しやすくなるかもしれない。","2026-11-12","GitHub","https://github.com/deepseek-ai/chat-demo"]],"gh-blog":[["SHA固定だけでは防げない、GitHub Actionsのなりすまし","GitHub Actionsの防御策として広まったSHA固定だが、フォークのコミットをなりすまして悪用する手口が確認された。2026年3月のTrivy乗っ取りや5月のactions-cool/issues-helperの事例が示すように、固定は「コードが変わらない」ことしか保証しない。GitHubのワークフロー・ロックファイルも万能ではなく、作成者の確認までは担わない。開発者が今見直すべきポイントを解説する。","\n【概要】GitHub Actionsで使うアクションをSHAで固定する手法は、サプライチェーン攻撃への定番の防御とされてきた。しかし攻撃者はフォーク経由で公式ツールを装うコミットを作り、この防御をすり抜けている。The Hacker Newsの記事は、固定が保証するのは「コードが変わらないこと」だけで、「誰が書いたか」までは保証しないと指摘する。【背景】きっかけは2026年3月、広く使われるセキュリティスキャナーTrivyの乗っ取りだ。攻撃者はGitHub公式のチェックアウトツールを装い、セキュリティ修正を名乗る悪意あるコードを仕込んだ。5月にはactions-cool/issues-helperでも同じ手口で認証情報が盗まれた。2025年3月のtj-actions/changed-filesの侵害では2万3000超のリポジトリが影響を受け、SHA固定をしていたチームだけが無事だった。こうした経緯から固定は広まったが、万能ではない。【詳細】SHA固定の死角は三つある。第一に作成者の確認ができないこと。フォークのコミットでも40文字のSHAさえ合えば固定できてしまう。第二に所属の確認がないこと。組織レベルの強制はSHA形式かどうかだけを見て、上流プロジェクトに属するコミットかは見ない。第三に実行時の問題で、Docker型のアクションは実行時にイメージを組み立て、固定されていない依存関係を取り込むことがある。GitHubは2026年3月のロードマップで決定論的な依存関係ロックを掲げ、ワークフロー・ロックファイルは10月14日にプレビュー、10月28日に一般提供となった。ロックは記録されたコミットに実行を結び付け、フォークだけのなりすましを弱める。ただしGitHub自身、ロックは「依存関係そのものが安全かどうかを判断しない」と明記している。【ポイント・注意点】まず自組織のワークフローで使っているアクションを棚卸しし、SHA固定だけでなく出所も確認すること。組織ポリシーでの固定強制に加え、ロックファイルの導入を検討したい。Docker型アクションは実行時の依存関係にも注意が必要だ。Chainguardのエリカ・ハイディ氏が登壇するウェビナーでは、固定の限界と対策が解説される。固定をゴールとせず、作成者の検証や信頼できるアクションの目録と組み合わせることが大切だ。","2026-11-17","The Hacker News","https://thehackernews.com/2026/11/hackers-found-way-around-github-sha.html"],["GitHubを指令経路に使う新種バックドア「GitDoor」登場","アジアとアフリカの政府機関を狙うサイバー攻撃で、GitHubとSharePointを指令サーバー代わりに使う新種バックドア「GitDoor」と「GraphDoor」が見つかった。カスペルスキーが「Operation ShadowCloud」と名付けた活動で、クラウドサービスの通信に紛れ込ませて検出を逃れる。GitHubのリポジトリが攻撃の道具に使われた点が、開発者にも無関係ではない。","\n【概要】カスペルスキーは、アジアとアフリカの政府機関を狙う攻撃活動「Operation ShadowCloud」を報告した。攻撃者は正規のリモート管理ツール「MeshAgent」を悪用し、GitHubを指令経路に使う「GitDoor」と、SharePointを使う「GraphDoor」という二つの新種バックドアを送り込む。クラウドサービスの正規の通信に紛れ込ませることで、ネットワーク型の検出を逃れる仕組みだ。【背景】この活動は2026年初頭に確認された。攻撃の起点は、正規のリモートアクセスツール「MeshCentral Agent」で、ある台湾の組織が狙われたという。感染経路の詳細は不明だが、すでに存在した別の感染の再利用が示唆されている。攻撃者はその後、DLLのすり替えで暗号化された本体を読み込み、バックドアを展開する。カスペルスキーの研究者サウラブ・シャルマ氏とヌーシン・シャバブ氏が2部構成の分析で明らかにした。【詳細】GitDoorはGitHub上の二つのリポジトリを使い分ける。公開リポジトリ「Havo」から指令を受け取り、非公開リポジトリ「Trix」へ実行結果を上げる。リポジトリの作成日から、準備は少なくとも2024年末から進んでいたとみられる。GitDoorは26の指令に対応し、ファイル操作、キーログ、プロキシ起動、シェルコード実行、スクリーンショット、Cookieの抜き取り、Mimikatzによる認証情報の窃取、WhatsAppの暗号鍵の抽出など幅広い機能を持つ。GraphDoorはSharePointを経由し、Microsoft Graph APIで指令を受け取り、キーログやプロセス一覧、画面撮影のプラグインを動かす。両者とも制御フロー平坦化などの難読化を施している。【ポイント・注意点】実行者は不明だが、中国系の活動「Bronze Sandcastle」との重なりが指摘されている。GitHubやSharePointへのAPI呼び出しは正規の業務利用と見分けがつきにくいため、通信先のドメインだけでの防御は難しい。組織はエンドポイント側の挙動監視や、不審なリポジトリへのアクセス、MeshCentral Agentなどの正規ツールの悪用に目を向けたい。開発者は自分のリポジトリが攻撃に使われていないか、公開範囲や権限を定期的に見直すことが大切だ。","2026-11-17","The Hacker News","https://thehackernews.com/2026/11/new-gitdoor-and-graphdoor-backdoors.html"],["AIコードレビューの仕組みを7社分くらべてみた","プルリクエストに自動でレビューコメントを付けるAIコードレビューは、CopilotやClaude、Codex、CodeRabbitなど各社で仕組みが違う。開発者イゾルディン氏の記事は、公式ドキュメントを読み比べ、レビューが始まるきっかけからコメントが付くまでの流れを整理した。誤検出を減らす検証の有無や、承認に影響するかどうかなど、導入前に知りたい違いが分かる。","\n【概要】AIコードレビューは、プルリクエストが開かれたりプッシュされたりすると自動で動き出し、差分を読んでコメントを付けるサービスだ。だがベンダーごとに仕組みは大きく違う。DEV Communityの記事は、GitHub Copilot、AnthropicのClaude Code Review、Codex、CodeRabbit、Qodo、Greptile、Cursor Bugbotなど7社の公式ドキュメントを2026年11月16日に読み比べ、レビュー開始からコメント投稿までの流れを同じ土俵で整理した。導入を検討する開発者には貴重な比較だ。【背景】AIによるコードレビューは急速に広がったが、「何を読み、どこまで絞り込んでコメントするのか」はベンダー任せで分かりにくい。Anthropicは見つける、検証する、順位付けする、投稿するという4段階を公表し、CodexはGitHubではP0とP1の問題だけを指摘する。CopilotはMCPサーバーから外部の文脈も取り込める。こうした違いは、コメントの量や質、誤検出の多さに直結する。記事の著者は、各社の公式ページの文言をそのまま引用して比較している。【詳細】レビューの流れは共通して六つの段階に分けられる。まずプルリクエストのイベントや人の依頼で開始する。次に差分だけでなく周辺コードやリポジトリのグラフ、過去のコメント、指示ファイルを読み込む。続いて一つまたは複数のモデルが並行して候補を出す。投稿前に絞り込むベンダーもあり、Anthropicは検証ステップで誤検出を除き、重複を除いて重要度順に並べる。Qodoは影響の小さい指摘を投稿前に落とす。最後にGitHubの通常のレビューとしてコメントが付き、要約やチェックが添えられる。ただし既定では人の承認は不要で、合併の判断は人とブランチルールに残る。【ポイント・注意点】導入前に確認したいのは三つだ。第一に、レビューが承認や合併を止めるかどうか。AnthropicとCopilotは既定では承認に数えない。第二に、誤検出の絞り込みがあるか。検証ステップの有無でノイズが大きく変わる。第三に、読む範囲だ。指示ファイルやMCP連携の有無で、チームのルールに沿った指摘になるかが決まる。記事は各社の言葉を並べた比較表も載せており、自分のチームに合うものを選ぶ材料になる。","2026-11-17","DEV Community","https://dev.to/izgorodin/how-does-ai-code-review-work-1am0"],["Copilot週次更新、Fable 5.2とGemini 4 Carbonが登場","GitHubは2026年11月16日、Copilotの週次リリースを公開した。新モデルとしてClaude Fable 5.2とGemini 4 Carbonが加わり、GitHub Enterprise ServerのリポジトリをCopilotアプリで扱えるようになった。VS Codeでは注意が必要なエージェントセッションを優先表示する受信箱モードなど、エージェント作業を回すための改善も並ぶ。","\n【概要】GitHubは2026年11月16日、GitHub Copilotの週次リリースを公開した。目玉は二つの新モデルで、Claude Fable 5.2とGemini 4 CarbonがCopilotで使えるようになった。さらにGitHub Enterprise ServerのリポジトリをCopilotアプリで扱えるようになり、VS Codeでは注意が必要なエージェントセッションを先に表示する機能が加わった。【背景】Copilotはコード補完から、エージェントが自律的に作業する環境へと姿を変えつつある。今回の週次更新は、その流れの中での定例の機能追加で、モデルの選択肢と、複数のセッションをさばくための画面改善が中心になっている。【詳細】Claude Fable 5.2はPro+、Max、Business、Enterpriseで利用でき、データ保持が前提になる。BusinessとEnterpriseでは管理者がポリシーを有効化する必要があり、既定ではオフだ。Gemini 4 Carbonも同じプランで利用できる。GitHub Enterprise Serverのリポジトリ、課題、プルリクエストをCopilotアプリで扱えるようになったのは一般提供で、VS Codeのエージェント画面には受信箱モードが加わり、注意が必要なセッションが先に並ぶ。ほかにも、クラウドやCodespacesのセッションをGitHub Mobileで続ける機能、MCPサーバーへの再サインインを会話内で済ませる機能、プロジェクトの自動化を分単位で設定できる機能などが入った。ローカルハーネスは2027年2月に廃止されるため、Copilotハーネスへの移行も呼びかけられている。【ポイント・注意点】Fable 5.2を使う組織は、データ保持の条件とポリシー設定をまず確認したい。既定ではオフなので、管理者が有効化しない限り使えない。Gemini 4 Carbonは段階的に展開されるため、すぐ表示されない場合もある。Enterprise Serverの利用者は、クラウドセッションが使えない点に注意が必要だ。ローカルハーネスを使っている場合は、廃止までの移行計画を立てておきたい。","2026-11-16","GitHub Changelog","https://github.blog/changelog/2026-11-16-github-copilot-weekly-releases-november-9/"],["Copilotから3モデルが廃止、後継はOpus 5.5とGPT-6系","GitHubは2026年11月16日、Copilotの3モデルを廃止した。対象はClaude Opus 4.8、Claude Opus 5、GPT-5.6 Terraで、後継はClaude Opus 5.5とGPT-6.1 Sol、GPT-6 Lunaだ。10月15日に予告されていた通りの実施で、モデル選択画面からは消えるが、Opus 5は実行時のフォールバックとして残るなど、例外もある。移行の確認が求められる。","\n【概要】GitHubは2026年11月16日、GitHub Copilotの3モデルを廃止した。対象はClaude Opus 4.8、Claude Opus 5、GPT-5.6 Terraで、Copilot Chatやインライン編集、エージェントモード、コード補完など、ほとんどのCopilot体験に影響する。後継はClaude Opus 5.5とGPT-6.1 Sol、GPT-6 Lunaだ。10月15日に予告されていた通りの実施で、開発者と管理者はモデル指定の見直しが必要になる。【背景】AIモデルの入れ替えは速くなっている。Copilotでは複数のモデルが並び、性能や価格、提供元の都合で廃止と追加が繰り返される。今回の3モデルは10月15日に廃止が予告され、約1か月の猶予を経て実施された。12月14日にもさらに6モデルの廃止が予定されており、モデルのライフサイクル管理は開発現場の日常の作業になりつつある。【詳細】廃止の内訳は次の通りだ。Claude Opus 4.8とClaude Opus 5はClaude Opus 5.5へ、GPT-5.6 TerraはGPT-6.1 SolまたはGPT-6 Lunaへ移行する。ただし例外がある。Claude Opus 4.8は年額プランの個人契約者には引き続き提供される。Claude Opus 5はモデル選択画面から消えるが、既存の承認済みアクセスを通じた実行時のフォールバックとしては残る。既存の企業モデルポリシーはそのまま適用される。既定のモデル有効化を使っているEnterpriseとBusinessでは、後継モデルは自動で有効になる。全体の既定をオフにしている場合は、管理者がモデルポリシーで後継を有効化する必要がある。廃止されたモデルを手動で削除する作業は不要だ。【ポイント・注意点】ワークフローや統合でモデル名を直接指定している場合は、後継への書き換えが必要だ。スクリプトやGitHub Actions、社内ドキュメントに古いモデル名が残っていないか確認したい。Opus 5が選択画面から消えても実行時に残る点は、挙動の違いとして覚えておきたい。12月14日の次の廃止も控えているため、モデル指定を一か所にまとめるなど、入れ替えに強い構成にしておくと安心だ。","2026-11-16","GitHub Changelog","https://github.blog/changelog/2026-11-16-github-copilot-models-deprecated-on-november-16-2026/"],["Copilotの3モデル廃止、現場がやるべき移行の手順","GitHub Copilotで2026年11月16日に3モデルが廃止された。Claude Opus 4.8とOpus 5、GPT-5.6 Terraが対象で、後継はOpus 5.5とGPT-6系だ。Undercode Newsの記事は公式発表をもとに、影響範囲と例外、企業管理者が確認すべきモデルポリシーを整理し、古いモデル名を検索するコマンド例まで載せた移行ガイドになっている。","\n【概要】GitHub Copilotで2026年11月16日、Claude Opus 4.8、Claude Opus 5、GPT-5.6 Terraの3モデルが廃止された。Undercode Newsの記事は、GitHubの公式発表をもとに、廃止の影響範囲と例外、後継モデルへの移行手順をまとめた解説だ。Copilot Chatやインライン編集、エージェントモード、コード補完に影響し、モデル名を直接指定しているワークフローは見直しが必要になる。記事は事実確認のチェックリスト付きで、移行の実務に寄った内容だ。【背景】この廃止は2026年10月15日に予告されていた。AIモデルの世代交代が速まる中、Copilotではモデルの追加と廃止が相次いでいる。12月14日にも6モデルの廃止が予定されており、現場ではモデル指定の管理が継続的な作業になっている。記事は「Copilotは単なる補完ツールから、モデルが参加する開発環境へ進化した」とし、廃止を単なる画面の変化ではなく、開発プロセス全体の問題として捉えている。【詳細】後継は、Claude Opus 4.8とOpus 5がClaude Opus 5.5へ、GPT-5.6 TerraがGPT-6.1 SolまたはGPT-6 Lunaへ移行する。例外として、Claude Opus 4.8は年額プランの個人契約者には残る。Claude Opus 5はモデル選択画面から消えるが、実行時のフォールバックとしては残る。EnterpriseとBusinessでは、既定のモデル有効化を使っていれば後継は自動で有効になる。全体の既定をオフにしている場合は、管理者がモデルポリシーで有効化する必要がある。記事は、古いモデル名が残っていないか調べるためのgrepコマンド例や、モデルポリシーの確認、エージェントや自動化ワークフローのテストといった手順も載せている。【ポイント・注意点】まず自分のリポジトリやスクリプト、GitHub Actionsの設定に古いモデル名が残っていないか検索すること。選択画面から消えたモデルが実行時に残る場合があるため、画面上の有無だけで判断しないこと。企業管理者は、後継モデルがモデルポリシーで有効になっているか確認したい。12月14日の次の廃止も見据え、モデル名を一か所で管理する構成にしておくと、次回の入れ替えが楽になる。","2026-11-16","Undercode News","https://undercodenews.com/github-copilot-retires-three-ai-models-on-november-16-2026-directing-developers-toward-newer-alternatives-video/"],["12月14日にCopilotから6モデル廃止、Kimi K3は後継未定","GitHubは2026年11月13日、Copilotの6モデルを12月14日に廃止すると発表した。Claude Fable 5、Claude Haiku 4.5、Gemini 3.8 Flash、Gemini 4 Argon、Grok 4.6、Kimi K3が対象で、Kimi K3だけ後継が未定だ。Haiku 4.5は年額プランの個人契約者には残る。11月16日の廃止に続く予告で、早めの移行準備が呼びかけられている。","\n【概要】GitHubは2026年11月13日、GitHub Copilotの6モデルを12月14日に廃止すると発表した。対象はClaude Fable 5、Claude Haiku 4.5、Gemini 3.8 Flash、Gemini 4 Argon、Grok 4.6、Kimi K3で、Copilot Chatやインライン編集、エージェントモード、コード補完など、すべてのCopilot体験に影響する。後継モデルが示されているものが多いが、Kimi K3だけは後継が未定とされ、注意が必要だ。【背景】Copilotのモデル入れ替えは続いている。11月16日にはClaude Opus 4.8、Claude Opus 5、GPT-5.6 Terraの3モデルが廃止されたばかりで、約1か月後にさらに6モデルが廃止される。GitHubは廃止の約1か月前に予告を出す運用を続けており、今回も12月14日までの猶予がある。【詳細】廃止と後継の対応は次の通りだ。Claude Fable 5はClaude Fable 5.2へ、Claude Haiku 4.5はClaude Haiku 5.5へ、Gemini 3.8 FlashはGemini 4 Hydrogenへ、Gemini 4 ArgonはGemini 4 Carbonへ、Grok 4.6はGrok 4.7へ移行する。Kimi K3だけは後継が「近日発表」とされ、まだ決まっていない。例外として、Claude Haiku 4.5は年額プランの個人契約者には引き続き提供される。既定のモデル有効化を使っているEnterpriseとBusinessでは、後継モデルは自動で有効になる。全体の既定をオフにしている場合は、管理者がモデルポリシーで後継を有効化する必要がある。廃止後の手動の削除作業は不要だ。【ポイント・注意点】Kimi K3を使っている場合は、後継の発表を待つ必要があり、移行計画に余裕を持たせたい。モデル名を直接指定しているワークフローや統合は、12月14日までに後継へ書き換えること。Haiku 4.5の年額プラン例外のように、契約形態で扱いが変わる場合もある。11月16日の廃止と合わせると、短期間に9モデルが入れ替わることになる。モデル指定を一か所にまとめておくと、次回の入れ替えにも対応しやすい。","2026-11-13","GitHub Changelog","https://github.blog/changelog/2026-11-13-upcoming-deprecation-of-selected-github-copilot-models-in-december/"],["高速モデル「Gemini 4 Hydrogen」がCopilotで利用可能に","Googleの最新フラッシュモデル「Gemini 4 Hydrogen」が、GitHub Copilotで一般提供になった。高速で効率的なエージェント型コーディングやツール利用、複数段階の作業に向けて作られ、Gemini 3.8 Flashより指示への追従性が上がったという。ProからEnterpriseまで幅広いプランで使え、段階的に展開される。モデル選択画面から選ぶことができる。","\n【概要】Googleの最新フラッシュモデル「Gemini 4 Hydrogen」が、GitHub Copilotで一般提供になった。高速で効率的なエージェント型コーディングやツール利用、複数段階の作業に向けたモデルで、Gemini 3.8 Flashと比べて指示への追従性が向上したという。Copilot Pro、Pro+、Max、Business、Enterpriseの各プランで利用でき、モデル選択画面から選べる。展開は段階的で、すぐ表示されない場合もある。【背景】Copilotではモデルの選択肢が広がり続けている。2026年11月にはClaude Fable 5.2とGemini 4 Carbonも加わった。一方で古いモデルの廃止も進み、Gemini 3.8 Flashは12月14日に廃止される予定で、その後継としてGemini 4 Hydrogenが位置付けられている。高速なフラッシュモデルは、エージェントが何度もツール呼び出しを繰り返す作業で、待ち時間を抑える役割が期待されている。【詳細】Gemini 4 Hydrogenは、VS Code、Visual Studio、Copilot CLI、Copilotコーディングエージェント、Copilotアプリ、github.com、GitHub Mobile、JetBrains IDE、Xcode、Eclipse、Copilot SDKで選べる。料金は従量課金のもとでプロバイダーの定価が適用される。EnterpriseとBusinessの管理者は、モデルポリシーでアクセスを管理できる。既定のモデル有効化を使っている場合は、新しいモデルは自動で有効になる。ただし全体の既定をオフにしている場合や、特定のモデルを明示的に無効化している場合は、管理者の操作が必要だ。展開は段階的なため、表示されるタイミングは利用者によって異なる。【ポイント・注意点】Gemini 3.8 Flashを使っている場合は、12月14日の廃止までにGemini 4 Hydrogenへの切り替えを検討したい。高速モデルはエージェント作業の待ち時間を抑えられるが、複雑な推論では上位モデルとの使い分けも考えたい。管理者はモデルポリシーで有効化の状態を確認すること。料金は従量課金でプロバイダー定価のため、利用量が多い場合はコストの確認も忘れずに行いたい。","2026-11-13","GitHub Changelog","https://github.blog/changelog/2026-11-13-gemini-4-hydrogen-in-github-copilot/"],["盗まれたGitHubアカウント4837件、CIの秘密を狙う攻撃","盗まれた認証情報を使った攻撃者が、4837件のGitHubアカウントで書き込み権限のあるリポジトリに秘密窃取コードを仕込み、少なくとも1806件のリポジトリで実行させた。Aikido Securityの調査を伝える記事で、標的はCIパイプラインが触れるクラウド認証情報だ。脆弱性ではなく、盗まれた正規の認証情報が使われた点が恐ろしい。フィッシングに強い認証と権限の見直しが急務だ。","\n【概要】攻撃者は盗まれた認証情報を使い、4837件のGitHubアカウントで書き込み権限のあるリポジトリに、秘密を盗むコードを仕込んだ。少なくとも1806件のリポジトリで悪意あるコードが実行されたという。セキュリティ企業Aikido Securityの調査を伝える記事で、標的はCIパイプラインが扱うクラウドの認証情報やデプロイ用の鍵だ。GitHub自体の脆弱性ではなく、正規の認証情報が悪用された点が、この攻撃の恐ろしさを示している。【背景】CI/CDパイプラインは、コードを引いてビルドし、本番へデプロイする特権的な場所だ。リポジトリの秘密には、クラウドのアクセスキーやパッケージ公開用のトークン、署名用の証明書などが含まれることが多い。攻撃者はこうした秘密を狙い、認証情報の詰め込み攻撃で奪ったアカウントを使って、ワークフローの定義ファイルを書き換えた。正規のパイプラインの中で動くため、通常のビルドと見分けがつきにくい。【詳細】手口は単純だ。盗んだ認証情報でリポジトリに書き込み、GitHub Actionsのワークフロー定義ファイルであるYAMLを改変する。するとCI環境の中で秘密窃取コードが実行され、パイプラインがアクセスできる秘密やクラウド認証情報が抜き取られる。Aikido Securityによると、攻撃者はすでに相当数のリポジトリから秘密を集めたとみられる。攻撃はある火曜日に始まり、規模の大きさが際立っている。CIの権限が広すぎるリポジトリが多く、盗まれた秘密はクラウドのアカウント乗っ取りや、サプライチェーン攻撃、社内への横展開に使われかねない。【ポイント・注意点】対策は五つある。第一に、パスキーやハードウェアキーなど、フィッシングに強い多要素認証を徹底すること。第二に、CIの権限を最小限にし、GITHUB_TOKENは既定で読み取り専用にすること。第三に、クラウドへの接続はOIDC連携で使い捨ての認証情報にすること。第四に、.github/workflowsへの変更を監視し、ブランチ保護や必須レビューをかけること。第五に、改変されたリポジトリの秘密は漏れたものとして速やかにローテーションすること。開発者は自分のアカウントの認証状態も見直したい。","2026-11-12","RedSide Security","https://blog.redsidesecurity.com/post/attacker-weaponized-4837-hijacked-github-accounts-to-plant-ci-secret-stealer-in-1800-repositories"],["GitHubトレンドはエージェント一色、注目の10リポジトリ","2026年11月11日のGitHubトレンドは、AIエージェント一色だった。トップ10のうち7件が開発者の作業に自律的なAI機能を加えるもので、残りは設計システムや家計管理、セキュリティなど基盤側の変化を示す。エージェントが「何でもやる」存在から、専門化した道具の生態系へ移っている様子が、スター数の動きから読み取れる。スター数だけで判断せず、更新頻度も見ることが大切だ。","\n【概要】2026年11月11日のGitHubトレンドは、AIエージェントが主役だった。トップ10のうち7件が開発者の作業に自律的なAI機能を加えるリポジトリで、残りは設計システムや家計管理、セキュリティなど、基盤側の変化を示すものだった。MPDevの記事は、10件のリポジトリを読み解き、エージェントが「何でもやる万能な存在」から、専門化した道具の組み合わせへ移っていると指摘する。スター数の伸びも含め、開発者エコシステムの今が見える。【背景】AIコーディングエージェントの広がりとともに、GitHubのトレンドも変わった。以前はフレームワークやライブラリが中心だったが、今はエージェントの技能や運用を支える道具が上位を占める。記事は、Addy Osmani氏のagent-skillsが11万5804スターを集めたことなどを挙げ、熟練エンジニアの判断をスキルとして切り出す流れが業界標準になりつつあるとみている。【詳細】注目は「脳と手」の分業だ。shadcn/improveは高価なモデルを判断だけに使い、安いモデルに実行を任せる。vercel-labs/agent-browserはブラウザ操作を軽いコマンドにまとめ、homeassistant-ai/ha-mcpはMCPで家庭の自動化をAIに任せる。基盤側では、Metaの設計システムastryxが2万4695スターを集め、AIが読める仕様を持つ初の大規模設計システムとされる。openai/codex-securityは作ったものを検証する側の道具だ。開発以外では、株式分析のdaily_stock_analysisが7万69スター、家計管理のsureが1万2789スターを集め、エージェントの考え方が生活の領域にも広がっている。【ポイント・注意点】エージェントを導入する際は、万能な一つに頼るのではなく、用途ごとに専門化した道具を組み合わせる発想が大切だ。スキルやMCPといった標準的な接続方法に対応しているかが、選ぶ際の目安になる。スター数は人気の目安にはなるが、実用性や保守の状態までは示さない。気になるリポジトリは、更新頻度や課題への対応も見てから採用したい。トレンドは日々変わるため、週単位で眺めるくらいがちょうどよい。","2026-11-11","MPDev","https://blog.mpdev.dev/en/artigo/github-trending-open-source-agents-infrastructure-nov11-2026"],["GitHub Universe 2026、エージェント型開発への転換を総括","GitHub Universe 2026では、AIによる開発支援から、エージェントがソフトウエアを届ける仕組み全体へという転換が打ち出された。Xebiaのデニス・ティー氏がまとめた振り返り記事は、CopilotアプリやCopilot Projects、Automations、Fusionの4発表を軸に、開発者の役割や企業の進め方を整理する。導入の成否は道具より環境の質で決まるという指摘が鋭い。","\n【概要】GitHub Universe 2026では、AIによる開発支援から、エージェントがソフトウエアを届ける仕組み全体へという転換が打ち出された。Xebiaのデニス・ティー氏による振り返り記事は、Copilotアプリ、Copilot Projects、Copilot Automations、Copilot Fusionの4発表を軸に、開発者の役割や企業の進め方を整理する。発表された機能そのものより、開発環境の質がエージェント活用の成否を決めるという指摘が中心だ。【背景】これまでAI支援の焦点は、コード補完やチャット、コーディングエージェントと、開発者の手元にあった。Universe 2026では、開発者が方向を決めて責任を持ち、エージェントが実装と検証を担う「エージェント型ソフトウエアデリバリー」という構想が示された。GitHubは「完成した仕事こそが成果であり、コードの量ではない」という言葉で、この転換を表現している。【詳細】4発表の中身は次の通りだ。Copilotアプリはコード補完だけでなく、エージェント型の開発に向けた基盤になる。Copilot Projectsは目標や文脈、セッション、結果をまとめ、複数のリポジトリにまたがる作業を調整する。Copilot Automationsは再利用できるエージェント型タスクで、オンデマンドや定時、きっかけに応じて動く。Copilot Fusionは、どのモデルでどう実行するかを判断する仕組みだ。記事は、こうした道具を使いこなすには、プラットフォームやリポジトリ、設計、開発者体験、文書、セキュリティ、ガバナンスといった環境の質が欠かせないと述べる。AIが強い環境を加速させる一方で、摩擦や技術的負債もあぶり出すからだ。【ポイント・注意点】企業が問うべきは「AIを導入するか」ではなく、「人とエージェントが一緒に作る組織をどう設計するか」だと記事は説く。成果の測り方も、生成したコード量や利用頻度ではなく、着想から本番までの速さや、品質と速度の両立、判断に集中できる時間で測るべきだという。自律性と統制は一体で考え、どこで人の判断や承認を残すかを決めることが大切だ。まずは小さなチームで試し、環境を整えながら広げる進め方が現実的だ。","2026-11-10","Xebia","https://xebia.com/articles/github-universe-2026-recap/"],["Fable 5.2がCopilotに登場、データ保持が前提の新モデル","Anthropicの最新モデル「Claude Fable 5.2」がGitHub Copilotで一般提供になった。複雑で多段階のコーディング作業や大規模なコードベースに向くモデルで、初期テストではFable 5.1より多くの課題を少ない手順で解いたという。ただし安全分類のため既定でデータ保持が必要で、企業では管理者がポリシーを有効化しないと使えない。料金は従量課金が適用される。","\n【概要】Anthropicの最新モデル「Claude Fable 5.2」が、GitHub Copilotで一般提供になった。複雑で多段階のコーディング作業や大規模なコードベースに向くモデルで、初期テストではFable 5.1より多くの課題を少ない手順とツール呼び出しで解き、従来は解けなかった難しい課題もこなしたという。ただし安全分類のため既定でデータ保持が必要で、企業では管理者がポリシーを有効化しないと使えない点に注意が必要だ。【背景】Copilotではモデルの選択肢が増え続けている。Fable 5.2はAnthropicの最新Fableモデルで、2026年11月10日にCopilotへ登場した。同じ週にはGemini 4 Carbonも加わった。モデルごとに得意分野が分かれる中、Fable 5.2は難しい課題を解く力で選ばれる位置付けだ。AnthropicはMythos級モデルの安全対策としてデータ保持を求めており、この条件が利用の前提になっている。【詳細】Fable 5.2はCopilot Pro+、Max、Business、Enterpriseで利用でき、VS Code、Visual Studio、Copilot CLI、コーディングエージェント、Copilotアプリ、github.com、GitHub Mobile、JetBrains IDE、Xcode、Eclipseで選べる。料金は従量課金のもとでプロバイダー定価が適用される。重要なのはデータ保持の条件で、Fable 5.2を使うと、Anthropicが安全分類のためにプロンプトや出力を保持する。保持されたデータはモデルの学習には使われない。ほかのClaudeモデルは引き続きゼロデータ保持で動く。BusinessとEnterpriseでは管理者がFable 5.2のポリシーを有効化する必要があり、既定ではオフだ。条件を満たす企業は、年末までゼロデータ保持の特例で使える場合もある。【ポイント・注意点】企業で使う場合は、まず管理者がポリシーを有効化しているか確認すること。既定ではオフなので、有効化しない限りモデル選択画面に出てこない。データ保持の条件は、社内の情報管理ルールと照らして判断したい。特例の対象かどうかはGitHubの担当チームに確認する必要がある。","2026-11-09","GitHub Changelog","https://github.blog/changelog/2026-11-09-claude-fable-5-2-in-github-copilot/"]],"elec":[["コード未経験から作った、おしゃべりするテディベア","コードを書いたことがない女性が、ラズベリーパイ5とAIでおしゃべりするテディベアを作った記録。Adafruitの作例を手本に、OpenAIで会話を作り、ElevenLabsで声を付け、USBマイクとスピーカーで聞いて話す仕組みを実現した。ChatGPTに助けられながら配線やターミナル操作を学んだ過程が、初心者にも励みになる内容だ。作る過程のつまずきや解決策も具体的に書かれており、電子工作の入門にも向いている。","\n【概要】コードを書いた経験がまったくない筆者が、ラズベリーパイ5で動くおしゃべりするテディベアを作り上げた。Adafruitの「Robotic AI Bear Using ChatGPT」を手本に、USBマイクで聞き、OpenAIで返事を作り、ElevenLabsで声にしてスピーカーから話す仕組みだ。ChatGPTを相談相手に、配線やターミナル操作を一つずつ学んだ記録で、初心者がAI工作に踏み出すときの参考になる。【背景】きっかけは、アルツハイマー病を患う祖父母の姿だった。孤独を感じる高齢者に、会話や声かけで寄り添える存在を作れないかと考え、身近で安心感のあるテディベアを選んだ。医療や介護の代わりではなく、会話の相手として技術が役立つかを試すのが目的だ。2023年のAdafruitの作例はラズパイ4とAzureを使っていたが、筆者はラズパイ5とOpenAI、ElevenLabsに置き換えた。【詳細】構成はシンプルだ。ラズパイ5にUSBマイクとUSBスピーカーをつなぎ、Pythonのプログラムが音声を拾ってOpenAIに送り、返事をElevenLabsで音声化する。聞き取りにはWebRTC VADという音声検出の仕組みを使い、話し終わりを検出してから処理する。プログラムは「q」と入力するまで聞き続ける。筆者はMacBook AirからSSHでラズパイを操作した。最初はゲスト用Wi-Fiにつないでしまい、接続に何度も失敗したという。スピーカーの認識や音声設定の調整にも手間取ったが、初めて声が出たときの喜びが大きかったと振り返る。【ポイント・注意点】ミュート機能の追加で動かなくなった際は、事前に保存していたバックアップから復旧した。変更前の保存の大切さを学んだという。記事はAI製テディベアの販売停止のニュースにも触れ、不適切な応答のリスクを意識している。APIキーの管理や利用料金にも注意が必要だ。初心者でも作例とAIの助けがあれば形になる一方、配線や設定のトラブルは自分で解決する力も要る。まずは小さい一歩から始めるのがよい。","2026-11-17","Medium","https://medium.com/@sophie.bergeron.home/i-built-a-talking-teddy-bear-without-knowing-how-to-code-5beffef765de"],["自宅AIアシスタント、作るならどの基板がよいのか","自宅で動くAIアシスタントを作るなら、どの基板を選ぶべきか。Vicharakの記事はラズパイ5、Jetson Nano、Orange Pi 5、自社のAxon SBCを比べ、音声認識やHome Assistant、カメラ、ROS2まで見据えた選び方を解説する。結論は用途次第だが、長く使うなら文書化と運用のしやすさが決め手になるという。各基板の得意分野と弱点を踏まえ、自分の用途に合う選び方を考える材料になる。","\n【概要】自宅で動くAIアシスタントを作るとき、どの基板を選ぶべきか。Vicharakの記事はラズパイ5、Jetson Nano、Orange Pi 5、同社のAxon SBCを比べ、音声で聞いて答えるだけでなく、Home Assistantでの家電操作やカメラ、ROS2によるロボット化まで見据えた選び方を解説する。結論は用途次第だが、長く使うなら文書化と運用のしやすさが決め手になる。【背景】DIYのAIアシスタントは、もはやスピーカー付きのPythonスクリプトではない。常時聞き取り、音声を文字にし、推論して家電を動かし、ときにはカメラや画面も扱う、小さなエッジコンピューターのシステムだ。ラズパイは情報量が圧倒的だが、サービスが増えると調整が必要になる。Jetson NanoはAIの学習用に生まれたが、ソフトウエアが古くなってきた。Orange Pi 5は速いが、環境差で手間取ることがある。【詳細】記事は四つの層で比べる。聞き取り、音声処理、推論と自動化、カメラや画面の拡張だ。ラズパイ5は軽いアシスタントやHome Assistantの入れ物として優秀で、情報も豊富だ。Jetson NanoはCUDAを使った画像認識の学習には今も価値がある。Orange Pi 5は性能重視の実験向きだ。AxonはHome Assistant OSの公式イメージやUbuntu 24.04 LTS、ROS2の手順書、カメラや画面のオーバーレイ設定が文書化されており、据え置きの運用に向くという。初回起動は4〜5分、導入全体で20〜25分ほどかかるという具体的な数字も載っている。【ポイント・注意点】記事はAxonの販売元が書いたものなので、Axon寄りの結論になっている点には注意が必要だ。ラズパイの強みは情報量と周辺機器の豊富さで、初めての人には今も安心できる選択肢だ。長く使うなら、ストレージはmicroSDよりeMMCやSSDを考えたい。カメラやマイクの相性は事前に確認し、まずは一つの機能から動かして広げるのが無難だ。","2026-11-17","Vicharak Blog","https://blog.vicharak.in/company-blogs/how-to-build-a-diy-ai-assistant-with-raspberry-pi"],["ラズパイZero 3Wの姿が判明、Pi 4の心臓部を搭載か","ラズパイの次期小型基板「Zero 3W」の姿が、カーネルのデバイスツリーから見えてきた。Pi 4と同じBCM2711チップを載せ、電源ボタンやPCIe、4レーンのカメラ接続などが確認できる。ただし価格は15ドルでは済まない見通しで、メモリー価格の高騰が影を落とす。発売日は未定だ。デバイスツリーに書かれた内容と推測を分け、発売日や価格のうわさに流されない見方が分かる。","\n【概要】ラズパイの次期小型基板とみられる「Zero 3W」の姿が、Linuxカーネルのデバイスツリーから見えてきた。Pi 4と同じBCM2711チップを載せ、電源ボタンやPCIe、4レーンのカメラ接続などが確認できる。ただし価格は現行のZero 2Wと同じ15ドルでは済まない見通しで、メモリー価格の高騰が影を落とす。発売日はまだ発表されていない。【背景】きっかけは2026年10月25日、ラズパイのカーネルツリーに二つのデバイスツリーファイルが取り込まれたことだ。Marta Momotko氏が書いたもので、Zero 3WとPi 4 Model Aの配線情報が記されている。デバイスツリーはカーネルに部品の接続を伝えるもので、bret.dk氏が詳しく読み解いた。ラズパイは未発表で、正式な仕様や発売日は分かっていない。【詳細】確認できるのは、SoCがPi 4と同じ4コアのCortex-A72であること、Wi-FiとBluetoothがあること、電源ボタン用のGPIO、PCIeの有効化、4レーンのカメラ接続などだ。クロックやメモリー容量、価格はデバイスツリーには書かれておらず、推測の域を出ない。eMMCを示す8ビット幅の記述もあるが、最終形は不明だ。BCM2711はLPDDR4メモリーを使うが、このメモリーは1年で7倍に値上がりしたとラズパイ自身が説明している。Pi 4の4GBモデルは25ドル、8GBモデルは50ドル値上がりし、3GBモデルが83.75ドルで登場した。【ポイント・注意点】Zero 3Wで小さな言語モデルを動かすなら、RAMが鍵になる。Pi 4の実測では、2GBでGemma 3の1Bモデルがスワップを起こして再起動した例もある。230M〜500Mクラスの小さなモデルなら12.8トークン毎秒ほどで動くという。本格的に言語モデルを使いたいならPi 5が無難だ。買うか待つかは用途次第で、GPIOやセンサー用途なら現行のZero 2Wで十分だ。発売されれば、カメラ付きの小型端末やエッジAIの実験など、Zero 2Wでは力不足だった用途が広がる。ただし価格やメモリー容量が決まらないうちは、現行機で試すのが現実的だ。","2026-11-17","DEV Community","https://dev.clauneck.workers.dev/alanwest/raspberry-pi-zero-3w-specs-leak-pi-4-chip-release-date-and-why-it-wont-be-15-3lmc"],["ラズパイでレトロゲーム、公式ガイドと周辺機器を紹介","ラズパイ公式ブログが、レトロゲームを楽しむための案内を公開した。新刊『The Raspberry Pi Guide to Retro Gaming』や雑誌の特集に合わせ、19インチのアーケード筐体キットやアナログ映像出力ボード、無線ゲームパッド、Pico用VGA基板などを紹介する。合法ROMの入手先にも触れた、初心者にも優しい内容だ。筐体キットや映像出力、コントローラーなど、周辺機器の選び方も具体的に紹介されている。","\n【概要】ラズパイ公式ブログが、ラズパイをレトロゲーム機に変えるための案内を公開した。新刊『The Raspberry Pi Guide to Retro Gaming』と雑誌のレトロゲーム特集に合わせ、19インチのアーケード筐体キットやアナログ映像出力ボード、無線ゲームパッド、Pico用のVGA基板などを紹介する。合法なROMの入手先にも触れており、初心者にも優しい内容だ。【背景】ラズパイの人気の用途の一つがレトロゲームで、RecalboxやRetroPie、Lakka、Batoceraといった専用OSを入れれば、ファミコンからプレイステーション2、ZX SpectrumからAmigaまで再現できる。公式は新刊の発売を機に、周辺機器とともに改めて取り上げた。昔のゲームを今のテレビやモニターで楽しむための工夫が中心だ。【詳細】紹介された製品は六つある。PimoroniのPicade MAXは19インチの大型バー型筐体キットで、2人分の操作系とRP2040による低遅延の入力が特徴だ。RecalboxのRGB Dual 2はラズパイ5に載せてSCARTやコンポジット、VGAで古いテレビに出力できる。無線ゲームパッドは14ポンドで、2.4GHzのドングルでつながる。Game 5Piはファミコン風のケースで冷却ファンを2基備える。Pico VGA Demo BaseはPicoでVGA出力するための基板で、Doomの移植版も動く。8BitDoのレトロキーボードは87キーで、コモドール64などの配色がある。【ポイント・注意点】ROMの入手には注意が必要で、記事は合法なROMや自作ソフトの利用を呼びかけている。価格はポンドとドルで示されており、送料や在庫は販売店で確認したい。筐体キットは組み立てが必要で、電源や冷却も考えたい。まずは手持ちのラズパイにRecalboxなどを入れて、動くことを確かめてから周辺機器をそろえるのが無難だ。新刊は19.99ポンドで、基本の組み立てから高度な映像調整まで扱う。雑誌の特集号と合わせて読めば、初心者でも一通りの手順がつかめる。","2026-11-16","Raspberry Pi","https://www.raspberrypi.com/news/turn-your-raspberry-pi-into-a-classic-games-machine/"],["船乗りが作った、ラズパイのオフラインAI操舵コンピューター","船のことは知っていたがAIは知らなかった。そんな開発者が、ラズパイで動く完全オフラインのAI操舵コンピューター「d3kOS」を作り、Redditで2万3000回以上の閲覧を集めた。音声LLMとYOLOv8の画像認識で船の状態を言葉で説明する。専門知識がなくても好奇心から始められるという記録だ。開発の歩みそのものが共感を呼び、専門外から始めても形にできることを示した記録だ。","\n【概要】船のことは知っていたがAIは知らなかった。そんな開発者が、ラズパイで動く完全オフラインのAI操舵コンピューター「d3kOS」を作り、Redditで2万3000回以上の閲覧を集めた。音声LLMとYOLOv8の画像認識で、船の計器や航行データを言葉で説明する。専門家でなくても好奇心から始められるという記録で、11月15日にはProduct Huntにも登場した。【背景】船は多くのデータを生むが、計器や警報、手順書をにらむだけでは、何が起きているか分かりにくい。筆者は、船の状態を平易な言葉で説明する仕組みがほしいと考え、独学でAIを学び始めた。夜と週末の開発が数千時間に積み上がり、NMEA 2000やSignal Kといった船のデータ規格に対応し、質問に答える操舵コンピューターができた。【詳細】d3kOSはオープンソースで、ラズパイ上で動く。音声の言語モデルで会話し、YOLOv8でカメラ映像を認識し、Signal KやAvNavと連携して航行を助ける。すべてオフラインで動くため、海上で通信がなくても使える。Redditのr/raspberryDIYに投稿したところ、24時間以内に2万3000回以上の閲覧と80以上の賛同を集めた。筆者は「画期的なものを作ったからではなく、歩みが共感を呼んだ」と振り返る。【ポイント・注意点】11月15日のProduct Huntでの公開もあり、注目が集まっている。オープンソースのため、仕組みを学んで自分の船や用途に合わせて改造できる。ただし船での利用は安全に直結するため、航行の判断は必ず正規の計器と目視で行いたい。AIの説明は補助と割り切り、導入前にライセンスや対応機器を確認することが大切だ。筆者はボートの知識しかなかったが、独学で言語モデルや画像認識を学び、数千時間の開発を重ねた。Redditでの反響を受け、Product Huntでの公開へ進んだ。専門外からの挑戦が、同じように始めたい人の背中を押す内容だ。船のデータ規格への対応やオフライン動作など、現場の条件に合わせた工夫が随所に見られる。","2026-11-16","DEV Community","https://dev.to/don_moskaluk_be46b51f5778/i-knew-boats-not-ai-how-curiosity-led-to-d3kos-and-23000-reddit-views-i39"],["AIがコードを書く時代、ハードウエアを学ぶ理由","AIがコードを書くようになった今、ハードウエアを学ぶ意味はむしろ増している。筆者はラズパイPico 2 Wのスターターキットで植物への水やり装置を作り、配線や電源の大切さを学んだ。Claudeがコードを書いてくれたが、配線やデバッグは自分の手が必要だった。週末で始められる電子工作の記録だ。AIにコードを任せつつ、自分の手で確かめる姿勢が、電子工作の学び方として参考になる。","\n【概要】AIがコードを書くようになった今、ハードウエアを学ぶ意味はむしろ増している。筆者はラズパイPico 2 Wのスターターキットで、植物に水をやる装置を作った。ClaudeがMicroPythonのコードを書いてくれたが、配線や電源、デバッグは自分の手が必要だった。週末で始められる電子工作の記録で、AI時代の学び方を示している。【背景】AIがソフトウエアの大半を書くようになり、筆者はコードが動く土台であるハードウエアの理解に目を向けた。選んだのはSunFounderのPico 2 Wスターターキットで、センサーやLED、直流モーター、小さな水ポンプ、モータードライバー、バッテリー充電モジュールなど約41点が入っている。理論は米テキサス大学のedX講座「Embedded Systems」で学んでいる。【詳細】作ったのは、マイクロスイッチとモーターの二つのレッスンを組み合わせた水やり装置だ。モーターの代わりに水ポンプを使い、Pico 2 WがMicroPythonで制御する。TA6586ドライバーでポンプを切り替え、ポンプはコップの水をチューブで鉢へ送る。ポンプ用のバッテリーはPicoとは別に用意し、グラウンドを共通にした。状態表示のLEDも付けた。Claudeはコードを書き、配線図を読み解き、回路図を作るのを助けたが、配線や電源の用意、デバッグは筆者自身の仕事だった。【ポイント・注意点】学んだことは三つある。第一に電源が先で、ポンプはPicoの供給能力を超えるため別電源が要る。第二に不具合の大半は配線にあり、ジャンパー1本のずれで動かない。第三に水と電子部品は離すことだ。次ははんだ付けを学び、走るロボットやPWMによる速度制御、Wi-Fiでの状態通知に進む予定だ。スターターキットと週末があれば始められる、というのが筆者の結論だ。キットには41点の部品が入り、配線図とMicroPythonのコード付きのレッスンで進められる。LEDの点滅から始め、センサーやモーターへと段階を踏む構成だ。AIに聞きながら進められるため、初心者でもつまずきにくい。次の目標はロボットで、PWM制御やWi-Fi通知も計画している。","2026-11-15","Medium","https://richard-taujenis.medium.com/ai-writes-my-code-so-im-learning-hardware-e351afb7f419"],["ラズパイ5でAIチャットボットをオフラインで動かす","ラズパイ5にAI HAT+ 2を載せれば、小さな言語モデルを机の上でオフラインで動かせる。Hailo-10Hと専用8GBメモリーを備え、Llama 3.2やQwen2.5などの1〜1.5Bモデルが動く。ただし性能はクラウドAIに及ばず、通信できない場所や私的なデータを扱う用途に向く。現実的な使い方が分かる解説だ。導入の手順や向く用途、限界まで整理されており、手元のAIを試したい人の参考になる。","\n【概要】ラズパイ5にAI HAT+ 2を載せれば、小さな言語モデルを机の上でオフラインで動かせる。Hailo-10Hアクセラレーターと専用8GBメモリーを備え、Llama 3.2やQwen2.5などの1〜1.5Bモデルが動く。ただし性能はクラウドAIに及ばず、通信できない場所や私的なデータを扱う用途に向く。現実的な使い方が分かる解説だ。【背景】AIチャットボットの多くはデータセンターで動く。ラズパイAI HAT+ 2は、生成AIを手元で動かすための拡張基板で、Hailo-10Hと8GBの専用メモリーを載せる。従来のAI HAT+は画像認識が中心だったが、こちらは言語モデルも扱える。価格は130ドルで、ラズパイ5専用だ。【詳細】動くモデルはLlama 3.2の1B、DeepSeek-R1-Distillの1.5B、Qwen2.5-InstructとQwen2.5-Coderの1.5B、Qwen2の1.5Bなどだ。8GBはまだ使い切っておらず、より大きなモデルも準備中という。Hailo-OllamaはOllamaと同じAPIで話せるため、既存のチャットアプリがつなぎやすい。導入は、基板を取り付け、最新のラズパイOSにし、HailoのGitHubからモデルとアプリを取ってくる流れだ。カメラと組み合わせたビジョン言語モデルも試せる。【ポイント・注意点】1〜1.5Bのモデルは小さく、短い返答や要約、簡単な指示、カメラ画像の説明は得意だが、長い推論はクラウドAIに及ばない。レビューでは、メモリーの多いラズパイ5単体の方が速い場面もあったという。向くのは、オフラインの現場や私的なデータ、ロボットなど、すべてを手元で済ませたい用途だ。作業場の音声アシスタントや、自分のメモを聞く私的な質問ボット、話しかけて動くロボットなどが例に挙がっている。記事はHailoのモデル動物園にある5つの言語モデルを紹介し、Open WebUIと組み合わせた使い方にも触れている。ただしモデルの品質には限界があり、回答の正確さはクラウドAIに及ばない。用途を絞って使うのが前提だ。","2026-11-14","Electronics Forum","https://electronics-forum.com/run-an-ai-chatbot-offline-on-a-raspberry-pi-5-with-the-ai-hat-2/"],["自作モジュールがCM4に勝利、YOLOは約10倍の速さ","自作の計算モジュールが、ラズパイCM4とのAI画像認識対決で勝利した。RockchipのRV1126Bと3TOPSのNPUを載せ、YOLOv8nを38.9fpsで動かし、CPUだけのCM4の4.0fpsを約10倍引き離した。2台の4Kカメラ同時撮影やH.265符号化もできる。NPUの威力を示す比較だ。条件をそろえた計測で、NPUの強みとCPUの弱みがはっきり分かる。用途別の選び方に役立つ内容だ。","\n【概要】自作の計算モジュールが、ラズパイCM4とのAI画像認識対決で勝利した。RockchipのRV1126Bと3TOPSのNPUを載せ、YOLOv8nを38.9fpsで動かし、CPUだけのCM4の4.0fpsを約10倍引き離した。2台の4Kカメラ同時撮影やH.265符号化もできる。カメラと映像の処理では、小さなNPUが速いCPUに勝つことを示す比較だ。【背景】作ったのはRedditの利用者adouglass52氏で、ラズパイCM4と同じ形のモジュールに、画像処理向けのRockchip RV1126Bを載せた。JLCから届いたばかりの基板を、同じキャリアボード、同じ2台のIMX415カメラ、標準のツールで比べた。3回の計測の中央値で評価しており、条件をそろえた珍しい比較だ。【詳細】基板はRV1126Bに4コアのCortex-A53、1GBのLPDDR4X、8GBのeMMC、16MBのSPIフラッシュ、Wi-Fi 6を載せる。1,000台作った場合の単価は約62ドルで、同じようなCM4の71.25ドルより安い。YOLOv8nは640×640で25.4ミリ秒、38.9fpsで動き、CM4の4.0fpsの約10倍だ。2台のIMX415カメラで4K30の同時撮影もでき、CM4にはできない。1080pのH.264符号化は30fpsで、CM4の25fpsを上回り、H.265にも対応する。消費電流は全負荷で約0.5AとCM4の0.9Aより少なく、温度も約20度低い。ただしCPU性能はCM4が約2倍で、HDMIやPCIeもCM4だけが持つ。【ポイント・注意点】カメラや映像、物体検出が目的ならNPU付きの専用チップが有利だが、汎用処理や拡張性ではCM4が勝る。ピン配置はCM4に近いが完全ではなく、2台目の4レーンカメラはDSI0のピンを借りるため、標準キャリアでは2レーンになる。自作モジュールは入手性や長期供給も考えたい。用途に合わせて選ぶのが大切だ。比較は同じキャリアボードとカメラ、標準ツールで3回計測し、中央値を取っている。Wi-Fiの速度も約2倍で、発熱も低い。ただしHDMIやPCIeがなく、汎用性ではCM4が上だ。カメラ中心の用途なら専用チップ、拡張性ならCM4という分け方が見えてくる。","2026-11-14","CircuitDigest","https://circuitdigest.com/news/this-diy-compute-module-beats-a-raspberry-pi-cm4-at-ai-vision-running-yolo-at-39-fps"],["スタックちゃんがタイピングを追う、机上のAIロボット","M5StackのAIデスクロボット「スタックちゃん」が、キーボードのタイピングを目で追う動画が話題だ。キーボードの信号をMacBook経由でBluetoothで送り、ロボットが視線を向ける。スペルを間違えると眉を上げる仕草もあり、机の上の相棒らしい一幕だ。ESP32-S3を積んだ公式キットで動く。机の上で動く小さなロボットの魅力を伝える、短いながらも印象的な話題だ。","\n【概要】M5StackのAIデスクロボット「スタックちゃん」が、キーボードのタイピングを目で追う動画が話題だ。キーボードの信号をMacBook経由でBluetoothで送り、ロボットが視線を向ける。スペルを間違えると眉を上げる仕草もあり、机の上の相棒らしい一幕だ。ESP32-S3を積んだ公式キットで動く様子が、Xの投稿で広がった。【背景】スタックちゃんは、日本の技術者ししかわ氏が始めたオープンソースのデスクロボットで、M5Stackから公式キットも出ている。CoreS3を頭脳に、2つのサーボで首を振り、画面に表情を出す。AIエージェントと組み合わせる作例が増えており、今回はタイピングに反応する試作が注目を集めた。【詳細】仕組みは、キーボードの信号をMacBookが受け取り、Bluetoothでロボットに伝える。ロボットは打つ手の方向へ顔を向ける。投稿したオレグ・フロロフ氏は、スペルチェックは便利だが、ロボットの相棒が「color」の「u」を忘れたときに眉を上げると、感じ方が違うと書いている。ロボットは550mAhのバッテリーで動き、水平360度と上下90度の動きができる。ファームウエアにはAIエージェントと表情のアニメーションが入っている。9軸IMUや0.3メガピクセルのカメラ、近接センサーや環境光センサーも備える。【ポイント・注意点】実用性より、机の上の存在感を楽しむ作例だ。Bluetooth経由のため、遅延や接続の安定性は環境次第だ。公式キットは99ドルほどで、M5Stackのストアで買える。自分で改造する場合は、JavaScriptのMODやArduinoの作例が参考になる。サーボの音やバッテリーの持ち時間も、置き場所を決める際に確かめたい。動画はXで公開され、多くの利用者の目に留まった。スタックちゃんは公式キットだけでなく、CoreS3とサーボを組み合わせた自作もできる。MODを入れ替えれば表情や動きを変えられ、机の上の相棒として育てていける。AIエージェントと組み合わせれば、会話や通知の読み上げなども可能になる。","2026-11-12","Robotic Gizmos","https://www.roboticgizmos.com/m5stackchan/"],["スタックちゃん徹底レビュー、魅力と弱点を整理","M5StackのAIデスクロボット「スタックちゃん」を、口コミも含めて徹底レビューした記事。ESP32-S3と2つのサーボ、ChatGPT連携やカメラなどの拡張性が魅力だが、初期設定の手間やサーボの音、バッテリーの持ちは弱点だ。公式キットは約99ドルで、作る楽しさと癒やしを両立する製品だ。口コミや仕様、価格まで幅広くまとめられており、購入を考える際の判断材料になる。","\n【概要】M5StackのAIデスクロボット「スタックちゃん」を、口コミも含めて徹底レビューした記事だ。ESP32-S3と2つのサーボ、ChatGPT連携やカメラなどの拡張性が魅力だが、初期設定の手間やサーボの音、バッテリーの持ちは弱点だ。公式キットは約99ドルで、作る楽しさと癒やしを両立する製品としてまとめられている。【背景】スタックちゃんは、日本の技術者ししかわ氏が始めたオープンソースのプロジェクトで、M5Stackから公式のキットも出ている。画面に表情を出し、首を振って反応する小さなロボットで、ChatGPTとつなげて会話させたり、カメラで人を追ったりできる。世界中の利用者がコードを書き足し、性格や機能を育てる「共創」が特徴だ。【詳細】仕様は、ESP32-S3のデュアルコア240MHz、2.0インチのタッチ画面、0.3メガピクセルのカメラ、9軸IMU、近接センサー、マイク2基、NFC、700mAhのバッテリーで、重さは約186gだ。初期状態でも表情の変化や音への反応を楽しめるが、本領は「スキル」の追加にある。ChatGPTと連携して相談に答えたり、株価や天気を読み上げたり、Googleカレンダーと連動して予定を知らせたりできる。ファームウエアの書き換えはM5Burnerで、ブラウザから数クリックで済む。【ポイント・注意点】弱点は三つある。第一に、APIキーの取得や設定など、初期の手間がかかる。第二に、サーボの動作音が静かな部屋では気になる。第三に、バッテリーだけでは数時間しか持たないため、常時使うならUSB Type-Cでの給電が要る。公式ストアでは在庫が不安定なこともある。日本ではスイッチサイエンスなどの正規代理店で、組み立て済みのモデルが2万〜4万円ほどで買える。作る楽しさを味わいたい人に向く製品だ。記事は猫型ロボット「Mia」との比較も載せ、癒やし重視ならMia、作る楽しみ重視ならスタックちゃんという分け方を示す。Miaは方言で話す会話モデルもある。どちらも机の上の相棒だが、性格は大きく違う。","2026-11-11","mia-cat","https://mia-cat.com/en/pet-robot/stackchan-review/"],["M5Stack新基板、16×16のLEDで状態を表示する","M5Stackの新基板「Core Matrix」は、16×16の白いLED256個を並べたESP32ボードだ。Wi-Fi 6やIMU、Grove端子を備え、通知ランプやセンサー表示、傾きゲームなどに使える。価格は29.90ドルで、Arduino IDEやUIFlow2で開発できる。液晶より省電力な表示がほしい場面に向く。仕様や作例、注意点まで具体的に書かれており、IoTの表示部品として検討しやすい内容だ。","\n【概要】M5Stackの新基板「Core Matrix」は、16×16の白いLED256個を並べたESP32ボードだ。Wi-Fi 6やIMU、Grove端子を備え、通知ランプやセンサー表示、傾きゲームなどに使える。価格は29.90ドルで、Arduino IDEやUIFlow2で開発できる。液晶より省電力な表示がほしい場面に向く、54ミリ角の小さなコントローラーだ。【背景】M5Stackは2026年11月6日にCore Matrixを発売した。状態表示には液晶が便利だが、配線や消費電力が増える。16×16のLEDなら、アイコンやスクロール文字、簡単なアニメーション、センサーの棒グラフを省電力で出せる。EspressifのESP32-C61を載せ、M5Stackの拡張にも対応する。【詳細】頭脳はESP32-C61HR8で、シングルコアのRISC-V 160MHz、16MBのフラッシュ、8MBのPSRAMを備える。無線は2.4GHzのWi-Fi 6とBluetooth LE 5.0だ。LEDはTM1680ドライバーが制御し、開発者はピクセルデータを送るだけでよい。周りにはBoschのBMI270 6軸IMU、3つのボタン、電源ボタン、ブザー、microSDスロット、USB-C、バッテリー端子がある。30ピンのM5-Busと4ピンのGrove端子でセンサーを増やせる。IMUの割り込みでスリープから起きるため、持ち上げたときだけ動く省電力の仕組みも作れる。【ポイント・注意点】Grove端子にI2Cの部品をつなぐ際は、アドレスの衝突に注意し、バスを走査してIMUと重ならないか確かめたい。白いLEDだけなので、色分けの表示には向かない。作例として、MQTTの通知でアイコンを光らせるランプや、教室の騒音計、傾きで遊ぶヘビゲームなどが挙がっている。まずはArduino IDEのサンプルで点灯を確かめ、DHT22やBME280などのセンサーと組み合わせるのがよい。発売は2026年11月6日で、M5Stackの公式ストアで29.90ドルで販売されている。Hacksterでも発売が報じられた。液晶と比べると情報量は少ないが、消費電力と配線の少なさが利点だ。","2026-11-10","Circuitrocks","https://blog.circuit.rocks/m5stack-core-matrix-esp32-board-with-a-16x16-led-grid"],["スタックちゃんをWi-Fiで操る、ESP32教材の新展開","M5Stackのスタックちゃんを、ESP32の教材キットからWi-Fiで操る試みが紹介された。Arduinoの作例を少し直すだけで、画面の表示を再現し、さらにサーボで体を動かせる。元のAI機能は上書きされるが、工場出荷のソフトに戻せる。教育現場での活用を見据えた内容だ。教材キットとロボットを組み合わせる発想が、学びの幅を広げる好例になっている。教育現場での活用も見据えた内容だ。","\n【概要】M5Stackのスタックちゃんを、ESP32の教材キットからWi-Fiで操る試みが紹介された。Arduinoの作例を少し直すだけで、画面の表示を再現し、さらにサーボで体を動かせる。元のAI機能は上書きされるが、工場出荷のソフトに戻せる。教育現場での活用を見据えた内容で、Elektor Engineering Insightsの第62回から抜粋されたものだ。【背景】話すのは『ESP32 by Example』の著者で、ヴィラノバ大学の非常勤講師でもあるジム・ソルダーリッチ氏だ。同氏は、実例で組み込み開発を教える教材キット「EEK」を作っており、ドローンのシミュレーターなどを題材にしてきた。今回はその教材をスタックちゃんに応用し、無線でロボットを操る方法を解説した。同じ回ではAIを使ったESP32のコード作成も扱われている。【詳細】EEKは、安価な黄色い画面付きESP32基板「Cheap Yellow Display」で仮想LEDを動かす教材だ。ソルダーリッチ氏は、Arduinoのコードを4行だけ直して、同じ表示をスタックちゃんの画面に再現した。画面の再現だけでなく、スタックちゃんのサーボやカメラを動かす作例も、M5Stackの公式文書に載っている。通信はWi-FiのUDPソケットを使い、DJIのTelloドローンを操ったときと同じ考え方だ。EEKを手元の操縦器にし、スタックちゃんが指令に応じて体を動かす。【ポイント・注意点】注意点は、独自のArduinoソフトを書き込むと、スタックちゃん本来のAI機能が置き換わることだ。ただし工場出荷のソフトには戻せるため、実験と本来の使い方を行き来できる。教育の観点では、同じ教材で画面の表示から実物の動きまで学べるのが利点だ。将来の大学の授業や研修教材への応用も検討されているという。まずは画面の再現から試し、サーボの動きへ進むのがよい。記事はElektor Engineering Insightsの第62回からの抜粋で、司会はブライアン・トリスタム・ウィリアムズ氏だ。同じ回ではAIを使ったESP32のコード作成も扱われており、AIとハードウエアの組み合わせがテーマになっている。教材の応用範囲の広さが分かる。","2026-11-09","Elektor Magazine","https://www.elektormagazine.com/articles/m5stack-stackchan-esp32-control"]],"muse":[["Claude Code 2.1.325、サンドボックスと定時タスクの権限を変更","Claude Code 2.1.325は11月13日公開の更新で、サンドボックス内のBashが通常の権限フローに従うようになり、定時タスクや/loopがスキル実行の前に確認を求めるようになった。夜間稼働が人の返答待ちで止まる恐れがあり、設定での対応が必要だ。88件の修正と14件の改善も含まれる。定時タスクが使うスキルは事前に許可へ入れておくなど、夜間稼働を止めないための準備が欠かせない。","\n【概要】Claude Code 2.1.325は11月13日に公開された更新で、セキュリティ寄りの内容ながら、夜間や無人で回している人には見逃せない挙動の変更が入った。サンドボックス内のBashがこれまでの自動許可から通常の権限フローに従うようになり、定時タスクや/loopがスキル実行の前に確認を求めるようになった。88件の修正と14件の改善も含む。\n【背景】これまでサンドボックス内のBashは確認なしで実行できたため、夜通しの自動運転では許可を求めない前提で組まれた運用が多かった。今回の変更は、サンドボックスを過信しない方向への是正で、スキルがallowed-toolsやフックを宣言している場合に、定時タスクや/loopが実行前に確認を挟むようになった。放置したジョブが人の返答待ちで止まる可能性がある。\n【詳細】対応策は二つある。従来の挙動を保ちたい場合は設定でsandbox.autoAllowBashIfSandboxedをtrueにする。もう一つは、定時タスクが使うスキルをpermissions.allowにSkill(name)の形で追加しておく方法だ。また、claude remote-controlの終了コードも整理され、自分で止まったときは4、登録できないときは69を返すようになった。サービス管理ツールで包んでいる場合は、4と69を再起動の合図として扱う必要がある。\n【ポイント・注意点】これは不具合ではなく仕様変更として扱うべきだ。夜間稼働の前に、定時タスクが使うスキルを洗い出し、許可設定に入れておくこと。サンドボックスの自動許可を戻す設定は便利だが、権限の網をゆるめる意味でもあるため、信頼できる作業範囲でのみ使うのが安全だ。更新後は一度、定時タスクを手動で動かして止まらないことを確かめたい。また、今回の更新はセキュリティ寄りの位置づけで、サンドボックスの自動許可が前提のまま運用を続けると、深夜のジョブが確認待ちで止まり、朝になって気づく事態になりかねない。更新の直後は、定時タスクを一度手動で実行し、確認が出ないことを確かめるのが確実だ。権限まわりの変更は2.1.326でも続いているため、両方の更新内容をあわせて読んでおきたい。","2026-11-17","Medium","https://blurbrahlab.medium.com/claude-code-2-1-325-4ab4f19b55b4"],["Claude CodeにカスタムテーマとMods、アニメ背景も登場","Claude Code Desktopでカスタムテーマが作れるようになり、Modsという仕組みが登場した。/custom-themeコマンドで色やアニメーション背景を変えられ、セッションごとにテーマを切り替えたり、コードのマージ時に花火のアニメーションを表示したりできる。公式のテーマ例も配布されている。セッションごとにテーマを変えられるほか、コードのマージ時に花火のアニメーションを表示する演出もあり、長時間向き合う画面を自分好みに整えられる。","\n【概要】Claude Code Desktopでカスタムテーマが作れるようになり、Modsという新しい仕組みが登場した。/custom-themeコマンドで画面の色を変えられるほか、アニメーション背景も設定できる。見た目を自分好みに整えるだけでなく、セッションごとにテーマを切り替える使い方もでき、公式のテーマ例もプラグインとして配布されている。\n【背景】これまでClaude Codeの画面は決まった見た目で使うものだったが、長時間向き合う道具だけに、自分の作業環境に合わせた見た目への要望は根強かった。今回の対応は、色の変更にとどまらず、背景のアニメーションやマージ時の演出まで含んだもので、作業の区切りを視覚的にも分かりやすくする狙いがある。\n【詳細】テーマはhonu-lagoon、Night Reef、Paper Gardenなどの名前で紹介され、/plugin install theme-examples@claude-plugins-officialで公式の例を入れることができる。自分で作る場合は/custom-themeコマンドから始め、色や背景を指定する。セッションごとにテーマを変えられるため、用途別の画面を使い分けることもできる。コードをマージしたときに花火のアニメーションが出る演出も用意されている。\n【ポイント・注意点】テーマは見た目の機能であり、動作や権限には影響しない。ただし、プラグイン経由で入れるものは中身を確認してから入れるのが基本だ。派手なアニメーション背景は長時間の作業で目が疲れることもあるため、集中したい場面では落ち着いたテーマを選ぶとよい。まずは公式の例を試して、自分の好みに合うものを探すのが近道だ。テーマの切り替えは、作業の種類ごとに画面の雰囲気を変えたい人にも向いている。たとえば、集中したい作業では落ち着いた色を選び、気分を変えたいときには明るいテーマにするといった使い分けができる。公式のテーマ例はプラグインとして配布されており、まずはそれを試して好みを探すのが近道だ。アニメーション背景は見た目が楽しい反面、長時間の作業では目が疲れることもあるため、自分の作業スタイルに合わせて選ぶとよい。","2026-11-17","Medium","https://medium.com/@2084267015/claude-code-just-announce-you-can-now-create-your-own-themes-animated-backgrounds-and-more-b0a98a2aae73"],["北朝鮮系がClaude Code設定を改ざん、SOMBERMEME仕込む","Googleの脅威情報グループによると、北朝鮮系とみられる集団がClaude Codeの設定ファイル.claude/settings.jsonを改ざんし、起動時にSOMBERMEMEというバックドアをダウンロードさせる手口を使った。偽の採用担当者やClickFixによる侵入が起点で、対策として.claude/へのCODEOWNERS設定や変更履歴の監査が挙げられている。","\n【概要】Googleの脅威情報グループ(GTIG)は、北朝鮮系とみられる集団MIDNIGHT NEPTUNEが、Claude Codeの設定ファイル.claude/settings.jsonを改ざんし、起動時にSOMBERMEMEというバックドアをダウンロードさせる手口を使ったと報告した。11月16日のAI脅威トラッカーに載った内容で、暗号資産関連の組織が北米と欧州で狙われたとされる。\n【背景】Claude Codeは、プロジェクト共有の設定ファイルに書かれたフックを、開発者がリポジトリを開いたときに実行する仕組みだ。チームで書式やテストの手順をそろえるための機能だが、攻撃者から見れば、開発者の権限で起動時にコードを走らせる経路になる。リポジトリへの書き込み権限さえ得られれば、Anthropic側の脆弱性がなくても悪用できる。\n【詳細】侵入の起点は、偽の採用担当者による接触と、ClickFixと呼ばれる偽の会議サイトで診断スクリプトを実行させる手口だ。足場を取った後、内部リポジトリの.claude/settings.jsonを書き換え、Claude Codeの起動時にバックドアを落とさせる。GitHubの個人アクセストークンをMicrosoft Copilot風の名前で作り、通常の通信に紛れ込ませる手口も確認された。なお、SOMBERMEMEのハッシュや通信先などの指標は公開されていない。\n【ポイント・注意点】対策として、git log --all -- .claude/settings.jsonで過去90日の変更者を確認すること、.claude/にCODEOWNERSを設定して上級者のレビューを必須にすること、採用担当者経由のスクリプト実行を禁じることが挙げられている。不審なフックが走った端末では認証情報のローテーションを行い、場合によっては再イメージも検討したい。設定ファイルもコードと同じ監査対象だ。なお、今回の手口はAnthropicの製品の脆弱性ではなく、リポジトリへの書き込み権限を得た後の設定改ざんだ。防御の中心は、設定ファイルの変更を誰がしたかを追える状態にしておくことと、.claude/への変更に必ず人の目を通すことだ。公開された指標がないため、挙動での検知が頼りになる。","2026-11-17","explainx.ai","https://explainx.ai/blog/google-gtig-sombermeme-claude-code-settings-backdoor-november-2026"],["Claude CodeにiPhone Duoシミュレーター、折りたたみテスト自動化","Claude CodeのmacOS版に、折りたたみ式iPhone Duoのシミュレーターがパブリックベータで追加された。外側5.4インチと内側7.6インチの画面を行き来しながら、ヒンジの角度を1度から179度まで変えてテストでき、レイアウト崩れを見つけて修正案まで出してくれる。Claude Desktop v4.29.0以降とXcode 27.1以降が必要だ。","\n【概要】Anthropicは11月16日、Claude CodeのmacOS版に折りたたみ式iPhone Duoのシミュレーター対応をパブリックベータで追加した。統合されたiOSシミュレーター画面の中で、Claudeが自らヒンジを折りたたんだり開いたりしながら、アプリの表示崩れを点検し、修正まで行う。折りたたみ端末向けの開発で、手作業の確認を減らす狙いがある。\n【背景】折りたたみ端末のアプリは、外側の5.4インチ画面と内側の7.6インチ画面、そして中途半端な角度の半開き状態のすべてで表示が崩れない必要がある。これまでは姿勢を手で切り替えながら確認するしかなく、見落としが起きやすかった。Claude Codeが画面を見ながら自動で姿勢を変えることで、この繰り返し作業を任せられるようになった。\n【詳細】Claudeはシミュレーターの姿勢をClosed、Half Open、Openに切り替え、ヒンジの角度も1度から179度まで細かく変えられる。実行中の画面を読み取り、ボタンの当たり判定のずれや、折り目にまたがる表示、ナビゲーションバーの欠けなどを見つける。問題が見つかれば、AppleのApp Resizabilityスキルを使ってSwiftUIやUIKitのプロジェクトを調べ、修正案を出して再ビルドし、同じ画面で確認まで行う。\n【ポイント・注意点】利用にはClaude Desktop v4.29.0以降と、Xcode 27.1以降およびiOS 27.1のシミュレーターランタイムが必要で、対象はPro、Max、Ultra、Team、Enterpriseの加入者だ。ただしシミュレーターでは、実際の手の届き具合や発熱、細かなアニメーションの感触までは再現できない。初回起動に数分かかる場合もあり、実機での最終確認は別途必要だ。開発者の反応はおおむね好評で、スクロール中や画面遷移の最中に起きる細かなレイアウト崩れを、手を動かさずに見つけられる点が評価されている。一方で、シミュレーターの起動に数分かかることや、スタンバイモードなど一部の機能が制限される点も指摘されている。GitHubも同じ日にiPhone Duo向けの最適化を出しており、折りたたみ端末への対応は業界全体の流れになっている。","2026-11-17","WinCentral","https://thewincentral.com/claude-code-adds-iphone-duo-simulator-foldable-app-testing/"],["11月30日に止まるClaude APIの2つの呼び出し、移行の注意点","11月30日にClaude APIで2種類の呼び出しが止まる。Sonnet 4.5のモデル文字列claude-sonnet-4-5-20250929が廃止され、Opus 4.8でのspeed: fast指定もエラーになる。後継はclaude-sonnet-5-5だが、温度設定や思考予算など旧モデルで通った設定が400エラーになるため、文字列の置き換えだけでは済まない。","\n【概要】2026年11月30日に、Claude APIで2種類の呼び出しが止まる。一つはモデル文字列claude-sonnet-4-5-20250929の廃止で、もう一つはclaude-opus-4-8へのspeed: fast指定の撤廃だ。後継モデルはclaude-sonnet-5-5だが、旧モデルで通った設定のいくつかが新しいモデルでは400エラーになるため、単なる文字列の置き換えでは移行は終わらない。\n【背景】Anthropicは9月30日にSonnet 4.5の利用者へ通知を出しており、11月30日までの61日間が移行期間だった。公式ドキュメントは公開モデルについて少なくとも60日前の通知を約束しており、期間としては十分だったはずだ。問題は、モデル文字列が.envやYAML設定、夜間スクリプト、テストの固定値など、見えにくい場所に散らばっていることで、誰も覚えていないジョブが月曜日に突然エラーを吐く恐れがある。\n【詳細】Sonnet 5.5では、temperatureやtop_p、top_kの指定、thinkingのbudget_tokens、thinkingの無効化、アシスタント発言の先埋め、tool_choiceのtoolやany指定、旧式のoutput_format、古いベータヘッダーが400エラーになる。思考の予算はeffortレベルに置き換え、先埋めはシステムプロンプトへの指示に変える。探し方は、grepでモデル文字列を調べるほか、Claude Consoleの使用量ページからCSVを書き出して、知らないAPIキーによる呼び出しがないかを確認する方法がある。\n【ポイント・注意点】Opus 4.8そのものは廃止されず、fast指定だけが止まる点に注意したい。opus-4-8だけを検索すると問題のない呼び出しまで拾ってしまう。日付はAnthropicが運営するAPIやAWS、Google Cloud、Foundryに適用され、Bedrockなどは独自の日程になる場合がある。Claude Codeやclaude.aiだけを使っている人には関係のない話だ。期限までに一度テスト呼び出しを行い、設定の置き換え漏れがないか確かめたい。","2026-11-17","zemna.net","https://zemna.net/blog/claude-api-two-calls-stop-nov-30/"],["Claude Code 2.1.326、エージェントチームでもCode Mode維持","Claude Code 2.1.326は11月16日公開の更新で、エージェントチームを有効にしていてもCode Modeが維持されるようになった。サンドボックスの書き込み範囲も狭まり、セッションのModsフォルダへの編集では確認が増える。権限や巻き戻し、リモートコントロール、MCPなどの修正も多く含まれている。サンドボックスの書き込み範囲が狭まったほか、権限や巻き戻し、リモートコントロール、MCPなどの修正も多く含まれている。","\n【概要】Claude Code 2.1.326は11月16日に公開された更新で、エージェントチームを有効にした状態でもCode Modeが維持されるようになった。チーム機能を使うとCode Modeが外れてしまう挙動が直り、すでに有効にしているセッションはCode Modeで始まる。あわせてサンドボックスの書き込み範囲が狭まり、権限や巻き戻し、リモートコントロール、MCP、ターミナル画面の修正も多く含まれている。\n【背景】Code Modeは、Claude Codeがコードを書く作業に集中する動作モードで、エージェントチームと組み合わせることで、複数のエージェントに作業を振り分けながら進められる。ところがこれまでは、チームを有効にするとCode Modeが維持されず、期待した動きにならない場面があった。今回の更新は、その組み合わせを正式に使えるようにしたものだ。\n【詳細】サンドボックス側の変更として、サンドボックス化されたコマンドが書き込めるフォルダが減り、セッションのModsフォルダへの編集では確認を求められる回数が増えた。カスタムテーマなどのModsまわりを触る人には、確認が増えたと感じる場面があるかもしれない。起動時にツールルールに関する警告が出る場合もあり、設定の見直しを促される。修正の範囲は広く、権限まわりや巻き戻し、リモートコントロール、MCP、ターミナル画面の表示などに及ぶ。\n【ポイント・注意点】2.1.325と続けての更新で、サンドボックスと権限まわりの挙動が立て続けに変わっている。夜間稼働や定時タスクを使っている場合は、両方の更新内容を確認しておきたい。Code Modeとチームの併用を試すときは、まず小さな作業で動きを確かめ、サンドボックスの書き込み制限で止まる作業がないかを見ておくと安心だ。詳細な変更点は公式のリリースノートで確認できる。今回の変更は2.1.325と続けてのもので、サンドボックスと権限まわりの挙動が立て続けに変わっている。夜間稼働や定時タスクを使っている場合は、両方の更新内容をあわせて確認しておきたい。Code Modeとチームの併用を試すときは、まず小さな作業で動きを確かめ、サンドボックスの書き込み制限で止まる作業がないかを見ておくと安心だ。","2026-11-16","subagentic.ai","https://subagentic.ai/posts/claude-code-2-1-326-code-mode-agent-teams/"],["Claude Code公式ベストプラクティス、CLAUDE.mdは200行以内に","Anthropic公式のClaude Codeベストプラクティスを解説した記事。CLAUDE.mdは200行以内に短く保ち、/clearで会話を区切る、フックや拒否ルール、管理設定で守らせたいことを強制する、/goalや/usageで進み具合を見るなど、毎日の使い方の要点がまとまっている。11月9日時点の内容だ。CLAUDE.mdの書き方や、承認の読み方、設定の育て方まで、実務で役立つ助言が一通りそろっている。","\n【概要】Anthropic公式のClaude Codeベストプラクティスを解説した記事で、毎日の使い方の要点が整理されている。中心になるのは、CLAUDE.mdを200行以内に短く保つこと、/clearで会話を区切ること、フックや拒否ルール、管理設定で守らせたいことを強制すること、そして/goalや/usageで進み具合を見ることだ。11月9日時点の公式の助言をまとめた内容だ。\n【背景】Claude Codeは、頼み方ひとつで出来上がりが大きく変わる道具だ。毎回同じ説明を繰り返したり、終わったはずの作業が終わっていなかったり、やってほしくないことをされたりと、使い始めのつまずきは共通している。公式のベストプラクティスは、そうした失敗を減らすための、指示の出し方と設定の育て方をまとめたものだ。\n【詳細】CLAUDE.mdは、Claudeがすべての会話の最初に読むファイルで、コードを読めば分かることは書かず、推測できないコマンドや決まりだけを短く書く。200行を超えるとルールが埋もれて守られにくくなる。守らせたいことは、まずCLAUDE.mdに1行書き、守られなければフックや拒否ルールへ一段下げる。確認の方法を依頼に含めると、Claudeは作業と確認を自分で繰り返すようになる。/goalで完了条件を決め、/usageで使用量を見ながら回す。\n【ポイント・注意点】強調を重ねた書き方は、かえってルールの過剰な適用を招くため、平易に書くのがよいとされる。フックや拒否ルールは数が増えると保守が大変になるため、例外ゼロで守らせたいものだけに絞ること。個人の好みはCLAUDE.mdではなくCLAUDE.local.mdに分け、共有する設定と分けておくと、チームでの運用もしやすくなる。承認の読み方も要点で、コマンドの実行では何を実行するか、ファイルの編集では変更の範囲、外部ツールではどのサービスに何を読み書きするかを読み、削除や外部送信、本番環境への操作は必ず中身を確認する。10回目あたりからは中身を読まずに押してしまいがちになるため、読むものと任せるものを分けておくのがよい。設定の置き場所は、判断をClaudeに任せるか必ず守らせるかで決め、強制するものは少数に保つのが基本だ。","2026-11-09","AI Business Weekly","https://aibusinessweekly.net/p/claude-code-best-practices"],["Claude Codeを毎日回すコツ、2日目からの手順と設定の育て方","Claude Codeを導入した2日目から毎日回すための手順を、公式ドキュメントに沿って解説した記事。頼む、確認する、計画する、承認する、検証する、区切るという6手順の回し方と、CLAUDE.mdやSkills、Hooks、MCPといった設定の育て方が、実際の画面つきで紹介されている。11月9日更新。検証の強さはプロンプトでの要求から/goalやStopフック、/code-reviewまで段階があり、承認モードや使用量の見方も含めて、工夫が紹介されている。","\n【概要】Claude Codeを入れた2日目から、毎日の仕事でうまく回すための手順を解説した記事だ。作業の回し方は、探索、計画、依頼、承認、検証、区切るという6つの手順で回し、設定はCLAUDE.mdやSkills、Hooks、MCPを育てながら整えていく。公式ドキュメントに沿い、2026年10月にClaude Code v2.1.299で実際に操作した画面つきで説明されている。\n【背景】導入直後は動かせても、毎日使ううちに、毎回同じ説明をしたり、できたと言われて終わっていなかったり、確認の手間が増えたりする。記事では、うまく回らない原因を4つに分けている。情報が欠けている、確認の手段がない、プロンプトだけでは保証できない、時間や使用量が想定以上というもので、それぞれに手順と設定で答える構成だ。\n【詳細】毎日のコツは5つで、確かめる方法を依頼に含める、大きな変更は先に計画を出させる、承認は差分を読んでから行う、別の作業になったら会話を区切る、同じ指摘を2回したらCLAUDE.mdに書く、というものだ。検証の強さは、プロンプトでの要求、/goalによる別モデルでの確認、Stopフック、/code-reviewによる別エージェントの確認と段階がある。承認モードは、autoでは裏の分類器が止めるべき操作だけを止め、manualでは1つずつ確認する。\n【ポイント・注意点】CLAUDE.mdは200行未満に保ち、コードを読めば分かることは書かない。同じ指摘を2回したら1行足すのが育て方の目安で、守られない行は短くするかフックに移す。Skillsはときどき使う長い手順に、Hooksは例外ゼロの手順に向いている。外部のSkillsやMCPを入れるときは、コマンド実行や外部送信が含まれていないか中身を読んでから入れたい。使用量の管理も毎日の回し方の一部で、/usageで何が枠を占めているかを確認し、作業ごとに/clearで区切る、範囲を絞る、使っていないMCPサーバーを切る、出力の多い作業をサブエージェントに任せるといった方法がある。簡単な作業では/effortを下げるか軽いモデルを選ぶとよい。会話が長くなったら、別の作業では/clear、同じ作業の継続では/compact、直近のやり取りの取り消しでは/rewindを使い分ける。","2026-11-09","crystal-method","https://crystal-method.com/blog/claude-code-how-to-use/"],["Claude Codeセッション管理7つのコツ、文脈を節約する","Claude Codeのセッションを上手に扱う7つのコツを紹介した記事。事前に文脈を与え、CLAUDE.mdに知識を置き、作業を検証できる単位に分け、実装前に探索させ、計画モードを使い、Gitで区切りを残し、行き詰まったら新しく始める。/clear、/compact、/rewindの使い分けも解説されている。Anthropicの指針では、文脈とプロンプトキャッシュが費用に与える影響も説明されており、入れるものを意識的に選ぶことが求められる。","\n【概要】Claude Codeのセッションを上手に扱うための7つのコツを紹介した記事で、2026年11月7日公開。文脈を節約しながら集中力を保つことが狙いで、事前に文脈を与え、CLAUDE.mdに知識を置き、作業を検証できる単位に分け、実装前に探索させ、計画モードを使い、Gitで区切りを残し、行き詰まったら新しく始める、という7つが並ぶ。/clear、/compact、/rewindの使い分けも解説されている。\n【背景】Claude Codeのセッションは、最新の発言だけでなく、指示やツール定義、CLAUDE.md、読んだファイルやコマンドの出力まで含んで送られる。画面では短く見えるやり取りでも、裏では大きな入力になっていることがある。Anthropicの2026年8月の指針でも、文脈とプロンプトキャッシュが費用にどう影響するかが説明されており、入れるものを意識的に選ぶことが求められる。\n【詳細】具体的なコツとして、関係するファイルは@で指し、同じファイルを繰り返し指さないこと、検証できる小さな段階に分けて進めること、知らないコードはまず地図を描かせてから直すこと、大きな変更は計画を出させてから進めることが挙げられている。Gitの区切りを残しておけば、疑わしい手順を比べたり、既知の状態に戻したりしやすくなる。行き詰まりの兆候として、却下した提案の繰り返しや、存在しないコードへの言及、進まない応答の繰り返しが挙げられている。\n【ポイント・注意点】/clearは別の作業に移るとき、/compactは同じ作業を短く続けたまま休憩するとき、/rewindは直近のやり取りだけを消すときに使う。プロンプトキャッシュは繰り返しの文脈を安くするが、無料にはならない。Anthropicの数字では、出力トークンは入力の約5倍、キャッシュ読み取りは0.1倍、書き込みは最大2倍の価格とされる。大きなコマンド出力は3万文字を超えるとファイルに書き出される仕組みもあり、必要な部分だけを抜き出す習慣が役立つ。","2026-11-07","rottenwifi","http://rottenwifi.com/how-to-get-more-from-claude-code-sessions-7-practical-workflow-tips/"],["AI支援コーディング10の教訓、事実確認つきで検証","NDC Copenhagen 2026での講演「AI支援コーディングを上達させる10のヒント」を、一次資料で事実確認しながら書き起こした記事。文脈を予算として扱う、ルールファイルを育てる、スキルに投資する、計画から始める、フックで守るなど、10の教訓を検証つきで紹介している。11月6日公開。検証の結果、古くなった主張や言い過ぎの箇所には注記が入り、/goalやRalph Wiggumの自律ループ、/insightsの使い方まで、役立つ内容がそろっている。","\n【概要】NDC Copenhagen 2026でのAleksander Stensby氏の講演「AI支援コーディングを上達させる10のヒント」を、一次資料で事実確認しながら書き起こした記事だ。文脈を予算として扱う、ルールファイルを育てる、スキルに投資する、計画から始める、自分の仕事を確かめる道具を与える、フックで守るなど、10の教訓を検証つきで紹介している。11月6日公開で、講演の40近いコツを10の枠に整理した内容だ。\n【背景】講演は1時間に詰め込まれた濃い内容で、著者はそのままでは戻って読めないため、構成を保ちつつ正確なコマンドと設定を足し、2026年11月時点の資料と突き合わせて事実確認を行った。合っているものはそのままに、古くなったものや言い過ぎのものは注記を入れてある。Claude Codeを中心にしつつ、考え方の多くはCodexやCopilotにも通じる。\n【詳細】目立つ検証として、文脈の窓はOpus 4.6とSonnet 4.6で100万トークンが2026年3月13日に一般提供されたこと、スキルは2025年12月に公開標準となり、CodexやGemini CLI、CopilotなどもSKILL.mdを読むこと、/goalはClaude Codeではv2.1.139で2026年5月11日に追加されたことが確認されている。一方で、スキルをルールファイルに書けば呼び出しが100%になるという主張は、Vercelの2026年1月の評価では56%が未使用で、AGENTS.mdへの記載で起動率が95%以上になったという結果と照らされ、言い過ぎとされた。\n【ポイント・注意点】70%で品質が落ちるという文脈の目安は、著者も講演者も測定値ではなく経験則だと認めており、目安として扱うのがよい。context: forkは会話を見ない隔離されたサブエージェントで動くため、講演の説明は逆だったと訂正されている。Ralph Wiggumの自律ループは、公式プラグインがStopフックで終了を止めて同じ指示を繰り返す仕組みで、回数上限を設けることが勧められている。","2026-11-06","blog.alexrusin.com","https://blog.alexrusin.com/ai-assisted-coding-tips-fact-checked/"],["Claude Code VS Code拡張機能、インストールから設定まで","Claude CodeのVS Code拡張機能について、インストール手順から基本操作、便利な設定、トラブル対処までを解説した記事。拡張機能ビューから公式のものを入れるだけで使え、Proプラン月額20ドル以上が必要で、無料プランでは使えない。承認モードの切り替えやCLAUDE.mdの活用も紹介されている。11月6日公開。パネルの開き方や@メンションでのファイル指定、差分確認の流れも解説され、つまずきやすい場面の対処法まで一通りまとめられている。","\n【概要】Claude CodeのVS Code拡張機能について、インストール手順から基本操作、便利な設定、トラブル対処までを解説した記事だ。拡張機能ビューで「Claude Code」を検索し、発行元がAnthropicの公式のものを入れるだけで使い始められる。利用には月額20ドルのProプラン以上の加入が必要で、無料プランでは使えない。11月6日公開、11月9日更新の内容だ。\n【背景】Claude Codeにはターミナルで使うCLI版と、VS Codeの画面で使う拡張機能版の2種類がある。CLI版は全スラッシュコマンドに対応する一方、拡張機能版は差分を画面で確認しながらクリックで操作できる利点がある。GUIで差分を確認しながら作業したい人には拡張機能版が向いており、高度なカスタマイズをしたい人にはCLI版が向いている。\n【詳細】インストールは4手順で、拡張機能ビューを開き、Claude Codeを検索し、インストールを押して、Sparkアイコンからサインインする。パネルはエディタ右上のSparkアイコン、ステータスバー、アクティビティバー、コマンドパレットから開け、エディタと入力欄の切り替えはCtrl+Escだ。承認モードはManual、Auto、Plan、Edit automaticallyの4種類から選べ、初めての人はManualから始めて慣れたらAutoへ移るのが勧められている。プロジェクトのルートにCLAUDE.mdを置くと、固有のルールを自動で読み込む。\n【ポイント・注意点】VS Codeはバージョン1.94以上が必要で、古い場合は更新すること。似た名前の非公式拡張機能と間違えないよう、発行元がAnthropicであることを確認したい。チェックポイントによる巻き戻しは、2026年11月時点では拡張機能版は追加予定で、CLI版だけが対応している。差分が表示されないときは、ファイルを保存してから操作すると直る場合が多い。日本語のプロンプトはそのまま日本語で返ってくる。","2026-11-06","buzzconne","https://media.buzzconne.jp/claude-code-vscode/"],["Claude Code 30のショートカットと自動化コマンド集","Claude Codeの30のショートカットとスラッシュコマンドを、実際の画面つきで紹介した記事。Shift+Tabでの権限モード切り替え、Escでの停止と巻き戻し、/effortや/compact、/goal、/loop、/scheduleなど、Claude Codeに仕事を丸ごと任せるための操作がまとまっている。11月6日公開。プラグインの読み込みやGitの併用などの注意点も紹介されており、Claude Codeを使いこなしたい人への入門として役立つ。","\n【概要】Claude Codeの30のショートカットとスラッシュコマンドを、実際の画面つきで紹介した記事だ。Shift+Tabでの権限モード切り替え、Escでの停止と巻き戻し、/effortや/compact、/goal、/loop、/scheduleなど、Claude Codeに仕事を丸ごと任せるための操作がまとまっている。2026年11月6日にClaude Code 2.1.312の公式ドキュメントと照らして確認された内容だ。\n【背景】多くの人はClaude Codeを、指示を打って待つだけのチャット欄のように使っている。記事の狙いは、そこから一歩進み、Claude Codeに仕事を丸ごと任せられる使い方へ引き上げることだ。操作は、速く指示を入れる、動きながら方向を変える、考える深さと記憶を整える、一度教えたら繰り返さない、放っておいても回る、という5つのまとまりに分けられている。\n【詳細】速くする操作として、Shift+Tabで権限モードを切り替え、Plan modeで計画だけ出させ、@でファイルを指定し、!でシェルに入り、Ctrl+Vで画面を貼り、/voiceで話しかける方法が紹介されている。動いている最中はEscで止め、Escを2回押すと巻き戻しができ、Ctrl+Sで入力をしまい、Ctrl+Rで過去の指示を探せる。考える深さは/effortとultrathinkで調整し、記憶は/clear、/compact、/contextで整える。教える仕組みは/initによるCLAUDE.md、スキル、プラグイン、MCP、サブエージェントだ。\n【ポイント・注意点】放っておいても回る仕組みとして、フック、/goal、/code-review、claude -p、/loop、/scheduleが挙げられている。/scheduleはクラウドで動き、ノートパソコンを閉じていても実行されるが、研究プレビューで有料プラン向けだ。プラグインは自分の権限で動くため、入れる前に中身を読むこと。巻き戻しはシェルの変更を追わないため、Gitの併用は欠かせない。ボーナスとして、この動画自体がClaude Codeによって作られたという話も紹介されている。","2026-11-06","Shipping Skool","https://www.shippingskool.com/blog/claude-code-tips-shortcuts-slash-commands"]],"cnc":[["卓上CNC「Makera A1S」登場、金属切削を手元に","MakeraがFormnext 2026で新型卓上CNC「A1S」を発表した。11月18日から予約受付を開始する。アルミや真ちゅうに加え鋼材まで切削できる剛性をうたい、12本の自動工具交換やスマートビジョンによる自動位置決めなど、産業レベルの機能を机の上に持ち込む設計だ。会場はメッセ・フランクフルトのホール12.0、ブースB01で実機を見られる。金属切削の強化と段取りの自動化が狙いで、正式発表で詳細が明かされる。","\n【概要】Makeraはドイツ・フランクフルトで開かれるFormnext 2026で、新型卓上CNC「A1S」を披露した。11月18日から予約受付が始まり、正式発表も同日に行われる。コンパクトな机上サイズながら、アルミや真ちゅう、さらに鋼材まで切削できる剛性を備え、試作ラボやメイカースペース、製品設計チームや小ロット製造を狙う。会場はメッセ・フランクフルトのホール12.0、ブースB01だ。\n【背景】卓上CNCは木材や樹脂、軽いアルミ加工が中心だったが、近年は金属切削への要求が高まっている。MakeraはこれまでCarveraやCarvera Air、Z1を展開し、机の上で使えるCNCを広げてきた。A1Sはその流れに位置する新型で、同社のジョシュ・チャンCEOは「本物の製造能力は工場の門の向こうにあるべきではなく、作り手の机の上にあるべきだ」と語っている。\n【詳細】スピンドルは振動を抑えた安定出力をうたい、精密なアルミ・真ちゅう加工と鋼材への対応を両立する。構成は手動で素早く工具を替えるクイックツールチェンジ版と、12本の自動工具交換版の2種類で、穴あけ、ミーリング、彫刻、仕上げを段取り替えの手間なく切り替えられる。微量潤滑が切削部へ細かいミストを送り、仕上げ面の向上と工具寿命の延長を図る。スマートビジョンがワークの位置を自動で見つけ、自動プロービングで高さ検出や水平出し、位置合わせを行うため、段取りの手間が大きく減る。A1SはMakeraの製品群の中でも金属加工に重きを置いた位置づけで、試作から小ロット生産までを机の上でこなす想定だ。会場では実機の展示に加え、加工の様子も見られる見込みで、導入を検討する人は加工品質を自分の目で確かめられる。\n【ポイント・注意点】詳しい仕様や価格は11月18日の正式発表で明らかになる。発表時点では加工範囲やスピンドル出力などの数値は示されていない。会場では実機展示があるため、導入を検討する人は現地での確認が確実だ。予約開始直後は注文が集中する可能性もあり、公式サイトの情報をこまめに見るのがよい。金属切削の実力は発表後のレビューで確かめたい。","2026-11-17","PR Newswire","https://www.prnewswire.com/news-releases/makera-showcases-the-power-packed-a1s-desktop-cnc-at-formnext-frankfurt-2026-302942185.html"],["チタン板にQRコードを彫刻、販売用バナーを自作","Atommに投稿された作例では、対面販売用のバナーを厚さ1mmのチタン板にレーザー彫刻している。xToolのF2 Ultra MOPAレーザーを使い、ロゴは出力86%、QRコードと案内文は85%で加工した。完成したQRコードは問題なく読み取れたという。AIで画像を整え、背景除去や切り抜きを経て彫刻する手順も紹介されている。作例ページにはAI活用の手順も記されており、同じ手法で自分のデザインにも応用できる。","\n【概要】Atommの作例は、対面販売で使う卓上バナーを、厚さ1mmのチタン板にレーザー彫刻した事例だ。xToolのF2 Ultra MOPAレーザーを使い、ロゴとQRコード、案内文を彫り込んだ。完成したQRコードは問題なく読み取れ、チタンへの彫刻もきれいに仕上がったという。AIで画像を整える手順も含めて公開されている。\n【背景】マルシェや展示会など対面販売の場では、支払いやSNSへ誘導するQRコード付きの案内が欠かせない。紙のPOPは汚れやすく傷みやすいが、金属板なら長く使える。作者はCustomthingsというサービスで作ったバナーのデザインを、レーザー彫刻用に作り替えた。販売現場で繰り返し使える丈夫な案内板が狙いだ。\n【詳細】まずCustomthingsでバナーを作り、Atomm AIで背景色を除去する。背景除去ツールではうまくいかず、AIチャットに指示して色を消したという。次に画像をできるだけ小さく切り抜き、元のロゴファイルを重ねて配置する。QRコードと案内文は大きく見やすく整えた。彫刻の設定はロゴが出力86%、QRコードと案内文が85%で、そのほかはxToolの標準設定のままだ。チタン板には、xToolの類似プロジェクト向け設定を参考にしたという。作者はxToolの類似プロジェクト向け設定を参考にしたと述べており、出力86%と85%の違いはロゴと文字の見え方を調整したものだ。QRコードは読み取りが命のため、彫刻後に実際にスマホで読み取って確認している。チタン板は厚さ1mmのTA1材で、販売現場で繰り返し使う看板として十分な丈夫さがある。\n【ポイント・注意点】AIによる背景除去では、ロゴの中の緑色の「&」が消えてしまうトラブルがあった。作者は一つ前の版を選び直して修正している。AIで整えた画像は必ずプレビューで確認し、QRコードが読み取れるか試すことが大切だ。金属への彫刻は機種や素材で結果が変わるため、端材での試し彫りをすすめたい。金属板への彫刻は、出力が高すぎると焦げや変色が出ることもあるため、設定は少しずつ試すのがよい。","2026-11-17","Atomm","https://www.atomm.com/project/316844-customthings"],["入門機でも多軸加工、中村留の複合加工機を紹介","MTDCNCが中村留精密工業の入門向け複合加工機を紹介した。ツインスピンドルと2タレット、同時加工を備え、旋削・ミーリング・穴あけを1台でこなす。ワークの段取り替えを繰り返さずOP10からOP40まで進められ、ライブツーリングや自動パーツキャッチャー、バー送り装置の追加も可能。省人化と精度の安定を狙う現場向けの内容だ。取材ではPhillips社の担当者が段取り削減と精度の安定を利点として説明している。","\n【概要】MTDCNCの動画記事が、中村留精密工業の入門向け複合加工機を取り上げた。旋削、ミーリング、穴あけを1台でこなし、ワークを何度も段取り替えすることなくOP10からOP40まで進められる。ツインスピンドルと2つのタレット、同時加工が特長だ。手作業の段取りを減らし、加工精度の安定を狙う内容になっている。\n【背景】多品種少量の現場では、工程をまたぐ段取り替えが時間と精度のロスになる。複合加工機は1台で複数の工程を終えられるが、価格の高さから導入をためらう現場も多い。入門機の位置づけで複合加工の利点を手に入れられるかが、この記事の関心だ。取材はMTDCNCのタニシュカ・シン氏が行い、Phillips社の担当者が説明している。工程集約は、段取り替えの回数を減らすだけでなく、仕掛品の滞留や運搬の手間も減らす。こうした利点が、入門機にも求められるようになっている。\n【詳細】紹介された機種はツインスピンドルと2タレットを備え、同時加工ができる。ライブツーリングにより回転工具での加工も可能で、自動パーツキャッチャーが完成品を受け取る。バー送り装置を追加すれば、材料供給の自動化にも対応する。取材ではPhillips社の担当者が、段取り回数の削減と加工精度の安定を利点として説明している。工程を集約することで、ワークの付け替えに伴う誤差も抑えられる。複合加工機では、ワークを一度取り付ければ複数の工程を続けて行えるため、付け替えのたびに生じる位置ずれを抑えられる。入門機という位置づけながら、ツインスピンドルと2タレットによる同時加工は上位機と共通する考え方で、1台で多くの工程をこなす現場の省人化につながる。\n【ポイント・注意点】記事は動画紹介が中心で、機種名や加工範囲、価格などの具体的な仕様は示されていない。導入を検討する場合は、Phillipsや中村留の公式情報で型式と仕様を確認したい。入門機とはいえ複合加工機の据え付けや保守には相応の準備が要るため、現場の体制と合わせて判断するのがよい。","2026-11-17","MTDCNC","https://mtdcnc.com/event/mtdcnc/who-says-entry-level-means-basic-take-a-look-at-nakamura-tomes-multitasking-technology/"],["卓上CNCが「3Dプリンター化」、IFAで見えた新潮流","IFAベルリン2026の取材記事が、卓上CNCの新しい潮流を伝えた。自動工具交換や簡単なCAMソフトを備え、3Dプリンターのように手軽に使える機械が増えている。TwoTreesのED1やToolDance X1、InfiMaker K1、Mova AtomformのForgixなど新規参入も相次ぎ、xToolやCreality Falconの新型レーザーも並んだ。手軽さと自動化が競争の軸になっている。","\n【概要】IFAベルリン2026の取材記事は、卓上CNCの分野で「3Dプリンター化」とも呼べる潮流が進んでいると伝えた。自動工具交換や使いやすいソフトを備え、専門知識がなくても扱える機械が増えている。TwoTrees、ToolDance、InfiMaker、Mova Atomformといった新規参入も目立った。レーザー加工機の進化も並行して紹介されている。\n【背景】3DプリンターはBambu Labなどの登場で、初心者でもすぐ使える方向へ大きく進んだ。同じ流れが今、切削加工にも来ている。記事はIFAの「Creators」ホールにレーザー加工機や卓上CNCが集まり、製造ツールの裾野が広がっている様子を伝えている。作り手向けの機械が、家電のように身近な存在になりつつある。\n【詳細】TwoTreesは3Dプリンターから撤退し、600Wスピンドルと5本の自動工具交換を備えた卓上CNC「ED1」を出した。想定価格は約2700ドルで、初心者向けをうたう。ToolDance X1は9本の自動工具交換を持ち、4軸・5軸への拡張やライダーによる計測、フラッドクーラントに対応する。InfiMaker K1は5軸の卓上CNCで、6スロットの自動工具交換を備える。Mova AtomformのForgixは500Wスピンドルと6本の自動工具交換、構造化光による素材検出が特長だ。レーザーではxToolやCreality Falconの新型が、デュアルレーザーや高速彫刻を披露した。MakeraのブースではCarveraやAir、Z1が並び、プロジェクト共有の仕組み「Makerables」も紹介された。CrealityやPrusaといった3Dプリンター勢も新型を出しており、切削と造形の両方が手軽になる流れがIFA全体で見られた。\n【ポイント・注意点】記事は展示会の取材まとめで、多くは発売前の発表や試作段階の情報だ。価格は「約」や「想定」の数字で、発売時期も変わる可能性がある。自動化をうたう機種ほど、実際の使い勝手は実機レビューで確かめたい。気になる機種は公式発表を追うのが確実だ。","2026-11-17","Vinjo Blog","https://blog.vinjo.co.in/blog/2026-11-15-closer-look-at-the-creality-k3-an-atomform-update-next-gen-lasers-and-the-bambu-lab-ification-of-cnc-is-coming-whether-you-want-it-or-not-all3dp"],["AI CAMソフトを4分類で比較、料金と選び方を整理","KinetiCADのブログが、2026年のAI CAMソフトを4つの型に分けて比較した。既存CAM内で動くCloudNCやToolpathなどのコパイロット、Mastercam Copilotなど大手CAMの内蔵機能、見積り専用ツール、CAMを使わずNCまで作る方式だ。CloudNCの月額は11月4日時点で995〜1499ドル、Toolpath Proは月125ドルなど、料金も具体的に示している。","\n【概要】KinetiCADの解説記事が、2026年のAI CAMソフトを4つの型に分けて整理した。既存のCAMの中で動くコパイロット型、大手CAMに内蔵されたAI機能、見積り専用ツール、そしてCAMを使わずにNCプログラムまで作る方式だ。各製品の料金や対応範囲を、公式サイトで確認した情報として示している。\n【背景】CNC加工のプログラミングは人手不足が課題で、AIによる自動化への関心が高い。ただ製品ごとに動く場所やできる範囲が違い、どれを選べばよいか分かりにくい。記事は自社製品の立場を明かしたうえで、他社製品も公式情報に沿って説明している。比較の基準日は11月4日と11月10日だ。\n【詳細】コパイロット型では、CloudNC CAM AssistがFusionやMastercam、Siemens NX、GibbsCAM、SolidCAMで動き、3軸と3+2軸のミーリングに対応する。11月4日時点のJob Shopプランは月額995〜1499ドルだったが、11月10日には金額表示が消えたという。ToolpathはFusion内で3軸・3+2軸のツールパスを作り、Proプランは月額125ドルだ。Mastercam 2026.R2ではCopilotが正式版となり、保守契約の範囲で使える。記事は、旋盤や複合加工への対応はまだ薄い点も指摘している。記事は各製品の価格を公式サイトで確認した日付とともに示しており、CloudNCの料金表示が11月4日から10日の間に変わった点も記録している。見積りツールではPaperless PartsのWingmanが図面の幾何公差まで読み取る点や、CloudNCのQuote AgentがCADと図面から見積もる点が紹介されている。\n【ポイント・注意点】記事はKinetiCADの自社ブログで、同社製品を有利に描く立場がある。料金は確認日時点のもので、すでに変わっている場合がある。AI CAMは反復作業を肩代わりするもので、プログラマーの確認や承認は今も必要だと記事は述べている。導入前には自社の部品で試作し、対応範囲を確かめるのがよい。","2026-11-16","KinetiCAD","https://kineticad.ai/blog/ai-cam-software"],["黒PLAへのレーザー彫刻、最適設定は出力10%だった","Hexamakeのブログが、3Dプリントした黒PLAのレールにxTool S1の2W赤外線レーザーで彫刻した記録を公開した。出力5〜100%、速度100〜200mm/s、線密度100〜300本/cmで試し、最適は出力10%、速度150mm/s、線密度300本/cmだった。ジグで18本をまとめて彫刻し、約1時間かかった。モジュール交換で座標系が変わる注意点も紹介している。","\n【概要】Hexamakeのブログが、3Dプリントした黒PLA製レールに、xTool S1の2W赤外線レーザーでロゴやQRコードを彫刻した記録を公開した。出力や速度、線密度を変えて試し、最適な設定は出力10%、速度150mm/s、線密度300本/cmだった。ジグを使い、長さ100mmのレール18本をまとめて彫刻している。\n【背景】HexamakeのHexarailは、3Dプリントしたモジュール式レールで、ラズパイのラックなどに使われている。黒PLAのレールは長さ30〜250mmで、これまで無地だった。作者は裏面にロゴとQRコード、説明文を彫り、拾った人が何か分かるようにしたかった。前面はモジュールを取り付ける面のため、彫刻は裏面に入れる。\n【詳細】まずレールを平らに固定するジグを作った。ハニカムの上に置くだけでは傾き、彫刻が不均一になるためだ。ジグに並べれば一度にまとめて彫れる。設定探しは出力10%、速度100mm/s、線密度100本/cmから始め、最初の結果から十分きれいだった。そこから出力5〜100%、速度100〜200mm/s、線密度100〜300本/cmで試し、線密度を上げるほど細部が鮮明になり、速度を上げるとにじむことが分かった。出力は5〜50%で差が小さく、100%ではPLAが焦げた。最適設定で長さ100mmのレール18本を彫るのに約1時間かかった。HexarailのレールはMakerWorldでも公開されており、長さ30〜250mmの非商用ライセンスだ。作者は次にコネクターモジュールの彫刻に挑む予定で、平らに置けない部品にはそれぞれ専用のジグが必要になると述べている。QRコードを彫ることで、部品そのものがプロジェクトページへの案内になる。\n【ポイント・注意点】S1では2W赤外線モジュールと20Wモジュールで座標系が違い、Yの範囲が330mmから319mmに変わり、位置もずれる。モジュールを替えるときは、以前のジグや保存位置をそのまま使わず、発射位置を確認する必要がある。ジグ作りでは、板の工場端を基準にするとずれるため、レーザーで外形を切って基準を取るのがよいとしている。","2026-11-15","Hexamake","https://hexamake.tech/2026/11/14/e18-laser-engraving-black-pla-2w-ir-hexarail-rails/"],["LEDランタンのレーザーカットデータ、SVGとDXFで公開","Atommで、LEDランタンのレーザーカット用デザインデータが公開された。109×109×166mmのランタンで、3mmの黒MDFから切り出す。4枚の側面パネルをはめ込み式で組み立て、松の木の窓とアールデコ風の彫刻をあしらう。SVG・DXF・PDFの組み立てガイド付きで、CO2レーザー40W以上またはCNCルーターに対応。制作時間は20〜35分の目安だ。難易度は中程度で、冬のインテリアや贈り物に向く。","\n【概要】Atommで、LEDランタン「Halo Lantern」のレーザーカット用デザインデータが公開された。109×109×166mmのランタンで、3mmの黒MDFから切り出す。SVGとDXFのデータに加え、PDFの組み立てガイドが付く。LEDティーライトを中に入れて光らせる仕組みだ。\n【背景】レーザー加工の作例サイトでは、切り出して組み立てるだけの季節の小物が人気だ。LEDティーライトを中に入れて光らせるランタンは、冬のインテリアや贈り物に向く。パラメトリック設計のため、サイズの調整もしやすいとされる。LEDの光が窓から漏れる様子を楽しむ作りだ。レーザー加工では、切り抜きと彫刻を組み合わせた小物が作りやすく、短時間で完成する。ランタンは光る仕組みがあるため、完成後の満足感が高く、季節の飾りとして繰り返し使える。データ配布の形なら、自分の機械で何度でも作れる。\n【詳細】側面パネル4枚をはめ込み式で組み立てる。松の木の切り抜き窓から光が漏れ、アールデコ風の扇形の彫刻が表面を飾る。推奨はCO2レーザー40W以上で、カーフ（切りしろ）は約0.15mm。CNCルーターでも加工できる。難易度は中程度で、切断と組み立てに20〜35分かかる目安だ。LEDティーライトは付属しない。ランタンの光は松の木の窓から漏れ、彫刻の扇形は表面の飾りとして光らない。はめ込み式のパネルを差し込んで組み立てる。LEDティーライトは別途用意する。黒MDFの切り口は焦げ色が出やすいため、仕上げに軽く磨くと見た目が整う。\n【ポイント・注意点】このデータは自動のベクトル検査には通っているが、実際に試し切りされたものではないと明記されている。実物写真ではなくAIで作ったイメージ画像のため、光り方の印象は実際と違う可能性がある。自分の機械のカーフや板厚に合わせて調整し、まず端材で試し切りするのがよい。はめ込みのきつさは板厚やカーフで変わるため、きつすぎる場合はやすりで調整し、ゆるい場合は接着剤で補うとよい。切り口の焦げは、出力や速度の調整でも抑えられる。","2026-11-12","Atomm","https://www.atomm.com/project/285744-halo-lantern-laser-cut-led-night-light-svg-dxf"],["彫刻リングのコースター4枚、レーザーカットデータ公開","Atommで、レーザーカット用のコースターデザイン「Halo Coasters」が公開された。直径117mmの扇形コースター4枚セットで、3mmの白樺合板から切り出す。同心円の彫刻模様が特長で、CO2レーザー40W以上またはCNCルーターに対応。切断時間は10〜15分、難易度はやさしい。SVG・DXFとPDFガイド付きのデジタルダウンロードだ。難易度はやさしいため、レーザー加工の入門作にも向く。","\n【概要】Atommで、レーザーカット用のコースターデザイン「Halo Coasters」が公開された。直径117mmの扇形コースター4枚セットで、3mmの白樺合板から切り出す。同心円の彫刻模様が特長だ。SVGとDXFのデータにPDFガイドが付く。扇形の縁と同心円の彫刻が組み合わさり、シンプルながら目を引く仕上がりになる。\n【背景】レーザー加工の入門作として、コースターは手軽で失敗しにくい定番だ。短時間で作れて、贈り物や販売にも向く。AtommではSVGとDXFのデータを配布し、作り手が自分の機械に合わせて使える形が広がっている。扇形の縁取りが食卓を華やかにする。コースターは材料が小さく、切断時間も短いため、初めてのレーザー加工にも向く。失敗しても材料の損失が少なく、設定の試し切りにも使いやすい。デザインを変えれば、季節や贈る相手に合わせた品も作れる。\n【詳細】4枚の扇形コースターに同心円の彫刻を入れる。推奨はCO2レーザー40W以上で、カーフは約0.15mm。CNCルーターでも加工できる。切断時間は10〜15分で、難易度はやさしいとされる。仕上げは縁を軽くやすり、オイルを塗る。SVGとDXFに加え、PDFのガイドが付くデジタルダウンロードで、実物は届かない。コースターは水滴や熱からテーブルを守る実用品で、彫刻の模様が食卓のアクセントになる。白樺合板は彫刻の色が出やすく、オイル仕上げで木目が引き立つ。4枚セットで作れば、来客用にもそろえられる。\n【ポイント・注意点】このデザインは自動のベクトル検査には通っているが、実際に試し切りされたものではないと明記されている。画像はAIで作ったイメージで、実物の色や質感とは違う場合がある。自分の機械のカーフや板厚に合わせて調整し、端材で試し切りしてから本番の板を切るのがよい。オイルを塗る際は、彫刻の溝にたまらないよう薄く伸ばし、乾かしてから使うのがよい。縁のやすりがけは、ささくれを取る程度にとどめると形が崩れない。完成後は水拭きで手入れでき、日常使いに十分な耐久性がある。","2026-11-12","Atomm","https://www.atomm.com/project/285871-halo-coasters-laser-cut-coasters-svg-dxf"],["EDMにロボット自動化、3交代の無人運転をねらう","MTDCNCが、三菱電機の新型ワイヤ放電加工機MG12とTezmaksanのロボット自動化システムCubeBOXの組み合わせを紹介した。小さな設置面積と使いやすいソフトで、3交代24時間の稼働を目指す。段取り替えの短縮と、専門的なロボット操作の知識への依存を減らす点が利点だ。CubeBOXは48か国で稼働している実績がある。取材では三菱電機とTezmaksanの担当者が、稼働率の向上と人手不足の解消を語っている。","\n【概要】MTDCNCの動画記事が、三菱電機の新型ワイヤ放電加工機MG12と、Tezmaksanのロボット自動化システムCubeBOXの組み合わせを紹介した。小さな設置面積と使いやすいソフトで、3交代24時間の稼働を目指す内容だ。ロボットによるワーク搬送で、夜間や休日の無人運転を広げる狙いがある。\n【背景】放電加工の現場では、熟練者の不足と稼働率の向上が課題だ。機械が止まる夜間や休日にも動かせれば生産性は上がるが、ロボットの操作には専門知識が要る。使いやすい自動化装置への関心が高まっている。段取り替えの手間も、稼働率を下げる要因の一つだ。自動化の装置は高価で操作も難しいという印象があったが、CubeBOXのように使いやすさを前面に出す製品が増えている。現場の人手不足が続く中で、夜間や休日の稼働を広げる動きは今後も続くとみられる。\n【詳細】CubeBOXはロボットによるワークの搬送を自動化し、段取り替えを短くする。専門的なロボット操作の知識への依存を減らせるのが利点とされる。取材では三菱電機とTezmaksanの担当者が、機械の稼働率向上と人手不足の解消を語っている。TezmaksanのCubeBOXは48か国で稼働している実績がある。ワイヤ放電加工は、硬い材料や細かい形状の加工で使われる。ロボットによる搬送が加われば、加工が終わったワークの取り出しと次のワークの取り付けを自動で行える。段取り替えの短縮は、1日の加工時間を増やす直接の効果になる。CubeBOXは小さな設置面積をうたい、既存の機械の横に置きやすい点も利点とされる。無人運転では、加工中の異常検知や停止の仕組みも重要になる。\n【ポイント・注意点】記事は動画紹介が中心で、MG12やCubeBOXの詳しい仕様や価格、導入効果の数値は示されていない。「生産性が上がる」「人手不足がなくなる」という言葉は関係者の発言で、裏づけとなる測定値は出ていない。導入を検討する場合は、実機の見学や試加工で効果を確かめ、公式情報で仕様を確認したい。","2026-11-12","MTDCNC","https://mtdcnc.com/event/mitsubishi-electric-europe-b-v/why-add-a-cubebox-from-tezmaksan-to-your-edm-machine/"],["Makera、新型卓上CNC「A1S」を予告、金属切削を強化","Makeraが新型卓上CNC「A1S」のティザーを公開した。11月11日の同社SNS投稿で「金属加工をさらに先へ」とうたい、Formnext 2026での発表を予告した。仕様は未公開だが、「より強い切削、より賢い段取り、より滑らかな作業」を掲げる。ティザー画像からは従来のZ1より大きい姿がうかがえる。既存のCarveraとの位置づけは不明だ。ティザー画像ではZ1より大きい姿がうかがえ、正式発表への期待が高まっている。","\n【概要】Makeraが新型卓上CNC「A1S」のティザーを公開した。11月11日の同社SNS投稿で、金属加工をさらに先へ進める次世代機として紹介し、Formnext 2026での発表を予告した。仕様はまだ公表されていない。ティザー画像からは、従来のZ1より一回り大きい姿がうかがえる。\n【背景】MakeraはCarveraやCarvera Air、Z1といった卓上CNCを展開してきた。Z1は発売から間もないため、A1Sがその後継か、Carvera系の上位機か、まったく別の製品かに関心が集まっている。卓上CNCの金属切削をめぐる競争も激しくなっている。卓上CNCの市場では、木材や樹脂の加工だけでなく、アルミや鋼材の切削への関心が高まっている。A1Sがどの層を狙うかは、正式発表の仕様と価格で見えてくる。\n【詳細】Makeraの投稿は「より強い切削、より賢い段取り、より滑らかな作業」を掲げる。OC3Dの記事は、机上サイズの枠は保ちつつ、金属切削の強化と段取りの自動化が狙いだと読み解いている。Formnextは11月17日から始まるため、発表まで長く待たずに済むとしている。価格や加工範囲、発売時期はこの時点では分からない。MakeraはこれまでもSNSで新製品の予告を行ってきた。A1Sのティザーは、金属切削の強化を前面に出しており、卓上CNCの用途が試作から金属部品の小ロット生産へ広がる流れを映している。Formnextは11月17日から20日まで開かれ、会場ではA1Sの実機も展示される。\n【ポイント・注意点】ティザー段階の情報で、性能や価格は未確認だ。SNSの文言や画像からの推測が中心で、Carvera Airの改良版という見方も記事の推測にすぎない。導入を考える人は、正式発表の仕様を待って判断するのがよい。なおA1Sは11月18日から予約受付が始まる予定だと、後に公式発表で明らかになった。ティザー情報だけで購入を決めるのは早計で、正式発表の仕様や価格、発売時期を待つのが確実だ。","2026-11-11","OC3D","https://overclock3d.net/news/misc/makera-teases-its-a1s-desktop-cnc/"],["窓付きスマホスタンド、合板を重ねて作る作例","Atommで、切り抜き窓付きのスマホスタンドの作例が公開された。3mm合板を2枚重ねて貼り合わせ、窓からのぞく絵柄を差し替えられる。iPhone 17以上の標準的な大きさのスマホに対応し、組み立て用の位置合わせ治具も付く。xTool S1でレーザーカットと彫刻を行い、合板でも無垢材でも作れる。切り抜きと彫刻のファイルを差し替えれば、絵柄は何通りにも変えられる。","\n【概要】Atommで、切り抜き窓付きのスマホスタンドの作例が公開された。3mm合板を2枚重ねて貼り合わせ、窓からのぞく絵柄を差し替えられる。xTool S1でレーザーカットと彫刻を行った。組み立て用の位置合わせ治具も付いている。\n【背景】スマホスタンドはレーザー加工の定番だが、窓から絵柄を見せる仕組みにすると、季節や好みで表情を変えられる。作者はタータンチェックの布柄を背景に使い、窓から見せる作例を作った。xToolのクリエイターツールの型を元にしている。スマホスタンドは、机の上で使う小物として需要が高く、レーザー加工の作例も多い。窓付きの仕組みは、スタンドとしての機能に飾りの楽しさを加える工夫で、販売品としても目を引きやすい。\n【詳細】スタンドの立てかけ部分は3mm材を2枚重ねて貼り合わせ、窓の裏側に絵柄を貼ってから組み立てる。切り抜きと彫刻のファイルを差し替えれば、絵柄は何通りにも変えられる。標準的な大きさのスマホ（iPhone 17以上）に対応する。組み立て用の位置合わせ治具が付いており、貼り合わせのずれを防ぐ。はめ込み式の部品は材料の厚みに合わせて作られており、厚みを変える場合はxTool Studioのスロットサイズ変更機能で調整する。窓から見える絵柄は、季節の写真や推しのイラスト、店のロゴなど自由に選べる。合板に絵柄を貼る方法は、印刷では出せない立体感のある仕上がりになる。立てかけ部分を2枚重ねにすることで、窓の縁に厚みが出て見た目も安定する。窓の大きさはスマホの画面に合わせて調整でき、立てかけたまま動画を見る使い方もできる。\n【ポイント・注意点】はめ込み部品は3mm材に合わせた寸法のため、厚みを変えるときは必ずスロット調整が必要だ。合板でも無垢材でも作れるが、無垢材は反りや厚みのばらつきに注意したい。貼り合わせは位置合わせ治具を使い、接着剤がはみ出さないよう少量ずつ塗るのがよい。絵柄を貼る際は、窓の位置に合わせて仮置きし、ずれないよう確認してから貼るとよい。接着剤は薄く均一に塗り、はみ出しを防ぐ。","2026-11-11","Atomm","https://www.atomm.com/project/288272-phone-stand-with-cutout-and-engraving"],["和柄コースター10種、3mm合板のレーザーカット作例","Atommで、和柄のコースター10種をまとめたレーザーカット作例が公開された。波や花の文様など日本の伝統柄を、3mmのシナ合板に彫刻する。xTool M2で加工し、XS・PDF・JPG形式のデータが付く。茶の時間や贈り物に向けた内容で、シリーズとして03や04も続いている。10種をまとめたデータは、セット販売や試し作りに向く。作者はArq_Salazarで、シリーズとして03や04も公開している。","\n【概要】Atommで、和柄のコースター10種をまとめたレーザーカット作例「Wagara 02」が公開された。波や花の文様など日本の伝統柄を、3mmのシナ合板に彫刻する。xTool M2で加工する作例だ。10種を1つのプロジェクトにまとめた形になっている。丸いコースターに彫刻を入れ、茶の時間やコーヒーの場で使う想定だ。\n【背景】和柄は海外の作り手にも人気があり、コースターは手軽な贈り物や販売品として定番だ。10種をまとめたデータは、セット販売や試し作りに向く。同じ作者のシリーズとして、Wagara 03や04も公開されている。和柄のコースターは、海外の作り手の間でも人気が高い。日本の文様は直線と曲線の組み合わせが多く、レーザー彫刻の線の美しさが映える。セットでそろえることで、贈り物としての価値も高まる。\n【詳細】波や花のメダリオンなど、表情の違う和柄10種を1つのxTool Studioプロジェクトにまとめた。材料は3mmのシナ合板で、データ形式はXS・PDF・JPG。丸いコースターに彫刻を入れ、茶の時間やコーヒーの場、手作りの贈り物に使う想定だ。作者はArq_Salazarで、Atomm Exclusiveの作例として公開されている。和柄は波や花の文様など、日本の伝統的な柄が海外でも親しまれている。コースターは日常使いの小物で、和柄の彫刻が食卓に落ち着いた彩りを添える。10種をまとめて作れば、気分や季節で使い分けられる。コースターは丸い形のため、彫刻の中心合わせがしやすく、初めての人でも位置ずれしにくい。\n【ポイント・注意点】データのライセンスは標準ライセンスで、利用範囲を確認してから販売用に使うのがよい。彫刻の濃さや切断条件は機械や板の状態で変わるため、端材で試してから本番を切るのが確実だ。和柄の細かい線は、彫刻の線密度や速度で仕上がりが変わるため、設定を少しずつ調整したい。細かい文様は彫刻の線密度を高めると鮮明になるが、速度が速すぎるとにじむため、端材で試してから本番を切るのがよい。","2026-11-11","Atomm","https://www.atomm.com/project/297799-wagara-02-10-japanese-pattern-coasters"]],"cricut":[["クリカットで木材カット！写真入りオーナメントの作り方","クリカットで木材を切り、写真入りの木製オーナメントを作る方法を紹介する記事。Maker系はナイフブレードでバルサ材を、ExploreやVentureはディープポイントブレードで木材ベニヤを切る。長方形・丸・四角の3種類の無料デザインがあり、写真とビニール文字を組み合わせて記念品に仕上げられる。初めて木材に挑戦する人にも分かりやすい内容だ。刃のキャリブレーションやスターウィールの移動など、初めての人がつまずきやすい点も解説されている。","\n【概要】クリカットで木材を切り、写真入りの木製オーナメントを作る方法を紹介する記事である。使う機械と刃の組み合わせが大切で、Maker系はナイフブレードでバルサ材を切り、ExploreやVentureはディープポイントブレードで木材ベニヤを切る。無料デザインは長方形、丸、四角の3種類があり、写真とビニールの文字を組み合わせて自分だけの記念品にできる。初めて木材を切る人でも、手順に沿って進めれば完成までたどり着ける内容になっている。\n【背景】紙やビニールが中心のクリカットでも、対応する刃を使えば木材も切れる。ただし機械ごとに切れる木材が違い、厚いバルサ材はMaker系とナイフブレードの組み合わせが必要になる。薄い木材ベニヤならExploreやVentureでも切れるため、自分の機械に合う材料を選ぶことが出発点になる。木材は紙より準備と忍耐が要るが、仕上がりは本物の木の質感が楽しめる。\n【詳細】まず無料デザインをDesign Spaceに読み込み、写真をアップロードして切り抜き部分に合わせる。写真はガイド図形と重ねて位置を調整し、スライス機能で余分な部分を切り取る。バルサ材は紫のStrongGripマットに載せてマスキングテープで固定し、ナイフブレードで何度も通って切る。木材ベニヤはディープポイントブレードで切る。切り終わったら写真を貼り、ビニールで年号や文字を付け、リボンを通して完成させる。\nなお、ナイフブレードを使う前にはDesign Spaceの案内に沿ってキャリブレーションを行う場面があり、コピー用紙で試し切りをする手順も紹介されている。バルサ材は紫のStrongGripマットに載せ、マスキングテープで固定してから切る。切り終わった木材は写真やビニールと組み合わせることで、家族の思い出を残す飾りになる。完成したオーナメントはツリーに飾るだけでなく、贈り物としても使える。\n【ポイント・注意点】切る前にスターウィールを端に寄せておくことと、カットが終わってもすぐマットを外さず、角を持ち上げて切り残しがないか確かめることが大切だ。切り残しがあれば同じ位置でもう一度切れる。木材は繊維で毛羽立つことがあるので、軽くやすりをかけると仕上がりがきれいになる。小さくしすぎると吊り下げ穴が切れにくくなるため、元の大きさを目安にするとよい。","2026-11-16","Jennifer Maker","https://jennifermaker.com/cutting-wood-with-cricut/"],["トナカイとツリーの無料SVGで作るクリスマ
