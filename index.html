在として捉える視点を提供している。東京大学大学院教育学研究科附属発達保育実践政策学センター（CEDEP）の研究グループが、助けを求められない状態にある青年期の子どもが、心理的孤立からどのように他者…","\n【概要】\n東京大学大学院教育学研究科附属発達保育実践政策学センター（CEDEP）の研究グループが、助けを求められない状態にある青年期の子どもが、心理的孤立からどのように他者への信頼を回復していくかを明らかにした論文を発表した。2026年11月6日に国際誌に掲載された。\n\n【背景】\n学校や家庭で困難を抱えながらも、誰にも相談できない「援助要請をしない」青年の存在は、いじめや不登校、精神的不調の深刻化につながるリスク要因として指摘されてきた。しかし、こうした子どもたちの心理的変容プロセスについては十分に解明されていなかった。援助要請の有無は従来、単なる行動の有無として扱われがちであったが、その背後にある心理的な変化の過程に踏み込んだ研究は少なかった。\n\n【詳細】\n「心理的孤立から対人信頼へ：援助要請を行わない日本の青年の信頼形成プロセスモデル」を示した論文がInternational Journal of School & Educational Psychology誌に掲載された。この研究は、東京大学CEDEPの特任助教と大学院教育学研究科博士課程の研究者、ワシントン大学の研究者による共同研究グループによって行われた。研究グループは、他者に助けを求められない状態にあった青年期の子どもたちが、心理的孤立からどのように他者への信頼を育み、頼れるようになるのか、その動的な心理変容プロセスを明らかにしたとしている。この成果は、援助要請をしない青年を単に「支援が届きにくい存在」として捉えるのではなく、信頼回復という段階的な変化の過程をたどる存在として理解する視点を提供するものである。\n\n【ポイント・注意点】\nこの研究成果は、学校現場におけるスクールカウンセラーや教員が、援助要請をしない生徒にどう関わるべきかを考える上での重要な知見になり得る。心理的孤立は外から見えにくいため、周囲の大人が信頼構築のプロセスを理解した上で、段階的かつ継続的に関わる姿勢が求められる。今後、この動的プロセスモデルを踏まえた具体的な支援プログラムの開発や、学校現場への応用研究が期待される分野である。","2026-11-06","東京大学CEDEP","https://www.cedep.p.u-tokyo.ac.jp/"],["読み聞かせは早期開始より継続が鍵と判明、東京科学大の調査","東京科学大学の研究チームによる調査で、読み聞かせは早期開始よりも長く継続することが子供の成長に重要だと判明。足立区の公立小1年生2,609人の調査から、継続期間の長さが読書好きや困難に立ち向かう力の育成に関係することが示された。大人や子供の読書離れの実態も合わせて紹介された。■概要毎日新聞客員編集委員の元村有希子氏が、RKBラジオ「田畑竜介 Groooooow Up」のポッドキャスト「毎日新聞客員編集委員・元村有希子のZoom Up」の中で、子供への読み…","\n■概要\n毎日新聞客員編集委員の元村有希子氏が、RKBラジオ「田畑竜介 Groooooow Up」のポッドキャスト「毎日新聞客員編集委員・元村有希子のZoom Up」の中で、子供への読み聞かせに関する最新研究を紹介した。東京科学大学のチームによる調査で、読み聞かせは開始時期の早さ以上に、長く継続することが子供の成長にとって重要であることが判明したという。\n\n■背景\n子供への読み聞かせについては、これまで「できるだけ早く始めた方が良い」といったイメージが広く持たれてきた。しかし、実際に開始時期と継続期間のどちらが子供の発達により強く関わっているのかを、大規模な調査データに基づいて検証する取り組みは十分に行われてこなかった。こうした中、東京科学大学のチームが公立小学校の児童を対象とした調査を実施した。\n\n■詳細\n調査は、東京都足立区の公立小学校1年生2,609人を対象に行われた。その結果、読み聞かせの習慣が長く続いた子供は、読書好きになるだけでなく、困難に立ち向かう力や他者への親切心が育まれ、感情的な問題言動も減少する傾向が確認された。\n\n一方で、3年間読み聞かせを続けた集団では、読み聞かせをいつ開始したかという時期による差はほとんど見られなかった。この結果から、元村氏は「開始の早さより継続期間の長さが重要」と述べている。\n\nあわせて、「0歳から始めれば良い子になるという短絡的な話ではない」として、家庭環境などさまざまな要因の影響を考慮する冷静な視点も示された。また、番組内では大人の約6割、小学生の1割以上が月に1冊も本を読まないという実態についても紹介された。\n\n■ポイント・注意点\n今回紹介された調査結果は、読み聞かせにおいて「いつ始めるか」よりも「どれだけ続けるか」が子供の発達に関わる重要な要素であることを示唆している。ただし、元村氏が指摘するように、読み聞かせの効果を単純に「早く始めれば良い子に育つ」という因果関係として捉えるのは適切ではなく、家庭環境をはじめとする他の要因も影響している点に留意する必要がある。一方で、大人や子供における読書離れの実態も示されており、読み聞かせを無理なく継続できる環境づくりの重要性があらためて浮き彫りになったといえる。","2026-11-06","ライブドアニュース","https://news.livedoor.com/article/detail/32747962/"],["赤ちゃんは服装から周囲の人物の情報を推測できるか","ボストン小児病院などの研究チームが、生後5〜7か月の乳児が他者の服装を手がかりに、その人物についての推測を行うかどうかを検証するオンライン実験を実施中であることが研究募集情報で明らかになった。社会的認知、乳児の知覚、社会性発達に関わる分野に位置づけられる研究である。2026年11月4日付の研究者向け週報「The Research Roundup」で、乳児の社会的認知発達に関する新しい研究プロジェクトが紹介された。","\n【概要】\n2026年11月4日付の研究者向け週報「The Research Roundup」で、乳児の社会的認知発達に関する新しい研究プロジェクトが紹介された。生後5〜7か月の赤ちゃんが服装という視覚的手がかりから周囲の人物に関する推測を行うかを検証する内容である。\n\n【背景】\n乳児は言葉を話せない段階から、周囲の人々や物事について様々な推論を行っていることが、近年の発達心理学研究で明らかになりつつある。服装や外見といった視覚的特徴が、乳児の社会的カテゴリー形成にどう関わるかは、社会的認知発達の初期段階を理解する上で重要なテーマである。こうした研究は、後年に形成される偏見やステレオタイプの起源をたどる手がかりとしても注目されている。\n\n【詳細】\n週報は、2026年11月4日付の第8号として発行され、乳児から17歳までの子どもと家族を対象に発達科学を前進させるための現在募集中の小児研究を紹介している。紹介されたプロジェクトの一つは、「赤ちゃんは周囲の人々について推測するために服装を手がかりに使えるか」というテーマで、生後5〜7か月の赤ちゃんを対象に、服装が人物理解の手がかりとして機能するかどうかをThe New Schoolの研究者が調査しているものである。この研究は社会的認知、乳児の知覚、社会性発達に関わる分野に位置づけられている。研究チームは、乳児が外見的特徴をどの程度早い段階から社会的情報として処理しているのかを明らかにしようとしている。\n\n【ポイント・注意点】\nこの研究はオンラインで実施可能であり、全米の家庭が対象として募集されている段階にある。乳児が非言語的な視覚情報から社会的推論を行う能力の起源を探ることは、後の偏見やステレオタイプ形成のメカニズムを理解する手がかりにもなり得る。現時点ではまだ研究参加者を募集している段階であり、具体的な結果は今後の発表を待つ必要がある点には留意されたい。関心のある家庭にとっては、オンラインで参加できる手軽さも紹介されている特徴の一つである。","2026-11-04","The Research Roundup (Substack)","https://theneurosciencenanny.substack.com/p/the-research-roundup-issue-no-08"],["親の寛容さ、子どもの偏見を一貫して過小評価―米研究","米研究によると、親は自分の子どもが持つ偏見について一貫して過小評価する傾向があることが判明した。子どもの社会的態度の実態把握が難しく、家庭での偏見予防教育の設計に課題があることを示す知見として注目される。この傾向は特定の属性や家庭背景に限定されず幅広く観察された。■概要2026年11月4日、学術誌『Child Development』にRebecca Peretz-Lange氏による論文が掲載され、親が子どもの持つ偏見を一貫して過小評価していることが明ら…","\n■概要\n2026年11月4日、学術誌『Child Development』にRebecca Peretz-Lange氏による論文が掲載され、親が子どもの持つ偏見を一貫して過小評価していることが明らかになった。本研究は、子どもの社会的認知発達における親の認識とのギャップを定量的に示した点で意義深い。\n\n■背景\nこれまでの発達心理学研究では、子どもは幼児期から人種・性別・外見などに基づくステレオタイプや偏見を形成し始めることが知られてきた。一方で、親がこうした子どもの内面をどれほど正確に把握しているかについては十分な検証がなされてこなかった。偏見形成の早期発見・介入のためには、保護者による正確な認識が前提となるため、この認識ギャップの存在は実践的にも重要な意味を持つ。偏見は目に見えにくい態度であるため、親が日常の観察だけで子どもの内面を正確に把握するのは本来困難であるという指摘もある。\n\n■詳細\n本論文は、子どもたちに対して実施した偏見に関する測定結果と、その保護者が推定した子どもの偏見の程度を比較する手法を用いて分析を行った。その結果、親は総じて自分の子どもが示す偏見のレベルを実際よりも低く見積もる傾向が一貫して確認された。このパターンは特定の属性や家庭背景に限定されず、幅広い家庭において観察されたことが特徴である。研究チームは、親自身が「自分の子どもは公平で偏見がないはずだ」という期待を抱きやすいことが、こうした過小評価の一因になっている可能性を指摘している。こうした期待バイアスは、親が意図的に事実を軽視しているわけではなく、無意識のうちに生じるものと考えられている。\n\n■ポイント・注意点\nこの結果は、家庭内での偏見に関する会話や教育が、親の主観的な印象だけに基づいて行われると、実際の子どもの態度とのズレが生じるリスクを示唆している。学校や保育の現場、そして家庭教育の場において、子どもの社会的態度をより客観的に把握するためのツールや対話の機会を増やすことが望ましいと考えられる。今後は、どのような要因が過小評価の程度に影響するか、またどのように親子間の認識ギャップを埋めていくかについて、さらなる研究が求められる。","2026-11-04","Child Development","https://doi.org/10.1093/chidev/aacag197"],["読解力を予測する2つの見落とされがちな能力を特定","大規模研究により、子どもの読解力の成否を予測する上で知能や視覚処理よりも「聴覚処理」と「理解・知識」の2つの能力が重要であることが判明。読み書き困難の支援に新たな視点を提供する内容として報じられた。約5万件の相関関係を137組のデータセットから統合した大規模分析による結果である。2026年11月3日、テキサスA&M大学などの研究チームが、子どもの読解力の成否を予測する要因について大規模な分析結果を発表した。","\n【概要】\n2026年11月3日、テキサスA&M大学などの研究チームが、子どもの読解力の成否を予測する要因について大規模な分析結果を発表した。知能や視覚処理能力よりも、聴覚処理と理解・知識という2つの能力が、より強い予測因子であることが示された。\n\n【背景】\n従来、読字障害（ディスレクシア）など読解困難の原因については、知能や視覚認知の問題が注目されることが多かった。しかし、その因果関係や予測力については研究間で結果が一致しないことが課題となっていた。読解困難を抱える子どもへの支援を効果的に行うためには、何が本当に読解力を左右する要因なのかを明確にする必要があった。\n\n【詳細】\n研究チームは「約5万件の相関関係を137組の認知・学力テストのデータセットから統合」し、統計モデルを構築した。その結果、「聴覚処理と理解・知識という、これまであまり議論されてこなかった2つの能力が、読解成功の特に重要な予測因子として浮かび上がった」という。「視覚処理は、分析全体を通じて読解力との有意な関連を示さなかった」ことも明らかになった。「この2つの能力は、研究で検討された他のどの能力よりも読解成績の信頼性の高い予測因子であり、記憶・推論・処理速度といった他の認知機能も読解発達に寄与するものの、より補助的な役割にとどまった」とされる。\n\n【ポイント・注意点】\n研究は「なぜ二人の子どもがそれぞれ異なる形で読解に苦労するのかを説明する手がかりにもなる。ある子は単語の音の構成を把握するのが難しく、別の子は単語を音読できても文章の理解が難しい場合がある」としている。ただし「特定の指導法を検証したものではなく、一方の能力を伸ばせば読解スコアが必ず上がることを示したわけではない」点には注意が必要で、教師や研究者が子どものつまずきの所在を特定する際の視点を提供するものと位置づけられている。今後は、この知見をもとにした具体的な指導法や介入プログラムの効果検証が求められる段階にある。","2026-11-03","ScienceDaily","https://www.sciencedaily.com/releases/2026/11/261102202845.htm"],["母親の妊娠期から産後の不安・抑うつ、生後1か月児の脳機能的結合と関連","母親の妊娠期から産後にかけての不安・抑うつ症状が、生後1か月の乳児の脳の機能的結合と関連することを示す研究が学術誌Infancyに掲載された。母親のメンタルヘルスが乳児期早期の脳発達に与える影響を示す知見として注目される。関連を示すにとどまり、因果関係の解明には今後の追跡調査が必要とされている。■概要学術誌Infancyに掲載された研究により、母親が妊娠期から産後にかけて経験する不安や抑うつの症状が、生後1か月の乳児の脳の機能的結合パターンと関連すること…","\n■概要\n学術誌Infancyに掲載された研究により、母親が妊娠期から産後にかけて経験する不安や抑うつの症状が、生後1か月の乳児の脳の機能的結合パターンと関連することが示された。母親のメンタルヘルスと乳児期早期の脳発達との関係を検証した実証研究である。\n\n■背景\n母親の妊娠期・産後のメンタルヘルスが子どもの発達に影響を与えることはこれまでも指摘されてきたが、生後ごく早期の乳児の脳機能にどのような関連が見られるかについては、十分に解明されていなかった。胎児期から出生後にかけての母親のストレスや気分の変調が、乳児の脳の発達初期段階にどのように影響するかを明らかにすることは、早期介入のあり方を検討する上で重要な意味を持つ。従来、母親のメンタルヘルス不調は育児行動を通じて間接的に子どもに影響すると考えられてきたが、より直接的な生物学的経路の存在も注目されつつある。\n\n■詳細\n本研究では、妊娠期から産後にかけて母親の不安・抑うつ症状を継続的に評価し、生後1か月の乳児を対象に脳の機能的結合を測定した。その結果、母親の不安・抑うつの程度と乳児の脳の機能的結合パターンとの間に関連が認められた。この結果は、母親の心理状態が胎内環境や産後の養育環境を通じて、乳児の脳発達の初期段階に影響を及ぼしうることを示唆している。生後わずか1か月という極めて早い時期に関連が観察された点は、妊娠期からの母親のメンタルヘルスケアの重要性を裏付けるものといえる。こうした早期の脳機能的結合の違いが、その後の子どもの発達にどのように結びついていくのかについても、今後の重要な検討課題となる。\n\n■ポイント・注意点\nこの知見は、妊娠期から産後にかけての母親のメンタルヘルスケアが、単に母親自身の健康のためだけでなく、子どもの脳発達にとっても重要である可能性を示している。妊産婦への心理的支援やスクリーニングの強化が、乳児の健やかな発達を支える一助となりうる。ただし、本研究は関連を示すものであり、因果関係の解明や長期的な発達への影響については今後の追跡調査が必要である。","2026-11-03","Infancy (Wiley)","https://doi.org/10.1111/infa.70135"],["中国農村部の乳幼児発達、祖父母による養育の実態を調査","中国農村部における養育者と子どもの関係性や養育行動を、親と祖父母の違いに着目して調査した報告がInfant and Child Development誌に掲載された。農村部特有の多世代養育の発達への影響を検討する内容。親が都市部へ出稼ぎに行く「留守児童」の社会的課題を背景にした研究である。学術誌Infant and Child Developmentに、中国農村部における乳幼児期の発達について、親と祖父母という異なる養育者による養育行動や子どもとの関係性…","\n【概要】\n学術誌Infant and Child Developmentに、中国農村部における乳幼児期の発達について、親と祖父母という異なる養育者による養育行動や子どもとの関係性の違いを調査した報告が2026年11月2日付で掲載された。\n\n【背景】\n中国農村部では、親が都市部へ出稼ぎに行き、祖父母が孫の養育を担う「留守児童」の状況が社会的課題となってきた。養育者が親であるか祖父母であるかによって、子どもの発達環境や養育の質がどう異なるかは、子どもの発達研究において重要な論点である。こうした多世代養育の実態を定量的に明らかにすることは、地域に即した子育て支援策を検討する上での基礎資料となる。\n\n【詳細】\n報告は「中国農村部における乳幼児期の発達：親と祖父母における養育者・子ども関係と養育行動」というタイトルで、2026年11月2日に初めて公開された。この研究は、中国農村部の子どもを対象に、養育者が親であるか祖父母であるかによって、養育者・子ども間の関係性の質や具体的な養育行動（遊び、言葉かけ、しつけなど）にどのような違いがあるかを調査したものである。親世代と祖父母世代とでは、子どもへの接し方や価値観に差が生じやすく、こうした違いが日常の養育実践にどう反映されるかが分析の焦点となっている。親の不在という特殊な環境下で、祖父母がどのように養育の質を維持しようとしているかについても注目される部分である。\n\n【ポイント・注意点】\nこの種の研究は、多世代同居や祖父母養育が一般的な地域・文化圏における子どもの発達支援のあり方を考える上で重要な示唆を与える。祖父母による養育は、世代間の価値観や養育スタイルの違いから、子どもの発達に異なる影響を及ぼす可能性があり、画一的な養育支援策ではなく、地域の家族構成の実態に即した柔軟な支援策の必要性が示唆される。今後、こうした多世代養育環境における子どもの長期的な発達アウトカムについての追跡調査が期待される。","2026-11-02","Infant and Child Development (Wiley)","https://onlinelibrary.wiley.com/doi/10.1002/icd.70143"],["経済的困窮が貧困児童の実行機能を阻害―視線計測研究","経済的困窮が子どもの実行機能の発達にどう影響するかを視線計測（アイトラッキング）技術を用いて検討した研究がDevelopmental Science誌11月号に掲載。複数の資源不足が認知発達に及ぼす影響を可視化した。栄養や養育環境など複合的な資源の欠如を捉える視点が示された。学術誌Developmental Scienceの2026年11月号（第29巻6号）に、経済的困窮が貧困家庭の子どもの実行機能に及ぼす影響を視線計測技術で検討した研究が掲載された。","\n【概要】\n学術誌Developmental Scienceの2026年11月号（第29巻6号）に、経済的困窮が貧困家庭の子どもの実行機能に及ぼす影響を視線計測技術で検討した研究が掲載された。複数の資源の役割を実証的に分析した内容である。\n\n【背景】\n経済的困窮が子どもの認知発達、特に実行機能（計画・抑制・注意の切り替えなどの能力）に悪影響を及ぼすことは従来から指摘されてきたが、その具体的なメカニズムや、どのような「資源」の不足が関与するのかについては十分に解明されていなかった。貧困の影響を測定する際、自己報告や行動観察だけでは捉えきれない認知プロセスの詳細を明らかにする手法が求められてきた。\n\n【詳細】\n論文は「経済的困窮は貧困児童の実行機能を阻害する：視線計測を通じて検討した複数資源の役割」というタイトルで、Ying Jiang氏ら研究者によりDevelopmental Science誌2026年11月号（第29巻6号）に掲載された。視線計測（アイトラッキング）という客観的な生理指標を用いることで、子どもが課題に取り組む際の注意の配分や情報処理の過程を詳細に分析し、経済的困窮と関連する複数の資源不足が実行機能にどのように影響するかを明らかにしようとする研究である。この手法により、子ども本人の言語報告に依存せず、無意識レベルでの注意配分の偏りを客観的に捉えることが可能になっている。従来の自己報告型の調査では見えにくかった微細な認知的負荷のパターンを可視化した点が、本研究の技術的な特色といえる。\n\n【ポイント・注意点】\nこの研究は、貧困が子どもの発達に及ぼす影響を単純な「お金の有無」ではなく、複数の資源（栄養、養育環境、学習機会など）の複合的な欠如として捉える視点を提供している。視線計測という客観的指標を用いることで、子ども自身の自己報告に頼らない形で認知的負荷の実態を捉えられる利点がある。貧困対策や支援プログラムを設計する際には、単一の支援策だけでなく、複数の資源を同時に補う包括的なアプローチが必要であることを示唆する知見といえる。","2026-11-01","Developmental Science","https://www.ovid.com/journals/devs/toc/2026/11000"],["2歳のスクリーン時間と言語・脳発達、70人の縦断研究で関連を確認","70名の2歳児を対象にした縦断研究で、スクリーン時間と口語表現能力、脳の言語関連領域の体積との関連が確認された。サンプル数は限られるが、2歳時のスクリーン時間の多さと言語発達の弱さ、その後の脳体積との関連が示唆された。保護者報告によるデータである点など限界も指摘されている。■概要脳適能（BRAIN Fit）の科学新聞周報（2026年11月2日号、研究資料は2026年11月1日時点で確認）が、言語・注意力・実行機能・社交に関する11本の発達研究を紹介してい…","\n■概要\n脳適能（BRAIN Fit）の科学新聞周報（2026年11月2日号、研究資料は2026年11月1日時点で確認）が、言語・注意力・実行機能・社交に関する11本の発達研究を紹介している。その中心的な研究として、70名の2歳児を対象に脳MRIと標準化された発達評価を行い、保護者が報告した2歳時と3歳時のスクリーン時間との関連を調べた縦断研究が取り上げられている。\n\n■背景\n乳幼児期のスクリーン時間（テレビやスマートフォンなどの画面を見る時間）が、その後の言語発達や脳の発達にどのような影響を及ぼすかは、近年関心を集めているテーマである。本研究は、スクリーン時間と言語能力、さらに脳の構造的な特徴との関連を縦断的に検証したもので、iScoreに2026年10月15日にオンライン発表された。\n\n■詳細\n研究では、70名の2歳児を対象に脳MRI撮影と標準化された発達評価を実施し、あわせて保護者から2歳時と3歳時のスクリーン時間について報告を得た。\n\nその結果、2歳時に平日・週末のスクリーン時間が多かった子供は、同時期の口語表現能力が弱い傾向が見られた。さらに3歳時の評価では、右脳の言語関連領域（右側額下回三角部）の体積が相対的に小さい子供において、2歳時の口語表現が弱く、その後の3歳時のスクリーン時間が多くなるという方向性の関連も見られた。\n\nなお、同号では他にも、生後5か月の赤ちゃんが自分の声の高さの変化に気づいて調整する研究（Current Biology、2026年10月26日オンライン発表）や、129名の3歳児を対象とした実行機能と日常の適応能力の関連についての研究なども紹介されている。これらの研究は、乳幼児期の言語・社会性発達における多様な側面を扱っている点で共通している。\n\n■ポイント・注意点\n本研究については、いくつかの重要な注意点が指摘されている。まず、サンプルは70人のみと限られた規模であること。また、スクリーン時間のデータは保護者の報告によるものであり、客観的な計測ではない点にも留意が必要である。さらに、今回示されたのはあくまで関連性であり、スクリーン時間が言語発達の弱さを引き起こすといった因果関係を示すものではない。研究者も、脳の測定結果から個別の子供の発達状況を判断することはできないと述べている。こうした限界を踏まえた上で、今後さらに大規模な研究によって関連の詳細を検証していくことが求められる。","2026-11-01","BRAIN Fit（脳適能科学新聞周報）","https://brainfitedu.com.tw/articles/science-news-2026-11-02"],["乳幼児自閉症スクリーニング、文化を越えた妥当性を検証","18〜36か月の幼児を対象とした相互作用型自閉症スクリーニングツール（RITA-T）が、複数の国と言語で一定の妥当性を示すことを整理したスコーピングレビューが公表された。文化的適応の重要性も指摘されている。スクリーニングは診断そのものではなく、専門職研修や支援への接続も不可欠だとされる。18〜36か月の幼児を対象とした相互作用型の自閉症スクリーニングツール「RITA-T」について、国際的な妥当性を整理したスコーピングレビューが紹介された。","\n【概要】\n18〜36か月の幼児を対象とした相互作用型の自閉症スクリーニングツール「RITA-T」について、国際的な妥当性を整理したスコーピングレビューが紹介された。スクリーニングの文化的適応と専門職研修の重要性が強調されている。\n\n【背景】\n自閉症の早期発見には、乳幼児健診などで用いられるスクリーニングツールの精度が重要だが、多くのツールは特定の国・言語圏で開発されており、異なる文化圏でそのまま使えるかどうかは検証が必要な課題である。スクリーニングツールが文化的背景を考慮せずに導入されると、誤った判定や支援の遅れにつながるおそれがあるため、国際的な妥当性の検証が求められてきた。\n\n【詳細】\nレビューは「RITA-Tに関するスコーピングレビューとして、18〜36か月の幼児に対する相互作用型ASDスクリーニングが、複数の国と言語で一定の妥当性を示していることを整理している」一方で、「スクリーニングは診断そのものではなく、文化的適応、専門職研修、長期予測、支援への接続が不可欠である」と指摘している。この整理は、発達障害支援を「早く見つける」だけで終わらせないための複数の論文の一つとして紹介されている。レビューはまた、スクリーニングツールの精度が高くても、実施者の研修が不十分であれば結果の信頼性が損なわれる可能性にも言及している。異なる文化圏での導入にあたっては、単なる言語翻訳以上の配慮が必要であることも強調されている。\n\n【ポイント・注意点】\nスクリーニングツールの国際的な普及においては、単に翻訳するだけでなく、その文化圏の養育習慣や社会的規範に合わせた適応作業が不可欠である。また、スクリーニングで陽性となった子どもが、実際に専門的な診断や支援につながる体制が整っているかどうかも重要な課題であり、ツールの精度向上だけでなく、地域の医療・福祉システム全体の整備が求められる。保護者にとっては、スクリーニング結果はあくまで「気づきのきっかけ」であり、確定診断ではない点を理解しておくことが大切である。","2026-10-XX","EASPE（発達障害研究紹介）","https://www.easpe.com/blog/article/950/"],["読み聞かせや遊びが乳幼児の脳を『学習モード』に、米大学がEEG研究","米ノースウェスタン大学の研究で、読み聞かせやパズル遊びを通じた親子の交流が、動画視聴時よりも乳幼児の脳をより活性化させることがEEG計測で示された。自閉症児や言語発達の遅い子どもでも同様の脳活動パターンが確認された点が注目される。日常に近い場面での脳活動を測定した先駆的な試みである。■概要2026年10月28日、米ノースウェスタン大学は、乳幼児と養育者が読み聞かせやパズル遊びを行う際の脳活動を、子ども向けに設計されたEEG（脳波計測）を用いて記録した研究…","\n■概要\n2026年10月28日、米ノースウェスタン大学は、乳幼児と養育者が読み聞かせやパズル遊びを行う際の脳活動を、子ども向けに設計されたEEG（脳波計測）を用いて記録した研究成果を発表した。親子の自然な交流場面における脳活動を測定した点で、先駆的な試みとされている。\n\n■背景\nこれまでの子どもの脳機能研究の多くは、画面上の静止画像を見せたり、音を聞かせたりする高度に統制された実験室環境で行われてきた。これまでの子どもの発達に関する神経科学研究の多くは、子どもが画面上の単一の静止画像を見たり、音を聞いたり、構造化された課題を行ったりする中で、研究者が脳の反応を測定する、厳密に統制された実験室環境で行われてきた。しかし、こうした人工的な場面では、実際の生活における親子の自然な交流時の脳活動を十分に捉えられないという限界があった。そこで研究チームは、より日常に近い場面での脳機能を把握するための新しい手法の開発に取り組んだ。\n\n■詳細\n研究チームは、24〜44か月の自閉症の有無や言語能力の幅広い範囲を含む49人の幼児を対象に、伸縮性のある布製のEEGキャップを用いて、読み聞かせやパズル遊び、そして親と一緒に動画を視聴する場面での脳活動を比較した。その結果、親子の交流の場面では、動画をただ視聴する場合と比較して、幼児は一貫して低いアルファ波活動と高いシータ波活動を示したことが明らかになった。さらに研究チームを驚かせたのは、言語発達が遅い子どもや自閉症と診断された子どもも、定型発達の子どもと同様の脳活動パターンを示したという点である。研究者は、自閉症の子どもや言語発達の遅れがある子どもも、親との社会的な関わりの場面を数多く示したと述べている。\n\n■ポイント・注意点\nこの研究は、画面を一見集中して見ているように見える子どもであっても、実際に脳がより活発に学習モードへと切り替わるのは、養育者との質の高い直接的な交流の場面であることを示唆している。保護者にとっては、動画視聴の時間を減らし、読み聞かせや遊びを通じた直接的な関わりを増やすことの重要性を裏付ける知見といえる。ただし、研究チーム自身も、本研究が推奨されるべき具体的な画面視聴時間の上限を示すものではなく、あらゆる動画視聴が有害であることを示すものでもないと注意を促している。今後は、交流時に収集された養育者側の脳活動データの分析を通じて、親子間の脳活動の同期性についても検討が進められる予定である。","2026-10-28","Northwestern University (Feinberg News Center)","https://news.feinberg.northwestern.edu/2026/10/28/study-tracks-brain-activity-of-toddlers-and-parents-during-story-and-play-time/"]]};
let memos=[]; // {cat,title,note,date}
const OLD_CUT="2026-11-07";
function isOld(d){return d<OLD_CUT}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
/* ===== 項目（ジャンル）はデータ駆動：CATS／DATAに足すだけで自動で増えます ===== */
const extraCats=[];
function allCats(){
  const list=CATS.slice();
  Object.keys(DATA).forEach(id=>{ if(!list.some(c=>c.id===id)) list.push({id:id,name:id,desc:"追加された項目",img:"hero"}); });
  extraCats.forEach(c=>{ if(!list.some(x=>x.id===c.id)) list.push(c); });
  return list;
}
let cats=allCats();
let catIdx=0;
const artIdxMap={};
function itemsOf(c){return (DATA[c.id]||[]).map((a,i)=>({a:a,oi:i})).sort((x,y)=>y.a[3].localeCompare(x.a[3]))}
function curCat(){return cats[catIdx]}
function curItems(){return itemsOf(curCat())}
function curArtIdx(){const n=curItems().length;if(!n)return 0;let i=artIdxMap[curCat().id]||0;if(i>=n)i=n-1;if(i<0)i=0;return i}
function renderStage(dir){
  cats=allCats(); if(catIdx>=cats.length)catIdx=cats.length-1; if(catIdx<0)catIdx=0;
  const c=curCat(), items=curItems(), ai=curArtIdx();
  const total=cats.reduce((s,x)=>s+(DATA[x.id]||[]).length,0);
  document.getElementById('heroText').innerHTML="<b>今日のまとめ — 全"+cats.length+"ジャンル・"+total+"件。</b> タイトルと概要は日本語、カードの「和訳全文を読む」で全文が開きます。新しい順に並べ、48時間より古い記事はグレー表示です。";
  document.getElementById('catName').textContent=c.name;
  document.getElementById('catDesc').textContent=c.desc||"";
  document.getElementById('catCount').textContent="ジャンル "+(catIdx+1)+" / "+cats.length;
  document.getElementById('catDots').innerHTML=cats.map((x,i)=>'<button class="dot'+(i===catIdx?' active':'')+'" data-cat="'+i+'" aria-label="'+x.name+'へ移動"></button>').join('');
  document.querySelectorAll('#catDots .dot').forEach(d=>{d.onclick=()=>{const n=+d.dataset.cat; if(n!==catIdx){const dd=n>catIdx?'down':'up'; catIdx=n; renderStage(dd);}}});
      const slot=document.getElementById('cardSlot');
  if(!items.length){
    slot.innerHTML='<article class="card"><div class="empty"><div class="big">✦</div><p><b>'+c.name+'</b> は追加されたばかりの項目で、まだ記事がありません。</p><p>毎日の更新でこの項目の記事が集まると、ここに表示されます。<br>上スワイプで他のジャンルへ移動できます。</p></div></article>';
    document.getElementById('artDots').innerHTML=""; document.getElementById('artCount').textContent="0 / 0"; return;
  }
  const it=items[ai], a=it.a, old=isOld(a[3]);
  slot.innerHTML='<article class="card'+(old?' old':'')+(dir?' anim-'+dir:'')+'">'
    +'<img class="ph" src="'+IMGS[c.img]+'" alt="'+c.name+'のイメージイラスト">'
    +'<div class="cbody"><div class="meta"><span class="badge'+(old?' oldb':'')+'">'+(old?'少し前':'NEW')+'</span><span>'+a[3]+'</span><span>'+(ai+1)+' / '+items.length+'</span></div>'
    +'<h3>'+a[0]+'</h3><p class="sum">'+a[1]+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="openArticle(\''+c.id+'\','+it.oi+')">和訳全文を読む</button>'
    +'<button class="btn ghost" onclick="quickMemo(\''+c.id+'\','+it.oi+',this)">メモ保存</button>'
    +'<button class="btn ghost" onclick="shareArticle(\''+c.id+'\','+it.oi+')">共有</button></div>'
    +'<div class="src">出典：'+a[4]+'<br><a href="'+a[5]+'" target="_blank" rel="noopener">原文を開く</a></div></div></article>';
  document.getElementById('artDots').innerHTML=items.map((x,i)=>'<span class="dot'+(i===ai?' active':'')+'"></span>').join('');
  document.getElementById('artCount').textContent="記事 "+(ai+1)+" / "+items.length;
  requestAnimationFrame(fitCard);
}

function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;
  const sum=card.querySelector('.sum'), h3=card.querySelector('h3'), ph=card.querySelector('.ph');
  let ss=14, hs=Math.min(21, Math.max(17, window.innerWidth*0.044)), phh=ph?Math.round(ph.getBoundingClientRect().height):0; const ph0=phh;
  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }
    if(hs>13){ hs-=0.5; if(h3) h3.style.fontSize=hs+'px'; continue; }
    break;
  }
}
window.addEventListener('resize', fitCard);
function nextArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i>=n-1)return;artIdxMap[curCat().id]=i+1;renderStage('next')}
function prevArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i<=0)return;artIdxMap[curCat().id]=i-1;renderStage('prev')}
function nextCat(){if(catIdx>=cats.length-1)return;catIdx++;renderStage('down')}
function prevCat(){if(catIdx<=0)return;catIdx--;renderStage('up')}

let sx=null, sy=null, swipedAt=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;
  swipedAt=Date.now();
  if(Math.abs(dx)>Math.abs(dy)){ dx<0?nextArt():prevArt(); } else { dy<0?nextCat():prevCat(); }
});
stage.addEventListener('click',e=>{ if(Date.now()-swipedAt<120){e.stopPropagation();e.preventDefault();} },true);
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')nextArt(); else if(e.key==='ArrowLeft')prevArt();
  else if(e.key==='ArrowDown'){e.preventDefault();nextCat();} else if(e.key==='ArrowUp'){e.preventDefault();prevCat();}
});
/* ===== 項目の追加 ===== */
document.getElementById('addCatBtn').onclick=()=>{document.getElementById('newCatName').value="";document.getElementById('newCatDesc').value="";document.getElementById('addDlg').showModal()};
document.getElementById('addCatSave').onclick=()=>{
  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast("項目名を入力してください");return}
  const desc=document.getElementById('newCatDesc').value.trim()||"追加された項目";
  const id='custom-'+Date.now();
  extraCats.push({id:id,name:name,desc:desc,img:'hero'}); DATA[id]=[];
  cats=allCats(); catIdx=cats.length-1;
  document.getElementById('addDlg').close(); renderStage('down');
  toast("項目「"+name+"」を追加しました");
};
/* ===== 記事ダイアログ・メモ・共有 ===== */
function openArticle(cat,idx){
const c=allCats().find(x=>x.id==cat); const a=DATA[cat][idx];
document.getElementById('dlgIn').innerHTML=`<img src="${IMGS[c.img]}" alt=""><div class="meta" style="margin-top:10px"><span>${c.name}</span><span>${a[3]}</span></div><h3>${a[0]}</h3><p class="sum" style="font-size:14px">${a[1]}</p><div class="full">${a[2]}</div>
<p class="src" style="margin-top:12px">出典：${a[4]} — <a href="${a[5]}" target="_blank" rel="noopener">${a[5]}</a></p>
<div class="memoBox"><label style="font-weight:800;font-size:14px">ひとことメモ</label><textarea id="memoText" placeholder="気づいたこと、作りたいもの、家族への共有メモなど"></textarea>
<div class="actions"><button class="btn primary" onclick="saveMemo('${cat}',${idx})">このメモを保存</button><button class="btn ghost" onclick="shareArticle('${cat}',${idx})">iPhoneで共有</button><button class="btn ghost" onclick="document.getElementById('dlg').close()">閉じる</button></div></div>`;
document.getElementById('dlg').showModal();
}
function quickMemo(cat,idx,btn){const a=DATA[cat][idx];memos.unshift({cat,title:a[0],note:"",date:a[3]});updateMemoUI();btn.textContent="保存しました";btn.classList.add('saved');toast("メモに保存しました（このページを開いている間）")}
function saveMemo(cat,idx){const a=DATA[cat][idx];const note=document.getElementById('memoText').value.trim();memos.unshift({cat,title:a[0],note,date:a[3]});updateMemoUI();toast("メモを保存しました");document.getElementById('dlg').close()}
function updateMemoUI(){document.getElementById('memoCount').textContent=memos.length;const area=document.getElementById('memoList');
if(!memos.length){area.innerHTML='<p class="sum">まだメモがありません。記事の「メモ保存」をタップしてください。</p>';return}
area.innerHTML=memos.map(m=>`<div class="memoItem"><b style="font-size:14px">${m.title}</b><div style="font-size:13px;color:var(--muted)">${m.note||"（ひとことメモなし）"} ・ ${m.date}</div></div>`).join('')}
function exportMemos(){if(!memos.length){toast("まだメモがありません");return}const txt="MAI topic メモ — 2026-11-10\n\n"+memos.map((m,i)=>`${i+1}. ${m.title}\n${m.note||""}\n`).join("\n");const b=new Blob([txt],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="mai-topic-memo-2026-11-10.txt";a.click();URL.revokeObjectURL(u)}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}} try{await navigator.clipboard.writeText(text);toast("コピーしました — メモアプリなどに貼り付けできます")}catch(e){toast("共有できませんでした")}}
function shareArticle(cat,idx){const a=DATA[cat][idx];shareText(a[0],`${a[0]}\n\n${a[1]}\n\n出典：${a[4]} ${a[5]}`)}
function shareMemos(){if(!memos.length){toast("まだメモがありません");return}shareText("MAI topic メモ",memos.map(m=>`・${m.title} ${m.note}`).join("\n"))}
document.getElementById('sharePage').onclick=()=>shareText("MAI topic","MAI topic — 2026年11月13日朝版（全"+cats.length+"ジャンル）");
document.getElementById('memoBtn').onclick=()=>{updateMemoUI();document.getElementById('memoDlg').showModal()};
updateMemoUI();
renderStage();
</script>

try {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
} catch (e) {}
</script>
