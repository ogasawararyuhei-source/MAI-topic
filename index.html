NAを調べる手法を使い、Fezf2の下流で働く遺伝子として、細胞どうしをくっつける接着たんぱく質をつくるCdh22を特定した。Cdh22はこうした接続の形成を助けるという。研究チームは、神経細胞が自らの活動と接続のつくり方を結び付ける仕組みを示したものだとしている。\n【ポイント・注意点】リコ教授は、この過程が厳密に調節されないと回路が異常な形で成熟し、それは多くの神経発達症に見られる特徴だと述べている。ただし研究はマウスで行われたもので、記事には動物の数や効果の大きさ、統計の数値は示されていない。人の神経発達症との関係は今回検証されておらず、同じような仕組みがほかの種類の細胞でも働くかどうかは分かっていないと研究チームは述べている。","2026-11-26","Medical Xpress","https://medicalxpress.com/news/2026-11-gene-neuron-identity-brain-circuits.html"],["医科と歯科を一体にした診療所 子の歯科再受診が30〜60％増 米ユタ大","米ユタ大学の研究チームは、ソルトレークシティーの2つの診療所で子どもの受診1,600件以上を追跡し、医科と歯科を一体で提供して記録も共有する診療所では、2年以内に歯科を再受診する割合が30〜60％高かったと報告した。一体型の診療所の子は歯の健康状態も良く、社会経済的に不利な傾向があるにもかかわらず結果は良好だった。成果は学術誌Journal of Dental Researchに掲載された。","\n【概要】米ユタ大学歯学部の研究チームは、医科と歯科を同じ場所で一体的に提供する診療所に通う子どもは、歯科の再受診が続きやすく、歯の健康状態も良いとする研究結果を「Journal of Dental Research」に発表した。筆頭著者は同学部で臨床担当の副学部長を務めるジェリ・ブロック氏、責任著者は研究担当副学部長のブレンダ・ヒートン氏。研究は米国立歯科・頭蓋顔面研究所（NIDCR）の資金を受けた。\n【背景】子どもの歯の健康を保つには、定期的に歯科を受診し続けることが大切とされる。しかし多くの医療機関では、医科と歯科が別々の組織で運営され、電子カルテも分かれている。研究チームは、こうした体制の違いが子どもの歯科受診の継続にどう影響するかを調べた。記事は、医科と歯科で統一された電子カルテを導入することが多くの医療機関にとって大きな壁になっていると指摘している。\n【詳細】比較したのはソルトレークシティーにある2つの診療所だ。リバティ小学校診療所では医科と歯科が別の組織によって運営され、診療記録も別々になっている。一方、サウスメイン診療所は医科と歯科を完全に統合し、記録も共有している。研究チームは両診療所での子どもの受診1,600件以上を追跡し、複数の分析方法を並行して使って、属性の似た患者どうしを比べた。その結果、サウスメインの子どもは、2年以内に歯科を再び受診する可能性が30〜60％高かった。一体型の診療所の子どもは歯の健康状態が有意に良く、口の健康に関わる生活の質も高かった。サウスメインの患者は社会経済的地位が低い傾向にあったが、それでも歯はより健康だったという。\n【ポイント・注意点】研究チームは、歯科の受診回数が多いことが良い結果につながっていると推測している。ただし比較したのはソルトレークシティーの2つの診療所だけで、ほかの地域にそのまま当てはまるかは分からない。良い結果を生んだ仕組みも証明されたわけではない。記事には子どもの年齢などの詳しい内訳は示されていない。医科と歯科の連携を広げるには、記録の共有など体制づくりが課題になる。","2026-11-26","News-Medical","https://www.news-medical.net/news/20261126/Integrating-medical-and-dental-visits-improves-childrens-follow-up-care.aspx"],["超早産児の栄養を多職種で毎日点検 退院時の発育不全が67.8％→49.2％","サウジアラビアの新生児集中治療室で、在胎29週以下などの超早産児124人を対象に、多職種による栄養状態の毎日の点検を導入する前後を比べた研究が発表された。導入後は生後1週の静脈栄養のたんぱく質とエネルギーが増え、全量を口から（経腸で）とれるまでの日数や入院日数が短くなった。退院時の発育不全の割合は67.8％から49.2％に下がった。後ろ向きの比較で、因果関係は確定できないとしている。","\n【概要】サウジアラビア・リヤドのキング・アブドゥルアジズ医療都市の新生児集中治療室（NICU）で、超早産児の栄養を多職種が毎日点検する仕組みを導入する前と後を比べた研究が、学術誌「Frontiers in Pediatrics」に掲載された。導入後は栄養の投与量が増え、退院時の体重の発育も良くなっていた。\n【背景】在胎期間がとても短く小さく生まれた赤ちゃんは、生まれてからの成長が遅れやすく、十分な栄養を早くから届けることが課題になっている。今回の取り組みは、静脈栄養や経腸栄養の手順そのものは変えず、医師や栄養士など複数の職種が毎日、栄養の状態を確かめる体制をつくったものだ。\n【詳細】対象は在胎29週以下または出生体重1,200グラム以下の院内出生児で、145人を調べ、除外後の124人（導入前61人、導入後63人）を分析した。平均の在胎週数は26.49週と27.10週、出生体重は910グラムと998グラムだった。生後1週の静脈栄養のたんぱく質は1日体重1キロ当たり2.36グラムから2.75グラムに、エネルギーは59.7キロカロリーから76.0キロカロリーに増えた。全量を経腸栄養でとれるまでの日数は23.4日から18.4日に、入院日数は86.6日から73.4日に短くなった。退院時の体重のzスコアはマイナス1.87からマイナス1.23に改善し、退院時の発育不全の割合は67.8％から49.2％に下がった。一方、生後2週時点の体重には差がなく、気管支肺異形成症や重い未熟児網膜症、死亡の割合にも明らかな違いは見られなかった。\n【ポイント・注意点】著者らは、結果は手順がより確実に実行されたことと矛盾しないものの、因果関係は確定できず、静脈栄養を増やしたこと自体の効果も切り分けられないとしている。後ろ向きの研究であることや、見られていることを意識して行動が変わる効果（ホーソン効果）の可能性、経腸栄養の記録が4週間分に限られることなどが限界として挙げられている。まれな合併症については、差を見つけるだけの人数が足りないという。","2026-11-26","Frontiers in Pediatrics","https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2026.1967298/full"],["アデノイド・扁桃肥大の子 聴力が落ちるほど「話を聞いていない」と評価","中国の研究チームは、アデノイドと扁桃の肥大がある4〜10歳の子ども371人を調べ、聴力が低いほど、ADHDの評価票の「直接話しかけても聞いていないように見える」という項目の点数が高い傾向があったと報告した。ただし両耳の聴力に異常がある群と正常な群の比較は、多重比較の補正後は有意でなかった。研究チームは探索的な結果で、ADHDを示すものではないとしている。成果は学術誌Frontiers in Pediatricsに掲載された。","\n【概要】中国の研究チームは、アデノイドと扁桃の肥大がある子どもで、聴力の低さと、保護者が評価するADHDの特定の症状との関係を調べた探索的な研究を「Frontiers in Pediatrics」に発表した。聴力が低いほど「直接話しかけても聞いていないように見える」と評価されやすい傾向があった。\n【背景】のどの奥にあるアデノイドや扁桃が大きくなると、いびきや睡眠時の無呼吸のほか、耳の聞こえに影響することがある。聞こえにくさがあると、話を聞いていないように見え、不注意と受け止められる可能性がある。研究チームはこの点を確かめるため、聴力検査と保護者による評価票を照らし合わせた。\n【詳細】2024年1月から2025年12月に調べた404人のうち、除外後の4〜10歳の371人を分析した。6歳未満は205人だった。純音聴力検査で、両耳とも25デシベル以下の正常群228人、片耳が異常の31人、両耳が異常の112人に分けた。保護者は18項目のADHD評価票（SNAP-IV）に答えた。年齢、性別、扁桃の大きさ、睡眠時無呼吸の指標などで調整すると、両耳異常群は正常群に比べ「聞いていないように見える」項目の点数が高い傾向があった（オッズ比1.75）。ただしこの群の差は、18項目全体で多重比較の補正をすると有意ではなくなった。一方、聴力を連続した値で見ると、聞こえの良い方の耳の聴力が10デシベル悪くなるごとに点数が0.19点上がり、補正後も関連が残った。この関連は聴力の低い子に集中しており、40デシベル以下の354人に絞ると見られなくなった。\n【ポイント・注意点】研究チームは、結果は探索的なもので、ADHDの診断や因果関係を示すものではないとしている。両耳異常群は平均年齢が4.66歳と正常群の6.05歳より低く、睡眠時無呼吸の指標も高かった。1施設のデータであること、評価が保護者1人によるもので教師の評価や正式なADHDの診断がないこと、滲出性中耳炎との重なりがあることなどが限界とされる。子どもの不注意に見える様子の背景に、聞こえの問題がないかを確かめる大切さを示す結果といえる。","2026-11-26","Frontiers in Pediatrics","https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2026.1902207/full"],["放課後の英語学習で子の作業記憶が向上 楽器の練習は差が出ず スペイン","スペインの研究チームは、8〜9歳の子ども70人を英語、楽器、何もしない対照の3群にランダムに分け、週1回の習い事を24回続けた後の認知機能を比べた。英語の群では、聞いた数字を逆の順に言う課題で測る聴覚の作業記憶が、対照群や楽器の群より高くなった。楽器の群と対照群の差は小さく、有意ではなかった。人数が少ないなどの限界もある。成果は学術誌Frontiers in Psychologyに掲載された。","\n【概要】スペインの国立遠隔教育大学（UNED）に所属する研究チームは、課外活動としての第二言語（英語）の学習と楽器の練習が、子どもの認知機能の発達にどう影響するかをランダム化比較試験で調べ、「Frontiers in Psychology」に発表した。英語を学んだ子どもで、聴覚の作業記憶が選択的に伸びていた。\n【背景】外国語や音楽の習い事は、子どもの頭の働きを広く高めると期待されることが多い。しかし、どの能力にどの程度の効果があるのかを、ランダムに群を分けて確かめた研究は限られている。研究チームは同じ条件で2種類の習い事を比べることにした。\n【詳細】2021年5月に5つの小学校から8〜9歳の子ども78人を集め、8人が途中で離れたため70人（男子37人、女子33人、平均8.86歳）を分析した。英語の群22人、楽器の群25人、何もしない対照群23人に分け、英語と楽器の群はさらに個人レッスンと少人数のグループレッスンに分けた。2021年11月から2022年5月まで、週1回、計24回のレッスンを同じ講師が担当した。結果を測ったのは、図形の規則を見抜く課題（抽象的な推論）、聞いた数字を順に言う課題（聴覚の短期記憶）、逆の順に言う課題（聴覚の作業記憶）の3つだ。作業記憶では、英語の群の点数が対照群より大きく上回り（効果量d=1.11）、楽器の群も上回った（d=0.71）。楽器の群と対照群の差は小さく有意ではなく、統計的にも結論が出なかった。短期記憶と抽象的な推論では群の差がなく、推論の点数はどの群でも上がった。英語の個人レッスンとグループレッスンの差はほとんどなかった。\n【ポイント・注意点】著者らは、約6カ月半の英語の授業が聴覚の作業記憶を選択的に強めたと結論づけている。ただし各群は20人あまりと少なく、検出できるのは大きな効果に限られる。講師が測定も担当し、誰がどの群か分かる状態だったこと、対照群が何もしない群だったこと、事前に試験登録されていなかったことなどが限界とされる。1回の試験の結果であり、再現の確認が必要だ。","2026-11-26","Frontiers in Psychology","https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2026.2022680/full"],["自閉症の子の話し言葉を機械学習で分析 「質問の少なさ」が際立つ違いに","自閉症の子どもの話し言葉を、英語の会話記録データベースから集めた115人・約3万5千発話で機械学習を使って分析した研究が発表された。年齢と知能を合わせた発達の遅れのある子どもと比べると、文法や会話のやりとりの特徴で一定程度見分けられたが、補正後も残った違いは質問をする頻度の低さだけだった。自閉症の子は別々の型に分かれるより連続的に違うことも示された。人数が少なく、臨床に使うには再現の確認が必要としている。","\n【概要】自閉症スペクトラム症（ASD）の子どもの言語と認知の発達を、機械学習を使って分析した研究が「Frontiers in Psychology」に掲載された。発達の遅れのある子どもと比べて最もはっきりした違いは、自分から質問をする頻度が低いことだった。\n【背景】自閉症の子どもの言葉の特徴は一人ひとり大きく異なる。どのような特徴がほかの発達の遅れと区別されるのか、またいくつかの型に分かれるのかについては議論が続いている。研究チームは、大量の会話記録を機械学習で分析することで、この点を調べた。\n【詳細】英語の子どもの会話を集めたデータベースASDBankの5つの資料から、115人の子どもの発話3万4,946件を使った。生後21〜79カ月の子どもを一時点で比べたデータと、30〜117カ月の自閉症の男児を追った記録が含まれる。文法、語彙、会話のやりとり、言語モデルによる指標など37の特徴を調べた。主な比較は、自閉症の子ども16人と、年齢と知能を合わせた発達の遅れのある子ども16人だ。文法の特徴による判別の精度（AUC）は0.74、会話のやりとりの特徴では0.71だった。多重比較の補正後も残った違いは、質問をする頻度の低さだけだった。言語モデルの指標はほとんど精度を上げなかった。言語の水準を合わせた定型発達の幼児とは、どの言語の領域でも区別できなかった。自閉症の子どもは、はっきり分かれた型を形づくるのではなく、言語の連続的な軸などに沿ってばらついていた。自発的に使う語彙の多様さは、理解できる語彙の量と連動していた。発話が長くなるほど、直前の大人の言葉をくり返す割合は減っていた。\n【ポイント・注意点】比べた群は16人ずつと非常に少なく、別のデータでの検証もしていない。別の資料で試した判別の精度は0.64〜0.67にとどまった。英語だけのデータで、参加者の多くが男児であることも限界だ。著者らは、臨床で使う前に独立した再現が必要だとしている。質問の少なさは、ことばの支援を考えるうえで手がかりになる可能性がある。","2026-11-26","Frontiers in Psychology","https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2026.2020782/full"],["運動でADHDの子の実行機能が向上する可能性 14試験579人を統合分析","ADHDと診断された12歳以下の子どもを対象に、運動が実行機能に与える効果を調べた14件のランダム化比較試験、計579人を統合した分析が発表された。運動をした群では、衝動を抑える力、作業記憶、考えを切り替える柔軟性のいずれも対照群より改善していた。ただし研究ごとのばらつきが大きく、証拠の確かさは「非常に低い」から「中程度」にとどまる。最適な運動の種類や量は決められないとしている。","\n【概要】ADHD（注意欠如・多動症）の子どもに対する運動の効果を、これまでのランダム化比較試験をまとめて調べた系統的レビューとメタ分析が「Frontiers in Psychology」に掲載された。運動は、行動や考えを調整する「実行機能」を高める補助的な方法になりうると結論づけている。\n【背景】実行機能には、衝動を抑える力、情報を一時的に覚えておく作業記憶、状況に応じて考えを切り替える柔軟性などが含まれ、ADHDの子どもではこれらに困難が見られることが多い。運動が役立つとする研究はあるが、運動の種類や期間はさまざまで、全体としての効果ははっきりしていなかった。\n【詳細】5つのデータベースを2026年11月まで検索し、正式にADHDと診断された12歳以下の子どもを対象とした14件の試験を選んだ。参加者は計579人（運動群312人、対照群267人）で、平均年齢は7.53〜10.63歳だった。運動の内容は有酸素運動、体を動かすゲーム、スポーツ、水泳、ヨガ、縄跳び、認知課題と組み合わせた運動などで、1回15〜90分、1回だけのものから6〜12週間続くものまであった。統合した効果の大きさ（g）は、衝動を抑える力が0.82（13研究）、作業記憶が1.00（11研究）、考えの柔軟性が0.66（7研究）で、いずれも運動群が上回った。有酸素運動やスポーツ・ゲーム、週3回、10〜12週間のプログラムで効果が見られたが、これらの違いは正式には検定されていない。\n【ポイント・注意点】作業記憶では、小規模な研究ほど効果が大きく出る偏りの可能性が示された。研究間のばらつきも大きく、証拠の確かさの評価は「非常に低い」から「中程度」だった。研究の質の評価（PEDro）の平均は6.21点で、1件ずつ除いて計算し直しても効果の向きと有意性は変わらなかった。参加者がどの群か分かっていたことによる偏りの危険も高い。著者らは、運動は補助的な手段として役立つ可能性があるが、最適な種類や回数、強さはまだ決められないとしている。","2026-11-26","Frontiers in Psychology","https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2026.1965328/full"],["親の感情表現と10代の食行動の乱れ 「他人との比較」が影響 パキスタン","パキスタン・ラホールの中等学校に通う10代500人を調べた研究で、家庭で親が前向きな感情をよく表すほど食行動の乱れが少なく、否定的な感情を表すほど多い関係が見られた。いじめやネットいじめを通じた影響は小さく、自分を他人と比べる傾向が食行動の乱れと関連していた。著者らは、家庭の感情の雰囲気が介入の最も有望な対象だとしている。一時点の調査のため因果関係は分からない。","\n【概要】パキスタンの研究チームは、親の感情の表し方、いじめ、他人との比較が、10代の食行動の乱れとどう関わるかを調べた研究を「Frontiers in Psychology」に発表した。家庭の感情の雰囲気が食行動と直接結び付いていることが示された。\n【背景】思春期は体の変化が大きく、周りの目や他人との比較に敏感になりやすい時期だ。食べ方の乱れは、家庭の環境や友人関係、自己評価などさまざまな要因と関わると考えられている。研究チームは、親の感情表現から食行動に至る道筋のなかで、いじめと社会的比較がどんな役割を果たすかを調べた。\n【詳細】対象はラホールの10校に通う中等学校の生徒500人（平均16.28歳）で、自分で答える質問票を使った一時点の調査だ。親の前向きな感情表現と否定的な感情表現、友人からのいじめ、ネットいじめ、他人との比較、食行動の乱れを測り、複数の経路を同時に調べる統計モデルで分析した。親が前向きな感情を表すほど食行動の乱れは少なく（全体の効果B=マイナス0.334）、否定的な感情を表すほど多かった（B=0.274）。媒介する要因を加えても親の感情表現からの直接の効果は有意なまま残り、一部だけが媒介されていた。いじめやネットいじめを通じた間接の効果は、いずれも0.01前後とごく小さかった。他人との比較は食行動の乱れを予測し（B=0.18）、比較の傾向を含めると、いじめを通る経路は有意でなくなったという。モデルの当てはまりの指標（CFI 0.97、RMSEA 0.049）は良好だった。\n【ポイント・注意点】著者らは、家庭の感情の雰囲気が最も有望な介入の対象で、いじめの防止や比較への対策は補完的な要素になると結論づけている。ただし一時点の調査で因果の向きは確かめられず、食行動の乱れが逆に家庭や友人関係に影響している可能性もある。対象は1都市に限られ、生徒の選び方は無作為ではなく、摂食障害などの診断を受けた生徒は除いている。自己申告のみで、体格や家庭の経済状況、SNSの利用は調べていない。","2026-11-26","Frontiers in Psychology","https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2026.2019636/full"],["中学生の社交不安 幸福感を下げる主な経路は孤独感 中国1342人調査","中国江西省の中学生1,342人を調べた研究で、社交不安の程度によって生徒を低・中・高の3つのタイプに分けると、不安が強いタイプほど生活の満足感や前向きな気分が低く、その主な経路は孤独感だった。運動を続けることを通じた経路もあったが効果は小さかった。著者らは、社交不安のある生徒の孤独感への対応が重要で、運動は補助的な役割にとどまるとしている。一時点の自己申告の調査である。","\n【概要】中国の研究チームは、中学生の社交不安のタイプと主観的な幸福感の関係を調べ、運動の継続と孤独感がどのように間に入るかを分析した研究を「Frontiers in Psychology」に発表した。孤独感が主な経路だった。\n【背景】社交不安は、人前で話したり人と関わったりする場面で強い不安を感じる状態で、思春期に目立ちやすい。運動は心の健康に良いとされ、社交不安のある子どもの支えになるとも期待されている。研究チームは、運動の継続と孤独感のどちらが幸福感に強く関わるのかを調べた。\n【詳細】江西省の8校43学級で質問票1,513部を配り、有効な回答1,342人分（平均14.03歳、男子730人）を得た。有効回答率は88.6％だった。統計的な手法で社交不安の現れ方を分類すると、低いタイプが37.26％（500人）、中程度が42.03％（564人）、高いタイプが20.71％（278人）の3つに分かれた。分類の明確さを示す指標（エントロピー）は0.922と高かった。幸福感は生活の満足感と前向きな気分で測った。欠けた回答を除く1,225人で経路を分析すると、低いタイプと比べた場合、孤独感を通じた生活満足感への間接効果は、高いタイプでマイナス0.353、中程度でマイナス0.180だった。前向きな気分ではそれぞれマイナス0.459、マイナス0.234だった。運動の継続を通じた間接効果はマイナス0.063とマイナス0.051と小さく、運動の継続から孤独感へと続く経路の効果はさらに小さかった。中程度と高いタイプの間では、運動の継続に差がなかった。\n【ポイント・注意点】著者らは、孤独感が主な経路で、運動は限られた補助的な役割を果たすにとどまると結論づけている。社交不安が強い生徒への支援では、運動を勧めるだけでなく、孤独を和らげる関わりが大切になることを示す結果だ。ただし一時点の自己申告による調査で、因果関係や時間的な順序は確かめられない。対象は1つの省に限られ、同じ方法で測ったことによる偏りの可能性もある。","2026-11-26","Frontiers in Psychology","https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2026.1995348/full"],["子のアデノイド肥大 手術の目安を知る親は28％ 中国・寧波421人調査","中国・寧波で0〜14歳の子を持つ親421人に、子どものアデノイド肥大についての知識や考え、行動を尋ねた調査で、知識が合格水準に達した親は47.26％にとどまった。手術が必要な場合を答えられたのは28.27％で、54.63％は治療しなくても自然に小さくなると考えていた。基準を満たしても手術を受け入れるとした親は50.83％だった。主な情報源はマスメディアで、著者らは健康教育の強化が必要だとしている。","\n【概要】中国・寧波の研究チームは、子どものアデノイド肥大について親がどの程度知り、どう考え、どう行動しているかを調べた調査結果を「Frontiers in Pediatrics」に発表した。重要性は理解しているものの、知識が十分でない親が多いことが分かった。\n【背景】アデノイドは鼻の奥にあるリンパ組織で、子どもの時期に大きくなると、いびきや口呼吸、睡眠中の呼吸の乱れなどにつながることがある。治療方針を決めるうえで親の理解は欠かせないが、親の知識や考え方の実態は十分に分かっていなかった。\n【詳細】2024年1月から2025年10月に、幼稚園、小学校、杭州湾病院の小児科外来を通じてオンラインで質問票を配り、有効な回答421人分（有効率92.94％）を集めた。子どもの53.21％が男児、80.29％が4〜8歳で、30.40％にあたる128人がアデノイド肥大と診断されていた。知識の平均点は27点満点中19.00点で合格は47.26％だったのに対し、考え方の合格は84.32％、行動の合格は86.22％と高かった。手術が必要な場合を正しく答えられたのは28.27％で、54.63％が治療しなくても自然に小さくなると考えていた。基準を満たした場合に手術を受け入れるとしたのは50.83％だった。主な情報源はマスメディア（62.17％）で、健康教育の講座は19.71％にとどまった。子どもがアデノイド肥大と診断されていることや受診が4回以上あることは十分な知識と関連し、農業従事者や無職の親では知識が少ない傾向があった。知識は前向きな考え方と、考え方や医療保険の加入は良い行動と関連していた。\n【ポイント・注意点】著者らは、親の知識は低く、重要性の認識は高いが、複雑な治療の判断の受け入れは低いとまとめている。ただし1つの病院と2つの学校で集めた便宜的な標本で、偏りの可能性がある。子どもの約7割は診断を受けていないため、行動の項目は実際の行動ではなく意向を表している。診断を受けた子に限った分析も、結果は安定しなかった。","2026-11-26","Frontiers in Pediatrics","https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2026.2035604/full"],["妊娠中のADHD治療薬 子の発達障害リスク上昇と関連せず 北欧364万人","デンマーク、ノルウェー、スウェーデンの健康登録データで2000〜2021年生まれの子ども364万3,376人を調べた研究で、母親が妊娠中にADHD治療薬を使っても、子どもの神経発達症のリスク上昇とは関連しなかった。使用は7,595人（0.2％）で、薬の種類別や妊娠中期以降の使用でも同様だった。著者らは、子どもの発達への懸念を理由に妊娠中の服薬をやめる必要はないとしている。成果は英医学誌BMJに掲載された。","\n【概要】北欧3カ国の健康登録データを使った大規模な研究で、妊娠中に母親がADHD（注意欠如・多動症）の治療薬を使っていても、生まれた子どもが神経発達症になるリスクは高くならないことが示された。論文は英医学誌「The BMJ」に掲載され、関連する論説も同時に掲載された。\n【背景】ADHDの治療薬を使う女性が増え、妊娠中も服用を続けるかどうかの判断が課題になっている。しかし、胎内で薬にさらされた子どもの長期的な発達への影響については、十分な証拠がなかった。今回の研究は、3カ国の詳しい登録データを使ってこの疑問に答えようとしたものだ。\n【詳細】デンマーク、ノルウェー、スウェーデンで2000〜2021年に生まれた子ども364万3,376人を対象に、スウェーデンでは中央値9年、ノルウェーとデンマークでは10年追跡した。妊娠中にADHD治療薬にさらされたのは7,595人（0.2％）で、妊娠中期・後期にさらされたのは2,389人（0.1％）だった。薬の内訳はメチルフェニデートが69％、アンフェタミン類が20％、アトモキセチンが7％で、4％は複数の種類を使っていた。子どもの性別と生まれ年、母親の年齢、出生国、学歴、妊娠中の喫煙、ADHDの診断、ほかの薬の使用を考慮して分析した。その結果、妊娠中のどの時期の使用も、中期・後期の使用も、全体でも薬の種類別でも、神経発達症、行動や情緒の障害、心理的・知的な発達の障害のリスク上昇とは関連しなかった。妊娠後期に一部の薬で高いリスクが見られたが、著者らは偶然による可能性があるとしている。\n【ポイント・注意点】観察研究のため、ADHDの重さや遺伝など測れていない要因が結果に影響した可能性は残る。妊娠中に薬を使った人の割合が低く、一部の病気では結論を出すのに十分な件数がなかった。それでも著者らは、規模の大きさ、追跡の長さ、詳しい登録データから結果は頑健だとし、結果は「おおむね安心できる」もので、子どもの発達への懸念を理由に妊娠中の服薬をやめる必要はないと述べている。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-adhd-meds-pregnancy-linked-developmental.html"],["1歳半の49％が毎日画面を視聴 遊びや読み聞かせを奪う恐れ ハンガリー","ハンガリーの出生コホート調査で幼い子ども2,569人のデータを分析したところ、生後18カ月の子の49％が毎日画面にさらされ、37.5％は1日1時間を超えていた。毎日見る子の平均は2時間を超える。画面の時間が長い子ほど、親と一緒に遊んだり本を読んだりする機会が少なかった。研究チームは、画面が体を動かす遊びや親子の会話の時間を奪っている可能性を指摘し、保護者や医療者への提言をまとめた。","\n【概要】ハンガリーのエトヴェシュ・ロラーンド大学（ELTE）などの研究チームは、1歳半の子どもの約半数が毎日テレビやスマートフォンなどの画面にさらされているとする研究を学術誌「Biologia Futura」に発表した。筆頭著者は人口・経済研究所のクリスティナ・コプチョー氏、責任著者はELTE動物行動学部門のアーコシュ・ポガーニ氏。\n【背景】専門家の指針は、2歳になる前は画面を避けるよう勧めることが多い。これまでの研究では、幼いころから画面を長く使うことが、後の言葉や認知の発達、感情の調整の難しさと関連すると報告されてきた。2歳未満の子どもは、画面よりも実際の人とのやりとりからよく学ぶとされる。\n【詳細】研究は、ハンガリーの代表的な出生コホート調査「コホート'18」で幼い子ども2,569人のデータを使い、2019〜2020年に集めた情報を分析した。生後18カ月の子どもの49％が毎日画面にさらされ、37.5％はふだんの日に1時間以上画面の前で過ごしていた。毎日見る子どもに限ると、平均の視聴時間は2時間を超えていた。最も多いのはテレビだったが、この年齢でもスマートフォンやタブレットの使用がすでに広がっていた。画面の時間が長い傾向は、収入が低い家庭や母親の学歴が低い家庭で多かった。また、画面の時間が長い子どもほど、親と一緒に遊んだり本を読んだりする頻度が低かった。研究チームは、画面が体を動かす遊びや親子の会話の時間を押しのける「置き換え効果」が起きていると考えている。\n【ポイント・注意点】ポガーニ氏は、幼い子どもは主に自分から周りを探り、人とやりとりすることで学ぶと強調している。記事は、親のスマホ使用が一緒の遊びや食事、なだめる場面を途切れさせることにも触れた。提言として、親には画面のない日課や一緒の遊び、小児科医や保健師には出産前からの助言、プラットフォームや政策担当者にも対応を求めた。データは2019〜2020年のもので、仕組みはまだ十分に分かっていない。記事は、代表性のある調査にもとづく結果だとしている。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-premature-screen-play-movement-interaction.html"],["父親の受胎前の抗うつ薬 子の高血圧とわずかに関連 デンマーク136万人","デンマークで2000〜2023年に生まれた子ども136万5,887人を調べた研究で、父親が受胎前の約3カ月に抗うつ薬を使っていた子は、代謝疾患と診断される割合がわずかに高かった。ただし高まっていたのは高血圧だけで、2型糖尿病や肥満などでは有意な差はなかった。妊娠中だけ使っていた父親の子と比べると差はなく、著者らは薬そのものより父親の心の病気が関わっている可能性が高いとしている。成果は英医学誌BMJに掲載された。","\n【概要】デンマークの全国的な健康登録データを使った研究で、父親が子どもの受胎前に抗うつ薬を使っていた場合、子どもの代謝疾患のリスクがわずかに高いことが示された。ただし著者らは、薬そのものの影響ではなく、父親の心の病気が背景にある可能性が高いとしている。論文は英医学誌「The BMJ」に掲載された。\n【背景】母親の妊娠中の服薬が子どもに与える影響は多く調べられてきたが、父親の服薬の影響についての研究は少ない。精子がつくられる受胎前の約3カ月間の薬の使用が、子どもの健康に関わるかどうかが注目されている。研究チームは、薬そのものの影響と、父親の心の病気の影響を見分けることを重視した。\n【詳細】2000〜2023年にデンマークで生まれた子ども136万5,887人を、出生から最長23年（平均12年）追跡した。父親が精子形成期にあたる受胎前約3カ月間に抗うつ薬を1回以上処方されていた子どもは2万3,572人（1.7％）で、そうでない134万2,315人と比べた。代謝疾患は2型糖尿病、高血圧、高コレステロール、過体重・肥満と定義した。全体で1万8,353人（1.3％）が代謝疾患と診断され、発生率は1,000人年当たり、父親が薬を使っていた子で1.39、使っていなかった子で1.11だった。わずかに高かったのは高血圧だけで、ほかの病気では統計的に有意ではなかった。父親の心の病気の影響を見分けるため、受胎前だけ使っていた父親の子4,156人と、妊娠中だけ使っていた父親の子1万7,318人を比べると、差は見られなかった。\n【ポイント・注意点】分析では親の年齢、学歴、精神疾患の既往、ほかの薬の使用、代謝疾患の既往を考慮した。観察研究で、追跡も成人期の初めまでに限られるため、因果関係や長期的なリスクについては確かな結論を出せない。一方で、登録データを使ったため、記憶違いや対象の選び方による偏りは小さいと著者らは説明している。著者らは、抗うつ薬で治療を受けながら子どもを望む男性にとって安心材料になる結果だとしている。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-dad-antidepressant-linked-higher-metabolic.html"],["体の内側の感覚に敏感な10代少女 自分の体形への不満が小さい傾向 英研究","英ケント大学の研究チームは、10〜14歳の少女を対象に、心拍などの体の内側の信号を感じ取る力「内受容感覚」と、自分の体形への不満との関係を調べた。心拍を数える課題で正確だった少女ほど、体への不満が小さかった。思春期が進んだ少女で、この関連はより強く見られた。因果関係を示すものではなく、研究チームは内側の感覚への気づきを高める支援が役立つかを今後確かめるとしている。","\n【概要】英ケント大学心理学部の研究チームは、体の内側の信号を感じ取る力が高い10代の少女ほど、自分の見た目への不満が小さい傾向があるとする研究を学術誌「Philosophical Transactions of the Royal Society B」に発表した。研究を率いたのは、社会・感情神経科学を専門とするマリアナ・フォン・モール講師だ。\n【背景】心拍や呼吸、空腹など体の内側の状態を感じ取る力は「内受容感覚」と呼ばれる。思春期には体が急速に変わり、見た目への悩みが強まりやすい。研究チームは、内側の感覚への気づきが、思春期の少女の体のイメージとどう関わるかを調べた。\n【詳細】対象は、思春期のさまざまな段階にある10〜14歳の少女たちで、思春期の進み具合による違いも比べられるようにした。内受容感覚は、自分の心拍を数える課題で測った。体への不満は2つの方法で調べ、言葉による答えと目で見たイメージの両面からとらえようとした。1つは質問票で、もう1つはコンピューター上で女性の姿の形や大きさを調整し、自分の体がどう見えていると思うか、理想ではどうありたいかを示してもらう課題だ。その結果、内側の信号をより正確に感じ取れる少女ほど、体への不満が小さいと答えていた。コンピューターの課題では、思春期の後半の段階にいる少女でこの関連がより強かった。フォン・モール氏は、思春期には体が急に変わるため、体の見た目への悩みが強まる時期にこそ、内側の信号に正確に気づけることがより大切になるのかもしれないと述べている。\n【ポイント・注意点】記事は、この研究が示したのは関連であり、原因と結果の関係ではないと明記している。記事には参加者の人数や、関連の強さを示す統計の詳しい数値は示されていない。研究チームは次の段階として、少女が体の内側の信号に気づけるよう手助けすることで、思春期の体のイメージの悩みに対処しやすくなるかを確かめたいとしている。見た目だけでなく体の感覚に目を向ける支援の可能性を示す研究といえる。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-teenage-girls-tune-bodies-tend.html"],["乳児に多い脳腫瘍ATRT 新薬候補「コリン」がマウスで延命 米研究","米ジョンズ・ホプキンス大学などの研究チームは、乳児で最も多い脳腫瘍である非定型奇形腫様ラブドイド腫瘍（ATRT）に対し、同大で開発された薬「コリン」が効果を示す可能性を前臨床研究で報告した。培養した腫瘍細胞の増殖を抑えて細胞死を促し、腫瘍のあるマウスでは治療しない場合より長く生きた。人での試験はまだ行われていない。成果は学術誌Neuro-Oncologyに掲載された。","\n【概要】米ジョンズ・ホプキンス大学医学部とキンメル総合がんセンターなどの研究チームは、乳児の脳腫瘍ATRT（非定型奇形腫様ラブドイド腫瘍）に対し、同大で開発された薬の候補「コリン（corin）」が有望だとする前臨床研究を学術誌「Neuro-Oncology」に発表した。筆頭著者はアヌパ・ギータデヴィ氏で、エリック・ラーベ准教授とボストン大学のローダ・アラニ氏が共同で研究を率いた。同大でコリンを開発したフィリップ・コール博士（現ハーバード大学）も共著者に名を連ねる。\n【背景】ATRTは乳児で最も多い脳腫瘍で、記事によると、集中的な治療を受けても生き延びる乳児は3分の1を少し超える程度にとどまり、生き延びても治療による合併症に生涯悩まされることが多い。新しい仕組みで働く治療法が求められている。\n【詳細】コリンは、腫瘍細胞を未熟で増殖の速い状態に保つたんぱく質の複合体「CoREST」を標的とする薬だ。研究室で育てた腫瘍細胞では、コリンが増殖を止め、細胞死を促した。また遺伝子の働きを調節するエピジェネティックな仕組みを元に戻し、細胞の成熟に関わる遺伝子が働けるようにした。ATRTの腫瘍があるマウスでは、腫瘍細胞の死と成熟が起き、治療を受けたマウスは治療しなかったマウスより長く生きた。たんぱく質RCOR2の働きを抑えても同様の効果が出たことから、チームはCoRESTが標的だと裏付けられたとしている。チームは、脳に埋め込む器具（オマヤリザーバー）を使って薬を腫瘍や脊髄液に直接届ける投与方法も考案した。\n【ポイント・注意点】ラーベ氏は、異なる仕組みで働く新しい治療法が必要だと述べている。ただし研究は前臨床段階の「最初の一歩」で、人での試験は行われていない。記事にはマウスの数や生存期間の具体的な数値は示されていない。研究には製薬会社ファイザーに所属する共著者も加わっている。コリンと別の薬デシタビンを組み合わせる前臨床研究も進んでおり、ほかのラブドイド腫瘍や皮膚がんへの応用の可能性にも触れている。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-preclinical-corin-deadly-brain-tumor.html"],["10代に銃のけがの危険と友人の助け方を教える講座 理解が持続 米28州","米イェール大学の研究チームは、銃によるけがの危険と、友人が危ない状態にあるときの関わり方を10代に教える講座「Guardians 4 Health」を全国規模のランダム化試験で検証した。28州50クラブの10代400人以上が参加し、講座は危険因子への理解を高め、その効果は続いた。危ない兆しを見せる友人に安全な行動をとる意欲も一時的に高まった。米国では銃によるけがが10代の死因の第1位となっている。","\n【概要】米イェール大学公衆衛生大学院のミーガン・ラニー学長らの研究チームは、10代の若者に銃によるけがの危険と、周りの人としての関わり方を教える講座の効果を、全国規模のランダム化試験で確かめた。成果は学術誌「JAMA Health Forum」に掲載された。共著者には同大医学部のグワンユ・トン助教らが加わった。\n【背景】米国では、銃によるけがが10代の死因の第1位になっている。研究チームは、射撃スポーツに取り組む若者の全国組織「4-Hシューティング・スポーツ」と協力し、居合わせた人が危険に気づいて行動する「バイスタンダー介入」の考え方を取り入れた講座「Guardians 4 Health」をつくった。講座は、鍵のかかっていない銃に触れられること、薬物の使用、抑うつの症状といった危険因子を扱う。\n【詳細】試験はクラブ単位のランダム化試験で、参加に同意したクラブを、すぐに講座を受ける群と、遅れて受ける群に半分ずつ分けた。指導者、保護者、10代の若者が登録し、若者は28州の50クラブから400人以上が参加した。効果は講座の開始時、3カ月後、6カ月後の3回にわたって測った。その結果、講座は銃によるけがの危険因子についての若者の理解を高め、その効果は持続した。また講座を受けた若者は、友人や仲間が危険な状態に陥りそうな兆しを見せたときに安全な行動をとる意欲が、一時的に高まった。ラニー氏は、銃によるけがを減らす方法は数多くあるが、まだ学ぶべきことも多いと述べている。記事は、4-Hとの協力関係がこの研究に必要な信頼を築いたとしている。\n【ポイント・注意点】記事には効果の大きさや、行動への意欲が「一時的」に高まった期間の長さ、参加者の年齢の範囲は示されていない。研究は、ほかの種類のけがで行われてきたバイスタンダー介入の研究を土台にしており、その考え方を銃によるけがの予防に応用できるかを確かめた点に意義がある。銃を身近に扱う若者に、危険のサインと友人への関わり方を教える取り組みとして注目される。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-youth-firearm-injury.html"],["祖父の喫煙と多量の飲酒 孫の自閉症リスクと関連か 米国の3世代研究","米カリフォルニア州の3世代にわたる研究で、妊婦の夫、つまり後に生まれる孫から見た祖父の喫煙が、孫の自閉症リスクの上昇と関連していた。1日20本以上吸っていた場合、リスクは約2倍だった。週5杯以上の蒸留酒を飲む祖父でも約3倍と推定されたが、該当する例は10件と少ない。祖母の喫煙やコーヒー、お茶とははっきりした関連がなかった。因果関係は示せないとしている。成果は学術誌Autism Researchに掲載された。","\n【概要】米カリフォルニア州公衆衛生局や公衆衛生研究所の「子どもの健康と発達研究（CHDS）」などの研究チームは、祖父の喫煙や多量の飲酒が孫の自閉症スペクトラム症（ASD）のリスクと関連する可能性があるとする研究を、学術誌「Autism Research」に発表した。\n【背景】自閉症の原因には遺伝と環境の両方が関わるとされるが、親より前の世代、つまり祖父母の生活習慣が孫に影響するかどうかは、ほとんど分かっていない。CHDSは1959〜1967年に妊婦を登録した長期の研究で、妊婦が自分とパートナーの喫煙や飲酒、コーヒー、お茶の習慣を報告していた。\n【詳細】研究チームは、1989〜2014年にカリフォルニア州で生まれた孫の出生記録1万8,053件を親と結び付け、祖父母7,856人の情報とつないだ。分析した孫は1万4,059人で、そのうち86人（女児14人、男児72人）が州の発達支援の記録からASDと確認された。このコホートのASDの有病率は出生1,000人当たり6.1人で、州全体の調整後の値4.7人より高かった。祖父が当時たばこを吸っていたことはASDのリスク上昇と関連し、1日20本以上では約2倍になった。週5杯以上の蒸留酒を飲む祖父ではリスクが約3倍と推定されたが、該当する例は10件しかなく、推定の精度は低い。週9杯以上の飲酒との関連ははっきりせず、適度な飲酒やビール、ワイン、コーヒー、お茶、祖母の喫煙とは明確な関連が見られなかった。調整前の数字では、ASDの孫の祖父の68％が妊娠中に喫煙しており、全体の58％を上回っていた。\n【ポイント・注意点】論文はパール氏らによるもので、カリフォルニア州バークレーの公衆衛生研究所などが参加した。ASDの孫の数が少ないこと、生活習慣のデータが欠けていること、診断が見落とされた可能性、遺伝や家族の要因による交絡、パートナーの習慣を妊婦が間接的に報告したことなどが限界とされる。著者らは因果関係は示せないとし、受動喫煙や精子の遺伝子調節などの仕組みも確かめられていないと述べている。","2026-11-25","News-Medical","https://www.news-medical.net/news/20261125/Grandfatherse28099-smoking-and-heavy-drinking-may-hold-clues-to-autism-risk.aspx"],["若者がAIに心の相談 117アプリを分析 根拠のない効能をうたう例も","カナダのブリティッシュコロンビア大学のジュリー・ロビラード准教授は、AIによる心の健康アプリ117件を分析し、プライバシーや安全性、効果の伝え方に大きな不足があり、根拠なしに効果をうたうものもあったと指摘した。カナダの若者の約5人に1人がAIを心の支えに使っているという研究もある。同氏は保護者に対し、使用を制限するより、AIをどう使っているかを子どもと率直に話し合うよう勧めている。","\n【概要】カナダのブリティッシュコロンビア大学（UBC）は、若者が心の健康の相談にAIを使う動きについて、神経学のジュリー・ロビラード准教授に聞いた記事を公開した。同氏の研究室は、多くのAIチャットボットが効果や使いやすさ、秘密の守り方について誤解を招く主張をしていると指摘している。関連する論考は学術誌「Child and Adolescent Mental Health」に掲載された。\n【背景】記事は、カナダの若者のおよそ5人に1人がAIを心の支えとして使っているとする別の研究を紹介している。AIのチャットボットはいつでも使えるため、悩みを抱える若者にとって身近な相談相手になりつつある。一方で、安全性や効果の裏付けは十分に検証されていない。\n【詳細】ロビラード氏の研究では、AIを使った心の健康アプリ117件を調べ、プライバシー、安全性、効果についての情報の伝え方に大きな不足があることが分かった。一部のアプリは、裏付けとなる証拠がないまま心の健康に役立つとうたっていた。一方、若者が感じている利点として、24時間使えること、使いやすさ、地域や言葉、利用のしやすさの壁のためにほかでは得られない支えになることを挙げている。同氏が最も心配するのは、民間企業が利用者の利益より利用時間の長さを優先しかねない点と、チャットボットを頻繁に使うことで現実の人間関係が置き換えられてしまう点だ。対策として、透明性の確保、主張を裏付ける信頼できる証拠、ほかの分野にならったプライバシー保護、安全策づくりへの若者の参加を求めている。\n【ポイント・注意点】保護者への助言として、同氏はアクセスを管理することに頼るより、若者がAIをどう使っているかを率直に話し合うことを勧めている。この記事は研究者への取材をもとにしたもので、新しい調査結果を示すものではない。論考は、若者の心の健康にとってのAIを「安全な場という錯覚」と表現している。5人に1人という数字の調査人数や、117アプリの分析方法の詳細は記事に示されていない。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-youth-ai-mental-health-families.html"],["子どもの希少疾患MPSIIIC 生後2カ月から網膜が変性 マウスで確認 英","英マンチェスター大学の研究チームは、子どもの脳を傷つける遺伝性の希少疾患ムコ多糖症IIIC型（MPSIIIC）のモデルマウスで、目の網膜の視細胞が生後約2カ月から変性し始めることを確かめた。変性は年齢とともに進み、後期には網膜の電気的な働きも落ちた。患者で報告されてきた網膜の病気とよく似た経過だという。視力を守る治療をいつ始めるべきかを考える手がかりになるとしている。","\n【概要】英マンチェスター大学の研究チームは、子どもの希少な遺伝性疾患であるムコ多糖症IIIC型（MPSIIIC）のモデルマウスで、目の網膜に早い時期から障害が起きることを明らかにした。論文は学術誌「Investigative Ophthalmology & Visual Science」に掲載された。\n【背景】MPSIIICは、酵素HGSNATが働かないことで起きる病気で、主に子どもの脳を傷つけ、視力にも影響することがある。この酵素がないと、細胞はヘパラン硫酸という物質を分解できず、細胞の中にたまってしまう。最近では、HGSNATの欠損が網膜色素変性症の一つの型とも関係することが分かってきた。\n【詳細】研究チームは、遺伝子操作でHGSNATをなくしたマウスの目を、健康なマウスと複数の年齢で比べた。対照には健康なマウスの系統C57BL/6Jを用いた。論文の筆頭著者はクリストス・イオシフィディス氏だ。高解像度の光干渉断層撮影（OCT）で網膜の層の構造を詳しく調べ、網膜の電気的な反応も記録し、目の組織で酵素の働きを測った。その結果、病気のマウスでは生後約2カ月から光を受け取る視細胞の変性が確認できた。変性は年齢とともに悪化し、網膜の外側の層が薄くなり、視細胞を健康に保つのに必要な構造も傷んでいった。病気が進んだ後期の段階では、網膜の電気的な働きも低下した。目の組織でのHGSNATの働きは、健康なマウスと比べて大きく低下していた。チームは、この経過がHGSNATに関連する病気の患者で報告されてきた網膜の病気とよく似ているとしている。\n【ポイント・注意点】共著者のショーン・ウッド博士は、このモデルが、将来の治療で視力を守るにはいつ治療を始める必要があるかを見極める助けになると述べている。ただし用いたのは1種類のモデルマウスで、記事には動物の数や統計の手法、効果の大きさは示されていない。治療法は今回試されておらず、人との比較は研究チームが患者の報告と似ていると述べている段階にとどまる。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-mouse-reveals-early-eye-rare.html"],["幼いころのストレスが慢性痛のなりやすさに メスのマウスで脳回路を特定","独ハイデルベルク大学などの研究チームは、離乳後に孤立させるストレスを受けたマウスが後に神経を傷つけられると、メスでは痛みへの過敏さと不安による回避行動が強く長く続くことを示した。視床室傍核と扁桃体中心核を結ぶ回路の変化が原因で、この回路を抑えると上乗せされた過敏さと回避が減った。オスでは見られなかった。動物実験で人にそのまま当てはまらないとしている。成果は学術誌Scienceに掲載された。","\n【概要】ドイツのハイデルベルク大学とマンハイムの中央精神保健研究所の研究チームは、幼いころのストレスが脳に長く残る変化を生み、後の慢性的な痛みのなりやすさを高める仕組みを、マウスで明らかにした。メスに特有の脳回路の変化が関わっていた。論文は学術誌「Science」に掲載された。研究を率いたのはハイデルベルク大学のセバスティアン・ヴィーラント博士だ。論文の筆頭著者はアンナ・マリア・ボルート氏で、研究は大学の共同研究センター（SFB 1158）の一環として行われた。\n【背景】子ども時代の逆境は、大人になってからの慢性痛や不安と関係すると考えられているが、その脳の仕組みはよく分かっていなかった。研究チームは、幼い時期のストレスと後の痛みの組み合わせが脳にどんな影響を残すかを調べた。\n【詳細】幼いころのストレスとして、マウスを離乳後に仲間から離して育てる社会的なストレスを与え、その後、神経を傷つけた。幼いころにストレスを受けたメスは、幼いころにストレスを受けていないマウスと比べ、神経の損傷後に軽い刺激への過敏さが大きく、しかも長く続いた。不安に関連した回避行動もより目立った。こうした増幅はオスのマウスでは見られず、幼いころのストレスだけでは、こうした行動の変化はそろって現れなかった。チームは原因を、脳の視床室傍核と扁桃体中心核を結ぶ回路の長く続く変化にたどり着いた。メスでだけ、この回路は後のけがの後に特定の信号をより強く伝え、危険を予想しただけでも活動が高まっていた。この回路だけを選んで抑えると、上乗せされた痛みの過敏さと回避行動が減ったが、けがそのものによる急性の痛みの強さは変わらなかった。\n【ポイント・注意点】著者らは、結果は動物モデルで得られたもので、そのまま人に当てはめることはできないとしている。記事には動物の数や統計の数値は示されていない。チームは今後、このなりやすさの空間的・分子的な特徴を調べる計画で、長期的には目印となる生体指標や男女別の治療法の開発を目標に挙げている。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-early-life-stress-brain-chronic.html"]]};
let memos=[]; // {cat,title,note,date}
const OLD_CUT="2026-11-07";
function isOld(d){return d<OLD_CUT}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
/* ===== 項目（ジャンル）はデータ駆動：CATS／DATAに足すだけで自動で増えます ===== */
const extraCats=[];
function allCats(){
  const list=CATS.slice();
  Object.keys(DATA).forEach(id=>{ if(!list.some(c=>c.id===id)) list.push({id:id,name:id,desc:"追加された項目",img:"hero"}); });
  extraCats.forEach(c=>{ if(!list.some(x=>x.id===c.id)) list.push(c); });
  return list;
}
let cats=allCats();
let catIdx=0;
const artIdxMap={};
function itemsOf(c){return (DATA[c.id]||[]).map((a,i)=>({a:a,oi:i})).sort((x,y)=>y.a[3].localeCompare(x.a[3]))}
function curCat(){return cats[catIdx]}
function curItems(){return itemsOf(curCat())}
function curArtIdx(){const n=curItems().length;if(!n)return 0;let i=artIdxMap[curCat().id]||0;if(i>=n)i=n-1;if(i<0)i=0;return i}
function renderStage(dir){
  cats=allCats(); if(catIdx>=cats.length)catIdx=cats.length-1; if(catIdx<0)catIdx=0;
  const c=curCat(), items=curItems(), ai=curArtIdx();
  const total=cats.reduce((s,x)=>s+(DATA[x.id]||[]).length,0);
  document.getElementById('heroText').innerHTML="<b>今日のまとめ — 全"+cats.length+"ジャンル・"+total+"件。</b> タイトルと概要は日本語、カードの「和訳全文を読む」で全文が開きます。新しい順に並べ、48時間より古い記事はグレー表示です。";
  document.getElementById('catName').textContent=c.name;
  document.getElementById('catDesc').textContent=c.desc||"";
  document.getElementById('catCount').textContent="ジャンル "+(catIdx+1)+" / "+cats.length;
  document.getElementById('catDots').innerHTML=cats.map((x,i)=>'<button class="dot'+(i===catIdx?' active':'')+'" data-cat="'+i+'" aria-label="'+x.name+'へ移動"></button>').join('');
  document.querySelectorAll('#catDots .dot').forEach(d=>{d.onclick=()=>{const n=+d.dataset.cat; if(n!==catIdx){const dd=n>catIdx?'down':'up'; catIdx=n; renderStage(dd);}}});
      const slot=document.getElementById('cardSlot');
  if(!items.length){
    slot.innerHTML='<article class="card"><div class="empty"><div class="big">✦</div><p><b>'+c.name+'</b> は追加されたばかりの項目で、まだ記事がありません。</p><p>毎日の更新でこの項目の記事が集まると、ここに表示されます。<br>上スワイプで他のジャンルへ移動できます。</p></div></article>';
    document.getElementById('artDots').innerHTML=""; document.getElementById('artCount').textContent="0 / 0"; return;
  }
  const it=items[ai], a=it.a, old=isOld(a[3]);
  slot.innerHTML='<article class="card'+(old?' old':'')+(dir?' anim-'+dir:'')+'">'
    +'<img class="ph" src="'+IMGS[c.img]+'" alt="'+c.name+'のイメージイラスト">'
    +'<div class="cbody"><div class="meta"><span class="badge'+(old?' oldb':'')+'">'+(old?'少し前':'NEW')+'</span><span>'+a[3]+'</span><span>'+(ai+1)+' / '+items.length+'</span></div>'
    +'<h3>'+a[0]+'</h3><p class="sum">'+a[1]+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="openArticle(\''+c.id+'\','+it.oi+')">和訳全文を読む</button>'
    +'<button class="btn ghost" onclick="quickMemo(\''+c.id+'\','+it.oi+',this)">メモ保存</button>'
    +'<button class="btn ghost" onclick="shareArticle(\''+c.id+'\','+it.oi+')">共有</button></div>'
    +'<div class="src">出典：'+a[4]+'<br><a href="'+a[5]+'" target="_blank" rel="noopener">原文を開く</a></div></div></article>';
  document.getElementById('artDots').innerHTML=items.map((x,i)=>'<span class="dot'+(i===ai?' active':'')+'"></span>').join('');
  document.getElementById('artCount').textContent="記事 "+(ai+1)+" / "+items.length;
  requestAnimationFrame(fitCard);
}

function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;
  const sum=card.querySelector('.sum'), h3=card.querySelector('h3'), ph=card.querySelector('.ph');
  let ss=14, hs=Math.min(21, Math.max(17, window.innerWidth*0.044)), phh=ph?Math.round(ph.getBoundingClientRect().height):0; const ph0=phh;
  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }
    if(hs>13){ hs-=0.5; if(h3) h3.style.fontSize=hs+'px'; continue; }
    break;
  }
}
window.addEventListener('resize', fitCard);
function nextArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i>=n-1)return;artIdxMap[curCat().id]=i+1;renderStage('next')}
function prevArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i<=0)return;artIdxMap[curCat().id]=i-1;renderStage('prev')}
function nextCat(){if(catIdx>=cats.length-1)return;catIdx++;renderStage('down')}
function prevCat(){if(catIdx<=0)return;catIdx--;renderStage('up')}
/* ===== スワイプ操作（スクロールではなくスワイプで移動） ===== */
const stage=document.getElementById('stage');
let sx=null, sy=null, swipedAt=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;
  swipedAt=Date.now();
  if(Math.abs(dx)>Math.abs(dy)){ dx<0?nextArt():prevArt(); } else { dy<0?nextCat():prevCat(); }
});
stage.addEventListener('click',e=>{ if(Date.now()-swipedAt<120){e.stopPropagation();e.preventDefault();} },true);
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')nextArt(); else if(e.key==='ArrowLeft')prevArt();
  else if(e.key==='ArrowDown'){e.preventDefault();nextCat();} else if(e.key==='ArrowUp'){e.preventDefault();prevCat();}
});
/* ===== 項目の追加 ===== */
document.getElementById('addCatBtn').onclick=()=>{document.getElementById('newCatName').value="";document.getElementById('newCatDesc').value="";document.getElementById('addDlg').showModal()};
document.getElementById('addCatSave').onclick=()=>{
  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast("項目名を入力してください");return}
  const desc=document.getElementById('newCatDesc').value.trim()||"追加された項目";
  const id='custom-'+Date.now();
  extraCats.push({id:id,name:name,desc:desc,img:'hero'}); DATA[id]=[];
  cats=allCats(); catIdx=cats.length-1;
  document.getElementById('addDlg').close(); renderStage('down');
  toast("項目「"+name+"」を追加しました");
};
/* ===== 記事ダイアログ・メモ・共有 ===== */
function openArticle(cat,idx){
const c=allCats().find(x=>x.id==cat); const a=DATA[cat][idx];
document.getElementById('dlgIn').innerHTML=`<img src="${IMGS[c.img]}" alt=""><div class="meta" style="margin-top:10px"><span>${c.name}</span><span>${a[3]}</span></div><h3>${a[0]}</h3><p class="sum" style="font-size:14px">${a[1]}</p><div class="full">${a[2]}</div>
<p class="src" style="margin-top:12px">出典：${a[4]} — <a href="${a[5]}" target="_blank" rel="noopener">${a[5]}</a></p>
<div class="memoBox"><label style="font-weight:800;font-size:14px">ひとことメモ</label><textarea id="memoText" placeholder="気づいたこと、作りたいもの、家族への共有メモなど"></textarea>
<div class="actions"><button class="btn primary" onclick="saveMemo('${cat}',${idx})">このメモを保存</button><button class="btn ghost" onclick="shareArticle('${cat}',${idx})">iPhoneで共有</button><button class="btn ghost" onclick="document.getElementById('dlg').close()">閉じる</button></div></div>`;
document.getElementById('dlg').showModal();
}
function quickMemo(cat,idx,btn){const a=DATA[cat][idx];memos.unshift({cat,title:a[0],note:"",date:a[3]});updateMemoUI();btn.textContent="保存しました";btn.classList.add('saved');toast("メモに保存しました（このページを開いている間）")}
function saveMemo(cat,idx){const a=DATA[cat][idx];const note=document.getElementById('memoText').value.trim();memos.unshift({cat,title:a[0],note,date:a[3]});updateMemoUI();toast("メモを保存しました");document.getElementById('dlg').close()}
function updateMemoUI(){document.getElementById('memoCount').textContent=memos.length;const area=document.getElementById('memoList');
if(!memos.length){area.innerHTML='<p class="sum">まだメモがありません。記事の「メモ保存」をタップしてください。</p>';return}
area.innerHTML=memos.map(m=>`<div class="memoItem"><b style="font-size:14px">${m.title}</b><div style="font-size:13px;color:var(--muted)">${m.note||"（ひとことメモなし）"} ・ ${m.date}</div></div>`).join('')}
function exportMemos(){if(!memos.length){toast("まだメモがありません");return}const txt="MAI topic メモ — 2026-11-10\n\n"+memos.map((m,i)=>`${i+1}. ${m.title}\n${m.note||""}\n`).join("\n");const b=new Blob([txt],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="mai-topic-memo-2026-11-10.txt";a.click();URL.revokeObjectURL(u)}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}} try{await navigator.clipboard.writeText(text);toast("コピーしました — メモアプリなどに貼り付けできます")}catch(e){toast("共有できませんでした")}}
function shareArticle(cat,idx){const a=DATA[cat][idx];shareText(a[0],`${a[0]}\n\n${a[1]}\n\n出典：${a[4]} ${a[5]}`)}
function shareMemos(){if(!memos.length){toast("まだメモがありません");return}shareText("MAI topic メモ",memos.map(m=>`・${m.title} ${m.note}`).join("\n"))}
document.getElementById('sharePage').onclick=()=>shareText("MAI topic","MAI topic — 2026年11月27日朝版（全"+cats.length+"ジャンル）");
document.getElementById('memoBtn').onclick=()=>{updateMemoUI();document.getElementById('memoDlg').showModal()};
updateMemoUI();
renderStage();
</script>

      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
} catch (e) {}
</script>
