前にコードの全文を確かめられ、まずサンドボックスの中で試しに動かす。呼び出しはどれも子プロセスとして、macOSのsandbox-execの下で動き、既定では60秒で打ち切られる。中身は、Pythonの常駐部（FastAPI）と、SwiftUIのメニューバーのアプリだ。モデルはMLXで手元で動かす。\n配布されるのは署名と公証を済ませたアプリで、zipは約540MBある。初回の起動では約12.7GBのモデルを落とし、メモリが24GB未満のMacでは8GBになる。元のコードから組み立てる場合は、Python 3.11以上とXcodeのコマンドラインツールを用意し、同梱のスクリプトで入れて起動する。\n\n【ポイント・注意点】\n動くのはApple Siliconを積んだmacOS 14以降のMacだけだ。iMessageを見守るにはフルディスクアクセスの許可が要る。Web検索は自分で用意したBraveのAPIの鍵が必要で、既定ではオフになっている。設定でサンドボックスを切ることもできる。プライバシーの記録について、READMEは「できる範囲で残すもので、守りの境界ではない」と断っている。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50568353"],["erXos：Erlangで書くマイクロカーネルOSの試み","Erlangのすべてのプロセスを、そのままOSのプロセスにすることを目指すマイクロカーネルOS「erXos」がShow HNに投稿された。ドライバーやファイルシステムもErlangで書き、監視の木で見守る。Genera、Plan 9、QNXの考え方を下敷きにしている。Raspberry Pi 4とQEMU向けのイメージ、ブラウザで動くエミュレーターがあり、コードはBSDライセンスだという。","\n【概要】\n「erXos」は、Erlangで書かれたマイクロカーネルのOSだ。Show HNには「Genera、Plan 9、QNXの考え方に基づく、Erlangのマイクロカーネル OS」という題で投稿された。作者は、Erlangのすべてのプロセスを、そのままOSのプロセスにすることを目標に掲げている。\n\n【背景】\nErlangは、たくさんの軽いプロセスを動かし、落ちたものを監視役が立て直す作りで知られる言語だ。この考え方をOSの全体に広げれば、ドライバーの不具合もプロセスの再起動で立て直せる見込みがある。Lispマシンの「Genera」や、すべてをファイルとして扱う「Plan 9」、マイクロカーネルの「QNX」は、OSの設計の手本としてよく挙げられる。\n\n【詳細】\n作者の投稿によると、核は権限（ケーパビリティ）に基づくマイクロカーネルだ。ドライバーとファイルシステムはErlangで書かれ、監視の下で動く。Erlangのドライバーとしては、UART、virtio、SD、イーサネット、ディスプレイが挙がっている。TCP/IPの層は、FreeBSDのネットワークの層を元にしているという。\n試す方法として、ブラウザで動くエミュレーター、Raspberry Pi 4のSDカード用のイメージ、QEMU用のイメージが用意されている。これからの予定には、Raspberry Pi 5、Wi-Fi、Bluetooth、POSIXに近い層が挙がっている。コメント欄への返事で作者は、ネットワークへの接続も明示的な権限として与える作りだと説明している。つまり、権限を渡されていないプロセスは、外と通信できない。\n\n【ポイント・注意点】\nここで紹介した内容は、Hacker Newsでの作者の投稿と返事に基づく。投稿にある案内ページのURLは、確認の時点で別のドメインへ転送されていたため、中身は確かめていない。Wi-FiやBluetoothは予定の段階で、いま動く機器は限られる。研究的な色合いの強い試みとして見るのがよい。","2026-11-19","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50568169"],["forbear：Cで書くReact風のネイティブUIライブラリ","Webの書き味でネイティブのGUIを作る、即時モードのUIライブラリ「forbear」がShow HNに投稿された。Reactに似た部品とフック、flex風の配置を備え、状態は固定の領域に置いてヒープを使わない。作者がこれで作った電卓は、大きさ3.6MB、メモリ約10.5MBで動く。C（C23）とJaiから使え、Windows、Linux、macOSが対象。オープンソースではなく、ソースを公開した独自の条件で配られている。","\n【概要】\n「forbear」は、Webのような見た目と書き味を持つ、即時モードのGUIライブラリだ。READMEは「Webのように見える高性能な即時モードGUIライブラリ」と説明している。Show HNには「CのReact風ネイティブUI。電卓が3.6MB、メモリ10MB」という題で投稿された。\n\n【背景】\nElectronのように、Webの技術でデスクトップのアプリを作る方法は広く使われている。一方で、できあがるアプリは大きく、メモリも多く使いがちだ。forbearは、Reactに似た書き方を保ちながら、ネイティブで軽いアプリを作ることを狙っている。\n\n【詳細】\nReactに似た部品とフックの仕組み、flex風の配置、アニメーションを備える。状態は静的な領域に置かれ、ヒープを確保しない。READMEに記された状態の領域は16MBだ。作者がこのライブラリで作った電卓は、大きさが3.6MB、最初の画面が出るまで約300ミリ秒、使うメモリは10.5MB、コードは1,155行だった。\n使える言語は、C（C23に対応したclang 19以降など）と、非公開のベータ版のJaiだ。対象はWindows、LinuxのWayland、macOS。導入は、curlかirmのスクリプトで行う。作者は、CのAPIについての意見を求めている。今後の予定には、WaylandとmacOSの窓まわりの仕上げ、非同期のAPI、Metalでの描画、OS標準の文字の描画が挙がっている。即時モードとは、毎フレーム画面の中身を組み立て直す方式のことで、状態の管理を単純にしやすい。\n\n【ポイント・注意点】\nライセンスはオープンソースではなく、ソースを公開した独自の条件だ。非営利、OSI承認のライセンスのプロジェクト、社内の道具、個人の利用は無料で、年に10万ドルを超える売上がある製品は、その超えた分の1%を払う。単体での再配布は認められない。アクセシビリティ、日本語などの入力の仕組み、文字入力の部品はまだない。2025年初めから開発中で、APIは変わる見込みが高いと書かれている。","2026-11-19","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50563867"],["Dayfile：スクリプトやエージェントの追記専用ログ","スクリプト、アプリ、AIエージェントの出来事を1つのログにまとめる「Dayfile」がShow HNに投稿された。作者は「スクリプトとエージェントのためのgit log」と説明している。記録は題名と任意のタグを付けたHTTPの要求1回で済み、書いたものは消せない追記専用だ。黙ったバックアップを知らせる仕組みやMCPも備える。Python製の自前運用版があり、ライセンスはAGPL-3.0。","\n【概要】\n「Dayfile」は、スクリプトやアプリ、エージェントが残す出来事を、1つの追記専用のログに集める仕組みだ。Show HNには「スクリプトとエージェントのための追記専用ログ」という題で投稿された。作者は「スクリプトとエージェントのためのgit log」と表現している。\n\n【背景】\n定期のスクリプトや、AIエージェントの作業が増えると、何がいつ動いたのかが散らばって分からなくなる。大がかりなログ基盤を入れるほどではないが、記録は1か所にほしい、という場面は多い。作者はコメント欄で、Graylogのような製品と比べて、Dayfileは1つのPythonのアプリと1つのSQLiteのファイルで動くと説明している。\n\n【詳細】\n記録は、題名と任意のタグを付けたHTTPの要求を1回送るだけで済む。ログはSQLiteに保存され、トリガーで追記専用が守られる。出来事にはEd25519の署名を付けられる。読み出しは、JSONやAtom、CloudEventsのフィード、長いポーリングやSSEに対応したJSONのAPIで行う。5つの道具を持つMCPサーバーも付く。「ハートビート」の機能は、バックアップのような定期の処理が黙ったときに、やることを1件作って知らせる。\n自前で動かす場合は「pip install dayfile」で入れ、uvicornで起動する。Python 3.11以上が必要で、uvやpipxでも入れられる。作者によると、ホスト版の無料ベータでは5万件の出来事と25MBのログまで使える。\n\n【ポイント・注意点】\n作者は、ログがエンドツーエンドで暗号化されていないこと、サインインがGitHubだけであること、料金が未定であることを挙げている。READMEにも、課金の仕組みはまだないと書かれている。URLの中にトークンを入れる方式は互換のためのもので、サーバーは手元か、TLSの裏に置くよう勧めている。ライセンスはAGPL-3.0だ。Web版のアプリは、配布されているDocker Composeの構成にはまだ含まれていない。","2026-11-19","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50561824"],["gh-sift：PRの確認を1画面で済ませる端末アプリ","GitHubのプルリクエストの確認を、端末の中の1つのアプリで済ませる「gh-sift」がShow HNに投稿された。人気の「gh-dash」の設定をそのまま読み、差し替えて使えるようにしている。積み重ねたPRのまとめてのマージ、失敗したActionsのログへの直行、差分の上でのコメントや承認ができる。GitHub CLIの拡張として入れられ、Go製でライセンスはMIT。","\n【概要】\n「gh-sift」は、GitHubのプルリクエストを確認するための、端末で動くアプリ（TUI）だ。READMEは「GitHubのPRの確認のための1つの端末アプリ」と説明している。Show HNには「PR、差分、Actionsのログ、積み重ねたPRを1つのTUIで」という題で投稿された。\n\n【背景】\n作者は、端末でPRを一覧する人気の道具「gh-dash」には、積み重ねたPR、マージキュー、組み込みの差分の確認が欠けていると書いている。gh-siftは、その足りない部分を埋める差し替え品として作られた。gh-dashの設定ファイルをそのまま読むので、乗り換えの手間が少ない。\n\n【詳細】\n主な機能は次のとおりだ。積み重ねたPRの順序を意識したマージ。Actionsの画面は失敗した箇所から開き、ログもエラーの位置で表示する。差分は左右に並べる表示と上下に重ねる表示を選べ、構文の色分けも付く。読んだかどうかの印は、GitHubの「Viewed」の欄と同期する。差分の上で、コメント、修正の提案、返信、解決、承認ができる。配布物は1つの実行ファイルだ。\n導入は「gh extension install chrismatix/gh-sift」で、起動は「gh sift」。元のコードから組み立てるにはGo 1.26以上が要る。ライセンスはMIT。\n積み重ねたPRとは、大きな変更を小さなPRに分け、前のPRの上に次のPRを重ねていく進め方だ。確認とマージの順番を間違えやすいため、順序を理解する道具があると助かる。gh-siftは、一覧から差分の確認、承認、マージまでを、ブラウザに切り替えずに端末の中で続けられるようにしている。\n\n【ポイント・注意点】\nREADMEには「1.0未満のため、キーの割り当てや振る舞いはリリースの間で変わることがある」とある。速さなどの計測は載っていない。GitHub CLIの拡張なので、先にGitHub CLIを入れて認証しておく必要がある。コミットは36で、スターはまだ付いていない、生まれたばかりのプロジェクトだ。","2026-11-19","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50561419"],["Vulnsuite：わざと脆弱な試験用システムを作る道具","既知の脆弱性を持つシステムと、その修正済みの双子を、ひな形から再現できる形で組み立てる道具「Vulnsuite」がShow HNに投稿された。中身に基づいて名前が決まるDockerイメージを作り、それぞれが本当に脆弱か、本当に直っているかを検証の探りで確かめる。脆弱性スキャナーの試験や練習の的に使うことを想定している。Go製の1つの実行ファイルで、ライセンスはMIT。","\n【概要】\n「Vulnsuite」は、脆弱性を持つ試験用のコンテナと、その修正版のコンテナを、ひな形から組み立てる道具だ。READMEは「再現できる脆弱な（そして修正済みの）標的のコンテナを、検証済みの状態で作る」と説明している。Show HNには「使い捨ての脆弱なシステムをわざと作る」という題で投稿された。\n\n【背景】\n脆弱性スキャナーや検知の仕組みを試すには、本当に脆弱な相手と、本当に直った相手の両方が要る。ところが、古い版のソフトを手で組み立てると手間がかかり、毎回同じ状態になる保証もない。Vulnsuiteは、この標的づくりを自動にし、状態を確かめた上で渡す。\n\n【詳細】\n脆弱なシステムと修正済みの双子を、中身に基づいて名前が決まるDockerイメージとして組み立てる。それぞれの状態は、検証用の探りで確かめる。スキャナーそのものは含まない。ひな形の土台は、既存のイメージ、上書き、元のコード、組み立ての4種類だ。\nたとえば「vulnsuite run -t apache-httpd-2.4.49-cve-2021-41773 -expose host -detach」と打つと、Apache httpd 2.4.49のCVE-2021-41773を持つ標的が立ち上がる。Docker Engine、Docker Desktop、OrbStack、Colima、Podmanで動く。\nGoで書かれた静的な1つの実行ファイルで、「go install」か配布の実行ファイルで入れられる。動かすにはDockerのデーモンが要り、元のコードから作るひな形にはgitも使う。ライセンスはMIT。\n\n【ポイント・注意点】\n扱うのは、わざと脆弱にしたソフトだ。READMEは、自分で書いていないひな形を動かす前に、セキュリティの考え方の文書を読むよう求めている。外に公開する設定には気をつけたい。背景の説明にある「数百のCVE」「数千の目録」は目標として書かれたもので、いまの収録数ではない。READMEは、設計と実装にAIの助けを借りたことも明かしている。","2026-11-19","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50558784"]],"gh-blog":[["CI/CDは本番の依存先、GitHub障害に備える非常用デプロイ","dev.toに、11月11日のGitHub障害を題材に、CI/CDが止まったときの「非常用デプロイ経路（break-glass）」の整え方を解説する記事が投稿された。障害ではActions、Pages、Copilotが重大な停止、Webhooksが性能低下と表示され、1時間足らずで解決した。記事は、自分で管理するランナー、事前に用意した成果物、CIに依存しない認証情報、実際に試した手順書の4つをそろえておくよう勧めている。","\n【概要】dev.toに投稿された記事「CI/CD Is a Production Dependency」は、ホスト型のパイプラインも本番環境の依存先の一つだと位置づけ、CI/CDが使えないときでも検証済みの成果物を安全に本番へ届ける非常用の経路を事前に用意すべきだと主張している。\n\n【背景】きっかけは2026年11月11日20時48分（UTC）に始まったGitHubの障害だ。ステータスページではActions、Pages、Copilotが重大な停止、Webhooksが性能低下とされた。GitHubは21時07分に緩和、たまっていたActionsのジョブを処理し終えた21時21分に解決と報告した。記事は、ソースのホスト、Webhooks、ホスト型ランナー、CIが発行するOIDCトークン、レジストリからの取得のどれもがデプロイを止めうると指摘する。\n\n【詳細】非常用デプロイは「裏口ではない」と記事は強調する。文書化・検証・監査された手順で、すでにスキャン済みの成果物を出すための道であり、通常より遅く厳しく管理し、使ったら必ず事後レビューを行う。必要な要素は4つ。1つ目は自分で管理するランナーか別のCI。ただしGitHubに登録したセルフホストランナーもジョブの配布はGitHub頼みで、Actions全体の停止には効かない。2つ目は自前の保管先に置いた成果物と、自前レジストリに写したコンテナイメージで、タグではなくダイジェストで指定する。3つ目はCIに依存しない認証情報。OIDC連携は良い既定だがActions停止時には使えないため、デプロイ専用で、フィッシング耐性のある多要素認証と別の人の承認を必須にし、短時間だけ有効で、使うたびに通知が飛ぶ非常用ロールを別に持つ。4つ目は実際に通したことのある手順書だ。\n\n【ポイント・注意点】記事の手順例は、障害宣言と承認者の記録、MFA付き・900秒の一時的な権限取得、ダイジェスト指定でのイメージ差し替え、ロールアウト確認と記録という流れ。手順書はソースのホストの外に置き、四半期ごとに演習するよう勧めている。値はすべて仮のもので、そのまま使うものではない。","2026-11-20","DEV Community","https://dev.to/nrejve/cicd-is-a-production-dependency-break-glass-deploy-paths-for-the-next-cicd-outage-49a8"],["M365 Copilotのライセンスで、GitHub Copilot CLIが使える","Qiitaに11月20日、Microsoft 365 Copilotのライセンスと職場のEntraアカウントで、GitHubアカウントなしにGitHub Copilot CLIを使えるようになった件の解説記事が公開された。WindowsとmacOS向けの公開プレビューで、CLI 1.0.113以降が必要。ライセンスを持つだけでは足りず、組織側でFrontierへの参加や従量課金の利用ポリシーの設定が要るなど、管理者が押さえるべき条件を整理している。","\n【概要】Qiitaの記事「Microsoft 365 Copilot ライセンスで GitHub Copilot CLI が使えるように!!」は、ターミナルで動くGitHub Copilot CLIが、条件を満たす組織ならMicrosoft EntraのアカウントとMicrosoft 365 Copilotのライセンスで使えるようになったことを解説している。著者は11月19日にXでもこの件を発信していた。\n\n【背景】GitHubは11月17日、Copilot CLIにEntraでのサインインを公開プレビューとして追加した。これにより、Enterprise Managed User（EMU）への自動サインインと、Microsoft 365 Copilotのライセンスでの利用という2つの道ができた。記事は、個人のCopilot、組織のBusiness／Enterprise、EntraからEMU、EntraからMicrosoft 365 Copilot、BYOKという5つの使い方を表で比べている。\n\n【詳細】対象はWindowsとmacOSで、CLIは1.0.113以降。組織はFrontierへの参加と設定、従量課金の利用ポリシーが必要で、ライセンスを持っているだけでは使えない。管理者はMicrosoft 365管理センターで「Copilot Frontier」「GitHub Copilot access (Frontier)」（既定はオフ）、Codeの利用ポリシーを確認する。利用者は /login で「Your organization (Microsoft Entra)」を選び、/model で使えるモデルを確かめる。この経路では推論はMicrosoft側で行われる。\n\n【ポイント・注意点】VS Codeの統合ターミナルからCLIを起動することはできるが、それでVS CodeのCopilot Chatがこのライセンスで動くわけではない。GitHubコード検索、GitHub MCPサーバー、クラウドエージェントへの委任（/delegate）などはGitHub認証が必要で、Microsoft 365のモデルからGitHubのモデルに切り替えると文脈のない新しいセッションになる。モデルごとの価格や実際の請求は、著者も確かめていないとしている。","2026-11-20","Qiita","https://qiita.com/aktsmm/items/855dbec6f06587a26287"],["GPT-6.2、CodexとCopilotで説明が食い違う点を比べる","Qiitaに11月20日、OpenAIのGPT-6.2 AstraとGPT-6.2 Solについて、CodexとGitHub Copilotの公式changelogを読み比べた記事が公開された。CodexはAstraを「最も難しい仕事」向けとするのに対し、Copilotは「複雑な」仕事をSol向けとしており、位置づけが逆になっていると指摘する。比較の基準や価格の示し方も異なるため、自分が使う製品の説明でモデルを選ぶべきだと結論づけている。","\n【概要】Qiitaの記事「Codex と GitHub Copilot の GPT-6.2 比較｜公式 changelog から言えること・言えないこと」は、同じモデルについて2つの製品の公式発表がどう違うかを丁寧に整理し、そこから言えることと言えないことを分けている。\n\n【背景】OpenAIはエージェント型のコーディング向けにGPT-6.2 AstraとGPT-6.2 Solを公開し、GitHubも11月17日（日本時間18日）にCopilotでの一般提供を発表した。GitHubの発表では、Astraはエージェントによるコーディングとターミナルでの作業向け、Solは複雑なエージェント型コーディングと詳細なコードレビュー向けとされ、Copilot Pro+、Max、Business、Enterpriseで段階的に展開される。\n\n【詳細】記事によると、Codexは、Astraを既存のコードベース全体にまたがる変更の実装やテストなど最も難しい案件向け、Solを日常のコーディングや複数ステップの作業向けと説明している。Copilotの説明と比べると「複雑」の割り当てが逆になっている。比較の基準も違い、CodexはGPT-6.1 Solと同じプランでこなせる作業量を比べる。一方GitHubの初期テストは、AstraをGPT-6 Astraと、SolをGPT-6.1 Solと比べ、Solは実際の問題をほぼ2倍見つけたとする。記事は、この比較ではAstraとSolの優劣は決められず、changelogには問題の件数やトークン数、テスト条件が書かれていないと指摘する。\n\n【ポイント・注意点】価格はどちらのchangelogにもモデル単価がない。CodexはCodex専用のUltrafastモードをプランと結び付けて説明し、Copilotはプロバイダーの定価での従量課金とし、価格の文書を案内するだけだ。記事の結論は、片方の製品の説明をもう一方に当てはめず、実際に使う製品のchangelogで選ぶこと。表現が違う理由はどちらの出典にも書かれていないとしている。","2026-11-20","Qiita","https://qiita.com/kenji_harada/items/cccde7e95d86eabb6eb2"],["GitHub Desktop 3.7.0、同じホストで複数アカウントに対応","GitHubは11月19日、GitHub Desktopで同じホストに複数のアカウントでサインインできるようにしたと発表した。対象はGitHub.com、GitHub Enterprise Server、GHE.comで、アカウント数に決まった上限はない。リポジトリごとに使うアカウントを結び付けておけば、クローンや公開、Git操作で正しい認証情報が自動で使われる。コミュニティで最も要望の多かった機能の一つだという。","\n【概要】GitHubはchangelogで、GitHub Desktopが1つのホストにつき複数のアカウントを扱えるようになったと発表した。最新版として案内されているのはGitHub Desktop 3.7.0だ。\n\n【背景】仕事用と個人用のように、同じGitHub.comで複数のアカウントを使い分ける開発者は多い。これまでDesktopは1つのホストに1アカウントしか登録できず、切り替えの手間が課題になっていた。発表は、この機能がDesktopのコミュニティで最も多く要望されたものの一つで、desktopリポジトリのissue 3707で議論されてきたと説明している。\n\n【詳細】今回の更新でできるのは次のことだ。1つのホストに、上限なく複数のアカウントを追加できる。対象のホストはGitHub.com、GitHub Enterprise Server、GHE.com。リポジトリごとに特定のアカウントを結び付けられ、クローン、公開、Git操作では自動でそのアカウントの認証情報が使われる。複数のサインイン済みアカウントからアクセスできるリポジトリを追加・クローンするときは、使うアカウントを選べる。アクセスできるアカウントが1つだけなら、Desktopがそのアカウントを推定する。結び付けはリポジトリ設定か、リポジトリ一覧の右クリックメニューからいつでも変えられる。始めるには最新版を入れ、「Settings／Options」の「Accounts」からアカウントを追加し、クローンや公開のときに新しいアカウント選択を使う。\n\n【ポイント・注意点】既存のリポジトリは、それまで使っていたアカウントに自動で移行される。ホストごとに1アカウントしか使っていない人には何も変わらない。発表にはプランの制限や価格についての記載はない。詳しい使い方は、複数アカウントの利用に関するGitHub Desktopの文書が案内されている。仕事用と個人用のアカウントを1台のPCで切り替えて使ってきた人にとっては、認証情報の取り違えを防げる実用的な改善と言える。","2026-11-19","GitHub Changelog","https://github.blog/changelog/2026-11-19-github-desktop-now-supports-multiple-accounts-per-host"],["PRの新しい概要ページ、マージ可否の表示などを改良","GitHubは11月19日、11月5日に公開プレビューを始めたプルリクエストの新しい「Overview」ページを改良したと発表した。任意のチェックが失敗しただけでマージ可能なPRが止まって見える問題を直し、何が足りないかを示すようにした。チェックや承認はクリックで展開でき、解決済みのレビュースレッドは折りたたまれる。強制プッシュの前後のコミットへのリンクや、会話のロックにも対応した。","\n【概要】GitHubはchangelogで、プルリクエストの新しい概要ページ（Overview）の改良点を発表した。新しいページは11月5日に公開プレビューとして始まっており、今回はその使い勝手を直す更新だ。\n\n【背景】PRの画面は、マージできるかどうか、誰の承認が足りないか、どのチェックが落ちたかを確かめる場所で、日常的に最もよく見られるページの一つだ。新しいOverviewはこれを整理し直す試みで、GitHubはこのプレビューを「完成したPR体験ではなく出発点」と位置づけ、意見を集めながら改良を続けている。\n\n【詳細】改良は5つの分野に分かれる。マージ状態では、任意のチェックが失敗してもマージ可能なPRが止まって見えなくなり、これまで出ていなかったマージ要件も何に対応すべきかを示すようになった。準備状況のまとめは、対応が不要な場合も含めて案内が明確になった。レビューとコメントでは、チェックや承認はクリックで展開する形になり、表示の重なりやモバイルでの操作の問題が直った。解決済みのレビュースレッドは折りたたまれ、Copilotに言及するコメントは送信前に動作と選ばれたモデルを説明する。履歴では、強制プッシュが前後のコミットにリンクされて比較でき、コミットに時刻が付いた。レイアウトでは、小さい画面でも元と先のブランチ名が見え、Developmentのリンク編集やPRの会話のロック・解除をOverviewから行える。\n\n【ポイント・注意点】試すには、ヘッダーの「✨ Try the Overview page」ボタンを選ぶ。プレビュー中は同じメニューから従来の画面に戻れる。不具合や意見はコミュニティのフィードバック用ディスカッションで受け付けている。プランの制限や価格についての記載はない。今回の直しの多くは、マージできるのに止まって見える、モバイルで操作しにくいといった、実際に使った人が戸惑いやすい点に向けられている。プレビューの段階なので、今後も画面や動きが変わる可能性がある。従来の画面にいつでも戻れるため、気軽に試して意見を送れる。","2026-11-19","GitHub Changelog","https://github.blog/changelog/2026-11-19-improvements-on-the-pull-request-overview-in-public-preview"],["Azure DevOpsからの「作業しながら移行」が一般提供に","GitHubは11月19日、Azure DevOps ServicesからデータレジデンシーつきのGitHub Enterprise Cloudへ、作業を止めずにリポジトリを移せる「Enterprise Live Migrations（ELM）」を一般提供したと発表した。変更を同期し続け、準備ができたら短時間で切り替える。Git履歴やPRも移り、ブランチポリシーはGitHubのルールセットになる。BoardsとPipelinesのつなぎ直しも任せられる。","\n【概要】GitHubはchangelogで、Azure DevOps ServicesからデータレジデンシーつきのGitHub Enterprise CloudへのEnterprise Live Migrations（ELM）を一般提供したと発表した。チームは作業を続けながらリポジトリを移し、都合のよい時に切り替えられる。\n\n【背景】大規模な組織がAzure DevOpsからGitHubへ移る場合、移行中に開発を止める必要があることが大きな障害になってきた。凍結期間を設ければ開発が止まり、設けなければ移行後に差分が残る。ELMは、移行元から移行先へ変更を継続的に同期することでこの問題に対応する。\n\n【詳細】発表は4つの点を挙げている。管理面では、Azure DevOpsポータルの案内つきの画面を使うか、Azure DevOps CLIで移行を自動化できる。移行前の検証と進行状況の追跡で、切り替え前に問題を見つけて状況を見守れる。切り替えの時期については、ELMがAzure DevOpsからGitHubへ変更を同期し続けるため、移行中も開発者はコードを書き続けられ、準備ができたらチームに合った時刻に短い切り替えを行うだけでよい。履歴では、Git履歴、ブランチ、タグ、プルリクエストが同期され、PRのタイトル、説明、コメント、ユーザー履歴も含まれる。Azure DevOpsのブランチポリシーはGitHubのブランチルールセットとして移行される。さらに、ELMにAzure Boardsとの接続を作らせ、Azure Pipelinesを移行後のGitHubリポジトリにつなぎ直させることもできる。\n\n【ポイント・注意点】作業項目とパイプラインの定義はAzure DevOps側に残る点に注意が必要だ。つまりELMが移すのはリポジトリとPRまわりで、BoardsやPipelinesそのものを移すわけではない。詳しい手順や前提条件はMicrosoft LearnのELMの文書が案内されており、発表自体には価格の記載はない。","2026-11-19","GitHub Changelog","https://github.blog/changelog/2026-11-19-enterprise-live-migrations-from-azure-devops-generally-available"],["Actionsの大型ランナーでRHEL 9と10のイメージが一般提供","GitHubは11月19日、GitHubホスト型の大型ランナー向けにRed Hat Enterprise Linux（RHEL）9とRHEL 10のイメージを一般提供したと発表した。2026年6月にRed Hatと組んで公開プレビューを始めたもので、本番のActionsワークフローで正式にサポートされる。デプロイ先と同じOSでワークフローを動かせ、独自ツールを入れたカスタムイメージの土台にもできる。TeamとEnterprise Cloudで使える。","\n【概要】GitHubはchangelogで、GitHubホスト型の大型ランナー（larger runners）向けのRHEL 9とRHEL 10のイメージが一般提供になったと発表した。本番のGitHub Actionsワークフローで正式にサポートされる。\n\n【背景】RHELのイメージは2026年6月、Red Hatとの提携で公開プレビューとして出ていた。企業の本番環境ではRHELが広く使われており、ビルドやテストをUbuntuのランナーで行うと、本番との差による問題が起きることがある。デプロイ先と同じOSでCIを動かしたいという需要に応えるのが今回のイメージだ。\n\n【詳細】発表によると、RHELのイメージを使えば、デプロイ先と同じOSでワークフローを実行できる。さらに、自社のツール、依存関係、設定を組み込んだカスタムイメージの土台としても使える。始めるには、新しいLinux x64の大型ランナーを作り、パートナーイメージの中からRHELのイメージを選ぶ。公開プレビュー中にRHELのイメージを使っていた場合は、何もする必要はない。既存のランナーとワークフローはそのまま動き続ける。対象は、GitHub TeamとGitHub Enterprise Cloudのプランの大型ランナーだ。発表では、大型ランナーの管理とカスタムイメージの使い方の2つの文書が案内されている。\n\n【ポイント・注意点】使えるのは大型ランナーに限られ、標準のホスト型ランナーで選べるとは書かれていない。また、選べるのはLinux x64の大型ランナーで、他の構成やアーキテクチャについては触れられていない。発表には価格の記載がないため、大型ランナーの料金体系は別途確認する必要がある。プレビューからの移行で作業がいらない点は、すでに試していたチームにとって安心材料だ。一般提供になったことで、プレビューのため本番の流れに組み込むのを見送っていたチームも、RHEL上でのビルドやテストを正式な工程として採用しやすくなる。","2026-11-19","GitHub Changelog","https://github.blog/changelog/2026-11-19-red-hat-enterprise-linux-runner-images-now-generally-available"],["GitHubブログ、共同で作るOSSとしてReplicaなど紹介","GitHubは11月19日のブログで、2026年の公開リポジトリへの貢献が25億件に達し、2025年の11.2億件の2倍を超えたと紹介した。そのうえで、Copilotと並んでAIでプロトタイプを作るデザイン用ハーネス「Replica」と、障害のある人々のコミュニティと作った「Open Source Accessibility Framework」の2つのOSSを取り上げ、オープンソースは共同で作るほど良くなると訴えている。","\n【概要】GitHubブログの記事「The best things in open source are built together」（Katie Liu氏）は、GitHub上での共同作業の規模を数字で示しつつ、共同で作られた2つの新しいオープンソースプロジェクトを紹介している。\n\n【背景】記事によると、2026年のGitHub上の公開の貢献は25億件で、2025年の11.2億件の2倍を超えた。過去1年の開発者のプッシュは179億回で、2024年と2025年の合計より多い。あらゆる種類のリポジトリのコミットは343億件で2年前の3倍超、マージされたPRも3倍超の13億件、1日平均350万件になった。2025年に最も伸びたOSSの60％はAI関連だったという。\n\n【詳細】1つ目のReplicaは、GitHubのデザインチームが社内プロジェクトから公開したオープンソースのデザイン用ハーネスだ。誰でも自分のデザインシステムの中でAIによるプロトタイプを作り、GitHub Copilotと並んで磨き上げられる。作ったプロトタイプはReplica Hubに公開して、仲間がコメントし改良できる。操作やコメントから強化学習で学び、使うほど良くなるという。オープンソースなのでチームごとに作り替えられる。2つ目のOpen Source Accessibility Frameworkは、障害やアクセシビリティのコミュニティの外部の協力者と作られ、前月に始まった。アクセシビリティの目標を公開で追跡できる進捗に変える4段階の仕組みで、中心はリポジトリの概要ページに表示されるようになったACCESSIBILITY.mdだ。\n\n【ポイント・注意点】ACCESSIBILITY.mdには、目標、貢献者への期待、対応環境、既知の制限、障壁を報告する手順を書く。記事はまた、GitHub UniverseでのProcessing FoundationのJohn Maeda氏とQianqian Ye氏のセッションや、first-contributionsが2026年に貢献者数の伸びで4位になったことにも触れている。","2026-11-19","The GitHub Blog","https://github.blog/open-source/maintainers/the-best-things-in-open-source-are-built-together/"],["失敗したActionsの実行をURLから手元で再現する「FailTrace」","Hacker Newsで、失敗したGitHub Actionsの実行をURLから手元のマシンで再現するツール「FailTrace」が話題になった。AI要約つきのHNまとめサイトZeliの11月19日の記事によると、失敗した実行のURLを貼ると、失敗したジョブとステップを特定し、そのコミット時点のワークフローと突き合わせ、ログから本当の原因を取り出す。Dockerでの再現計画を立てて実行し、再現したかどうかを報告する。","\n【概要】Hacker Newsのまとめサイト「Zeli」は11月19日、GitHub Actionsで失敗した実行を手元で再現するツール「FailTrace」の投稿を取り上げた。プロジェクトはGitHubのRi4dH/failtraceで公開されている。\n\n【背景】CIの失敗は、手元では通るのにActions上でだけ落ちる、ログが長くて原因がわからない、といった形で開発者の時間を奪いがちだ。ローカルでActionsを動かす道具としてはactが知られているが、FailTraceは「この特定の実行がなぜ壊れたのか」に焦点を当てている点を違いとして打ち出している。\n\n【詳細】Zeliの紹介によると、使い方は失敗した実行のURLを貼るだけだ。FailTraceは失敗したジョブとステップを特定し、そのコミット時点のワークフローと対応づけ、ログから本当の原因を取り出す。planコマンドでDockerを使った手元での再現の段取りを組み、reproコマンドで実際に動かして、失敗が再現したか、違う形になったか、消えたかを報告する。プロジェクトは「この実行がなぜ失敗したのか、同じように手元で失敗させられるのか」に答えるものだと説明している。HNでの評価は29ポイント、コメント7件だった。\n\n【ポイント・注意点】プロジェクトはまだ開発の初期段階で、現時点ではLinuxでの実行のみが対象だ。HNのコメントでは、ランナーの環境をどう手元で再現するのか、apt-getの手順も繰り返すのかを問う声や、同じことはactで何年も前からできるという指摘があった。一方で、ログを確実に解析できるならAIに渡すトークンの節約になるという評価もある。導入手順やベンチマークは紹介されていない。Zeliの記事はHNの投稿をAIで要約したもので、ツールの説明もプロジェクト側の主張に基づく。実際に使う前には、リポジトリの説明で対応範囲や動作条件を確かめたい。CIの失敗の調べ方を自動化しようとする動きの一つとして、今後の開発が注目される。","2026-11-19","Zeli（Hacker News）","https://zeli.app/story/50554941"],["GPT-6.2 AstraとSolがCopilotで一般提供に","GitHubは11月17日、OpenAIのGPT-6.2 AstraとGPT-6.2 SolをGitHub Copilotで一般提供したと発表した。どちらもエージェント型のコーディングとコードレビュー向けで、初期テストでは以前のGPT-6系より多くの実際の問題を少ないトークンで見つけた。特にSolはGPT-6.1 Solの約2倍の問題を見つけたという。対象はPro+、Max、Business、Enterpriseで、従量課金となる。","\n【概要】GitHubはchangelogで、OpenAIの新しいモデルGPT-6.2 AstraとGPT-6.2 SolをGitHub Copilotで一般提供すると発表した。2つともエージェント型のコーディングとコードレビューを想定し、以前のGPT-6系よりコーディングの判断力が高いとしている。\n\n【背景】Copilotはモデルを選んで使える仕組みを広げており、OpenAI、Anthropic、Google、Microsoftなどのモデルが次々に追加されている。AstraとSolはOpenAIの2つの系統で、今回はそれぞれの新版だ。発表によると、初期テストでは両方とも以前のGPT-6系よりコードレビューで多くの実際の問題を見つけ、使うトークンは少なかった。\n\n【詳細】GPT-6.2 Astraは、エージェント型のコーディングとターミナルでの作業向けの最新Astraモデル。初期テストではGPT-6 Astraよりかなり多くのレビュー上の問題を見つけ、エージェントの作業を目に見えて少ないトークンでこなした。GPT-6.2 Solは、複雑なエージェント型コーディングと踏み込んだコードレビュー向けの最新Solモデルで、GPT-6.1 Solのほぼ2倍の実際の問題を、正確さを保ったまま見つけた。料金はどちらも、従量課金の中でプロバイダーの定価で請求される。使えるのはCopilot Pro+、Max、Business、Enterpriseの利用者。VS Code、Visual Studio、Copilot CLI、Copilotのコーディングエージェント、Copilotアプリ、github.com、iOSとAndroidのGitHub Mobile、JetBrains、Xcode、Eclipseのモデル選択から選べる。\n\n【ポイント・注意点】展開は段階的で、まだ表示されない場合はしばらく待つよう案内されている。BusinessとEnterpriseでは、管理者がCopilot設定のモデルポリシーで利用を管理する。新モデルを自動で有効にする既定のままなら、管理者が全体の既定をオフにしたり個別に無効にしたりしていない限り、自動で使えるようになる。Copilot Proは対象に挙げられていない。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-openais-gpt-6-2-astra-and-gpt-6-2-sol-now-available"],["Copilotのコードレビュー、深さの自動調整と秘密情報の検出","GitHubは11月17日、Copilotのコードレビューに複数の機能を加えた。PRの複雑さとリスクに応じてLite、Balanced、Maxからレビューの深さを自動で選ぶ「Adaptive」、関連する公開リポジトリを読む機能、レビューで漏れた認証情報を指摘する機能が公開プレビューで始まった。Azure Repos向けのCopilotコードレビューは一般提供になった。対象はCopilot Pro以上の各プラン。","\n【概要】GitHubはchangelogで、Copilotのコードレビューの新機能をまとめて発表した。深さの自動調整、リポジトリをまたぐ文脈、秘密情報の検出が公開プレビューで、Azure DevOps対応は一般提供になった。公開プレビューの機能は今後変わる可能性がある。\n\n【背景】Copilotのコードレビューは、PRにCopilotをレビュアーとして付けると指摘を残す機能だ。これまではレビューの深さを人が選んでいたが、小さな変更に重いレビューをかけると無駄が多く、大きな変更に軽いレビューでは見落としが出る。今回の更新は、その使い分けを自動化し、レビューで見る範囲も広げるものだ。\n\n【詳細】Adaptiveは、PRごとに複雑さとリスクを見てLite、Balanced、Maxのどれかを選び、各レビューにどれを選んだかを表示する。1件のPRで「Reviewers」バーから選ぶか、個人、リポジトリ、組織、企業の設定で既定にできる。既定は今もBalancedで、Adaptiveが上位で決めた上限を超えることはない。リポジトリをまたぐ文脈は公開リポジトリ限定で、依存するコード、文書、カスタム指示、スキルなどの関連する公開リポジトリを読む。秘密情報の検出は、150超のパートナーと作った500種類超の形式を正規表現型で見つけ、形式のないものはLLMとGitHub専用のモデルで探す。リポジトリか組織の設定のCopilot、Code reviewから有効にする。レビュー結果はInsightsタブのRepository insightsで追える。\n\n【ポイント・注意点】Azure Repos向けは一般提供になり、組織・プロジェクト・リポジトリ単位で有効にでき、ブランチポリシーで自動依頼もできる。既定の深さはLiteかBalanced。利用料はGitHub AIクレジットとして、Azure DevOps組織に結び付いたAzureサブスクリプションに請求される。新機能はPro、Pro+、Max、Business、Enterpriseで使える。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-copilot-code-review-adaptive-effort-secret-detection-and-more"],["ポーリング不要でPRの変化を受け取る「Event Streams」","GitHubは11月17日、AIエージェントがポーリングせずにイベントを受け取れる「GitHub Event Streams」をプレビューで始めた。PRを購読して接続を開いておけば、レビューの提出、新しいコミット、マージの競合、マージやクローズ、チェックの状態変化などが届く。公開のWebhookエンドポイントが要らず、ノートPC上のエージェントでも使える。全プランが対象だが、待機リストでの承認が必要だ。","\n【概要】GitHubはchangelogで、GitHub Event Streamsをプレビューとして公開した。エージェントは仕事がない間は待機し、イベントが来たときだけ動けるようになる。従来のポーリングに代わる仕組みだ。\n\n【背景】AIエージェントにPRを任せると、レビューが付いたか、CIが通ったかを確かめるため、APIを繰り返し呼ぶポーリングが必要になる。発表は、頻繁に呼べばレート制限の枠を使い切り、間隔を空ければレビューへの反応が遅れるという板挟みを指摘する。Webhookで受ければ解決するが、外から届く公開エンドポイントを用意する必要があり、手元で動くエージェントには向かなかった。\n\n【詳細】Event Streamsでは、まずPRを購読し、GitHubに接続して接続を開いたままにする。すると、レビューが提出されたとき、新しいコミットがプッシュされたとき、マージの競合が起きたとき、PRがマージまたはクローズされたとき、チェックスイートが変わったとき、チェックスイートの状態が変わったとき（スイートごとに1件）にイベントが届く。発表は利点として、反応が速くなる、無駄なトークンが減る、レート制限の消費が減る、ポーリングのループを作ったり調整したりしなくてよい、という点を挙げる。公開のWebhookエンドポイントは不要なので、ノートPCで動いているエージェントでもイベントを受け取れる。\n\n【ポイント・注意点】利用にはgh.io/event-streams-signupの待機リストに登録し、承認を受ける必要がある。プレビューはすべてのGitHubプランで使えるが、承認された利用者に限られる。価格についての記載はない。詳しくはdocs.github.comのEvent Streamsの文書が案内されており、意見はコミュニティのディスカッションで受け付けている。なお翌日のchangelogでは、gh v2.105.0でPRの変化を1つのコマンドで待てるようになったことも発表されており、エージェント向けの待ち方の整備が続いている。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-github-event-streams-is-now-in-preview"],["Copilotのセキュリティレビューで、秘密情報の検査を随時実行","GitHubは11月17日、Copilotのセキュリティレビュー担当がGitHubのシークレットスキャンを実行できるようにし、開発者やエージェントがマージ前に変更内の秘密情報を見つけられるようにした。Copilot CLI、Copilotアプリ、Copilot SDK、コードレビューで公開プレビューとして使える。500種類超の形式に加え、形式のないパスワードなども専用モデルで探す。既定はオフで、AIクレジットを消費する。","\n【概要】GitHubはchangelogで、Copilotのセキュリティレビューの機能がGitHubのシークレットスキャンを実行できるようになったと発表した。開発者とエージェントが、マージ前のコード変更に含まれる秘密情報を見つけられる。11月18日には、SDKでの認証の条件を明確にする追記があった。\n\n【背景】AIエージェントが大量のコードを書くようになり、APIキーや接続文字列がうっかりコミットに入る危険も増えている。これまでのセキュリティレビューはLLMによる分析だけだったが、今回からGitHubが長年育ててきたシークレットスキャンの検出器を併用できるようになった。\n\n【詳細】有効にすると、セキュリティレビューは従来のLLMによる分析に加えて、GitHubの検出器を走らせる。150超のパートナーと作った500種類超の形式に対応し、さらに専用に調整したモデルが周りのコードを読んで、パスワードや接続文字列の認証情報のような決まった形式のない秘密も見つける。対象は変更部分だけで、リポジトリの履歴は調べない。Copilot CLIでは対話セッションで /settings aiSecretDetection on を実行し、/security-review を使う。Copilotアプリでは設定のExperimentalで「AI secret detection」をオンにする。コードレビューでは、リポジトリ設定のCopilot、Code reviewのSecurityでSecret scanningをオンにする。SDKでは機能フラグSECURITY_REVIEW_FINE_TUNED_MODELを有効にし、GitHub認証を設定する。\n\n【ポイント・注意点】既定はオフで、有効にするまではLLMによる検出だけが使われる。VS Codeは今回の対象外だ。SDKでは、モデル提供元のAPIキーだけでは足りず、連携アプリ独自のOAuthアプリが出したトークンも今は使えない。追加のプランは不要だが、検査はSecret ProtectionのAIクレジットを消費する。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-secret-scanning-on-demand-for-developers-and-agents"],["スキルやエージェントを試験する「Copilot Evals」公開プレビュー","GitHubは11月17日、Copilotの設定に含まれるスキル、カスタムエージェント、MCPツールを点検し改善するための「GitHub Copilot Evals」を公開プレビューで始めた。現実的な課題をエージェントに与え、良い結果の条件を書いておき、結果と過程の両方を確かめる繰り返し可能なテストを作れる。/evalコマンドや普通の言葉で作成・実行・比較でき、VS Code、Copilot CLI、Copilotアプリで使える。","\n【概要】GitHubはchangelogで、GitHub Copilot Evalsを公開プレビューとして公開した。Copilotの設定に入っているスキル、カスタムエージェント、MCPツールが期待どおりに動くかを確かめ、改善するための道具だ。\n\n【背景】チームでCopilotを使い込むほど、独自のスキルやエージェント、MCPツールが増えていく。しかしAIの出力は実行のたびに変わるため、指示を少し書き換えただけで以前できていたことができなくなっても気づきにくい。発表は、変更の後に同じevalを走らせ直すことで、こうした後退を見つけるよう勧めている。\n\n【詳細】ここでいうevalは、AIのふるまいを確かめる繰り返し可能なテストだ。エージェントに現実的な課題を与え、良い結果とは何かを書いておき、結果と、エージェントがそこに至った過程の両方を確かめる。Copilotに普通の言葉で頼むか /eval コマンドを使い、プロジェクトのスキル、カスタムエージェント、MCPツール向けのevalを作り、実行してどの検査が通りどれが落ちたかを見て、落ちた理由を調べて何を変えるか決め、変更前後の実行を比べられる。実行は毎回、始める前に利用者が承認する。評価の中身は拡張可能な手元用の評価ツール「Vally」が担う。VS CodeではMarketplaceから拡張機能を入れ、Copilot CLIではgithub.com/github/evalsの手順でプラグインを入れる。Copilotアプリでは「Customize」からgithub/evalsのマーケットプレースを追加して入れる。\n\n【ポイント・注意点】対象はCopilot Individual、Business、Enterpriseのプランで、公開プレビューの段階だ。価格についての記載はない。文書はaka.ms/evalsにあり、意見はgithub/evalsリポジトリのissueかコミュニティのディスカッションで受け付けている。AIの出力はぶれるため、1回の結果で判断せず、変更の前後で比べる使い方が前提になる。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-github-copilot-evals-is-now-in-public-preview"],["保守者に要るのはAIのバグ報告より修正、GitHubが試行報告","GitHubは11月17日のブログで、MicrosoftとのCodename MDASHの試行を報告した。AIのスキャナーが出した約9,791件の候補を絞り込み、研究者が手で確かめて、AutoGPTやCaddyなど6つのOSSに修正案つきの非公開報告99件を届けた。11月15日時点で55件が修正され、14件はリリース済み。AIで脆弱性を探すなら、確認し、非公開で報告し、修正案を付けるよう呼びかけている。","\n【概要】GitHubブログの記事「Maintainers don't need more AI bug reports. They need fixes.」（Ashley Wolf氏、Gregg Cochran氏）は、AIで見つけた脆弱性をどう保守者に届ければ実際の修正につながるかを、試行の結果から論じている。\n\n【背景】AIで脆弱性を探す人が増え、OSSの保守者には未確認の大量の報告が届くようになった。記事は、保守者に必要なのは報告の数ではなく修正だという立場をとる。試行の対象は、GitHub Secure Open Source Fundの卒業生であるAutoGPT、Caddy、Express、FastMCP、ImageMagick、Nettyの6プロジェクトだ。\n\n【詳細】手順は5段階。Codename MDASHがMAI Cyberモデルで各プロジェクトを調べて修正案を出し、GitHub Security LabのAI選別エージェントが重複や誤りを除いて影響の大きいものに絞る。次にMicrosoft FORGE Labの研究者7人が、1プロジェクトあたり約2日かけて手で確認する。そして非公開の脆弱性報告の仕組みで、再現手順と修正案を付けて届け、何をいつどう直すかは保守者が決める。図の説明によると候補は9,791件で、報告はおよそ100件に1件の99件になった。最初の修正は調査の約1週間後に出た。Caddyは22件すべてを1週間以内に直し、2人体制のImageMagickは22件を受け取り、1件は15分で修正を出した。\n\n【ポイント・注意点】記事は、6件は小さな標本だと認めている。今後必要なものとして、非公開報告での修正の受け渡し、非公開フォークでのCI/CDテスト、修正前後の再現手順を確かめられるモデルへのアクセスを挙げる。保守者には非公開の脆弱性報告とDependabot警告を有効にするよう勧め、Fundの全卒業プロジェクトに検証済みのAIセキュリティ検査を提供するとしている。","2026-11-17","The GitHub Blog","https://github.blog/open-source/maintainers/maintainers-dont-need-more-ai-bug-reports-they-need-fixes/"],["端末をまたいで続くCopilotの会話、Agent Host Protocolの設計","GitHubは11月17日のエンジニアリングブログで、Copilotのセッションを端末をまたいで続けられるようにする「Agent Host Protocol（AHP）」の設計を解説した。VS Codeで生まれ、いまはGitHub全体で使われるオープンな標準だ。スマホでクラウドのセッションを始めてノートPCで続けるといった使い方を支える。チャンネルごとの状態をサーバーが管理し、通信が切れても再接続しやすい作りにしている。","\n【概要】GitHubブログの記事「Building the Agent Host Protocol for sessions that continue across devices」（Connor Peet氏、Rob Lourens氏）は、Copilotのエージェントのセッションを複数の端末で共有するための通信規約AHPがなぜ、どう作られたかを説明している。\n\n【背景】CopilotはもともとVS Codeの拡張機能として独自の仕組みで作られ、エージェントがエディターに縛られていた。ウィンドウを閉じればエージェントは終わり、VS Codeを更新すればすべてのエージェントが止まった。一方でCopilotアプリやiOS・AndroidのGitHub Mobileは、それぞれ別にクラウドのエージェントとつながっていた。VS CodeのCopilot Chat拡張はテストを除いて40万行を超えていたという。そこで2026年初めにAHPの開発が始まり、Copilot SDKが新しいエージェントの基盤になった。\n\n【詳細】AHPは、エージェントのふるまい自体はあえて定めない。URIで識別される「チャンネル」を単位に組まれ、どのサーバーもroot、session、chatの3つを実装する必要がある。ターミナル対応やMCP、OTelでの報告は任意のチャンネルだ。各チャンネルは状態を持ち、状態を決めるのはサーバーで、クライアントは操作を送る。このため、回線の悪い環境での再接続や再生がしやすい。VS Code側のホストはTypeScript、GitHub側はRustで書かれ、VS Code側はSSH、コンテナ、WSL、Dev Tunnels越しにも動く。記事は、アプリで9時2分に始め、9時40分にスマホでツールの実行を承認し、VS Codeで差分を見て、11時32分にクラウドのエージェントがPRを出す流れを例に挙げる。\n\n【ポイント・注意点】クライアントのライブラリはRust、TypeScript、Kotlin、Swift、.NET、Goで用意されている。CopilotアプリではExperimentalのDirect Connectionsを有効にし、VS CodeではAgentsウィンドウから接続を追加する。code agent hostで単独のホストも起動できる。","2026-11-17","The GitHub Blog","https://github.blog/engineering/engineering-principles/building-the-agent-host-protocol-for-sessions-that-continue-across-devices/"],["MicrosoftのMAI Code 2と2 FlashがCopilotに登場","GitHubは11月17日、Microsoft AIの新しいコーディング用モデル「MAI Code 2」と「MAI Code 2 Flash」をGitHub Copilotで使えるようにしたと発表した。MAI Code 2は深いデバッグや複数ファイルの実装、リポジトリ全体の推論に向く汎用モデル、Flashは日常の作業向けの軽くて安いモデルだ。Flashは無料プランや学生向けでも使え、どちらも従量課金となる。","\n【概要】GitHubはchangelogで、Microsoft AI（MAI）の新モデルMAI Code 2とMAI Code 2 FlashをGitHub Copilotに追加したと発表した。MAI-Codeシリーズの次の世代で、軽いコーディング支援から複雑なエージェント型の開発まで範囲を広げたという。\n\n【背景】Copilotでは各社のモデルを選んで使えるが、MicrosoftもMAI-Codeとして自社のコーディング用モデルを出してきた。一方で、旧モデルのMAI-Code-1.1-Flashは12月にCopilotから外れることが同じ日に予告されており、今回の2つが新しい選択肢になる。\n\n【詳細】MAI Code 2は、依頼から結果までを集中した応答と実用的なコード変更で進める汎用のコーディングモデルで、深いデバッグ、複数ファイルにまたがる実装、リファクタリング、リポジトリ全体にわたる推論に向くとされる。MAI Code 2 Flashは、コードの説明、狙いを絞った修正、決まりきった直し、素早い試行のくり返しといった日常の作業向けの、軽くて費用を抑えたモデルだ。どちらもエージェント型のコーディングを想定している。料金はどちらも従量課金。使えるプランは、MAI Code 2がCopilot Pro、Pro+、Max、Business、Enterprise、MAI Code 2 FlashがFree、Student、Pro、Pro+、Max、Business、Enterpriseで、年額プランの対象者も含まれる。VS Code、Visual Studio、Copilot CLI、クラウドのエージェント、Copilotアプリ、github.com、GitHub Mobile、JetBrains、Xcode、Eclipseのモデル選択から選べる。\n\n【ポイント・注意点】画像の理解や性能、効率の改善についてはMicrosoft AIの別の発表に譲られており、changelog自体には数値がない。BusinessとEnterpriseでは管理者がモデルポリシーで管理し、既定のままなら、全体の既定をオフにしたり個別に無効にしたりしていない限り自動で使える。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-mai-code-2-and-mai-code-2-flash-in-github-copilot"],["Copilot Fusion、Terminal-Benchで71.2%、使える場所も拡大","GitHubは11月17日、複数のモデルを組み合わせて使う「Copilot Fusion」の更新を発表した。Terminal-Bench 4.1の公開ランキングに載り、Copilot Fusion Maxは解決率71.2％で、Opus 5.5やFable 5.2を5.4ポイント上回ったという。github.comやVisual Studioでも選べるようになり、MaxにClaude Sonnet 5.5を加えるなどモデルも増えた。","\n【概要】GitHubはchangelogで、Copilot Fusionの更新を発表した。新しいモデルの追加、使える場所の拡大、2つの公開ランキングへの掲載が柱だ。\n\n【背景】Copilot Fusionは、作業ごとにモデルを選んで組み合わせる仕組みで、利用者は手間のかけ具合（effort）を決めるだけでよく、どのモデルを使うかはFusionが決める。各社の最新モデルが次々に出る中、どれを選ぶかを利用者に任せず自動で調整する方向をGitHubは強めている。\n\n【詳細】今回、Copilot Fusionは、スタンフォード大学、Harbor、Laude Instituteが運営するTerminal-Bench 4.1の公開ランキングに載った。Terminal-Bench 4.1は、AIエージェントがターミナルで難しく現実的な課題をどれだけこなせるかを測るものだ。Copilot Fusion Maxの解決率は71.2％で、最先端のモデルであるOpus 5.5とFable 5.2を5.4ポイント上回った。費用はFable 5.2より88％、Opus 5.5より57％低いという。発表は、独立したランキングなら同じ課題、同じ評価ルールでエージェントを比べられると述べている。使える場所としては、最新版のgithub.com、Visual Studio、iOSとAndroidのGitHub Mobileのベータ版で選べるようになった。今回追加されたモデルは、MaxへのClaude Sonnet 5.5、HighへのGPT-6.1 Terra、StandardへのMAI-Code-2だ。\n\n【ポイント・注意点】正式版のGitHub Mobileでの対応は「近日」とされ、日付は示されていない。発表にはFusionをどのプランで使えるかの記載がない。ベンチマークの数値はGitHubの発表によるもので、条件の詳細はランキング側で確かめる必要がある。詳しい仕組みはCopilot Fusionの文書が案内されている。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-github-copilot-fusion-updates-more-availability-benchmarks-and-models"],["Copilotレビューの効き目を測る「Repository insights」","GitHubは11月17日、リポジトリのInsightsタブに新しい「Repository insights」ページを加え、Copilotのコードレビューの成果を1か所で見られるようにした。指摘への対応状況、重大な指摘への対応、Copilotのレビュー後に人が修正を求めなかったPR、CopilotのレビューなしでマージされたPRの4つの指標を示す。同じ数値はCopilotの利用状況APIからも取れる。","\n【概要】GitHubはchangelogで、リポジトリのInsightsタブの先頭に「Repository insights」ページを追加したと発表した。Copilotのコードレビューの結果をまとめて見られる。\n\n【背景】Copilotのコードレビューを入れたチームにとっては、指摘が実際に役立っているのか、人のレビューの手間は減ったのか、レビューされずに通っているPRはないのかを確かめる手段が必要だった。発表は、この画面で開発者がCopilotの指摘に対応しているか、Copilotのレビュー後も人が修正を求めているか、どこでCopilotのレビューが飛ばされているかがわかるとしている。\n\n【詳細】ページにはリポジトリごとに4つの指標が並ぶ。対応されたCopilotのレビューコメント、対応された重大度の高いコメント、Copilotがレビューした後に人のレビュアーから修正依頼が出なかったPR、Copilotのレビューを受けずにマージされたPRだ。さらに、評価できるコメントのうち対応されたものの割合（対応率）を、分子と分母、評価できずに除いたもの、時間の推移、対応している内訳とともに調べられる。コメントの分類では、Copilotがそのリポジトリでどんな種類の指摘を残しているかがわかる。同じ指標は、Copilotの利用状況APIの企業・組織向けの1日単位のリポジトリ報告（repos-1-day）でも取れる。\n\n【ポイント・注意点】画面を見るにはリポジトリの読み取り権限が要る。APIの報告は、企業の所有者と請求管理者、組織の所有者、「View Copilot Metrics」権限を持つカスタムロールの人が使える。Copilotの利用状況の指標のポリシーが有効になっている必要もある。チームは、対象の漏れを見つけ、Copilotの活用を広げる場所を決めるのに使える。詳しくはRepository insightsの文書と、Copilotの利用状況APIの文書が案内されている。AIのレビューを入れたものの効果を数字で説明しにくかったチームにとって、判断の材料になりそうだ。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-track-copilot-code-review-outcomes-in-repository-insights"],["Copilot CLIにMicrosoft Entraでのサインイン、プレビューで","GitHubは11月17日、GitHub Copilot CLIでMicrosoft Entraによる認証を公開プレビューとして使えるようにした。Entraのアカウントでサインインすると、組織の契約に応じて、結び付いたEnterprise Managed Userへ自動でサインインするか、Microsoft 365 Copilotのライセンスで使うか、その両方ができる。WindowsとmacOSが対象で、Linuxは後日。CLI 1.0.113以降が要る。","\n【概要】GitHubはchangelogで、GitHub Copilot CLIがMicrosoft Entraの認証に公開プレビューとして対応したと発表した。Entraアカウントでのサインインで、GitHubのEnterprise Managed User（EMU）への自動サインイン、Microsoft 365 Copilotのライセンスでの利用、またはその両方ができる。\n\n【背景】Microsoftの製品を中心に使う企業では、社員の本人確認はEntraにまとまっている。一方Copilot CLIを使うにはGitHubへの別のサインインが必要で、手間や管理の二重化が課題だった。今回の対応で、Entraを入り口にCLIを使えるようになる。WindowsとmacOSで使え、Linuxは後から対応する。\n\n【詳細】EMUの場合は、OIDCでEMUを使う企業なら、Entraでの自動サインインで、GitHubへ別にサインインせずに使える。Copilot BusinessかEnterpriseのライセンスが割り当てられ、組織がCopilot CLIのポリシーを有効にしている必要がある。この場合の推論はGitHubで行われ、利用は組織のCopilotのプランに従う。このサインインはCopilot CLIとVS Codeに限られる。Microsoft 365 Copilotの場合は、組織がFrontierに参加し、従量課金のMicrosoft 365 Copilotライセンスを持っていれば、ターミナルからMicrosoft Copilotのモデルを使える。推論はMicrosoft 365側で行われ、GitHubアカウントは要らない。モデルや利用上限はGitHubではなくMicrosoft 365 Copilotの設定で管理し、Work IQのMCPサーバーで仕事のデータを文脈として渡せる。\n\n【ポイント・注意点】始めるにはCopilot CLI 1.0.113以降を使い、ターミナルで copilot update を実行して更新したうえで、認証の文書にある機能ごとの手順に従う。価格は上記のライセンス条件以外に示されていない。どちらの経路を使うかで、推論の場所、課金、管理する画面が変わる点に注意したい。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-github-copilot-cli-adds-microsoft-entra-sign-in-as-a-preview"]],"elec":[["LLMは方針だけ、ラズパイ5のRust反射層と小型CNNで自律走行","Qiitaの@tactac1238さんが、LangGraphのLLMエージェントで小型ロボットカーPiCar-Xを動かした前作の続編を公開した。LLMのループは1回に1秒以上かかり、通信が切れると最後の前進命令のまま走り続ける危険があった。そこで40HzのRust安全層と約10万パラメータのCNNに操舵を任せ、LLMは大まかな意図だけを出す形に改めた。CNNの推論時間の中央値は8.1ミリ秒。効いたのはモデルの改良よりデータの掃除と車体の校正だったという。","\n【概要】Qiitaで、LangGraphとラズパイを組み合わせたロボットカーの続編記事が公開された。LLMには走る方針だけを決めさせ、毎フレームの操舵はRaspberry Pi 5上のRust製の反射層と小型のCNNに任せる「体と脳の分離」を試している。\n【背景】前作では、LLMエージェントがPiCar-Xを直接動かしていた。しかし撮影、API呼び出し、JSONの解析、駆動命令までの1周に1秒以上かかり、約1Hzでしか動けなかった。Wi-Fiが切れたりAPIの回数制限にかかったりすると、ロボットは最後の「前進」のまま走り続けた。エージェントを複数に分けると遅れはおよそ2倍になった。作者は、毎フレームの操舵にLLMを使うべきではないと結論づけた。\n【詳細】新しい構成では、ラズパイ上のRustのループが40Hzで回り、超音波センサーが15cmを切ると強制停止する。落下センサーと400ミリ秒の命令の有効期限も見張り、危険の検知からモーター停止までは最大20ミリ秒以内とされる。LLMは「右へ進んで」「おまかせ」といった意図だけを出し、モーターには触れない。操舵にはNVIDIAのPilotNetを参考にした約10万パラメータの条件付き模倣学習CNNを使う。入力は3×120×160のRGB画像で、意図ごとの出力と「塞がれている」を判定する補助の出力を持つ。Rustのtract-onnxで動かし、推論の中央値は8.1ミリ秒だった。学習データは、ゲームパッドで操縦しながらJSON Linesに記録した。車輪のエンコーダーがないため、オプティカルフローと超音波の変化を組み合わせて、壁に張り付いた場面や空転した場面を取り除いた。この掃除のほうが、モデルの変更より安定性に効いたという。\n【ポイント・注意点】最大の問題は車体の癖だった。0度でも片側へ寄るため、操縦者が無意識に逆へ当て舵をし、まっすぐな道で曲がる癖をモデルが学んでしまった。超音波は布や細い椅子の脚を見逃し、赤外線の床センサーは黒いカーペットを段差と誤認した。オフラインの誤差は当てにならず、常に0度を出すモデルでも良い数字が出る。そこで作者は、10分あたりに人が介入した回数を合格の物差しにしている。速い反射と遅い推論を分け、モデルより先にデータと車体を整える、という教訓を示した記事だ。","2026-11-20","Qiita","https://qiita.com/tactac1238/items/99ed93e89f94ca353d85"],["人の気配に振り向く座敷童子人形、ラズパイZero Wで組み立て","Zennで、Raspberry Pi Zero Wを使い「人の気配に振り向く座敷童子人形」を作る記事が公開された。人感センサーで目覚め、行灯を灯し、首を人の方へ向け、家族にはあいさつ、見知らぬ人には不気味な音を流す作品で、ハッカソンKiroween 2026向けの制作だ。今回は組み立てと動作確認の回で、顔認識とクラウドの部分はこれからとしている。サーボの回り過ぎや電池の接触不良など、つまずきと対策が具体的に書かれている。","\n【概要】Zennの作者ないきさんが、Raspberry Pi Zero Wで動く人形「Zashiki-Warashi Guardian」の組み立て編を公開した。人の動きで起動し、行灯を灯して首を向け、家族ならあいさつ、知らない人なら不気味な音で迎える仕掛けを目指している。\n【背景】ハッカソンKiroween 2026のFrankenstein部門向けの作品だ。今回の記事は組み立て、配線、動作確認までを扱う。顔認識とAWSを使うクラウド側は「これから」とされ、ソフトウェアは後の記事で扱う予定だ。\n【詳細】部品は、Raspberry Pi Zero W、人感センサーHC-SR501、首を振る2個のサーボ（SG90）、パンチルトの台、Camera Module v1系（ov5647）、オーディオテクニカのUSBスピーカーフォンAT-CSP1、1Wのパワー LED、NチャネルMOSFETの2SK4017などだ。箱はセリアの木箱を使った。ラズパイは5Vの電源で動かし、サーボとLEDは単4電池4本（約4.8V）から直接給電する。LEDの抵抗に流れる電流は約0.27Aと計算している。ソフトはRaspberry Pi OSとgpiozero、lgpioで、カメラはrpicam-still、音はALSAの道具で確かめた。サーボは1歩2度、30ミリ秒の待ちで動かし、可動域はまず左右±30度、上下±20度から始める。\n【ポイント・注意点】つまずきの多くは配線図の外にあった。LEDとサーボが動かない原因は電池ボックスの接触不良で、はんだ付けし直して直した。USB機器が認識されないのは、電源とデータのmicroUSB端子を取り違えていたためだ。左右のサーボが回り続けたのは360度型だったからで、180度型を買い直した。0度を指示して確かめるよう勧めている。頭が天井に当たる問題は、ホーンの取り付け角のずれが原因だった。4個のサーボのうち1個は不良で、1個は突き当てて壊した。作者は、起動時に動かさない、記録した中心からの相対角で動かす、動かした後は信号を切る、といった約束事を決めた。AIの部分はまだ入っていないが、カメラと声を備えた見守り人形の土台づくりとして、ハードの落とし穴をまとめた記録になっている。","2026-11-19","Zenn","https://zenn.dev/naiki9982/articles/660826c71d3879"],["スタックチャンをMetaのMuseガジェットに、Google TTSで声を付与","Zennで、M5Stack CoreS3を使うスタックチャンにMetaのMuseガジェットSDKを載せ、Google Cloud Text-to-Speechで返事を喋らせる記事が公開された。SDKの返答は文字だけで音が出ないため、返事を音声に変えてスピーカーで鳴らす部品を自作した。開発環境はESP-IDF v6.0.3で、SDK本体は書き換えずにパッチで足す。話しかけてから声が出るまでは約8秒で、無料枠の条件が変わりうる点も注意として挙げている。","\n【概要】Zennの作者Hideyuki Fujikawaさんが、M5Stack CoreS3で動くスタックチャンをMetaの「Muse」ガジェットにし、返事をGoogle Cloud Text-to-Speechで読み上げさせる手順を公開した。\n【背景】MetaのMuseガジェット用SDK（muse-gadget-sdk）を入れると、話した声は認識され、返事は文字で届く。しかし返答は文字だけなので、スタックチャンは喋らない。作者は返事を音声に変えて鳴らす部品を足した。動くのはPWRボタンの長押しで録音し、離すとMuseへ送る音声メモの経路で、リアルタイムの音声通話は確かめていない。\n【詳細】ビルドはWindowsのWSL2（Ubuntu）で行い、書き込みはWindows側のCOMポートから行う。SDKが対応するのはESP-IDF v6.0.3だけだ。SDKのトークンはgadgets.muse.aiで発行し、シリアルで送る。命令は95文字以内で、末尾はLFにする必要がある。読み上げはCloud Text-to-SpeechのAPIキーを登録して使い、既定の声はja-JP-Neural2-Bだ。HTTPSの待ちでMuseとの接続が切れないよう、読み上げは別のタスクでMP3を取得し、ストリームバッファでSDKの通信タスクへ渡す。返事は文ごとに分け、最初の塊は約120バイトにする。失敗時は最大3回やり直し、タイムアウトは8秒だ。12秒以内に音が来なければ文字表示に戻す。Markdownの記号や絵文字は取り除く。変更は4つのファイルにかかる1本のパッチにまとめ、SDKは書き換えない。GoogleのMP3は24kHzで、SDKが16kHzに変換する。\n【ポイント・注意点】トークンが通らなかった原因は、端末がCRを送っていたことで、Pythonから送る形にした。ときどき無音になる問題は再試行と短いタイムアウトで、「考え中」のまま止まる問題は12秒での文字表示への切り替えで直した。書き込み後にWi-Fiとペアリングが消える件と、長い返事の途中で1回再起動した件は、原因がわかっていない。話してから声が出るまでは約8秒かかる。無料枠の条件は変わりうるとも書いている。次はアバター表示や、サーボ、頭のタッチ、LEDをMuseから操る予定だという。","2026-11-18","Zenn","https://zenn.dev/fujihide/articles/cf3eb84525346c"],["「わんちゃん」で犬が鳴く、ラズパイとVoskの音声認識おもちゃ","Zennで、Raspberry Pi 3 Model B+とオフライン音声認識エンジンVoskを使い、子どもが「わんちゃん」と言うと犬の鳴き声、「ねこちゃん」と言うと猫の鳴き声を流すおもちゃの作り方が公開された。音はMP3モジュールDFPlayer miniで鳴らす。以前ESP32-S3で試した際は音声モデルが大きすぎて入らなかったが、SDカードに置けるラズパイなら動くという。例外処理や誤認識の検証はなく、試作段階と断っている。","\n【概要】Zennの作者Piroftさんが、ラズパイとVoskで作る音声認識デバイスの記事を公開した。子どもが「わんちゃん」と言えば犬の鳴き声を、「ねこちゃん」と言えば猫の鳴き声を流す、ネットにつながずに動くおもちゃだ。\n【背景】作者は以前、ESP32-S3-WROOM-1で同じことを試したが、音声認識のモデルが大きすぎてROMに収まらず失敗した。ラズパイならモデルをSDカードに置けるので、この制約がなくなるという。記事はZennの「物理デバイスを使った開発」のテーマに沿ったものだ。\n【詳細】ハードは、Raspberry Pi 3 Model B+、MP3モジュールのDFPlayer mini、ダイナミックスピーカー、USBの小型マイクだ。ソフトはオフラインの音声認識エンジンVosk、マイク入力のPyAudio、DFPlayerへの命令を送るpyserialで、Pythonで書く。モデルは約50MBの小型の日本語モデルvosk-model-small-ja-0.22を使う。約1GBの大型モデルはより正確とされるが、作者は試していない。DFPlayerはラズパイのUART0（9600ボー）につなぎ、送受信の両方に1kΩの抵抗を入れるよう勧めている。microSDカードはFAT16かFAT32で、mp3フォルダに犬と猫の音を置く。raspi-configでシリアルのログインを切り、ハードのシリアルを有効にする。プログラムはマイクを16000Hz、モノラルで開き、認識結果に「わん」「いぬ」「犬」などがあれば1曲目、「ねこ」「猫」などがあれば2曲目を鳴らす。音量は0〜30のうち22にしている。\n【ポイント・注意点】DFPlayerは、ファイルの数によって起動に1.5〜3秒かかる。省電力の設計にするなら、この待ちを見込む必要がある。マイクの反応が弱いときは、alsamixerでUSBマイクを選び入力を上げるとよいという。作者は試作段階だと断っている。DFPlayerの命令には例外処理も再送もない。認識は出力の中の言葉を探すだけで、誤認識の確認はしていない。精度や反応の速さの数字も示されていない。それでも、ネット不要の音声認識を手頃な部品で子ども向けの仕掛けにする入り口として参考になる。","2026-11-18","Zenn","https://zenn.dev/piroft28/articles/10a81f3b06c45b"],["フロッピー1枚に収まる言語モデル、486のDOSで動くチャットボット","Hackadayが、フロッピーディスク1枚に収まる小さな言語モデル「Tiny2.1 DOS PC Chatbot」を紹介した。Turbo C 2.0で書かれ、486DXかPentiumのDOS機で動く第2世代のトランスフォーマーだという。重みは8ビットで380KB、動かすには540KBの空きメモリーが要る。36.7万パラメータの網に3,500の事実を収める。記事は作り話をする点も認め、製品というより話のきっかけだとしている。","\n【概要】Hackadayは、WollyMonjacさんの「Tiny2.1 DOS PC Chatbot」を取り上げた。486DXかPentiumを積んだDOS機で動き、当時のフロッピーディスク1枚に収まるチャットボットだ。\n【背景】大規模言語モデルは巨大な計算資源を使うのがふつうだが、どこまで小さくできるかを試す取り組みも続いている。Hackadayは以前にも486でLLMを動かす話題を伝えており、今回の記事もその流れにある。\n【詳細】記事によると、プログラムはTurbo C 2.0で書かれている。作者は、コードを書いたのが「Fable 5.2」、学習させたのが「Opus 5.5」だとしている。モデルは「第2世代のトランスフォーマー」と呼ばれ、ネットワークは8ビットの重みで380KBだ。フロッピーの残りの容量には対話の画面が入る。動かすには540KBの空きメモリーが必要だという。36.7万パラメータの網の中に3,500の事実を持たせている。GitHubにはMITライセンスで学習用のスクリプトが置かれ、使う人が自分の3,500の事実で学習させ直せる。記事のタグにはDOS 6.22が付いている。\n【ポイント・注意点】記事は、このモデルも大きさに関係なくLLMの常として「作り話をする」と認めている。作者自身も、製品というより話のきっかけだと位置づけている。読者のコメント欄では、17×23の掛け算を間違えたことや、電話の発明についての答えが話題になった。作者は、LLMは計算が苦手で、決まった計算をする層を足すと良いと返している。記事は、モデルが知っている中身を人が選んで整える発想に「興味深い可能性」があると結んでいる。電子工作の視点では、古いPCのような非力な機械や、メモリーの少ない組み込み機器で言語モデルをどこまで動かせるかを考える材料になる。重みの量子化と知識の絞り込みで、ここまで小さくできるという一つの例だ。ただし、紹介されているのは記事と作者の説明で、性能の測定結果は示されていない。","2026-11-18","Hackaday","https://hackaday.com/2026/11/18/not-so-large-language-model-fits-on-a-floppy-disk/"],["家のPCでLLMを分担、RAMDeckの仕組みとSBC対応を分析","dev.toで、複数のパソコンにLLMの重みを分けて載せる「RAMDeck」の構成を分析した記事が公開された。llama.cpp互換のRPCワーカーで層を分担し、OpenAI互換のAPIで呼び出せる。一方で、ラズパイやRK3588、Jetsonがワーカーとして使えるかは確かめられていないという。専用機Hubの中身や電源の仕様にも食い違いが残る。メモリーが増えても生成が速くなるとは限らないと注意している。","\n【概要】dev.toで、EmbedSBCが「RAMDeck」の仕組みを分析した記事を公開した。RAMDeckは、手元にある複数のコンピューターに言語モデルの処理を分けて載せる製品で、記事はその構成と、シングルボードコンピューター（SBC）で使えるかどうかを調べている。\n【背景】大きな言語モデルを1台で動かすには、多くのメモリーが要る。家に余っているパソコンを束ねてメモリーを足せれば、手の届く機材で大きなモデルを扱える。RAMDeckはTradeMAV LLCの製品で、Indiegogoのクラウドファンディングから始まった。\n【詳細】公開されているノードの参照実装は、llama.cpp互換のRPCワーカー（ggml-rpc-server）を使う。商用版はこれにHub、ブラウザーの管理画面、管理されたノードのアプリを加える。モデルを持つ主の機械が層を配り、各ワーカーは担当の重みを持ち、計算の途中の値をノード間で渡す。記事は目安として、320億パラメータを4ビットにすると重みだけで約16GBになり、ほかにメタデータ、バッファー、KVキャッシュが要ると説明する。既定のRPCポートはGPUワーカーが50052、CPUワーカーが50053だ。WindowsのCPUノードはWindows 10/11、NVIDIA向けはCUDA 12、Apple SiliconはmacOS 13.0以降が挙がっている。APIはOpenAI互換の/v1/chat/completionsだ。参照実装のライセンスはApache 2.0にCommons Clauseの条件を付けたものだ。\n【ポイント・注意点】電子工作の視点で気になるのはSBCへの対応だが、Raspberry Pi、RK3588、JetsonがARM64 Linuxのワーカーとして使えるかは確かめられていないという。専用機Hubについても、SoC、RAM、記憶装置、Ethernetの速度は資料から確定できなかった。電源も公式FAQでは5V／3A、キャンペーンのFAQでは5V／4Aと食い違う。キャンペーンとサイトの配送情報も一致していないとしている。記事は、1台の速さより分散で得られる容量が効く場面があるとしつつ、メモリーが増えても生成が速くなる保証はないと注意する。ベンチマークの結果は示されていない。","2026-11-18","dev.to","https://dev.to/embedsbc/ramdeck-architecture-analysis-llamacpp-rpc-distributed-llm-memory-and-sbc-compatibility-2d7l"],["Claude Codeにスマホで実機を見せ、Pico 2の机上ダッシュボード","Zennで、Raspberry Pi Pico 2 WHと1.3インチ液晶で、時計、札幌の天気、Claude Codeの使用量を表示する机のダッシュボードを作った記事が公開された。Claude Codeは画面を見られないため、adbでスマホのカメラを操作して実機の画面を撮らせた。気温が「--」になる不具合や文字のはみ出しは、テストでは見つからず写真で見つかったという。作業は2日間で、配線とスマホの向きは人が担当した。","\n【概要】Zennの作者OKZAQさんが、Raspberry Pi Pico 2 WHと1.3インチのST7789液晶で、机に置くダッシュボードを作った記録を公開した。時計、気象庁の札幌の天気、Claude Codeのトークン使用量を8秒ごとに切り替えて表示する。\n【背景】AIにコードを書かせても、AIは実機の画面を見られない。そこで作者は、USBでつないだスマホのカメラをadbで動かし、Claude Codeが自分で実機の画面を撮って確かめられるようにした。作業は2026年11月14〜15日の2日間で、作者は配線とスマホの用意を担当し、コードと動作確認はClaude Codeが行った。\n【詳細】Pico 2 WHはMicroPythonで動かし、Wi-FiとBluetoothは使わない。データはPCからUSBのシリアル（115200bps）で1行1件のJSONとして送る。時計は10分ごと、天気は30分ごと、使用量は1分ごとだ。撮影は、スマホを起こしてカメラを開き、2.5秒待ってシャッターを切り、最新の写真をadb pullで取り込む手順だ。液晶の1画面は115,200バイトある。SPIを20MHzで頼むと実際は12MHzになったが、24MHzを頼むと24MHzで動き、1画面の転送は77ミリ秒から38ミリ秒に縮んだ。40MHzや62.5MHzを頼んでも24MHzが上限だった。画面の切り替えは360ミリ秒のワイプで、描画は約20fpsから、色を付けた版で約15fpsになった。\n【ポイント・注意点】写真で見つかった不具合が具体的だ。18時07分に気温が「--」になったのは最新の観測がまだ無かったためで、10分前と20分前もさかのぼる形に直した。「くもり」の文字がカードからはみ出す、朝の予報で最低と最高が同じ値になる、回るアイコンが「今日」に重なる、といった問題も写真で見つけて直した。作者は、43本のテストだけでは画面の配置やデータの問題を見落としたと振り返る。一方で、スマホの向きを合わせたりUSBデバッグを許可したりする作業は、人が行う必要があった。気象庁のJSONは公開された仕様ではなく、使用量の集計も請求のデータではないと注意している。","2026-11-17","Zenn","https://zenn.dev/okzaq/articles/pico2-st7789-desk-dashboard"],["40 TOPSのQCS8275を積む産業用SBC、Forlinx OK8275AA-C","CNX Softwareが、Forlinxの産業用シングルボードコンピューターOK8275AA-Cを紹介した。QualcommのDragonwing QCS8275-AAを載せたモジュールFET8275AA-Cを使い、NPUは40 INT8 TOPS、メモリーは12GBのLPDDR5、記憶装置は256GBのUFS 3.1で、−40〜+85℃で動く。展示会ではUSBカメラ4台と32本の映像を同時に解析した。価格は示されていない。","\n【概要】CNX Softwareは、Forlinxの産業用シングルボードコンピューター（SBC）「OK8275AA-C」を取り上げた。モジュール「FET8275AA-C」を土台にし、エッジAI向けに最大40 TOPSの性能をうたう。\n【背景】工場や現場で映像をAIで解析する用途では、性能に加えて、産業用の通信や広い温度範囲が求められる。記事によると、同じプロセッサーはArduino VENTUNO Qにも使われている。QCS8275には、AI性能が20 TOPSにとどまる「-AC」もあり、今回の「-AA」は最上位の構成だ。\n【詳細】SoCはQualcommのDragonwing QCS8275-AAだ。CPUは2.35GHzのCortex-A78を2つ、2.1GHzのCortex-A78を2つ、1.95GHzのCortex-A55を4つ持ち、GPUはAdreno 623だ。NPUは40 INT8 TOPS（Dense）。メモリーは12GBのLPDDR5、記憶装置は256GBのUFS 3.1で、動作温度は−40℃から+85℃とされる。SBCはGbEと2.5GbEのEthernet、絶縁したCAN-FDを4つ、絶縁したRS485を2つ備える。カメラ用のMIPI CSIは3つで、既定ではソニーのIMX577のモジュールに合わせてある。ほかにMIPI DSI、DisplayPort、microSD、USB、24Vの直流入力を持つ。ソフトは、Linuxカーネル6.18.44をもとにしたBSPが用意されるが、資料は顧客向けで公開されていない。Electronica 2026では、USBカメラ4台の映像と32本の手元の動画を同時に解析する実演が行われた。\n【ポイント・注意点】モジュールは、NVIDIAのJetson AGX Xavier／OrinやThor T4000／T5000と同じ699ピンのコネクターを使う。しかしForlinxは端子の互換をうたっておらず、記事はJetson用のキャリアボードとは「ほぼ確実に互換がない」と見ている。モジュールの電源と寸法はまだ未定だ。価格は示されておらず、比較に挙げたArduino VENTUNO Qの399ドルより「かなり高い」だろうというのは筆者の予想にとどまる。AIのフレームワークの名前も記事には出てこない。","2026-11-17","CNX Software","https://www.cnx-software.com/2026/11/17/forlinx-ok8275aa-c-a-qualcomm-qcs8275-industrial-sbc-with-12gb-lpddr5-256gb-ufs-storage/"],["受付ロボットで始めるPhysical AI、ROS 2とCRANE+ V2","Zennで、東大松尾研の「Physical AI講座2026」の最終課題として、日本語の依頼に応じてロボットアームが身ぶりで案内する受付ロボットを作った記事が公開された。アームはシミュレーター上のCRANE+ V2で、ROS 2とGazeboで動かす。依頼の分類にはCloudflare Workers AIのモデル「Clef」を使い、応答時間の中央値は0.377秒。自信が低いときは保留にする工夫で、未使用の20文すべてを正しく分類した。","\n【概要】Zennのネクスタのテックブログで、hino-okさんがROS 2、Gazebo、CRANE+ V2で受付ロボットを作った記録を公開した。ウェブのチャットに日本語で依頼すると、シミュレーター上のアームが4種類の身ぶりのどれかで応える。\n【背景】東京大学松尾研究室の「Physical AI講座2026 応用編1」の最終課題として作られた。案内先は「参加受付」と「講演会場」の2つだ。作者は、実機のアームでは試しておらず、音声入力や来客の検知もないと断っている。\n【詳細】アームは実物ではなく、CRANE+ V2のモデルをシミュレーターで動かす。PCは8コア3.3GHzのCPUと64GBのメモリーを積むWindows 11 Proで、描画はCPUのソフトウェア描画のため専用のGPUは要らなかった。WSL2上のDockerで、Ubuntu 22.04.5 LTS、ROS 2 Humble、Ignition Fortressを動かす。ウェブアプリはRuby 3.4.11とRails 8.1.4だ。依頼の分類にはCloudflare Workers AIの判定モデル「Clef」を使い、あいさつ、受付、会場、不明の4つに分ける。学習に使っていない20文での応答時間の中央値は0.377秒、最大は0.924秒で、アームが動く時間は含まない。サービスはすべて無料枠で収まったという。\n【ポイント・注意点】命令を送っても動きが終わったとは限らないため、ROS 2のアクションと関節の状態で到着を確かめる形にした。「トイレはどこですか？」が自信0.213で「会場」に分類された失敗を受け、自信が0.5未満か「不明」のときは保留の動作をするようにし、分類の指示も見直した。調整用の15文の正解は12文から15文に増え、使っていない20文もすべて正解した。ただし作者は、標本が少なく、すべての入力で正しい証明にはならないとしている。一般的なLLMとの比較もしていないため、速さで勝るとは言えないという。締め切りのため模倣学習は見送った。言葉を理解するAIと、身体を動かすロボットの制御をつなぐ入門の記録として読める。","2026-11-16","Zenn","https://zenn.dev/nexta_/articles/9a596b0268453f"],["ESP32-S3とRustでTinyMLカメラ、推論と製品の指標を設計","Zennで、ESP32-S3とカメラOV2640に、RustとTensorFlow Lite for MicrocontrollersでINT8のMobileNetV2を載せるエッジAIカメラの設計記事が公開された。ベクトル命令で処理時間を3分の1以下にし、30ミリ秒以内で判定する狙いを示す。量子化での精度低下は5%以内、実機の遅れは100ミリ秒未満を撤退の基準に置く。示された数字は目標や主張で、測定結果ではない点に注意が要る。","\n【概要】Zennの作者Esperanzaさんが、マイコンの上で画像のAI推論を行う「エッジAIカメラ」の設計を、プロダクトマネジメント（PM）の指標の管理と合わせて解説した。ESP32-S3で、Rustから推論エンジンを呼ぶ構成だ。\n【背景】カメラの映像を全部クラウドへ送らず、端末の上で異常や物体を見分けられれば、通信量と遅れを減らせる。一方でマイコンはメモリーも電力も限られ、PCでの試算と実機の結果がずれやすい。記事はこのずれを、技術者とPMが一緒に管理すべき課題として扱う。\n【詳細】ハードはESP32-S3で、記事は2コアのLX7、ベクトル命令、512KBのSRAMと8MBのPSRAMを挙げる。カメラはOV2640だ。ソフトはRust（no_stdと一部esp-idf-hal）で、TensorFlow Lite for MicrocontrollersのC++のAPIをRustのFFIで包んで呼ぶ。モデルはINT8に量子化したMobileNetV2だ。ESP-NNのベクトル命令で処理時間を3分の1以下にし、30ミリ秒以内で判定するとしている。目標は毎秒15フレーム（1フレーム66ミリ秒）で、上限はSRAMで30ミリ秒、PSRAMで120ミリ秒だ。入力は128×128から96×96に縮め、PSRAMの使用は2MB未満、電力は1.5W未満、Wi-Fi送信時の最大は2.5Wとする。GitHub Actionsで実機に書き込み、推論が100ミリ秒を超えるか基準画像の判定に通らなければ失敗とする、ハードを含めた検証の流れも提案している。\n【ポイント・注意点】記事は、量子化での精度低下が5%以内、実機の遅れが100ミリ秒未満という撤退の基準を前もって決めておくことを勧める。満たせなければ、2週間かけてラズパイのSBCに作り直す案を代わりに置いている。ただし、記事に並ぶ数字は目標、上限、主張であり、測定のデータや出典は示されていない。サンプルのコードを実際に動かしたかどうかも書かれていない。完成品の報告ではなく、設計と進め方の考え方を示す記事として読むのがよい。","2026-11-16","Zenn","https://zenn.dev/esperanza/articles/auto-20261115-092631"],["Claude Codeで設計した基板、エラーなしでグランドが消えた","Zennで、Claude CodeとKiCadで自作ICの評価基板を設計したところ、エラーが一つも出ないままガーバーからグランドプレーンが消えていた体験が公開された。ゾーンの塗りつぶしをしていなかったのが原因で、DRCも出力も成功していた。ほかにも配線の重なりや部品表の食い違いなど5つの事故を挙げる。作者は、ガーバーから銅の接続を組み立て直して照合する道具「pcb-guardrails」を作った。","\n【概要】Zennの作者Y-Watanabe11さんが、Claude CodeとKiCadで基板を設計した際に起きた事故と、その対策として作った検査の道具を紹介した。設計したのは、自作ICの評価基板で、2層の電源基板と4層のアナログ・デジタル混在基板だ。\n【背景】作者は、基板をスクリプトで生成し、ガーバーの出力などKiCadの操作もClaude Codeにコマンドラインで実行させていた。AIに任せると作業は速いが、どこかで黙って間違いが入り込むと気付きにくい。\n【詳細】最初の事故では、ゾーンが塗りつぶされておらず、ガーバーにグランドプレーンが入っていなかった。DRCは通り、出力も成功し、どこにもエラーが出なかった。保存の操作でネットの宣言が111から0に減った件もある。作者は後に、KiCad 10でネットの参照のしかたが変わったことを知ったが、元の消失がこの形式の変更か本当のデータの消失かは確かめられなかった。裏面の部品の配線が、鏡像の扱いのせいで隣の別のネットのパッドに乗った件もあり、一部の重なりはクリアランス違反として報告されなかった。部品を載せない指定が書式の違いで図面にも基板にも届かなかった件、3.3Vへ計画を変えた後も高電圧向けの部品候補が残った件も挙げている。対策として作った「pcb-guardrails」は、KiCadの接続の判定を使わず、ガーバーとドリルのファイルから銅の接続を組み立て直し、ネットリストと照合する。結果は合格、不合格、未検証の3つで返す。\n【ポイント・注意点】KiCadの公式のデモ基板20枚で試すと、ドリル径が実質0.00001mmのビアを183個持つ基板が見つかり、道具は断線として指摘した。道具自体のバグも11個見つかり、テストを付けて直した。ただし、回路図との照合はKiCadでしか使えず、インピーダンス、電流容量、沿面距離は調べない。元の設計の誤りも見つけられない。執筆の時点で基板はまだ製造中だった。AIに作業を任せるほど、成功の表示を信じず、別の経路で結果を確かめる仕組みが要ることを示す記録だ。","2026-11-16","Zenn","https://zenn.dev/y_watanabe11/articles/37c43aca1f96b8"],["Jetson Thor T5000の産業用エッジAI箱、AAEON BOXER-8741AI","CNX Softwareが、NVIDIAのJetson Thor T5000を積む産業用エッジAIボックスPC、AAEONのBOXER-8741AIを紹介した。性能は最大2070 FP4 TFLOPS（疎）、メモリーは128GBのLPDDR5Xで、人型ロボットや自律移動ロボット、多数のセンサーの認識を狙う。10GbEを2つ、5GbEを4つ備え、価格は10,219ドル。予約受付中で、出荷は2026年12月29日ごろの見込みだ。電源アダプターは別売り。","\n【概要】CNX Softwareは、AAEONの産業用エッジAIボックスPC「BOXER-8741AI」を取り上げた。NVIDIAのJetson Thor T5000モジュールを中核にし、最大2070 FP4 TFLOPS（疎）の性能と128GBのLPDDR5Xメモリーを持つ。\n【背景】人型ロボットや自律移動ロボット（AMR）では、多数のカメラやセンサーの情報をその場でAIで処理する必要がある。記事によると、この箱は視覚と言語を扱うモデル（VLM）や、視覚と言語から動作を決めるモデル（VLA）などのAIを手元で動かせる。\n【詳細】CPUは最大2.6GHzの14コアのArm Neoverse-V3AEだ。GPUは2560コアのBlackwellで、第5世代のTensorコアを96個持つ。メモリーは256ビット幅で128GBのLPDDR5X、帯域は毎秒273GBだ。映像はH.265で8K30pを4本、4K60pを10本などデコードできる。通信は10GbEを2つと5GbEを4つ備え、Wi-FiとBluetooth、4G LTE／5Gはオプションだ。記憶装置はM.2のNVMeで、128GBのSSDが標準で付く。USB 3.2 Gen 2のType-Aが4つ、RS-232／RS-485、CAN FDが2つある。電源は19〜48Vの直流で、大きさは240×164.8×105.1mm、重さは3.5kgだ。動作温度は−20℃から60℃とされる。ソフトはNVIDIA JetPack 7.1以降で、CUDAとTensorRTを使う。NVIDIA Isaac、Metropolis、Holoscanにも触れている。\n【ポイント・注意点】価格はAAEONのオンラインストアで10,219ドルで、記載の構成はBOXER-8741AI-JP710N-A1-1010だ。予約を受け付けており、出荷は2026年12月29日ごろの見込みとされる。240Wの電源アダプターとコードは別売りだ。記事は、Jetson T4000を積み64GBのメモリーで最大1200 FP4 TFLOPSの兄弟機BOXER-8742AIとも比べている。ベンチマークの結果は示されていない。個人の電子工作には大がかりな機材だが、ロボットに載せるAIの計算機がどこまで来ているかを知る目安になる。","2026-11-16","CNX Software","https://www.cnx-software.com/2026/11/16/aaeon-boxer-8741ai-industrial-edge-ai-box-pc-nvidia-jetson-thor-t5000-with-dual-10gbe-and-four-5gbe-lan/"],["モーター制御とAIを1チップで、STM32H7Pの使いどころ","dev.toで、STマイクロエレクトロニクスのマイコンSTM32H7Pを解説する記事が公開された。最大520MHzのCortex-M7に、最大85 GOPSのNPU「Neural-ART」と信号処理の回路を載せ、モーター制御とAI推論を1つのマイコンで行える。記事は、推論をまずモーターの命令に入れない「観察役」として使うよう勧める。2026年11月16日時点でサンプル出荷中、量産は2027年1月の予定だ。","\n【概要】dev.toで、Silicon LogiXのMarcoさんが、STマイクロエレクトロニクスのマイコン群「STM32H7P」の構成を解説した。モーター制御と人工知能の推論を、1つのマイコンでこなすことを狙った製品だ。\n【背景】モーターの振動や電流からAIで異常の兆しを見つける用途では、制御と推論を別々のチップに分けることが多かった。1つにまとめられれば部品を減らせるが、制御の時間を推論が乱さないかが問題になる。記事の表の数字はメーカーの主張だと断っている。\n【詳細】構成は、最大520MHzのCortex-M7、信号処理用のHSP（Hardware Signal Processor）、最大85 GOPS（0.085 TOPS）のNPU「Neural-ART」、最大2MBのフラッシュだ。20kHzの制御ループは周期が50マイクロ秒になる。振動の例では、1軸あたり毎秒6,400サンプルを取り、1,024サンプルの窓にすると1窓は0.16秒になる。FFTの周波数の刻みは6.25Hzだ。256サンプルずつずらすと40ミリ秒ごとに新しい入力ができ、重なりは75%、1秒に25回の評価になる。3軸を16ビットで1窓ぶん持つと6,144バイトで、二重のバッファーなら12KiBが要る。判断までの時間は、観測、前処理、推論、警報の規則の時間の和として考える。ツールはST Edge AIと、ベクトル制御用のX-CUBE-MCSDKが挙がる。\n【ポイント・注意点】作者は、推論を最初からモーターの命令の経路に入れず、結果を見るだけの「観察役」として動かすよう勧める。負荷をかけた状態で時間を確かめること、モデルとファームウェアの版をそろえて管理すること、結果が出ないことを「すべて正常」とみなさないことも挙げる。2026年11月16日時点で、STはOEMへのサンプル出荷を伝えており、量産は2027年1月の予定だ。同じ月に評価ボードNUCLEO-H7P5IIとSTM32H7P5I-DKも発表されている。測定したベンチマークは示されていない。","2026-11-16","dev.to","https://dev.to/pezzullo/stm32h7p-motor-control-and-artificial-intelligence-on-one-microcontroller-46fg"],["QCS6490で視覚言語モデル、9つのグラフのうち6つが動いた","dev.toで、QualcommのQCS6490を積むDragonwing RB3 Gen 2に、視覚と言語を扱うモデルInternVL3.5-2Bを載せようとした記録が公開された。モデルを9つのグラフに分けてすべてコンパイルできたが、性能を測れたのは6つ。残りはベンダー提供の資産に浮動小数点のテンソルが紛れ込み、リンクで止まった。全体の速度は「不明」と記録し、問題はベンダーに報告中だという。","\n【概要】dev.toで、Anguoさんが、QualcommのQCS6490（Dragonwing RB3 Gen 2）でInternVL3.5-2Bを動かそうとした記録を公開した。画像を見て文章で答える視覚言語モデルを、エッジの機器で動かす試みだ。\n【背景】作者はこの連載で、同じ機器にQwen3-0.6BやLlama 3.2 1Bを載せてきた。前処理の速さはそれぞれ毎秒1,555トークンと1,024トークンだった。今回はその続きとして、画像を扱えるモデルに挑んだ。\n【詳細】InternVL3.5-2Bは、InternViTの画像のエンコーダーと、Qwen3系の文章の部分からなる。作者はこれを9つのグラフに分けた。画像のエンコーダーは448×448の画像を受け取り、256個の画像のトークンを出す。文章の部分は4つに分け、それぞれに128トークンの入力用と1トークンの生成用のグラフを作った。文脈は512で、量子化はw4a16だ。9つすべてをコンパイルできたが、性能を測れたのは6つだった。2〜4番目の部分の生成用グラフは1トークンあたり約20〜22ミリ秒で、合計は128トークンの入力あたり174,113マイクロ秒、1トークンの生成あたり62,815マイクロ秒だった。数字はAI Hubのグラフごとの推定の時間で、端から端までの実行ではない。\n【ポイント・注意点】1番目の部分と画像のエンコーダーは組み立てに失敗した。リンカーは、あるテンソルが対象の機器で使えない浮動小数点の型だと報告した。作者は、ベンダーが用意した事前コンパイルの資産に原因があると見ている。最適化の段階を変えても結果は同じだった。そのため、モデル全体の毎秒のトークン数は出せず「不明」と記録した。ほかにも、テンプレートがtransformers 5.7.0を要求する、aimet-onnx 2.37.0にaarch64用の配布物がない、9.39GBのダウンロードが途中で止まり再開で取り直した、といった手間があった。作者は、この機器でのこのモデルの初めての公開記録だとし、問題をベンダーに報告している。","2026-11-16","dev.to","https://dev.to/anguoyang/six-graphs-out-of-nine-internvl35-2b-on-qcs6490-and-the-fp32-tensor-hiding-in-the-vendors-own-3oib"],["自宅のラズパイ5でAIエージェント、毎朝Xの情報を要約","Zennで、自宅のRaspberry Pi 5で常時動くAIエージェント「Hermes Agent」に、Xの情報収集を任せている体験が公開された。TwitterAPI.ioをMCPサーバーとしてつなぎ、毎朝6時に過去24時間のSpaceX関連の投稿を検索して要約し、Telegramへ送る。URLを渡せば全文を取り込み、NotebookLMとObsidianに保存する。記事はTwitterAPI.ioの報酬プログラムの一環として書かれている。","\n【概要】Zennの作者なかじさんが、自宅のRaspberry Pi 5で動かしているAIエージェントに、X（旧Twitter）の情報収集を任せている仕組みを紹介した。エージェントは「Hermes Agent」で、TwitterAPI.ioをMCPサーバーとしてつないでいる。\n【背景】個人がXの情報を集めるには、公式のAPIを使うか、ページを読み取るスクレイピングに頼る方法がある。作者は、公式のAPIは個人には料金や手続きが重く、スクレイピングは不安定だとし、その中間の現実的な選択肢としてこの構成を位置づけている。\n【詳細】Raspberry Pi 5の上でHermes Agentが常に動いている。毎朝6時に予定の処理が始まり、過去24時間のSpaceX関連の投稿をXで検索して要約し、その結果をTelegramに送る。作者がXの投稿のURLを渡すと、エージェントは全文を取得し、NotebookLMに登録したうえで、MarkdownとしてObsidianにも保存する。TwitterAPI.ioは使った分だけ課金されるクレジット制で、作者の環境では保存の処理1回に100クレジットを使った。クレジットが尽きると、知らせのメールが届いたという。\n【ポイント・注意点】苦労したのは、「過去24時間」や特定のテーマといった検索の条件を、要約の処理と組み合わせて正しく動かすことだった。何度かプロンプトを書き直す必要があり、作者はAPIの問題ではなく、エージェントへの指示のしかたの問題だったと見ている。その後は、毎朝の処理が安定して動いている。使っているAIのモデル名は書かれておらず、公式のAPIの料金も示されていない。記事は、TwitterAPI.ioのCommunity Rewardsプログラムの一環として書かれ、APIのクレジットを受け取っていると明かしている。紹介リンクも含まれ、作者に利益が生じうる。手のひらサイズのラズパイを、常時動くAIの助手の置き場所として使う一例として参考になる。","2026-11-15","Zenn","https://zenn.dev/minaka/articles/ed9113cd3f4588"],["AIエージェントでエアコン操作、赤外線リモコンと役割分担","Zennで、DiscordからAIエージェントOpenClawに頼んで、ネットにつながらないエアコンとAVアンプを赤外線リモコン経由で操作した体験が公開された。Tuyaの1,480円の赤外線機器とクラウドAPIを使う。最初の「エアコンいれて」は送るまで1分50秒かかったが、のちに15〜20秒へ。家族用のボタン画面では2秒で動いた。AIに任せる部分と、プログラムで決める部分の分け方を考察している。","\n【概要】Zennの作者PicoLabさんが、AIエージェントに家電を操作させた経験から、AIとプログラムの役割分担を考えた記事を公開した。Discordから頼むと、居間のエアコンとAVアンプを赤外線で操作する。\n【背景】エアコンもAVアンプもネットにつながらない。そこで作者は、Tuyaの赤外線リモコン機器とTuyaのクラウドAPIを使うことにした。比べた機器は、AuBee BEAMが1,480円、Nature Remo nanoが4,980円、Tapo H110が4,398円、SwitchBotハブミニ（Matter対応）が5,800円で、2026年11月2日時点のAmazonの価格だ。作者はBEAMを選んだ。\n【詳細】家のミニPCで、エージェントのOpenClawを動かし、モデルはDeepSeek V4.1 Flashを使う。エージェントはDockerの中で動く。Tuyaの開発者向けの無料の試用枠は、月26,000回のAPI呼び出しと最大10台までだ。最初の「エアコンいれて」は、受け取ってから送るまで1分50秒かかり、ファイルを書くまでにモデルを5回呼んでいた。後の依頼は15秒と20秒だった。作者は決まった操作をまとめた手順と予約の仕組み、家族向けにボタンを並べたウェブのリモコンも作り、ボタンを押すと2秒後に最初の操作が送られた。学習させた風向きの信号は116個の時間の並びで、全体は65.4ミリ秒、38kHzで変調されている。\n【ポイント・注意点】モードを指定しないときの既定は冷房26℃で、11月には合わなかった。エージェントは暖房22℃を選んだが、作者はそれをエージェントの判断と位置づけている。エージェントが書いたファイルの確認が失敗したのは、サーバーが先に読み取っていたためで、書いてから3秒は触らないようにして直した。公開データベースの富士通の信号は作者の機種で動かず、Tuyaにある富士通ゼネラルの22種類の設定を1つずつ試して当たりを見つけた。Tuyaの試用には期限がある。作者は、機器の鍵をクラウドに預けきらず、家のサーバーに置いている。","2026-11-15","Zenn","https://zenn.dev/petittomato/articles/openclaw-aircon-routines"],["USB機器の解析を記録して自動化、AI向けのMCPも同梱","Hackadayが、独自仕様のUSB機器を解析するツール「usb-rea」を紹介した。メーカーのアプリで操作しながらUSBの通信を記録し、操作ごとに印を付けると、報告書、Pythonのドライバーのひな形、Wiresharkの解析器を出力する。AIの道具に作業を渡すためのMCPのファイルも用意されている。ただし記録中はメーカーのドライバーが動いている必要があり、万能ではないと記事は注意する。","\n【概要】Hackadayは、Emir Mrkaljevićさんが作った「usb-rea」を取り上げた。独自仕様のUSB機器を解析するための道具で、AIのツールに作業を引き継ぐためのMCPのファイルも付いている。\n【背景】パソコンの周辺機器には、メーカーの専用アプリでしか設定できないものが多い。メーカーが対応をやめると、その機器は使えなくなるおそれがある。記事は、メーカーが見放す前に通信の仕組みを記録しておけば、生き延びる見込みが高まるとしている。\n【詳細】使い方は、まずLinuxでusbmonを読み込み、usb-reaで記録を始める。続いて、たとえば「明るさ0%」のような印を付けてから、メーカーのアプリで同じ設定を操作する。1つの設定につき3つ以上の値で印と操作をくり返し、記録を止める。すると、通信を操作の時刻と結び付けて整理し、Markdownの報告書、Pythonのドライバーのひな形、Wiresharkで通信を読み解くLuaの解析器を出力する。lookupの命令では、機器のVIDとPIDがすでにデータに載っているかを調べられる。記事によると、載っている機器の多くはCPUクーラーやRGBの制御器など、光りものの周辺機器だという。記事の筆者のマウスは載っていなかった。\n【ポイント・注意点】記事は、この道具は「万能薬ではない」と注意している。記録している間は、メーカーのドライバーが動いている必要があるからだ。つまり、すでにメーカーのアプリが動かなくなった機器には使いにくく、動くうちに記録しておくことが前提になる。AIのモデルの名前は記事には出てこず、MCPのファイルで何ができるかの詳しい説明もない。コメント欄では、Wireshark自身のUSBの記録機能や、RP2040を使ったUSBの盗聴器なども話題に上がったが、これらは読者の意見だ。電子工作の視点では、手元の古いUSB機器を自分のプログラムで動かしたいときに、通信の記録と整理をAIの助けも借りて進められる点が面白い。手作業で通信を読み解く手間を減らす道具として注目したい。","2026-11-15","Hackaday","https://hackaday.com/2026/11/15/reverse-engineer-that-usb-device-in-style/"],["AIがコードを書くから回路を学ぶ、Pico 2 Wで水やり装置","dev.toで、AIがコードを書いてくれる時代だからこそハードウェアを学び始めたという開発者の体験談が公開された。Raspberry Pi Pico 2 Wとスターターキットで植物の水やり装置を作り、MicroPythonのコードの大半と回路図はClaudeに任せ、配線、電源、デバッグは自分で担当した。ポンプはPicoが供給できるより多くの電流を使うため、別の電池とグラウンドの共有が要ったという。","\n【概要】dev.toで、Ricards Taujenisさんが「AIがコードを書くから、私はハードウェアを学んでいる」と題した体験談を公開した。Raspberry Pi Pico 2 Wで、植物に水をやる装置を作った。\n【背景】ソフトウェアの開発ではAIがコードを書く場面が増えている。作者はその流れを受けて、自分の手で扱うハードウェアの学びに力を入れ始めた。テキサス大学オースティン校がedXで開く講座「Embedded Systems – Shape The World: Multi-Threaded Interfacing」も受けているという。\n【詳細】使ったのは、Pico 2 Wと、約41個の部品が入ったSunFounderのPico 2 Wスターターキットだ。PicoはMicroPythonで動かす。モーターの駆動にはTA6586のドライバーICを使い、コップの水に入れた小さなポンプからチューブで鉢へ水を送る。ポンプはLiPo電池と充電器で別に給電し、状態を示すLEDも付けた。キットの直流モーターをポンプに置き換え、マイクロスイッチとモーターの2つの課を組み合わせて作った。MicroPythonのコードの大半はClaudeが書き、回路を図にする作業もClaudeが行った。作者は配線、電源、デバッグを受け持った。\n【ポイント・注意点】学びとして、ポンプはPicoが供給できるより多くの電流を使うため、専用の電池で動かし、グラウンドを共有する必要があったと書いている。不具合の多くは配線の問題で、水は電子部品から離すことも大事だという。次は、はんだ付け、走るロボット、PWMによる速さの制御、Wi-Fiでの状態の通知に挑む予定だ。ポンプの電流、電池の容量、価格などの数字は記事にない。どの版のClaudeを使ったか、どんな指示を出したかといった細かな手順も書かれていないため、再現したい人はキットの課を手がかりに進めることになる。AIにコードを任せつつ、配線や電源といった物理の部分は人が学ぶ、という役割分担の実例として、これから電子工作を始める入門者に参考になる。","2026-11-15","dev.to","https://dev.to/mozes721/ai-writes-my-code-so-im-learning-hardware-1d1i"],["M5 Cardputerのオカルト系ファーム「DIVINER」、LLM画面も","Hackadayが、M5 Cardputer向けのファームウェア「DIVINER」を紹介した。I2Sの音声出力を使うシンセサイザーとシーケンサー、映像の演出、Wi-FiとBluetoothの走査、LLMとやり取りする画面、赤外線の送信などを1つにまとめ、ディアブロ風の血と残り火の見た目で仕上げている。機器が届く前に試せるシミュレーターもある。LLMのモデル名などの詳細は記事に書かれていない。","\n【概要】Hackadayは、M5 Cardputer用のファームウェア「DIVINER」を取り上げた。シンセサイザーやスキャナー、LLMとのやり取りの画面などを、オカルト風の見た目でまとめた作品だ。\n【背景】M5 Cardputerは、M5Stackの小さな端末で、記事は「実質的にはESP32-S3の小さな開発キット」だと説明する。小さな画面、キーボード、GPIO、I2C、音声の端子を備えるため、さまざまなファームウェアが作られている。\n【詳細】DIVINERは、Cardputerの音声出力（I2S）を使う単体のシンセサイザーとシーケンサー、映像の演出の仕組み、Wi-FiとBluetoothの走査と監視、LLMとやり取りする画面、赤外線の送信機などを1つにまとめている。協力者のvoidrane Splicerさんは、Wi-Fiの電波の状態の情報（CSI）を使って人の気配を見つける試みも進めている。バイトビートの再生機能もある。アプリは「儀式（rites）」と呼ばれ、見た目は「血と残り火」の、ディアブロを思わせる作りだという。Hackaday.ioの計画のページは、アプリより先に土台となるシステムの層を説明している。記事の筆者のElliot Williamsさんは、アプリはそのシステムを試し、見た目を披露するために足されたもののようだと書く。音声の仕組みを見せる動画もある。GitHubにはシミュレーターがあり、機器が届く前に試せる。\n【ポイント・注意点】記事はLLMの画面について「LLMとのやり取りの画面がある」と書くだけで、使うモデルや仕組み、版は書いていない。性能や価格、メモリーなどの数字もない。筆者は、アプリ同士が見た目以上にまとまっているかは分からないと率直に書いている。読者のコメントでは画面の作りが好評で、音声の機能の説明を求める声もあった。手のひらの小さなESP32端末に、音、電波、AIとの対話を詰め込む遊び心のある例として、M5Stackの愛好者には目を引く作品だ。","2026-11-14","Hackaday","https://hackaday.com/2026/11/14/diviner-occult-synth-firmware-for-the-cardputer/"],["介護見守りロボと6本脚ロボ、実機でしか起きない8つの壁","Zennで、福岡県香春町の開発者が、日本語で話す介護見守りロボット「零号機」と、日本語の声に応じてPythonを書き脚を動かす6本脚ロボット「アラクネ」で出会った、実機ならではの8つの問題をまとめた。脈拍の誤計測、テレビの音の誤認、ラズパイの82.7℃の発熱、病院で5GHzにつながらないESP32など、机上のシミュレーションでは出ない壁と、それぞれの対策が具体的な数字とともに並ぶ。","\n【概要】Zennの開発者xzero_001さんが、福岡県香春町で作った2台のロボットで出会った「実機でしか起きなかった8つの壁」をまとめた。電源、センサー、熱、電波の問題と、その対策の記録だ。\n【背景】1台目の「零号機」は、猿のぬいぐるみの人形と木箱で作った介護見守りロボットで、日本語で話し、血圧と体温を測る。2台目の「アラクネ」は6本脚のロボットで、日本語の声に応じて脚を動かすPythonを書く。どちらも、ESP32（またはサーボ基板）、Raspberry Pi、Windowsのノートパソコンを組み合わせている。\n【詳細】指で押さえて測る脈拍のセンサーMAX30102は、押さえている間に126〜141を示し、認証済みの機器の約68と食い違った。対策は認証済みの機器に切り替えることだった。声の照合では、利用者の点数の中央値0.568に対しテレビは0.454だったが、テレビの音が0.5005で通ってしまう例があった。マイクアレイは10日間で32,174の音を拾い、方向で捨てたのは20だけで、1回の発話の中で角度が74度跳んだ。指向性のマイクでは捨てる回数が毎分0.7回で、アレイの7.9回より少なく、これに替えた。録音の18件中10件がちょうど6.0秒で切れていたため、10秒に延ばした。ラズパイは82.7℃に達し、カメラが5分で13回開き直した。病院でLEDだけが動かなかったのは、テザリングが5GHzでESP32が2.4GHzしか使えないためで、ラズパイをチャンネル6のアクセスポイントにして解決した。\n【ポイント・注意点】USBの機器が抜けるような不具合は、電源付きのUSBハブで直した。HDMIを既定に戻して音の出力も回復させた。サーボ基板がなくても会話は止まらないようにした。82.7℃の熱の対策は、カメラを止めずに処理を減らす方向で「まだ途中」だという。作者は、これらは机上のシミュレーションでは現れず、アルゴリズムより先に信号、電源、電波を確かめるべきだと述べる。ロボットは受注生産で、予約を受け付けている。","2026-11-14","Zenn","https://zenn.dev/xzero_001/articles/7be301556fe080"]],"muse":[["Claude Code v2.1.329、信頼ダイアログがフックの所在を警告","クラスメソッドのDevelopersIOが、2026年11月19日公開のClaude Code v2.1.329の主な変更をまとめた。変更は130件で、修正89件、改善18件などを含む。信頼していないフォルダを開いたとき、フックを宣言しているファイルを信頼ダイアログが警告するようになった。実験的なCode ModeではPreToolUseフックが失敗してもツール呼び出しを拒否しなくなったため、止めたい場合はonFailureの指定が必要になる。","\n【概要】DevelopersIOが、Claude Code v2.1.329の主要アップデートを解説した。v2.1.329は2026年11月19日に公開され、変更は130件にのぼる。内訳は修正89件、改善18件、セキュリティ6件、性能6件、破壊的変更または既定動作の変更6件、新機能5件。領域別ではCode ModeとVS Code拡張が各17件、MCPが15件、セルフホストランナーが8件だった。【背景】前日のv2.1.328に続くリリースで、フックや権限まわりの変更が続いている。記事の筆者はmacOS上のv2.1.329で、フックの信頼表示を実際に試している。【詳細】信頼していないフォルダを開くと、信頼ダイアログがフックを宣言しているファイルを警告する。筆者の検証では.claude/settings.jsonと.claude/settings.local.jsonが対象になった。VS Code拡張には、再読み込みせずに確認をやり直す「Review trust」が加わった。Code Modeでは、PreToolUseフックが起動しない、強制終了される、時間切れになるといった失敗でも、スクリプトからのツール呼び出しを拒否しなくなり、通常のセッションと同じ動きになった。失敗時に止めたい場合は、コマンド、HTTP、MCPツールのフックに\"onFailure\": \"block\"を設定する。/tasksはスケジュール済みタスク、/loopの起動予定、ゴール、会話の分岐を一覧し、xキーで確認のうえ止められる。ネットワーク切断やファイルロックで~/.claude.jsonが既定値に戻る不具合も直った。【ポイント・注意点】max_tokensエラー時の自動再試行（2.1.326で追加）は削除された。出力上限が小さいゲートウェイの利用者はCLAUDE_CODE_MAX_OUTPUT_TOKENSの設定が必要になる。以前のバージョンで保存したスケジュール済みタスクは、多くの場合、サインインした新しいセッションで設定し直す必要がある。ただし--resumeで再開したセッションでは動く。一部のチームメイト画面は/bin/shで起動するため、シェルの起動ファイルが読まれない場合がある。","2026-11-20","DevelopersIO（クラスメソッド）","https://dev.classmethod.jp/articles/20261120-cc-updates-v2-1-329/"],["スマホからClaude CodeとCodexを動かす、公式の方法と自作アプリ","スマホからPC上のClaude CodeとCodexを操作する方法を、公式の選択肢と筆者が自作したアプリに分けて紹介する記事。Claude Codeは/remote-controlでセッションをスマホに引き継げる。CodexはChatGPTのモバイルアプリとデスクトップアプリをQRコードで組にする。複数のエージェントを1台のMacで動かす筆者は、各社の公式手段が自社のエージェントしか扱えないため、オープンソースのTaroBirdを作った。","\n【概要】PCで動かしているClaude CodeやCodexを、スマホから操作する方法をまとめた記事。前半で公式の方法を、後半で筆者が作ったオープンソースのアプリTaroBirdを紹介する。筆者は自作アプリの作者であることを明記したうえで、多くの場合は公式の方法で足りると述べている。【背景】筆者は1台のMacでCodex、Claude Code、Gemini、Kimi Code、DeepSeek Harnessを動かし、2台目の機械を使うこともある。公式の方法はそれぞれ自社のエージェントしか扱えず、エージェント同士で作業を受け渡すこともできない。これが自作の動機になった。【詳細】Claude Codeでは、動いているセッションで/remote-control（または/rc）と打つか、claude --remote-controlで起動する。セッションはPCで動き続け、claude.ai/codeやClaudeのモバイルアプリから続きを操作できる。スマホは同じアカウントと組織で使う必要があり、APIキーや他社のプロバイダーでは使えない。権限の確認や質問の通知は/configで有効にできる。CodexはChatGPTのデスクトップアプリ（MacまたはWindows）とスマホをQRコードで組にし、作業の開始、承認、確認をスマホから行う。TaroBirdはAGPL-3.0のセルフホスト型チャットアプリで、各エージェントを利用者自身のPC上の公式CLIとして動かす。デスクトップとスマホで会話を共有し、エージェント同士がメッセージを送り合える。デスクトップでは最大12の会話を並べて表示できる。外からの接続にはTailscaleか、暗号化された通信だけを中継する小さなVPSを使う。【ポイント・注意点】どの方法でも、PCは起動したままネットにつながっている必要がある。TaroBirdのWindows版インストーラーはコード署名がなく、SmartScreenが警告を出す。Linuxのデスクトップ版はない。TaroBird自体はモデルを含まないため、各CLIを別に入れてサインインしておく必要がある。各社の利用規約が変わる可能性もある。","2026-11-20","DEV Community","https://dev.to/cloveric/running-claude-code-and-codex-from-your-phone-the-official-options-and-the-self-hosted-app-i-built-38p4"],["夜間にタスクの列からコーディングエージェントを回す方法","claude -pやcodex execを夜間に繰り返し起動し、タスクの列から1件ずつ作業させる手順を解説した記事。両ツールには手元の機械で使える夜間用の列が組み込まれていないため、スクリプトやcronで起動し、エージェントが読める列を用意する。記事は権限の指定、費用の上限、ブランチでの作業など、無人で回すときの安全策を、具体的なフラグや見本のスクリプトとともに示している。","\n【概要】taskhold.comのガイドを転載した記事で、Claude CodeとCodexを夜間に無人で回す手順を示す。要点は、claude -pとcodex execがプロンプトを受け取って作業し、終われば終了する点にある。そのためスクリプトやcronから繰り返し起動し、エージェントが読める列を用意すればよい。記事はTaskholdをその列として紹介しており、Taskholdがエージェントを起動するわけではない。【背景】記事によると、両ツールには手元の機械で使える夜間用の列は組み込まれていない。Claude Codeの/loopのタスクはClaude Codeが起動して待機している間しか動かず、繰り返しのものは7日で期限が切れる。クラウドのroutineは新しく複製したリポジトリで動くため、手元のファイルは見えない。【詳細】claude -pでは、--allowedToolsで確認なしに動かすツールを並べ、--permission-modeでacceptEditsやautoなどの基本の動きを決める。v2.1.302からは、モードを指定しない-pの実行は承認が必要な呼び出しを拒否する。--permission-prompts noneで確認が出る操作を待たずに拒否し、--max-budget-usdで1回あたりの費用に上限をかける。--bareはMCPサーバーやCLAUDE.mdを読まないため使わない。codex execは既定で読み取り専用のサンドボックスで動き、編集させるには--sandbox workspace-writeを指定する。見本のovernight.shは、claude -pを最大5回起動する。各回で列から1件を取り、ブランチで作業し、完了させるか質問を1つ残して止める。エージェントがQUEUE_EMPTYと返せばループを抜ける。Macではcaffeinate -iでスリープを防ぐ。【ポイント・注意点】ブランチかworktreeで作業させ、push、マージ、デプロイはさせない。必要なコマンドだけを許可し、費用と回数に上限をかけ、小さく明確なタスクを列に入れる。記事はTaskholdの宣伝を兼ねており、Taskholdは月12ドルまたは年120ドルで、無料プランはない。","2026-11-20","DEV Community","https://dev.to/greatworkco/run-coding-agents-overnight-from-a-task-queue-j8d"],["Claude CodeにGUIはあるか、公式アプリとオープンソースの選択肢","ターミナル以外でClaude Codeを使う方法を整理した記事。Anthropic公式では、Claude DesktopのCodeタブ、VS Code拡張、JetBrainsプラグイン、claude.ai/codeがある。オープンソースでは、opcode、CloudCLI、Nimbalystを紹介している。CloudCLIは同じネットワーク内のスマホのブラウザからも使える。筆者は自作のCaprockも紹介しており、その宣伝を兼ねた内容になっている。","\n【概要】Claude CodeのGUIを探す人向けに、公式の画面とオープンソースのアプリを一覧した記事。答えは「ある」で、用途に応じた選択肢を並べている。筆者は複数のエージェントをまとめて扱うアプリCaprockの開発者で、記事はcaprock.devからの転載。【背景】Claude Codeはターミナルで使うのが基本だが、画面で操作したい人や、スマホから様子を見たい人も多い。記事は各プロジェクトのページを2026年10月20日に読んだとしている。【詳細】公式では、Claude DesktopのCodeタブがmacOSとWindowsに対応し、Linuxはベータ版がある。LinuxのベータはUbuntu 22.04以降かDebian 12以降が対象で、FedoraやArchではCLIを使うよう案内されている。Claude CodeはPro、Max、Ultra、Team、Enterpriseのプランで使え、Freeでは使えない。VS Code拡張、JetBrainsプラグイン、claude.ai/codeもある。claude.ai/codeはGitHubのリポジトリに対するクラウドのセッションで、ノートPCを閉じても動き続ける。公式の画面はClaude Codeしか動かせない。オープンソースでは、Tauri 2で作られたデスクトップアプリのopcode（旧Claudia）がある。CloudCLIはClaude Code、Cursor CLI、Codex、OpenCodeを扱うWeb画面で、npx @cloudcli-ai/cloudcliで起動し、同じネットワーク内のスマホのブラウザからも使える。NimbalystはClaude CodeとCodexを並べて動かせ、個人は無料で、iOS用の連携アプリもある。Caprockは複数のエージェントをターミナルのタブで動かし、QRコードとエンドツーエンド暗号化の中継でスマホと組にできる。【ポイント・注意点】opcodeの最新リリースは2025年8月31日のv0.2.0で、Windowsではソースからのビルドが必要。Crystalは2026年2月に非推奨となり、Vibe Kanbanの会社は2026年4月10日に事業を終えたという。記事はCaprockの宣伝を兼ねており、推奨もCaprock寄りである点に注意したい。","2026-11-20","DEV Community","https://dev.to/dspv/is-there-a-gui-for-claude-code-the-official-apps-and-the-open-source-ones-220i"],["Claude Codeの変更を元に戻す、/rewindとチェックポイントとGit","Claude Codeが頼んだ以上の変更をしたとき、どう元に戻すかを、コードを書かない人向けに説明した記事。Escで止め、/rewindで以前のメッセージに戻り、コードと会話のどちらを戻すかを選ぶ。チェックポイントはコマンドで変わったファイルやClaude Code外の編集を戻せず、約30日で消える。長く残る履歴にはGitを使い、大きな依頼の前に保存する習慣を勧めている。","\n【概要】solidvibes.devの記事を転載したもので、コードを書かない人向けにClaude Codeの変更の戻し方を説明する。前提は、Claude Codeが頼んだ以上の変更をすることがあり、その場合は元に戻せるという点にある。記事はAIの助けを借りて書かれたと明記している。【背景】Claude Codeはファイルを直接書き換えるため、意図しない変更が入ることがある。特にコードを書かない人は、何が変わったかを自分で見分けにくい。記事はClaude Code公式のチェックポイントの説明を引用しながら、直前の間違いをすぐ戻す方法と、長く残る履歴から戻す方法を分けて説明する。Escで止める操作から、Gitでの保存の習慣まで、順を追って紹介している。【詳細】手順は3つ。まずClaudeが違う方向へ進んでいたらEscで止める。それまでの作業は失われない。次に/rewindを実行する。入力欄が空のときにEscを2回押すか、/undoでも同じ。入力欄に文字があると、最初の2回押しは文字を消すだけで、上キーで文字を取り戻せる。最後に以前のメッセージを選び、何を戻すかを決める。「コードと会話を戻す」はファイルも会話も戻り、元のメッセージが入力欄に戻るので、言い直してやり直せる。「コードを戻す」はファイルだけ、「会話を戻す」は会話だけを戻す。コードの選択肢が出ないときは、その時点以降にファイルが変わっていない。【ポイント・注意点】/rewindには限界がある。インストールやファイル移動など、コマンドだけで変わったファイルは戻らない。Claude Codeの外での編集や、別のClaude Codeの画面での編集も追跡されない。サブエージェントが新しく作ったファイルは多くの場合戻らず、チェックポイントは最後に保存されてから約30日で消える。公開したサイト、送ったメール、変えたデータベースなど、フォルダの外の変化も戻せない。昨日の問題や古いセッションの問題にはGitを使う。大きな依頼の前と、うまく動いた段階ごとにGitで保存する習慣を勧めている。","2026-11-20","DEV Community","https://dev.to/boris_stojanov_7fda5f6d91/how-to-undo-a-change-in-claude-code-rewind-checkpoints-and-git-5gom"],["Claude Codeのmodとは何か、フックとの違いと最初の作り方","Claude Codeの「mod」を、公式文書と2026年10月1日の公式ブログに照らして解説した記事。modはセッションの中で動くJavaScriptやTypeScriptのモジュールを持つプラグインで、イベントの観察、書き換え、画面の描画ができる。外部スクリプトを動かす設定フックとは違い、一度読み込まれて状態を持つ。筆者は残りの週間使用量を棒グラフで出すmodを例に、作り方と注意点を示している。","\n【概要】日本で会社を経営する筆者が、Claude Codeの「mod」を解説した記事。公式文書と2026年10月1日の公式ブログで内容を確かめている。modは、Claude Codeのセッションの中で動くJavaScriptやTypeScriptのモジュールを持つプラグインで、イベントを観察し、書き換え、画面に描画できる。【背景】設定ファイルのフックは外部のスクリプトを動かすだけで、画面に何かを描くことはできない。modは一度読み込まれると状態を保ち続ける。ターミナルではv2.1.287以降、DesktopのCodeタブではv2.1.286以降が必要。claude -pやAgent SDKではフックは動くが描画はされない。modは既定で有効で、.jsや.tsのファイルをそのまま読むためビルドは要らない。【詳細】フックの書き方はon(event, matcher?, ($, e, next) => ...)の形で、観察、書き換え、応答の3つの操作ができる。イベントにはtool.call、prompt.submit、ui.renderなどがある。小さなmodは、.claude-plugin/plugin.json、hooks/hooks.json、フックのモジュールの3ファイルでできる。筆者の例「週間使用量メーター」は、入力欄の上に20マスの棒を表示する。$.session.usage()で7日間の使用量を読み、残り25%で黄色、10%で赤に変わる。試すにはclaude --plugin-dir ./my-modで起動し、claude plugin validateで検査し、/reload-pluginsで読み直す。配布にはmarketplace.jsonを使う。【ポイント・注意点】modはサンドボックスで隔離されず、Claude Code自身と同じ権限で動く。秘密の情報を読み、プロンプトを見て、ツール呼び出しを承認することもできる。筆者によると、管理された設定やTeam/Enterpriseのログインがない場合、拒否ルールやPreToolUseフックが止めた呼び出しをmodが承認できてしまう。無効にするにはclaude --safe-modeか\"disableAllHooks\": trueを使う。入れる前にmodのコードを読むよう勧めている。","2026-11-20","DEV Community","https://dev.to/hisashispace/claude-code-mods-explained-what-a-mod-is-how-it-differs-from-hooks-and-how-to-create-your-first-5gf6"],["PreToolUseフックが落ちても痕跡なし、止めれば出力が筒抜けに","Claude CodeのPreToolUseフックが例外で落ちたとき、何がモデルに届くかを実験した記事。既定ではコマンドがそのまま実行され、モデルはフックの失敗を知らない。onFailureをblockにするとコマンドは止まるが、スタックトレースなどの標準エラー出力がそのままモデルの文脈に入る。筆者は失敗の経路も試し、フックの本体を例外処理で包んで意図した終了コードを返すよう勧めている。","\n【概要】Claude CodeのPreToolUseフックが落ちたとき、モデルの文脈に何が届くかを確かめた実験の記事。筆者は前回、終了コード2以外ではツール呼び出しが進むことを報告しており、その続編にあたる。結論は、既定では痕跡が残らず、止める設定にすると逆に情報が多く入りすぎる、というもの。【背景】フックはコマンドの実行前に安全を確かめるために使われる。しかしフック自体が例外で落ちたときの動きは見落とされやすい。前回の記事では、失敗はhook_non_blocking_errorとして記録されるが、最終的なメッセージには出ないことが分かっていた。【詳細】筆者は使い捨ての.claude/settings.jsonで、Bashを対象にpython3 crash_hook.pyを動かすPreToolUseフックを登録した。スクリプトはログを書き、標準エラーに目印を出してから例外を投げる。claude -pを--output-format stream-jsonと--verboseで実際に動かし、ログファイルでフックの実行を確かめた。設定なしでは、記録の中にexit_code 1とエラー、トレースバックが残った。しかしモデルが受け取ったecho hello456の結果は「hello456」だけで、エラー扱いでもなかった。モデルはフックの失敗に触れず、尋ねても報告することがなかった。\"onFailure\": \"block\"を加えると、コマンドは実行されなかった。ツールの結果はエラー扱いになり、「onFailure is \"block\"」による停止の文とトレースバックが入った。モデルは落ちた原因を正しく説明した。【ポイント・注意点】設定なしではフックは開いたまま失敗し、コマンドが走り、モデルも気づかない。blockにすると閉じて失敗するが、スタックトレースやパスなど、機密を含みうる出力が文脈に入る。筆者は、通る場合と止める場合だけでなく落ちる場合も試すこと、本体を例外処理で包み0か2で意図して終わらせることを勧める。1台の機械での1回の実験で、Claude Codeのバージョンは書かれていない。","2026-11-20","DEV Community","https://dev.to/enjoy_kumawat/a-crashed-pretooluse-hook-leaves-no-trace-in-the-models-context-telling-it-to-block-leaves-too-3l8a"],["Anthropic互換ゲートウェイでClaude Code、鍵と設定の優先順位","Anthropic互換のゲートウェイ経由でClaude Codeを使うときの設定をまとめた記事。ANTHROPIC_BASE_URLとトークンの指定、apiKeyHelperで鍵を設定ファイルに書かない方法、設定の優先順位、5つのモデル枠、文脈の大きさと自動圧縮の調整を解説する。claude.aiのログインを使わないため、コネクタ、/schedule、Remote Controlは使えない点にも触れている。","\n【概要】Claude CodeをAnthropic互換のゲートウェイにつなぐ設定の解説。筆者はUberLLMを運営しており、例も同社のAPIを使うが、互換のプロバイダーなら同じように動くとしている。Claude CodeはAnthropicのMessages APIで通信するため、それを話す接続先なら使える。【背景】複数のモデルを扱うゲートウェイを使うと、鍵の置き場所や、どの設定が勝つかで迷いやすい。記事は鍵、設定の優先順位、モデル、文脈の大きさの4点を順に説明する。【詳細】試すだけならANTHROPIC_BASE_URLとANTHROPIC_AUTH_TOKENを環境変数で設定してclaudeを起動する。Anthropic形式の接続先には/v1を付けない。鍵を設定ファイルに書かないには、鍵をファイルに保存し、apiKeyHelperでそのファイルを読ませる。結果は5分間キャッシュされ、CLAUDE_CODE_API_KEY_HELPER_TTL_MSで変えられる。設定は、管理された設定、--settings、プロジェクトのsettings.local.json、settings.json、ユーザーのsettings.jsonの順に優先される。鍵はANTHROPIC_AUTH_TOKEN、ANTHROPIC_API_KEY、apiKeyHelperの順に使われる。モデルは/model、--model、ANTHROPIC_MODEL、modelの設定の順。モデルの枠は5つあり、設定しない枠はClaudeのモデルを要求するため、Claudeの価格で課金される。Claude以外のモデルでは文脈を200,000トークンとみなすので、CLAUDE_CODE_MAX_CONTEXT_TOKENSなどで実際の大きさに合わせる。【ポイント・注意点】claude.aiのログインを使わないため、コネクタ、/schedule、Remote Controlは使えない。画面の費用表示はAnthropicの定価で手元で計算したもので、請求額ではない。セッションが読むものはすべてモデルの提供者に送られるため、秘密や顧客のデータを含むリポジトリでは使わないよう勧めている。/statusで接続先を確かめられる。","2026-11-20","DEV Community","https://dev.to/alex_uberllm/claude-code-on-an-anthropic-compatible-gateway-where-the-key-goes-which-setting-wins-and-when-it-3gk7"],["Claude Codeのサンドボックス、6つの方式と選び方","Claude Codeの「サンドボックス」を、公式のサンドボックス環境のページをもとに6つの方式に分けて整理した記事。Bashだけを隔離する方式、Claude Codeの処理全体を包むランタイム、開発コンテナ、独自のコンテナ、仮想マシン、Anthropicが管理するクラウドのセッションがある。違いは境界の内側に何が入るかで、無人で動かすならコンテナや仮想マシンを使うよう勧めている。","\n【概要】「Claude Codeのサンドボックス」はひとつの機能ではなく、隔離の方式の集まりだと説明する記事。公式のサンドボックス環境のページをもとに、6つの方式とそれぞれの準備の手間、選び方をまとめている。記事はAIの助けを借りて書かれたと明記している。【背景】エージェントにコマンドを任せるほど、間違いや攻撃の影響を小さくする仕組みが要る。ただし記事は、サンドボックスは被害を小さくするが危険をなくすわけではないと警告する。外への通信で読めるデータが漏れうるし、書き込めるプロジェクトのコードは変えられる。モデルに送られる内容も変わらない。【詳細】Bashのサンドボックスは、Bash、PowerShell、Monitorのコマンドだけを隔離し、Dockerは要らない。/sandboxで設定画面を開く。ネイティブのWindowsには対応しないため、WSL2かコンテナ、仮想マシンを使う。MCPサーバーやコマンドのフックはホスト上で制限なく動く。サンドボックスランタイム（@anthropic-ai/sandbox-runtime、ベータのリサーチプレビュー）は、ファイルツール、MCPサーバー、フックを含むClaude Codeの処理全体を包む。既定で通信を拒否し、書き込みを限る。プロジェクト、~/.claude、一時フォルダへの書き込みと、APIやOAuthの接続先を許可する必要がある。.git/hooksや.mcp.jsonなどへの書き込みは既定で拒否される。開発コンテナ、独自のコンテナ、仮想マシンは処理全体を隔離する。クラウドのセッションはAnthropicが管理する仮想マシンで動く。【ポイント・注意点】ランタイムは設定ファイルがなくても通信を止めて起動するため、起動できても設定が読まれたとは限らない。普段の作業にはBashのサンドボックスを、--dangerously-skip-permissionsやauto modeで無人で動かすならコンテナ、仮想マシン、ランタイムを使うよう勧める。組織が強制できるのはBashのサンドボックスだけだという。","2026-11-20","DEV Community","https://dev.to/lookbkdev/claude-code-sandbox-what-it-is-where-it-runs-and-how-to-choose-one-1iaf"],["Claude Codeのスキル、読み込みの仕組みと大きな一覧の費用","Claude Codeのスキルがどう読み込まれ、数が増えると文脈をどれだけ使うかを、筆者が自分の環境で実際に測った記事。約80のスキルを入れた筆者の環境では一覧が1万トークンで、文脈の1%という予算に収まらず説明が省かれた。それでも10件中10件で正しく呼ばれた。圧縮後に再び付くのは各スキルの先頭5,000トークンまでなので、大事な指示は先頭に置くよう勧めている。","\n【概要】スキルの読み込み方、一覧の費用、残すべきスキルを、実測をもとに説明する記事。スキルはSKILL.mdを持つフォルダで、作業の内容が説明に合うとClaude CodeやCodexが読み込む。筆者は2026年11月2日にMacで、Claude Code 2.1.312とCodex CLI 0.160.1を使って試した。11月18日に2.1.327で文書を確かめ直したが、試験はやり直していない。【背景】記事によると、スキルは繰り返す手順のためのもの。事実はCLAUDE.mdやAGENTS.mdに、必ず守らせる決まりはフックに、別の文脈が要る作業はサブエージェントに向く。スキルの形式は、Anthropicが2026年10月22日にAgentic AI Foundationへ渡した公開の標準になっている。【詳細】Claude Codeは~/.claude/skillsと.claude/skillsから、Codexは~/.agents/skillsと.agents/skillsから読む。nameは64字まで、descriptionは1,024字まで。筆者の環境には約80のスキルとプラグインなどがあり、一覧は1万トークンで、文脈の1%という予算いっぱいだった。131のスキルのうち78は名前だけで並んだ。設定で予算を3%に上げると説明が戻り、一覧は1万8,700トークンに増えた。呼ばれるべき10件と呼ばれるべきでない10件で試すと、Claude Codeは既定でも名前だけでも10件中10件で呼ばれ、誤って呼ばれたのは0件だった。意味の分かりにくい名前では9件だった。Codexも10件中10件だった。【ポイント・注意点】先頭の設定の書式が壊れていると説明が空のまま読み込まれ、呼ばれなくなる。claude plugin validateで確かめられる。圧縮のあとには各スキルの直近の呼び出しが再び付くが、各5,000トークン、合計25,000トークンまでなので、大事な指示は先頭に置く。他人のスキルは入れる前に読むこと。結果は1台の機械で各1回の試行によるもので、次のリリースで変わりうると筆者は断っている。","2026-11-20","DEV Community","https://dev.to/actuallyshipped/claude-code-skills-how-they-load-what-a-big-catalog-costs-and-which-ones-to-keep-jkl"],["MCPサーバーのツールが変わったら、エージェントは気づくか","バージョンを固定せずに起動するMCPサーバーは、更新でツールの一覧が変わっても設定ファイルからは分からない、と指摘する記事。筆者はファイルシステム用サーバーの新旧を比べ、ツールが14から16に増え、書き込みができるツールが2つ加わったことを確かめた。筆者はツール一覧の写しを取って差分を見るスクリプトを作り、バージョンの固定と、ツール名を個別に絞った許可を勧めている。","\n【概要】MCPサーバーのツールの一覧が変わったとき、エージェントや利用者がそれに気づけるかを検証した記事。筆者はツールの一覧を保存して比べるスクリプトを作り、実際の更新で何が変わったかを確かめた。記事はAIの助けを借りて書かれ、有料のガイドの宣伝も含む。【背景】MCPの設定例の多くは、npx -y @modelcontextprotocol/server-filesystemのように、バージョンを指定せずにサーバーを起動する。この場合、使われる版はnpxとそのキャッシュで決まり、設定ファイルには表れない。MCPのツールの仕様も、一覧は時間とともに変わりうるとしている。変更を通知するサーバーならClaude Codeは一覧を取り直すが、版の更新はサーバーの再起動になるため、通知は送られない。【詳細】スクリプトには2つのコマンドがある。snapはサーバーを起動して一覧を取り、各ツールの名前、説明と入力の形のハッシュ、注釈を保存する。diffは変化があれば終了コード1を返すので、cronやCIで動かせる。比べた結果、旧版はツールが14、npmのlatestである2.4.0は16だった。追加は2つで、append_fileとcopy_fileはどちらも読み取り専用ではない。削除は0、変更は14だった。版を指定しないコマンドは、筆者の機械では2.4.0になった。対策として、argsで@2.4.0のように版を固定する。更新の際は今の版と候補の写しを取り、差分を見て、追加されたツールをすべて読んでから固定を更新する。【ポイント・注意点】Claude Codeでmcp__filesystem__*と書くと、そのサーバーのすべてのツールが許可されるため、ツール名を個別に指定するよう勧める。変更の多くは書式の変化だったが、read_media_fileの説明は変わっていた。サーバーが名乗る版とパッケージの版は一致しなかった。仕様はツールの注釈を、信頼できるサーバーのもの以外は信用しないよう求めており、人がツールの呼び出しを拒否できるべきだともしている。設定が同じに見えても中身が変わりうる点を前提に、更新の手順を決めておくことが大切だ。","2026-11-20","DEV Community","https://dev.to/promptmaster/your-mcp-server-changed-its-tools-would-your-agent-notice-4j9a"],["エージェントを5つ雇ったら、自分が彼らのために働いていた","AIエージェントを5つ同時に動かした筆者が、夜の時間が戻るどころか同じ仕事が細切れになったと振り返る随筆。常にどれかが答えを待ち、どれかが確認を待ち、どれかが同じ処理を繰り返していた。切り替えのたびに頭の中の文脈を読み直す必要があり、限界はエージェントではなく人の側にあったという。筆者は同時に動かす数を2つか3つに減らし、通知のたびではなく、まとめて様子を見る運用にしている。","\n【概要】AIエージェントを5つ同時に動かした経験をつづった短い随筆。筆者は、エージェントが夜の時間を取り戻してくれると期待していた。しかし実際には、同じ仕事が小さく分かれただけだったと振り返る。題名のとおり、エージェントを雇ったつもりが、自分が彼らのために働く形になっていた。【背景】5つのエージェントを動かしていると、どの瞬間にも、ひとつは答えを求め、ひとつは確認を求め、ひとつは同じ処理を繰り返し、ひとつは頼んでいないものを変えていた。エージェントは止まらずに動き続けるが、確認や判断を求められるのは人の側である。複数のエージェントを並べて動かす使い方が広がるなかで、記事は人の注意をどう配るかという問題を扱っている。エージェントの数を増やせば仕事が速く進む、という期待に対する率直な反省として読める。【詳細】筆者は、エージェントを切り替えるたびに、頭の中に文脈を読み込み直す必要があったと書く。前の作業の気がかりが残る状態を、研究者ソフィー・リロイの言う「注意の残り」として紹介している。筆者の結論は、ボトルネックはエージェントではなく、人の側の文脈の窓だというものだ。その後、筆者は同時に動かすエージェントを2つか3つに減らした。それ以上にすると、自分が追い切れない変更を承認することになったからだという。具体的なやり方として、通知が来るたびに見るのではなくまとめて様子を見ること、行き詰まったエージェントはすぐに助けず、10分ほど放っておくことを勧めている。【ポイント・注意点】目安として、それぞれのエージェントが何をしているかを画面を開かずに説明できなければ、1つ多すぎるという判断基準を示している。記事は筆者の意見と体験談で、測ったデータはない。特定のツールにも結び付けていない。それでも、エージェントの連続稼働や並列運用を考えるうえで、人の確認の負担を見積もる材料になる。同時に動かす数は、機械の性能や料金だけでなく、人が追える範囲で決めるべきだという視点は、多くの運用に当てはまるだろう。","2026-11-20","DEV Community","https://dev.to/hfloresgu/i-hired-five-agents-now-i-work-for-them-4b94"],["Claudeの支出の大半は、エージェント同士の会話に使われていた","多くのClaude CodeとCodexのエージェントを動かすチームが、支出をエージェント自身に分析させた記事。11月1日から8日までのClaudeの支出の57%は、別のエージェントからのメッセージで始まったターンだった。人が始めたターンは約20%。マージ数は1日33件から約12件に落ちた。エージェント同士の承認待ちが原因とみて、機械の割り当てを錠前で行う仕組みに変えた。","\n【概要】多数のClaude CodeとCodexのエージェントを動かすチームが、支出の内訳を調べた記事。エージェント自身に分析させた結果、2026年11月1日から8日までのClaudeの支出の57%が、別のエージェントからのメッセージで始まったターンに使われていた。人が始めたターンは約20%だった。数値はClaudeだけのもので、ドルではなく重み付けしたトークンの単位。【背景】チームではClaudeとCodexのエージェントが互いにメッセージを送れるようにしていた。8日間で約7,800通が送られ、ルールで使わないとしていた道具を通した送信も1,457通あった。エージェントが始めたターンの中央値は、約50万トークンの文脈で動いていた。それ以前には、モデルをまたいでタスクを振り分ける仕組みを作ったが、10月に69件のタスクを1件も完了できず、削除している。【詳細】手元のテストは、重い処理をクラウドの機械に移すまで順番待ちになった。マージ数は1日33件（10月24日から11月3日）から約12件（11月4日から10日）に落ちた。最初のコミットからマージまでの時間の中央値は1.1時間から13.6時間に延びた。社内の振り返りでは、エージェントが別のエージェントからの「進めてよい」という承認を待っていたことが原因とされた。メインのブランチは約37%の時間、凍結されていた。対策として、重い処理はクラウドの機械で動かし、共有の機械の割り当てはエージェントへのメッセージではなく錠前で取る方式にした。【ポイント・注意点】新しい方式は11月11日に入ったばかりで、効果はまだ測れていない。同じ週にはディスクの障害や撮影の日もあり、筆者はデータが完全にきれいではないと断っている。記事はAIが下書きして人が編集したもので、筆者のWindows用アプリの宣伝も含む。チームは今後、エージェント同士のやり取りの仕方も見直すとしている。エージェントに互いの連絡を許すと、その分の費用と待ち時間が積み上がる点は、並列運用の設計で意識しておきたい。","2026-11-20","DEV Community","https://dev.to/soluterminal/most-of-our-claude-spend-went-on-agents-talking-to-each-other-17me"],["2つのフックの答えが重なると、2.1.319ではaskが消えて実行","Claude Codeで2つのPreToolUseフックが同じBashの呼び出しに答えたとき、結果が文書どおりになるかを試した記事。対話のセッションでは、deferが先、askが後に返ると、2.1.319では確認の画面が出ずにコマンドが実行された。2.1.322では確認の画面が出た。筆者はaskを最も弱い答えとみなし、確実に止めたいときはdenyか終了コード2を使うよう勧めている。","\n【概要】Claude Codeで複数のPreToolUseフックが同じ呼び出しに答えたとき、どの答えが勝つかを試験した記事。2.1.319と2.1.322を比べ、対話のセッションでdeferとaskが重なると、古い版では確認なしにコマンドが実行されたことを確かめた。【背景】筆者のリポジトリには5つのPreToolUseフックがあり、どれも終了コード2で止める作りになっている。公式のフックの文書では、優先順位はdeny、defer、ask、allowの順で、終了コード2はdenyと同じ扱い。deferは対話しないモードで単一のツール呼び出しのときだけ有効で、対話のセッションでは警告を記録して無視されるとされる。2.1.321にはこの問題の修正が入っている。【詳細】使い捨てのプロジェクトで、すぐ答えるフックと1.5秒待ってから答えるフックの2つをBashに登録した。許可のルールはBash(echo:*)。各版で、claude -pによる18回と対話による3回を、Haikuのモデルで動かした。claude -pでは、単一呼び出しの12通りの組み合わせがどちらの版でも文書どおりだった。対話では、deferが先、askが後に終わると、2.1.319は確認の画面を出さず、echoが実行された。2.1.322では画面が出て、何も実行されなかった。askが先に終わる場合は、どちらの版でも画面が出た。2つのフックがともにaskを返すと、先に終わったフックの理由だけが届いた。1つのメッセージに2つのBash呼び出しがある場合、どちらの版でも4回すべてが「tool_deferred」で止まり、文書の記述と合わなかった。【ポイント・注意点】askを最も弱い答えとみなし、確実に止めるならdenyか終了コード2を使う。deferを返すフックがあるなら2.1.321以降を使う。askの理由にはフックの名前を入れ、フックは単体だけでなく組み合わせでも試す。試験は1つのツールと1つのモデルによる小さなもので、筆者は文書が全般に誤りだとは主張していない。","2026-11-20","DEV Community","https://dev.to/rulestack/on-claude-code-21319-one-hooks-defer-erased-another-hooks-ask-and-the-command-ran-21322-2b7p"],["実際の事故のコマンド107件を事前チェックに通した結果","Claude Codeの公開された事故報告から集めた107のコマンドを、筆者の事前チェック「guard」に通した記事。結果は拒否24、確認52、判断なし31だった。データベースへのSQL、スクリプトファイルの中身、一部のDockerコマンド、プロジェクト内のrm -rfは判断なしになった。guardはコマンドの行しか読まないため、MCP経由のSQLやスクリプトの中は見えないという。","\n【概要】AIコーディングエージェントが実行する危険なコマンドを、実行前に止める仕組み「guard」の限界を、筆者が自ら調べた記事。Claude Codeの公開された事故報告83件から107のコマンドを集め、guard 0.4.11に通した。結果は拒否が24、確認が52、判断なしが31だった。記事はAIの助けを借りて書かれたと明記している。【背景】anthropics/claude-codeの公開されたissueには、別のフォルダでrm -rfを実行した例や、保存していない作業をgit reset --hardで消した例がある。guardはClaude CodeとGitHub Copilot CLI向けの事前チェックで、拒否、確認、判断なしの3通りで答える。判断なしの場合は、エージェント自身の権限設定が決める。guardは「許可」とは答えないため、権限の設定は引き続き重要になる。【詳細】rm -rf ~のようにプロジェクトの外に及ぶものは拒否、git reset --hardや、シェルのコマンドで.envを読むものは確認になる。判断なしの31件には、いくつかの型があった。1つ目はデータベースで、そのままのSQLや、migrate:freshやprisma db pushのようなサブコマンド。guardはシェルのコマンドの行を読むため、データベースの道具やMCPサーバーを通したSQLは見えない。2つ目はスクリプトで、3件の報告の4行では、壊す処理がスクリプトファイルの中にあった。guardはファイルを開かないため、筆者もまだ答えを持っていない。3つ目はDockerで、docker network prune -fなどは判断なしだった。4つ目はプロジェクト内で、rm -rf buildやrm -rf srcは判断なしになった。【ポイント・注意点】筆者は、この107件はルールを書く際に参照した一覧そのものなので、未知の事故を捕まえる率ではないと断っている。コマンドは実行せず、架空のプロジェクトのフォルダで判定だけを行った。srcをbuildと同じ扱いにしている点は未解決だと認めている。guardは無料でソースが公開されている。","2026-11-20","DEV Community","https://dev.to/boxdawn/i-ran-107-commands-from-real-claude-code-incident-reports-through-my-pre-run-check-here-is-where-10ll"],["Claude Codeのauto modeが使えない、分類器に止められるとき","Claude Codeのauto modeが使えない場合と、使えるが分類器が失敗したり止めたりする場合を分けて、原因と対処を整理した記事。対応するモデルや設定の置き場所、ゲートウェイがヘッダーを書き換える問題、3回連続か合計20回の拒否で一時停止する仕組みなどを説明する。確実に守らせたいことは会話での指示ではなく、設定の権限の確認ルールに書くよう勧めている。","\n【概要】auto modeは権限の判断を分類器に任せる仕組み。記事は、auto modeがそもそも使えない問題と、使えるが分類器が失敗したり止めたりする問題を分け、それぞれの原因と対処をまとめている。筆者は2026年11月6日に文書を確かめたとしている。【背景】記事によると、auto modeは全プランで使え、TeamとEnterpriseでは既定で有効になっている。管理者は管理された設定で無効にできる。AnthropicのAPIでは、Claude Opus 4.6以降、Sonnet 4.6以降、Haiku 5.5、Fableのモデルが対象で、Sonnet 4.5のような古いモデルは対象外。Bedrock、Google Cloud、Microsoft Foundry、ゲートウェイ経由では対象がさらに狭い。【詳細】Claude Code v2.1.283からは、ターミナルとVS Codeの対話のセッションがauto modeで始まる。プロジェクトの.claude/settings.jsonに\"defaultMode\": \"auto\"を書いても無視されるため、~/.claude/settings.jsonに書く。1回だけならclaude --permission-mode autoを使う。claude -pとAgent SDKは、v2.1.302から既定がManualになった。分類器の一時的な失敗は、多くの場合やり直せば直る。会話が長すぎるときは/compactを使う。止められた操作は、/permissionsの最近止められた一覧でrキーを押して承認できる。ゲートウェイがヘッダーを削ったり応答を書き換えたりすると、分類器の対象外になることがある。その場合は通過させるよう頼むか、CLAUDE_CODE_AUTO_MODE_SERVER=0を設定する。【ポイント・注意点】3回連続、または合計20回止められると、auto modeは一時停止し、この回数は変えられない。信頼できる環境はautoMode.environmentに書き、claude auto-mode configで確かめる。記事は、auto modeは確認を減らすが安全を保証しないという文書の一文を引き、確実に守らせたい点はpermissions.askに書くよう勧める。会話の指示は圧縮で消えうるからだ。","2026-11-20","DEV Community","https://dev.to/eliran_kotzero_e1781dc487/claude-code-auto-mode-unavailable-or-classifier-blocked-4f0n"],["使用量の上限でも止めない、Claude Codeを走らせ続ける工夫","Claude Codeを長い作業に使う筆者が、使用量の上限に達して作業が途中で止まる問題を、自作の道具claude-nonstopで解決した記事。複数のアカウントとAPIキーを順番に並べ、上限に達するとフックが次の候補を探し、claude --resumeで同じセッションを続ける。ただし、ある会社のサブスクリプションを別の道具から使うことは規約で認められないとし、自分のアカウントだけを使うよう注意している。","\n【概要】Claude Codeを長い作業に使う筆者が、使用量の上限で作業が途中で止まる問題への対処をまとめた記事。筆者は小さな道具claude-nonstopを作った。Nodeで書かれ、依存関係はなく、MITライセンスで公開されている。【背景】Claudeのサブスクリプションには、約5時間ごとに区切られるセッションの枠と、週ごとの上限がある。どちらかを使い切ると、Claude Codeは今のターンを終える。記事は、これまでの選択肢を3つ挙げる。待つか、手でアカウントを切り替えるか、セッションの上限がない代わりにトークンごとに課金されるAPIキーを使うか、である。【詳細】claude-nonstopは、アカウント1、アカウント2のあとにAPIキー1、APIキー2と続く1本の順番を持つ。セッションの前には、各アカウントに残りがあるかを順に尋ね、最初に残りのあるアカウントでClaude Codeを起動する。作業の途中では、Claude Codeのフックが上限を検出し、次の候補を確かめる。そして残りのある候補でclaude --resume <session> \"Continue where you left off.\"を実行する。すべてのアカウントは1つの履歴を共有する。APIキーへの要求は手元のゲートウェイを通し、残高不足を返したキーの要求は次のキーで送り直す。上位のアカウントに残りが戻ると、今のターンの後にそちらへ戻る。ゲートウェイはOpenAIの形式も話すため、CodexやCursorでも同じ順番を使える。アカウントの追加は手元のページから行い、キーはOSのキーチェーンの鍵で暗号化される。【ポイント・注意点】各社は自社のクライアントからのサブスクリプションのサインインしか受け付けない。筆者は、ある会社のサブスクリプションを別の会社の道具から使うことは規約の対象外だとしている。APIキーにはこの問題はない。すべてのアカウントは自分のものである必要がある。インストールはシェルのスクリプトかnpmで行う。","2026-11-19","DEV Community","https://dev.to/umer_jahan
