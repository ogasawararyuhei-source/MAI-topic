ェット集」として紹介されました。\n【背景】\nデスクトップを飾るアプリには、ChromiumやElectronのようなWebの技術で作られたものもあります。AutumnDeckはRust、Win32、Direct2D、DirectCompositionで一から作られ、それらを使わないことで、メモリ使用量を50MB未満に抑えたとしています。リポジトリの説明ではC++も使っていると記しています。\n【詳細】\nタスクバーは、ぼかし、アクリル、透明、分割した丸形、スモークガラス風などに変えられます。Dockとタスクバーには8つの系統で90種類のテーマがあり、うち20種類はmacOSのLiquid Glass風などのすっきりした見た目です。上部のメニューバーやコントロールセンター、拡大表示、アプリのプレビューを備え、カーボン、チタン、クルミ材、大理石など12種類の質感を選べます。ウィジェットは時計、天気（Open-Meteoの7日予報）、音楽プレーヤー、性能表示、メモとToDo、ポモドーロなど計19種類で、高級時計をモチーフにした10種類のテーマを全ウィジェットに適用できます。壁紙は .mp4、.mkv、.webm の動画のループや静止画に対応し、全画面のゲームなどでは自動で止まります。72種類の組み合わせ（スイート）をワンクリックで切り替えられ、設定を .autumn ファイルで書き出し・読み込みできます。\n【ポイント・注意点】\nタスクバーの装飾にはWindows 11の64ビット版が推奨で、Windows 10（2004以降）ではDock、ウィジェット、壁紙が使えます。入手はMicrosoft Storeが推奨で、GitHubのリリースからポータブル版とインストーラー（2.0.9）も選べます。署名はSignPathの無償の仕組みで提供され、テレメトリーはないとしています。ライセンスはGPL-3.0で、取得時点のスター数は4でした。","2026-11-27","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50663078"],["Faster Mac Use：AIがMacとChromeを裏で素早く操作","AIエージェントに、ログイン済みのChromeのタブやmacOSのアプリを裏で操作させるエンジン「Faster Mac Use（fmu）」がShow HNに投稿された。マウスの位置や作業中のウィンドウのフォーカスを動かさず、画面写真の代わりに数百トークンの差分テキストを返す。作業ごとに手段を選ぶ「browser-routing」スキルと組み合わせ、Claude CodeやCodex、Antigravityで使える。","\n【概要】\nFaster Mac Use（fmu）は、AIエージェントがMacを操作する「コンピューター利用」を速く軽くするためのエンジンです。MCPサーバーとして動き、作業の振り分けを決める browser-routing スキルとセットで提供されます。Hacker NewsのShow HNで2026年11月27日に紹介されました。\n【背景】\nREADMEは、速いエンジンだけでは半分にすぎないと説明します。振り分けの決まりがないと、エージェントは遅い組み込みのブラウザー用サブエージェントに頼ったり、YouTubeの字幕を読むだけでブラウザーを起動したり、決め打ちで3秒待ったり、DOM全体を読み直したりしがちだというのです。特にAntigravityの組み込み機能は、ログイン済みのChromeを共有できない隔離された画面で動くため遅いと指摘しています。\n【詳細】\nfmu はログイン済みのChromeのタブとmacOSのネイティブアプリを裏で操作します。READMEによると、マウスはまったく動かず（ずれ0.0px）、作業中のウィンドウのフォーカスも保たれ、Chrome 144でリモートデバッグの確認画面も出ません。各手順の結果は画面写真ではなく、追加・変更・削除を表す数百トークンの差分テキストで返ります。browser-routing スキルは作業を5つの経路に振り分けます。APIやGitは gh や curl で、YouTubeなどの動画は字幕取得の道具で、公開Webの探索は検索から、開発中のサイトの確認はヘッドレスで、ログイン済みのChromeは拡張機能経由の橋渡しで処理します。READMEは実測の中央値として、ヘッドレスで49ミリ秒、ログイン済みChromeで145ミリ秒を挙げています。電卓アプリで7×6を計算する例を、uvx の1行で試せます。\n【ポイント・注意点】\nAntigravityには1行のコマンドでプラグインとして入り、Claude Code、Codex、Cursorではスキルを入れてMCPサーバーを登録します。操作の対象はmacOSのアプリとChromeで、言語はPythonです。ライセンスはAGPL-3.0で、取得時点のスター数は15でした。","2026-11-27","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50661603"],["kaju：Claude Codeの出力を選んでコメントを返す","端末に出たClaude Codeの出力を選択してホットキーを押し、コメントを書くと、引用とコメントがそのままClaude Codeに送られるMac用の道具「kaju」がShow HNに投稿された。計画や文書を見直すときは、横のパネルにコメントをためてまとめて送れる。誤ってシェルに貼り付けないよう、送信前に前面のプログラムを確かめる安全策も備える。Apache-2.0で公開されている。","\n【概要】\nkaju は、Claude Codeの出力に注釈やコメントを付けてやり取りするためのMac用の道具です。Hacker NewsのShow HNで2026年11月26日に紹介されました。名前は、脳細胞が1つしかないように見えて食べることだけは抜群にうまい茶トラ猫に由来し、道具も多くはできないがコメントだけは得意だと説明しています。\n【背景】\nClaude Codeが示した計画や説明の一部に意見を返すには、該当箇所をコピーして引用し、コメントを打ち込む手間がかかります。kajuはこれを、選択してホットキーを押すだけの操作にします。\n【詳細】\n使い方は、Claude Codeの出力で文字を選択し（Claude Codeが選択範囲をクリップボードにコピーします）、⌃⌥K を押すか、iTerm2では右クリックのメニューから「Comment with kaju」を選びます。選択箇所の横に小さな入力欄が開き、引用を確認しながらコメントを書いてReturnを押すと、引用とコメントがClaude Codeに届き、すぐに返答が始まります。Tabキーで「レビュー」を始めると、コメントは端末ウィンドウの横のパネルにたまり、番号付きの1通にまとめて送れます。レビューは変更のたびにディスクに保存され、再起動後も戻ります。コメントには fix、question、nit の札を付けられます。対応状況は端末によって異なり、iTerm2がもっとも充実し、Terminal.appも自動送信に対応します。Ghostty、Warp、Alacrittyなどほかの端末では1行に貼り付けるだけで、Returnは人が押します。\n【ポイント・注意点】\n引用行は > で始まるため、誤ってシェルに貼られるとコマンドとして動くおそれがあります。そこでiTerm2、Terminal.app、tmuxでは、送信前にその枠の前面のプログラムがClaude Codeかを確かめ、違えば何も打ち込まずクリップボードに回します。ほかの端末ではReturnを押さず、制御文字を除いて1行で貼ります。導入はHomebrewで、インストール時にMac上でビルドするため、Xcodeのコマンドラインツール15.3以上が必要です。ライセンスはApache-2.0で、取得時点のスター数は5でした。","2026-11-26","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50660837"],["f*ck_data_brokers.py：データブローカーへ削除依頼を一斉送付","個人情報を集めて売るデータブローカーに、削除と利用停止の依頼をまとめて送る無料のPythonスクリプト「f*ck_data_brokers.py」がShow HNに投稿され、240ポイントを集めた。政府の登録簿から600社超の一覧を取り、居住地の法律を引用した正式な依頼文を作って自分のメールから送る。返信の分類や、応じない相手への苦情先の案内もする。依存なしの1ファイルで、AIは不要だ。","\n【概要】\nf*ck_data_brokers.py は、データブローカーに対し、本人に代わって情報の削除と利用停止（オプトアウト）の依頼を送るPythonのスクリプトです。依存のない1つのファイルで、無料のオープンソースとして公開されています。Hacker NewsのShow HNで2026年11月26日に紹介され、取得時点で240ポイント、53件のコメントを集めていました。\n【背景】\n作者は、データブローカーから人の情報を消す仕事を副業にしています。READMEによると、友人の情報を消そうとして、どうしても応じないブローカーに腹を立てたことがきっかけでした。作者は、GPT-4が登場して以降ブローカーの活動が大幅に増えたと感じており、全員の分を自分で片付けることはできないため、この道具を公開したと書いています。\n【詳細】\nスクリプトはまず、政府の登録簿に載ったデータブローカーの一覧を取得します。READMEでは600社以上としています。次に、利用者の居住地の法律を引用した正式な削除・利用停止の依頼文を、利用者の名前で書きます。依頼文は1回に20通ずつ作られます。送信は利用者自身の無料のメールアドレスから行うか、送れる状態の文面を渡します。ブローカーから返事が来たら、その内容がどの言い逃れに当たるかを判定し、どう返すべきかを示します。返事のない相手には催促し、拒む相手については苦情の申し立て先を案内します。入力する個人情報は名前、メール、市、居住地域だけで、番地や誕生日、身分証は求めません。\n【ポイント・注意点】\n必要なのはPython 3.8以上とメールアドレスだけで、アカウントや契約、AIは不要です。情報は利用者のパソコンの中にとどまるとしています。道具自体はブローカーに辛辣ですが、依頼文は丁寧で法的に正しい内容にしているとのことです。作者は同じ作業を代行する有料サービスも運営しています。スターが増えるほどブローカーへの圧力になるとして、作者はスターを押すよう呼びかけています。ライセンスはMITで、取得時点のスター数は514でした。","2026-11-26","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50658191"],["grind：OpenDocumentを標準形式にしたRust製オフィス","OpenDocument形式を標準に据え、Rustで一から作られたオフィススイート「grind」がShow HNに投稿された。作者はLibreOfficeの使い勝手に長年不満を持ち、AIエージェントを使って余暇に開発した。Linux、Windows、Mac、ブラウザー、端末向けにそれぞれネイティブのクライアントを用意する。表計算をテキストで表す機能や、数式を読みやすく表示する機能が特徴だ。","\n【概要】\ngrind は、OpenDocument（ODF）を標準の形式とするオフィススイートです。Hacker NewsのShow HNで2026年11月26日に「Rustで作ったOpenDocumentネイティブのオフィススイート」として紹介されました。READMEによると、ソースコードはすべてAIエージェントで書かれ、READMEだけは人が書いています。\n【背景】\n作者はLinuxを長く使い、自由でない形式に縛られないよう努めてきたソフトウェア開発者です。LibreOfficeが自由なデスクトップに果たした役割を評価しつつ、使い勝手は古く、表計算のCalcでExcelのような表を作る方法をいつも思い出せないと不満を書いています。AIエージェントの登場で、余暇でも自分の役に立つ代替品を作れるようになったと説明しています。\n【詳細】\nクライアントはLinux、Windows、Mac、WebAssemblyを使うブラウザー、TUI、CLI向けに用意されています。あえてクロスプラットフォームのUI部品を使わず、プラットフォームごとにネイティブで作っています。作者は、これまで費用に見合わず誰もやらなかったこのやり方が、AIエージェントによって割に合うものになったことの証明だとしています。特徴の1つ目は「ソース表示」で、表計算ファイルをテキストで表し、1つのセルを1行にするため、gitでの差分の確認や監査がしやすくなります。2つ目は数式の読みやすい表示で、=FV(...) のような式を、利率や期間などの引数名を付けた形で見せます。3つ目は、組み込みスクリプト言語rhaiを使い、データから文書を生成する機能です。\n【ポイント・注意点】\n作者は数か月開発を続けて日常的に使っており、かなり成熟したと考えています。一方HNの投稿では、機能はあえて限定しているとし、意見を求めています。AIが書いたことで敬遠されることも承知のうえで、情熱を注いだ個人の企画だと強調しています。最新版はGitHubのリリースから入手できます。取得時点のスター数は8で、GitHub上ではライセンスは判定されていませんでした。","2026-11-26","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50658013"],["SimDrop：iOSシミュレーターをFinderのサイドバーに","起動中のiOSシミュレーターをmacOSのFinderのサイドバーに表示し、ファイルをドラッグで出し入れできるようにする「SimDrop」がShow HNに投稿され、51ポイントを集めた。シミュレーターごとに写真とダウンロードのフォルダーが現れ、起動すると出て、終了すると消える。画像や動画は写真アプリに取り込まれる。macOS 15以降が必要で、無料のGPL-3.0で公開されている。","\n【概要】\nSimDrop は、動いているiOSシミュレーターをFinderのサイドバーの「場所」に並べ、ファイルをドラッグで出し入れできるようにするmacOS用の小さな道具です。Hacker NewsのShow HNで2026年11月26日に紹介され、取得時点で51ポイントを集めていました。\n【背景】\niOSアプリの開発では、写真や設定ファイルをシミュレーターに入れて動作を確かめる場面がよくあります。作者は、自分のシミュレーターでの作業の流れのために作った道具だと説明しています。\n【詳細】\n起動中のシミュレーターごとにフォルダーができ、その中に「写真とビデオ」と「ダウンロード」があります。前者はシミュレーターの写真ライブラリ、後者はファイルアプリの「このiPhone内」のダウンロードに当たります。シミュレーターを起動すると現れ、終了すると消えます。同じ中身は ~/Library/CloudStorage/SimDrop-SimDrop/ から端末でも扱えます。入れた画像や動画は simctl addmedia で取り込まれ、写真アプリに表示されます。画像や動画以外を写真フォルダーに落とした場合は、同じシミュレーターのダウンロードに入れ、通知で知らせます。Finderで写真を消すと、確認なしでシミュレーターの「最近削除した項目」に移り、30日間は戻せます。導入はHomebrewのcaskかGitHubのdmgで、Developer IDで署名・公証されています。シミュレーターを操作するためサンドボックスの外で動く必要があり、Mac App Storeには出せないとしています。\n【ポイント・注意点】\n初回は、ログイン項目での常駐の許可と、Finder拡張の有効化の2つが必要です。ドラッグは標準で「移動」になり、デスクトップから入れると元のファイルが消えます。コピーしたいときはOptionキーを押しながらドラッグします。逆にダウンロードから外へ出すと、シミュレーターから消えます。アプリを入れ直したり更新したりした後は、一度SimDropを開かないとFinder拡張などが動かない点にも注意が必要です。対応はiOSシミュレーターのみで、macOS 15以降が必要です。言語はSwiftです。","2026-11-26","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50657070"],["Graphvein：画面の呼び出しからDBの表まで追跡、LLM不要","フロントエンドの呼び出しから、対応するルート、処理関数、読み書きするデータベースの表までを、複数のリポジトリにまたがってたどる「Graphvein」がShow HNに投稿された。LLMを使わず手元で決定的なグラフを作り、変更の影響範囲も示す。読み取り専用のMCPサーバーとして、コーディングエージェントからも使える。Go製の先行版で、ライセンスはApache-2.0だ。","\n【概要】\nGraphvein は、コードベースを全体の構成から個々の関数や行まで地図にする道具です。あるルートを呼ぶフロントエンドの呼び出し、その処理関数、読み書きしうるテーブル、そして変更がどこまで及ぶかをたどれます。Hacker NewsのShow HNで2026年11月26日に紹介されました。現在は先行版（v0.1.2）です。\n【背景】\n作者は投稿で、AIの支援を使ううちにアーキテクチャを見失ったことをきっかけに10月に始め、約2か月かけて作ったと書いています。コードの事実を決定的なグラフとして作り、設計の理由や評価、人の判断も、それを説明するコードに結び付けて残すことを狙っています。\n【詳細】\ngraphvein index でリポジトリの索引を作り、graphvein serve で手元のWeb画面を開きます。画面には、ルートと呼び出し元、変更の影響、アーキテクチャ、スキーマ、APIの説明と「試しに実行」、読めなかった部分の一覧などが並びます。複数のリポジトリを1つのプロジェクトとして扱え、graphvein mcp は同じ索引を使う読み取り専用のMCPサーバーです。ルートはExpress、FastAPI、Axum、Goの net/http、chi、gin、Next.jsのApp Routerなどを読み、呼び出しは fetch、axios、AngularのHttpClient、SupabaseのJSクライアントなどに対応します。スキーマはSQLのマイグレーションに加え、Prisma、Drizzle、GORMなどのモデルから読みます。READMEによると、3つのオープンソースのリポジトリで、ルートと呼び出し元の結び付き363件がすべて正しく、適合率は100.0%でした（初回の計測は94.6%）。\n【ポイント・注意点】\nLLMを使わず手元で動き、利用者が設定した先以外にはネットワーク接続をしません。LLMの利用は今後、任意で選べる形で加える予定です。SQLはPostgresで試験されており、Java、C#、Dartは構造の読み取りのみです。見えないもの、扱えないものは「既知の欠落」として文書にまとめています。言語はGoで、ライセンスはApache-2.0、取得時点のスター数は2でした。","2026-11-26","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50656925"]],"gh-blog":[["GitHub ActionsからPATも秘密鍵も消す仕組みGATES","Zennでtmknom氏が、GitHub ActionsでPATやGitHub AppのPrivate Keyを扱わずにトークンを得る仕組み「GATES（GitHub App Token Exchange System）」を公開した。AWS LambdaとKMSを組み合わせ、ワークフローから秘密鍵を一切見えなくする設計で、OIDCによる認証、IAMとLambdaによる二重の認可、KMSへの署名の委任が柱になっている。","\n【概要】\nGitHub Actionsで強い権限のトークンが必要なとき、秘密鍵をどこに置くかは長年の悩みだった。2026年11月27日、tmknom氏がZennで「GitHub ActionsからPATもGitHub App Private Keyも駆逐する」を公開し、鍵をワークフローから完全に切り離す自作の仕組み「GATES（GitHub App Token Exchange System）」を紹介した。ワークフローはPrivate Keyに触れずに、GitHub AppのInstallation Access Tokenを受け取れる。\n【背景】\nGITHUB_TOKENの権限が足りない場面では、PATかGitHub Appのトークンが使われる。記事はAppのトークンのほうがPATよりずっと良いとしつつ、問題はPrivate Keyの管理だと指摘する。Organization Secretsで共有すれば運用は楽になるが漏えいの経路が増え、ワークフローを書き換えられる人なら誰でも鍵を持ち出せてしまう。\n【詳細】\nGATESはAWS LambdaとAWS KMSで構成される。GitHub OIDCが発行するJWTで認証し、AWS STSが一時的な認証情報を払い出す。Lambdaは呼び出し元のリポジトリを確認し、IAMとLambda内のチェックという二層で認可する。署名はKMSに任せるため、Lambda自身も平文の鍵を読めない。当初はSecrets Managerに鍵を置く案だったが、KMSが非対称鍵の署名に対応していると知り、鍵をインポートする方式にした。独自のHTTPエンドポイントは持たず、Lambda Invoke APIだけで呼び出す。1つのLambdaは1つのGitHub Appに限り、権限もRepository permissionsに絞る。\n【ポイント・注意点】\n利用側は固定したコミットSHAでアクションを指定し、対象リポジトリや権限、ロールARNを渡せばトークンを得られ、ジョブにはid-token: writeが必要になる。ワークフローにはkms:Signを与えず、インポート後に元の鍵ファイルは削除するという。GATESは個人プロジェクトで、コードは生成AIが書き、作者は中核の設計に集中したと明かしている。","2026-11-27","Zenn","https://zenn.dev/tmknom/articles/github-app-token-exchange-system"],["GitHubの11月刷新、PRの新ページとIssueの状態を解説","dev.toでGiorgio Boa氏が、GitHubが11月に公開プレビューとして投入した2つの変更をまとめた。PRに導入されたオプトインの「Overview」ページは、マージ状況と次の行動を上部に集約し、マージボックスを半分以下の面積に再設計した。Issueには7種類の状態とリポジトリボードが加わり、「Active」フィルターや、PRのリンクや担当者の割り当てに応じた状態の自動更新も用意された。","\n【概要】\nGitHubが11月に相次いで公開したプルリクエストとIssueの新機能を、dev.toの記事が1本にまとめている。2026年11月27日、Giorgio Boa氏が「GitHub's November Refresh: A New Pull Request Page and Issue Statuses」を投稿し、PRの新しいOverviewページと、Issueの状態・リポジトリボードという、いずれも公開プレビュー中の変更を解説した。\n【背景】\n記事によると、GitHubは11月5日にPRのOverviewページをオプトインで導入した。マージ状況と次に取るべき行動を上部の準備状況サマリーにまとめ、マージボックスは同じ情報を半分以下の面積で示すよう再設計された。未解決の会話や自分のコメントで絞り込むフィルター、新しい順の並べ替え、右上の「Catch up」要約も加わった。11月19日には2週間分の意見を受け、任意のチェックの失敗でマージ可能なPRがブロックされて見える問題を直し、解決済みスレッドを折りたたみ、force-push前後のコミットをリンクした。\n【詳細】\nIssue側では11月23日に状態とリポジトリボードが公開プレビューになった。状態はBacklog、Todo、In progress、In review、Done、Not planned、Duplicateの7種類で、アイコンやダッシュボード、ボードに表示され、status:フィルターで検索できる。OpenとClosedの横には「Active」フィルターが加わり、Todo、In progress、In reviewのIssueが対象になる。ドラフトPRをリンクするとIn progress、レビュー可能にするとIn review、ユーザーを割り当てるとTodo、エージェントを割り当てるとIn progressへと状態が自動で変わる。\n【ポイント・注意点】\nPRのOverviewページはヘッダーの「Try the Overview page」ボタンで試せ、同じメニューから従来の表示に戻れる。著者は、どちらの機能も作業の状態を見えやすくするものだと評価しつつ、状態のないオープンなIssueは誰かが作業中でもActiveに数えられない点に注意を促す。GitHubは両機能への意見を求めている。","2026-11-27","dev.to","https://dev.to/gioboa/githubs-november-refresh-a-new-pull-request-page-and-issue-statuses-334n"],["SAPのGitHub侵害、本当の危険はビルドパイプライン","dev.toでセキュリティメディアのThreatAftが、SAPのGitHubを巡るセキュリティインシデントを取り上げた。報道では従業員のGitHubトークンが盗まれソースコードが改ざんされたとされ、SAPは署名鍵の交換、CI/CDの自動処理の停止、GitHubへのアクセス制限を行った。記事は顧客データの有無よりも、改ざんされたコードがビルドされ正規の成果物として届いた可能性こそが問題だと論じ、利用者向けに3つの対策を示す。","\n【概要】\n顧客データが無事でも、ビルドに紛れ込んだ改ざんコードは正規の署名付き成果物として届きうる。2026年11月27日、ThreatAftがdev.toに「SAP's GitHub Got Hit. The Risk Isn't a Data Breach — It's Your Build Pipeline.」を投稿した。記事によるとSAPは今週セキュリティインシデントを認め、声明では顧客データへのアクセスはなかったと強調したという。\n【背景】\n記事が伝える報道では、攻撃者はSAP従業員のGitHubトークンを盗み、それを使ってソースコードを改ざんしたとされる。SAPは署名鍵を交換し、自動化されたCI/CDを止め、GitHubへのアクセスを制限した。記事は、今回はCVEもパッチもスキャナーのシグネチャも存在しないと指摘する。盗まれたトークンは単にログインするだけなので、ファイアウォールには引っかからないというのが記事の見立てだ。\n【詳細】\n著者が重視するのは、改ざんされたコードがビルドに届いたかどうかだ。封じ込めの前に改ざんコードがビルドされ署名されていれば、顧客はSAPが出荷するつもりのなかった「正当な」SAPの成果物を受け取った可能性がある。そこで記事は、SAPのコードを使う側に3つの行動を求める。1つ目は、SAPのリポジトリにアクセスできるすべてのトークンをローテーションすること。2つ目は、露出していた期間に見慣れないIPからのコミットがないか、GitHubの監査ログを確認すること。3つ目は、コミットハッシュを最後に正常と確認できたビルドの記録と照合することだ。\n【ポイント・注意点】\n記事は「対策はビルド番号ではなくプロセスだ」と結ぶ。なお、このページ自体はSAPの声明の出典や露出期間の日付を示しておらず、確認済みの事実と報道ベースの情報の区別は元サイトの詳報に委ねている。GitHubアカウントを起点にした侵害は同じ週の1Passwordの件とも重なり、ソースからビルドまでの完全性をどう確かめるかが改めて問われている。","2026-11-27","dev.to","https://dev.to/threataft_dev/saps-github-got-hit-the-risk-isnt-a-data-breach-its-your-build-pipeline-5fl3"],["GitHubのAgent Host Protocol、エージェントがエディタを越える","dev.toでAlfaz Mahmud Rizve氏が、GitHubが11月17日に説明した「Agent Host Protocol（AHP）」を解説した。セッションをある場所で始めて別の場所で続けられるオープン標準で、VS Code、Copilotアプリ、モバイル、クラウドのサンドボックスをまたいでエージェントの作業を引き継げる。TypeScriptとRustで別々に実装された2つのホストや、チャネルとリデューサーによる状態管理の仕組みも紹介している。","\n【概要】\nコーディングエージェントが1つのエディタウィンドウと運命を共にする時代が終わりつつある。2026年11月27日、Alfaz Mahmud Rizve氏がdev.toに「GitHub's Agent Host Protocol: your coding agent finally outlives the editor window」を投稿した。GitHubが11月17日に説明したAgent Host Protocol（AHP）は、セッションを一か所で始めて別の場所で続けられるオープン標準だという。\n【背景】\nGitHub CopilotはVS Codeの拡張機能として始まり、ハーネスを同梱していたため、エージェントは1つのエディタウィンドウとともに生き、終わっていた。記事によればAHPの作業は2026年初めに始まり、Copilot SDKを基盤にVS Code配下の新しいエージェント基盤を作った。\n【詳細】\nホストは2チームが2言語で書いた。VS Code側はTypeScriptで約36万9000行、ローカルで動き、SSHやコンテナ、WSL、Dev Tunnels経由で他のマシンにも移せる。GitHub側はRustで約30万5000行でクラウドで動く。AHPはURIで識別するチャネルを中心に構成され、root、session、chatが必須、ターミナルやMCP、OpenTelemetryは任意だ。各チャネルはサーバーが持つリデューサー型の状態を持ち、クライアントはアクションを送る。再接続時はキューのアクションを再送し、サーバーの確認を待ってから確定する。エージェントの内部動作はあえて規定しない。\n【ポイント・注意点】\nCopilotアプリのExperimental設定やVS Codeの「Add Remote Agent Host」、code agent hostコマンドで試せる。クライアントライブラリはRust、TypeScript、Kotlin、Swift、.NET、Goで提供され、エージェントの状態を表示するマクロパッドやスマートウォッチのアプリも作られているという。仕様は公開されており、他のツールへの広がりが注目される。","2026-11-27","dev.to","https://dev.to/alfazreviews/githubs-agent-host-protocol-your-coding-agent-finally-outlives-the-editor-window-35of"],["AIの粗製PRを見分けるFairPR、実PR972件で検証","dev.toでMUHAMAD ASIF NAZEER氏が、AIエージェントによる見かけだけ整ったPRを見分けるGitHub Action「FairPR」を、10の有名OSSの実際のPR972件で検証した結果を公開した。マージされた316件は1件も保留にならなかった一方、スパムやAI slopとラベル付けされた28件で捕捉できたのは4件にとどまった。著者は差分だけでの検出には限界があり、AI利用の開示と努力の証明が必要だと主張する。","\n【概要】\nAIが書いた「それらしいが動かない」PRにOSSのメンテナーが悩むなか、人ではなくPRそのものを判定するツールの実力が数字で示された。2026年11月27日、MUHAMAD ASIF NAZEER氏がdev.toに「I tested an AI-slop PR filter on 972 real pull requests. Here's what it can and can't catch.」を投稿し、自作のGitHub Action「FairPR」の評価結果をまとめた。\n【背景】\n著者は、プロジェクトが使っていないパッケージのインポート、「// ... existing code ...」のようなプレースホルダー、頼まれていないSUMMARY.mdの追加といったAIエージェント由来のPRを例に挙げる。新規アカウントのPRを自動で閉じたり、AI支援の貢献を禁止したりする対応は、本物の初参加者まで遠ざけてしまう。\n【詳細】\nFairPRはプロジェクトの貢献ポリシーを小さなYAMLで定め、AI利用の開示行、Issueへのリンク、テスト、サイズ上限を確認する。さらに存在しないパッケージのインポートやプレースホルダー、エージェントの要約ファイル、初参加でのCIワークフロー変更などのシグナルを調べ、「verified」「needs info」「on hold」のラベルとコメントを1件付ける。PRを閉じることはない。検証対象はGodot、curl、Ghostty、Excalidraw、n8n、LangChain、Next.js、VS Code、Home Assistant、Reactで、2025年6月以降の初参加者による閉じたPRだ。保留になった割合はマージ済み316件で0.0%、未マージで閉じた628件で3.7%、スパムやAI slopとされた28件で14.3%だった。\n【ポイント・注意点】\n著者は見逃しの多くが整ったエージェントのPRで、コード上は人の作業と区別できないと認め、差分だけで確実に見抜けるツールはないとする。代わりに、AI-Assistedの開示行と、npx fairpr checkで作る変更ファイルの指紋による努力の証明を組み合わせる方向を示す。サーバーやLLM呼び出しは不要、MITライセンスで公開されている。","2026-11-27","dev.to","https://dev.to/asifnazeer24/i-tested-an-ai-slop-pr-filter-on-972-real-pull-requests-heres-what-it-can-and-cant-catch-1l53"],["Dependabotも「貢献者」？GitHub APIの思わぬ落とし穴","dev.toでTalha氏が、外部の貢献を受け入れるOSSと手つかずのIssueを探すツール「merge-radar」をJavaで作り直す過程で見つけた誤りをまとめた。DependabotのPRがauthor_associationでは「CONTRIBUTOR」と返ること、非公開のOrgメンバーが外部の人に見えること、Issue APIのsinceが作成日ではなく更新日を意味することなど、GitHub APIの思わぬ挙動を具体例とともに紹介している。","\n【概要】\nOSSに貢献したい人が「どこなら受け入れてもらえるか」を測ろうとすると、GitHub APIの細かな仕様に足をすくわれる。2026年11月27日、Talha氏がdev.toに「Dependabot Is a Contributor, and Other Things My Scripts Got Wrong」を投稿した。合計約60行のPythonスクリプト3本で取り組むIssueを探していた著者は、それをテスト付きのJavaツール「merge-radar」に作り直し、複数の思い込みに気づいたという。\n【背景】\nツールが答える問いは2つある。そのプロジェクトは外部の人のPRをマージするのか、どれくらい速いのか。そして誰も手を付けていないIssueはどれか。スコアは外部PRのマージ数、人数、マージまでの時間の中央値、判断済みの外部PRのマージ率を合算する。例としてhiero-ledger/hiero-sdk-javaは99点、keycloak/keycloakは97点、apache/cloudstackは72点で、CloudStackの待ち時間の中央値は56.6日だった。\n【詳細】\n1つ目の誤りは、DependabotのPRのuser typeは[bot]なのに、author_associationは「CONTRIBUTOR」になる点だ。今はuser typeも確認する。2つ目は、非公開のOrgメンバーもCONTRIBUTORと報告され、Keycloakの数字を押し上げていたことで、企業主導のプロジェクトでは上限値として扱うようREADMEで注意している。3つ目は、Issue APIのsinceが「作成以降」ではなく「更新以降」を意味することで、作成日で自前の絞り込みをするようにした。Issueは、オープンなPRからの参照、担当者、30日以内の作業希望コメントのいずれかがあれば「取り組み中」と判定する。\n【ポイント・注意点】\nトークンなしのGitHub APIは1時間60リクエストまでだが、ETagをSQLiteに保存してIf-None-Matchを送ると、304応答は制限に数えられず、7リポジトリの再実行で枠を消費しなかったという。APIの返り値をうのみにしない姿勢は、GitHubのデータを扱う開発者全般に参考になる。","2026-11-27","dev.to","https://dev.to/stagify/dependabot-is-a-contributor-and-other-things-my-scripts-got-wrong-4k6f"],["コミットの日付は嘘をつく、pushで「その日」を数える方法","dev.toでVishal Pandey氏が、実際のGitHubへのpushで物語が進むブラウザゲーム「Vigilante」の開発経験から、push Webhookで「その日の作業」を正しく数える方法を解説した。X-Hub-Signature-256の定数時間での検証、配信IDとコミットSHAによる重複排除、ロックファイルだけの変更の除外を経て、自己申告のコミット日時ではなく、サーバーが受信した時刻を信じるべきだと結論づけている。","\n【概要】\nコミットに記録された日時は、Gitが言われるままに書き込んだ自己申告にすぎない。2026年11月27日、Vishal Pandey氏がdev.toに「Your commit says Tuesday. It might be lying.」を投稿した。著者は実際のGitHubへのpushで物語の次の日が開くブラウザゲーム「Vigilante」を作っており、深夜0時3分のpushをどの日に数えるかという問いから話を始める。\n【背景】\nコミットは火曜夜の日付を持っていても、実際には木曜朝に作られたかもしれない。git commit --dateやGIT_COMMITTER_DATEで日付は自由に変えられ、それを使って草グラフに絵を描く人もいる。継続日数を数えるサービスにとって、どの時計を信じるかは設計の根幹になる。\n【詳細】\n第1段階は、リクエストがGitHubから来たかの検証だ。X-Hub-Signature-256はWebhookシークレットをキーにした生のボディのHMAC-SHA256で、JSONを解析する前の生バイトでハッシュを取り、MessageDigest.isEqualで定数時間比較する。GitHubが文書化したテストベクトルが通るのに本番で失敗するなら、プロキシやボディパーサーがバイトを変えている可能性がある。第2段階は重複排除で、X-GitHub-Deliveryの配信IDを保存し、本番ではデータベースのUNIQUE制約を使う。mainとreleaseの両方にpushされたコミットは2つのイベントに現れるため、distinctフラグとSHAの集合でも除く。commits配列は最大2048件だ。第3段階では、変更ファイルのない空コミットや、package-lock.json、yarn.lock、Cargo.lockなどロックファイルだけのコミットを数えない。\n【ポイント・注意点】\n第4段階として、著者が信頼する唯一の時計は、サーバーがpushを受け取った瞬間だ。それをユーザーのタイムゾーンで日付に振り分けるため、0時3分のpushは翌日に数えられ、23時58分に書いたコミットは前日分にならない。「pushした日が出荷した日」という考え方は、連続記録を扱うサービス設計の指針になる。記事は著者自身のサービスの宣伝で締めくくられている。","2026-11-27","dev.to","https://dev.to/vishal_vigilante/your-commit-says-tuesday-it-might-be-lying-1h0g"],["Copilot FusionがTerminal-Bench 4.1で首位と分析","dev.toでShamuddin氏が、GitHub Copilot Fusion Maxが11月17日に公開リーダーボードTerminal-Bench 4.1で71.2%を記録し首位に立ったと解説した。記事によると、Fusionはモデルではなくルーターで、Claude Opus 5.5とFable 5.2を5.4ポイント上回りつつ、ステップごとに安価なモデルを選ぶことで実行コストを抑えたという。料金プランや試し方、数値の信頼区間についても触れている。","\n【概要】\n単一の最強モデルではなく、複数のモデルを使い分けるルーターがエージェントのベンチマークで首位に立った、とする分析がdev.toに載った。2026年11月27日、Shamuddin氏が「Copilot Fusion Beats Opus 5.5, Fable 5.2 on Terminal-Bench 4.1」を投稿した（元記事はaitecharchive.com）。記事は、GitHub Copilot Fusion Maxが11月17日にTerminal-Bench 4.1の公開リーダーボードで71.2%のタスクを解決し、初めて70%を超えたと伝える。\n【背景】\n記事によればFusionはモデルではなくルーターで、各ステップを3つの方式に振り分ける。1つのモデルが処理するSingle、効率的なモデルが下書きして判定役が格上げを決めるCascade、並列の批評を集約して元のモデルが修正するCritiqueだ。\n【詳細】\n記事が11月18日に取得したとする表では、Fusion（max）が71.2%、33億トークン、約2000ドル。Opus 5.5（max）とFable 5.2（max）は65.8%で並び、実行コストは約4700ドルと約1万6500ドルで、Fable 5.2は157億トークンを使った。95%信頼区間はFusionが±2.9%、Opus 5.5が±3.1%で、著者は順位は「おそらく本物だが盤石ではない」とする。10月下旬のローンチ時には、Artificial AnalysisのCoding Agent IndexでFusionはOpus 5.5を使うClaude Codeより約2ポイント低い一方、タスクあたりのコストは5.59ドル対11.42ドルだったとも紹介している。\n【ポイント・注意点】\n記事の料金表ではCopilot Proが月10ドル、Pro+が39ドル、Maxが100ドル。各モデルは標準料金で課金され、Fusionのモデル費用には2026年11月30日まで30%の割引があるという。FusionはVS CodeやVisual Studio、Copilot CLIのモデル選択から使え、企業の管理者は無効にもできる。記事はAIの支援で下書きし著者が事実確認したと明記しており、数値は一次情報との照合が望ましい。","2026-11-27","dev.to","https://dev.to/shamuddin/copilot-fusion-beats-opus-55-fable-52-on-terminal-bench-41-13dg"],["署名タグ1つからLinuxアプリを5形式で配布する仕組み","dev.toでfreerave氏が、ファイル変換アプリDotMorphをpipx、AppImage、.deb、Arch、AURの5形式で、1つの署名付きタグから配布するGitHub Actionsの仕組みを公開した。約4分で終わるリリース工程に加え、AppImageが109MBから73MBに縮むまでの試行錯誤や、AppImageHubの審査ボットで失敗した原因である不足ライブラリの特定と対処の手順を詳しく記している。","\n【概要】\nvX.Y.Zのタグを1つ打つだけで、5種類のLinuxパッケージが署名付きで公開される。その裏側には地道なバグ潰しがあった。2026年11月27日、freerave氏がdev.toに「Shipping a Linux app five ways from one signed tag」を投稿した。連載「Building DotMorph」の第4回で、ファイル変換アプリDotMorphの配布パイプラインを解説している。\n【背景】\nDotMorphはpipx、AppImage、.deb、Archパッケージ、AURの5形式で配布される。Flatpakはあえて用意していない。ffmpegやLibreOfficeをシステムから呼び、ファイルマネージャーとの連携やグローバルホットキー、systemdのユーザーユニットを使うため、サンドボックスがそれを妨げるからだという。\n【詳細】\nrelease.ymlは、Python 3.10、3.12、3.13でのテスト、全パッケージのビルドとスモークテスト、SHA256SUMSと各ファイルのGPG署名、GitHub Release、PyPI、AURへの公開の順に進み、全体で約4分かかる。PyPIはトラステッドパブリッシングでAPIトークンを置かず、タグはgit tag -sで署名する。AppImageでは3つのバグがあった。PySide6の版指定の「<」がシェルでリダイレクトと解釈された問題、デスクトップファイルの最後のName=行が使われて名前がSettings-x86_64.AppImageになった問題、そして109MBという大きさだ。中身357MBのうち272MBがPySide6で、不要なツールを削って73MBまで縮めた。AppImageHubのボットでは「11秒で終了した」と失敗し、原因はlibxkbcommon-x11.so.0などの不足だった。AlmaLinux 8から16のライブラリを同梱し、増加は1.1MBで済んだ。\n【ポイント・注意点】\n著者は、利用者のマシンで試す、削除処理には「残すべきもの」の確認を入れる、すべてに時間制限を設ける、リリースを退屈なものにするといった教訓を挙げる。自分のCIには必要なライブラリが入っていたため問題に気づけなかったという指摘は示唆に富む。","2026-11-27","dev.to","https://dev.to/freerave/shipping-a-linux-app-five-ways-from-one-signed-tag-54kf"],["1Password侵害に学ぶ、CI/CDパイプラインの5つの点検","dev.toでPassworkチームが、1Passwordが11月25日に公表した侵害を題材に、GitHubアカウント1つが本番環境に届くまでの経路と、自社のパイプラインで確認すべき5つの項目を整理した。OWASPのCI/CDリスクに沿って、レビューなしのデプロイ、改ざんされたパイプラインの実行、盗まれたデプロイ用認証情報という3つの経路を示し、承認の必須化やOIDCへの移行などを勧めている。","\n【概要】\n開発者1人のトークンで本番まで届いてしまう構成は、多くの組織に潜んでいる。2026年11月27日、Passwork Teamがdev.toに「One GitHub token reached the backend: 5 pipeline checks after the 1Password breach」を投稿した。11月25日に1Passwordが公表したインシデントでは、攻撃者が従業員の企業GitHubアカウントにアクセスし、プライベートリポジトリのコードを読み、バックエンドに悪意あるコードをpushした。そのサービスが一部顧客のアカウント記録をダウンロードし、攻撃者はCI/CDにも到達したという。\n【背景】\n記事はGitGuardianのState of Secrets Sprawl Report 2026を引き、分析した侵害端末の59%が個人の作業端末ではなくCI/CDランナーだったと紹介する。PATはパスワードの代わりに使われるためMFAの確認は出ない。またGitHubの指針では、書き込み権限を持つ人はリポジトリのシークレットをすべて読めるとされる。\n【詳細】\n記事はOWASP Top 10 CI/CD Security Risksに沿って3つの経路を示す。レビューされないコードがデプロイに流れる経路は、管理者にも適用される第2の承認者で閉じる。編集したパイプラインファイルをCIがシークレット付きで実行する経路は、レビュー必須で保護ブランチだけを受け付ける環境で閉じる。盗まれたデプロイ用認証情報の経路は、ジョブごとの短命なOIDC認証情報と、本番がCIのビルドと異なる場合の警告で閉じる。そのうえで5つの点検項目を挙げる。本番に届くブランチ、タグ、手動トリガーの洗い出しと承認の必須化、ルールを迂回できる人の確認、デプロイ用シークレットの環境への移動、長期のクラウドキーからOIDCへの置き換え、そして組織に届くPATの棚卸しだ。\n【ポイント・注意点】\n各対策はリポジトリやブランチ、環境ごとに設定するため、管理者の例外1つ、保護のないブランチ1つ、長期のシークレット1つで穴が開くと記事は警告する。そして、デプロイやシークレットの読み取り、レビューの回避ができる開発者のトークンこそ最初に塞ぐべき穴だとまとめている。","2026-11-27","dev.to","https://dev.to/passwork_team_fd7bbec6480/one-github-token-reached-the-backend-5-pipeline-checks-after-the-1password-breach-2pci"],["Xbox SeriesのゲームをPCで動かすRust製互換レイヤー","dev.toのGitHubOpenSourceが、Xbox SeriesのゲームをWindows PCのハードウェア上で動かすことを目指す、実験的なRust製互換レイヤー「victory-fork」を紹介した。独自のDirect3D 12バックエンドとシェーダー再コンパイラーを備え、記事掲載時点でスターは3280、フォークは988。一方で動作は実験段階の毎秒11フレームとされ、安定した一般のゲームプレイ向けではないと注意している。","\n【概要】\n家庭用ゲーム機のタイトルをPCで動かそうとするオープンソースの試みが、GitHubで多くのスターを集めている。2026年11月27日、GitHubOpenSourceがdev.toに「Run Xbox Series games on PC - open-source Rust compatibility layer」を投稿し、GitHubで公開されている「victory-fork」を紹介した。Xbox SeriesのゲームをWindows PCのハードウェア上でネイティブに動かすための、実験的なRust製互換レイヤーだという。\n【背景】\n記事はこのプロジェクトを、ゲーム機向けのゲーム資産とWindowsのハードウェアの間をつなぐ翻訳レイヤーと説明する。独自のDirect3D 12バックエンドとシェーダー再コンパイラーを使い、タイトルのメモリーを処理してグラフィックスパイプラインを対応づけ、実際のゲーム機なしにデスクトップのGPUで直接コードを実行するとしている。記事掲載時点のリポジトリはスター3280、フォーク988で、言語はRust、ライセンスはGPL-3.0だ。\n【詳細】\n主な特徴として記事は5点を挙げる。Windowsで実行するためのDirect3D 12翻訳バックエンドとシェーダー再コンパイラー、シェーダーの書き込みによるメモリーページの変化に対するマスク付きパッチ、増幅ステージを使ってCPUの負荷を減らす間接メッシュ描画、DREDによる障害追跡やパイプラインのブラックリスト化といった診断用スイッチ、そしてパイプラインの実行前に行うマルチスレッドでのテクスチャ確認だ。始めるには、リポジトリをクローンし、最新のRustツールチェーンとDirect3D 12に対応したGPUを用意する。ゲームのファイルは含まれておらず、利用者が自分で用意する必要がある。\n【ポイント・注意点】\n記事は、このプロジェクトが開発者や研究者向けで、安定した気軽なゲームプレイ向けではないと明記し、動作は実験段階の毎秒11フレームだとする。内容はREADMEとメタデータからまとめたもので、実際には試していないとも断り、本番で使う前にサンドボックスで評価するよう勧めている。シェーダーのコンパイルとメモリーページの保護のどちらが速度の足かせかを読者に問いかけている。","2026-11-27","dev.to","https://dev.to/githubopensource/run-xbox-series-games-on-pc-open-source-rust-compatibility-layer-13lj"],["コードレビューの深さを測る、GitHubの3つの数字","dev.toで4thwithme氏が、コードレビューが本当に読まれているのか、承認ボタンを押しただけなのかを見分けるため、GitHubから取れる3つの数字を提案した。レビューあたりのコメント数、PRあたりのコメント数、解決済みスレッドの割合で、GraphQL APIのどのフィールドから取得できるかも示している。数字は他人とではなく、自分の過去と比べることを勧めている。","\n【概要】\n「レビュー済み」の件数は増えていても、その中身が伴っているとは限らない。2026年11月27日、ソフトウェアエンジニアリングマネージャーを名乗る4thwithme氏がdev.toに「How deep are your code reviews? Three numbers from GitHub」を投稿した。コードレビューには、きちんと読む場合と承認ボタンを1回押すだけの場合があるのに、多くの統計は両方を同じ1件として数えてしまう、という問題意識から出発している。\n【背景】\nPRの数やレビューの件数は分かりやすい指標だが、それだけでは議論の質は見えない。記事は、その違いを浮かび上がらせるための3つの数字を提案する。いずれもGitHubのデータから取れるもので、特別な仕組みを導入しなくても、自分やチームのレビューの振り返りに使えるという立場だ。\n【詳細】\n1つ目は「レビューあたりのコメント数」だ。自分が行ったレビューに付けたインラインコメントを数えてレビュー数で割り、さらにコメントなしの承認を数える。5行の修正にコメントがないのは問題ないが、大きなPRにコメントがないのは理由を尋ねるべきサインだという。2つ目は「PRあたりのコメント数」で、自分のPRがどれだけ議論されたかを見る。極端に少なければ誰も読んでいない可能性があり、極端に多ければPRが大きすぎるか分かりにくい可能性がある。3つ目は「解決済みスレッド」で、自分のPRのレビュースレッドのうち解決済みの割合から、指摘に応えているかが分かる。ただしResolveを押さない文化のチームもあるため、他人ではなく自分の過去と比べるよう勧めている。\n【ポイント・注意点】\n取得方法として、GraphQL APIでPRごとにreviews { comments { totalCount } state }とreviewThreads { isResolved }が得られ、マージ済みのPRと自分が行ったレビューをたどればよいと説明する。記事の最後では、これらの数字をGitHubアカウントから集計する著者のツールShowOfferを紹介している。掲載画像は架空の人物のサンプルデータで、実在のリポジトリの数字は示されていない点に注意したい。","2026-11-27","dev.to","https://dev.to/4thwithme/how-deep-are-your-code-reviews-three-numbers-from-github-4iil"],["piyolog、1Passwordへの不正アクセスの経緯を整理","セキュリティインシデントの解説で知られるpiyologが、1Passwordが11月25日に公表した不正アクセスの経緯をまとめ、はてなブックマークで注目を集めた。従業員の業務用GitHubアカウントを足がかりに、バックエンドへの悪意あるコードのpush、顧客情報のダウンロード、CI/CDへのアクセスに至った流れと、流出した情報としなかった情報、まだ公表されていない点を整理している。","\n【概要】\nパスワード管理の大手で起きた侵害は、GitHubアカウント1つから始まった。2026年11月26日、piyokango氏のブログpiyologが「1Passwordへの不正アクセスについてまとめてみた」を公開し、はてなブックマークで広く読まれた。1Passwordは2026年11月25日、従業員のGitHubアカウントへの不正アクセスによって、バックエンドシステムから一部顧客のアカウント情報が取得されたと発表した。同社は11月19日、攻撃者が従業員の業務用GitHubアカウントにアクセスした兆候を受けて調査を始めていた。\n【背景】\n記事は攻撃の流れを4段階で整理する。攻撃者は業務用のGitHubアカウントにアクセスし、それを使ってソースコードに到達、バックエンドサービスに悪意あるコードをpushした。そのコードによってサービスが顧客の管理データをダウンロードした。さらにプライベートリポジトリのコードを複製し、CI/CDにもアクセスした。1Passwordは複製されたコードに顧客データや利用者の秘密情報は含まれないとし、露出の可能性がある内部の認証情報をすべてローテーションまたは失効させたという。\n【詳細】\n一部の利用者で流出したのは、氏名とメールアドレス、アカウントとユーザーの識別子、作成日時と最終サインイン日時、公開鍵、SRPパラメーター、招待やプロビジョニング、復旧のメールに含まれる一部のトークンなどだ。一方、保管庫とその中身、保管庫の鍵、アカウントパスワードとSecret Key、アプリやブラウザー拡張は影響を受けていない。利用者に設定やパスワードの変更は求めていない。トークンの悪用にはSSOか登録メールに届くコードが必要で、同社はこのコードを6桁から英数字10文字に延ばした。\n【ポイント・注意点】\n記事の脚注は、認証情報の入手経路、失効させたトークンの種類、悪意あるコードが入ったサービス、それが本番に届いた経路、侵入の開始時期を1Passwordがまだ明らかにしていないと指摘する。同社は独立した専門家と調査を続けており、根本原因の分析がどこまで示されるかが焦点になる。","2026-11-26","piyolog（はてなブログ）","https://piyolog.hatenadiary.jp/entry/2026/11/26/153937"],["Trendingを自作したら同一バイナリを配る6リポを発見","dev.toでFelixwang007氏が、github.com/trendingが手元で開けなかったためAPIから「トレンド」を再構築したところ、上位30件のうち6件が別の名前を名乗りながら同じWindows実行ファイルを配布していたと報告した。フォーク数の少なさ、スターが付く間隔の機械的な規則性、配布zipの中身の一致という3つの手がかりを示し、判定用のPythonスクリプトも公開している。","\n【概要】\nスター数でにぎわうリポジトリが、実は同じバイナリを名前だけ変えて配っていた。2026年11月26日、Felixwang007氏がdev.toに、GitHub TrendingをAPIで再構築して6つの「別々の」アプリが同じバイナリを配っていたのを見つけたとする記事を投稿した。直近7日間に作られスターが50を超えるリポジトリを検索すると1303件あり、上位30件を調べると6件（20%）が1つのキャンペーンだったという。6アカウント、6つの「製品」、1つのバイナリで、スターの合計は6418だった。\n【背景】\nきっかけは、github.com/trendingが著者のマシンから読み込めなかったことだ。curlでの確認ではトレンドのページが20秒でタイムアウトする一方、APIは0.29秒ほどで応答した。そこで、作成日が新しくスターの多いリポジトリを検索APIで並べ、トレンドの代わりにした。\n【詳細】\n1つ目の手がかりはフォークだ。6件のスターは1298から719で、フォークは0〜2件、いずれも11月23日に作成されpushされていた。2つ目はスターの間隔で、直近100件のスター付与の間隔の中央値を平均で割った値が、6件は0.058〜0.171、ほかの21件は0.351〜1.111だった。4件は最初の5回の間隔がおよそ37秒だった。3つ目は配布物で、各zipは1,996,132〜1,996,164バイトと32バイトしか違わず、中身は1,050,048バイトでCRCも同じexeと、同一のlibvlc.dllだった。zipのサイズの差は、中のファイル名の長さの差の2倍と一致した。\n【ポイント・注意点】\n著者はバイナリを実行しておらず、ハッシュと文字列を調べただけで、悪意があるとも同じ法人によるものとも断定していない。コード署名されていることも安全の証拠にはならないとする。フォーク対スター、間隔の比率0.2未満、配布物の一致を調べる約60行のスクリプトも示しており、スター数を信頼の指標にする危うさを改めて浮かび上がらせた。","2026-11-26","dev.to","https://dev.to/felixwang007/i-rebuilt-github-trending-from-the-api-and-caught-six-different-apps-shipping-the-same-binary-4m06"],["他人にCIでコードを実行させる3つの過ちとpatchlint","dev.toでRubahAnomali氏が、GitHub Actionsで外部の人に自分のCI上でコードを実行させてしまう典型的な3つの過ちを解説した。Issueのタイトルを埋め込んだスクリプトインジェクション、タグによるアクションの固定、pull_request_targetでPRのコードをチェックアウトする「pwn request」だ。それぞれの対策とともに、これらを検出する自作の小さなリンター「patchlint」も紹介している。","\n【概要】\nCIにはシークレットや公開用のトークン、リポジトリへの書き込み権限が集まる。だからこそ、誰がワークフローに自分のコードを実行させられるかが重要になる。2026年11月26日、RubahAnomali氏がdev.toに「3 GitHub Actions mistakes that let strangers run code in your CI (and a small linter that catches them)」を投稿した。\n【背景】\n1つ目の過ちはスクリプトインジェクションだ。新しいIssueに挨拶するワークフローで、echoの中にgithub.event.issue.titleの式を直接書くと、GitHubがシェルの実行前に値を埋め込むため、curlとshを組み合わせたタイトルのIssueを立てるだけでランナー上でコードが動く。値はenv:の変数で渡し、スクリプトでは$TITLEとして使うのが対策だ。\n【詳細】\n2つ目はタグでの固定だ。@v3のようなタグは所有者が付け替えられる。2025年3月には広く使われるtj-actions/changed-filesが侵害され、タグが悪意あるコードに付け替えられてシークレットがログに出力された。著者は40文字のSHAで固定し、バージョンはコメントで残し、更新はDependabotに任せるよう勧める。3つ目は、ベースリポジトリのシークレットと書き込み可能なトークンで動くpull_request_targetで、PRのhead SHAをチェックアウトしてnpm ciやnpm testを実行するパターンだ。著者はこれを「pwn request」と呼び、信頼できる処理と信頼できないコードを別のワークフローに分けるよう助言する。\n【ポイント・注意点】\npatchlintはpip install patchlintで導入し、patchlint scan .でワークフローやDockerfile、docker-composeを調べて行番号付きで指摘する。SARIF出力やGitHub Actionとしての提供もある。著者は若く小さなプロジェクトだとし、成熟した選択肢としてzizmorやhadolintも挙げる。ルールは2日で2個から16個に増え、MITライセンスで初めての貢献者も歓迎している。","2026-11-26","dev.to","https://dev.to/rubahanomali/3-github-actions-mistakes-that-let-strangers-run-code-in-your-ci-and-a-small-linter-that-catches-5eab"],["デプロイ成功なのに赤い×、cancel-in-progressの罠","dev.toでMohamed Gado氏が、3日間にわたってmainブランチのコミットの大半に赤い×が付いたのに、実際のデプロイは30件すべて成功していた原因を解説した。原因はconcurrencyのcancel-in-progressで、キャンセルされた実行が失敗のように表示されていた。著者はキャンセルをやめ、待機後にコミットがmainの先頭かを確かめる方式に切り替え、その手順を示している。","\n【概要】\n失敗していないのに、コミット一覧が赤い×で埋まる。GitHub Actionsでよく使われる設定が、思わぬ誤解を生んでいた。2026年11月26日、Mohamed Gado氏がdev.toに「Why GitHub shows a red X on commits whose deploys succeeded: cancel-in-progress」を投稿した。3日間、サイトのmainブランチのコミットの多くに赤い×が付いたが、その期間のCloudflareのビルドは30件中30件が成功していた。×の正体は「1秒後にキャンセル」された実行だった。\n【背景】\n著者のサイトは、GitHub ActionsからCloudflare Workers Buildsのデプロイフックを呼んで公開している。10分で5回pushすることも珍しくないため、DEBOUNCE_SECONDSを180秒にして待機し、productionというconcurrencyグループのcancel-in-progress: trueで待機中の実行を捨てていた。その結果、連続したpushの最後以外のコミットにはキャンセルされた実行が残った。キャンセルは成功ではないため、コミット単位の集計では赤い×になる。\n【詳細】\n著者は、ワークフローの結果にfailureがないこと、Cloudflareのビルドが全件成功したこと、キャンセルされた実行が別の実行の開始と同じ秒だったことの3層で原因を確かめた。修正ではconcurrencyブロックを削除し、待機後にgh apiでmainの先頭のSHAを取得し、自分のコミットでなければ通知を出して終了コード0で抜けるようにした。手動実行では待機を0秒にする。これで置き換えられた実行は緑になり、先頭だけがデプロイされる。追加のシークレットは不要だ。\n【ポイント・注意点】\n非公開リポジトリでは1回のpushあたり約4分の課金時間がかかるが、月2000分の無料枠の範囲だという。著者は、PRのチェックではcancel-in-progressは良い既定値だとしつつ、コミット一覧をデプロイの記録として読むブランチでは避けるべきだとまとめる。「1秒後にキャンセル」はビルドの故障ではないという指摘は、同じ症状に悩む人の助けになる。","2026-11-26","dev.to","https://dev.to/mohamedgado/why-github-shows-a-red-x-on-commits-whose-deploys-succeeded-cancel-in-progress-9c2"],["社外ホストでの仕事をGitHubの草に映すgreenbridge","dev.toでsorfeb氏が、GitLabやBitbucket、社内サーバーなどGitHub以外でのコミットをGitHubのコントリビューショングラフに反映するGo製ツール「greenbridge」を公開した。ローカルのクローンからコミットのメタデータを読み、自分の非公開ミラーリポジトリに中身のない日付付きコミットを書き込む仕組みで、コードやメッセージは外に出さない。著者自身の数字や注意点も示している。","\n【概要】\n毎日忙しく働いているのに、GitHubのプロフィールは真っ白。そんなギャップを、コードを一切外に出さずに埋めようとするツールが登場した。2026年11月26日、sorfeb氏がdev.toに「Busy at work, empty on GitHub: show your work commits on your contribution graph」を投稿し、自作のgreenbridge（コマンド名gbridge）を紹介した。MITライセンスのGo製単一バイナリで、v0.1.0は2026年11月に公開されたという。\n【背景】\nGitLab、Bitbucket、Gitea、Forgejo、オンプレミスのサーバー、GitHub Enterprise Serverでの作業はGitHubのグラフに表示されない。GitHubがコミットを数えるのは、GitHubがホストするフォーク以外のリポジトリの既定ブランチにあり、作者のメールがアカウントと一致する場合に限られるからだ。記事は、github.comの組織での業務や、非公開の貢献を表示する設定で足りる場合は不要だとも説明している。\n【詳細】\ngbridgeはローカルのクローンからgitを呼び出してコミットのメタデータを読み、ホストのAPIやトークンは使わない。仕事用のメールに一致するコミットごとに、自分が所有する非公開のミラーリポジトリへ中身のない過去日付のコミットを1つ書く。外に出るのはタイムスタンプと、秘密の値から作る12文字のIDだけで、コード、差分、ファイル名、メッセージ、リポジトリ名は手元に残る。著者はGitHub以外のホストの2292件のコミットを反映し、12か月の貢献数は6994から9268（33%増）、直近9週は1799から4073、最長連続記録は82日から95日になったという。\n【ポイント・注意点】\n著者は、空白の穴埋めや連続記録の水増し、模様描きはしないとし、GitHubの利用規定の範囲内に収まる設計だと説明する。一方で、雇用主によってはタイムスタンプすら社内情報とみなすため、反映する前に雇用契約を確認するよう呼びかけている。PRやIssue、レビューは反映されない。まずgbridge planで何が欠けているかを確かめることを勧めている。","2026-11-26","dev.to","https://dev.to/sorfeb/busy-at-work-empty-on-github-show-your-work-commits-on-your-contribution-graph-49nc"],["タブ1つで3つのLinux VMと別々のブラウザを動かす","Hacker NewsのShow HNに、1つのURLをFirefox、Chromium、Epiphanyで並べて開ける「sidebyside」が投稿され、149ポイントを集めた。各ブラウザーはWebAssemblyで動くLinux VMの中で実行され、サーバーを持たない静的ページとしてGitHub Pagesで提供される。コメント欄では、ネットワーク接続の仕組みや、WebAssemblyによる隔離の安全性を巡る議論が交わされた。","\n【概要】\n複数のブラウザーでの表示確認を、タブ1つで済ませられる。しかも中身はブラウザー内で起動する本物のLinuxだ。2026年11月26日、michidk氏がHacker NewsのShow HNに「Show HN: Three Linux VMs in a browser tab, each running a different browser」を投稿し、149ポイント、33件のコメントを集めた。リンク先は、1つのURLを複数のブラウザーで並べて開くサービス「sidebyside」だ。\n【背景】\nGitHubリポジトリの説明によると、Firefox、Chromium、Epiphanyなどで同じURLを並べて開き、それぞれが本物のブラウザーとして、タブ内のWebAssembly上のLinux VMで動く。サーバーを持たない静的ページで、mainへのpushのたびにGitHub Pagesへデプロイされる。8GiB以上のメモリを積んだデスクトップでサイトを開き、URLを入れてOpenを押すだけで使え、初回はブラウザーのダウンロードに1〜3分かかる。\n【詳細】\nVMはLinuxカーネルをWebAssemblyにコンパイルしたunkernelで、ブラウザーはcache.nixos.orgから必要に応じて取得するnixpkgsのビルドだ。ゲストのTCP通信は公開のWispリレーを通る。ChromiumはDevTools Protocol、FirefoxはWebDriver BiDiで操作する。制約として、初回は既定の3ブラウザーで約800MiBをダウンロードし、GPUを使わないソフトウェア描画のみで、各ブラウザーにタブのメモリが約2GiB必要になる。ライセンスはApache-2.0かMITの選択制だ。\n【ポイント・注意点】\nコメント欄では、trynixやunkernelを土台にしているのではという指摘に作者が同意した。VMは起動するがサイトにつながらないという報告には、公開のWispリレー経由で通信する仕様だとREADMEを引いた説明が返された。C言語のコードをWASMで動かしても期待するほどの隔離にはならないとの批判と、それへの反論もあり、ブラウザー内の仮想化の実用性と安全性が議論になっている。","2026-11-26","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50656036"],["iOSシミュレーターをFinderに出すSimDropがHNで話題","Hacker NewsのShow HNで、起動中のiOSシミュレーターをmacOSのFinderサイドバーに表示し、ファイルをドラッグで出し入れできるアプリ「SimDrop」が51ポイントを集めた。写真や動画はsimctlで取り込まれ、その他のファイルはDownloadsに入る。File Providerの拡張機能とバックグラウンドのヘルパーで構成され、GPL-3.0のオープンソースとしてGitHubで公開されている。","\n【概要】\niOSアプリの開発でシミュレーターに画像やファイルを渡す手間を、Finderへのドラッグだけで済ませるツールが登場した。2026年11月26日、rxliuli氏がHacker NewsのShow HNに「Show HN: SimDrop – Running iOS simulators in the macOS Finder sidebar」を投稿し、51ポイント、10件のコメントを集めた。リンク先はGitHubのrxliuli/sim-dropリポジトリだ。\n【背景】\nREADMEによると、SimDropは起動中のiOSシミュレーターをFinderのサイドバーに表示するmacOSアプリだ。起動しているシミュレーターごとにフォルダーができ、「Photos and Videos」と「Downloads」が並ぶ。画像はsimctl addmediaで取り込まれ、メディア以外のファイルはDownloadsに入る。ドラッグは既定で移動になり、Optionキーを押しながらだとコピーになる。\n【詳細】\n構成は、設定用のSimDrop、FSEventsとXPCを使うlaunchdエージェントのSimDropHelper、NSFileProviderReplicatedExtensionを実装したSimDropFileProviderの3つだ。写真の削除ではPhotos.sqliteを直接編集しており、この方法は非公式だと明記されている。Swiftで書かれ、XcodeGenを使い、リリースはGitHub Actionsで行う。インストールはHomebrewのcaskかGitHub Releasesのdmgで、macOS 15以降が必要だ。導入後に一度アプリを開き、バックグラウンドサービスとFinder拡張を許可する必要がある。対象はシミュレーターのみで、実機には対応しない。\n【ポイント・注意点】\nコメント欄では、XcodeGenを使う理由を尋ねる質問や、スクリーンショットが少なくとも1枚は欲しいという要望が出た。写真を外にドラッグするとシミュレーター側から消えるのかという疑問や、Finder拡張ではなくFSKitを使わなかった理由を問う声もあった。ライセンスはGPL-3.0で、今後の改良にも注目が集まりそうだ。","2026-11-26","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50657070"],["静的サイトの予約投稿を毎日1回のcronで、78本も再日付け","dev.toでSikandar Bro氏が、CMSもデータベースもない静的サイトで記事を予約公開する方法を紹介した。記事の日付を公開日としても使い、ビルド時に未来の日付の記事を飛ばすだけで、GitHub Actionsのcronが毎日1回走れば当日の記事が自動で公開される。必要なのは「約10行のコードとcron 1行」だという。さらにSearch Consoleを見て、公開待ちだった78本を1日1本に詰め直した経緯も書いている。","\n【概要】\nサーバーのない静的サイトで、記事を未来の日に公開するにはどうすればよいか。2026年11月27日、Sikandar Bro氏がdev.toで、毎日1回動くGitHub Actionsのcronでこれを解いた方法を公開した。答えは「約10行のコードとcron 1行」だという。後半では、公開待ちの78本の記事を詰め直した話も紹介している。\n【背景】\n筆者が運営する14FreeToolsは素朴な静的サイトだ。Pythonのスクリプトがposts/フォルダのHTMLを読んでsite/に書き出し、GitHub ActionがFTPでアップロードする。CMSもデータベースもないため、決まった時刻に記事を公開に切り替える仕組みがなかった。\n【詳細】\n各記事の先頭にはHTMLコメントでtitle、description、date、toolsを書き、dateを表示用の日付と公開日の両方に使う。ビルドはAsia/Karachiのタイムゾーンで今日の日付を求め、それより未来の記事とstatusがdraftの記事を飛ばす。飛ばした記事はサイトマップや一覧、関連記事にも出ない。GitHubのランナーはUTCで動き、読者のいるパキスタンは5時間進んでいるため、タイムゾーンを固定しないと深夜に1日ずれる。ゼロ埋めのYYYY-MM-DD形式なら、文字列のまま比較できる。既存のデプロイ用ワークフローには「35 9 * * *」のscheduleを足した。毎時0分の実行は混み合って遅れることがあるため、35分にしたという。\n続けて筆者はGoogle Search Consoleを見て、月・水・金の予定で2027年半ばまで78本が待っているのに、公開済みは7本だけだと気づいた。そこで順番を保ったまま、翌日から1日1本に日付を振り直すスクリプトを書いた。変更は78か所の1行ずつで、PRで確認しやすかった。\n【ポイント・注意点】\n唯一の落とし穴は、今日公開する記事から来週の記事へリンクすると404になる点だ。リンク先はツールか、自分より前の日付の記事に限る。日付を振り直すときも順番を保てば、このルールは崩れない。筆者は、記事をPRでレビューできること、予約に費用がかからないこと、取り下げがrevertで済むことを利点に挙げる。分単位での公開はできないが、ブログなら十分だとしている。","2026-11-27","DEV Community","https://dev.to/sikandar_bro_0db8c99c4a7c/scheduling-posts-on-a-static-site-with-one-daily-github-actions-cron-and-how-i-re-dated-78-of-them-b20"]],"elec":[["ShiMetaPi、1TOPSのNPUを載せたAIビジョン向け小型ボード「Pico-G1」","中国ShiMetaPiが、GOKEのカメラ向けSoC「GK7206」を載せた小型Linuxボード「Pico-G1」を出した。1.0TOPSのNPUと4K入力に対応したISPを備え、顔認識や動体検知のAIサンプルも公開されている。AliExpressで39ドルから買える。ただしSDKは2026年12月にサポートが終わる予定のLinux 5.10がベースで、CNX Softwareは長く使う場合の注意点として挙げている。","\n【概要】CNX Softwareは2026年11月27日、ShiMetaPiの小型Linuxボード「Pico-G1」を紹介した。GOKEのカメラ向けSoC「GK7206」を搭載し、1.0TOPSのNPUでAIビジョン処理を行える開発ボードだ。EthernetとMIPI CSIのカメラコネクタを備え、基板は72.2×21mmの4層基板に収まっている。\n【背景】記事によると、GOKEの公式サイトにはGK7608、GK7605、GK7205しか載っておらず、GK7206の情報は見当たらなかった。一方でボードの英語ドキュメントとGitHubリポジトリは充実しており、顔認識や動体検知といったAIサンプルも含まれる。外観と構成はRockchip RV1106系のLuckFox Pico Pro/Maxによく似ており、同じ市場を狙う競合製品と位置づけられている。\n【詳細】CPUは最大1.0GHzのデュアルコアCortex-A7で、最大400MHzのRISC-Vコプロセッサも持つ。ISPは最大3840×2160・20fpsの入力に対応する。メモリはSoC内蔵のDDR3Lで、GK7206V11Aが128MB、GK7206V12Aが256MB。ほかに16MBのNORフラッシュ、microSDスロット、10/100MbpsのEthernet、給電と書き込みを兼ねるUSB 2.0 Type-C、20ピンGPIO×2、リセットとブートのボタン、ユーザーLED、RTC電池コネクタを備え、電源はUSB経由の5V。AliExpressの複数の店で39ドルから販売され、RTC電池とピンヘッダが付く。カメラ付きのセットもあるが、カメラの解像度は分からない。中国国内の価格は128MB版が198元（約29ドル）、256MB版が375元（約56ドル）。\n【ポイント・注意点】SDKは古いLinux 5.10とU-Boot 2020.01がベースで、Linux 5.10は2026年12月にサポート終了の予定だ。長く運用する機器に使うなら、この点を考えておく必要がある。記事のコメント欄には価格が高いという声もある。カメラAIを小さく試せる候補が1つ増えたが、似た構成のLuckFox系と比べてから選びたい。","2026-11-27","CNX Software","https://www.cnx-software.com/2026/11/27/shimetapi-pico-g1-a-compact-ai-vision-linux-sbc-powered-by-goke-gk7206-4k-camera-soc/"],["お礼を言うとM5Stackが笑う、MCPでClaudeに表情を任せた作例","柚もなかさんは、Claude Codeにお礼を言うと机の上のM5Stackが笑顔になる仕組みを作り、noteで紹介した。PC上の自作MCPサーバーがHTTPでM5Stackに合図を送り、笑顔は10秒続く。ポイントは「いつ笑うか」をプログラムに書かず、ツールの名前と説明を渡されたClaude自身が、使うかどうかを決めているところだ。ソースコードと設定方法は次回に回すとしている。","\n【概要】柚もなかさんは2026年11月27日、MCP（Model Context Protocol）を使って、Claudeの「気持ち」をM5Stackの顔で表す作例をnoteに書いた。Claude Codeにお礼を伝えると、Claudeが「うれしい場面だ」と判断してツールを呼び、机の上のM5Stackが10秒間笑顔になり、その後いつもの顔に戻る。\n【背景】生成AIは画面の中で文章を返すのが普通だが、記事のタイトルは「生成AIが物理世界に手を伸ばす」。MCPは、AIが外部のツールを呼び出すための仕組みだ。これを使えば、AIの判断を電子工作の機器の動きにつなげられる。作者は、その最小の例として「表情」を選んだ。\n【詳細】構成はPCとM5Stackで、両者はWi-Fiでつながる。PC側では、Pythonで書いた小さな自作MCPサーバーが動いている。サーバーには「react」という機能があり、呼ばれるとHTTPでM5Stackに「happy」という合図を送る。流れは4段階だ。(1)ユーザーがお礼を書く。(2)Claudeがうれしい場面だと判断してreactを呼ぶ。(3)MCPサーバーがM5Stackに合図を送る。(4)M5Stackが10秒間笑う。M5Stackは合図が来たら顔を変えるだけで、サーバーも呼ばれたら合図を送るだけだ。どちらにも判断の仕組みは入っていない。プログラムの一部はClaude Code自身に作らせたという。M5Stackの機種名は記事に書かれていない。\n【ポイント・注意点】作者が強調するのは、「いつ笑うか」をプログラムが決めていないことだ。人がルールを書くのではなく、ツールの名前と説明をAIに渡し、使うかどうかはAIが選ぶ。機器の側は単純なままで、AIの判断が物理的な動きに表れる。この記事は仕組みの説明までで、ソースコードと設定方法は次回の記事で扱うとしている。実際に作ってみたい人は続編を待つことになる。AIの判断と機器の動きを、ツールの名前と説明だけでつなげる。その手軽さを示した点に、この作例の面白さがある。","2026-11-27","note（柚もなか）","https://note.com/yuzu_monaka_/n/nb6ec57004224"],["起きないと口が悪くなる「目覚ましハム」、CoreS3でおもちゃに声を注入","iwashiちゃんさんが、ものまねハムスターのおもちゃを、起きないほど口調が荒くなる目覚まし時計に改造した。M5Stack CoreS3で録音し、Mac上の中継サーバーで文字起こし、返事の生成、音声合成を行い、おもちゃのマイク入力に音声を流し込む。返事には約7秒かかる。会話させるには遅すぎたため、一方的に話す目覚ましに作り替えた経緯や、おもちゃのくせへの対処も書いている。","\n【概要】iwashiちゃんさんは2026年11月27日、「目覚ましハム」の開発記録をnoteで公開した。タカラトミーアーツの、話した言葉をまねするハムスターのおもちゃを改造した目覚まし時計で、「未来の先取り展2026」に出展した。起きないとハムスターの口調がだんだん荒くなる。「もうちょっと」と言えば「あと５分だけだぞ」と返すスヌーズもある。\n【背景】最初は距離センサーでスクワットを数える「スクワットハム」を作ろうとしたが、うまくいかなかった。会話するモードも遅れが大きすぎたため、一方的に話す目覚ましに方向を変えた。10月13日に配線越しで最初の反応が返り、11月15日に目覚ましへの作り直しを決め、11月17日に仮版ができた。設計はClaude、コードはCodexが担当した。\n【詳細】ハードはM5Stack CoreS3（K128-SE）とToF4M距離センサー。おもちゃのマイクとスピーカーはそのまま残し、CoreS3の音声を抵抗とコンデンサを通しておもちゃのマイク入力へ流し込む。処理は、CoreS3で録音、文字起こし、返事の生成、音声合成の順で、Mac上の中継サーバーを通す。声はOpenAIの「sage」で、返事までは約7秒かかる。おもちゃ側にはくせがあった。注入が終わって0.2〜0.5秒で話し始める、話している最中の注入は無視する、残るのは約6秒分だけ、句点の「。」で切れる、といったものだ。そこで、句点のない一息の文にし、強く圧縮し、低音を切って2〜4kHzを持ち上げて対応した。台詞は3段階の口調×25本の75本と書かれている。\n【ポイント・注意点】見出しには「175本」とあり、本文の75本と食い違っている。返事を生成するモデルの名前は書かれていない。おもちゃは記事執筆時点のAmazonで2,498円。寝ようとしてくしゃみをすると起こされてしまう、という弱点も正直に書かれている。手持ちのおもちゃのマイクとスピーカーを生かし、外から音声を注入してAIの声で話させる手法は、ほかのおしゃべり玩具の改造にも応用できそうだ。","2026-11-27","note（iwashiちゃん）","https://note.com/iwashichan84/n/n2af80b7cfc88"],["スタックチャンおでかけ版を試作、AIが書いたPWM設定で動かず","mar_aさんが、キャタピラで走るスタックチャン「おでかけバージョン」の試作記をZennに書いた。昇圧回路とトランジスタだけの簡単な基板のはずが、ピン番号の左右反転、AIが書いたPWM設定の誤り、電源を切っても昇圧が止まらない問題と、つまずきが続いた。REV3でサーボ2個とLEDが動くまでの原因と対策を、測定器がテスターしかない環境で、一つずつ追った記録だ。","\n【概要】mar_aさんは2026年11月27日、スタックチャンを外へ連れ出す「おでかけバージョン」の試作記をZennで公開した。構成はStackChan Core（ESP32-S3）、自作基板、1500mAhのBattery Module 13.2、キャタピラ用の360度サーボ2個、LED2個。自作基板は昇圧コンバーターTPS61023とトランジスタ程度の簡単な回路だ。\n【背景】サーボは20msごとに電流を断続的に引き、ノイズの元になる。そのため本体の+5Vは使わず、電池を昇圧してサーボ専用の+5Vを作る設計にした。測定器はテスターだけで、オシロスコープはない。ファームウェアはAIと一緒に作っており、作者はAIでソフトの作業が数週間から数時間に縮んだと書いている。\n【詳細】REV1では、基板の表（J2）と裏（J6）でピン番号が左右反転するのに気づかず配線し、GNDが本体の別のピンに当たった。REV2ではTPS61023（1個約300円）を移植し、+5Vは出たものの、サーボもLEDも動かなかった。原因は2つ。サーボは、初期のM5Stack Basic向けの設定のままAIが書いた16bitのPWMで、14bitまでのESP32-S3では信号が出ていなかった。LEDは液晶とmicroSDの通信ピン（G35・G37）につながっていたため、G5・G9へ付け替えた。さらに、TPS61023のENを電池の+に直結していたため、本体の電源を切っても昇圧が止まらなかった。REV3ではENをG8につなぎ、100kΩでGNDに落として止められるようにし、手動スイッチも足した。結果、ENをオフにすると+5Vが止まり、サーボ2個とLEDが動いた。\n【ポイント・注意点】作者の教訓は3つ。表と裏の番号とすべてのピンを確かめること、AIが書いたコードをうのみにしないこと、オシロスコープが欲しいこと。キャタピラの空回りは、歯先を丸めて噛まなくなったのが原因だった。今後は、子どもが操作できるコントローラーをChain Captain Dev KitとChain Joystickで作る予定だ。","2026-11-27","Zenn（mar_a）","https://zenn.dev/mar_a/articles/3270cb5753ac25"],["ボストン・ダイナミクス、現代自の工場敷地で人型ロボAtlasを訓練","ロボスタの神崎洋治編集長のコラムが、米中で相次いだフィジカルAIの2つの動きを取り上げた。ボストン・ダイナミクスは、米ジョージア州にあるHyundai Motor Groupの自動車工場の敷地に、人型ロボットAtlasを訓練する施設を開いた。中国のAGIBOTは、テーマパークやホテルに300台を超えるロボットを一気に入れた。研究室から実世界でロボットを育てる競争へ移っている、という見立てだ。","\n【概要】ロボスタは2026年11月27日、神崎洋治編集長のコラム「編集長のロボトピ！」で、人型ロボット（ヒューマノイド）を実際の工場で鍛える動きを取り上げた。ボストン・ダイナミクスは、米国ジョージア州にあるHyundai Motor Group（現代自動車グループ）の自動車工場の敷地に、Atlasを訓練する施設を開いた。自動車製造の環境に近い条件で、Atlasを訓練するための施設だ。\n【背景】コラムが扱うのは「フィジカルAI」だ。記事はこれを、カメラなどで現実の世界を捉え、ロボットの体を通して物に働きかけるAIと説明している。これまでは、研究室で性能を高めてから社会に出すのが普通だった。しかし今は、実世界に入れて経験とデータを集め、さらに賢くしていく段階に移りつつある、というのがコラムの見立てだ。2つのニュースは、どちらも2026年9月に米中で相次いで発表された。\n【詳細】米国側の例が、ボストン・ダイナミクスによるAtlasの訓練施設だ。中国側の例として、AGIBOT（智元机器人）がテーマパークやホテルなどに300台を超えるロボットを一気に入れたことを挙げている。どちらも、ロボットを現場に出し、そこで集めた経験とデータで育てるという流れに沿っている。コラムはこれを「実世界でロボットを育てる競争」と呼び、競争の舞台が研究室から実世界へ移ったと整理している。\n【ポイント・注意点】記事には、施設の規模、訓練するAtlasの台数、費用、稼働の時期といった具体的な数字は出てこない（AGIBOTの300台超を除く）。また、このコラムは2026年9月30日に配信したメールマガジンの記事を、最新情報を反映して一部書き足し、直したものだと明記されている。ニュースそのものは9月の話で、今回の公開は解説の再掲にあたる点に注意したい。カメラとAIで物を扱うロボットの学習が、現場でデータを集める段階に入ったことを知る材料になる。人型ロボットを工場で動かすには、実際の作業で鍛えることが欠かせない、という見方を示したコラムだ。","2026-11-27","ロボスタ","https://robotstart.info/article/2026/11/27/382677.html"],["完成品のスタックちゃんを買い、AIと声を替える開発日記が始動","ちょいもっけさんが、M5Stackで動く小さなロボット「スタックちゃん」の開発日記をnoteで始めた。完成品の「M5StackChan AIデスクトップロボット」を買い、使うだけでなく自分好みに改造していくという。操作の簡単さ、返事の口調、ずんだもんの声、裏で動くAIの種類を変えたいと考えている。次回はM5Stack CoreS3を扱う予定で、愛車MINIとの連携も予告している。","\n【概要】ちょいもっけさんは2026年11月27日、noteで「スタックちゃん」の開発日記の第1回を公開した。スタックちゃんは、小さな画面に顔を表示する小型ロボットで、話しかけると答えてくれる。作者はこれを見つけて、完成品を買った。記事中のリンク先は、スイッチサイエンスで扱う「M5StackChan AIデスクトップロボット（ESP32-S3搭載）」だ。\n【背景】作者は、買ったものをそのまま使うのではなく、自分好みに変えていくことを目標にしている。改造したい点として、次の4つを挙げる。操作をもっと簡単にしたい。返事の口調を変えたい。声をずんだもんにしたい。そして、裏で動くAIそのものを別のものにしたい。部品を集めて組み立てるところからではなく、完成品から入り、少しずつ中身を書き換えていく進め方だ。\n【詳細】第1回は、スタックちゃんとの出会いと、これからの目標の紹介にとどまる。具体的な改造の手順、使うソフト、数値はまだ書かれていない。次回はM5Stack CoreS3を扱う予定だ。また、今後の開発には作者の愛車MINIも関わってくると予告している。ただ、車とどう関わるのかは、まだ明かされていない。声をずんだもんに替えること、返事の口調を変えること、AIを差し替えることは、どれも話しかけると答えるロボットの性格を自分で決める作業にあたる。この日記では、それらがどの順番で、どう進むのかが今後の見どころになる。\n【ポイント・注意点】記事は短く、開発日記の始まりを告げる内容だ。技術的な情報を求める人には物足りないが、完成品から改造を始める人の記録として、続きを追う価値がある。完成品を買えば組み立てで迷わずに済み、すぐにAIとの会話を試せる。そこから声やAIを替えていく流れは、初めてスタックちゃんに触る人にとって1つの道筋になる。次回のCoreS3の回で、改造の中身が見えてくるはずだ。口調、声、AIのどれから手を付けるのか、そして愛車MINIとどうつながるのか。続く日記で、その答えが少しずつ明らかになっていく。","2026-11-27","note（ちょいもっけ）","https://note.com/choimokke/n/n78695707f728"],["XIAO ESP32S3 Senseのカメラ不良、Claude Codeに信号線まで調べさせた","kinotexさんは、XIAO ESP32S3 Senseのカメラがうまく映らない問題を、Claude Codeに信号線の評価まで任せて調べた。オシロスコープは使わず、GPIOの読み取りと画像データのビット統計だけで、D7の断線やD0の不安定さを突き止めた。クロックを10MHzに下げて症状は目立たなくなったが、根本対策はカメラ交換だと結論している。AIの報告ミスも正直に記録した。","\n【概要】kinotexさんは2026年11月26日、XIAO ESP32S3 Senseのカメラが映らない問題の後編をZennで公開した。カメラはOV2640で、I2CのIDは0x0026として認識できていた。今回は、AIのコーディングエージェントClaude Codeに、実機の信号線の評価まで任せた。\n【背景】Claude Codeは、診断用のスケッチを書き、arduino-cliで書き込み、信号とビットの測定、結果の表作り、JPEGヘッダの解読までを担当した。人は、カメラの挿し直しや交換、USBの抜き差し、シリアルモニターを閉じるといった物理的な作業だけをした。オシロスコープは使わず、測ったのはGPIOの読み取りとデータのビット統計だけだ。\n【詳細】フレームの取得は4秒でタイムアウトした。D7は変化が0回で、内蔵プルアップで読むとHIGHが100%となり、断線と判断した。6種類のクロックと12種類の解像度の総当たりでは、5MHz以外はほぼ全滅。5MHz・UXGAでも20枚中16枚しか成功しなかった。壊れたJPEGのビットを比べると、bit0が約27%の確率で1から0に落ちていた。D0は弱いプルダウンでHIGHが消え、10MHz以上では1の割合が半分に減った。対策として、XCLKを20MHzから5〜10MHzに下げると効果があり、5MHz・UXGAでは0枚から20枚中16枚に改善した。ファームウェアは10MHzに設定した。壊れたフレームを先頭と末尾のマーカーで捨てる方法は、一部にしか効かなかった。\n【ポイント・注意点】記事は、ソフトで「直した」のではなく「目立たなくした」だけだと明記し、根本対策はカメラ交換としている。AIの間違いもあった。sizeコマンドがクロックを変えないことに気づかず、10MHzのまま「5MHzで試した」と報告したのだ。D0の原因はカメラ側のフレキの接触不良が有力だが、断定はできていない。同じカメラが2枚の基板で同じ症状を示したため、基板のコネクタが原因という説は取り下げた。不良は出たり消えたりするため、再発の可能性もあるという。","2026-11-26","Zenn（kinotex）","https://zenn.dev/kinotex/articles/f23914cb64b2ee"],["アマダと日立、AIエージェントで工場運営と保守を支援するPoC","アマダと日立製作所は2026年11月26日、AIエージェントとフィジカルAIで工場の自律化と保守サービスの高度化をめざす協創の第1弾として、AIエージェントの概念実証の結果を発表した。生産計画の調整やトラブル対応を支援し、事例のない保守案件でも原因を推論できたという。今後は顧客の現場で実用化を進め、設備やロボットを自律制御するフィジカルAIの実装へと段階的に進む。","\n【概要】ロボスタによると、アマダと日立製作所は2026年11月26日、AIエージェントとフィジカルAIを使って工場を自律化し、保守サービスを高度化するための協創の第1弾を発表した。今回はAIエージェントの概念実証（PoC）の結果を報告している。\n【背景】製造の現場には、人手不足、熟練技能者の減少、多品種少量・変種変量生産、突発的な生産計画の変更といった課題がある。生産計画の調整や復旧、保守は熟練者の経験に頼っている。アマダは2026年に創業80周年を迎え、IoTソリューション「V-factory」の接続台数は世界で1万台を超える。日立は、ITと制御技術（OT）を組み合わせた「HMAX Industry」を展開している。\n【詳細】PoCは2つの領域で行った。1つ目の工場運営では、機械やソフトを効率よく使うための提案、急な納期変更に合わせた生産計画の調整の支援、トラブルの原因候補と確認手順、対処法の提示を検証した。2つ目の保守サービスでは、過去に事例のない複雑な案件でも、蓄積された知識からAIエージェントが原因を推論し、復旧策を示せることを確かめた。今後は、PoCで確認したAIエージェントを顧客の製造現場に適用し、早期の実用化とサービス化をめざす。続いて、フィジカルAIが現場の状況に応じて判断・動作し、作業者を支援する実装に取り組む。日立は今回の知見を、HMAX Industryのラインアップとして実用化する計画だ。アマダは2026年11月に、次世代工場を提案する「MIRAI factory」を公開している。\n【ポイント・注意点】検証できたのは、AIエージェントによる工場運営と保守の支援までだ。見出しにあるフィジカルAIによる設備やロボットの自律制御は、これからの取り組みになる。金額、目標の数値、提供の時期は書かれていない。それでも、熟練者の経験に頼ってきた計画の調整やトラブル対応、保守の判断をAIエージェントが肩代わりできるかを、実際の業務に近い形で確かめた意味は大きい。工場でAIとロボットが連携する流れの一歩として注目したい。","2026-11-26","ロボスタ","https://robotstart.info/article/2026/11/26/382674.html"],["動画1本で未知の作業を学ぶ、Skild AIのロボット基盤モデル「S1」","ロボスタの神崎洋治編集長のコラムが、Skild AIが2026年8月に発表したロボット基盤モデル「S1」を取り上げた。人が作業する様子を映した動画を1本見せるだけで、ロボットが未知の作業を学んで実行できる可能性を示す技術だ。NVIDIAは9月10日に、S1とSkild AIとの協業を紹介した。ロボットの学習データをどう集めるかという課題を考えるきっかけとして扱っている。","\n【概要】ロボスタは2026年11月26日、神崎洋治編集長のコラム「編集長のロボトピ！」で、ロボティクスAI企業Skild AIのロボット基盤モデル「S1」を取り上げた。S1は、人が作業する様子を映した動画を1本見せるだけで、ロボットが未知の作業を学んで実行できるという、新しいロボット学習の可能性を示した技術とされる。\n【背景】生成AIが急速に進化した背景には、インターネット上にたまったテキスト、画像、動画を学習データとして使えたことがある。一方で、実世界で動くロボット、つまりフィジカルAIの学習データは、簡単には集められない。タイトルにある「ロボットに何百回も教える時代は終わる？」という問いは、この問題を指している。ロボットに新しい作業を覚えさせるには、これまで何度も教える必要があった。\n【詳細】S1はSkild AIが2026年8月に発表した。NVIDIAは9月10日に、S1の特徴と、フィジカルAIの分野でのSkild AIとの協業を紹介している。コラムが問いかけるのは、ロボットは何を学習データにすれば、最も効率よく実用的な能力を身につけられるのか、という点だ。S1が示した新しいやり方を手がかりに、今のデータ集めの課題と、それがこれからどう変わりうるかを考える構成になっている。動画1本という少ない手本から未知の作業に取り組めるなら、ロボットに教える手間の考え方そのものが変わる。コラムはその可能性に注目している。\n【ポイント・注意点】このコラムは、2026年9月16日に配信したメールマガジンの記事がもとになっている。ニュース自体は8〜9月の話で、新しい発表ではない。また、記事から読み取れた範囲には、S1の性能の数値、対応するロボット、価格、提供の時期は書かれていない。動画1本で学べるという主張がどこまで実際に通用するかは、続報や公開資料で確かめる必要がある。それでも、ロボットの学習データをどう集めるかという問いは、ロボットにAIを載せようとするすべての開発者に関わるテーマだ。","2026-11-26","ロボスタ","https://robotstart.info/article/2026/11/26/382672.html"],["PCを起動するとすぐQwen3と会話、24KBのアセンブリ製LLM専用OS","PC Watchによると、Alexey Fateev氏が、x86-64アセンブリだけで書いたLLM専用OS「asm-llm-os.elf」を公開した。PCを起動すると、そのまま小型言語モデル「Qwen3-0.6B」とチャットできる。カーネルは約24KBで、ディスクドライバを持たず、OSもモデルもRAM上で動く。作者の計測では、Linux上のllama.cppの1.31〜1.54倍の速さでデコードできたという。","\n【概要】PC Watchは2026年11月26日、LLMを動かすためだけのOS「asm-llm-os.elf」を紹介した。Alexey Fateev氏（GitHubでのハンドル名はalesha-pro）がX（旧Twitter）で発表したもので、PCを起動するとすぐに「Qwen3-0.6B」とチャットできる。ライセンスはMITだ。\n【背景】同氏は、純粋なx86-64アセンブリで書いた3つのLLMプロジェクト「llm.asm」を公開している。フェーズ1は、NASMで書いたLinux向けのQwen3-0.6B推論エンジン「01-qwen3-inference」。フェーズ2の今回は、それをもとにLinuxへの依存をなくし、OSの部分もアセンブリで書いた。C/C++やRustは使わず、libc、libm、動的リンカーといったランタイムにも頼らない。\n【詳細】動かすには、AVX2、FMA、F16Cに対応したx86-64のCPUが必要だ。メモリはモデル分（FP16スケールで614MiB、FP32スケールで649MiB）に加え、KVキャッシュなどに449MiBを使う。ディスクドライバはなく、OSとモデルはすべてRAM上で動くので、ディスク容量0GBの仮想マシンでも起動できる。ドライバは、COM1シリアル、80×25のカラーVGAコンソール、PS/2キーボード、PIT/RDTSCによる時間計測、ACPIによる電源オフだけだ。カーネルの起動から対話プロンプトが出るまでは74〜94ms。コンテキスト長は標準で2,048トークンで、上限が近づくと会話履歴がリセットされる。AMD EPYC 7642を積んだマシンでの計測では、デコード速度がLinux上のllama.cpp（CPU、Q8_0）の1.31〜1.54倍だった。16vCPUの仮想マシンでは134.94tok/sで、llama.cppの103.03tok/sを31%上回った。\n【ポイント・注意点】ベンチマークは作者自身の計測で、比較相手はCPUで動かすQ8_0のllama.cppに限られる。電子工作そのものではないが、余計なものをそぎ落とし、ハードウェアのすぐ上でLLMを動かす試みとして面白い。","2026-11-26","PC Watch","https://pc.watch.impress.co.jp/docs/news/2159364.html"],["M5Stack CoreS3 SEとMuseで「おかえり」、BLEで在室を判定","sasa_mkwyさんが、Metaが公開したMuse Gadget SDKを非公式にフォークし、M5Stack CoreS3 SEで部屋に戻るとAIが「おかえり」と言うファームウェア「OKAERI」を作った。スマホのBLE電波の強さで在室を判定し、2時間以上離れてから戻ると声で迎える。Wi-Fiでの判定をあきらめた理由や、キーパッドとの衝突、音声の欠けなど、実機でぶつかった壁を細かく記録している。","\n【概要】sasa_mkwyさんは2026年11月24日、Metaが公開したMuse Gadget SDK（Apache 2.0）をM5Stack CoreS3 SE向けに非公式でフォークし、ファームウェア「Muse-Gadget OKAERI」を作った記録をZennに書いた。GitHubでも公開している。2時間以上部屋を離れてから戻ると、AIが「おかえり」と声で迎える。\n【背景】追加した機能は、音声の返事、BLEによる在室検知、BLEキーパッド（MK321BT）での操作、DotGothic16の16pxビットマップ字幕の4つ。音声はVM側で合成したMP3を取ってきて鳴らす。在室判定には最初Wi-Fiを考えたが、自宅ルーターの2.4/5GHzの自動切り替えと中継器のせいで見失うため使わなかった。\n【詳細】BLEでは、Androidが出すGoogleのサービスデータを使う。ただしアドレスは1分強ごとに変わる。Xiaomi 15で電波の強さ（RSSI）を測ると、机の上で-65〜-70dBm、部屋の反対側で約-75、ドアの外で約-80、壁越しの別室で-81〜-89で、別の階では受信できなかった。しきい値は-72と-80に置き、30秒のラウンドを6回回して4回以上強ければ着席、2時間近くにいなければ不在とした。キーパッドは在室スキャンとぶつかったため、スキャンを一時止める調停を入れた。長押しが約0.03秒で離れたのは、キーパッドの出力モードの設定が原因だった。音声では、完了イベントに全文がなく先頭が欠けたため、会話履歴のAPIから全文を取る形に直した。1.9MBのPSRAMを一度に確保できなかったので、60秒、30秒、15秒と半分ずつ減らして確保する方式にした。\n【ポイント・注意点】日本語フォントは7,090字に絞り、4MBのアプリ領域に収めた（ファームは3.67MB）。作者はAIと相談しながら進めたという。電波の実測値やしきい値まで公開しており、同じ仕組みを作る人の参考になる。USBは本体側のポートに挿す、といった細かな注意も書かれている。","2026-11-24","Zenn（sasa_mkwy）","https://zenn.dev/sasa_mkwy/articles/cd6f4448499669"],["子どもの工作を3Dで残す「おもいでレンジ」、UNO QとAIで立体化","はっきんぐパパさんが、子どもの立体作品を撮影して3Dモデルにする電子レンジ風の装置「おもいでレンジ」を作った。Arduino UNO Qがターンテーブルを回して36枚撮影し、選んだ4枚を画像から3Dを作るAI（Tripo APIかローカルのHunyuan3D）に送る。完成したモデルはペッパーズゴーストの仕掛けで、窓の中に浮かんで見える。フィジカルAIチャレンジへの応募作だ。","\n【概要】はっきんぐパパさんは2026年11月24日、子どもが作った立体作品を3Dで残す装置「おもいでレンジ」をnoteで紹介した。電子レンジのような箱で、ターンテーブルを回しながら1周分の写真を撮り、3Dモデルを作って表示する。Arduino UNO Qを使う「フィジカルAIチャレンジ」への応募作で、記事の日が締め切りだったという。\n【背景】装置の狙いは、子どもの立体作品を写真から3Dデータにして残すことだ。立体を作る部分は、画像から3Dモデルを作るAIに任せる。使えるのは、クラウドのTripo APIか、ローカルで動かすHunyuan3Dのどちらかだ。電子工作で撮影の手間を自動にし、AIで立体化する分担になっている。\n【詳細】中心はArduino UNO Qで、操作画面、撮影、写真の選択、表示を受け持つ。操作には、回転ダイヤルと丸い画面を持つM5Stack Dialを使う。上部には携帯用ディスプレイを載せ、ペッパーズゴーストの仕掛けで、窓の中にモデルが浮かんで見えるようにした。ターンテーブルは市販の電動品を改造し、3つのボタンのスイッチをUNO Qのピンにつないだ。外装はまず段ボールで作り、その後木で作った。使い方はこうだ。1周を36枚の写真に分け、ユーザーはDialで正面を選ぶ。すると残りの右、後ろ、左の3枚が提案され、押して確定する。押すのは全部で4回。この4枚をAIに送ると数分でモデルができ、進み具合はDialとアプリに表示される。できたモデルは番号付きで保存され、あとから見返せる。\n【ポイント・注意点】最初は、決まった時間のコマを正面として選ぶ方法を試したが、作品ごとに置き方が違うためうまくいかなかった。そこで、Dialで人が正面を選ぶ方式に変えた。全部を自動にせず、人の判断を1回入れることで確実さを取った点が、実用の工夫になっている。クラウドのTripoとローカルのHunyuan3Dを選べるため、ネットへの依存も調整できる。撮影はマイコンと電子工作、立体化は生成AIという分担がはっきりした作例だ。","2026-11-24","note（はっきんぐパパ）","https://note.com/hackingpapa/n/n0183189c80d4"],["スタックチャンって何？ 誕生からAIスタックチャンのブームまで","mongontaさんが、M5Stackで作る手のひらサイズのロボット「スタックチャン」を紹介する入門記事をZennに書いた。2021年7月3日にししかわさんが初めて公開し、ロボさんが発表したChatGPTを使う「AIスタックチャン」でブームになった経緯をまとめる。かわいさや段ボールで作れる手軽さ、組み込める機能、情報の集め方を紹介し、AI会話のAPIには料金がかかる点にも注意を促している。","\n【概要】mongontaさんは2026年11月24日、「スタックチャンって何？」という紹介記事をZennで公開した。スタックチャンは、M5Stackを使った手のひらサイズのロボットだ。作り方や部品の解説ではなく、これから触れる人に向けて、スタックチャンがどういうものかをまとめた入門の内容になっている。\n【背景】スタックチャンは、ししかわさん（Xでは@stack_chan）が2021年7月3日にTwitter（現X）で初めて公開した。その後、作る人や使う人のコミュニティができた。ブームのきっかけになったのは、ロボさん（Xでは@robo8080）が発表した、ChatGPTを使った「AIスタックチャン」だという。小さなロボットとAIとの会話が結びついたことが、広がりの転機になった。\n【詳細】記事は魅力をいくつか挙げる。何もしなくてもかわいいこと。持ち歩けるサイズであること。段ボールでも作れることで、「#ダンボールスタックチャン」というハッシュタグもある。さらに、実用的な機能を組み込める。Bluetoothスピーカー、AIスタックチャン、Webラジオ、MP3再生、M5Core2ImageAvatarLiteといったものだ。かわいい見た目のまま、音楽を流したり会話したりと、使い道を自分で選べるのが特徴になっている。情報を集める場として、ProtoPedia、Discord、Cosense（旧Scrapbox）が紹介されている。\n【ポイント・注意点】注意点として、音声で会話するAIスタックチャンは、ChatGPT、Gemini、GoogleTTS、STTなどのAPIを使う。これらは使った分だけ料金がかかる従量課金で、使い方によっては月に1ドル以上かかる場合があると記事は警告している。AIスタックチャンを動かすなら、APIの料金も考えておきたい。これからスタックチャンを始めたい人が、全体像をつかむのに向いた記事だ。誕生の経緯からAIとの結びつき、費用の注意まで、短く分かりやすくまとまっている。","2026-11-24","Zenn（mongonta）","https://zenn.dev/mongonta/articles/mongonta-stackchan-intro"],["ネットのない教室でStackChanが遊び相手、会話も声もPC内で処理","reohamadaさんが、ネットにつながらない小学校の教室で、StackChanが先生の指示どおりに子どもと遊ぶ仕組みを作った。M5Stack CoreS3をUSBでパソコンにつなぎ、会話はllama.cppのローカルLLM、声はVOICEVOXで、すべてパソコンの中で処理する。しりとりやじゃんけんなど6つの遊びを用意し、小学校の職業体験イベントに3台を持ち込んだ。","\n【概要】reohamadaさんは2026年11月23日、ネットのない小学校の教室で、StackChan（M5Stack CoreS3）が先生の言うとおりに遊んでくれる仕組みをZennで紹介した。小学生向けに、6つの遊びの相手をするシステムだ。\n【背景】条件は3つあった。USBケーブルだけで動くこと。聞き取り、会話、声をすべてパソコンの中で処理すること。先生が遊びを選ぶまで、ロボットは話さないこと。教室ではネットが使えない前提なので、AIもクラウドではなくローカルで動かす必要があった。\n【詳細】パソコン1台にStackChan1台をつなぐ。パソコン側では、声にVOICEVOX、会話にllama.cpp、通信や遊びの進行、授業の制御にPythonのブリッジが動く。管理アプリはPySide6製で、全台を一斉に、または1台ずつ操作できる。遊びは、しりとり、声かカメラで行うじゃんけん、5問のなぞなぞ、おみくじ、ものまねボイス、「ずんだのチャリはしり」の6つ。チャリはしりの描画と物理はロボット側のファームウェアが受け持ち、1/60秒の固定刻みで進む。操作用に、Arduino UNOにアナログスティックをつなぎ、50Hzで入力を送るジョイスティックも作った。オフライン対策として、Wi-Fiの接続を受け付けない設定と、モデルをネットから取りに行かない設定を入れた。\n【ポイント・注意点】作っていく中で問題も出た。少し倒しただけで最高速にして、スティックのカクつきを抑えた。手を離すと首が上を向くのは中心のずれが原因で、自動で中心を取り直す処理を足した。上下が効かないのはジャンパー線の緩みだった。一方、ネットを完全に切った通しテスト、再起動後の自動起動、長期の授業での利用はまだ確かめていない。StackChan3台を職業体験イベントに持ち込むと、子どもたちは「想像以上に楽しんでくれた」という。ネットのない教室でも、ローカルのLLMと音声合成を組み合わせれば、AIロボットとの遊びが成り立つことを示した例だ。","2026-11-23","Zenn（reohamada）","https://zenn.dev/reohamada/articles/stackchan-elementary-education"],["AI「Muse」を軸にした自宅スマートホーム、ラズパイ5が耳と手に","k_motokiさんが、生成AIエージェント「Muse」を中心に組んだ自宅のスマートホームの全体像をZennで紹介した。Raspberry Pi 5がウェイクワードの検知や環境センサー、赤外線でのエアコン操作を受け持ち、ミニPCが音声合成、RTX 3060のPCが重い計算を担う。毎朝の天気を5つの情報源の多数決で決めるなど、ローカルファーストで仕組みを回す工夫が並ぶ。","\n【概要】k_motokiさんは2026年11月23日、生成AIエージェント「Muse」を軸にしたスマートホームの概要をZennで公開した。MuseはVMで動き、家の中の複数の機器をつないで動かす頭脳の役目をする。\n【背景】設計の考え方は3つ。ローカルファースト、仕組みで回す、ポーリングよりプッシュ。機器は役割で分かれる。MuseのVMが頭脳、Raspberry Pi 5が耳と手、Ryzen 5 3500UのミニPC（Ubuntu 24）が声と録画、RTX 3060を積んだWindows 11のPCが重い計算、そしてNAS。機器どうしはTailscaleでつながる。\n【詳細】Raspberry Pi 5は、USBマイクの音を音声認識のVoskで常に聞き、「おーいMuse」を検知する。発話の文字起こしもさせようとしたが、遅れが約2分あって使い物にならず、やめた。オムロンの環境センサーで、温度、湿度、気圧、照度、騒音、eTVOC、eCO2、振動、WBGTを取り、SQLiteに保存する。湿度が40%を切ると警告する。ただし、このセンサーは製造終了で、ドライバ探しが必要だという。USB赤外線送受信機ADIR01Pで東芝のエアコンを操作し、学習していない温度は信号の構造を解析して合成する。テレビはHDMI-CECと自作のGo製コントローラーで動かす。ミニPCではIrodori-TTSで声を作る。GPUがないのでCPUで生成し、毎朝6時に原稿を作って7時30分に流す。天気は5つの情報源の多数決で決め、起きた後は返事があるまで5分おきに呼びかける。\n【ポイント・注意点】以前は15秒ごとのポーリング（1日約5,760回のSSH往復）で状態を取っていたが、プッシュ型に切り替えた。作者は、予約や送信で終わらせず、本当に届いたか、鳴ったか、起動したかを実際に確かめることを教訓に挙げる。寝ているPCのping応答を起動と見誤った失敗もあった。ラズパイやセンサーをAIの手足として家中に配置する、具体的な設計例になっている。","2026-11-23","Zenn（k_motoki）","https://zenn.dev/k_motoki/articles/fbc0bde58f186e"],["叩いた方向をM5StickS3で判定、Edge Impulseで学ぶエッジAI","beavers_hiveさんが、3Dプリントした板の裏にM5StickS3を付け、叩いた方向をマイコン上のAIで見分けるゲームコントローラーを作った。IMUの揺れから上下左右と「その他」の5種類を分類する。学習はEdge Impulseで行い、推論はネットにつながずに実機で動く。データを増やしたら精度が下がった失敗から、混同行列の読み方まで丁寧に解説している。","\n【概要】beavers_hiveさんは2026年11月23日、M5StickS3とEdge Impulseで作ったエッジAIのコントローラーをZennで紹介した。3Dプリントした板の裏にM5StickS3を固定し、叩いた位置でゲームのキャラクターを動かす。IMU（揺れと回転のセンサー）のデータから、上下左右と「その他」の5種類を見分ける。判定はネットにつながず、マイコンの中で行う。\n【背景】板には工夫がある。矢印のまわりにU字の切れ込みを入れて「舌」の形にし、長さと厚さを方向ごとに変えた。上は長く薄く低い音、左は短く厚く高い音が出る。方向ごとに揺れ方を変えて、見分けやすくする狙いだ。学習はクラウドのEdge Impulseで行い、推論は実機で動かす。\n【詳細】センサーは1秒に800回測る。収集用のファームウェアが叩いた瞬間を見つけ、0.3秒分を切り出して10回分ずつ送る。このファームウェアはClaude Codeで書いた。データは上下左右が各50回、「その他」が20回の計220回で、テスト用に別に60回集めた。1回の揺れから126個の特徴を取り出し、ニューラルネットワークで126→20→10→5と分類する。重みは2,805個。検証では正解率95%を超え、テストでは60回中50回が正解した。ところが、上下左右を80回足して学び直すと、テストの正解は46回に減り、「その他」は20回中10回に落ちた。「その他」のデータの割合が下がったのが原因だという。混同行列で間違いの多い種類を確かめ、そこにデータを足すのが教訓だ。\n【ポイント・注意点】重みを8ビット整数にすると、大きさは約4分の1になり、テストの正解数は変わらなかった。M5StickS3はEdge Impulseの公式対応ボードではないが、書き出したC++ライブラリは実機で動いた。特徴の取り出しに52ミリ秒、分類に1ミリ秒で、重みは3キロバイト未満。迷路ゲームは最後までM5StickS3の判定だけでクリアできた。小さなマイコンでもAIの判定が十分に動くことを、具体的な数字で示している。","2026-11-23","Zenn（beavers_hive）","https://zenn.dev/beavers_hive/articles/edge-impulse-dpad"],["符号を打たないと弱るペット「DIT」、UNO QでLLMとも交信","Arduinoブログが、たまごっちのようなモールス信号の練習機「DIT」を紹介した。Reed Bigham氏がArduino UNO Qで作り、DigiKeyと共催の「Arduino UNO Q Dream Lab Challenge」で上位に入った作品だ。エサの代わりにキーで正しい符号を送らないと、ペットは生き延びられない。4つのモードの1つ「ラジオシミュレーター」では、モールス符号でLLMとやり取りできる。","\n【概要】Arduinoブログは2026年11月23日、たまごっちのようなモールス信号の練習機「DIT」を紹介した。作ったのはReed Bigham氏で、Arduino UNO Q Dream Lab Challenge（DigiKeyとの共催）で上位に入った作品だ。小さな画面にペットの目を表示し、ユーザーはキーを叩いてモールス符号を送る。\n【背景】記事は、たまごっちが30年前に流行したことに触れている。DITでは、ボタンでエサをあげる代わりに、キーを正しいパターンで叩いて符号を送らなければならない。ペットを生かすには符号を送り続ける必要があり、記事はこの「罪悪感」を練習の動機づけに使う設計だと説明している。\n【詳細】ハードはArduino UNO Qだ。DITでは、ボード上のSTM32マイコンとLinuxで役割を分けている。キー回路が開いたり閉じたりする時間を測ってドットとダッシュを見分ける処理は、STM32マイコン側で動く。それ以外のソフトはすべてLinux側で動き、ドットとダッシュはrouter bridgeを通して受け取る。モードは4つある。フラッシュカード、模倣ゲームを元にしたゲーム、モールス符号で日記を書けるアプリ、そしてラジオシミュレーターだ。ラジオシミュレーターでは、モールス符号のメッセージでLLMとやり取りできる。符号を覚えるだけでなく、相手のいる交信の形で練習できるわけだ。ビルドファイルはGitHubのreedbigham/morse-code-trainerで公開されている。\n【ポイント・注意点】記事は製品の発表ではなく、作品の紹介だ。部品表、使えるキーの種類、どのLLMを使うかは書かれていない。価格や販売の情報もない。AIは4つのモードの1つで使われているだけだが、昔ながらの通信の練習相手にLLMを使う発想は、電子工作とAIの組み合わせ方の1例として面白い。時間の計測はマイコン、AIとのやり取りはLinuxと分ける構成も、UNO Qの使い方の参考になる。","2026-11-23","Arduino Blog","https://blog.arduino.cc/2026/11/23/want-to-learn-morse-code-this-tamagotchi-like-device-will-be-your-teacher/"],["ロボットは動きをどう覚える？ルールベースから強化学習まで4方式","ロボスタが、ロボットに動きを身につけさせる4つの方式を整理した解説記事を公開した。ルールベース、ティーチング、模倣学習、強化学習の仕組みと長所、弱点を並べ、模倣学習と強化学習がフィジカルAIの中核にあると説明する。学習で得た動きを、関節制御や安全監視を受け持つルールベースの層で確かめて実行する組み合わせが現実的だとしている。2019年のOpenAIによるルービックキューブ操作など、具体的な例も挙げている。","\n【概要】ロボスタは2026年11月23日、ロボットが動きを身につける方法を、ルールベース、ティーチング、模倣学習、強化学習の4つに分けて整理した解説記事を公開した。特定の製品のニュースではなく、仕組みの違いを比べる記事だ。\n【背景】記事は、フィジカルAIを、カメラで現実を捉え、ロボットの体を通して物に働きかけるAIと説明する。そのうえで、模倣学習と強化学習をフィジカルAIの中核に位置づける。AIを使う新しい方式と、昔からある方式の違いを知っておくと、ロボットのニュースを読み解きやすくなる。\n【詳細】ルールベースは、人が「この条件ならこの動作」と書く方式で、状態機械やビヘイビアツリーが例だ。動いた理由を追えて検証しやすいが、想定外の状況に弱く、条件が増えると保守が難しい。ティーチングは、人が位置や経路を教えてロボットが再生する方式。再現性は高いが、部品の位置や形が変わると、センサーで補正しない限り対応できない。模倣学習は、遠隔操作など人の操作を記録したデータから、見たものに対する行動を学ぶ。柔らかい物を扱うのに向くとされる。課題は、学習で見ていない状況にずれると誤差が積み重なることと、質のよい手本を集める手間だ。強化学習は、報酬を手がかりに試行錯誤し、報酬が最大になる動きを探す。実機で試すと時間がかかり壊れる危険もあるので、シミュレーションで学んで実機に移す方法が使われる。例として、2019年のOpenAIによるルービックキューブ操作と、ETH Zurichの四足歩行ロボットの不整地走行を挙げる。課題は試行の回数、報酬の設計の難しさ、探索中の安全だ。\n【ポイント・注意点】記事は、学習で得た出力を、関節の制御や安全の監視を受け持つルールベースの層で確かめてから実行する構成が現実的だとまとめる。製品や価格の情報はない。電子工作でロボットを作る人にも、方式を選ぶときの見取り図になる。AIで学ばせる方式と人がルールを書く方式は対立するものではなく、組み合わせて使うものだという整理が分かりやすい。","2026-11-23","ロボスタ","https://robotstart.info/article/2026/11/23/382657.html"],["RTX Spark搭載ノートでLinuxを使うと、AC接続時にAI推論が遅くなる","GIGAZINEは、MindStudioのブログをもとに、NVIDIAのRTX Sparkを積んだノートPCでネイティブのLinuxを使うと、AI推論が大きく遅くなる問題を伝えた。GPT-OSS-120Bの生成速度はWindowsの毎秒65.4トークンに対し、Linuxでは13.9トークンだった。原因は、電源管理の設定表が暗号化され、Linuxのドライバーが読めないことだとされる。当面の回避策はWSLだ。","\n【概要】GIGAZINEは2026年11月23日、NVIDIAのRTX Sparkを積んだノートPCでネイティブのLinuxを使うと、AIの推論がとても遅くなる問題を伝えた。ノーコード開発のMindStudioのブログ「Linux on the Nvidia RTX Spark Laptop: What Actually Works」をもとにした記事だ。速度が落ちるのは、AC電源につないだときだ。\n【背景】RTX Sparkは、デスクトップのDGX Sparkと同じ設計だ。ただし、DGX SparkはNVIDIA独自のLinuxディストリビューションを標準で積むのに対し、RTX SparkのノートPCはすべてWindows on ARMを積んでいる。手元でローカルLLMを動かしたい人にとって、Linuxで性能が出るかどうかは大事な点になる。\n【詳細】GPT-OSS-120Bの生成速度（毎秒のトークン数）は、Windowsが65.4、WSLが65.1、DGX Sparkが61、ノートPCのネイティブLinuxが13.9だった。vLLMで8つのクライアントを同時に動かすと、WSLが127、ネイティブLinuxが39.5。長いベンチマークではWindowsが約8分、Linuxが37分かかり、GPUのクロックはそれぞれ約2.2GHzと約790MHzだった。温度は40〜47℃で、熱による速度低下ではないと判断された。AC電源を抜くと、Linux（LM Studio）でも毎秒61〜67トークンとWindows並みになるが、AC接続では約15トークンに落ち、クロックも約1800MHzから約780MHzへ下がる。原因は、Windows専用のNPCF（NVIDIA Platform Controllers and Framework）にあるとされる。CPUとGPUの電力の配分を管理する仕組みで、電源設定の表が暗号化されており、Linuxのドライバーは読めない。実際、Windows側でNPCFを切ると、約83トークンが約31に落ちた。\n【ポイント・注意点】当面の回避策はWSLだ。Windowsのドライバーの上で動くため、GPUの性能を保てる。ただし、メモリの割り当ての調整が要る場合がある。根本的に直すには、NVIDIAが電源管理の仕組みをLinuxのドライバーに移す必要がある。","2026-11-23","GIGAZINE","https://gigazine.net/news/20261123-linux-nvidia-rtx-spark-laptop/"],["プログラム初心者がM5Stack StopWatchにAI「Muse」を住まわせた","Osushiosuさんは、プログラミング初心者ながら、M5Stack StopWatchにAIエージェント「Muse」を住まわせた体験をnoteに書いた。ボタンを押して話しかけると時計が答え、PCやスマホを通さずWi-Fiで直接AIとつながる。ダウンロードモードへの入り方、充電専用ケーブル、SDKトークンの再発行と、時間を失った3つのつまずきと、その対処を紹介している。","\n【概要】Osushiosuさんは2026年11月22日、プログラミング初心者がM5Stack StopWatch（記事ではC152）にAIを住まわせた話をnoteで公開した。ボタンを押して話しかけると、時計が答えてくれる。PCやスマホを中継せず、Wi-FiでAIと直接やり取りし、外出先でもスマホの電波を使って動いたという。\n【背景】使ったのはMuse Gadget SDKで、Museとつなぐには「SDKトークン」が要る。作業は分担した。作者が指示を出し、Museが作り方を設計して手順を書き、Codexがコードを実装した。環境はMacBook Air M3。記事の下書きもMuseが書き、作者が確認したとしている。\n【詳細】つまずきは3つあった。1つ目は、ダウンロードモードに入るのに約半日かかったこと。赤いボタンは押し続ける必要があり、時計が起動したあとに離すのは間違いだった。2つ目は、マグネット式のUSBケーブルが充電専用で、時計が認識されなかったこと。普通のケーブルに替えて解決した。3つ目は、SDKトークンを発行し直したことで登録がすべて壊れ、約半日を失ったこと。新しいトークンを出すと、古いものはすぐに使えなくなる。追加した機能もある。時計がUSBドライブとして見えるので、顔のデータをコピーすれば数秒でキャラクターを替えられる。まばたきと口の動きを付け、タップでハート、連打で怒りマーク、振ると驚き、傾けると画面が動くようにした。キャラクターは、yaokisubさんのオリジナル3Dモデル「黑见」だ。\n【ポイント・注意点】作者の教訓は、SDKトークンは1つを共有すること。知っていれば5分で済むが、知らないと半日かかる。初心者がAIに手順を書かせて電子工作を進める例として、つまずきの記録が具体的で役に立つ。ケーブルやボタン操作のように、AIの手順書だけでは気づきにくい物理的な落とし穴が多いことも分かる。逆に言えば、そこさえ越えれば、初心者でもAIの力を借りて自分だけの話す時計を作れるということだ。","2026-11-22","note（Osushiosu）","https://note.com/osushiosu/n/n3630cb2f450e"]],"muse":[["AIエージェントの止まり方を設計、停止条件と上限、再開の決め方","てまなし工房がZennで、自律タスクの事故は「止まらなかったこと」から起きることが多いとして、AIエージェントの停止条件を先に設計する方法を5つの要素にまとめた。試行は最大3回、処理は最大15件、開始から30分で打ち切りといった数値の条件と、エラー表示や想定外の画面などの状態の条件を組み合わせ、失敗の種類ごとの対応や、止まった後の再開の条件まで決めておくよう勧めている。","\n【概要】てまなし工房がZennで、AIエージェントの「止まり方」を設計するための考え方を公開した。自律タスクの事故は止まらなかったことで起きることが多く、エージェントは指示された範囲で忠実に動き続けるため、止まる条件は人間が先に決めておくべきだという立場だ。【背景】記事は、以前の指示書の記事で触れた停止条件の書き方を掘り下げる位置付けである。長時間の自動実行や定期実行でエージェントを動かすとき、どこで打ち切り、何を残し、いつ再開するかが決まっていないと、失敗が積み重なったり二重処理が起きたりする。【詳細】要素は5つある。1つ目は停止条件を数値と状態で書くことで、例として試行は最大3回、処理件数は最大15件、開始から30分を超えたら打ち切りとし、エラー表示、想定外の画面、対象が見つからないことを状態の条件に挙げる。2つ目は失敗を種類で分けることで、通信エラーやタイムアウトのような一時的な失敗はその回を打ち切り、間を置かずに何度も再試行しない。対象不在や権限なしのような対象側の失敗はその対象を飛ばして記録し、ログイン切れや画面構成の変化のような前提の失敗は全体を止めて報告する。この対応表を指示書に入れると動きが安定するという。3つ目は上限を安全装置であると同時に許可証と捉えることで、上限内なら確認なしで進めてよく、上限到達は途中経過の報告として正常な区切りにできる。4つ目は異常時にその場で立て直さず、止めて現場を残すことで、最後に成功した操作、異常の画面やメッセージ、どこまで終わったかを記録する。5つ目は再開条件で、人の確認後に再開するか次回の定期実行で自動再開するかを分け、同じ異常で2回続けて止まったら自動再開しない、再開時は未実施分だけを対象にする。【ポイント・注意点】筆者は止め方をタスクの性能ではなく設計の問題とまとめる。一方で、特定のツールやAIモデル、バージョン、OSの名前は挙げておらず、実測データや導入事例も示されていない。自分の環境に当てはめる際は、数値の上限をタスクの重さに合わせて決め直す必要がある。","2026-11-28","Zenn","https://zenn.dev/temanashi_kobo/articles/e4f6b19f140746"],["Claude Codeの並列稼働で起きる破綻、権限・文脈・検証を構造で縛る","kekkai3an氏がZennで、Claude Codeを複数並べて動かすと確認や手戻りが増えるのは、人間との1対1の対話を前提にした開発の流れに自律エージェントを入れたことによる構造的な欠陥だと論じた。問題をコンテキストの汚染、権限境界の曖昧さ、並列化による認知負荷の3つに分け、物理的な隔離、セッションの分離、出力ゲートという3層の制御を具体的に提案している。","\n【概要】kekkai3an氏がZennで、Claude Codeの並列稼働の裏で起きる設計の破綻と、それを構造で封じる制御の考え方を公開した。Claude Codeを複数並べるダッシュボードの自作などが流行する一方、道具を増やすほど確認や手戻りが増えるのは、人間との1対1の対話を前提にした開発の流れに自律エージェントを入れたことによる構造的な欠陥だと主張する。【背景】筆者は問題を3つに分ける。1つ目はコンテキストの汚染で、1つのセッションに複数のタスクを入れると履歴がノイズになる。ここで/btw、/fork、/rewindの使い分けに触れている。2つ目は権限境界の曖昧さで、禁止事項を自然言語のプロンプトだけで縛るのは、確率的に動くLLMには不十分だとする。3つ目は並列化による認知負荷で、生成は速くなっても差分のレビューと検証は人間に残る。【詳細】提案は3層からなる。第1層は権限と環境の物理的な隔離で、プロジェクトのルートより外への書き込みを遮断し、外部への通信は許可リスト制にし、機密のディレクトリはコンテナやVMにマウントしない。第2層はタスクの粒度とコンテキストの分離で、調査のための読み取りと実装の書き込みはセッションを分け、方針が分かれるときは/forkを使い、同じエラーが3回続いたら/rewindで戻す。第3層は並列時の出力ゲートで、静的解析、リンター、型チェックの通過を完了条件にし、テストの仕様や型定義は先に人間が固定し、エージェントの自己申告ではなくテストの終了コードだけで評価する。指示に使う制約のテンプレートも載せており、変更してよいのは指定したパスだけ、指定外のファイルの編集や新しいパッケージの導入、外部URLへのアクセスは禁止、完了条件は既存テストの全通過と型エラー0件、不明点は推測せず選択肢を示して止まる、という内容だ。【ポイント・注意点】結論は、エージェントの「賢さ」への期待を捨て、権限・文脈・検証の境界をシステムとして固定することにある。ただし効果を測った数値はなく、使ったツールやClaude Codeのバージョン、OSも書かれていない。/forkや/rewindの正確な挙動の説明もなく、冒頭で挙げた流行についても出典は示されていない。","2026-11-27","Zenn","https://zenn.dev/kekkai3an/articles/aa8fd0ad67f2b9"],["WindowsのClaude Codeで裏のBashを止めても、中のプロセスが残る","上条碧斗氏がZennで、Windows版Claude CodeでBashツールの裏実行をTaskStopで止めても、コマンド内で&やパイプで動かしたプロセスが残り続ける問題を報告した。Claude Code 2.1.330とWindows 11で再現し、止めた3秒後にも5つのプロセスが残っていたという。PowerShellでの見つけ方と、IDを確かめて1つずつ止める手順、timeoutを付ける避け方も示している。","\n【概要】上条碧斗氏がZennで、Windows版のClaude Codeで裏で動かしたBashを止めても、その中で動かしたプロセスが残り続ける問題を報告した。Git for WindowsのBashでは、コマンドの中で&やパイプを使って起動したプロセスが、TaskStopで止めた後も残るという。【背景】再現は2026年11月24日、Claude Code 2.1.330とWindows 11で行った。claude -pに「sleep 123 & timeout 124 sleep 122 & sleep 125 | cat」を裏で動かしてからTaskStopで止めるよう頼むと、ClaudeはSTOPPEDと返して終了した。しかし3秒後の一覧では、sleep.exeが3つ、timeout.exe、cat.exeの計5つが残っていた。筆者は原因として、公式リポジトリのissue #109388の説明を紹介する。Claude Codeはtaskkill /Tで子プロセスをまとめて止めるが、Git Bash（MSYS2）は親が先に終わる形でコマンドを起動するため、子を辿れずに止まらないという内容で、筆者自身はこの仕組みを確かめていないと明記している。issueの報告者のPCでは残りが数百たまり、64GBのPCが2回強制再起動されたという。【詳細】見つけ方として、PowerShellのGet-CimInstance Win32_Processで、実行ファイルのパスがGit\\usr\\binの下にあるものを一覧する方法を示す。止めるときはIDを確かめてStop-Process -Idで1つずつ止め、名前で一括停止すると他の作業も巻き込むため避けるよう勧める。避け方は、終わらないコマンドを裏で動かさない、timeoutを付ける、回し終わりにプロセスの一覧を記録する、CLAUDE.mdに禁止を書く、の4つだ。timeout 20 sleep 301で試したところ、20秒後に残りの2つとも消えたという。【ポイント・注意点】whileループのようにtimeoutを直接付けられない構文で、timeout 600 bash -cの形が中身まで止めるかは試していないと書かれている。他の版やWindows以外の環境についての記載はない。","2026-11-27","Zenn","https://zenn.dev/kamijo_aoto/articles/claude-code-bash-orphan-processes"],["Claude Codeのフックで差し込む「前回の続き」、1万字超で頭だけに","アザラシオラ氏がZennで、Claude Codeのフックで記憶ファイルを会話の冒頭に差し込んでいたところ、出力が1万字を超えて、頭の2,000字の見本と置き場所しか渡っていなかったと報告した。11月5日から15日に始まった16の会話がすべて該当し、半分は全文を読まずに仕事を始めていた。会話記録での確かめ方と、3つのフックの設定とスクリプトもあわせて公開している。","\n【概要】アザラシオラ氏がZennで、Claude Codeのフックで「前回の続き」を差し込んでいたら、1万字を超えて頭だけになっていたという失敗と、その設定を公開した。Claude Codeの会話は閉じると前の内容を忘れるため、筆者は記憶フォルダに今の状態を書いたNOW.mdなどを置き、2026年11月2日からフックで読み込み、書き忘れの確認、控えを自動化している。【背景】公式のHooks referenceによると、フックの出力は1万字までで、超えると全文はファイルに逃がされ、Claudeには置き場所と頭の2,000字の見本だけが渡る。エラーにはならず、ファイルを読めとも伝えられない。筆者の状態ファイルは約5万字まで太り、11月5日夕方から15日朝に始まった16の会話はすべて見本と置き場所だけを受け取っていた。そのうち8つは全文を読みに行き、読み込みが5万トークン程度から6.7万〜8.5万トークンに増え、残りの8つは全文を読まずに仕事を始めていた。【詳細】確かめ方は、~/.claude/projects/の下にある会話記録の.jsonlで、SessionStartの行がpersisted-outputの印で始まっていれば頭だけという判定だ。ただしこの記録形式は公式に説明されておらず、版で変わりうるという。構成は3つのフックからなる。SessionStartのinject-now.shはNOW.mdを出力する。Stopのmemory-check.shは、人の発言が5回以上、会話の開始後に記憶ファイルが1つも更新されていない、前回から発言が10回以上増えた、などの条件を満たすとexit 2で記憶の更新を促す。Stopのmemory-autocommit.shは記憶フォルダを手元のgitにコミットし、pushはしない。timeoutを省くと既定は600秒で、asyncのフックにはtimeoutが効かないという公式の説明も引いている。【ポイント・注意点】検証はmacOSのbashだけで、LinuxとWindowsでは試していない。Claude Codeの版番号は書かれていない。記憶フォルダを会話どうしで共有しているため、他の会話の書き込みでも条件が外れる点や、効き目を数えていない点も明記している。","2026-11-27","Zenn","https://zenn.dev/azarashi_ora/articles/ora-claude-code-hook-cap"],["スマホからMacのClaude Codeに頼めるClaude Duet、推し機能6つ","ひよりあかね氏がZennで、スマホのClaude Duetから、Macで開いているClaude Codeに作業を頼めることを実例とともに紹介した。ComfyUIの生成画像をiCloud Driveへ30分ごとに同期する仕組みを依頼し、macOSの書き込み制限は同期専用のアプリを作って回避した。セッション画面、Daily todo、Morning briefなど6つの機能と、許可はMacの前で押す必要があるといった制約もまとめている。","\n【概要】ひよりあかね氏がZennで、スマホのClaude Duetから、Macで開いているClaude Codeに作業を頼めることを、自分の使用例と推しの機能6つで紹介した。筆者はComfyUIで生成した画像をスマホからも見たいと考え、Duetから「Macで開いているClaude Codeで、ComfyUIの出力をiCloud DriveのComfyUIフォルダへ30分ごとに同期する仕組み」を頼んだ。【背景】最初の手動の同期では822ファイル中820ファイルがコピーされた。しかし定期実行はmacOSにiCloud Driveへの書き込みを止められた。そこでMac側のClaudeが、bashにフルディスクアクセスを渡さずに済むよう同期専用のComfyUISync.appを作り、筆者がMacの前でそのアプリへのアクセスを許可した。その後は30分ごとに両側で821ファイルがそろったという。【詳細】紹介された機能は6つある。1つ目はセッション画面で、2台のMacのセッションを作業中、対応待ち、以前に分けて表示し、下部にコンピューターの状態を出す。2つ目はチャットで、話しかけるとタスクに分けて進め、迷う点はボタンで答えられる形で聞いてくる。3つ目はDaily todoで、日付、カレンダーの予定、追跡中の事項、チェックリストを1枚にまとめ、あなたの確認待ちと済みに分ける。4つ目はMorning briefで、今日の流れ、最初の予定、天気をまとめる。5つ目は作成画面で、今日の変更と文書の一覧を表示し、Claudeが作った文書は編集できる。6つ目はタスク画面で、入力が必要やレビュー待ちといったラベルと文書のプレビューを表示し、タスクの追加から作業を投げられる。【ポイント・注意点】筆者は制約も挙げている。Duetから新しく作れるのはクラウドのClaude Codeセッションで、Mac上に新しいセッションは立ち上げられない。Mac側のClaude Codeは事前に開いておく必要がある。また「この操作を許可しますか？」という確認はDuetからは許可できず、Macの前で押すことになる。記事にはDuet、iOS、macOS、Claude Codeのバージョンや料金、Macの機種、30分ごとの実行方法の詳細は書かれていない。","2026-11-27","Zenn","https://zenn.dev/hiyori_akane/articles/claude-duet-oshi-features"],["サブエージェント13本が上限で全停止、未完了だけやり直す回し方","Suisei氏がZennで、Claude Codeで資格試験の問題集を作る際、作問と校閲のサブエージェントを並列で動かして利用上限（429）で止まった3回の記録をまとめた。ジョブを1つのworktreeと1つのブランチに分け、終わったらすぐコミットする形にしたことで、完了済みは残し、未完了だけをやり直すか、SendMessageで続きを頼めたという。再開前の確認コマンドと判断基準も示す。","\n【概要】Suisei氏がZennで、Claude Codeのサブエージェントを13本並べたら利用上限（429）で全部止まった経験と、完了済みは残して未完了だけをやり直す回し方を公開した。筆者はClaude Codeで資格試験の問題集を作っており、作問と校閲をサブエージェントに分けて並列に動かしていた。止まった後にやり直せるかという問いへの答えは「ジョブ単位でなら、できる」だという。【背景】ジョブは1本につき1つのgit worktreeと1つのブランチで、40〜50問を1ファイルに書く、または校閲する大きさにしている。各ジョブは終わったらその場でコミットしてpushし、親のセッションが全部そろってから1つのブランチにmergeする。【詳細】止まったのは3回ある。1回目は5時間の上限で、5本中4本が止まった。完了していた1本はそのまま使い、残り4本は変更もコミットも0だったため、同じworktreeで最初からやり直した。2回目は校閲8本、作問4本、調べもの1本の計13本を同時に動かして全部止まり、完了していたのは校閲の1本だけだった。残り12本は成果物がなくやり直し、再開は3日後にして同時実行は4本までに抑えた。3回目は週の上限で作問4本が止まったが、作り直さずに4本それぞれへSendMessageで続きを頼んだところ、4本とも完了してコミットまで進んだ。再開前にはgit rev-list --count main..HEADでコミット数を、git status --porcelainで未コミットの変更を数える。コミットがあれば飛ばす、コミットがなくサブエージェントが応答できるならSendMessageで続き、コミットも変更もなければやり直し、変更があるのにコミットがなければ中身を確認する、という判断基準だ。親の「たぶん終わっていた」という記憶は当てにしないとしている。【ポイント・注意点】途中経過を残す案として、1問または10問ごとに書き出してコミットする方法も挙げるが、コミットとトークンが増えると認めている。13本同時はかえって遅いという判断は筆者の見解である。Claude Codeのバージョン、契約プラン、上限の具体的な数値、使用モデル、OSは書かれておらず、SendMessageで続きを頼めば必ず再開できるという保証も示されていない。","2026-11-27","Zenn","https://zenn.dev/suisei498/articles/a31dfb651578c3"],["Claude Code 2.1.325、無人の定期タスクがスキルの前で確認待ちに","HandaLab氏がZennで、Claude Code 2.1.325から、スケジュールタスクと/loopが、allowed-toolsかhooksを宣言したスキルを実行する前に確認を求めるようになった点を解説した。無人で動かすならsettings.jsonのpermissions.allowにSkill(name)を足すよう勧め、自分のスキルが対象かをgrepで調べるコマンドと、完全一致で書く理由を示している。","\n【概要】HandaLab氏がZennで、Claude Code 2.1.325（CHANGELOG上は2026年11月13日公開）の変更により、無人で動く定期タスクがスキルの前で確認待ちになりうる点をまとめた。この版から、スケジュールタスクと/loopは、allowed-toolsかhooksを宣言したスキルを実行する前に確認を求めるようになった。筆者は、無人で動かすならpermissions.allowにSkill(name)を足すと述べ、記事はこの1点だけを扱う。公式ドキュメントの本文にこの確認の説明は見つからなかったという（2026年11月17日取得）。【背景】対象になる条件は、スキルのfrontmatterにallowed-toolsかhooksを宣言していることだ。CHANGELOGの文面からは、どちらも宣言していないスキルは対象外と読めるが、筆者は実行して確かめてはいないと明記している。【詳細】自分のスキルが該当するかを調べるコマンドとして、~/.claude/skills/の各SKILL.mdからallowed-toolsかhooksの行を探すgrepを示す。設定例はsettings.jsonのpermissions.allowにSkill(my-nightly-skill)を書く形だ。Skill(name)は完全一致、Skill(name *)は前方一致になり、前方一致だと同じ接頭辞の別のスキルまで通るため、完全一致を勧めている。手元の確認では、claude --versionは2.1.199で更新しておらず、~/.claude/skills/の17本のスキルはgrepで0件だった。~/.claude/scheduled-tasks/の14タスクのうちスキルを名指しするのは4本で、その4本が呼ぶスキルは17本に含まれるという。【ポイント・注意点】確認がどこに出るか、無人のときに誰が答えるか、Desktopとクラウドの定期タスクと/loopのどれが対象か、自動モードでの挙動、変更の理由は書かれていない。Skill(name)を足せば確認が消えるかも検証していない。Skill(skill:名前)の書式はpermissionsのページで拒否の例として出るだけで、許可での有効性は確かめていないと明記している。","2026-11-27","Zenn","https://zenn.dev/handa_lab/articles/12-scheduled-skill-confirm"],["Claude Codeの予約実行が許可待ちで停止、許可ルールがあっても質問","MUGEN WEBがZennで、毎朝の確認に使っていたClaude Codeの予約実行が、2026年11月24日の朝に許可待ちの画面が4回出て止まった記録を公開した。settings.jsonの許可ルールにはWriteやClaude in Chromeがすでに入っており、ルール不足が原因ではないと整理する。指示文の見直しを試したが翌日も許可を求められ、最終的に予約実行をやめて会話の中で確認する方式に変えた。","\n【概要】MUGEN WEBがZennで、Claude Codeの予約実行が許可待ちで止まった朝の記録を公開した。筆者は毎朝の確認をClaude Codeの予約実行で行っていたが、2026年11月24日の朝、許可を求める画面が4回出て実行が止まった。止まった操作は、日付付きのMarkdownレポートへの書き込み、Claude in Chromeによるx.comへの移動、Chromeの5秒のwait操作、note.comへの移動の4種類だった。【背景】作業フォルダの.claude/settings.jsonを読むと、permissions.allowにはWrite、SendUserFile、ToolSearch、mcp__claude-in-chromeがすでに入っていた。そのため筆者は、許可ルールが足りないことが原因ではないと整理している。予約実行は人がその場にいない前提の仕組みなので、許可待ちで止まると朝の確認そのものが行われない。【詳細】1.2秒待つループを6回回したところ45秒でタイムアウトし、画面の取得も5秒でタイムアウトした。新しいタブを作るとタブのグループ番号とタブ番号が変わり、noteのダッシュボードは開いて5秒後には文字が取れず、さらに8秒待つと取れたという。対策として指示文に4点を足した。Chromeで開く場所をx.comのプロフィールとnote.comのダッシュボードの2か所に限る、タブは最初の1枚を使い回す、waitは使わず移動の直後に読み取る、Xの検索による返信候補の作成は省く、である。しかし11月25日の実行でも許可を求められた。このときは最初のコマンドで作業フォルダを移動していたため、設定ファイルの許可ルールが効かなくなった可能性があると書くが、確かめてはいない。最終的に予約実行はやめ、会話の中で確認する方式に変えた。【ポイント・注意点】許可待ちの原因、つまり予約実行が設定ファイルを読んでいるかどうかは確認できていない。「常に許可」を押しても次の回にまた聞かれた理由は、タブ単位の許可かもしれないとしつつ未確認である。11月25日に許可待ちになった操作の内容は記録がない。Claude Code、Chrome、拡張機能のバージョンやOS、契約プランも書かれていない。","2026-11-27","Zenn","https://zenn.dev/mugen_web/articles/scheduled-claude-code-permission-stalls"],["Museとともにセキュリティを見張る、脆弱性とログイン警告の切り分け","void.logがZennで、Museとともに自分のセキュリティの変化に気づく仕組みを作った1週間の記録を公開した。使っているサービスの公式な脆弱性・障害情報の確認と、Gmailに届くGoogleの警告の確認という2つの入口を設け、2026年11月13日から毎日運用している。届いた4件の知らせを自分の使い方と照らして切り分け、対応が必要だったのは1件だけだった。","\n【概要】void.logがZennで、Museとともに自分のセキュリティを検知する仕組みを作り、脆弱性の知らせとログイン警告を切り分けた1週間の記録を公開した。前編では、パスワード管理アプリが出した勧告57件に対して、棚卸し、優先順位付け、進捗管理の仕組みを作り、Google、PayPay、楽天市場、Amazon、Xまで片付けた。セキュリティの状況は終わらせた直後から変わるため、今回は終わりにせず、変化に気づける状態を保つことを目的にしている。【背景】前編までの作業として、GitHubでは使い回していたパスワードを変えてパスキーを設定し（11月8日）、Notionではパスキーの登録とパスワードの変更を行った（11月7日）。11月9日には進捗ボードを「一旦終わり」と判定している。その後の変化を拾うために、検知の入口を2系統設けた。【詳細】1つ目は、自分が使うサービスや道具の公式な脆弱性・障害情報を毎日確認し、関係するものだけを知らせる入口だ。2つ目は、Gmailに届くGoogleのセキュリティ警告を定期的に確認する入口である。2026年11月13日から毎日運用している。知らせを受けたら、受ける、自分の使い方と照合する、対象かどうかを切り分ける（対象外なら記録して流す）、対応したら記録する、の4段階で処理する。この1週間に届いた知らせは4件だった。記録サービスの委託先で起きたAI関連の事故は、該当するチャット機能を使っておらず個別の通知もないため対象外とした。コード置き場での大規模な乗っ取りの動きは、リポジトリを確認して影響なしと判定した。その際、日常的に使う道具に深刻な脆弱性が見つかり、修正版に更新した。これが対応の必要だった唯一の件である。Googleからのログイン試行をブロックしたという通知は、パスキーと2段階認証で入口が守られていることを確かめ、対応不要とした。Muse自体の脆弱性の知らせは、対象がパソコン版で、筆者が使うスマートフォンのアプリは該当せず、アプリが最新版であることも確かめて対象外とした。【ポイント・注意点】対応案を自動で作る仕組みは、まだ構想の段階だと明記している。使った道具の名前やバージョン、脆弱性の識別子、切り分けの具体的な基準、公式情報の確認方法、Museへの具体的な設定や指示の内容は書かれていない。","2026-11-27","Zenn","https://zenn.dev/voidlog/articles/6040c79bc23616"],["アラームが鳴るとAIが調査しPRまで、Claude Code Routineで構築","メディアフォースのKazuro Noguchi氏がZennで、CloudWatchのアラームをきっかけにClaude Code Routineが原因を調べ、修正のdraft PRまで作る仕組みを紹介した。EventBridgeからRoutineのAPIを呼び、本体はGitHub Issueの管理、調査は読み取り専用のサブエージェントが受け持つ。Terraformの設定例や権限の絞り方も載せ、初動調査の手間がかなり減ったとしている。","\n【概要】メディアフォースのKazuro Noguchi氏がZennで、アラームが鳴ったらAIが調査して修正のPR作成まで行う仕組みを、Claude Code Routineで導入した話を公開した。500エラーの通知からCloudWatchのログを調べ、修正PRまで出せないかと考え、アラート対応の初動をRoutineに任せる仕組みを作った。【背景】全体の流れは、CloudWatch AlarmがALARMの状態になると、EventBridgeのルールがRoutineのAPI（/fire）を呼び出すというものだ。既存のメール通知は残したまま並行して動く。Routineの本体はGitHub Issueの管理だけを受け持ち、調査は読み取り専用の権限を持つサブエージェントに任せる。【詳細】調査の結果は「報告のみ」「PRで直せる」「人の判断が要る」のいずれかに分かれる。アラームの状態が1回変わるごとにIssueを1件作り、重複して起動してもIssueが重ならないようにしている。PRはdraftとして作り、人の判断が要る場合はPRを作らずにIssueへ選択肢を書く。Routineからのghでの書き込みは個人名義になるため、GitHub Appを用意した。設定では、Routineの実行場所をCloudにし、ネットワークは*.amazonaws.comやgithub.comなどを許可し、Setup scriptでaws CLIとghを入れる。Terraformの例も載せている。AWSの権限は読み取り専用のロールを引き受ける形にし、S3のオブジェクトやSecrets Managerの値は明示的に拒否している。【ポイント・注意点】結果として初動調査の手間がかなり減ったとするが、件数や時間などの数値は示されていない。現状はdraft PRを人が判断しており、将来の自律化を目指す。Routineは個人のClaudeアカウントの利用枠に依存するため、将来はAWS Bedrockへの移行も検討している。AIにAWSの権限を丸ごと渡すのはリスクが大きいとして、ログの個人情報のマスクなど多層の防御を勧める。設定例は検証環境のものが中心で、本番での稼働実績やバージョンの情報は書かれていない。","2026-11-27","Zenn","https://zenn.dev/mediaforce/articles/1f5d95ac793e31"],["Claude Codeの利用上限で夜間自動化が停止、分割・状態保存・再試行で再設計","Zennのアカウント「AIを真剣に考える」が、Claude Codeで回していた夜間の自動化が、Pro契約の利用上限で2日間ほぼ止まっていたのに、ログには正常終了と残っていた失敗を報告した。終了コードを見ずにエラーを握りつぶしていたことなどを原因に挙げ、エラーの種類ごとの待機と再試行、処理単位の状態保存、1回の実行の分割で設計し直した記録を詳しくまとめている。","\n【概要】Zennのアカウント「AIを真剣に考える」が、Claude Codeの利用上限で夜間の自動化が止まった件と、その設計のやり直しを公開した。筆者は個人で記事の執筆、SNSへの投稿、ブログの補充などをClaude Codeで夜間に自動化していた。ある日、2日間ほとんど処理が行われていないことに気づいたが、ログには正常終了と記録されていた。原因はPro契約のClaude Codeの利用上限だった。【背景】気づけなかった理由は3つある。処理件数をログに書いておらず、0件でも終了と出ていたこと。Claude Code CLIは上限に達すると標準エラーに理由を出して終了コード1で終わるのに、スクリプトが終了コードを見ず、catchで全エラーを握りつぶして正常終了させていたこと。そして実行が前日分の完了を確かめない作りだったことだ。【詳細】対策は3点。1つ目はエラーの種類の検知と待機で、overloaded_errorは5〜15分待って再試行、usage_limit_exceededは60〜120分待つ。上限に達したら90分待って1回だけ再試行し、再び上限ならそのタスクを飛ばして翌日分で処理する。リセットの時刻は公表されておらず、90分は通ることが多いという経験則だ。2つ目は状態の保存で、処理単位ごとにcompleted/に.doneファイル、in-progress/に.lockファイルを置き、一時ファイルに書いてからfs.renameSyncで移して原子性を保つ。3つ目は分割で、過去のログからタスク1回あたりのClaudeの呼び出し回数を集計し、1回の実行がPro契約の推定利用量の70%を超えないようにタスク数を絞った。元は2〜3時間だった実行を30〜60分単位に分けた。さらに毎朝7時に前夜のログを読み、処理件数0のタスクをスマホに通知する仕組みを足し、2日間気づかないことはなくなった。【ポイント・注意点】通知を見落とせば同じことが起きる点は変わらない。週1回の重いタスクは分割しても1日遅れることがあり、夜間の実行と日中の対話が同じ利用枠を共有する問題は運用ルールで対処しているだけだという。Pro上限の仕様は推測を含み、シングルプロセス前提で、ユニットテストは書かず実際の夜間実行だけで確かめたと明記している。","2026-11-27","Zenn","https://zenn.dev/sidejob/articles/a0633f4032b3685c8"],["閉じても消えないターミナルRex、Claude Codeが会話ごと戻る","emi_ndk氏がQiitaで、HashiCorp共同創業者のミッチェル・ハシモト氏が新会社Superlogicalで出した「閉じても消えないターミナル」Rexを紹介した。ウィンドウを閉じても、PCを再起動しても、Claude Codeが同じ会話のまま戻るという。この復活に対応するのはClaude CodeとPiだけで、現在は招待制のベータ版である。試すための3つの手順と、保存されるコマンドが暗号化されない点の注意もまとめている。","\n【概要】emi_ndk氏（Daisuke Kuwabara氏）がQiitaで、ターミナルを閉じても作業が消えない新しいターミナル「Rex」を紹介した。Claude Codeのようにターミナル上で動くAIは、ターミナルを閉じると会話と作業が止まる。Rexはそれを解決するもので、作ったのはHashiCorp共同創業者のミッチェル・ハシモト氏、新会社Superlogicalの最初の製品だという。記事は2026年7月29日の発表と記し、HashiCorpが2025年2月にIBMに約64億ドルで買収されたことにも触れている。【背景】AIのエージェントを長く動かすほど、ウィンドウを誤って閉じたり、PCを再起動したりしたときに、それまでの会話と文脈を失う痛手は大きくなる。連続して作業させる使い方では、セッションをどう保つかが課題になる。記事はこの課題への答えとしてRexを位置付けている。【詳細】記事によると、Rexではウィンドウを閉じても、PCを再起動しても、Claude Codeが同じ会話のまま戻る。公式ドキュメントに基づくとして、この復活に対応しているのはClaude CodeとPiだけで、CodexとGemini CLIは対応していないと記載している。AIに別のタブで開発サーバーを起動させたり、テストを走らせて失敗した箇所を直させたりする例も示されており、タブには作業中、完了、許可待ちといった印が出るという。試すための手順は3つある。superlogical.comでウェイトリストに登録する（招待は順番に届く）、招待が来たらMac用のRexアプリを入れる、Rexの中でrex skill setupを1回実行してAIにRexの使い方を教える、である。【ポイント・注意点】現在は招待制のベータ版である。復活のために保存されるコマンドは暗号化されずに保存されるため、パスワードをコマンドに直接書かないよう注意を促している。記事は機能の紹介が中心で、実際に測った検証や性能のデータは示されていない。価格や無料で使える条件、Mac以外のOSへの対応、復活の技術的な仕組み、セキュリティ設計の詳細、既存のターミナルとの比較も書かれていない。PCの再起動をまたいでClaude Codeを使い続けたい人にとって注目の選択肢だが、使い始めるには招待を待つ必要がある。","2026-11-27","Qiita","https://qiita.com/emi_ndk/items/29214a0462a4e4b9902b"],["Claude Codeの作業環境をMacからGitHubとクラウドへ、Duetからも利用","okeee0315氏がQiitaで、Macのローカルに置いていたClaude Codeのスキル、ルール、メモリをprivateリポジトリにまとめ、クラウドのClaude Codeでも動かしてClaude Duetから使えるようにした手順を公開した。シンボリックリンクとホワイトリスト形式の.gitignore、クラウドでだけ動くSessionStartフックを使う。キーが要るスキルはDuetの作業スレッドで動かないなど、残る課題も挙げている。","\n【概要】okeee0315氏がQiitaで、Claude Codeの作業環境をMacからGitHubとクラウドへ移し、Claude Duetからも使えるようにした記録を公開した。筆者は朝のブリーフィングやタスク管理などを、自作のスキルやルールでClaude Codeに回している。ところがDuetは作業ごとにGitHubのリポジトリをcloneして動くため、Macのローカルにあるスキル、ルール、メモリが見えず、Duetからは使えなかった。【背景】そこで設定をprivateリポジトリにまとめ、クラウドのClaude Code on the webでも動くようにした。1日目はMacの設定をGitHubへ移す作業で、~/.claudeのskills、rules、hooks、プロジェクトのmemoryと、作業ディレクトリのCLAUDE.mdを対象にした。作業ディレクトリをリポジトリの作業ツリーにし、~/.claude側の各ディレクトリはシンボリックリンクにした。【詳細】.gitignoreは/*で全部を無視し、必要なものだけを戻すホワイトリスト形式にした。APIキーは値を空にした.exampleファイルだけをコミットし、mainへの直接のコミットはPreToolUseフックでgit commitを止めている。2日目はクラウドで動かす作業で、CLAUDE.md、ルール、スキル、settings.jsonはそのまま読み込まれた。問題はスキルの中に書いたMacの絶対パスで、SessionStartフックのcloud-bootstrap.shにより、CLAUDE_CODE_REMOTEがtrueのときだけシンボリックリンクを作る方式で解決した。環境の設定は、初回だけ実行されてキャッシュされるsetup script、秘密でない値の環境変数、APIキーを入れるnetwork secret、通信を許すドメインに分けた。【ポイント・注意点】Duetの作業スレッドにはDefault環境の環境変数やnetwork secretが届かないため、MCPのClient SecretやSalesforceのJWTなど、キーの要るスキルは動かない。Webの画面操作など一部はMacに残しており、Macとchromeが起動していることが前提だ。効果の数値や移行にかかった時間は書かれていない。","2026-11-27","Qiita","https://qiita.com/okeee0315/items/262ca780e38f6b3dcd3b"],["スマホからClaude Code・Codex・Kimi Codeを続ける方法を比較","Eric Wei氏がQiitaで、PCで動かしているClaude Code、Codex、Kimi Codeの作業をスマホから続ける方法を整理した。各社公式のRemote Controlなどの条件を説明したうえで、Happy、Paseo、Omnaraと、筆者が保守する自ホスト型のTaroBirdを確認できた範囲で比べている。どの方法でも、実行するPCが起動してオンラインであることが前提になると注意している。","\n【概要】Eric Wei氏がQiitaで、スマホからClaude Code、Codex、Kimi Codeの作業を続ける方法を、公式のRemote Controlと自ホストの選択肢に分けて整理した。デスクで動かしている途中で、スマホから続きを見る、承認だけする、指示を足すといった需要に応えるものだ。筆者はTaroBirdの作者であると明記している。【背景】まず公式の手段を説明する。Claude CodeはRemote Controlで、claude remote-control、claude --remote-control、またはセッション内の/remote-controlで始める。コードの実行はローカルのマシンに残るため、PCとclaudeのプロセスが動いている必要がある。対象はPro、Max、Ultra、Team、Enterpriseで、APIキーでは使えない。CodexはChatGPTのモバイルアプリ経由で、ホストはmacOSかWindowsのChatGPTデスクトップアプリになり、CLIやIDE拡張からは始められないという。Kimi Codeはデスクトップの設定のリモート制御か、CLIのkimi rcで使い、会員の権限が条件だ。【詳細】TaroBirdは公式のCLIを実行する自ホスト型の作業場で、v1.6.0のREADMEではcodex、claude、kimiなどに対応する。初回起動でこのコンピューターをホストにする設定を選び、PCの設定からデバイスを追加するとQRが出る。スマホで読み取ると8桁のコードが出て、有効時間は5分だ。接続の経路はLAN、Tailscale、VPSの中継の3通りある。macOSはApple siliconとmacOS 13以降、Windowsはx64で署名なし、Linuxはデスクトップアプリがなくヘッドレス用のCLIがあり、Node.js 22.12以降が要る。【ポイント・注意点】スマホだけでは使えず、実行するPCが起動してオンラインである必要がある（VPS上でホストを動かす構成を除く）。多くのエンジンは既定でフルアクセスで、ボットのプロセスはサンドボックスではない。比較表に載せたHappy、Paseo、Omnaraは実機で確かめておらず、性能の比較もない。筆者自身の製品を含む比較である点にも注意したい。","2026-11-27","Qiita","https://qiita.com/devEric_ai/items/7bd8cf5a0189b2f107bd"],["AIの横で見張るのをやめ、実装を夜中に片付ける仕組みを作った","ディップの石田光輝氏がQiitaで、AIにつきっきりで付き添うのをやめ、実装タスクを夜間に無人で片付ける仕組みを紹介した。ready-for-loopのラベルが付いたissueだけを拾い、寝る前にskillを1回起動すると1件ずつ実装してPRまで進める。配属から3か月で1人で作ったPRは793本だという。人の仕事は、受入条件を曖昧さゼロまで書くことへ移った。","\n【概要】ディップ株式会社の26新卒エンジニア、石田光輝氏がQiitaで、AIの横で見張るのをやめ、実装を夜中に片付ける仕組みを作った話を公開した。過去の登壇の記事版である。配属から3か月で、1人で作ったPRは793本、1営業日あたり10本以上のペースだという。【背景】AIに実装を任せても、横でつきっきりで見ていると人の時間は空かない。筆者は作業を戦略、戦術、施策、作業の4つの軸で整理した。戦略は、夜間に無人で実装タスクを消化し、人は設計、レビュー、課題の洗い出しといった上流に集中することだ。戦術は「入口を詰める、無人で回す、出口を絞る」の3段階である。【詳細】施策は4つある。ready-for-loopのラベルが付いたissueだけをループが拾う。寝る前にskillを1回起動すると対象を全部拾い、1件ずつ実装してPRまで進める。AIのレビューの指摘は、採用、判断が必要、棄却に仕分ける。実装できない場合は理由を付けてBlockedのラベルを付けて返す。人がやることは3つで、issueに受入条件と設計判断を曖昧さゼロになるまで書く、ready-for-loopのラベルを貼る、skillを起動して寝る、である。朝にはレビュー待ちのPRが並ぶ。筆者はPRの数よりも副産物を重視しており、受入条件や設計の意図がissueに残ること、判断の材料がたまって属人化が減ること、詰め切る作業を繰り返すことで設計の力が伸びることを挙げる。Blockedになった詰まりも、次の設計を改善するヒントになるという。【ポイント・注意点】トレードオフとして、issueを詰める手間が増え、仕事の重心が実装から設計を書くことへ移る。朝にレビュー待ちのPRが一度に並ぶため、レビューする側の負荷をどう捌くかが次の課題だとしている。記事には、使っているツールやモデルの名前、skillの中身や実行の詳細、マージや却下の数、Blockedの発生率、品質の指標、費用、対象リポジトリの規模、エラー時の挙動は書かれていない。夜間の連続稼働を任せるには、まず入口の情報を人が詰め切ることが前提になるという点が、この記事の要点である。","2026-11-27","Qiita","https://qiita.com/koki-ishida/items/cb77d042684fa337c4b5"],["スマホからClaude Codeを操作する方法、公式Remote Controlと代替","Caprock創設者のDmitriy Solodukha氏がDEV Communityで、スマホからClaude Codeを操作する方法を比較した。公式のRemote Controlの始め方と必要なプラン、使えない構成、制約を整理し、代替としてCaprock、Happy、Termiusとtmux、Blink Shellを表で紹介する。自社のCaprockについては、QRでの接続やTelegramへの通知、暗号化の仕組みを説明している。","\n【概要】Dmitriy Solodukha氏がDEV Communityで、スマホからClaude Codeを操作する方法を比較した。筆者はCaprockの創設者で、記事は無料の自社製品Caprockの紹介も兼ねる。【背景】まず公式のRemote Controlを整理している。セッション内の/remote-control、またはclaude --remote-controlで始め、ClaudeアプリのCodeタブかclaude.ai/codeから再開する。Pro、Max、Ultra、Team、Enterpriseのプランが必要で、APIキー、Bedrock、Google Cloud、Microsoft Foundry、ANTHROPIC_BASE_URLによるゲートウェイでは使えない。すべてのセッションをつなぐには、/configの「Enable Remote Control for all sessions」をオンにするか、~/.claude/settings.jsonでremoteControlAtStartupをtrueにする。制約として、会話がAnthropicのサーバーに保存されること、ZDRの組織では有効にできないこと、claudeを止めるとオフラインになることを挙げる。【詳細】代替とし
