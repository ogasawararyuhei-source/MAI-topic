った。血液ではインターフェロンの働き、炎症の物質、神経に毒性のあるキノリン酸などの炎症に関わる代謝物が大きく下がった。分析からは、薬が免疫全体を抑え込むのではなく、特定の炎症の経路を調整していることがうかがえた。皮膚の病気や、それに関わる生活の質も改善した。注意力、記憶、語彙、行動の一部の検査でも成績が良くなり、本人や介護者が答えた健やかさの一部の指標や、神経の働きやアルツハイマー病に関わる生体指標の一部にも好ましい変化があった。エスピノサ氏は「過剰な免疫の働きを抑え、一部の炎症の病気を改善できることを示した」と話す。\n【ポイント・注意点】共著者のパテル教授は「神経心理の結果は興味深いが、この薬が認知を改善する証拠ではまだない」と述べ、検査に慣れた影響なども考えられるとしている。薬はダウン症向けには承認されておらず、偽薬と比べる試験が必要だ。ダウン症に伴う退行障害を対象にした別の試験も始まり、結果は2027年に出る見込み。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-immune-overactivity-syndrome-phase-clinical.html"],["脳の大きさを決める遺伝子の「ブレーキ」 外れると神経細胞が25%増","オーストリア科学技術研究所（ISTA）などのチームは、細胞分裂のブレーキ役の遺伝子PTENを、発達中のマウスの大脳皮質のごく一部の前駆細胞だけで働かなくし、その子孫の細胞をたどった。PTENのない前駆細胞は神経細胞を約25%多く作り、支える細胞のアストロサイトもかなり多く作った。どちらの細胞も大きくなっており、PTENの変異に伴う大きな脳（巨脳症）の説明になりうるという。Science Advancesに掲載された。","\n【概要】オーストリア科学技術研究所（ISTA）とパリのソルボンヌ大学、米エール大学などのチームは、脳の発達で細胞の増えすぎを抑える遺伝子PTENが働かなくなると、どのように脳が大きくなるのかを、マウスで細胞の「家系図」をたどって調べ、科学誌Science Advancesに発表した。\n【背景】PTENは細胞分裂のブレーキとして働き、脳の発達では前駆細胞の釣り合いを保つ。PTENの変異は、脳が平均より大きい巨脳症と関連し、腫瘍の危険を高めるほか、自閉スペクトラム症の特性、知的障害、てんかんとも関わる。これらはまとめてPTEN過誤腫症候群と呼ばれる。記事は、巨脳症は統計的な測定の区分で、それ自体が病気を意味するわけではないとしている。マウスでは、胚全体でPTENを止めると生きられず、脳だけで止めると巨脳症になるものの、生まれてすぐに死んでしまうため、詳しい仕組みを追うのが難しかった。\n【詳細】チームは、MADMと呼ぶ手法で、大脳皮質の前駆細胞である放射状グリア細胞のごく一部だけでPTENを働かなくし、蛍光の目印を付けて、その子孫の細胞を発達の間追いかけた。PTENのない放射状グリア細胞1つは、通常より約25%多い神経細胞を作り、脳を支えるグリア細胞の一種アストロサイトもかなり多く作った。同じ前駆細胞が神経細胞とアストロサイトの両方を多く作ることを示したのは初めてだという。できた細胞はどちらも大きくなっていた。また、ふつうアストロサイトづくりに使われるEGFRの経路を止めると、細胞はMAPKという別の経路に切り替えていた。\n【ポイント・注意点】PTENの変異は脳腫瘍の神経膠腫の原因にもなり、EGFR阻害薬が効かなくなる患者もいるため、MAPKが将来の治療の標的になりうると研究者は考えている。ただし結果はマウスのもので、治療は試されておらず、人にそのまま当てはまるとは限らない。アストロサイトの作りすぎが巨脳症を起こしている「可能性が高い」という段階で、原因と証明されたわけではない。記事には調べたマウスの数や詳しい統計は示されておらず、「約25%」という数字の精度は記事からは判断できない。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-genetic-growth-brain-size.html"],["高校卒業期の子を持つ親は「評価されている」と感じる 豪の聞き取り","オーストラリアのグリフィス大学は、高校の終わりが近い16〜19歳の子を持つ親30人に聞き取りを行い、親が社会や周りとの比較、経済や住宅事情への不安、子の様子で子育てを評価されるという感覚などの重圧を感じていると報告した。うまく対処できていた親は、完璧な親という非現実的な理想を手放していた。研究者は現実的な期待と開かれた家族の会話を勧めている。Journal of Adolescent Researchに掲載された。","\n【概要】オーストラリアのグリフィス大学の研究チームは、子どもが高校を終えて大人へと移っていく時期に、親たちがどんな重圧を感じ、どう乗り越えているのかを聞き取りで調べ、青年期研究の専門誌Journal of Adolescent Researchに発表した。論文の題名には、親の言葉として「10代の子は子育ての映し鏡、みんなが評価している」が使われている。\n【背景】子どもが高校を卒業して進学や就職に向かう時期は、子ども本人だけでなく、家族にとっても大きな節目になる。チームには心理学のメラニー・ジマー＝ゲンベック教授や、臨床心理士のターニャ・ホーズ氏も加わった。\n【詳細】研究を率いたのは、同大学応用心理学部のキャシー・ライアン博士。高校の終わりが近い16〜19歳の子を持つ、オーストラリアの親30人に聞き取りを行い、共通する経験と対処の方法を分析した。親が感じていた重圧は4つにまとめられた。1つ目は、周りの家庭の子と比べることや、学業や仕事で成功してほしいという社会からの重圧。2つ目は、景気、住宅の買いやすさ、仕事の見通し、社会の不確かさといった、国や世界の状況が子どもの将来に及ぼす影響への不安。3つ目は、子どもの様子によって自分の子育ての良し悪しを評価されているという感覚。4つ目は、子が自立していく中で、心配や責任、家族関係の変化を受け止める感情の負担だった。\n【ポイント・注意点】臨床心理士のターニャ・ホーズ氏は「完璧な親になろうとする非現実的な考えを手放した親が、最もうまく対処できていた」と話す。他の家庭がもっと大きな困難を抱えている場合もあると気づくことや、子の成長に合わせて関わり方を変えることも助けになっていた。研究者は、現実的な期待と開かれた家族の会話が、大人への健やかな移行を支えるとしている。ただし30人への質的な研究で、ほかの国や集団にそのまま当てはまるとは限らない。こうした重圧がどれほど多くの親に見られるのかや、子どもの将来にどれほど影響するのかは、今回の研究では示されていない。","2026-11-18","Phys.org","https://phys.org/news/2026-11-parents-child-transitions-high-school.html"],["乳児期に発症するニーマン・ピック病C型 米FDAが初の治療薬を承認","米食品医薬品局（FDA）は2026年11月17日、乳児期に発症するまれな神経の病気ニーマン・ピック病C型（NPC）の治療薬として、シクロデキストリン（商品名Adrabetadex）を承認した。後期の試験は承認に必要な臨床の評価項目を満たさなかったが、その後の生存データの評価で、乳児期発症の患者の生存期間が延びることが示された。米国立衛生研究所（NIH）が長年の基礎研究と臨床研究を支えてきた。","\n【概要】米食品医薬品局（FDA）は2026年11月17日、乳児期に発症するニーマン・ピック病C型（NPC）の治療薬として、シクロデキストリン（商品名Adrabetadex）を承認した。米国立衛生研究所（NIH）によると、乳児期発症のNPCに対してFDAが承認した初めての治療になる。\n【背景】NPCは、子どもの神経が急速に衰えていく、まれで命に関わる病気だ。NPC1遺伝子の変異で、脂質やコレステロールを細胞の中で運ぶたんぱく質が足りなくなり、これらが異常にたまって、神経の働きが少しずつ失われ、早く亡くなってしまう。NPCの半数は10歳までに見つかり、2歳までに見つかる場合が最も経過が悪い。子どもは最初に発達の節目の遅れを示し、その後、認知症に似た認知の衰えが起きることがある。\n【詳細】NIHの研究者は1997年に、原因の変異が18番染色体にあることを突き止めた。2006年にはNIHの「ベンチからベッドサイドへ」の仕組みのもとで病気の経過を追う研究が始まり、その後、NICHD（国立小児保健発達研究所）のフォーブス・ポーター氏がFDAから治験の許可を得て、NIH臨床センターで初期の試験を行った。2016年には複数の企業との共同研究開発の契約が結ばれ、多施設・多国籍の後期の試験が支えられた。この試験は生体指標では良い結果を示したが、承認に必要な臨床の評価項目は満たさなかった。その後、ベレン・セラピューティクス社とラッシュ大学医療センターのエリザベス・ベリー＝クラビス医師と行った生存データの評価で、乳児期発症の患者の生存期間が延びることが示された。\n【ポイント・注意点】NIHのバタチャリヤ所長は「近道はなかった」と長年の基礎研究の大切さを強調した。NICHDのジョン・ガイタニス所長は「家族に新しい希望をもたらす」と述べ、ポーター氏は、変異の場所を突き止めた時に望んでいた突破口であり、家族が一緒に過ごせる時間を増やせると話した。ただし記事には患者数や生存期間の具体的な数字、安全性のデータは示されておらず、生存の延長が示されたのは乳児期発症の患者に限られている。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-fda-drug-infantile-onset-niemann.html"],["まれな代謝の病気の子の脳を守る 肝臓の遺伝子を止める治療をマウスで","米デューク大学などのチームは、アミノ酸のリシンをうまく分解できず、子どもの頃に脳が傷つくまれな遺伝の病気「グルタル酸尿症1型」のマウスで、肝臓の遺伝子の働きを小さなRNA（siRNA）で止める治療を試した。治療した大人のマウスはすべて生き残り、生まれたばかりのマウスも高たんぱくの餌で生存が改善し、脳は傷つかなかった。研究者は今後、人での臨床試験を目指している。","\n【概要】米デューク大学医学部の小児科の研究者カール＝ディミター・ビシグ氏が率いるチームは、まれな遺伝性の代謝の病気「グルタル酸尿症1型（GA1）」で起きる脳の損傷を、肝臓の遺伝子の働きを止めることで防げる可能性をマウスで示し、医学誌Science Translational Medicineに発表した。米コロラド大学アンシュッツと製薬会社アルナイラムとの共同研究。\n【背景】GA1では、体がアミノ酸のリシンをうまく分解できず、子どもの頃に有害な副産物が脳にたまり、特に体の動きを担う場所に元に戻らない損傷が起きる。米国ではすべての新生児がこの病気の検査を受ける。今はリシンを減らした食事と、急な神経の症状が出た時の救急の治療が中心で、専用の治療法はない。患者の約3分の1が重い運動の障害を起こし、命に関わる合併症もある。ビシグ氏らは2023年に、有害な物質は肝臓で作られ、血液脳関門を越えて脳に入ることを突き止めていた。\n【詳細】チームは、低分子干渉RNA（siRNA）を使って、リシンの分解に関わる肝臓の遺伝子の働きを止めた。大人のマウスでは治療したすべてが生き残った。生まれたばかりのマウスでも、高たんぱくの餌を与えた場合を含め、治療しなかった群より生存がよかった。治療したマウスでは、脳を含めて有害な副産物が大きく減り、脳に損傷は見られなかった。血液の代謝の指標が神経の経過を予測できることも分かり、治療の見守りに役立つ可能性がある。ビシグ氏は「今あるのは臨床につなげられる方法だ」「希望を与えてくれる」と話している。記事は2023年の発見を、この分野の考え方を大きく変えたものと位置づけている。\n【ポイント・注意点】siRNAは遺伝子を永久に変えない治療で、肝臓を狙うsiRNAの薬はすでに複数が販売されている。ビシグ氏は、年に2〜3回の注射で守れるようになるかもしれないと話す。ただし結果はマウスでの前臨床段階のもので、人での安全性や効果は確かめられておらず、注射の間隔も同氏の見通しにとどまる。","2026-11-18","Medical Xpress","https://medicalxpress.com/news/2026-11-silencing-liver-gene-brain-rare.html"],["「犠牲を払って手伝うのは女の子」 5歳でもう性別の思い込み","米ニューヨーク大学などのチームは、5〜8歳の子ども約200人と大人約200人に、教室の場面で誰が手伝いをするかを尋ねた。遊びの時間をあきらめて準備をするなど、自分を犠牲にする手伝いについては、子どもも大人も女の子のほうがすると予想した。女の子と女性はどの種類の手伝いでも女の子を選び、男の子と男性は犠牲を伴う手伝いだけで女の子を選んだ。Developmental Scienceに掲載された。","\n【概要】米ニューヨーク大学（NYU）などの研究チームは、集団のための手伝いを誰がするかについての性別の思い込みが、5歳ほどの子どもにもすでに見られることを示し、発達科学の専門誌Developmental Scienceに発表した。特に、自分を犠牲にする手伝いで、女の子のほうがすると予想されていた。\n【背景】集まりの準備や片付けのような、集団のための「奉仕」の仕事は、女性や女の子と結び付けられやすい。大人ではこうした思い込みが研究されてきたが、いつ頃から始まるのかは分かっていなかった。論文の題名は「奉仕についての性別の思い込みの発達」で、NYUが成果を発表した。チームは、子どもと大人の両方に同じ質問をして比べた。\n【詳細】参加したのは5〜8歳の子ども約200人と大人約200人。教室の4つの場面で、3種類の手伝いを示した。自分に負担のない奉仕、自分に負担のある奉仕、そしてブランコから落ちた子を助けるような特定の人への手助けである。たとえば負担のある場面では、友達との休み時間をあきらめて教材を準備する子を、負担のない場面では、もともと外に出たくなかった子が準備する様子を示した。参加者は男の子と女の子が描かれた絵を見て、どちらが手伝うかを答えた。その結果、子どもも大人も、負担のある奉仕は女の子のほうがすると予想した。女の子と女性は3種類すべてで女の子を選んだ。男の子と男性は負担のある奉仕だけで女の子を選び、ほかの2種類では偏りがなかった。\n【ポイント・注意点】筆頭著者のソフィー・アーノルド氏（現プリンストン大学）は、性別による期待は集団のための個人的な犠牲を求められる時に最も強く、奉仕の行動の男女差が育っていく道筋の一つかもしれないと述べている。上席著者のアンドレイ・シンピアン教授は、思い込みは一様ではないが5歳の子にも見られると話す。ただし調べたのは予想であって実際の行動ではなく、大人の職場や家庭の差とのつながりは可能性の段階にとどまる。記事には参加者の正確な人数やその内訳、効果の大きさなどの統計の詳細も示されていない。","2026-11-17","Phys.org","https://phys.org/news/2026-11-boys-girls-unsurprising.html"],["肥満の10代、チルゼパチドで半数超が肥満の基準を下回る","肥満の12〜18歳未満の160人を対象に、6か国31施設で72週間行われた二重盲検の第3相試験で、週1回注射の薬チルゼパチドを使った群は体格指数（BMI）が平均18.5%下がり、約54%が年齢と性別の肥満の基準を下回った。偽薬の群では7.1%にとどまった。身長の伸びや思春期の進み方は正常だったが、消化器の症状は薬の群の81.5%に出た。米医学誌JAMAに掲載された。","\n【概要】肥満の10代を対象にした第3相臨床試験「SURMOUNT-ADOLESCENTS」で、週1回注射する薬チルゼパチド（商品名ゼップバウンド）を使った群の半数を超える人が、年齢と性別に応じた肥満の基準を下回った。Aaron S. Kelly氏らが米医学誌JAMAに発表した。\n【背景】チルゼパチドは、血糖の調整や満腹感に関わる2つの消化管ホルモン、GIPとGLP-1の働きをまねる薬だ。肥満は世界の約8人に1人に見られ、米国の10代では約5人に1人が肥満だという。これまでの試験の多くは大人が対象で、10代での証拠は限られていた。\n【詳細】試験は無作為化・二重盲検・偽薬対照で、薬と偽薬を2対1の割合で割り当てた。対象は、肥満、または高血圧や糖尿病予備群などの合併症を伴う過体重の12〜18歳未満の160人で、カナダ、チェコ、イスラエル、イタリア、ポーランド、米国の31施設で行われた。週1回2.5mgから始め、4週ごとに増やして5、10、15mgのいずれかの最大量まで上げ、72週間続けた。両方の群が、運動の目標や量を整えた食事について個別の助言を受けた。BMIは薬の群で平均18.5%下がり、偽薬の群では0.5%増えた。肥満の基準を下回ったのは薬の群の約54%、偽薬の群の7.1%で、薬の群の約80%がBMIを5%以上減らした。体重は偽薬の群より平均20.1kg多く減り、血圧、コレステロール、血糖も改善した。身長の伸びと思春期の進み方は正常で、薬の群の10代は日々の活動での体の楽さも高く評価した。記事は、BMIの変化は体重の減少率とは同じではないと注意している。\n【ポイント・注意点】消化器の症状は薬の群の81.5%（多くは軽〜中等度）、偽薬の群の54.9%に出て、約9.3%が副作用で薬を早めにやめた。重い肥満には生活習慣の改善だけでは足りないことが多いと記事は指摘している。比較的小さな試験で追跡期間も限られており、長期の安全性や、薬をやめた後どうなるかを確かめる、より長く幅広い研究が必要とされている。","2026-11-17","Medical Xpress","https://medicalxpress.com/news/2026-11-tirzepatide-teens-obesity-threshold-clinical.html"],["はしかを持って生まれる赤ちゃん 米国で13例、医師が懸念","米疾病対策センター（CDC）の科学者による公衆衛生の警告によると、2025年初めから9月末までに、米国で胎内ではしかに感染して生まれた「先天性麻疹」が13例報告された（暫定値）。妊娠中のはしかの確定例は112例で、ほぼ全員がワクチン未接種か接種歴不明だった。分娩直前に感染した母親から生まれた赤ちゃんの25〜30%が感染しうるとされ、医師たちは警戒を強めている。","\n【概要】米国ではしか（麻疹）の大きな流行が続く中、母親の胎内で感染して生まれる「先天性麻疹」の赤ちゃんが相次いでいることに、医師たちが懸念を示している。AP通信が報じ、Medical Xpressが転載した。もとになったのは、CDCの科学者がミネソタ大学の感染症研究政策センターと共同で、医学誌NEJM Evidenceに出した公衆衛生の警告だ。\n【背景】先天性麻疹は、妊娠中の女性がおなかの赤ちゃんにウイルスを移すことで起きる。MMRワクチンは妊娠中には打てず、ワクチンを受けておらず、はしかにかかったこともない出産年齢の女性が増えていることが背景にあると、ミネソタ大学のマイケル・オスターホルム医師はみている。\n【詳細】CDCの暫定の数字では、2025年初めから9月末までに先天性麻疹が13例報告された。妊娠中のはしかの確定例は112例で、ほぼ全員がワクチン未接種か接種歴不明だった。米国小児科学会は、分娩の直前にはしかにかかった人から生まれた赤ちゃんの25〜30%が感染しうると推計している。主な症状は発熱、黄疸、はしかの発疹で、重い合併症には肺炎、脳炎、そして感染から数年後に現れる、ほとんどが命に関わる脳の病気の亜急性硬化性全脳炎（SSPE）がある。先天性麻疹の子はSSPEの危険が高く、より早く発症する可能性もあると、同学会のアダム・ラトナー医師は話す。米国の2025〜26年度の幼稚園児のMMR接種率は92.4%で、流行を防ぐ目安の95%を下回る地域も多い。CDCによると、米国のはしかは過去2年で7,500件を超えた。現在最も大きな流行はペンシルベニア州で起きており、州の保健当局は医療機関や学校、保育施設に向けて注意を呼びかけている。\n【ポイント・注意点】ワクチンを受けていない妊婦がはしかにさらされた場合、6日以内なら抗体の治療で感染や合併症の危険を下げられる。流行地域では生後6か月から1回目の接種を受けられる。胎盤を通じて受け取った母親の抗体は、生まれてから数か月は赤ちゃんを守る。13例と112例はいずれも暫定値である。","2026-11-17","Medical Xpress","https://medicalxpress.com/news/2026-11-doctors-babies-born-measles.html"],["思春期を抑える薬、一部の18歳未満に 豪州の公的機関が助言案","オーストラリアの国立保健医療研究評議会（NHMRC）は、自分の性別に違和感を持つ「性別不合」の18歳未満の若者の一部に、思春期の進みを抑える薬を使えるようにすべきだとする助言の案を公表した。根拠の確かさは「低い」と評価しつつ、一部の若者では利益がリスクを上回る見込みが高いと結論づけた。治療を研究の場に限るよう勧めた英国などの方針とは大きく異なる。意見の募集は1月18日まで続く。","\n【概要】オーストラリアの国立保健医療研究評議会（NHMRC）が、思春期を抑える薬（思春期抑制薬）について助言の案を公表した。案は、この薬を「性別不合」のある18歳未満の一部の若者が使えるようにすべきだとしている。豪研究者のMatthew Mitchell氏が解説記事を寄せ、Medical Xpressが2026年11月17日に掲載した。\n【背景】2025年1月、クイーンズランド州は公的な医療で、新しい患者が思春期抑制薬や性別適合のホルモン治療を始めることを止めた。NHMRCの見直しは、その3日後に発表された。英国などほかの国でも制限が導入されたり検討されたりしており、米国では多くの州が未成年への治療を禁じている。\n【詳細】見直しは、根拠の確かさを「低い」と評価した。ランダム化比較試験がないためだ。それでも委員会は、一部の若者にとっては利益がリスクを上回る見込みが高いと結論づけた。治療は本人が苦痛を感じていても、いなくても検討できるとしており、先に苦痛や精神疾患の診断があることは求めていない。判断は一人ひとりについて、若者本人、親や養育者、医師が一緒に行う形を支持している。2024年の英国のキャス・レビューは治療を研究の場に限るよう勧めており、記事は今回の案をこれと大きく異なるものだと説明している。豪州には全国の人数の集計がない。2026年7月の時点で、西オーストラリア州では58人、クイーンズランド州では77人の若者がこの薬を使っていた。合わせた135人は、2つの州の18歳未満の人口の約0.007%にあたる。\n【ポイント・注意点】助言に法的な拘束力はなく、公的な医療での扱いは各州・準州が決める。クイーンズランド州の制限は続き、北部準州も公的な医療で思春期抑制薬を禁じており、両政府とも変更を否定した。全国の診療指針は2028年にまとまる予定だ。長い順番待ちや、年5,000豪ドルを超えることもある治療費の問題も解決しておらず、家族によっては治療を受けられない状況が残る。案は意見募集の段階で、確定した方針ではない点に注意が必要だ。","2026-11-17","Medical Xpress","https://medicalxpress.com/news/2026-11-advice-puberty-blockers-trans-genderdiverse.html"],["乳児の発達検査、自宅のビデオ通話でも対面とほぼ同じ結果","米カリフォルニア大学デービス校のMINDインスティテュートは、乳児向けの遠隔の発達検査「TEDI」を、同じ乳児111人で対面の検査と比べた。自閉症やADHDの家族歴がある子を含む生後6〜18か月の乳児で、自宅での検査の点数は対面とおおむね一致した。家族からは、自宅のほうが赤ちゃんがいつもの様子でいられるという声もあった。Journal of Clinical Child and Adolescent Psychologyに掲載された。","\n【概要】米カリフォルニア大学デービス校（UCデービス）のMINDインスティテュートの研究チームは、乳児の発達をビデオ通話で調べる遠隔の検査「TEDI」が、研究室での対面の検査とほぼ同じ結果を示すことを、同じ乳児で確かめた。成果は臨床児童・青年心理学の専門誌に掲載された。\n【背景】TEDIは、同大学の准教授メーガン・タルボット氏が開発した。多くの子どもがまだ診断を受けられない乳児期に、自閉症のきょうだいがいる、あるいは親にADHDがあるなど、発達の違いが出やすい乳児を対象にしている。自宅で集めたデータと研究室のデータを同じ乳児で比べた研究は、これまでほとんどなかったという。\n【詳細】研究には乳児111人が参加した。自閉症の家族歴がある子が33人、ADHDの家族歴がある子が51人、どちらもない子が27人だった。それぞれの乳児が、1か月以内に研究室での対面の検査と遠隔のTEDIの両方を受けた。時期は生後6か月か9か月、12か月、18か月のいずれかだった。TEDIは60分で、家族には小さなおもちゃのセットが届く。検査者はパソコンやスマートフォン、タブレットのビデオでつながり、いないいないばあ、シャボン玉遊び、歌などの活動を親に手ほどきしながら、言葉の理解、やりとり、遊び、問題解決の力、自閉症やADHDに関わる行動を見る。対面と遠隔の点数はおおむね一致し、タルボット氏は「とてもよく似た」発達の姿が得られたと話す。多くの家族が、赤ちゃんは自宅のほうが落ち着き、いつもの様子でいられると感じ、移動しなくてよい便利さも評価した。\n【ポイント・注意点】記事には一致の度合いを示す統計の数字はなく、TEDIが将来の診断を予測できるかはまだ示されていない。スペイン語版の試験や、遠隔検査と親への手ほどきを組み合わせた研究も始まっている。共著者でハワイ大学マノア校のミーガン・ミラー氏は、早期の発達の評価をより身近にするための大切な一歩だと述べた。参加者の数は年齢や家族歴によって偏りがあり、結果は「おおむね一致」であって同じではない。","2026-11-16","Medical Xpress","https://medicalxpress.com/news/2026-11-telehealth-tool-yields-infant-scores.html"],["母乳育児の母親はうつの症状が少なめ 4か国1万2千人の分析","アラブ首長国連邦のシャルジャ大学などのチームは、レソト、モザンビーク、ネパール、バングラデシュの4か国で、15〜49歳の母親1万2,257人の調査データを分析した。全体では5.7%にうつの症状があり、母乳育児とうつの症状にはおおむね逆の関係が見られた。関係の強さは国によって違い、最もはっきりしていたのはバングラデシュと4か国をまとめた分析だった。Discover Mental Healthに掲載された。","\n【概要】アラブ首長国連邦のシャルジャ大学の研究者らは、低・中所得の4か国の母親を対象に、母乳育児と母親のうつの症状の関係を調べ、母乳育児をしている母親ほどうつの症状が少ない傾向があるとする結果を、専門誌Discover Mental Healthに発表した。\n【背景】母親のうつは、妊娠中の女性の推定10〜13%、世界の母親の約13%に見られ、低・中所得国では19.8%に達するとされる。質の高い母乳育児の相談支援が、授乳のやり方を良くし、母親の苦しさも和らげることが示されてきた。\n【詳細】チームは、各国で行われている人口保健調査（DHS）のデータを使い、アフリカのレソトとモザンビーク、南アジアのネパールとバングラデシュの、15〜49歳の母親1万2,257人を分析した。国ごとの人数は、レソト793人、モザンビーク5,092人、バングラデシュ4,971人、ネパール1,401人。うつの症状は、患者健康質問票（PHQ）をもとにした質問で調べ、母親の年齢、教育、世帯の豊かさを考慮して分析した。全体では94.3%にうつの症状がなく、5.7%に症状があった。調査時点で母乳育児をしていたのは96.1%だった。症状のある人の割合は、レソト6.3%、モザンビーク7.6%、バングラデシュ4.0%、ネパール5.1%で、母乳育児の割合はネパールが98.9%と最も高かった。母乳育児とうつの症状にはおおむね逆の関係が見られたが、強さは国によって違い、最も一貫していたのはバングラデシュと4か国をまとめた分析だった。\n【ポイント・注意点】研究者は、母乳育児の支援の場を、母親の心の健康を支える入り口として生かせると提案している。母乳育児がほぼ当たり前の地域では、授乳が難しい母親やうつの症状がある母親が見落とされやすい点にも注意が必要だという。ただし対象は4か国に限られ、原因と結果の向きを確かめるには、時間を追う研究が必要とされている。母親の仕事の負担を減らす、栄養を良くする、産後の心の支援を広げるといった、より広い支えも必要になりうるという。","2026-11-16","Medical Xpress","https://medicalxpress.com/news/2026-11-breastfeeding-maternal-depressive-symptoms.html"],["幼い子も「良い人」と見られたい 社会的アイデンティティの起源","独ライプツィヒ大学などの研究者は、行動の研究や、類人猿と人間の子どもを比べた研究、子どもの発達の研究をおよそ2年かけて分析し、人間の最初の社会的アイデンティティは、自分の文化の集団の決まりを守る「良い一員」としての自分だったとする説を示した。とても幼い子どもでも、集団の決まりを尊重し、集団の行いに責任を感じるという。成果は英王立協会の学術誌に掲載された論文で示された。","\n【概要】独ライプツィヒ大学の研究者らは、人が自分をある集団の一員として捉える「社会的アイデンティティ」が、人の進化の中でどのように生まれたのかを論じた分析を、英王立協会の学術誌Philosophical Transactions of the Royal Society Bに発表した。とても幼い子どもでも、道徳的に良い集団の一員として見られたいと考えることが、その手がかりになるという。\n【背景】社会的アイデンティティは、これまで主に心理学の立場から研究されてきた。一方で、その進化の起源にはあまり目が向けられてこなかった。記事は、道徳と協力に基づく最初の人間の社会が、早ければ13万年前にさかのぼると紹介している。\n【詳細】論文の筆頭著者はレオン・リー氏で、セバスチャン・グリューナイゼン氏が共著者に名を連ねる。チームは約2年をかけて、社会的アイデンティティに関する行動の研究、大型類人猿と人間の子どもを比べた研究、社会的な場面での子どもの行動を調べた発達の研究を分析した。これらの研究からは、子どもが自分の集団の決まりを尊重し、ほかの集団より自分の集団をひいきすることがうかがえる。とても幼い子どもでも、集団の仲間と共有している知識に気づき、集団の行いに責任を感じるという。研究者は、初期の人類が最初に自分を重ねた集団は自分の文化の集団で、最初の社会的アイデンティティは「決まりを守る良い一員」としての自分だったと論じている。人の協力は、進化でも一人ひとりの発達でも、直接知っている相手との協力から、会ったことのない人も含む集団全体との協力へと、2段階で育つとしている。\n【ポイント・注意点】今回の論文は新しい実験ではなく、既存の研究をまとめた理論的な分析である。リー氏は、子どもが決まりに従うのは集団の決まりを自分のものにしたからなのか、集団の中での評判を保ちたいからなのかは、さらに研究が必要だと述べている。記事は分析に使った個々の研究や参加者の数を示しておらず、証拠の強さを確かめるには論文そのものに当たる必要がある。","2026-11-16","Phys.org","https://phys.org/news/2026-11-analysis-young-children-morally-good.html"]]};
let memos=[]; // {cat,title,note,date}
const OLD_CUT="2026-11-07";
function isOld(d){return d<OLD_CUT}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
/* ===== 項目（ジャンル）はデータ駆動：CATS／DATAに足すだけで自動で増えます ===== */
const extraCats=[];
function allCats(){
  const list=CATS.slice();
  Object.keys(DATA).forEach(id=>{ if(!list.some(c=>c.id===id)) list.push({id:id,name:id,desc:"追加された項目",img:"hero"}); });
  extraCats.forEach(c=>{ if(!list.some(x=>x.id===c.id)) list.push(c); });
  return list;
}
let cats=allCats();
let catIdx=0;
const artIdxMap={};
function itemsOf(c){return (DATA[c.id]||[]).map((a,i)=>({a:a,oi:i})).sort((x,y)=>y.a[3].localeCompare(x.a[3]))}
function curCat(){return cats[catIdx]}
function curItems(){return itemsOf(curCat())}
function curArtIdx(){const n=curItems().length;if(!n)return 0;let i=artIdxMap[curCat().id]||0;if(i>=n)i=n-1;if(i<0)i=0;return i}
function renderStage(dir){
  cats=allCats(); if(catIdx>=cats.length)catIdx=cats.length-1; if(catIdx<0)catIdx=0;
  const c=curCat(), items=curItems(), ai=curArtIdx();
  const total=cats.reduce((s,x)=>s+(DATA[x.id]||[]).length,0);
  document.getElementById('heroText').innerHTML="<b>今日のまとめ — 全"+cats.length+"ジャンル・"+total+"件。</b> タイトルと概要は日本語、カードの「和訳全文を読む」で全文が開きます。新しい順に並べ、48時間より古い記事はグレー表示です。";
  document.getElementById('catName').textContent=c.name;
  document.getElementById('catDesc').textContent=c.desc||"";
  document.getElementById('catCount').textContent="ジャンル "+(catIdx+1)+" / "+cats.length;
  document.getElementById('catDots').innerHTML=cats.map((x,i)=>'<button class="dot'+(i===catIdx?' active':'')+'" data-cat="'+i+'" aria-label="'+x.name+'へ移動"></button>').join('');
  document.querySelectorAll('#catDots .dot').forEach(d=>{d.onclick=()=>{const n=+d.dataset.cat; if(n!==catIdx){const dd=n>catIdx?'down':'up'; catIdx=n; renderStage(dd);}}});
      const slot=document.getElementById('cardSlot');
  if(!items.length){
    slot.innerHTML='<article class="card"><div class="empty"><div class="big">✦</div><p><b>'+c.name+'</b> は追加されたばかりの項目で、まだ記事がありません。</p><p>毎日の更新でこの項目の記事が集まると、ここに表示されます。<br>上スワイプで他のジャンルへ移動できます。</p></div></article>';
    document.getElementById('artDots').innerHTML=""; document.getElementById('artCount').textContent="0 / 0"; return;
  }
  const it=items[ai], a=it.a, old=isOld(a[3]);
  slot.innerHTML='<article class="card'+(old?' old':'')+(dir?' anim-'+dir:'')+'">'
    +'<img class="ph" src="'+IMGS[c.img]+'" alt="'+c.name+'のイメージイラスト">'
    +'<div class="cbody"><div class="meta"><span class="badge'+(old?' oldb':'')+'">'+(old?'少し前':'NEW')+'</span><span>'+a[3]+'</span><span>'+(ai+1)+' / '+items.length+'</span></div>'
    +'<h3>'+a[0]+'</h3><p class="sum">'+a[1]+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="openArticle(\''+c.id+'\','+it.oi+')">和訳全文を読む</button>'
    +'<button class="btn ghost" onclick="quickMemo(\''+c.id+'\','+it.oi+',this)">メモ保存</button>'
    +'<button class="btn ghost" onclick="shareArticle(\''+c.id+'\','+it.oi+')">共有</button></div>'
    +'<div class="src">出典：'+a[4]+'<br><a href="'+a[5]+'" target="_blank" rel="noopener">原文を開く</a></div></div></article>';
  document.getElementById('artDots').innerHTML=items.map((x,i)=>'<span class="dot'+(i===ai?' active':'')+'"></span>').join('');
  document.getElementById('artCount').textContent="記事 "+(ai+1)+" / "+items.length;
  requestAnimationFrame(fitCard);
}

function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;
  const sum=card.querySelector('.sum'), h3=card.querySelector('h3'), ph=card.querySelector('.ph');
  let ss=14, hs=Math.min(21, Math.max(17, window.innerWidth*0.044)), phh=ph?Math.round(ph.getBoundingClientRect().height):0; const ph0=phh;
  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }
    if(hs>13){ hs-=0.5; if(h3) h3.style.fontSize=hs+'px'; continue; }
    break;
  }
}
window.addEventListener('resize', fitCard);
function nextArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i>=n-1)return;artIdxMap[curCat().id]=i+1;renderStage('next')}
function prevArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i<=0)return;artIdxMap[curCat().id]=i-1;renderStage('prev')}
function nextCat(){if(catIdx>=cats.length-1)return;catIdx++;renderStage('down')}
function prevCat(){if(catIdx<=0)return;catIdx--;renderStage('up')}
/* ===== スワイプ操作（スクロールではなくスワイプで移動） ===== */
const stage=document.getElementById('stage');
let sx=null, sy=null, swipedAt=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;
  swipedAt=Date.now();
  if(Math.abs(dx)>Math.abs(dy)){ dx<0?nextArt():prevArt(); } else { dy<0?nextCat():prevCat(); }
});
stage.addEventListener('click',e=>{ if(Date.now()-swipedAt<120){e.stopPropagation();e.preventDefault();} },true);
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')nextArt(); else if(e.key==='ArrowLeft')prevArt();
  else if(e.key==='ArrowDown'){e.preventDefault();nextCat();} else if(e.key==='ArrowUp'){e.preventDefault();prevCat();}
});
/* ===== 項目の追加 ===== */
document.getElementById('addCatBtn').onclick=()=>{document.getElementById('newCatName').value="";document.getElementById('newCatDesc').value="";document.getElementById('addDlg').showModal()};
document.getElementById('addCatSave').onclick=()=>{
  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast("項目名を入力してください");return}
  const desc=document.getElementById('newCatDesc').value.trim()||"追加された項目";
  const id='custom-'+Date.now();
  extraCats.push({id:id,name:name,desc:desc,img:'hero'}); DATA[id]=[];
  cats=allCats(); catIdx=cats.length-1;
  document.getElementById('addDlg').close(); renderStage('down');
  toast("項目「"+name+"」を追加しました");
};
/* ===== 記事ダイアログ・メモ・共有 ===== */
function openArticle(cat,idx){
const c=allCats().find(x=>x.id==cat); const a=DATA[cat][idx];
document.getElementById('dlgIn').innerHTML=`<img src="${IMGS[c.img]}" alt=""><div class="meta" style="margin-top:10px"><span>${c.name}</span><span>${a[3]}</span></div><h3>${a[0]}</h3><p class="sum" style="font-size:14px">${a[1]}</p><div class="full">${a[2]}</div>
<p class="src" style="margin-top:12px">出典：${a[4]} — <a href="${a[5]}" target="_blank" rel="noopener">${a[5]}</a></p>
<div class="memoBox"><label style="font-weight:800;font-size:14px">ひとことメモ</label><textarea id="memoText" placeholder="気づいたこと、作りたいもの、家族への共有メモなど"></textarea>
<div class="actions"><button class="btn primary" onclick="saveMemo('${cat}',${idx})">このメモを保存</button><button class="btn ghost" onclick="shareArticle('${cat}',${idx})">iPhoneで共有</button><button class="btn ghost" onclick="document.getElementById('dlg').close()">閉じる</button></div></div>`;
document.getElementById('dlg').showModal();
}
function quickMemo(cat,idx,btn){const a=DATA[cat][idx];memos.unshift({cat,title:a[0],note:"",date:a[3]});updateMemoUI();btn.textContent="保存しました";btn.classList.add('saved');toast("メモに保存しました（このページを開いている間）")}
function saveMemo(cat,idx){const a=DATA[cat][idx];const note=document.getElementById('memoText').value.trim();memos.unshift({cat,title:a[0],note,date:a[3]});updateMemoUI();toast("メモを保存しました");document.getElementById('dlg').close()}
function updateMemoUI(){document.getElementById('memoCount').textContent=memos.length;const area=document.getElementById('memoList');
if(!memos.length){area.innerHTML='<p class="sum">まだメモがありません。記事の「メモ保存」をタップしてください。</p>';return}
area.innerHTML=memos.map(m=>`<div class="memoItem"><b style="font-size:14px">${m.title}</b><div style="font-size:13px;color:var(--muted)">${m.note||"（ひとことメモなし）"} ・ ${m.date}</div></div>`).join('')}
function exportMemos(){if(!memos.length){toast("まだメモがありません");return}const txt="MAI topic メモ — 2026-11-10\n\n"+memos.map((m,i)=>`${i+1}. ${m.title}\n${m.note||""}\n`).join("\n");const b=new Blob([txt],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="mai-topic-memo-2026-11-10.txt";a.click();URL.revokeObjectURL(u)}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}} try{await navigator.clipboard.writeText(text);toast("コピーしました — メモアプリなどに貼り付けできます")}catch(e){toast("共有できませんでした")}}
function shareArticle(cat,idx){const a=DATA[cat][idx];shareText(a[0],`${a[0]}\n\n${a[1]}\n\n出典：${a[4]} ${a[5]}`)}
function shareMemos(){if(!memos.length){toast("まだメモがありません");return}shareText("MAI topic メモ",memos.map(m=>`・${m.title} ${m.note}`).join("\n"))}
document.getElementById('sharePage').onclick=()=>shareText("MAI topic","MAI topic — 2026年11月20日朝版（全"+cats.length+"ジャンル）");
document.getElementById('memoBtn').onclick=()=>{updateMemoUI();document.getElementById('memoDlg').showModal()};
updateMemoUI();
renderStage();
</script>

try {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
} catch (e) {}
</script>
