て、Caprock（無料、Apache-2.0）、Happy（MIT）、Termiusとtmux、Blink Shell（GPL-3.0、年19.99ドル）を表で比べる。Caprockは、コンピューター側の設定で「Use on your phone」を選ぶとQRコードが出て、スマホで読み取ると接続できる。QRは1回限りで5分間有効だ。Telegramへの通知は、同じ種類の通知はセッションごとに3分に1回、1時間に20回までに抑えられる。通信はNoise NK、X25519、AES-GCMで暗号化され、中継サーバーは中身を読めないと説明する。iPhone版は無料でiOS 15以降に対応し、v1.2は2026年11月17日に公開された。【ポイント・注意点】記事は自社製品を勧める立場で書かれており、実測した性能や検証の結果は示されていない。Caprockが起動していないターミナルのセッションは閲覧のみだという。","2026-11-27","DEV Community","https://dev.to/dspv/how-to-control-claude-code-from-your-phone-ona"],["1台のマシンで2つのClaude Codeアカウントを使う方法と引き継がれない物","Arun氏がDEV Communityで、利用枠に達しても作業を止めないために、1台のマシンで2つのClaude Codeアカウントを使う方法をまとめた。環境変数CLAUDE_CONFIG_DIRに別のフォルダを指定すると別アカウントとして動き、/loginで2つ目にサインインする。セッション履歴やユーザー単位のMCPサーバー、個人の設定などは引き継がれないとして、共有の方法も示している。","\n【概要】Arun氏がDEV Communityで、1台のマシンで2つのClaude Codeアカウントを動かす方法と、その際に引き継がれないものを整理した。Claude Codeの利用枠には数時間単位のセッション枠と週単位の枠があり、上限に達すると作業が止まる。それを避けるため、同じマシンで2つ目のアカウントを使う方法を示す。【背景】仕組みは、環境変数CLAUDE_CONFIG_DIRに別のフォルダを指定すると、Claude Codeがそのフォルダを設定の置き場として別のアカウントとして動くというものだ。例えばCLAUDE_CONFIG_DIR=~/.claude-workを付けて起動すると未ログインの状態になるので、/loginで2つ目のアカウントにサインインする。【詳細】持ち越されないものは、projects/にあるセッションの履歴、ユーザー単位のMCPサーバー、個人のsettings.jsonとCLAUDE.md、スキル、ログインの状態だ。記事の例では、claude mcp listが元のフォルダでは8件、作業用のフォルダでは0件だった。リポジトリの中にあるCLAUDE.md、.claude/settings.json、.mcp.jsonは両方で共有される。対策として、共有したい設定はリポジトリに置く、MCPは-s userで登録し直す、個人のファイルはln -sでつなぐ、の3つを挙げ、.claude.jsonはシンボリックリンクにしないよう注意している。macOSでは認証情報がファイルではなくKeychainに保存され、設定フォルダごとに1つの項目になる。アカウントの間で仕事を引き継ぐには、HANDOFF.mdを書かせて別のアカウントで読ませる。【ポイント・注意点】検証の範囲はmacOS、Claude Code 2.1.332、Codex CLI 0.172.0である。シンボリックリンクの動作や、/status、/usage、--resumeのアカウント別の挙動は実行していないと明記している。複数のアカウントの使用については各社の規約を確かめるよう勧めるが、Anthropicの方針は示していない。筆者は同じフォルダ構成を管理するMacアプリOffrunを作っているが、記事の内容はそれがなくても使えるという。","2026-11-27","DEV Community","https://dev.to/offrun/how-to-run-two-claude-code-accounts-on-one-machine-and-what-doesnt-carry-over-468b"],["pushしたClaudeにCIの失敗を知らせる、guard 0.4.21のci_notice","BoxdawnのJEONSEWON氏がDEV Communityで、Claude Codeがgit pushの後に次へ進んでしまい、GitHub Actionsの失敗に気づけない問題に対し、guard 0.4.21で追加したci_noticeを紹介した。push後にそのコミットのCI結果を最大25分待ち、直前に通っていたワークフローが失敗したときだけ通知する。通知のみで、修正やpushのブロックはしない。","\n【概要】BoxdawnのJEONSEWON氏がDEV Communityで、自身が作るguardの0.4.21で、pushの後にCIが壊れたことをClaudeに知らせる機能を加えたと紹介した。Claudeはgit pushの後に作業が終わったと判断して次に進むため、数分後にGitHub Actionsが失敗しても、そのセッションは気づけない。0.4.21では、pushの後にCIの結果を待って通知する、オプトインのci_noticeを追加した。【背景】設定は、guardを0.4.21に更新し、/pluginでci_noticeをオンにして、Claude Codeを再起動するだけだ。前提として、リポジトリにGitHub Actionsがあること、ghが入ってログイン済みであること、gitとghがPATHにあることが必要になる。【詳細】pushの後、そのコミットに対するActionsの結果を最大25分待つ。3分以内に実行が現れなければ待つのをやめる。同じワークフローで直前に成功していた実行が今回失敗した場合に通知し、通知にはワークフロー、ジョブ、ステップの名前と、アノテーションの数行が入る。25秒ごとにgh run listを呼ぶため、自分のGitHub APIの上限を使う。通知は1回のpushにつき1回、1セッションにつき最大3回までだ。デモのリポジトリでは、通知を受けたClaudeがgh run viewで失敗したログを読み、自分のコミットが原因だと報告した。修正はせず、テストを直すかrevertするかの判断を人に委ねたという。検証はWindowsでの1回だけである。【ポイント・注意点】ci_noticeは通知だけで、pushを止めたり、CIを再実行したり、何かを変更したりはしない。対象はClaudeが実行したBashやPowerShellからのpushだけで、端末から直接行ったpushや、--dry-run、--delete、--tags、--allを付けたpushは対象外だ。「新たに壊れた」の判定は前回の実行との比較なので、変更と無関係な失敗も報告しうると明記している。macOSやLinuxでの検証、ci_noticeの既定値は書かれていない。ページの紹介欄ではguardを無料でソースを公開しているものと説明している。","2026-11-27","DEV Community","https://dev.to/boxdawn/claude-pushed-and-moved-on-guard-0421-can-tell-it-the-push-broke-ci-29em"],["MacでClaude Desktopの複数アカウントを同時に使うclaude-desktop-twins","Quang Dang氏がDEV Communityで、一度に1つのアカウントしか使えないClaude Desktopを、Macで複数のアカウントで並べて使う無料のMITライセンスのCLI「claude-desktop-twins」を紹介した。Claude.appのAPFSクローンに固有のバンドルIDを付け、専用のデータフォルダで起動する。Claude Desktopの更新のたびに作り直しが要るなど、制約も明記している。","\n【概要】Quang Dang氏がDEV Communityで、Macで複数のClaude Desktopアカウントを動かす方法として、無料でMITライセンスのCLI「claude-desktop-twins」を紹介した。Claude Desktopは一度に1つのアカウントしか使えず、切り替えるにはサインアウトとサインインが必要になる。【背景】open -nで--user-data-dirを指定して2つ目を起動する方法もあり、ログインはできる。しかしmacOS上では同じアプリとして扱われ、Dockのアイコンや通知の設定を共有するため、通知から誤ったアカウントで返信してしまうおそれがあると筆者は指摘する。【詳細】claude-desktop-twinsは、Claude.appのAPFSクローンを作って固有のバンドルIDと表示名を付け、専用のデータフォルダを指す起動の仕組みを足し、ad-hocの署名で通知を使えるようにする。そのコピーだけ自動更新を止める。手順は、Homebrewで入れ、cdt addで仕事用と個人用のアカウントを登録し、cdt openで開くというものだ。Claude Desktopを更新した後は元のアプリを一度開いてからcdt rebuildを実行する。Claude Codeについては、Codeタブが~/.claudeをまるごと共有するため、ターミナル版ではCLAUDE_CONFIG_DIRを分けるよう勧めている。【ポイント・注意点】動かすにはmacOS 12以上と、/ApplicationsにあるClaude Desktop、XcodeのCommand Line Toolsが必要だ。パスキーとSecure Enclaveはコピーでは動かない。作り直すたびにKeychainへのアクセスを改めて求められ、コピーは自動更新されないため、更新後にはcdt rebuildが要る。非公式のツールでAnthropicとは関係がないと明記している。WindowsやLinuxへの対応、利用規約上の扱いは書かれていない。CLIは無料だが、⌥1〜⌥9での切り替えやワンクリックの更新、使用量の上限の表示を備えたメニューバーアプリの有料版Claude Desktop Twins Premiumもあり、その価格は記事に書かれていない。","2026-11-27","DEV Community","https://dev.to/dakiquang/how-to-run-multiple-claude-desktop-accounts-on-a-mac-free-mit-4cjo"],["ピクセルアートの事務所でClaudeエージェントが働くVirtual Office","Owain Williams氏がDEV Communityで、複数のClaude Codeセッションを並べると何をしているか見失う問題に対し、マネージャー役のエージェントにだけ話しかけ、他のエージェントはピクセルアートの事務所で働くローカルアプリ「Virtual Office」を公開した。6体の役割とモデルを決め、各タスクは独立したgit worktreeで進める。pushやPRのマージなどは承認カードで人が確認する。","\n【概要】Owain Williams氏がDEV Communityで、Claudeのエージェントたちがピクセルアートの事務所で働くローカルアプリ「Virtual Office」を公開した。もとはowain.codesに掲載された記事である。複数のClaude Codeセッションを並行して使うと、どの端末が何をしているか把握しにくい。そこで筆者は、マネージャー役のエージェントにだけ依頼し、他のエージェントは画面上の事務所で作業する形にした。MITライセンスで無料と明記されている。【背景】エージェントは6体で、役割と通常使うモデルが表で示される。マネージャーとシニア開発者とPRレビュー担当はOpus、ジュニアはHaiku、QAとPMはSonnetで、名前は設定ファイルで変えられる。【詳細】仕組みはExpressとWebSocketによるNodeのサーバーで、127.0.0.1だけで待ち受ける。マネージャーはタスクの割り当て、エージェントの停止、持ち主への質問などの操作を使う。各タスクは独立したgit worktreeで行われ、push、PRの作成とマージ、リリースは承認カードで人に確認を求める。この確認はPreToolUseフックで強制される。使い方は、リポジトリをcloneしてnpm installとnpm startを実行し、localhostの4700番を開く。Node 20以上、Claude Code、gitが必要で、デモ用のモードもある。config.local.jsonで設定を上書きでき、例として緯度やスタンドアップの時刻を挙げている。筆者は1週間ほど使い、整理しやすくなって文脈の切り替えによる疲れが減ったと述べるが、これは主観的な感想で、数値での比較はない。【ポイント・注意点】worktreeはファイルを分けるだけで、データベースのスキーマや生成されるファイルの衝突は防げない。1体のエージェントが受け持つのは一度に1タスクだ。サンドボックスではなく、承認待ちのカードはアプリを閉じると失効する。テストは主にWindowsで行い、macOSとLinuxでは確かめていない。トークンの消費量や費用の具体的な数字は書かれていない。並列で動かすClaude Codeを人が見て分かる形に置き換える試みとして、複数セッションの連続稼働を管理したい人の参考になる。","2026-11-27","DEV Community","https://dev.to/owaincodes/virtual-office-a-team-of-claude-agents-in-a-pixel-art-office-2ikl"]],"cnc":[["ツァイス、計測ソフトのAIを拡充 CT断面解析は最大50倍速","独ツァイスは11月26日、計測ソフトのAI機能を広げると発表した。MachineToolNews.aiによると、ZEISS INSPECT上で独自のAIモデルを作れる「ZEISS Quality AI」と、産業用CTで内部欠陥を探す「Volume Inspection AI」が柱だ。X-Ray 2027はCT断面解析を最大50倍速く、CALYPSO 2027は一部の曲線測定を最大30%短くできるという。数値はメーカー発表で、価格や検出精度は非公表。","\n【概要】独ツァイスは2026年11月26日、計測ソフトウェアのAI機能を拡充すると発表した。MachineToolNews.aiは11月27日、この発表を5つの進展として整理した。AIによる検査、検査内容の自動調整、サプライヤーの測定データの取り込みなどが含まれる。\n【背景】CNC加工などの現場では、加工した部品の品質確認が生産全体の速さを左右する。検査に時間がかかれば、手直しや出荷も遅れる。記事は、品質規則に応じて検査内容を変える「動的検査」の説明の中で、CNC加工を行う事業者にも触れている。検査データをERPやMESとつなぎ、工程全体で使えるようにする流れも示されている。\n【詳細】「ZEISS Quality AI」は、利用者がAIモデルを調整したり新たに作ったりして、ZEISS INSPECTの作業手順の中で使えるようにする。「Volume Inspection AI」はこれを産業用CTに広げ、電池の組立品やはんだ接合部などの内部欠陥を探す。ZEISS PiWebの動的検査は品質規則に応じて検査内容を調整し、実際の測定はZEISS CALYPSOが担う。「PiWeb Supply Chain Quality」を使うと、サプライヤーが検証した測定結果を、部品が届く前に品質システムへ取り込める。ZEISS CONNECTED QUALITYで検査プログラムを一元管理し、OPC UAで測定データをERPやMESへ渡す。同社によると、ZEISS INSPECT X-Ray 2027は個々のCT断面解析を最大50倍速くでき、ZEISS CALYPSO 2027は一部の曲線測定のサイクルを最大30%短くできる。測定ロボット「ZEISS TALOS」への対応や、変形しやすい部品向けの「Virtual Clamping」も挙げられている。\n【ポイント・注意点】50倍や30%という数値はメーカーの発表で、第三者による検証ではないと記事は明記している。欠陥検出の精度、価格、導入にかかる期間、顧客の投資対効果も公表されていない。加工現場で使う場合は、自社の部品で検出性能を確かめてから判断したい。","2026-11-27","MachineToolNews.ai","https://machinetoolnews.ai/zeiss-metrology-software/"],["Amazonブラックフライデーのメイカー向け20選 AIカメラ付きレーザーも","FabSceneは11月27日、Amazonブラックフライデー2026でメイカー向けに選んだ20商品を紹介した。先行セールは11月27日から29日、本セールは11月30日から12月7日まで。レーザー加工機では、AIカメラ付き10WモデルのCreality「Falcon A1C」が15%引きの6万3600円、LaserPecker「LP1 Plus」が8%引きの4万7840円。AIで造形エラーを見つけるBambu Lab「P2S」も26%引きだ。","\n【概要】ものづくりメディアのFabSceneが、Amazonブラックフライデー2026に合わせて、メイカー向けのおすすめ商品20点をまとめた。3Dプリンター、レーザー加工機、カッティングマシン、3Dスキャナー、計測器、電子工作用品などを、年初来の最安値と比べながら紹介している。\n【背景】Amazonの先行セールは11月27日0時から29日23時59分まで、本セールは11月30日0時から12月7日23時59分まで開かれる。掲載価格は2026年11月27日の午前2時台に表示されていたもので、変わる可能性があると記事は注意している。年に一度の大型セールは、工房の機材をそろえる機会として注目されやすい。\n【詳細】レーザー関連では、Creality「Falcon A1C」が15%引きの6万3600円。作業領域は150×150×148mmでClass 1に当たり、オートフォーカスを備え、5W・10W・1.2Wのモジュールを付け替えられる。セールの対象はAIカメラ付きの10Wモデルで、同社によると10Wなら厚さ5mmのバスウッド板を1回で切断できる。LaserPecker「LP1 Plus」は8%引きの4万7840円で、重さ約210g、組み立てから2分以内に彫刻を始められ、モバイルバッテリーでも動くという。Likcut「S41」カッティングマシンは16%引きの2万6900円で、最大21.5cm幅に対応する。3Dプリンターでは、AIによる造形エラー検出を備えたBambu Lab「P2S」が26%引きの7万9999円、「A1 mini」が32%引きの2万6980円。3DMakerproの3Dスキャナー「Seal Lite」は14%引きの4万3140円で、精度は0.02mmとされる。\n【ポイント・注意点】一覧にCNCフライス盤は含まれていない。AIに関係するのは、Falcon A1CのAIカメラとP2Sの造形エラー検出の2点だ。セールの価格や条件は変わる場合があるため、購入前には実際の販売価格と対象モデルを確かめたい。レーザー加工機を初めて買う人は、作業範囲や切れる厚さが作りたい物に合うかも見ておきたい。","2026-11-27","FabScene","https://fabscene.com/new/special/amazon-black-friday-2026-maker-deals-20/"],["Bambu Lab、手持ち3Dスキャナー「S1」の予約開始 約27万円","FabSceneによると、Bambu Labは11月26日、同社初の3Dスキャナー「S1」を発表した。米国公式ストアでの予約価格は1699ドル（約27万円）で、12月28日ごろに出荷する予定。青色レーザー3モードと赤外線1モードを切り替え、青色レーザー時の精度は最大0.02mm。無料ソフト「Bambu Scan」はS1の購入者なら全機能を追加料金なしで使え、スキャンしたデータをスライサーへワンクリックで送れる。","\n【概要】3Dプリンターで知られるBambu Labが、手持ち型の3Dスキャナー「S1」の予約を始めた。FabSceneが11月27日に報じた。物体の周りで本体を動かし、形と色をまとめて取り込む。実物を測ってデータにし、そのまま3Dプリントに回せる流れが特徴になる。\n【背景】発表は2026年11月26日。米国の公式ストアで1699ドル（約27万円）の予約を受け付け、出荷は12月28日ごろの予定だ。11月27日時点で、日本のストアに製品ページはなかった。同社は、競合のスキャナーソフトは基本機能に限られることが多く、プロ向け後処理ソフトの永続ライセンスは1500ドル（約24万円）を超える場合があると説明している。\n【詳細】光源は2種類で、青色レーザー3モードと赤外線1モードを切り替える。青色レーザーは、車のドアや家具など広い面向けの34本の交差線、ホイールなど細かい物向けの7本の平行線、ねじ穴など深いくぼみ向けの1本線を使い分ける。赤外線は目に安全で、人の頭部のスキャンにも使えるという。青色レーザー時の精度は最大0.02mmで、1mの物体でも誤差は0.08mm以内に収まるとしている。本体は710gで、大きさは233×160×77mm。3.5インチのタッチ画面と4800mAhの電池2本を備え、約3.5時間使える。Wi-Fi 6で毎秒最大80フレームをPCへ無線で送る。ソフト「Bambu Scan」は無料で、顔、自動車部品、15cm未満の物体などに向けた14のプリセットと、寸法測定や元モデルとの偏差の色分け、GD&T解析など8つの編集ツールを持つ。完成データはスライサー「Bambu Studio」へワンクリックで送れる。\n【ポイント・注意点】Bambu Scanは当面Windows専用で、macOS対応は「近日」とされる。PCには16GB以上のメモリと、6GB以上のグラフィックスメモリを積んだNVIDIA RTX 2060以上が必要だ。PC側もWi-Fi 6に対応しているか、別のアダプターかケーブルを用意する必要がある。電動ターンテーブルとWi-Fiアダプターは後日別売りになる。記事本文にAI機能の記述はない。","2026-11-27","FabScene","https://fabscene.com/new/news/bambu-lab-s1-handheld-3d-scanner-free-bambu-scan-software/"],["SolidWorksの3種のファイルをFreeCADで開くアドオン、個人が公開","FabSceneによると、開発者のcehaho氏がFreeCAD用アドオン「OpenSW for FreeCAD」をGitHubで公開した。SolidWorksがなくても、部品・アセンブリ・図面の3種類のファイルをFreeCAD 1.0以降で開ける。10月に公開された変換プロジェクト「OpenSW」を土台にしており、処理はFreeCADの中で完結し、ファイルを外部へ送らない。一方で、作業履歴や拘束は再現しない。ライセンスはAGPL-3.0となっている。","\n【概要】SolidWorksのファイルを、無料のCADソフトFreeCADで開けるアドオン「OpenSW for FreeCAD」を個人の開発者cehaho氏が公開した。FabSceneが11月27日に報じた。商用CADのデータを、オープンソースのCADで扱うための道具だ。\n【背景】土台になったOpenSWは2026年10月に公開されたプロジェクトで、SolidWorksの部品ファイルをParasolidやSTEPに変換する。今回のアドオンは11月25日に追加された。CNC加工や3Dプリントの依頼で他人のCADデータを受け取ったとき、元のソフトがなくても形状を確かめたい場面で使える。\n【詳細】FreeCAD 1.0以降で動き、「開く」と「インポート」にSolidWorksの選択肢を加える。部品（.SLDPRT）は、保存された形状データから正確なソリッドとして、色やスケッチも含めて読み込む。アセンブリ（.SLDASM）は配置済みの部品を読み込み、部品ファイルが同じフォルダーにあれば正確な形状に、なければアセンブリ内の表示用メッシュになる。図面（.SLDDRW）は、線、円弧、寸法、文字をシートごとに2D形状として読み込む。読み取り部はPythonで書かれており、形状をいったんSTEPに書き出し、FreeCAD自身のインポーターで読み直す仕組みだ。処理はFreeCADの中で完結し、ファイルは外部に送られない。インストールはFreeCADのAddon Managerか手動で行える。\n【ポイント・注意点】読み込むのは保存された結果だけで、押し出しや穴などのフィーチャー履歴は再現しない。スケッチの拘束やアセンブリの合致も変換されない。実行のたびに、読めたものと読めなかったものがレポートビューに表示される。READMEには、SolidWorksはダッソー・システムズの商標で、このプロジェクトは同社と無関係でSolidWorksのコードを含まないと書かれている。ライセンスはAGPL-3.0。記事は初出時の誤りを訂正したと注記している。本文にAIの記述はない。","2026-11-27","FabScene","https://fabscene.com/new/make/opensw-freecad-addon-open-solidworks-files/"],["CAD「SolidCraft」、モデル共有サイト公開 プラグインは3段階で区分","3D CAD「SolidCraft」のモデルやプラグインを共有するサイト「SolidCraft Workshop」が公開された。開発者のBrennen Herbruck氏が11月27日にXで告知した。寸法を変えられるパラメトリックモデルや部品ライブラリを扱い、プラグインは「Official」「Community」「Unverified」の3段階で信頼度を示す。プラグインはネットワークに接続できず、モデルはサインインなしで閲覧できる。","\n【概要】3D CAD「SolidCraft」のモデルやプラグインを共有するウェブサイト「SolidCraft Workshop」が公開された。開発者のBrennen Herbruck氏が2026年11月27日にXで告知し、FabSceneが同日報じた。運営はTangency Labsが担う。\n【背景】FabSceneは11月14日にHerbruck氏のインタビューを掲載していた。ものづくりでは、寸法を自分の機械に合わせて変えられるデータを共有できると便利だ。一方で、CADの中で動くプラグインは、利用者のパソコンでプログラムとして実行されるため、安全面の配慮が欠かせない。\n【詳細】サイトでは、寸法を変えられるパラメトリックモデル、機能を追加するプラグイン、部品ライブラリ、完成品の写真を扱う。各モデルのページには「Open in SolidCraft」「Open in browser」「Download」の3つのボタンがある。南京錠の例では、使う3Dプリンターに合わせて部品のすき間を調整できる。モデルのライセンスは、作者がクリエイティブ・コモンズかSolidCraft独自の個人利用ライセンスを選ぶ。プラグインはオープンソースのライセンスを使う。プラグインは、Tangency Labs製の「Official」、チームが確認して署名した「Community」、自動チェックだけを通った「Unverified」の3段階に分け、インストール前にアプリが表示する。プラグインはネットワークに接続できず、接続が必要なものは掲載を断られる。アップロードされたファイルは、種類と中身が一致するかを機械でチェックされる。上限は1ファイル100MB、画像は10MBだ。\n【ポイント・注意点】11月27日時点で、6枚羽根の冷却ファン、木工用プラグイン、ロケットエンジンのモデル、チェス盤などが並ぶ一方、部品ライブラリにはまだ掲載がない。投稿にはサインインが必要だが、閲覧はサインインなしでできる。問題のある版は、アプリ側で警告したり無効にしたりできる。記事本文にAIの記述はない。","2026-11-27","FabScene","https://fabscene.com/new/news/solidcraft-workshop-models-plugins-sharing-site/"],["FabScene、激安レーザーカッター「K40」の歴史を動画で解説","FabSceneは11月27日、公式YouTubeチャンネルの「Deep Fab」で、中国製の激安レーザーカッター「K40」の歴史を描いた動画を公開した。業務用が1台240万円だった時代に、K40は数万円で売られた。説明書はなく、扉を開けてもレーザーが止まらない機械だったが、ユーザーが配線や制御基板を替え、無料ソフト「K40 Whisperer」まで生まれた。約15年の歩みを振り返る内容だ。","\n【概要】ものづくりメディアのFabSceneは2026年11月27日、公式YouTubeチャンネルの「Deep Fab」シリーズで新しい動画を公開した。題材は、中国製の激安レーザーカッター「K40」だ。動画のタイトルは「謎の中華製激安レーザーカッター『K40』が、世界中のMakerに愛された理由」で、約15年の歴史をたどる。\n【背景】記事によると、業務用のレーザーカッターが1台240万円した時代に、K40は数万円で売られていた。K40という会社は存在せず、中国の数えきれない工場が、名前のない似た機械を作っていたという。安さと引き換えに、使う人が手を入れることが前提の機械だった。今では多くのメーカーが家庭向けのレーザー加工機を売っているが、その前の時代に個人の手へレーザー加工を届けたのがK40だった。\n【詳細】K40の箱には説明書が入っておらず、扉を開けてもレーザーが止まらなかった。そこで購入者たちは配線をやり直し、ソフトを書き、制御基板を取り替えた。記事は、改造の記録をすべてブログで公開した米国の技術者Don Kleinschnitz氏と、純正ソフトの代わりになる無料の「K40 Whisperer」を配った開発者Scorch Works氏の名前を挙げている。同じ時期、完成品として売られたGlowforgeは、30日で約45億円を集めながら出荷の延期を繰り返した。未完成の安い機械を利用者が育てた流れと、完成品として売られた機械の歩みが対比されている。ページには関連記事「説明書なき40Wレーザーカッター『K40』の地下経済——ユーザーを設計者に変えた未完成品」へのリンクもある。この題名にある「ユーザーを設計者に変えた」という言葉が、記事の描くK40の位置づけをよく表している。\n【ポイント・注意点】動画はFabSceneの公式YouTubeチャンネルで見られる。K40は、扉を開けてもレーザーが止まらない機械として描かれている。これから中古品や同じ型の機械を使う場合は、扉を開けたときにレーザーが止まるかなど、安全面を必ず確かめたい。記事と動画はレーザー加工の歴史を扱うもので、AIは登場しない。","2026-11-27","FabScene","https://fabscene.com/new/infomation/youtube-deepfab-k40-laser-cutter/"],["製造業の生成AI、今できることとまだできないこと IIoT Worldが整理","IIoT Worldは11月27日、製造業での生成AIの実力を整理する記事を公開した。Siemens、Databricks、Retrocausalの幹部が登壇したパネル討論をもとに、文章を扱う生成AIは顧客対応や現場サービスで「すでに実用段階」、映像言語モデルは「初期導入」、産業向けの基盤モデルは普及まで「まだ遠い」と位置づけた。3分の2を超える経営者が、データの管理や統合を課題に挙げている。","\n【概要】産業IoTメディアのIIoT Worldは2026年11月27日、「製造業の生成AI：今できること、できないこと」と題する記事を公開した。IIoT World Manufacturing Day 2025のパネル討論がもとになっている。\n【背景】登壇したのは、SiemensのMathias Oppelt氏、DatabricksのShiv Trisal氏、RetrocausalのTim Coleman氏で、司会はHamish Mackenzie氏が務めた。Siemensは、現場で求められる水準を「産業グレードのAI」と呼ぶ。ページには、このセッションがRetrocausalの協賛であり、内容の要約にAIツールを使ったと書かれている。\n【詳細】全米製造業者協会の調査では、倫理や従業員への偏りを最大の課題に挙げた回答者は4%未満だった。一方、3分の2を超える経営者が、データの管理、アクセス、形式、プライバシー、統合を挙げた。記事によると、プロセス工場は定常運転では運転範囲全体の1〜2%の中で動いている。映像言語モデルを使うと、手作業のデータを数日や数週間ではなく「数分で」集め、時間研究やスパゲッティ図、工程間の移動表を作れる。単価1200ドルの製品で不良率30%だった医療機器メーカーは、AIが案内する組み立てで不良を60%減らした。人と自動機が混在するラインを映像分析で組み直し、「数十万ドル相当」の5%の改善を得た例もある。活用例として、ExxonMobil、John Deere、Ford Directの現場サービスや、Corningの自動車用ガラスの欠陥検出も挙げられている。データ活用の土台づくりでは、Dow Chemicalが管理職の各階層でデータを読み解く力を育てた例も紹介された。\n【ポイント・注意点】記事は、文章ベースの生成AIは「今すぐ使える」とする一方、映像言語モデルは「初期導入」、産業向け基盤モデルは「まだ遠い」と整理する。Trisal氏は「生成AIの時代に受けるべき最も大切な授業は統計学だ」と語った。加工の現場にAIを入れる場合も、まずデータを整えることが出発点になる。","2026-11-27","IIoT World","https://www.iiot-world.com/smart-manufacturing/generative-ai-manufacturing-what-works-today/"],["xTool、英国でブラックフライデー 最大4686ポンド引き","レーザー加工機のxToolは11月26日、英国向けのブラックフライデー企画を発表した。期間は11月2日から12月4日までで、注文金額が増えるほど値引きが大きくなる段階制により、最大4686ポンドを節約できるという。対象はカラー印刷にも対応するM2、赤外線とダイオードの2つのレーザーを積むF2、80WのCO2レーザーを使うP3などのレーザー加工機と、UVプリンターなどのデジタル製造機器だ。","\n【概要】レーザー加工機メーカーのxToolは2026年11月26日、英国向けのブラックフライデー企画をPR Newswireで発表した。注文金額に応じて値引きが増える仕組みで、最大4686ポンドを節約できるとしている。発表はロンドン発となっている。\n【背景】企画の期間は2026年11月2日から12月4日まで。クリスマスの贈り物や手作り品を作る趣味の人、メイカー、小規模事業者に向けた内容だ。レーザー彫刻、レーザー切断、デジタル製造の製品が対象で、週ごとのタイムセール、材料のセール、条件を満たす購入への景品もある。レーザー加工機で小物を作って売る人にとっては、年末の需要期を前に機材をそろえる機会になる。発表文は、xToolを賢く使いやすい道具を作る会社と紹介している。\n【詳細】主な対象製品は5つ。カラー印刷、切断、彫刻ができる「xTool M2 Color Craft」、5Wの赤外線レーザーと15Wのダイオードレーザーを積む小型彫刻機「xTool F2」、UV、UV DTF、DTF、DTGの印刷に対応する「xTool O1 Omni Printer」、MOPAファイバーレーザーとダイオードレーザーを組み合わせた5WのUV彫刻機で金属加工にも向く「xTool F2 Ultra UV」、木材やアクリル向けの80W CO2レーザーカッター「xTool P3」だ。追加の値引きは注文金額に応じて段階的に増え、会計時に自動で適用される。発表では、549ポンドで70ポンド、899ポンドで120ポンド、1599ポンドで210ポンド、3299ポンドで480ポンド、4999ポンドで820ポンド、8199ポンドで1400ポンド、1万1999ポンドで2400ポンドの値引きが示されている。標語は「たくさん買って、たくさん節約し、たくさん作ろう」。\n【ポイント・注意点】発表文には割引率やクーポンコードは書かれておらず、詳しい条件はxToolの英国サイトで確認する必要がある。AI機能への言及もない。英国向けの企画のため、日本での価格や期間とは異なる点にも注意したい。","2026-11-26","PR Newswire","https://www.prnewswire.com/news-releases/xtools-black-friday-deals-get-creative-with-exclusive-savings-302951338.html"],["空研工業、AIで過去図面の検索を効率化 年間約1395時間減へ","MONOistは11月26日、創業70年の空研工業がAIで過去図面の検索を効率化する取り組みを紹介した。Recursiveと共同開発した「AIナレッジ基盤システム」はOpenAIのAPIを使い、図面から部品番号や寸法、材質を抜き出してデータベースにする。年間約1550時間かかっていた図面検索が、検証では約155時間に縮み、約1395時間（最大90%）減らせる見込みだ。2026年内の本番運用を目指す。","\n【概要】MONOistは2026年11月26日、空研工業へのインタビュー記事を掲載した。過去図面を探す時間をAIで減らし、その時間を技能の継承に回そうとする取り組みを紹介している。図面という設計データをAIで使える形に変える事例だ。\n【背景】空研工業は創業70年の企業で、生産を終えた製品などのメンテナンスで過去の図面が必要になる。CADを導入したのは1995年で、2010年までは図面を紙で保管し、その後データでの保管に移った。2026年9月には図面の保管場所を2階から3階へ移した。人が減るなかでベテランの技術をどう伝えるか、古い図面をどう使うかが課題になっていた。OpenAIへの相談は2025年10〜11月ごろに始めた。\n【詳細】使うのは、Recursiveと共同で開発した「AIナレッジ基盤システム」だ。Recursiveが2026年11月4日に発表し、OpenAIのAPIを使っている。過去の図面から、部品番号、寸法、材質などの情報をAIで抜き出し、ナレッジデータベースとして作り直す。機能は「図面検索」と「図面チェック」の2つで、図面チェックは図面と仕様の食い違いを確かめる用途だ。部品リストの画面写真から部品番号を読み取り、関連する図面を抜き出して、確認後にPDFでまとめて出力できる。2025年度に図面検索が必要になったのは年2065件で、内訳は10時間かかるものが15件、3時間が50件、1時間が1000件、15分が1000件、合計は約1550時間だった。検証では1件あたり平均約4.5分になり、年間約155時間に縮む見込みで、削減は約1395時間（最大90%）と記載されている。OpenAIは11月9日にこの共同事例を公開したという。\n【ポイント・注意点】システムはまだ実証段階で、2026年内の本番運用を目指している。削減時間は検証にもとづく見込みの数字だ。記事は、時間を減らすこと自体より、浮いた時間を若手への技能の継承に使う点を重視している。AIの導入で、担当者の仕事の中身が変わることも期待されている。図面のデータ化は、部品の作り直しや修理の依頼に素早く応える土台にもなる。","2026-11-26","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/26/news014.html"],["プリマパワー、板金機の予知保全にAI 3つのデジタルサービスを解説","MachineToolNews.aiは11月25日、伊プリマパワーの板金加工機向けデジタルサービスを解説した。監視・分析拠点の「Prima Link」は接続した機械の稼働データを集め、アラームの関係を機械学習で調べて保守を促す。顧客ポータル「MyPrima」は無料で24時間使え、「Remote Care」は技術者が遠隔で故障を調べる。一方で、予測の精度や停止時間の削減効果、料金は公表されていないと記事は指摘している。","\n【概要】MachineToolNews.aiは2026年11月25日、プリマパワーが板金加工メーカーに提供するデジタルサービスを解説する記事を掲載した。機械学習による予知保全、顧客ポータル、遠隔サポートの3つを取り上げている。対象はレーザー切断機などの板金加工機だ。\n【背景】プリマパワーは、自動化したレーザー切断機、パンチングマシン、曲げ加工機を手がける。こうした設備では、止まらずに動かせるかどうかと、保守の計画が課題になる。故障してから直すのではなく、兆しをつかんで先に手を打つのが予知保全の考え方だ。保守の計画が立てば、部品の手配や人員の段取りもしやすくなる。記事は新製品の発表ではなく、編集部による分析記事となっている。\n【詳細】「Prima Link」は監視と分析の拠点で、接続した設備から稼働データを集め、アラームどうしの関係に機械学習を当てはめる。気になるパターンが見つかると保守の警告が出て、プリマパワーのサービス担当者が確認してから顧客に連絡する。同社はこれを「基本的な予知保全」と呼んでいる。「MyPrima」は顧客向けポータルで、設備の情報、技術文書、サービス依頼をまとめて扱え、無料で24時間使える。「Remote Care」では、プリマの技術者が顧客の機械に遠隔で接続し、稼働記録を調べて故障の原因を探る。技術者の訪問が不要になる場合もあるという。記事は、機械どうしをつなぐ規格OPC UAについてのVDMAの調査にも触れ、導入時に見るべき指標として、計画外の停止時間、平均修理時間（MTTR）、保守費用、失われた生産時間、設備総合効率（OEE）を挙げている。\n【ポイント・注意点】記事によると、予測の精度、警告が出てから故障までの平均時間、停止時間の削減効果、Prima LinkとRemote Careの料金、対応機種の一覧、他社製機械への対応は公表されていない。記事は、次に必要なのは顧客の現場での効果を示す資料だとしている。導入を考える場合は、自社の設備で上の指標がどう変わるかを確かめたい。他社製の機械と並べて使う工場では、共通規格への対応も確認したい点だ。","2026-11-25","MachineToolNews.ai","https://machinetoolnews.ai/prima-power-digital-services/"],["Aliencell、AI画像ツール付きレーザー加工機「E1」 BF価格449ドル","TopEngravers Magazineは11月25日、Aliencellの卓上レーザー加工機「E1」を紹介した。AliencellはCHITUBOXの姉妹ブランドで、E1は0.03×0.03mmの四角いスポットで細かく彫れる。専用ソフトはAIで画像を扱うツールを備え、800万画素カメラで仕上がりを事前に確かめられる。ヘッドは3種類を付け替えられ、通常499.99ドルのところブラックフライデー価格は449.99ドルだ。","\n【概要】TopEngravers Magazineは2026年11月25日、Aliencellが発表した卓上レーザー彫刻・切断機「E1」を紹介した。AliencellはCHITUBOXの姉妹ブランドとされる。AIで画像を扱うツールを含むソフトと、付け替えられるレーザーヘッドが特徴だ。\n【背景】家庭や小さな工房で使うレーザー加工機では、狙いどおりに彫れるかを加工前に確かめることが課題になる。素材を無駄にすれば費用も時間もかかる。E1は、選んだ素材の上で図柄がどう仕上がるかを照射前に再現する「True-to-Result Preview」を備える。\n【詳細】2段階でビームを整える「LBS」方式を使い、10Wダイオードモジュールで0.03×0.03mmの四角いスポットを作る。作業範囲は12×12インチで、前面に800万画素のカメラと1.9インチのカラー液晶を備える。ソフトは2つから選べる。「Aliencell Space」はフォント、QRコード作成、AIで画像を扱うツール、調整済みの素材設定を含み、経験者向けにはLightBurnも使える。ヘッドは、細かい彫刻向けの10Wダイオード、木材やアクリルを深く切る20Wダイオード、金属やプラスチック向けの3W赤外線の3種類だ。表面に沿って動き、30度傾けられる回転アタッチメントも、別売りのオプションとして用意する。彫刻速度は最大600mm/s、加速度は2万mm/s²。カメラを使う「Smart Fill」機能で、並べた複数の素材に同じ図柄をまとめて加工できる。\n【ポイント・注意点】価格は通常499.99ドルで、ブラックフライデーの特別価格は449.99ドル。公式ストアとAmazonで販売し、米国にサポート拠点を置く。AIの用途は画像を扱うツールで、加工条件をAIが自動で決める機能とは書かれていない。記事は米国向けの情報で、日本での販売については触れられていない。名入れ品を少量ずつ作って売る用途なら、まとめて加工できるSmart Fillが役立ちそうだ。経験者はLightBurnを使い、慣れた作業の流れを保てる。","2026-11-25","TopEngravers Magazine","https://topengravers.co.uk/aliencell-e1-desktop-laser-brings-0-03mm-beam-precision-and-interchangeable-heads-to-home-studios/"],["文章からCADを自動化 PTC幹部が語るOnshapeのAI活用","ENGtechnicaは11月25日、自然言語でCADを動かす取り組みについてPTC幹部の見方を紹介した。今の「テキストからCAD」ツールは、複雑な形状や拘束、フィーチャー同士の依存関係をうまく扱えないと指摘する。PTCの「Onshape FeatureScript MCP Server」を使うと、言葉の指示からプログラムで動くモデリング機能を作れる。将来はAIエージェントが材料変更や原価計算まで担うと見るが、結果の確認は技術者の責任だとしている。","\n【概要】ENGtechnicaは2026年11月25日、「テキストからコードへ」の流れがAIによるCAD自動化の道を開くとする記事を掲載した。Machine Designによるインタビューをもとに、PTCで全体運営を担う上級副社長Darren Henry氏の見方を紹介している。PTCは3D CAD「Onshape」を手がける企業だ。\n【背景】文章の指示から形を作る「テキストからCAD」ツールは増えている。しかし記事によると、今のツールは複雑な形状、同じ結果を繰り返し出すこと、スケッチの拘束、フィーチャー同士の依存関係で苦戦している。部品を加工に回すには寸法や関係が正確でなければならず、見た目が似ているだけの形では使えない。同じ指示から毎回同じ形が出なければ、設計データとして管理することも難しい。\n【詳細】そこでPTCは、形を直接作らせるのではなく、形を作るプログラムをAIに書かせる方法を示す。同社の「Onshape FeatureScript MCP Server」を使うと、技術者は自然言語の指示から、プログラムで動くモデリング機能を作れる。例として、AIチャットボットへの指示だけで、Onshapeに庭用ホースのねじを作る独自機能を組んだ事例が挙げられている。一度作った機能は道具として何度でも再利用でき、製品のバリエーションや社内で決まった作り方にも合わせられる。Henry氏は今後、AIエージェントがモデリングの手順を実行し、材料の割り当てを変え、アセンブリの原価や重さを計算する姿を見込んでいる。\n【ポイント・注意点】AIの基盤を使うときは、知的財産や設計データの秘密をどう守るかが課題になると記事は指摘する。AIが作った結果を確かめる責任は、引き続き技術者にあると記事は強調する。記事に価格や性能の数値は示されていない。形そのものではなく、形を作る手順をAIに任せるという考え方は、CNC加工の前工程であるCAD作業にAIが入る道筋の一つとして参考になる。テキストからCADのツールが増えるなか、実務でどう使うかを示す具体例として読める。","2026-11-25","ENGtechnica","https://engtechnica.com/text-to-code-paves-the-way-for-ai-driven-cad-automation/"],["英模型工房Amalgam、CNCと3Dプリントの現場にAI構想図","ENGtechnicaは11月25日、英ブリストルの模型工房Amalgam Modelmakingの現場を紹介した。建築模型や試作品から始まり、今は展示物や映画の小道具、パブリックアートも手がける。積層造形、CNC加工、素材の知識、仕上げを組み合わせ、木や金属に見える軽い模型を作る。卓上3Dプリンターの普及で簡単な試作の外注は減り、客がAIで作った構想図を持ち込むことも増えたが、職人の知識は今も欠かせないという。","\n【概要】ENGtechnicaは2026年11月25日、模型づくりがデジタルツールと伝統の技を組み合わせて進化しているとする記事を掲載した。Develop 3Dが英ブリストルにあるAmalgam Modelmakingの工房を訪ねた内容をもとにしている。CNC加工や3Dプリントで物を作って売る工房が、AI時代にどう仕事を変えているかを伝える。\n【背景】Amalgamは建築模型と製品の試作品から始まり、今は展示用の模型、映画の小道具、パブリックアート、特注の模型へと仕事を広げてきた。手ごろな卓上3Dプリンターが広まったことで、決まった形の試作を外に頼む需要は減った。一方で、照明や動く部品を備えた大きな展示用レプリカは伸びている分野だという。大きく複雑な物は、卓上の機械だけでは作りにくい。\n【詳細】Amalgamは、積層造形、CNC加工、素材についての専門知識、仕上げの技術を組み合わせ、木や金属に見える軽い模型を作る。使うツールとして、設計にはSolidWorksとRhino、3Dスキャンデータの処理にはAnsys SpaceClaim、見た目の確認と客の承認にはKeyShotが挙げられている。AIは設計の初期段階に影響を与えている。客がAIで作った構想図を持って相談に来ることが多くなったという。そうした構想を実際に作れる形にするには、素材や加工の知識が必要になる。仕上げの技術によって、軽い素材でも木や金属のような見た目に仕上げられるのが同社の強みだ。\n【ポイント・注意点】記事は、AIや3Dプリンターが広がっても、専門家の知識は今も重要だと強調している。AIが描いた絵をそのまま形にできるわけではなく、CNC加工や仕上げを含めた作り方を決めるのは人の仕事だという見方だ。AIの構想図は話し合いの入り口であり、形にするには作り手の判断が要るという立場といえる。簡単な試作は客が自分で作れるようになった分、工房は大きく複雑な物へと軸足を移している。記事に価格や数値は示されていない。受託で物を作る人が、どこで価値を出すかを考える材料になる。","2026-11-25","ENGtechnica","https://engtechnica.com/modelmaking-evolves-with-digital-tools-and-traditional-craftsmanship/"],["Bambu Lab、ヘッド7本を自動交換する「P3C」発売 AIで失敗検出","FabSceneによると、Bambu Labは11月24日、交換式ヘッドを最大7本積む3Dプリンター「P3C」を発表し、同日発売した。フラッグシップ機H3Cと同じ交換機構を、より手頃な機種に載せた。ヘッド交換は3.4秒、材料の切り替えは最短6秒。内蔵カメラの映像をもとに、AIが造形の失敗やノズルの詰まりを見つける。米国での希望小売価格は、AMS 3Pとヘッド5本が付く「P3C AMS Combo」で1149ドル（約18万円、税別）。","\n【概要】Bambu Labは2026年11月24日、ノズルとヒーターを備えた交換式ヘッド「PrintTool」を最大7本積める3Dプリンター「P3C」を発表し、同日に発売した。FabSceneが11月25日に報じた。\n【背景】同社は、フラッグシップ機「H3C」と同じヘッド交換の仕組みを、より手頃な価格の機種に載せたと説明している。米国での希望小売価格は、材料供給装置「AMS 3P」と標準ヘッド5本が付く「P3C AMS Combo」で1149ドル（約18万円、税別）。日本での価格は、記事の公開時点では公式ストアに載っていなかった。\n【詳細】交換機構「Swaptek」は、ヘッドごとに専用のフィラメント経路とヒーターを持つ。ヘッド交換は3.4秒、材料の切り替えは最短6秒で、社内試験では切り替え1回あたりの廃材は0.038gだった。標準の5本は0.4mmの硬化鋼ノズルで、ノズル径は0.2、0.4、0.6、0.8mmに対応する。残り2本の枠には、別売りのカッター、ペン、型押しの「CraftTool」も付けられる。AMS 3Pは7本のスプールを密閉して収め、別売りの乾燥モジュールで2本分を75℃で乾かせる。既存のAMSをつなぐと最大22種類の材料を使える。「FlexFeed」は2.85mmのフィラメントも外から直接送れ、硬度75AのTPUを前の世代より最大3倍の流量で造形できるという。造形サイズは256×256×260mm、本体は413×538×540mm。ノズルの最高温度は300℃、ヒートベッドは110℃で、ヘッドの最高速度は1400mm/s、最大加速度は2万5000mm/s²。密閉した筐体にHEPAフィルターと活性炭フィルターを備える。内蔵カメラの映像をもとに、AIが造形の失敗やノズルの詰まりを検出する。\n【ポイント・注意点】記事で触れられているAI機能は、カメラ映像による失敗検出の1点だけだ。通信はWi-Fi 6で、有線LANには対応しない。AMS 3Pを含む重さは26.5kgある。カッターやペンを付けられる点は、造形と簡単な加工を1台でこなしたい人に向く。","2026-11-25","FabScene","https://fabscene.com/new/news/bambu-lab-p3c-7-tool-changer-3d-printer/"],["レーザー加工ソフトLightBurn、規約を改定 サブスク化や値上げはなし","レーザー加工機用ソフトのLightBurn Softwareは11月25日、プライバシーポリシーと利用規約を改定したと告知した。通常の顧客のライセンス権利は変わらず、サブスクリプション制への移行や価格の変更もないと明言している。改定は、今のライセンス認証の仕組み、不正防止、アフィリエイトとアカウントの運用、外部インフラの利用、プライバシーや法令順守の要件を反映したものだという。","\n【概要】レーザー彫刻機やレーザーカッターを動かすソフトを開発するLightBurn Softwareは2026年11月25日、同社のニュースページで、プライバシーポリシーと利用規約を改定したと告知した。利用者が気にしやすい料金とライセンスについて、変更がないことをはっきり示した内容だ。\n【背景】LightBurnは、デザインの作成から加工の指示までを1つの画面で行えるレーザー加工用のソフトで、多くのメーカーの機械で使われている。仕事で使う人にとって、ソフトの規約や料金の変更は、事業の費用に直接かかわる。規約が変わると聞けば、買い切りのライセンスが月額制に変わるのではないかと心配する利用者もいる。今回の告知は、そうした疑問に先回りして答える形になっている。\n【詳細】改定の対象は、プライバシーポリシーと利用規約の2つだ。告知で同社は3つの点を明言している。通常の顧客のライセンス権利に変更はないこと、ソフトをサブスクリプション制に切り替えないこと、価格を変えないことだ。改定の目的は、今使っているライセンスと認証の仕組み、不正防止と悪用対策の方法、アフィリエイトとアカウントの運用、外部インフラ事業者の利用、プライバシーと法令順守の要件を、規約に正しく反映させることだと説明している。つまり、今の運用を正確に書き表すための改定という位置づけだ。質問はサポート窓口のメールで受け付ける。告知は英語で200語ほどの短いもので、新しい機能や値下げの案内は含まれていない。\n【ポイント・注意点】利用者にとっては、今のライセンスの形が続くことが確認できた点が大きい。一方で、規約の細かな変更点は告知本文には並んでいないため、気になる人は改定後の規約そのものを読む必要がある。外部インフラ事業者の利用やプライバシーの項目は、アカウント情報などの扱いにかかわるため、仕事で使う人ほど目を通しておきたい。AI機能に関する記述はない。レーザー加工機を仕事で使う人は、ライセンスの認証方法などの扱いを一度確認しておくと安心だ。不明な点はサポート窓口に問い合わせるとよい。","2026-11-25","LightBurn Software","https://lightburnsoftware.com/blogs/news/terms-of-service-and-privacy-policy-updates"],["マシンビジョンのMVTecが30周年 自然言語で検査手順を組むAIも試作","MachineToolNews.aiは11月24日、独MVTecの30周年を振り返る記事を掲載した。同社は1996年にミュンヘン工科大学などから生まれ、画像処理ソフト「HALCON」で産業用マシンビジョンを形づくってきた。後に3D処理やディープラーニングを加え、2026年10月には、言葉と画像を入力するとAIエージェントが検査手順を組み立てる試作品「AI Vision Solver」を公開した。ただし製品化の時期は示されていない。","\n【概要】MachineToolNews.aiは2026年11月24日、ドイツのMVTecが創業30年を迎えたことに合わせ、同社が産業用マシンビジョンをどう形づくってきたかを振り返る記事を掲載した。カメラの画像で部品を検査する技術は、加工品の品質確認にも欠かせない。\n【背景】MVTecは1996年、ミュンヘン工科大学とFORWISSから生まれたスピンオフ企業で、Olaf Munkelt氏、Wolfgang Eckstein氏、Carsten Steger氏が創業した。初期の画像処理ソフト「HALCON」は、さまざまな画像処理の手法を1つの環境にまとめた。同社はソフトに集中し、カメラなどのハードは利用者が選べるようにしてきた。この方針は今も続いている。\n【詳細】同社はその後、3D処理とディープラーニングの機能を順に加えた。今の製品には、開発用ツールキットの「HALCON」、画像検査アプリを組むための「MERLIC」、ディープラーニング用のツールがある。2026年10月には、試作品「AI Vision Solver」を公開した。言葉による指示と画像を入力すると、AIエージェントがHALCONの処理を選び、開発環境「HDevelopEVO」の中で作業の流れを組み立てる。開発はすべてミュンヘンで行い、従業員は300人を超え、社内の研究チームは十数人ほどだという。記事は、MERLICを組み立て検査に使うEndress+Hauserの事例や、Bosch RexrothのctrlX OSとHALCONを組み合わせた事例にも触れている。\n【ポイント・注意点】AI Vision Solverはあくまで試作品で、製品化の時期は示されていない。記事の筆者は、最初のサンプル画像から、試せる検査手順ができるまでの時間を評価の物差しとして挙げている。これまで画像検査の手順づくりには専門の知識が必要だった。加工品の検査を自動化したい現場にとって、その手間がどこまで減るかが注目点になる。言葉で指示できれば、画像処理の専門家でなくても検査の仕組みを試しやすくなる。","2026-11-24","MachineToolNews.ai","https://machinetoolnews.ai/30-years-of-mvtec/"],["xTool、米国でブラックフライデー CO2レーザーP2Sが1500ドル引き","Digital Trendsは11月24日、xToolのブラックフライデーとサイバーマンデーのセールを紹介した。目玉は55WのCO2レーザーカッター「P2S」で、4499ドルから1500ドル引きの2999ドルになる。xTool公式ストアではコード「XTOOLGIFT50」でさらに50ドル引きになる。セールは公式ストアで12月4日まで、Amazonで11月30日まで。なお記事はxToolが費用を出した広告記事で、AI機能には触れていない。","\n【概要】Digital Trendsは2026年11月24日、レーザー加工機メーカーxToolのブラックフライデーとサイバーマンデーのセールを紹介する記事を掲載した。レーザー彫刻機、レーザーカッター、プリンターなどが対象だ。副題では、これから物づくりの商売を始めたい人に向けたセールだとうたっている。\n【背景】記事のページには「xTool | Paid Program」と書かれ、ブランドが費用を出した記事だと明記されている。セールは、xToolの公式ストアで12月4日まで、Amazonで11月30日まで続く。公式ストアでは、コード「XTOOLGIFT50」を使うと対象機種がさらに50ドル引きになる。ただし新製品のX1とC1、アクセサリー、材料は対象外だ。\n【詳細】目玉は、55WのCO2レーザーを積み最高600mm/sで動く「P2S」で、4499ドルから1500ドル引きの2999ドルになる。コードを使うと2949ドル。モジュール式の「M2」は100ドル引きの499ドルで、Amazonでは474ドル、コードを使うと449ドルになる。10W、20W、40Wのモジュールを選べる。80WのCO2レーザーと4台のカメラを備える「P3」は、6599ドルから700ドル引きの5899ドル。5WのUVレーザーで最高1万5000mm/sで動き、ガラスやクリスタルにも彫れる「F2 Ultra UV」は、Amazonで2000ドル引きの3299ドル。プリンターの「O1 Omni Printer」は250ドル引きの2249ドルだ。新製品として、55WのCO2レーザーを積み、ガルバノモジュールで最高6000mm/sをうたう「X1」が3399ドルから、カラーカッター「C1」とヒートプレス「WonderPress」が399ドルから並ぶ。\n【ポイント・注意点】広告記事のため、製品の評価ではなくセール情報として読むのがよい。記事内でAI機能には触れられていない。米国向けの価格で、日本の販売価格やセール期間とは異なる。買う前には、公式ストアとAmazonのどちらが安いかと、コードの対象かを確かめたい。","2026-11-24","Digital Trends","https://www.digitaltrends.com/brc/xtools-black-friday-deals-just-dropped-with-massive-savings-for-makers-and-creators/"],["ロックウェル、AIエージェントを束ねる「FactoryTalk Conductor」","MONOistは11月24日、米ロックウェル・オートメーションが「Automation Fair 2026」で発表した新製品を紹介した。「FactoryTalk Conductor」は、設計、運用、保守などで使う複数のAIエージェントを束ねる基盤だ。NVIDIAと組んで自然言語処理を強め、指示を受けたAIエージェントが計画を立てる。MESとつなぎ、工程の組み替えもAIが自動で行う。同社は「自動化から自律へ」という方向を打ち出している。","\n【概要】MONOistは2026年11月24日、米ロックウェル・オートメーションが年次イベント「Automation Fair 2026」で示したAI戦略と新製品を紹介した。イベントは2026年11月16日から19日まで、米国ボストンで開かれた。記事は2ページにわたり、新製品とデモの両方を伝えている。\n【背景】ロックウェルは、工場の「自動化（Automation）」から「自律（Autonomy）」へ進むという方向を打ち出している。大規模言語モデルの進化とフィジカルAIを背景に、設備全体を学習させて最適化する次世代の生産システムを示した。決められた手順を繰り返すだけでなく、状況に応じて判断する工場を目指す考え方だ。\n【詳細】新製品の「FactoryTalk Conductor」（FT Conductor）は、設計、運用、保守、安全などで使う各種のAIエージェントを束ねる基盤だ。NVIDIAとの協業で自然言語処理を強めており、たとえば「安全は規格に基づくように」と指示すると、AIエージェントが計画を作る例が示された。MESと連携し、工程の組み替えもAIが自動で行う。信頼性を保つため、認証済みのPLCプログラムのライブラリなどを集めた「Trusted Contents」を用意する。PLCは工場の機械を決められた順番で動かす制御装置で、AIが関わる部分にも確かな部品を使う考え方だ。記事の後半では、ソフトウェアで定義する製造のデモも紹介している。NVIDIA IGX Thorの上でロックウェルの制御エンジン「Logix」を動かしてロボット2台を制御したほか、Ciscoのサーバー上で仮想のコントローラーを動かす例も示された。\n【ポイント・注意点】記事は、30年前後使われている既存設備を抱える日本の現場で、AIの判断がブラックボックスになることや、そのリスクをどう扱うかにも触れている。FT Conductorは工場全体の制御向けで、個人のCNC工作とは規模が違う。それでも、AIエージェントが段取りや保守を担う流れは、工作機械の分野でも広がりつつある。","2026-11-24","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/24/news024.html"],["Mastercam、AI「Copilot」で新人CNCプログラマーの育成を支援","CAMソフトのMastercamは11月23日、AIが新人プログラマーの立ち上がりを助ける7つの方法を紹介するブログを公開した。中心は、同社が「Mastercamに直接組み込んだ初のAIアシスタント」と呼ぶ「Mastercam Copilot」だ。ヘルプや知識ベースから答え、動画を時刻付きで探し、言葉の指示でマシングループの作成や送り速度の変更を行う。Mastercam CONNECTの契約者は追加料金なしで使える。","\n【概要】CNC加工向けCAMソフトのMastercamは2026年11月23日、「AIが新人プログラマーの立ち上がりを助ける7つの方法」と題するブログ記事を公開した。中心になるのは、同社のAIアシスタント「Mastercam Copilot」だ。CAMは、CADで作った形から工作機械を動かすプログラムを作るソフトで、使いこなすには経験が要る。\n【背景】記事は、デロイトとThe Manufacturing Instituteの調査を引き、米国の製造業では2026年から2033年までに最大380万人の追加人員が必要になり、最大190万人分の職が埋まらない可能性があると紹介している。CNCプログラマーを早く育てることが課題になっている。\n【詳細】Mastercam Copilotは、同社が「Mastercamの中に直接組み込んだ初のAIアシスタント」と呼ぶ機能だ。MastercamのヘルプやKnowledge Baseをもとに質問に答え、myMastercamの動画ライブラリを探して、該当する場面を時刻付きで示す。マシングループの作成や、送り速度と回転数の変更といった作業を、普通の言葉で頼める。音声による操作にも対応し、オンとオフを切り替えられる。コマンドを実行する前には、必ず利用者に確認を求める。Mastercam 2026.R2の公開前には、1500人を超える早期利用者のプログラムで試され、その意見から、言葉の指示で簡単な自動化スクリプトを作る機能が加わった。デジタルの流れの中でAIを使う例として、up2partsにも触れている。Copilotの詳細は、専用の製品ページで案内されている。\n【ポイント・注意点】CopilotはMastercam CONNECTの契約者なら追加料金なしで使える。ただし、これは同社による製品紹介の記事で、新しいバージョン番号や効果の数値は示されていない。AIが答えや操作を提案しても、実行前に人が確かめる設計になっている点は、加工ミスを防ぐうえで大切だ。新人がすぐ調べられる仕組みは、教える側のベテランの負担を減らすことにもつながる。","2026-11-23","Mastercam","https://www.mastercam.com/community/blog/7-ways-ai-is-helping-manufacturers-get-new-programmers-up-to-speed/"]],"cricut":[["「Good Tidings」の無料カットファイル、農家風クリスマス看板に","Silhouette Schoolの連載「Freebie Friday」が、感謝祭明けのクリスマス制作向けに「Good Tidings」の看板デザインを無料で公開した。ファームハウス調のクリスマスが好きな人向けで、玄関ポーチにもキッチンカウンターにも合うという。配布はSilhouette Studio形式で個人利用に限る。商用ライセンス付きSVGはSo Fontsyで1ドル、11月28日（土）までとしている。","\n【概要】\nSilhouette Schoolは、毎週金曜の連載「Freebie Friday」で、「Good Tidings」と書かれた看板デザインを無料で公開した。筆者は、感謝祭が終わって「正式にクリスマス制作モードに入った」と書いている。ファームハウス調のクリスマスが好きな人に向けたデザインで、「派手すぎず、ちょうどいい陽気さ」だという。玄関ポーチにもキッチンカウンターにも合うとしている。\n\n【背景】\nFreebie Fridayは、Silhouette Schoolが毎週無料のカットファイルを配る連載だ。今回は感謝祭明けの週に合わせ、クリスマス飾りに使える文字デザインを選んだ。記事の冒頭には、ファームハウス調に仕上げた「Good Tidings」の看板の写真が載っている。記事の最後には、ブログでこれまで配ってきた無料カットファイルの一覧へのリンクもある。\n\n【詳細】\n記事が挙げる使い道は幅広い。木の看板や、背の高いポーチ用の立て掛け看板に仕立てる。ステンシルにして輪切りの木材に写し、ファームハウス風のオーナメントにする。熱転写ビニール（HTV）でバーラップ地のクッションに貼り、ソファに置く。ビニールでマグカップや段付きトレイ用の看板に貼ってもよい。マグにホットココアを添えれば、近所の人への手軽な贈り物になるという。ファイルはGoogleドライブのリンクから入手するSilhouette Studio用のデザインで、個人利用に限られる。商用利用したい人向けには、So Fontsyで商用ライセンス付きのSVGを1ドルで案内している。この価格は「11月28日（土）まで」とされている。\n\n【ポイント・注意点】\n無料で配られるのはSilhouette Studio用のファイルだ。SVG形式が必要な人や、作った物を販売したい人には、記事は商用ライセンス付きのSVGを案内している。1ドルの価格は期限が短いので、早めに確認したい。記事には、カットの設定、刃の調整、素材の組み合わせ、仕上がりの寸法は書かれていない。木材、ステンシル、HTV、粘着ビニールと素材が変わるので、それぞれ試し切りをしてから本番に進むとよい。記事にはアフィリエイトに関する注記がある。","2026-11-27","Silhouette School","https://www.silhouetteschoolblog.com/2026/11/good-tidings-sign-freebie-friday.html"],["丸いオーナメントにビニールをきれいに貼る、初心者向けのコツ","Silhouette Americaが、丸いオーナメントなど曲面の素材に粘着ビニールを貼るための初心者向けガイドを公開した。まず素材を1つ、小さなデザインを1つに絞って練習することを勧める。デザインは正面の平らな部分に収め、表面はアルコールで拭いてよく乾かす。転写シートはビニールの際で切り、外周に小さな切り込みを入れる。中心から外へ少しずつ押さえ、低い角度でゆっくりはがすのが要点だという。","\n【概要】\nSilhouette Americaは公式ブログで、曲面に粘着ビニールを貼るための初心者向けガイドを公開した。主な対象はクリスマスの丸いオーナメントだ。いきなりセットで作らず、素材を1つ、小さなデザインを1つ、練習用の作品を1つに絞ってから本番に進むよう勧めている。\n\n【背景】\n丸い素材にはビニールが沿いにくく、端にしわや浮きが出やすい。記事はこうした失敗を前提に、準備から仕上げまでを6段階で説明し、トラブル対処の表も添えている。道具は、プラスチック・ガラス・アクリル・陶器の曲面素材、粘着ビニール、カットファイル、粘着が強すぎない転写シート、カス取りツール、スクレーパー、はさみ、糸くずの出ない布、消毒用アルコール、位置決め用のマスキングテープだ。\n\n【詳細】\nまず素材の正面で最も平らな部分を測り、その中にデザインを収める。名前、短い単語、モノグラム、日付、雪の結晶、星、リボンなど、まとまった形が向く。側面まで回り込む横長の文言は難しい。表面はアルコールで拭いて完全に乾かし、室温に戻しておく。塗装やラメ、人工雪の仕上げは目立たない所で試す。カットは新しい刃と合った素材設定で行い、素材・仕上げ・刃が変わるたびにテストカットをする。細すぎる筆記体は避ける。転写シートはビニールの際で切り、丸みの強い素材では外周に小さな切り込みを入れる。ただしビニールまでは切らない。貼るときは中心を先に付け、外へ向かって少しずつ、軽い力から押さえていく。転写シートは真上ではなく、低い角度でゆっくりはがす。\n\n【ポイント・注意点】\nトラブル表によると、端のしわにはデザインを小さくし、際で切って切り込みを入れる。ビニールが転写シートに付いてくるなら、もう一度こするか、粘着の弱いシートに替える。気泡は中心から外へ軽く押さえて抜く。仕上げは指か柔らかい布で押さえ、硬いスクレーパーは使わない。作例には、家族やペット、先生へのオーナメント、席札代わりのオーナメント、曲面のギフトタグが挙がっている。丸いオーナメントより、アクリルやプラスチックのタグの方が扱いやすい場合もあるという。","2026-11-27","Silhouette America","https://www.silhouetteamerica.com/blog/post/beginner-tips-applying-vinyl-to-curved-surfaces"],["結婚40周年を祝うランタン型カード、Cricutで全パーツを切り出し","カード作家のLeslie Turnerさんが、牧師夫妻の結婚40周年に贈るランタン型のボックスカードを紹介した。カード作りのチャレンジ「Cut It Up Challenges」第370回のテーマ「変わり折りかタグ」に合わせた作品だ。全パーツをCricut Explore Air 2で切り、デザインはCyndy G SVGの「Wedding Lantern Box Card」を使った。金や深紅、緑の紙を重ね、ろうそくの炎にはラメの紙を使っている。","\n【概要】\nブログ「Love to Scrap 2」で、Leslie Turner（LeslieT）さんが結婚40周年を祝うランタン型のボックスカードを紹介した。贈る相手は牧師夫妻だ。ランタンの形に組み立てる立体的なカードで、パーツはすべてCricut Explore Air 2で切り出している。\n\n【背景】\nこの作品は、カード作りのチャレンジ「Cut It Up Challenges」第370回に向けたデザインチームの作品だ。今回のテーマは「Fun Folds or Tags（変わり折りかタグ）」で、ウェーハ型の抜き型か電子カッティングマシンを使うことが条件になっている。Turnerさんは、チャレンジがこの日の朝に始まったと書いている。\n\n【詳細】\nカットファイルはCyndy G SVGの「Wedding Lantern Box Card SVG Cut File」。紙はCutCardStockのメタリックの白金、金色のパール、深紅、えんじ、緑などを組み合わせた。ろうそくの炎には、Brutus MonroeのRainbow Glitterstockと、ラメが落ちにくいオレンジの紙を使っている。「40」の数字はKeep It Simpleの抜き型で切り、花の中心には粘着式のパールを置いた。裏面の「Happy Anniversary」の文字は、白い紙に印刷してから切る「Print Then Cut」で作り、深紅の紙に重ねている。接着には精密ボンド、両面テープ、立体用のフォームドットを使った。\n\n【ポイント・注意点】\n使った紙のうち、メタリックの白金と深紅の2種類は、CutCardStockではもう扱っていないという。Turnerさんは、手持ちの白金系と深紅系の紙で代用できると書いている。記事には価格や割引コード、番号付きの手順はない。カットの設定も書かれていないので、厚みの違う紙を重ねる場合は試し切りをしたい。ページの日付欄には11月27日と7月8日が並ぶが、URLの日付は11月27日だ。","2026-11-27","Love to Scrap 2","https://lovetoscrap2.com/2026/11/27/40th-anniversary-lantern/"],["Cricutのブラックフライデー割引まとめ、Maker 4は50ドル引き","カメラ・ガジェット系サイトのCamera Lookoutが、Cricutのブラックフライデー割引をまとめた。太字の値引きは確認済みとし、Maker 4はAmazonとB&Hで50ドル引き、EasyPress SEの9×9インチと12×10インチは20ドル引き、EasyPress Mini LTは10ドル引きとしている。Joy 2からVentureまで、各機種の最大カット幅などの特徴も短く整理した。値引き前後の価格や終了日は書かれていない。","\n【概要】\nCamera LookoutのChris George氏が、Cricutのブラックフライデー割引をまとめた記事を公開した。ページは毎日確認して更新するとしている。太字の行は確認済みの値引き、太字でない行は未確認の扱いだ。リンク先はAmazon、B&H、Adoramaで、アフィリエイトリンクを含む。\n\n【背景】\nブラックフライデーの時期には、Cricutの本体やヒートプレスが複数の販売店で値下げされる。ただ、店ごとに条件が違い、どれが本当に安いのか分かりにくい。この記事は、確認できた値引きと未確認のものを書き分け、販売店ごとのリンクを1ページにまとめている。\n\n【詳細】\n確認済みの値引きは4つある。Cricut Maker 4がAmazonとB&Hで50ドル引き。EasyPress Mini LT（ラベンダー）が10ドル引き。EasyPress SEの9×9インチ（ラズベリー）と12×10インチ（ラズベリー）が、それぞれ20ドル引きだ。いずれもAmazonとB&Hが対象になっている。ほかに、Joy 2からMaker 5までの本体、Venture、StickerPix Print + Cut Essential Bundle、各種バンドル、AutoPress 2、Mug Press、Hat Pressへのリンクが並ぶ。機種の説明も添えられている。最大カット幅はJoy 2が4.5インチ、Joy Xtraが8.5インチ、Explore 5が11.7インチ。Maker 5は12インチで、彫刻とデボス（へこませる）加工もできる。Ventureは24インチで、デスクトップ版のDesign Spaceを使う。Design Spaceは無料で、有料のCricut Accessは任意としている。\n\n【ポイント・注意点】\n確認済みの値引きにも、値引き前後の価格や終了日は書かれていない。購入前に、販売店のページで今の価格を確かめたい。ヒートプレスの説明では、Mug Pressはまっすぐな筒形の昇華転写用ブランク向け、Hat Pressは帽子などの曲面向けとしている。AutoPress 2は大きなプレート面で、広いデザインを1回で圧着できるという。","2026-11-27","Camera Lookout","https://cameralookout.com/cricut-black-friday-deals/"],["xTool各機種を比べるギフトガイド、C1は印刷とカットを1台で","クラフトブログ「Keeping it Simple」のKaysiさんが、xToolの機種を比べるギフトガイドを公開した。レーザー加工機11機種とプリンター系3機種の目安価格を表にまとめている。カッティングマシンのC1は469〜539ドルで、印刷、スキャン、刃によるカット、描画、箔押し、デボスができる。ステッカーは設定を変えずに印刷からカットまでできるという。欠点は作業面が小さく、大きなデザインが作れない点だとしている。","\n【概要】\nクラフトブログ「Keeping it Simple」のKaysiさんが、xToolの機種を比べるギフトガイドを公開した。年末の贈り物として機械を選ぶ人に向け、レーザー加工機とプリンター系の機種の目安価格や用途を表にまとめている。Kaysiさんは、xToolの機械を4年使ってきたと書いている。\n\n【背景】\nxToolのラインアップには、レーザー加工機に加えて、刃で切るカッティングマシンのC1や、衣類向けのプリンターも並ぶようになった。機種が多く、どれを選べばよいか迷う人も多い。記事の冒頭では、コード「XTOOLGIFT50」で50ドル引きになるブラックフライデーの特典を紹介している。期限は2026年12月31日だが、新機種のC1とX1には使えない。\n\n【詳細】\nプリンター系の表では、C1 Color Cutterがインクジェット式で469〜539ドル。印刷、スキャン、刃によるカット、描画、箔押し、デボス加工ができる。Kaysiさんは、C1はステッカーを設定を変えずに印刷からカットまでこなし、ステッカー作りの迷いをなくしてくれると書く。ビニールを切ったり転写紙に印刷したりできるので、Tシャツ作りにも使えるという。DTF式のApparel Printerは5,399ドルから。印刷は数分で終わり品質も高いが、価格の面から、シャツを大量に作る人向けだとしている。O1 Omniは、UV単体が2,499ドル、デュアルUVが3,299ドル、UVと布用が3,499ドル。3つの版は使えるインクや素材、作れる物が違い、後から別の版に切り替えることはできない。レーザーの表には、10WダイオードのF1 Lite（599ドル）から、80W CO2のP3（6,499〜6,999ドル）まで11機種が載っている。\n\n【ポイント・注意点】\nKaysiさんがC1の欠点として挙げるのは、作業できる面積が小さく、大きなデザインが作れない点だ。それでも価格に対して「まったく見合う」と評価している。表の価格はおおよそのメーカー希望小売価格で、時期や在庫によって変わると注記されている。一般のクラフト用途には、ダイオードレーザーのM2を最初に勧めている。インクジェットの付属品を組み合わせたセットの20W版を推している。記事にはアフィリエイトリンクが含まれる。","2026-11-26","Keeping it Simple","https://www.keepingitsimplecrafts.com/xtool-machines-compared-which-xtool-machine-is-best-for-you-xtool-machine-gift-buying-guide/"],["小型DTFプリンター2機種を比較、BY2-20とxTool Apparel Printer","カッティングマシンやプロッターを扱うユーロポートが、小型DTFプリンター2機種を比べる記事を公開した。ローランドDGのVersaSTUDIO BY2-20は最大480mm幅のロールに印刷でき、熱転写シートのカットもできる。xToolのApparel Printerは最大356mm幅で、専用フィルムに印刷したあと自動でカットする。縦型オーブンOS1と合わせて税込150万円以内でそろえられる点も挙げ、導入時の確認項目を整理している。","\n【概要】\nカッティングマシンやプロッターを扱うユーロポートが、ブログで小型DTFプリンター2機種の比較記事を公開した。対象はローランドDGの「VersaSTUDIO BY2-20」と、xToolの「Apparel Printer」だ。初めてDTFプリンターを選ぶ人に向けて、それぞれの特徴と、向いている使い方を整理している。\n\n【背景】\n記事が扱うDTF方式では、DTFインクで転写シートに印刷し、接着パウダーと熱プレス機を使って衣類に柄を写す。カッティングシートの熱転写では難しいフルカラーの柄を、少ない枚数から作れるのが利点だ。記事によると、2機種とも小ロットのフルカラーのウェアプリントを想定している。\n\n【詳細】\nBY2-20は、最大480mm幅のロール印刷に対応する。DTF印刷に加えて、熱転写シートのカッティングもできるとしている。Apparel Printerは最大356mm幅。専用フィルムに印刷したあと自動でカットでき、縦型のシェイカーオーブン「xTool OS1」と組み合わせて場所を取らない設計が特徴だという。記事は、プリンターとOS1を税込150万円以内でそろえられる点を挙げる。ただし、プレス機、換気や排気の設備、消耗品などを含めた導入の総額は、別に確認が必要としている。使い分けについては、BY2-20はすでにあるウェアプリントの事業を広げたい場合に向く。xTool機は、作業の手間を減らし、初期投資を抑えたい場合に向くと整理している。\n\n【ポイント・注意点】\n導入前に確かめる項目として、DTFインク、DTF転写シート、接着パウダー、熱プレス機、メンテナンス用品を挙げている。機械本体だけでなく、こうした消耗品や周辺機器の費用も計算に入れたい。カッティングマシンでの熱転写から一歩進み、フルカラーの柄を扱いたい人には比べる材料になる。ユーロポートは、実機のデモや、印刷済みフィルムのサンプル請求も案内している。なお、ページには2026年11月26日と27日の2つの日付が並んで表示され、どちらが公開日かは書かれていない。","2026-11-26","ユーロポート","https://europort.jp/blog/dtf-by2-20-xtool-comparison"],["xToolのプリント＆カット機「C1」発表会、Makuakeで7万2,980円から","ガジェット系ブログ「Dream Seed」が、11月24日のxToolの発表会で紹介されたレーザー加工機「X1」とプリント＆カット機「C1」を報じた。C1は4色インクジェットとスキャナーを内蔵し、トンボなしで印刷とカットができる。305×305mmのマットに加え、マットなしで約3.6mまで連続カットでき、最大3mm厚まで切れる。Makuakeでの価格は基本セット7万2,980円、デラックスセット7万9,980円。","\n【概要】\nブログ「Dream Seed」の山本竜也氏が、2026年11月24日に開かれたxToolのメディア向け発表会を報じた。紹介されたのは、光源を後から足せるレーザー加工機「X1」と、印刷とカットを1台でこなす「C1」だ。C1は刃で切るカッティングマシンで、Makuakeでの価格もこの発表会で示された。\n\n【背景】\nステッカーなどを作るプリント＆カットでは、印刷した柄とカットの位置を合わせる作業が手間になる。C1はこの部分を自動化したのが特徴だ。今回の発表会では、業務寄りのレーザー加工機X1と並んで、家庭のクラフトにも向くC1が紹介された。\n\n【詳細】\nC1は4色CMYKのインクジェットとCIS方式のスキャナーを内蔵する。ライブプレビュー、自動位置合わせ、輪郭の自動検出、QRコードによる素材の読み取りに対応し、トンボ（位置合わせのマーク）は要らない。マットは305×305mm。ロールホルダーを使えば、マットなしで約3.6mまで連続カットできる。最大カット厚は3mm。刃はファイン、ディープ、布用のロータリー、ヘビーデューティーがあり、工具なしで交換できる。箔押しと筋入れもできる。動作音はモードにより38〜56dB。インクはxToolのDURA顔料インクで、防水にするには対応素材が要る。衣類用の転写シートは、洗濯30回まで色あせしにくいとしている。切れる素材は紙、カッティングシート、レザー、綿や麻、シナベニヤ、バルサなど。アクリルにはプライマーの使用を勧めている。カード、カレンダー、ステッカー、ペーパークラフト向けに12種類の生成機能を持つ「Atomm AI」も使える。Makuakeでの価格は基本セットが7万2,980円、デラックスセットが7万9,980円。1,000円の特典参加権では、合計1万円相当以上の特典が付く。\n\n【ポイント・注意点】\n同時に発表されたX1は、55WのCO2レーザーを基本に、ダイオード、ファイバー、MOPA、UVの光源を追加できる機種だ。本体は60kgあり、記事は家庭向けの大きさではないとしている。家庭でのステッカー作りや紙工作が目的なら、C1が検討の中心になる。印刷を多く使うなら、インクなど消耗品の入手方法も購入前に確かめておきたい。記事には一部アフィリエイトリンクが含まれる。","2026-11-24","Dream Seed","https://dreamseed.blog/post-206370/"],["xTool C1で作る、クリスマス柄のリストレット型キーホルダー","クラフトブログ「Keeping it Simple」のKaysiさんが、xTool C1で作るクリスマス柄のリストレット型キーホルダーの作り方を公開した。雪だるまやトナカイなど6種類のデザインを無料で配布している。デザインを1×11インチにして家族の名前を入れ、転写紙に印刷してカットする。幅1インチのテープに305度で15秒圧着し、金具とタッセルを付けて仕上げる。贈り物やクラフトフェアでの販売に向くという。","\n【概要】\nクラフトブログ「Keeping it Simple」のKaysiさんが、xTool C1で作るリストレット型キーホルダーの作り方を紹介した。手首に掛けられる輪の形のキーホルダーで、クリスマス柄に家族の名前を入れて仕上げる。6種類のデザインを無料で配布している。\n\n【背景】\nC1は印刷とカットを1台でこなすカッティングマシンだ。Kaysiさんは、転写紙に印刷した柄を切り抜き、テープに圧着する方法を使った。配布デザインは「Snowman Gingerbread House」「Festive Reindeer」「Gingerbread Men」「Santa & Snowman」「Festive Penguins」「Festive Christmas Characters」の6種類で、それぞれGoogleドライブのリンクから入手できる。\n\n【詳細】\nまずデザインをxTool Studioに読み込み、1×11インチに変える。名前はフォント「Boston」で打ち、塗りを白、線を赤にし、0.5mmの黒いオフセットを付けて重ねたように見せる。名前はデザインの片側に置く。印刷とカットの前に、文字とデザインをグループ化しておく。こうしないと、ソフトが文字まで切り抜こうとするという。プリント＆カットでは余白の距離を0にして、縁なしにする。マットにDoodle & Print Transfer Paperを載せて作業を始めると、機械が自動で刃に切り替える。この転写紙は、布への転写でよくある左右反転が要らないという。インクが乾くまで約30秒待ってから、カス取りツールで柄をはがす。幅1インチのテープを柄より1/4〜1/2インチ長めに切り、先に平らにプレスしておく。柄は305度で15秒圧着し、プレス用のクッションで均等に圧をかける。\n\n【ポイント・注意点】\nテープの端はライターであぶり、ほつれないようにする。最後にロブスタークラスプの金具とタッセルを付ける。Kaysiさんは乾く前のインクに触ってしまったことがあるといい、待つ時間は大事だ。色が鮮やかで、ブティックで売っているような仕上がりになるのが良い点だという。安く作れるので、贈り物や靴下に入れる小物、クラフトフェアでの販売にも向くとしている。具体的な費用と、305度の単位は書かれていない。","2026-11-22","Keeping it Simple","https://www.keepingitsimplecrafts.com/easy-christmas-gift-idea-christmas-wristlet-key-fobs-made-with-xtool-c1/"]],"uv":[["京都ステッカー、UV転写シールの100均品と業者製の違いを解説","京都ステッカーは2026年11月27日、100円ショップなどで買える既製品のUV転写シールと、業者に頼んで作るUVDTFステッカーの違いを比べる記事を公開した。既製品は用意されたデザインから選ぶのが一般的なのに対し、同店は客のデータで1枚から作れる点を違いに挙げる。UV硬化インクを透明PETフィルムに印刷する仕様や貼れる素材、参考料金、納期、食洗機での自社テストの結果もあわせて紹介している。","\n【概要】京都ステッカーは2026年11月27日、ブログ記事「【比較】UV転写シールは100均と業者で何が違う？1枚から作れる仕様と料金」を公開した。手軽に買える既製品のUV転写シールと、業者に製作を頼むUVDTFステッカーの違いを、仕様と料金の面から整理している。\n\n【背景】UV転写シールは、貼るだけで直接印刷したような仕上がりになるため、グッズ作りなどで関心が高まっている。記事によると、100均などで売られている既製品は、あらかじめ用意されたデザインから選ぶ形が一般的である。これに対して同店は、客が用意したデータをもとに1枚から製作できる点を大きな違いとして挙げる。\n\n【詳細】同店のUVDTFステッカーは、UV硬化型インクを透明PETフィルムに印刷するもので、CMYKにホワイトインクを加えた構成をとる。貼れる素材はガラス、金属、プラスチック、木材、陶器。参考料金（税別）は、50mm×50mmが10枚1,080円〜、50枚4,200円〜、100枚7,200円〜。100mm×100mmは10枚2,700円〜、50枚10,500円〜、100枚18,000円〜である。税別10,000円以上で送料無料となり、掲載を許可すると10%引きになる。納期は、無料の通常スピードプランが決済後2〜4営業日以内の発送、有料の特急スピードプランが1〜2営業日以内の発送。入稿はPNGまたはJPGで、解像度は300DPI以上を推奨する。\n\n【ポイント・注意点】金・銀インク、メタリック、箔押し、鏡面表現には対応しない。耐久性については、家庭用食洗器で100回程度洗っても剥がれなかったという同店のテストを紹介するが、デザインによっては剥がれる場合があるとしている。貼った後は24〜72時間の定着期間を置くよう勧める。既製のデザインで足りる用途か、オリジナルのデザインが必要な用途かで選び分けるのがよさそうだ。業者に頼む場合は1枚から作れるため、まず少ない枚数で仕上がりを確かめてから、必要な枚数を追加で注文するという進め方もとりやすい。","2026-11-27","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/27/24473/"],["京都ステッカー、UVDTFでのグッズ販売は儲かるかを解説","京都ステッカーは2026年11月27日、UVDTFステッカーを使ったオリジナルグッズ販売をテーマにした記事を公開した。グッズ販売の初期費用と在庫リスクを抑える手段として、1枚から作れるUVDTFステッカーを紹介している。UVプリンターを持たなくても貼るだけで仕上がる点や、自社工場での一貫製作で価格を抑える仕組み、向いている用途、参考料金、納期、食洗機での自社テストの結果をまとめている。","\n【概要】京都ステッカーは2026年11月27日、ブログ記事「【オリジナルグッズ販売】UVDTFステッカーで儲かる？1枚から作れる仕様と料金」を公開した。グッズ販売を始めたい人に向けて、UVDTFステッカーを使う利点と、注文時の仕様や料金をまとめている。\n\n【背景】オリジナルグッズの販売では、まとまった数を作ると初期費用がかかり、売れ残りの在庫を抱えるリスクもある。記事は、こうした負担を抑える手段として、1枚からの小ロットで作れるUVDTFステッカーを挙げる。UVプリンターを持っていなくても、台紙を剥がして貼り、転写シートを剥がすだけで仕上がる点を特徴とする。\n\n【詳細】UVDTFステッカーはフチなしで、写真やグラデーションも再現できるという。同店は自社工場で一貫して製作することで中間コストを抑え、格安価格を実現するとしている。用途の例には、ビールグラスやジョッキ、タンブラー、スマホケース、マグカップ、PC、文房具、工事現場のヘルメット、水筒やお弁当箱のお名前シールを挙げる。参考料金（税別）は、50mm×50mmが10枚1,080円〜、50枚4,200円〜、100枚7,200円〜。100mm×100mmは10枚2,700円〜、50枚10,500円〜、100枚18,000円〜。税別10,000円以上で送料無料、掲載許可で10%引きとなる。納期は通常が2〜4営業日（無料）、特急が1〜2営業日（有料）。入稿はPNGまたはJPGで、300DPI以上を推奨する。\n\n【ポイント・注意点】家庭用食洗器で100回程度洗っても剥がれなかったというテスト結果を紹介する一方、デザインによっては剥がれることがあるとして、事前に試すよう勧めている。貼った後は24〜72時間の定着期間が必要とする。販売用のグッズに使う場合は、実際の使われ方を想定した試作を先に行い、耐久性を確かめておくと安心だ。1枚から注文できる仕組みは、売れ行きを見ながら少しずつ追加で作るという販売の進め方とも相性がよい。まずは少ない数で始め、反応を見てから作る数を決めたい。","2026-11-27","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/27/24467/"],["ミマキ事例、豊橋の酒店がUV-DTF機でシャンパンを1本から加飾","ミマキエンジニアリングは2026年11月27日、UV-DTFプリンタ「UJV300DTF-75」の導入事例として、愛知県豊橋市の丸共そのべ酒店を紹介した。同店はオリジナルシャンパン「オリシャン」のボトル装飾で、従来の塩ビシールに代えてUV-DTFの転写シートを使う。酒類の表示を覆わずに彫刻のような高級感を出せることが導入の理由で、1本からの注文や急な注文にも短時間で対応できるようになったという。","\n【概要】ミマキエンジニアリングは2026年11月27日、新着情報で製品導入事例「飲食店が求める彫刻のような高級感を演出できる！オリシャン1本から対応可能な上、即日納品も手軽に実現」を掲載した。株式会社丸共そのべ酒店（愛知県豊橋市）が、UV-DTFプリンタ「UJV300DTF-75」を2025年7月に導入した事例である。\n\n【背景】同店は、飲食店向けのオリジナルシャンパン「オリシャン」を手がける。従来は大判プリンタで出力した塩ビシールをボトルに貼っていたが、剥がれやすく、安っぽく見えることが課題だった。酒類には表示義務があり、それに抵触するおそれがあるため、ボトル全体を覆うフルラッピングは避けたいという事情もあった。表示を覆わずに、彫刻のような加飾ができる点が導入の決め手になった。\n\n【詳細】UJV300DTF-75は幅0.6mの機種で、UVインクを使う。出力した転写シートを店舗ごとにストックしておく運用で、50店舗なら500本分を用意する想定だという。転写シートの貼り付けは5分もかからず、伝票入力を含めても出荷まで30分未満としている。酒類メーカーは通常500本以上、印刷会社でも基本5本以上のロットを求めるのに対し、1本から対応できることを強みにする。他社のUV-DTF転写シートは湿度に弱く、貼った翌日にインクが浮くことがあったが、この機種のシートは粘着力が強く貼りやすいと評価している。プリントサービスの売上高は過去3年連続で300%成長したと記載されている。\n\n【ポイント・注意点】フラットベッドのUVプリンターで瓶に直接印刷する方法も検討したが、翌日納品に間に合わないリスクがあるため採用しなかったという。事前に作り置きできるUV-DTFの特性が、小ロットと短納期の両立につながった例といえる。事例ページには関連記事として、ワコムズ、イデア、フナミズ刃型製版の各社によるUV-DTFプリンタの導入事例へのリンクも並んでおり、ほかの業種での使い方とも比べられる。酒類のように表示のルールがある商品での加飾例として参考になる。","2026-11-27","ミマキエンジニアリング","https://japan.mimaki.com/casestudy/improvement/sonobeliquorshop_uv-dtf.html"],["ベルファストのMAD Colour、swissQprintのUV機Nyala 5導入","英国の業界メディアEye on Displayは2026年11月26日、ベルファストの印刷会社MAD Colourが、swissQprintのフラットベッド式UVプリンター「Nyala 5」を導入したと報じた。アイルランド全域で手がけるディスプレイやブランド活性化の仕事を強化する狙いである。同社は6色にホワイトとバーニッシュを加えた構成を選び、柔らかい素材に印刷するためのロールtoロールオプションも付けた。","\n【概要】Eye on Displayは2026年11月26日、記事「MAD Colour boosts display work with Nyala 5 flatbed」を掲載した。ベルファストのMAD Colourが、swissQprintのフラットベッド式UVプリンター「Nyala 5」を導入し、アイルランド全域でのプレミアムなディスプレイやブランド活性化の業務を強化したという内容である。\n\n【背景】MAD Colourは2027年に50周年を迎える会社で、従業員は50名、年商は500万ポンド。デザイン、印刷、ディスプレイ、サイン、デジタルソリューションを手がけ、展示会、イベント、小売、ブランド空間の分野に顧客を持つ。こうした顧客に向けた質の高い展示物づくりを支える設備として、今回の導入を位置づけている。\n\n【詳細】Nyala 5の印刷サイズは3.2m×2mで、最大で毎時253m²を印刷できる。カラーチャンネルは最大10色まで設定できる。MAD Colourは、6色にホワイトとバーニッシュを加えた構成を選び、フレキシブルな素材に印刷するためのロールtoロールオプションも追加した。マネージングディレクターのJamie McMinnis氏は、Nyalaは成長戦略の要だと述べた。プレミアムな品質に加え、テクスチャーや効果などの仕上げの幅が広がること、消費電力や材料効率が改善することを導入の利点に挙げている。swissQprint UKのリージョナルセールスマネージャー、Ian Maxfield氏は、印刷品質、多用途性、効率の組み合わせが同社の計画に合っていると述べ、アイルランドでの展示・体験型ビジネスを支援するとした。\n\n【ポイント・注意点】ホワイトとバーニッシュを含む構成は、記事が挙げるテクスチャーや効果の表現を意識した選択といえる。フラットベッドにロールtoロールを組み合わせることで、硬い板材と巻き取り素材の両方を1台で扱える。なお、記事には導入の時期や投資額の記載はない。最大10色の構成を選べる機種で、どの色を積むかが用途を左右する。","2026-11-26","Eye on Display","https://www.eyeondisplay.com/mad-colour-boosts-display-work-with-nyala-5-flatbed/"],["英Only Boards、ミマキのUVフラットベッド機などで内製体制","英国の業界誌Image Reportsは2026年11月26日、インタビュー欄「Over to You」で英国のワイドフォーマット印刷会社Only Boards Graphicsを取り上げた。同社は2026年4月に営業を始め、CMYUKを通じてミマキのUV LEDフラットベッド機「JFX200-2513 EX」やロール機「UCJV330-160」などを導入した。印刷からカット、仕上げまでを社内で完結させる体制と、今後の注力分野について語っている。","\n【概要】Image Reportsは2026年11月26日、記事「Over to You with Only Boards」を掲載した。英国のワイドフォーマット印刷会社Only Boards Graphicsの共同創業者で、クリエイティブ兼オペレーションディレクターのPedro Guevara氏が、導入した機材と今後の方針について答えている。\n\n【背景】Only Boards Graphicsは2026年4月に営業を開始した新しい会社である。立ち上げにあたり、CMYUKから複数の新しい機材を導入した。硬い板材と柔らかいロール素材の両方を扱える設備をそろえ、印刷から仕上げまでを外注に頼らず社内で行える体制を整えた。\n\n【詳細】UV関連の機材として、ミマキのUV LEDフラットベッドプリンター「JFX200-2513 EX」を導入し、硬質の基材に直接印刷している。ロール給紙機の「UCJV330-160」は、ビニールグラフィック、車両ラッピング、壁紙などに使う。これに、JWEIのデジタルカッティングテーブル「JCUT Pro1625」、ミマキのプロッター、Neoltのラミネーターを組み合わせ、印刷、カット、仕上げを社内で完結させている。Guevara氏はミマキのプリンターについて、硬質と軟質の両方の素材に対応できる多用途性を高く評価した。JWEIは加工の幅を広げ、Neoltは仕上げ用として扱いやすく信頼できると述べている。\n\n【ポイント・注意点】今後の注力分野には、機能性のあるサイネージ、建設・不動産、ブランド空間、インテリア装飾を挙げた。5年後には英国のワイドフォーマット業界で名の知られる存在になることを目標とし、自動化への投資も進めるとしている。新しく開業した会社が、UVフラットベッド機とロール機を軸にどのような設備をそろえたかを知る具体例となる。印刷機だけでなく、カッティングテーブルやラミネーターまで同じ時期にそろえ、外部に出す工程をなくした点が、立ち上げ時の設備づくりの特徴といえる。","2026-11-26","Image Reports","https://imagereportsmag.co.uk/__trashed/"],["ミマキ欧州、再生キャストアクリルへのUV印刷の可能性を紹介","ミマキヨーロッパは2026年11月26日、再生アクリルとデジタル印刷に関するブログ記事を公開した。イタリアの独占輸入代理店Bompanと、キャストアクリルを製造するMadreperlaが、100%再生原料のアクリル板とデジタル印刷を組み合わせる取り組みを紹介した。アクリルへの装飾に使える機種として、ハイブリッドUV LEDプリンター「UJ330H-160」を挙げている。","\n【概要】ミマキヨーロッパは2026年11月26日、ブログ記事「Designed with Intent: The Rise of Regenerated Acrylic in Premium Spaces」を公開した。ミマキのイタリアにおける独占輸入代理店Bompanと、イタリアのキャストアクリル製造会社Madreperla S.p.A.が、再生キャストアクリルとデジタル印刷を組み合わせる取り組みを紹介している。\n\n【背景】Madreperlaは「Green Cast®」というブランドで、100%再生原料からつくるキャストPMMA（アクリル）シートを手がける。このシートはリサイクルも可能だとされる。環境に配慮した素材を、高級感が求められる空間や製品に使っていこうという動きが、記事のテーマになっている。素材メーカーと、印刷機を扱う販売代理店が組むことで、素材と加工の両面から提案する形をとっている。\n\n【詳細】想定する用途は、内装の装飾、高級ディスプレイ、販促品、工業デザイン、サインのほか、化粧品、香水、ホスピタリティ、マリンの分野である。こうした場面では、印刷面が湿気やアルコール、化学薬品にさらされることがあるため、耐久性が重要になると記事は説明する。アクリルに高品質な装飾を施せるミマキの機種として、ハイブリッドUV LEDプリンター「UJ330H-160」を写真付きで紹介している。再生素材とUV印刷を組み合わせることで、見た目の品質と環境への配慮を両立させる提案となっている。\n\n【ポイント・注意点】記事には、製品の価格や販売数などの具体的な数値は含まれていない。素材メーカーと販売代理店による取り組みの紹介であり、新製品の発表ではない点に注意が必要だ。再生アクリルへの印刷を検討する場合は、湿気やアルコール、薬品への耐性など、用途ごとに求められる耐久性を確かめることが前提になる。化粧品や香水の売り場など、薬品に触れやすい場所で使う場合は特に確認しておきたい。マリン分野のように湿気の多い環境も想定されている点は、素材と印刷の両方の耐久性が問われる用途として注目できる。","2026-11-26","Mimaki Europe","https://www.mimakieurope.com/news/digital-printing-on-acrylic-premium-spaces/"],["ヨツバ印刷、UV印刷のオリジナル豆皿を1個から販売開始","株式会社MAWが運営するオリジナルグッズ制作サービス「ヨツバ印刷」は2026年11月26日、オリジナルプレートの新サイズ「豆皿」（直径97mm）の販売を始めた。日本製のAS樹脂のお皿に、写真やイラスト、ロゴをUVインクジェット印刷でフルカラー印刷する。1個から注文でき、豆皿の税込価格は1個1,000円。既存のSサイズ、Lサイズと合わせて3つのサイズから選べるようになった。","\n【概要】株式会社MAW（大阪府大阪市）は2026年11月26日、運営するオリジナルグッズ制作サービス「ヨツバ印刷」で、オリジナルプレート（お皿）の新サイズ「豆皿（直径97mm）」の販売を開始したと発表した。既存のSサイズ（直径180mm）、Lサイズ（直径240mm）と合わせ、全3サイズから選べる。\n\n【背景】アクセサリー置きや小物トレイ、コンパクトな雑貨としては、一般的な食器より小さいサイズが向く場合がある。同社はこうした用途を想定して豆皿を追加した。想定する用途は、キャラクターグッズ、推し活グッズ、クリエイター作品、イベント物販、企業ノベルティなどである。\n\n【詳細】素材は日本製のAS樹脂で、透明感がある。写真、イラスト、キャラクター、企業ロゴなどを、UVインクジェット印刷（CMYK出力）でフルカラー印刷する。リリースでは、UV印刷を紫外線でインクを硬化させる方式と説明している。最小注文数は1個。1個注文時の税込価格は、豆皿が1,000円、Sサイズが1,380円、Lサイズが1,480円である。出荷までの納期は6営業日から（土日祝を除く）。注文は、テンプレートを使った入稿か、デザインシミュレーターで行う。100個以上の注文は問い合わせ扱いとなり、法人向けの大ロット注文にも対応する。\n\n【ポイント・注意点】食器洗浄機は使えない。また、長く使ったり使う頻度が高かったりすると、印刷部分が劣化する場合があるとしている。食器の形をしているものの、小物置きや飾りとしての使い方が中心になりそうだ。1個から作れるため、イベント向けの試作や少量の販売にも使いやすい。サイズ違いを組み合わせれば、同じデザインでシリーズとして展開することもできる。豆皿は3サイズの中で最も安く、1個1,000円で作れるため、まず豆皿で印刷の仕上がりや色味を確かめ、気に入ればSサイズやLサイズに広げるという使い方も考えられる。注文はヨツバ印刷の商品販売ページから受け付けている。報道向けの問い合わせ窓口も用意されている。","2026-11-26","PR TIMES","https://prtimes.jp/main/html/rd/p/000000418.000072705.html"],["yomiyomi、UVプリントのNFCステッカーを1枚から販売","株式会社yomiyomiは2026年11月25日、設立1周年にあわせ、NFCチップ入りの「思い出召喚ステッカー」をリニューアルした。これまで100枚単位で販売していたが、個人も1枚から買えるようにした。価格は1枚1,980円（税込）で、UVプリントで1枚ずつ印刷する。スマホをかざすと登録した写真や動画が再生される仕組みで、12月20日には都内でクリスマスのポップアップも開く予定だ。","\n【概要】株式会社yomiyomi（東京都渋谷区）は2026年11月25日、設立1周年を迎えたことにあわせて、NFCチップ入りステッカー「思い出召喚ステッカー」をリニューアルしたと発表した。これまで100枚単位で販売していた商品を、個人でも1枚から購入できる形にした。\n\n【背景】思い出召喚ステッカーは、スマートフォンをかざすと、登録しておいた写真や動画が再生されるステッカーである。2025年3月の販売開始から累計6,000枚以上を販売し、2025年度グッドデザイン・ニューホープ賞を受賞した。ただ、これまでは100枚単位の販売だったため、個人には買いにくかった。\n\n【詳細】価格は1枚1,980円（税込）で、送料は一律500円。サイズは50mmで、形は丸か四角を選ぶ。厚みのある仕様で、UVプリントで1枚ずつ印刷し、裏面には3Mののりを使う。アプリのインストールや会員登録は不要で、NFCを搭載したiPhone（XS/XR以降）とAndroid端末に対応する。「思い出ページ」には写真や動画を6つまで（合計300MB）入れられ、保存期間は5年。注文時にはデザイン画像だけを送り、届いたステッカーにかざしてから写真や動画を登録する。届くのは注文の翌月中で、11月の注文は12月中となる。1年後には「1年前の思い出」がメールで届く。\n\n【ポイント・注意点】2026年12月20日（日）には都内でクリスマスのポップアップを開く予定で、会場と時間は後日、公式SNSで発表する。UVプリンターそのものの話題ではないが、UVプリントによる1枚単位の小ロット生産を、NFCと組み合わせて商品にした例として参考になる。100枚単位から1枚単位に切り替えられたのは、1枚ずつ印刷できるUVプリントの特性があってこそといえる。購入は専用の販売ページから行う。一方、届くのは注文の翌月中となるため、クリスマスや記念日の贈り物に使う場合は、日程に余裕を持って注文する必要がある。注文時はデザイン画像を送るだけでよく、写真や動画は手元に届いてから登録できる。","2026-11-25","PR TIMES","https://prtimes.jp/main/html/rd/p/000000005.000157692.html"],["ローランドDG、UV機VersaObject MO向けカメラオプション発表","英国の業界誌Large Format Reviewは2026年11月25日、ローランドDGがUVフラットベッドプリンター「VersaObject MO-240」「MO-180」向けに、カメラオプション「OA-CM-240」「OA-CM-180」を発表したと報じた。平台に置いた物体の形と位置をカメラで検出し、治具を作らずに直接印刷できるようにする。専用ソフト「QYPrintVision」が印刷データを自動で配置し、VersaWorks 7に送って印刷する。","\n【概要】Large Format Reviewは2026年11月25日、記事「Roland DG adds camera positioning to VersaObject MO printers」を掲載した。ローランドDGが、UVフラットベッドプリンター「VersaObject MO-240」「MO-180」向けの新しいカメラオプション「OA-CM-240」「OA-CM-180」を発表したという内容である。\n\n【背景】UVフラットベッド機で小物に印刷する場合、物体を決まった位置に固定するための治具（ジグ）を作ったり、手作業で位置を合わせたりする手間がかかる。ローランドDGのRyugo Nimura氏（グローバルセールス＆マーケティング部門の執行役員）は、少量生産や個別化した製品の需要が増えるなか、治具や手作業の位置合わせを減らすことが生産性の向上につながると述べている。\n\n【詳細】カメラが平台に自由に置かれた物体をスキャンし、専用ソフトウェア「QYPrintVision」が形状と位置を登録する。オペレーターが印刷データを選ぶと、検出した形状に合わせて自動で配置され、VersaWorks 7に送られて印刷される。同じデザインを複数の物体に印刷する、同じ形の物体に別々のデザインを当てる、形の違う物体にそれぞれのデザインを一つの流れで印刷する、といった使い方ができる。対応素材はプラスチック、金属、ガラス、木材、キャンバス、ビニール、紙。スキャンエリアは、MO-240向けのOA-CM-240が590×403mm、MO-180向けのOA-CM-180が410×250mmである。\n\n【ポイント・注意点】対応するのは2026年10月26日以降に製造された本体に限られる。販売はローランドDGの正規販売店網を通じて行う。想定する用途には、販促品、カスタム品、一点物、店頭でのパーソナライズなどを挙げている。既存の本体に後付けできるかは製造時期で決まるため、導入前に確認が必要だ。ローランドDGはUVインクの幅広いラインアップと組み合わせることで、多品種の小物印刷に対応するとしている。","2026-11-25","Large Format Review","https://www.largeformatreview.com/hardware/wide-format-print/roland-dg-versaobject-mo-camera-option/"],["京都ステッカー、UVDTFステッカーの活用事例5つを紹介","京都ステッカーは2026年11月25日、UVDTFステッカーの活用事例を5つ紹介する記事を公開した。オリジナルグッズ、飲食店のグラスや店舗の装飾、工事現場のヘルメットや工具の識別ラベル、食洗機で洗う水筒やお弁当箱のお名前シール、写真入りグラスなどのギフトを例に挙げる。あわせて、印刷の仕様や入稿データの条件、参考料金、納期、貼った後の定着期間などの注意点もまとめている。","\n【概要】京都ステッカーは2026年11月25日、ブログ記事「【活用事例5選】おしゃれなUVDTFステッカーを1枚から製作！」を公開した。UVDTFステッカーがどのような場面で使われているかを5つの事例で紹介し、製作上の注意点と料金も載せている。\n\n【背景】UVDTFステッカーは、UV硬化インクで印刷したステッカーを貼ることで、物に直接印刷したような仕上がりを得られるものだ。使い道の幅が広いため、具体的な活用方法を知りたいという利用者に向けた記事となっている。\n\n【詳細】紹介する事例は5つ。1つ目は、スマホケース、タンブラー、マグカップ、PC、文房具などのオリジナルグッズ。2つ目は、ビールグラスやジョッキへの店舗ロゴ、ショーウィンドウやドアの装飾。3つ目は、安全ヘルメットへの会社ロゴや、工具・機材の識別ラベル。4つ目は、食洗機で洗う水筒やお弁当箱に貼るお名前シール。5つ目は、写真やメッセージを入れたグラスなどのギフトである。印刷はCMYKにホワイトインクを加えて行い、入稿ファイルはPNGかJPGで、解像度は300DPI以上を推奨する。参考料金（税別）は、50mm×50mmが10枚1,080円〜、50枚4,200円〜、100枚7,200円〜。100mm×100mmは10枚2,700円〜、50枚10,500円〜、100枚18,000円〜。税別10,000円以上で送料無料、掲載許可で10%引き。納期は通常が2〜4営業日以内の発送（無料）、特急が1〜2営業日以内（有料・要事前確認）である。\n\n【ポイント・注意点】金・銀インク、メタリック、箔押し、鏡面表現には対応しない。食洗機については、家庭用食洗機で100回程度洗っても剥がれなかったという自社テストに触れつつ、デザインによっては剥がれる場合があるとする。スキージーなどでしっかり密着させ、24〜72時間の定着期間を置くよう案内している。5つの事例は個人のグッズ作りから店舗、工事現場まで幅広く、用途を考える際の手がかりになる。どの事例も1枚から作れる点は共通している。","2026-11-25","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/25/24312/"],["京都ステッカー、UVDTFステッカーが貼れる素材と貼れない条件","京都ステッカーは2026年11月25日、UVDTFステッカーを貼れる素材と、貼れない・注意が必要な条件を一覧にした記事を公開した。貼れる素材はガラス、金属、プラスチック、木材、陶器で、コップやボトルのような緩やかな曲面にも対応する。一方、極端な曲面や複雑な形状のものは事前に試すよう勧めている。金・銀などの対応しない表現や、貼った後の定着期間、料金、納期もあわせて説明している。","\n【概要】京都ステッカーは2026年11月25日、ブログ記事「【一覧】UVDTFステッカーの貼れる素材と貼れない条件！小ロット製作の仕様」を公開した。UVDTFステッカーをどんな素材に貼れるのか、どんな条件だと注意が必要なのかを一覧で整理している。\n\n【背景】UVDTFステッカーはさまざまな物に貼れることが特徴だが、素材や形によっては向かない場合もある。注文してから貼れないと分かる失敗を防ぐため、事前に確認すべき条件をまとめた内容である。\n\n【詳細】貼れる素材として挙げるのは、ガラス、金属、プラスチック、木材、陶器の5種類。コップやボトルなどの緩やかな曲面には対応するが、極端な曲面や複雑な形状のものは、事前に試すよう勧めている。表現の面では、金・銀インク、メタリック、箔押し、鏡面表現に対応しない。これらはデータ上、CMYKで表した金色風・銀色風の表現になるとしている。料金（税別）は、50mm×50mmが10枚1,080円〜、50枚4,200円〜、100枚7,200円〜。100mm×100mmは10枚2,700円〜、50枚10,500円〜、100枚18,000円〜である。税別10,000円以上で送料無料、掲載許可で10%引き。納期は、通常が2〜4営業日（無料）、特急が1〜2営業日（有料・要事前確認）。入稿はPNGかJPGで、300DPI以上を推奨する。\n\n【ポイント・注意点】家庭用食洗器で100回程度洗っても剥がれなかったという同店のテストを紹介する一方、デザインによっては剥がれる場合があると注意を促している。貼った後は最低24〜72時間の定着期間を置き、すぐに洗わないよう案内する。貼る対象の形が特殊な場合は、少量で試してから本格的に注文するのが確実だ。1枚から注文できるため、試しに貼ってみるための少量の注文もしやすい。素材が5種類に限られている点も踏まえ、布や紙など一覧にない素材に貼りたい場合は、事前に問い合わせておくと安心だ。貼る面の汚れや油分を落としてから貼ることも、密着させるうえでの基本になる。","2026-11-25","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/25/24305/"],["ME-Q、UV印刷のオリジナルマイナンバーカードケースを1個から","株式会社MAWが運営するオリジナルグッズ作成サービス「ME-Q（メーク）」は2026年11月24日、オリジナルのマイナンバーカードケースの印刷・作成サービスを始めたと発表した。顔写真の部分が見える窓付きのPUレザー製ケースで、表裏に写真やイラスト、名前、ロゴをUVインクジェット印刷でフルカラー印刷できる。1個から注文でき、税込価格は片面印刷が1,400円、両面印刷が1,900円。","\n【概要】株式会社MAW（大阪府大阪市）は2026年11月24日、運営するオリジナルグッズ作成サービス「ME-Q（メーク）」で、オリジナルマイナンバーカードケースの印刷・作成サービスを開始したと発表した。顔写真が見える専用の窓が付いた、PUレザー（合成皮革）製のカードケースである。\n\n【背景】自分だけのデザインのカードケースを、1個から作れるようにしたサービスである。想定する用途は、個人での利用、プレゼント、ハンドメイド作家による販売、企業のノベルティなどで、少量から大量まで幅広い注文に対応する。\n\n【詳細】窓の部分は透明フィルムで保護され、上部には指をかけやすい半円状のくぼみがある。本体の色はホワイトで、サイズは約H62×W96mmの薄型。長財布にも入れやすいとしている。表面と裏面に、写真、イラスト、名前、ロゴ、オリジナルキャラクターなどを、UVインクジェット印刷（CMYK出力）でフルカラー印刷する。印刷は、顔写真側だけの片面印刷と、表裏の両面印刷から選べる。1個注文時の税込価格は、片面印刷が1,400円、両面印刷が1,900円。最低注文数は1個で、1〜19個の場合の納期は、片面が4営業日出荷から、両面が5営業日出荷から（土日祝を除く）。20個以上は数量によって納期が変わり、100個以上は問い合わせとなる。注文数に応じたロット割引もある。デザインシミュレーターを使えば、スマホ、タブレット、パソコンから作れる。\n\n【ポイント・注意点】よくある質問では、スキミング防止機能を保証する商品ではないこと、ケースに入れたままでのマイナ保険証の読み取りは保証しないことを明記している。購入前にこれらの点を確認しておきたい。窓付きで顔写真の部分が見える構造のため、デザインは窓の位置を避けて配置する必要がある。デザインシミュレーターで仕上がりを確かめながら作るとよい。注文数に応じたロット割引があるため、企業のノベルティなどでまとめて作る場合は、数量ごとの価格と納期もあわせて確かめておきたい。20個以上では納期が数量で変わる点にも注意が必要だ。","2026-11-24","PR TIMES","https://prtimes.jp/main/html/rd/p/000000417.000072705.html"],["Eye on Display、UVフラットベッドプリンターの選び方を解説","英国の業界メディアEye on Displayは2026年11月24日、UVフラットベッドプリンターの購入者向けガイドを公開した。UV LEDによる即時硬化の仕組みや対応素材、扱える厚さ、ベッドサイズの分類などを解説し、Mimaki、Epson、Mutoh、InkTecなど各社の機種の仕様を紹介している。点字やテクスチャーの印刷に必要な盛り上げの高さにも触れ、用途に合った機種選びの目安を示している。","\n【概要】Eye on Displayは2026年11月24日、記事「How to choose a UV flatbed printer」を公開した。UVフラットベッドプリンターの購入を考える事業者に向けて、基本的な仕組みから機種ごとの仕様までをまとめたガイドである。\n\n【背景】UVフラットベッドは、UV LEDでインクを即座に硬化させる方式で、プライマー、白、カラー、バーニッシュを重ねて印刷できる。対応する素材は、フォームボード、アルミ複合板、アクリル、コルゲートボード、木材、ガラス、金属、多くのプラスチックと幅広い。生産用の機種は一般に約50mmの厚さまで扱え、新しい機種では100mm級のものもあるという。\n\n【詳細】ベッドサイズは、A3級のデスクトップ機、約90×60cmのコンパクト機、8ft×4ftの板に対応する約2.5×1.3mの中型機、約3.2×2m以上の大型機に分けて説明している。点字の点の高さは英国AAF基準で0.5mm、テクスチャーは最大5mmとしている。紹介機種には、Dlican DLI-3325 Pro（ベッド3.3×2.5m、Ricohヘッド2〜36基、5pl、1,800dpi、標準100mm高）、SinoColor FB-0906（900×600mm、最大毎時11m²）、Mimaki JFX220-2515（2,500×1,500mm、毎時42m²、厚さ101.6mm）、Mutoh XpertJet 1462UF（1,420×700mm、150mm高）、Epson SureColor V7000（2.5×1.25m、10色のUltraChrome UV、80mm厚）、InkTec JETRIX LXa7-R（2,500×3,050mm、最大毎時146m²）などがある。\n\n【ポイント・注意点】紹介されている機種の情報は、各販売パートナーが提供したものとされる。速度や対応する厚さは機種ごとに大きく異なるため、扱う素材の大きさと厚さ、必要な生産量から絞り込むのが基本となる。点字サインなど基準がある用途では、必要な盛り上げの高さを出せるかも確かめたい。","2026-11-24","Eye on Display","https://www.eyeondisplay.com/how-to-choose-a-uv-flatbed-printer/"],["京都ステッカー、UVDTFステッカーの注文方法と料金を解説","京都ステッカーは2026年11月24日、自社のUVDTFステッカーの注文の流れと料金を解説する記事を公開した。オンラインのWEB見積もりシステムに画像をアップロードし、サイズや数量、オプションを選ぶと見積もりが表示され、入稿から決済まで24時間いつでも進められるという。UV硬化インクとホワイトインクによる印刷の仕様、参考料金、納期、食洗機での耐久テストの結果もあわせて紹介している。","\n【概要】京都ステッカーは2026年11月24日、ブログ記事「【1枚から】京都ステッカーのUVDTFステッカー注文方法と料金」を公開した。初めて注文する人に向けて、見積もりから入稿、決済までの手順と、料金や納期の目安を説明している。\n\n【背景】UVDTFステッカーは1枚から注文できるため、個人の利用者も多い。注文の手順が分かりにくいと利用のハードルになるため、オンラインでの手続きの流れを具体的に示している。\n\n【詳細】注文は、オンラインのWEB見積もりシステムで行う。画像をアップロードし、サイズ、数量、オプションを選ぶと見積もりが表示される。見積書のPDFをダウンロードでき、入稿と決済まで24時間いつでも進められる。印刷にはUV硬化インクを使い、CMYKにホワイトインクを加えることで、透明な素材や暗い色の素材でも発色するとしている。入稿データはPNGかJPGで、300DPI以上を推奨する。参考料金（税別）は、50mm×50mmが10枚1,080円〜、50枚4,200円〜、100枚7,200円〜。100mm×100mmは10枚2,700円〜、50枚10,500円〜、100枚18,000円〜で、入稿データの種類や個別カットなどのオプションによって変わる。税別10,000円以上で送料無料、掲載許可で10%引き。納期は、通常スピードプランが決済後2〜4営業日以内の発送（無料）、特急スピードプランが1〜2営業日以内（有料・事前確認）。\n\n【ポイント・注意点】金・銀インク、メタリック、箔押し、鏡面表現には対応しない。家庭用食洗器で100回程度洗っても剥がれなかったとする一方、デザインによっては剥がれる場合があるという。スキージーでしっかり密着させ、24〜72時間の定着期間を置くよう案内している。見積もりから決済までをオンラインで完結できるため、急ぎの場合は特急スピードプランを選べるが、有料で事前の確認が必要な点に注意したい。料金は入稿データの種類や個別カットなどのオプションで変わるため、最終的な金額は見積もりシステムで確かめることになる。","2026-11-24","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/24/24262/"],["京都ステッカー、UVDTFステッカーの長所と短所、用途を整理","京都ステッカーは2026年11月23日、UVDTFステッカーとは何かを、メリット・デメリットと用途の面から解説する記事を公開した。UV硬化型インクで透明PETフィルムに印刷したステッカーで、UVプリンターを持たなくても貼るだけでグッズを作れるという。白インク対応や耐水・耐候性などの長所に加え、金銀の表現に対応しない点や、貼った後に定着期間が必要な点など短所も示している。","\n【概要】京都ステッカーは2026年11月23日、ブログ記事「【1枚から】UVDTFステッカーとは？メリット・デメリットと用途を解説」を公開した。UVDTFステッカーの基本と、良い点・注意点、主な使い道をまとめた入門向けの記事である。\n\n【背景】UVDTFステッカーは、UV硬化型インクで透明PETフィルムに印刷したステッカーである。UVプリンターを持っていなくても、貼るだけでグッズを作れる点が特徴とされる。初めて使う人が、向き不向きを判断できるように整理している。\n\n【詳細】メリットとして、高精細なフルカラー印刷、白インクに対応しているため透明な素材や暗い色の素材でも発色すること、水・擦れ・紫外線に強い耐久性・耐水性・耐候性、フチなしの仕上がりを挙げる。ガラス、金属、プラスチック、木材、陶器に貼ることができ、台紙を剥がして貼り、転写シートを剥がすだけの簡単な施工も利点とする。デメリットとしては、金・銀インク、メタリック、箔押し、鏡面表現に対応しないこと、貼った直後の洗浄を避けて24〜72時間定着させる必要があること、デザインによっては剥がれる場合があることを挙げる。用途はグッズ、ノベルティ、飲食店、工事現場、お名前シール、プレゼント。料金（税別）は、50mm×50mmが10枚1,080円〜、50枚4,200円〜、100枚7,200円〜、100mm×100mmが10枚2,700円〜、50枚10,500円〜、100枚18,000円〜。\n\n【ポイント・注意点】税別10,000円以上で送料無料、掲載許可で10%引きとなる。納期は通常が2〜4営業日以内（無料）、特急が1〜2営業日以内（有料）。家庭用食洗器で100回程度洗うという自社テストにも触れている。長所と短所の両方を確かめたうえで、用途に合うかを判断したい。特に、金や銀の光沢を生かしたデザインを考えている場合は、色の表現で代わりにすることになる点を事前に理解しておく必要がある。また、貼った直後に使いたい場合も、定着期間を見込んで早めに準備しておきたい。","2026-11-23","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/23/24170/"],["京都ステッカー、UVDTFの白版データ作成と入稿仕様を解説","京都ステッカーは2026年11月22日、UVDTFステッカーのデータ作成と、白インク（白版）への対応について解説する記事を公開した。CMYKにホワイトインクを加えて印刷するため、透明なガラスや暗い色の素材でもデザインが沈まずに発色するという。入稿ファイルの形式や推奨解像度、金・銀など対応しない表現、料金と納期、貼った後に必要な定着期間まで、注文前に知っておきたい点を説明している。","\n【概要】京都ステッカーは2026年11月22日、ブログ記事「UVDTFステッカーのデータ作成！白版（白インク）対応と入稿仕様」を公開した。UVDTFステッカーを注文する際のデータの作り方と、白インクの役割について説明している。\n\n【背景】透明な素材や暗い色の素材にカラーの印刷物を貼ると、下地の色が透けてデザインが沈んで見えることがある。これを防ぐのが白インク（白版）で、UVDTFステッカーではこの白版に対応している点が特徴の一つとなっている。\n\n【詳細】同店のUVDTFステッカーは、CMYKにホワイトインクを加えて印刷するため、透明なガラスや暗色の素材でもデザインが沈まずに発色するという。入稿ファイルはPNGかJPGで、解像度は300DPI以上を推奨し、詳しくは公式の入稿ガイドを見るよう案内している。金・銀インク、メタリック、箔押し、鏡面表現には対応しておらず、これらを使ったデザインは、データ上の金色風・銀色風の表現になる。料金（税別）は、50mm×50mmが10枚1,080円〜、50枚4,200円〜、100枚7,200円〜。100mm×100mmは10枚2,700円〜、50枚10,500円〜、100枚18,000円〜で、1枚から注文できる。税別10,000円以上で送料無料、掲載許可で10%引き。納期は、通常が決済後2〜4営業日以内の発送（無料）、特急が1〜2営業日以内（有料）。\n\n【ポイント・注意点】耐久性については、緩やかな曲面に貼れること、家庭用食洗器で100回程度洗っても剥がれなかったというテストに触れている。ただしデザインによっては剥がれるため、スキージーなどで密着させ、最低24〜72時間の定着期間を置くよう案内している。透明な素材に貼る予定なら、白版の効果を前提にデザインを考えるとよい。入稿データの解像度が低いと仕上がりが粗くなるため、推奨の300DPI以上を守ることも大切だ。金・銀の表現を使いたい場合は、色の表現で代わりにすることを前提にデザインを調整したい。不明な点は公式の入稿ガイドで確かめられる。","2026-11-22","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/22/24139/"],["京都ステッカー、UVDTFとUVプリンター直接印刷の違いを解説","京都ステッカーは2026年11月22日、UVDTFステッカーの仕組みと、従来のUVプリンターによる直接印刷との違いを解説する記事を公開した。グラスやスマホケースにフルカラーで印刷するには、これまでUVプリンターで対象物に直接印刷する必要があったが、UVDTFステッカーは印刷済みのステッカーを貼るだけで済むという。高精細なフルカラーやフチなしの仕上がりなど特徴5点のほか、用途、料金、納期も紹介している。","\n【概要】京都ステッカーは2026年11月22日、ブログ記事「UVDTFステッカーとは？仕組みと従来の直接印刷との違いを解説」を公開した。UVDTFステッカーの仕組みを、UVプリンターで物に直接印刷する従来の方法と比べながら説明している。\n\n【背景】グラスやジョッキ、スマホケースなどにフルカラーで印刷するには、従来はUVプリンターで対象物に直接印刷する必要があったと記事は説明する。UVDTFステッカーは、印刷済みのステッカーを貼るだけで同じような仕上がりを得られる。施工は、台紙を剥がして貼り、転写シートを剥がすという手順である。\n\n【詳細】特徴として、高精細なフルカラー、高い耐久性・耐水性・耐候性、貼るだけの簡単な施工、多くの素材への対応、フチなしの仕上がりの5点を挙げる。印刷はCMYKにホワイトインクを加えて行い、金・銀インク、メタリック、箔押し、鏡面表現には対応しない。用途は、オリジナルグッズ、飲食店・店舗、工事・建設現場、お名前シール、プレゼント・記念品。料金（税別）は、50mm×50mmが10枚1,080円〜、50枚4,200円〜、100枚7,200円〜。100mm×100mmは10枚2,700円〜、50枚10,500円〜、100枚18,000円〜。税別10,000円以上で送料無料、掲載許可で10%引き。納期は通常が2〜4営業日以内（無料）、特急が1〜2営業日以内（有料・要事前確認）。入稿はPNGかJPGで、300DPI以上を推奨する。\n\n【ポイント・注意点】食洗機については、家庭用食洗器で100回程度洗っても剥がれなかったという同店のテストを紹介しつつ、デザインによっては剥がれる場合があるとして事前に試すよう勧める。UVプリンターを導入せずに、直接印刷に近い仕上がりを得たい場合の選択肢となる。少ない数だけ装飾したい場合は、機械を買うよりも、1枚から頼めるステッカーのほうが始めやすい。ただし金・銀などの表現には対応しないため、デザインによっては向き不向きがある。用途と数量に合わせて、直接印刷と使い分けたい。","2026-11-22","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/22/24135/"],["京都ステッカー、UVDTFを曲面に貼るコツと定着期間を解説","京都ステッカーは2026年11月21日、UVDTFステッカーの貼り方を、曲面に貼るコツと定着期間を中心に解説する記事を公開した。コップやボトルなどの緩やかな曲面には問題なく貼れるとし、台紙を剥がして貼る、スキージーで密着させる、転写シートをゆっくり剥がすという3つの手順を示す。曲面では中心から外へ空気を押し出すのがコツで、貼った後は最低24〜72時間置くよう勧めている。","\n【概要】京都ステッカーは2026年11月21日、ブログ記事「【失敗しない】UVDTFステッカーの貼り方！曲面に貼るコツと定着期間」を公開した。UVDTFステッカーをきれいに貼るための手順と、曲面に貼る際の注意点、貼った後に必要な定着期間を説明している。\n\n【背景】UVDTFステッカーは、コップやボトルのような曲面に貼りたいという需要が多い。一方で、貼り方を誤ると空気が入ったり剥がれたりする原因になる。記事では、緩やかな曲面であれば問題なく貼れるとしたうえで、失敗しないための手順を示している。\n\n【詳細】貼り方は3つの手順からなる。まず台紙を剥がして対象物に貼る。次にスキージーなどでしっかり密着させる。最後に転写シートをゆっくり剥がす。曲面に貼る場合は、中心から外側へ空気を押し出すようにスキージーをかけると密着しやすいという。貼った直後には洗わず、最低24〜72時間の定着期間を置く必要がある。よくある質問では、1枚から注文できること、入稿はPNGかJPGで300DPI以上を推奨すること、金色や銀色はデータ上の金銀風の表現になることを挙げている。料金（税別）は、50mm×50mmが10枚1,080円〜、50枚4,200円〜、100枚7,200円〜。100mm×100mmは10枚2,700円〜、50枚10,500円〜、100枚18,000円〜。税別10,000円以上で送料無料、掲載許可で10%引き。納期は通常が2〜4営業日以内（無料）、特急が1〜2営業日以内（有料）。\n\n【ポイント・注意点】家庭用食洗器で100回程度洗っても剥がれなかったという同店のテストに触れる一方、デザインや貼り方によっては剥がれる場合があるとして、事前に確かめるよう勧めている。貼る作業そのものよりも、その後の定着期間を守ることが長持ちの鍵になる。食器やボトルに貼った場合は、使い始めたくなっても数日は洗わずに置いておく必要がある。曲面に貼るときは、空気を逃がす向きを意識するだけでも仕上がりが変わる。転写シートは急がず、ゆっくり剥がすことも大切だ。","2026-11-21","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/21/24106/"]],"risk":[["岡山県内9校園でインフルとみられる集団風邪、患者94人　最長12月1日まで閉鎖","岡山県などは11月27日、県内の9つの学校・園でインフルエンザとみられる集団風邪が発生したと発表した。患者は計94人で、最長で12月1日まで学年閉鎖や学級閉鎖の措置をとる。対象は総社市の阿曽幼、勝央町の勝間田高、岡山市の第二藤田小・箕島小・西大寺中、倉敷市の連島南小・中島小・西阿知小・二万小。幼稚園から高校まで幅広い年代で集団発生が確認されており、家庭でも体調の変化に気を配りたい。","\n【概要】岡山県などは11月27日、県内の9つの学校・園でインフルエンザとみられる集団風邪が発生したと発表した。山陽新聞デジタルによると、患者は計94人に上り、各校園は最長で12月1日まで学年閉鎖や学級閉鎖の措置をとる。発生したのは幼稚園から小学校、中学校、高校までと幅広く、県内の複数の市町にまたがっている。\n【背景】インフルエンザは、せきやくしゃみによる飛沫や、ウイルスが付いた手で口や鼻に触れることで広がる。子どもが長い時間を一緒に過ごす学校や園は集団感染が起きやすい場であり、一定数の欠席者が出た段階で学年や学級単位の閉鎖を行い、感染の連鎖を断つ対応がとられる。また、学校や園で広がったウイルスが家庭に持ち込まれ、保護者や幼いきょうだいに感染が広がることもある。今回の発表は、県と、独自に保健所を持つ岡山市・倉敷市の発表を合わせたものとなっている。\n【詳細】記事によると、対象となった校園は次の通り。県の発表分は阿曽幼（総社市）と勝間田高（勝央町）。岡山市の発表分は第二藤田小、箕島小、西大寺中の3校。倉敷市の発表分は連島南小、中島小、西阿知小、二万小の4校で、倉敷市内の小学校が最も多い。9校園の患者数の合計は94人で、閉鎖期間は校園によって異なり、最も長いところで12月1日までとなっている。幼稚園の子どもから高校生まで、年齢を問わず集団発生が起きている点が今回の特徴といえる。記事では、県や市による追加のコメントは示されていない。\n【ポイント・注意点】幼児から高校生まで幅広い年代で集団発生が報告されていることから、地域全体で流行が広がっている可能性に注意したい。学年・学級閉鎖は感染拡大を抑えるための措置であり、閉鎖期間中は人が集まる場所への外出をできるだけ控え、家庭で体を休めることが大切だ。家庭では、帰宅後や食事前の手洗い、部屋のこまめな換気を心がけたい。子どもに急な発熱やせき、だるさなどの症状が見られた場合は無理に登校・登園させず、かかりつけ医に相談したうえで受診するようにしたい。きょうだいがいる家庭では、家庭内での感染の広がりにも気を配る必要がある。","2026-11-27","Yahoo!ニュース（山陽新聞デジタル）","https://news.yahoo.co.jp/articles/7e1c5903b1683b47679a2fe167fcd9791f35b9a5"],["こども園で4歳児が凍ったゼリーで窒息死　職員は注意書きを認識、香芝市が行政指導","2026年9月、奈良県香芝市の認定こども園で4歳の男の子が凍らせたゼリーをのどに詰まらせて死亡した事故で、複数の職員がパッケージにある「凍らせて食べるとのどに詰まる原因になる」との注意書きを認識していたと話していることが関西テレビの取材で分かった。香芝市は11月27日、運営するこども園に行政指導を実施した。市は早ければ年内にも事故検証委員会を設置し、原因分析と再発防止策を検討する。","\n【概要】今年9月、奈良県香芝市の認定こども園「あけぼの・幼保学院」で、4歳の男の子が凍らせたゼリーをのどに詰まらせて死亡した。関西テレビの取材で、複数の職員がゼリーのパッケージに記された注意喚起の文言を認識していたと話していることが分かった。香芝市は11月27日、このこども園に対して行政指導を行った。子どもの命を預かる施設での食事の安全管理が、改めて問われている。\n【背景】ゼリーは軟らかく食べやすい食品として子どもに出されることが多いが、凍らせると硬さや形状が変わり、のどに詰まりやすくなる。今回のゼリーのパッケージには「凍らせて食べるとのどに詰まる原因になる」と記載されていた。保育施設では、食べ物による窒息は重大事故につながるおそれがあり、食材の形状や提供方法への配慮が求められている。幼い子どもは、食べ物を十分にかみ砕く前に飲み込んでしまうこともある。\n【詳細】記事によると、香芝市は先月（10月）から、子ども・子育て支援法に基づいてこのこども園への指導監査を行ってきた。その結果を踏まえ、27日に行政指導を実施した。市は事故の原因分析と再発防止策を検討するため、事故検証委員会を「早ければ年内にも」設置する方針だ。一方で、市は園について「運営の継続に向けて支援していく」としている。複数の職員が注意書きを認識していたという点は、記事の中で取材により明らかになった事実として伝えられている。\n【ポイント・注意点】食品のパッケージに書かれた注意書きは、事故を防ぐための大切な情報だ。保育施設だけでなく家庭でも、子どもに食べ物を与える際は表示をよく確認し、「凍らせない」などの指示を守ることが重要になる。幼い子どもはかむ力や飲み込む力が十分に発達しておらず、大人が問題ないと感じる食べ物でも詰まらせることがある。施設では、注意事項を職員の間で共有し、手順として徹底する仕組みづくりも欠かせない。食事やおやつの際は子どもから目を離さず、落ち着いて座った状態で食べさせるようにしたい。万一に備え、のどに物が詰まったときの対処法を、保護者や保育者があらかじめ確認しておくことも大切だ。","2026-11-27","Yahoo!ニュース（関西テレビ）","https://news.yahoo.co.jp/articles/4478331b7daa552f844fd809d2d55e202b1af9dc"],["インフル5週連続増、学校等の休業1777施設に拡大　定点13.51人で北海道が最多","厚生労働省は11月27日、第47週（11月16〜22日）のインフルエンザ発生状況を発表した。全国の定点当たり報告数は13.51人で、前週の11.94人から増え5週連続の増加となった。都道府県別では北海道が34.59人で最も多い。保育所や小中高などで休校や学年・学級閉鎖をとった施設は計1777施設で、前週の1542施設から増えた。内訳は小学校が1224施設と最多。厚労省は手洗いや換気などを呼びかけている。","\n【概要】厚生労働省は11月27日、第47週（11月16日〜22日）のインフルエンザの発生状況を発表した。リセマムによると、全国の定点医療機関当たりの報告数は13.51人で、前週の11.94人から増加し、5週連続の増加となった。学校などで休業措置をとった施設も1777施設に広がっている。\n【背景】インフルエンザは例年、冬に向けて流行が本格化する。定点当たり報告数は、指定された医療機関1か所当たりの1週間の患者数を示す指標で、流行の広がりを見る目安とされる。子どもが集まる学校や園では感染が広がりやすく、流行期には休校や学年・学級閉鎖が相次ぐ。流行の状況は地域によって差があるため、住んでいる地域の情報もあわせて確認することが大切だ。\n【詳細】都道府県別では北海道が34.59人で最も多かった。全国の保育所、幼稚園、小学校、中学校、高校などでは、休校が35校、学年閉鎖が462校、学級閉鎖が1280校報告された。休業措置をとった施設は合計1777施設で、前週の1542施設から増加した。内訳は小学校が1224施設と最も多く、中学校292施設、高校149施設、幼稚園58施設、保育所27施設などとなっている。幼稚園や保育所でも休業措置がとられており、未就学児の間でも感染が広がっていることがうかがえる。一方、記事では、前年同期の51.12人と比べると低い水準であることも伝えている。\n【ポイント・注意点】前年同期より低い水準とはいえ、5週連続で増加しており、休業措置をとる施設も増え続けている。特に小学校での休業が全体の多くを占めていることから、小学生のいる家庭では体調管理に注意したい。厚労省は、外出後の手洗い、こまめな換気、十分な休養とバランスの取れた食事を呼びかけている。家族に感染者が出た場合は、タオルの共用を避けるなど家庭内での感染対策も意識したい。子どもに発熱などの症状が出た場合は無理に登校させず、早めに医療機関に相談することが大切だ。乳幼児や持病のある子どもは重症化することもあるため、いつもと様子が違うときは特に早めの受診を心がけたい。","2026-11-27","Yahoo!ニュース（リセマム）","https://news.yahoo.co.jp/articles/e14824b93c2304d1fe4cf7d48eb7d15610a1be02"],["横断歩道を渡っていた8歳男児が車にはねられ骨折　山梨市の信号機のない交差点","11月26日午後3時50分ごろ、山梨市の市道の十字路交差点で、横断歩道を渡っていた8歳の男子児童が左から来た乗用車にはねられた。テレビ山梨によると、男子児童は左足の骨を折る重傷。乗用車を運転していた44歳の女性にけがはなかった。現場は信号機のない交差点で、警察が事故の状況を詳しく調べている。子どもの下校時間帯に起きた事故で、横断歩道を渡る子どもの安全確保が改めて問われる。","\n【概要】11月26日午後3時50分ごろ、山梨市の市道の十字路交差点で、横断歩道を渡っていた8歳の男子児童が乗用車にはねられる事故があった。UTYテレビ山梨によると、男子児童は左足の骨を折る重傷を負った。乗用車を運転していた44歳の女性にけがはなかった。横断歩道を渡っていても事故に巻き込まれることがあるという現実を示す事故だ。\n【背景】現場は信号機のない交差点だった。信号機のない横断歩道では、歩行者が渡ろうとしているときに車が止まらなければならないと定められているが、ドライバーが歩行者に気付くのが遅れると事故につながる。子どもは体が小さく、車の運転席から見えにくいうえ、車の速度や距離を正しく判断することが大人より難しいとされる。また、子どもは何かに気を取られると、周囲への注意がおろそかになりやすい。\n【詳細】記事によると、男子児童は横断歩道を渡っていたところ、左から来た乗用車にはねられた。けがは左足の骨折で、重傷とされている。事故が起きたのは午後3時50分ごろで、子どもが下校する時間帯にあたり、通学路を歩く子どもが多い時間でもある。警察は、運転していた女性から話を聞くなどして、事故の詳しい状況を調べている。記事では、事故当時の車の速度や、児童が横断を始めたタイミングなどの詳しい経緯は明らかにされていない。\n【ポイント・注意点】横断歩道を渡っていても、事故に遭う危険はゼロではない。家庭では、横断歩道の手前で必ず立ち止まり、左右をよく見て車が止まったことを確かめてから渡るよう、具体的な場所で繰り返し教えておきたい。手を挙げて渡ろうとしていることをドライバーに伝えることも有効だ。通学路に信号機のない横断歩道がある場合は、親子で一緒に歩いて危ない場所を確認しておくとよい。一方、ドライバーは信号機のない横断歩道に近づいたら速度を落とし、歩行者がいれば必ず止まることが求められる。これからの季節は日没が早まり、夕方の時間帯は周囲が見えにくくなるため、明るい色の服や反射材を身に着けることも事故防止に役立つ。","2026-11-27","Yahoo!ニュース（UTYテレビ山梨）","https://news.yahoo.co.jp/articles/9f4377278018f8c9152cf8c4d91336ebf355779b"],["小2男児がレゴを誤飲、食道に詰まり全身麻酔で摘出　母親が明かす一部始終","小学2年生の男の子が就寝中にレゴのブロックを誤って飲み込み、食道に詰まる出来事があった。ENCOUNTによると、男児は痛みが悪化して唾も飲み込めない状態になり、救急外来でCT検査を受けたところ、医師から食道に穴が開く恐れがあると説明された。全身麻酔下で内視鏡により摘出し、食道の傷は軽く、その日のうちに回復して登校できたという。記事は、子どもの誤飲や窒息の事故は後を絶たないとして注意を呼びかけている。","\n【概要】小学2年生の男の子が、就寝中にレゴのブロックを誤って飲み込み、食道に異物が詰まる出来事があった。ENCOUNTが、11月18日午後9時過ぎにSNSに投稿した母親に話を聞き、経緯を伝えている。男児は全身麻酔下での内視鏡による摘出を受け、その日のうちに回復して登校できた。母親は当時の状況を振り返り、誤飲の怖さを伝えている。\n【背景】子どもの誤飲や窒息の事故は後を絶たない。記事は、誤飲の対象としておもちゃ、たばこ、薬、電池、プラスチック片などを挙げている。乳幼児だけでなく、小学生でも遊びの延長や寝ている間などに思わぬ形で物を飲み込んでしまうことがあり、今回のように小さなおもちゃの部品が原因になることもある。飲み込んだ物の大きさや形によっては、食道や気道をふさいだり、傷つけたりするおそれがある。\n【詳細】記事によると、男児はレゴを飲み込んだ後、痛みが次第に悪化し、唾も飲み込めない状態になった。家族は休日夜間診療所の案内を受けて総合病院の救急外来を受診し、CT検査で異物の位置を確認した。医師からは、そのままにしておくと食道を傷つけ、穴が開く恐れがあると説明を受けたという。全身麻酔をかけたうえで内視鏡を使って取り出し、病院到着から処置が終わるまでは約3時間、実際の摘出にかかった時間は1時間未満だった。食道の傷は軽く、経過観察のため入院したが、その日のうちに回復した。母親は「窒息していたかもしれない」と振り返っている。\n【ポイント・注意点】記事は、痛みや呼吸の異常があれば速やかに受診する必要があるとしている。小さな部品のあるおもちゃは、遊んだ後に片付ける習慣をつけ、寝る場所に持ち込まないようにしたい。きょうだいに小さな子どもがいる家庭では、上の子のおもちゃの部品を下の子が口に入れる危険にも注意が必要だ。また、子どもが急にのどや胸の痛みを訴えたり、唾や飲み物を飲み込みにくそうにしたりしているときは、誤飲の可能性も頭に入れておきたい。子どもが何かを飲み込んだ可能性があるときは、様子を見ずに医療機関や相談窓口に連絡することが大切だ。","2026-11-27","Yahoo!ニュース（ENCOUNT）","https://news.yahoo.co.jp/articles/8b11b988e15d3798b412e22887f6586e65002079"],["子どもの死亡検証CDR、情報収集で遺族の同意を不要に　こども家庭庁検討会が骨子案","虐待や不慮の事故など子どもの死亡事例を検証し、予防策につなげる「チャイルド・デス・レビュー（CDR）」の全国展開に向け、こども家庭庁の有識者検討会は11月27日、報告書の骨子案を示した。予防策のための情報収集が円滑に行われるよう、できる限り遺族の同意を不要とする制度設計が適当だとした。CDRは関係者の責任追及の制度ではないとも明記した。遺族の心情への配慮も必要とし、年度内にも取りまとめる。","\n【概要】こども家庭庁の有識者検討会は11月27日、子どもの死亡事例を検証して予防策につなげる「チャイルド・デス・レビュー（CDR）」の全国展開に向けた報告書の骨子案を示した。共同通信によると、予防策のための情報収集が円滑に行われるよう、できる限り遺族の同意を不要とする制度設計が適当だとした。\n【背景】CDRは、虐待や不慮の事故などで亡くなった子どもの事例について、関係機関が情報を持ち寄って検証し、同じような死を防ぐための対策につなげる仕組みだ。想定されている流れは、情報収集、多角的な検証、予防策の提言、対策の実施となっている。検証には医療や警察、行政などさまざまな機関の情報が必要になり、その集め方が制度づくりの課題となっていた。今回の骨子案は、こうした取り組みを全国に広げるための制度の方向性を示すものだ。\n【詳細】骨子案は、CDRが関係者の責任を追及するための制度ではないことを明記した。そのうえで、子どもの死亡事例はすべて検証の対象になり得るとしつつ、一定の考え方に基づいて一部の事例を抽出することも差し支えないとした。情報収集については、できる限り遺族の同意を不要とする方向を示す一方、遺族の心情への配慮も必要だとしている。同意が得られない事例では必要な情報が集まらず、検証が十分に行えないことも考えられ、情報収集の円滑化を重視した形だ。検討会は今後も議論を続け、年度内にも報告書を取りまとめる予定だ。\n【ポイント・注意点】子どもの死亡事例を一つひとつ丁寧に検証することは、事故や虐待の背景にある共通の要因を明らかにし、社会全体で予防策を講じるための土台となる。家庭での窒息や転落、水の事故、交通事故など、身近な場所で起きる事故の傾向を把握し、具体的な対策を示すことにもつながると期待される。一方で、大切な子どもを亡くした遺族の気持ちに寄り添った運用が欠かせない。責任追及ではなく予防のための仕組みであることを社会全体で共有できるかが、制度を定着させるうえでの鍵となりそうだ。今後の取りまとめの内容に注目したい。","2026-11-27","Yahoo!ニュース（共同通信）","https://news.yahoo.co.jp/articles/8680ab3be3eae155df620acea23784b14b7bf3bc"],["思春期のホルモン変動、少女の心の健康にどう影響　145人を5週間追跡　豪メルボルン大","思春期に大きく揺れ動く女性ホルモンが、少女の心の健康にどう関わるのかを調べた研究結果を、豪メルボルン大の研究者が紹介した。11〜17歳の少女145人から5週間、毎週唾液を採取し、脳のMRIや質問票と比べた。エストラジオールの変動が大きい子ほど不安や抑うつの症状がやや少なく、感情の調整も良好だった。一方、週ごとの変化では気分の落ち込みとの関連も見られた。著者は「ホルモンの浮き沈みは成長の一部」としている。","\n【概要】オーストラリアのメルボルン大学の研究者が、思春期のホルモンの変動と少女の脳や心の健康との関係を調べた研究を紹介した。研究成果は学術誌「Journal of Affective Disorders」に掲載された。11〜17歳の少女145人を5週間追跡し、ホルモンの揺れ幅と、不安や抑うつの症状、脳の構造との関連を分析した。\n【背景】思春期にはエストラジオールやプロゲステロンといった女性ホルモンが大きく変動し、気分の浮き沈みと結び付けて語られることが多い。また、思春期は不安や抑うつが現れやすい時期でもある。ただ、ホルモンの揺れそのものが心の健康にどう関係するのかは、十分に分かっていなかった。思春期の心の不調に早く気付いて支えることは、家庭や学校にとっても大切な課題となっている。\n【詳細】研究はPANDA研究の一部として行われ、メルボルンとその周辺地域に住む、ホルモン避妊薬を使っていない少女145人が参加した。参加者は5週間、週1回自宅で唾液を採取し、前の週の気分を評価した。最終週には脳のMRI検査を受け、不安や抑うつ、感情の調整に関する質問票に答えた。その結果、プロゲステロンの変動が大きいほど左視床がわずかに小さかったが、不安や抑うつの症状との関連はなかった。エストラジオールの変動が大きいほど不安や抑うつの症状がやや少なく、感情の調整も良好で、この傾向は初経前の少女で最も強かった。一方、週ごとに見ると、プロゲステロンの変化が大きい週は否定的な気分が強く、エストラジオールが下がると気分が上向きにくかった。\n【ポイント・注意点】著者は、今回の結果はホルモンの揺れが心の病気を防ぐことを示すものではないとしている。より長期で多様な集団を対象とした研究が必要だという。そのうえで、ホルモンの浮き沈みは成長の一部であり、必ずしも異常のサインではないと伝えている。家庭では、子どもの気分の波を頭ごなしに否定せず、話を聞く姿勢を大切にしたい。一方で、落ち込みが長く続いたり、日常生活に支障が出たりする場合は、専門家に相談することも考えたい。","2026-11-27","MedicalXpress","https://medicalxpress.com/news/2026-11-puberty-wild-hormone-teenage-girls.html"],["福井県が今季初のインフル注意報　10〜14歳が最多、対策は「換気と加湿をセットで」","福井県は11月26日、今シーズン初めてインフルエンザ注意報を発令した。今月22日までの1週間の感染者数は1医療機関当たり11.77人で、注意報の基準である10人を今シーズン初めて上回った。年代別では10〜14歳が最も多く、22日現在、福井市内の中学校1校で学級閉鎖となっている。札幌市立大学の齊藤雅也教授は、感染対策として換気に加えて加湿が重要だと指摘し、「換気ウィズ加湿」をセットで行うよう勧めている。","\n【概要】福井県は11月26日、今シーズン初めてとなるインフルエンザ注意報を発令した。FBC福井放送によると、今月22日までの直近1週間の感染者数は1医療機関当たり11.77人となり、今シーズン初めて注意報の基準である10人を上回った。年代別では10歳から14歳が最も多くなっている。\n【背景】インフルエンザは空気が乾燥し、気温が下がる冬に流行しやすい。1医療機関当たりの感染者数は流行の広がりを示す目安で、一定の基準を超えると注意報や警報が出される。学校に通う年代で感染が広がると、家庭に持ち帰られて家族へ広がることもあるため、流行の初期段階での対策が重要になる。今シーズン初めて基準を超えたことから、今後の推移に注意が必要だ。\n【詳細】記事によると、22日現在、福井市内の中学校1校で学級閉鎖となっている。感染対策について、札幌市立大学デザイン学部の齊藤雅也教授は、換気に加えて加湿が重要だと指摘し、「換気ウィズ加湿でセットでするのがポイント」と話している。冬は冷たい窓で結露が起きると室内の湿度が下がってしまうため、記事では、カーテンをマジックテープで留める、毛布をカーテンの下にかけるといった、窓からの冷気を抑える工夫が紹介されている。窓辺の冷気を抑えて結露を防ぎ、室内の湿度を保ちやすくするための工夫だ。\n【ポイント・注意点】今回の注意報は、10〜14歳という学校に通う年代を中心に感染が広がっていることを示している。換気は室内のウイルスを減らすうえで大切だが、窓を開けると湿度が下がりやすいため、加湿器の活用など湿度を保つ工夫を組み合わせたい。家庭でも、外出後の手洗いや十分な睡眠を心がけ、体調を整えておくことが予防の基本となる。子どもに発熱やせきなどの症状が出た場合は、無理に登校させず、早めにかかりつけ医に相談するようにしたい。受験を控えた中学生や高校生のいる家庭では、特に体調管理に気を配りたい時期だ。流行の状況は県などから随時公表されるため、こまめに確認しておくと安心だ。注意報の発令をきっかけに、家族で感染対策を見直しておきたい。","2026-11-26","Yahoo!ニュース（FBC 福井放送）","https://news.yahoo.co.jp/articles/c3e360cbbc46ca8c403999a2e21b8438bc214a44"],["愛知県のインフル患者1955人、微増続く　14歳以下中心に学年閉鎖7校・学級閉鎖59校","愛知県感染症情報センターによると、11月16〜22日のインフルエンザの定点当たり報告数は11.99人、患者数は1955人で、前週の1886人の1.04倍と微増が続いている。名古屋市保健所の523人をはじめ、衣浦東部、一宮市、岡崎市の各保健所で患者が多い。14歳以下の子どもを中心に感染が目立ち、学校では学年閉鎖7校、学級閉鎖59校が発生した。ウイルスはA型が多く、県は手洗いやマスク着用などを呼びかけている。","\n【概要】愛知県感染症情報センターの発表によると、11月16日〜22日のインフルエンザの定点当たり報告数は11.99人、患者数は1955人だった。中京テレビNEWSによると、前週の1886人と比べて1.04倍で、微増の傾向が続いている。14歳以下の子どもを中心とした感染が目立ち、学校では学年閉鎖が7校、学級閉鎖が59校で発生した。\n【背景】愛知県では9月28日にインフルエンザの注意報が発令されており、それから約2か月がたった。流行が長く続いていることになり、冬本番を前に患者数の動向が注目されている。学校で感染が広がると学年や学級の閉鎖が必要になり、子どもの学習や家庭の生活にも影響が出る。保護者が仕事を休んで子どもの看病をしなければならない場面も増える。\n【詳細】地域別では、名古屋市保健所管内が523人で最も多く、次いで衣浦東部保健所が205人、一宮市保健所が131人、岡崎市保健所が127人などとなっている。名古屋市を中心に、県内の広い地域で患者が報告されていることが分かる。年齢別では、14歳以下の子どもを中心に感染が目立っている。定点医療機関のコメントによると、流行しているウイルスはA型が多いという。患者数は急増ではなく微増の状態が続いており、県は手洗いやマスクの着用など、予防対策の徹底を呼びかけている。\n【ポイント・注意点】注意報の発令から約2か月がたっても患者数の増加が続いており、引き続き警戒が必要だ。特に子どもの間で感染が広がっているため、家庭では帰宅後の手洗いやうがいを習慣にし、規則正しい生活で体調を整えたい。せきやくしゃみが出るときはマスクを着用し、周囲への感染を防ぐことも大切だ。子どもに急な発熱や体のだるさ、のどの痛みなどが見られた場合は、早めに医療機関に相談したい。家族の誰かが感染した場合は、部屋をこまめに換気するなど、家庭内での感染拡大にも気を配りたい。地域の流行状況を確認しながら、早め早めの対策を心がけたい。年末年始に向けて人が集まる機会も増えるため、体調がすぐれないときは無理をしないことが大切だ。高齢の家族と過ごす予定がある場合は、特に注意したい。","2026-11-26","Yahoo!ニュース（中京テレビNEWS）","https://news.yahoo.co.jp/articles/2340f1371a2520580b0fcd4db73447493c5c1ea7"],["子どもの発熱は「何度か」より「何日続くか」　4日以上なら受診を、小児科医が解説","子どもの発熱で大切なのは「熱が何度か」より「何日続いているか」だと、小児科医の平原慎之介さんが解説している。プレジデントオンラインの記事によると、風邪による発熱は多くの場合3〜4日で自然に下がる。4日以上続く、ぐったりしている、おしっこが少ないといったときは受診してほしいという。長引く熱の原因として川崎病なども挙げられる。生後3カ月未満の38℃以上の発熱は、元気そうでも速やかな受診が必要だ。","\n【概要】子どもが熱を出したとき、保護者はつい体温の高さに目が行きがちだが、小児科医の平原慎之介さんは「熱は何度かより、何日続いているかが大事」だと話す。プレジデントオンラインが、書籍『子どもの病気と発達　これだけは知っておきたいこと』（日本実業出版社）の一部を再編集して伝えている。記事は、熱が長引くときに注意したい病気についても触れている。\n【背景】子どもは大人に比べて熱を出す機会が多く、多くは風邪によるものだ。記事によると、風邪による発熱は多くの場合、3〜4日で自然に下がる。そのため、熱が出てすぐに慌てるよりも、熱が続く日数や子どもの全身の様子を見ることが大切になる。一方で、熱が長引く場合には、風邪以外の病気が隠れている可能性もある。保護者にとっては、どのタイミングで受診すべきかの判断が悩みどころになる。\n【詳細】記事では、熱が4日以上続く、ぐったりしている、おしっこが少ないといったときは、病院で受診してほしいという趣旨が紹介されている。熱が長引くときに小児科医が考える原因としては、典型的でないパターンのウイルス感染、細菌感染、川崎病、炎症が続くそのほかのまれな病気が挙げられている。記事のタイトルにもあるように、心臓に後遺症が残りうる病気もあり、長引く発熱を見逃さないことが重要になる。また、生後3カ月未満の赤ちゃんの38℃以上の発熱は、元気そうに見えても速やかな受診が必要だとしている。\n【ポイント・注意点】発熱したときは、体温の数字だけでなく、熱が何日続いているか、子どもがぐったりしていないか、おしっこの量が減っていないかを確認したい。熱が出た日や時間、体温の変化をメモしておくと、受診の際に医師に状況を伝えやすい。月齢の低い赤ちゃんは特に注意が必要で、生後3カ月未満で38℃以上の熱があるときは、様子を見ずに医療機関に相談することが大切だ。熱が長く続くときは「いつもの風邪」と思い込まず、医師に相談したい。熱が下がった後も、子どもの元気や食欲が戻っているかを見守ることが大切だ。","2026-11-26","Yahoo!ニュース（プレジデントオンライン）","https://news.yahoo.co.jp/articles/44ee425ed07bd8918b6ad5fb5dbdf792f6de36d8"],["高層マンションの窓の外を歩く6歳と7歳　マレーシアで保護者をネグレクト疑いで捜査","マレーシアのセランゴール州スバンジャヤで11月13日、高層マンションの窓の外の狭いコンクリートの台を、6歳と7歳の子ども2人が裸足で歩く映像がSNSに投稿された。柵はなく、2人にけがはなかった。警察は保護者不在のまま留守番をしていたとみて、児童法に基づき捜査している。NEWSポストセブンの記事は、今年東京の北区と新宿区のマンションで幼い男の子が転落死した事故にも触れ、子どもだけの留守番の危険を伝えている。","\n【概要】マレーシアの首都クアラルンプール近郊、セランゴール州スバンジャヤの高層マンションで、6歳と7歳の子ども2人が窓の外を歩く映像がSNSに投稿され、波紋が広がっている。NEWSポストセブンによると、警察は保護者が不在の家で子どもだけで留守番をしていたとみて、保護者をネグレクトの疑いで捜査している。子どもだけで留守番をさせることの危うさを示す出来事として、日本でも関心を集めそうだ。\n【背景】マンションの窓やベランダからの子どもの転落事故は、日本でも繰り返し起きている。記事によると、今年9月15日には東京・北区のマンション11階から5歳の男の子が転落して死亡した。母親が荷物を運ぶ間の約20分、男の子は1人で部屋にいたとされる。今年の元日には東京・新宿区のマンション9階から3歳の男の子が転落して死亡しており、両親が寝たのを確認して初詣に出かけていたと伝えられている。\n【詳細】マレーシアの映像は11月13日午後4時26分ごろのもので、2人は裸足で、窓の外の狭いコンクリートの台の上を歩いていた。台に柵はなかったが、2人にけがはなかった。マンションの管理側は16日に警察に通報し、警察は児童法第31条第1項に基づいて捜査している。管理側は、すべての住戸の窓に、開く幅を制限する安全装置を設置したという。映像がSNSで拡散したことをきっかけに、保護者の対応が問われる事態となった。\n【ポイント・注意点】子どもは好奇心が強く、大人が想像しない行動をとることがある。短い時間であっても、幼い子どもだけを家に残すことには危険が伴う。高い階に住む家庭では、窓に開く幅を制限する補助錠を付ける、窓やベランダの近くに踏み台になる家具や物を置かないといった対策を取りたい。子どもに窓やベランダの危険性を繰り返し伝えることも大切だ。子どもだけで家にいる時間が生じる場合は、事前に窓を施錠し、開けてはいけない場所を約束しておきたい。マンションの管理側による安全装置の設置のように、住まい全体で事故を防ぐ仕組みを整えることも有効だ。少しの間だけ目を離すつもりでも、その間に事故が起きることがあると心に留めておきたい。","2026-11-26","Yahoo!ニュース（NEWSポストセブン）","https://news.yahoo.co.jp/articles/dc2c3dadf7360237785a9fae3db7f1b9ab9e27dc"],["子ども時代の食事の質、思春期の代謝リスクと関連　欧州6出生コホートの1663組を解析","妊娠中と子ども時代の食事が、思春期の代謝の健康にどう関わるかを調べた研究が「Clinical Nutrition」に掲載された。欧州6カ国の出生コホートに参加した母子1663組を分析した結果、子ども時代の食事の質が高いほど、思春期の代謝症候群スコアが低かった。一方、母親の妊娠中の食事と子どもの代謝症候群スコアとの関連は統計的に有意ではなかった。子どもと思春期の約3分の1が過体重または肥満だった。","\n【概要】ノルウェー公衆衛生研究所などの研究チームが、妊娠中と子ども時代のどちらの食事が、思春期の代謝の健康にとって重要かを調べた研究を学術誌「Clinical Nutrition」に発表した。News-Medicalによると、子ども時代の食事の質が高いほど、思春期の代謝症候群スコアが低いという関連が見られた。研究には、スペインのISGlobalや英国のブラッドフォード保健研究所など、7カ国の研究機関が参加した。\n【背景】研究は、フランス、ギリシャ、リトアニア、ノルウェー、スペイン、英国の6つの出生コホートからなる「HELIX」のデータを用いた。母子1663組が対象で、そのうち864人は思春期の追跡調査を受けた。平均年齢は母親が31歳、子どもが8歳、思春期の追跡時が15歳だった。食事は、妊娠中、子ども時代（5〜12歳）、思春期（12〜18歳）に食物摂取頻度質問票で調べ、健康的で持続可能な食事の指数（HSEI、0〜100点）で評価した。\n【詳細】HSEIの平均点は、母親が62.8点、子どもが58.0点、思春期が55.2点だった。子ども時代の食事の質が高いほど、思春期の代謝症候群スコアが低かった。このスコアはリスクを連続的に示す指標で、診断ではない。母親の食事は、子どもの代謝症候群スコアと逆向きの関連を示したが、統計的に有意ではなかった。母親のHSEIが高いほど思春期の拡張期血圧が低かったが、慎重な解釈が必要とされている。子どもと思春期の約3分の1が過体重または肥満だった。子ども時代からの肥満対策の重要性もうかがえる。\n【ポイント・注意点】子ども時代と思春期の質問票は妥当性が検証されておらず、多重比較の調整も行われていないなど限界がある。それでも研究者らは、学校での栄養政策や家庭への支援が、思春期の代謝の健康を支える可能性があるとしている。子ども時代の食習慣は、思春期になってからの健康にもつながる可能性がある。野菜や果物を取り入れたバランスの良い食事を、家族で一緒に楽しむことから始めたい。なお、今回の研究は観察研究であり、食事が直接の原因であるとまでは言えない点にも留意が必要だ。","2026-11-26","News-Medical","https://www.news-medical.net/news/20261126/Pregnancy-or-childhood-When-does-diet-matter-most-for-later-metabolic-health.aspx"],["はしかが世界で再流行、2025年の報告は41万件超　子どものワクチン接種漏れが要因か","はしか（麻しん）と風しんの世界的な分子監視の状況をまとめたレビューが学術誌「Vaccines」に掲載された。2025年に報告されたはしかの患者は41万1913人で、新型コロナ流行前と同程度の水準に戻った。報告数は実際の約5%にすぎないと推定される。著者らは、子どものワクチン接種の見逃しによる免疫の空白が再流行を招いた可能性が高いとし、高い接種率の維持を強調している。","\n【概要】英国健康安全保障庁（UKHSA）や世界保健機関（WHO）などの研究者が、2000年から2025年までの、はしかと風しんの世界的な分子監視の状況をまとめたレビューを学術誌「Vaccines」に発表した。News-Medicalによると、2025年に報告されたはしかの患者は41万1913人で、流行前と同程度の水準に戻っている。\n【背景】はしかは感染力が非常に強いウイルス感染症で、ワクチンで予防できる。肺炎や脳炎などの合併症を起こすことがあり、特に乳幼児では重症化に注意が必要とされる。しかし、新型コロナの流行期には各国で定期予防接種が滞った。著者らは「子どもの予防接種の見逃しと、それによる免疫の空白が再流行を招いた可能性が高い」と指摘している。報告された患者数は実際の約5%にすぎないと推定されており、実態はさらに大きい可能性がある。\n【詳細】レビューによると、ウイルスの遺伝子型は歴史的に24種類あったが、2021年以降に報告されているのはB3とD8の2種類だけだった。遺伝的な多様性は縮小しているにもかかわらず、流行は再び広がっている。欧州地域では2024年に15万人を超える患者が出たが、2025年には75%減少しており、地域によって流行の状況は大きく変化している。風しんの監視はさらに弱く、2025年までの10年間で報告された風しんの患者は約24万7000人で、はしかの350万人超と比べて少なかった。2022年以降に記録された風しんの遺伝子配列は59件で、2025年は6件にとどまった。著者らは、配列データだけでは感染経路を確実に再現できないとしている。\n【ポイント・注意点】著者らは、高いワクチン接種率を維持することが重要だと強調している。海外での流行は、渡航者を通じて国内に持ち込まれるおそれもある。子どもの定期接種の時期を母子健康手帳などで確認し、受け忘れがあれば早めにかかりつけ医に相談したい。家族で海外へ出かける予定がある場合は、出発前に接種歴を確かめておくと安心だ。監視体制の強化とあわせ、一人ひとりが予防接種を受けることが流行を防ぐ基本となる。","2026-11-26","News-Medical","https://www.news-medical.net/news/20261126/Measles-resurges-worldwide-despite-shrinking-viral-genetic-diversity.aspx"],["不慮の中毒、2023年に世界で約7万人が死亡　1歳未満の乳児で健康被害が最大","一酸化炭素や農薬などによる不慮の中毒について、世界204の国と地域の1990〜2023年の状況を分析した研究が「The Lancet Public Health」に掲載された。2023年には約254万件の中毒が起き、約7万人が死亡した。年齢調整した健康損失の割合は1990年より47.5%低下したが、地域による差が大きい。年齢別では1歳未満の乳児で健康被害の割合が最も高かった。研究者らは一酸化炭素警報器の設置や中毒相談体制の強化を求めている。","\n【概要】世界の疾病負担研究（GBD）の一環として、一酸化炭素中毒と、主に農薬などによる不慮の中毒の状況を分析した研究が「The Lancet Public Health」に掲載された。News-Medicalによると、2023年には世界で約254万件の中毒が起き、約7万人が死亡し、健康損失を示すDALYは368万に上った。\n【背景】研究は、75カ国の651人の研究者が参加し、204の国と地域を対象に1990年から2023年までの変化を調べた。中毒は家庭の暖房器具や身近な化学物質によって起き、防ぐことのできる事故とされる。なお、医薬品やアルコール、違法薬物による中毒は、分析の対象からほぼ除かれている。乳幼児は身の回りの物を口に入れたり、危険を判断したりすることが難しいため、家庭内での事故に特に注意が必要だ。\n【詳細】2023年の年齢調整したDALYの割合は、1990年と比べて47.5%低く、死亡率は約45%、発生率は約37%低下した。一酸化炭素による死亡は約3万1000人と推定された。農薬などその他の原因による死亡は約3万9000人で、年齢調整したDALYの割合は、サハラ以南アフリカで人口10万人当たり約90だったのに対し、高所得地域では13と大きな差があった。年齢別では、1歳未満の乳児で、両方の原因を合わせたDALYの割合が最も高かった。また、中毒相談センターを利用できるのはWHO加盟国の半数に満たないという。\n【ポイント・注意点】研究者らは、一酸化炭素警報器の設置、より安全な暖房、農薬の禁止、中毒相談体制の強化を求めている。乳児の被害が大きいことから、家庭では暖房器具を使う際の換気を徹底し、農薬や化学製品を子どもの手の届かない場所に保管したい。冬は暖房の使用が増えるため、一酸化炭素中毒への注意が一層必要となる。一酸化炭素は色もにおいもないため、気付かないうちに中毒になるおそれがある。暖房器具を定期的に点検し、異常を感じたらすぐに使用をやめて換気したい。子どもが何かを口にした可能性があるときは、慌てずに中毒の相談窓口や医療機関に連絡することが大切だ。","2026-11-26","News-Medical","https://www.news-medical.net/news/20261126/Why-surviving-accidental-poisoning-may-depend-on-where-you-live.aspx"],["子どもの腹痛、最多は便秘だが「様子見終了」のサインも　小児科医が5つの目安を解説","子どもの腹痛で最も多い原因は便秘だが、見逃してはいけない病気もあると、小児科専門医の平原慎之介さんが解説している。プレジデントオンラインによると、痛みが強く悪化している、痛い場所がは
