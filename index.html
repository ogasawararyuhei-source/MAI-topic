く、引き継ぎ文が台帳にあり、コミットしていない変更がない、という4条件がそろうと「閉じてよい」と表示される。使用枠は週の枠と5時間枠の割合、日ごとの使用量、100%に届く見込みを出す。【ポイント・注意点】コンテキストが50万トークンを超えたあたりで引き継ぎ文を書かせ、新しいタブで続けるため、1日にのべ数十回の開け閉めになるという。会話記録は標準設定では30日で消えるが、設定で延ばせる。要約はHaikuによるため似た1行が並ぶことがあり、その場合はVSCodeを開いて確かめる。許可や拒否はダッシュボードからはできず、スマホなど別の端末からの利用はセキュリティの課題から見送ったとしている。","2026-11-24","Zenn","https://zenn.dev/nexta_/articles/a3ff76a9f98f1c"],["Claude Codeで出荷する実践ガイドの要約、PR後の後始末を/shipに","NaokiIshimura氏はQiitaで、claude.devブログに11月24日に載った「A practical guide to shipping with Claude Code」を日本語で要約した。push前の/code-review、PR作成から最大7日間の見張りまでを行う/ship、既存のPRを見張る/stewardの使い方を整理し、自分のマシンで動くことによる注意点もまとめている。","\n【概要】NaokiIshimura氏がQiitaで、claude.devブログに2026年11月24日に公開された記事「A practical guide to shipping with Claude Code」（著者Addy Osmani氏）の要約を公開した。PRを開いた後のCIの失敗、レビューの指摘、マージの衝突といった細かな「後始末」をClaudeに任せる方法の解説である。【背景】Claude Shipは、一般提供のCode Reviewと、ベータ版のPR StewardとClaude Approvalsで構成される。ガイドは、PRを出した後の作業をClaude Codeでどう回すかを具体的に示している。【詳細】まずpushの前に/code-reviewを実行する。度合いはlowからmaxまで選べ、--fixで指摘を適用し、--commentでPRにコメントを書き込める。PRを開くときは/shipを使う。未コミットの変更をまとめてコミットし、push、PR作成、/code-review、妥当な指摘の修正を行ったうえで、最大7日間PRを見守り、マージかクローズで終わる。既存のPRには、/steward 41のように見守りの部分だけを動かせる。繰り返し出る指摘はCLAUDE.mdやREVIEW.md、スキルに書き残す例が示されるが、ローカルの/code-reviewはREVIEW.mdを読まない点に注意が必要だ。Claude Approvalsは.claude/approvals.ymlに方針を書き、mode: observeのような設定から始める。1つの問題へのpushは最大3回で、超えると作者に知らせる。【ポイント・注意点】見守りは自分のマシンと自分の利用枠で動き、ノートPCを閉じると止まる。Windowsでは見守りが始まらない。見守りはベースブランチを取り込んでテストを走らせるため、ベースブランチに変更を入れられる人は、自分のマシンでコマンドを実行できることになる。自動マージと組み合わせると見守りの修正がマージの決め手になりうるうえ、見守り中のコミットにはgitのフックが効かない。AIはバグやセキュリティの問題を見逃すことがあるので、既存のテストやスキャナー、人のレビュアーは残すべきだとしている。","2026-11-24","Qiita","https://qiita.com/NaokiIshimura/items/6411b5861f40fe54694e"],["Anthropic、コードの確認・修正・承認をAIに任せるClaude Shipを発表","TechCrunchによると、Anthropicはコードのレビュー、修正、定型的な変更の承認をAIエージェントで自動化する「Claude Ship」を発表した。一般提供のCode Review、ベータ版のPR StewardとClaude Approvalsの3つからなり、チームが書いた方針に沿って変更を自動で承認できる。GitHubのリポジトリを対象に、TeamとEnterpriseのプランへ順次提供される。","\n【概要】TechCrunchは2026年11月23日、Anthropicがコードのレビュー、修正、定型的な変更の承認を自動化するAIエージェント群「Claude Ship」を発表したと報じた。記事は、Claudeにコードを書かせる段階から、そのコードをいつ出荷してよいかを判断する段階へAnthropicが踏み込んだと位置付けている。【背景】AIのコーディングエージェントが大量のコードを生み出せるようになり、リリース前のレビューと承認が詰まりやすくなった。AIのコーディング道具にはすでにレビュー機能があったが、記事が注目するのは、開発チームが決めた方針の下で変更を自動承認するエージェントが含まれる点で、これは承認の権限をAIに委ねることにあたる。同社のブログからは、多くのチームは変更ごとに人の承認を求めており、人がすべての行を書いていた頃はそれで回ったが、Claude Codeチームでは大半のコードをClaudeが書くため、PR以降の作業も同じ速さで進めたかった、という趣旨の説明が引かれている。【詳細】Claude Shipは3つの部品からなる。Code Reviewはすでに一般提供されており、変更案をレビューして問題を見つける。ベータ版のPR Stewardは、失敗したCIのチェック、マージの衝突、Code Reviewからの指摘に対応し、pushのたびに何を変えたか、必要ならどう戻すかをコメントする。同じくベータ版のClaude Approvalsは、チームがリポジトリ内のファイルとして書いた承認方針を適用する。方針は自然な言葉で書け、Code Reviewの結果や企業独自の分類器も使えるという。【ポイント・注意点】製品がまだベータ版のため、Anthropicは承認の機能をまず観察だけのモードで動かすよう勧めている。1つのリポジトリから始め、月ごとの支出上限も設定できる。どこでClaude Shipを動かすか、Quick、Standard、Deepなどのどのレビュー設定を使うか、どの変更を人に回すかはチームが決められるという。提供先はGitHubのリポジトリを使うClaudeのTeamとEnterpriseのプランだ。料金の具体的な数字や、方針ファイルの書式の詳細は記事には書かれていない。","2026-11-23","TechCrunch","https://techcrunch.com/2026/11/23/anthropic-launches-claude-ship-letting-ai-agents-review-fix-and-approve-code-changes/"],["週刊まとめ、Claude Code v2.1.328で自動モードが外部の基盤にも","DEV Communityの週刊まとめ（11月22日週）は、Claude Code v2.1.326〜v2.1.330とCodex、Gemini CLIの変更点を整理した。最大の変更はv2.1.328で、Amazon BedrockやMicrosoft Foundryなど外部の基盤でも自動モードが使え、権限モードを決めていない対話セッションは自動モードで始まる。標準入力からMCPサーバーを登録するコマンドも加わった。","\n【概要】aicoding-guideがDEV Communityに載せた週刊まとめ「This week in Claude Code, Codex and Gemini CLI」の11月22日週版は、3つのコーディングCLIの変更点を整理している。最大の変更として挙げるのは、Claude Code v2.1.328で自動モードがAmazon Bedrock、Google CloudのAgent Platform、Microsoft Foundry、Claudeアプリのゲートウェイでも使えるようになった点だ。【背景】自動モードは、利用者に毎回尋ねる代わりに別の分類モデルが操作を確かめる方式と説明されている。v2.1.328以降、権限モードを指定していない対話セッションは自動モードで始まるため、外部の基盤を使う利用者は、設定を変えなくても確認の表示が減ることになると筆者は注意を促す。この週のリリースはClaude Codeが5回（v2.1.326〜v2.1.330）、Codexが3回、Gemini CLIが2回だった。【詳細】Claude Codeでは、v2.1.328で自動の要約が/compactと同じようにシステムプロンプトを組み直すよう直された。mcp_toolフックには失敗時に止める設定が加わった。v2.1.327では、サーバーのJSONを標準入力から読むclaude mcp add-jsonが追加され、トークンをコマンド行に残さずに済む。プロジェクト単位のclaude mcp addやremoveが.mcp.jsonの他のキーを消す問題も直った。v2.1.326は権限の確認の不具合を2つ直し、v2.1.329とv2.1.330では設定ファイルの消失、ワークツリーの削除、長い会話を要約した後に最大数分固まる問題が直された。v2.1.330には組み込みのグラフ表示の追加機能も入り、自動のグラフは/configで切れる。【ポイント・注意点】筆者は、外部の基盤で確認を続けたいならpermissions.defaultModeを明示し、.mcp.jsonでキーが消えていないか確かめ、MCPのトークンはadd-jsonに移すよう勧めている。記事は第三者による二次的なまとめなので、細部は公式の変更履歴で確認したい。","2026-11-21","DEV Community","https://dev.to/aicoding-guide/this-week-in-claude-code-codex-and-gemini-cli-week-of-november-22-2026-1ofi"]],"cnc":[["アマダと日立、AIエージェントで顧客工場の自律化へ PoCを実施","アマダと日立製作所は2026年11月26日、AIエージェントとフィジカルAIの実装により、アマダの顧客工場の自律化と保守サービスの高度化に向けた協創を加速すると発表した。第1弾としてAIエージェントの概念実証（PoC）を行い、生産計画の調整支援やマシントラブルの原因候補の提示、事例のない複雑な保守案件での原因推論を検証した。今後はモデルユーザーの製造現場に適用し、早期の実用化・サービス化をめざすとしている。","\n【概要】アマダと日立製作所は、AIエージェントとフィジカルAIの実装を通じて、アマダの顧客工場の自律化と、アマダの保守サービスの高度化に向けた協創を加速すると発表した。取り組みの第1弾として、AIエージェントを活用した概念実証（PoC）を工場運営と保守サービスの2つの分野で実施し、その結果を公表した。\n【背景】アマダは2026年に創業80周年を迎えた加工機メーカーで、IoTソリューション「V-factory」に接続されたマシンは世界で1万台を超えるとされる。2026年11月には次世代工場「MIRAI factory」を、アマダ・グローバルイノベーションセンター（AGIC）内の特別エリアとして公開した。日立は190か国・地域に広がる現場の知見に基づく制御・運用技術（OT）を持ち、AIソリューション群「HMAX Industry」を展開している。両社は2019年4月にもIoTを活用した協創を発表している。\n【詳細】工場運営のPoCでは、マシンやソフトウエアの効率的な活用方法の提案、突発的な納期変更に応じた生産計画の調整支援、マシントラブルが起きた際の原因候補・確認手順・対処方法の提示を検証した。保守サービスのPoCでは、過去に事例がない複雑な案件でも、蓄積された知識をもとに原因を推論し、復旧策を示せることを確認したという。今後はAIエージェントをモデルユーザーの製造現場に適用し、早期の実用化・サービス化をめざす。あわせて、生産計画などを分析・判断し、フィジカルAIが生産設備やロボットを制御する仕組みの構築にも取り組む。日立は統合オントロジーや現場作業の画像解析技術などをHMAX Industryのラインアップとして実用化し、幅広い製造業向けに展開するとしている。\n【ポイント・注意点】今回示されたのはPoCの結果と今後の方針で、サービスの提供時期や価格は明らかにされていない。PoCで確かめた効果についても、具体的な数値は公表されていない。加工機メーカーとIT企業が組み、生産計画の見直しやトラブル対応、保守の知識をAIエージェントに担わせる構想であり、実際の製造現場でどこまで判断を任せられるかは、モデルユーザーへの適用を通じて見極めることになる。","2026-11-26","PR TIMES（日立製作所）","https://prtimes.jp/main/html/rd/p/000000084.000141666.html"],["ヤマザキマザック、MAZATROL DXにAIエージェント 来年4月提供","工作機械メーカーのヤマザキマザックは、製造現場のDX化を支援するソフトウエアサービス「MAZATROL DX」にAIエージェントを搭載し、来年4月から提供を始めると発表した。AIが切削条件を提案するほか、加工シミュレーションで干渉などが起きた際には原因を突き止めて改善案を示す。岐阜県美濃加茂市の美濃加茂製作所で11月25日から27日まで開いている自社展示会で紹介しており、3日間で約3千人の来場を予定している。","\n【概要】工作機械メーカーのヤマザキマザック（本社・愛知県大口町）は、製造現場のDX化を支援するソフトウエアサービス「MAZATROL DX（マザトロールDX）」に人工知能（AI）エージェントを搭載し、来年4月から提供を始めると発表した。中部経済新聞が2026年11月26日付で報じた。AIは切削条件の提案や、加工シミュレーションで起きた問題の原因の特定を担う。\n【背景】工作機械による切削加工では、加工する材料や使う工具に合わせて切削条件を決める作業と、加工プログラムを実機で動かす前にシミュレーションで確かめる作業が欠かせない。どちらも結果の良し悪しを左右する工程であり、とくにシミュレーションで干渉などの問題が見つかった場合には、原因を探して手直しする手間がかかる。今回の発表は、こうした加工準備の作業をAIエージェントで支える取り組みにあたる。\n【詳細】記事によると、MAZATROL DXに搭載するAIエージェントは、切削条件を提案する。また、加工シミュレーションの際に干渉などが発生すると、その原因を突き止め、改善案を示すという。同社はこの機能を、岐阜県美濃加茂市の美濃加茂製作所で11月25日から27日まで開催している自社展示会で紹介している。写真の説明によれば、25日に始まったこのプライベートショーには、3日間で約3千人の来場を予定している。AIエージェントの提供開始は来年4月を予定しているという。記事の見出しは、この機能を「DX化支援ソフトにAI機能」と表し、来春の提供と自社展示会での紹介をあわせて伝えている。\n【ポイント・注意点】AIエージェントの役割として示されたのは、切削条件の提案と、干渉の原因特定および改善案の提示という、加工の準備段階に向けた機能である。記事の本文は有料会員向けで、確認できたのは冒頭の一部にとどまる。そのため、料金体系や対応する機種、AIエージェントの仕組みや操作方法といった詳しい内容は、今回の出典からは分からない。提供開始が近づいた段階で、同社からの正式な案内を確認したい。","2026-11-26","中部経済新聞","https://www.chukei-news.co.jp/news/2026/11/26/OK0002611260301_01/"],["工作機械はフィジカルAIデータの「マザーマシン」に 連載下編","日刊工業新聞社のニュースイッチは2026年11月26日、連載「ロボと環境の情報統合　工作機械が突破口」の下編を掲載した。フィジカルAIの実装ではロボット自身のカメラだけでは死角が多く、環境側のセンサーとの統合が重要だと指摘。稼働台数が多くデータを集めやすい工作機械へのワーク供給を適用先に挙げ、ガウシアン・スプラッティングや触覚の活用をめぐる研究者の見方を紹介している。","\n【概要】日刊工業新聞社のニュースイッチは、連載「ロボと環境の情報統合　工作機械が突破口」の下編として、「工作機械はフィジカルAIデータのマザーマシンになるポテンシャルを秘めている」を掲載した。初出は日刊工業新聞2026年10月28日で、編集委員の小寺貴之氏が担当している。ロボットに物理的な作業をさせるフィジカルAIのデータ集めに、工作機械が向いている理由を論じた。\n【背景】フィジカルAIの実装では、ロボット自身のカメラだけでは死角が多い。そのため、環境側に置いたセンサーとの情報の統合が重要になるという。ただしカメラの最適な配置は作業ごとに変わり、基盤モデルの構築に必要なデータ収集の制約になっていると記事は指摘する。\n【詳細】記事は、工作機械は稼働数が多くデータを確保しやすいとし、工作機械へのワーク供給をフィジカルAIの適用先として挙げる。機内にカメラを置くことは、トレーサビリティーの観点からも有効だとする。AIロボット協会（AIRoA）の大川武彦リサーチサイエンティストは「視覚に依存しない学習が重要」と指摘した。九州工業大学の田向権教授は、画像から3Dモデルを作るガウシアン・スプラッティング（GS）の応用を提案し、「GSはとにかく（処理が）軽い」と説明した。NEDOの横井一仁ユニット長は、人間が死角を触覚で補うことを例に、触覚があればハンドカメラは要らないとの考えを示した。中国のデータ工場では触覚ハンドや触覚グローブでデータを集めているといい、横井氏は「触覚は主戦場になるだろう」と述べた。\n【ポイント・注意点】記者のコメントでは、マシンテンディングで技術を試す案や、力覚センサー付き協働ロボットの普及に触れている。記事は、ロボット側の視覚だけに頼らず、環境に置いたセンサーや触覚など複数の情報源を組み合わせる方向を、複数の研究者の見方から描いている。工作機械の周りは、AI用のデータを集める場としても見直されつつあるといえる。なお、この記事の初出は10月28日の紙面で、ニュースイッチへの掲載が11月26日である点に注意したい。","2026-11-26","ニュースイッチ（日刊工業新聞社）","https://newswitch.jp/p/50908"],["xTool、Amazonブラックフライデーでレーザー加工機を最大43%引き","Makeblock Japanのブランド「xTool」は2026年11月26日、Amazon.co.jpの「Amazonブラックフライデー」に合わせ、レーザー加工機などを特別価格で販売すると発表した。対象はxTool M2、F2、WonderPress、F2 Ultra UV、F2 Ultraで、最大161,740円引き、最大43％引き。先行セールは11月27日から29日、本セールは11月30日から12月7日まで。","\n【概要】Makeblock Japan株式会社（本社・東京都中央区）のブランド「xTool」は、Amazon.co.jpで開かれる「Amazonブラックフライデー」に合わせ、人気のレーザー加工機などを特別価格で販売すると発表した。値引きは最大161,740円、割引率は最大43％。購入先はAmazonのxTool公式ストアとしている。\n【背景】年末の贈り物やオリジナル作品づくりの需要が高まる時期に合わせたセールである。xToolは80以上の国と地域で展開し、世界で40万台以上のデバイスが接続され、累計の創作タスクは1億5,000万件を超えるとしている。デスクトップレーザーの市場では47％のシェアを持つと説明している。これらの数値の出典として、Atomm社内データ（2026年9月時点）と、CICの調査（2025年9月30日までの9か月間のGMVベース）が付記されている。\n【詳細】先行セールは2026年11月27日（金）0時から29日（日）23時59分まで、本セールは11月30日（月）0時から12月7日（月）23時59分まで。税込みのブラックフライデー価格は、レーザー加工とCMYKカラー印刷に対応するM2が86,450円から（最大54,500円引き）、15Wダイオードと5W赤外線のデュアルレーザーを積むF2が174,705円から（最大106,320円引き）。最大100kgの加圧力と380×380mmのヒートプレートを持つWonderPressが63,000円から（最大11,800円引き）、5W UVレーザーのF2 Ultra UVが608,000円から（最大78,000円引き）、MOPAファイバーレーザーのF2 Ultraが639,630円から（最大161,740円引き）となる。\n【ポイント・注意点】価格は「〜から」の表記で、構成によって変わる。先行セールと本セールで期間が分かれているため、購入時期によって条件が変わる可能性がある。購入前には、Amazonの商品ページで最新の価格と在庫を確認したい。レーザー加工機は機種ごとに加工できる素材や用途が異なるため、値引き額だけでなく用途に合うかどうかで選ぶことが大切だ。","2026-11-26","PR TIMES（Makeblock Japan）","https://prtimes.jp/main/html/rd/p/000000050.000135536.html"],["AI設計CADのForgent3D、OpenSCADを正確なSTEPに変換するツール公開","AIで部品を設計するクラウドCADを手がけるForgent3Dは、OpenSCADの設計データを円や曲面を正確に保ったままSTEP形式に変換するツール「openscad-to-step」を、2026年11月24日からGitHubとnpmで公開した。メッシュ形式ではCAMが穴を認識できない問題を解消する。Thingiverseの.scadファイル6825個で試し、93％を変換できたという。変換は手元のパソコン内で完結する。","\n【概要】AIで部品を設計するクラウドCADを手がけるForgent3Dが、OpenSCADの設計データを、円や曲面を正確に保ったままSTEP形式に変換するツール「openscad-to-step」を公開した。FabSceneが2026年11月26日に伝えた。配布は11月24日からGitHubとnpmで始まっており、同じ変換は同社のサイトからブラウザーでも使える。同社のブログは9月30日にこの変換サービスを紹介していた。\n【背景】STLや3MFなどのメッシュ形式では、円筒の穴が細い平面の帯の集まりとして表現される。そのため、CADで穴として選んだり直径を測ったりできず、CAMも穴と認識できないと説明されている。OpenSCADで設計した部品を切削加工に回す際には、この点が壁になっていた。\n【詳細】処理は、WebAssemblyで動くOpenSCADの改造版で形状を計算し、その結果を立体設計用のPythonライブラリー「build123d」のモデルに書き換え、Open CASCADE Technologyを基にした形状処理エンジンでB-repとして組み立てて、STEPに書き出す流れだ。cylinder()で書いた部分は本物の円筒になり、角を丸めた箱や長穴、部品ライブラリーBOSL2の歯車なども正確な面で作られる。ねじって押し出した形や読み込んだSTLなど、正確な面にできない部分は平面の集まりのまま残し、該当する.scadの行を示して警告する。Thingiverseの.scadファイルのうちOpenSCADで描画できる6825個で試し、93％を変換できたという。利用にはNode.js 20以降が必要で、npxコマンドで起動する。\n【ポイント・注意点】変換は手元のパソコン内で完結する。変換部のライセンスはAGPL-3.0で、企業向けの商用ライセンスも用意されている。一方、曲面を組み立てるエンジン「@forgent3d/cad-build」は無償で使えるものの、ソースは公開していない。オープンソースの部分とそうでない部分が混在している点は、利用前に確認しておきたい。","2026-11-26","FabScene","https://fabscene.com/new/make/openscad-to-step-brep-converter-forgent3d/"],["ガルバノ式ヘッドをガントリーに載せたレーザー彫刻機「LoopZizo LC」","中国・恵州のLoopZizoは、ガルバノ式の高速レーザーヘッドをガントリーに載せたレーザー彫刻機「LoopZizo LC」の支援募集を、2026年11月20日にKickstarterで始めた。内蔵カメラで台上の素材を撮影し、画面で図柄を置くと、ヘッドを各素材の上へ運んで加工する。台は360×330mm、出力は10Wと20Wの2機種で、早期割引の支援額は649ドルから。届くのは2027年3月の予定だ。","\n【概要】中国・恵州のLoopZizoは、ガルバノ式の高速レーザーヘッドを、台の全面を動くガントリーに載せたレーザー彫刻機「LoopZizo LC」について、2026年11月20日にKickstarterで支援募集を始めた。FabSceneが11月25日に伝えた。出力は10Wと20Wの2機種で、波長450nmの青色レーザーを使う。\n【背景】同社によると、ガルバノ式は速いが加工範囲はコースター程度に限られ、ガントリー式は広く加工できるが、細かい図柄ほど時間がかかる。LCは両方の方式を組み合わせて、この弱点を補う設計としている。台全体を使える広さと、ガルバノ式の速さを1台で両立させようとする発想である。\n【詳細】LCは内蔵カメラで台上の素材を撮影し、画面で図柄を置くと、ガントリーがガルバノヘッドを各素材の上へ運んで加工する。台は360×330mmで、小物1個の加工は約1分。木材、紙、革への彫刻と、薄い材料の軽い切断に対応する。ヘッドは工具なしで外せ、専用台を使えば机の天板やドアなどにも直接彫れる。排気ファンを内蔵し、PCソフトのほか、Wi-Fi経由のスマホアプリでも操作できる。早期割引の支援額は10W版が649ドル（約10万円）、20W版が949ドル（約15万円）で、通常の支援額は749ドル（約12万円）と1049ドル（約17万円）。筒状の物を回しながら彫るアタッチメントは100ドル（約1万6000円）。配送先は世界各国で、届くのは2027年3月の予定だ。台に置いた複数の素材を、カメラの画像をもとにそれぞれの位置に合わせて加工できる仕組みである。同社はSLS方式の卓上3Dプリンター「K-100」と後処理装置「H1」も手がけている。\n【ポイント・注意点】募集は2026年12月20日まで続き、目標額に届かなければ成立しないAll or Nothing方式である。クラウドファンディングのため、届く時期は予定にとどまる。ヘッドを外して使う場合は、波長450nmに対応した保護メガネの着用を求めている。支援額に添えた円の金額は、記事が示した概算である。","2026-11-25","FabScene","https://fabscene.com/new/news/loopzizo-lc-galvo-gantry-laser-engraver-kickstarter/"],["ユニバーサルロボット、Gen 7に3D AIビジョンを内蔵 CNC供給も視野","MachineToolNews.aiによると、ユニバーサルロボット（UR）は2026年11月24日、Inbolt社の3D AIビジョン「Inbolt Standard」を第7世代の制御盤CB7 Coreの上で直接動かす統合を発表した。外付けの産業用PCが要らなくなり、手首の3DカメラとCADデータによる部品認識で置き位置のずれを補正し、CNC工作機械への部品の出し入れなどに使える。部品の学習は10分未満で、処理は制御盤の中で完結するという。","\n【概要】\nMachineToolNews.aiは2026年11月26日、ユニバーサルロボット（UR）がInbolt社の3D AIビジョン「Inbolt Standard」を第7世代（Gen 7）のロボットに組み込んだと報じた。URの公式発表は11月24日付。ビジョン処理を制御盤CB7 Coreの上で直接動かすため、外付けの産業用PCが要らなくなる。用途にはCNC工作機械への部品の出し入れやねじ締め、自動車の組み立てなどを挙げている。\n\n【背景】\n多品種少量の現場では、部品が毎回同じ位置に届くとは限らない。これまでは専用の治具で置き方をそろえるのが一般的だった。Inbolt Standardは手首に付けた3DカメラとCADデータによる部品認識を組み合わせ、部品の位置と向きを見つけてから、教えた軌道を補正する。URとInboltは2022年から協業している。\n\n【詳細】\n公式発表の仕様では、静止した部品での繰り返し精度は0.5〜0.7mm、部品の学習は10分未満、1つのプログラムで80を超える部品を参照できる。必要なソフトはPolyScope X 10.13以降で、カメラはOrbbec製の3Dカメラ。対応するg-SeriesのUR10g-1750、UR17g-1300、UR18g-950では、カメラをツールフランジ経由でつなげるため、腕に沿ったカメラ配線も不要になる。CB7を積んだe-SeriesとUR Seriesも対応するが、外付けのカメラ配線が必要になる。実績として、Stellantisのエンジン組み立て工程ではねじ締めの不良が91%減り、1台あたりの画像処理は0.5秒だったとURは説明している。\n\n【ポイント・注意点】\n記事は、治具を減らせても、チャックや万力での正確な保持は依然として必要だと指摘する。CNCへの供給では、グリッパーの選び方、挿入の公差、機械との接続、衝突の危険を個別に確かめる必要がある。標準ライセンスは向きがある程度そろった部品が対象で、ばら積みピッキングはInboltへの確認が必要。Stellantisの数値はGen 7での独立した検証ではない。価格は公表されておらず、UR+のマーケットプレイスに掲載済みで、販売網での受注はまもなく始まるという。","2026-11-26","MachineToolNews.ai","https://machinetoolnews.ai/universal-robots-gen-7/"],["シーメンス、SPS 2026で産業AIを展示 機械制御にAIを直接組み込み","シーメンスは独ニュルンベルクの展示会SPS 2026で、製造事業者が目標を定め、産業用AIが達成方法を決める「目標ベース自動化」を示した。AIエージェントが生産計画を作る「Autonomous Production Planner」は手作業の計画工数を70%減らすと見込む。機械制御にAIを直接組み込む「Industrial AI Suite」や、入荷品を開梱するAIロボットの開発も紹介した。","\n【概要】シーメンスは、ニュルンベルクで開かれた展示会SPS 2026で、製造事業者が目標を定義し、産業用AIがその達成方法を決める「目標ベース自動化」を展示した。Robotics and Automation Newsが2026年11月25日に報じた。生産計画を立てるAIエージェント、機械制御へのAIの組み込み、AIロボットなどを一連の取り組みとして示している。\n【背景】シーメンス自動化部門の社長、Rainer Brehm氏は「次の生産性の飛躍は、これまで自動化できなかった作業を自動化することから生まれる」と述べた。例として挙げたのが、エアランゲンのElectronics Factoryで開発中の、入荷品を開梱するAIロボットである。包装の種類やサイズが違うため、従来のロボットプログラミングでは自動化が難しかったという。ロボットはカメラで周囲を実時間で捉え、AIのロボット基盤モデルがカートンを開けて電子部品のリールを取り出す。\n【詳細】新製品の「Autonomous Production Planner」は、産業AIのオーケストレーションソフト「Intelligence Center X」の一部で、複数のAIエージェントが生産スケジュールを作成・最適化し、物理ベースのデジタルツインで検証してから生産に回す。手作業の計画工数を70%削減し、コストを最大20%下げると見込む。「Eigen Engineering Agent」は、自動化コードの適応、シミュレーションによる検証、プロセス産業での支援へと用途を広げた。「Industrial AI Suite」は機械制御にAIを直接組み込み、AIベースのモーション制御や、運用データによる継続的な改善を可能にする。\n【ポイント・注意点】ほかに、自律移動ロボット向けの統合ドライブシステムや、12万以上のハードウェア製品の標準化された機械可読デバイスデータ、EUサイバーレジリエンス法への対応と機械メーカーの規制対応支援も発表した。計画工数やコストの削減幅は同社の見込みであり、各工場での効果は導入条件によって変わる点に注意したい。","2026-11-25","Robotics and Automation News","https://roboticsandautomationnews.com/2026/11/25/siemens-advances-physical-ai-and-autonomous-production-technologies/107659"],["Make:、AI搭載のモバイル3Dスキャナー「EINSTAR EZ GO」を紹介","米Make:は2026年11月25日、Shining 3DのEINSTARブランドの新製品で、AIを搭載したモバイル3Dスキャナー「EINSTAR EZ GO」を紹介した。スマホやタブレットと無線でつながり、高性能なPCなしで片手でスキャンできる。レーザーとIRの2つのモードでマーカーなしの撮影に対応し、IRモードではAIによる対象物の分離機能を備える。出力はSTLやOBJ、3MFなどに対応する。","\n【概要】米Make:は、Shining 3DのEINSTARブランドから登場した、AIを搭載するモバイル3Dスキャナー「EINSTAR EZ GO」を紹介する記事を2026年11月25日に掲載した。記事はShining 3Dのスポンサー記事で、アフィリエイトリンクを含む。Shining 3Dは2004年から3Dスキャン機器とソフトを開発している。\n【背景】3Dスキャナーは、実物の形を取り込んで3Dプリントや加工用のデータを作るのに使われる。EZ GOは、電話、タブレット、PCと無線で接続でき、EXStar Mobileアプリを使えば高性能なPCがなくても片手でスキャンできる点を特徴としている。初期設定の後は接続を記憶し、開封から最初のスキャンまで約3分とされる。\n【詳細】レーザーとIRの2つのモードで、マーカーなしの撮影に対応する。レーザーは30本の交差ラインと単線があり、単線は穴や溝の奥まで届く。スキャン速度は最大60fpsで、PCとは有線でも接続できる。IRモードのVCSELプロジェクターは人や文化財の撮影にも向く。本体のEZには1.3MPの深度カメラ2台と2MPのテクスチャカメラが入り、GOグリップは5,400mAhの電池で最大2時間スキャンできる。AI機能として、IRモードで対象物を切り分ける「Real-Time Target Extraction」と「AI Tracking Algorithm」を備え、クラウドで3D Gaussian Splattingの処理もできる。Laser HDの解像度は0.05〜10mm、走査速度は毎秒1,150,000点。出力形式はSTL、OBJ、PLY、3MF、ASCに対応する。重さはEZが125g、GOが163g。\n【ポイント・注意点】記事には価格の記載がない。スポンサー記事であるため、性能の評価は第三者による検証ではなく、メーカー側の説明に基づく点に注意したい。ShiningSpace、EXModel、EXMeasureといった同社のソフトとも連携する。","2026-11-25","Make:","https://makezine.com/article/digital-fabrication/3d-printing-workshop/einstar-ez-go-ai-powered-mobile-3d-scanner"],["CNC彫刻ソフトCarveco V1.71、工具経路シミュレーションの不具合を修正","CNCでの彫刻やデザイン向けソフトを手がけるCarvecoは2026年11月24日、Carveco V1.71のリリースノートを公開した。内容は「Fixes & Improvements」の2項目で、Intel製グラフィックスを使う一部の環境で工具経路のシミュレーションが断続的に落ちる不具合と、起動時に落ちることがある問題を直した。新機能の追加はなく、安定性を高めるための更新となっている。","\n【概要】CNCでの彫刻やデザイン向けのソフトを手がけるCarvecoは、Carveco V1.71のリリースノートを2026年11月24日に公開した。今回の更新は「Fixes & Improvements（修正と改善）」の1節だけで構成され、2件の不具合修正が含まれる。ビルド番号は2026-11-23-1544-8b44916と記されている。\n【背景】Carvecoは、CNCルーターなどで木材などを彫るためのデザインと加工データづくりを担うソフトである。CNC加工では、作った工具経路を実際に削る前に画面上で動かして確かめる「工具経路のシミュレーション」がよく使われる。削りすぎや思わぬ動きを事前に見つけるための作業で、ここでソフトが落ちると、確認の手順そのものが止まってしまう。\n【詳細】1件目は「Toolpath Simulation on Intel Graphics」の修正で、Intel製のグラフィックスを使う一部のシステムで「Simulate Toolpath」を使った際に、断続的に起きることがあったクラッシュを直した。2件目は「Application stability」の修正で、起動時にクラッシュにつながることがあった問題を直した。リリースノートには、これ以外の新機能や、数値を伴う変更点は記されていない。同社のトップページの「Latest News」欄からも、このリリースノートに移動できる。\n【ポイント・注意点】今回のV1.71は機能追加ではなく、安定性を高めるための小さな更新である。Intel製グラフィックスのパソコンで工具経路のシミュレーションが落ちる症状に悩んでいた利用者や、起動時の不具合に遭っていた利用者にとっては、更新する価値がある。一方、それ以外の環境では、目に見える変化は少ないとみられる。リリースノートに記された修正の対象は2件に限られるため、ほかの症状が残っていないかは、更新後の使用の中で確かめていくことになる。更新の前には、作業中のデータを保存しておくと安心だ。","2026-11-24","Carveco","https://carveco.com/2026/11/24/carveco-v1-71-release-notes/"],["新工芸舎・三田地氏が語る AI時代に3Dプリントで残す「人間の痕跡」","FabSceneは2026年11月24日、京都を拠点にFFF方式の3Dプリンターで工芸的な作品を作る新工芸舎の主宰、三田地博史氏のインタビューを掲載した。積層痕を繊維と捉えたシリーズ「tilde」などの歩みに加え、半年かけて作ったソフトがAIなら5秒で出てくる時代に、何に価値が宿るのかを語った。Gコード生成ソフトを自ら開発し、造形のゴミを素材に戻す試みも進めている。","\n【概要】FabSceneは、京都を拠点にFFF方式の3Dプリンターで工芸的な作品を作る新工芸舎の主宰、三田地博史氏へのインタビューを2026年11月24日に掲載した。生成AIでソフトウエアの価値が変わりつつある中で、3Dプリントによるものづくりに何を残すのかを語っている。\n【背景】三田地氏は大学でデザインを学び、キーエンスに入社した後、京都の3Dプリンター代理店YOKOITOに誘われ、2017年に加わった。2019年にシリーズ「tilde（チルダ）」を発表し、積層痕を繊維と捉えて積層幅を広げることで、質感と生産時間の短縮を両立させた。造形の基盤となるGコード生成ソフトは、後輩の小坂諒氏が開発した。2020年に小坂氏と新工芸舎を結成し、2021年には朝倉真莉子氏が加わって3人体制となった。2023年にYOKOITOから独立し、2024年にはイタリアのポストモダニズムの影響を受けた「Anomalo」や、ウィーン工房に着想を得た「M600」を発表した。\n【詳細】生成AIについて三田地氏は、半年ほどかけて開発したソフトが、指示を出して待つと5秒で出てくると語る。一方でAIは道具であり、一発ではOKにならず、調整を重ねるループはソフト開発と変わらないという。主力機は2017年発売の「Original Prusa i3 MK3」で、ツールチェンジャー付きの「Original Prusa XL」も導入した。作品「WA Stool」は積層位置を1層ごとに左右交互にずらし、表面が実際の2倍のピッチに見えるようにした。京都市下京区に整える新拠点では、造形で出たPLAのゴミを粉砕し約280℃で焼いたタイルを試作している。\n【ポイント・注意点】三田地氏は「人間は、人間の痕跡が見たいんだと思うんです」と語り、手をかけたものにこそ価値が宿るのではないかという考えを示した。AIで設計やソフトづくりが速くなるほど、作り手の手の跡が差別化の要素になるという見方であり、デジタル工作に関わる人にとって考える材料になるインタビューだ。","2026-11-24","FabScene","https://fabscene.com/new/interview/interview-shinkogeisha-3dprint-craft-ai/"],["CAMは工具経路の直接編集とAI支援へ Mastercam担当者の見方","ENGtechnicaは2026年11月23日、CAMソフトが設定値を入力して経路を作り直す「パラメータ駆動」から、工具の動きを直接扱う方向へ進化していると論じる記事を掲載した。Mastercamのシニア・プロダクト・マネージャー、David Conigliaro氏の見解を中心に、個々の経路の直接編集、3軸と5軸の統合、自然言語で相談できるAI支援、継続的なシミュレーションの利点を紹介している。","\n【概要】ENGtechnicaは、CAMソフトが「パラメータ駆動」のプログラミングから、切削工具の動きを直接扱う方向へ進化しているとする記事を2026年11月23日に掲載した。Machine Designの記事を基にしたもので、MastercamのシニアプロダクトマネージャーであるDavid Conigliaro氏の見解が中心になっている。\n【背景】従来のCAMでは、設定値を変えては工具経路を再生成し、結果を確かめる作業を繰り返すことが多かった。記事は、こうした進め方から、作られた工具経路そのものを直接さわって直す方式への移行を取り上げている。あわせて、ベテランの機械工の退職に伴う知識の継承という課題にも触れている。\n【詳細】Conigliaro氏によると、ユーザーは個々の経路をトリム、延長、再配置、削除でき、送りや速度、衝突回避も調整できる。リアルタイムのフィードバックによって、再生成を繰り返す必要がなくなるという。設定値を入力して結果を待つのではなく、画面上の経路そのものを編集の対象にする考え方である。自動生成された工具経路を出発点にし、公差や工具の向き、加工戦略を人が調整する方式も紹介している。3軸と5軸の加工を1つのワークフローに統合し、複雑な部品で必要な箇所にだけ多軸の動きを入れられる点も挙げた。AI支援については、自然言語で目的を伝え、メニューや文書を探さずに文脈に沿った助言を得られるとする。シミュレーションを作業の完了後ではなく、作業中に継続的に行える点も利点だという。\n【ポイント・注意点】記事は結論として、自動化は人の専門性を置き換えるのではなく、補完すべきだと強調している。AIによる支援が、ベテランの知識を引き継ぐ手段になりうるという見方も示した。一方で、記事には具体的な数値や価格、バージョン番号は記されておらず、特定の製品の発表ではなく、CAM全体の方向性を論じた内容である点に注意したい。Mastercamの担当者の見解を軸にしているため、他社のCAMでの取り組みは記事の範囲に含まれていない。","2026-11-23","ENGtechnica","https://engtechnica.com/cam-software-evolves-toward-direct-toolpath-editing-and-ai-assisted-programming/"],["シーメンス、SPS 2026で産業AIの実績を前面に エンジニアリングAIは最大5倍速","IIoT Worldは2026年11月23日、シーメンスがSPS 2026で、産業AIの実演だけでなく顧客が本番で使った実績を示すと伝えた。ブースでは製品の切り替えでも生産が止まらない「pop-up factory」を展示する。TIA Portalと統合したEigen Engineering Agentは、繰り返しのエンジニアリング作業を手作業より最大5倍速く実行できると報告されている。記事はシーメンスの協賛による。","\n【概要】IIoT Worldは、独ニュルンベルクで11月24〜26日に開かれるSPS 2026で、シーメンスがホール11において、顧客が本番稼働で使った産業AIの実績を示すと伝えた。記事は2026年11月23日の掲載で、シーメンスの協賛（Sponsored by Siemens）による。\n【背景】産業AIは実演の段階から、実際の現場でどれだけ成果を出せるかが問われる段階に移りつつある。記事の見出しも「AIのデモから測定された成果へ」としている。シーメンスのデジタルファクトリーズでオートメーションのマーケティングを担当する副社長、Marcus Bliesze氏は、知能を産業での実際の価値に変えていることを示すと述べた。\n【詳細】展示の目玉は、消費財の生産ラインを模した「pop-up factory」である。製品の切り替えには通常、再プログラミングと停止が必要だが、ここでは生産が止まらずに適応する様子を見せる。AI Vision Systems、CES 2026で初公開したDigital Twin Composer、RapidMiner、AGVを使ったPhysical AIの4つの技術を組み合わせる。エアランゲン工場では、AIによる外観検査で品質の誤判定が60%減ったという。Eigen Engineering Agentは2026年4月に一般提供が始まり、100社以上・19か国での現場試験を経ている。TIA PortalのV19、V20、V21に統合され、繰り返しのエンジニアリング作業を手作業より最大5倍速く実行できると報告されている。\n【ポイント・注意点】Eigen Engineering Agentのパネルには、Zimmermann、GEA、Reis Robotics が参加する。SPSのステージには130人以上の講演者が登壇する。記事はシーメンスの協賛記事であり、効果の数値は同社の説明に基づく点に注意が必要だ。EUサイバーレジリエンス法の報告義務が2026年9月11日に始まったことにも触れている。","2026-11-23","IIoT World","https://www.iiot-world.com/smart-manufacturing/sps-2026-industrial-ai-value/"],["Weekly Robotics、FluidNCで壁を登るペンプロッターや彫刻ロボを紹介","ロボット分野のニュースレター「Weekly Robotics」は2026年11月23日発行の第386号で、壁面を登って絵を描くペンプロッター「Mural 2.0」や、KUKAの産業用ロボットで3Dモデルから大理石彫刻を作るMonumental Labsの取り組みを紹介した。Mural 2.0はCNC向けファームウエアのFluidNCとESP32で動く。部品代300ドルの腱駆動ロボットハンドなど、自作向けの話題も並ぶ。","\n【概要】ロボット分野のニュースレター「Weekly Robotics」は、2026年11月23日に第386号を発行した。冒頭では編集者が、ACTとLeRobotを使ってバターを手渡すロボットを訓練した体験を紹介し、M1 Mac上での推論が遅かったと述べている。号の中では、CNCの技術を使った自作の装置や、ロボットによる石の彫刻など、工作に関わる話題が取り上げられている。\n【背景】Weekly Roboticsは、研究や製品、趣味の工作まで、ロボット関連の話題を週ごとにまとめて届けるニュースレターである。今号のスポンサーは、Foxglove、Jiga、Point One Navigation、LTXの4社となっている。\n【詳細】Nik Ivanov氏の「Mural 2.0」は、壁面を登って描くペンプロッターで、NEMA 17のモーター2基とESP32、CNC向けのファームウエアFluidNC、TMC2209ドライバーを使う。Monumental Labsは、KUKAの産業用ロボット「KR240」を使い、3Dモデルから大理石の彫刻を自動で作る取り組みとして紹介された。Hackadayの記事からは、スチールワイヤーとPTFEチューブを使い、部品代300ドルで作る腱駆動のロボットハンドを取り上げた。UCLの研究で、Unitree G1が音楽を聴きながら踊る「AHEADance」も載っている。物理エンジン「Alloy」はNewton、MuJoCo Warp、Warpで構築され、1つのL4 GPUではFranka Pandaの並列数2,048が最適だったという。ニュースとしては、フランスのGenesis AIが5億ドルを調達し、評価額が35億ドルになったことを伝えている。\n【ポイント・注意点】個々の話題は短い紹介と外部へのリンクが中心で、詳しい仕様や作り方は各リンク先で確かめる必要がある。イベント情報として、ROSCon BE 2026（11月25〜26日、ベルギー・ニヴェル）と、Humanoids 2026（12月6〜9日、米サンタクララ）も案内している。","2026-11-23","Weekly Robotics","https://www.weeklyrobotics.com/weekly-robotics-386"],["3D設計とレーザー加工を1本に 無料アプリ「DabbleCAD」","FabSceneは2026年11月21日、3D設計、レーザー加工、深度マップ作成の3つの機能を1本にまとめた無料のデスクトップアプリ「DabbleCAD」を紹介した。DJMcNewgent氏がGitHubで公開しており、60種類以上の図形や文字で3Dモデルを作れるほか、GRBL互換のレーザーカッターへUSBで送ったり、G-codeとして書き出したりできる。アカウントは不要で、データは手元に保存される。","\n【概要】FabSceneは、DJMcNewgent氏がGitHubで公開している無料のデスクトップアプリ「DabbleCAD」を2026年11月21日に紹介した。3D設計、レーザー加工、深度マップ作成の3つの機能を1本にまとめている。Windows、Mac、Linux向けに無料で配布され、ライセンスはApache-2.0。11月21日時点の最新版は1.3.0である。\n【背景】3Dプリントやレーザー加工では、設計用のソフトと加工用のソフトを使い分けることが多い。DabbleCADは、Tinkercadのように図形を組み合わせる3D設計と、レーザーカッターへの送信、レリーフ彫刻用のデータづくりを1つのアプリで済ませられるようにしている。外部との通信をほとんど行わず、手元で完結する作りも特徴としている。\n【詳細】3D設計では、60種類以上の図形や文字を組み合わせてモデルを作り、ねじ山付きのボルトとナット、ちょうつがい、ふた付きの箱などをミリ単位で生成できる。書き出しの前に、閉じていない形状や薄い壁、急な張り出し、造形範囲の超過を確かめられ、STLや3MFで書き出すか、スライサーに直接送れる。レーザー加工では、線・曲線・文字・画像を30色のレイヤーに割り当て、速度、出力、回数を設定する。GRBL互換のレーザーカッターへUSBで送信でき、G-codeとしても書き出せる。LightBurnのプロジェクトファイルを開けるほか、指組みの箱の部品づくりや、プラズマ切断機向けのG-code出力も備える。深度マップの機能は、3Dモデルや画像からレリーフ彫刻用の高さ画像を作る。\n【ポイント・注意点】アカウントは不要で、データは手元に保存され、クラウドとの同期はない。通信は起動時に新しいバージョンをGitHubへ問い合わせるときだけで、設定で止められる。署名やAppleの公証がないため、初回の起動時にOSの警告が出る。作者は、チェックサムで確かめたうえで、このアプリだけを許可するよう案内している。","2026-11-21","FabScene","https://fabscene.com/new/make/dabblecad-offline-3d-design-laser-depth-map-app/"],["米Monumental Labs、大理石彫刻の工具経路づくりを自動化","FabSceneは2026年11月20日、米ニューヨーク・ブルックリンのMonumental Labsが、産業用ロボットで大理石を彫るための工具経路を人手を介さずに生成するシステムを開発したと伝えた。彫刻の3Dモデルと石塊のデータから、刃物の通り道と向きを数百万点単位で計算し、加工結果をシミュレーションで確かめる。従来はCAMソフトで作品ごとに手作業で組み、1点に数週間から数カ月かかっていた。","\n【概要】米ニューヨーク・ブルックリンで石彫や建築装飾を手がけるMonumental Labsが、産業用ロボットで大理石を彫るための工具経路（ツールパス）を、人手を介さずに生成するシステムを開発した。FabSceneが2026年11月20日に伝えた。担当のEleanor Wiesler氏が、ニューヨークのイベントでの講演内容を10月6日付の個人ブログで説明している。同社サイトには報道発表は見当たらないという。\n【背景】同社は従来、金型やエンジン部品向けのCAMソフト「Autodesk PowerMill」で作品ごとに工具経路を手作業で組んでおり、1点に数週間から数カ月かかっていた。彫刻は毎回形が異なるため、この手作業が工場を広げるうえでの足かせになっていたという。作品ごとに経路を組み直す負担をなくすことが、今回の開発の狙いである。\n【詳細】新システムは、彫刻の3Dモデルと石塊のデータを入力すると、刃物の通り道と向きを数百万点単位で計算し、加工結果をシミュレーションで確かめる。石塊は小さな立方体（ボクセル）の集まりとして扱う。荒削りでは高さごとに層を削り下ろし、耳やあごの下など真上から刃が届かない部分は傾けた面に沿って削る。仕上げでは残った石を層に分け、各層を同じ向きの刃で削れる区画に分割する。区画の中では表面に沿って測った距離が等しい線を経路にし、刃物とロボットがぶつからない向きと関節角度を全点で求める。使うロボットはKUKAの「KR240」。デモでは、シルクハットの中からCG研究で使われてきたウサギのモデル「スタンフォード・バニー」を彫り出した。\n【ポイント・注意点】最終的な表面の仕上げは、引き続き職人が手で行う方針である。自動化されたのは工具経路づくりで、全工程が無人になったわけではない点に注意したい。同社サイトによると、2023年7月にロボット1台と石工1人で始め、現在はデザイナー、彫刻家、エンジニアなど26人が働く。ソフトとハードウェアで石材加工を段階的に自動化し、費用を最大90％下げることを目指すとしている。","2026-11-20","FabScene","https://fabscene.com/new/news/monumental-labs-autonomous-toolpathing-robotic-marble-carving/"],["CNX Software、ブラックフライデー情報 Makeraやレーザー彫刻機のセール","組み込み機器のニュースサイトCNX Softwareは2026年11月20日、ブラックフライデーとサイバーマンデーの国際向けセール情報をまとめた。中心はシングルボードコンピューターやミニPCだが、読者コメント欄ではMakeraのCNCセールや、CNCソフトEasel Proの15%引きが挙がった。Crealityのレーザー彫刻機は最大24%引きで、Falcon A1 Proは835ドルとなっている。","\n【概要】組み込み機器のニュースサイトCNX Softwareは、ブラックフライデーとサイバーマンデーの2026年の国際向けセール情報をまとめた記事を、2026年11月20日に掲載した。中心はシングルボードコンピューター、開発ボード、ミニPC、スマートホーム機器だが、レーザー彫刻機やCNC関連の情報も含まれている。\n【背景】年末商戦にあわせて、電子工作やデジタル工作の機材を扱う各社が値引きを行っている。CNX Softwareのまとめは国際向けで、国をまたいで購入できるセールを中心に集めている。CNC関連の情報は、本文ではなく読者のコメント欄で共有されたものである。\n【詳細】読者コメントでは、Makeraの11月20日から29日までのブラックフライデーセールと、CNC用ソフト「Easel Pro」の年額プランと3年プランの15%引き（コードSAVE15、12月1日まで）が挙がった。レーザーでは、Crealityがレーザー彫刻機の一部を最大24%引きにしており、記事は機種ごとの価格を載せている。Falcon A1が439ドル（20%引き、元は549ドル）、Falcon A1 Proが835ドル（24%引き、元は1,099ドル）、Falcon2 Pro (S) 22Wが849ドル（23%引き）、Falcon2 Pro (S) 40Wが1,279ドル（15%引き）、Falcon T1 Diode 20Wが1,999ドル（20%引き）、Falcon T1 Fiber 20Wが2,159ドル（20%引き）。AliExpressは11月19日から12月3日、Banggoodは11月16日から12月7日にセールを行う。AI関連では、SixFabがEdge AIボードなどにSAVE50とSAVE100のコードを用意している。\n【ポイント・注意点】CNC関連の情報は読者コメントに基づくもので、セールの条件は各社の公式ページで確かめる必要がある。表示価格は記事掲載時点のもので、セール期間中でも変わることがある。国際向けの購入では、送料や関税がかかる場合がある点にも注意したい。","2026-11-20","CNX Software","https://www.cnx-software.com/2026/11/20/black-friday-and-cyber-monday-2026-international-deals-and-coupons/"]],"cricut":[["Silhouette Studioで「グループ解除」できない時の対処法","Silhouette Schoolが、Silhouette Studioでデザインやフォントの内側にある不要なカット線を消す方法を紹介した。ステッカーや転写シートで外周だけを切りたい場面を想定する。グループ解除がグレーで押せないときは、右クリックで「複合パスを解除」を選ぶ。そのあと内側の線を個別に選んで消し、外周に1本のカット線だけが残っているかを確かめる。作例はSo Fontsyのフォントを使った「Fall Farmhouse」のステッカー。","\n【概要】\nSilhouette Schoolは、Silhouette Studioで「グループ解除」が使えないときの対処法を紹介した。デザインやフォントの内側に残った不要なカット線を消し、外周だけを切れる状態にする手順だ。ステッカーや転写シートを作るとき、内側の細かい線まで切ると仕上がりが崩れる。そうした場面で役に立つ。\n\n【背景】\n文字やイラストを組み合わせたデザインは、複数の線が「複合パス」としてまとまっていることが多い。この状態では、外周と内側の線を別々に扱えない。普段はグループ解除で線をばらせるが、複合パスになっているとメニューがグレーで選べない。初心者がつまずきやすい点だ。記事の作例は秋向けの「Fall Farmhouse」ステッカーで、フォントはSo Fontsyの「Fall Farmhouse」バンドルのものを使っている。\n\n【詳細】\n手順は4段階ある。まずデザインを選んで、グループ解除を試す。グレーで押せない場合は、デザインを右クリックして「複合パスを解除（Release Compound Path）」を選ぶ。これで内側のカット線を1本ずつ選べるようになるので、要らない線を選んで削除する。最後に、外周を囲むカット線が1本だけ残っているかを確認する。記事のラベルは「複合パス」「グループ解除」「フォント」「中級者向けチュートリアル」で、中級者向けの小技として位置づけられている。購入したフォントを使ってステッカーを作る人にとっては、知っておくと作業の手戻りが減る操作だ。\n\n【ポイント・注意点】\n複合パスを解除すると、文字の穴（「A」や「O」の内側など）も独立した図形になる。消してよい線と残す線を見分けながら作業したい。外周だけを切る形はステッカーの縁取りに向くが、細かい内側の模様を切り抜きたいデザインには使わない。記事には特定のStudioのバージョンや価格の記載はない。ページのURLは2024年8月のパスだが、ページに表示された日付は2026年11月26日（木）。記事にはアフィリエイトリンクの注記がある。","2026-11-26","Silhouette School","https://www.silhouetteschoolblog.com/2024/08/what-to-do-if-you-cant-ungroup-in.html"],["クリスマスの思い出を箱に収める、蛇腹式ミニアルバムの作り方","Lori Whitlockのブログに、Cathy Harper Designsによるクリスマスの蛇腹式アルバムの作例が載った。3×12インチの紙2枚を4インチごとに筋を付けて山谷交互に折り、リボンを付けて箱から引き出せるようにする。写真の台紙は2¾インチ角の黒いカードストック。Loriの「Nesting Window Card Envelope」で封筒を4枚作り、ポケットとして使う。箱の中敷きは、のり付けの前に収まりを確かめる。","\n【概要】\nLori Whitlockの公式ブログに「Merry Memories, All Boxed Up」という作例が掲載された。副題は「Cathy Harper Designsによるクリスマスの蛇腹アルバム」。紙とカードストックで蛇腹式のミニアルバムを作り、ふた付きの箱に収める。写真と封筒を組み合わせた、贈り物にも向く小物だ。\n\n【背景】\nLori WhitlockはSVGカットファイルのデザイナーで、自身のショップでカード、箱、立体物の型を販売している。ブログでは、クリエイティブチームのメンバーが同社のファイルを使った作品を紹介している。今回は年末に合わせて、写真を残すアルバムを題材にした。記事のタグは「3D Projects」「Christmas」「Echo Park」「mini album」「SVG files」「Tutorial」。\n\n【詳細】\n蛇腹の本体には3×12インチの紙を2枚使う。それぞれ4インチの位置に筋を付け、山折りと谷折りを交互にして折る。リボンをアイレットに通して付け、箱からアルバムを引き出せるようにする。写真の台紙は2¾インチ角の黒いカードストックで、写真を少し小さめに切って重ねると、細い黒枠が見える仕上がりになる。封筒はLoriのファイル「Nesting Window Card Envelope」で4枚作り、柄の違うホリデー用の紙と言葉で飾った。うち1枚はトナカイ柄の紙に丸い「Warm Wishes」のパーツを貼っている。記事によると、封筒の寸法はSilhouette向けに設定したものだという。箱の中敷きは、のり付けの前に1枚ずつ合わせて、畳んだアルバムと封筒が収まるかを確かめる。ふたは紙と飾りで装飾し、封筒と同じ色を1色取り入れてまとまりを出す。\n\n【ポイント・注意点】\n蛇腹は折り方向を交互にするのが要点で、筋付けを正確にするほど箱にきれいに収まる。仮組みで収まりを確かめてから接着する手順は、紙の厚みでサイズがずれやすい箱物では特に大事だ。封筒のファイルは有料ショップのリンク先にあり、記事に価格やライセンス条件の記載はない。ページには2026年11月25日と26日の2つの日付が並んで表示されており、どちらが公開日かは明記されていない。","2026-11-25","Lori Whitlock","https://loriwhitlock.com/merry-memories-all-boxed-up/"],["「Resting Grinch Face」の無料SVG、不機嫌顔のクリスマス柄","Crafty Crafter Clubが、不機嫌な表情を題材にしたクリスマス向けの無料SVG「Resting Grinch Face」を公開した。黒いTシャツに白の熱転写ビニール、マグに光沢ビニール、オーナメントにグリッタービニールといった使い方を提案する。熱転写なら反転して切る。Cricut Joy・Maker・Explore、Silhouette Studioで使える。個人利用のみで、データの再販や再配布はできない。","\n【概要】\n無料SVG配布サイトのCrafty Crafter Clubが、クリスマス向けのカットファイル「Resting Grinch Face」を公開した。不機嫌な「グリンチ顔」をモチーフにしたデザインで、Tシャツやマグ、オーナメントなど、ホリデーの小物に貼って使うことを想定している。登録なしでダウンロードできる。\n\n【背景】\nクリスマス前は、家族でおそろいのパジャマを着たり、手作りの贈り物を用意したりする機会が増える。ユーモアのある柄はそうした場面で人気がある。同サイトは11月に入ってクリスマス向けの無料SVGを続けて公開しており、今回もその1つだ。\n\n【詳細】\n提案している使い方は、黒いTシャツに白の熱転写ビニール（HTV）、陶器のマグに光沢の屋外用（パーマネント）ビニール、オーナメントにグリッタービニール。ほかにトートバッグ、おそろいのパジャマ、マントルピースに飾るつや消しビニールのサインも挙げる。材料の例は、EasyWeedのHTV、綿のTシャツ、耐熱テープ、ヒートプレス、屋外用ビニール、転写シート、へら（バーニッシングツール）。Design Spaceでの手順は、ダウンロードしたZIPを解凍し、「アップロード」からSVGを選ぶ。キャンバスに置いて素材に合わせて大きさを変え、HTVなら左右反転してからカットする。カス取りのあと、ヒートプレスかアイロンで圧着する。よくある質問によると、Cricut Joy、Maker、Explore、Silhouette Studioで使える。\n\n【ポイント・注意点】\nライセンスは「個人利用のみ」。手作りの品として人に贈るのは認めているが、デジタルデータそのものの再販や再配布は禁止している。完成品を販売してよいかどうかは、ページに書かれていない。販売を考える場合は、商用ライセンスのある素材を別に探すのが安全だ。HTVの反転を忘れると文字や絵が逆向きに貼られるので、カット前に確認したい。ページには、SVGの不具合を調べる無料ツール「SVG Doctor」や、Creative Fabricaの紹介リンクもある。","2026-11-25","Crafty Crafter Club","https://crafty-crafter.club/christmas/resting-grinch-face-svg-for-cricut/"],["箔の熱転写とシール紙で作る、両面仕立てのオーナメント","Craft-e-Cornerのブログが、CricutのFoil Iron-onとSticker Paper Cardstockを使った両面のクリスマスオーナメントの作り方を紹介した。シール紙に箔の熱転写シートを圧着し、Cricut Accessの柿の葉柄を別色の箔で重ねる。鳥の形を左右反転させて2枚切り、裏紙をはがして背中合わせに貼る。圧着の目安は約270°Fで30秒。カットにはグリッターカードストックの設定がよく合ったという。","\n【概要】\nCricut製品を扱う販売店Craft-e-Cornerのブログが「Christmas Foil Sticker Paper Ornaments」を公開した。CricutのFoil Iron-on（箔の熱転写シート）とSticker Paper Cardstock（シール付きカードストック）を組み合わせて、両面がきらきら光るオーナメントを作る。執筆はLee Ann Lilly。\n\n【背景】\n熱転写シートはふつう布に貼る素材だが、シール紙に圧着すれば、紙の小物にも箔の質感を出せる。シール紙は裏面が粘着になっているので、同じ形を2枚切って背中合わせに貼ると、のりを使わずに両面仕上げのパーツが作れる。\n\n【詳細】\n材料は、Foil Iron-on、Sticker Paper Cardstock、Cricutのヒートプレス（本文ではEasyPress）、グリッターの絵の具かグリッターのり、飾り用のワイヤーハンガー。手順は7段階ある。まずEasyPressで、Foil Iron-onを1枚、シール紙の表に圧着する。温度と時間はCricutのヒートガイドに従い、目安は約270°Fで30秒。粘着のある紙に圧着するため、多少の凹凸が出る。次に、背景の柄を別色の箔で切る。筆者はCricut Accessの柄「Christmas Leaves」（#M4E2E8A45）を使った。カス取りをして、先ほどのシートに重ねる。露出した熱転写部分を守るため、上にクッキングシートを当てて圧着する。そのあと、StandardGripマットでオーナメントの形を切る。筆者は自分でDesign Spaceに読み込んだ2つのパーツの鳥のデザインを使い、1つのオーナメントにつき左右反転した形を2枚切った。紙の厚みに合う素材設定を選ぶのがよく、グリッターカードストックの設定がうまく合ったという。裏紙をはがして2枚を背中合わせに貼り、縁にグリッターのりや絵の具を塗る（任意）。上部に穴を開けてワイヤーハンガーを通し、好みでビーズやリボンを足す。\n\n【ポイント・注意点】\n2枚を貼り合わせる構造なので、反転を忘れると表裏の柄がそろわない。熱転写の露出部分にはクッキングシートを当て、熱で傷めないようにする。素材設定は紙の厚みで変わるため、試し切りをしてから本番に移りたい。","2026-11-25","Craft-e-Corner","https://www.craft-e-corner.com/blogs/project-inspiration/christmas-foil-sticker-paper-ornaments"],["感謝祭のテーブルを飾る、Cricutで作るセンターピース12案","Cricut公式ブログが、感謝祭の食卓を飾るセンターピースのアイデアを12点まとめた。木のプランターに「Give Thanks」のビニール文字、立体のりんごかご、ペーパーパンプキン、メタリックの半透明紙で作るどんぐりと松ぼっくりのランタンなどがある。それぞれに材料とDesign Spaceのプロジェクトが付く。会話の邪魔にならないよう、高さは12インチ以下を勧めている。","\n【概要】\nCricut公式ブログは「12 DIY Thanksgiving Centerpiece Ideas for Every Table」を公開した。感謝祭の食卓の中央に置くセンターピースを、Cricutで作るアイデアを12点集めている。各案に「おすすめの材料」が添えられ、Design Spaceのプロジェクトにリンクしている。執筆はBeth Baty。\n\n【背景】\n米国の感謝祭は11月の第4木曜日で、家族や友人が集まって食卓を囲む。Cricutのブログは11月に入って感謝祭向けの記事を続けて載せている。今回はテーブルの中心に置く飾りに絞った。\n\n【詳細】\n木の花箱の案では、白の屋外用ビニールで「Give Thanks」の文字を切り、転写シートで滑らかな木のプランターに貼る。カス取りツールとへらを使う。陶器の花瓶には「Fall Canvas Texture Ceramic Vase」のデザインと秋色のビニールを使う。紙のかごは「3D Apple Basket」をクリーム色とグレーのカードストックで作り、小さな花瓶を中に入れる。ほかに、黒か焦げ茶とオレンジのビニールで作る「Happy Thanksgiving Wood Sign」、「3D Pumpkins」と「Pumpkin Pie Box」の紙のかぼちゃ、メタリックの半透明紙（ベラム）とスコアリングツールで作る「Acorn and Pinecone Lantern」がある。キャンドルのガラスには、インクジェットプリンターで刷る「Printable Waterproof Holographic Sticker Set」をプリント＆カットで貼る。貼る前にガラスを洗って乾かしておく。「Leaf and Branch Centerpiece」では、黄・オレンジ・赤のカードストックでカエデの葉を切り、感謝の言葉を書く木に仕立てる。マットは作品に合わせてLightGripかStandardGripを使う。\n\n【ポイント・注意点】\n記事は、向かいの人の顔が見えるよう、センターピースの高さを12インチ（約30cm）以下に抑えることを勧めている。本文の冒頭では「13のアイデア」と書かれているが、番号が付いているのは12点だ。デザインの多くはDesign Space上のプロジェクトで、利用条件は各ページで確かめたい。","2026-11-24","Cricut公式ブログ","https://cricut.com/blog/showstopping-diy-thanksgiving-table-centerpieces/"],["Siserのブラックフライデー、Romeoが399ドルでHTVは約30%引き","熱転写ビニール大手Siserが、2026年のブラックフライデーとサイバーウィークのセール内容をまとめた。24インチのカッティングマシンRomeoは通常599ドルが399ドルで、同社が出した中で最も安い価格だという。熱転写ビニールはコードBF2026でほぼ全品約30%引き（50ドル以上が条件）。MerchMakerを11月29日までに買うと、20%引きのクーポンが後日届く。11月30日からはLeonardo Design Studio Proの割引も始まる。","\n【概要】\n熱転写ビニール（HTV）の大手Siserが、公式ストアのブログで「Siser's 2026 Black Friday Cyber Week Deals & Steals」を公開した。カッティングマシン、HTV、ヒートプレス、デザインソフトのセール内容をまとめている。終わる時期は特典ごとに違い、ブラックフライデーの週末で終わるものとサイバーウィークまで続くものがある。\n\n【背景】\nSiserはEasyWeedなどのHTVで知られ、カッティングマシンのRomeoや、STAHLS'製のヒートプレスMerchMakerシリーズも扱う。年末商戦は、衣類のプリントを始めたい人が道具をそろえる機会になる。\n\n【詳細】\n1つめの目玉は、24インチ幅のカッティングマシンRomeoだ。通常599ドルが399ドルになり、200ドル安い。記事は、Siserがこれまで出したRomeoの中で最も安い価格だとしている。特徴として、24インチの裁断幅、位置を変えられるピンチローラー、マットなしの裁断、タッチスクリーン、カメラを使った輪郭カットを挙げる。2つめは、ほぼ全品のHTVが約30%引きになるセール。購入時にコードBF2026を入れ、対象のHTVで50ドル以上の注文が条件になる。デジタル製品とプリント用の製品は対象外。EasyWeed、特殊HTV、メタリック、グリッター、ストレッチ素材などが対象になる。3つめはMerchMakerの特典で、MerchMakerかMerchMaker Proを11月29日までに買うと、12月1日に20%引きのクーポンがメールで届く。12月31日まで、SiserStore.comでの次の買い物に使える。さらに11月30日からは、デザインソフトLeonardo Design Studio Proに新しく加入した人が、コードCYBERWEEK2026で月額・年額プランを50%引きにできる。割引は契約を続けている間ずっと適用される。詳しい内容は11月30日に出る予定だ。\n\n【ポイント・注意点】\nHTVの割引は50ドル以上が条件で、プリント用の製品は対象外になる。特典ごとに締め切りが違うので、買う前に期間を確かめたい。ストアの告知によると、Siserのサポートは11月26日（木）が休みで、27日（金）は米国東部時間の午前8時から午後2時まで対応する。","2026-11-23","Siser Store","https://siserstore.com/blogs/news/sisers-2026-black-friday-gift-guide"],["「Everything Is Fine」の無料SVG、慌ただしい年末を笑う柄","Crafty Crafter Clubが、年末の慌ただしさを笑い飛ばすクリスマス向けの無料SVG「Everything Is Fine」を公開した。黒いTシャツに白の熱転写ビニールで作るセーター、陶器のマグを使ったトラベルマグ、メタリックビニールのオーナメント、窓のステッカーなどを提案する。Design Spaceに読み込み、熱転写なら反転して切る6段階の手順付き。ベクターなので拡大しても粗くならない。個人利用に限り、登録なしで使える。","\n【概要】\n無料SVG配布サイトのCrafty Crafter Clubが、ホリデー向けのユーモア柄「Everything Is Fine」のカットファイルを公開した。「全部大丈夫」という言葉で、準備に追われる年末の混乱を笑いに変えるデザインだ。メールアドレスなどの登録をせずにダウンロードできる。\n\n【背景】\nクリスマスの時期は、贈り物の準備や集まりが重なって慌ただしくなりやすい。同サイトはそうした場面を皮肉ったユーモア柄を多く出しており、11月下旬にはクリスマス向けの無料SVGを続けて公開している。身近な人へのちょっとした贈り物に向いた題材だ。\n\n【詳細】\n提案している作例は、黒いTシャツに白のHTVで作るセーター、陶器のマグに光沢の屋外用ビニールを貼るトラベルマグ、トートバッグ、メタリックビニールのオーナメント、おそろいのエプロン、窓に貼るステッカー。材料の例として、金か銀のメタリックのEasyWeed HTV、綿か綿混のTシャツやスウェット、耐熱テープ、ミニヒートプレス、光沢の屋外用ビニール、陶器のマグの素地、転写シート、へらを挙げる。Design Spaceの手順は6段階。ダウンロードしたファイルを解凍し、Design Spaceを開いて「アップロード」を選ぶ。ファイルを選んで素材に合わせて大きさを変え、HTVなら反転ボタンを押す。最後にマシンへ送る。Silhouette Studioでも使える。よくある質問によると、Cricut Joy、Maker、Exploreに対応する。ベクター形式なので、拡大しても品質は落ちない。\n\n【ポイント・注意点】\nライセンスは「個人利用のみ」。手作りの品を人に贈るのは認めているが、デジタルデータそのものの再販や再配布はできない。完成品の販売については、ページに明記がない。メタリックのHTVは製品ごとに圧着の温度や時間が違うため、使う素材の説明書で確かめたい。マグに貼る場合は、食器洗いへの強さも考えて屋外用ビニールを選ぶと長持ちしやすい。","2026-11-23","Crafty Crafter Club","https://crafty-crafter.club/christmas/everything-is-fine-svg-for-cricut/"],["Cricutを始める人へ、公式の入門ガイド（英国版）","Cricut公式ブログの英国版が、初心者向けの入門ガイドを公開した。Design Spaceは対応するWindows・Mac・iOS・Androidで動き、ChromebookとLinuxには対応しない。最初の作品にはビニールのステッカーを勧め、6段階の手順を示す。機種はJoyシリーズからMaker、写真やシール向けのStickerPixまで用途別に紹介する。マットの寸法や、Maker 5が厚さ3mmまで切れることもまとめている。","\n【概要】\nCricut公式ブログの英国版が「How to Get Started with Cricut: A Beginner's Guide」を公開した。初期設定、必要な道具、最初の作品、機種の選び方を順に説明する入門ガイドだ。\n\n【背景】\nCricutは各シリーズのマシンに加え、StickerPixや複数のヒートプレスを出しており、製品が多い。初めての人は何から始めるかで迷いやすい。\n\n【詳細】\nデザインソフトのDesign Spaceは、対応するWindowsとMacのパソコン、iOSとAndroidの端末で動く。ChromebookとLinuxには対応しない。初期設定はcricut.com/setupからDesign Spaceを入れ、アカウントを作るかログインし、機種を選んで接続する。Bluetoothの許可を出し、更新と試し切りを済ませる。StickerPixはインクカートリッジと対応の印刷素材も必要になる。基本の道具は、マシン、対応する刃、Design Spaceの入った端末、素材、飾る対象。最初の作品にはビニールのステッカーを勧め、デザインと寸法決め、カットの準備、カット、カス取り、転写シートとへらでの転写、貼り付けて押さえる、の6段階で説明する。機種は、小さな作品向けのJoyシリーズ、普段使いのExploreシリーズ、刻印や布まで幅広い道具が使えるMakerシリーズ、シールや写真向けのStickerPix PrintとStickerPix Print + Cutを紹介する。ヒートプレスはEasyPress Mini、EasyPress SE、AutoPress、Mug Pressの4つで、布や素地に転写するときだけ必要になる。\n\n【ポイント・注意点】\nDesign Spaceは無料で、Cricut Accessは任意の有料サブスクリプション。AI Project Designerは、無料会員には1回分のAIクレジットが付き、Access会員には毎月クレジットが付く。マットの寸法は、ExploreとMakerが30.5×30.5cmか30.5×61cm、Joyが11.4×16.5cm、Joy Xtraが21.6×30.5cm。Maker 5は、対応素材なら厚さ3mmまで切ったり刻印したりできる。","2026-11-22","Cricut公式ブログ（英国）","https://cricut.com/blog/gb/how-to-get-started-with-cricut/"],["モミの木に乗ったエルフの無料SVG、靴下やマグ、ギフトタグに","Crafty Crafter Clubが、モミの木に乗ったエルフを描いたクリスマス向けの無料SVGを公開した。緑の綿の靴下に赤のグリッター熱転写、ココア用マグに光沢ビニール、アクリルのオーナメントに重ね貼り、ペンで描くカードストックのギフトタグなどを提案する。Design Spaceへの読み込みから反転、カットまでの手順を載せ、Silhouette Studioでも同じように使えるとしている。個人利用は無料で、登録は要らない。","\n【概要】\n無料SVG配布サイトのCrafty Crafter Clubが「Elf Christmas Tree SVG for Cricut」を公開した。モミの木に乗ったエルフを描いたクリスマス向けのカットファイルで、布、陶器、アクリル、紙など、いろいろな素材の作例を添えている。登録なしの無料でダウンロードできる。\n\n【背景】\nエルフはクリスマスの飾りでおなじみのモチーフで、子ども向けの小物にもよく使われる。同サイトは11月下旬にクリスマス向けの無料SVGを続けて公開しており、この柄もその1つだ。1つのデザインでいろいろな作品に使える汎用性を打ち出している。\n\n【詳細】\n提案する作例は6つ。緑の綿の靴下に赤のグリッターHTV、ココア用のマグに光沢の屋外用ビニール、アクリルのオーナメントにビニールを重ね貼り、黒いTシャツか木のサインに白のHTV、ペンで描くカードストックのギフトタグ、エプロンへのアイロン転写。材料の例は、伸縮性のあるストレッチHTV、耐熱の転写テープ、ポリエステルか綿の素地、屋外用ビニール、光沢ビニール、下地を整えるアルコールシート。手順は、ダウンロードしたファイルを解凍し、Design SpaceでSVGを読み込む。HTVなら反転して大きさを整え、画面の案内に従ってマットを入れて切る。記事は、Silhouette Studioでも「同じように」使えるとしている。対応機種はCricut Joy、Maker、Explore。\n\n【ポイント・注意点】\nライセンスは個人利用に限って無料。手作りの品として贈るのは認めているが、データそのものの再販や再配布はできない。このデザインに合うカット設定や刃、マットの指定はページにないので、素材ごとに試し切りで確かめたい。アクリルやマグに貼るときは、アルコールで表面の油分を落としておくと、ビニールがはがれにくくなる。靴下のような伸びる布には、記事が挙げるストレッチHTVのような伸縮する素材が合う。ギフトタグをペンで描く場合は、カットの線と描く線を分けて設定しておきたい。","2026-11-22","Crafty Crafter Club","https://crafty-crafter.club/christmas/elf-christmas-tree-svg-for-cricut/"],["「Santa Disagrees」の無料SVG、サンタが異を唱える皮肉柄","Crafty Crafter Clubが、ユーモアのあるクリスマス向け無料SVG「Santa Disagrees」を公開した。黒いTシャツに白の熱転写で作るセーター、光沢ビニールのマグのセット、金属のオーナメント、ドアや窓のステッカー、手土産にするワインボトルのラベルを提案する。Design Spaceに読み込み、熱転写なら反転して切る。きれいに切るには、刃が鋭くマットの粘着が十分なことを確かめるよう勧める。個人利用のみ。","\n【概要】\n無料SVG配布サイトのCrafty Crafter Clubが「Santa Disagrees SVG for Cricut」を公開した。「サンタは賛成しない」という皮肉の効いたクリスマス向けのデザインで、衣類や雑貨、手土産のラベルなどに使える。個人利用なら無料でダウンロードできる。\n\n【背景】\nホリデーシーズンは、集まりに持っていく手土産や、仲間内で着るおもしろセーターの需要が高まる。同サイトは「Funny SVG」というユーモア柄の分類を設けていて、この作品もその流れにある。11月下旬に公開した一連のクリスマス向け無料SVGの1つでもある。\n\n【詳細】\n提案する作例は、黒いTシャツに白のHTVで作るおもしろセーター、光沢の屋外用ビニールを貼った季節のマグのセット、トートバッグ、金属製の吊り下げオーナメント、ドアや窓に貼るビニールのステッカー、手土産にするワインボトルのラベル。材料の例は、EasyWeedのHTV、綿のTシャツかスウェット、耐熱テープ、ミニヒートプレス、光沢の屋外用ビニール、陶器のマグの素地、転写シート、へら。手順は、ファイルを解凍してDesign Spaceに読み込み、大きさを整え、HTVなら反転して切る。記事は、きれいに切るために刃が鋭いこととマットの粘着が十分であることを確かめるよう勧めている。Silhouette Studioでも使える。\n\n【ポイント・注意点】\nライセンスは他の作品と同じで、よくある質問に「個人利用のみ」と書かれている。データの再販や再配布はできず、完成品の販売の可否はページに書かれていない。切り口が荒れるときは、刃の摩耗やマットの粘着の低下を疑うとよい。ページには「My Cricut is Not Cutting Correctly」というカットの不具合を扱う記事へのリンクもある。ワインボトルのラベルにする場合は、結露や水に強い屋外用ビニールが向いている。金属のオーナメントに貼るときは、表面の汚れを落としてから貼ると密着しやすい。","2026-11-21","Crafty Crafter Club","https://crafty-crafter.club/christmas/santa-disagrees-svg-for-cricut/"]],"uv":[["京都ステッカー、UVDTFとカッティングステッカーの違いを比較","京都ステッカーは2026年11月26日、UVDTFステッカーとカッティングステッカーの違いと、用途別の選び方を解説する記事を公開した。UVDTFはUV硬化インクで透明PETフィルムに印刷するステッカーで、白インクに対応したフルカラーでフチなしに仕上がる。カッティングステッカーは見積システムがAIデータの入稿に対応する点を特徴に挙げる。どちらも1枚から作れ、記事では参考料金、納期、食洗機での耐久テストの結果もあわせて紹介している。","\n【概要】京都ステッカーは2026年11月26日、ブログ記事「【徹底比較】UVDTFとカッティングステッカーの違い！用途別の選び方」を公開した。UVDTFステッカーとカッティングステッカーの特徴、向いている用途、料金の目安、入稿の条件を比べて整理している。\n\n【背景】UVDTFは、UV硬化インクで透明PETフィルムに印刷したステッカーである。印刷済みのものを貼るだけで直接印刷したような見た目になり、使う側はUVプリンターを持たなくてよい。記事によると、入稿はPNG・JPGで、解像度は300DPI以上を推奨する。カッティングステッカーについては、見積システムがAIデータ（Illustrator形式）の入稿に対応した点を特徴に挙げている。どちらも1枚からの小ロット製作に対応する。\n\n【詳細】UVDTFは高精細なフルカラーで白インクに対応し、フチなしで仕上がる。UV硬化インクにより水・擦れ・紫外線に強く、屋外使用や食洗機での洗浄にも耐えるとしている。施工は、台紙を剥がして貼り、転写シートを剥がすだけである。用途の例には、飲食店のビールグラスやジョッキ、ショーウィンドウ、スマホケース、タンブラー、PC、文房具、工事現場のヘルメットや工具の識別ラベル、食洗機対応のお名前シールなどを挙げる。貼れる素材はガラス、金属、プラスチック、木材、陶器。参考料金（税別）は、50mm×50mmが10枚1,080円〜、50枚4,200円〜、100枚7,200円〜。100mm×100mmは10枚2,700円〜、50枚10,500円〜、100枚18,000円〜である。納期は、無料の通常スピードが決済後2〜4営業日以内の発送、有料の特急スピードが1〜2営業日以内の発送となる。\n\n【ポイント・注意点】印刷はCMYK＋ホワイトで、金・銀インク、メタリック、箔押し、鏡面表現には対応しない。金銀は色の表現で代用する。食洗機については、家庭用食洗器で100回程度洗っても剥がれなかったという同店のテストを紹介する一方、デザインによっては剥がれるとしている。貼った後すぐに洗わず、24〜72時間の定着期間を置くよう勧めている。料金はデータの種類やオプションで変わり、税別10,000円以上で送料無料、製作実績の掲載許可で10%引きになるプランもある。","2026-11-26","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/26/24347/"],["京都ステッカー、推し活グッズ向けUVDTFの作り方と入稿条件","京都ステッカーは2026年11月26日、推し活グッズを自作する方法として、UVDTFステッカーの作り方と1枚からの料金・仕様をまとめた記事を公開した。UVプリンターがなくても、印刷済みのステッカーを貼るだけで直接印刷したような仕上がりになると説明する。スマホケースやタンブラーなどへの活用例、PNG・JPGでの入稿条件、貼り方の手順、食洗機テストの結果と定着期間の注意も載せている。","\n【概要】京都ステッカーは2026年11月26日、ブログ記事「【推し活グッズ自作】UVDTFステッカーの作り方！1枚からの料金と仕様」を公開した。推し活グッズを自分で作りたい人に向けて、UVDTFステッカーの特徴、料金、入稿の条件、貼り方をまとめている。\n\n【背景】UVDTFステッカーは、UV硬化インクで印刷したステッカーを対象物に貼る方式である。記事は、UVプリンターがなくても、印刷済みのステッカーを貼るだけで直接印刷したような仕上がりのグッズが作れる点を強調している。同店は11月に入ってUVDTFの解説記事を続けて公開しており、今回は推し活という用途に絞った内容になっている。\n\n【詳細】特徴として、高精細なフルカラー、白インク対応による透明・暗色素材での発色、フチなしの仕上がり、UV硬化インクによる耐久性・耐水性・耐候性を挙げる。貼れる素材はガラス、金属、プラスチック、木材、陶器で、活用例はスマホケース、タンブラー・マグカップ、PC・文房具である。参考料金（税別）は、50mm×50mmが10枚1,080円〜、50枚4,200円〜、100枚7,200円〜。100mm×100mmは10枚2,700円〜、50枚10,500円〜、100枚18,000円〜。製作実績の掲載許可で10%引き、税別10,000円以上で送料無料となる。納期は、無料の通常スピードが決済後2〜4営業日以内、有料の特急スピードが1〜2営業日以内の発送である。入稿はPNG・JPGで、解像度300DPI以上を推奨する。貼り方は、台紙を剥がして貼り、スキージーなどで密着させてから、転写シートをゆっくり剥がす手順を案内している。\n\n【ポイント・注意点】印刷はCMYK＋ホワイトインクで、金・銀インク、メタリック、箔押し、鏡面表現には対応しない。食器に貼って家庭用食洗機で100回程度洗っても剥がれなかったという同店のテスト結果を紹介する一方、デザインによっては剥がれる場合があるとしている。貼った後は24〜72時間の定着期間を置くよう勧めている。コップやボトルのような緩やかな曲面にも貼れ、注文は1枚から受け付ける。WEB見積もりでは画像をアップロードしてサイズ・数量・オプションを選ぶと見積が表示され、見積書PDFもダウンロードできる。納期はデザイン確認後の目安で、繁忙期は前後する。","2026-11-26","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/26/24397/"],["英Imagink、アグフアのハイブリッドUV機導入で売上ほぼ倍増","英国メードストンの印刷会社Imaginkは、2024年に導入したアグフアのハイブリッドUVインクジェット機「Jeti Tauro H3300 UHS」により、売上が2年で200万ポンド近くから400万ポンド近くに伸びたと、Large Format Reviewが2026年11月26日に報じた。最大3.2m幅の印刷が可能になり、工事現場の仮囲いなど大型の仕事を受注できるようになった。人員を増やさずに売上を伸ばした点も紹介している。","\n【概要】Large Format Reviewは2026年11月26日、英国ケント州メードストンの印刷会社Imaginkが、アグフアのハイブリッドUVインクジェットプリンター「Jeti Tauro H3300 UHS」の導入後に売上をほぼ倍増させたと報じた。同社は2024年にこの機械を導入し、売上は2年で200万ポンド近くから400万ポンド近くに伸びたという。\n\n【背景】Imaginkは1999年創業の家族経営の会社で、店頭販促（POP）用のグラフィックを主な仕事としてきた。現在は工事現場の仮囲い（ホーディング）やビニールグラフィックへと事業を広げている。導入前は1.6m幅のロールまでしか印刷できず、大きな仕事は価格面で競争できなかった。\n\n【詳細】記事は、Jeti Tauro H3300 UHSを「超高速のハイブリッドUVインクジェットプリンター」と紹介している。4〜7色の構成で、白とプライマーを選べる。最大905平方メートル毎時で印刷でき、厚紙などに使える延長バキュームベッドを備える。印刷幅は最大3.2mである。オーナーのMike Saunders氏は、この速さによって、以前は競争力のある価格を出せなかった大型の仮囲いの仕事を取れるようになったと述べている。アグフアのJames Argent氏は、この機械が1人のオペレーターで2交代制で稼働していると説明した。Imaginkはほかにもアグフアの「Anapurna Ciervo H3200」と、LEDフラットベッドの「Anapurna FB2540i」を使っている。\n\n【ポイント・注意点】記事によると、Imaginkは人員を同じ水準に保ったまま売上を伸ばした。高速・広幅のUV機に入れ替えたことで、作業量を増やすより、受けられる仕事の種類と大きさを広げたことが成長の要因として描かれている。UVプリンターの導入効果を考えるうえで、印刷幅や速度が受注できる案件の範囲を左右することを示す事例といえる。ただし、売上の数値は記事内で「近く」と表現された概算であり、利益や投資額は示されていない。この記事は機器メーカーの担当者のコメントも含む導入事例紹介である点にも留意したい。","2026-11-26","Large Format Review","https://www.largeformatreview.com/hardware/wide-format-print/agfa-jet-tauro-h3300-uhs-imagink/"],["NUtec、ミマキ製UVプリンター向けの代替ハイブリッドインク発売","南アフリカのNUtec Digital Inkは、ミマキの一部プリンター向けの代替インクとして、UV硬化型ハイブリッドインク「Ruby R15-ELS-MI」を発売したと、Signs of the Timesが2026年11月26日に報じた。LED-UV硬化に最適化し、UJV、UCJV、JFX、UJFの各シリーズに対応する。CMYKに淡色、白、クリアを加えた構成で、密着の難しい素材向けのプライマーも用意する。価格は示されていない。","\n【概要】Signs of the Timesは2026年11月26日、南アフリカ・ケープタウンのNUtec Digital Inkが、UV硬化型ハイブリッドインク「Ruby R15-ELS-MI」を発売したと報じた。ミマキの一部プリンター向けの代替インクとして開発された製品で、同社のプレスリリースに基づく記事である。\n\n【背景】UVプリンターを使い続けるうえでは、インクの調達も費用の一部となる。今回のインクは、すでにミマキ製の機械を持っている印刷会社に向けて、純正インク以外の選択肢を用意するものである。NUtecの営業・マーケティング担当のDarren Claassens氏は、既存のミマキ機をより生かせる柔軟性と、よりコスト効率の高いインクの選択肢を顧客に提供すると述べている。\n\n【詳細】Ruby R15-ELS-MIはLED-UV硬化に最適化されており、硬い素材にも柔らかい素材にも使えるとしている。対象素材として、Correx（プラダン）、PVC板、アルミ、アクリル、板紙、粘着ビニール、PVCバナー、メッシュを挙げる。ミマキのロールツーロール機、ハイブリッド機、フラットベッド機の一部に対応し、UJV、UCJV、JFX、UJFの各シリーズが含まれる。色はCMYK、ライトシアン、ライトマゼンタ、白、クリアニスで、密着しにくい表面向けに専用のプライマーも用意する。記事によると、インクはSVHC（高懸念物質）とCMR物質を含まない。詳細はNUtecのウェブサイトで案内している。\n\n【ポイント・注意点】対応するのは「一部の」ミマキ機であり、全機種で使えるわけではない。自社の機種が対象かどうかは、切り替える前に確認しておきたい。記事に価格は示されておらず、どれだけコストが下がるかも数字では分からない。純正以外のインクを使うと、メーカーの保守や保証の扱いが変わる可能性もあるため、導入前に条件を確かめる必要がある。サイン・ディスプレイ用途でミマキのUV機を使う事業者にとっては、インク調達の選択肢が増えるニュースである。","2026-11-26","Signs of the Times","https://signsofthetimes.com/nutec-digital-ink-releases-ruby-r15-els-mi/"],["Procolored、ブラックフライデーでUV・UV DTF機を12%引き","DTFとUV印刷機を扱うProcoloredは2026年11月25日、ブラックフライデーのセール内容を発表した。11月27日から30日まで、対象のUVプリンターとUV DTFプリンターを12%値引きする。キャンペーン全体は11月19日から30日までで、割引の総額は最大1,400ドル。新しいDTF機「F13 X」の特別価格や消耗品の割引、前半期間のUVインク進呈なども含まれる。","\n【概要】DTFとUV印刷の機器を扱うProcoloredは2026年11月25日、2026年のブラックフライデーのセール内容をAB Newswireで発表した。キャンペーンは11月19日から30日までで、11月27日から30日が「Black Friday Mega Sale」となる。割引の総額は最大1,400ドルとしている。\n\n【背景】Procoloredは、DTFプリンターとUVプリンターを中心に、インクなどの消耗品まで扱う機器メーカーである。今回の発表は、新しいDTF機と既存のUV機、消耗品をまとめてブラックフライデーの期間に売り込む内容となっている。\n\n【詳細】UV機については、11月27日から30日まで、対象のUVプリンターとUV DTFプリンターを12%値引きする。中心となるのは、A3サイズで2つのヘッドを持つ新しいDTF機「F13 X」で、セール期間中は2,899ドル（通常の先行販売価格は2,999ドル）となる。12か月のヘッド保証に6か月の延長が付き、ヘッドの無償交換が1回含まれる。延長保証は購入後3か月以内に公式サイトで登録して有効にする必要がある。DTF機「K13 Lite」は11月27日から1,699ドルが1,599ドルになり、この価格はセール終了後も続く。消耗品は11月19日から30日まで、150ドル以上で20ドル引きから500ドル以上で100ドル引きまでの段階的な割引がある。11月19日から26日の前半期間には、UV機「V1 Pro」の購入者に500mlのUVインク5本を付けるなどの特典があった。\n\n【ポイント・注意点】UV機の12%引きは「対象機種」に限られ、発表文では具体的な機種名と価格は示されていない。購入前に公式ストアで対象と価格を確かめる必要がある。会員ポイント2倍と50ドルのギフトカードは、2026年12月25日に付与される予定とされる。この発表は企業のプレスリリースであり、掲載サイトは内容について責任を持たないと断っている。価格はいずれも米ドル建てで、日本での販売条件は別に確認したい。","2026-11-25","FinancialContent（AB Newswire）","https://www.financialcontent.com/article/abnewswire-2026-11-25-procolored-announces-2026-black-friday-sale-with-up-to-1400-in-savings"],["京都ステッカー、アプリで作るUVDTFデザインのコツと入稿条件","京都ステッカーは2026年11月24日、スマホやPCのアプリでUVDTFステッカーのデザインを作り、入稿するときのコツと条件を解説する記事を公開した。入稿はPNGかJPGで解像度300DPI以上を推奨し、印刷はCMYK＋ホワイトで行う。アプリで金色や銀色を使うと「金色風・銀色風」の色として出力される点など、データ作成時の注意をまとめ、参考料金や納期も載せている。","\n【概要】京都ステッカーは2026年11月24日、ブログ記事「【UVDTFステッカー】アプリでのデザイン作成のコツと入稿条件」を公開した。スマホやPCのアプリでデザインを作ってUVDTFステッカーを注文したい人に向けて、データの形式や表現できる色の範囲などを説明している。\n\n【背景】UVDTFステッカーは、UV硬化インクで印刷したステッカーを貼って使う方式で、UVプリンターを持っていなくても直接印刷に近い仕上がりが得られる。専用のデザインソフトを使わず、身近なアプリでデータを作る人も多い。そのため、仕上がりで失敗しないための入稿条件を知っておくことが大切になる。\n\n【詳細】入稿ファイルはPNGまたはJPGで、推奨解像度は300DPI以上である。解像度が低いと仕上がりが粗くなる場合があるとしている。印刷はCMYK＋ホワイトインクで行い、金・銀インク、メタリック、箔押し、鏡面表現には対応しない。アプリで金色や銀色を使った場合は、データ上の「金色風・銀色風」の色として出力される。白インクに対応しているため、透明や暗い色の素材にも発色し、フチなしで仕上がる。見積はWEB見積システムで画像をアップロードし、サイズ・数量・オプションを選ぶと表示され、見積書PDFもダウンロードできる。注文は24時間受け付け、1枚から対応する。参考料金（税別）は、50mm×50mmが10枚1,080円〜、50枚4,200円〜、100枚7,200円〜。100mm×100mmは10枚2,700円〜、50枚10,500円〜、100枚18,000円〜である。\n\n【ポイント・注意点】料金は入稿データの種類や個別カットなどのオプションで変わる。税別10,000円以上で送料無料、製作実績の掲載許可で10%引きになる。納期は、無料の通常スピードが決済後2〜4営業日以内、有料の特急スピードが1〜2営業日以内の発送である。耐久性については、食洗機で100回程度洗っても剥がれなかったという同店のテストを紹介しつつ、デザインによっては剥がれる場合があるとしている。コップやボトルなどの曲面にも貼れる。金属的な光沢が必要なデザインは、別の加工方法を検討する必要がある。","2026-11-24","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/24/24258/"],["英China Print Supplies、2連3.2m幅UV機の展示協力先を募集","英国のChina Print Supplies UKは、2台の3.2m幅UVプリンターを1台にまとめたHapond「UP3321D」について、英国内で展示協力先となる印刷会社1社を募集している。協力先は希望小売価格11万5,000ポンド（税別）の機械を7万5,000ポンド（税別）で導入でき、4万ポンド安くなる。代わりに12か月で3回の動画取材への協力などが条件となる。TEXINTELが2026年11月23日に掲載した。","\n【概要】英国オズウェストリのChina Print Supplies UK Ltdは、Hapond製のUVプリンター「UP3321D」の英国での展示協力先（ショーケース・パートナー）を募集している。TEXINTELが2026年11月23日にプレスリリースとして掲載した。選ばれた1社は、希望小売価格11万5,000ポンド（税別）の機械を7万5,000ポンド（税別）で導入でき、4万ポンドの割引となる。\n\n【背景】記事は同社を「エンジニアリング主導」の会社と紹介しており、機械を売るだけでなく、生産設備一式の設置・設定・サポートまで行うとしている。新しい機種を市場に広めるため、実際に使う会社の事例を宣伝に使う狙いがある。\n\n【詳細】UP3321Dは、3.2m幅のUVプリンター2台を1台にまとめた構成である。両面のバナーやバックライト用の素材を、素材を載せ直したり位置合わせをやり直したりせずに1回の工程で印刷できるという。また、2つの別々の仕事を同時に流すこともでき、1人のオペレーターで6.4m分のUV印刷の能力が得られるとしている。協力先は割引の見返りとして、12か月の間に同社との3回の動画インタビューに参加する。さらに、稼働中の機械の写真や動画、完成した仕事の見本をマーケティング用に提供し、同社がそれらを自社のチャネルで使うことを認める必要がある。同社は、協力先の事業や技術、仕事を自社の顧客や業界誌に向けて紹介し、全国的な知名度につなげるとしている。\n\n【ポイント・注意点】募集は1社のみで、記事には応募の締め切りや具体的な選考基準は書かれていない。関心のある会社には、応募の手続きと協力の条件について問い合わせるよう呼びかけている。割引額は大きいが、1年にわたる宣伝への協力が条件となるため、自社の情報や現場の公開に抵抗がないかを考える必要がある。広幅のUV機で両面印刷や2つの仕事の同時処理を求める大判印刷会社にとって、導入費を抑える一つの方法となる。価格はいずれも英ポンド建てで、付加価値税は含まれていない。","2026-11-23","TEXINTEL","https://www.texintel.com/press-room/chinaprintsupplies-11-26-ph-china-print-supplies-uk-ltd-seeks-uk-showcase-partner-for-hapond-up3321d-offering-40000-saving"],["英Signs Express、ミマキのUVフラットベッド機に入れ替え","英国のSigns Express Central Lancashire and Southportは、6年間使ったフラットベッド機の後継として、ミマキのUV LEDフラットベッド機「JFX200-2513 EX」をCMYUKから導入した。Large Format Reviewが2026年11月23日に報じた。HP機や上位の「JFX220-2515」も検討したうえで、仕事量と価格の釣り合いから選んだ。伸びるインク「LUS 120」を使う。","\n【概要】Large Format Reviewは2026年11月23日、英国プレストンのSigns Express Central Lancashire and Southportが、ミマキのUV LEDフラットベッドプリンター「JFX200-2513 EX」を販売店のCMYUKから導入したと報じた。6年間生産を支えてきた機械の入れ替えである。\n\n【背景】同店はフランチャイズで、記事によると50.41%の成長を記録し、この2年でほぼすべての生産設備を入れ替えてきた。代表のMatt Rutlidge氏は、同社に20年近く勤めたのち、2023年にこのフランチャイズを買い取った。\n\n【詳細】選定ではHPのフラットベッド機も比べたが、設置面積が大きいことと、形のある板に印刷するときに型（テンプレート）が要ることから、ミマキを選んだ。2026年に出た次世代機「JFX220-2515」も検討したが、生産性、多用途性、価格の釣り合いでJFX200-2513 EXの方がよいと判断した。Rutlidge氏は、フラットベッド機は1日8時間ほど稼働しているものの、より速いJFX220を十分に使うだけの仕事量はないと話している。インクはミマキの「LUS 120」で、CMYKに白とクリアを使う。記事によると、このインクは硬化後に最大170%伸びるため、曲げたり成形したりする材料に向く。必要な印刷品質は8パスで得られたという。前の機械は新しい機械が届く少し前に引き取られた。記事では、大きな仕事の途中でカッティングプロッターが故障した際、CMYUKが翌日に代わりのGraphtec製プロッターを届けた話も紹介している。\n\n【ポイント・注意点】この事例は、最新・最速の機種ではなく、自社の仕事量に合った機種を選んだ点が特徴である。UVプリンターを入れ替える際には、速度だけでなく、稼働時間や設置スペース、型の要否、インクの特性も比べる必要があることがわかる。Rutlidge氏は今後も設備と人への投資を続け、入居している建物の購入も目指すとしている。記事は販売店側のコメントも含む導入事例である。","2026-11-23","Large Format Review","https://www.largeformatreview.com/hardware/wide-format-print/signs-express-mimaki-jfx200-2513-ex-cmyuk/"],["京都ステッカー、UVDTFの耐久性と食洗機対応、剥がれない貼り方","京都ステッカーは2026年11月23日、UVDTFステッカーの耐久性と食洗機への対応、剥がれにくい貼り方を解説する記事を公開した。UV硬化インクのため水・擦れ・紫外線に強く、家庭用食洗機で100回程度洗っても剥がれなかったという同店のテストを紹介する。一方で、デザインによっては剥がれるため事前に試すことと、貼った後に最低24〜72時間の定着期間を置くことを勧めている。","\n【概要】京都ステッカーは2026年11月23日、ブログ記事「【1枚から】UVDTFステッカーの耐久性と食洗機対応！剥がれない貼り方」を公開した。UVDTFステッカーがどの程度もつのか、食器に貼って洗えるのか、どう貼れば剥がれにくいのかを説明している。\n\n【背景】UVDTFステッカーは、UV硬化インクで印刷したステッカーを対象物に貼る方式で、UVプリンターを持たなくても直接印刷のような仕上がりになる。マグカップやタンブラーなど、日常的に洗う物に貼りたいという需要があり、耐久性は利用者が最も気にする点の一つである。\n\n【詳細】記事は、UV硬化インクを使っているため、水・擦れ・紫外線に強く、屋外での使用や食洗機での洗浄にも耐えるとしている。同店のテストでは、食器に貼って家庭用食洗機で100回程度洗っても剥がれず、食洗機程度の熱にも耐えたという。貼り方は、台紙を剥がして対象物に貼り、スキージーなどで密着させ、転写シートを剥がす手順である。対応素材はガラス、金属、プラスチック、木材、陶器で、コップやボトルのような緩やかな曲面にも貼れる。仕様はCMYK＋ホワイトで、金・銀インク、メタリック、箔押し、鏡面表現には対応しない。参考料金（税別）は、50mm角が10枚1,080円〜、50枚4,200円〜、100枚7,200円〜。100mm角は10枚2,700円〜、50枚10,500円〜、100枚18,000円〜である。\n\n【ポイント・注意点】最も大切なのは、貼った直後に洗わず、最低24〜72時間の定着期間を置くことだとしている。また、デザインによっては剥がれる場合があるため、事前に試すよう勧めている。100回の洗浄はあくまで同店のテスト結果であり、すべての条件で同じ結果になるとは限らない。税別10,000円以上で送料無料、製作実績の掲載許可で10%引きになる。納期は、無料の通常スピードが決済後2〜4営業日以内、有料の特急スピードが1〜2営業日以内の発送である。1枚から注文でき、個人の少量の注文も受け付けている。","2026-11-23","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/23/24181/"],["印刷業界週報、ミマキのUV式3D機とDominoの白インク対応","プリントヘッド販売のAllprintheadsは2026年11月22日、11月16〜22日の印刷業界の動きをまとめた週報を公開した。UV関連では、ミマキがFormnext 2026で発表したUV硬化インクジェット方式のフルカラー3Dプリンター「3DUJ-553MkII」と、DominoがK300に白インクを加えたことを取り上げた。K300ではUV LED硬化などの関連オプションも紹介している。","\n【概要】プリントヘッドを販売するAllprintheadsは2026年11月22日、週報「What Moved in Print This Week（November 16 – 22, 2026）」を公開した。その週の印刷業界のニュースを項目ごとにまとめ、それぞれにプリントヘッドの観点からの短い解説と製品へのリンクを付けている。UVプリンターに関わる話題は2件あった。\n\n【背景】UVインクジェットは、看板や販促物、パッケージに加え、立体物の造形やラベルの印字にも使われている。業界の週報は、メーカーの発表を横断的に追うのに役立つ。\n\n【詳細】1件目は、11月17日にドイツ・フランクフルトのFormnext 2026で発表されたミマキの「3DUJ-553MkII」である。フルカラーの3Dプリンターで、記事は樹脂を噴射してUVで硬化させ、1層ずつ積み重ねる方式と説明している。色域は従来の3DUJ-553の約1.4倍広いとされる。色を付けるのは外側の面だけで、内部には安価な充填材を使う。「Smart Relay」機能で次の造形を待機させられる。2件目は11月19日の話題で、DominoがK300に白インクを追加し、黒、白、黒と白の組み合わせで提供するようになった。関連するオプションとして、プラズマによる前処理、UV LED硬化、R-Seriesの検査システムを挙げている。週報はほかに、Dantexのラベル機の出荷、上海で11月24日まで開かれるITMA ASIA + CITME 2026（出展者1,950社以上）、Siegwerkの水性インクなども扱っている。\n\n【ポイント・注意点】この週報はプリントヘッドの販売店が発行しているため、各項目の最後で自社の取り扱い製品を紹介している。サイドバーには「Epson I3200-U1」（1,390ドル）などのUV向けヘッドが載るが、これは商品の掲載でありニュースではない。3DUJ-553MkIIはUVの技術を使うものの、平面に印刷するUVプリンターではなく3Dプリンターである点に注意したい。週報は短い要約が中心のため、価格や発売時期などの詳細はメーカーの発表で確かめる必要がある。","2026-11-22","Allprintheads","https://www.allprintheads.com/blogs/news/allprintheads-industry-news-what-moved-in-print-this-week-november-16-22-2026"],["京都ステッカー、UVDTFでグッズ販売する際の料金と仕様","京都ステッカーは2026年11月20日、オリジナルグッズを販売したい人に向けて、UVDTFステッカーの仕様、料金、入稿条件を解説する記事を公開した。企業ロゴを使ったノベルティや販促品、スマホケースやタンブラーなどの販売用グッズに使えるとしている。食洗機テストの結果を示す一方、デザインによっては剥がれるため、販売用に使う場合は事前に試すよう勧めている。注文は1枚から受け付ける。","\n【概要】京都ステッカーは2026年11月20日、ブログ記事「【1枚から】UVDTFステッカーでオリジナルグッズ販売！料金と仕様」を公開した。グッズを作って売りたい個人や企業に向けて、UVDTFステッカーの仕組み、使える素材、料金、納期、入稿の条件をまとめている。\n\n【背景】UVDTFは、UV硬化型インクで透明PETフィルムに印刷したステッカーで、印刷済みのものを貼るだけで施工できる。UVプリンターを自分で用意する必要がない。記事は、企業ロゴやキャンペーンのデザインを使ったノベルティ・販促品や、スマホケース・タンブラーなどの販売用グッズに使えるとしている。\n\n【詳細】貼れる素材はガラス、金属、プラスチック、木材、陶器などで、コップやボトルのような緩やかな曲面にも問題なく貼れるとする。UV硬化インクにより、水・擦れ・紫外線に強く、屋外での使用にも耐えるという。印刷は写真やグラデーションも再現する高精細なフルカラーで、白インクに対応する。参考料金（税別）は、50mm×50mmが10枚1,080円〜、50枚4,200円〜、100枚7,200円〜。100mm×100mmは10枚2,700円〜、50枚10,500円〜、100枚18,000円〜である。税別10,000円以上で送料無料、製作実績の掲載許可で10%引きのプランもある。納期は、無料の通常スピードが決済後2〜4営業日以内、有料の特急スピードが1〜2営業日以内の発送。入稿はPNG・JPGで、推奨解像度は300DPI以上。WEB見積システムは24時間使え、見積書PDFもダウンロードできる。\n\n【ポイント・注意点】食器に貼って家庭用食洗器で100回程度洗っても剥がれなかったという同店のテストを紹介しているが、デザインによっては剥がれる場合がある。スキージーなどでしっかり密着させ、貼った後すぐに洗わず、最低24〜72時間の定着期間を置くよう案内している。販売用に使う場合は、事前に試すことを勧めている。印刷はCMYK＋ホワイトで、金・銀インク、メタリック、箔押し、鏡面表現には対応せず、金銀はデータ上の色に似せた表現になる。最小ロットは1枚である。","2026-11-20","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/20/24063/"],["オリジナルプリント.jp、UV印刷のアクリルコースター14種を発売","イメージ・マジックが運営する「オリジナルプリント.jp」は2026年11月20日、ラメやホログラム、蓄光、ミラーなどの特殊アクリルにフルカラー印刷できる「アクリルコースター」全14種の発売を発表した。印刷方法はUV硬化インクジェットプリント（白引きあり）で、1点から注文できる。価格は税込1,078円から。ブラウザ上のデザインツールで写真やロゴを配置して作れる。","\n【概要】株式会社イメージ・マジックが運営するオリジナルグッズ制作サイト「オリジナルプリント.jp」は2026年11月20日、PR TIMESで「フルカラー印刷 アクリルコースター」全14種類の発売を発表した。特殊なアクリル素材に、オリジナルのイラストや写真をフルカラーで印刷できる。\n\n【背景】UVインクジェット印刷は、アクリルのような印刷しにくい素材にも直接フルカラーで印刷でき、版がいらないため1点からの小ロットにも向く。推し活グッズやギフト、クリエイターの物販、企業の販促品など、少量でも作りたいという需要に応える商品である。\n\n【詳細】形は角形と円形の2種類で、素材は「水玉ラメ」「ゴールドラメ」「キラキラホログラム」「シルバーホログラム」「蓄光」「ミラー」「ホログラム」の7種類。組み合わせで計14種類となる。商品概要によると、印刷方法はUV硬化インクジェットプリント（白引きあり）、価格は税込1,078円から（1点注文時、プリント代込みの価格例）、最小ロットは1点である。1点ずつOPP袋で個包装して届ける。大ロットにも対応し、出荷の目安は約1週間としている。専用の「デザインツール」を使えば、ブラウザ上で写真やロゴをアップロードし、プレビューを見ながらレイアウトできる。Illustratorなどで作った完全データの入稿にも対応する。イメージ・マジックは東証グロース上場（証券コード7793）で、1995年5月設立、本社は東京都文京区にある。\n\n【ポイント・注意点】発表文の中では販売開始日の記載が一致していない。本文の冒頭では2026年11月16日（月）から販売開始としているが、商品概要では発売日を2026年11月19日（木）としている。注文する際はサイトで最新の情報を確かめたい。価格はあくまで1点注文時の例で、素材や数量によって変わる可能性がある。白引きに対応しているため、ホログラムやミラーのような透明・光る素材でも色が沈みにくい点が、UV印刷を使った商品としての特徴といえる。用途に合わせて素材を選べる点も強みである。","2026-11-20","PR TIMES（イメージ・マジック）","https://prtimes.jp/main/html/rd/p/000000199.000085001.html"]],"risk":[["福岡市で6歳女児が路線バスにはねられけが　前輪に足を挟まれ救助","2026年11月26日午後5時15分ごろ、福岡市早良区有田で、6歳とみられる女の子が西鉄の路線バスにはねられる事故があった。「バスの前輪に6歳の女の子が足を挟まれた」と救急通報があり、女の子は救助された後、意識がある状態で病院に運ばれた。足などをけがしたものの軽傷とみられる。警察が当時の状況を詳しく調べている。日が短くなる時期の夕方に起きた、子どもの歩行中の事故として注意が必要だ。","\n【概要】11月26日夕方、福岡市早良区で6歳とみられる女の子が路線バスにはねられる事故があった。RKB毎日放送によると、女の子は救助された後、意識がある状態で病院へ運ばれ、足などにけがをしたものの軽傷とみられている。女の子をはねたのは西鉄の路線バスで、警察が事故当時の状況を詳しく調べている。\n【背景】事故の通報があったのは26日午後5時15分ごろだった。早良区有田にいた人から、バスと歩行者の事故で「バスの前輪に6歳の女の子が足を挟まれた」という内容の救急通報があった。日没が早まるこの時期の夕方は、帰宅や買い物などで人と車の動きが重なりやすく、子どもが外を歩く機会も少なくない時間帯である。大型の路線バスと小さな子どもの歩行者との接触は、状況によっては重大な結果につながりかねない。\n【詳細】警察と消防によると、女の子はバスの前輪に足を挟まれた状態から救助され、その後、意識がある状態で病院に運ばれた。けがは足などで、軽傷とみられるという。女の子がどのような状況で道路にいたのか、バスがどのような動きをしていたのかといった詳しい経緯は、記事の時点では明らかにされていない。警察が運転手らから話を聞くなどして、当時の状況を詳しく調べている。\n【ポイント・注意点】今回は軽傷とみられているが、大型車両と子どもの事故はひとつ間違えば命に関わるおそれがある。バスやトラックのように車体が大きな車は、運転席から車体のすぐ近くや足元付近が見えにくい場合があり、背の低い子どもは見落とされやすいことを、大人がまず意識しておきたい。家庭では、大きな車のそばに近づかない、止まっている車の前や後ろを横切らない、道路を渡るときは必ず立ち止まって左右を確認する、といった基本的な約束を、通学路や近所の道など具体的な場所に即して繰り返し確認しておくことが大切だ。夕方は周囲が暗くなり始めるため、明るい色の服や反射材を身につけ、ドライバーから見つけてもらいやすくする工夫も役立つ。事故の原因は調べが続いており、今後の続報にも注目したい。","2026-11-26","Yahoo!ニュース（RKB毎日放送）","https://news.yahoo.co.jp/articles/72658d18c8b4df7f1aea4830895abd0576b5512f"],["妊婦と新生児にはしかの危険　米で妊婦112人・先天性はしか13人","米ジョンズ・ホプキンス大公衆衛生大学院のウィリアム・モス教授が、2025〜26年の米国のはしか大流行で妊婦112人がはしかにかかり、赤ちゃん13人が先天性はしかになったとする米CDCの報告を解説した。妊婦の約4分の1が出産以外の理由で入院し、11人が肺炎を発症した。新生児は脳炎や致死的な神経疾患SSPEの危険もある。妊娠中はMMRワクチンを打てないため、妊娠前の接種と周囲の人の接種が重要だという。","\n【概要】米ジョンズ・ホプキンス大学ブルームバーグ公衆衛生大学院のウィリアム・モス教授が、同校のポッドキャスト「Public Health On Call」の11月25日の回で、はしかの流行が妊婦と新生児に及ぼす危険について解説した。News-Medicalが同校の記事として11月26日に掲載した。米疾病対策センター（CDC）が医学誌「New England Journal of Medicine Evidence」に発表した報告では、2025年と2026年の米国の大規模流行に関連して、妊婦112人のはしかと、赤ちゃん13人の先天性はしかが確認された。\n【背景】モス教授によると、米国ではこの年に6000人を超えるはしか患者が報告され、汎米保健機構（PAHO）は11月17日に米国がはしかの排除状態を失ったと発表した。CDCによれば米国の患者の約41％は成人で、ペンシルベニア州では3分の2以上が18歳以上だった。妊娠中のはしかは、出産以外の理由での入院、肺炎、死亡のリスクを高めるとされる。先天性はしかは、ウイルスが母親の胎内で胎児に移ることで起こる。\n【詳細】CDCの報告では、妊婦のほぼ4分の1が出産以外の理由で入院し、112人のうち11人（約10％）が肺炎を発症した。妊娠中の感染には死産、流産、早産の危険もある。1989〜91年の米国の流行では、はしかにかかった妊婦は入院が2倍、肺炎が3倍、死亡が6倍多かった。先天性はしかの乳児は発熱や発疹を示し、脳炎や、まれで進行性の、多くは致死的な神経疾患である亜急性硬化性全脳炎（SSPE）の危険が高い可能性がある。\n【ポイント・注意点】MMRワクチンは弱毒生ワクチンのため妊娠中には接種できず、妊娠前に接種しておく必要がある。予防的に免疫グロブリンの静脈投与が使われ、妊娠後期の終わりや出産直前に母親がはしかにかかった場合は、胎内でさらされた新生児にも出生時の投与が勧められる。妊婦は家族や友人など身近な人がワクチンを受けているか確かめることも大切だという。モス教授は、連邦政府がワクチン接種を十分に後押しせず、信頼を損なう発信もあったと指摘し、対応は「状況を後退させた」と述べた。乳児を守るには、周囲の大人を含めた接種状況の確認が鍵になる。","2026-11-26","News-Medical","https://www.news-medical.net/news/20261126/Measles-outbreaks-raise-serious-health-concerns-for-expectant-mothers-and-newborns.aspx"],["新潟県のインフル5週連続増　新潟市の児童福祉施設11か所で集団発生","新潟県が11月26日に発表した感染症情報によると、県内のインフルエンザ感染者数は5週連続で増加した。11月22日までの1週間の1定点医療機関あたりの感染者数は21.00人で、前週の19.24人から増えた。十日町市（50.00人）、佐渡市（45.50人）、村上市（30.50人）の保健所管内では警報基準の30を超えた。新潟市の11の児童福祉施設で集団発生があり、県内の学校では29学級が学級閉鎖となっている。","\n【概要】新潟県が11月26日に発表した県感染症情報で、県内のインフルエンザの感染者数が5週連続で増加したことが分かった。テレビ新潟（TeNY）が伝えた。新潟市の11の児童福祉施設で集団発生が報告され、県内の学校では29学級で学級閉鎖が行われている。子どもが集まる施設や学校で感染が広がっている状況だ。\n【背景】新潟県では9月28日にインフルエンザの注意報が発令されており、26日の時点でも継続している。秋の早い時期から注意報が出ていたなかで、感染者数は増加を続けている。保育施設や学校など子どもが長い時間を一緒に過ごす場所は感染が広がりやすく、家庭に持ち帰られることで家族内に広がることもあり、地域全体での対策が求められる。\n【詳細】県によると、11月22日までの直近1週間の1定点医療機関あたりの感染者数は21.00人で、前週の19.24人から増えた。保健所管内別では、十日町市が50.00人、佐渡市が45.50人、村上市が30.50人となり、警報の基準とされる30を超えた地域もある。新潟市では11の児童福祉施設で集団発生が報告された。県内の学校では29学級が学級閉鎖となっている。地域によって流行の度合いに差がある一方、県全体として増加傾向が続いている。\n【ポイント・注意点】県は、症状がある場合は外出を控えること、マスクの着用、手洗い、部屋の換気といった基本的な感染対策を徹底するよう求めている。子どもに発熱やせきなどの症状が見られたときは、無理に登園・登校させずに家庭で様子を見ることが、施設内での拡大を防ぐことにつながる。家庭では帰宅後の手洗いを習慣にし、こまめに部屋の空気を入れ替えることを心がけたい。警報基準を超えた地域に住む家庭や、その地域の施設に通う子どもがいる家庭は、特に体調の変化に気を配る必要がある。乳幼児や持病のある家族がいる家庭では、家庭内で感染が広がらないよう、症状のある人とタオルや食器を分けるといった配慮も考えたい。今後も県の発表する感染状況に注目し、流行の動向に応じた備えを続けたい。","2026-11-26","Infoseekニュース（テレビ新潟）","https://news.infoseek.co.jp/article/teny_2026112602134764/"],["富山県のインフル患者3週連続増、注意報レベル続く　黒部市の小学校で学年閉鎖","富山県内のインフルエンザ患者数は、11月22日までの1週間で1医療機関あたり14.00人となり、前の週の12.58人から1.42人増えて3週連続で増加しました。注意報レベルの基準である10人を超えた状態が続いています。厚生センター・保健所の管内別では富山市管内が16.63人で最も多く、高岡管内が16.62人で続きました。25日の時点で黒部市の荻生小学校の2年生が学年閉鎖となっており、県は手洗いや換気などの対策と早めのワクチン接種の検討を呼びかけています。","\n【概要】富山県によると、11月22日までの1週間に報告されたインフルエンザの患者数は1医療機関あたり14.00人で、前の週の12.58人から1.42人増えました。増加は3週連続で、注意報レベルの基準である10人を上回る状態が続いています。学校でも影響が出ており、25日の時点で黒部市の荻生小学校の2年生が学年閉鎖となっています。チューリップテレビが11月25日に伝えました。\n【背景】インフルエンザの流行状況は、指定された医療機関から1週間ごとに報告される患者数を、1医療機関あたりの人数にならして示されます。富山県ではこの数が注意報の基準である10人を超え、さらに3週続けて増えています。流行が広がると、学校などの集団生活の場で感染が連鎖しやすくなり、学級閉鎖や学年閉鎖といった措置がとられます。今回の黒部市の学年閉鎖も、こうした広がりの一端を示すものです。\n【詳細】県全体の1医療機関あたりの患者数は14.00人でした。厚生センター・保健所の管内別に見ると、最も多かったのは富山市管内の16.63人で、次いで高岡管内が16.62人となり、どちらも前の週から増えています。この2つの管内はいずれも県全体の数を上回っており、人口の多い地域で感染が広がっている様子がうかがえます。学校の状況では、25日の時点で黒部市の荻生小学校の2年生が学年閉鎖となっています。県は引き続き、手洗いや咳エチケットのほか換気などの基本的な感染対策を続けるとともに、早めのワクチン接種を検討するよう呼びかけています。\n【ポイント・注意点】患者数は3週連続で増えており、当面は注意報レベルの状態が続くとみられます。子どもは学校や園で長い時間を一緒に過ごすため、家庭でも手洗いの習慣づけや、せきが出るときのマスク着用などの咳エチケットを改めて確認しておきたいところです。部屋の換気も、寒い時期は後回しになりがちなので意識して行うことが大切です。ワクチンについては、県が早めの接種の検討を呼びかけており、まだ受けていない場合はかかりつけの医療機関に相談するとよいでしょう。また、子どもの通う学校や園で学級閉鎖や学年閉鎖が出ていないか、日ごろから連絡に気を配っておくと、急な休みにも慌てずに対応しやすくなります。","2026-11-25","チューリップテレビ（Yahoo!ニュース）","https://news.yahoo.co.jp/articles/12977260a42068f539ed34b8f889d9dca02af99b"],["香川・高松市立幼稚園で学年閉鎖　5歳児がインフルエンザA型発症","香川県教育委員会は11月26日、高松市立幼稚園1施設で、5歳児14人のうち1人がインフルエンザA型を発症したと発表した。この施設は27日に学年閉鎖となる。発症したのは1人だが、園では予防のため学年単位での閉鎖に踏み切った形だ。全国的にインフルエンザの患者が増えるなか、幼児が集団で過ごす幼稚園でも感染対策が求められる。家庭でも子どもの体調の変化に気を配りたい。","\n【概要】香川県教育委員会は11月26日、高松市立の幼稚園1施設でインフルエンザA型の発症があり、27日に学年閉鎖すると発表した。KSB瀬戸内海放送が伝えた。発症したのは5歳児14人のうち1人で、この学年が閉鎖の対象となる。\n【背景】幼稚園や保育所では、幼い子どもたちが同じ部屋で長い時間を過ごし、一緒に遊んだり食事をしたりする。そのため、感染症がいったん持ち込まれると広がりやすい環境にある。幼児は自分で手洗いやせきエチケットを十分に行うことが難しく、周囲の大人による配慮が欠かせない。学年閉鎖や学級閉鎖は、集団の中での感染拡大を抑えるための措置として行われる。\n【詳細】県教育委員会の発表によると、高松市立幼稚園1施設で、5歳児14人のうち1人がインフルエンザA型を発症した。これを受けて、同施設は27日に学年閉鎖となる。記事で伝えられているのはこの内容で、発症した子どもの容体や、ほかの子どもに症状が出ているかどうかなどについては触れられていない。発症者が1人の段階での学年閉鎖であり、早めに対応した形といえる。\n【ポイント・注意点】幼児がインフルエンザにかかった場合、家庭で看病する保護者や、きょうだいに感染が広がることもある。子どもに発熱やせき、だるそうな様子などが見られたときは、無理に登園させず、早めにかかりつけの医療機関に相談したい。家庭では、外から帰ったときの手洗いや、こまめな換気を習慣にすることが基本となる。学年閉鎖の期間中は、子どもが人の多い場所に出かけるのを控えるなど、閉鎖の目的を踏まえた過ごし方を心がけることも大切だ。また、閉鎖の情報は園からの連絡や自治体の発表で確認し、登園の再開時期についても園の案内に従うようにしたい。各地でインフルエンザの患者が増えている時期であり、身近な施設の情報にも注意を払いたい。幼い子どもは体調の変化を言葉でうまく伝えられないことも多いため、食欲や機嫌、顔色など、ふだんとの違いに大人が早めに気づけるよう、家庭でも園でも注意深く見守ることが大切になる。","2026-11-26","Yahoo!ニュース（KSB瀬戸内海放送）","https://news.yahoo.co.jp/articles/b4c7ee07414353fbf770250d564ce51b1eb470c4"],["岡山・津山市の小学校で学級閉鎖　1年生7人がインフル症状で欠席","11月26日、岡山県津山市の公立小学校で、1年生1クラスの7人がインフルエンザとみられる症状を訴えて欠席した。岡山県は、この学校を27日に学級閉鎖にすると発表した。県は9月28日に「インフルエンザ注意報」を発令しており、マスクの着用と手洗いを呼びかけている。低学年の子どもは集団生活で感染が広がりやすく、家庭でも体調管理と基本的な感染対策を続けることが大切だ。","\n【概要】岡山県は11月26日、津山市の公立小学校でインフルエンザとみられる症状による欠席が相次いだとして、この学校を27日に学級閉鎖にすると発表した。KSB瀬戸内海放送が伝えた。欠席したのは1年生1クラスの7人で、いずれもインフルエンザとみられる症状を訴えていた。\n【背景】岡山県は9月28日に「インフルエンザ注意報」を発令しており、早い時期から流行への警戒を続けてきた。県内ではこの日、ほかにも学校での学級閉鎖が発表されている。小学校の低学年は、休み時間や給食などで子ども同士が近い距離で過ごす時間が長く、手洗いなどの対策もまだ身についていない場合があるため、感染が広がりやすい。\n【詳細】発表によると、26日に津山市の公立小学校で、1年生の1クラスの児童7人がインフルエンザとみられる症状を訴えて欠席した。これを受けて県は、この学校の当該学級を27日に閉鎖すると発表した。記事では、学校名や児童の症状の程度については伝えられていない。県は注意報の発令にあわせて、マスクの着用と手洗いを呼びかけている。\n【ポイント・注意点】学級閉鎖は、クラス内での感染の連鎖を断ち、ほかの学年や家庭への拡大を防ぐための措置だ。閉鎖期間中は、子どもを人の多い場所へ連れ出すことを控え、家で体を休ませるようにしたい。家庭では、帰宅後や食事前の手洗いを習慣にし、子どもと一緒に正しい手の洗い方を確認しておくとよい。県が呼びかけているマスクの着用も、せきやくしゃみが出るときには周囲への感染を減らすことにつながる。子どもに発熱や強いだるさ、せきなどの症状があれば、無理に登校させずに医療機関へ相談することが大切だ。症状が治まったあとの登校の時期についても、学校や医師の指示に従いたい。注意報が出たままの状態が続いており、引き続き地域の流行状況に注意を払う必要がある。低学年の子どもは自分の体調の変化をうまく言葉にできないこともあるため、朝の登校前に顔色や食欲、熱っぽさなどを確かめる習慣を家族でつけておくと、早めの対応につながり安心だ。","2026-11-26","Yahoo!ニュース（KSB瀬戸内海放送）","https://news.yahoo.co.jp/articles/adb3f6d99bf9d6f415e09edb66c8c51f65865d43"],["岡山市の私立高校2校でインフル学級閉鎖　2年生で8人・5人が欠席","岡山市は11月26日、市内の私立高校2校で、インフルエンザ感染による学級閉鎖を発表した。1校では2年生1クラスで8人がインフルエンザとみられる症状で欠席し、27日から30日まで学級閉鎖となる。もう1校でも2年生1クラスで5人が欠席し、26日から27日まで学級閉鎖となっている。岡山県は9月28日に「インフルエンザ注意報」を発令しており、マスクの着用や手洗いを呼びかけている。","\n【概要】岡山市は11月26日、市内の私立高校2校でインフルエンザ感染による学級閉鎖を行うと発表した。KSB瀬戸内海放送が伝えた。いずれも2年生のクラスで、インフルエンザとみられる症状による欠席が相次いだ。小学校や幼稚園だけでなく、高校でも学級閉鎖が出ている。\n【背景】岡山県は9月28日に「インフルエンザ注意報」を発令しており、マスクの着用や手洗いを呼びかけている。県内では同じ日に、津山市の小学校でも学級閉鎖が発表されるなど、学校での感染の報告が続いている。高校生は通学や部活動などで行動範囲が広く、人と接する機会も多いため、感染がクラスの外へ広がる可能性もある。\n【詳細】岡山市によると、1校では2年生の1クラスで8人がインフルエンザとみられる症状で欠席した。このクラスは27日から30日まで学級閉鎖となる。もう1校でも2年生の1クラスで5人が欠席しており、26日から27日まで学級閉鎖となっている。記事では、学校名や生徒の症状の程度などは明らかにされていない。2校とも、1つのクラスで複数の生徒が同時に欠席したことを受けての措置となっている。\n【ポイント・注意点】高校生は自分で体調を判断して登校することも多いが、熱や体のだるさ、せきなどの症状があるときは、無理をせずに休むことが周囲への感染を防ぐことにつながる。学級閉鎖の期間中は、外出を控えて体を休めることが大切で、閉鎖の趣旨を踏まえ、友人と集まったり人の多い場所へ出かけたりすることは避けたい。家庭でも、手洗いや換気といった基本的な対策を続け、受験や行事を控える時期であれば、なおさら体調管理に気を配る必要がある。県の注意報は発令されたままで、流行が続いていることから、地域の学校の情報や自治体の発表にも目を向けておきたい。保護者は子どもの体調の変化に早めに気づけるよう、日ごろから声をかけておくとよい。同じクラスで欠席が相次いでいるときは、家族に感染が広がる可能性も考え、家庭内での手洗いや換気、タオルの共用を避けるといった対策を意識したい。","2026-11-26","Yahoo!ニュース（KSB瀬戸内海放送）","https://news.yahoo.co.jp/articles/f7534d5260d41d9f1fd4c7805320a6faada6f6d8"],["父親の妊娠前の抗うつ薬使用、子どもの高血圧などとわずかに関連　デンマーク","英医学誌BMJに掲載されたデンマークの大規模研究で、父親が子どもの妊娠前の数カ月間に抗うつ薬を使っていた場合、子どもの代謝異常、特に高血圧のリスクがわずかに高かった。2000〜2023年に生まれた136万5887人を最長23年追跡した。研究チームは、薬そのものよりも父親の背景にある精神疾患が関係している可能性が高いとし、妊娠前に抗うつ薬で治療を受けた男性にとって「安心材料」になると結論づけた。","\n【概要】英医学誌「The BMJ」に掲載されたデンマークの大規模コホート研究で、父親が妊娠前の数カ月間に抗うつ薬を使っていた場合、子どもの代謝異常、特に高血圧のリスクがわずかに高いことが示された。News-Medicalが11月25日にBMJグループの発表として伝えた。ただし研究チームは、薬そのものより父親の精神疾患が影響している可能性が高いとしている。\n【背景】研究で代謝異常とされたのは、2型糖尿病、高血圧、高コレステロール血症、過体重または肥満である。研究では、精子が作られる時期、つまり妊娠の約3カ月前に父親が抗うつ薬を使っていたかどうかに注目した。\n【詳細】デンマークの健康登録データから、2000〜2023年にデンマークで生まれた子ども136万5887人を特定し、出生から最長23年間追跡した。このうち2万3572人（1.7％）は、精子形成期に父親が抗うつ薬の処方を1回以上受けていた。平均12年の追跡で、1万8353人（1.3％）が代謝異常と診断された。発生率は、父親が使用していた子どもで1000人年あたり1.39件、使用していなかった子どもで1.11件だった。2型糖尿病、高コレステロール、過体重・肥満では統計的に意味のある上昇はみられなかった。さらに、父親が精子形成期にだけ抗うつ薬を使っていた子ども4156人と、妊娠中にだけ使っていた子ども1万7318人を比べたところ、リスクの上昇はみられなかった。\n【ポイント・注意点】研究チームは、わずかなリスクの上昇は薬ではなく父親の背景にある精神疾患を反映している可能性が高いと説明し、妊娠中に治療を始めることは、妊娠前から存在した病状の悪化を示している可能性があるとした。そのうえで、結果は妊娠前に抗うつ薬で治療を受けた男性にとって「安心材料になる」と結論づけている。一方、観察研究であることや追跡が成人期の初めまでに限られることから、因果関係や長期的なリスクについて確かなことは言えないとも認めている。治療中の人は自己判断で服薬をやめず、主治医と相談することが大切だ。","2026-11-25","News-Medical","https://www.news-medical.net/news/20261125/Paternal-antidepressant-use-before-conception-linked-to-childrens-metabolic-risks.aspx"],["妊娠中のADHD治療薬、子どもの発達障害リスクと関連なし　北欧364万人を解析","英医学誌BMJに掲載された北欧の大規模研究で、母親が妊娠中にADHD治療薬を使っていても、子どもの自閉症、ADHD、知的障害、学習障害など神経発達症のリスクは高くならなかった。デンマーク、ノルウェー、スウェーデンで2000〜2021年に生まれた364万3376人を解析した。研究チームは結果を「おおむね安心できる」とし、将来の発達への懸念は妊娠中にADHD治療薬をやめる理由にはならないとしている。","\n【概要】英医学誌「The BMJ」に掲載された北欧の大規模研究で、母親が妊娠中にADHD（注意欠如・多動症）の治療薬を使っていても、子どもの神経発達症のリスクは高くならないことが示された。News-Medicalが11月25日にBMJグループの発表として伝えた。対象となったのは自閉症、ADHD、知的障害、学習障害などで、研究チームは結果を「おおむね安心できる」と評価している。\n【背景】出産年齢の女性の間でADHD治療薬の使用は増えている。しかし根拠が限られているため、妊娠を機に治療をやめる女性も多く、それが本人の心の健康や家庭の安定を損なうおそれがある。カナダやデンマークのこれまでの研究も安心できる内容だったが、薬の種類ごとの詳しい分析や、対象とする疾患の幅が十分ではなかった。\n【詳細】研究ではデンマーク、ノルウェー、スウェーデンの健康登録データを使い、2000〜2021年に生まれた子ども364万3376人を追跡した。追跡期間の中央値はスウェーデンで9年、ノルウェーとデンマークで10年。妊娠中にADHD治療薬にさらされた子どもは7595人（0.2％）で、うち2389人（0.1％）は妊娠中期・後期にさらされていた。薬はメチルフェニデートが69％と最も多く、アンフェタミン類が20％、アトモキセチンが7％だった。母親の年齢や喫煙、ADHDの診断などを調整した結果、どの時期のばく露でも、神経発達症や行動・情緒の障害、心理的・知的発達の障害のリスク上昇はみられなかった。一部の薬で妊娠中期・後期のリスク上昇がみられたが、偶然による可能性があるとしている。\n【ポイント・注意点】研究チームは、将来の発達への懸念は妊娠中にADHD治療薬を「中止する理由にはならない」と述べ、妊娠中や妊娠を計画する際の治療について、医師と本人が一緒に決める材料になるとしている。一方で観察研究であり、ADHDの重症度や遺伝など測定していない要因が結果に影響した可能性もある。ばく露の割合が低く、一部の疾患では結論が限られる点にも注意が必要だ。服薬中の人は自己判断で中止せず、主治医と相談したい。","2026-11-25","News-Medical","https://www.news-medical.net/news/20261125/Prenatal-ADHD-medication-exposure-not-linked-to-neurodevelopmental-disorders.aspx"],["はしか流行で米ロサンゼルス小児病院がワクチン接種を呼びかけ　2回で97%予防","米ロサンゼルス小児病院（CHLA）は、はしかの流行が予防接種を受けていない地域を脅かしているとして、MMRワクチンを含む定期接種を最新の状態に保つよう呼びかけた。はしかは空気を介して広がり、感染の90％以上は未接種の人で起きる。2回の接種で97％の予防効果がある。未接種の患者の約5人に1人が入院し、はしかにかかった子ども1000人あたり1〜3人が亡くなるという。","\n【概要】米ロサンゼルス小児病院（CHLA）は、はしか（麻しん）の流行が予防接種を受けていない人の多い地域を脅かしているとして、MMRワクチンを含む定期接種を最新の状態に保つよう呼びかけた。News-Medicalが11月25日に同病院の記事として掲載した。過去50年にわたるはしかワクチンの普及は、世界で9300万人以上の死亡を防いできたとしている。\n【背景】同病院の感染予防・管理部門の医療責任者、マイケル・スミット医師は、感染力のある人がワクチン接種率の低い地域に入ることで、流行が悪化する可能性が続いていると警告する。米国がはしかの排除状態を失ったことも懸念材料に挙げた。はしかは感染者のせきやくしゃみ、会話によって空気を介して広がり、飛沫は空気中や物の表面で最大2時間生き残る。乳児や子ども、19歳までの若者が特に影響を受けやすく、感染の90％以上はまだ予防接種を受けていない人で起きている。\n【詳細】初期症状は発熱、せき、鼻水、赤く涙っぽい目で、症状が出てから3〜4日後に、顔から始まることが多い赤い発疹が現れる。未接種ではしかにかかった人の約5人に1人が入院する。合併症には肺炎、脳炎、亜急性硬化性全脳炎（SSPE）、死亡があり、スミット医師によると、はしかにかかった子ども1000人あたり1〜3人が亡くなり、合併症が何年も後に現れることもある。治療は主に症状を和らげる対症療法となる。\n【ポイント・注意点】MMRワクチンは2回の接種で97％の予防効果がある。子どもは1回目を生後12〜15カ月、2回目を4〜6歳ごろに受ける。十分な免疫ができるのは接種の約1カ月後だが、感染者と接触した後でも、症状が出る前に接種すれば重症化を抑えられる可能性がある。接種済みの子どもは感染の危険が低いが、接触した場合は様子を見守る必要がある。流行地に渡航する場合、生後6カ月の乳児でも早めの接種を受けられるが、この接種は定期接種の回数には数えない。スミット医師は「ワクチンを受けることが最も効果的な選択だ」と述べている。","2026-11-25","News-Medical","https://www.news-medical.net/news/20261125/Experts-urge-vaccination-as-measles-outbreaks-threaten-unprotected-communities.aspx"],["10代1万2500人の健康調査、自殺未遂やいじめ・運動不足が深刻　4都市で比較","WHOなどの研究チームが、ジャマイカ、ガーナ、インド、モロッコの4都市で13〜17歳の1万2526人の健康指標を調べた結果を「Journal of Adolescent Health」に発表した。毎日60分以上の運動をしている生徒はどの都市でも4人に1人未満だった。過去1年の自殺未遂はジャマイカのセントキャサリンの女子で30.9％に上り、いじめは2都市で生徒の約半数に及んだ。地域に合わせた対策が求められている。","\n【概要】世界保健機関（WHO）や汎米保健機構（PAHO）などの研究チームが、中所得国の4都市で13〜17歳の若者1万2526人の健康状態を調べた横断研究を「Journal of Adolescent Health」に発表した。News-Medicalが11月25日に伝えた。17の健康指標を比べたところ、運動不足や甘い飲料の摂取、自殺未遂、いじめ、暴力など、若者の健康をめぐる深刻な実態が浮かび上がった。\n【背景】調査は「Empowering Adolescents」というクラスター無作為化比較試験の開始時のデータに基づく。対象はジャマイカのセントキャサリン、ガーナのセコンディ・タコラディ、インドのジャイプール、モロッコのフェズの4都市。各都市で約30校を無作為に選び、選ばれたクラスの生徒全員に参加を呼びかけた。生徒は2021年版の世界学校保健調査に回答し、身長と体重も測定した。\n【詳細】ほぼすべての指標で都市間の差が統計的に意味のある水準だった。過去30日間の飲酒はセントキャサリンで男子42.3％、女子44.8％だった一方、ジャイプールの男子は3.6％。電子たばこの使用はフェズの男子が17.9％で最も高かった。毎日60分以上の中高強度の運動をしている生徒は、どの都市でも4人に1人未満だった。甘い飲料を毎日飲む生徒はどこでも35％を超えた。過去1年の自殺未遂は、ジャイプールの男子で8.3％と最も低く、セントキャサリンの女子で30.9％、セコンディ・タコラディの男子で29.9％と高かった。いじめはフェズとセコンディ・タコラディで生徒の約半数が経験していた。\n【ポイント・注意点】研究チームは、心の健康を支える体制の強化、学校での支援、暴力の予防、学校と地域が連携した取り組みが必要だとしている。世界的な指針を、その土地の文化や性別に配慮した対策と組み合わせ、若者や家族、地域が計画に関わることも求めた。一方、データは自己申告で、言いにくい行動は少なく報告された可能性がある。横断研究のため因果関係は示せず、ほかの都市や学校に通っていない若者には当てはまらない可能性もある。","2026-11-25","News-Medical","https://www.news-medical.net/news/20261125/Four-cities-12500-teenagers-and-a-troubling-picture-of-adolescent-health.aspx"],["妊娠初期の喫煙、胎盤の発達を乱す　独マックス・デルブリュック分子医学センター","ドイツのマックス・デルブリュック分子医学センター（MDC）とシャリテ大学病院の研究チームが、たばこの煙が妊娠の最初の数週間から胎盤の発達を乱すことを「Cell Systems」に報告した。妊娠初期の喫煙者と非喫煙者の胎盤組織の8万8000個以上の細胞を調べ、栄養の運搬に関わる細胞の変化や炎症、血液が固まりやすくなる兆候を確認した。研究者は「禁煙は早ければ早いほど良い」としている。","\n【概要】ドイツのマックス・デルブリュック分子医学センター（MDC）とシャリテ大学病院の研究チームが、たばこの煙が妊娠の最初の数週間から胎盤の発達を乱すことを科学誌「Cell Systems」に報告した。News-Medicalが11月25日にMDCの発表として伝えた。妊娠中の喫煙は早産や低出生体重のリスクを高めることが知られており、今回の研究はその背景にある胎盤の変化を細胞レベルで示した。\n【背景】胎盤は母親の血液から胎児へ栄養やホルモンを運ぶ重要な器官だ。たばこの煙は発達中の臓器を傷つけるおそれがあるとされてきた。研究チームは、妊娠初期（第1三半期）の喫煙者と非喫煙者の胎盤組織を比較し、1つひとつの細胞の遺伝子の働きを調べる単一細胞RNA解析と、組織内の個々の細胞のたんぱく質を測る「ディープ・ビジュアル・プロテオミクス」を組み合わせ、合計8万8000個を超える細胞を解析した。\n【詳細】最も明確な変化がみられたのは2種類の細胞だった。母親の血液に直接触れる胎盤の外層「合胞体栄養膜細胞」では、喫煙者で胎盤の構造を保つ遺伝子や、栄養やホルモンの運搬に関わる遺伝子の働きが変化していた。ミトコンドリアも多く、研究者は酸化ストレスを反映していると考えている。細胞同士のやりとりも乱れていた。また、胎盤の免疫細胞「ホフバウアー細胞」は喫煙者でより活発になり、炎症を起こしやすい状態だった。フィブリノゲンの増加や胎盤表面への血小板の付着から、血液が固まりやすくなっていることも分かり、胎児への血流が損なわれる可能性がある。培養した胎盤細胞にたばこの煙をさらす実験でも、同様の結果が確かめられた。\n【ポイント・注意点】研究を率いたヘルゼ博士は、禁煙は「早ければ早いほど良い」と述べている。研究チームは、今回の成果が胎盤の機能不全を早く見つける目印の開発につながる可能性があるとしている。なお、記事では解析した女性の人数や研究の限界には触れられていない。妊娠を考えている人や妊娠中の人は、本人の禁煙に加え、周囲の人の喫煙にも気を配りたい。","2026-11-25","News-Medical","https://www.news-medical.net/news/20261125/Tobacco-smoke-disrupts-placental-development-in-early-pregnancy.aspx"],["銃によるけがから仲間を守る教育、10代の危険の理解が持続　米エール大","米国の10代の死因の第1位は銃によるけがだ。米エール大学の研究チームは、射撃スポーツに取り組む4-Hの若者向けに、仲間の危険に気づき行動する「傍観者介入」の教育プログラムを開発し、28州50クラブの400人超で無作為化試験を行った。教育は、銃の無施錠の保管や薬物使用、抑うつ症状といった危険因子への理解を持続的に高めた。結果は「JAMA Health Forum」に掲載された。","\n【概要】米エール大学の研究チームが、射撃スポーツに取り組む10代の若者を対象に、銃によるけがの危険を見抜いて行動する力を育てる教育プログラムの効果を調べ、「JAMA Health Forum」に発表した。Medical Xpressが11月25日に伝えた。プログラムは、10代の若者が銃によるけがの危険因子を理解する力を持続的に高めることが分かった。\n【背景】記事によると、米国では銃によるけがが10代の死因の第1位となっている。銃の所有者の多くは安全を重視しているものの、若者の銃によるけがの予防は、これまで主に政策の変更に焦点が当てられ、若者自身に危険に気づく力をつける取り組みは十分ではなかった。研究チームは、全米規模の4-H射撃スポーツ（4HSS）と協力し、性暴力や飲酒運転などの予防で効果を上げてきた「傍観者介入」の考え方を取り入れた教育「Guardians 4 Health」を作った。\n【詳細】このカリキュラムは、専門家への相談、傍観者介入の研修の検討、4-Hの参加者や指導者への聞き取り、現場での試行を経て作られた。目的は、10代が仲間に介入しようとする意思と、危険因子についての知識を高めることだ。危険因子として挙げられたのは、鍵のかかっていない銃に触れられる状態、薬物の使用、抑うつ症状の3つ。試験は全米規模のクラスター無作為化試験で、28州の50クラブから400人を超える10代が参加した。半数のクラブはすぐに研修を受け、残りは時期を遅らせて受けた。開始時、3カ月後、6カ月後に効果を測った。その結果、研修は危険因子への理解を持続的に高め、受講した若者は友人や仲間に危険の兆候が見えたときに安全な行動をとる可能性が一時的に高まった。\n【ポイント・注意点】筆頭著者でエール大学公衆衛生大学院長のメーガン・ラニー氏は、研究前には10代や4-Hで効果があるか「全く分からなかった」と振り返り、銃によるけがを減らす方法は数多くあり「まだ表面をなでたにすぎない」と述べた。安全な行動をとる意思の高まりは一時的だった点には留意が必要だ。日本とは銃をめぐる状況が大きく異なるが、仲間の異変に気づき行動する力を育てる教育の考え方は、さまざまな事故や危険の予防に通じるものがある。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-youth-firearm-injury.html"],["1歳半の約半数が毎日画面に接触　早すぎる利用が遊びや会話を奪うおそれ","ハンガリーのエトヴェシュ・ロラーンド大学などの研究で、生後18カ月の子どもの49％が毎日スクリーンに接しており、37.5％は1日1時間を超えていた。2569人の出生コホートのデータを分析し、「Biologia Futura」に発表した。画面を見る時間が長いほど、親子で遊んだり本を読んだりする頻度が少なかった。研究者は、画面が遊びや体の動き、対面のやりとりの時間を奪う「置き換え効果」に注意を促している。","\n【概要】ハンガリーのエトヴェシュ・ロラーンド大学（ELTE）などの研究チームが、2歳未満の子どものスクリーン利用の実態を調べ、「Biologia Futura」に発表した。Medical Xpressが11月25日に伝えた。生後18カ月の子どもの49％が毎日画面に接しており、早すぎる利用が遊びや体の動き、人と顔を合わせたやりとりの時間を奪うおそれがあると指摘している。\n【背景】幼い子どもには、遊び、体を動かすこと、対面のやりとり、自分で周りを探索することが必要だ。専門家の指針では、一般に2歳になるまでは画面を避けることが勧められている。研究は、ハンガリーの代表的な出生コホート「Cohort '18（ハンガリーで育つ）」の2569人のデータを使い、2019〜2020年に集めた情報を分析した。\n【詳細】生後18カ月で毎日画面に接していた子どもは49％、ふだんの日に1時間を超えて画面を見ていた子どもは37.5％だった。毎日見ていた子どもの平均視聴時間は2時間を超えた。最も多いのはテレビだったが、スマートフォンやタブレットの利用もすでに広がっていた。画面の時間が長い傾向は、収入や教育水準が低い家庭で多くみられた。また、画面の時間が長いほど、親子で一緒に遊んだり本を読んだりする頻度が少なかった。近年の研究では、早い時期からの長時間の利用と、その後の言葉や認知の発達、感情の調整の難しさとの関連も指摘されている。\n【ポイント・注意点】責任著者のアーコシュ・ポガーニ氏は、幼い子どもは「主に自分から世界を探索し、人と関わることで学ぶ」と述べ、早すぎる機器の利用の最大の危険は、そうした経験の時間を奪うことだとした。2歳未満の子どもは、教育向けとされる内容でも、画面からは実際のやりとりほど学べないという。親自身のスマホ利用が遊びや食事、なだめる場面を中断させることや、画面で子どもを落ち着かせると感情を調整する練習の機会が減る可能性にも触れている。研究者は、一緒に遊ぶ、話す、画面のない日課を大切にすることを勧め、出産前から小児科医などが関わることも求めた。ただし、影響の仕組みはまだ十分に解明されていない。","2026-11-25","Medical Xpress","https://medicalxpress.com/news/2026-11-premature-screen-play-movement-interaction.html"],["砂嵐の後、子どものアレルギー関連の受診割合が13%から20%に　米シカゴ","米イリノイ大学医学部の研究チームが、2025年5月16日に米イリノイ州北東部を襲った珍しい砂嵐の前後で、シカゴの小児外来クリニックの受診内容を比べた。砂嵐後の3診療日では受診の20％がアレルギー関連で、砂嵐前の3診療日の13％を上回った。湿疹やぜんそく、花粉症などが含まれる。結果は「Annals of Family Medicine」に掲載された。異常気象が子どもの健康に与える影響の一端を示した。","\n【概要】米イリノイ大学医学部の研究チームが、珍しい砂嵐の後に子どものアレルギー関連の受診の割合が増えたとする分析を「The Annals of Family Medicine」に発表した。Medical Xpressが11月24日、米国家庭医学会の発表として伝えた。砂嵐の後の3診療日では、受診の20％がアレルギー関連だった。\n【背景】2025年5月16日、イリノイ州北東部で1万2000平方マイル（3万1000平方キロ）以上を覆う珍しい砂嵐が発生した。砂嵐には細かい粒子、花粉、カビの胞子、細菌、農薬などの化学汚染物質が含まれ、ぜんそくやアレルギーの原因になりうる。これまでの砂嵐の研究の多くは救急外来の受診を調べたもので、日常の診療への影響はあまり分かっていなかった。\n【詳細】研究チームは、シカゴの小児外来クリニックで、砂嵐の前と後それぞれ7診療日分の受診を調べた。その結果、砂嵐の後の最初の3診療日では受診の20％がアレルギー関連の問題によるもので、砂嵐の前の3診療日の13％を上回った。診断には、湿疹、ぜんそく・反応性気道疾患、花粉症、アレルギー性結膜炎、アレルギー性皮膚炎、季節性アレルギーが含まれていた。記事では、受診の総数や患者数は示されていない。\n【ポイント・注意点】この分析は、砂嵐のような異常気象が、ふだん砂嵐の起きない地域でも子どもの健康に影響を与え、救急だけでなく、かかりつけの外来診療にも負担をもたらすことを示している。日本でも黄砂などで空気中の粒子が増える時期があり、アレルギーやぜんそくのある子どもを持つ家庭では、大気の状態に関する情報を確認し、外出や換気の仕方を工夫することが考えられる。症状が悪化したときは早めに医療機関に相談したい。ただし、この研究は1つのクリニックの短い期間の受診を比べたもので、記事では研究の限界には触れられていない。結果の解釈には慎重さも必要だ。それでも、気象の急な変化が子どものアレルギー症状の悪化と結びつく可能性を示した点で、身近な健康リスクを考えるうえで参考になる研究といえる。","2026-11-24","Medical Xpress","https://medicalxpress.com/news/2026-11-percentage-children-allergy-rare-chicago.html"],["高校時代の喫煙や大麻・薬物使用、早死にのリスク上昇と関連　米ミシガン大50年追跡","米ミシガン大学の研究チームが、1976〜2019年に高校3年生として調査を受けた10万7346人を成人後まで追い、死亡との関係を調べた。18歳で薬物や酒を使っていた人は、使っていなかった同級生より死亡しやすく、若くして亡くなる傾向があった。ほかの物質の使用を考慮しても、たばこで36％、大麻で14％、その他の薬物で28％リスクが高かった。結果は「American Journal of Public Health」に掲載された。","\n【概要】米ミシガン大学の研究チームが、高校時代の物質使用とその後の死亡との関係を約50年にわたって追跡した研究を「American Journal of Public Health」に発表した。News-Medicalが11月24日に伝えた。18歳の時点で薬物や酒を使っていた人は、使っていなかった同級生に比べて死亡しやすく、より若い年齢で亡くなっていた。\n【背景】10代の物質使用を調べた研究の多くは、数年間しか追跡していない。今回の研究は、全米を代表する長期追跡調査「Monitoring the Future（MTF）」のデータを使った。1976〜2019年に高校3年生として初めて調査を受けた10万7346人を、成人期を通して追跡した。2026年3月までに3773人（約29人に1人、3.5％）が亡くなっていた。\n【詳細】それぞれの行動を個別に分析すると、死亡のリスクは大きく上昇した。ただ、10代では複数の物質を重ねて使うことが多く、重なりを分けると、それぞれの物質の独立した影響は小さくなった。ほかの要因を調整し、すべての物質を同時に分析に入れた場合でも、リスクは大麻の使用で14％、その他の薬物の使用で28％、たばこの使用で36％高かった。過度の飲酒（ビンジ飲酒）も単独では早死にと関連していたが、ほかの物質の使用を考慮すると統計的に意味のある関連ではなくなった。\n【ポイント・注意点】研究を率いたメーガン・パトリック研究教授は、死亡との関連は大麻、たばこ、その他の薬物で最も強かったと説明し、大規模で全国を代表する長期のデータであることがこの研究の特徴だとした。そのうえで、物質を使う10代の若者には危険があり、そのリスクを深刻に受け止めるべきだと述べ、物質使用を「広範な影響をもたらしうる危険の指標」と表現した。研究結果は、10代の物質使用のスクリーニング、予防、介入を後押しするものだという。一方、こうした関連がどのような仕組みで生じるのかは、今後の研究で明らかにする必要があるとしている。家庭や学校では、早い段階から喫煙や薬物の危険について話し合う機会を持ちたい。","2026-11-24","News-Medical","https://www.news-medical.net/news/20261124/Five-decade-study-tracks-adolescent-substance-use-into-early-adult-mortality.aspx"],["ライム病の子の12人に1人にポワッサンウイルス感染の兆候　米ボストン小児病院","米ボストン小児病院の研究チームが、ライム病が疑われた子ども600人の血液を調べ、早期ライム病の子の12人に1人にポワッサンウイルスの最近の感染を示す抗体を確認した。いずれも治療した医師には診断されていなかった。ポワッサンウイルスは同じマダニが運び、脳炎など重い症状を起こすことがある。ライム病の感染には24時間以上の吸着が必要なのに対し、最短15分で感染しうるという。","\n【概要】米ボストン小児病院の研究チームが、ライム病が疑われた米国の子どもで、ポワッサンウイルスへの感染がこれまで考えられていたより多いことを「Clinical Infectious Diseases」に報告した。Medical Xpressが11月23日に伝えた。早期ライム病の子どもの12人に1人に、最近のポワッサンウイルス感染を示す抗体が見つかった。これらの感染は、治療した医師には1件も診断されていなかった。\n【背景】ポワッサンウイルスは、軽いインフルエンザのような症状から、脳炎などの重い症状まで引き起こすことがある。ライム病を運ぶのと同じマダニ（クロアシマダニ）によって広がる。ライム病がうつるには少なくとも24時間マダニが吸着している必要があるのに対し、ポワッサンウイルスは最短15分で感染しうるという。\n【詳細】研究チームは、2015〜2024年にマダニの多い地域にある8つの救急部門でライム病の評価を受けた子ども600人の血液検査を調べた。早期ライム病の子ども305人と、似た症状がありながらライム病の検査が陰性だった295人を、年齢、性別、地域、症状をそろえて比べた。年齢の中央値は9歳だった。ポワッサンウイルスの抗体は、ライム病の子どもの26人（8.5％）と、比較群の2人（0.7％）で見つかった。ほかの要因を調整すると、ライム病の子どもはポワッサンウイルスの抗体が陽性となるオッズが5倍高かった。\n【ポイント・注意点】研究チームは、ライム病が疑われる子ども、特に通常と異なる症状がある場合やライム病の治療への反応が遅い場合には、ポワッサンウイルスの検査を検討するよう提案している。また、感染の初期の段階でウイルスを見つけられる、より速く正確な検査が必要だとしている。一方で、ほかの発疹をライム病の発疹と見誤った可能性や、ライム病の検査が早期の感染を見逃したり過去の感染の抗体を拾ったりする可能性、ポワッサンウイルスの検査の偽陽性、抗体の経時的な変化を調べられなかった点を限界として挙げている。野山で遊んだ後は、子どもの体にマダニが付いていないか確認したい。","2026-11-23","Medical Xpress","https://medicalxpress.com/news/2026-11-children-lyme-disease-powassan-virus.html"],["シナモンの鉛は幼児に危険か　米バッファロー大「適量なら安全、他の鉛源にも注意」","米バッファロー大学の研究チームが、粉末シナモンに含まれる鉛が3〜5歳の子どもの血中鉛濃度に与える影響を推計し、「Journal of Xenobiotics」に発表した。調べた製品の多くはニューヨーク州の基準値を下回り、鉛の少ないシナモンなら頻繁に食べても血中濃度が大きく上がる可能性は低いという。ただ幼児は摂取した鉛の40〜50％を吸収するため、水や土など他の鉛源と合わせて減らすことが大切だとしている。","\n【概要】米バッファロー大学公衆衛生学部の研究チームが、粉末シナモンに含まれる鉛が3〜5歳の子どもの血中鉛濃度に与える影響を推計し、11月3日に「Journal of Xenobiotics」に発表した。Medical Xpressが11月23日に伝えた。調べた製品の多くは鉛の基準を下回っており、研究者は適量であれば幼児にも安全だとしている。\n【背景】幼い子どもは、口から入った鉛の40〜50％を腸で吸収し、大人の3〜10％を大きく上回る。鉛は土壌や加工の過程でシナモンに入り込むことがある。2023年には米国で、主に子どもの血中鉛濃度の上昇600件が、あるブランドのアップルソースと関連づけられた。2024年には米食品医薬品局（FDA）が一部のシナモン製品について警告を出し、米コンシューマー・リポートは、調べた30数品のシナモン製品の3つに1つが回収に相当する鉛を含んでいたと報告している。\n【詳細】研究チームは、ニューヨーク州西部の食料品店やディスカウント店で有名ブランドの粉末シナモンを購入し、州保健局の研究所で分析した。さらに、食品だけの場合や、土・水・空気からのばく露も含めた場合など、さまざまな摂取の想定で血中鉛濃度を推計するモデルを使った。小さじ約8分の1（0.6ミリリットル）から約2杯（10ミリリットル）の量で、FDAが定める子どもの1日の上限を超える料理やお菓子の量も見積もった。主任研究者のカタジナ・コルダス教授によると、調べた製品のほとんどはニューヨーク州の香辛料の鉛の基準値を下回っており、この基準は2028年にさらに引き下げられる予定だ。鉛の少ないシナモンなら、頻繁に食べても米国の幼児に一般的な濃度を超えて血中鉛が上がる可能性は低いという。\n【ポイント・注意点】ただし、水や空気、土、ほかの食品に含まれる鉛もばく露を増やすため、鉛を含むシナモンを毎日大量に食べればばく露が上積みされる。共同研究者のガウリ・デサイ氏は、シナモンは適量なら安全だが甘いものは控えめにするよう助言し、浄水器の設置や、はがれた塗装の確認、玄関マットの使用など、ほかの鉛源を減らすことも勧めている。なお記事では、調べた製品の数は示されていない。","2026-11-23","Medical Xpress","https://medicalxpress.com/news/2026-11-cinnamon-pose-danger-kids.html"],["家で大人がたばこや電子たばこを使う10代、飲酒や大麻のリスクも上昇　米小児病院","米フィラデルフィア小児病院（CHOP）の研究チームが、10代の若者6万69人の電子カルテのデータを分析し、家庭で親と別の大人の両方がたばこや電子たばこを使う場合、10代のたばこ・ニコチン使用は23.5％で、誰も使わない家庭の2.0％を大きく上回ったと「Pediatrics」に発表した。危険度の高い物質使用のオッズは約15倍だった。飲酒や大麻でも同様の傾向がみられた。","\n【概要】米フィラデルフィア小児病院（CHOP）の研究チームが、家庭で大人がたばこや電子たばこを使っていると、10代の若者がたばこやアルコール、大麻を使う可能性が高いことを小児科学誌「Pediatrics」に発表した。Medical Xpressが11月23日に伝えた。家庭での使用は親自身の健康問題にとどまらず、子どもの物質使用の危険因子になるとしている。\n【背景】研究チームは、2025年1月から2026年5月にかけてCHOPのケアネットワークで行われた通常の受診の電子カルテから、2つのデータを結びつけた。1つは、自動化されたたばこ治療プログラムでの親や保護者のたばこに関する回答、もう1つは、10代本人が答えた秘密が守られる健康質問票だ。物質使用は、たばこに限らず危険度の高い使い方を捉える、検証済みの思春期向けの検査で測った。\n【詳細】対象は10代の若者6万69人。たばこ・ニコチンを使っていた割合は、受診に付き添った親と家庭内の別の大人の両方がたばこや電子たばこを使う場合が23.5％、付き添った親だけが使う場合が13.5％、別の大人だけが使う場合が11.8％、誰も使わない場合が2.0％だった。アルコールや大麻、その他の物質でも同様の傾向がみられた。年齢、性別、保険、地域の環境を調整すると、親と別の大人の両方が使う家庭の10代は、誰も使わない家庭に比べ、危険度の高い物質使用で陽性となるオッズが約15倍だった。親だけが使う家庭では、親が電子たばこだけを使う場合に10代のたばこ・ニコチン使用のオッズが5.6倍、紙巻きたばこだけの場合が2.6倍だった。\n【ポイント・注意点】筆頭著者のブライアン・ジェンセン医師は、家庭での使用は臨床医が対処できる危険因子であり、親の受診のたびに「家族全体」を守る機会があると述べた。CHOPでは、親のたばこの検査が陽性になると、親への禁煙支援と、10代への予防的な働きかけにつながる仕組みを導入している。ただし、データは一時点のもので、家庭での使用が10代の物質使用を引き起こすとは言えず、家族や社会、環境の共通の要因が関わっている可能性もある。","2026-11-23","Medical Xpress","https://medicalxpress.com/news/2026-11-teens-tobacco-alcohol-marijuana-adults.html"],["10代の塩味スナック、炎症性腸疾患のリスク32%増と関連　北欧3つの出生コホート","北欧3カ国の出生コホート計11万1999人を分析した研究で、10代にポテトチップスなどの塩味スナックを多く食べていた人は炎症性腸疾患（IBD）のリスクが32％、潰瘍性大腸炎は51％高かった。一方、子ども時代や10代に果物を多く食べるとクローン病のリスクが低かった。結果は医学誌「Gut」に掲載された。観察研究のため因果関係は示せないが、健康的な食習慣が予防策になる可能性があるという。","\n【概要】ノルウェー、デンマーク、スウェーデンの3つの出生コホートを合わせて分析した研究で、10代にポテトチップスなどの塩味スナックを多く食べていた人は、炎症性腸疾患（IBD）のリスクが高いことが分かった。News-Medicalが11月23日、BMJグループの発表として伝えた。結果は医学誌「Gut」に掲載された。\n【背景】研究は、ノルウェーの母・父・子コホート研究（MoBa）、デンマーク全国出生コホート（DNBC）、スウェーデン南東部の全出生児研究（ABIS）の3つの前向きコホートのデータをまとめたもの。参加者11万1999人を妊娠中や出生時から追跡した。7〜15歳の間の2つの時点で食事の頻度に関する質問票に答えてもらい、塩味スナック（ポテトチップス、コーンチップス、ポップコーン）は10代の時点でのみ尋ねた。IBDの診断は2024年までの国の患者登録から把握し、平均12〜17年の追跡で653人が診断された。\n【詳細】社会経済的な要因や周産期・幼少期の要因、親のIBD、母親の喫煙などを調整し、摂取の多い群と少ない群を比べた。10代に塩味スナックを多く食べていた人は、IBD全体のリスクが32％、潰瘍性大腸炎のリスクが51％高かった。子ども時代に果物を多く食べていた人はクローン病のリスクが34％低かった一方、潰瘍性大腸炎のリスクは54％高かった。10代の果物の摂取はクローン病のリスクが64％低いことと関連し、潰瘍性大腸炎とは関連がなかった。子ども時代の魚の摂取はクローン病のリスクが35％低いことと関連した。ほかの食品群では統計的に意味のある関連はみられなかった。\n【ポイント・注意点】研究者は、果物の食物繊維が腸内細菌の多様性を高めることや、脂の多い魚に含まれるオメガ3脂肪酸が炎症の経路に影響することが仕組みとして考えられるとしている。ただし観察研究のため因果関係は示せず、運動量や成長後の抗生物質の使用は調整できていない。食事全体のパターンではなく特定の食品群を調べた点も限界だ。研究者は、ほかの集団でも確かめられれば、健康的な食習慣を勧めることがIBDの予防策になりうるとしている。","2026-11-23","News-Medical","https://www.news-medical.net/news/20261123/Salty-snacks-in-adolescence-linked-to-higher-risk-of-IBD.aspx"]],"dev":[["神経細胞の「身元」遺伝子 発達期の脳回路の興奮を抑える役も マウス研究","英キングス・カレッジ・ロンドンなどの研究チームは、大脳皮質の興奮性神経細胞の種類を決める遺伝子Fezf2が、生後の脳では別の働きをしていることをマウスで示した。神経細胞が強く活動するとFezf2の発現が増え、周りの抑制性神経細胞がその細胞へ接続をつくって活動を抑える。発達中の回路で興奮と抑制の釣り合いを保つ仕組みで、神経発達症の理解につながる可能性がある。成果は学術誌Nature Neuroscienceに掲載された。","\n【概要】英キングス・カレッジ・ロンドン（KCL）の研究チームは、神経細胞の「身元」を決める遺伝子として知られるFezf2が、生まれた後の脳では回路のバランスを保つ別の役割を担っていることを、マウスの大脳皮質で明らかにした。論文は学術誌「Nature Neuroscience」に掲載された。筆頭著者はKCL在籍中に研究を行ったティム・クローン博士で、発達神経生物学のベアトリス・リコ教授らが率いた。スペインのバレンシアとアリカンテの研究機関も共同で参加している。\n【背景】大脳皮質では、興奮性の錐体細胞と、その活動を抑える抑制性の神経細胞が組み合わさって回路をつくる。Fezf2は、ET錐体細胞と呼ばれる興奮性神経細胞が発生の過程でどの種類の細胞になるかを決める遺伝子として知られてきた。発達期に興奮と抑制の釣り合いがうまく調節されないと、回路が正常に成熟しないと考えられている。\n【詳細】研究チームは、Fezf2の発現が神経の活動によって調節されていることを見いだした。ET神経細胞が強く活動するとFezf2の発現が増え、近くにある抑制性神経細胞が、そのET神経細胞に向けて接続をつくるよう促される。新しくできた抑制性の入力はET神経細胞の活動を下げ、回路が発達する間に興奮が行き過ぎないよう保つ働きをする。さらにチームは、リボソームに結合したmR
