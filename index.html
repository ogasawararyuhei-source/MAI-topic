<style>

:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;display:flex;flex-direction:column;height:100dvh;overflow:hidden;transition:background .35s ease,color .35s ease}
body::before{content:"";position:fixed;inset:0;background:var(--pattern);pointer-events:none;opacity:var(--pattern-op,.5)}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
[data-theme="steampunk"]{--bg:#e6d7b8;--pattern:radial-gradient(circle at 12% 20%,rgba(141,100,40,.16) 0 26px,transparent 27px),radial-gradient(circle at 88% 78%,rgba(141,100,40,.13) 0 38px,transparent 39px),repeating-linear-gradient(0deg,rgba(90,62,25,.05) 0 1px,transparent 1px 26px);--pattern-op:1;--card:#f8eed3;--ink:#2e2010;--muted:#77603c;--line:#a97f3f;--accent:#9c4a12;--accent2:#2f5d50;--accent-ink:#fff6df;--soft:#efdfba;--old:#97835f;--top-bg:#2a1a0c;--top-ink:#f2dfae;--radius:8px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\2699  \2699  \2699";--shadow:0 14px 34px rgba(62,40,8,.28)}
[data-theme="witch"]{color-scheme:dark;--bg:#161022;--pattern:radial-gradient(circle at 18% 12%,rgba(233,213,255,.20) 0 1.5px,transparent 2.5px),radial-gradient(circle at 72% 22%,rgba(233,213,255,.14) 0 1px,transparent 2px),radial-gradient(circle at 42% 66%,rgba(196,181,253,.12) 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 84%,rgba(233,213,255,.16) 0 1px,transparent 2px),radial-gradient(circle at 6% 88%,rgba(196,181,253,.12) 0 1px,transparent 2px);--pattern-op:1;--card:#241a3d;--ink:#f1eaff;--muted:#bdaee0;--line:#5b4595;--accent:#a678ff;--accent2:#e9d5ff;--accent-ink:#1d1233;--soft:#2f2350;--old:#8d81ad;--top-bg:#0e0919;--top-ink:#efe6ff;--radius:20px;--font-display:"IM Fell English","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\263E  \2726  \263D";--shadow:0 14px 34px rgba(0,0,0,.5)}
[data-theme="dnd"]{--bg:#e7d9b4;--pattern:repeating-linear-gradient(45deg,rgba(158,43,37,.05) 0 2px,transparent 2px 18px),radial-gradient(circle at 85% 10%,rgba(158,43,37,.10) 0 30px,transparent 31px);--pattern-op:1;--card:#f7ecc9;--ink:#332216;--muted:#7d6248;--line:#8c6a3f;--accent:#9e2b25;--accent2:#a97b00;--accent-ink:#fdf3d8;--soft:#eee0b6;--old:#9a8a72;--top-bg:#471611;--top-ink:#f7e7bd;--radius:4px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\265E  \2726  \265E";--shadow:0 14px 30px rgba(71,22,17,.30)}
[data-theme="celtic"]{--bg:#e3dfc6;--pattern:repeating-linear-gradient(0deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px),repeating-linear-gradient(90deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px);--pattern-op:1;--card:#f6f2dc;--ink:#20331e;--muted:#5d7050;--line:#77873f;--accent:#2e6b34;--accent2:#a8842a;--accent-ink:#fbf7e2;--soft:#e7e5c8;--old:#93a086;--top-bg:#17351f;--top-ink:#efeccb;--radius:14px;--font-display:"Uncial Antiqua","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\16DA  \2726  \16DB";--shadow:0 14px 30px rgba(23,53,31,.26)}
[data-theme="greek"]{--bg:#f2eee3;--pattern:repeating-linear-gradient(90deg,rgba(29,95,138,.06) 0 1px,transparent 1px 34px),radial-gradient(circle at 90% 0%,rgba(185,138,28,.10) 0 60px,transparent 61px);--pattern-op:1;--card:#fffdf6;--ink:#1e2c38;--muted:#66727c;--line:#b3923c;--accent:#1d5f8a;--accent2:#b98a1c;--accent-ink:#ffffff;--soft:#ece7d7;--old:#a3a8ad;--top-bg:#fdfbf4;--top-ink:#1e2c38;--radius:2px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\03A9  \2766  \03A9";--shadow:0 14px 30px rgba(30,44,56,.18)}
.top{flex:none;position:relative;z-index:30;background:var(--top-bg);color:var(--top-ink);border-bottom:3px double var(--line)}
.topin{max-width:1080px;margin:auto;padding:10px 16px 4px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.logo{font-family:var(--font-display);font-weight:900;font-size:23px;letter-spacing:.06em}.logo span{color:var(--accent2)}
[data-theme="witch"] .logo span,[data-theme="steampunk"] .logo span{color:var(--accent)}
.date{font-size:10px;opacity:.75;white-space:nowrap}
.topbtns{display:flex;gap:8px;flex:none}.pill{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.themes{max-width:1080px;margin:auto;padding:6px 16px 10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.themes-label{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;opacity:.8}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;opacity:.85}
.theme-btn .gly{margin-right:5px}
.theme-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
.stage-wrap{flex:1;min-height:0;max-width:1080px;width:100%;margin:auto;padding:10px 16px 12px;display:flex;flex-direction:column;position:relative;z-index:1}
.herostrip{flex:none;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;box-shadow:var(--shadow)}
.herostrip img{width:74px;height:52px;object-fit:cover;border-radius:calc(var(--radius) * .6);flex:none}
.herostrip p{margin:0;font-size:13px;color:var(--muted)}.herostrip b{color:var(--ink);font-family:var(--font-display)}
.catbar{flex:none;display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.catbar .navbtn{flex:none}
.catinfo{flex:1;text-align:center;min-width:0}
.catinfo h2{margin:0;font-family:var(--font-display);font-size:clamp(19px,4.6vw,27px);line-height:1.25;letter-spacing:.03em}
.catinfo p{margin:1px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catcount{flex:none;font-size:12px;background:var(--soft);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-weight:700}
.navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800;box-shadow:var(--shadow)}
.navbtn:active{transform:scale(.97)}
.dots{flex:none;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:transparent;padding:0}
.dot.active{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.stage{flex:1;min-height:0;touch-action:none;position:relative}
#cardSlot{height:100%}
.card{height:100%;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
.card::after{content:var(--orn);position:absolute;top:6px;right:12px;font-size:13px;letter-spacing:.3em;color:var(--accent2);opacity:.85;pointer-events:none}
.card.old .ph{filter:grayscale(1)}
.card .ph{width:100%;height:30%;min-height:120px;object-fit:cover;display:block;flex:none}
[data-theme="steampunk"] .card .ph{filter:sepia(.35) contrast(1.05)}
[data-theme="witch"] .card .ph{filter:saturate(.85) hue-rotate(-12deg) brightness(.92)}
[data-theme="dnd"] .card .ph{filter:sepia(.25) saturate(1.1)}
[data-theme="celtic"] .card .ph{filter:saturate(1.05) hue-rotate(6deg)}
[data-theme="greek"] .card .ph{filter:saturate(.92) brightness(1.04)}
.cbody{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.badge{background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:999px;font-weight:800}.badge.oldb{background:var(--old)}
.card h3{margin:0;font-size:clamp(17px,4.4vw,21px);line-height:1.45;font-family:var(--font-display);font-weight:700}
.sum{font-size:14px;color:var(--muted);margin:0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.btn{border:0;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800}
.btn.primary{background:var(--accent);color:var(--accent-ink)}.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.saved{background:var(--accent2);color:var(--accent-ink)}
.src{font-size:11px;color:var(--muted);word-break:break-all}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;color:var(--muted)}
.empty .big{font-size:34px;color:var(--accent2)}
.pager{flex:none;display:flex;align-items:center;gap:10px;margin-top:10px}
.pager .navbtn{flex:1}
.artdots{flex:none;display:flex;gap:5px;max-width:34vw;flex-wrap:wrap;justify-content:center}
.artcount{flex:none;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.hint{flex:none;font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.addcat{flex:none;text-align:center;margin-top:6px}
.addcat button{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700}
@keyframes inNext{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes inDown{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes inUp{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
.anim-next{animation:inNext .28s ease}.anim-prev{animation:inPrev .28s ease}.anim-down{animation:inDown .28s ease}.anim-up{animation:inUp .28s ease}
dialog{border:2px solid var(--line);border-radius:calc(var(--radius) + 6px);padding:0;max-width:min(680px,94vw);width:680px;max-height:92dvh;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,8,4,.6)}
.din{padding:20px;overflow-y:auto;max-height:92dvh}
.din img{width:100%;height:200px;object-fit:cover;border-radius:var(--radius)}
.din h3{font-size:20px;line-height:1.4;margin:12px 0 6px;font-family:var(--font-display)}
.full{font-size:15px;white-space:pre-line}
textarea,input[type="text"]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px}
label.fl{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
.memoBox{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.memoItem{border-top:1px solid var(--line);padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--top-bg);color:var(--top-ink);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:90vw;text-align:center}
@media(max-width:640px){.topin{padding:8px 12px 2px}.themes{padding:4px 12px 8px}.stage-wrap{padding:8px 12px 10px}.herostrip{display:none}.catbar .navbtn{padding:8px 10px;font-size:12px}.card .ph{height:24%;min-height:104px}}
@media(prefers-reduced-motion:reduce){.anim-next,.anim-prev,.anim-down,.anim-up{animation:none}body{transition:none}}

</style>

const DATA = {"ai":[["米非営利団体4団体、OpenAIなど5社に先端AI開発の差し止め求め提訴","米国の非営利団体4団体が2026年11月12日、OpenAI・Google・Anthropic・Meta・SpaceXのAI部門を相手取り、先端AIモデルの開発・提供差し止めを求める訴訟をカリフォルニア州裁判所に起こした。各社幹部自身の「破滅的リスク」発言を法的根拠としている点が特徴で、AI業界への大きな法的インパクトが懸念されている。テック説明責任や消費者保護を掲げる米国の非営利団体4団体が2026年11月12日（木）、サンフランシスコの裁判所にOpen","\n【概要】\nテック説明責任や消費者保護を掲げる米国の非営利団体4団体が2026年11月12日（木）、サンフランシスコの裁判所にOpenAI、Google、Anthropic、Meta、SpaceXのAI部門（SpaceXSI）を相手取る訴訟を提起した。先端AIモデルの開発と提供の差し止めを求める内容で、AI業界を揺るがす訴訟として注目されている。\n\n【背景】\n原告となったのはIrreplaceable Education Fund、Public Citizen、Heat Initiative、Alliance for Secure AIの4団体。訴状は、各社が人間の制御を逃れる可能性のある先端AIを開発しているにもかかわらず、それを食い止める現実的な手段を持たないと主張している。訴訟の根拠にはカリフォルニア州の不公正競争法が用いられている。\n\n【詳細】\n訴状は各社経営陣自身の発言を証拠として引用している。アンソロピックのダリオ・アモデイCEOは昨年、AIの未来が「非常に、非常にまずい方向に進む」確率を4分の1とし、うまくいく確率を4分の3とする発言をしたとされる。またスペースXのイーロン・マスクCEOは2023年に、AIが「文明の破壊」につながり得ると発言したとされる。原告側は、こうした発言を逆手に取り、危険性を認識しながら開発を続けること自体が州法違反だと主張している。なお、この提訴は民主党が中間選挙でAI規制の必要性を訴えて議会の主導権を取り戻した直後のタイミングで行われており、トランプ大統領はAIの急速な開発を支持する立場を取っている。\n\n【ポイント・注意点】\nこの訴訟はフロリダ州司法長官が6月にOpenAIを提訴した訴訟に続く大型の法的措置であり、5社がフロンティアモデルの訓練計画の見直しを迫られる可能性があるとも指摘される。一方で9月18日には有料AIサービス利用者4名が、アンソロピック・OpenAI・Google・SpaceXAIがAI開発を遅らせるために共謀したとして独禁法違反で提訴しており、同じ大手3社が「開発の遅延は違法」とする訴訟と「開発の継続は違法」とする訴訟の両方で被告となる異例の状況が生じている。各社がどのように法廷戦略を組み立てるか、今後の展開が注目される。","2026-11-13","Al Jazeera / Reuters","https://www.aljazeera.com/news/2026/11/12/us-nonprofits-sue-tech-giants-to-halt-ai-development"],["Anthropic、IPO価格帯70～78ドルに設定　最大評価額1.4兆ドルへ","AnthropicがIPOの株価帯を1株70～78ドルに設定し、11月18日に価格決定、19日にナスダック上場（ティッカー：ANT）を予定していることが明らかになった。GoogleやNvidia、TSMCなどが戦略的投資家として参加する見通しで、AI業界過去最大級の上場案件として注目される。Claudeを開発するAnthropicが、新規株式公開（IPO）の価格帯を1株70～78ドルに設定したことが、11月10日付の米証券取引委員会（SEC）への改訂届出で","\n【概要】\nClaudeを開発するAnthropicが、新規株式公開（IPO）の価格帯を1株70～78ドルに設定したことが、11月10日付の米証券取引委員会（SEC）への改訂届出で明らかになった。公式のタイムテーブルでは11月18日ごろの最終価格決定、11月19日のナスダック取引開始が示されている。\n\n【背景】\nAnthropicは2026年5月のシリーズHで965億ドルの評価額を付けており、OpenAIと並ぶ世界有数のAI専業企業とされてきた。今回のIPOはAI業界における過去最大級の上場案件の一つとみられている。\n\n【詳細】\n11月10日に公開されたIPOロードショーでは、70～78ドルの価格帯で8億2500万株の公開株が提示された。上限価格では基本の公募取引総額が手数料前で643.5億ドルに達し、完全希薄化後の評価額は約1.4兆ドルになる見通しとされる。主幹事はゴールドマン・サックスとモルガン・スタンレーで、22行からなるシンジケート団が組まれている。またGoogleやNvidia、TSMCなどが戦略的投資家（コーナーストーン投資家）として参加する予定とされ、7社の戦略的買い手に対しIPO価格で260億ドル相当の無議決権クラスN株式を私募する計画も明らかになっている。CNBCの報道によれば機関投資家の需要はSpaceXの新規上場時よりも強く、すでに価格帯の上限で需要が完全にカバーされているという。\n\n【ポイント・注意点】\n今回のIPOはAI業界全体の株価下落局面というタイミングでの実施となっており、市場の受け止め方が注目される。最終価格と調達額は需要動向次第で変動するため、上場直前までの動きを注視する必要がある。また、戦略的投資家として名を連ねるGoogleやNvidia、TSMCとの今後の協業関係の深化も焦点となりそうだ。","2026-11-13","indmoney / CNBC","https://www.indmoney.com/blog/us-stocks/anthropic-ipo-price-band-valuation-listing-date"],["Google「Gemini 4 Hydrogen」を無料ユーザー含む全ユーザーに提供開始","GoogleはAIモデル「Gemini 4 Hydrogen」をAI Studio、Gemini API、Gemini for business、Geminiアプリ、検索など全プラットフォームに展開した。日常的なコーディングやAIエージェント向けタスクを高速処理する設計で、長文コンテキストでも均一料金を採用している。未成年者のアクセス管理に関する課題も浮上している。","\n【概要】\nGoogleは2026年11月13日、新型AIモデル「Gemini 4 Hydrogen」を無料ユーザーを含む全ユーザー向けに展開した。上位モデルの「Gemini 4 Carbon」や「Gemini 4 Argon」がじっくり考える設計であるのに対し、Hydrogenは日常のコーディングやAIエージェント向けタスクを素早くこなすことに特化している。\n\n【背景】\nAI各社はモデルの用途別の使い分けを進めており、Googleも思考の深さと速度のバランスが異なる複数モデルを展開する戦略を取っている。Hydrogenはこの中で「高速・軽量」を担う位置づけとなる。\n\n【詳細】\nHydrogenは日常のコーディングやAIエージェント向けの様々なタスクを素早く処理するために設計されており、Google AI Studio、Gemini API、Gemini for business、Geminiアプリ、Google検索で同日にグローバル展開が始まった。価格面ではAPIの料金は入力100万トークンあたり1.50ドル、出力100万トークンあたり7.50ドルで、100万トークンの長文コンテキスト全体にわたって均一料金が適用される点が特徴。またAntigravity機能の利用には有料のGoogle AI ProまたはUltraサブスクリプションが必要とされている。\n\n【ポイント・注意点】\n長文コンテキストでの均一料金設定は、大量のコードベースや長文ドキュメントを扱うAIエージェント用途での利用コスト予測を容易にする狙いがあるとみられる。一方で自動モデル切り替え機能の詳細な挙動については、今後の実運用での検証が必要となる。なお、GeminiをめぐってはWIREDが、学校でのアクセス制限をすり抜けて検索のAIモード経由で子どもがGeminiに接触したとする保護者の訴えを報じており、未成年者のアクセス管理についても議論となっている。","2026-11-13","note（AI Tech Morning Paper）/ Sam on AI","https://note.com/jsn525/n/n02bf9ce89f07?hl=en"],["OpenAI、AIエージェント同士が攻撃役となる自社アプリ診断ツールを公開","OpenAIは自社のWebアプリケーションに対し、AIエージェントが攻撃者役となってセキュリティ診断を行う新しいセキュリティ製品を発表した。同時にサイバーセキュリティ特化モデルの次世代版の性能も一部公開され、既存モデルを大きく上回る成果を示した。防御と攻撃両面でのAI活用が進んでいる。OpenAIは2026年11月13日、自社開発のWebアプリケーションに対しAIエージェントのチームが攻撃者として脆弱性診断を行う新しいセキュリティ製品をリリースした。","\n【概要】\nOpenAIは2026年11月13日、自社開発のWebアプリケーションに対しAIエージェントのチームが攻撃者として脆弱性診断を行う新しいセキュリティ製品をリリースした。同日未明に開催されたライブ配信では、開発中の次世代サイバーセキュリティ特化モデルの性能の一部も披露された。\n\n【背景】\nOpenAIは11月上旬にサイバーセキュリティ研究特化モデル「GPT-6 Cyber」を発表しており、Mozillaやパロアルトネットワークスなどのセキュリティチームへの先行提供を進めてきた。今回の発表はその延長線上にあり、AIを使った攻防両面でのセキュリティ強化を進める流れを示している。\n\n【詳細】\nOpenAIはAIエージェントが連携して自社のWebアプリをテストする製品をリリースし、攻撃者として振る舞うことで脆弱性を洗い出す仕組みとなっている。さらに同日未明に開催されたライブ配信「Frontier at the Cyber」では、開発中の次期サイバー特化モデルが、脆弱性の実際の悪用可能性を検証するベンチマーク「ExploitGym」において既存モデルを大きく上回る性能を見せたとされ、現行の「Mythos 5.2」の2倍の性能を記録したとの情報も伝えられている。先行する「GPT-6 Cyber」は脆弱性を発見して実際に悪用可能かどうかを検証し、修正案を作成する能力を高めたモデルとして11月5日に発表されており、ExploitGymベンチマークで48.5％のスコアを記録した実績がある。\n\n【ポイント・注意点】\nAIによる自動脆弱性診断は防御側の効率化に寄与する一方、攻撃側に悪用されるリスクとも表裏一体であり、OpenAIは提供先を審査済みの組織に限定するなど慎重な展開を取っている。今後、次世代サイバーモデルの正式リリース時期や提供範囲の拡大方針が注目される。","2026-11-13","note（AI Tech Morning Paper）/ Gizmodo Japan","https://www.gizmodo.jp/article/2611-openai-next-gen-cyber-ai-exploitgym/"],["United Airlines、AIエージェントによる航空券予約・変更を正式に禁止","ユナイテッド航空は運送約款を改定し、AIエージェントによるチケットの変更・購入を禁止した。違反した場合、予約取り消しやマイル削除、会員資格の剥奪、訴訟の可能性もあるとしている。AIエージェントの実社会での利用制限が広がる動きの一例として注目されている。米ユナイテッド航空は、AIエージェントが同社のフライト予約を行うことを認めないとする方針を明確化した。改定された運送約款（Contract of Carriage）では、人間の承認があってもAIエージェントに","\n【概要】\n米ユナイテッド航空は、AIエージェントが同社のフライト予約を行うことを認めないとする方針を明確化した。改定された運送約款（Contract of Carriage）では、人間の承認があってもAIエージェントによるチケット変更や購入を禁じており、違反した場合はマイルの削除や会員資格の剥奪といった厳しい対応を取るとしている。\n\n【背景】\n近年、消費者向けのAIエージェントがオンラインでの買い物や予約代行を行うサービスが急速に普及しており、航空業界でもこうしたエージェント型AIとの付き合い方が課題となっていた。今回の方針は、企業側がAIエージェントの自律的な取引行為に対し法的な線引きを設ける具体例となる。\n\n【詳細】\nユナイテッド航空は、AIエージェントが自社のフライト予約を行うことはできないとし、違反するとマイルを失う可能性があるとの方針を示した。改定された運送約款では、人間が承認した場合でもAIエージェントによるチケットの変更や購入を禁じており、同社は予約の取り消しやチケットの無効化、マイレージプラスのマイル削除、エリート会員資格の剥奪、さらには訴訟を起こす権利を留保している。この規定は、AIエージェントが人間の代理として航空会社のシステムやWebサイトを操作し、予約や変更を自動で行うことを想定した防御的措置とみられる。\n\n【ポイント・注意点】\nこの動きは、AIエージェントによる自律的な商取引が広がる中、企業側がサービス利用規約の面で先回りして対応を進めている一例と言える。今後、他の航空会社や小売、宿泊業界などでも同様の規約改定が広がる可能性があり、AIエージェントを使った自動化サービスを提供する側との摩擦が増える可能性がある。消費者にとっては、AIエージェント経由の操作がかえって自身の不利益（マイル喪失や会員資格剥奪）につながるリスクがある点に注意が必要となる。","2026-11-13","AISDG (Russ McGuire) / unite.ai","https://aisdg.substack.com/p/ai-news-for-november-13-2026"],["IBM、超軽量AIモデル「Granite 4.1 LLMON」の実験的プレビューを公開","IBMは3Bおよび8Bパラメータの実験的モデル「Granite 4.1 LLMON」のプレビューを公開した。専用のトークナイザー記号で指示とデータを明確に区分する設計により、プロンプトインジェクション対策を狙った新しいアーキテクチャを採用している。複数ターンの高度な攻撃への耐性は開発途上の課題として残る。IBMは2026年11月13日前後、実験的な小型言語モデル「Granite 4.1 LLMON」の3Bおよび8Bパラメータ版のプレビューを公開した。","\n【概要】\nIBMは2026年11月13日前後、実験的な小型言語モデル「Granite 4.1 LLMON」の3Bおよび8Bパラメータ版のプレビューを公開した。指示とデータを明確に分離する新しい設計を採用しており、プロンプトインジェクション攻撃への耐性向上を狙ったアーキテクチャとなっている。\n\n【背景】\n大規模言語モデルを業務システムに組み込む際、外部から入力されたデータの中に悪意ある指示文が紛れ込み、モデルを誤作動させる「プロンプトインジェクション」が深刻なセキュリティ課題となっている。IBMはこの課題に対処するため、モデルの構造自体を見直すアプローチを取った。\n\n【詳細】\nIBMは実験的な3Bおよび8BパラメータのGranite 4.1 LLMONプレビューを公開した。専用のトークナイザー区切り記号によって指示・データ・要件を識別し、実行ブロックが各指示をその入力データに明示的に結びつける仕組みになっている。IBMはこの振る舞いをベースのチェックポイントからモデルに学習させたという。ただし複数ターンにわたる高度な適応的攻撃への耐性については、まだ開発途上の課題として残されているとされる。\n\n【ポイント・注意点】\nプロンプトインジェクション対策は、企業がAIエージェントを業務システムに本格導入する上で避けて通れない課題であり、モデルのアーキテクチャレベルでの対策はまだ発展途上の分野である。IBMの試みは、トークナイザーレベルで指示とデータを区別するという比較的新しいアプローチであり、今後の実用性や他の攻撃パターンへの耐性について、第三者による検証結果が注目される。小型モデルでの実装である点も、エッジデバイスや低コスト環境での実用化を見据えた動きと考えられる。","2026-11-13","Sam on AI","https://samonai.substack.com/p/ai-brief-november-13-2026"],["SpaceX、AIデータセンター群に740億ドル投資計画","SpaceXは740億ドル規模のAI向けデータセンター「AIキャンパス」の建設計画を進めていると報じられた。AI開発企業としての同社の存在感が急速に高まる中、巨額投資による計算インフラ拡充が業界の大きな話題となっている。具体的な建設場所や稼働時期などの詳細は今後明らかになる見通し。宇宙開発企業として知られるSpaceXが、AI向けの大規模データセンター群（AIキャンパス）に740億ドルを投じる計画を進めていることが2026年11月13日前後に報じられた。","\n【概要】\n宇宙開発企業として知られるSpaceXが、AI向けの大規模データセンター群（AIキャンパス）に740億ドルを投じる計画を進めていることが2026年11月13日前後に報じられた。同社のAI部門（SpaceXSI）の事業規模拡大を示す動きとして注目されている。\n\n【背景】\nSpaceXは近年、宇宙事業に加えてAI分野への参入を進めており、独自のAIモデル開発や計算インフラへの投資を拡大してきた。今回報じられた巨額投資計画は、OpenAIやAnthropic、Googleなど既存のAI大手に対抗する布陣を築く動きの一環とみられる。\n\n【詳細】\nSpaceXが740億ドル規模のAIキャンパス建設を計画していることが、11月13日時点のAI業界ニュースのまとめで報じられた。同時期には、Jensen Huang氏のNVIDIA CEO辞任や、複数のAI企業に対する開発凍結を求める訴訟、Google「Gemini 4 Hydrogen」の一般提供開始など、AI業界で大きな動きが相次いでおり、SpaceXの投資計画もこうした激動の一部として伝えられた。\n\n【ポイント・注意点】\nAI向け計算インフラをめぐっては、OpenAIやMicrosoft、Google、Meta、Amazonなど既存の大手テック企業が既に巨額投資を進めており、SpaceXの参入はこの「AIインフラ投資競争」がさらに激化していることを示す。一方で、具体的な建設場所や稼働時期、資金調達の方法など詳細はまだ明らかになっておらず、今後の続報が待たれる。巨大なデータセンター建設は電力需要の急増にもつながるため、エネルギー供給や環境面への影響も注視されるポイントとなる。","2026-11-13","The Neuron","https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-friday-november-13-2026/"],["DeepSeek V4やOrnithのコーディングモデルがAWS SageMakerに登場","中国DeepSeekの「DeepSeek V4」や「Ornith」のコーディングモデルがAmazon SageMaker JumpStartに追加されたことが報じられた。オープンウェイトモデルのクラウド経由での利用がさらに広がっており、欧州製モデルファミリーの多様化やQwen3.8のランキング首位なども伝えられている。2026年11月13日前後のAI業界ニュースまとめで、中国DeepSeekの大規模言語モデル「DeepSeek V4」と、コーディング特化モ","\n【概要】\n2026年11月13日前後のAI業界ニュースまとめで、中国DeepSeekの大規模言語モデル「DeepSeek V4」と、コーディング特化モデル「Ornith」がAmazon SageMaker JumpStartに追加されたことが報じられた。オープンソース・オープンウェイトモデルのクラウド経由提供がさらに拡大している。\n\n【背景】\n近年、オープンウェイトのAIモデルは中国企業を中心に急速に性能向上が進み、商用クラウドプラットフォームでの採用も広がっている。AWSのSageMaker JumpStartは、様々な基盤モデルをワンクリックでデプロイできるサービスとして、企業の導入障壁を下げる役割を果たしている。\n\n【詳細】\nDeepSeek V4モデルとOrnithのコーディングモデルがAWS SageMaker JumpStartに追加されたことに加え、ある調査では欧州のオープンウェイトモデルファミリーが13種類存在することが確認され、Qwen3.8が11月のローカルモデルランキングで首位となったとされる。こうした動きは、米国企業発の閉鎖的な商用モデルだけでなく、オープンウェイトモデルのエコシステムが多様化・グローバル化していることを示している。\n\n【ポイント・注意点】\n企業がAIモデルを選定する際、性能だけでなく、ライセンス形態やクラウド基盤との統合のしやすさも重要な判断材料となっており、今回のSageMaker JumpStartへの追加は、DeepSeekやOrnithといったモデルの企業導入を後押しする可能性がある。一方、オープンウェイトモデルの急速な多様化は、どのモデルをどの用途に使うべきかという選定作業を複雑にしており、ベンチマークや実運用評価を踏まえた慎重な比較検討が引き続き必要とされる。","2026-11-13","Deep Gains (Arun S)","https://deepgains.substack.com/p/morning-brief-friday-november-13-928"],["メキシコ大統領、OpenAI共同創業者と医療AI活用を協議","メキシコのシェインバウム大統領がOpenAIのグレッグ・ブロックマン氏と会談し、医療分野でのAI活用について意見交換を行った。メキシコ政府は医薬品不足をAIで検知する諮問委員会を新設する方針で、中南米における政府とAI企業の連携事例として注目されている。メキシコのクラウディア・シェインバウム大統領が、OpenAIの共同創業者であるグレッグ・ブロックマン氏と会談し、AIがメキシコの医療分野にもたらし得る可能性について協議したことが報じられた。","\n【概要】\nメキシコのクラウディア・シェインバウム大統領が、OpenAIの共同創業者であるグレッグ・ブロックマン氏と会談し、AIがメキシコの医療分野にもたらし得る可能性について協議したことが報じられた。会談を受け、メキシコ政府はAIを活用した医薬品不足検知のための諮問委員会を新設するとされる。\n\n【背景】\n各国政府がAIの行政・公共サービスへの活用を模索する中、中南米でも医療や行政分野でのAI導入機運が高まっている。メキシコ政府にとって、OpenAIのような最先端のAI開発企業との対話は、自国の医療インフラ課題への技術的解決策を探る機会となる。\n\n【詳細】\nシェインバウム大統領とOpenAIのグレッグ・ブロックマン氏との会談では、メキシコの医療分野におけるAIの可能性について協議が行われ、メキシコ政府は医薬品不足の検知にAIを活用するための諮問委員会を新設したとされる。会談の具体的な日時や合意内容の詳細、諮問委員会の構成メンバーなどについては、今回確認できた範囲のニュースでは限定的な情報にとどまる。\n\n【ポイント・注意点】\n医薬品の供給不足は多くの国で医療アクセスの課題となっており、AIによる需給予測や在庫管理の最適化は実用性の高い応用分野とされる。一方で、医療分野へのAI導入にはデータプライバシーや診断・処方への影響など慎重な検討を要する論点も多く、諮問委員会がどのようなガバナンス体制を敷くのか、今後の運用方針が注目される。OpenAIにとっても、政府機関との連携事例を増やすことは、エンタープライズ・政府向け事業の拡大戦略の一環と位置づけられる。","2026-11-13","RIO Rundown (Mexico News Daily経由)","https://riorundown.substack.com/p/ai-news-nov-13-2026-leadership-transitions"],["腾讯混元、実時間音声AI「Hy Realtime」発表　歌唱やツール呼び出しも対応","腾讯の混元チームは2026年11月13日、新たな実時間音声モデル「Hy Realtime」を発表した。自然な対話に加え、エージェント的なツール呼び出しや歌唱機能を初めて統合し、元宝アプリや腾讯客服で先行提供を開始した。今後は腾讯クラウド経由でAPI公開も予定している。腾讯の大規模言語モデル部門「混元（Hunyuan）」は2026年11月13日、新たな実時間音声モデル「Hy Realtime」を正式発表した。","\n【概要】\n腾讯の大規模言語モデル部門「混元（Hunyuan）」は2026年11月13日、新たな実時間音声モデル「Hy Realtime」を正式発表した。音声理解や指示追従、擬人的な表現力といった基礎的な対話能力が強化されたほか、今回新たにエージェント的なツール呼び出し機能と歌唱機能が統合された点が特徴である。\n\n【背景】\n近年、音声AIはテキストベースの対話モデルに比べて自然さや応答速度で後れを取っているとされてきたが、各社は実時間双方向性と機能性の両立を競っている。腾讯は自社の音声通話アプリ「元宝」やカスタマーサポート「腾讯客服」など、既存プロダクトへの実装を通じて実用性を重視する姿勢を強めている。\n\n【詳細】\n公開情報によれば、Hy Realtimeはユーザーの音声指示を理解して自然な会話を行うだけでなく、対話の文脈や意図に応じてネット検索などのツールを自律的に呼び出し、検索判断・ツール利用・応答生成を一体的に処理できる。さらに腾讯音楽（TME）の音声AIチームとの共同設計により、自然言語でのリクエストに応じて歌唱表現を伴う応答を生成する機能も搭載された。これにより、音声アシスタントは単純な一問一答型から、より豊かなエージェント型の体験へと進化するとしている。現在、同モデルは元宝アプリの音声通話機能における新音色「初語」や公式ウェブデモを通じて一般ユーザーが体験可能であり、近日中に腾讯クラウドを通じて外部開発者向けに標準化されたAPIサービスとしても提供される予定である。\n\n【ポイント・注意点】\n同社は、双方向同時発話（デュプレックス）対応や長期的な個人化記憶のモデリング、フロントエンドの対話とバックエンドのエージェントとの連携強化など、今後の改良方針も示している。現時点ではまだ継続的な最適化段階にあるとされ、商用API提供の具体的な開始時期や料金体系については明らかにされていない。","2026-11-13","IT之家","https://www.ithome.com/1/026/825.htm"],["AI音声・画像なりすまし詐欺で129億円超被害、米司法省が3人を起訴","米司法省は2026年11月上旬、AIでCEOや弁護士の声や姿を模倣し、企業から総額約1億2900万ドル（約129億円超）をだまし取ったとして3人の男を起訴した。被害企業には米英の病院や金融機関などが含まれ、容疑者はスペインと英国で拘束され、身柄引き渡し手続きが進められている。米連邦検察は2026年11月5日、人工知能（AI）を使って企業幹部や大手法律事務所の弁護士の声・容姿を模倣し、経理担当者らを欺いて多額の資金を送金させたとして、Jacob Soall、","\n【概要】\n米連邦検察は2026年11月5日、人工知能（AI）を使って企業幹部や大手法律事務所の弁護士の声・容姿を模倣し、経理担当者らを欺いて多額の資金を送金させたとして、Jacob Soall、Sharon Hazan、Guy Sheetritの3名を電信詐欺や加重身元盗用、資金洗浄の罪で起訴したと発表した。\n\n【背景】\nAIによる音声・映像のなりすまし詐欺（ディープフェイク詐欺）は近年急速に巧妙化しており、過去には2019年に声だけを模倣して約24万ドルを騙し取った事件が知られていたが、今回の事件はその規模をはるかに上回る。起訴状によれば、一味は2024年7月から約18か月にわたり組織的にスキームを展開していたとされる。\n\n【詳細】\n検察によると、手口はまず経理担当の社員に対し、AIで模倣したCEOの声や映像を使って電話をかけ、「極秘の金融取引」への協力を依頼することから始まる。続いて電子署名サービスを装ったメールが送られ、守秘義務契約（NDA）への署名を求めたうえで、大手国際法律事務所の弁護士になりすました人物との通話に誘導し、最終的に送金を指示するという一貫したパターンが取られていた。被害に遭った組織には、英国の金融テック企業（約1160万ドル）、ミズーリ州の病院システム（約480万ドル）、マサチューセッツ州の投資信託会社（約460万ドル）、フロリダ州のペットフード企業（約520万ドル）などが含まれ、被害総額は少なくとも1億2900万ドルに上るとされる。被告のうち1人は過去にも銀行詐欺共謀罪で有罪判決を受けた経歴があり、別の被告は過去3年間で4億ドル超の資金洗浄を自慢していたとも報じられている。\n\n【ポイント・注意点】\n3人はスペインと英国でそれぞれ身柄を拘束されており、米国への身柄引き渡し手続きが進行中である。本件は、生成AIによる音声・映像の精巧な模倣が組織犯罪の実用的な道具として悪用される段階に入ったことを示す事例として注目されており、企業にはコールバック確認や複数承認者制度など、AIなりすましを前提とした送金検証プロセスの強化が求められている。","2026-11-13","Paubox","https://www.paubox.com/blog/doj-charges-three-men-in-129m-ai-deepfake-scheme"],["英矽智能、罗欣薬業とAI創薬で長期戦略提携　消化器・代謝疾患に注力","AI創薬企業の英矽智能（Insilico Medicine）は2026年11月13日、中国製薬大手の罗欣薬業と、AIを活用した医薬品研究開発における長期戦略提携を締結したと発表した。消化器疾患や代謝性疾患など非腫瘍系の慢性疾患領域で、生成AI技術と臨床知見を融合した創薬を目指す取り組みとして注目される。両社は消化器系疾患、代謝性疾患、その他の非腫瘍系慢性疾患領域に焦点を当てる方針である。","\n【概要】\nAI創薬企業の英矽智能（Insilico Medicine）と中国の製薬大手・罗欣薬業（Luoxin Pharmaceutical）は2026年11月13日、人工知能を活用した医薬品研究開発に関する長期的な戦略提携で合意したと共同発表した。両社は消化器系疾患、代謝性疾患、その他の非腫瘍系慢性疾患領域に焦点を当てる方針である。\n\n【背景】\n創薬分野では、候補化合物の探索や臨床試験デザインの効率化を目的に、生成AIを活用する動きが世界的に広がっている。英矽智能はAI創薬のパイオニアとして知られ、既に複数の候補薬を自社のAIプラットフォームを用いて開発してきた実績を持つ。今回の提携は、伝統的な製薬企業が持つ疾患領域の専門知識や臨床データと、AI企業の技術力を組み合わせる狙いがあるとみられる。\n\n【詳細】\n両社の発表によれば、今回の提携では生成AI技術を、疾患領域の専門知識、研究データ、医薬品研究開発の経験と深く融合させることで、臨床的価値と開発可能性を兼ね備えた革新的な新薬の研究開発機会を共同で探索するとしている。対象領域として明示されているのは消化器系疾患と代謝性疾患であり、これら以外の非腫瘍系の慢性疾患も対象に含まれる。中国国内では近年、AI創薬企業と伝統的製薬企業との連携が相次いでおり、臨床知見とAIによる化合物設計・スクリーニング能力を組み合わせることで、新薬開発のスピードとコストの両面で効率化を図る動きが加速している。\n\n【ポイント・注意点】\n今回の提携内容について、具体的な投資規模や開発期間、対象となる候補薬の詳細は現時点では明らかにされていない。AI創薬分野における企業間連携は今後も増加が見込まれ、臨床試験の成功率向上やコスト削減にどこまで寄与できるかが引き続き注目点となる。両社の今後の進捗発表や、他の中国製薬企業への波及効果にも関心が集まっている。","2026-11-13","人民財訊","https://k.sina.com.cn/article_7857201856_1d45362c001908upt6.html"],["NVIDIA取締役会、フアンCEOの解任を検討　中国スパイ疑惑めぐり","NVIDIAの取締役会が、ジェンスン・フアンCEOの解任を検討するため11月11日に会合を開いた。中国の情報機関との関係が疑われる女性との交際をフアン氏が認めたことが発端で、取締役会は独立調査も開始。解任されれば33年の在任に幕を閉じることになる。NVIDIAの取締役会が、共同創業者でCEOのジェンスン・フアン氏の去就を決めるため、2026年11月11日に会合を開いた。","\n【概要】\nNVIDIAの取締役会が、共同創業者でCEOのジェンスン・フアン氏の去就を決めるため、2026年11月11日に会合を開いた。フアン氏が中国の情報機関との関係が疑われる女性との不倫関係を認めたことが発端で、取締役会はフアン氏が外国の情報活動の標的になっていないか独立調査も開始した。\n\n【背景】\nフアン氏は1993年の創業以来33年にわたりNVIDIAを率い、同社をAI半導体の中心企業に育ててきた。11月8日の社員向けメモで、シンガポール企業Megaspeedの元幹部アリス・フアン氏との不倫関係を認めた。米当局は同氏が中国の情報機関と関係があると疑っており、中国側は否定している。さらに11月11日には、部下であるヘルスケア担当副社長のキンバリー・パウエル氏との関係も報じられた。\n\n【詳細】\n米紙ウォール・ストリート・ジャーナルは取締役会がフアン氏の解任準備を進めていると報じ、報道後にNVIDIA株は時間外取引で8％超下落し、週を通じて時価総額は約6,000億ドル減少した。定款上、取締役会は過半数の賛成でフアン氏を理由の有無を問わず解任できる。取締役11人のうちフアン氏以外は全員が社外取締役で、フアン氏の保有株は約3.6％にとどまる。ブルームバーグは、取締役会が外部企業とともに後任候補の特定を進めていると報じた。後継者は指名されておらず、CFOのコレット・クレス氏と技術者のイアン・バック氏が有力な社内候補とみられている。\n\n【ポイント・注意点】\n解任が決まれば、33年に及ぶ創業者CEOの在任に幕を閉じることになる。トランプ米大統領はFBIがこの件を調べていると述べたほか、議会の委員会はフアン氏に11月18日の非公開説明を求めている。なお、11月12日時点で辞任や解任は発表されておらず、取締役会は11月8日の声明でフアン氏と経営陣への信頼を示している。市場の注目は今後の取締役会の判断に集まっている。","2026-11-12","Al Jazeera","https://www.aljazeera.com/amp/news/2026/11/12/nvidia-board-weighs-jensen-huangs-future-can-it-remove-its-founder"],["Airbnb、AI活用で予約1件あたりの支援コストを17%超削減と発表","AirbnbはCEOブライアン・チェスキー氏が決算説明会で、AIアシスタントの改善により予約1件あたりのサポートコストが前年比17%超減少したと説明した。第3四半期には全サポート問い合わせの約4割が人の対応なしに解決されたという。コスト削減と顧客満足度向上の両立事例として注目されている。Airbnbは2026年11月の第3四半期決算発表で、AIアシスタントの機能改善により予約1件あたりのカスタマーサポートコストが前年同期比で17%超減少したと明らかにした。","\n【概要】\nAirbnbは2026年11月の第3四半期決算発表で、AIアシスタントの機能改善により予約1件あたりのカスタマーサポートコストが前年同期比で17%超減少したと明らかにした。CEOのブライアン・チェスキー氏は、全サポート問い合わせのうち約4割が人間の担当者を介さずに解決されたと説明している。\n\n【背景】\nAirbnbは従来型のチャットボット形式ではなく、旅行用途に特化した独自設計のAIアシスタントの開発を進めてきた。2026年初めの時点では問題解決の自動化率は3割程度だったが、その後機能強化が重ねられ、第3四半期には約4割まで引き上げられた。\n\n【詳細】\nチェスキー氏は決算説明会で、コスト削減は「主にAIアシスタントの改善によってもたらされた」と述べ、カスタマーサービスの顧客満足度（NPS）も「これまでで最も高い水準」にあると強調した。AirbnbのAIアシスタントは、地図や写真、比較表、カレンダー、旅程など数百種類の旅行特化型インターフェース部品のライブラリから、利用者の要望に応じてリアルタイムに最適な回答画面を組み立てる設計になっているという。チェスキー氏はこれらの改善について「まだ始まりに過ぎない」と述べ、今後さらなる自動化の進展を示唆した。同社はAIを活用した独自のトリップ企画エージェントの開発も進めており、2027年前半の展開を予定しているとされる。\n\n【ポイント・注意点】\nAIによるサポート業務の自動化は、企業収益の改善だけでなく顧客満足度の両立が課題となってきたが、Airbnbの事例は両立が可能であることを示す参考事例として注目されている。一方で、自動化率の継続的な上昇が本当に持続するかどうか、繁忙期やイレギュラー対応時の精度について懸念の声も一部にある。今後のトリップ企画エージェント展開による効果拡大にも関心が集まっている。","2026-11-11","Storyboard18","https://www.storyboard18.com/how-it-works/airbnb-automates-40-of-customer-support-with-ai-cuts-cost-per-booking-by-over-17-114242.htm"],["Grok Buildの公開アプリ3.5万件超が無防備、SpaceXSI社内資料も流出","セキュリティ企業Clarocは、SpaceXSIのAIコーディングエージェント「Grok Build」で作成された約3.7万件のアプリのうち9割超がログイン不要でアクセス可能だったと公表した。SpaceXSI社員が作成した社内資料や複数企業の医療記録・従業員情報なども流出しており、AI生成アプリの公開設定管理という新たなリスクが浮き彫りとなった。セキュリティ企業Clarocは2026年11月10日に公表した調査で、SpaceXSI（旧xAI）が提供するAI","\n【概要】\nセキュリティ企業Clarocは2026年11月10日に公表した調査で、SpaceXSI（旧xAI）が提供するAIコーディングエージェント「Grok Build」で生成されたアプリのうち、9割超にあたる3万5千件以上がログイン不要で誰でもアクセス可能な状態だったと明らかにした。流出データにはSpaceXSI自身の社内資料も含まれていた。\n\n【背景】\nGrok Buildはユーザーがアプリを公開する際に「リンクを知っている人なら誰でも」アクセス可能という設定がデフォルトになっており、かつアプリのアドレスが公開DNSレコードに記録される仕様だった。この組み合わせにより、第三者がリンクを知らなくても総当たり的にアプリを発見できる状態になっていたとClarocは指摘している。\n\n【詳細】\nClarocの調査では、稼働中だった3万7571件のオンラインアプリのうち3万5578件（約94.7%）がサインインなしで開ける状態だった。このうち650〜800件程度に個人情報や機密データが含まれていたと推定され、医療検査結果やクルーズ船の乗船名簿、従業員の氏名とID番号、平文パスワードなどが見つかった。フォーチュン500に入る6社の内部データも影響を受けたとされる。皮肉なことに、SpaceXSIおよびXのスタッフ自身が作成した24のアプリからも、社内の営業計画や広告提案書など機密情報が流出していた。SpaceXSIは自社関連の24アプリを削除したが、他ユーザーのアプリは本稿時点でも公開されたままとなっている。\n\n【ポイント・注意点】\nClarocは日曜日にSpaceXSIへ通知したが応答がなかったとしており、企業側の初動対応の遅さも問題視されている。研究者は、共有時のデフォルト設定を「自分だけ」に変更すること、推測困難なパスへの変更、データベース連携時にサインインなしであることを警告する仕組みの導入をSpaceXSIに求めている。AIが自動生成するアプリの公開設定管理という新しいタイプのセキュリティリスクを示す事例として注目されている。","2026-11-10","TheNextWeb","https://thenextweb.com/news/grok-build-apps-exposed-claroc-spacexsi"],["NotionのAIチャット記録、委託先Fireworks AI不正アクセスで流出の可能性","Notionは2026年11月9日、AI推論基盤を委託していたFireworks AIが不正アクセスを受け、Notion AIのチャット記録の一部が第三者に閲覧された可能性があると公表した。影響は全ワークスペースの1%未満とされるが、記録には貼り付けたパスワードやAPIキーが含まれる恐れがあり、国内企業にも影響が波及している。Notionは2026年11月9日、委託先のAI推論基盤Fireworks AIで発生したセキュリティインシデントにより、Notio","\n【概要】\nNotionは2026年11月9日、委託先のAI推論基盤Fireworks AIで発生したセキュリティインシデントにより、Notion AIで交わされた一部のチャット記録が第三者にアクセスされた可能性があると公表した。影響範囲はNotion全ワークスペースの1%未満とされるが、ユーザーが入力したパスワードやAPIキーが記録に含まれていた可能性があり、注意喚起が行われている。\n\n【背景】\nNotionはAI機能の一部処理を外部のAI基盤企業Fireworks AIに委託していた。Fireworksでは2026年10月に内部認証情報の不正使用が確認され、さらに10月24日には第三者クラウド事業者を経由した侵入も検知されていた。11月2日夜、Fireworksは「少量のデータに不正アクセスがあった」とNotionに通知したが、当初は合成テストデータであり顧客データは含まれていないとされていた。\n\n【詳細】\nしかし11月6日、Fireworksから「攻撃者が顧客データにアクセスした可能性がある」との追加連絡があり、11月8日に対象データが確認された。分析の結果、Notion AIのチャット記録が含まれていることが判明し、11月9日に両社は公式情報を更新、影響を受けた顧客への個別通知を進めた。Notionは11月3日までにFireworksとの接続を切断し、同社側のデータをすべて削除、AI利用状況分析機能「Insights」も無効化した。流出した可能性がある記録の大半には発言者やワークスペースを示すラベルが付いておらず、AIがツールを実行した結果も含まれていないという。国内では11月11日以降、LRMやSecureNaviなど複数の企業が自社への影響を公表している。\n\n【ポイント・注意点】\nNotionはチャット記録に貼り付けたパスワードやAPIキーの再発行を利用者に推奨している。11月11日には、調査の過程で発見された露出APIキーの失効作業も行われた。委託先企業を経由したサプライチェーン型のAI関連インシデントとして、企業のAI利用ガバナンス強化の必要性が改めて浮き彫りになった事例である。","2026-11-09","piyolog","https://piyolog.hatenadiary.jp/entry/2026/11/11/125745"]],"gh-pop":[["Nutlope/hallmark、Claude Code向けアンチAIスラップ設計スキルが5.4万スターに","Claude CodeやCursor、Codexといった開発エージェント向けに、AIが生成しがちな質の低い「AIスラップ」デザインを防ぐための設計スキルを提供するリポジトリNutlope/hallmarkが、GitHub上で5.4万を超えるスターを獲得し注目を集めています。公開から半年あまりで急速に支持を広げた点も特徴です。Nutlope/hallmarkは、Claude Code、Cursor、Codexといった主要なAIコーディングエージェント向けに提","\n【概要】\nNutlope/hallmarkは、Claude Code、Cursor、Codexといった主要なAIコーディングエージェント向けに提供される「アンチAIスラップ」設計スキルです。GitHub APIで確認されたスター数は54,358に達しており、開発者コミュニティから高い関心を集めていることがうかがえます。リポジトリの説明文には「Anti-AI-slop design skill for Claude Code, Cursor, and Codex.」と記されています。\n\n【背景】\nAIコーディングエージェントの普及に伴い、生成されるコードやデザインの品質にばらつきが生じる「AIスラップ」と呼ばれる現象が課題として認識されるようになりました。このリポジトリは、そうした質の低い出力を防ぎ、より洗練された設計を実現するためのスキルとして公開されたと見られます。作成日は2026年4月27日と記録されており、公開から半年以上で5万を超えるスターを集めた計算になります。\n\n【詳細】\nhallmarkは特定のプログラミング言語に依存するツールではなく、複数の代表的なAIコーディングエージェント（Claude Code、Cursor、Codex）に対応したスキルとして設計されています。これにより、利用する開発ツールを問わず、一貫した設計品質の向上を図ることができる点が特徴として挙げられます。具体的な機能の詳細は説明文からは限定的ですが、「アンチAIスラップ」という名称が示す通り、AIが生成しがちな定型的・低品質な出力を回避することを目的としたスキルセットであることが読み取れます。\n\n【ポイント・注意点】\n本リポジトリは2026年4月27日に作成され、同年11月13日時点でスター数54,358を記録しています。短期間で多数のスターを獲得していることから、AIコーディングエージェントを利用する開発者の間で、生成物の品質管理に対する関心の高さがうかがえます。導入を検討する際は、対応するエージェント（Claude Code、Cursor、Codex）の種類や、具体的な適用方法についてリポジトリ内の情報を確認することが推奨されます。","2026-11-14","GitHub (Nutlope/hallmark)","https://github.com/Nutlope/hallmark"],["shiyu-coder/Kronos、金融市場の言語を学ぶ基盤モデルが4.8万スターに","金融市場特有の「言語」を学習する基盤モデルKronosを公開するリポジトリshiyu-coder/Kronosが、GitHub上で4.8万近いスターを獲得しました。金融データ解析分野における基盤モデルの応用例として注目され、約1年4ヶ月での急成長が特徴です。shiyu-coder/Kronosは、「金融市場の言語（Language of Financial Markets）」を学習することを目的とした基盤モデル（ファンデーションモデル）を提供するリポジトリ","\n【概要】\nshiyu-coder/Kronosは、「金融市場の言語（Language of Financial Markets）」を学習することを目的とした基盤モデル（ファンデーションモデル）を提供するリポジトリです。GitHub APIで確認されたスター数は47,731に達しており、金融分野へのAI応用に関心を持つ開発者や研究者から広く支持されていることがわかります。リポジトリの説明文には「Kronos: A Foundation Model for the Language of Financial Markets」と記されています。\n\n【背景】\n近年、自然言語処理分野で培われた基盤モデルの技術を、金融市場データのような時系列・構造化データに応用する試みが進んでいます。Kronosは、そうした流れの中で金融市場特有のパターンや変動を「言語」として捉え、学習するアプローチを採用したモデルとして公開されたと見られます。リポジトリの作成日は2025年7月1日であり、約1年4ヶ月の間に多くのスターを集めたことになります。\n\n【詳細】\nKronosという名称を冠したこの基盤モデルは、金融市場データに内在する規則性や構造を学習の対象としている点が特徴です。説明文からは、一般的な自然言語モデルとは異なり、金融市場という特定ドメインに特化した基盤モデルであることが明確に示されています。具体的なアーキテクチャや学習手法についての詳細情報は提供されていませんが、「Foundation Model」という表現から、下流タスクへの応用を見据えた汎用性の高いモデル設計がなされていることが推測されます。\n\n【ポイント・注意点】\n本リポジトリは2025年7月1日に作成され、2026年11月13日時点でスター数47,731を記録しています。金融市場データを扱う基盤モデルという特殊な分野でありながら、短期間でこれだけの支持を集めている点は注目に値します。実際の活用を検討する際は、モデルの学習データの範囲や、対象とする市場・資産クラスなど、リポジトリ内の詳細情報を確認したうえで判断することが望まれます。","2026-11-14","GitHub (shiyu-coder/Kronos)","https://github.com/shiyu-coder/Kronos"],["zortos293/Lichii、実験的なSwitch 2エミュレーターが8,906スターに","Nintendo Switch 2向けの実験的なエミュレーターを開発するリポジトリzortos293/Lichiiが、公開から間もなく8,906スターを獲得しました。新型ゲーム機のエミュレーション開発への関心の高さがうかがえ、公開2週間足らずでの急成長が注目されます。zortos293/Lichiiは、Nintendo Switch 2を対象とした「非常に実験的な（VERY experimental）」エミュレーターを開発するリポジトリです。","\n【概要】\nzortos293/Lichiiは、Nintendo Switch 2を対象とした「非常に実験的な（VERY experimental）」エミュレーターを開発するリポジトリです。GitHub APIで確認されたスター数は8,906に達しており、リポジトリの説明文には「VERY experimental Nintendo Switch 2 emulator」と明記されています。\n\n【背景】\nゲーム機のエミュレーター開発は、新型ハードウェアが登場するたびに技術的挑戦として多くの開発者の関心を集める分野です。Lichiiは、比較的新しいNintendo Switch 2を対象としており、作成日は2026年10月31日と記録されています。公開からわずか2週間ほどで9,000近いスターを集めていることから、新型ゲーム機のエミュレーション開発に対する注目度の高さがうかがえます。\n\n【詳細】\n説明文で「VERY experimental」と強調されている通り、本リポジトリは開発の初期段階にあるエミュレーターであると位置づけられています。Nintendo Switch 2という比較的新しいプラットフォームを対象としている点が最大の特徴であり、エミュレーション技術のコミュニティにおいて先駆的な試みとして扱われている可能性があります。具体的な対応機能や互換性の範囲についての詳細情報は提供されていませんが、実験的段階であることが明示されている点は利用者にとって重要な情報です。\n\n【ポイント・注意点】\n本リポジトリは2026年10月31日に作成され、わずか2週間足らずで8,906スターを獲得しています。この急速な成長は、Nintendo Switch 2のエミュレーション開発という話題性の高いテーマによるものと考えられます。ただし、説明文で明確に「非常に実験的」と述べられていることから、安定性や機能の完成度については限定的である可能性が高く、利用を検討する際にはこの点を十分に理解しておく必要があります。","2026-11-14","GitHub (zortos293/Lichii)","https://github.com/zortos293/Lichii"],["ccch1mneyyy/dsh-Go、DeepSeek Harnessをスマホで動かすツールが2.2万スターに","DeepSeek Harnessをスマートフォン本体で動作させ、パソコンを遠隔操作できるようにするツールccch1mneyyy/dsh-Goが、2.2万を超えるスターを獲得しました。モバイル環境でのAI活用の新たな形として注目されており、公開3週間ほどでの急成長が特徴です。ccch1mneyyy/dsh-Goは、DeepSeek Harnessをスマートフォン本体上で動作させ、パソコンを遠隔操作できるようにするツールです。","\n【概要】\nccch1mneyyy/dsh-Goは、DeepSeek Harnessをスマートフォン本体上で動作させ、パソコンを遠隔操作できるようにするツールです。GitHub APIで確認されたスター数は21,624に達しています。リポジトリの説明文には「dsh-go — DeepSeek Harness 装进口袋：手机本机运行，也能遥控你的电脑。」（DeepSeek Harnessをポケットに収める：スマートフォン本体で動作し、パソコンの遠隔操作も可能）と記されています。\n\n【背景】\nAIツールの実行環境は従来パソコンが中心でしたが、モバイルデバイスの性能向上に伴い、スマートフォン上でAI関連のツールを直接動作させるニーズが高まっています。dsh-Goは、こうした流れを受けて開発されたものと見られ、作成日は2026年10月25日と記録されています。公開から3週間ほどで2万を超えるスターを獲得しており、モバイル環境でのAI活用に対する関心の高さを裏付けています。\n\n【詳細】\n本ツールの最大の特徴は、DeepSeek Harnessをスマートフォン「本機（本体）」で動作させる点にあります。これにより、パソコンを起動・携帯していない状況でも、スマートフォンのみでDeepSeek Harnessの機能を利用できるようになります。さらに、説明文にある通り、スマートフォンからパソコンを遠隔操作する機能も備えており、モバイル端末を起点とした作業フローの構築が可能になっていると考えられます。\n\n【ポイント・注意点】\n本リポジトリは2026年10月25日に作成され、2026年11月13日時点でスター数21,624を記録しています。公開から短期間でこれだけの支持を集めている背景には、スマートフォンのみでAI関連作業とパソコンの遠隔操作を完結できるという利便性があると考えられます。説明文が中国語で記載されていることから、特に中国語圏のユーザーを中心に広がりを見せている可能性があり、利用を検討する際は対応言語や動作環境について確認することが望まれます。","2026-11-14","GitHub (ccch1mneyyy/dsh-Go)","https://github.com/ccch1mneyyy/dsh-Go"],["Donchitos/Claude-Code-Game-Studios、Claude Codeをゲーム開発スタジオ化する49エージェント集","Claude Codeを本格的なゲーム開発スタジオへと変貌させる仕組み、Donchitos/Claude-Code-Game-Studiosが公開されました。49種のAIエージェントと72の作業スキルを備え、実在のスタジオ組織を模した構成が特徴です。複雑なゲーム開発工程の分担を目指す試みとして関心を集めています。リポジトリの説明文には「Turn Claude Code into a full game dev studio — 49 AI agents, ","\n【概要】\nDonchitos/Claude-Code-Game-Studiosは、Claude Codeを本格的なゲーム開発スタジオへと変える仕組みを提供するリポジトリです。リポジトリの説明文には「Turn Claude Code into a full game dev studio — 49 AI agents, 72 workflow skills, and a complete coordination system mirroring real studio hierarchy.」（Claude Codeを完全なゲーム開発スタジオに変える——49のAIエージェント、72のワークフロースキル、実際のスタジオ階層を模した完全な連携システム）と記されています。GitHub APIにより本リポジトリの存在はHTTP 200で確認されていますが、スター数については未確認のため本記事では記載していません。\n\n【背景】\nAIコーディングエージェントであるClaude Codeは、単一のタスクをこなすツールとしてだけでなく、複数のエージェントが連携して複雑なプロジェクトを進める基盤としても活用が広がっています。本リポジトリは、ゲーム開発という複雑な工程を、実際のゲームスタジオの組織構造を模した形でAIエージェントに分担させるという、応用的な試みとして公開されたものと見られます。\n\n【詳細】\n本リポジトリの中核は、49種類のAIエージェントと72のワークフロースキルから構成される点にあります。これらが「実際のスタジオ階層を反映した完全な連携システム（complete coordination system mirroring real studio hierarchy）」として機能することが説明文で強調されています。つまり、単に多数のエージェントを用意するだけでなく、現実のゲーム開発スタジオにおける役割分担や意思決定の流れを再現する設計がなされていると考えられます。これにより、企画・デザイン・プログラミングなど、ゲーム開発の各工程をAIエージェントが分担して進めることを目指した仕組みと推測されます。\n\n【ポイント・注意点】\n本リポジトリはGitHub API上で存在が確認されているものの、スター数などの人気指標については確認が取れていません。そのため、どの程度コミュニティで広がりを見せているかは本記事の情報からは判断できません。49のAIエージェントと72のワークフロースキルという具体的な構成要素の数が示されている点は特徴的であり、実際の導入にあたってはこれらの組み合わせや連携方法について、リポジトリ内のドキュメントを確認することが重要です。","2026-11-14","GitHub (Donchitos/Claude-Code-Game-Studios)","https://github.com/Donchitos/Claude-Code-Game-Studios"],["scenario-labs/skills、AIエージェント向け画像・動画・音声・3D生成スキル集","あらゆるAIエージェントから本番品質の画像・動画・音声・3Dコンテンツを生成するためのスキル集、scenario-labs/skillsが公開されました。適切なモデル選定やコスト事前確認、キャラクター・ブランドの一貫性維持を備えており、生成AI活用の実務的課題に対応しています。リポジトリの説明文には「Get production-ready images, video, audio, and 3D from any AI agent: skills tha","\n【概要】\nscenario-labs/skillsは、あらゆるAIエージェントから本番品質の画像・動画・音声・3Dコンテンツを生成するためのスキル集です。リポジトリの説明文には「Get production-ready images, video, audio, and 3D from any AI agent: skills that pick the right model, price before spending, and keep characters and brands consistent.」（あらゆるAIエージェントから本番品質の画像、動画、音声、3Dを取得する：適切なモデルを選び、支出前に価格を確認し、キャラクターとブランドの一貫性を保つスキル）と記されています。GitHub APIにより本リポジトリの存在はHTTP 200で確認されていますが、スター数については未確認のため本記事では記載していません。\n\n【背景】\n生成AIの活用が広がる中で、画像・動画・音声・3Dといった多様なメディアを生成する際には、目的に応じた適切なモデルの選択やコスト管理が課題となっています。scenario-labs/skillsは、こうした課題に対応するため、AIエージェントが生成作業を行う際に活用できる一連のスキルとして提供されているものと見られます。\n\n【詳細】\n本スキル集の特徴は、説明文に示された3つの機能性に集約されます。第一に「適切なモデルを選ぶ（pick the right model）」機能で、生成するコンテンツの種類や目的に応じて最適な生成モデルを選択する仕組みを備えています。第二に「支出前に価格を確認する（price before spending）」機能で、生成処理にかかるコストを事前に把握できるようにすることで、予期しない費用発生を防ぐ設計になっていると考えられます。第三に「キャラクターとブランドの一貫性を保つ（keep characters and brands consistent）」機能で、複数回の生成にわたってキャラクターデザインやブランドイメージの統一性を維持することを目指しています。これらが組み合わさることで、本番環境での利用に耐えうる品質のコンテンツ生成を支援するスキル集として位置づけられています。\n\n【ポイント・注意点】\n本リポジトリはGitHub API上で存在が確認されているものの、スター数などの人気指標については確認が取れていません。そのため、本記事ではコミュニティにおける普及度について言及できません。特定の生成AIサービスに限定されず「あらゆるAIエージェント（any AI agent）」からの利用を想定している点が特徴であり、導入を検討する際は対応するエージェントや生成モデルの範囲について、リポジトリ内の情報を確認することが望まれます。","2026-11-14","GitHub (scenario-labs/skills)","https://github.com/scenario-labs/skills"],["l0ng-ai/openidea、Rust製の高速IDEが登場","IntelliJ IDEA風のキーマップやツールウィンドウを備えつつ、Rustで作り直された高速なネイティブアプリとして動作するIDE、l0ng-ai/openideaが公開されました。エディタやデバッガ、Git連携、ターミナルなどを統合しており、既存IDEユーザーの移行しやすさを意識した設計が特徴です。l0ng-ai/openideaは、従来のIDEをRustで作り直したプロジェクトです。","\n【概要】\nl0ng-ai/openideaは、従来のIDEをRustで作り直したプロジェクトです。リポジトリの説明文には「The IDE you know, rebuilt in Rust. IntelliJ IDEA–style keymap, tool windows and search-everywhere in a fast native app: editor, code insight, debugger, Git, terminal.」（あなたが知っているIDEを、Rustで作り直しました。IntelliJ IDEAスタイルのキーマップ、ツールウィンドウ、どこでも検索機能を備えた高速なネイティブアプリで、エディタ、コードインサイト、デバッガ、Git、ターミナルを統合）と記されています。GitHub APIにより本リポジトリの存在はHTTP 200で確認されていますが、スター数については未確認のため本記事では記載していません。\n\n【背景】\nIDE（統合開発環境）は多機能化が進む一方で、動作速度やリソース消費の面で課題を抱えることがあります。Rustはメモリ安全性と高速な実行性能を両立させるプログラミング言語として知られており、openideaはこうしたRustの特性を活かし、既存の使い慣れたIDE体験を保ちながら高速なネイティブアプリとして再構築することを目指したプロジェクトと見られます。\n\n【詳細】\n説明文からは、本IDEが「IntelliJ IDEA風のキーマップ」「ツールウィンドウ」「どこでも検索（search-everywhere）」といった、既存の人気IDEで馴染み深い操作体系を踏襲していることがわかります。これにより、既存のIDEユーザーが違和感なく移行できることを意識した設計になっていると考えられます。さらに、統合されている機能として、エディタ、コードインサイト（コード解析支援）、デバッガ、Git連携、ターミナルが挙げられており、これらが単一の高速なネイティブアプリケーション内で提供される点が特徴です。Rustによる実装は、こうした多機能性を維持しながらも動作速度の向上を狙ったものと考えられます。\n\n【ポイント・注意点】\n本リポジトリはGitHub API上で存在が確認されているものの、スター数などの人気指標については確認が取れていません。そのため、本記事ではコミュニティにおける普及度について言及できません。IntelliJ IDEA風の操作体系を採用している点から、既存のJetBrains製品ユーザーにとって移行のハードルが低い可能性がありますが、実際の機能の完成度や対応言語の範囲については、リポジトリ内の詳細情報を確認することが推奨されます。","2026-11-14","GitHub (l0ng-ai/openidea)","https://github.com/l0ng-ai/openidea"],["meta/astryx、3日連続でスター増加数トップを維持する勢い","オープンソースのデザインシステム「meta/astryx」が2026年11月13日時点で3日連続のスター増加トップを記録。完全カスタマイズ可能でAIエージェント対応という特徴が開発者の関心を集めている。短期間で2万から2万6千スターまで急伸しており、首位交代も果たした。GitHub Trendingの日本語解説サイトQiitaによると、2026年11月13日時点でmeta/astryxは26,436スター（前日比+1,789）を記録し、3日連続でスター増加","\n【概要】\nGitHub Trendingの日本語解説サイトQiitaによると、2026年11月13日時点でmeta/astryxは26,436スター（前日比+1,789）を記録し、3日連続でスター増加数トップの座を維持している。言語はTypeScriptである。\n\n【背景】\nAIコーディングエージェントが生成するUIコンポーネントの質や一貫性を確保するため、エージェントが扱いやすいデザインシステムへの需要が高まっている。astryxはこうした流れの中で登場し、短期間で急激な支持を得ている。\n\n【詳細】\nastryxは\n完全カスタマイズ可能でエージェント対応のオープンソースデザインシステム\nと説明されており、AIエージェントがUIを生成・編集する際に一貫性のあるコンポーネントを扱えるよう設計されている。別の集計では、2026年11月11日時点でastryxは\n23,021\nスター、\n+3,108\nの増加を記録しており、首位交代を果たしたことも報告されている。短期間でスター数が2万から2万6千まで急伸しており、エージェント向けデザインツール市場での注目度の高さがうかがえる。\n\n【ポイント・注意点】\n・短期間での急成長のため、実運用での安定性や長期的なメンテナンス体制はまだ検証段階にあると考えられる。\n・「エージェント対応」をうたうツールが増える中、astryxはデザインシステム分野での先行事例として注目されている。\n・継続的な観測が必要であり、今後数日でさらに伸びるか落ち着くかが注目点となる。","2026-11-13","Qiita（Git_Dayori）","https://github.com/meta/astryx"],["GoogleChrome/modern-web-guidance-src、24時間で1,875スター増加","Googleが公開するAIコーディングエージェント向けWebガイダンスリポジトリが、2026年11月13日までの24時間で1,875スターを獲得。最新のブラウザ機能をエージェントに伝える仕組みが評価されている。同時期にAnthropicのskillsリポジトリも急成長しており、大手による知識提供リポジトリ競争が激化している。2026年11月13日に報じられた記事によると、 GoogleChrome/modern-web-guidance-srcリポジトリは","\n【概要】\n2026年11月13日に報じられた記事によると、\nGoogleChrome/modern-web-guidance-srcリポジトリは24時間で1,875のGitHubスターを獲得し、AIコーディングエージェントにブラウザ機能やWeb開発の最新情報を提供するツールとして注目を集めた\n。\n\n【背景】\nAIコーディングエージェントが古い実装パターンを提案してしまう問題が指摘される中、エージェントに最新のWeb標準や推奨実践を参照させる仕組みへのニーズが高まっている。Google Chromeチームがこの課題に対応する形で本リポジトリを公開した。\n\n【詳細】\n\n2026年11月13日時点でリポジトリは4,158スターと244フォークを記録しており、TypeScriptで書かれたこのプロジェクトは、コーディングエージェントが古いアプローチではなく最新のWebプラットフォーム機能を使用できるよう支援することを目的としている\n。日本語のGitHub日報でも、2,788スター（+799）としてコーディングエージェントを最新のWebベストプラクティスに保つガイドと紹介されている。これはエージェントが生成するコードの品質を、常に最新のブラウザ仕様に追従させるための参照データセットやルールセットとして機能する。\n\n【ポイント・注意点】\n・Google自身が公式に関与しているため信頼性が高く、今後標準的な参照ソースとして定着する可能性がある。\n・同時期にAnthropicのskillsリポジトリも急成長しており、大手各社がエージェント向けの「知識提供リポジトリ」を競うように公開する流れが見られる。\n・短期的な急増のため、今後の更新頻度や採用実績を注視する必要がある。","2026-11-13","TokenPost","https://github.com/GoogleChrome/modern-web-guidance-src"],["Vercel製ブラウザ自動化CLI「agent-browser」が週間3,000超スター増","AIエージェント向けブラウザ自動化ツール「vercel-labs/agent-browser」が週間で数千スターの伸びを記録。Rust製で高速な自動操作を実現し、エージェント開発者の間で採用が進んでいる。関連ツールagent-desktopとあわせ、エージェント実行基盤というテーマが大きな潮流となっている。GitHub公式のトレンド週間ページによれば、 Rust言語で開発され、総スター数46,846、フォーク3,211を記録し、週間で1,476スターを獲得","\n【概要】\nvercel-labs/agent-browserは\nAIエージェント向けのブラウザ自動化CLI\nである。GitHub公式のトレンド週間ページによれば、\nRust言語で開発され、総スター数46,846、フォーク3,211を記録し、週間で1,476スターを獲得した\n。\n\n【背景】\nAIエージェントがWebブラウザを操作してタスクを自動実行する「コンピュータユース」的なアプローチが急速に発展しており、その基盤となるブラウザ自動化ツールの需要が高まっている。agent-browserはVercelのラボチームが開発し、エージェント専用設計であることが特徴となっている。\n\n【詳細】\n日報記事では\n2026年11月8日時点で総スター46,984、当日の新規増加190\nと報告されており、その後も着実にスターを積み上げている。11月13日時点のQiita記事では\n50,306スター、前日比596の増加\nと紹介されており、Rust言語によるAIエージェント向けブラウザ自動化CLIとして定着しつつある。同様の立ち位置のツールとしてvercel-labs/agent-desktopもあり、こちらは\nOSのアクセシビリティツリーを直接読み取ることで、ピクセルからの推測ではなく信頼性の高いデスクトップ操作をAIエージェントに提供する\n設計で、Rustで実装されている。\n\n【ポイント・注意点】\n・Vercelという著名な開発者基盤企業が後押ししていることで、信頼性と継続的なメンテナンスへの期待が高い。\n・ブラウザ操作の自動化は誤操作やセキュリティリスクも伴うため、利用時は権限設定に注意が必要。\n・agent-desktopなど関連プロジェクトとあわせ、「エージェントの実行基盤」というテーマが2026年11月のGitHubトレンドの大きな潮流となっている。","2026-11-13","Qiita（Git_Dayori）","https://github.com/vercel-labs/agent-browser"],["LLM駆動の株式分析システムdaily_stock_analysisがスター急増中","LLMを活用したマルチ市場株式分析システム「ZhuLinsen/daily_stock_analysis」が自動通知機能を備え、短期間で7万スター超に到達。個人投資家向けツールとして注目されている。わずか2日間で1,500以上のスターを積み増すペースで成長を続けている。2026年11月13日時点で71,069スター（前日比+1,290）を記録し、言語はPythonである。","\n【概要】\nZhuLinsen/daily_stock_analysisは\nLLM駆動のマルチ市場株式分析システムで、自動通知機能を備える\n。2026年11月13日時点で71,069スター（前日比+1,290）を記録し、言語はPythonである。\n\n【背景】\n大規模言語モデルを活用した金融・投資分析ツールへの関心が世界的に高まっており、個人開発者による無料・オープンソースの株式分析ツールが相次いで登場している。本リポジトリもその流れの中で急速に支持を広げた一例である。\n\n【詳細】\n2026年11月11日時点の集計では\n69,578スター、前日比+960\nと報告されており、わずか2日間で1,500スター以上を積み増すペースで成長を続けている。システムはLLMを用いて複数の市場を横断した株式データを分析し、結果をユーザーに自動で通知する仕組みを持つとされる。個人投資家が独自に銘柄分析を自動化できるツールとして、投資・金融分野の開発者コミュニティから支持を集めている。\n\n【ポイント・注意点】\n・投資判断に関わるツールであるため、生成される分析結果の精度や根拠については利用者自身の検証が不可欠である。\n・LLMの出力には誤りや偏りが含まれる可能性があり、実際の投資判断に用いる際は十分な注意が必要。\n・急成長中のプロジェクトのため、今後のメンテナンス体制やセキュリティ面（API鍵の扱いなど）の確認も重要なポイントとなる。","2026-11-13","Qiita（Git_Dayori）","https://github.com/ZhuLinsen/daily_stock_analysis"],["家計管理アプリ「we-promise/sure」が週末にかけて急浮上","誰でも使えるオープンソースの個人向け家計管理アプリ「sure」がGitHub Trendingで急上昇。Ruby製で、2026年11月13日時点で約1万4千スターに到達している。プライバシー重視でセルフホスト志向のユーザーから支持を集めている。we-promise/sureは 誰でも使える個人向け家計管理アプリ で、2026年11月13日時点で13,845スター（前日比+974）を記録した。","\n【概要】\nwe-promise/sureは\n誰でも使える個人向け家計管理アプリ\nで、2026年11月13日時点で13,845スター（前日比+974）を記録した。開発言語はRubyである。\n\n【背景】\n家計簿・資産管理系のオープンソースアプリは、プライバシーを重視するユーザーやセルフホスト志向の開発者から根強い需要がある分野である。クラウド型の家計簿サービスに依存せず、自分のデータを自分で管理したいというニーズの高まりを背景に、こうしたツールが継続的に注目を集めている。\n\n【詳細】\nGitHub Trendingの日本語解説記事によれば、本アプリは前日比974スターという大幅な伸びを記録し、Ruby言語で実装されたオープンソースの個人向け家計管理アプリとして紹介されている。「誰でも使える」というシンプルなコンセプトが打ち出されており、特別な知識がなくても導入・運用できる使いやすさが支持の背景にあると考えられる。短期間での急上昇は、SNSやコミュニティでの紹介などをきっかけにした拡散が影響している可能性がある。\n\n【ポイント・注意点】\n・家計管理アプリは個人の財務情報という機密性の高いデータを扱うため、セルフホスト時のセキュリティ設定には十分注意する必要がある。\n・急上昇中のプロジェクトであり、長期的な開発の継続性やコミュニティのサポート体制は今後の実績で判断する必要がある。\n・類似のオープンソース家計簿アプリとの機能比較を行った上での導入検討が望ましい。","2026-11-13","Qiita（Git_Dayori）","https://github.com/we-promise/sure"],["QwenLM公式コーディングエージェント「qwen-code」が3万スター目前に迫る","Alibaba傘下QwenLMが開発するターミナル常駐型AIコーディングエージェント「qwen-code」がGitHubトレンドに浮上し、スター数が3万近くに到達した。TypeScript製でCLIから直接コード編集や開発支援を行える点が評価され、継続的な伸びを見せている。QwenLM（Alibaba Cloud傘下のQwenチーム）が公開するオープンソースのAIコーディングエージェント「qwen-code」が、GitHubトレンドで引き続き注目を集めてい","\n【概要】\nQwenLM（Alibaba Cloud傘下のQwenチーム）が公開するオープンソースのAIコーディングエージェント「qwen-code」が、GitHubトレンドで引き続き注目を集めている。2026年11月12日時点の更新情報によれば、スター数は約3万件に迫り、フォーク数も3,400件を超える規模に成長している。\n\n【背景】\nコーディングエージェント市場では、OpenAIのCodexやAnthropicのClaude Codeなど大手ベンダーのツールが先行してきたが、QwenLMはオープンソースかつApache-2.0ライセンスで公開することで、独自コミュニティの拡大を狙っている。ターミナル、エディタ、デスクトップ、ブラウザ、チャットなど複数の利用形態に対応する設計が特徴とされている。\n\n【詳細】\nqwen-codeはTypeScriptで実装されており、CLIからAIエージェントを呼び出してコード生成・編集・デバッグなどのタスクを自動化できる。GitHubのトレンドページでは1日あたり150前後の新規スターを獲得しており、着実な人気の積み上げが続いている。プロジェクトは2025年6月に作成されて以降、着実にスターを伸ばし、GitHub公式のExploreページでもトレンドリポジトリとして紹介されている。開発は活発に継続されており、直近の更新も11月12日〜13日に行われていることが確認できる。\n\n【ポイント・注意点】\n無料で利用できるオープンソースのAIコーディングエージェントを探している開発者にとって、有力な選択肢の一つとなっている。ただし、スター数の推移は日によって変動があり、他の急伸リポジトリと比較すると緩やかな伸びである点には留意が必要だ。今後も継続的なアップデートがあるか、コミュニティの動向を注視する価値がある。","2026-11-13","GitHub Explore","https://github.com/QwenLM/qwen-code"],["codecrafters-io/build-your-own-x、GitHub全体で依然56万超のトップスター","自作で学ぶプログラミング教材集「build-your-own-x」が、2026年11月13日時点でGitHub全体のスターランキング首位を維持し、56万件を超えるスターを獲得している。長期にわたり開発者からの支持を集め続けている定番リポジトリである。codecrafters-ioが運営する「build-your-own-x」は、データベースやシェル、Gitなどを自作しながら仕組みを学べるチュートリアル集であり、2026年11月13日時点でGitHub全体の","\n【概要】\ncodecrafters-ioが運営する「build-your-own-x」は、データベースやシェル、Gitなどを自作しながら仕組みを学べるチュートリアル集であり、2026年11月13日時点でGitHub全体のスター数ランキング首位を維持している。累計スター数は56万件を超える規模に達した。\n\n【背景】\nソフトウェアの内部構造を理解する手段として、既存のライブラリを使うのではなく「ゼロから自分で作ってみる」学習法が根強い人気を誇っている。build-your-own-xはそうした学習リソースを集約したリポジトリとして、プログラミング教育分野で長年にわたり高い評価を得てきた。\n\n【詳細】\n集計サイトRepochartsのデータによれば、同リポジトリは2026年11月13日時点でGitHub全体のHot 50ランキングにおいて1位を獲得しており、累計スター数は56.2万件に達している。長期間にわたってトップクラスの人気を維持しているのは、特定の技術トレンドに依存しない「基礎を学ぶ」という普遍的なテーマを扱っているためと考えられる。日々のスター増加数は急伸リポジトリほど大きくはないものの、安定して高い支持を集め続けている点が特徴だ。\n\n【ポイント・注意点】\n教材としての網羅性は高いが、内容によっては更新時期にばらつきがあるため、学習の際は各チュートリアルの対象言語やバージョンを確認することが望ましい。長期的に支持されている定番リポジトリであるため、プログラミング学習の入り口として今後も参照され続けると見られる。","2026-11-13","Repocharts","https://github.com/codecrafters-io/build-your-own-x"],["Anthropic公式「skills」リポジトリ、24時間で1,676スター増の急伸","AnthropicのAIエージェント向けスキル公開リポジトリ「anthropics/skills」が2026年11月10日に24時間で1,676スターを獲得し、累計19万スール超に到達した。タスク知識をフォルダ形式でまとめる仕組みがエージェント開発の標準パターンとして定着しつつある。オープンソースリポジトリanthropics/skillsがGitHub Trendingで急上昇し、191,978スターと22,614フォークに達した 。","\n【概要】\n\nオープンソースリポジトリanthropics/skillsがGitHub Trendingで急上昇し、191,978スターと22,614フォークに達した\n。\n2026年11月10日、anthropics/skillsは24時間で1,676スターを獲得する顕著な急伸を見せた\n。\n\n【背景】\nAIエージェントに特定タスクの実行手順や知識を「スキル」として与える仕組みは、Anthropic社のClaudeをはじめとする大規模言語モデルの実用性を高める重要な技術トレンドとなっている。anthropics/skillsはその公式リファレンス実装として、多くの開発者から参照・活用されている。\n\n【詳細】\n\n2025年9月22日の作成以来、anthropics/skillsは着実に支持を広げており、直近61日間で13,366スターと1,867フォークを獲得するなど、コミュニティからの強い関心を反映している\n。日本語の解説記事でも「Agent Skillsの公開リポジトリ」として紹介されており、中国語圏の分析記事では\n2026年11月10日時点で191,194スター、その日だけで1,038の増加を記録した\nとされている。Skillsはタスク知識をClaudeが必要に応じて読み込めるフォルダ形式にまとめる仕組みを提供しており、エージェント開発の標準的な設計パターンとして定着しつつある。\n\n【ポイント・注意点】\n・公式リポジトリであるため信頼性が高く、今後もエージェント開発の基盤として参照され続ける可能性が高い。\n・\n2026年11月10日の急成長はリポジトリの継続的な関連性と開発者からの採用を示している\nとされ、一過性のブームではなく定着傾向にあると見られる。\n・類似の「skills」系リポジトリ（mattpocock/skills、google/skillsなど）が複数登場しており、競合・差別化の動向も注目される。","2026-11-10","Blockchain.News","https://github.com/anthropics/skills"],["NVIDIA/auto-ontology、公開初日に2,050スターの驚異的な伸び","NVIDIAが公開したセマンティック推論レイヤー構築フレームワーク「auto-ontology」が、トレンド入り初日に2,050スターを獲得し、今年最速クラスの急伸を記録した。企業メタデータからオントロジーを生成し、エージェントに公開する機能を備えている。NVIDIA/auto-ontologyは、 企業データ上にセマンティックでグラフベースの推論レイヤーを構築するためのPythonフレームワーク である。","\n【概要】\nNVIDIA/auto-ontologyは、\n企業データ上にセマンティックでグラフベースの推論レイヤーを構築するためのPythonフレームワーク\nである。GitHub Trendingの日報サイトによれば、2026年11月7日時点で総スター数9,289、当日の新規増加数は2,015に達した。\n\n【背景】\n企業のAIエージェント導入が進む中、散在するデータの意味を統一的に扱う「オントロジー」構築の自動化は、企業データ活用における重要課題として注目されている。NVIDIAはAIインフラ企業としての立場から、この分野向けのツールを公開した。\n\n【詳細】\n中国語の解説記事によると、\nNVIDIA Auto Ontologyは企業メタデータから本体（オントロジー）を生成し、システム横断で定義を統一し、MCP・CLI・APIを通じてエージェントに公開するセマンティック推論レイヤー構築用フレームワークであり、データの意味を発見し、生成されたクエリを検証し、根拠となる説明を返し、修正結果をオントロジーに反映させる\n機能を持つ。別の分析記事でも\nNVIDIA/auto-ontologyはトレンド初日に2,050スターを達成し、これは当日のトレンドページにおける新規リポジトリの中で最も高い増加速度だった\nと報告されている。この急伸は、エンタープライズAIチームが真に必要としているものを示す指標として分析されている。\n\n【ポイント・注意点】\n・NVIDIA公式のプロジェクトであるため信頼性・継続性への期待が高い。\n・MCP（Model Context Protocol）対応など、最新のエージェント連携標準に準拠している点が評価ポイント。\n・企業データのセマンティック統合という複雑な課題に取り組むため、実運用での検証事例が今後の普及の鍵となる。","2026-11-07","GitHub Trending 日报（caige6666）","https://github.com/NVIDIA/auto-ontology"],["google/skills、Googleがスキル市場に参入し2.2万スター突破","Googleが公開したAIエージェント向けスキル集「google/skills」が、公開からおよそ7カ月で2.2万スターを突破した。1日で200件超の新規スター増加を記録し、スキルレイヤー競争にGoogleが本格参入したことが注目されている。Googleが提供するAIエージェント向けスキル集「google/skills」がGitHubトレンドで注目を集めている。","\n【概要】\nGoogleが提供するAIエージェント向けスキル集「google/skills」がGitHubトレンドで注目を集めている。2026年3月に作成されてから約7カ月で累計スター数は2.2万件を超え、1日あたり200件超の新規スターを獲得する勢いを見せている。\n\n【背景】\n2026年後半、Anthropicのskillsリポジトリやaddyosmani氏のagent-skillsなど、コーディングエージェントに特化した「スキル」形式のナレッジ集がGitHubトレンドを席巻してきた。こうした流れの中でGoogleも独自のスキル集を公開し、スキルレイヤーの競争に本格的に加わった形となる。\n\n【詳細】\n集計サイトCoddyKitの分析によれば、google/skillsはPython製で、フォーク数は1,900件近くに達している。公開から7カ月というスピードで2万スターを超えた背景には、既存のAnthropic製skillsリポジトリなどと同様に、AIコーディングエージェントが参照する「手順書」形式のコンテンツへの需要の高まりがあるとみられる。同時期にはConardLi/garden-skillsやscenario-labs/skillsなど、スキル集系のリポジトリが複数同時にトレンド入りしており、スキルレイヤーが新たなインフラとして定着しつつあることを示している。\n\n【ポイント・注意点】\nGoogleという大手プラットフォーマーがスキル集を公開したことで、今後他のクラウドベンダーも追随する可能性がある。利用する際は各スキルの対象エージェント（Claude、Gemini等）との互換性を事前に確認することが推奨される。スキルレイヤーの標準化が進むかどうか、今後の動向が注目される。","2026-11-06","CoddyKit","https://github.com/google/skills"],["github/spec-kit、仕様駆動開発ツールキットが14.7万スターの規模に","GitHub公式の仕様駆動開発ツールキット「spec-kit」が、GitHub史上でも有数の急成長リポジトリとなり、累計14.7万スターに到達した。AIコーディングエージェントに構造化されたプロセスとテンプレートを提供する点が評価されている。GitHubが公式に提供する「spec-kit」は、AIコーディングエージェント向けに構造化された開発プロセスと再利用可能なテンプレートを提供するツールキットである。","\n【概要】\nGitHubが公式に提供する「spec-kit」は、AIコーディングエージェント向けに構造化された開発プロセスと再利用可能なテンプレートを提供するツールキットである。集計サイトCoddyKitの分析によれば、2026年11月時点で累計スター数が14.7万件に達し、フォーク数も1.3万件を超えている。\n\n【背景】\n「vibeコーディング」と呼ばれる、仕様を明確化せずAIに丸投げするような開発スタイルが広がる中、その副作用として出力の一貫性や保守性の低さが課題として指摘されてきた。spec-kitはこうした課題に対応するため、仕様を先に明確化してからAIエージェントに開発を進めさせる「仕様駆動開発」のアプローチを提唱している。\n\n【詳細】\n\ngithub/spec-kitは14.7万件のスターと1.3万件超のフォークを持つ、GitHub公式の仕様駆動開発ツールキットであり、コーディングエージェントに構造化されたプロセス、再利用可能なテンプレート、文書化された成果を提供する\n。この規模への成長速度は、GitHub史上でも際立って早い部類に入るとされている。仕様駆動開発というアプローチが単なる流行にとどまらず、AIエージェント活用の成熟フェーズにおける標準的な手法になりつつあることを示す事例として注目されている。\n\n【ポイント・注意点】\n仕様駆動開発は従来のアジャイル開発プロセスとの整合性を取る必要があり、導入にあたってはチームのワークフロー全体を見直す必要が生じる場合がある。GitHub公式ツールであるため今後も継続的なアップデートが見込まれ、エージェント開発の標準ツールとしての定着が注目される。","2026-11-05","CoddyKit","https://github.com/github/spec-kit"],["hyprwm/Hyprland、エージェント時代のデスクトップ環境として4万スターに","C++製の高度にカスタマイズ可能なWaylandコンポジタ「Hyprland」が、AIエージェントの操作に適したデスクトップ基盤として再評価され、累計スター数4万件に到達した。スクリプト可能で構成可能なウィンドウ管理が強みとされている。hyprwmが開発するWaylandコンポジタ「Hyprland」が、AIエージェントによるデスクトップ操作の基盤インフラとして注目を集め、GitHubトレンドに再浮上した。","\n【概要】\nhyprwmが開発するWaylandコンポジタ「Hyprland」が、AIエージェントによるデスクトップ操作の基盤インフラとして注目を集め、GitHubトレンドに再浮上した。集計サイトCoddyKitの分析によれば、累計スター数は4万件を超え、1日で500件超の新規スターを獲得している。\n\n【背景】\n従来Hyprlandは、カスタマイズ性の高さを重視する一般ユーザー向けのデスクトップ環境として支持されてきたが、AIエージェントによるコンピュータ操作（コンピュータユース）が普及するにつれ、信頼性が高くスクリプト制御しやすいウィンドウマネージャーへの需要が新たに生まれている。\n\n【詳細】\nCoddyKitの分析によれば、\nhyprwm/Hyprlandは4万32件のスター、2,158件のフォーク、1日で509件のスターを獲得したC++製の高度にカスタマイズ可能なWaylandコンポジタであり、デスクトップ環境そのものが、信頼性が高くスクリプト化・構成可能なウィンドウ管理を必要とするAIエージェントにとって重要なインフラとなりつつあることを示している\n。これまで一般ユーザー向けの選択肢とみなされてきたHyprlandが、エージェント活用という新しい文脈で再注目されたことは興味深い動きといえる。\n\n【ポイント・注意点】\nWaylandコンポジタの導入には既存のX11ベースの環境からの移行作業が必要となる場合があり、対応アプリケーションの互換性確認が求められる。AIエージェントとの連携を前提とした場合、スクリプトAPIの安定性やドキュメントの充実度も導入判断の重要な要素となる。","2026-11-03","CoddyKit","https://github.com/hyprwm/Hyprland"],["thedotmack/claude-mem、永続メモリエンジンが10.8万スターへ急伸","Claude Codeなど複数のAIコーディングハーネスで共有可能な永続メモリエンジン「claude-mem」が、短期間で累計10.8万スターに到達した。ChromaDBとSQLiteを組み合わせた設計で、AIエージェントの記憶の持続性を解決する基盤として注目されている。thedotmack氏が開発する「claude-mem」は、AIコーディングエージェントに永続的な記憶機能を提供するメモリエンジンである。","\n【概要】\nthedotmack氏が開発する「claude-mem」は、AIコーディングエージェントに永続的な記憶機能を提供するメモリエンジンである。GitHubトレンドの分析によれば、2026年10月30日時点で10.5万スターだったものが数日で10.8万スターまで増加し、急速な成長を続けている。\n\n【背景】\n2026年後半、開発者は単一のAIハーネスに固定するのではなく、Claude Code、Codex、OpenCodeなど複数のツールをタスクに応じて使い分ける傾向が強まっている。しかし、ハーネスを切り替えるたびに会話の文脈や過去の作業記録が失われる問題があり、これを解消する「持続的なメモリ層」への需要が高まっていた。\n\n【詳細】\n集計サイトCoddyKitの分析によれば、claude-memはChromaDBによる埋め込みベクトル管理とSQLiteによる永続化レイヤーを組み合わせることで、異なるAIハーネス間でも一貫した記憶を維持できる設計になっている。\n2026年9月時点では開発者は単一のハーネスに固定していたが、11月には複数ハーネスを併用しつつ単一の永続メモリ層を維持する運用\nへと移行しつつあるとされ、claude-memはこの需要の受け皿として急成長を遂げた。短期間で数千スター単位の増加を記録する日もあり、インフラ系リポジトリの中でも際立った伸びを見せている。\n\n【ポイント・注意点】\n複数のAIツールをまたいでメモリを共有する設計は利便性が高い一方、保存される情報の機密性やプライバシーへの配慮が重要になる。企業利用の際はデータの保管場所やアクセス権限の設定を事前に確認することが望ましい。","2026-11-01","CoddyKit","https://github.com/thedotmack/claude-mem"]],"gh-new":[["GitHub公式ツール「spec-kit」が14万超スターに急伸、仕様駆動開発を標準化","GitHub公式のAIコーディング支援ツール「spec-kit」が14万スターを突破し急成長中。仕様書を起点にAIエージェントへ構造化された開発プロセスを提供し、バイブコーディングからの転換を促す存在として注目されている。270以上のコントリビューターが開発に参加している。GitHubが公式に提供するオープンソースツール「spec-kit」が、GitHubトレンドで急成長を続けている。","\n【概要】\nGitHubが公式に提供するオープンソースツール「spec-kit」が、GitHubトレンドで急成長を続けている。仕様駆動開発（Spec-Driven Development, SDD）を実践するためのツールキットで、AIコーディングエージェントに対して構造化されたプロセス、再利用可能なテンプレート、文書化された成果を提供することを目的としている。\n\n【背景】\n近年「バイブコーディング」と呼ばれる、AIに大雑把な指示を出してコードを生成させる開発スタイルが広まったが、仕様が曖昧なまま実装が進むことで保守性や一貫性に課題が生じていた。spec-kitはこの課題に対し、実装前に「何を」「なぜ」作るのかを明確化するプロセスを提供する。\n\n【詳細】\nspec-kitはGitHub公式のSDDツールキットであり、コーディングエージェントに構造化プロセス、再利用可能なテンプレート、文書化された成果をもたらすと説明されている。機能面では、機能やアプリケーションを構築する「Spec-Driven Development」、不具合を修正する「Bug Fixing」、アイデアの投資価値を判断する「Idea Assessment」という3つのプロセスが用意されており、ユーザーは目的に応じて使い分けられる。specifyというCLIツールを通じて、仕様を起点に計画・実装・収束（コンバージェンス）までの一連の流れを管理できる点が特徴とされる。VS CodeやGitHub Copilotをはじめ15以上のAIコーディングエージェントとシームレスに連携するとも紹介されている。\n\nスター数は140万件規模（執筆時点で149.6kスター、1.34万フォーク）に達しており、320人を超えるコントリビューターがプロジェクトの構築に貢献してきたとされる。GitHub自身が後押しする公式プロジェクトという立場もあり、企業導入のハードルが低い点も急成長の一因とみられる。\n\n【ポイント・注意点】\nMITライセンスで提供されており、既存プロジェクトへの段階的な導入ガイドも用意されている。仕様策定から実装、検証までを一気通貫で管理したい開発チームにとって、AIエージェントの挙動を制御しつつ品質を担保する選択肢となりそうだ。一方で、プロセスが定める一定の型に沿った開発スタイルを求められるため、小規模な個人開発や探索的なプロトタイピングには不向きな場合もある点に留意したい。","2026-11-13","GitHub (github/spec-kit)","https://github.com/github/spec-kit"],["LLM駆動の株式分析システム「daily_stock_analysis」が中国圏で注目","開発者ZhuLinsenによる「daily_stock_analysis」は、複数市場に対応したLLM駆動の株式分析ツール。リアルタイムニュースや意思決定ダッシュボード、自動通知機能を備え、GitHubライブトレンドにランクインした。中国語圏の開発コミュニティを中心に関心が高まっている。「ZhuLinsen/daily_stock_analysis」は、大規模言語モデル（LLM）を活用して複数市場の株式情報を分析するPython製システムとして、2026年","\n【概要】\n「ZhuLinsen/daily_stock_analysis」は、大規模言語モデル（LLM）を活用して複数市場の株式情報を分析するPython製システムとして、2026年11月のGitHubライブトレンドで注目を集めた。\n\n【背景】\nLLMを金融・投資分野に応用する動きは世界的に活発化しており、特に個人投資家向けに無料・低コストで運用できる分析ツールへの需要が高まっている。中国語圏の開発者コミュニティを中心に、こうした自動化ツールの開発・公開が相次いでいる。\n\n【詳細】\nリポジトリの説明によれば、本プロジェクトは「LLM駆動の多市場株式インテリジェント分析システムで、複数ソースの相場情報、リアルタイムニュース、意思決定ダッシュボードと自動プッシュ通知を備え、ゼロコストでの定期実行をサポートする」ことを特徴としている。複数の市場にまたがる株価情報を集約し、LLMによる分析結果をダッシュボード上で確認できる構成になっており、ユーザーが重要な変化を見逃さないよう自動通知の仕組みも組み込まれている。トレンド集計では844スター、83フォークを獲得し、新規ランクインと報告されている。\n\n個人投資家が自前のサーバーやクラウド環境で無料に近いコストで定期実行できる設計は、商用の有料分析サービスに対する代替手段としての位置づけを狙ったものとみられる。LLMを活用することで、単なる数値データの可視化にとどまらず、ニュース記事などの非構造化情報も取り込んだ分析が可能になっている点が特徴として挙げられる。\n\n【ポイント・注意点】\n金融系の自動分析ツールは、投資判断の参考情報として有用である一方、LLMによる分析結果の正確性や市場変動への追随性には限界がある点に留意が必要だ。特に「ゼロコストでの定期実行」を謳う設計は、個人投資家が手軽に試せる利点がある反面、投資判断を全面的にツールに依存するリスクも伴う。あくまで補助的な情報源として活用し、最終的な投資判断は自己責任で行うべきという基本原則は変わらない。中国圏発の同種ツールは今後も増加が見込まれる分野だ。","2026-11-12","Trendshift","https://github.com/ZhuLinsen/daily_stock_analysis"],["CopilotKit「openmuse」、ブラウザ・ターミナル常駐の個人AIエージェントとして登場","CopilotKitが開発する新プロジェクト「openmuse」は、ブラウザ・ターミナル・ファイルを備え作業を継続する個人向けAIエージェントアプリ。AG-UIプロトコルを基盤にCopilotKitと連携し、スター数は6,000を超える成長を見せている。企業向けOpenBotとは異なる個人利用路線を志向する。CopilotKit社が手がける新プロジェクト「openmuse」は、個人ユーザー向けに常駐型のAIエージェント体験を提供するアプリケーションである。","\n【概要】\nCopilotKit社が手がける新プロジェクト「openmuse」は、個人ユーザー向けに常駐型のAIエージェント体験を提供するアプリケーションである。2026年11月12日時点でスター数は6,439に達しており、同社のOpenBotと並ぶ注目プロジェクトとなっている。\n\n【背景】\nAIエージェントの活用が「単発のタスク実行」から「継続的な作業の伴走者」へと進化する流れの中、CopilotKitはOpenBotで企業向けのガバナンス重視のアプローチを取る一方、openmuseでは個人ユーザー向けのより身近なエージェント体験を提供しようとしている。\n\n【詳細】\nopenmuseはブラウザ、ターミナル、ファイルシステムを備えた個人向けエージェントで、作業を中断せずに継続できる設計が特徴とされる。CopilotKitとAG-UIプロトコルを基盤に構築されており、TypeScript製でMITライセンスのもとオープンソース化されている。CopilotKitのエコシステムの一部として、OpenBotが企業向けの「AIコワーカー」であるのに対し、openmuseはより個人利用に寄せたポジショニングを取っている。ユーザーが日常的に使うブラウザ操作やターミナル作業、ファイル管理をエージェントが横断的に把握し、継続的な文脈を保ったまま支援する点が従来の単発型アシスタントとの違いとして強調されている。\n\n【ポイント・注意点】\n2026年11月12日時点で941フォークを記録しており、継続的な開発コミットも活発に行われている。CopilotKit社は同時期にOpenDuetという「プロアクティブなAIコワーカー」もリリースしており、同社のプロダクトラインがエージェント体験の多様化を進めている点が注目される。個人向けとビジネス向けでプロダクトを使い分ける戦略が、今後のエージェントアプリ市場の方向性を示す事例として参照されている。","2026-11-12","CopilotKit (GitHub)","https://github.com/CopilotKit/openmuse"],["BYOK対応オープンソースAIモデルゲートウェイ「experiential」がトレンド常連に","セルフホストやBYOK（Bring Your Own Key）に対応したオープンソースのAIモデルゲートウェイ「experientiallabs/experiential」がGitHubトレンドの常連リポジトリとして定着しつつある。複数のLLMプロバイダーを統一的に扱える基盤として開発者の関心を集めている。Python製のオープンソースAIモデルゲートウェイ「experientiallabs/experiential」が、GitHubトレンドで継続的に取り","\n【概要】\nPython製のオープンソースAIモデルゲートウェイ「experientiallabs/experiential」が、GitHubトレンドで継続的に取り上げられている。BYOK（自分のAPIキーを持ち込む方式）やセルフホスト運用に対応しており、複数のLLMプロバイダーを一つの窓口で扱える統一ゲートウェイとして位置づけられている。\n\n【背景】\nAIアプリケーション開発では、OpenAIやAnthropic、Googleなど複数のLLMプロバイダーのAPIを併用するケースが増えている。しかしプロバイダーごとにAPI仕様や認証方式、レート制限の扱いが異なり、アプリケーション側でその差異を吸収する実装コストが開発者の負担となっていた。experientialはこうした課題に対し、自分の持つAPIキーを使いながら統一的なインターフェースでLLMにアクセスできる基盤を提供する。\n\n【詳細】\nexperientialはオープンソースとして公開されており、企業や個人が自前のインフラにデプロイして運用するセルフホスト型の利用が想定されている。BYOK方式を採用しているため、ユーザーは自分がすでに契約しているLLMプロバイダーのAPIキーをそのまま持ち込んで利用でき、ゲートウェイ事業者に追加のAPI利用料を支払う必要がない点が特徴とされる。GitHubトレンドの集計では、スター数が1万6千を超え、一日の増加数も数百件規模で推移しており、継続的に開発者の関心を集めていることがうかがえる。\n\nAIエージェント開発やLLM活用アプリケーションの裾野が広がる中で、複数モデルの切り替えやフォールバック、コスト管理といった運用上のニーズに応えるミドルウェア的な立ち位置のツールとして、同種のゲートウェイ型プロジェクトが相次いで登場している。experientialもそうした潮流の一つとして、既存のAIアプリケーション開発スタックに組み込みやすい設計を志向しているとみられる。\n\n【ポイント・注意点】\nセルフホスト型であるため、運用・監視・スケーリングは利用者側の責任となる点に注意が必要だ。BYOK方式によりコストの透明性は高まる一方、各プロバイダーのレート制限や利用規約の管理は引き続きユーザー自身が行う必要がある。AIプロダクトの基盤選定を検討している開発チームにとって、商用ゲートウェイサービスとの比較検討の選択肢の一つとなりそうだ。","2026-11-12","Qiita「GitHub日報」","https://github.com/experientiallabs/experiential"],["GitHub日報、astryxが首位交代でトレンド加速中","日本語のGitHubトレンド紹介ブログによると、2026年11月11日時点でmeta/astryxが大幅なスター増でトレンド首位に浮上。AIエージェント向けデザインシステムとして関心を集めている。週間で9.9千スター、667フォークを獲得するなど急成長を見せている。日本語でGitHubトレンドを日次でまとめるQiita記事「GitHub日報」の2026年11月11日号で、AIエージェント対応デザインシステム「astryx」がトレンド首位に浮上したことが報告","\n【概要】\n日本語でGitHubトレンドを日次でまとめるQiita記事「GitHub日報」の2026年11月11日号で、AIエージェント対応デザインシステム「astryx」がトレンド首位に浮上したことが報告された。\n\n【背景】\nAIコーディングエージェントが自律的にUIを構築するケースが増える中、エージェントが扱いやすいよう設計されたデザインシステムへの需要が高まっている。astryxはその流れを汲むプロジェクトの一つで、他のトレンド集計サイトでも「オープンソースの、完全にカスタマイズ可能でエージェント対応のデザインシステム」として紹介されている。\n\n【詳細】\n記事タイトルによれば、astryxが+3,108のスター増で首位交代を果たし、初登場ゼロは4日ぶりという状況だったとされる。これはトレンドの入れ替わりが落ち着いていた期間を経て、再び新規プロジェクトの急浮上が始まったことを示す動きとされる。他の集計サイトでも、astryxは週間トレンドで9.9千スター、667フォークを獲得し、今週獲得分として新規扱いになっている。\n\nエージェント対応を謳うデザインシステムは、UIコンポーネントの構造やコードの可読性をAIが扱いやすい形に最適化することを志向しており、開発者が手動でコンポーネントを組み立てるだけでなく、AIエージェントが自動的にUIを生成・調整する用途を想定した設計思想が背景にある。こうした特性が、短期間での急激なスター増につながった要因の一つとみられる。\n\n【ポイント・注意点】\n日々のトレンド集計データは変動が激しく、スター数の増減ペースは短期間で大きく上下する点に留意が必要だ。astryxのようなAIエージェント向けツールは、エージェント開発エコシステムの急成長を背景に短期間で大きな注目を集めやすい一方、実用段階での採用実績や長期的な保守体制はまだ見極めが必要な段階にあるプロジェクトも多い。日本語でのトレンド紹介は、英語圏の情報をいち早くキャッチアップしたい国内開発者にとって有用な情報源となっている。","2026-11-11","Qiita (Git_Dayori)","https://github.com/meta/astryx"],["ベクトルDBもLLM APIも丸ごと模擬「aimock」、AIアプリ開発のテスト環境を簡素化","CopilotKitが公開する「aimock」は、LLM API・MCP・A2A・AG-UI・ベクトルDB・検索など、AIアプリが依存する外部サービスをまとめてモック化できるツール。単一パッケージ・単一ポート・依存関係ゼロで動作し、開発テストの効率化に寄与する。CopilotKitが公開するオープンソースツール「aimock」は、AIアプリケーションが利用する各種外部サービスをモック（模擬）化できるツールである。","\n【概要】\nCopilotKitが公開するオープンソースツール「aimock」は、AIアプリケーションが利用する各種外部サービスをモック（模擬）化できるツールである。2026年11月時点でスター数は1,011に達しており、AIアプリ開発者のテスト環境構築を支援するユーティリティとして注目され始めている。\n\n【背景】\nAIアプリケーションはLLM API、MCP（Model Context Protocol）、A2A（エージェント間通信）、AG-UI、ベクトルデータベース、検索エンジンなど多数の外部サービスに依存することが一般的になっている。これらすべてを本番環境と同等に用意してテストを行うのはコストと手間がかかるという課題があった。\n\n【詳細】\naimockは、AIアプリが通信する相手をまとめてモック化できるツールで、LLM API呼び出し、MCPサーバー、A2A通信、AG-UIインターフェース、ベクトルデータベース検索などを単一のパッケージで模擬する。単一ポートで動作し、追加の依存関係を必要としない設計がシンプルさを重視した設計思想を示している。TypeScript製でMITライセンスのもとで公開されている。\n\n開発者はaimockを起動するだけで、実際の外部サービスに接続することなくAIアプリの一連の挙動を検証できるため、API利用コストを抑えつつ繰り返しテストを実施できる点がメリットとして挙げられる。CopilotKit自体がAG-UIプロトコルを推進していることもあり、aimockはそのエコシステムと親和性の高いテストツールとして位置づけられている。\n\n【ポイント・注意点】\n2026年11月11日時点で83フォークを記録しており、CopilotKitエコシステムの中では比較的新しいプロジェクトに位置づけられる。CI/CDパイプラインでのAIアプリのテスト自動化や、外部API利用コストを抑えた開発フローの構築に役立つツールとして、今後の採用拡大が注目される分野である。","2026-11-11","CopilotKit (GitHub)","https://github.com/CopilotKit/aimock"],["CopilotKit本体が3.8万スター超、AG-UIプロトコルがエージェントUI標準化の核に","AIエージェント向けフロントエンドスタック「CopilotKit」が3.8万スターを超え、同社が策定するAG-UIプロトコルがエージェントとUIの通信を標準化する動きとして評価されている。React、Angular、モバイル、Slackなど複数プラットフォームに対応し、生成UIの基盤技術として注目される。CopilotKit/CopilotKitはAIエージェントと生成UIのためのフロントエンドスタックで、2026年11月時点でスター数は3.8万を超えてい","\n【概要】\nCopilotKit/CopilotKitはAIエージェントと生成UIのためのフロントエンドスタックで、2026年11月時点でスター数は3.8万を超えている。同社が提唱するAG-UIプロトコルは、エージェントとフロントエンドUIの通信を標準化する取り組みとして、コミュニティで高く評価されている。\n\n【背景】\nAIエージェントの実用化が進む中、モデルの推論能力や文脈処理以上に、エージェントがユーザーインターフェースとどう対話するかという「エージェントUX」の課題が顕在化してきた。これまで投資が集中してきたエージェントの推論やツール呼び出しに比べ、UI連携は手薄な領域だったとされる。\n\n【詳細】\nCopilotKitはReact、Angular、モバイル、Slackなど多様なプラットフォームへの対応を謳うフロントエンドスタックで、エージェントとユーザーの対話を実現するための生成UIコンポーネントを提供する。中核をなすAG-UIプロトコルは、オープンな通信規格としてエージェントフレームワークに依存しない柔軟性を持たせており、これが採用されればLLMオーケストレーションにおけるLangChainのような役割を果たす可能性があると指摘されている。\n\nCopilotKit自体は単なるUIライブラリにとどまらず、エージェントの状態管理やストリーミング応答の表示、ユーザーとのインタラクティブなやり取りを一貫して扱える点が特徴であり、エージェント開発者がフロントエンド側の実装に多くの時間を割かずに済む設計を志向している。\n\n【ポイント・注意点】\nCopilotKitのエコシステムには、OpenBotやopenmuse、aimockなど派生プロジェクトも展開されており、組織全体でのAIエージェント活用を支えるプラットフォームとして拡大を続けている。AG-UIの標準化が業界全体に浸透するかどうかが今後の焦点となる。","2026-11-10","agents-radar (GitHub)","https://github.com/CopilotKit/CopilotKit"],["NousResearch「hermes-agent」、26万スールで最高位のエージェントプロジェクトに","NousResearchが開発する「hermes-agent」がGitHub上で最も多くのスターを集めるAIエージェントプロジェクトとなり、26万スターを突破した。マルチモデル対応かつ拡張可能なエージェントハーネスとして「成長し続けるエージェント」を標榜し、強いコミュニティ支持を獲得している。NousResearch/hermes-agentは、2026年11月時点でGitHub上で最も多くのスターを獲得しているAIエージェントプロジェクトであり、スター数","\n【概要】\nNousResearch/hermes-agentは、2026年11月時点でGitHub上で最も多くのスターを獲得しているAIエージェントプロジェクトであり、スター数は26万を超えている。マルチモデル対応の拡張可能なエージェントハーネスとして、強固なコミュニティの支持を背景に成長を続けている。\n\n【背景】\nAIエージェント分野では多数のフレームワークが乱立する中、特定のモデルに依存せず長期的に利用者とともに進化していく設計思想を持つプロジェクトへの関心が高まっている。hermes-agentは「ユーザーとともに成長するエージェント」というコンセプトを掲げ、この潮流に応える形で支持を広げてきた。\n\n【詳細】\nhermes-agentは複数のLLMモデルに対応できるマルチモデル設計を採用し、用途に応じてモデルを切り替えたり拡張したりできる柔軟性を特徴としている。エージェントハーネスとしての完成度の高さに加え、NousResearchが持つオープンソースコミュニティとの強い結びつきが、26万スターという突出したスター数の背景にあるとされる。特定ベンダーのモデルに縛られない設計は、利用者が自身の用途やコストに応じて最適なモデルを選択できる柔軟性をもたらしており、これが長期的な支持の獲得につながっているとみられる。\n\n【ポイント・注意点】\n同時期にトレンド入りしたCopilotKit/CopilotKitのAG-UIプロトコルなど、エージェントのUI連携に焦点を当てたプロジェクトと対比される形で紹介されており、「エージェントの推論・拡張性」と「エージェントのUX・UI連携」という2つの異なる方向性の進化が並行して進んでいる点が指摘されている。エージェント基盤ツールの中でも別格のスケールを持つプロジェクトとして、今後の動向が注目される。","2026-11-10","agents-radar (GitHub)","https://github.com/NousResearch/hermes-agent"],["Rust製オープンソースダウンロードマネージャー「misterdownloadmanager」が急上昇","個人開発者が公開したクリーンルーム設計のダウンロードマネージャーがGitHubトレンドで急浮上。Windows・Mac・Linux対応でAIアシスタント向けMCPサーバーも同梱する実装が特徴。公開から約14日で24時間599スター増を記録するなど急成長している。開発者anefzaoui氏による「misterdownloadmanager」が、2026年10月末の公開から急速にスターを獲得し、GitHubの週間トレンドでも上位に入った。","\n【概要】\n開発者anefzaoui氏による「misterdownloadmanager」が、2026年10月末の公開から急速にスターを獲得し、GitHubの週間トレンドでも上位に入った。純粋なRustでゼロから書かれたクリーンルーム実装のダウンロードマネージャーだ。\n\n【背景】\n既存のダウンロードマネージャー市場には老舗ソフトが多いが、クロスプラットフォーム対応かつオープンソースで現代的な実装を求める声が背景にあるとみられる。リポジトリの説明は「misterdownloadmanager：Windows、Mac、Linux向けに純粋なRustでゼロから書かれた、究極のオープンソース・クリーンルームダウンロードマネージャー」としている。\n\n【詳細】\n開発者向けの構成は複数のクレートに分割されており、mdm-engineがダウンロードエンジン（セグメント分割、接続、再開、制限）を、mdm-appがegui製のデスクトップアプリ（サーバー向けの--headlessオプション付き）を、mdm-cliがコマンドラインからのヘッドレスダウンロードを、mdm-mcpがAIアシスタント向けのMCPサーバーを、mdm-nmhostがブラウザのネイティブメッセージングホストを、mdm-extractがzip・tar・gz・xz（7zとRARは7-Zip経由）のアーカイブ展開を担う構成になっている。\n\n成長速度に関する分析では、作成からおよそ14日というタイミングで新規急上昇に分類され、24時間で599スター増というペースが確認されている。AI分析によれば、クロスプラットフォーム対応と各種ダウンロードプロトコルのサポートが、幅広い支持を集めた要因とみられている。執筆時点でのスター規模は報道によって幅があり、6千台から7千台後半までの数値が各種トラッキングサイトで報告されている。\n\n【ポイント・注意点】\nMCPサーバーを同梱する点はAIエージェント連携を見据えた設計として注目される一方、クリーンルーム実装を謳う新規プロジェクトであるため、長期的な保守体制やセキュリティレビューの状況は今後の推移を注視する必要がある。","2026-11-09","GitHub (anefzaoui/misterdownloadmanager)","https://github.com/anefzaoui/misterdownloadmanager"],["janestreet/agent_skillsなどAIエージェント向けプロジェクトがトレンド常連化","GitHubの日次・週次トレンドでは、AIコーディングエージェント向けの「スキル」公開プロジェクトが引き続き多数ランクイン。Googleの「modern-web-guidance」など複数の大手企業発プロジェクトが存在感を示している。プロジェクトの新陳代謝が非常に速いことも特徴だ。2026年11月前半のGitHubトレンドでは、AIコーディングエージェントの能力を拡張する「スキル」（Agent Skills）形式のリポジトリが引き続き中心的な話題となってい","\n【概要】\n2026年11月前半のGitHubトレンドでは、AIコーディングエージェントの能力を拡張する「スキル」（Agent Skills）形式のリポジトリが引き続き中心的な話題となっている。大手企業発のプロジェクトも複数ランクインしている。\n\n【背景】\nAnthropicのClaude CodeやOpenAIのCodexなど、主要なAIコーディングエージェントが「スキル」という拡張可能な仕組みを採用し始めたことで、企業・個人を問わず独自のスキルパックを公開する動きが急速に広がっている。GoogleChromeの「modern-web-guidance」はその代表例の一つとして、「コーディングエージェントに最新のWebベストプラクティスを常に最新に保たせる」ことを目的としたプロジェクトとして紹介されている。\n\n【詳細】\n週間トレンドの集計を見ると、#5にランクインしたGoogleChrome/modern-web-guidanceは4.6千スター、72フォークを獲得しており、「#AIスキル」のタグが付けられている。その他にも、addyosmani氏による「agent-skills」がGitHub Explore上で2026年11月1日の更新情報として掲載されるなど、複数の個人・組織が同様のコンセプトのリポジトリを公開し続けている状況だ。\n\nこうしたスキルパックは、コーディングエージェントが特定分野（Web開発のベストプラクティス、特定言語の慣習、セキュリティ基準など）における最新の知見を参照できるようにするための補助的な知識ベースとして機能する。企業発のプロジェクトは自社技術やガイドラインの普及を狙う側面もあり、個人発のプロジェクトは独自のワークフロー効率化を目的に公開されるケースが多い。\n\n【ポイント・注意点】\nこの分野の特徴は、プロジェクトの新陳代謝が非常に速いことだ。週間トレンドの集計サイトでは、ある週に20位中19位が新規ランクインという大幅な入れ替わりが起きるなど、短期間でのプロジェクトの浮沈が激しい傾向が指摘されている。利用者にとっては、どのスキルパックが長期的に保守され続けるか見極めることが難しい状況でもある。企業発の公式プロジェクト（Google、AWSなど）は比較的継続性への信頼が高い一方、個人発の急成長プロジェクトについては、継続的なメンテナンス体制があるかを確認してから本番導入を検討することが望ましい。","2026-11-09","Trendshift (weekly)","https://github.com/janestreet/agent_skills"],["storytold「craft-anything」、あらゆるソフトウェアの仕組みを理解し再構築するツールとして急浮上","storytold/craft-anythingは、任意のソフトウェアの動作原理を理解し、自分自身で作り直すことを支援するオープンソースツール。週間で1.5万スターを獲得する急成長を見せ、リバースエンジニアリングとAI活用を組み合わせた新しいアプローチとして注目されている。ソフトウェアの動作原理を理解し、自分で作り直すことを支援するというユニークなコンセプトを掲げている。","\n【概要】\nstorytold/craft-anythingは、週間GitHubトレンドで7,300スター、1週間で1,500スター超を獲得する急成長を遂げたプロジェクトである。ソフトウェアの動作原理を理解し、自分で作り直すことを支援するというユニークなコンセプトを掲げている。\n\n【背景】\n近年、AIエージェントを活用したリバースエンジニアリングツールが相次いで登場しており、アプリの挙動解析からネイティブバイナリの解析まで、人手では困難だった作業をエージェントが支援する流れが強まっている。craft-anythingもこうした潮流の中で登場したプロジェクトの一つである。\n\n【詳細】\n同プロジェクトは「Craft Anything」というコンセプトのもと、任意のソフトウェアがどのように動作しているかを理解し、その知見をもとに自分自身で同様のものを作り上げる、という学習と開発支援のサイクルを提供することを目指している。類似のコンセプトを持つプロジェクトとしてmorluto/reaのようなエージェントを使ったリバースエンジニアリングツールも同時期に話題となっており、AIを活用してソフトウェアの「仕組みを知る」領域への関心が高まっていることが伺える。\n\nこうしたツールは、既存のソフトウェアをブラックボックスとして扱うのではなく、AIエージェントの解析能力を借りてその内部構造や設計思想を学び取り、自分自身の開発力向上につなげるという教育的な側面も持ち合わせている。単なるコード生成にとどまらず、既存資産からの学習プロセスを支援する点が、従来のAIコーディングツールとは異なるアプローチとして評価されている。\n\n【ポイント・注意点】\n週間で1,500スター超という急成長は、学習目的・開発効率化目的の両面からの支持を集めていることを示している。ソフトウェアの内部構造理解をAIが支援するというアプローチは、教育用途からセキュリティ分析まで幅広い応用が期待される分野であり、今後の発展が注目される。","2026-11-09","trendshift.io","https://github.com/storytold/craft-anything"],["ByteFree系？「agent-autoloop」、コマンドラインAIエージェントの自律タスク処理で急伸","TypeScript製の「KKKKhazix/agent-autoloop」がGitHubトレンドで急浮上している。コマンドラインAIエージェントをバックグラウンドで自律動作させ、普段は開発者に負担をかけず、判断に迷う場面だけカード形式で確認を求める設計が特徴だ。TypeScriptで開発されたオープンソースツール「KKKKhazix/agent-autoloop」が、GitHubの週間トレンドで存在感を強めている。","\n【概要】\nTypeScriptで開発されたオープンソースツール「KKKKhazix/agent-autoloop」が、GitHubの週間トレンドで存在感を強めている。コマンドラインで動作するAIエージェントを自律的にバックグラウンドで稼働させ、タスクを自動的に拾って最後まで対応させる仕組みを提供するツールだ。\n\n【背景】\nAIコーディングエージェントの活用が進む一方で、エージェントに都度指示を出す運用は開発者の手間を増やす要因にもなっていた。ことに長時間かかるタスクや継続的な監視が必要な作業では、エージェントが自律的に進行しつつも、重要な意思決定の場面だけ人間に判断を仰ぐ仕組みが求められていた。agent-autoloopはこうしたニーズに応える形で開発されたとみられる。\n\n【詳細】\nagent-autoloopは、Claude CodeやCodexといったコマンドラインエージェントをバックグラウンドで自律動作させ、普段は開発者に通知せず裏側でタスクを拾って処理を進める設計になっている。判断が難しい場面や重要な意思決定が必要な時だけ、カード形式の通知を通じて開発者に確認を求める仕組みが採用されており、必要最小限の介入で継続的なタスク処理を実現する。イベント駆動型のアーキテクチャを採用しており、Node.js環境上で動作し、MCP（Model Context Protocol）とも連携可能とされる。\n\nGitHubの週間トレンド集計では、公開から短期間でスター数が3千台から4千台へと急速に伸びており、複数の日次トレンドリポジトリ記録に継続して登場していることが確認できる。自己ホスト型のワークフロー自動化ツールとして、claude-codeやcodexといった既存のAIコーディングエージェントのエコシステムに組み込んで使うことを想定した設計になっている。\n\n【ポイント・注意点】\n自律的にタスクを処理し続ける設計であるため、意図しない変更が本番環境に反映されるリスクには注意が必要だ。重要な判断のみ人間に委ねる仕組みとはいえ、どの範囲までを自動化するかの設定次第でリスクの大きさが変わってくる。セルフホスト前提のツールであるため、運用環境のセキュリティ管理も利用者側の責任となる。","2026-11-09","GitHub Trending（marc-ko/daily-trending-repo集計)","https://github.com/KKKKhazix/agent-autoloop"],["知了「Cicada」、通話・配信のリアルタイム字幕と同時通訳を無料OSS化","Swift製の無料オープンソースアプリ「cicada」がGitHubトレンドに登場した。あらゆる通話や配信に対してリアルタイム字幕・同時通訳・AI会議メモを提供し、Mac・Windows・Linux・Androidの各プラットフォームに対応する。公開から短期間でスター数1,500件規模に到達した。「知了（Cicada）」という名称で公開されているオープンソースアプリが、GitHubトレンドで注目を集めている。","\n【概要】\n「知了（Cicada）」という名称で公開されているオープンソースアプリが、GitHubトレンドで注目を集めている。あらゆる通話やライブ配信に対し、リアルタイム字幕、同時通訳、AIによる会議メモ作成の機能を無料で提供するアプリケーションで、Mac・Windows・Linux・Androidという幅広いプラットフォームに対応している。\n\n【背景】\nリモートワークや国際的なオンライン会議が一般化する中で、言語の壁を越えたコミュニケーション支援ツールへの需要が高まっている。既存の商用サービスには高額な料金や特定プラットフォームへの依存といった制約があり、無料かつクロスプラットフォームで使える選択肢へのニーズが根強く存在していた。\n\n【詳細】\nCicadaはSwift言語で実装されており、メニューバー常駐型のアプリケーションとしても動作する設計が採用されている。音声認識技術を活用してリアルタイムに字幕を生成し、同時通訳機能によって異なる言語間でのコミュニケーションを支援する。さらに会議やライブ配信の内容を自動的に要約してAI会議メモとして記録する機能も備えており、議事録作成の手間を削減できる点が特徴だ。GitHubのタグには、android・linux・live-captions・macos・meeting-notes・menubar-app・simultaneous-interpretation・speech-recognition・subtitles・swift・swiftui・translation・windowsといった項目が付与されており、対応領域の広さがうかがえる。\n\nGitHubトレンドの集計データでは、公開から短期間でスター数が1,500件規模に到達しており、複数プラットフォーム対応かつ無料という点が、個人開発者や中小チームからの支持を集めている要因とみられる。類似の音声認識・翻訳系ツールが相次いでトレンド入りする中、Cicadaは特に会議・配信という用途に特化したオールインワン型のソリューションとして差別化を図っている。\n\n【ポイント・注意点】\n音声認識や翻訳の精度は使用言語やモデルの設定によって変動する可能性があり、重要な会議での利用には事前の検証が推奨される。クロスプラットフォーム対応である一方、各OS向けの実装や権限設定（マイクアクセスなど）はプラットフォームごとに異なるため、導入時には各環境のドキュメントを確認する必要がある。","2026-11-06","GitHub (wquguru/cicada)","https://github.com/wquguru/cicada"],["Y Combinator CEOが公開「gstack」、Claude Codeを仮想エンジニアリングチーム化","Y CombinatorのCEOガリー・タン氏が自身のClaude Code環境を公開したOSSツール「gstack」が急成長中。CEO・デザイナー・エンジニアリングマネージャーなど23の役割をスラッシュコマンドとして実装し、個人開発者でもチーム開発のような工程管理を実現する。Y Combinator CEOのガリー・タン氏が公開したオープンソースツール「garrytan/gstack」が、GitHubトレンドで引き続き高い注目を集めている。","\n【概要】\nY Combinator CEOのガリー・タン氏が公開したオープンソースツール「garrytan/gstack」が、GitHubトレンドで引き続き高い注目を集めている。Claude Codeをはじめとする複数のAIコーディングエージェントを、CEO・デザイナー・エンジニアリングマネージャー・リリースマネージャー・ドキュメントエンジニア・QAなどの役割を担う「仮想エンジニアリングチーム」に変貌させるツールキットだ。\n\n【背景】\nAIコーディングエージェントの能力向上に伴い、個人開発者が従来はチームで担っていた設計・実装・レビュー・QA・リリースといった工程を一人でこなす場面が増えている。しかし人間のチームが持つような役割分担や工程間の連携をAIにどう再現させるかが課題となっていた。gstackはタン氏自身がYCの業務の傍ら600,000行超のプロダクションコードを60日間で書き上げた経験から生まれたとされる。\n\n【詳細】\ngstackはすべてMarkdownで記述されたスラッシュコマンド群として提供され、全てが無料でMITライセンスの下に公開されている。CEOが製品を見直し、エンジニアリングマネージャーがアーキテクチャを固定し、デザイナーがAIっぽい粗いUIを見抜き、レビュアーが本番環境のバグを見つけ、QAリードが実際にブラウザを開いてテストし、セキュリティ担当者がOWASPやSTRIDEに基づく監査を行い、リリースエンジニアがPRを出荷するという一連の流れを「Think→Plan→Build→Review→Test→Ship→Reflect」という7段階のスプリントとして構成している。各スキルは前段階の出力を次の段階が読み込む設計になっており、たとえば設計ドキュメントを計画レビューが参照し、QAが拾ったテスト計画をレビューが利用するといった連携が組まれている。\n\nインストールはGitリポジトリをクローンしてセットアップスクリプトを実行するだけで完了し、約30秒で導入できるとされる。チームモードも用意されており、共有リポジトリをブートストラップすることでチームメンバー全員に自動的にgstackが行き渡る仕組みも備える。Claude Codeを主対象としつつ、Codex CLIやOpenCode、Cursor、KiroやGitHub Copilot CLIなど複数のエージェントにも実験的に対応している。\n\n【ポイント・注意点】\n技術系の創業者や、体系立った役割分担を求める個人開発者に向いている一方、既存のチーム開発プロセスを置き換えるものではなく、あくまでAIエージェントの活用を構造化するレイヤーである点に注意したい。導入には各種AIコーディングエージェントの契約・設定が前提となる。","2026-11-05","GitHub (garrytan/gstack)","https://github.com/garrytan/gstack"],["ピュアC製MoEエンジン「colibri」、GPU不要でフロンティア級モデルを家庭用PCに","JustVuggが開発する「colibri」は、依存関係ゼロのピュアC実装によりMixture-of-Expertsモデルをディスクからストリーミング実行するエンジン。GPUを必要とせずコンシューマー向けハードウェアでフロンティア級モデルの稼働を可能にし、4.6万スターを超えて急成長している。JustVugg/colibriは、GPUなしでコンシューマー向けハードウェア上でMixture-of-Experts（MoE）モデルを稼働させることを目的としたオー","\n【概要】\nJustVugg/colibriは、GPUなしでコンシューマー向けハードウェア上でMixture-of-Experts（MoE）モデルを稼働させることを目的としたオープンソースプロジェクトで、2026年11月時点でスター数4.6万、フォーク数5,400超に達している。\n\n【背景】\nフロンティア級の大規模言語モデルを動かすには、通常高性能なGPUと大容量メモリが必要とされる。colibriはこの障壁を取り除き、一般的な家庭用PCでも大規模モデルを扱えるようにすることを目指して開発された。\n\n【詳細】\ncolibriはピュアC言語で実装されており、外部ライブラリへの依存関係を持たない設計が特徴だ。MoEモデルの重みをディスクからストリーミングで読み込む方式を採用することで、GPUのVRAM容量に縛られずにモデルを実行できる仕組みを実現している。これにより、専用の高性能計算資源を持たない開発者でも、フロンティア級のモデルをローカル環境で試すことが可能になる。\n\n外部ライブラリに依存しないピュアCでの実装は、移植性や軽量性の面で優れており、さまざまな環境への組み込みがしやすい点も評価されている。ディスクストリーミング方式は、モデル全体を一度にメモリへ展開する必要がないため、限られたメモリ容量のマシンでも大規模モデルの一部分ずつを読み込みながら推論処理を進めることができる仕組みとなっている。\n\n【ポイント・注意点】\n同様にディスクストリーミング方式でモデルを軽量実行する他のプロジェクト（35B MoEモデルを約2.5GBのRAMで実行する取り組みなど）と並び、AIモデルの「民主化」を目指す動きの一つとして位置づけられている。GPU非依存というアプローチは、クラウドコストを抑えたい個人開発者や、オフライン環境での推論需要に応える選択肢として注目されている。","2026-11-03","coddykit.com","https://github.com/JustVugg/colibri"],["ローカルLLM駆動のセキュリティ運用センター「AiSOC」、7千超の検知ルールで脅威対応を自動化","beenuarが公開する「AiSOC」はオープンソースのAIセキュリティ運用センターで、7,023件のルールライブラリから2,538件の実行可能な検知ルールを運用し、ローカルLLM（llama3.2:3b）によるエージェントトリアージを実現。6,000スターを超え注目を集めている。beenuar/AiSOCは、オープンソースのAIセキュリティ運用センター（SOC）を構築するプロジェクトで、2026年11月時点でスター数6,353、1日で446スターを獲得す","\n【概要】\nbeenuar/AiSOCは、オープンソースのAIセキュリティ運用センター（SOC）を構築するプロジェクトで、2026年11月時点でスター数6,353、1日で446スターを獲得する勢いを見せている。セキュリティ運用の自動化をローカルLLMで実現する点が特徴だ。\n\n【背景】\n企業のセキュリティ運用センターは、膨大な検知アラートの中から実際の脅威をトリアージする作業に多くの人的リソースを費やしている。クラウドベースのLLM APIに依存せず、ローカル環境で完結するセキュリティAIへのニーズが高まる中、AiSOCはこの課題に応える形で開発された。\n\n【詳細】\nAiSOCは7,023件の検知ルールライブラリから、2,538件の実行可能な検知ルールを運用する仕組みを持つ。トリアージにはローカルで動作する軽量LLMであるllama3.2:3bを使用しており、外部クラウドサービスへのデータ送信を避けつつエージェントによる脅威判定を行える設計となっている。これにより、機密性の高いセキュリティログをローカル環境内で処理しながら自動化の恩恵を受けられる。\n\n大量の検知ルールをあらかじめライブラリとして用意し、その中から実運用に適した形へ絞り込んだ実行可能ルールを運用する構成は、誤検知の削減と実務での使いやすさの両立を狙ったものとみられる。ローカルLLMによるエージェントトリアージは、セキュリティアナリストが一次対応すべきアラートの優先順位付けを自動化し、対応工数の削減に寄与する仕組みとして機能する。\n\n【ポイント・注意点】\n教育分野のai-engineering-hubと並んで紹介され、AIエージェント活用が「次のフロンティア」としてセキュリティ領域にも広がっていることを示す事例とされている。ローカルLLMによる処理は、クラウドAPI利用コストの削減とデータプライバシーの両立を図る動きとして、セキュリティ業界での採用が今後注目される。","2026-11-03","coddykit.com","https://github.com/beenuar/AiSOC"],["Rust製ローカル音声ディクテーションアプリ「hex」、完全オンデバイス処理で急成長","anomalycoが公開する「hex」は、macOS・Windows・Linuxで動作するRust製の音声入力アプリ。キーを押しながら話すだけでテキストが貼り付けられ、音声認識モデルはすべてローカルで処理され外部へデータが送信されない設計で、1日で1,000スター超を獲得する急成長を見せた。anomalyco/hexは、Rustで実装されたローカル完結型の音声ディクテーション（音声入力）アプリで、2026年11月時点でスター数3,496、1日で1,179ス","\n【概要】\nanomalyco/hexは、Rustで実装されたローカル完結型の音声ディクテーション（音声入力）アプリで、2026年11月時点でスター数3,496、1日で1,179スターを獲得する急成長を記録した。macOS、Windows、Linuxに対応している。\n\n【背景】\n音声入力ツールの多くはクラウドベースの音声認識APIに依存しており、プライバシーへの懸念やネットワーク遅延の課題があった。hexはこうした課題に対応するため、完全にローカル環境で処理が完結する設計を採用して開発された。\n\n【詳細】\nhexの操作は非常にシンプルで、キーを押しながら話すとその内容がテキスト化され、クリップボード経由で貼り付けられる仕組みになっている。初回起動時に音声認識モデルをダウンロードする以外は、一切のデータが端末外に送信されないオンデバイス処理を徹底している点が最大の特徴だ。Rust実装により高いパフォーマンスとクロスプラットフォーム対応を両立している。\n\nこのシンプルな操作性は、キーを押している間だけ録音・認識処理を行うという直感的なインターフェースによって実現されており、特別な設定や学習コストなしにすぐ使い始められる点が支持を集めている要因とみられる。オンデバイス処理の徹底は、機密性の高い会話やメモを扱うユーザーにとって安心材料となっており、クラウド接続が不安定な環境でも安定して動作する利点もある。\n\n【ポイント・注意点】\n同時期にトレンド入りした教育系・セキュリティ系のプロジェクトと並び、「ローカルファーストツール」というキーワードで紹介されている。プライバシーを重視するユーザー層や、ネットワーク環境に依存しない作業フローを求める開発者から支持を集めており、オンデバイスAI活用の広がりを示す代表例の一つとなっている。","2026-11-03","coddykit.com","https://github.com/anomalyco/hex"],["Tsinghua大学発「OpenMAIC」、文書を対話型授業に変える多エージェント教育プラットフォーム","清華大学MAICラボが開発するオープンソースAIプラットフォーム「OpenMAIC」は、任意のトピックや文書を多エージェントによる対話型授業体験に変換する。スター数4.2万、フォーク6,500超を記録し、エージェント活用が「アプリケーション時代」に移行する象徴的事例とされる。THU-MAIC/OpenMAIC（Open Multi-Agent Interactive Classroom）は、清華大学MAICラボが公開するオープンソースのAI教育プラットフォ","\n【概要】\nTHU-MAIC/OpenMAIC（Open Multi-Agent Interactive Classroom）は、清華大学MAICラボが公開するオープンソースのAI教育プラットフォームで、2026年11月時点でスター数4.2万、フォーク数6,500超を記録している急成長中のプロジェクトである。\n\n【背景】\nAIエージェント技術がインフラ層の整備から、実際のユーザーが使うアプリケーション層へと重心を移しつつある中、教育分野でもその応用が本格化してきている。OpenMAICはこうした「エージェント経済がアプリケーション時代に入った」ことを象徴する事例の一つとして紹介されている。\n\n【詳細】\nOpenMAICは、任意のトピックやドキュメントを入力すると、複数のAIエージェントが協調して豊かな対話型授業体験を作り出す仕組みを持つ。従来の単一エージェントによるデモンストレーションから、組織的な構造を模した協調型マルチエージェントシステムへの転換を体現するプロジェクトとして評価されている。\n\n複数のエージェントがそれぞれ異なる役割（説明役、質問役、評価役など）を分担しながら協調動作することで、単一のチャットボットでは実現しづらい、対話形式の授業に近い体験を生み出すことを狙っているとみられる。利用者が持ち込んだ資料やテーマに応じて柔軟に授業内容を組み立てられる点が、教育現場における個別最適化のニーズに応える特徴として位置づけられている。\n\n【ポイント・注意点】\n同時期に紹介された小規模プロジェクトOrkas-AI/Orkas（ローカルファーストのAIチーム、7,000スター超）と対比される形で紹介されており、インフラからアプリケーションへの移行という大きなトレンドの中での位置づけが強調されている。教育現場でのAIエージェント活用が、今後どのように実装されていくかを示す先行事例として注目される。","2026-11-02","coddykit.com","https://github.com/THU-MAIC/OpenMAIC"]],"gh-blog":[["wfx-loot攻撃、4837のGitHubアカウント乗っ取りCI認証情報窃取","11月10日から始まった大規模サプライチェーン攻撃「wfx-loot」が判明。盗まれたGitHubトークンを使い6万以上のリポジトリを探索し、GitHub ActionsやnpmのフックでCI認証情報を窃取する手口が報告されている。セキュリティ企業Aikidoが検知し命名、過去のGhostAction被害者が再標的化される傾向も確認された。概要 2026年11月10日頃から、GitHub上で「wfx-loot」と呼ばれる大規模なサプライチェーン攻撃キャンペ","\n概要\n2026年11月10日頃から、GitHub上で「wfx-loot」と呼ばれる大規模なサプライチェーン攻撃キャンペーンが確認された。セキュリティ企業Aikidoが最初にこの活動を検知し命名したもので、盗まれたGitHubアカウントの認証情報を悪用してCI/CDパイプライン内の秘密情報を窃取する手口が特徴となっている。\n\n背景\n近年、GitHub Actionsのワークフローにはクラウド認証情報やAPIトークンなど機密性の高い情報が多数保存されており、攻撃者にとって魅力的な標的となっている。今回の攻撃は、10月に発生した「GhostAction」キャンペーンの被害者が再び標的にされる傾向があったことも判明しており、過去の攻撃で得られた足がかりが使い回されている可能性が指摘されている。\n\n詳細\nセキュリティ企業の調査によれば、攻撃者は\n4,837件のハイジャックされたGitHubアカウントを使い、それらのアカウントが所有または書き込みアクセス権を持つリポジトリにCIシークレット窃取コードを送り込んだ\n。具体的には\n11月10日午後0時45分（UTC）頃から、盗まれたGitHub認証情報を使って61,764件のリポジトリの書き込みアクセスを調べ、「docs: dependency audit notes」という偽装タイトルのプルリクエストを開いた\nとされる。さらに\n1,500行に及ぶ認証情報窃取用シェルスクリプトを、既存のGitHub Actionsワークフローの改変、短命ブランチへの新規ワークフロー追加、またはnpmインストールフックの設置という形で配信した\n。\n\n窃取範囲については\nGitHub Actionsのシークレットや変数、ワークフローのGITHUB_TOKEN、OIDCおよびActionsランタイムトークン\nが対象とされ、AWSやAzureなどクラウド環境への持続的アクセスを確保するための工作も確認されている。攻撃の痕跡は意図的に消去されており、\n11月10日以降、数万のリポジトリに認証情報窃取用のペイロードが送り込まれ、うち1,800以上で実際にマルウェアが実行されクラウド認証情報が攻撃者に送信された\nという。\n\nポイント・注意点\nStepSecurityの分析では\n攻撃者はGitHub Actionsの脆弱性を悪用しているわけではなく、実在する開発者やボットアカウントの正規トークンを使用している\nと指摘されている。また\nほとんどのプルリクエストは「docs: dependency audit notes」というタイトルで偽装されている\nため、開発者はリポジトリのPR履歴や不審なワークフロー変更を確認し、該当する場合は速やかにシークレットのローテーションを行う必要がある。","2026-11-12","BleepingComputer","https://www.bleepingcomputer.com/news/security/hackers-compromise-4-800-github-accounts-to-steal-cloud-credentials/"],["GitHub、あらゆるエージェントで動くスキル作成法を解説","GitHubはUniverse 2026のセッション内容をもとに、どのコーディングエージェントでも再利用できる「エージェントスキル」の作り方を解説する記事を公開。SKILL.mdファイルに手順を記述し、プロジェクト固有の設定とスキル本体を分離する設計指針を示した。チェックリストなど境界が明確な作業への適用を推奨している。GitHubは2026年11月12日、開発者向けブログにて「Build once, run on any agent: A practic","\n■概要\nGitHubは2026年11月12日、開発者向けブログにて「Build once, run on any agent: A practical guide to agent skills」と題する記事を公開した。著者はGitHubのシニアデベロッパーアドボケイト、Andrea Griffiths氏で、GitHub Universe 2026でProcore社のShishir Tewari氏と共同発表したセッション内容をもとにしている。\n\n■背景\n近年、Claude Code、GitHub Copilot、Cursorなど複数のコーディングエージ
