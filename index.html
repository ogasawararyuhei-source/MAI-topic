<title>MAI topic</title>
<style>

:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;display:flex;flex-direction:column;height:100dvh;overflow:hidden;transition:background .35s ease,color .35s ease}
body::before{content:"";position:fixed;inset:0;background:var(--pattern);pointer-events:none;opacity:var(--pattern-op,.5)}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
[data-theme="steampunk"]{--bg:#e6d7b8;--pattern:radial-gradient(circle at 12% 20%,rgba(141,100,40,.16) 0 26px,transparent 27px),radial-gradient(circle at 88% 78%,rgba(141,100,40,.13) 0 38px,transparent 39px),repeating-linear-gradient(0deg,rgba(90,62,25,.05) 0 1px,transparent 1px 26px);--pattern-op:1;--card:#f8eed3;--ink:#2e2010;--muted:#77603c;--line:#a97f3f;--accent:#9c4a12;--accent2:#2f5d50;--accent-ink:#fff6df;--soft:#efdfba;--old:#97835f;--top-bg:#2a1a0c;--top-ink:#f2dfae;--radius:8px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\2699  \2699  \2699";--shadow:0 14px 34px rgba(62,40,8,.28)}
[data-theme="witch"]{color-scheme:dark;--bg:#161022;--pattern:radial-gradient(circle at 18% 12%,rgba(233,213,255,.20) 0 1.5px,transparent 2.5px),radial-gradient(circle at 72% 22%,rgba(233,213,255,.14) 0 1px,transparent 2px),radial-gradient(circle at 42% 66%,rgba(196,181,253,.12) 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 84%,rgba(233,213,255,.16) 0 1px,transparent 2px),radial-gradient(circle at 6% 88%,rgba(196,181,253,.12) 0 1px,transparent 2px);--pattern-op:1;--card:#241a3d;--ink:#f1eaff;--muted:#bdaee0;--line:#5b4595;--accent:#a678ff;--accent2:#e9d5ff;--accent-ink:#1d1233;--soft:#2f2350;--old:#8d81ad;--top-bg:#0e0919;--top-ink:#efe6ff;--radius:20px;--font-display:"IM Fell English","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\263E  \2726  \263D";--shadow:0 14px 34px rgba(0,0,0,.5)}
[data-theme="dnd"]{--bg:#e7d9b4;--pattern:repeating-linear-gradient(45deg,rgba(158,43,37,.05) 0 2px,transparent 2px 18px),radial-gradient(circle at 85% 10%,rgba(158,43,37,.10) 0 30px,transparent 31px);--pattern-op:1;--card:#f7ecc9;--ink:#332216;--muted:#7d6248;--line:#8c6a3f;--accent:#9e2b25;--accent2:#a97b00;--accent-ink:#fdf3d8;--soft:#eee0b6;--old:#9a8a72;--top-bg:#471611;--top-ink:#f7e7bd;--radius:4px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\265E  \2726  \265E";--shadow:0 14px 30px rgba(71,22,17,.30)}
[data-theme="celtic"]{--bg:#e3dfc6;--pattern:repeating-linear-gradient(0deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px),repeating-linear-gradient(90deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px);--pattern-op:1;--card:#f6f2dc;--ink:#20331e;--muted:#5d7050;--line:#77873f;--accent:#2e6b34;--accent2:#a8842a;--accent-ink:#fbf7e2;--soft:#e7e5c8;--old:#93a086;--top-bg:#17351f;--top-ink:#efeccb;--radius:14px;--font-display:"Uncial Antiqua","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\16DA  \2726  \16DB";--shadow:0 14px 30px rgba(23,53,31,.26)}
[data-theme="greek"]{--bg:#f2eee3;--pattern:repeating-linear-gradient(90deg,rgba(29,95,138,.06) 0 1px,transparent 1px 34px),radial-gradient(circle at 90% 0%,rgba(185,138,28,.10) 0 60px,transparent 61px);--pattern-op:1;--card:#fffdf6;--ink:#1e2c38;--muted:#66727c;--line:#b3923c;--accent:#1d5f8a;--accent2:#b98a1c;--accent-ink:#ffffff;--soft:#ece7d7;--old:#a3a8ad;--top-bg:#fdfbf4;--top-ink:#1e2c38;--radius:2px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\03A9  \2766  \03A9";--shadow:0 14px 30px rgba(30,44,56,.18)}
.top{flex:none;position:relative;z-index:30;background:var(--top-bg);color:var(--top-ink);border-bottom:3px double var(--line)}
.topin{max-width:1080px;margin:auto;padding:10px 16px 4px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.logo{font-family:var(--font-display);font-weight:900;font-size:23px;letter-spacing:.06em}.logo span{color:var(--accent2)}
[data-theme="witch"] .logo span,[data-theme="steampunk"] .logo span{color:var(--accent)}
.date{font-size:10px;opacity:.75;white-space:nowrap}
.topbtns{display:flex;gap:8px;flex:none}.pill{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.themes{max-width:1080px;margin:auto;padding:6px 16px 10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.themes-label{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;opacity:.8}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;opacity:.85}
.theme-btn .gly{margin-right:5px}
.theme-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
.stage-wrap{flex:1;min-height:0;max-width:1080px;width:100%;margin:auto;padding:10px 16px 12px;display:flex;flex-direction:column;position:relative;z-index:1}
.herostrip{flex:none;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;box-shadow:var(--shadow)}
.herostrip img{width:74px;height:52px;object-fit:cover;border-radius:calc(var(--radius) * .6);flex:none}
.herostrip p{margin:0;font-size:13px;color:var(--muted)}.herostrip b{color:var(--ink);font-family:var(--font-display)}
.catbar{flex:none;display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.catbar .navbtn{flex:none}
.catinfo{flex:1;text-align:center;min-width:0}
.catinfo h2{margin:0;font-family:var(--font-display);font-size:clamp(19px,4.6vw,27px);line-height:1.25;letter-spacing:.03em}
.catinfo p{margin:1px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catcount{flex:none;font-size:12px;background:var(--soft);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-weight:700}
.navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800;box-shadow:var(--shadow)}
.navbtn:active{transform:scale(.97)}
.dots{flex:none;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:transparent;padding:0}
.dot.active{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.stage{flex:1;min-height:0;touch-action:none;position:relative}
#cardSlot{height:100%}
.card{height:100%;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
.card::after{content:var(--orn);position:absolute;top:6px;right:12px;font-size:13px;letter-spacing:.3em;color:var(--accent2);opacity:.85;pointer-events:none}
.card.old .ph{filter:grayscale(1)}
.card .ph{width:100%;height:30%;min-height:120px;object-fit:cover;display:block;flex:none}
[data-theme="steampunk"] .card .ph{filter:sepia(.35) contrast(1.05)}
[data-theme="witch"] .card .ph{filter:saturate(.85) hue-rotate(-12deg) brightness(.92)}
[data-theme="dnd"] .card .ph{filter:sepia(.25) saturate(1.1)}
[data-theme="celtic"] .card .ph{filter:saturate(1.05) hue-rotate(6deg)}
[data-theme="greek"] .card .ph{filter:saturate(.92) brightness(1.04)}
.cbody{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.badge{background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:999px;font-weight:800}.badge.oldb{background:var(--old)}
.card h3{margin:0;font-size:clamp(17px,4.4vw,21px);line-height:1.45;font-family:var(--font-display);font-weight:700}
.sum{font-size:14px;color:var(--muted);margin:0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.btn{border:0;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800}
.btn.primary{background:var(--accent);color:var(--accent-ink)}.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.saved{background:var(--accent2);color:var(--accent-ink)}
.src{font-size:11px;color:var(--muted);word-break:break-all}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;color:var(--muted)}
.empty .big{font-size:34px;color:var(--accent2)}

.arrownav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--soft);color:var(--accent);font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);opacity:.92}
.arrownav:active{transform:translateY(-50%) scale(.93)}
.arrownav.left{left:6px}.arrownav.right{right:6px}
.downrow{flex:none;display:flex;justify-content:center;padding-top:8px}
.arrowdown{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--soft);color:var(--accent);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.pager{flex:none;display:flex;align-items:center;gap:10px;margin-top:10px}
.pager .navbtn{flex:1}
.artdots{flex:none;display:flex;gap:5px;max-width:34vw;flex-wrap:wrap;justify-content:center}
.artcount{flex:none;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.hint{flex:none;font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.addcat{flex:none;text-align:center;margin-top:6px}
.addcat button{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700}
@keyframes inNext{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes inDown{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes inUp{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
.anim-next{animation:inNext .28s ease}.anim-prev{animation:inPrev .28s ease}.anim-down{animation:inDown .28s ease}.anim-up{animation:inUp .28s ease}
dialog{border:2px solid var(--line);border-radius:calc(var(--radius) + 6px);padding:0;max-width:min(680px,94vw);width:680px;max-height:92dvh;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,8,4,.6)}
.din{padding:20px;overflow-y:auto;max-height:92dvh}
.din img{width:100%;height:200px;object-fit:cover;border-radius:var(--radius)}
.din h3{font-size:20px;line-height:1.4;margin:12px 0 6px;font-family:var(--font-display)}
.full{font-size:15px;white-space:pre-line}
textarea,input[type="text"]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px}
label.fl{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
.memoBox{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.memoItem{border-top:1px solid var(--line);padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--top-bg);color:var(--top-ink);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:90vw;text-align:center}
@media(max-width:640px){.topin{padding:8px 12px 2px}.themes{padding:4px 12px 8px}.stage-wrap{padding:8px 12px 10px}.herostrip{display:none}.catbar .navbtn{padding:8px 10px;font-size:12px}.card .ph{height:24%;min-height:104px}}
@media(prefers-reduced-motion:reduce){.anim-next,.anim-prev,.anim-down,.anim-up{animation:none}body{transition:none}}

</style>

["AIがAI開発そのものを加速 — METRがAnthropicで約1.9倍の加速を報告","独立評価機関METRが11月5日に公表。Anthropicのベンチマーク能力の伸びが2025年10月以降、それ以前の約1.9倍の速さになったとし、その大半はAIが研究者を助けた効果の可能性があると分析しました。","\n独立した評価団体METRは11月5日、Anthropic社内でのAI研究開発の加速について現地調査に基づく評価を公表しました。\n\nよく定義された課題におけるモデル能力の向上ペースは、2024年3月〜2025年10月の期間と比べて約1.9倍（区間1.5〜2.8倍）になったと推定されています。METRは、その加速の約8割はAIが研究者を支援したことによる可能性があるとしながらも、帰属には大きな不確実性があると強調しています。\n\n重要な留保として、これは完全自律的な自己改善の証拠ではありません。最も重要な学習工程では依然として人間の研究者が中心であり、AIはまだ自律的に大きな貢献をしている段階ではない、とMETRは述べています。","2026-11-08","AI Nextia / METR報告","https://www.ainextia.com/insights/ai-news-today-november-5-2026/"],
["OpenAI、脆弱性研究で948件の権限昇格エクスプロイトを自動生成","OpenAIが11月4日に報告。Linuxカーネルの候補2,308件を調べ、1,724件を再現、948件の動作するエクスプロイトを生成したと発表しました。","\nOpenAIは11月4日、自律的な脆弱性研究パイプラインの成果を公表しました。\n\n対象はLinuxカーネルで、2,308件の候補所見を特定・分析し、テスト環境で1,724件の脆弱性を再現、948件についてはローカル権限昇格のエクスプロイトを生成したということです。\n\n翌11月5日には、この研究のための専用モデル「GPT-6 Cyber」が発表されました。認可された防御的研究の範囲内での利用を前提とし、高機能な設定は承認された利用者に限られます。防御側の自動化が進む一方で、悪用防止の枠組みが同時に問われる事例です。","2026-11-08","AI Nextia / OpenAI報告","https://www.ainextia.com/insights/ai-news-today-november-5-2026/"],
["DeepMindのエージェント、旧式RSA暗号の弱点2件を発見","Google DeepMindが11月6日に発表。1024ビットRSAに関する未知の弱点2件を、研究者と協働するAIエージェントが見つけたと報告しました。","\nGoogle DeepMindは、人間の暗号研究者と協働したAIエージェントが、1024ビットRSAに関する未知の弱点2件を発見したと発表しました。DeepMindの科学担当VP Pushmeet Kohli氏が11月6日に公表したものです。\n\n1つ目は署名のパディングに関するもので、攻撃者が署名ブロックの約半分を制御できる場合、パディングの防御効果がほぼなくなるという指摘です。2つ目はバッチ因数分解で、同じビット長の鍵が多い場合、1回の高コストな事前計算を複数の鍵に使い回せるというものです。\n\nただし、倍率などの数字は理論上の推定であり、現代の暗号が破られたわけではありません。1024ビット鍵は主要用途では既に使われていません。直感と試行錯誤に頼っていた暗号解析の工程を、機械が担い始めている点が本質です。","2026-11-08","BYOBot AI Newsstand","https://byobot.ai/ai-news/ai-daily-newsstand-november-8-2026"],
["OpenAI Images 2.6公開 — 高速化とGIF生成、全プランで利用可","11月4日公開。生成が約50%高速化し、編集の一貫性が向上、短いアニメーションGIFも作れるようになりました。全サブスクリプションで利用できます。","\nOpenAIは11月4日、画像生成の新版「Images 2.6」を発表しました。\n\n主な変更は3点です。生成速度が従来より約50%向上したこと、繰り返し編集しても被写体や構図の一貫性が保たれやすくなったこと、そして短いアニメーションGIFを作成できるようになったことです。\n\n提供範囲も広がり、ChatGPTの全サブスクリプション層、Codex、APIで利用できるとされています。中小事業者向けのまとめ記事でも、今週最も分かりやすい改善として筆頭に挙げられています。制作販売で画像素材を作る用途にも直接効く更新です。","2026-11-08","Lilach Bullock","https://www.lilachbullock.com/ai-news-this-week-for-small-business-8-november-2026/"],
["Gemini Omni 1.2 Flash一般提供 — 動画15秒・価格は約30%低下","Googleの動画モデルが一般提供に。クリップは最大15秒になり、価格は前版より約30%下がったと報じられています。","\nGoogle DeepMindは11月5日にGemini Omni 1.2 Flashのモデルカードを公表し、一般提供が始まりました。\n\nテキスト、画像、音声、動画から、音声付き動画を生成・編集できるモデルです。今回の変更で重要なのは長さよりも価格で、クリップは最大15秒（従来10秒）になり、価格は前版より約30%低下したと第三者報道は伝えています。720pで1秒あたり約0.07ドル相当とされます。\n\n会話しながら動画を編集できる点も特徴で、短尺の商品紹介やSNS動画の制作コストを下げる可能性があります。","2026-11-07","Lilach Bullock / BYOBot","https://www.lilachbullock.com/ai-news-this-week-for-small-business-8-november-2026/"],
["GPT-6 Astraが別モデルの重みを直接編集し数学精度が7.9%→48.1%に","MITの研究として報じられた「重み空間プログラミング」。再学習なしにパラメータの0.016%を書き換えて精度を大きく改善したとされます。","\n11月4日のCleartextのブリーフィングで紹介された研究です。GPT-6 Astraが別のモデル（Qwen）の重み行列を直接読み、重要なパラメータを特定して書き換えたところ、数学ベンチマークの精度が7.9%から48.1%に上がったと報じられています。変更したのは全体の0.016%のみで、再学習も勾配降下も行っていません。\n\n留保も重要です。編集はゼロショットではなく、前向き計算や練習問題の利用が前提でした。試行回数が少ない場合は改善が乏しかったことも報告されています。\n\nそれでも、ファインチューニングとは異なる「モデルがモデルを手術する」手法として、今後追うべきテーマだと番組は位置づけています。","2026-11-04","Cleartext AI Revolution","https://www.cleartext.fm/ai/episodes/2026-11-04"],
],

["morluto/rea — エージェントにアプリを渡すと仕組みを解読","今週もスター増加数1位。ネイティブバイナリ、Web、Electron、.NETまで、エージェントが動作を調べ、根拠付きで再構成を返します。週間+24,105スター。","\nGhTrendsの11月7日版で1位。morluto/reaは、ソースコードのないソフトウェアをコーディングエージェントに調べさせるためのリポジトリです。\n\nネイティブバイナリ、ウェブサイト、Electronアプリ、.NETアセンブリなどを対象に、機能がどう動くかを再構成し、すべての主張に根拠と限界を添えて返します。\n\n週間ランキング（11月2〜8日）でも+24,105スターで首位を維持しており、エージェントに「調べさせる」用途の代表格になっています。","2026-11-08","GhTrends Daily","https://www.ghtrends.dev/daily/2026-11-07/"],
["storytold/craft-anything — アプリやゲームを調べ、自分の版を作る","reaと並んで人気。実地調査ツールで対象を理解したうえで、指定した技術スタックで自分のバージョンをエージェントが作ります。","\n週間・日次ともに2位を維持するリポジトリです。\n\n考え方はreaの隣にあります。まず対象のアプリやゲームがどう動くかを実際の検査ツールで調べ、その理解をもとに、利用者が指定した技術スタックで自分のバージョンを作ります。\n\n「理解してから作る」という流れが、単なるコード生成と違う点として評価されています。","2026-11-08","GhTrends Weekly","https://ghtrends.dev/weekly/"],
["cloudflare/security-audit-skill — エージェントをセキュリティ監査人に","Cloudflare製スキル。コードベースの構造と信頼境界を地図化し、探索エージェントと検証エージェントを分けて誤検知を減らします。","\nCloudflareが公開したスキルで、コーディングエージェントをセキュリティ監査人に変えるものです。日次ランキングで3位に入りました。\n\n仕組みは、まずコードベースのアーキテクチャと信頼境界を地図化し、未調査領域には独立した探索エージェントを送ります。候補が見つかると、別の新しい検証エージェントがそれを否定しようと試み、残ったものだけがレポートに載ります。\n\n自分で自分の発見を交差検証させる設計が、ブログやSNSでも注目されています。","2026-11-08","GhTrends / Ageshio","https://ageshio.dev/"],
["vercel-labs/agent-browser — AIエージェント向け高速ブラウザCLI","11月8日のトレンド1位。Rust製CLIで、AIエージェントのブラウザ自動化を軽量にします。npm／Homebrew／Cargoで導入できます。","\nAgeshioの11月8日版で当日1位になったVercel Labsのプロジェクトです。\n\nAIエージェントにブラウザ操作をさせるためのネイティブRust製CLIで、Chrome for Testingのバイナリを自分で管理します。npm、Homebrew、Cargoのいずれでもインストールできます。\n\n重い自動化スタックなしにエージェントへブラウザ制御を組み込みたい開発者向けで、当日+190スターを集めました。","2026-11-08","Ageshio Radar","https://ageshio.dev/"],
["milind-soni/OpenMausBot — 連絡先が全員コーディングエージェントのチャット","ローカルファーストのチャットアプリ。各連絡先が自分のPCで動くClaudeやCodexのエージェントで、友人に話すように依頼できます。","\n11月7日版で4位に初登場したオープンソースのチャットアプリです。\n\nサイドバーの連絡先がすべて実在のコーディングエージェントで、自分のマシン上でClaudeやCodexとして動作します。各エージェントには個性と接続済みアプリがあり、友人にメッセージする感覚で仕事を頼めます。重要な手順は承認してから実行されます。\n\n「エージェントをチャットの相手として常駐させる」という発想が新鮮だと評価されています。","2026-11-07","GhTrends Daily","https://www.ghtrends.dev/daily/2026-11-07/"],
["thedotmack/claude-mem — 108Kスターの永続メモリエンジン","コーディングエージェントのセッション文脈を保存・圧縮し、次のセッションに注入。Claude Code、Codexなど複数ハーネスで共通の記憶を持てます。","\nCoddyKitの分析によれば、claude-memは108,282スター（10月30日時点から2日で+2,688）に達しました。\n\n役割は、エージェントがセッションをまたぐと文脈を失う問題の解決です。セッションの文脈を捕捉し、AIで圧縮し、将来のセッションに関連する履歴を戻します。\n\nタスクごとにClaude Code、Codex、OpenCodeなどを使い分けながら、単一の記憶層を共有する使い方が2026年11月の標準になりつつある、と記事は分析しています。","2026-11-02","CoddyKit","https://www.coddykit.com/pages/blog-detail?id=5130012&slug=github-trending-november-2026-from-a-7k-star-local-first-ai-team-to-a-42k-star-m"],

["l0ng-ai/openidea — 作成18日で7.8KスターのTypeScript新星","新着ながら強い勢い。1日+171スターのペースで伸びており、READMEやライセンスなどの信頼シグナルも揃っています。","\nGitDiscoverが「最近作成（18日）・速い勢い」として挙げたTypeScriptのリポジトリです。スター数は7.8K、1日あたり約177の勢い指標を示しています。\n\n新着リポジトリの中では、README、ライセンス、コントリビューターといった基本的な信頼シグナルが揃っている点も評価されています。\n\n勢いのある新着を探す際の候補として、まず中身と更新頻度を確認したい1件です。","2026-11-08","GitDiscover Newcomers","https://gitdiscover.org/newcomers"],
["Orkas-AI/Orkas — ローカルファーストなマルチエージェント・デスクトップ","初日1,044スター、合計7,016スター。司令役が16の専門エージェントと外部エージェントを束ねるMITライセンスのデスクトップアプリです。","\nCoddyKitの11月分析で「エージェント時代が基盤からアプリへ移った」象徴として挙げられた新作です。\n\nOrkasはMITライセンス、ローカルファーストのマルチエージェント・デスクトップアプリで、Commander（司令役）が16の組み込み専門エージェントに加え、Claude Code、Codex、OpenCodeなどを束ねます。プロジェクト管理、定期自動化、ECや動画制作のワークフローも含まれます。\n\n初日に1,044スターを集め、合計7,016スター・439フォークに達しました。","2026-11-02","CoddyKit","https://www.coddykit.com/pages/blog-detail?id=5130012&slug=github-trending-november-2026-from-a-7k-star-local-first-ai-team-to-a-42k-star-m"],
["THU-MAIC/OpenMAIC — 資料を対話型クラスルームに変える42Kスター","清華大学MAICラボ発。テーマや文書を、AI教師・AIクラスメイト・ホワイトボード・音声解説付きの授業に変換し、PPTXやHTMLへ書き出せます。","\n清華大学MAICラボのオープンソース・プラットフォームです。スター数は42,318、フォークは6,522に達しています。\n\n任意のテーマや文書を、AI教師、AIクラスメイト、ホワイトボード描画、TTSナレーションを備えた対話型の授業体験に変えます。成果物はPPTXやオフラインHTMLへワンクリックで書き出せます。\n\n技術構成はNext.js 16、React 19、PostgreSQL 16で、OpenClawやCodexなど20以上のメッセージアプリ向けのスキルも用意されています。","2026-11-02","CoddyKit","https://www.coddykit.com/pages/blog-detail?id=5130012&slug=github-trending-november-2026-from-a-7k-star-local-first-ai-team-to-a-42k-star-m"],
["stablyai/orca — 複数のコーディングエージェントを艦隊のように運用","11月9日にOPC Radarの最新一覧へ。自分のサブスクリプションでClaude CodeやCodexなどのエージェント群を、デスクトップ／モバイル／リモートで動かせます。","\nOPC RadarのGitHub最新一覧（2026年11月9日更新）に載ったリポジトリです。\n\nOrcaは、Claude CodeやCodexといったコーディングエージェントの「艦隊」を、自分のサブスクリプションを使って運用するためのツールです。デスクトップ、モバイル、リモートランタイムで利用できます。\n\n複数のエージェントを並行して走らせる運用が一般化する中で、その管理面を担う新顔として注目されています。","2026-11-09","OPC Radar","https://radar.incidental.site/channel/repos/"],

["$10のOpenStickホームラボ — Hacker Newsで748ポイント","4Gモデムスティックが実はコンピュータ。512MB RAMで動かすホームラボの実践記がHNトップ級の話題になりました。","\n11月8日のHacker Newsまとめで748ポイントを集めた記事です。\n\nOpenStickは4G LTEモデムの形をしたコンピュータで、512MB RAM（実質約450MB）、1GHzのCortex-A53×4コア、4GB eMMC、150Mbit Wi-Fi、GPS付き4Gモデム、パッシブ冷却を備えます。価格は約10ドルです。\n\n「一番下の計算資源の価格が崩壊している」象徴として、安価なハードでどこまで自宅サーバーが成立するかが議論になりました。連続稼働の実験台としても面白い題材です。","2026-11-08","Duk Lee HN Roundup","https://duklee.net/blog/2026-11-08-hn-frontpage-roundup/"],
["Claude Codeの「今後聞かない」が秘密情報を1,122ファイルに残していた","Apiiroの調査。公開された.claude/settings.local.jsonのうち1,122件に実在の秘密情報が含まれていたとHNで543ポイントの話題に。","\nセキュリティ企業Apiiroが公開リポジトリを調査した結果が、Hacker Newsで543ポイントを集めました。\n\n対象は104,185件の.claude/settings.local.jsonで、そのうち1,122件に実在らしい秘密情報が含まれ、総計2,539件の秘密、1,994リポジトリに及んだとされます。データベース業者の管理用クラウドキーや本番データベースのパスワードなども含まれていたとのことです。\n\nエージェントの承認ファイルが平文で秘密を残しうるという、使い方に直結する注意喚起です。設定ファイルは公開前に必ず中身を確認してください。","2026-11-08","Duk Lee HN Roundup","https://duklee.net/blog/2026-11-08-hn-frontpage-roundup/"],
["Goodbye Claude, hello Pi — Claude Codeを離れた開発者の詳細な記録","オープンソースのハーネス「Pi」へ移った開発者のブログが628ポイント。エージェントの乗り換えが現実の選択肢になっています。","\nHacker Newsで628ポイントを集めたブログ記事です。ある開発者がClaude Codeの利用をやめ、オープンソースのハーネスであるPiへ移行した経緯を詳しく書いています（記事の日付は9月21日）。\n\n背景として、claude-memのような永続メモリや、t3codeのような複数エージェントの操作面が育ち、特定の製品に縛られずに作業環境を組み立てる動きが強まっています。\n\n道具の乗り換えコストが下がっている今、自分の作業に合うハーネスを選ぶ視点が参考になります。","2026-11-08","Duk Lee HN Roundup","https://duklee.net/blog/2026-11-08-hn-frontpage-roundup/"],
["llama-modchip — GPUなし、64GB RAMで284Bモデルを動かす","DeepSeek-V4-Flash（284B）を56.56GiBに収めるパッチ集が299ポイント。個人機での巨大モデル実行の限界を押し広げています。","\nGitHubリポジトリを題材に、Hacker Newsで299ポイント・113コメントを集めた話題です。\n\nllama.cppとggmlへのパッチ集で、総パラメータ284.33BのDeepSeek-V4-Flashを、1.71ビット／重みで56.56GiBに収め、256Kコンテキストでもピーク57.61GiB、NVMeスワップなしで動作させたと報告されています。GPUは使っていません。\n\n「16GBや64GBといった身近なメモリでどこまで動くか」という関心に直結する実験です。","2026-11-08","Duk Lee HN Roundup","https://duklee.net/blog/2026-11-08-hn-frontpage-roundup/"],
["Goldman Sachs、銀行員・トレーダーのClaude Code利用を制限","HNで354ポイント。約12,000人のエンジニアに限定し、顧客フロー分析などに使っていた非エンジニアの利用を止めたと報じられています。","\nHacker Newsで354ポイントを集めた報道です。\n\nGoldman Sachsは10月に社内ガイダンスを更新し、Claude CodeとGitHubの利用を約12,000人のエンジニアに限定しました。これにより、顧客フローの観察やポジションのモデル化、資料作成に使っていたトレーダーや銀行員は使えなくなったと伝えられています。\n\n生成AIツールの社内展開が「全員開放」から「権限と監査を伴う限定展開」へ移る流れを示す事例として議論されています。","2026-11-08","Duk Lee HN Roundup","https://duklee.net/blog/2026-11-08-hn-frontpage-roundup/"],
["18年分のHNリンクが示すGitHubの主役交代 — 2026年最多はclaude-code","HNのGitHubリンク384,444件を集計したブログ。2026年の最多リンクはanthropics/claude-codeで、上位10件中7件がコーディングエージェント／LLMツールでした。","\nNovian Worksのブログ（11月2日）は、2008年以降のHacker Newsの投稿とコメントに含まれるGitHubリンクをすべて数えた分析です。\n\n対象は384,444件のリンク、44,192リポジトリで、リンクの77%は投稿ではなくコメントの中にありました。年別最多リンクでは、2026年はanthropics/claude-codeが429件で首位です。\n\n2026年の上位10件のうち7件がコーディングエージェントやLLMツール（claude-code、Codex、llama.cpp、opencode、pi、OpenClawなど）で、開発者の関心の中心が明確に移ったことが数字で示されています。","2026-11-02","Novian Works","https://novian.works/github-links-on-hn.html"],
],
elec:[
["M5Stack Chan × Raspberry Pi 5 — 動き回るホームコンパニオン計画","スタックちゃんを表情・声の顔役に、Raspberry Pi 5とESP32タンク台車で移動も担う構成。LLM連携の全体設計がGitHubで公開されています。","\nGitHubで公開されているプロジェクト文書です。AIアシスタントをチャット画面の中だけに置くのではなく、小さな物理的なキャラクターとして家庭に置く、という発想から始まっています。\n\n顔役はM5Stack Chan／STACK-CHANで、表情、声、LLMによる会話応答を担当します。その下にRaspberry Pi 5とESP32-C3 Mini制御のタンク台車を組み合わせ、自律移動できる小さな移動コンパニオンを目指します。\n\nRaspberry Pi 5は記憶、センサー、視覚、自動化、ローカルモデルの実験を担う中核です。現状は文書とハードウェア設計の段階で、次は移動層、対話層、LLM会話層をつないだ試作が目標とされています。あなたが注文したM5StackChanの活用先として、まさに重なる構成です。","2026-11-01","GitHub AIplay","https://github.com/miaoreynolds/aiplay/blob/HEAD/docs/projects/raspberry-pi-5-tank-stack-chan.md"],
["LilL3x — Raspberry Pi 4で作る卓上音声ロボット","ReSpeaker 2-Mics HAT、カメラ、OLEDの顔を持つ3Dプリント製の相棒。ウェイクワードから会話までの流れと、ローカルLLM対応が参考になります。","\nRaspberry Pi 4 Model Bを中心に作られたDIY卓上音声アシスタントです。\n\n構成は、Seeed StudioのReSpeaker 2-Mics Pi HATによる遠距離集音、Pi Camera Moduleによる存在検知、小型スピーカー、アニメーションするOLEDの顔、そして3Dプリントの筐体です。\n\n処理の流れは「ウェイクワード検出 → 録音 → 音声認識 → LLM推論 → 音声合成」で、ウェイクワードにはPicoVoice PorcupineやVosk、LLMはChatGPT、Claude、GeminiのほかローカルのOllamaも選べます。プライバシーに配慮したエッジ型音声助手の再現可能な型として紹介されています。","2026-04-21","Let's Data Science / Hackster.io","https://letsdatascience.com/news/lill3x-turns-raspberry-pi-into-voice-robot-95898a57"],
["Yahboom Raspbot V2 — Pi 5搭載のAIビジョンロボットカー","OpenCVとMediaPipeで姿勢推定・顔検出・追従が可能。メカナムホイールで全方向移動、ROS2 Humble対応の学習キットです。","\nRaspberry Pi 5を主制御とするオープンソースのDIYロボットカーキットです。16歳以上を対象とし、AI性能とカメラの滑らかさがPi 5で大きく向上しています。\n\nAIビジョンはOpenCVが中心で、人の姿勢推定、3次元物体認識、顔検出、タグの認識・追従、顔追従、ごみ認識、自律走行などが用意されています。制御はスマホアプリ（Android／iOS）、PC、リモコン、ハンドルに対応し、FPV映像伝送も可能です。\n\n足回りはメカナムホイール×4で前後・左右・斜め・回転ができ、4方向巡回モジュール、赤外線巡回センサー、超音波センサーを備えます。PythonとROS2の学習素材も豊富です。","2026-03-01","Manuals.plus / Yahboom","https://manuals.plus/asin/B0DT4JNNK3"],
["スタックちゃんを「家の顔」にする設計思想 — クラウドLLMからローカルAIへ","AIplayの設計では、試作はクラウドAPIで速く、長期的には家庭内のローカルAIへ。記憶やセンサーをPi側に置く理由が整理されています。","\n同じAIplayプロジェクトの設計方針の部分です。\n\n初期版はクラウドAPIのLLMを使って素早く試作しますが、より面白い長期的な方向は、家庭や会社の中に置かれたローカルAIシステムだと位置づけられています。\n\nそのためにRaspberry Pi 5を、記憶、センサー、視覚、自動化、ローカルモデル実験のローカルな統括層として使います。会話の賢さはクラウドに頼っても、生活に触れる部分は手元に置く、という分担です。プライバシーに配慮した拡張が前提に設計されています。","2026-11-01","GitHub AIplay","https://github.com/miaoreynolds/aiplay/blob/HEAD/docs/projects/raspberry-pi-5-tank-stack-chan.md"],
["音声ロボットの定番パイプライン — ウェイクワードからTTSまでを部品で組む","LilL3xの構成はそのまま応用可能。Porcupine／Vosk、STT、LLM、ElevenLabs／PollyのTTSという組み合わせの勘所をまとめます。","\nLilL3xの技術詳細は、音声ロボットを作る際の部品表としてそのまま使えます。\n\n対話のパイプラインは「ウェイクワード → 収音 → 音声認識（STT） → LLM推論 → 音声合成（TTS）」で、会話らしく即時に感じられることを狙っています。ウェイクワードはPicoVoice PorcupineかVoskで設定可能、TTSはElevenLabsやAmazon Pollyが選択肢です。\n\nLLMの接続先が差し替え可能（クラウド3種＋ローカルOllama）なため、まずクラウドで動かし、後からローカル化する段階的な作り方ができます。スタックちゃんに音声対話を足す場合の設計の土台になります。","2026-04-21","Let's Data Science","https://letsdatascience.com/news/lill3x-turns-raspberry-pi-into-voice-robot-95898a57"],
["Pi 5ロボットの電源とドライバ — 5V/5A PD対応ボードの要点","Raspbot V2のPi5ロボットドライバボードはI2C接続で、Pi 5向け5V/5A PD給電に対応。移動ロボット化で最初に詰まる電源周りの実例です。","\nRaspbot V2のハードウェア構成から、移動ロボット化の実務ポイントを抜き出した記事です。\n\nPi5ロボットドライバボードはI2C経由でRaspberry Pi 5と通信し、Pi 5のPD給電（5V/5A）に対応します。モーターを回しながらPi 5を安定動作させるには、給電能力が最初の関門になるため、この一体設計は参考になります。\n\nそのほか、金属シャーシ＋TTモーター、2自由度のHDカメラ、OLEDのリアルタイム表示が標準構成です。システムはRaspberry Pi OS、ROSはROS2 Humbleです。","2026-03-01","Manuals.plus / Yahboom","https://gd.manuals.plus/asin/B0DG2PJHDN"],
],
muse:[
["Muse × Tailscale — 外出先から自宅PCへ仕事を渡す道筋","MuseがTailscaleの独立ノードとして参加し、許可されたPCへ届く仕組み。ただし「届く」と「地元エージェントが受けて実行する」は別物、という整理が秀逸です。","\nMuseとTailscaleの連携を解説した記事です。外出先でAIアシスタントに頼んだ仕事が、普段使っている自分のコンピュータの上で起きる、という可能性を扱っています。\n\nTailscaleによれば、Museはテイルネットに独立したノードとして参加し、スマートフォンが既にTailscaleを使っていても別個の接続を持ちます。許可されたマシンへのアクセスやSSHの利用が含まれます。\n\n一方で記事は、PCに「届く」ことと、Codexなどの地元エージェントに依頼が「渡る」ことは別だと注意します。必要なのは、ネットワーク到達性、依頼を受け付ける仕組み、実行する権限の3つです。Muse自体は専用のクラウドコンピュータ上で動き、PC接続によってPC上へ移るわけではありません。","2026-10-24","attrip.jp","https://attrip.jp/?p=227648"],
["Muse for MacのComputer Use — 離席中もキューを進める使い方","許可したアプリだけを操作し、タスクを並べて離席しても順に処理。機微な操作は承認で止まる、という運用の基本形です。","\nMuse for Macの「Computer Use（コンピュータ操作）」の解説です。許可すると、Museはチャット画面を離れ、利用者と同じようにMacのアプリを開き、クリックし、入力し、アプリ間を移動してタスクを完了します。\n\n特徴は、Muse自身のクラウドコンピュータ、ブラウザ、コネクタ、目標の記憶と、デスクトップ操作が組み合わさる点です。ネイティブアプリ内のファイル、メッセージ、カレンダー、メモ、メールを横断して扱えます。\n\n使い方の要点は、アプリごとに許可すること、タスクは列に並べて離席中も順に進められること、そして機微な操作では承認のために止まることです。戻ったら要約だけでなく、アプリ側の実結果を確認することが勧められています。","2026-10-13","museaicodes.com","https://www.museaicodes.com/guides/muse-ai-mac-computer-use"],
["Muse for Macを安全に始める8ステップ — 最小権限から広げる","公式からの入手、アプリ単位の許可、専用アカウントやバックアップまで。広い権限を持つエージェントだからこそ最初が大事、という実践ガイドです。","\nMuse for Macを、最初は最小限のアクセスで始め、後から広げる手順をまとめたガイドです。その順序こそがどの設定項目よりも大事だと述べています。\n\n前提として、Museは2026年9月8日にiOS、Android、Webで、Macアプリは9月18日に公開されたとMetaの発表に基づき整理されています。Mac版はファイル、メール、メッセージ、カレンダー、メモを許可範囲で扱え、ウィンドウを閉じてもタスクは続き、変化や承認が必要なときに知らせます。\n\n安全策としては、公式ページからのみ入手すること、Time Machineでバックアップを取ること、専用のmacOSユーザーアカウントで試すこと、接続アプリと権限を定期的に見直すことが挙げられています。","2026-10-13","hamirev.com","https://hamirev.com/meta-muse-for-mac-setup/"],
["WindowsでMuseを使う現実解 — ネイティブ版を待たずブラウザで","Windows向けネイティブ版は発表済みだが日付未定。今はmuse.aiをEdge／Chromeで開くのが公式の道で、第三者の偽インストーラへの警告も。","\nMicrosoftは2026年10月7日、MetaのMuseがWindows PC向けネイティブアプリとして登場すると発表しましたが、発売日は示されていません。\n\n今すぐ使う方法は、EdgeかChromeでmuse.aiを開き、Metaアカウントでサインインすることです。Web版のエージェントはMetaのクラウド上で動き、同じタスクを扱えますが、PC上のローカルファイルには触れられません。その差を埋めるのが、Mac版が既に実現しているネイティブアプリだという位置づけです。\n\n注意点として、「Muse for Windows」を名乗る第三者サイトのインストーラは公式には存在せず、偽物の詐欺が最も起こりやすい局面だと記事は警告しています。Edgeの「このサイトをアプリとしてインストール」でピン留めすれば、ネイティブ風に使えます。","2026-10-11","openaimaster.com","https://openaimaster.com/how-to-use-muse-ai-on-windows/"],
["連続稼働の考え方 — タスクをキューに積み、承認ポイントで止める","Mac版の実例から。タスクを順番に並べ、席を離れても処理が続き、機微な操作だけ人の承認に戻す。これがAIを長く働かせる基本設計です。","\nMuseのMac版解説から、連続稼働の設計を抜き出した記事です。\n\nMetaの説明によれば、利用者がタスクをキューに積むと、机を離れてもMuseはリストを順に処理し続けます。タスクはスマートフォンで開始し、ノートPCで確認し、WhatsAppで催促する、というように機器をまたいで継続できます。\n\n一方で、機微な操作は必ず承認で止まるべきだとガイドは強調します。もし重要なことを聞かずに実行していたら、それは便利さではなく報告すべき不具合として扱う、という姿勢です。長く働かせるほど、権限は「タスクに必要なアプリだけ」という最小権限が原則になります。","2026-10-13","museaicodes.com","https://www.museaicodes.com/guides/muse-ai-mac-computer-use"],
["PC接続の3要件 — 到達性・受付・権限を分けて考える","Tailscale解説の核心。ネットワークで届くこと、依頼を受ける地元の仕組みがあること、実行権限があること。この3つを分ければ詰まりどころが見えます。","\nMuseとTailscaleの解説記事が提示した、PC接続を考える枠組みです。\n\n要件は3つに分かれます。第1にネットワーク到達性（Museから許可されたPC上のサービスへ届くこと）。第2に依頼の受付（届いた依頼を、地元のワークフローが受け取る仕組みがあること）。第3に実行権限（その仕事を行う許可があること）です。\n\n実装は環境によって異なり、SSH経由で定義済みプロセスを呼ぶ方法や、地元サービスを使う方法が考えられます。記事は実際の接続や地元エージェントへの引き渡しを検証したものではないと断ったうえで、この3分法が切り分けに有効だとしています。","2026-10-24","attrip.jp","https://attrip.jp/?p=227648"],
],
cnc:[
["Carveco V1.70公開 — AI生成レリーフがさらに進化（10月27日）","テキストや画像から加工可能な3Dレリーフを数秒で生成。300種以上のCNC機・コントローラに対応する設計／ツールパス統合ソフトです。","\nCarvecoはCNC向けの設計と彫刻の統合ソフトウェアで、2026年11月5日時点の公式情報と、10月27日のV1.70リリースノートが公開されています。\n\n目玉はAIデザインツールで、デザイン、写真、スケッチ、あるいは文章の説明から、加工可能な3Dレリーフモデルを数秒で生成し、そのままCNCへ送ったり、既存プロジェクトに組み込んだりできます。AIツールはすべてのCarvecoサブスクリプションで利用できます。\n\n前版V1.68（9月16日）では「Generate with AI」ウィザードが大きく更新され、新しいAIモデルと刷新された画面が入りました。300種以上のCNCマシンとコントローラに直接対応します。","2026-11-05","Carveco公式","https://carveco.com/"],
["Makera — AIデザインから卓上CNCまでを1つの流れに","Makerables AI Craftで画像・文章からデザインを作り、Makera Studioで加工指示に変換、Z1などの卓上CNCで削る。AIと実加工の接続例です。","\nMakeraが打ち出した、AI支援デザイン、CAM、卓上CNC加工をつなぐ統合ワークフローの紹介です（2026年10月21日）。\n\n入口のMakerables AI Craftは、画像とテキストプロンプトからデザインを育てるツールで、写真ベースのプロジェクトではレリーフ風の3Dモデルを生成し、確認して書き出せます。Makera Studioがデジタル形状から加工指示への変換を担い、卓上CNCがそれを素材に削り出します。合成石に写真レリーフをZ1で削った作例が示されています。\n\n注意点として、AI生成の形状は必ず人の確認が必要で、工具や加工条件の選択責任は利用者に残ると明記されています。","2026-10-21","Cybernews / Makera","https://cybernews.com/press-releases/makera-connects-ai-design-with-desktop-cnc-making/"],
["CarveWright Designer 6 — プロンプトから3Dカービングまで一気通貫","AI画像生成と3D変換を設計ソフト内に内蔵。文章→画像→レリーフ→加工準備をアプリ間で往復せずに完結させます。","\nCarveWright Designer 6に内蔵されたAIツールの使い方ガイドです。\n\n手順は、まず内蔵のAI画像生成で文章から原画を作り、次にその画像を3Dレリーフパターンへ変換し、文字や要素を加えて整え、最後にCNC向けに加工準備をします。自分の写真や既存の絵を出発点にすることもできます。\n\n利点は、AIプラットフォームと設計ソフトの間で書き出しと取り込みを繰り返さなくてよい点です。対応機はCarveWrightのRAVENなどですが、Gコード出力により他社CNCでもAI支援の制作フローを使えます。","2026-10-12","CarveWright","https://carvewright.com/how-to-use-ai-for-cnc-projects-from-image-to-3d-relief/"],
["CubiFab C1 — 「説明するとAIがツールパスを作る」AIネイティブ卓上CNC","Maker Faire Bay Area 2026で初公開。CAMやGコードを学ぶ前に、言葉で伝えるとAIが最適化されたツールパスを数秒で生成します。","\nMaker Faire Bay Area 2026（9月25〜27日）の出展紹介です。CubiFab C1は「世界初のAIネイティブ卓上CNC」を掲げています。\n\n従来の入門機と違い、最初の切削の前にCAMソフトやGコードを学ぶ必要がありません。作りたいものを言葉で説明すると、AIが最適化されたツールパスを数秒で生成し、あとはスタートを押すだけです。初日から本物の部品が作れることを狙っています。\n\n素材はアルミニウム、木材、アクリルなどに対応し、クーラントは不要です。x86アーキテクチャにより衝突検知、非常停止、工具監視、予知保全的な安全機能を全切削に備えるとしています。Kickstarterでの開始が予定されています。","2026-11-08","Maker Faire","https://makerfaire.com/maker/entry/cubifab-c1-redefine-entry-level-cnc-upgrade-your-personal-cr-78941/"],
["Makera Z1とMakerables — Open Sauce 2026で見せたAI制作の実演","来場者がAIでデザインを生成し、自動でツールパスが作られ、その場でCNCが削るまでを実演。コミュニティ型の制作プラットフォームも発表。","\nMakeraがOpen Sauce 2026（7月17〜19日、サンフランシスコ・ベイエリア）で披露した内容の報告です。\n\n主役のMakera Z1は入門向け卓上CNCで、高速な工具交換、自動工具測定、自動レベリング、AI支援ワークフローを備え、段取りの手作業を減らします。Makera Studioはツールパス生成、加工シミュレーション、機械制御を1つの画面に統合したCAM兼コントローラです。\n\n新しいMakerablesは、ひらめき、制作、共有を1つにまとめたCNCクリエイター・コミュニティで、AIツールがモデル生成を助けます。会場では、来場者のデザイン生成からツールパス作成、実機での切削までを通しで実演しました。","2026-07-19","PR Newswire / Makera","https://en.prnasia.com/releases/global/makera-to-showcase-z1-and-its-ai-powered-desktop-cnc-ecosystem-at-open-sauce-2026-540992.shtml"],
["AIレリーフで作る木製スイッチカバー — 生成から販売品レベルの仕上げへ","CarveWrightの実演動画。アライグマ模様の装飾スイッチカバーをAIプロンプト→3D化→RAVENで彫刻→染色→設置まで見せています。","\nCarveWrightのInstagramリールで紹介された制作実演です。生成AIのプロンプトと高精度CNC加工の連携を、RAVENルーターの販促も兼ねて見せています。\n\n題材は、遊び心のあるアライグマと装飾的な渦巻き模様をあしらった照明スイッチカバーです。AIプロンプトから3Dレンダリングを作り、作業場でRAVENが明るい木材に模様を彫り、切り屑とともにレリーフが現れます。彫り上がりは深い茶色に染色され、古びた風合いに仕上げられ、最後に壁へ取り付けて実用例を示します。\n\nかつて数日かかった手作業のモデリングが、AI生成デザインで大幅に短縮される点が強調されています。制作販売の題材としても分かりやすい1件です。","2026-06-25","Instagram / CarveWright","https://www.instagram.com/reel/DaBiJTJkxSK/"],
],
cricut:[
["無料SVGが集まる場所35選 — 2026年10月更新・商用ライセンスの見分け方つき","Craft Bundles（1,100点超・商用可）、LoveSVG（12,000点超）、Creative Fabrica無料枠（1,550点超）など、販売制作に使える入手先を整理。","\n2026年10月28日に更新された、無料SVGファイルの入手先まとめです。Cricut、Silhouette、Brotherなど各社のカッティングマシン向けに、リンク切れを点検し、用途別に整理されています。\n\n筆頭のCraft Bundlesは1,100点以上の無料SVGを持ち、毎月新作が追加され、無料ファイルにも商用ライセンスが付くため「売る物を作るときの最初の寄り道」とされています。LoveSVGは12,000点以上、Creative Fabricaの無料枠は1,550点以上のSVG・フォント・グラフィック、Free SVG Designsは2,440点以上をカテゴリ別に探せます。\n\n使い方として、Cricut Design SpaceはSVGを直接開けます。Silhouette StudioはDesigner Edition以上が必要ですが、多くの配布元がDXFやPNGも用意しています。ZIPは解凍してからアップロードしてください。","2026-10-28","Wildflowers and Wanderlust","https://wildflowersandwanderlust.com/free-svg-files/"],
["2026年ニューイヤー・フラワーポット — 無料レイヤードSVGと作り方","Craft with Sarahの無料SVG。花火と「2026」の数字が飛び出す植木鉢のペーパークラフトで、層の重ね方まで手順付きです。","\nCraft with Sarahが配布する無料SVGを使った、ニューイヤー向けペーパークラフトのチュートリアルです。\n\nデザインは植木鉢からカラフルな花が飛び出し、中央に太い「2026」の数字、背景と前景に層になった花火を配置したものです。同サイトの1年がかりのフラワーポット・シリーズの最終作とされています。\n\nダウンロードにはアカウントへのログインが必要です。Design Spaceでは「01 Cricut Version」フォルダ内のsvgファイルをアップロードします。層の切り分けが分かりやすく、経験者にも初心者にも向くと説明されています。","2026-01-01","Craft with Sarah","https://www.craftwithsarah.com/cricut-crafts/new-year-flowers/"],
["ステンシル向け最良機はMaker 4？ Maker 5との比較と刃の話（2026年）","Free Stencil Makerの検証記事。マイラーをきれいに切るには機種より刃（Deep-Point Blade）が決め手、という実務的な結論です。","\n2026年11月時点の情報をもとにした、ステンシル用途のカッティングマシン比較です。\n\n結論として、多くの人にはCricut Maker 4が最適だとしています。マイラーをきれいに切る力と刃の選択肢があり、12インチ幅のマットが使え、Design SpaceのSVG取り込みも素直だからです。最新機のMaker 5は厚さ3mmまで・13種のツール対応のバンドルで販売されています。\n\n一方で、既にMakerやExploreを持っている場合の最良の節約策は新機種ではなく、約19ポンドのDeep-Point Bladeであり、これで7〜10milのマイラーが現実的になると指摘します。記事内の価格は2026年11月3日時点のAmazon UKのものです。","2026-11-03","Free Stencil Maker","https://freestencilmaker.com/blog/best-cutting-machine-for-stencils"],
["CricutCraft — ブラウザでSVGを作る新興スタジオ、デザイン7,870点","ブラウザ完結の制作プラットフォーム紹介。無料枠でもSVG／PNG書き出しが可能で、Design Spaceへ渡す前段として使えます。","\n2026年10月16日にMediumへ掲載された、CricutCraftというブラウザベース制作プラットフォームの初心者向けガイドです。\n\nライブラリには197のテーマコレクションに7,870点のデザインがあり、うち591点が無料枠で使えます。ブラウザ内のスタジオでライブラリのデザインを直接開いて編集でき、無料のStarterプランでもSVGとPNGの書き出しが可能です。PDF、DXF、EPSや商用ライセンス、全ライブラリは有料プランです。\n\n注意として、CricutCraftはデザインとファイル準備の道具であり、カッティングマシンへ指示を送るには結局Cricut Design Spaceが必要です。SilhouetteやBrother ScanNCut、レーザーカッターの形式にも対応するとされています。なお同サービスはCricut社と提携関係にはありません。","2026-10-16","Medium / CricutCraft紹介","https://muhammadbahawal.medium.com/how-to-create-svg-files-and-custom-cricut-designs-online-a-beginners-guide-to-cricutcraft-a82bcbe7e3b5"],
["無料SVGの探し方総まとめ — 商用利用の線引きを必ず確認","Leap of Faith Craftingの大型まとめ。多くは個人利用のみで、販売には商用ライセンスが必要という基本を、入手先一覧とともに再確認できます。","\nCricutとSilhouette利用者向けに、無料SVGの入手先をまとめた大型記事です。数日前に更新されています。\n\n著者は、Cricut Accessにも大量のカットファイルがあるものの有料であり、機械を買った直後は追加出費を避けたいという出発点から、ブログ仲間が配布する無料デザインの入手先を集めたと説明します。\n\n重要な注意が商用利用の線引きです。無料SVGの大半は個人利用のみで、そのファイルで作った物を売ることはできません。販売するには商用ライセンスが必要です。FontBundles.netやCreative Fabricaなど、デザイン素材サイトの無料枠が実務的な入手先として挙げられています。","2026-11-06","Leap of Faith Crafting","https://leapoffaithcrafting.com/free-svg-files-for-cricut/"],
["ハッピーニューイヤーSVG — 2022〜2026年版を同梱するレイヤード定番","花火・ロケット・風船の層デザイン。年度ごとにフォルダが分かれ、来年以降の使い回し方まで分かる配布形式です。","\nCraft with Sarahの無料「Happy New Year」SVGの紹介ページです。\n\n色鮮やかな層デザインで、お祝いの花火、ロケット、風船があしらわれています。ダウンロードフォルダには2022年から2026年までの各年度版が含まれ、チュートリアル本文は2022年版の画面で説明されています。\n\n作り方は、Design Spaceへ該当年度のフォルダのファイルを取り込み、層ごとに切って重ねるという定番の流れです。季節物のSVGは、年度フォルダで整理して配布される形式が使い回しやすく、自分の制作データ管理の参考にもなります。","2026-01-01","Craft with Sarah","https://www.craftwithsarah.com/cricut-crafts/happy-new-year-svg/"],
],
uv:[
["ミマキ新UVフラットベッド JFX220-2515／UJF200シリーズ発表","大型JFX220-2515と小型UJF200（3042／6042）が登場。RasterLinkの新ワークフローと自動化・生産性の向上が柱です。","\nHybrid ServicesがThe Print Show（バーミンガムNEC）で披露した、ミマキの新世代UVプリンターの発表です。\n\n新機種は、大型フラットベッドのJFX220-2515と、小型のUJF200シリーズ（UJF200-3042、UJF200-6042）の3機種です。いずれも新世代のRasterLinkワークフロー／RIPソフトを備え、自動化と生産性の向上が図られています。\n\nこれらはまずSign Istanbul（9月23〜26日）とThe Print Show UK（9月29日〜10月1日）でEMEA初公開され、その後EMEA全域で75を超えるローンチイベントが予定されています。","2026-09-26","TEXINTEL / Hybrid Services","https://www.texintel.com/press-room/hybdridservices-09-26-cmp-hybrid-services-to-unveil-next-generation-mimaki-jfx-and-ujf-uv-printers-at-the-print-show"],
["ミマキ TxF330-800 — DTFの連続印刷を安定させる旗艦機","16カートリッジ構成、白インク容量の拡大、自動メンテナンス。100mロール対応でTシャツ量産の連続出力を狙います。","\n同じ発表に含まれる、ミマキのDTF（ダイレクト・トゥ・フィルム）旗艦機TxF330-800の詳細です。\n\n330プリントエンジンにより従来機より約50%高速でありながら画質を保ち、100mロールのDTFフィルムで連続した一貫出力ができるため、カスタムTシャツ受注の量産に向きます。インクは16カートリッジ構成で白インクの容量が拡大され、自動メンテナンスも備えます。\n\n併せて、TxF330-800向けにペールピンクとスカイブルーのDTF新色インクも発表されました。UV蛍光インクにはピンクとイエローが追加され、JFX220-2515とUJF200シリーズで使えます。","2026-09-26","Precedence Research / TEXINTEL","https://www.precedenceresearch.com/news/mimaki-expands-industrial-printing-portfolio-with-new-printers-inks-and-software"],
["The Print Show 2026報告 — UV DTFの立体表現と9色DTFが主役に","Resoluteの出展報告。クリスタルパッチ、3D TPU、フェイク刺繍など特殊効果での差別化と、靴下専用機SockPodの初公開が話題です。","\nThe Print Show 2026（9月29日〜10月1日、NECバーミンガム）のResolute出展報告です（10月20日公開）。\n\nUV分野では専用スタンドを設け、R-Jet PRO DTF UV61-3D（広幅向け）とUVi-3D（小型で立体表現）などのUV DTFソリューションと、Premium 3D Clear TPUフィルムを実演しました。見どころはクリスタルパッチ、3D TPU、フェイク刺繍といった特殊効果です。\n\n衣類向けでは9色ハイガマットのDTF機（V4HG、毎時50m級のV9HG）が中心でした。新発表のCraftyJet SockPodは靴下専用のダイレクト・トゥ・ファブリック機です。同社は、差別化は特殊効果、ニッチ製品、短納期にまだ十分あると総括しています。制作販売の方向性を考える材料になります。","2026-10-20","Resolute Ink","https://www.resolute.ink/dtf-printing/the-print-show-2026-resolute-dtf-uv-dtf-highlights"],
["Haolic XP-2 — 卓上DTF第3世代、タッチ操作と自動カット搭載（10月14日）","13インチ幅・XP600ヘッドの卓上機。ピンチローラーの電動リフト、フィルム自動カット、インク管理の改善で日常作業を簡素化。","\nDTFおよびUV DTF機器のブランドHaolicが2026年10月14日に発表した、卓上DTFプリンターの第3世代「XP-2」のニュースです。\n\nタッチスクリーンで制御するピンチローラーのリフト、フィルムの自動カット、改善されたインク管理、強化された機械部品を備え、日常の印刷とメンテナンスの簡素化に焦点を当てています。\n\n仕様はXP600プリントヘッド、13インチの印刷フォーマット、57系ステッピングモーターと10mmタイミングベルトによる駆動系です。10月15日から公式サイトで販売開始とされ、対象は独立クリエイター、自宅ビジネス、小規模スタジオです。","2026-10-14","Krastin Times / Haolic","https://www.krastintimes.com/2026/10/14/haolic-launches-third-gen-xp-2-desktop-dtf-printer-with-smarter-controls-and-simplified-maintenance/"],
["EraSmart A1／A2蛍光DTF — ブラックライトで光るアパレル表現","CMYK＋蛍光色＋白の構成でUVに反応するグラフィックを熱転写。イベント物販やカスタムアパレルの特殊表現として提案されています。","\n深センのEraSmartが発表した、蛍光DTFプリンターA1とA2の紹介です（10月16日掲載）。\n\n通常のCMYKに蛍光インクと白インクを組み合わせ、紫外線（ブラックライト）に反応するグラフィックを熱転写で付けられます。文字、ロゴ、図柄の一部にだけ蛍光色を使うといった使い方が想定されています。対象はアパレルのカスタムスタジオ、印刷サービス、イベント物販の制作者です。\n\n両機ともデュアルヘッド（I3200HDとI1600）構成です。A1は最大幅620mmで8パス時1.5〜2㎡／時、A2は450mmで1〜1.5㎡／時とされます。蛍光印刷専用のソフト設定が必要で、結果はインク、白の下地、生地、転写条件、照明で変わると注意されています。","2026-10-16","Impressions Magazine","https://impressionsmagazine.com/news/erasmart-a1-a2-fluorescent-dtf-printers/170810/"],
["FESPA 2026のミマキ — ハイブリッドUV UJ330H-160と次世代DTFコンセプト","1台でロールも板物もこなすハイブリッドUVと、330基盤の次世代DTFコンセプト機。「速さ」より「予測可能性と色の安定」がテーマに。","\nFESPA 2026におけるミマキ・ヨーロッパの出展報告です。テーマは「Print Different — Powering Possibilities」で、用途別の体験エリアで構成されました。\n\nUVでは、国際展示会初登場のUJ330H-160ハイブリッドUVプリンターが中心で、1つの技術基盤でロール・トゥ・ロールと板物の両対応を示しました。UJV200シリーズも国際デビューしています。\n\nDTFでは330プラットフォームを基にした次世代コンセプト機が参考出展されました。同社は「DTFは成熟期に入り、顧客は入口の安さではなく、予測可能性、生産性、色の一貫性を求めている」とコメントしています。規模を広げる段階の判断軸として参考になる視点です。","2026-05-20","QuickPrintPro / Mimaki Europe","https://www.quickprintpro.co.uk/Mimaki-%e2%80%98Powers-Possibilities%e2%80%99-With-A-Market-Diverse-Application-And-Printer-Line-Up-At-FESPA-2026.6068744.cms"],
],
risk:[
["子どもの傷害予防の研究地図 — 溺水・転倒・やけど等26研究の総括（Frontiers）","溺水が最重要課題。保護者の9割が「予防できる」と思う一方、水難を見たときの対応を子に教えるのは6%未満というデータが示されています。","\nFrontiers in Public Healthに掲載された26研究の特集を総括した記事です。中国CDC、中南大学、ニューサウスウェールズ大学の研究者らが編集しました。\n\n対象は溺水、交通事故、転倒、やけど、中毒、スポーツ傷害、脳震盪、情緒的ないじめまで広く、16研究が中国、残り10研究がバングラデシュ、ネパール、サウジアラビア、ポーランド、ドイツ、米国などです。\n\n最も手厚く扱われるのが溺水です。保護者の90%以上が溺水は予防可能と考える一方、溺れている人を見たときの対応を子どもに教えているのは6%未満、救助知識がない人が84%を超えるという調査が示されています。監視体制の整備がすべての基盤であり、上海の32年分の分析では、交通政策や通学路の改善、製品安全規制とともに傷害死亡が減ったことが示されました。","2026-10-27","Bioengineer.org / Frontiers","https://bioengineer.org/child-injury-prevention-research-maps-risk-equity-and-paths-to-safety/"],
["見守り＋健康教育＋環境改善で傷害発生が下がった — 石家荘の介入研究","6〜17歳対象。「見守り強化・健康教育・環境改善」の総合介入で、対照群が+2.00%増えたのに対し介入群は−0.13%に。知識スコアも向上。","\nFrontiers in Public Healthに2026年2月20日に掲載された原著研究です。中国・石家荘市の6〜17歳を対象に、小学校6校・中学校6校などを層化クラスター抽出しました。\n\n介入は、見守りの強化、健康教育、環境改善を組み合わせた総合型です。結果として、介入群の傷害発生率は0.13%低下した一方、対照群は2.00%上昇し、差は2.13%（95%信頼区間0.506〜0.809、p<0.001）でした。子どもの傷害予防に関する知識スコアも2.830点上がっています。\n\n結論として、保育・見守り、健康教育、環境改善を統合した介入が、子どもの傷害の減少と知識の向上に良い影響を持つとされています。家庭でも「環境を先に直す」視点が活きます。","2026-02-20","Frontiers in Public Health","https://www.frontiersin.org/journals/public-health/articles/10.3389/fpubh.2026.1733074/pdf"],
["子どもの不慮の傷害は転倒が約半数・家庭内が43.6% — 救急の実態研究","転倒49.8%、交通事故12.4%、発生場所は家庭（特に台所と庭）が最多。男児が62.7%という偏りも報告されています。","\nトルコの救急部門を対象にした前向き横断研究で、Turkish Journal of Trauma & Emergency Surgery 2026年（第32巻）に掲載されました。\n\n結果では、不慮の傷害の原因は転倒が49.8%で最も多く、次いで交通事故12.4%でした。発生場所は家庭が43.6%で、特に台所と庭が目立ちます。患者の62.7%は男児でした。母親の教育水準が低いことや経済状況の厳しさと、傷害重症度スコアの高さに関連が見られています。\n\n臨床面では、血清グルコース値などが死亡リスクの目安になりうることも示されています。家庭内の転倒対策が最優先であることを、数字が裏づける研究です。","2026-03-01","Turkish J. Trauma Emerg. Surg.","https://openurl.ebsco.com/contentitem/doi%3A10.14744%252Ftjtes.2026.65814?sid=ebsco:ocu:record&id=ebsco:doi:10.14744%2Ftjtes.2026.65814&bquery=DE%20%22BLOOD%20sugar%22&page=1&link_origin=&searchDescription=BLOOD%20sugar"],
["河南・0〜17歳の大規模調査 — 傷害の67.71%で「効果的な見守り」が欠如","発生率6.88%、転倒が53.9%。見守り不足の割合、男児と通学児童の高リスク、祖父母保育の注意点まで具体的に示されています。","\n中国・河南省で2022年6月〜2023年5月に実施された、0〜17歳を対象とする住民ベース横断調査です。Frontiers in Public Health 2026年（第14巻）に掲載されました。\n\n全体の傷害発生率は6.88%で、女児5.32%に対し男児8.23%と有意に高く、男児のオッズ比は1.58でした。毎日帰宅する通学児童も、未就学の子どもと比べてオッズ比1.69と高くなっています。\n\n事故の54.17%は家庭での余暇時間に起き、その67.71%で効果的な見守りが欠けていました。原因は転倒が53.90%で最多、傷害の種類は打撲・擦過傷が37.47%、部位は下肢が37.70%です。平均入院18日、平均費用2,713元で、交通事故が最も高額でした。優先策は、見守りの強化（特に家庭の余暇時間）、高リスク群への対策、転倒と交通事故への集中だと結論づけています。","2026-03-15","Frontiers in Public Health","https://public-pages-files-2025.frontiersin.org/journals/public-health/articles/10.3389/fpubh.2026.1794442/reference"],
["スマホで傷害予防 — アプリ等のmHealth活用を検証したスコーピングレビュー","JMIRのレビュー。健康教育、リマインド、行動訓練、緊急対応にアプリやVRが使われ、傷害の減少と保護者の意識向上に一定の効果。","\nJMIR mHealth and uHealth 2026年（第14巻）に掲載されたスコーピングレビューです。2025年12月31日までに5つのデータベースから集めた1,085件のうち、基準を満たした16研究を分析しました。\n\n使われた技術は、アプリ、WeChat、モバイルeラーニング、VRとウェアラブルの組み合わせなどです。機能は健康教育、双方向のやり取り、監視とリマインド、行動訓練、アンケートと記録、緊急対応に分類されました。\n\n結果として、傷害発生の減少、保護者の知識・態度・行動の改善に前向きな効果が見られました。ただし一般公開されているアプリは2つだけであり、機能設計の最適化と、長期・大規模な検証が今後の課題だとされています。","2026-04-01","JMIR mHealth uHealth","https://mhealth.jmir.org/2026/1/e94038"],
["転倒の負担は2010年以降に再上昇 — 中国0〜14歳の疾病負担分析","非致死的な後遺症（障害とともに生きる年数）の割合が増えているという指摘。転倒は「死なないから軽い」ではないことが示されています。","\nFrontiersの特集総括の中で紹介された、Global Burden of Disease Study 2021を用いた分析です。中国の0〜14歳について、約30年分の転倒による負担を推計しています。\n\n2010年以降、年齢調整した発生率が再び上昇に転じ、障害調整生命年（DALY）に占める「障害とともに生きる年数」の割合が増えていることが分かりました。つまり、亡くならずに済んでも、後遺症とともに暮らす負担が全体の中で大きくなっているということです。\n\n転倒は件数が最も多い傷害であり、家庭内の段差、滑り、落下の対策を後回しにしない理由がここにあります。","2026-10-27","Bioengineer.org / Frontiers","https://bioengineer.org/child-injury-prevention-research-maps-risk-equity-and-paths-to-safety/"],

["幼児にも運動が必要 — ParticipACTION初の0〜4歳レポートカード（11月2日）","67%の幼児は運動量を満たす一方、画面時間が懸念。2歳未満は画面なし、2〜4歳は1日1時間以内が目安と改めて示されました。","\nParticipACTIONが初めて0〜4歳だけを対象にしたレポートカードを公表しました（2026年11月2日報道）。カナダ内外の専門家チームが作り、身体活動だけでなく、睡眠、画面時間、座りがちな行動、遊び、近隣環境まで14の指標で評価しています。\n\n最も良い成績は睡眠と、粗大・微細運動の発達で、どちらも80%の子どもが推奨を満たしました。十分に体を動かしている幼児は67%です。\n\n一方で懸念は画面時間です。モントリオール大学のMarie-Eve Mathieu教授は、2歳未満では画面は推奨されず、2〜4歳でも1日1時間以内で、少ないほど良いと述べています。判断材料として、カナダの「24時間の動きガイドライン」が具体的な目安を示しています。","2026-11-02","MedicalXpress / ParticipACTION","https://medicalxpress.com/news/2026-11-toddlers.html"],
["母乳の脂肪酸と乳児の運動発達に関連 — 上海・北京コホート研究（11月6日）","特定の脂肪酸（OBCFA）が高いほど8か月時点の運動発達スコアが低い関連を観察。120組の母子を追跡した観察研究です。","\nEuropean Journal of Nutritionに10月31日に掲載された研究で、11月6日に報じられました。中国科学院・上海栄養健康研究所のGao Ying教授らのチームによるものです。\n\n北京地域の前向き母子コホートで120組を追跡し、産後42日と8か月に母乳を採取、8か月時点でベイリー発達検査（第3版）により認知と運動の発達を評価しました。\n\n結果として、母乳中の奇数鎖脂肪酸（C15:0、C17:0）とOBCFA全体の水準が高いほど、乳児の運動発達スコアが低い関連が見られ、交絡因子の調整後も有意でした。対象集団の水準は欧米の報告より低かったとも述べられています。観察研究であり、より大規模で長期の検証と仕組みの解明が必要だと著者らはしています。","2026-11-06","MedicalXpress / Eur. J. Nutrition","https://medicalxpress.com/news/2026-11-breast-fatty-acids-linked-infant.html"],
["妊娠中のコロナワクチンと子の発達 — 18〜30か月で差なし（JAMA Pediatrics）","400人超を2年半追跡。意思疎通、粗大・微細運動、問題解決、個人・社会スキルのスコアは接種群と非接種群で同等でした。","\nJAMA Pediatricsに11月2日に掲載された多施設コホート研究です。\n\n妊娠中または妊娠直前にSARS-CoV-2のmRNAワクチンを接種した母親の子どもと、接種していない母親の子ども、400人超を2年半追跡しました。発達はASQ-3という質問票で、意思疎通、粗大運動、微細運動、問題解決、個人・社会スキルの5領域を評価しています。\n\n18〜30か月の時点で、両群のスコアは同等でした。研究者らは、この結果が妊娠中の接種の推奨を支持するものだと述べています。不安の大きいテーマについて、追跡データが積み上がっている1件です。","2026-11-03","SciMex / JAMA Pediatrics","https://www.scimex.org/newsfeed/covid-19-vaccination-during-pregnancy-doesnt-appear-to-impact-childs-brain-development"],
["英・2〜2歳半の発達統計 — 「良好な発達」は83.1%に上昇（2025→2026）","5領域すべてで期待水準に達した子どもの割合が前年の81.4%から上昇。問題解決のみ横ばいという内訳も公表されています。","\n英国政府（GOV.UK）が公表した、2〜2歳半の子どもの発達成果に関する統計解説です。対象は2025〜2026年のイングランドのデータです。\n\n発達は、保健師による普遍的な健康・発達レビューで、ASQ-3を用いて意思疎通、粗大運動、微細運動、問題解決、個人・社会スキルの5領域で評価されます。\n\n5領域すべてで期待水準以上（良好な発達）に達した割合は83.1%で、前年2024〜2025年の81.4%から上昇しました。領域別では問題解決だけが横ばいで、他は上昇し、過去5年の傾向もすべて上昇です。ただし任意のデータ収集で全対象をカバーしていないため、解釈には注意が必要だと但し書きがあります。","2026-11-03","GOV.UK / OHID","https://www.gov.uk/government/statistics/child-development-outcomes-data-for-2025-to-2026/child-development-outcomes-at-2-to-2-and-a-half-years-2025-to-2026-statistical-commentary"],
["緑の多い環境は子どもの注意と学力を助ける — ABCD研究の分析（11月2日）","約12,000人の米国の子どもを追うABCD研究のデータで、緑地への近さと、注意の持続や結晶性知能の高さに関連が見られました。","\nワシントン大学セントルイス校の心理学者らがEnvironment Internationalに発表した研究で、11月2日に紹介されました。「注意回復理論」—自然や緑に触れることが集中する力を回復させるという考え—を子どもで検証したものです。\n\n使われたのは、中央値10歳の米国人児童約12,000人を追うABCD研究のデータです。緑地に近く、緑地へのアクセスが多い子どもほど、求められたときに注意を向ける課題や学力テストの成績が良い傾向が見られました。緑地の空気の良さも一因の可能性があります。\n\n学校の庭や公園、自然の中の散歩のあとに、注意の持続、抑制、ワーキングメモリの課題成績が上がることは以前から報告されており、それを裏づける大規模データです。","2026-11-02","Washington Univ. in St. Louis","https://source.washu.edu/2026/11/to-restore-attention-reach-out-to-nature/"],
["神経発達障害の子どもへ個別化治療を — UC DavisとUPennが共同研究助成を獲得","イオンチャネルの異常による障害を対象に、精密治療の開発を目指す2年・77万ドルの共同研究が始まります。","\nUC Davis Healthとペンシルベニア大学の研究者が、イオンチャネル障害による神経発達障害の子ども向けに、精密（個別化）治療の開発を目指す共同研究を始めます。Hartwell FoundationのBiomedical Research Collaboration Awardを獲得しました。助成は2年間で直接費77万ドルです。\n\n担当は、UC Davis神経学助教でMIND研究所のRoy Ben-Shalom氏と、ペンシルベニア大学生体工学・計算機科学助教のPranam Chatterjee氏です。\n\nイオンチャネル障害（チャネロパチー）は、遺伝的変化がイオンチャネルの働きに影響して起こります。Ben-Shalom研究室は、神経発達状態における脳の神経回路を研究しています。「効く治療を一人ひとりに」という方向の研究が進んでいる事例です。","2026-11-03","UC Davis Health","https://health.ucdavis.edu/healthy-aging/news/headlines/research-to-develop-personalized-treatments-for-children-with-neurodevelopmental-disabilities/2026/10"],
]

let memos=[]; // {cat,title,note,date}
const OLD_CUT="2026-11-07";
function isOld(d){return d<OLD_CUT}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
/* ===== 項目（ジャンル）はデータ駆動：CATS／DATAに足すだけで自動で増えます ===== */
const extraCats=[];
function allCats(){
  const list=CATS.slice();
  Object.keys(DATA).forEach(id=>{ if(!list.some(c=>c.id===id)) list.push({id:id,name:id,desc:"追加された項目",img:"hero"}); });
  extraCats.forEach(c=>{ if(!list.some(x=>x.id===c.id)) list.push(c); });
  return list;
}
let cats=allCats();
let catIdx=0;
const artIdxMap={};
function itemsOf(c){return (DATA[c.id]||[]).map((a,i)=>({a:a,oi:i})).sort((x,y)=>y.a[3].localeCompare(x.a[3]))}
function curCat(){return cats[catIdx]}
function curItems(){return itemsOf(curCat())}
function curArtIdx(){const n=curItems().length;if(!n)return 0;let i=artIdxMap[curCat().id]||0;if(i>=n)i=n-1;if(i<0)i=0;return i}
function renderStage(dir){
  cats=allCats(); if(catIdx>=cats.length)catIdx=cats.length-1; if(catIdx<0)catIdx=0;
  const c=curCat(), items=curItems(), ai=curArtIdx();
  const total=cats.reduce((s,x)=>s+(DATA[x.id]||[]).length,0);
  document.getElementById('heroText').innerHTML="<b>今日のまとめ — 全"+cats.length+"ジャンル・"+total+"件。</b> タイトルと概要は日本語、カードの「和訳全文を読む」で全文が開きます。新しい順に並べ、48時間より古い記事はグレー表示です。";
  document.getElementById('catName').textContent=c.name;
  document.getElementById('catDesc').textContent=c.desc||"";
  document.getElementById('catCount').textContent="ジャンル "+(catIdx+1)+" / "+cats.length;
      const slot=document.getElementById('cardSlot');
  if(!items.length){
    slot.innerHTML='<article class="card"><div class="empty"><div class="big">✦</div><p><b>'+c.name+'</b> は追加されたばかりの項目で、まだ記事がありません。</p><p>毎日の更新でこの項目の記事が集まると、ここに表示されます。<br>上スワイプで他のジャンルへ移動できます。</p></div></article>';
    document.getElementById('artDots').innerHTML=""; document.getElementById('artCount').textContent="0 / 0"; return;
  }
  const it=items[ai], a=it.a, old=isOld(a[3]);
  slot.innerHTML='<article class="card'+(old?' old':'')+(dir?' anim-'+dir:'')+'">'
    +'<img class="ph" src="'+IMGS[c.img]+'" alt="'+c.name+'のイメージイラスト">'
    +'<div class="cbody"><div class="meta"><span class="badge'+(old?' oldb':'')+'">'+(old?'少し前':'NEW')+'</span><span>'+a[3]+'</span><span>'+(ai+1)+' / '+items.length+'</span></div>'
    +'<h3>'+a[0]+'</h3><p class="sum">'+a[1]+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="openArticle(\''+c.id+'\','+it.oi+')">和訳全文を読む</button>'
    +'<button class="btn ghost" onclick="quickMemo(\''+c.id+'\','+it.oi+',this)">メモ保存</button>'
    +'<button class="btn ghost" onclick="shareArticle(\''+c.id+'\','+it.oi+')">共有</button></div>'
    +'<div class="src">出典：'+a[4]+'<br><a href="'+a[5]+'" target="_blank" rel="noopener">原文を開く</a></div></div></article>';
  document.getElementById('artDots').innerHTML=items.map((x,i)=>'<span class="dot'+(i===ai?' active':'')+'"></span>').join('');
  document.getElementById('artCount').textContent="記事 "+(ai+1)+" / "+items.length;
  requestAnimationFrame(fitCard);
}

function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;
  const sum=card.querySelector('.sum'), h3=card.querySelector('h3'), ph=card.querySelector('.ph');
  let ss=14, hs=Math.min(21, Math.max(17, window.innerWidth*0.044)), phh=ph?Math.round(ph.getBoundingClientRect().height):0; const ph0=phh;
  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }
    if(hs>13){ hs-=0.5; if(h3) h3.style.fontSize=hs+'px'; continue; }
    break;
  }
}
window.addEventListener('resize', fitCard);
document.getElementById('arrowPrev').onclick=prevArt;
document.getElementById('arrowNext').onclick=nextArt;
document.getElementById('arrowDown').onclick=nextCat;
function nextArt(){const n=curItems().length;if(!n)return;artIdxMap[curCat().id]=(curArtIdx()+1)%n;renderStage('next')}
function prevArt(){const n=curItems().length;if(!n)return;artIdxMap[curCat().id]=(curArtIdx()-1+n)%n;renderStage('prev')}
function nextCat(){catIdx=(catIdx+1)%cats.length;renderStage('down')}
function prevCat(){catIdx=(catIdx-1+cats.length)%cats.length;renderStage('up')}
/* ===== スワイプ操作（スクロールではなくスワイプで移動） ===== */
const stage=document.getElementById('stage');
let sx=null, sy=null, swipedAt=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;
  swipedAt=Date.now();
  if(Math.abs(dx)>Math.abs(dy)){ dx<0?nextArt():prevArt(); } else { dy<0?nextCat():prevCat(); }
});
stage.addEventListener('click',e=>{ if(Date.now()-swipedAt<120){e.stopPropagation();e.preventDefault();} },true);
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')nextArt(); else if(e.key==='ArrowLeft')prevArt();
  else if(e.key==='ArrowDown'){e.preventDefault();nextCat();} else if(e.key==='ArrowUp'){e.preventDefault();prevCat();}
});
/* ===== 項目の追加 ===== */
document.getElementById('addCatBtn').onclick=()=>{document.getElementById('newCatName').value="";document.getElementById('newCatDesc').value="";document.getElementById('addDlg').showModal()};
document.getElementById('addCatSave').onclick=()=>{
  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast("項目名を入力してください");return}
  const desc=document.getElementById('newCatDesc').value.trim()||"追加された項目";
  const id='custom-'+Date.now();
  extraCats.push({id:id,name:name,desc:desc,img:'hero'}); DATA[id]=[];
  cats=allCats(); catIdx=cats.length-1;
  document.getElementById('addDlg').close(); renderStage('down');
  toast("項目「"+name+"」を追加しました");
};
/* ===== 記事ダイアログ・メモ・共有 ===== */
function openArticle(cat,idx){
const c=allCats().find(x=>x.id==cat); const a=DATA[cat][idx];
document.getElementById('dlgIn').innerHTML=`<img src="${IMGS[c.img]}" alt=""><div class="meta" style="margin-top:10px"><span>${c.name}</span><span>${a[3]}</span></div><h3>${a[0]}</h3><p class="sum" style="font-size:14px">${a[1]}</p><div class="full">${a[2]}</div>
<p class="src" style="margin-top:12px">出典：${a[4]} — <a href="${a[5]}" target="_blank" rel="noopener">${a[5]}</a></p>
<div class="memoBox"><label style="font-weight:800;font-size:14px">ひとことメモ</label><textarea id="memoText" placeholder="気づいたこと、作りたいもの、家族への共有メモなど"></textarea>
<div class="actions"><button class="btn primary" onclick="saveMemo('${cat}',${idx})">このメモを保存</button><button class="btn ghost" onclick="shareArticle('${cat}',${idx})">iPhoneで共有</button><button class="btn ghost" onclick="document.getElementById('dlg').close()">閉じる</button></div></div>`;
document.getElementById('dlg').showModal();
}
function quickMemo(cat,idx,btn){const a=DATA[cat][idx];memos.unshift({cat,title:a[0],note:"",date:a[3]});updateMemoUI();btn.textContent="保存しました";btn.classList.add('saved');toast("メモに保存しました（このページを開いている間）")}
function saveMemo(cat,idx){const a=DATA[cat][idx];const note=document.getElementById('memoText').value.trim();memos.unshift({cat,title:a[0],note,date:a[3]});updateMemoUI();toast("メモを保存しました");document.getElementById('dlg').close()}
function updateMemoUI(){document.getElementById('memoCount').textContent=memos.length;const area=document.getElementById('memoList');
if(!memos.length){area.innerHTML='<p class="sum">まだメモがありません。記事の「メモ保存」をタップしてください。</p>';return}
area.innerHTML=memos.map(m=>`<div class="memoItem"><b style="font-size:14px">${m.title}</b><div style="font-size:13px;color:var(--muted)">${m.note||"（ひとことメモなし）"} ・ ${m.date}</div></div>`).join('')}
function exportMemos(){if(!memos.length){toast("まだメモがありません");return}const txt="MAI topic メモ — 2026-11-09\n\n"+memos.map((m,i)=>`${i+1}. ${m.title}\n${m.note||""}\n`).join("\n");const b=new Blob([txt],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="mai-topic-memo-2026-11-09.txt";a.click();URL.revokeObjectURL(u)}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}} try{await navigator.clipboard.writeText(text);toast("コピーしました — メモアプリなどに貼り付けできます")}catch(e){toast("共有できませんでした")}}
function shareArticle(cat,idx){const a=DATA[cat][idx];shareText(a[0],`${a[0]}\n\n${a[1]}\n\n出典：${a[4]} ${a[5]}`)}
function shareMemos(){if(!memos.length){toast("まだメモがありません");return}shareText("MAI topic メモ",memos.map(m=>`・${m.title} ${m.note}`).join("\n"))}
document.getElementById('sharePage').onclick=()=>shareText("MAI topic","MAI topic — 2026年11月9日朝版（全"+cats.length+"ジャンル）");
document.getElementById('memoBtn').onclick=()=>{updateMemoUI();document.getElementById('memoDlg').showModal()};
updateMemoUI();
renderStage();
</script>

    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
} catch (e) {}
</script>
