っきりしている、血便や黒い便が出る、前かがみでしか歩けない、ぐったりしているといった場合は、様子見をやめて受診すべきだという。押しても色が消えない発疹など、注意したい発疹のサインもあわせて紹介している。","\n【概要】子どもが「おなかが痛い」と言ったとき、受診すべきか迷う保護者は多い。小児科専門医の平原慎之介さんは、腹痛の原因で最も多いのは便秘だとしたうえで、様子見をやめて受診すべきサインがあると解説している。プレジデントオンラインが、書籍『子どもの病気と発達　これだけは知っておきたいこと』（日本実業出版社）の一部を再編集して伝えた。\n【背景】記事によると、毎日排便があっても便秘は否定できず、腸に便が大量にたまっていることはよくある。便秘を疑うポイントは、痛みに波がある、お腹全体がなんとなく痛い、お腹が張っている、便が少量で硬いの4点で、便秘による腹痛も受診の理由として十分だという。一方で、腹痛の陰に、急いで対応が必要な病気が隠れていることもある。\n【詳細】受診が必要なサインとして挙げられたのは5つ。1つ目は痛みが強く、時間とともに悪化している場合だ。便秘の腹痛は「痛い→落ち着く」を繰り返すことが多いが、2歳以下に多い腸重積では、突然激しく泣いて体を丸めた後に落ち着くことを繰り返し、嘔吐や血便を伴うこともある。2つ目は痛い場所がはっきりしている場合で、特に右下腹部は虫垂炎を疑う場所だという。3つ目は血便や黒っぽい便、4つ目は前かがみでしか歩けない、ジャンプを嫌がるなど歩き方や姿勢がおかしい場合で、お腹の炎症が考えられる。5つ目はぐったりしている、顔色が悪いなど全身の様子がおかしい場合で、記事はこれが最も重要だとしている。発疹についても、押しても色が消えない紫斑、呼吸やお腹の症状を伴う蕁麻疹、高熱が何日も続く発疹などは受診を考えるべきだとした。\n【ポイント・注意点】記事は、蕁麻疹と同時にせきが止まらない、ゼーゼーするなどの症状がある場合はアナフィラキシーの可能性があり、直ちに119番通報し、処方されたエピペンがあれば使うよう求めている。家庭では、痛みの続き方や場所、便の色を確認しておくと、受診時に医師へ伝えやすい。「いつもと明らかに違う」と感じたら、それだけで受診の十分な理由になるという言葉を心に留めておきたい。","2026-11-27","Yahoo!ニュース（プレジデントオンライン）","https://news.yahoo.co.jp/articles/3aea41ff8aab8b1fe48d6f454b81f0e7207b1506"],["画面の影響を受けやすいのは1歳と6歳　シンガポールの子ども502人を追跡","幼少期のスクリーン視聴が、のちの学力や作業記憶とどう関わるかを調べた研究が「World Journal of Pediatrics」に掲載された。シンガポールの出生コホートに参加した子ども502人を1〜8歳まで追跡した結果、1歳と6歳での視聴が多いほど、9歳時の学力や10歳半時の作業記憶が低い関連が見られ、1歳での影響が最も大きかった。研究者らは「少ないほど良い」とし、乳児期と小学校入学時の習慣づくりを勧めている。","\n【概要】中国の浙江大学などの研究者らが、幼少期のスクリーン視聴と、のちの学力や作業記憶との関連を調べた研究を「World Journal of Pediatrics」に発表した。ScienceDailyによると、1歳と6歳の時期に画面を見る量が多いほど、学力が低く、作業記憶が弱い傾向が見られ、特に1歳での関連が最も大きかった。研究には、フランス国立保健医学研究所（Inserm）やシンガポール国立大学の研究者も参加している。\n【背景】研究は、シンガポールの出生コホート「GUSTO」に参加した子ども502人を対象とした。保護者が、子どもが1歳から8歳になるまでの6つの時点で、スクリーンの視聴について報告した。そのうえで、9歳時の学力と、10歳半時の作業記憶を評価した。世界保健機関（WHO）や米国小児科学会は、生後18〜24カ月まではスクリーンを避け、2〜5歳では1日1時間未満にするよう勧めている。\n【詳細】1歳と6歳でのスクリーン視聴が多いほど、学力の低さや作業記憶の弱さと関連していた。2歳と3歳での視聴には有意な関連はなかったが、正式な学校教育が始まる6歳で関連が再び現れた。子ども時代全体の視聴時間でも関連が見られたが、その強さは年齢によって異なった。研究者らは、スクリーン視聴が、保護者との会話やごっこ遊び、手を使った探索の時間を奪っている可能性を指摘している。ただし、この研究は関連を示したもので、直接の因果関係を示すものではない。\n【ポイント・注意点】研究者らは「少ないほど良い」とし、子ども1人当たりの差は小さくても、社会全体では大きな意味を持ちうるとしている。乳児期から健康的な習慣を促し、小学校入学の時期に改めて見直すことを勧めている。今後は、視聴する内容の質や機器の種類、保護者が一緒に見ているかどうかも調べる必要があるという。家庭では、食事中や寝る前は画面を消す、絵本を読んだり外で遊んだりする時間を増やすなど、できることから取り組みたい。子どもが画面を見るときは、保護者が一緒に見て話しかけることも工夫の一つだ。","2026-11-26","ScienceDaily","https://www.sciencedaily.com/releases/2026/11/261126033220.htm"],["3歳女児虐待死、外泊中のけが約10件を警察に共有せず　「パパこわい」の訴えも届かず","兵庫県伊丹市で今年1月、3歳の女の子が父親から暴行を受けて死亡したとされる事件で、家庭復帰に向けた外泊中に、母親の日誌で約10件のけがが報告されていたにもかかわらず、児童相談所は警察に共有していなかった。集英社オンラインによると、女児は施設職員に「パパこわい」と訴えていたが、その発言も児相に伝わっていなかった。県の第三者委員会には、家庭復帰の判断や関係機関の連携の検証が求められている。","\n【概要】兵庫県伊丹市で今年1月、3歳の次女に暴行を加えて死亡させたとして、29歳の父親が11月18日、傷害致死の疑いで兵庫県警に逮捕された。集英社オンラインによると、女児は生前、施設職員に「パパこわい」と訴えていたほか、母親から児童相談所に約10件のけがの報告があったことも分かった。関係機関の情報共有や家庭復帰の判断が適切だったのかが問われている。\n【背景】女児は生後1カ月で双子の妹を亡くし、自身も肋骨の骨折や頭のけがで2度、児相に一時保護されていた。警察も過去2度、虐待の可能性を視野に捜査したが、いずれも虐待による負傷とは特定しなかった。女児は施設に入所し、昨年9月から12月にかけて、家庭復帰に向けた外泊が計14回行われた。\n【詳細】父親は今年1月11日、妻が買い物に出ている間に次女の頭や腹に暴行を加え、16日に死亡させた疑いが持たれている。父親は「事実ではありません」と否認している。司法解剖では全身に時期の異なる数十カ所のあざがあり、強いストレスを受けた子どもにみられるという胸腺の萎縮も報じられた。外泊中、母親が児相に出した日誌には頬や膝のあざなど約10件のけがの報告があったが、児相は虐待をうかがわせる状況ではないと判断し、警察に共有しなかった。女児は施設職員に2度「パパこわい」と話し、理由を聞かれると「ペチンする」と答えていたが、施設から児相には伝わっていなかった。女児は昨年12月19日から自宅で過ごし、事件の2日前には児相職員が家庭訪問していた。担当者は、顔や手などを見る限り危険な要素は認められなかったと説明し、事態を重く受け止めて再発防止に努めるとしている。\n【ポイント・注意点】施設は女児の恐怖の訴えを、児相は繰り返すけがをそれぞれ把握していたが、情報はつながらなかった。県の第三者委員会には、家庭復帰の判断や施設と児相の連携の実態を検証することが求められている。子どもの小さなSOSやけがの情報を、関係機関が確実に共有する仕組みが欠かせない。周囲の大人も、子どものけがが繰り返されていたり、特定の人を怖がる様子が見られたりしたときは、ためらわずに児童相談所などに相談したい。","2026-11-27","Yahoo!ニュース（集英社オンライン）","https://news.yahoo.co.jp/articles/276760c9ce2c899bd392cdd893342df8d3e65d21"],["「子どもが触る物は全部消毒」は逆効果？　小児科医監修、除菌のしすぎと免疫の関係","小さな子どもがいる家庭で気になりがちな消毒や除菌について、小児科医の成田奈緒子さんが監修した書籍の一部をnobicoが紹介した。家族が感染症にかかっているときの除菌は有効な予防法だが、日常的な除菌のしすぎは勧められないという。体内の菌と触れ合うことで免疫細胞が対処法を学ぶとし、過度な除菌はかえって体調を崩しやすくする可能性があると指摘。十分な睡眠も免疫力に欠かせないとしている。","\n【概要】小さな子どもがいる家庭では、おもちゃや身の回りの物の消毒・除菌に気を配る保護者も多い。nobico（のびこ）は、小児科医の成田奈緒子さんが監修した書籍『0歳から知っておきたい 脳が正しく育つ 子育てのきほん』（高橋書店）の一部を抜粋・編集し、何でも完璧に消毒・除菌することのデメリットを「免疫を育てる」という視点から紹介した。\n【背景】免疫は、さまざまな感染症から体を守る仕組みだ。記事によると、子どもが触るものをすべて除菌クリーナーで拭いたり、外でいろいろなものに触れるのを制限したりと、「清潔であること」を重視しすぎているケースはよくあるという。除菌を感染症対策と考えている家庭もある。冬は感染症が流行しやすい時期でもあり、子どもを病気から守りたいという思いから、除菌に力が入る家庭も少なくないだろう。\n【詳細】記事は、同居する家族が感染症にかかっているときの除菌は有効な予防法だとしつつ、日常的な除菌のしすぎは勧められないとしている。人の体内には腸内細菌のようにさまざまな菌が存在し、こうした菌を「飼っておく」ことで、免疫細胞が対処法を学び、体の防御機能が育つという。親が汚れに過敏に反応したり、過度に除菌したりすると、菌に対する免疫が育ちにくくなり、結果として体調を崩しやすくなる可能性があると指摘している。また、子どもは水遊びや泥遊び、砂遊びなど汚れる遊びが大好きで、健やかな育ちのためには多少の汚れを許容するおおらかさも必要だとした。身の回りにある菌のほとんどは無害だという。\n【ポイント・注意点】記事は、生活の中で自然に菌に触れながら、体本来の免疫力を育てることを勧めている。あわせて、十分な睡眠で副交感神経の働きが活発になることや、ストレスなどで交感神経が優位になりすぎないことも、免疫力を高めるうえで欠かせないとしている。一方で、家族が感染症にかかったときなど、場面に応じて除菌を取り入れることは有効な予防法とされている。日常は「完璧な清潔」を目指しすぎず、外遊びの後や食事の前の手洗いなど基本的な習慣を大切にしながら、子どもがのびのびと遊べる環境を整えたい。","2026-11-27","Yahoo!ニュース（nobico）","https://news.yahoo.co.jp/articles/ff3ef7311a9bb5cebf3ab9f592c1c25a0bdd5891"],["周産期のパートナー暴力、母乳育児の開始を妨げる　約35万組の母子を解析　豪大学","妊娠前後に受けるパートナーからの暴力が、母乳育児に影響するとする研究を、豪ウーロンゴン大学のチームが「BMC Pregnancy and Childbirth」に発表した。17の研究、約35万組の母子を統合して分析した結果、暴力を受けた女性は、出産後1時間以内に授乳を始める割合が36%低く、生後6カ月時点で母乳のみで育てている割合が50%低かった。研究者らは周産期ケアでの暴力の確認や支援体制の連携を求めている。","\n【概要】オーストラリアのウーロンゴン大学の研究チームは、妊娠前後の時期にパートナーから受ける暴力が、母乳育児の開始や継続を妨げているとする研究を、学術誌「BMC Pregnancy and Childbirth」に発表した。MedicalXpressによると、17の研究、約35万組の母子のデータを統合して分析した。\n【背景】世界保健機関（WHO）は、出産後1時間以内に授乳を始め、生後6カ月までは母乳のみで育てることを勧めている。一方で、母親を取り巻く環境によっては、母乳育児の開始や継続が難しくなることがある。研究では、妊娠の12カ月前から出産後12カ月までを周産期とし、その間の親密なパートナーによる暴力と、母乳育児との関係を調べた。研究を率いたのは、同大学の博士課程に在籍するゼラレム・ニグシエ・アゼネ氏だ。\n【詳細】研究は、複数の研究結果を統合して分析するシステマティックレビューとメタ解析の手法で行われた。分析の結果、身体的な暴力と心理的な暴力のいずれも、授乳開始の遅れや、母乳のみで育てる割合の低さと関連していた。暴力を受けた女性は、受けていない女性と比べて、出産後1時間以内に授乳を始める割合が36%低く、生後6カ月時点で母乳のみで育てている割合が50%低かった。一方、母乳育児を続けた全体の期間とは、統計的に有意な関連は見られなかった。共著者のキャサリン・マクフェイル准教授は、女性への暴力は「赤ちゃんの健康にもさらなる影響を及ぼしうる」と述べている。\n【ポイント・注意点】研究者らは、周産期のケアでパートナーからの暴力の有無を確認すること、トラウマに配慮したサービス、一人ひとりに合わせた授乳支援、産科、心の健康、家庭内暴力の各支援機関の連携を提言している。暴力は母親だけでなく赤ちゃんの健康にも関わる問題であり、悩みを抱える人が早く相談できる環境づくりが求められる。妊娠中や産後は、母親が心身ともに不安定になりやすく、周囲の支えが特に必要な時期だ。家族や友人、医療者が変化に気付き、声をかけることが支援の第一歩となる。","2026-11-25","MedicalXpress","https://medicalxpress.com/news/2026-11-intimate-partner-violence-barrier-breastfeeding.html"],["喘息のある10代とない10代、不安の程度に差なし　中等度以上でも専門紹介は半数未満","喘息のある12〜21歳と喘息のない同年代とで、不安の程度に差はなかったとする研究が、米国アレルギー・喘息・免疫学会の年次学術集会で発表された。米フィラデルフィアの小児病院の研究者が、喘息のある1356人とない2844人の不安尺度GAD-7の点数を比べた。両群とも不安の水準は高く、中等度以上の不安がある患者でも心の専門家に紹介されたのは半数に満たなかった。研究者は電子カルテの手順改善を求めている。","\n【概要】米フィラデルフィアのセント・クリストファーズ小児病院の研究者らは、喘息のある若者とない若者の間で、不安の程度に差は見られなかったとする研究結果を、米国アレルギー・喘息・免疫学会（ACAAI）の年次学術集会で発表した。Healioによると、どちらの群でも、不安があっても心の専門家への紹介につながらない例が多かった。\n【背景】記事は、これまでの推計で子どもの10〜30%が不安障害を抱えているとしている。研究は診療記録をさかのぼって調べる横断研究で、12〜21歳の喘息のある患者1356人と、喘息のない患者2844人の、不安の尺度GAD-7の点数を比べた。対象者の約9割が公的医療保険メディケイドの加入者だった。研究は、喘息のある子どもの不安がどの程度認識され、専門的な支援につながっているかを確かめることを目的としている。\n【詳細】不安がないと判定されたのは、喘息のある群で67.1%、ない群で68.9%だった。軽度は20.3%と19%、中等度は8.5%と8.16%、重度は4.28%と3.97%で、統計的に有意な差はなかった。心の専門家への紹介率は、重度の不安で喘息のある群が56.9%、ない群が61.1%、中等度では47.4%と50.4%だった。紹介の有無は喘息とは関係がなかったが、GAD-7の点数とは有意に関連していた。中等度または重度の不安がある患者でも、紹介されたのは半数に満たなかった。筆頭著者のオーリ・グリックマン医師は、両群とも不安の基礎的な水準が高く、社会的な健康の決定要因が影響している可能性があると述べた。\n【ポイント・注意点】研究者らは、不安の検査で陽性となった患者が確実に紹介されるよう、電子カルテの手順を改善すべきだとしている。研究チームは今後、救急外来の受診や吸入薬の補充、検査で陽性となった患者が後に不安障害と診断されたかどうかも調べる予定だ。以前の研究では、教育によって医療者がGAD-7を使いやすくなったと報告されている。喘息の有無にかかわらず、家庭でも子どもの不安のサインに気付いたら、早めにかかりつけ医に相談したい。","2026-11-25","Healio","https://www.healio.com/news/allergy-asthma/20261125/anxiety-levels-similar-among-adolescents-with-without-asthma"]],"dev":[["10代のスクリーンタイム 体力低下を介して実行機能の低さと間接的に関連 中国5468人追跡","中国6都市の中高生5,468人を3回にわたって追跡した研究で、スクリーンタイムが長いと次の時点の体力が低く、体力が低いとその次の時点の実行機能（注意や思考を制御する力）が低いという流れが、個人の中の変化として確認された。スクリーンタイムが体力を介して実行機能と結びつく間接効果は小さく、研究者は体力が画面利用と認知の発達を結ぶ経路の一つになりうるとしているが、因果関係は確定していない。","\n【概要】10代のスクリーンタイムが長いことは、体力の低下を通じて、注意や思考を制御する力である実行機能の低さと間接的に結びついているかもしれない。中国の研究チームが学術誌『Child and Adolescent Psychiatry and Mental Health』に発表した追跡研究の結果を、Scienmagが2026年11月27日に報じた。\n【背景】スマートフォンやゲームなどの画面利用が子どもの発達に与える影響は、各国で関心を集めている。実行機能は衝動を抑える力、情報を一時的に覚えておく力、考えを柔軟に切り替える力などからなり、学習や生活の土台とされる。体力や運動が実行機能に良い影響を与えるという知見もあり、画面利用と体力と実行機能の三つの関係を同じ子どもで時間を追って調べることが課題になっていた。\n【詳細】研究チームは2024年9月、中国の6都市で中学生と高校生5,468人を募り、3回にわたってデータを集めた。スクリーンタイムは標準化された質問票で、体力は標準的な体力テストをまとめた総合体力指数で測った。実行機能はコンピューター課題で、抑制、作業記憶、認知の柔軟性を評価した。分析には、人と人との安定した違いと、同じ人の中での時間による変化を分けて扱えるモデルを用いた。その結果、1回目のスクリーンタイムが長いと2回目の体力指数が低かった（標準化係数は4つのモデルで−0.103〜−0.099）。2回目の体力指数は3回目の実行機能と関連していた。記事では、この係数が−0.191〜−0.087と負の値で報告されている。1回目のスクリーンタイムから3回目の実行機能への直接の関連は、抑制、1つ前を覚える作業記憶課題、認知の柔軟性で有意だったが、2つ前を覚える課題では有意ではなかった。体力を介した間接効果は0.009〜0.019と小さかった。\n【ポイント・注意点】研究者は、体力が画面利用と認知の発達を結ぶ経路の一つになりうると結論づけたが、その役割はさらに確かめる必要があるとしている。示されたのは関連であり、因果関係が証明されたわけではない。間接効果は小さく、記事では研究の限界は示されていない。画面利用を減らしたり運動を増やしたりして実行機能が改善するかどうかは、今回の研究からは分からない。","2026-11-27","Scienmag","https://scienmag.com/adolescent-screen-time-may-indirectly-link-to-poorer-executive-function/"],["小児の心機能を3D心エコーの曲線で比較 健康な0〜18歳371人の基準を作成","3D心エコーで得られる左心室の容積の変化を、健康な0〜18歳371人の基準と比べて数値化するツールを、ドイツの法規に基づく倫理審査を経た研究チームが開発した。心臓の動きを1拍ごとの曲線として捉え、基準からのずれをzスコアで示す。7人の患者の事例では、駆出率だけでは見逃される異常の把握や、治療の経過の追跡に役立った。ソフトウエアは無償で公開されたが、効果の証明には大規模な研究が必要だとしている。","\n【概要】子どもの心臓のポンプ機能を、3D心エコーで得た心室の容積の時間変化（容積‐時間曲線）全体で評価するツールが開発された。Lindenらの研究チームが学術誌『Pediatric Research』に発表し、Scienmagが2026年11月27日に報じた。\n【背景】心機能の評価では、1回の拍動で血液を送り出す割合を示す駆出率がよく使われる。しかし駆出率は収縮の一場面を切り取った数値で、血液が心室に満ちる過程などの異常を見逃すことがある。子どもは成長とともに心臓の大きさや心拍数が変わるため、年齢をまたいで比べられる基準も必要だった。\n【詳細】基準には、2011年4月から2013年11月の多施設前向き研究で集めた、心臓の形と働きが正常な0〜18歳の371人のデータを使った。独自のPythonソフトで容積を1ミリ秒刻みに補間し、容積は拡張末期の容積で、時間は心拍の長さで正規化して年齢差をならした。そのうえで、患者の曲線と健康な子どもの中央値との差の面積や、容積の変化速度の曲線どうしの距離を求め、zスコアに換算した。生後1日から26か月の健康な20人で確かめると、値はおおむね正常範囲に収まった。7人の患者、計43件のデータでも試した。重い大動脈弁狭窄の乳児ではzスコアが−2未満のまま推移し、生後26日で亡くなった。風船による弁拡張などを繰り返した乳児では、zスコアが−2未満から正常域へ改善した。原発性高シュウ酸尿症による心筋症の患者では、透析で駆出率が回復したにもかかわらず、充満の異常は残っていた。補助人工心臓を付けた2人では、離脱がうまくいかなかった例とうまくいった例の違いが曲線に表れた。\n【ポイント・注意点】駆出率だけでは見えない心機能の変化を、年齢の違う子どもどうしで比べられる点が利点だ。ソフトは無償で公開されている。一方、メーカーの異なる解析ソフトでは容積の絶対値がずれることがあり、補助人工心臓の管が画像の妨げになる場合もある。事例は少なく記述的なもので、研究者自身も治療の判断を改善できるかはまだ証明できないとしている。研究が行われた国は記事に明記されていないが、ドイツの法規に沿った倫理手続きが記されている。","2026-11-27","Scienmag","https://scienmag.com/pediatric-researchers-establish-3d-echocardiography-reference-curves-for-ventricular-function/"],["子どもの腹痛の診断基準「ローマV」 痛みの現れ方で再分類 月経時のみの症状はIBSから除外","子どもの機能性消化管疾患の国際診断基準が「ローマIV」から「ローマV」に改訂され、腹痛の病気を年齢ではなく痛みの現れ方（間欠的・発作的・持続的）で分類する形に変わった。解説論文によると、小児に「胆道痛症候群」が新設され、過敏性腸症候群（IBS）は痛みが主症状であることを求め、月経時にだけ起きる症状は除外された。多国間研究ではIBSの有病率が1.5％と、従来の約5〜6％より低くなったという。","\n【概要】子どもの腹痛や便通の悩みを診断する国際基準「ローマ基準」が第5版（ローマV）に改訂された。LinaresとSapsが学術誌『World Journal of Pediatrics』に発表した解説論文をもとに、Scienmagが2026年11月27日に変更点を報じた。\n【背景】検査で異常が見つからない慢性の腹痛は、腸と脳の相互作用の不調として扱われる。ローマIVでは小児の病気を主に年齢で分けていたが、ローマVでは下部消化管の病気を症状の部位と現れ方で、腹痛、排便・肛門直腸、不快感の3群に整理した。腹痛の病気はさらに、痛みが間欠的か、決まった形の発作として起きるか、持続的かで分けられる。\n【詳細】大きな変更の一つは、小児に「胆道痛症候群」が新設されたことだ。あいまいだった「胆道ジスキネジア」に代わる概念で、右上腹部の痛みが月平均4日以上繰り返し、急に始まって30分から数時間続くことなどが条件となる。胆のうの排出率は手術後の改善を予測しなかったため、基準から外された。IBSでは、痛みが間欠的で主な症状であること、診断は6歳以上が推奨されること、月経時だけの痛みを除外することが明確になった。便秘型IBSと機能性便秘の区別は、治療を試す方法から、痛みと便秘のどちらが主かで判断する方法に変わった。コロンビアの女子3,336人の調査では、IBS基準を満たした初経後の45人のうち28人（62.2％）は症状が月経時だけだった。持続して日常生活を妨げる痛みは「中枢性腹痛症候群」と呼ばれ、2か月以上続くことが条件となる。多国間研究ではIBSの有病率が1.5％で、従来の約5〜6％より低かった。\n【ポイント・注意点】症状の重さを頻度、強さ、持続期間、生活への影響の4つの軸で評価する枠組み「FICAI」も示されたが、診断基準そのものは変えない。医師はIBSが疑われる場合、症状が月経期間外にも起きるかを確認する必要がある。複数の変更が同時に導入されたため、IBSの有病率低下がどの変更によるものかは切り分けられない。引用された過去の研究も対象がばらばらだった点には注意が要る。","2026-11-27","Scienmag","https://scienmag.com/rome-v-reclassifies-pediatric-abdominal-pain-disorders-by-temporal-symptom-presentation/"],["親の「ながらスマホ」が10代のネットいじめを予測 怒りの反すうが仲介 中国2407人追跡","中国の青少年2,407人を3年にわたり毎年調査した縦断研究で、親がスマートフォンに気を取られて子どもとのやり取りをおろそかにする「ファビング」が、その後の青少年によるネットいじめ加害を予測することが分かった。怒りの出来事を繰り返し思い返す「怒りの反すう」がこの関連を仲介していた。初期のファビングが高い家庭ほど、ネットいじめ加害の変化も速い傾向が見られた。研究は学術誌「Applied Research in Quality of Life」に掲載された。","\n【概要】\n中国の研究チーム（Yuran Qiao氏、Xingchao Wang氏、Yanjie Su氏）は、親のファビング（子どもと一緒にいる場面でスマートフォンなどに気を取られること）と、青少年のネットいじめ加害との関係を3年間追跡した。その結果、親のファビングはその後のネットいじめ加害を正の方向に予測し、怒りの反すうがその橋渡し役を果たしていることが示された。論文は「Applied Research in Quality of Life」に掲載されている。\n【背景】\nスマートフォンが家庭に浸透するなか、親が端末に注意を奪われることで親子のやり取りが損なわれる問題が注目されている。一方、青少年のネットいじめは重要な課題だが、親の行動と子どもの心理過程を同時に、時間の流れに沿って調べた研究は限られていた。本研究は、親側の環境要因と青少年側の心理的要因をあわせて検討することを目的とした。\n【詳細】\n対象は中国の青少年2,407人で、女子が50.23％、開始時の平均年齢は12.75歳（標準偏差0.58）。年1回、計3回の調査を行い、親のファビング、怒りの反すう、ネットいじめ加害を測定した。分析には交差遅延パネルモデル、ランダム切片交差遅延パネルモデル、並行過程潜在成長曲線モデルを用いた。親のファビングは後のネットいじめ加害を予測した一方、ネットいじめ加害は後の親のファビングを負の方向に予測した。親のファビングと怒りの反すうは双方向に関連し、怒りの反すうが両者の関係を仲介した。ランダム切片モデルでは、個人内での関連も支持された。さらに、初期の親のファビングが高いほど初期のネットいじめ加害も高く、その後の変化も速い「共発達」のパターンが見られた。いくつかの関連には性別による有意な違いもあった。\n【ポイント・注意点】\n著者らは、ネットいじめを理解するには親に関わる環境要因と青少年の心理過程を一緒に見る必要があると結論づけている。ただし記事では、使用した尺度の内容や研究の限界、具体的な対策の提案は示されていない。対象は中国の青少年に限られるため、他の国や文化にそのまま当てはまるかは慎重に考える必要がある。家庭では、子どもと過ごす時間のスマートフォンの使い方を見直すことが、一つの手がかりになりそうだ。","2026-11-27","Scienmag","https://scienmag.com/parental-phubbing-positively-predicts-adolescent-cyberbullying-over-time-in-longitudinal-study/"],["子どもの血中脂質、はっきりした「型」ではなく連続的な濃度の軸 1075人を解析","子どもと青少年1,075人の血漿中の脂質86種類を測定し、機械学習で分類を試みた研究が「Journal of Translational Medicine」に掲載された。データは安定して2つのグループに分かれたが、その違いは別々の「型」ではなく、脂質全体の濃度が高いか低いかという連続的な軸を反映したものだった。心臓や代謝の異常を予測する力を比べると、通常の臨床指標に脂質の情報を加えても、予測は改善しなかった。","\n【概要】\nXu氏らの研究チームは、病院を受診した子どもと青少年1,075人の血漿脂質を分析し、子どもの脂質のパターンに明確なサブタイプ（型）があるのかを調べた。その結果、データは2つのグループに分かれたものの、それは独立した型ではなく、脂質全体の濃度の高低という連続的な軸に沿った区分だった。論文は「Journal of Translational Medicine」に掲載された。\n【背景】\n血液中の多数の脂質をまとめて測る「リピドミクス」は、病気のリスクを早く見つける手がかりとして期待されている。大人では、脂質のパターンから人をいくつかの型に分ける試みがあるが、子どもでも同じような型があるのかは分かっていなかった。本研究は、病気の有無などの臨床結果を使わずにグループ分けを行い、その構造を確かめた。\n【詳細】\n研究チームは86種類の血漿脂質を測定し、頑健スパースk平均法と呼ばれるクラスタリング手法を、何重もの交差検証の中で用いた。その結果、一貫して2つのグループが選ばれ、平均予測強度は0.770と、3グループ（0.497）や4グループ（0.521）より高かった。グループの人数は599人と476人だった。しかし全体の濃度の影響を取り除くと、再現性のある別の脂質パターンは見つからなかった。また、中央値15種類の脂質に絞った簡易パネルでも、グループ分けを0.863のバランス正解率で再現できた。心臓・代謝の異常が2つ以上ある状態の判別では、86種類全体のモデルのAUCが0.731、簡易パネルが0.710だったのに対し、通常の臨床モデルは0.932で、これに簡易パネルを加えると0.928だった。\n【ポイント・注意点】\nこの集団では、子どもの血漿脂質は明確に分かれた型ではなく、連続的な濃度の勾配として整理されることが示された。また、脂質マーカーは通常の臨床指標を上回る予測力を加えなかった。著者らは、AUCは内部での比較であり、独立した臨床予測の性能を示すものではないと述べている。通常の臨床モデルには評価対象の判定そのものに使う変数が含まれていたこと、測定の品質管理の制約から技術的な要因を完全には切り分けられないことも限界に挙げた。対象者の年齢の幅や性別の内訳は、記事には示されていない。","2026-11-27","Scienmag","https://scienmag.com/pediatric-plasma-lipids-follow-a-continuous-axis-instead-of-discrete-subtypes/"],["競技チームスポーツの10代、運動意欲高く反社会的行動少なめ 420人を比較","12〜18歳の420人を、競技としてチームスポーツを行う群、個人スポーツを行う群、レクリエーションで運動する群の140人ずつに分けて比べた研究が「BMC Psychology」に掲載された。チームスポーツの選手は運動への意欲が最も高く、自己申告による反社会的行動は最も少なかった。意欲の高さは向社会的行動の多さ、反社会的行動の少なさと関連していた。ただし横断研究のため、因果関係は示されていない。","\n【概要】\nYusuf Arikan氏とYasin Akinci氏は、スポーツへの関わり方の違いによって、10代の運動への意欲や行動がどう異なるかを調べた。競技としてチームスポーツを行う若者は、運動への意欲が最も高く、自己申告による反社会的行動が最も少なかった。研究は「BMC Psychology」に掲載された。\n【背景】\nスポーツは若者の心身の発達や社会性を育む場と考えられているが、その効果はスポーツの種類や関わり方によって違う可能性がある。本研究は、競技か娯楽か、チームか個人かという参加の形に注目し、意欲と行動の関係を比べることを目的とした。研究が行われた国や著者の所属機関は、記事には示されていない。\n【詳細】\n対象は12〜18歳の420人で、競技チームスポーツ群、競技個人スポーツ群、レクリエーション群の3群に140人ずつ均等に分けた。運動への意欲は「身体活動参加動機尺度（MSPPA）」、社会的な行動は「スポーツにおける向社会的・反社会的行動尺度（PABSS）」で測った。分析には多変量分散分析や重回帰分析などを用いた。意欲の得点はチームスポーツ群が最も高く、個人スポーツ群、レクリエーション群の順だった。向社会的行動は、競技を行う2つの群がレクリエーション群より多く、チームと個人の間に有意な差はなかった。反社会的行動はチームスポーツ群が最も低かった。全体では、意欲と向社会的行動の相関は0.410、反社会的行動との相関はマイナス0.473で、いずれも統計的に有意だった。これらの関連は年齢、性別、親の学歴、スポーツの種類を調整しても保たれた。また、意欲と反社会的行動の負の関連は、チームスポーツ群よりレクリエーション群でより強かった。\n【ポイント・注意点】\n著者らは、スポーツへの関わり方が若者の意欲や行動の違いと結びついており、若者の行動を研究する際には参加の文脈を考える必要があると結論づけた。一方で、ある一時点の調査に基づく相関研究のため、チームスポーツが反社会的行動を減らすといった因果関係は示されていない。もともと意欲が高く行動面が安定した子がチームスポーツを選んでいる可能性もある。反社会的行動が自己申告である点にも注意が必要だ。","2026-11-27","Scienmag","https://scienmag.com/competitive-team-sports-linked-to-higher-motivation-and-lower-antisocial-behaviour/"],["10代の「相談しよう」という意図、心理的介入で小幅に向上 36報告を系統的レビュー","心の不調を抱えても助けを求めない10代が多いなか、援助要請を促す心理的介入の効果を調べた系統的レビューが「Child Psychiatry & Human Development」に掲載された。10〜19歳を対象とした36件の報告を分析したところ、対面型でもウェブ型でも一部の指標で改善が見られたが、効果は全体に小さく、研究間のばらつきも大きかった。改善は「相談しようという意図」で最も一貫しており、実際の行動への効果ははっきりしなかった。","\n【概要】\nCatarina Monteiro氏、Francisca Alves氏、Paula Vagos氏は、思春期の若者が心の問題で助けを求める行動（援助要請）を促す心理的介入について、系統的レビューを行った。対象となった36件の報告では、対面型・ウェブ型のいずれの形式でも一部の援助要請の指標に改善が見られた。ただし効果はおおむね控えめで、集団によって大きく異なっていた。\n【背景】\n著者らによると、思春期の若者のおよそ7人に1人が心の健康問題を抱えているが、その多くは見過ごされ、治療を受けていない。背景には、助けを求めることへのためらいが広くあることが挙げられる。こうした状況から、援助要請を後押しする介入がどの程度役立つのかを整理する必要があった。\n【詳細】\nレビューはPRISMAガイドラインに沿って行われた。Web of Science、Scopus、PubMed、PsycInfo、ProQuestの5つのデータベースで、1991年から2026年6月までに発表された査読付き報告を検索した。対象は10〜19歳の若者で、データの抽出にはPICOSの枠組みを使い、研究の質はジョアンナ・ブリッグス研究所のチェックリストで評価した。条件を満たした36件のうち、31件が従来の対面型介入、5件がウェブ型介入を評価していた。結果を見ると、改善が最も一貫していたのは援助要請の「意図」で、「態度」への効果はそれより弱く、実際に助けを求める「行動」への効果は最もはっきりしなかった。また、効果が長く続くことを示す証拠も限られていた。効果量や参加者数、介入の具体的な内容は、記事には示されていない。\n【ポイント・注意点】\n著者らは、介入によって若者の援助要請の意図を高められる可能性はあると評価する一方、ウェブ型介入の研究がまだ少ないこと、行動の変化が続くかどうかのデータが不足していることを課題に挙げた。今後は、より厳密な研究デザインと長期の追跡が必要だとしている。なお見出しでは「研究」とされているが本文では「報告」と書かれており、36件がそのまま36の独立した研究にあたるとは限らない点にも注意したい。意図が高まっても実際の相談につながるとは限らないため、相談しやすい環境づくりもあわせて考えることが大切だ。","2026-11-27","Scienmag","https://scienmag.com/psychological-interventions-modestly-improve-adolescent-help-seeking-intentions-across-36-reviewed-studies/"],["軽いADHD症状でも後の反社会的行動と関連 暴力犯罪の確率62〜91％増 フィンランド双子研究","フィンランド・ヘルシンキ大学などの研究チームが双子の長期追跡データを分析し、診断基準に満たない軽いADHD症状でも、14歳時点の症状が多いほど成人後の反社会的行動や犯罪行為が多いことを明らかにした。症状が1標準偏差増えるごとに暴力犯罪を犯す確率は62〜91％高かった。不注意の症状が一貫して関連していたのも特徴で、家族背景や知能だけでは関連を説明しきれなかった。","\n【概要】\nフィンランド・ヘルシンキ大学のライラ・ケトヴェル氏らは、診断基準に満たない程度のADHD症状が、後の反社会的行動や犯罪行為を予測するかを調べ、学術誌「Development and Psychopathology」に発表した。14歳時点のADHD症状が多いほど、若年成人期の反社会性パーソナリティ障害の症状や、生涯の犯罪行為の種類が多い傾向が見られた。\n【背景】\nADHDと反社会的行動の関連は知られているが、診断に至らない軽い症状でも同じ関連があるのか、家族の要因や知能、実行機能がその関連を説明したり弱めたりするのかは十分に分かっていなかった。双子を比べると、家庭環境や遺伝の影響をある程度取り除いて検討できる。\n【詳細】\n分析には、1983〜1987年にフィンランドで生まれた一卵性・二卵性の双子を追跡するFinnTwin12研究のデータを使った。参加者は項目により602〜1330人で、約53％が女性だった。14歳時点で本人への面接と教師の評価からADHD症状を測り、若年成人期に面接と認知検査、35〜40歳で生涯の犯罪行為と有罪判決の有無を自己申告で尋ねた。症状が1標準偏差増えるごとに、反社会性パーソナリティ障害の症状は18〜27％、犯罪行為の種類は16〜20％多く、暴力犯罪を犯す確率は62〜91％高かった。教師が評価した症状は有罪判決の確率56〜58％増と関連したが、面接による評価では関連しなかった。過去の研究では多動・衝動性が重視されてきたが、今回は不注意が一貫して関連した。双子同士の比較では多くの関連が統計的に有意でなくなったが、効果の大きさはほぼ変わらなかった。知能や実行機能は関連を弱めなかった。\n【ポイント・注意点】\n著者らは、軽いADHD症状も集団レベルでは反社会的行動の危険の高まりと関連すると結論づけた。ただし、犯罪行為は自己申告のみで、中年期までに多くの参加者が脱落し、ADHD症状が多い人ほどデータが欠けやすかった。双子比較の統計的な検出力も限られる。観察研究のため、因果関係は断定できない。","2026-11-27","PsyPost","https://www.psypost.org/even-mild-adhd-symptoms-in-adolescence-are-linked-to-later-antisocial-and-criminal-behavior-twin-study-finds/"],["思春期のホルモン変動、大人と違い心の不調と結びつかず 少女145人を5週間追跡 豪","オーストラリア・メルボルン大学の研究で、11〜17歳の少女145人の唾液を5週間毎朝採取し、女性ホルモンの変動と脳や心の健康の関係を調べた。エストラジオールの変動が大きい少女ほど、不安や抑うつの症状がやや少なく、感情の調整もしやすい傾向があった。成人女性ではホルモンの変動の大きさがうつと結びつくとされてきたが、思春期の少女には同じ危険が当てはまらない可能性が示された。","\n【概要】\nオーストラリア・メルボルン大学のムスカン・ケタン氏らは、思春期の少女の女性ホルモンの変動と、脳の構造や心の健康との関係を調べ、学術誌「Journal of Affective Disorders」に発表した。エストラジオールの変動が大きい少女ほど不安や抑うつの症状がやや少なく、成人の研究から予想される結果とはほぼ逆だった。\n【背景】\n思春期には卵巣がエストロゲン（エストラジオール）とプロゲステロンを多く作り始める。初経から数年は月経周期が不規則で、排卵を伴わないこともあり、ホルモンは大人より予測しにくい形で上下する。どちらのホルモンも前頭前野や扁桃体、海馬など感情に関わる脳の部位に作用する。これまでの研究は主に産後や更年期の成人女性が対象で、変動の大きさがうつと結びつくとされてきた。思春期を対象にした研究は少なく、50人未満の小規模なものが多かった。\n【詳細】\n研究はPANDA研究の一部で、ホルモン避妊薬を使っていない11〜17歳の少女145人が参加した。5週間、毎朝自宅で唾液を採取し、毎週の気分を評価した。最終週にはMRIで脳を撮影し、不安や抑うつ、感情調整に関する質問票に答えた。その結果、プロゲステロンの変動が大きい少女は左の視床がわずかに小さかったが、不安や抑うつの症状とは関連しなかった。視床は思春期に縮小することから、正常な発達を反映している可能性がある。エストラジオールの変動が大きいほど症状はやや少なく、初経前の少女で最も強く表れた。一方、週ごとに見ると、プロゲステロンの変化が大きい週は気分が否定的になり、エストラジオールが下がった週は気分が沈みがちだった。\n【ポイント・注意点】\n短期的なホルモンの変化はその時の気分に影響しうるが、長期的な変動の大きさは発達途中のホルモンの仕組みを反映しているだけかもしれない。ただし、変動が心の不調を防ぐと示したわけではない。5週間という期間は短く、より大きく多様な集団での長期研究が必要だと著者らは述べている。特定のホルモンの型から心の不調を起こしやすい少女を見分けられるかは、まだ分からない。","2026-11-27","Medical Xpress","https://medicalxpress.com/news/2026-11-puberty-wild-hormone-teenage-girls.html"],["生後2〜4週の赤ちゃんの脳を鎮静剤なしでMRI 母親のストレスと鉄の関係探る 米研究","米ノースイースタン大学の研究チームが、妊娠後期の母親の食事やストレスと、生まれた赤ちゃんの脳の発達との関係を調べる研究を進めている。生後2〜4週の乳児に鎮静剤を使わずにMRI検査を行い、脳内の鉄の蓄えを推定する画像に注目する。鉄は脳の発達に欠かせず、新生児の鉄は主に妊娠後期に蓄えられるため、母親の状態が影響しうる。結果は1〜2年以内の公表を目指しており、現時点で研究成果はまだ示されていない。","\n【概要】\n米ノースイースタン大学心理学部のブリー・リード助教らが、母親の妊娠中の栄養やストレスが赤ちゃんの脳の発達にどう関わるかを調べる研究を進めている。同大学の記事をMedical Xpressが転載したもので、生後2〜4週の乳児の脳をMRIで撮影し、脳内の鉄の蓄えを推定する画像に注目している。研究は進行中で、乳児の結果はまだ出ていない。\n【背景】\nリード氏によると、鉄は発達に欠かせない栄養素で、体の各部位が鉄を奪い合う。生後1年以内の鉄不足は脳の構造や機能に長期的な変化をもたらし、思春期まで情報処理の遅さや記憶力の低下につながりうるという。母乳には鉄がほとんど含まれないため、新生児の鉄は主に妊娠後期に蓄えられたものに頼る。母親の鉄が少なければ赤ちゃんも少ない可能性が高い。リード氏は、世界の5歳未満児の約4分の1が鉄不足で、米国の子どもの5〜15％が鉄欠乏の可能性があると推計している。動物研究ではストレスが体内の鉄の配分を変えることが示唆されている。\n【詳細】\n研究の土台は、妊娠後期の女性を追跡するBEAN研究で、参加者は食事を記録し、質問票に答え、血液や唾液などを提供する。これを乳児に広げたのがBEANIE研究だ。乳児は身長・体重・頭囲を測り、鎮静剤を使わずにMRIを撮る。医学的に必要な検査ではなく、薬が結果に影響しうるためだ。博士課程のジョージア・セレスティン氏は、深く眠っていないと赤ちゃんが起きてしまうと話す。ほかに反射、注意、自分で落ち着く力、ストレスホルモン反応を調べる神経行動検査も行う。参加者には最大115ドルが支払われる。\n【ポイント・注意点】\nリード氏は、栄養学と発達心理学の分野が互いに交流してこなかったと指摘し、両分野をつなぐ意義を強調する。ただし、この記事は研究の紹介であり、乳児の人数や統計解析、査読済みの結果は示されていない。鉄不足の割合はリード氏の推計や他の研究によるもので、本研究の成果ではない。脳の鉄の推定値をどう検証するかも記事には示されていない。結果は1〜2年以内の公表を目指している。","2026-11-27","Medical Xpress","https://medicalxpress.com/news/2026-11-littlest-cutest-subjects-infant-brains.html"],["うつ病の10代の自傷 神経症傾向との関連の7割は心の痛みと感情認識の難しさ経由 中国","うつ病で入院中の10〜18歳405人を調べた中国の研究で、神経症傾向（不安や落ち込みを感じやすい性格）と非自殺性自傷との関連の約72％が、心理的な痛みと失感情症（自分の感情を言葉にしにくい傾向）を通じて説明された。最も大きかったのは心理的な痛みの経路で、全体の約40％を占めた。研究者は感情への気づきと心の痛みを評価・支援の重点として挙げるが、横断研究のため因果関係や順序は確定できない。","\n【概要】うつ病の10代が自分の体を傷つける行為（非自殺性自傷）に、性格の一つである神経症傾向がどう結びつくのか。中国の研究チームが学術誌『Frontiers in Psychiatry』に発表した研究で、その関連の大部分が心理的な痛みと失感情症を介していることが示された。Scienmagが2026年11月27日に報じた。\n【背景】神経症傾向は不安や落ち込みなどの否定的な感情を抱きやすい傾向を指し、自傷との関連が指摘されてきた。ただ、性格がどのような心の働きを通じて行動につながるのかは十分に分かっていなかった。そこで研究チームは、自分の感情を認識し言葉にすることの難しさ（失感情症）と、耐えがたい心の苦しみ（心理的な痛み）に注目した。\n【詳細】調査は貴州省第二人民医院の女性・小児精神科で2025年10月から2026年4月に行われた。回収した490件のうち回答時間が短すぎるものなど85件を除き、うつ病と診断された10〜18歳の入院患者405人を分析した。平均年齢は14.82歳で、84.0％が女子だった。年齢と性別を考慮した連続媒介分析の結果、神経症傾向から自傷行動への全体の効果0.621のうち、媒介要因を通じた間接効果は0.449で、全体の約72.3％を占めた。媒介要因を入れると直接の効果は0.173に下がり、統計的に有意ではなくなった。経路別では心理的な痛みが単独で39.6％と最も大きく、失感情症単独は18.4％、失感情症から心理的な痛みへと続く経路は0.089だった。自傷の目的を問う尺度では、間接効果が84.4％を説明した。うつの重さを考慮しても、心理的な痛みの経路と連続経路は有意なままだった。\n【ポイント・注意点】研究者は、感情への気づきと心理的な痛みを評価や介入の有望な対象と位置づけている。ただし一時点の調査のため、どれが先に起きるのかや因果関係は確定できず、媒介要因の順番を入れ替えても3つの経路はすべて有意になった。対象は1つの病院の入院患者に限られ、女子が多く、急性の危機にある子は除かれている。回答は自己報告に基づく。自傷を防げるかどうかを確かめるには、長期の追跡研究が必要だとしている。","2026-11-27","Scienmag","https://scienmag.com/psychological-pain-and-alexithymia-mediate-neuroticism-and-adolescent-self-injury/"],["学校での不安・うつ検出 子の自己報告に教師評価を足しても精度向上は確認されず","学校で子どもの不安やうつ（内在化障害）を見つけるスクリーニングで、子ども自身の質問票に教師の評価を加えても、判別精度に意味のある上積みは見られなかった。5〜7年生219人の回答を構造化された診断面接と照らし合わせた研究で、自己報告のAUCは0.83、教師報告は0.79、両者を組み合わせた場合の上積みは0.003にとどまった。一方、判定基準を低くすると教師報告が27例中26例を少ない紹介数で拾っており、使い方によっては役立つ可能性も示された。","\n【概要】学校で子どもの不安やうつを早く見つけるために、子ども本人の質問票に教師の評価を加える意味はあるのか。Rüsenbergらの研究チームが学術誌『Child and Adolescent Psychiatry and Mental Health』に発表した研究では、教師評価を加えても全体的な判別精度ははっきりとは上がらなかった。Scienmagが2026年11月27日に報じた。\n【背景】不安やうつのような内在化障害は外から見えにくく、見過ごされやすい。学校は多くの子どもに接する場であり、スクリーニングの場として期待されているが、誰の報告を使うのが最も効率的かは十分に分かっていなかった。教師は日常の様子をよく見ている一方、子どもの内面の苦しさまで把握できるとは限らない。\n【詳細】研究には生徒329人と教師62人が参加し、データがそろった5〜7年生219人を分析した。子どもと教師が不安とうつに関する同じ形式の標準化質問票に答え、構造化された臨床面接を診断の基準とした。27人（12.3％）が内在化障害の基準を満たし、内訳は不安25人、抑うつ症状4人で、2人は両方に当てはまった。ベイズ型の多層ロジスティックモデルで比べた結果、判別力の指標AUCは子どもの自己報告が0.83、教師報告が0.79で同程度だった。両者を組み合わせたモデルでのAUCの上積みは0.003で、信頼できる改善とはいえなかった。予測リスクの判定基準を0.20にすると感度は自己報告と組み合わせが0.59、教師報告が0.56だった。基準を0.10まで下げると、教師報告は27例中26例を、より少ない紹介数で特定できた。\n【ポイント・注意点】子どもの自己報告は単独でも学校でのスクリーニングに十分使える性能を示した。教師評価は全体の精度を押し上げはしないが、低い基準で幅広く拾う場面では有用かもしれず、どの基準でも常に優れるモデルはなかった。ただし診断がついた子どもは27人と少なく、教師評価による小さな上積みを完全には否定できない。結果は主に不安の検出を反映しており、うつについては判断材料が乏しい。研究が行われた国は記事には示されていない。","2026-11-27","Scienmag","https://scienmag.com/teacher-reports-provide-no-credible-diagnostic-gain-over-student-mental-health-screening/"],["固形廃棄物の汚染対策区域で子どもの発達指標が改善 中国の3〜12歳797人を比較","中国の固形廃棄物汚染防止法に基づく特別な汚染対策区域に住む3〜12歳の子ども402人と、通常の地域監督下にある地域の395人、計797人を比較した観察コホート研究で、対策後に環境中の汚染物質濃度と子どもの体内曝露指標が低下し、身体発達や神経行動の指標が対照地域より大きく改善したことが報告された。「Frontiers in Public Health」に掲載。無作為化ではなく、因果関係は確認されていない。","\n【概要】中国で、固形廃棄物による汚染の対策が子どもの成長や神経認知の発達とどう関係するかを調べた観察コホート研究が、学術誌「Frontiers in Public Health」に掲載された。著者はW. Deng氏。特別な汚染対策区域では、対策後に大気・水・土壌の汚染物質濃度と子どもの体内曝露の指標が下がり、発達の指標が対照地域より大きく改善した。\n【背景】廃棄物に由来する鉛やカドミウム、多環芳香族炭化水素、フタル酸エステルなどへの曝露は、子どもの成長や脳の発達への影響が懸念されている。研究は、中国の固形廃棄物汚染防止法に基づく環境法の運用による汚染対策を、一種の「自然実験」としてとらえて分析した。具体的な地域名や都市名は記事には示されていない。\n【詳細】対象は3〜12歳の子ども797人。特別な汚染対策区域に住む402人を曝露群、通常の地域監督下にある地域の395人を対照群とした。大気・水・土壌の環境モニタリングに加え、血中鉛、尿中カドミウム、多環芳香族炭化水素とフタル酸エステルの尿中代謝物を測定した。身体発達、骨年齢の進み方、神経行動の指標を前向きに追跡した。開始時点の条件の差は逆確率重み付けで調整し、一般化推定方程式で群と時間の交互作用を、構造方程式モデリングで影響の経路を分析した。経路分析では、総効果1.11、直接効果0.32、連続的な間接効果0.21、並列の間接効果の合計0.79と報告された。群と時間の交互作用の方向は、調整後も一貫していた。\n【ポイント・注意点】対象は1つの対策区域と1つの対照地域に限られ、割り付けも無作為ではない。著者らは、結果は統計的な関連を示すもので因果関係を証明するものではないとし、多施設・多地域での研究が必要だとしている。記事には単位や信頼区間、p値は示されていない。なお、報告された直接効果と間接効果を足すと1.32となり、総効果1.11と一致しないが、その理由は記事には示されていない。環境対策と子どもの健康を結びつける試みとして注目されるが、数値の解釈には慎重さが求められる。","2026-11-26","Scienmag","https://scienmag.com/solid-waste-remediation-linked-to-improved-child-development-in-observational-cohort-study/"],["運動する10代ほど人助け、道徳的アイデンティティが強いと効果顕著 中国987人調査","中国・湖南省長沙市の公立中高8校の11〜18歳987人を対象にした横断調査で、身体活動が多い生徒ほど、感情調整や共感などの「個人の強み」を通じて人を助ける向社会的行動が多い傾向が示された。この経路は、道徳を自分にとって大切と考える「道徳的アイデンティティ」が強い生徒で最も強く、弱い生徒では有意でなかった。「Frontiers in Psychology」に掲載。因果関係は確認されていない。","\n【概要】Zhang Q.氏らの研究チームは、中国の中高生987人を対象に、身体活動と向社会的行動（人を助けたり思いやったりする行動）の関係を調べ、「Frontiers in Psychology」に報告した。身体活動は「個人の強み」を通じて向社会的行動と結びついており、その結びつきは道徳的アイデンティティが強い生徒ほど強かった。\n【背景】運動が心身の健康に役立つことはよく知られているが、思いやりのある行動との関係を支える仕組みは十分に分かっていない。研究はバンデューラの社会的認知理論に基づき、運動が感情への気づきや感情調整、目標設定、共感、社会的能力といった「個人の強み」を育て、それが人助けにつながるという経路を検証した。\n【詳細】長沙市の公立都市部中高8校、35学級から1208人を集め、欠損データや不自然な回答を除いた11〜18歳の987人（男子527人、女子460人）を分析した。身体活動の平均点は100点満点で42.33だった。身体活動と向社会的行動の相関はr＝0.198、個人の強みとの相関はr＝0.290。媒介分析では、身体活動と向社会的行動の関連のうち23.3％を個人の強みが説明した（間接効果0.053）。この間接効果は、道徳的アイデンティティが低い生徒（平均より1標準偏差下）では0.021で有意でなく、平均で0.050、高い生徒（1標準偏差上）では0.079と最も大きかった。モデル全体で説明できた向社会的行動のばらつきは8.8％だった。\n【ポイント・注意点】横断研究のため時間的な前後関係や因果関係は分からず、もともと向社会的な生徒がスポーツを選んでいる可能性もある。データはすべて自己報告の質問票で、学級や学校の識別情報を集めていないため多層分析もできていない。対象は長沙市の都市部の公立校に限られ、ほかの地域への一般化には注意が必要だ。説明できたばらつきも1割未満と小さい。運動の機会を増やすことに加え、道徳的な価値観を育む取り組みを組み合わせる意義を示唆する結果といえる。","2026-11-26","Scienmag","https://scienmag.com/physical-activity-promotes-adolescent-helping-behavior-when-moral-identity-is-strong/"],["学校でのマインドフルネス訓練、10代の思いやり行動への効果は限定的 3519人の試験","12〜15歳の生徒3519人を56校で無作為に割り付けた学校単位の試験で、9週間のマインドフルネス訓練が向社会的行動に与える効果を調べたところ、結果はまちまちだった。生徒の自己評価では訓練直後にリラクゼーション訓練群を上回ったが26週後には消え、教員評価では6年生でのみ効果が見られ、保護者評価では効果がなかった。何もしない対照群との差もなかった。「BMC Psychology」に掲載。","\n【概要】M. Lassander氏らの研究チームは、学校で行う9週間のマインドフルネス訓練が、10代の向社会的行動（人を助けたり思いやったりする行動）に与える影響を調べ、「BMC Psychology」に報告した。一部で効果は見られたものの、評価者や時期、学年によって結果は異なり、全体としてはまちまちだった。\n【背景】マインドフルネスは、今この瞬間に注意を向ける心の訓練で、学校での導入が広がっている。心の健康への効果は研究されてきたが、思いやりや協力といった向社会的行動への効果は十分に検証されていない。この試験は「Healthy Learning Mind」として登録されている。研究機関名や実施国は記事には示されていない。\n【詳細】対象は6〜8年生（12〜15歳）の3519人で、56校で無作為に割り付けた。マインドフルネス群1646人、比較のためのリラクゼーション訓練群1488人、何もしない対照群385人で、分析対象は3109人だった。向社会的行動は「子どもの強さと困難さアンケート（SDQ）」の向社会性の項目で測り、生徒本人、保護者、教員がそれぞれ評価した。評価は開始時、訓練直後、26週後に行った。生徒の自己評価では、訓練直後にマインドフルネス群がリラクゼーション群を上回ったが（β＝0.22、p＝0.007）、26週後には差がなくなった。教員評価では、26週後に6年生でのみマインドフルネス群が上回った（β＝0.43、p＝0.003）。8年生では効果は見られず、記事によればリラクゼーション群の方が良好だった。保護者評価では、どの時点でも有意な効果はなかった。何もしない対照群と比べると、どの評価者、どの時点でも有意な差はなかった。\n【ポイント・注意点】良い結果は特定の評価者や学年、時点に限られ、自己評価での効果も長続きしなかった。割り付けた生徒の約12％は分析に含まれていない。学校でのマインドフルネス訓練が思いやり行動を確実に育てるとは言いにくい結果で、年齢による効果の違いにも注意が必要だ。研究チームは、比較群を設けた長期の追跡と、複数の評価者による試験がさらに必要だとしている。","2026-11-26","Scienmag","https://scienmag.com/mindfulness-training-yields-mixed-prosocial-behavior-outcomes-in-adolescent-cluster-trial/"],["小児の胆道閉鎖症、肝線維化にPLGRKTシグナルが関与 マウスで抑制を確認","乳幼児の重い胆管の病気である胆道閉鎖症で、肝臓の線維化を進める「瘢痕関連マクロファージ」が、PLG–PLGRKTシグナルによって線維化を促す状態になることが、患者の肝組織の単一細胞解析や細胞実験で示された。マクロファージを狙ってPlgrktを抑える薬剤をマウスに投与すると、このマクロファージの蓄積と線維化が減った。「Journal of Clinical and Translational Hepatology」に掲載。前臨床段階の研究だ。","\n【概要】X. Li氏らの研究チームは、小児の胆道閉鎖症で肝臓の線維化が進む仕組みを調べ、「Journal of Clinical and Translational Hepatology」に報告した。線維化した部位に集まる「瘢痕関連マクロファージ」が、PLG–PLGRKTというシグナル経路を通じて線維化を促す状態になることを示し、この経路を抑えるとマウスで線維化が軽くなった。\n【背景】胆道閉鎖症は、乳幼児の胆管が詰まる重い病気で、肝臓の線維化が急速に進む。マクロファージは免疫細胞の一種で、一部は傷ついた組織の瘢痕化に関わるとされる。研究チームは、こうした瘢痕関連マクロファージと、PLG（プラスミノーゲン）とその受容体PLGRKTによるシグナルが線維化にどう関わるかに注目した。研究機関名は記事には示されていない。\n【詳細】胆道閉鎖症の患者と、胆道閉鎖症でない対照者の肝組織を、単一細胞RNAシーケンスと空間トランスクリプトミクスで解析し、主な結果を別の患者群でqPCRと多重免疫組織化学により確認した。瘢痕関連マクロファージは線維化の進行とともに増え、線維化した部位で肝星細胞（線維化の中心となる細胞）の近くに位置していた。PLGRKTは胆道閉鎖症の肝組織で多く、単球がマクロファージに分化するにつれて増えた。ヒトの血液由来のマクロファージを使った実験では、PLGがPLGRKTに依存して線維化を促す状態を引き起こし、この細胞の培養液は肝星細胞や肝オルガノイドでのCOL1A1（コラーゲン）の沈着を増やした。胆管を縛って線維化を起こしたマウスに、マクロファージを狙ってPlgrktを抑える抗体–siRNA複合体を投与すると、瘢痕関連マクロファージの蓄積が減り、線維化が軽くなった。\n【ポイント・注意点】研究チームは、PLGRKTと瘢痕関連マクロファージの関係を胆道閉鎖症の線維化に関わる要因の候補とし、新たな治療標的になりうるとしている。ただし、記事には患者数や動物数、統計値は示されていない。マウスの実験は胆管結紮モデルで、胆道閉鎖症そのもののモデルではなく、胆道閉鎖症に特化したモデルでの検証が必要とされる。前臨床段階の研究で、患者に効果があるかは分かっていない。","2026-11-26","News-Medical","https://www.news-medical.net/news/20261126/PLGRKT-signaling-drives-scar-associated-macrophage-accumulation-in-biliary-atresia.aspx"],["食事の質が後の代謝に響くのは妊娠中より子ども期か 欧州6カ国1663組の母子を分析","ノルウェー公衆衛生研究所などの国際研究チームが、欧州6カ国の母子1663組を対象に、妊娠中・子ども期・思春期の食事の質と、思春期の代謝の健康との関係を調べた。子ども期の食事の質が良いほど、思春期のメタボリックシンドロームの指標が良好だった。一方、妊娠中の母親の食事の質と、子どもの後の代謝の健康との関連を示す証拠は限られていた。子ども期は食習慣が形成される重要な時期の可能性があるとしている。","\n【概要】\nノルウェー公衆衛生研究所やバルセロナ国際保健研究所（ISGlobal）などの研究チームは、妊娠中から思春期までの食事の質と、子どもの心臓や代謝の健康との関係を調べ、学術誌「Clinical Nutrition」に発表した。子ども期の食事の質が良いほど思春期の代謝の指標が良好だったが、妊娠中の母親の食事との関連はほとんど見られなかった。\n【背景】\n妊娠中や幼少期の栄養は、その後の健康に影響すると考えられている。しかし、どの時期の食事が後の代謝の健康に最も関わるのか、また食習慣が母親から子ども、子どもから思春期へとどの程度受け継がれるのかは、十分に分かっていなかった。\n【詳細】\n研究には、フランス、ギリシャ、リトアニア、ノルウェー、スペイン、英国の出生コホートからなるHELIXプロジェクトの母子1663組のデータを使った。思春期の追跡調査には864人が参加した。食事は食物摂取頻度の質問票で調べ、豆類や野菜、果物、魚、肉、乳製品などの摂取頻度から、健康的で持続可能な食事の指標（HSEI、0〜100点）を算出した。平均点は母親62.8、子ども58.0、思春期55.2と年齢とともに下がり、母親の点数が最も低い子どもで低下が最も急だった。母親の点数は子どもの点数と弱く関連したが、調整後は思春期の点数とは関連しなかった。子ども期の点数は思春期の点数とより強く関連し、幼い頃の食習慣が続く傾向が示された。子ども期の食事の質が良いほど思春期のメタボリックシンドロームの指標は低かったが、ほかの指標とは有意な関連がなかった。子どもと思春期の約3分の1が過体重か肥満だった。\n【ポイント・注意点】\n著者らは、学校での栄養政策や家庭の支援が思春期の代謝の健康を改善しうるとし、妊娠中の健康的な食事の推進も引き続き重要だとしている。ただし、子どもと思春期の質問票は妥当性が検証されておらず、追跡からの脱落も多い。食べた頻度を測っており、量は測っていない。多重比較の補正もしておらず、観察研究のため因果関係は断定できない。","2026-11-26","News-Medical","https://www.news-medical.net/news/20261126/Pregnancy-or-childhood-When-does-diet-matter-most-for-later-metabolic-health.aspx"],["画面視聴の影響受けやすいのは1歳と6歳 学力や作業記憶の低さと関連 シンガポール502人","フランス国立保健医学研究所（Inserm）とシンガポール国立大学の研究で、子ども502人の画面視聴時間を乳児期から小学生期まで6回調べ、9歳の学力と10.5歳の作業記憶との関係を分析した。1歳と6歳の時点で画面視聴が多い子どもほど、後の学力や作業記憶が低い傾向が最も一貫して見られた。2歳と3歳では有意な関連はなかった。研究者は、乳児期と小学校入学前後が特に影響を受けやすい時期の可能性があるとしている。","\n【概要】\nフランス国立保健医学研究所（Inserm）とシンガポール国立大学の研究チームは、幼少期の画面視聴と後の学力や作業記憶との関係を調べ、学術誌「World Journal of Pediatrics」に発表した。1歳と、正式な学校教育が始まる6歳ごろの画面視聴が多いほど、後の学力が低く作業記憶が弱い傾向が見られた。\n【背景】\n世界保健機関（WHO）と米国小児科学会は、生後18〜24カ月までは画面を避け、2〜5歳は1日1時間未満にするよう勧めている。しかし多くの幼い子どもがこの目安を超えているという。画面視聴と認知の関係を調べたこれまでの研究の結果は一致していなかった。作業記憶とは情報を一時的に保持して操作する脳の働きで、指示に従う、算数の問題を解く、文章を理解するといった場面を支える。\n【詳細】\n研究には、シンガポールの出生コホート研究GUSTOに参加する子ども502人のデータを使った。保護者が乳児期から小学生期まで6回にわたり子どもの画面視聴を報告し、9歳で学力、10.5歳で作業記憶を測った。関連が最も一貫していたのは1歳と6歳の画面視聴で、効果の大きさは1歳で最大だった。2歳と3歳では有意な関連はなかったが、6歳で再び関連が現れた。子ども時代を通じた累積の視聴時間も学力の低さと関連した。研究者は、画面視聴が保護者との会話やごっこ遊び、手を使った探索など、言葉や注意、記憶、問題解決の力を育てる活動を奪う可能性を指摘している。研究はシンガポール国立研究財団などの資金提供を受けた。\n【ポイント・注意点】\n研究者は「少ないほど良い」とし、健康的な習慣づくりは乳児期から始め、小学校入学前後に改めて取り組むとよいと述べる。また、乳幼児期だけでなく後の視聴も重要だとしている。1日のわずかな差は個々の子どもでは目立たなくても、集団全体では学習に困難を抱える子どもを増やしうるという。ただし、示されたのは関連で因果関係ではない。視聴時間は保護者の報告で、コンテンツの質や機器の種類、保護者が一緒に見ていたかは調べていない。","2026-11-26","ScienceDaily","https://www.sciencedaily.com/releases/2026/11/261126033220.htm"],["子の5〜15歳時の読解・算数成績、母親の中年期の健康と関連 米1.1万組超を長期追跡","米国の長期追跡調査「National Longitudinal Survey of Youth」のデータを使い、1万1000人を超える子どもとその母親を分析した研究で、5〜15歳時の読解・算数の成績が高い子の母親ほど、40代・50代の身体的・精神的健康が良好な傾向にあることが分かった。成績が低い子の母親では、40歳から50歳にかけての身体的健康の低下がより大きかった。学術誌「Intelligence」に掲載。観察研究のため因果関係は示されていない。","\n【概要】Linda Wänström氏らの研究チームは、子どもの学力テストの成績と、その母親の中年期の健康との関連を調べ、学術誌「Intelligence」に報告した。読解と算数の成績が高い子の母親ほど、40代・50代の身体的・精神的健康が良好な傾向にあった。一方、成績が低い子の母親では、40歳から50歳にかけての身体的健康の低下がより大きかった。\n【背景】子どもの学力は、通常は本人の将来に関わる指標として扱われる。今回の研究は、子どもの成績を家族全体の状態を映す手がかりととらえ、親の健康の推移との関連に注目した。研究チームは、学力テストの成績を知能のおおよその指標として用いている。ただし記事は、学力テストが知能をよく反映するという見方は「広く受け入れられているわけではない」と指摘している。\n【詳細】分析には、米国で長期間続く追跡調査「National Longitudinal Survey of Youth」のデータを用いた。対象は1万1000人を超える子どもとその母親で、数十年にわたり追跡された。子どもは5〜15歳の間に読解と算数の評価を受け、母親は40代と50代に自身の身体的健康、精神的な幸福感、抑うつ症状を自己報告した。40歳から50歳にかけて、母親の抑うつ症状はおおむね増え、身体的健康の得点は下がる傾向にあった。この身体的健康の低下は、子どもが学業でつまずいている母親ほど急だった。記事には効果量などの具体的な統計値は示されていない。研究チームは説明として、学業に苦労する子を育てることによる継続的なストレスが体を少しずつ消耗させる可能性、日々のストレスへの対処や健康に関する選択、慢性疾患の管理を助ける「家族レベルの知能」の存在などを挙げている。\n【ポイント・注意点】この研究は観察研究であり、関連は示しているが、子どもの成績が母親の健康を変化させるという因果関係は示していない。記事は、悪いテストの点が母親を病気にするわけではないと強調している。また、専用の認知検査ではなく学力テストを知能の代わりに用いている点にも注意が必要だ。母親の健康は自己報告に基づいている。研究機関名など一部の情報は記事には示されていない。子どもの学習面のつまずきを、家族全体を支える視点から見直すきっかけになりうる結果といえる。","2026-11-26","PsyPost","https://www.psypost.org/a-childs-early-test-scores-arent-just-an-academic-milestone-psychology-researchers-discovered-they-are-linked-to-how-their-mothers-physical-health-holds-up/"],["12歳でスマホ所有、2年後の摂食障害症状リスク49％高く 米ABCD研究","米国の大規模調査「ABCD研究」の約9,000人のデータを分析した研究で、12歳の時点で自分のスマートフォンを持っていた子どもは、持っていなかった子どもに比べて、14歳で摂食障害の症状を少なくとも1つ報告するリスクが49％高かった。特に過食や、体重で自分の価値を判断する傾向との関連が目立った。研究は「JAMA Network Open」に掲載された。ただし観察研究であり、スマホが原因と示したものではない。","\n【概要】\nカリフォルニア大学サンフランシスコ校のJason M. Nagata准教授らは、12歳でのスマートフォン所有と、その後の摂食障害症状との関連を調べた。12歳でスマホを持っていた子どもは、14歳の時点で摂食障害の症状を少なくとも1つ報告する割合が24.2％で、持っていない子どもの15.5％を上回った。各種要因を調整すると、リスクは49％高かった。研究は「JAMA Network Open」に掲載された。\n【背景】\n子どもがスマホを持つ年齢は下がっている。自分専用の端末を持つと、親の目が届きにくくなり、外見を重視するコンテンツや他人との比較にさらされやすくなる可能性がある。一方で、スマホ所有と摂食障害の症状を長期的に追った研究は限られていた。\n【詳細】\n研究チームは、2018〜2024年に米国21か所で集められたABCD研究のデータを使い、8,957人を分析した。スマホ所有は親が回答し、症状は12歳と14歳の時点で子ども本人が面接形式の評価で答えた。12歳の時点では約70％がスマホを持っており、症状を少なくとも1つ報告した割合は所有者で16.1％、非所有者で11.3％だった。調整後のリスクは36％高く、過食は61％高かった。14歳では、12歳の症状を考慮しても、嘔吐や絶食、過度な運動などの代償行動が所有者で20.5％、非所有者で12.7％と、リスクは50％高かった。過食は67％高く、体重で自己価値を判断する傾向は7.8％対3.5％で、リスクはおよそ2倍だった。体重増加への心配との関連は全体では有意でなかったが、12歳の女子に限ると所有者のほうが多かった。\n【ポイント・注意点】\nNagata氏は「この研究はスマホが摂食障害を引き起こすことを示したものではない」と述べている。観察研究のため、いじめや以前からの体型への悩みなど、測定されていない要因が影響した可能性もある。また、利用時間やアプリの種類、家庭のルールは測っておらず、症状の頻度や重さも分からない。著者らは、医療者が摂食障害のリスクを確認する際に、スマホやSNSの利用について尋ねることを提案している。最初のスマホに理想的な年齢は示されておらず、親が関わり、体型について率直に話し合うことが大切だとしている。","2026-11-26","PsyPost","https://www.psypost.org/smartphone-ownership-at-age-12-linked-to-higher-risk-of-eating-disorder-symptoms-two-years-later/"]]};

  const c=curCat(), items=curItems(), ai=curArtIdx();
  const total=cats.reduce((s,x)=>s+(DATA[x.id]||[]).length,0);
  document.getElementById('heroText').innerHTML="<b>今日のまとめ — 全"+cats.length+"ジャンル・"+total+"件。</b> タイトルと概要は日本語、カードの「和訳全文を読む」で全文が開きます。新しい順に並べ、48時間より古い記事はグレー表示です。";
  document.getElementById('catName').textContent=c.name;
  document.getElementById('catDesc').textContent=c.desc||"";
  document.getElementById('catCount').textContent="ジャンル "+(catIdx+1)+" / "+cats.length;
  document.getElementById('catDots').innerHTML=cats.map((x,i)=>'<button class="dot'+(i===catIdx?' active':'')+'" data-cat="'+i+'" aria-label="'+x.name+'へ移動"></button>').join('');
  document.querySelectorAll('#catDots .dot').forEach(d=>{d.onclick=()=>{const n=+d.dataset.cat; if(n!==catIdx){const dd=n>catIdx?'down':'up'; catIdx=n; renderStage(dd);}}});
      const slot=document.getElementById('cardSlot');
  if(!items.length){
    slot.innerHTML='<article class="card"><div class="empty"><div class="big">✦</div><p><b>'+c.name+'</b> は追加されたばかりの項目で、まだ記事がありません。</p><p>毎日の更新でこの項目の記事が集まると、ここに表示されます。<br>上スワイプで他のジャンルへ移動できます。</p></div></article>';
    document.getElementById('artDots').innerHTML=""; document.getElementById('artCount').textContent="0 / 0"; return;
  }
  const it=items[ai], a=it.a, old=isOld(a[3]);
  slot.innerHTML='<article class="card'+(old?' old':'')+(dir?' anim-'+dir:'')+'">'
    +'<img class="ph" src="'+IMGS[c.img]+'" alt="'+c.name+'のイメージイラスト">'
    +'<div class="cbody"><div class="meta"><span class="badge'+(old?' oldb':'')+'">'+(old?'少し前':'NEW')+'</span><span>'+a[3]+'</span><span>'+(ai+1)+' / '+items.length+'</span></div>'
    +'<h3>'+a[0]+'</h3><p class="sum">'+a[1]+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="openArticle(\''+c.id+'\','+it.oi+')">和訳全文を読む</button>'
    +'<button class="btn ghost" onclick="quickMemo(\''+c.id+'\','+it.oi+',this)">メモ保存</button>'
    +'<button class="btn ghost" onclick="shareArticle(\''+c.id+'\','+it.oi+')">共有</button></div>'
    +'<div class="src">出典：'+a[4]+'<br><a href="'+a[5]+'" target="_blank" rel="noopener">原文を開く</a></div></div></article>';
  document.getElementById('artDots').innerHTML=items.map((x,i)=>'<span class="dot'+(i===ai?' active':'')+'"></span>').join('');
  document.getElementById('artCount').textContent="記事 "+(ai+1)+" / "+items.length;
  requestAnimationFrame(fitCard);
}

function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;
  const sum=card.querySelector('.sum'), h3=card.querySelector('h3'), ph=card.querySelector('.ph');
  let ss=14, hs=Math.min(21, Math.max(17, window.innerWidth*0.044)), phh=ph?Math.round(ph.getBoundingClientRect().height):0; const ph0=phh;
  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }
    if(hs>13){ hs-=0.5; if(h3) h3.style.fontSize=hs+'px'; continue; }
    break;
  }
}
window.addEventListener('resize', fitCard);
function nextArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i>=n-1)return;artIdxMap[curCat().id]=i+1;renderStage('next')}
function prevArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i<=0)return;artIdxMap[curCat().id]=i-1;renderStage('prev')}
function nextCat(){if(catIdx>=cats.length-1)return;catIdx++;renderStage('down')}
function prevCat(){if(catIdx<=0)return;catIdx--;renderStage('up')}
/* ===== スワイプ操作（スクロールではなくスワイプで移動） ===== */
const stage=document.getElementById('stage');
let sx=null, sy=null, swipedAt=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;
  swipedAt=Date.now();
  if(Math.abs(dx)>Math.abs(dy)){ dx<0?nextArt():prevArt(); } else { dy<0?nextCat():prevCat(); }
});
stage.addEventListener('click',e=>{ if(Date.now()-swipedAt<120){e.stopPropagation();e.preventDefault();} },true);
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')nextArt(); else if(e.key==='ArrowLeft')prevArt();
  else if(e.key==='ArrowDown'){e.preventDefault();nextCat();} else if(e.key==='ArrowUp'){e.preventDefault();prevCat();}
});
/* ===== 項目の追加 ===== */
document.getElementById('addCatBtn').onclick=()=>{document.getElementById('newCatName').value="";document.getElementById('newCatDesc').value="";document.getElementById('addDlg').showModal()};
document.getElementById('addCatSave').onclick=()=>{
  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast("項目名を入力してください");return}
  const desc=document.getElementById('newCatDesc').value.trim()||"追加された項目";
  const id='custom-'+Date.now();
  extraCats.push({id:id,name:name,desc:desc,img:'hero'}); DATA[id]=[];
  cats=allCats(); catIdx=cats.length-1;
  document.getElementById('addDlg').close(); renderStage('down');
  toast("項目「"+name+"」を追加しました");
};
/* ===== 記事ダイアログ・メモ・共有 ===== */
function openArticle(cat,idx){
const c=allCats().find(x=>x.id==cat); const a=DATA[cat][idx];
document.getElementById('dlgIn').innerHTML=`<img src="${IMGS[c.img]}" alt=""><div class="meta" style="margin-top:10px"><span>${c.name}</span><span>${a[3]}</span></div><h3>${a[0]}</h3><p class="sum" style="font-size:14px">${a[1]}</p><div class="full">${a[2]}</div>
<p class="src" style="margin-top:12px">出典：${a[4]} — <a href="${a[5]}" target="_blank" rel="noopener">${a[5]}</a></p>
<div class="memoBox"><label style="font-weight:800;font-size:14px">ひとことメモ</label><textarea id="memoText" placeholder="気づいたこと、作りたいもの、家族への共有メモなど"></textarea>
<div class="actions"><button class="btn primary" onclick="saveMemo('${cat}',${idx})">このメモを保存</button><button class="btn ghost" onclick="shareArticle('${cat}',${idx})">iPhoneで共有</button><button class="btn ghost" onclick="document.getElementById('dlg').close()">閉じる</button></div></div>`;
document.getElementById('dlg').showModal();
}
function quickMemo(cat,idx,btn){const a=DATA[cat][idx];memos.unshift({cat,title:a[0],note:"",date:a[3]});updateMemoUI();btn.textContent="保存しました";btn.classList.add('saved');toast("メモに保存しました（このページを開いている間）")}
function saveMemo(cat,idx){const a=DATA[cat][idx];const note=document.getElementById('memoText').value.trim();memos.unshift({cat,title:a[0],note,date:a[3]});updateMemoUI();toast("メモを保存しました");document.getElementById('dlg').close()}
function updateMemoUI(){document.getElementById('memoCount').textContent=memos.length;const area=document.getElementById('memoList');
if(!memos.length){area.innerHTML='<p class="sum">まだメモがありません。記事の「メモ保存」をタップしてください。</p>';return}
area.innerHTML=memos.map(m=>`<div class="memoItem"><b style="font-size:14px">${m.title}</b><div style="font-size:13px;color:var(--muted)">${m.note||"（ひとことメモなし）"} ・ ${m.date}</div></div>`).join('')}
function exportMemos(){if(!memos.length){toast("まだメモがありません");return}const txt="MAI topic メモ — 2026-11-10\n\n"+memos.map((m,i)=>`${i+1}. ${m.title}\n${m.note||""}\n`).join("\n");const b=new Blob([txt],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="mai-topic-memo-2026-11-10.txt";a.click();URL.revokeObjectURL(u)}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}} try{await navigator.clipboard.writeText(text);toast("コピーしました — メモアプリなどに貼り付けできます")}catch(e){toast("共有できませんでした")}}
function shareArticle(cat,idx){const a=DATA[cat][idx];shareText(a[0],`${a[0]}\n\n${a[1]}\n\n出典：${a[4]} ${a[5]}`)}
function shareMemos(){if(!memos.length){toast("まだメモがありません");return}shareText("MAI topic メモ",memos.map(m=>`・${m.title} ${m.note}`).join("\n"))}
document.getElementById('sharePage').onclick=()=>shareText("MAI topic","MAI topic — 2026年11月28日朝版（全"+cats.length+"ジャンル）");
document.getElementById('memoBtn').onclick=()=>{updateMemoUI();document.getElementById('memoDlg').showModal()};
updateMemoUI();
renderStage();
</script>

try {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
} catch (e) {}
</script>
