<style>

:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;display:flex;flex-direction:column;height:100dvh;overflow:hidden;transition:background .35s ease,color .35s ease}
body::before{content:"";position:fixed;inset:0;background:var(--pattern);pointer-events:none;opacity:var(--pattern-op,.5)}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
[data-theme="steampunk"]{--bg:#e6d7b8;--pattern:radial-gradient(circle at 12% 20%,rgba(141,100,40,.16) 0 26px,transparent 27px),radial-gradient(circle at 88% 78%,rgba(141,100,40,.13) 0 38px,transparent 39px),repeating-linear-gradient(0deg,rgba(90,62,25,.05) 0 1px,transparent 1px 26px);--pattern-op:1;--card:#f8eed3;--ink:#2e2010;--muted:#77603c;--line:#a97f3f;--accent:#9c4a12;--accent2:#2f5d50;--accent-ink:#fff6df;--soft:#efdfba;--old:#97835f;--top-bg:#2a1a0c;--top-ink:#f2dfae;--radius:8px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\2699  \2699  \2699";--shadow:0 14px 34px rgba(62,40,8,.28)}
[data-theme="witch"]{color-scheme:dark;--bg:#161022;--pattern:radial-gradient(circle at 18% 12%,rgba(233,213,255,.20) 0 1.5px,transparent 2.5px),radial-gradient(circle at 72% 22%,rgba(233,213,255,.14) 0 1px,transparent 2px),radial-gradient(circle at 42% 66%,rgba(196,181,253,.12) 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 84%,rgba(233,213,255,.16) 0 1px,transparent 2px),radial-gradient(circle at 6% 88%,rgba(196,181,253,.12) 0 1px,transparent 2px);--pattern-op:1;--card:#241a3d;--ink:#f1eaff;--muted:#bdaee0;--line:#5b4595;--accent:#a678ff;--accent2:#e9d5ff;--accent-ink:#1d1233;--soft:#2f2350;--old:#8d81ad;--top-bg:#0e0919;--top-ink:#efe6ff;--radius:20px;--font-display:"IM Fell English","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\263E  \2726  \263D";--shadow:0 14px 34px rgba(0,0,0,.5)}
[data-theme="dnd"]{--bg:#e7d9b4;--pattern:repeating-linear-gradient(45deg,rgba(158,43,37,.05) 0 2px,transparent 2px 18px),radial-gradient(circle at 85% 10%,rgba(158,43,37,.10) 0 30px,transparent 31px);--pattern-op:1;--card:#f7ecc9;--ink:#332216;--muted:#7d6248;--line:#8c6a3f;--accent:#9e2b25;--accent2:#a97b00;--accent-ink:#fdf3d8;--soft:#eee0b6;--old:#9a8a72;--top-bg:#471611;--top-ink:#f7e7bd;--radius:4px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\265E  \2726  \265E";--shadow:0 14px 30px rgba(71,22,17,.30)}
[data-theme="celtic"]{--bg:#e3dfc6;--pattern:repeating-linear-gradient(0deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px),repeating-linear-gradient(90deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px);--pattern-op:1;--card:#f6f2dc;--ink:#20331e;--muted:#5d7050;--line:#77873f;--accent:#2e6b34;--accent2:#a8842a;--accent-ink:#fbf7e2;--soft:#e7e5c8;--old:#93a086;--top-bg:#17351f;--top-ink:#efeccb;--radius:14px;--font-display:"Uncial Antiqua","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\16DA  \2726  \16DB";--shadow:0 14px 30px rgba(23,53,31,.26)}
[data-theme="greek"]{--bg:#f2eee3;--pattern:repeating-linear-gradient(90deg,rgba(29,95,138,.06) 0 1px,transparent 1px 34px),radial-gradient(circle at 90% 0%,rgba(185,138,28,.10) 0 60px,transparent 61px);--pattern-op:1;--card:#fffdf6;--ink:#1e2c38;--muted:#66727c;--line:#b3923c;--accent:#1d5f8a;--accent2:#b98a1c;--accent-ink:#ffffff;--soft:#ece7d7;--old:#a3a8ad;--top-bg:#fdfbf4;--top-ink:#1e2c38;--radius:2px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\03A9  \2766  \03A9";--shadow:0 14px 30px rgba(30,44,56,.18)}
.top{flex:none;position:relative;z-index:30;background:var(--top-bg);color:var(--top-ink);border-bottom:3px double var(--line)}
.topin{max-width:1080px;margin:auto;padding:10px 16px 4px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.logo{font-family:var(--font-display);font-weight:900;font-size:23px;letter-spacing:.06em}.logo span{color:var(--accent2)}
[data-theme="witch"] .logo span,[data-theme="steampunk"] .logo span{color:var(--accent)}
.date{font-size:10px;opacity:.75;white-space:nowrap}
.topbtns{display:flex;gap:8px;flex:none}.pill{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.themes{max-width:1080px;margin:auto;padding:6px 16px 10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.themes-label{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;opacity:.8}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;opacity:.85}
.theme-btn .gly{margin-right:5px}
.theme-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
.stage-wrap{flex:1;min-height:0;max-width:1080px;width:100%;margin:auto;padding:10px 16px 12px;display:flex;flex-direction:column;position:relative;z-index:1}
.herostrip{flex:none;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;box-shadow:var(--shadow)}
.herostrip img{width:74px;height:52px;object-fit:cover;border-radius:calc(var(--radius) * .6);flex:none}
.herostrip p{margin:0;font-size:13px;color:var(--muted)}.herostrip b{color:var(--ink);font-family:var(--font-display)}
.catbar{flex:none;display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.catbar .navbtn{flex:none}
.catinfo{flex:1;text-align:center;min-width:0}
.catinfo h2{margin:0;font-family:var(--font-display);font-size:clamp(19px,4.6vw,27px);line-height:1.25;letter-spacing:.03em}
.catinfo p{margin:1px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catcount{flex:none;font-size:12px;background:var(--soft);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-weight:700}
.navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800;box-shadow:var(--shadow)}
.navbtn:active{transform:scale(.97)}
.dots{flex:none;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:transparent;padding:0}
.dot.active{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.stage{flex:1;min-height:0;touch-action:none;position:relative}
#cardSlot{height:100%}
.card{height:100%;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
.card::after{content:var(--orn);position:absolute;top:6px;right:12px;font-size:13px;letter-spacing:.3em;color:var(--accent2);opacity:.85;pointer-events:none}
.card.old .ph{filter:grayscale(1)}
.card .ph{width:100%;height:30%;min-height:120px;object-fit:cover;display:block;flex:none}
[data-theme="steampunk"] .card .ph{filter:sepia(.35) contrast(1.05)}
[data-theme="witch"] .card .ph{filter:saturate(.85) hue-rotate(-12deg) brightness(.92)}
[data-theme="dnd"] .card .ph{filter:sepia(.25) saturate(1.1)}
[data-theme="celtic"] .card .ph{filter:saturate(1.05) hue-rotate(6deg)}
[data-theme="greek"] .card .ph{filter:saturate(.92) brightness(1.04)}
.cbody{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.badge{background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:999px;font-weight:800}.badge.oldb{background:var(--old)}
.card h3{margin:0;font-size:clamp(17px,4.4vw,21px);line-height:1.45;font-family:var(--font-display);font-weight:700}
.sum{font-size:14px;color:var(--muted);margin:0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.btn{border:0;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800}
.btn.primary{background:var(--accent);color:var(--accent-ink)}.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.saved{background:var(--accent2);color:var(--accent-ink)}
.src{font-size:11px;color:var(--muted);word-break:break-all}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;color:var(--muted)}
.empty .big{font-size:34px;color:var(--accent2)}
.pager{flex:none;display:flex;align-items:center;gap:10px;margin-top:10px}
.pager .navbtn{flex:1}
.artdots{flex:none;display:flex;gap:5px;max-width:34vw;flex-wrap:wrap;justify-content:center}
.artcount{flex:none;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.hint{flex:none;font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.addcat{flex:none;text-align:center;margin-top:6px}
.addcat button{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700}
@keyframes inNext{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes inDown{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes inUp{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
.anim-next{animation:inNext .28s ease}.anim-prev{animation:inPrev .28s ease}.anim-down{animation:inDown .28s ease}.anim-up{animation:inUp .28s ease}
dialog{border:2px solid var(--line);border-radius:calc(var(--radius) + 6px);padding:0;max-width:min(680px,94vw);width:680px;max-height:92dvh;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,8,4,.6)}
.din{padding:20px;overflow-y:auto;max-height:92dvh}
.din img{width:100%;height:200px;object-fit:cover;border-radius:var(--radius)}
.din h3{font-size:20px;line-height:1.4;margin:12px 0 6px;font-family:var(--font-display)}
.full{font-size:15px;white-space:pre-line}
textarea,input[type="text"]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px}
label.fl{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
.memoBox{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.memoItem{border-top:1px solid var(--line);padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--top-bg);color:var(--top-ink);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:90vw;text-align:center}
@media(max-width:640px){.topin{padding:8px 12px 2px}.themes{padding:4px 12px 8px}.stage-wrap{padding:8px 12px 10px}.herostrip{display:none}.catbar .navbtn{padding:8px 10px;font-size:12px}.card .ph{height:24%;min-height:104px}}
@media(prefers-reduced-motion:reduce){.anim-next,.anim-prev,.anim-down,.anim-up{animation:none}body{transition:none}}

</style>

た創薬の期間を大幅に短縮できると期待されている。【詳細】今回のラウンドには既存投資家のGV、Capital G、Thrive、MGX、Temasek、イギリスのソブリンAIファンドも参加した。Bloombergの報道では、評価額は500億ドル規模が検討されていたとされるが、正式な評価額は開示されていない。調達した資金は、候補薬の臨床試験への移行や研究体制の拡充に使われる見通しだ。調達資金は、臨床試験の実施や研究者の採用、実験設備の拡充に充てられるとみられる。【ポイント・注意点】AI創薬は、従来の創薬に比べて期間とコストを大きく圧縮できると期待されている。ただし、前臨床で良い結果が出ても、臨床試験でつまずく例は少なくない。50億ドルという規模は期待の大きさを示す一方で、成果へのプレッシャーも大きい。評価額が未開示な点にも注意したい。今後は、臨床試験の結果が同社の評価を左右する。成功すれば、AI創薬の流れがさらに加速しそうだ。臨床試験の進み具合が、今後の資金調達や提携の行方も左右しそうだ。","2026-11-17","TechCrunch","https://techcrunch.com/2026/11/17/isomorphic-labs-raises-5b-as-it-looks-to-take-drug-candidates-to-clinical-trials/"],["Instagram、AI改変動画も検出する保護ツール","Instagramが、クリエイター向けの動画保護ツール「content protection」を発表した。無断転載の検出に加え、元の音声を流用したAI生成動画も検出できる。少人数のクリエイターを対象に、数週間以内にテストが始まる。自分の動画が無断で使われた場合に、削除や表示の変更を選べるようになる。生成AIの普及で増えた加工動画への対策として、クリエイターの権利を守る動きが広がっている。","\n【概要】Instagramが、クリエイター向けの動画保護ツール「content protection」を発表した。無断転載の検出に加え、元の音声を流用したAI生成動画も検出できる。少人数のクリエイターを対象に、数週間以内にテストが始まる。自分の動画が無断で使われた場合に、削除や表示の変更を選べるようになる。自分の作品を無断で使われる悩みは多くのクリエイターに共通しており、保護の仕組みへの期待は大きい。【背景】短い動画の無断転載は長年の問題で、元の投稿者よりも転載したアカウントの方が拡散される例も珍しくなかった。生成AIの普及で、音声を差し替えたり加工したりした動画も増え、従来の検出では追いつかなくなっていた。Facebookではすでに同様の仕組みが提供されており、Instagramへの展開が待たれていた。転載された動画の方が拡散される例もあり、元の作者が収益や評価を奪われる問題が指摘されてきた。【詳細】登録したクリエイターの新規投稿は自動で保護され、過去の動画も手動でさかのぼって保護できる。無断使用が検出されると通知が届き、ブロックするか、転載動画に「original by」と表示するか、監視を続けるか、権利を放棄するかを選べる。自分の動画を使ってもよい相手を許可リストに登録することも可能だ。許可リストに登録した相手の利用は認められるため、コラボレーションや引用には柔軟に対応できる。【ポイント・注意点】AIによる改変まで検出対象に広げた点が新しい。ただし、検出の精度や、パロディや引用といった正当な利用との区別がどう扱われるかは、運用が始まってみないと分からない。まずは少人数でのテストで、対象が広がる時期は未定だ。クリエイターにとっては、自分の作品を守る有力な手段になりそうだ。運用が広がれば、動画プラットフォーム全体のルール作りにも影響しそうだ。まずはテストの結果を見守りたい。保護の対象がAIによる改変まで広がった点は、ほかの動画サービスにも広がる可能性がある。クリエイターの権利を守る動きとして、今後の展開に注目したい。","2026-11-17","TechCrunch","https://techcrunch.com/2026/11/17/instagrams-new-tool-for-creators-targets-unauthorized-reposts-and-ai-modified-videos/"],["Spotify、ディープフェイク曲から実在アーティストを守る新機能","Spotifyが、全アーティスト向けに「Artist Profile Protection」の提供を始めた。AIで作られた偽の楽曲が実在のアーティスト名義で配信されるのを防ぐ仕組みで、8か月のベータ期間を経て正式提供となった。アーティストは通知を受けて、別人の楽曲との関連付けを解除できるようになる。生成AIによる偽の楽曲が増える中、アーティストの名前と作品を守る対策が求められていた。","\n【概要】Spotifyが、全アーティスト向けに「Artist Profile Protection」の提供を始めた。AIで作られた偽の楽曲が実在のアーティスト名義で配信されるのを防ぐ仕組みで、8か月のベータ期間を経て正式提供となった。アーティストは通知を受けて、別人の楽曲との関連付けを解除できるようになる。自分の知らない楽曲が自分の名義で配信される事態は、アーティストの信頼を直接損なう深刻な問題だ。【背景】生成AIの普及で、実在のアーティストそっくりの声や作風の楽曲を大量に作り、本人名義で配信する事例が増えていた。Billboardの報道によると、Sony Musicは先月、26万曲を超えるディープフェイク曲の削除をSpotifyに要請したという。これは3月に開示された件数の約2倍で、被害の拡大がうかがえる。削除の要請件数が半年で約2倍に増えたことは、偽の楽曲の氾濫が急速に進んでいることを示している。【詳細】Spotify for Artistsから通知が届き、アーティスト自身が自分のプロフィールに結び付けられた別人の楽曲を確認して、関連付けを解除できる。高度な設定では、自分のプロフィールに楽曲が追加される前に承認を求める事前承認制にもできる。Spotifyは配信前の審査も強化しているとしている。事前承認制を選べば、自分のプロフィールに楽曲が追加される前に確認できるため、被害を未然に防げる。【ポイント・注意点】アーティスト側が自分で確認して解除する仕組みのため、気付くまでのタイムラグは残る。事前承認制にすれば防げるが、設定の手間がかかる。偽の楽曲が収益を奪う問題は業界全体の課題で、Spotify以外の配信サービスでも対策が進むかどうかが注目される。利用者は、聴いている曲が本物かどうか意識する機会が増えそうだ。今後は、配信前の審査の強化や、他社の配信サービスとの連携が進むかどうかも注目される。偽の楽曲の問題はSpotifyだけのものではなく、業界全体で対策が進むかどうかが問われている。","2026-11-17","TechCrunch","https://techcrunch.com/2026/11/17/spotifys-new-tool-aims-to-stop-deepfakes-from-being-attributed-to-real-artists/"],["Nvidia、国家安全保障委員会を設置","Nvidiaが、取締役会レベルの国家安全保障委員会を設置した。ジェンスン・フアン氏の退任後、初の大きな動きとなる。委員長はスザンヌ・ノラ・ジョンソン氏で、少なくとも四半期に1回開かれる。AIチップをめぐる輸出管理の強化が進む中、安全保障への対応を経営の中核に据える狙いがある。米中対立が続く中、AIチップ大手の安全保障への対応が経営の重要課題になっている。今後の展開が注目される。","\n【概要】Nvidiaが、取締役会レベルの国家安全保障委員会を設置した。ジェンスン・フアン氏の退任後、初の大きな動きとなる。委員長はスザンヌ・ノラ・ジョンソン氏で、少なくとも四半期に1回開かれる。AIチップをめぐる輸出管理の強化が進む中、安全保障への対応を経営の中核に据える狙いがある。委員会の設置は、規制当局や投資家に対して安全保障への姿勢を示す狙いもあるとみられる。【背景】フアン氏は、中国のスパイ疑惑のある人物との不倫疑惑を受けて退任した。暫定CEOにはCFOのコレット・クレス氏が就いている。米商務省は2026年11月16日、AIチップやデータセンターの輸出管理を強化し、リモートアクセスによる迂回を防ぐ方針を発表した。Nvidiaは米中対立の最前線に立つ企業の一つとなっている。輸出管理の強化は、Nvidiaの中国向け事業にも影響するため、経営判断の難しさが増している。【詳細】委員会の委員には、ジョンソン氏のほかスティーブン・ニール氏とジョン・ダビリ氏が就いた。輸出管理やサプライチェーンの安全、技術流出の防止などを監督するとみられる。フアン氏は今月中に議会で証言する予定で、その発言も注目される。委員会の設置は、投資家や規制当局への姿勢を示す意味合いもある。委員会は、技術の流出防止やサプライチェーンの安全についても監督するとみられ、権限は幅広い。【ポイント・注意点】委員会の設置自体はガバナンス強化の表明だが、実効性は今後の運営次第だ。フアン氏の退任理由をめぐる疑惑は未解明な部分も多く、議会証言の内容が注目される。AIチップの輸出管理は今後さらに厳しくなる可能性があり、Nvidiaの事業への影響も見ておきたい。報道はTechCrunchによるものだ。フアン氏の議会証言では、退任の経緯や輸出管理への見解が問われる可能性があり、発言が注目される。輸出管理の厳格化が事業に与える影響も見ておきたい。議会証言の内容次第では、さらに大きな動きにつながる可能性もある。今後の委員会の開催内容にも注目したい。","2026-11-17","TechCrunch","https://techcrunch.com/2026/11/17/nvidias-first-big-move-after-jensen-huangs-exit-targets-national-security/"],["OpenAI、医療事務をこなすコンピューター操作エージェント","OpenAIが、医療現場の事務作業を代行するコンピューター操作エージェントを発表した。GPT-6 Astraが電子カルテの画面を直接クリックして入力し、書類の送信やシステム間の情報転記を行う。医師が設計した325件のタスクのうち99%が安全と評価され、646件の評価の93%で「非常に役立つ」か「極めて役立つ」とされた。医療現場の事務負担は深刻で、AIによる代行への期待は大きいが、安全性の検証も欠かせない。","\n【概要】OpenAIが、医療現場の事務作業を代行するコンピューター操作エージェントを発表した。GPT-6 Astraが電子カルテの画面を直接クリックして入力し、書類の送信やシステム間の情報転記を行う。医師が設計した325件のタスクのうち99%が安全と評価され、646件の評価の93%で「非常に役立つ」か「極めて役立つ」とされた。画面を直接操作する方式のため、新しい連携を開発しなくても既存のシステムで使える点が利点だ。【背景】医療機関では、保険請求や紹介状、書類提出などの事務作業が医師や事務職員の大きな負担になっている。CVS Healthでは数か月分の書類送信の滞留を、週末のうちに解消できたという。Cignaでは10を超えるシステムを横断する作業を支援した。スタンフォード大学のHealthAdminBenchでは、Astraが94.3%、GPT-6 Lunaが91.8%の成績で、コストは98%減とされる。医師や事務職員の時間を事務作業から診療へ戻すことが、導入の大きな目的になっている。【詳細】このエージェントはAPIやChatGPT for Healthcare、ChatGPT for Cliniciansから利用できる。AbridgeやAmbienceといった医療向けの音声記録サービスとも連携する。HIPAAに対応し、承認の設定や監査ログも備えている。画面を直接操作するため、専用の連携がなくても既存のシステムで使えるのが特徴だ。監査ログが残ることで、エージェントの操作をあとから確認でき、問題が起きた際の追跡もしやすい。【ポイント・注意点】数値の多くはOpenAI自身の評価に基づくため、割り引いて読む必要がある。医療情報を扱う以上、誤操作のリスクや責任の所在も問われる。承認フローや監査ログがどこまで実務で機能するかは、導入現場の検証が欠かせない。とはいえ、事務負担の軽減は医療現場の切実な課題で、期待は大きい。導入を検討する医療機関は、承認フローや責任の所在を事前に整理しておくことが大切だ。","2026-11-17","AI Brief","https://dailyaibrief.com/news/openai-computer-use-agents-healthcare-workflows-IEzCnti4"],["AnthropicのIPO、需要は募集の約7倍に","AnthropicのIPOに対する需要が、募集株数の約7倍に達したとBloombergが報じた。募集は8億2500万株で、仮条件は70〜78ドル、最大で約644億ドルを調達する見込みだ。完全希薄化後の評価額は約1.4兆ドルとされる。価格決定は2026年11月18日、Nasdaqへの上場は11月19日の予定だ。AI企業の大型上場として市場の注目を集めており、上場後の株価の動きも関心を集めそうだ。","\n【概要】AnthropicのIPOに対する需要が、募集株数の約7倍に達したとBloombergが報じた。募集は8億2500万株で、仮条件は70〜78ドル、最大で約644億ドルを調達する見込みだ。完全希薄化後の評価額は約1.4兆ドルとされる。価格決定は2026年11月18日、Nasdaqへの上場は11月19日の予定だ。需要が募集の約7倍に達したことは、AI企業への投資家の関心の強さを物語っている。【背景】AI企業の大型IPOとして、市場の関心が集中している。Altimeter Capitalは50億ドルの注文を入れたとされ、同社として過去最大のIPO注文の5倍にあたる。また、AMD、Broadcom、Google、Micron、Microsoft、Nvidia、TSMCの7社が、IPO価格で合計260億ドルの同時私募を行うとされる。AIインフラを握る大手がそろって出資する構図だ。大手半導体企業などがそろって出資する構図は、AIの業界全体での結びつきの強さを示している。【詳細】募集株のうち新規発行は8億140万株、売り出しは2360万株とされる。需要が旺盛なため、仮条件の上限での価格決定も視野に入る。AnthropicはClaudeシリーズで知られ、企業向けAIの需要拡大を背景に急成長してきた。調達資金は研究開発やインフラ投資に充てられるとみられる。調達した資金は、モデルの研究開発や計算資源の確保に使われ、競争力の維持に充てられるとみられる。【ポイント・注意点】注文は拘束力のない意向表明であり、最終的な価格や割当てはこれから決まる。需要の7倍という数字は市場の熱気を示すが、実際の上場後の値動きは別問題だ。7社の同時私募は、AI業界の勢力図を映すものでもある。価格決定は11月18日とされているため、続報に注意したい。上場後は四半期ごとの業績開示が始まり、成長の持続性が厳しく問われることになる。上場を控え、価格決定の行方に市場の関心が集まっている。仮条件の上限での決定となれば、AI企業への期待の強さがさらに示されることになる。","2026-11-17","AI Agent Update","https://aiagentupdate.com/post/anthropic-ipo-book-7x-2026-11-17"],["Gemini Gemsが読取専用に、Skillsへ移行","GoogleのGeminiで、独自のAIアシスタントを作れる「Gems」が、2026年11月17日から読取専用になった。個人アカウントでは12月17日にGeminiアプリから削除され、Googleが自動で「Skills」として再作成するとしている。GemsからSkillsへの移行が本格化した。Gemsを使い込んできた利用者ほど、移行による変化の影響を受けやすく、事前の確認が欠かせない。","\n【概要】GoogleのGeminiで、独自のAIアシスタントを作れる「Gems」が、2026年11月17日から読取専用になった。個人アカウントでは12月17日にGeminiアプリから削除され、Googleが自動で「Skills」として再作成するとしている。GemsからSkillsへの移行が本格化した。自動でSkillsとして再作成されるとはいえ、使い勝手が変わるため、利用者は設定を見直す必要がある。【背景】Gemsは、特定の目的に特化したAIアシスタントを自分で作れる機能として提供されてきた。Googleは今後、再利用可能な指示やツール群である「Skills」に軸足を移す。Workspaceのビジネス版とエンタープライズ版は2027年3月、教育版は2027年6月に移行する。OpalやGoogle Labs製のGemsも今月中に終了する。GoogleはAIアシスタントの仕組みを整理し、再利用しやすいSkillsへ一本化する方針を進めている。【詳細】スキルはファイルが100MBまでで、同時に有効にできるのは100件までとされる。ただし、Create videoやCreate music、Canvas、Deep research、Guided learningなど、Gemsの一部にあった既定のツールは、Skillsでは当面使えない。GitHubや音声、動画、旧Office形式のファイル、アーカイブは移行の対象外となっている。移行の対象外となるファイル形式があるため、大切な資料は自分で保存しておくことが大切だ。【ポイント・注意点】Gemsを使い込んでいた人ほど、移行による機能の縮小を感じやすい。自動で再作成されるとはいえ、一部ツールが使えなくなる点は確認しておきたい。Workspace利用者は移行時期が異なるため、自分のアカウント種別を確認するとよい。移行の詳細はGoogleからの案内を待つ必要がある。Workspaceの利用者は移行時期が異なるため、自分のアカウント種別と移行の予定を確認しておきたい。","2026-11-17","AndroidPure","https://www.androidpure.com/gemini-gems-read-only-skills/"],["FBI、AIハッキングツール「Artex」に警告","米連邦捜査局（FBI）が、AIハッキングツール「Artex」の悪用について警告を出した。ArtexはオープンソースのLLM駆動型の自律ペネトレーションテスト枠組みで、標的の選定から特権の奪取まで3時間未満でこなした事例もあるという。2026年8月以降、金融や政府、防衛、半導体など幅広い分野で悪用が確認されている。攻撃の自動化が進む中、防御側の対策も急務となっており、組織の点検が求められている。","\n【概要】米連邦捜査局（FBI）が、AIハッキングツール「Artex」の悪用について警告を出した。ArtexはオープンソースのLLM駆動型の自律ペネトレーションテスト枠組みで、標的の選定から特権の奪取まで3時間未満でこなした事例もあるという。2026年8月以降、金融や政府、防衛、半導体など幅広い分野で悪用が確認されている。3時間足らずで侵入から特権奪取まで進む事例は、従来の攻撃と比べて対応の猶予が極めて短い。【背景】FBIは2026年11月13日付のFLASH勧告で注意を呼びかけた。韓国の金融機関では約6万8000人分の個人情報が流出する被害が出た。ConnectWiseの侵害では、顧客2250社を超えるMicrosoft 365環境に到達したとされ、Microsoftは中国系の関与をみている。Barracudaも被害を受けた。研究者は1600を超える公開Artexコンソールを発見したという。被害を受けた組織は幅広く、業種を問わず標的になりうることが今回の警告からうかがえる。【詳細】Artexは開発者のAutumn-27氏が2026年7月に公開した。10月にリポジトリを削除してクローズド化したが、旧版はすでに出回っている。もともとは正規のセキュリティテスト用に作られたが、攻撃者がそのまま悪用できる構造になっている。標的の調査、侵入、権限昇格までを自律的に進める点が、従来のツールと異なる。もともと正規のテスト用に作られた道具が悪用される構図は、オープンソースの難しさを示している。【ポイント・注意点】攻撃の自動化が進むと、防御側もAIによる監視や対応が欠かせなくなる。Artex自体はオープンソース由来のため、完全に流通を止めるのは難しい。企業や組織は、公開されている管理画面や不要な露出がないか点検することが大切だ。個人でも、利用するサービスのセキュリティ情報に目を向けておきたい。公開された管理画面が1600を超えて見つかったことは、設定の見直しがいかに大切かを物語っている。FBIの警告は、AIによる攻撃の自動化が現実の脅威になったことを示している。セキュリティ対策の見直しを促すきっかけとして、組織の点検が進むことが期待される。","2026-11-17","TechSpot","https://www.techspot.com/news/114579-fbi-hackers-using-autonomous-ai-tool-break-networks.html"],["iOS 27.3ベータ2、Siri AIに1日の利用上限","Appleが開発者向けに配信したiOS 27.3ベータ2で、SiriのAI機能に1日あたりの利用上限が設けられたことが分かった。サーバー側で処理されるSiri AIとApple Intelligenceが対象で、デバイスごとに無料枠が決まる。上限はiCloud+のプランによって引き上げられる。正式版は2026年12月に提供される見通しだ。AI機能の利用に上限が設けられることで、使い方や料金プランの見直しを迫られる人も出てきそうだ。","\n【概要】Appleが開発者向けに配信したiOS 27.3ベータ2で、SiriのAI機能に1日あたりの利用上限が設けられたことが分かった。サーバー側で処理されるSiri AIとApple Intelligenceが対象で、デバイスごとに無料枠が決まる。上限はiCloud+のプランによって引き上げられる。正式版は2026年12月に提供される見通しだ。無料枠の導入は、サーバー側の処理コストを管理し、持続可能な提供を続けるための措置とみられる。【背景】サーバー側で動くAI機能は処理コストがかかるため、無料枠を設けて利用量を管理する狙いがあるとみられる。上限はiCloud+の容量ごとに設定され、200GBで最大2倍、2TBで最大5倍、6TBで最大10倍、12TBで最大20倍まで引き上げられる。タイマーの設定など、端末内で完結する基本操作は対象外だ。iCloud+の容量が大きいほど上限が引き上げられる仕組みは、有料プランへの誘導にもつながっている。【詳細】同じベータには、iPhone Duoの顔認証や、Safariの「Ask About Page」、Siriによる健康データの回答といった新機能も含まれる。顔認証は外側ディスプレイのみで、Touch IDやパスコードとの併用が前提となり、約45分の非操作で無効化される。ベータ2は2026年11月16日に開発者向けに提供された。顔認証やSafariの新機能も同じベータに含まれており、iOS 27.3はAI関連の変更が多い版になりそうだ。【ポイント・注意点】上限の具体的な回数は明らかになっておらず、正式版でどうなるかは未定だ。無料枠を超えた場合の扱いもまだ分からない。iCloud+の上位プランほど上限が大きくなるため、AI機能をよく使う人はプランを見直すきっかけになるかもしれない。ベータ版の情報であり、正式版で変更される可能性もある。上限の具体的な回数や、超えた場合の扱いはまだ不明で、正式版の発表を待つ必要がある。サーバー側の処理コストを抑える狙いがあるとみられ、無料枠の導入は持続可能な提供のための措置といえる。ほかのAIサービスでも、同様の上限が設けられるかどうかが注目される。","2026-11-17","iThinkDiff","https://www.ithinkdiff.com/everything-new-in-ios-27-3-beta-2/"],["Gemini Notebook、資料から対話型サイトを生成","Googleが、Gemini Notebookで資料から対話型のサイトを作れる新機能を発表した。チャットに「make me a site」と入力して作りたいものを説明するだけで、周期表や年表などの学習用ビジュアル解説、四半期売上のダッシュボード、プロジェクト管理トラッカーなどが生成される。Webで全世界に順次提供が始まった。資料をもとに学べるサイトを作れることで、教育や業務の資料整理の手間が大きく減りそうだ。","\n【概要】Googleが、Gemini Notebookで資料から対話型のサイトを作れる新機能を発表した。チャットに「make me a site」と入力して作りたいものを説明するだけで、周期表や年表などの学習用ビジュアル解説、四半期売上のダッシュボード、プロジェクト管理トラッカーなどが生成される。Webで全世界に順次提供が始まった。生成されたサイトは共有できるため、チームでの資料共有や学習教材の配布にも使いやすい。【背景】NotebookLMは資料をもとに要約や音声解説を作るツールとして使われてきた。今回の新機能は、資料の内容をただ読むだけでなく、触って学べる形に変えるものだ。学習用の図解や業務のダッシュボードなど、用途は幅広い。18歳以上が対象で、Workspaceのアカウントも含まれる。モバイルアプリへの対応は近日中とされる。NotebookLMは資料の要約や音声解説で使われてきたが、今回は視覚的で触れる形への進化といえる。【詳細】生成されたサイトは共有もできる。資料の内容をもとにしているため、出典のある情報を視覚化できるのが特徴だ。周期表のように構造のある情報や、売上推移のような数値データを、対話的に表示できる。Googleの公式ブログで2026年11月16日に発表された。周期表や年表のように構造のある情報は、対話的な表示にすることで理解しやすくなる。【ポイント・注意点】資料にない内容をAIが補ってしまう可能性は常にあるため、生成されたサイトの内容は出典と照らし合わせて確認したい。共有する際は、資料に含まれる情報の扱いにも注意が必要だ。教育や業務の資料整理に便利な一方で、正確さの確認は人の手で続けることが大切だ。AIが資料にない内容を補うおそれもあるため、公開や共有の前に内容の確認を欠かさないようにしたい。今後、生成できるサイトの種類が増えたり、モバイルアプリに対応したりすれば、活用の場はさらに広がりそうだ。まずはWeb版で自分の資料を試してみるとよいだろう。今後の広がりにも期待したい。","2026-11-16","Google","https://blog.google/innovation-and-ai/products/gemini-notebook/interactive-sites/"],["サイバー防衛AIのCorma、評価額10億ドルに","サイバー防衛のAIスタートアップCormaが、シリーズAで1億2500万ドルを調達し、評価額が10億ドルに達した。NEAが主導し、SequoiaやKhosla、Coatueなども参加した。累計調達額は1億8500万ドルとなった。製品を公開してから約3か月でのユニコーン入りは、異例の速さだ。短期間でのユニコーン入りは異例の速さで、サイバー防衛AIへの期待の大きさを示している。","\n【概要】サイバー防衛のAIスタートアップCormaが、シリーズAで1億2500万ドルを調達し、評価額が10億ドルに達した。NEAが主導し、SequoiaやKhosla、Coatueなども参加した。累計調達額は1億8500万ドルとなった。製品を公開してから約3か月でのユニコーン入りは、異例の速さだ。脆弱性を自動で見つけ出す技術は、セキュリティ人材の不足を補う手段としても注目されている。【背景】Cormaは2026年8月にステルス状態を脱し、製品を公開した。10月21日にはPHPやNode.js、LiteLLMの脆弱性を相次いで開示し、セキュリティ業界の注目を集めた。AIが脆弱性を自動で見つけ出す技術への期待が高まる中、投資が集まった形だ。創業から短期間での大型調達が続いている。開示された脆弱性が業界の注目を集めたことが、投資家の関心を引き寄せるきっかけになった。【詳細】シリーズAの調達額1億2500万ドルは、サイバーセキュリティ分野のスタートアップとしては大型だ。既存投資家に加え、新規の投資家も参加した。資金は製品開発や人材採用に使われるとみられる。評価額10億ドルは、製品公開から約3か月での到達で、市場の期待の大きさを示している。資金は製品開発や人材採用に使われ、競合との差を広げるための投資が進むとみられる。【ポイント・注意点】短期間での評価額の急騰は、期待先行の面もある。脆弱性の自動発見は強力だが、誤検出や運用への組み込みが課題になることも多い。今後、実際の導入企業での成果が問われる。サイバー防衛AIの競争は激しくなっており、他社の動きと合わせて見ていきたい。今後は、導入企業での実績や誤検出の少なさが、評価を維持できるかどうかを左右しそうだ。サイバー防衛AIの競争は激しくなっており、他社の動きと合わせて見ていきたい。資金を活かして製品開発や人材採用を進められるかが、今後の成長を左右しそうだ。脆弱性の自動発見がどこまで実務で役立つか、導入現場の声にも注目したい。今後の実績にも注目したい。","2026-11-16","TechCrunch","https://techcrunch.com/2026/11/16/cybersecurity-ai-startup-corma-reaches-1b-valuation-in-about-3-months/"]],"gh-pop":[["モダンWebのスキル集、1日で1461スター獲得","ChromeやEdge、Firefox、MDNが監修するモダンWeb機能のスキル集「modern-web-guidance」が、1日で1461スターを集めてGitHubトレンド日次1位になった。262のガイドを収録し、CLIからコーディングエージェントに最新のベストプラクティスを渡せる。Web開発の現場で頼れる資料として注目されている。Webの仕様は次々と新しくなるため、エージェントに最新の知識を渡す仕組みが求められていた。","\n【概要】GoogleChromeの「modern-web-guidance」が、1日で1461スターを集めてGitHubトレンドの日次1位になった。Chrome、Edge、Firefox、MDNが監修するモダンWeb機能のスキル集で、262のガイドを収録している。2026年11月17日時点のスター数は21735で、ライセンスはApache-2.0だ。エージェントが古い書き方を提案する問題は、現場の開発者からも指摘されており、解決への期待が大きい。【背景】Webの仕様は次々と新しくなり、コーディングエージェントが古い書き方を提案してしまう問題があった。このスキル集は、エージェントに最新のベストプラクティスを渡すためのもので、ブラウザベンダーとMDNが監修している点が信頼の裏付けになっている。リポジトリは2026年3月23日に作られた。ブラウザベンダーとMDNが監修することで、ガイドの内容への信頼が高まっている。【詳細】CLIからはnpx modern-web-guidance@latest searchで検索し、retrieveでガイドを取り出し、legacy-scanで古い書き方を検出できる。エージェントはガイドを参照しながらコードを書くため、最新の仕様に沿った実装になりやすい。262のガイドはモダンなWeb機能を幅広くカバーしている。legacy-scanで古い書き方を検出できるため、既存のコードの見直しにも役立てられる。【ポイント・注意点】ブラウザベンダー自身が監修しているため、内容の正確さには期待できる。ただし、ガイドの更新が仕様の変化に追いつくかどうかは今後の運用次第だ。エージェントに頼る場合も、最終的な確認は人の目で行いたい。日本語のガイドはないため、英語での利用が前提になる。仕様の変化にガイドの更新が追いつくかが今後の鍵で、継続的な整備に注目したい。ブラウザベンダー自身が監修しているため、内容の正確さには期待できる。legacy-scanで古い書き方を検出 ートも付いているため、運用の見直しにも役立てられる。今後、対応するエージェントが増えれば、さらに使いやすくなりそうだ。今後の対応拡大にも期待したい。","2026-11-17","GitHub","https://github.com/Tencent/LoopForge"],["ハイブリッド型コードレビューCLI「open-code-review」","アリババの「open-code-review」が、24時間で764スターを集めている。決定論的なパイプラインとLLMエージェントを組み合わせたハイブリッド型のコードレビューCLIで、行レベルの正確な指摘を生成する。汎用エージェントと比べてトークン使用量が約9分の1だとしている。AIにレビューを任せると指摘があいまいになりがちで、正確さと効率の両立が課題になっていた。","\n【概要】アリババの「open-code-review」が、24時間で764スターを集めている。決定論的なパイプラインとLLMエージェントを組み合わせたハイブリッド型のコードレビューCLIで、行レベルの正確な指摘を生成する。2026年11月17日時点のスター数は53495で、ライセンスはApache-2.0、Go製、2026年5月18日に作られた。50リポジトリ、200件のPR、10言語でのベンチマークが実施されたとされ、検証の規模は大きい。【背景】コードレビューをAIに任せると、指摘があいまいだったり、トークンを大量に消費したりする問題があった。open-code-reviewは、ファイル選択や束ね、ルール照合といった決定論的な処理とLLMエージェントを組み合わせ、必要な部分だけをAIに見せることで、正確さと効率の両立を図った。決定論的な処理とLLMを組み合わせることで、必要な部分だけをAIに見せる設計になっている。【詳細】NPEやスレッド安全性、XSS、SQLインジェクションなどの多言語ルールセットを内蔵している。OpenAIやAnthropicと互換性がある。ベンチマークは50リポジトリ、200件のPR、10言語で実施されたとされる。最新リリースはv1.13.10で、2026年11月15日に出た。多言語のルールセットを内蔵しており、NPEやXSS、SQLインジェクションなどを幅広く検出できる。【ポイント・注意点】トークンが約9分の1という主張は、開発者側の計測に基づくため、自分の環境での検証が必要だ。ルールセットは便利だが、プロジェクト固有の規約には合わない場合もある。導入の際は、まず小さなリポジトリで指摘の質を確かめるとよい。トークン削減の主張は開発者側の計測に基づくため、自分の環境での検証が必要だ。ベンチマークは50リポジトリ、200件のPR、10言語で実施されたとされ、検証の規模は大きい。最新リリースはv1.13.10で、2026年11月15日に出たばかりだ。導入前に、自分の環境で指摘の質を確かめておきたい。","2026-11-17","GitHub","https://github.com/alibaba/open-code-review"],["Claude Code向けバグハンティング技能集「Claude-BugHunter」","Claude Code向けのバグハンティングと外部レッドチーム用のスキル集「Claude-BugHunter」が、GitHubトレンドで1位になった。83のスキルと15のスラッシュコマンド、681件の公開報告パターンを収録する。HackerOneの報告から抽出されたもので、24の脆弱性クラスをカバーしている。脆弱性の調査は知識と経験がものを言う分野で、調査の手順をエージェントに与える仕組みが求められていた。","\n【概要】Claude Code向けのバグハンティングと外部レッドチーム用のスキル集「Claude-BugHunter」が、GitHubトレンドで1位になった。83のスキルと15のスラッシュコマンド、681件の公開報告パターンを収録する。2026年11月17日時点のスター数は8469で、ライセンスはMIT、2026年5月5日に作られた。1日あたり1000スター増のペースでトレンド1位に入り、関心の高さが際立っている。【背景】脆弱性の調査は、知識と経験がものを言う分野だ。このスキル集はHackerOneに寄せられた公開報告からパターンを抽出し、24の脆弱性クラスに整理した。Claude Codeに読み込ませることで、調査の手順や着眼点をエージェントに与えられる。企業向けのIDや基盤攻撃のマトリクスも含まれている。HackerOneの公開報告から抽出されたパターンのため、実際の脆弱性の見つけ方を学ぶ資料にもなる。【詳細】1日あたり1000スター増のペースで
