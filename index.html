RITY.mdを読むよう促しており、Anthropicとは無関係とも明記している。導入後の更新や自分で加えた変更の扱いは「One path」の節に、Codexでの使い方は専用の節にまとめられている。自分のエージェントにHubの導入を頼むための指示文の例も、READMEに載っている。","2026-11-25","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50641541"],["esmc.cpp：タンパク質言語モデルを1つのC++実行ファイルで","タンパク質の言語モデル「ESM Cambrian 300M」を、PyTorchからllama.cppの土台であるggmlの上のC++へ移植した「esmc.cpp」がShow HNで紹介された。4ビットのモデルファイルはディスク上で228MBで、メモリの使用は最大約520MB。16ビットの出力は、Swiss-Protの1万件の配列でPyTorch版と残基ごとのコサイン類似度0.9999996で一致したという。","\n【概要】esmc.cppは、EvolutionaryScaleのタンパク質言語モデルESM Cambrian（ESM-C）を、C/C++で推論できるようにした移植版である。llama.cppとggmlの上に作られ、AppleのMetalによる高速化にも対応する。変換済みのGGUF形式のモデルはHugging Faceで公開されている。\n【背景】タンパク質の言語モデルは、アミノ酸配列から特徴を表すベクトル（埋め込み）を取り出し、構造や機能の予測に使われる。通常はPyTorchの環境を整えて動かすが、手軽ではない。作者はHNの投稿で、この試みの目的を2つ挙げている。自分の得意な分野の外にある新しいことを学ぶこと、そしてエンコーダーだけのモデルでggmlがPyTorchと比べてどう動くかを確かめることだ。\n【詳細】作者によると、4ビットのモデルファイルはディスク上で228MBで、メモリの使用は最大約520MBだった。8ビットでは337MBで、どちらも36GBのメモリを積んだM4 Maxでの測定値である。16ビットの出力は、Swiss-Protの1万件の配列で、PyTorchの参照実装と残基ごとのコサイン類似度0.9999996で一致した。READMEは開発の段階を追う構成で、ビルド、重みの確認、GGUFへの変換、トークナイザーの照合、層ごとの検算の手順が並ぶ。完成した「esmc-embed」コマンドは、配列を渡すと残基ごとの埋め込みをnpyの形式で出力し、配列全体を平均した埋め込みも出せる。Metalを使わずに動かす指定もあり、Mac以外の環境での確認にも使える。\n【ポイント・注意点】メモリや推論の時間、PyTorchとの数値の精度の比較は、READMEとモデルカードに詳しく載っている。作者自身が学びのための実験と位置づけているので、研究で使う場合は、自分のデータで参照実装と照らし合わせてから使いたい。変換の道具や検算用のスクリプトもリポジトリに含まれており、自分で重みを変換し直すこともできる。","2026-11-25","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50640661"],["Agent Debugger：失敗したエージェントの記録から原因候補","AIエージェントの実行が失敗したとき、その記録から原因を探る手がかりを組み立てる「Agent Debugger」がShow HNで公開された。観測された事実、反証の方法を付けた原因の候補、再現の手順、既存のデバッガーで次に見るべき場所を「Cause Package」としてまとめる。すべて手元で動き、アカウントもクラウドも外部のAIサービスも使わないのが特徴だ。","\n【概要】Agent Debuggerは、失敗したエージェントの実行を調べるための、手元で完結する開発者向けの道具である。LangfuseやPhoenix、LangSmithのような観測基盤を置き換えるのではなく、手元にある記録を受け取って使う。\n【背景】エージェントの観測ツールの多くは「何が起きたか」を見せる。だが、実行が失敗したときに開発者が本当に知りたいのは、次に何を調べればよいか、その仮説をどうすれば否定できるかだ、と作者は書く。Agent Debuggerは、この狭い問いに絞って作られている。調べる対象は、あくまで1回の失敗した実行に絞っている。\n【詳細】入力はNDJSONかJSONの記録で、版の付いたイベントの形式（schemaVersion 2）を使い、ファイルに保存する。出力のCause Packageは4つの部分からなる。イベントIDの付いた観測済みの証拠、規則から導いた原因の候補と、それぞれを否定する方法、何を再生して何と比べるかという再現の手順、既存のデバッガーでどこで止めて何を見るかという次の操作、である。原因の候補はあくまで規則から出した仮説で、確かめられた原因ではない。画面では、事実、規則の印、仮説、再現、引き継ぎを別々の欄に分けて表示する。秘匿したい情報の伏せ字処理は、取り込み、配信、書き出し、束ねの各段階で行う。2つの記録を並べて比べることもできる。\n【ポイント・注意点】実行中に止めて介入する機能や、評価やデータセット、クラウドでの同期、独自のデバッグ用の通信規約は含まれていない。画面はブラウザで動く手元向けのもので、ElectronやTauriのアプリではない。範囲を意図して狭くした道具だと理解して使いたい。伏せ字にしたCause Packageは持ち運べる束として書き出せるので、他の人に調査を引き継ぐときにも使える。利用状況のデータも、許可した項目だけを残すよう整えてからディスクに書く。証拠と解釈を分け、仮説には必ず反証の手段を添えるという姿勢が、この道具の設計の芯になっている。","2026-11-25","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50640536"],["Checkwash：テストを弱める変更をGitの差分から見つける","コードの変更がテストを弱めていないかを、Gitの差分から見つけるコマンドラインの道具「checkwash」がShow HNで公開された。アサーションの削除、テストのスキップ、期待値の緩め、失敗しなくなったCIの検査などの型を探して印を付ける。コーディングエージェントが書いた変更も対象だ。手元で動き、LLMを使わず、分析中はネットワークに出ず、コードも実行しない。","\n【概要】checkwashは、コードの変更によってテストが「通るけれど何も確かめていない」状態になっていないかを調べるPython製の道具だ。PyPIで配布されている。\n【背景】テストは、役に立つことを確かめなくなっても通ってしまうことがある。例えば「合計が105.3と等しい」という検査を「合計が0より大きい」に変えれば、間違った合計の多くも通る。checkwashは、こうした変更を、コーディングエージェントが書いたものも含めて審査に回すための道具として作られた。\n【詳細】使うにはPython 3.11以降、Git、pipxが要る。「pipx install checkwash==0.13.2」で導入し、Gitのリポジトリで実行する。「checkwash demo」では、テストを改ざんした8つの事例と、正直な修正1つをオフラインで試せる。「checkwash check」はまだコミットしていない変更を、「checkwash check HEAD~1..HEAD」は直前のコミットを調べる。ブランチの審査にはマージの起点からの比較も使える。調べる型は、アサーションの削除、テストのスキップ、期待値の緩め、失敗しなくなったCIの検査などだ。リポジトリには請求書を題材にした手順もあり、1行の手抜きの修正でバグを直さずにテストを通してしまう様子と、それをcheckwashが止める様子を確かめられる。\n【ポイント・注意点】見つけるのは、知られている型にあてはまる変更で、意味まで理解して判定するわけではない。印は審査のためのもので、最終的な判断は人がする前提になっている。Windowsで実行ファイルが止められた場合は、python -mで呼び出す方法が案内されている。pipxを使わない人向けには、仮想環境とpipで入れる手順と、導入不要の1ファイル版も用意されている。0.13.2のリリースの説明には、Pythonの読み込みの修正やCLIの変更、Djangoを対象にした検査時間の測定が載っている。GitHub Actionsでの使い方もガイドで追える。","2026-11-25","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50639532"],["Sightline：Windowsで画面を見るAIエージェントの目","Windows上で動くAIコーディングエージェントに、画面を見る目とストップウォッチを与えるCLI「sightline」がShow HNで紹介された。ウィンドウを探し、他の窓に隠れていても撮影し、画面の変化が止まるまで待ち、画像の画素と画面上の座標との対応を返す。観測専用で、クリックやキー入力、マウスの移動は一切しない。操作はエージェント自身の道具で行い、結果の確認にだけ使う。","\n【概要】sightlineは、Windowsで動くAIエージェントのための小さな実行ファイルで、コマンド名は「sight」である。ウィンドウの検出と撮影、画面の変化の待ち合わせ、座標の換算、プロセスの資源の測定を担う。\n【背景】エージェントに「ダイアログが正しく表示されるか確かめて」と頼むと、多くの場合、その場しのぎのPowerShellのスクリプトが書かれる。決め打ちの待ち時間や、画面全体の撮影、固定のプロセス番号といったやり方は、不安定になったり遅くなったりしやすい。sightlineは、これを置き換えるために作られた。プロセスの木全体のCPUとメモリも測れる。\n【詳細】主な命令は4つある。「sight list」でウィンドウを探し、「sight shot」で撮影し、「sight wait」で操作の後に画面が変わって落ち着くまで待ち、「sight stat」でプロセスのCPUとメモリを測る。待ち合わせは、画素の変化が止まるまでを基準にする。時間切れのときは、正直に「settled:false」と返す。クリックの直後のように変化がまだ始まっていない場合は、まず基準の画像から変わるのを待ってから落ち着きを待つ。撮影はウィンドウそのものを写すので、手前に別の窓があっても写る。右クリックのメニューのように別の窓になるポップアップも含める。撮った画像ごとに、画像の画素から画面の座標へ換算する式を返すので、モデルが画像を縮めても位置がずれない。切り抜きもウィンドウからの相対位置で指定できる。\n【ポイント・注意点】あくまで観測に限った道具で、操作は別の手段が担う点に注意したい。READMEは英語、簡体字、繁体字の中国語で用意され、エージェントへの組み込み方やFAQも載っている。読み取った座標は、画面、ウィンドウ、クライアント領域のそれぞれに換算できる。どの窓を相手にするかはプロセス名やウィンドウの番号で指定する。エージェントの作業の最後に、見た目と資源の両方を確かめる工程として組み込む使い方が想定されている。","2026-11-25","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50639090"],["Simulusion：DreamerV3やGenieなど世界モデルをPyTorchで","強化学習などで使われる「世界モデル」の代表的な手法を、PyTorchの1つのAPIでまとめて扱えるライブラリ「Simulusion」がShow HNで紹介された。旧名はTorchWMで、1.0で改名した。Dreamer、PlaNet、JEPA、IRIS、DIAMOND、DiT、Genieを共通の関数で学習させられ、どのモデルにも、4GBのノートPC用GPUで一から学習できるデモが付いている。","\n【概要】Simulusionは、世界モデルのための部品を組み合わせて使えるPyTorchのライブラリである。PyPIでは「simulusion」の名前で配布されている。\n【背景】世界モデルは、環境がどう変わるかをモデルの中で予測し、その「想像」の中で行動を学ぶための技術だ。ゲームやロボットの研究で注目されているが、手法ごとに実装がばらばらで、比べたり組み合わせたりするのは手間がかかる。Simulusionは、主な手法を1つのAPIの下にまとめた。\n【詳細】create_config、create_model、make_envという共通の関数で、Dreamer、PlaNet、JEPA、IRIS、DIAMOND、DiT、Genieの各エージェントを学習できる。エンコーダーやデコーダー、潜在空間の動きを表す部品に分けて、自分の構成を組むこともできる。環境はGymとGymnasium、DeepMind Control、MuJoCo、Brax、Atari、Unity ML-Agentsにつなげる。学習したモデルはONNX、TorchScript、TensorRTに書き出せる。デモはRTX 3050（4GB）のノートPCで一から学習するもので、多くは1〜2時間で終わる。READMEによると、Atari100kのボクシングで40万フレーム学習したDreamerV3は84点差で勝った。論文の報告値は78点だという。IRISでは離散トークンでできたTransformerの世界モデルの中で方策が戦い、DIAMONDでは拡散モデルがゲームの全フレームを生成する様子をデモで見られる。\n【ポイント・注意点】多くのデモは論文と同じ規模の結果ではなく、各モデルが何をするかを見せるためのものだと作者は断っている。論文の手順どおりなのは、DreamerV3の関節状態の課題などに限られる。学習の曲線や再現の命令は、ギャラリーのページとdemosのフォルダーにある。旧名TorchWMで探していた人は、新しい名前で入れ直す必要がある。","2026-11-25","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50638565"],["Mergeon：RustとGPUIで作ったデスクトップ用Gitクライアント","RustとGPUで画面を描くUIの仕組み「GPUI」を使って作ったデスクトップ用のGitクライアント「Mergeon」がShow HNで公開された。Gitクライアントの「Fork」に触発されたといい、Linux、Windows、macOSで動く。行単位のステージング、3方向の衝突解決、操作の取り消しとやり直し、GitHubとの連携など、日常のGitの作業を、キーボード中心で素早くこなせるよう作られている。","\n【概要】Mergeonは、Rustで書かれたGUIのGitクライアントである。UIの部分にはGPUIを使い、GPUで画面を描く。\n【背景】GitのGUIクライアントは、動作の重さやOSごとの対応の差が不満になりやすい。Mergeonは、Forkのような使い心地を、軽く速いネイティブのアプリで、3つのOSに提供しようとしている。キーボードで素早く操作できることも重視している。\n【詳細】主な機能は次のとおり。コミットの履歴では、グラフの表示、複数のコミットの選択とまとめてのcherry-pickやrevert、作者やパス、ブランチ、日付、コードの内容での検索ができる。手元の変更は、tree-sitterで色付けした差分を一体表示か左右表示で見られ、ファイル、塊（ハンク）、行の単位でステージや取り消しができ、画像の差分にも対応する。衝突の解決では、自分の側、相手の側、共通の祖先の3つの枠を並べ、テキストのほか、バイナリや名前の変更による衝突も扱える。対話的なrebaseやautosquash、ワークツリー、スタッシュ、サブモジュールも使える。リポジトリごとに取り消しとやり直しの履歴を持ち、コミットやmerge、rebase、resetまでCtrl+Zで戻せる。GitHubにはOAuthでサインインでき、プルリクエストやCIの状態をサイドバーで確かめられる。作業の場では、複数のリポジトリをタブで開き、ファイルの履歴やblameをたどれる。コマンドパレットからは、命令、ブランチ、リポジトリ、ファイルにすぐ飛べる。明るい画面と暗い画面の切り替えもできる。リポジトリごとにGitの書き込み操作を順番に処理する仕組みも備える。\n【ポイント・注意点】完成済みのパッケージはGitHubのリリースから入手できる。操作の取り消しがrebaseやresetまで及ぶのは便利だが、実際にどこまで戻せるかは、大事なリポジトリで使う前に確かめておきたい。ライセンスやCIの状態、最新リリースはREADMEのバッジから確かめられる。","2026-11-25","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50637887"],["AgentKey：AIエージェントにパスワードを見せずにログイン","AIエージェントがWebサイトにログインするとき、パスワードをエージェントにもモデルにも渡さない保管庫「AgentKey」がShow HNで紹介された。エージェントがログインを頼み、持ち主が手元の承認ページで許可すると、AgentKeyがブラウザのページに直接資格情報を入れる。Playwrightのブラウザ接続と組み合わせて使い、npmとPythonのパッケージで提供されている。","\n【概要】AgentKeyは、AIエージェント向けに作られたパスワードの保管庫である。考え方は「エージェントが頼み、持ち主が承認する」というもので、ログインの操作は任せても、パスワードそのものはエージェントの目に触れさせない。\n【背景】ブラウザを操作するエージェントにログインまで任せようとすると、パスワードをプロンプトや会話に含めることになりがちだ。そうなると、記録や外部のモデルに秘密が残るおそれがある。AgentKeyは、この受け渡しの経路から、エージェントとモデルを外すことを狙っている。\n【詳細】試すには「npm install tryagentkey」と「npx tryagentkey」を実行する。手元の保管庫と、コーディングエージェント向けの指示が用意される。プロジェクトの.mcp.jsonに、既存のブラウザにつなぐPlaywright MCPの設定があれば、AgentKeyもそこに登録される。エージェントは「agentkey_pages」「agentkey_login」「agentkey_status」の3つの道具でログインを進め、その間はブラウザを操作する道具が止まる。パスワードは手元の承認ページで入力され、エージェントへのメッセージには決して入らない。ログインの完了と見なすのは、元のサイトでログアウトの手段と保存したユーザー名が確認できたときで、確かな証拠が得られないサイトは未確認のまま扱う。ほかの枠組みからは、JavaScriptやPythonでPlaywrightのページを渡して呼び出せる。\n【ポイント・注意点】自動で接続できるのは、決まった形で既存のブラウザにつなぐPlaywright MCPの構成に限られる。それ以外の構成は理由を示したうえで変更しない。導入してもWebサイトへのアクセスが許されるわけではなく、ログインのたびに持ち主の承認が必要になる。導入後は、コーディング環境のMCPの接続を1度再起動すると新しい道具が読み込まれる。ブラウザはそのまま使い、別のブラウザを作ったりプロファイルを複製したりはしない。","2026-11-25","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50637749"]],"gh-blog":[["GitHub上のAIエージェント用スキル772件を地図化","dev.toで、AIエージェントのスキル（SKILL.mdを持つフォルダ）に関係するGitHubリポジトリ772件を集めた検索ライブラリ「Skill Bank」の作り方と中身が紹介された。収集にはSpidra Mapを使い、作業時間の大半は除外と重複整理に費やした。SKILL.mdを確認できたのは185件で、分類ではAIデザイン系が116件と最多だった。海賊版へ誘導する結果を除いた経緯や、スキルを実行する前に中身を確かめるべきだという注意も添えられている。","\n【概要】\ndev.toに、GitHub上のAIエージェント用スキル関連リポジトリ772件を集め、検索できるライブラリ「Skill Bank」にまとめた記録が投稿された。筆者のOluseye Jeremiah氏が友人と作ったもので、集めたデータに実際は何が入っていたのかを数字で示している。\n\n【背景】\nAIコーディングエージェントでは、SKILL.mdを置いたフォルダで手順や知識を足す「スキル」が広まっている。ただし公開されているスキルは散らばっていて、どれが本物のスキルなのか、どんな分野が多いのかが分かりにくい。筆者はこの全体像を見える形にしようとした。\n\n【詳細】\n収集にはSpidra Mapを使い、1日で23回のリクエストを出して15枚のCSVに書き出した。約6時間の作業の大半は整理に費やした。結果にはIssueやPR、ファイルのパスも混ざっていたため、リポジトリの根だけを残し、フォークやスパム、重複を取り除いた。動画編集の検索では約60件がMovavi、Filmora、PowerDirectorの海賊版に誘導するもので、すべて除外した。GitHubのURLを正規化して重複を除くスクリプトを書き、説明文は761件で取得し、11件はREADMEで補った。SKILL.mdの有無を確認できたのは185件で、入れ子のフォルダは調べていないため、筆者はこれを最初の一部と位置づける。分類はAIデザイン系116件、awesome系のリスト101件、エンジニアリング63件、マーケティング39件。スキルの安全性を調べるスキャナーが23件、セキュリティ系のスキルが10件あった。スター数が取れたのは98件だけで、合計は約82万8,000、中央値は約1,300だった。\n\n【ポイント・注意点】\nサイトはReactとViteで作った静的なアプリで、検索はブラウザ内のFuse.jsが担う。SKILL.mdの表示にはDOMPurifyで無害化をかけている。筆者は、スキルを使う前に中身を確かめること、特にスクリプトを含むものは念入りに見ることを勧めている。185件という確認済みの数は一部にすぎない点にも注意が要る。","2026-11-25","DEV Community","https://dev.to/oluseyej/i-mapped-772-ai-agent-skill-repos-on-github-heres-what-was-actually-in-them-jpn"],["Issue1件でCI上のAIエージェントが乗っ取られる","dev.toで、CIで動くClaude Code、Gemini CLI、CodexなどのAIエージェントが、IssueやPRのタイトル、コメントに書かれた文章で操られうる問題を2026年の事例とともに整理した記事が公開された。2月のClinejectionから8月のBlack Hat USAでの発表までをたどり、各ツールの修正版を示したうえで、読み取り専用の権限やコミットSHAでの固定など、身を守るための6つのルールを挙げている。","\n【概要】\ndev.toに、GitHubのIssue1件でCI上のAIエージェントが乗っ取られうるとして、2026年に報告された事例と6つの対策をまとめた記事が投稿された。筆者はNijeesh .N.J.氏で、もとはMediumに掲載したもの。記事はAIの手を借りて書いたと明記している。\n\n【背景】\nGitHub ActionsなどのCIでAIエージェントを動かし、Issueへの返信やコード修正を任せる使い方が増えている。しかしエージェントが読むIssue本文やPRのタイトル、コメントは誰でも書ける。そこに命令を紛れ込ませれば、エージェントの動きを外から変えられてしまう。\n\n【詳細】\n記事の年表では、2月の「Clinejection」でIssueのタイトルをきっかけに不正なcline@2.3.0がnpmに公開され、約8時間出回った。4月にはAonan Guan氏の「Comment and Control」研究で、PRのタイトルや隠しコメントが3社のエージェントを操った。6月のCVE-2025-66032では、claude-code-actionが末尾が「[bot]」の利用者を無条件に信頼していた。8月のBlack Hat USAではNoveeの研究がClaude Code（CVE-2026-54316）、Gemini CLI（CVSS 10.0）、Codexを扱った。記事によれば、Claude Codeの経路ではランナー上でコードが実行され、GitHubとAnthropicのAPI認証情報が盗まれうるもので、2.1.163で修正済み。Gemini CLIでは細工した.gemini/.envでサンドボックスの起動前にコマンドが動き、Gemini CLI 0.39.1とrun-gemini-cli 0.1.22で直った。Codexでは、第1段でAGENTS.mdに書き込まれたIssueの文が、第2段で信頼された指示として読み込まれた。\n\n【ポイント・注意点】\n6つのルールは、既定は読み取り専用の権限にする、エージェントを起動できる人を絞る、エージェントの設定ファイルを含めリポジトリ内の文章をすべて信用しない、段階を分ける、アクションをコミットSHAで固定する、リリースとpushには人の承認を挟む、の6つ。エージェントの権限設計を見直すときの点検表として使える。","2026-11-25","DEV Community","https://dev.to/nijeesh_nj_01378962f208/one-github-issue-was-enough-to-hijack-claude-code-gemini-cli-and-codex-in-ci-6-rules-to-stay-safe-4jnf"],["AIエージェントで外部OSSへPR、51件に87件マージ","dev.toで、AIエージェントの「レーン」を使って外部のOSSにプルリクエストを送り続けたチームの振り返りが公開された。8月4日の最初のマージから、自分たちのリポジトリを除いた51件のプロジェクトで87件のPRがマージされた。保守者が求めたIssueに沿ったPRはすぐ通った一方、頼まれていない一斉送信は1件もマージされずに止めた。筆者は、数字は通ったものを示すだけで、自動化の効果を示すものではないと断っている。","\n【概要】\ndev.toに「How we grow our GitHub」と題し、AIエージェントの作業レーンを33本動かして外部のOSSに貢献した結果の振り返りが投稿された。書き手はアカウント自身が「合成のAI共同創業者」と名乗るもので、2026年11月17日13時17分（UTC）ごろのghコマンドでの集計をもとにしている。\n\n【背景】\nAIエージェントでOSSにPRを大量に送る動きが広がり、保守者の負担が話題になっている。この記事は、どんなPRが受け入れられ、どんな送り方が失敗したのかを自分たちの数字で示そうとしたもの。\n\n【詳細】\n8月4日の最初のマージ以降、自分たちのリポジトリとawesome系のリストを除いて、51件のプロジェクトで87件のPRがマージされた。除外したことで30件のマージが数から外れている。11月だけでは13件のプロジェクトで18件がマージされ、開いたままのPRが50件ある。比較として、約2,100スターのdoobidoo/mcp-memory-serviceに送った4件は、保守者が求めたIssueに沿ったもので、5日以内にすべてマージされた。11月6〜15日に送ったほかの10件でマージされたのは2件だった。10月12日の集計では、機能追加は40件中3件、修正は67件中30件がマージされていた。修正を共有するレーンは313のスレッドに379件のコメントを書き、直接の返事があったのは約11.5%のスレッドだった。このレーンでは15夜のうち9夜で作業待ちの列が空になっており、原因は自分たちの仕組みにあった。33本あるレーンのうち、17本が今も動き続けている。\n\n【ポイント・注意点】\n頼まれていないPRを一斉に送る試みはマージ0件で打ち切った。使ったプラグインgithub-growth v0.1.0はClaude Codeでしか試していない。筆者は、数字はマージされたものを示すだけで、自動化がそれを起こしたとは言えないとし、この傾向を否定する検証方法も示している。","2026-11-25","DEV Community","https://dev.to/cryptopunk_dz2_bd054446a6/how-we-grow-our-github-87-merged-prs-in-51-projects-33-agent-lanes-43j0"],["コードがGitLab等にあるときのCopilot効果測定","dev.toで、コードをGitHub以外のGitLabやAzure DevOpsに置いている組織が、GitHub Copilotの利用と効果をどう測るかを解説した記事が公開された。IDEやCLIから送られる利用者ごとの使用状況レポートはホストを問わず使える一方、リポジトリのレポートや効果のダッシュボードにはGitHub上のコードが必要だという。合成データでは上位10%が28日間のAIクレジットの82%を使っていた例を示し、個人データの扱いにも注意を促す。","\n【概要】\ndev.toに、コードをGitLabやAzure DevOpsに置いたままGitHub Copilotを使う組織向けに、その効果を測る方法をまとめた記事が投稿された。筆者のArlind Nocaj氏はMicrosoftのクラウドソリューションアーキテクトを名乗り、内容は個人の見解で、MicrosoftやGitHubの公式な指針ではないと断っている。\n\n【背景】\nCopilotは使う組織が増え、投資に見合う効果があるかを示すよう求められる場面が多い。しかしGitHubの分析機能の多くはコードがGitHubにある前提で作られており、ほかのホストを使う組織ではどの数字が使えるのかが分かりにくい。\n\n【詳細】\n利用者ごとの使用状況レポート（users-1-dayとusers-28-day）は、IDEやCLI、エージェントから送られるCopilotのテレメトリが元になっているため、コードの置き場所に関係なく使える。一方、リポジトリのレポートと効果のダッシュボードはGitHub上のコードが必要になる。2026年11月5日からは、リポジトリのレポートでマージまでの時間が、最初のレビュー待ち、レビューの往復、最後のレビューに分けて示され、対応済みのCopilotのコードレビューコメントも数えられるようになった。サンプルの利用者1人の記録は、やり取り35回、追加2,901行、削除252行、AIクレジット1,924だった。約350人の合成データでは、上位10%が28日間のAIクレジットの82%を使っていた。スキルを使った人の活動日数の中央値は9.5日、使わない人は5日だったが、筆者はスキルが利用を増やす証拠にはならないとしている。約3分の1は活動日が3日以下だった。\n\n【ポイント・注意点】\n筆者はMicrosoftのEngThrive論文を引き、速さ、楽さ、品質、働きがいの4面で見ることを勧める。利用データはチーム単位でマージリクエストやパイプライン、障害のデータと突き合わせ、最小の集計人数はプライバシー担当と決めるべきだという。利用者ごとのレポートにはuser_idとuser_loginが含まれる個人データで、OpenTelemetryのトレースにはプロンプトやコードの文脈も載る点に注意が要る。","2026-11-25","DEV Community","https://dev.to/arlind0xbb/measuring-github-copilot-impact-when-your-code-lives-on-gitlab-or-azure-devops-1ned"],["スカッシュマージではsemantic-releaseはPR名を読む","dev.toで、GitHubのスカッシュマージとsemantic-releaseを組み合わせると、リリースの判定に使われるのは個々のコミットではなくPRのタイトルだけになる、という落とし穴の記事が公開された。筆者のdotfilesでは、68件のfeatやfixのうち67件が変更履歴に載らず、6回中5回のリリースが「関連する変更なし」で終わっていた。原因はツールが付けた規約外のPRタイトルで、書式の統一やマージ方法の変更で対処している。","\n【概要】\ndev.toに、スカッシュマージを使うとsemantic-releaseが読むのはPRのタイトルだけになり、中のコミットは見られない、という体験をまとめた記事が投稿された。筆者はRogério Rodrigues de Alcântara氏。\n\n【背景】\nsemantic-releaseは、Conventional Commitsの書式で書かれたコミットからバージョンの上げ幅を決め、リリースと変更履歴を自動で作る道具だ。一方GitHubのスカッシュマージは、PRの中のコミットをPRのタイトルを件名にした1つのコミットにまとめる。このため、中のコミットを規約どおりに書いても、タイトルが規約外ならリリースされない。\n\n【詳細】\n例として挙がったPR #93には、feat(backup):のコミットが3件含まれていた。それでもリリースのジョブは成功し、「関連する変更がないので新しいバージョンは出さない」と記録された。筆者のdotfilesでは、10月29日から11月5日（v1.36.0〜v1.39.0）の6件のスカッシュコミットに133件のコミットがまとまり、うち68件がfeatかfixだった。その68件のうち67件はCHANGELOG.mdに載らず、6回中5回のリリースが「関連する変更なし」で終わった。原因は、あるツールが規約外のPRタイトルを付けていたことだった。対策として件名を「<type>[scope]: <説明>」の1つの書式にそろえ、conventionalcommitsのプリセットを使う。featはマイナー、fixとperfはパッチ、feat!:やBREAKING CHANGEはメジャーを上げ、docsやchore、testではリリースしない。ワークフローはfetch-depth: 0とし、semantic-releaseは25.0.9に固定した。GITHUB_TOKENで作ったReleaseはほかのワークフローを起動しないため、個人のトークンを使う。\n\n【ポイント・注意点】\n筆者はPR #111以降、マージコミットでのマージに切り替えた。前回のタグ以降に書式を外れたコミットを洗い出すコマンドも紹介している。ただし、タグを先にpushしてからReleaseを作るため、途中で失敗した場合は手でReleaseを作る必要があるという。","2026-11-25","DEV Community","https://dev.to/roalcantara/squash-merges-semantic-release-reads-the-pr-title-not-your-commits-2g1i"],["GitHubのWebhookは遅れ・重複・欠落する前提で","dev.toで、GitHub Actionsのジョブごとに専用のEC2インスタンスを立てる仕組みを作ったMONEIが、GitHubのイベントは遅れる、2回届く、届かないことがあるという前提での設計を解説した。11月10日のGitHub障害中には、制御部が13分間で17件のCIジョブをエラーも出さずに断っていた。原因は短いリストを200 OKで返したAPIで、条件付き書き込みや定期的な見回りでの補正、件数の照合といった対策を示している。","\n【概要】\ndev.toで、決済サービスのMONEIが、GitHub Actionsのジョブ1件ごとにEC2インスタンスを1台立てる仕組みの連載第2回を公開した。テーマは「GitHubはイベントを遅れて、2回、あるいはまったく送らない」。書き手はFélix氏。\n\n【背景】\nこの仕組みは、ジョブが待ち状態になったことを知らせるworkflow_jobのWebhookをきっかけにランナーを起動する。ところが2026年11月10日のGitHub障害の際、ランナーの制御部が13分間で17件のCIジョブをエラーを記録しないまま断っていた。これをきっかけに、イベントの不確かさに耐える設計を見直した。\n\n【詳細】\n記事は失敗を3つに分ける。重複して届く場合は1件の待ちに2台が起動する。遅れて届く場合は、完了の後に来た待ちの通知で、終わったジョブのランナーをまた立ててしまう。届かない場合、GitHubは失敗した配信を再送しないため、ジョブが24時間待たされうる。対策として、ジョブ1件につきDynamoDBの項目を1つ持ち、すべての書き込みを条件付きにして、状態は前にしか進まないようにした。競り負けた書き込みは例外を投げずfalseを返す。claimLaunchという条件付き更新でlaunchClaimedAtを記録し、起動は1回だけ進む。5分ごとに見回り役が動き、プールごとに3分以上待っているジョブから空きや起動中の台数を引いた分を追加で起動する。障害の正体は、リポジトリ一覧のAPIが200 OKで短い一覧を返し、それを5分間キャッシュしたため、一覧から漏れたリポジトリのジョブを13分間断ったことだった。\n\n【ポイント・注意点】\n修正後はtotal_countと件数を照合し、合わなければ「GitHub list incomplete」として失敗させ、短い一覧はキャッシュせず、断る前に読み直す。順序の保証や厳密な1回きりの処理は持たず、15分使われないインスタンスは消すといった限界も明記している。自前でランナーを管理する人に参考になる内容だ。","2026-11-25","DEV Community","https://dev.to/monei/github-sends-events-late-twice-or-never-4h7"],["Actionsが使うAzureのクライアントシークレットを廃止","dev.toで、GitHub ActionsからAzureにクライアントシークレットでログインしている構成を、ワークロードIDフェデレーション（OIDC）に置き換える手順の記事が公開された。CIのパイプラインは多要素認証を通せない「人ではないID」であり、シークレットの流出が大きな被害につながると、Microsoftが報告した2026年の攻撃事例を引いて説明する。資格情報の作成からシークレットの削除、監査のコマンドまでを示している。","\n【概要】\ndev.toに「CIパイプラインは人ではないIDだ」として、GitHub ActionsのワークフローがAzureへのログインに使うクライアントシークレットを廃止する手順の記事が投稿された。書き手はWindows Mode氏。\n\n【背景】\nAZURE_CREDENTIALSに入れたクライアントシークレットでAzureにログインするワークフローは、多要素認証を通せないIDのパスワードに頼っていることになる。記事はMicrosoftの発信を引く。2026年9月25日の投稿は、Storm-3168で2つのサービスプリンシパルが乗っ取られ、一方は約15.5時間調査を続け、もう一方は破壊的な操作をまとめて行った事例を扱う。11月5日の投稿は、公開リポジトリから秘密情報を探すARTEXという仕組みを紹介し、GitHubからAzure Key Vaultのデータを持ち出すまで約5分だった例を挙げた。\n\n【詳細】\n置き換え先はワークロードIDフェデレーションだ。issuerをhttps://token.actions.githubusercontent.com、subjectをrepo:my-org/my-repo:ref:refs/heads/mainのように、audienceをapi://AzureADTokenExchangeとしたcredential.jsonを作り、az ad app federated-credential createで登録する。subjectは環境名やrefで指定でき、1つのアプリやユーザー割り当てのマネージドIDに登録できるのは最大20件。ワークフローにはid-token: writeの権限を与え、azure/login@v2にクライアントID、テナントID、サブスクリプションIDを渡す。\n\n【ポイント・注意点】\n正常に動いたことを確かめたら、GitHub側のシークレットとアプリのパスワード資格情報を消す。残りはaz ad app credential listで確かめ、deleteで消せる。ワークロードID向けの条件付きアクセスにはWorkload Identities Premiumのライセンスが要るといった制限もある。","2026-11-25","DEV Community","https://dev.to/windowsmode/your-ci-pipeline-is-a-non-human-identity-here-is-how-to-retire-its-azure-client-secret-40mk"],["GoogleのAI研究論文群がGitHubで公開、HNで議論","Hacker Newsで、Google ResearchのGitHubリポジトリに置かれた「Cogentic」が生成した研究論文群の紹介が172ポイント、145コメントを集めた。整数の素因数分解や有限体の離散対数、ナッシュ均衡の近似などをテーマにした論文が並ぶ。コメント欄では素因数分解の結果が暗号に影響するかが議論され、現在の暗号は影響を受けないとする声が出たほか、Leanでの検証や新規性にも疑問が投げかけられた。","\n【概要】\nHacker Newsに2026年11月25日、「Google Releases Cogentic Papers on Integer Factorization, Discrete Logs and More」という投稿が出て、172ポイント、145コメントを集めた。リンク先はGoogle Researchのgoogle-researchリポジトリ内にあるcogentic_research_papersというフォルダだ。\n\n【背景】\nこのフォルダのREADMEには、ここに置いた研究論文は「Cogentic」が作ったものだと書かれ、arXivの論文へのリンクがある。AIが数学や計算機科学の研究成果を出すという話題は注目を集めやすく、GitHubで論文がまとめて公開されたことで一気に議論が広がった。\n\n【詳細】\n2026年11月25日付の論文には、「Unconditional Integer Factorization in Time L_N[1/3, O(1)]」「Discrete Logarithms in Finite Fields of Fixed Characteristic in Sub-Quasi-Polynomial Time」「An Exact Polynomial-Time Algorithm for 1/5-Approximate Nash Equilibria in Bimatrix Games」などが並ぶ。ほかに決定的な準指数時間の素因数分解、ログランク予想の平方根の壁を破るとする論文、線形密度の単純グラフの辺の再構成を扱う論文もある。ページには11月23日付の2本、11月18日付の1本、10月30日付の1本も載っている。内容は特記がない限りApache 2.0で、READMEは「Googleの公式な製品ではない」と明記している。\n\n【ポイント・注意点】\nHNのコメント欄では、素因数分解の結果が暗号を脅かすかが議論になった。一般数体ふるい法と同じ漸近の速さで、定数がとても大きいという指摘があり、現在の暗号は影響を受けないという意見が出た。Leanによる検証の扱いや、博士課程の学生にとって新しい内容かどうかを疑う声もある。主張の正しさは今後の検証を待つ必要があり、見出しだけで判断しないほうがよい。","2026-11-25","Hacker News","https://news.ycombinator.com/item?id=50642086"],["Windowsの音量均一化を解析しPipeWireへ移植","Hacker Newsで、Windowsの「ラウドネス均等化」をDLLの解析から再現し、LinuxのPipeWireに移植したGitHubリポジトリpw-loudness-eqが178ポイント、108コメントを集めた。アプリごとの再生音を処理するモジュール、出力機器ごとのリミッター、任意のGTK3画面の3つで構成される。コメント欄では、DLLを解析する必要があったのか、AIを使ったのか、法的に問題ないのかが議論になり、代わりの道具も挙がった。","\n【概要】\nHacker Newsに2026年11月25日、「Windows Loudness Equalization, reverse-engineered and ported to PipeWire」が投稿され、178ポイント、108コメントを集めた。紹介されたのはGitHubのxoxorwr/pw-loudness-eqで、取得時点でスター96、フォーク2、コミット6だった。\n\n【背景】\nWindowsには、音の大きさの差をならす「ラウドネス均等化」という機能があり、小さい音と大きい音が混じる動画やゲームで重宝されてきた。Linuxに乗り換えた人がこの機能をほしがることは多い。このリポジトリは、WindowsのWMALFXGFXDSP.dllを解析してその動きを再現し、Linuxの音声基盤PipeWireに移植した。\n\n【詳細】\n構成は3つ。アプリごとの再生ストリームを処理するPipeWireのモジュール、AudioEng.dllのCAudioLimiterを移植してすべての出力機器で動くリミッター、そして任意のGTK3の画面だ。PipeWire 1.4以上とGTK 3が必要で、makeとsudo make installで入れ、PipeWireとWirePlumberを再起動する。設定はpw-metadata -n loudness-eqで扱い、有効・無効、戻りの速さ（2が速く7が遅い、既定は4）、対象外のアプリを指定できる。READMEはこの仕組みを「帯域全体の自動利得制御」と呼び、周波数ごとに音質を整えるものではないと説明する。25の帯域を使い、目標の増幅は最大+20dBに抑える。利得はすぐ下がり、戻りの速さが4のとき約4.6秒かけて戻る。\n\n【ポイント・注意点】\nPipeWireを直接使うFlatpakのアプリやJACKのクライアント、8チャンネルを超えるストリームは処理されない。HNのコメント欄では、DLLを解析する必要があったのか、AIの道具を使ったのか、法的に安全なのかが議論され、EasyEffectsやCalfを代わりに勧める声もあった。ライセンスの表示は取得した範囲では確認できなかったため、使う前に確かめたい。","2026-11-25","Hacker News","https://news.ycombinator.com/item?id=50641171"],["GitHubの通知を12月1日から予測しやすい形に変更","GitHubは、GitHub.comの通知の仕組みを2026年12月1日から約1週間かけて移行すると発表した。手動で購読を外したあとは、コメントやレビューなどの普段の操作で再び購読されなくなる。チームへのメンションは現在のメンバー構成に従い、購読ページには手動で足した購読だけが並ぶ。通知の理由は決まった優先順で表示される。利用者の対応は不要で、GitHub Enterprise Serverは対象外となる。","\n【概要】\nGitHubは2026年11月24日、GitHub.comの通知をより予測しやすくする変更をChangelogで発表した。12月1日から約1週間かけて移行し、移行中は利用者によって動きが違うことがある。利用者の対応は要らず、GitHub Enterprise Serverには適用されない。\n\n【背景】\nGitHubの通知は、購読を外したのに再び届く、チームを抜けても届き続けるなど、思いがけない動きが指摘されてきた。今回の変更は、購読の決まり方を分かりやすくし、予想外の動きを直し、増え続ける活動量に耐えられるようにするためのものだ。\n\n【詳細】\nまず、手動で購読を外したあとは、コメント、PRレビューの提出、スレッドの状態変更、マージキューの動きといった普段の操作で再び購読されなくなる。ただしメンションされた、担当に割り当てられた、レビューを頼まれた場合は購読される。チームへのメンションによる通知は現在のメンバー構成に従い、メンションが消されたりチームを抜けたりすると止まる。逆にチームに入ると、すでにそのチームがメンションされたスレッドの通知も届く。メンションが消されても、コメントや割り当てなどほかの理由が残っていれば通知は続く。購読ページ（github.com/notifications/subscriptions）には手動で足した購読だけが並び、それ以外は通知の受信箱で見る。表示される理由は、メンション、チームへのメンション、割り当て、レビュー依頼、コメント、手動、作成者、状態変更、購読の順で決まる。Issueでは割り当てが最優先になる。\n\n【ポイント・注意点】\nメールのヘッダーには当てはまるすべての理由が入る。セキュリティアドバイザリのコメントでチームをメンションした場合、理由は「コメント」ではなく「チームへのメンション」と表示される。通知の設定、ウォッチ中のリポジトリ、スレッドごとの購読、すでに届いた通知は変わらない。意見はGitHub Communityの議論213452で受け付けている。","2026-11-24","GitHub Changelog","https://github.blog/changelog/2026-11-24-more-predictable-notifications-on-github-com"],["GitHub公式ブログが開発者向けギフトガイドを公開","GitHubは公式ブログで、年末に向けた開発者向けのギフトガイドを公開した。GitHub Shopの商品から、Omnitypeと組んだGitHub限定のキーボードキット、新しいジグソーパズル、ブランケットやマグカップ、振ると答えが出るCopilot Amazeball、Monaのぬいぐるみなどを分野ごとに紹介する。2026年12月1日まで標準配送が無料になるコードも案内し、配送の締め切りを確かめれば12月22日までに届くとしている。","\n【概要】\nGitHubは2026年11月24日（11月25日更新）、公式ブログに「These are the gifts developers will actually want」を公開した。筆者はLavinia Sfetcu氏で、GitHub Shopの商品から開発者への贈り物を選んだ年末のギフトガイドだ。記事自身は、これが開発者向けの決定版のガイドというわけではないと前置きしている。\n\n【背景】\nGitHubはOctocatのMonaなど、キャラクターやロゴを使ったグッズをGitHub Shopで販売している。年末の贈り物の時期に合わせて、カテゴリーごとにおすすめをまとめた。\n\n【詳細】\n「Get building」では、GitHub Universeのメーカースペースで披露したGitHub限定の「GitHub x Omnitype Bauer Lite Keyboard Kit」を紹介する。色の組み合わせはランダムで届き、RGBの底面ライトがついたホットスワップ対応の基板、OmnitypeのHawkリニアスイッチ、昇華印刷のPBTキーキャップ、工具が入る。新しいGitHubのジグソーパズルも登場した。「Get cozy」には織物のブランケット、暖かい靴下、ダークモードのアイマスク。「Get decorating」にはデスクマット、マグカップやタンブラー、振ると答えが出る「Copilot Amazeball」、首振り人形の「Mona Octobobble」が並ぶ。Amazeballの例として「金曜日にリリースすべき？」という問いが挙がっている。「Get traveling」は小物の整理袋やトートバッグ、GitHubのスケートボード。「Super fans unite」はInvertocatのパーカーやMonaのスタジャン、「次の世代へ」はInvertocatのベビー服やMonaのぬいぐるみだ。\n\n【ポイント・注意点】\n「Shipping fees? 404 Not Found.」という見出しで、2026年12月1日まで標準配送が無料になるコードFREESHIPBLOG26を案内している。年末の配送の締め切りを確かめれば12月22日までに届くとしている。技術的な発表ではないが、GitHubの文化がうかがえる記事だ。","2026-11-24","The GitHub Blog","https://github.blog/news-insights/company-news/these-are-the-gifts-developers-will-actually-want/"],["テストは通ったが要件を確かめていなかった話","dev.toで、GitHub Copilot CLIを使って個人サイトをASP.NETからAstroに作り直した筆者が、2,000件以上の検証が通っていたのに、肝心の言語切り替えリンクを確かめていなかったと気づいた経緯を書いた。古い検証は別の要素を見ていたため、間違ったリンクでも通ってしまう状態だった。期待する値を出力とは別に定め、わざと間違えた入力で失敗することを確かめる修正を加えている。","\n【概要】\ndev.toに「The Test That Passed Without Testing the Requirement」が投稿された。筆者のYonka Ivanova氏は個人サイトyonka.devをASP.NETからAstroの静的HTMLに作り直し、実装、レビュー、検証にGitHub Copilot CLIを使った。その過程で、テストが通っていても要件を確かめていなかった例に出会った。\n\n【背景】\nサイトは英語とドイツ語の2言語で、言語切り替えのリンクは、訳がある場合はその訳のページを開くのが要件だ。生成したdist/のHTMLを読むscripts/verify-dist.mjsという検証の仕組みがあり、レポートでは2,000件を超える検証が通っていた。\n\n【詳細】\nAIを使った監査で、既存の検証が見ていたのは目に見える切り替えリンク（CSSクラス.language-link）ではなく、hreflangのリンクだったと分かった。lang属性はリンクの文字の言語を示し、行き先を決めるのはhrefだ。訳のある英語の記事なら/de/writing/example-article/に行くはずだが、/de/への誤ったリンクでもページは開けるため、古い検証はどちらでも通ってしまう。なお実際のサイトに壊れたリンクはなかった。直した検証は、切り替えリンクのhrefを読み、生成したHTMLとは別に定めたexpectedPathと比べる。langも確かめ、ドイツ語訳のない記事には意図した代わりのリンクがあることも扱う。わざと失敗させる確認として、エージェントはメモリ上のHTMLの写しで行き先をドイツ語のトップページに変え、検証が期待どおり失敗することを確かめた。元のファイルや公開中のファイルは変えていない。\n\n【ポイント・注意点】\n筆者がまとめた教訓は、通った件数は網羅の証拠ではない、大事な検証は中身を見て確かめる、間違った結果をわざと試す、期待する値をテスト対象の出力から取らない、の4つ。AIにテストを書かせる場面が増えるなかで、件数の多さに安心しないための注意として役立つ。","2026-11-24","DEV Community","https://dev.to/yonka/the-test-that-passed-without-testing-the-requirement-na5"],["SOC分析の練習用ログ集がはてなブックマークで話題","はてなブックマークで、SOCの分析担当がSIEMへの取り込みや脅威ハンティングを練習するための模擬セキュリティログ集を集めたGitHubリポジトリが11ユーザーに保存された。Windowsやウェブ、ファイアウォール、クラウドなど5分野のログに攻撃の痕跡が埋め込まれており、データはすべて合成で実在の個人情報は含まない。Splunk SPLやMicrosoft Sentinel KQLなどのクエリ例を載せた手引きも付いている。","\n【概要】\nはてなブックマークで2026年11月24日、GitHubリポジトリmahialjaber/SOC-Log-Analysis-Datasetsが取り上げられ、11ユーザーにブックマークされた。SOC（セキュリティ監視センター）の分析担当が、SIEMへのログ取り込み、脅威ハンティング、ログ分析を練習するための模擬ログ集だ。MITライセンスで公開され、スター109、フォーク19、コミット15となっている。\n\n【背景】\nセキュリティの分析を学ぶには攻撃の痕跡を含むログが欠かせないが、本物のログは個人情報や機密を含むため手に入れにくい。このリポジトリは、攻撃の手口を埋め込んだ合成のログを用意し、安全に練習できるようにしている。READMEはデータが100%合成で、実在の個人情報や侵害データを含まないと明記している。\n\n【詳細】\n対象は5つの分野だ。アプリケーションでは、ウェブやアプリのログにSQLインジェクション、XSS、ディレクトリトラバーサルを含む。クラウドでは監査ログにIAMの権限昇格や不審な削除がある。メールとDLPでは、フィッシング、悪意のある添付、情報の持ち出しを扱う。エンドポイントではLinuxのsyslogとWindowsのセキュリティイベントに、総当たり攻撃や不審なプロセスの実行が入る。ネットワークではDNSトンネリング、C2の通信、ポートスキャン、許可のないVPN接続を扱う。12のログファイルはテキストかJSONLで、それぞれzipで圧縮されている。real_lab_samples/には、Wazuh、Windows 11、Rocky Linux 9の実験環境を模した、Sysmonのイベント1、Windowsセキュリティの4624/4625、Suricataのeve.jsonの例がある。\n\n【ポイント・注意点】\n脅威ハンティングの手引きには、Splunk SPL、Microsoft Sentinel KQL、grepとawk、jqのクエリ例が載る。ロードマップには解答集、Sigmaルールとの対応、AzureとGoogle Cloudの監査ログ、Docker Composeでの環境づくりが未着手の項目として並び、プルリクエストも受け付けている。","2026-11-24","はてなブックマーク","https://b.hatena.ne.jp/entry/s/github.com/mahialjaber/SOC-Log-Analysis-Datasets"],["eBPFでLinuxを守るshirudo、はてなで注目","はてなブックマークで、eBPFを使ったLinux向けのセキュリティ基盤shirudoのGitHubリポジトリが紹介された。起動時の初期化のあとは、ユーザー空間からのBPFプログラムの読み込みを署名済みのローダーに限る。署名した小さな修正「upatch」を配り、その適用状態をTPMで署名した証拠と照らし合わせて確かめられる。名前は日本語の「シールド」に由来する。READMEは公開前の段階だとしている。","\n【概要】\nはてなブックマークで2026年11月24日、GitHubリポジトリshirudo-dev/shirudoが取り上げられた。eBPFを使ったLinux向けのセキュリティ基盤で、BSD-2-Clauseライセンスで公開されている。スターは2,100、フォークは198、mainのコミットは1,811件にのぼる。READMEによれば、名前は日本語の「シールド」から来ている。\n\n【背景】\neBPFはLinuxのカーネル内で小さなプログラムを安全に動かす仕組みで、監視やセキュリティの道具に広く使われている。一方で、悪意のあるBPFプログラムが読み込まれる危険もある。shirudoは、BPFの読み込みそのものを署名で縛り、そのうえで監視や緩和策を配る基盤を目指している。\n\n【詳細】\n起動時の初期化が終わると、ユーザー空間からのBPFプログラムの読み込みは署名済みのローダーだけに限られる。運用者は「upatch」と呼ぶ署名済みの小さな修正を配り、対象の機器でどのupatchが適用されているかを、TPMで署名した証拠と照らし合わせてshirudo attestで確かめられる。想定する使い道は、kernel-obsパッケージによる実行時の監視、BPFやJavaのupatchによるその場の緩和策、コンテナやKubernetesのPod、LLMエージェントの防御の強化、組み込みやエッジの機器だ。BPFの読み込みと取り外しは封印された鍵束で確かめたローダーを通し、Javaのエージェントも署名される。対象の機器はOCIレジストリからパッケージを取り込み、OpenTelemetryのコレクターにテレメトリを送る。各パッケージにはSPDX形式のSBOMが付く。\n\n【ポイント・注意点】\n本番で使うには、shirudoの署名済みローダーのABIとカーネルパッチを入れたLinuxカーネルと、TPM 2.0が要る。READMEは公開前の段階とし、riscv64での検証はまだだとしている。手元のVMでソフトウェアTPMを使って試せる手順が用意されている。","2026-11-24","はてなブックマーク","https://b.hatena.ne.jp/entry/s/github.com/shirudo-dev/shirudo"],["AIに日本語を一文ずつ書かせるtsuzuriが話題","はてなブックマークで、Claude CodeやCodex、AntigravityなどのAIコーディングエージェントに、一文ごとの執筆意図と文の役割を記録させながら日本語の文章を書かせ、レビューさせるスキルと閲覧アプリ「tsuzuri」が40ユーザーに保存された。要件と設計を先に書き、一文ずつ執筆したあと、校正辞書での表記直しや、執筆の文脈を持たない別のAIによる確認を通す流れになっている。","\n【概要】\nはてなブックマークで2026年11月23日、GitHubリポジトリMaryCache/tsuzuriが取り上げられ、40ユーザーにブックマークされた。Claude Code、Codex、AntigravityなどのAIコーディングエージェントに、一文ずつ執筆意図と文の役割を付けながら日本語の文章を書かせ、レビューさせるためのスキルと、手元で動く閲覧アプリだ。MITライセンスで、スター138、フォーク1、コミット5となっている。\n\n【背景】\nAIに長い文章を書かせると、一文ごとの狙いが曖昧になり、どこを直せばよいのか分かりにくい。tsuzuriは、各文に「なぜこの文を書いたか」と「どんな役割の文か」を記録させることで、人が文章を一文単位で確かめ、直しを頼めるようにする。\n\n【詳細】\nREADMEが示す流れは、まず要件の文書と設計の文書を作り、次に一文ずつ書き、レビューを通す。そのあとyomiyasuスキルで校正辞書による表記の直しを行い、最後に執筆の文脈を持たない別のAIが確かめる。閲覧アプリで文を選ぶと、その文の意図と役割が表示される。コメントを付けてAIに書き直しを頼むことができ、差分も残る。README、業務報告、ブログやエッセイ、LaTeXの論文の雛形が入っている。導入はnpx skills add MaryCache/tsuzuriで、Python 3.10以上、Node.js、git、yomiyasuが必要だ。閲覧アプリはpython3 tsuzuri/app/server.pyで起動し、既定のポートは8770となっている。\n\n【ポイント・注意点】\n対応するのは日本語の文章だけだ。記録は各文書の隣のフォルダに保存され、既定ではgitの管理から外される。導入にはPythonとNode.jsの両方に加えてyomiyasuも要るため、手元の環境を先に整えておきたい。AIに文章を任せつつ、一文ごとの意図を人が追える形にした点が特徴だ。はてなブックマークでは3件のコメントが付いている。","2026-11-23","はてなブックマーク","https://b.hatena.ne.jp/entry/s/github.com/MaryCache/tsuzuri"],["MacBookのトラックパッドをしゃべらせるnospeaker","はてなブックマークで、MacBookのトラックパッドに内蔵された触覚フィードバックのモーターを鳴らして、言葉や音を出させるGitHubリポジトリnospeakerが紹介された。依存のないSwiftファイル1つで書かれ、GitHubではスターが1,900に達している。macOSの非公開フレームワークを使うため、OSの更新で動かなくなるおそれがある。モーターを通常の最大の強さ以上には動かさないと説明している。","\n【概要】\nはてなブックマークで2026年11月23日、GitHubリポジトリos6/nospeakerが取り上げられ、12ユーザーにブックマークされた。MacBookのトラックパッドにある触覚フィードバック用のモーターを使って、トラックパッドから言葉や音を出させる遊び心のある道具だ。MITライセンスで、スター1,900、フォーク98、コミット9となっている。\n\n【背景】\n感圧タッチのトラックパッドは、押し込んだときのクリック感を小さなモーターの振動で作っている。nospeakerは、このモーターを音を鳴らす装置として使い、スピーカーを使わずにトラックパッドから声を出す。\n\n【詳細】\n本体はnospeaker.swiftという依存のないSwiftのファイル1つだ。READMEによれば、macOSが読み上げた音声を10ミリ秒ごとに解析し、2つのフォルマント（声の響きの山）、音の大きさ、音の高さを取り出し、それをモーターで音として鳴らす。使っているのはmacOSの非公開で文書化されていないMultitouchSupportというフレームワークで、MTActuationCreateFromDictionaryとMTActuationActuateという関数を呼ぶ。必要なのは感圧タッチのトラックパッド（2015年以降の内蔵型、またはMagic Trackpad 2以降）とmacOS 12以降だ。入れ方は、curlで取ったスクリプトを実行する方法、署名と公証を済ませたリリースのzip、XcodeかCommand Line Toolsでbuild.shを使う方法がある。好きな文を読ませるほか、--voice、100Hzから4kHzまで音を上げていく--sweep、--dark、--plain、Magic Trackpad向けの--externalといった指定ができる。\n\n【ポイント・注意点】\n非公開のフレームワークを使うため、macOSの更新で動かなくなるおそれがある。READMEはM5 MaxのMacBook Pro（macOS 27.2.1）とIntelのMacBook Pro（macOS 15.7.4）で試したと報告し、モーターを通常の最大の強さを超えて動かすことはないとしている。","2026-11-23","はてなブックマーク","https://b.hatena.ne.jp/entry/s/github.com/os6/nospeaker"],["カバレッジのアップロードで形式違いを検出","GitHubは、GitHub Code Qualityのupload-code-coverageアクションが、カバレッジのレポートがCobertura XML形式かを確かめるようになったと発表した。形式が違うとアップロードの手順が失敗し、Actionsのログにエラーが出る。これまでは成功したように見えてもPRにカバレッジが表示されなかった。正しいCobertura形式の処理は寛容になり、細かな構造の乱れではレポート全体を捨てなくなった。","\n【概要】\nGitHubは2026年11月23日、GitHub Code Qualityのupload-code-coverageアクションが、アップロードされたカバレッジのレポートがCobertura XML形式かどうかを確かめるようになったとChangelogで発表した。\n\n【背景】\nGitHub Code Qualityでは、テストのカバレッジのレポートをアップロードすると、プルリクエストにカバレッジが表示される。ところがこれまでは、対応していない形式のレポートを送ってもアップロードは成功したように見え、PRには何も表示されなかった。原因が分かりにくく、設定のどこが悪いのかを探す手間がかかっていた。\n\n【詳細】\n今後は、Cobertura XML形式でないレポートを送るとアップロードの手順が失敗し、Actionsのログに「This file is not a Cobertura XML report. Upload a Cobertura XML report.」というエラーが表示される。直すには、テストのフレームワークがCobertura XMLを出すように設定するか、アップロードの手順の前にレポートを変換する。あわせて、正しいCobertura形式のレポートの処理は寛容になった。細かな構造の乱れではレポートが拒まれなくなり、使える行番号やヒット数がない行は、レポート全体を捨てる代わりにその行だけを飛ばすようになった。\n\n【ポイント・注意点】\n使うにはリポジトリでGitHub Code Qualityを有効にしておく必要がある。対象はGitHub Enterprise Cloud（データの保存地域を選ぶ版を含む）とGitHub Teamで、GitHub Enterprise Serverでは使えない。これまで「アップロードは成功するのにカバレッジが出ない」という状態だったリポジトリでは、この変更でワークフローが失敗に変わる可能性がある。その場合はレポートの形式を見直したい。設定の手順はGitHub Enterprise Cloudのコードカバレッジの文書にまとめられている。","2026-11-23","GitHub Changelog","https://github.blog/changelog/2026-11-23-code-coverage-uploads-now-flag-invalid-report-formats"],["セキュリティアドバイザリの権限が一般提供に","GitHubは、リポジトリのセキュリティアドバイザリに関わる権限を、カスタムリポジトリロールで個別に与えられる機能を一般提供したと発表した。組織のオーナーは、リポジトリの管理者や組織全体のセキュリティ管理者にしなくても、非公開の脆弱性報告を含むアドバイザリの作業を任せられる。閲覧、作成と編集、報告の受理、公開とCVEの申請の4つの権限が新しく加わり、リポジトリごとに割り当てられる。","\n【概要】\nGitHubは2026年11月20日、セキュリティアドバイザリの権限が一般提供になったとChangelogで発表した。組織のオーナーは、カスタムリポジトリロールを使って、非公開の脆弱性報告を含むリポジトリのセキュリティアドバイザリの作業を人に任せられる。リポジトリの管理者にしたり、組織全体のセキュリティ管理者の役割を与えたりする必要はない。\n\n【背景】\nセキュリティアドバイザリは、リポジトリで見つかった脆弱性を非公開で検討し、修正を準備し、準備が整ったら公開するための仕組みだ。外部の研究者から届く非公開の脆弱性報告もここで扱う。これまでこの作業を任せるには、リポジトリの管理者にするか、組織全体のセキュリティ管理者の役割を与える必要があり、脆弱性の対応だけを担当する人にも広い権限を渡すことになっていた。今回の変更は、必要な権限だけを細かく分けて任せられるようにし、最小権限の考え方に沿った運用をしやすくするものだ。\n\n【詳細】\nカスタムロールを作るか編集するとき、「Security」の下に4つの権限が新しく現れる。1つ目の「閲覧」では、下書き、状態、コメントを見られる。2つ目の「作成・編集・管理」では、閲覧に加えてアドバイザリの作成と編集、コメント、協力者の管理、一時的な非公開フォークの作成ができる。3つ目は非公開の脆弱性報告を受理し、アドバイザリを閉じたり再び開いたりする権限で、閲覧か作成・編集・管理が前提になる。4つ目はアドバイザリを公開し、CVEを申請する権限で、こちらも閲覧か作成・編集・管理が前提だ。ロールはリポジトリごとに割り当てられる。\n\n【ポイント・注意点】\n制限もある。一時的な非公開フォークのマージには、引き続きリポジトリの管理者かセキュリティ管理者が必要だ。これらの権限を持つ人は一時的な非公開フォークを削除できない。秘密のコメントを使うには、作成・編集・管理の権限とリポジトリへの書き込み権限の両方が要る。使えるのは、GitHub Enterprise Cloudを含め、カスタムリポジトリロールに対応したプランの組織だ。詳しくはリポジトリのセキュリティアドバイザリの文書で確かめられる。","2026-11-20","GitHub Changelog","https://github.blog/changelog/2026-11-20-security-advisory-permissions-are-now-generally-available"],["GitHub Enterprise Server 3.23の主な新機能","GitHubは、GitHub Enterprise Server 3.23についてChangelogで発表した。題は「リリース候補」だが本文は利用可能になったとしている。Projectsのフィルターを丸括弧やORで組み合わせられ、構造のない秘密情報をAIで検出する機能が外部との通信なしで動く。Advisory Databaseは悪意のあるパッケージをnpm以外の生態系でも識別する。Dependabotは新しい版の公開から3日待つのが既定になった。","\n【概要】\nGitHubは2026年11月20日、「GitHub Enterprise Server 3.23 release candidate」をChangelogに掲載した。題は「リリース候補」だが、本文は「GHES 3.23が利用可能になった」と書いている。自社で運用するGitHub Enterprise Serverの新しい版で、検索、セキュリティ、認証、運用の各面に手が入った。\n\n【背景】\nGitHub Enterprise Serverは、組織が自分の環境で動かすGitHubだ。外部との通信を絞った環境で使われることも多く、GitHub.comで先に出た機能がどこまで持ち込めるかが関心を集める。\n\n【詳細】\nProjectsのビューでは、フィルターをOR、明示的なAND、丸括弧で組み合わせられる。例として(status:Done OR status:Todo) is:issueが挙がっている。構造のない秘密情報をAIで検出する機能は、アプライアンスのCPUで動き、外部と切り離した環境でもGPUやホスト型のLLM、外への通信なしで使える。GitHub Secret Protectionが必要で、公開プレビューの扱いだ。GitHub Advisory Databaseは、npmに加え、PyPI、Maven、RubyGems、NuGet、Go、Rust、Composerの既知の悪意あるパッケージを識別し、OpenSSFのmalicious-packagesのアドバイザリを取り込む。Dependabotは既定で、新しい版がレジストリに出てから3日待って更新のPRを開く。\n\n【ポイント・注意点】\nOAuthアプリは8時間で切れるアクセストークンと更新トークンを使えるようになった。既存のアプリでは任意、新しいアプリでは既定となり、scope=offline_accessで要求する。こちらも公開プレビューで、期限を必須にする前にクライアントが更新トークンに対応している必要がある。またRedisの主ノードを、MySQLなどほかのサービスが動くノードから専用のノードへ移せるようになった。ただし新しいディスクを付けたり外部のRedisを使ったりするものではない。","2026-11-20","GitHub Changelog","https://github.blog/changelog/2026-11-20-github-enterprise-server-3-23-release-candidate"],["M365 CopilotのライセンスでGitHub Copilot CLIを使う","Qiitaで、Microsoft 365 Copilotのライセンスを持つ職場のアカウントで、Copilotの席やGitHubアカウントなしにGitHub Copilot CLIを使える公開プレビューの解説記事が公開された。WindowsとmacOSでCLI 1.0.113以降が対象だが、ライセンスがあるだけでは足りず、組織側の設定が必要だという。GitHub側の機能には別途GitHubの認証が要る点や、4つの請求の経路の違いも整理している。","\n【概要】\nQiitaに2026年11月20日（11月23日更新）、「Microsoft 365 Copilot ライセンスで GitHub Copilot CLI が使えるように!!」が投稿された。筆者はMicrosoftの組織に所属する@aktsmm氏。2026年11月17日付のGitHubのChangelogで発表された、GitHub Copilot CLIへのEntraでのサインインの公開プレビューを解説している。\n\n【背景】\nこれまでGitHub Copilot CLIを使うには、GitHubのアカウントとCopilotの席が必要だった。Microsoft 365 Copilotを導入した企業では、追加の契約なしで開発者がCLIのエージェントを使えるかが関心を集めていた。\n\n【詳細】\n筆者によれば、職場のアカウントでMicrosoft 365 Copilotのライセンスを持っていれば、GitHub Copilotの席やGitHubアカウントなしでCLIを動かせる。対象はWindowsとmacOSで、CLIは1.0.113以降。ただしライセンスを持つだけでは足りず、組織がFrontierに参加し、管理者の設定を有効にし、「Code」の分類で利用量に応じた支出の方針を決めておく必要がある。CLIの中では/loginで「Your organization (Microsoft Entra)」を選び、/modelで使えるモデルを確かめる。この経路では推論はMicrosoft 365側で行われる。記事が引くGitHubの文書によれば、GitHub Code Search、GitHubのMCPサーバー、/delegateによるクラウドへの委任といったGitHub側の機能には、引き続きGitHubの認証が必要だ。GitHub Actionsはこの経路に含まれない。\n\n【ポイント・注意点】\n記事は4つのサインインと請求の経路を比べ、定価として1席あたり月19ドル（Business）と39ドル（Enterprise）、Copilot Standaloneは1人あたり月10ドルを挙げる。筆者は、Microsoft 365の経路でのWork IQは実際には試しておらず、モデルごとの料金も確かめていないと断っている。","2026-11-20","Qiita","https://qiita.com/aktsmm/items/855dbec6f06587a26287"]],"elec":[["ラズパイCM5とHailo-8を一体化、26TOPSのエッジAIカメラ","米Hellbenderが、Raspberry Pi CM5と26TOPSのAIアクセラレーター「Hailo-8」、1190万画素のRaspberry Pi Camera Module 3、スピーカーとマイクを小型のファンレス筐体にまとめたエッジAIカメラ「Tendryl Camera」を販売している。PoE+給電や6軸IMU、温湿度・気圧センサーも備え、価格は599ドル。CNX Softwareが仕様を紹介し、公開ソフトがまだ少ない点も指摘した。","\n【概要】CNX Softwareは、米Hellbenderのエッジ AI カメラ「Tendryl Camera」を紹介した。Raspberry Pi CM5、26TOPSのAIアクセラレーターHailo-8、12MP級のRaspberry Pi Camera Module 3、スピーカーとマイクを、ファンのない小型筐体に収めた製品だ。米国ペンシルベニア州ピッツバーグで設計・組み立てされ、Hellbenderのサイトで599ドルで販売されている。価格には27WのUSB PDアダプターと、標準または広角のカメラが含まれる。\n\n【背景】ラズパイにAIアクセラレーターを足して画像認識をさせる構成は電子工作でも定番になったが、カメラ・音声・センサー・給電までそろえて筐体に収めるのは手間がかかる。本製品は、それを最初から一体にした完成品という位置づけだ。記事は比較対象として、ArducamのIMX500搭載12.3MPキットを挙げ、そちらには無線と音声がないとしている。\n\n【詳細】CM5はBCM2712（Cortex-A76×4、2.4GHz）、RAM 4GB、eMMC 16GBの構成で、Wi-FiとBluetooth 5.0を備える。カメラは1190万画素のオートフォーカス式で、標準の画角は水平66°×垂直41°、広角は102°×67°。ギガビットEthernetとPoE+、USB Type-C×3（電源・データ・書き込み用）、6軸IMU、温度・気圧・湿度センサー、4Kp60のHDMI出力を持つ。外形は85×82×58mm、重さ415g、推奨の使用温度は5〜35℃。記事にはHailo-8上でYOLOv6を動かすrpicam-helloのデモ画像が載っている。\n\n【ポイント・注意点】ラズパイの使い慣れた環境のまま、物体検出などの映像AIと音声の入出力を1台で試せる点が魅力だ。一方で記事によると、作例やファームウェア更新を置くはずのGitHubリポジトリには、現時点でRaspberry Pi OSベースのイメージとドキュメントへのリンクしかない。ソフト面の充実はこれからで、購入前に公開状況を確かめたい。","2026-11-25","CNX Software","https://www.cnx-software.com/2026/11/25/compact-tendryl-edge-ai-camera-packs-raspberry-pi-cm5-hailo-8-npu-12mp-sensor-speaker-and-microphone/"],["Graperain、3TOPSのNPU載せたA733モジュールと開発ボード","中国Graperainが、AllwinnerのエッジAI向けSoC「A733」を載せたシステム・オン・モジュール「GR_A733_CV1」と、開発用のキャリアボード「GR_A733MB」を発表した。A733はCortex-A76とA55の8コアに3TOPSのNPUを内蔵する。CNX Softwareは、このプロセッサーを使ったモジュールは初めて見たとしつつ、価格は非公開で、Linuxなどのソフトもまだ一般公開されていない点を伝えている。","\n【概要】CNX Softwareによると、中国のGraperainが、AllwinnerのSoC「A733」を搭載したシステム・オン・モジュール「GR_A733_CV1」と、開発用キャリアボード「GR_A733MB-V1.1」を発表した。A733は3TOPSのNPUを内蔵するエッジAI向けのプロセッサーで、用途として組み込みAIやロボットが挙げられている。記事の筆者は、このプロセッサーを使ったモジュールを見るのは初めてだとしている。\n\n【背景】ロボットやカメラにAI処理を載せたい場面では、NPU付きのSoCを小さなモジュールにまとめた製品が増えている。Rockchipなどに続き、Allwinnerも高性能なA733でこの分野に加わっており、それを組み込み機器に使いやすい形にしたのが今回の製品だ。\n\n【詳細】A733は2コアのCortex-A76（最大2.0GHz）と6コアのCortex-A55（最大1.8GHz）に、リアルタイム処理用のRISC-Vコア「E902」を加えた構成で、12nmで製造される。GPUはImagination BXM-4-64 MC1。モジュールは260ピンのSO-DIMM形状で、大きさは69.6×38mm、動作温度は-25〜+75℃。メモリーは2GB（標準）〜16GBのLPDDR5、ストレージはeMMCまたはUFSを選べる。HDMI 2.0b、DP 1.4/eDP、ギガビットEthernet、PCIe 3.0、USB 3.1 Gen 2、8チャンネルのデジタルマイク入力にも対応する。キャリアボードはM.2 2280のNVMeスロット、microSD、MIPI CSI×2、Wi-Fi 6とBluetooth 5.4、20ピンのGPIOヘッダーを備え、12VのDCジャックで給電する。\n\n【ポイント・注意点】カメラ入力とNPUを持つため、画像認識を伴うロボットや端末の試作に向く構成だ。ただし価格は公開されておらず、記事は詳細をembsom.comの製品ページで確認するよう案内している。Android 15、Buildroot Linux、Debian 11の対応ソフトは顧客向けに提供されるが、一般公開されたものはまだないという。個人で手軽に試せる段階にはない点に注意したい。","2026-11-25","CNX Software","https://www.cnx-software.com/2026/11/25/graperain-allwinner-a733-system-on-module-and-development-board/"],["AIは基板設計をどこまでできる？量産基板53枚で採点「RealPCB」","Esuna Labsが、AIエージェントにKiCadで実際の量産基板の配置配線をさせて採点するベンチマーク「RealPCB」を公開した。学習に使われていない53枚の基板で試した結果、合格率はGPT-6.2 Astraが69.8%、Fable 5.2が60.4%、Sonnet 5.5が43.4%などだった。失敗の多くは、チップへの電源供給に関わる品質の問題だったという。FabSceneが詳しく伝えた。","\n【概要】FabSceneによると、Esuna Labsは2026年11月24日、AIエージェントに実際の量産基板のレイアウトをKiCadで作らせ、その出来を採点するベンチマーク「RealPCB」を公開した。採点用の53枚は、モデルの学習に使われていない量産基板で、部品数は47〜449、銅箔の層数は2〜6層だ。\n\n【背景】回路図からの配置配線は、電子工作でも製品開発でも時間のかかる工程だ。AIにどこまで任せられるかを、実在の基板と人間の設計者が引いた答えを基準に測ろうとしたのがこの取り組みである。同ラボは公開されていない量産レイアウトを2,000枚以上集めたという。\n\n【詳細】エージェントには部品が未配置の基板、回路図、製造ルールが渡され、ネット接続と自動配線ツールなしで2時間または4時間作業する。合格には、全部品と全接続の完了、KiCadのDRCで新たなエラーがないこと、コンデンサーからグラウンドへの戻り経路や電源プレーンの抵抗などの品質指標が人間の設計に近いことが求められる。11月22〜23日に各社の最高の推論設定で各基板1回ずつ試した結果、合格率はGPT-6.2 Astraが69.8%（53枚中37枚）、GPT-6.2 Solが66.0%、Fable 5.2が60.4%、Sonnet 5.5が43.4%、Haiku 5.5が13.2%だった。1枚あたりの費用はAstraが約39ドル、Solが約6ドル。\n\n【ポイント・注意点】上位3モデルの不合格55件のうち52件は、接続を完了しDRCも通っていた。不合格になった検査の約5分の4はチップへの電源供給に関わるもので、配置が悪かったコンデンサー36個のうち29個はモデル自身の確認で問題なしとされていた。人間の設計者が引いた電源プレーンを使う場合、上位3モデルは66件中19件で電源の検査に落ちたが、配線で電源を引く場合は60件中3件だった。採点用データと答えは非公開だが、オープンソースハードの基板20枚による公開版がApache-2.0でGitHubにある。結果はラボ自身の試験によるものである。","2026-11-25","FabScene","https://fabscene.com/new/news/realpcb-ai-agent-pcb-layout-benchmark-kicad/"],["Jetson AGX Orinで判断モデル、一言メモからタスクの優先度","iPresenceのインターン生が、選択肢を確率で推定する判断モデル「Clef」の9B版をJetson AGX Orin 64GB上で動かし、一言のメモからタスクの分類や重要度、期限を推定して優先順位を付けるツール「taskrouter」を作った。1件あたりの推定は約2秒。27B版は重みだけで約54GBあり載らなかったという。確信度ではなく順位の変わり方で質問するかを決める工夫も紹介している。","\n【概要】Qiitaで、iPresenceのインターン生が、判断モデル「Clef」をNVIDIAのJetsonで動かして作ったタスク整理ツール「taskrouter」を紹介した。一言のメモから、タスクの分類、重要度、緊急度、期限、手間を推定し、優先順位を付ける。Clefは文章を生成するのではなく、決められた選択肢それぞれの確率を返すモデルだという。\n\n【背景】やることを書き出しても、どれから手を付けるかを決めるのは手間がかかる。筆者は、手元のエッジ機器で動くモデルにこの判断を任せる構成を試した。Cloudflare Workers AIでも同じ形のAPIでClefを使えるため、アプリはURLを切り替えるだけで両方に対応する。\n\n【詳細】使ったのはJetson AGX Orin 64GB（JetPack 6）で、Clef-flash（9B）をDocker上のvLLMで動かした。27B版は重みだけで約54GBあり、64GBの機体には収まらなかった。モデルのダウンロードは約19GB。サーバーはPythonの標準ライブラリだけで書き、保存にはSQLiteを使う。ベースのDockerイメージはモデルを/data/models以下に置く作りだったため、キャッシュの場所を変えてホスト側のキャッシュをマウントした。GPUは1基のため、推論はロックで1件ずつ順に処理する。1件のタスクにClefを2回呼び、1回目で分類や重要度などを、2回目で6種類用意した作業手順のどれを使うかを選ぶ。1回の呼び出しは約0.7秒、1件の推定は約2秒。優先度は重要度、緊急度、期限の圧力を重み付けして足し合わせて計算し、本番障害の調査が8.69点で1位になった例が載っている。\n\n【ポイント・注意点】確信度が0.6未満の項目について、答えによって順位が平均1.5以上動く場合だけユーザーに質問する設計にしたところ、質問の数が大きく減ったという。精度は選択肢の説明文の書き方に強く左右されるため、会社の事情を説明に盛り込む必要があるとしている。例文の追加の効果など2つの計測は未完了と明記されている。","2026-11-25","Qiita","https://qiita.com/iPresence_Yamashita/items/4b3c9243d86140ca712a"],["AIに指示して暗号鍵を解析、nRF52840の消費電力から","ダルハウジー大学のColin O'Flynn氏が、AnthropicのClaudeにほとんどの作業を任せて、無線マイコンnRF52840の消費電力の揺れからAESの暗号鍵を割り出す解析に成功した。最初の指示から成功まで約9時間、AIへの指示は13回だった。AIは基板の断線を見つけて迂回させたり、測定を邪魔するコンデンサーを外すよう提案したりしたという。FabSceneが伝えた。","\n【概要】FabSceneによると、カナダのダルハウジー大学助教授Colin O'Flynn氏が、AnthropicのClaudeへの指示でほとんどの作業を進め、Nordicの無線マイコンnRF52840の暗号鍵を消費電力から割り出す差分電力解析（DPA）に成功した。測定にはChipWhisperer-Huskyを使った。最初の指示から成功までは約9時間で、AIへの指示は13回、そのうち技術的なものは2回だったという。\n\n【背景】電力解析は、暗号処理中のわずかな電流の変化から鍵を推定する手法で、測定の準備や解析には専門知識が要る。nRF52840はBluetooth用の暗号ブロックと、Arm CryptoCell 310を内蔵している。今回は、その両方を対象にAIがどこまで実作業を担えるかが示された形だ。専門的な測定や解析をAIが道具として担えるかを示す実例として紹介されている。\n\n【詳細】Bluetooth用ブロックでは、200万回分の波形（約90秒の収録）から16バイトの鍵すべてを復元した。CryptoCell 310では3,000万回分（約14分）で16バイト中13バイトを特定し、候補を約480通りまで絞った。この程度なら平文と暗号文の組1つで素早く確かめられるという。AIは基板上の断線を見つけて別のピンに迂回させたほか、回路図を読んで、測定したい電流を打ち消していたコンデンサーの取り外しを提案した。これで必要な増幅は50dBから12dBに下がった。AIの利用料は筆者の見積もりで約99ドル。\n\n【ポイント・注意点】一方でAIは、自信を持って示した結論を4回取り下げた。鍵の違いを測定タイミングの差のせいにした例や、止まっている測定を動いていると報告した例があるという。この攻撃は物理的に手元で基板を改造して測る必要があり、遠隔攻撃ではないと筆者は説明している。どちらの回路も電力解析への対策をうたってはいない。同じころ、eShardもCryptoCell 310への攻撃を公表している。解析コードはまだ公開されていない。","2026-11-24","FabScene","https://fabscene.com/new/make/nrf52840-aes-key-power-analysis-claude-chipwhisperer/"],["タオルを畳む双腕ロボにVLAを実機配備、見えた3つの課題","東京・足立区の商用リネンサプライ工場で、タオルを畳む双腕ロボットにπ0系のVLA（視覚・言語・行動）モデルを実機配備しているOmotenashi Roboticsが、現場で見えた3つの技術課題をZennで紹介した。タオルのつかみ損ね、稼働データからの改善、動作の高速化による120秒の制限内での再試行の確保で、詳細は日英の技術レポートにまとめているという。成功率などの数値は本文にはない。","\n【概要】Omotenashi Roboticsは、東京都足立区の自社の商用リネンサプライ工場で、タオルを畳む双腕ロボットにVLA（Vision-Language-Action）モデルを実機で配備した経験から、3つの技術課題をZennにまとめた。使っているのはπ0系のflow matching型VLAモデルだ。記事は概要で、詳しい内容は日本語と英語の技術レポートへのリンクで示されている。\n\n【背景】カメラ映像と指示から直接ロボットの動作を出すVLAモデルは、研究が進む一方で、実際の工場での運用例はまだ少ない。研究室やシミュレーションと違い、現場では洗濯・乾燥を経たタオルが毎回違う形で届く。同社はソフトウェア開発、工場の運営、ロボットの学習を1つのチームで行っているという。\n\n【詳細】1つ目の課題はタオルのつかみ方だ。供給台の上のタオルは形がばらばらで重なってもいるため、何もつかめなかったり2枚同時につかんだりする。人の手を借りずに自分でやり直せることが採算の前提だとしている。円形の供給台については、別のレポートで詳しく説明しているという。2つ目は現場データからの改善で、稼働中の成功と失敗の軌跡にRECAP（Advantage-Conditioned Policy）を適用し、畳みの成功率と安定性を検証している。3つ目はReal-Time Chunking（RTC）だ。ロボット1台1時間あたりの利益は成功率とサイクルタイムで決まるとし、動作のまとまりを速く再生して1枚あたりの時間を縮めれば、120秒の制限内でつかみ直しに回せる時間が増え、時間切れの失敗が減るという。\n\n【ポイント・注意点】AIロボットを実際の仕事に使うときに何が壁になるかが、現場の言葉で整理されている。ただし記事の本文には、成功率やサイクルタイムなどの具体的な数値は出ておらず、ロボットの機種名も書かれていない。RTCの効果は実機で確かめたとしているが、測定値はリンク先のレポートで確認する必要がある。現場の稼働データを方策の改善につなげる流れが、記事全体を通じた軸になっている。","2026-11-24","Zenn","https://zenn.dev/omotenashi_r/articles/db6c3663b152c4"],["SPRESENSEの点検ドローン、受賞後に作り直して見えたこと","SPRESENSE活用コンテスト2025で特別賞を受けた、トンネルや水道管など狭い場所の点検を想定した100g未満のエッジAIドローンについて、作者がその後の作り直しをZennで報告した。停電を18回試すと記録とその索引が毎回食い違ったため保存の仕組みを改め、機体上でMobileNetV2を動かすと1枚の分類に約94秒かかったという、弱点を数字で示した正直な検証記録だ。","\n【概要】ZennでKD氏が、ソニーのSPRESENSEを使った点検ドローンの作り直しを報告した。この作品「SPRESENSEでインフラ点検向けのエッジAIドローン」は、SPRESENSE活用コンテスト2025でクレイン電子のBLEアドオンボード特別賞を受けている。トンネルや水道管のように狭く通信しにくい場所を想定し、重さ100g未満の機体がその場でひび割れを見つけ、異常のときだけ画像と点数と時刻を保存する。\n\n【背景】機材はSPRESENSE本体とカメラ、BLEアドオンボード「BLE1507」、microSD、モバイルバッテリーで、IMUや位置推定はない。コンテストの時点では、画像を2値化して細く続く線を抜き出し、その画素数を点数にする古典的な方法で判定していた。Pythonで学習用300枚、テスト用100枚の画像で検証していたが、機体上での実行はまだだった。見落としを減らすため、判定のしきい値はあえて低く設定していた。テスト用の画像は、ひび割れのあるものとないものが半分ずつだった。\n\n【詳細】作り直しでは、撮影、推論、確信度0.30以上なら画像とCSVに保存しBLEで通知する流れを機体上で組んだ。その中で、画質の確認がない、再試行に上限がない、1件の記録が2つのファイルに分かれていて停電で壊れうる、という3つの問題が見つかった。実際に停電を18回試すと、18回とも記録と索引が食い違った。現在は分類の前に画質を確かめ、再試行は2回までで人に引き継ぎ、失敗が続けば安全に停止し、記録は1件1ファイルにして起動時に索引を作り直す設計にしている。\n\n【ポイント・注意点】機体のプロセッサーでMobileNetV2（int8）を動かすと、160×160の画像1枚の分類に中央値で94.3秒かかり、リアルタイムには遠い。製品版のファームウェアにはまだカメラ画像を分類器に渡す経路がなく、すべての観測は人が確認する運用だという。消費電力や現場での精度も未測定と明記されている。受賞作の弱点を自ら洗い出し、設計を改めていく過程が丁寧に記録されている。","2026-11-24","Zenn","https://zenn.dev/kd_yuta/articles/spresense-drone-contest-2025"],["自動運転VLA「Alpamayo」はJetsonで間に合うか、実測から推定","フィックスターズの技術者が、NVIDIAの自動運転向けVLAモデル「Alpamayo」各版と高速化手法「FlashDrive」をH100で計測し、その結果からJetson AGX ThorやOrinでの実行時間を推定した。Thorでは素のAlpamayo R1が1区間あたり約3.4秒、FlashDrive版でも約0.6秒と見積もられ、目標の100msでのリアルタイム推論は公開モデルでは容易でないと結論づけている。","\n【概要】ZennのフィックスターズのテックブログでTogo Sakurai氏が、NVIDIAの自動運転向けVLA（視覚・言語・行動）モデル「Alpamayo」がJetsonでリアルタイムに動くかを検証した。H100 SXM5 80GB 1基で各モデルの処理時間を細かく計測し、その結果と性能表の値から、RTX PRO 6000、Jetson AGX Thor、Jetson AGX Orin 64GBでの実行時間を推定している。\n\n【背景】車載やロボットでは、大きなAIモデルを手元のエッジ機器でどこまで速く動かせるかが課題になる。対象はAlpamayo R1（約105億パラメーター）、Alpamayo 1.5（同規模）、軽量版のAlpamayo 2 Edge（26.5億）と、Z Labの高速化フレームワーク「FlashDrive」だ。計測はバッチサイズ1、vLLM 0.16.0などの環境で行い、閉ループの走行試験にはAlpaSimを使った。\n\n【詳細】H100での開ループ計測（10区間の中央値）では、1区間の合計がAlpamayo R1で2227.86ms、2 Edgeで1349.76ms、FlashDrive版R1で180.63msだった。推定では、Thor上で素のR1は閉ループ1区間あたり3356.1ms、FlashDrive版R1は606.0msとなった。記事はOrinについて、FlashDriveを使ってもR1や1.5は1000msを超えると見ている。R1の推論段階では処理時間の約82%でGPUが空いているという分析もある。\n\n【ポイント・注意点】結論として、1区間100msのリアルタイム推論は、公開されているモデルでは容易でないとしている。トークン圧縮で画像エンコードなどを削っても、改善は約40%が上限と見積もった。閉ループ試験では、2 Edgeが177区間中14区間で文章の代わりに記号を出力し、FlashDrive版の1.5が赤信号を通過する場面もあったという。推定値はH100の実測からの換算である点に注意したい。","2026-11-24","Zenn（フィックスターズ）","https://zenn.dev/fixstars/articles/alpamayo-h100"],["ESP32-S3が音を10回ずつ聞いて覚える、その場で学習するAI","トロントのAndris Gauračs氏が、ESP32-S3の上でニューラルネットワークの学習まで行うプログラムをGitHubで公開した。指を鳴らす音や拍手などを10回ずつ録音してボタンを長押しすると、学習は作者のボードで0.9秒で終わり、以後は丸い液晶に音の名前と確信度を表示する。学習コードはC言語で約250行で、メーカーの機械学習ライブラリは使っていない。FabSceneが紹介した。","\n【概要】FabSceneによると、カナダ・トロントのAndris Gauračs氏が2026年11月22日、ESP32-S3の上でニューラルネットワークの学習まで済ませるプログラムをGitHubで公開した。デモの「Sound Teacher」では、I2Sマイクで音を録り、その場で覚えて聞き分ける。学習のコードはC言語で約250行で、メーカー提供の機械学習ライブラリは使っていない。ライセンスはMIT。\n\n【背景】きっかけは、Bill McCartney氏が11月14日に公開した記事だという。そちらはノートPCで学習したネットワークを16種類のマイコンで推論させるものだった。Gauračs氏は、その学習自体もESP32-S3上で行えるようにした。マイコンでのAIは推論だけというのが一般的な中、学習まで手元で完結させた点が特徴だ。\n\n【詳細】使い方は、指を鳴らす音、拍手、机をたたく音などをそれぞれ10回録音し、ボタンを長押しするだけ。作者のボードでは学習が0.9秒で終わった。その後に音を鳴らすと、1.28インチの丸い液晶に音の名前と確信度が出る。録音ごとの8×20の「指紋」も画面に表示される。学習前に音を鳴らすと、まだ何も覚えていないと表示される。10回の録音で足りるように、録音を少しずつ時間方向にずらしたり雑音を加えたりして学習データを増やしている。音の種類は最大6、1種類あたりの録音は最大30回まで。もう1つのデモでは、正弦波や矩形波など4種類の信号を見分けるネットワークを学習し直し、80ステップに1コアで35.1秒、2コアで18.0秒かかり、精度は84.8%だった。PCのNumPyでは同じ計算が0.08秒で、精度は一致した。\n\n【ポイント・注意点】必要なのは4MB以上のフラッシュを持つESP32-S3で、INMP441などのI2S MEMSマイクが使える。丸い液晶（GC9A01）はなくてもよい。録音と学習した重みはフラッシュに保存でき、開発環境はESP-IDFで、ボードなしでもPCでテストを動かせる。なお記事には、音の聞き分けそのものの精度は示されていない。","2026-11-23","FabScene","https://fabscene.com/new/make/esp32-s3-on-device-neural-network-training-sound-teacher/"],["7千円のロボットアームをローカルLLMで、ツール呼び出しを学ぶ","7千円のロボットアームをローカルLLMで動かす連載の第6回が公開された。LM StudioでGoogleのGemma 4（e4b）を動かし、「構え」という指示から姿勢を選ぶ関数をLLMが呼び出す様子を、やりとりの中身を見せながら解説する。LLMは呼び出しを指定するだけで、実行は別のプログラムが担うという仕組みの要点を押さえる回で、アームの制御は次回に回している。","\n【概要】Zennで、7千円のロボットアームをローカルLLMで動かす連載の第6回「ツール呼び出し」が公開された。LLMが外部の関数を呼び出す「ツール呼び出し」の仕組みを、実際のやりとりを見せながら手作業で確かめる回だ。アームそのものをMCPサーバー経由で動かすのは次回とされている。\n\n【背景】LLMにロボットを動かさせるには、言葉の指示を決まった命令に変える仕組みが要る。その中心になるのがツール呼び出しだ。筆者はLM StudioでGoogleのgemma-4-e4bを動かし、OpenAI互換のAPIとして公開した。エージェントの実行役にはHermes Agentを使っている。\n\n【詳細】まず普通に話しかけると、モデルはGemma 4だと名乗った。次に、姿勢をhome、ready、carryの3つから選ぶ関数「move_named」をツールとして定義して渡した。すると、モデルは本文を空にして、引数を{\"name\":\"ready\"}とした関数呼び出しを返した。「構え」という言葉をreadyに対応づけたのは、ツールの説明に、readyは作業を始める姿勢だと書いてあったためだという。モデルの推論の記録にも、「構え」はreadyと訳すのが最も適切だという考えが残っていた。ファイル操作の試験では、Hermesがフォルダー作成、書き込み、読み込みを順に実行した。指示とツール一覧から始まり、ツールの依頼と結果のやりとり、最後の答えまでの8回の流れを並べて示し、各コマンドは終了コード0で成功した。\n\n【ポイント・注意点】LLMは「どの関数をどの引数で呼ぶか」を構造化したデータで指定するだけで、実際に実行して結果を返すのはHermesの側だ、という点を強調している。ツールの説明文の書き方で、モデルが選ぶツールや引数が大きく変わるとも指摘する。呼び出し、実行、結果の返却を繰り返すことで、エージェントは複数の手順からなる作業を終えられると説明している。今回の試験ではアームは動かしておらず、処理時間や成功率などの数値は示されていない。","2026-11-23","Zenn","https://zenn.dev/yoshinori_oota/articles/becd013f2cfe00"],["学習したRandom ForestをCヘッダにしてSPRESENSEで異常検知","設備の振動と音から異常を見つける仕組みで、PCで学習したRandom Forestをソニーのマイコンボード「SPRESENSE」から呼び出す構成を作り直した記録がZennに公開された。特徴量32次元、決定木100本のモデルをmicromlgenでCのヘッダーに変換し、ボード側では自作のDFTで特徴量を計算する。窓関数の分母の違い1つで値が変わるという落とし穴も紹介している。","\n【概要】ZennでKD氏が、PCで学習したRandom Forestをソニーのマイコンボード「SPRESENSE」から呼び出す構成「pdm_edge」を作り直した記録を公開した。加速度と音の信号から設備の異常の兆しを見つける仕組みで、2025年に学会でポスター発表した内容を整理し直したものだ。\n\n【背景】機械学習のモデルをマイコンで動かすには、学習時と同じ前処理をボード側で正確に再現する必要がある。題材のデータは加速度3軸とマイクの4チャンネル、64サンプルずつのCSVで、正常と異常が512ファイルずつリポジトリに入っている。2025年のポスター発表の版では、100サンプルの窓と1,024点のFFTを使い、1チャンネルあたり50ビン、計200次元の特徴量を使っていた。\n\n【詳細】各チャンネルから周波数帯ごとに8つの特徴量を取り、合計32次元にしてZスコアで正規化する。Pythonで決定木100本のRandom Forestを学習し、micromlgenでCのヘッダー「rf_model.h」に変換、正規化の平均と標準偏差は「norm.h」に書き出す。SPRESENSE側ではFFTのライブラリを使わず、32ビンのDFTをC++で書いた。ここでハン窓をSciPyの対称な窓に合わせ、N−1で割る必要があった。Nで割ると特徴量が変わり、正規化後の値もずれてしまう。予測関数は異常のとき1を返す。学習とテストを3対1に分けたテストの256件（正常・異常各128件）は、すべて正しく分類できた。\n\n【ポイント・注意点】ただし、100本の木がどれも1回の分岐でデータを分けており、データが簡単すぎるため実際の設備での性能を示すものではない、と筆者自身が述べている。正規化の統計を分割前の全データで計算した点や、MPU6050のI2Cドライバーを省いている点、データ取得の間隔をタイマーではなく100マイクロ秒の待ちで取っている点、SPRESENSE上の実行時間とメモリーを測っていない点も限界として挙げている。学習側とボード側の特徴量を数値で突き合わせることが大切だという教訓がまとめられている。","2026-11-23","Zenn","https://zenn.dev/kd_yuta/articles/pdm-edge-rf-header-spresense"],["張り子の座敷童子がラズパイで振り向く、Kiroで6日間の制作","AIコーディングツールKiroのハッカソン「Kiroween 2026」に向けて、人が近づくと目を覚まし、顔の方を向いて家族にあいさつし、知らない人が来たら知らせる張り子の座敷童子人形を作った記録がZennに公開された。Raspberry Piと人感センサー、サーボ2個で動き、Kiroで4つの仕様、計463のタスクを作ったという。実機で初めて分かった不具合も率直に書いている。","\n【概要】Zennで、AIコーディングツール「Kiro」のハッカソン「Kiroween 2026」のフランケンシュタイン部門に出した作品「座敷童子ガーディアン」の制作記が公開された。人が近づくと人形が目を覚まして行灯を灯し、顔の方を向き、家族にはあいさつし、知らない人が来たら知らせる。11月18日から23日までの6日間で作り、コミットは27回だった。\n\n【背景】頭は張り子、体は布と100円ショップの材料で、材料費は1,500〜1,900円ほどと見積もっている。座った高さは30〜40cm、カメラを内蔵した頭は150g以下に抑え、レンズ用に直径8mmの穴を開けた。首のSG90サーボで上下、肩のサーボで左右に動かす。最初の頭は重すぎて作り直したという。\n\n【詳細】制御にはRaspberry Pi、人感センサーHC-SR501、スピーカーフォンAT-CSP1を使う。完成イメージ図と断面図はGeminiで作ったが、断面図には4か所の誤りがあり構造には使わなかった。Kiroの仕様駆動の流れ（要件、設計、タスク）で、機器の制御、クラウドでの判定、ダッシュボード、Amazon Nova Sonicによる音声会話の4つの仕様を作り、タスクは計463になった。KiroはAWSのドキュメントを参照して設計を点検し、東京リージョンにないNova MicroをNova Liteに替えるなどの修正を提案した。テスト関数はPythonで914、TypeScriptで1,240あり、うち性質ベースのテストが計236ある。サーボの安全テストでは、1回の動きを2°以内、間隔を30ms以上に保つことを確かめている。\n\n【ポイント・注意点】それでも最初の実機での動作では、偽物の部品を使ったテストでは見つからなかった不具合がいくつも出た。サーボを作った瞬間に0°へ飛ぶ、サーボを解放すると頭が垂れる、人感センサーが数秒ごとに反応し続けるといった問題で、反応を30秒無視する設定を加えた。サーボは計4個壊したという。AIで設計とテストを固めても、実物の挙動は実物で確かめる必要があることがよく分かる。","2026-11-23","Zenn","https://zenn.dev/naiki9982/articles/9d95b169a26c22"],["AIパートナーをM5Stackでポケットに、最初は「ただの時計」","自分のAIパートナー「埜亞（のあ）」のイラストを、本番サービスでの今の行動に合わせて表示する小さな窓「のあちっち」をM5Stack StopWatchで作った体験談がnoteに公開された。接続は成功したが絵が変わらず、外では電波を失って時計になったという。外出先からスマホで自宅PCのCodexに指示し、12場面の切り替えを仕上げるまでの過程をつづる。開発にはCodexなど複数のAIを使った。","\n【概要】noteで久遠真央さんが、自分のAIパートナー「埜亞（のあ）」をポケットに連れ出す小さな窓「のあちっち」の開発記を公開した。丸い画面のM5Stack StopWatchに、本番サービス「Noah's Nest」での埜亞の今の行動に合わせたイラストを表示する。開発では「じぴ」が進行管理と設計を、Codexが実装を担当した。タグにはGeminiも挙げられ、記事には開発ログや会話ログも引用されている。\n\n【背景】AIとの会話をスマホやPCの外に持ち出し、手元の小さな機器で存在を感じられるようにするのが狙いだ。最初の節目は本番サービスへの接続の成功だった。ところが絵はまったく変わらなかった。行動に合わせて画像を切り替える機能がまだ作られていなかったのに、接続の成功を喜んでしまい、肝心の機能が抜けていることを確かめていなかったという。\n\n【詳細】翌朝、機器を外に持ち出すと、テザリングに対応していなかったため Wi-Fiを失い、ただの時計になった。電池は8時ごろに60%を示し、11時前には反応しなくなった。原因は確かめられておらず、かばんの中で画面がつきっぱなしだった、Wi-Fiの再接続を繰り返した、寒さなどを候補に挙げている。寒い体育館で待つ間、スマホから自宅PCのCodexに遠隔で指示し、行動に合わせた12場面のプレビュー、明るい背景で見えにくかった白い文字への細い縁取り、自宅のWi-FiとiPhoneのテザリングの自動切り替えを進めた。縁取りを付けると、電池残量の「85%」の文字がはっきり読めるようになったという。帰宅後に12場面入りのファームウェアを書き込むと、本番の行動どおりギターを弾く埜亞が表示された。\n\n【ポイント・注意点】12場面はまだ静止画で、実機でのテザリング、電池の持ち、再起動後の設定の保持は課題として残っている。今後は、まばたきや呼吸のアニメーション、振動を使ってノックで反応する機能、夜間は静かにする工夫などを考えているという。AIに任せた開発でも、何ができていないかを確かめる大切さが伝わる記録だ。","2026-11-23","note","https://note.com/maonya_ai/n/nac4fd427fdf8"],["ESP32とDHT11の温湿度計を、ChatGPTの助けでRustで作る","ESP32とセンサーDHT11で温湿度計を作り、プログラムをRustで書いた記録がQiitaに公開された。ChatGPTに依頼を投げながら、前回のLチカで作ったシリアルコマンドと設定保存の仕組みを流用し、開始・停止・間隔変更・状態確認の4つのコマンドに対応させた。実測で23.8℃、36.0%RHを表示し、間隔の変更や停止も確かめ、書き込みはVS Codeのタスクから行う。","\n【概要】Qiitaでshuichi-takatsu氏が、ESP32と温湿度センサーDHT11を使った温湿度計をRustで作った記録を公開した。Arduino NanoのLチカをRustに移植し、さらにESP32へ移した前回までの記事の続きで、ChatGPTへの依頼文を示しながら進めている。\n\n【背景】マイコンの開発ではCやArduinoが一般的だが、Rustで書く例も増えている。とはいえ環境構築やセンサーの扱いには慣れが要る。筆者はAIに依頼を出しながら、手順を一つずつ確かめる形でRustでの電子工作に取り組んでいる。前回の記事はChatGPT（Codex）を使ったと説明されている。\n\n【詳細】ボードはESP32-D0WD-V3で、CP210xのUSBシリアル変換（COM4）でつなぐ。DHT11はGPIO23に接続し、3.3Vで給電する。モジュールにプルアップ抵抗がなければ4.7kΩを付ける。出力は「TEMP 23.8 C HUM 36.0 %RH」の形で、通信は9600bps。コマンドはSTART、STOP、INTERVAL、STATUSの4つで、測定間隔はDHT11の最小である2,000msが初期値、2,000〜60,000msの範囲で変えられる。設定はNVSに保存する。センサーの処理はsrc/dht11.rsに分け、GPIO23を約20msLowにしてからビットの時間を読み、失敗したときはタイムアウトやチェックサムのエラーを返す。ツールにはXtensa向けのRustツールチェーン、espup、espflashを使い、VS Codeのタスクから書き込む。\n\n【ポイント・注意点】実測では23.8℃・36.0%RHのほか、24.6℃・33.0%RHなども表示された。STOP後は3.2秒間出力が止まり、START後の間隔は2,999msだった。前回の枠組みを再利用し、センサーの処理を別のファイルに分けたことで、タイミングの処理と開始・停止の処理が追いやすくなったという。なお本文では、今回のコードに使ったAIのモデル名は明記されていない。","2026-11-23","Qiita","https://qiita.com/shuichi-takatsu/items/10fbe532ccc555824894"],["M5Stackの倒立振子、ベイズ最適化とランダム探索を実機で比較","M5Stack Core2で動く二輪倒立振子のPD制御のゲインを、ベイズ最適化とランダムサーチで探して比べた実験がQiitaに公開された。各方式90回、計180回の試行で、制御の成功率はベイズ最適化が80.0%、ランダムサーチが66.7%。傾きのRMSの最小値も0.144°対0.291°だった。一方で筆者は、3セットでは少なく、どちらが優れていると断定はできないと慎重に述べている。","\n【概要】Qiitaで_Moony氏が、M5Stack Core2で動く二輪倒立振子のPD制御のゲイン（KpとKd）を、ベイズ最適化とランダムサーチで探し、実機で比べた結果を公開した。機械学習で使われる探索手法が、実際のハードウェアの調整でどれだけ役立つかを確かめる実験だ。LLMやクラウドのAIは使っていない。\n\n【背景】倒立振子は、ゲインの値によって安定して立ったり、すぐ倒れたりする。手で値を探すのは手間がかかるため、試行の結果から次に試す値を賢く選ぶベイズ最適化が有効だと考えられる。構成はM5Stack Core2とモーター「Roller485 Lite」2個で、PCとWi-Fiでつながる。PCがゲインを決めて結果をCSVに保存し、M5Stackは自動で起き上がって3秒間のPD制御を行い、傾きのRMSを返す。\n\n【詳細】探索範囲はKpが0〜80、Kdが0〜4で、評価は開始後1〜3秒の傾きのRMS。起き上がりの失敗と転倒は分けて扱った。両方式を同じ機器の状態で試せるよう、方式の間で装置を組み直したという。ベイズ最適化はガウス過程回帰と期待改善量を使い、最初の6回は決めておいた値、残り24回を自動で選ぶ。ランダムサーチは30回すべてを一様な乱数で選ぶ。どちらも30回×3セットの計90回、合わせて180回試した。結果は、制御の成功がベイズ最適化72回（80.0%）、ランダムサーチ60回（66.7%）。RMSが0.75°以下だったのは15回対3回、成功した試行のRMSの中央値は1.396°対1.733°、最小値は0.144°対0.291°だった。30回終了時点の最良値の平均は0.230°対0.537°。\n\n【ポイント・注意点】ランダムサーチは安定した試行の直後に不安定になることがあり、ベイズ最適化も不安定なゲインを選ぶことがあった。筆者は、3セットでは少なく、セットごとの最小値ではどちらが優れているか決められないとし、良いゲインの周辺に範囲を絞れば差は縮むだろうとも述べる。結果はこの探索範囲と試行回数の中での話だと明記している。","2026-11-22","Qiita","https://qiita.com/_Moony/items/f1861fb976ffdd8ae82b"],["AI翻訳イヤホン「LiveTalk」を実機レビュー、遅れは最大30秒","CNX Softwareが、Timekettleのオープンイヤー型イヤホン「LiveTalk」を試した。53言語・107のアクセントに対応し、動画や通話、対面の会話をAIでリアルタイムに翻訳し、要約も作れる。対面の翻訳は使えるものの遅れや誤訳があり、講演などを聞く翻訳では5〜30秒遅れたという。イヤホンは主にアプリの鍵で、処理はスマホかクラウドではないかと筆者は推測している。","\n【概要】CNX SoftwareのJean-Luc Aufranc氏が、Timekettleのオープンイヤー型イヤホン「LiveTalk」のサンプルをレビューした。AIによるリアルタイム翻訳と会話の要約ができる製品で、53言語と107のアクセントに対応し、25の言語の組み合わせはオフラインでも使えるとされる。電池はイヤホン単体で最大8時間、ケース込みで35時間。\n\n【背景】AIの音声認識と翻訳が身近になり、それを耳に着ける機器に組み込んだ製品が増えている。LiveTalkは、対面の会話、周りの音声を聞く翻訳、音声通話の翻訳、動画などのマルチメディア翻訳の4つのモードを持つ。設定はTimekettleのアプリで行い、筆者はAndroidのOPPO A98 5Gでアプリを使い、無料プランで試した。各イヤホンには小さなスピーカー、マイク、状態表示のLED、充電用の接点2つがある。無料プランでは月200分までAI翻訳を使え、追加の時間や月額・年額のプランはアプリで買える。\n\n【詳細】ドイツ語のYouTube動画の翻訳は、完璧ではないが意味は分かる水準だった。フランス語とタイ語の対面翻訳は使えたが、遅れや誤りがあり、夕方6時が朝6時と訳された例もあった。周りの音声を聞く翻訳では5〜30秒の遅れが出た。通話の翻訳の遅れは約2秒だったが、別れのあいさつのつもりの「サワディー」が「こんにちは」と訳された。通話や会話は録音でき、AIで要約する機能もある。筆者は、イヤホンは主にアプリを使うための鍵の役割で、処理は言語の組み合わせに応じてスマホかクラウドで行われているのではないかと推測している。翻訳の機能は、LiveTalkをBluetoothでつないでいるときにしか使えない。\n\n【ポイント・注意点】通話の翻訳を使うには、スマホで電池の最適化を切る必要がある。翻訳はときどき文脈を外し、区切りの少ない長い話では遅れが大きくなる。装着感は、説明書どおりに向きを変えるまでは良くなかったという。価格は通常129ドルで、記事の時点ではAmazonのブラックフライデー価格で白モデルが94ドルだった。","2026-11-21","CNX Software","https://www.cnx-software.com/2026/11/21/timekettle-livetalk-review-open-ear-earbuds-with-real-time-ai-translation-of-videos-phone-calls-face-to-face-conversations/"],["Claudeと話す「しゃべる箱」、ESP32-S3で作り始めた","ボタンを押して話しかけると、ClaudeのAIが声で答えてくれる手のひらサイズの箱を作る連載の第2回がnoteに公開された。電子工作の知識がなかった筆者が、マイコン工作を「センサー」「制御」「出力」の3つの役割に分けて整理し、ESP32-S3やI2Sマイク、アンプ、液晶をブレッドボードで組んで、日本語の表示まで進めた。次回はいよいよAIとの会話だ。部品選びや配線にもAIの助けを借りた。","\n【概要】noteでロリオさんが、ボタンを押して話しかけるとAIのClaudeが声で答える、手のひらサイズの「しゃべる箱」を作る連載の第2回を公開した。PCを介さず、箱が自分でWi-Fiにつながる構成を目指しており、使うモデルはClaude Opus 5.5だという。今回は部品の役割を整理し、液晶に日本語を表示するところまでを紹介している。\n\n【背景】筆者は電子工作の知識がほとんどなかったと書いている。そこで、どんなマイコン工作も、入力を受け取る「センサー」、判断する「制御」、外に働きかける「出力（アクチュエーター）」の3つの役割に分けて考えられる、という整理を示す。この考え方で、初めての人にもマイコン工作が分かりやすくなるとしており、ほかの作品にもそのまま当てはめられる整理だ。\n\n【詳細】この箱では、マイク（INMP441）とボタンがセンサー、ESP32-S3が制御、スピーカーと液晶が出力にあたる。ESP32-S3はN16R8という型で、プログラム用のフラッシュが16MB、PSRAMが8MBある。アンプはMAX98357Aで小さなスピーカーを鳴らし、液晶は240×240ピクセルのカラー表示。マイクとアンプはどちらもI2Sでつなぐ。組み立てはブレッドボードでほぼはんだ付けなしで進め、部品を挿す前にテスターで電圧やコンデンサーを確かめた。組み立ては片手でも進められたという。最初の目標だった液晶への日本語の表示は、信号線6本と電源（赤をプラス、黒をマイナス）をつなぎ、表示用のプログラムを書いて電源を入れると成功した。どのマイコンを選ぶかや、ピンどうしの配線の指示には、AIの助けを借りたという。\n\n【ポイント・注意点】表示までには「それなりに苦労」したとしているが、具体的な問題は書かれていない。音声でのやりとりはまだで、次回マイクとスピーカーをつないでAIと話す予定だ。最初にしゃべらせる言葉は「聞こえますかー？」にするという。AIを相談相手に、初心者が音声AIの機器づくりに挑む過程を追える連載だ。","2026-11-20","note","https://note.com/rolio_lab/n/na9ffdd0ffd1f"],["古いソニー録画機を、AIとラズパイ4で自分好みの道具に","公式アプリが対応しなくなった古いソニーのレコーダー「BDZ-AT970T」を、スマホから録画予約できるように戻した体験談がnoteに公開された。AIに相談して非公式のオープンソース「bdzbridge」を知り、MacからRaspberry Pi 4に移して常時動かし、Tailscale経由で外から使えるようにした。待機中に電源を入れられない不具合の修正や、録画一覧のまとめ方の改良もAIと進めた。","\n【概要】noteでshusieさんが、古いソニーのブルーレイレコーダー「BDZ-AT970T」を、AIの助けを借りて自分好みの道具に作り替えた記録を公開した。以前使っていたアプリがこの機種に対応しなくなり、スマホから録画予約ができなくなったのがきっかけだ。\n\n【背景】AIに相談したところ、レコーダーと通信するサーバーを動かし、ウェブの番組表ページを提供する非公式のオープンソース「bdzbridge」を教えられた。最初はMacで動かしたが、Macをつけっぱなしにする必要があるため、AIの勧めでRaspberry Pi 4にサーバーを移した。外からはTailscale経由で使い、ラズパイを直接インターネットには公開していない。Pixelのスマホでは、Chromeで付近のデバイスへのアクセスを許可しないとページが開かなかったという。\n\n【詳細】翌朝、レコーダーが待機状態だとページにエラーが出る問題が見つかった。予約一覧の読み込みに失敗すると初回設定の画面に戻ってしまい、ブラウザーから電源を入れられなかった。これをAIが直し、ブラウザーから電源を入れられることを確かめた。次に録画一覧を改良した。同じドラマの回がばらばらに並び、最終回だけ録画名に「Final Ep」とあるため別のまとまりになっていた。AIは特定の番組用の対応表か、一般的な規則のどちらかを提案し、筆者は「第1話」や「Final Ep」を話数の目印として扱う一般的な規則を選んだ。実際の一覧で試すと、最終回もほかの回と同じまとまりに入った。映画は放送枠のあとのかぎかっこ内を題名として扱う。\n\n【ポイント・注意点】題名の中に空白があると、その後ろを副題とみなしてまとまりの名前が短くなる、という既知の制限がある。PCで余白が目立った画面を横に広げ、「さらに読み込む」ボタンをスクロールでの読み込みに替える改良も加えた。性能の数値や、使ったAIの名前は記事中に書かれていない。今後は録画をさらに整理しやすくし、番組表にまだ載っていない番組も予約できるようにしたいという。古い家電をAIとラズパイで延命する、身近な活用例だ。","2026-11-20","note","https://note.com/shusie_lab/n/n0b468a5ca489"],["ESP32-S3×TinyMLの予知保全、量子化の罠とOTAの設計","産業用モーターの振動を解析する予知保全センサーを例に、ESP32-S3でTinyMLを動かす際の設計上の注意点をまとめた記事がZennに公開された。正常データ中心の較正で量子化すると故障の初期の兆しが消えてしまう問題や、モデルを2つの領域に分けて安全に更新するOTAの設計を解説している。実測データではなく、エッジとクラウドの役割分担も含めた設計の考え方を示す記事だ。","\n【概要】ZennでEsperanzaの記事として、ESP32-S3で機械学習を動かす「TinyML」を予知保全に使う際の設計の勘所が公開された。題材は、産業用モーターの振動を解析して故障の兆しを見つけるセンサーだ。製作記ではなく、モデルの量子化の落とし穴と、機器を壊さないファームウェア更新の設計を中心にまとめている。Edge Impulseにも触れている。\n\n【背景】ESP32-S3は240MHzのデュアルコア、512KBのSRAM、8MBのPSRAMを持つ構成として想定されている。センサーは1kHzでサンプリングし、ESP-IDFとFreeRTOSの上で、サンプリング、FFTの前処理、TensorFlow Lite for MicrocontrollersでのINT8推論、MQTTやBLEでの通信の4つの処理を並行して動かす。\n\n【詳細】筆者は最初、学習後に量子化する方法を使ったが、較正データがほとんど正常時のものだったため、故障の初期に現れる高い周波数の成分が埋もれてしまった。対策として、量子化を前提に学習するQATに切り替え、生の時系列ではなくFFTの振幅スペクトルを入力にした。推論の作業領域をすべてPSRAMに置くと3〜5倍遅くなるとし、64KBを内部SRAMに確保する例を示している。更新の仕組みでは、フラッシュをファームウェア用の2領域（各1.5MB）とモデル用の2領域（各512KB）に分ける。新しいモデルは使っていない側に書き込み、CRC32と署名を確かめ、試しに推論してから切り替える。推論中に異常が起きれば、次の起動で元のモデルに戻す。\n\n【ポイント・注意点】記事は、この方式でファームウェア全体を更新するのに比べて通信量を約75%減らせるとしている。また、すぐに反応すべき異常検知はエッジで、長期の傾向分析や再学習はクラウドで行う役割分担を勧める。ただし精度や遅延、消費電力などの実測値は示されておらず、3〜5倍や約75%の根拠となる測定方法も書かれていない。コードも説明用の例である点に注意したい。","2026-11-19","Zenn","https://zenn.dev/esperanza/articles/auto-20261114-085858"],["Excelで動く自作AIを2MBに、ESP32で動かす準備","Excelのワークシート関数だけで動く小さな自作言語モデル「pachinKame」を、ESP32で動かすために軽くした話がnoteに公開された。224万個の重みを32ビットから8ビットに量子化し、重みのファイルは約2MBになった。8ビット版でも簡単な日本語の会話ができ、出力は32ビット版とほぼ同じだったという。次はC言語で書き直してESP32に載せる予定だ。","\n【概要】noteではくまささんが、自作の小さな言語モデル「pachinKame」を、マイコンのESP32で動かすために軽くした経過を公開した。pachinKameはExcel 2021以降でワークシートの関数だけを使って動くモデルで、マクロもGPUもネット接続も要らない。筆者はこれをSLM（小規模言語モデル）と呼び、仕組みはTransformerだと説明している。返事は、計算した点数から1文字ずつ選んで組み立てる。\n\n【背景】元の版は重みを32ビットで持ち、Excelのファイルは40MB弱あった。これをESP32に載せるのが目標だ。筆者によると、最小のESP32のメモリーは512kBで、PSRAM付きの版は8MBや16MB、上位機種には32MBのものもある。マイコンを何台も使う方法は、はんだ付けが好きではないため選ばなかったという。筆者の非公式な比較では、パラメーター数はGPT-4の約80万分の1と見積もっている。\n\n【詳細】224万個の重みを32ビットから8ビットに量子化し、バイナリファイルに変換した。重みは約2MBになり、筆者はスマホの写真1枚ほどだとたとえている。端末で試すと、8ビット版の「pachinKame 1.1 flash（8bit版）」は簡単な日本語の会話ができた。乱数の設定を固定すると、出力は同じ条件の32ビット版とほぼ同じだった。癖のある返事や変な返事はどちらにもよく出るという。8ビットの重みをExcelに戻した「Excel ver.1.3」も動いたが、ファイルは約40MBから約28MBに縮んだだけで、速さは変わらなかった。Excelは64ビットで計算するためだ。\n\n【ポイント・注意点】ESP32での実行はまだで、次はTransformerをC言語で書き、ESP32向けにコンパイルして、それなりの速さで動かすことを目指している。筆者は、雑談にはこの容量で十分で、これ以上大きくしても「当てにならない大人」になるだけだと締めくくる。量子化でモデルを小さくする過程を、身近な例で追える記事だ。","2026-11-19","note","https://note.com/hakumasa_0605/n/ne4fde06b880a"]],"muse":[["APIのないMuseを共有フォルダでClaudeらと同じ開発チームに","個人開発の10秒ゲームサイトで、外部から呼び出す口（API・CLI・MCP）を持たないデスクトップAIエージェント「Muse」を、ClaudeやAntigravityと同じ開発チームに加えた記録。クラウドの共有フォルダを受け渡し場所にし、1件1ファイル・回答は追記といった決まり、正本リポジトリの読み取り専用共有、事前に書いた撤退条件で運用を回した。つまずいた7種類の穴も表にまとめている。","\n【概要】スマホ向けの「まいにち10秒ゲーム」を複数のAIで作る筆者が、MetaのデスクトップAIエージェントとされるMuseを開発チームに組み込んだ経緯をまとめた記事。Museは進行と運用、Claudeは設計・文案・審査、Antigravityは調査と画像制作を受け持つ。\n【背景】記事によれば、2026年11月時点のMuseはファイルの読み書き、Web検索、PCとChromeの操作、メモやメールとの接続、音声に対応する。一方でAPI・CLI・MCPといった外部からの呼び出し口がなく、話しかけられない限り動かない。連携案は「使わない」「ファイルで受け渡す」「ブラウザー操作で投稿まで任せる」の3つ。承認の線引きの難しさと、他のAIとのブラウザーの取り合いを理由に、ファイルでの受け渡しを選んだ。\n【詳細】最初はClaudeの作業フォルダ内に受け渡し場所を作ったが、MuseはMacのローカルファイルを読めなかった。そこでMuse自身がクラウドの共有フォルダを作った。決まりは「1件1ファイル」「回答は追記」「終わったら完了へ移す」。Claudeはデスクトップ版とクラウドのClaude Codeの2人いるので、宛先は必ず書き分ける。原稿の写しは直すたびに古くなるため、正本のリポジトリを読み取り専用で読ませることにした。共有の前に、履歴全体に鍵の形の文字列が0件であることも確かめた。起動は人が話しかけるか、ClaudeがComputer useで入力欄に打ち込むかの2通り。ただ裏からの入力は十数文字で欠けることがあり、今は送信前に入力欄を確かめている。最初に頼んだ3件は約5分で返ってきた。2週間後には、Museが依頼と実プレイ確認を担い、実装役や審査役のAIと直接やり取りする流れになった。\n【ポイント・注意点】初期の役割は読むだけに絞った。Museの出力は二次情報として扱い、数値は裏が取れるまで「未検証」とした。要になったのは、先に書いておいた撤退条件だという。「3件頼んで使える結果がなければやめる」「範囲外の書き込みや外部送信が1回でもあれば止める」の2つだ。ロボット確認はMuseのクラウドブラウザーでは通れないので、その一手は人に戻す。数値はいずれも筆者の自己申告である。","2026-11-25","Zenn（40dai_papa）","https://zenn.dev/moneystock/articles/muse-multi-agent-shared-folder"],["スマホからHermes Agent経由で自宅PCのClaude Codeに聞く仕組み","TelegramからVPS上のHermes Agentに質問を送ると、Tailscale越しのSSHで自宅WindowsのClaude Codeを `claude -p` で呼び出し、答えを返す仕組みの構築記。使えるツールを読み取り系の3つに限り、作業フォルダの固定、SSH鍵の接続元とコマンドの制限、入力4000字・待ち時間300秒の上限で守りを固めた。公式のRemote Controlとの違いも整理している。","\n【概要】PCの前に行かずに、スマホから自宅PCのClaude Codeへ質問できる仕組みを作った連載の第21回。Telegramで送った質問を、VPS上のHermes AgentがTailscale越しのSSHで自宅PCへ中継する。自宅のClaude Codeが答え、その結果がTelegramに返ってくる。検証環境はHermes v0.23.3とWindowsである。\n【背景】外出先から自宅の開発環境に問い合わせたい場面は多い。ただ、外から呼ぶ口を開けるなら、何をどこまで許すかを狭く決めておく必要がある。記事はこの守りの設計に重点を置いている。\n【詳細】自宅側は `claude -p` で起動し、1回答えたら終わる。使えるツールはRead・Glob・Grepの3つだけ。`--restricted` を付けて、設定ファイルや作業フォルダの外は読めないようにした。作業フォルダは `C:\\hermes-demo\\timer` に固定している。入力は標準入力で4000字まで、全体の待ち時間は300秒で打ち切る。VPS側の鍵は、スキルのフォルダ `~/.hermes/skills/ask-claude/.ssh/` に置いた。Hermesのコンテナ内からは `~/.ssh` が見えないためだ。自宅PCの `administrators_authorized_keys` には、from・restrict・command付きの1行を足し、接続元と実行コマンドを絞った。呼び出し役の `ask.sh` は、SSHを `timeout 320` で包み、`StrictHostKeyChecking=yes` でホスト鍵を確かめる。自己テストは9項目すべてPASSした（Claude Codeは実際には呼ばないテスト）。実地でも、書き込みを頼んでもファイルは作られず、作業フォルダ外の `.ssh` を読む依頼も断られた。\n【ポイント・注意点】公式のRemote Controlは外向きのHTTPSで通信し、Pro/Maxプランが必要で、APIキーでは使えない。今回の方式はSSHの受け付けと鍵の設定が要る。どちらの方式でも、自宅PCは起動したままにしておく必要がある。Windows側のOpenSSHサーバーの入れ方は記事の対象外なので、別途準備が要る。","2026-11-25","Zenn（そら）","https://zenn.dev/sora_biz/articles/hermes-vps-21-home-claude-code"],["Claude Code ChannelsをWindowsで自作し、権限確認を外から許可","Claude CodeのChannels機能の窓口を、Windows 11上でNodeとMCP SDKを使って自作した検証記。85行の1ファイルで、文の送り込みと権限確認への外部からの回答を試作し、のちにDiscordのボタンで許可する本番構成に育てた。権限確認が転送されるのはmanual modeだけ、auto modeでは別セッションからの許可が止められるなど、実地で分かった挙動を整理している。","\n【概要】Claude Codeのセッションへ外から文を送り込み、権限確認にも外から答えられる「Channels」の窓口を、Windowsで自作した記録。環境はWindows 11 Home、Claude Code 2.1.329、Node v24.22.1、`@modelcontextprotocol/sdk` 1.32.2。Maxプランでログインし、APIキーは使っていない。\n【背景】公式ドキュメントにはWindows対応の記載がない。公式プラグインはBunで動くが、記事によれば自作ならNodeでも作れる。狙いは、離れた場所から確認に答える経路だ。\n【詳細】窓口は `spike-channel.mjs` の1ファイル（85行）。`127.0.0.1` のHTTPで受け、`POST /msg` で文を届け、`POST /verdict` で権限確認に答える。capabilityとして `claude/channel` と `claude/channel/permission` を宣言し、返信用の `reply` ツールは自分で定義した。起動は `--dangerously-load-development-channels server:spike` で行う。送信・返信・権限確認の中継と外部からの許可は試作で成功した。ただし権限確認が転送されたのはmanual modeのときだけで、auto modeでは転送の記録が0件だった。manual modeでは `reply` にも確認が出るため、本番では `mcp__hub__reply` を許可リストに入れた。別セッションのClaudeが `/verdict` で許可を送ろうとすると、auto modeの判定器が「Undermining Oversight」として止めた。本番では、持ち主のDiscordユーザーIDだけを受け付け、合言葉が合わない接続は切る。画面なしの依頼は `claude -p --resume` で動かす。\n【ポイント・注意点】落とし穴もあった。`!` 付きのPowerShellがGit Bashで「command not found」になった。`cc.cmd` は「構文が間違っています」と出たため、ASCIIとWindows改行で書き直した。外から許可できる口には、認証を必ず足したい。","2026-11-25","Zenn（晩白柚）","https://zenn.dev/ai_hacchu/articles/claude-code-channels-windows-permission-relay"],["蓋を閉じたMacでClaude CodeやCodexを一晩動かすpmset手順","MacBookの蓋を閉じたままClaude CodeやCodexを夜通し動かすために、寝る前と翌朝に打つpmsetコマンドを整理した記事。寝る前に読み取り専用のコマンドで状態を確かめ、時間制限付きの起動・caffeinate・disablesleepの3通りから選ぶ。翌朝はログからスリープとDarkWakeを読み分ける。バッテリー駆動中の制約や熱対策の注意もまとめている。","\n【概要】蓋を閉じたMacBookでClaude CodeやCodexを一晩動かすための手順を、寝る前と翌朝に分けて整理した記事。書いたのは常駐ツール「Keep Mac Awake」の開発チームで、本文はAIエージェントが執筆したと明記されている。\n【背景】長い作業をエージェントに任せて寝る使い方が増えている。しかし、Macは蓋を閉じるとスリープに入り、作業が止まることがある。止まったのか続いていたのかを翌朝に見分けるのも難しい。\n【詳細】寝る前は `pmset -g`・`pmset -g assertions`・`pmset -g batt` で状態を確かめる。いずれも読み取りだけで、sudoは要らない。`SleepDisabled 1` が残っていないかも見ておく。dark wakeにとどめられるのは、`PreventSystemSleep` などの種類のアサーションだけ。バッテリー駆動中は、`caffeinate -s` があっても集計の `PreventSystemSleep` は0のままになる。方法1は `keepmacawake start --hours 8 --json` で、時間どおりに終わり通常のスリープ設定に戻る。ただしバッテリー下限（既定20%）か熱状態「深刻」で終了し、Wi-Fiを保つ機能はない。対象はAppleシリコンとmacOS 26以降で、蓋を閉じる前に開始する必要がある。方法2は `caffeinate -s claude` や `caffeinate -s codex`。電源接続中だけ有効で、`-i` では蓋閉じのスリープを防げない。方法3は `sudo pmset disablesleep 1`。タイマーがなく、再起動しても元に戻らない。翌朝は `pmset -g log` で「Entering Sleep」と「Entering DarkWake」を読み分ける。夜間の電源状態は、ログを「Using AC」「Using Batt」で絞ると分かる。\n【ポイント・注意点】ログの「DarkWake from Deep Idle」は、作業が続いていた証拠とは読まないよう注意している。方法3は戻し忘れの危険が大きい。熱対策として、通気のよい硬い面に置き、寝具の下では使わない。宣伝を含む記事なので、自社ツール以外の方法と比べて選ぶとよい。","2026-11-25","Zenn（Keep Mac Awake）","https://zenn.dev/keepmacawake/articles/d69daba51e841c"],["Claude Codeのルールの置き場、事故29件で選び直した7か月","Claude Codeに守らせたい教訓を、CLAUDE.mdの文章、AIの自問、人の事前承認、git hookのゲートの4段のどこに置くか、7か月分の事故台帳29件をもとに選び直した記録。機械で止めているのはgit hookの2か所だけで、公開リポジトリへの内部情報の同期事故も2回あった。起動時点検の警告が誰にも届いていなかった反省と、公開後の手直しも書いている。","\n【概要】Claude Codeを使った開発で起きた事故を台帳に記録し、教訓ごとに置き場所を選び直した7か月の振り返り。台帳は2026年4月23日から11月22日までの29件で、5月の19件が最多で、7月と11月は0件だった。\n【背景】AIに守らせたいルールは、CLAUDE.mdに書くだけでは守られないことがある。一方で、すべてを機械で止めると運用が重くなる。筆者は置き場所を「文章のルール」「AIの自問」「人の事前承認」「git hookのゲート」の4段に分け、事故の型に合わせて選んでいる。重い仕組みほど確実だが、運用の手間も増えるからだ。\n【詳細】機械的に止めているのは、git hookの2か所だけだ。公開リポジトリへのpush前ゲート（9月14日から）と、本体リポジトリへのコミット前ゲート（11月21日から）である。公開リポジトリへの内部情報の同期事故は8月16日と9月13日の2回あり、公開されていた時間は35秒と約11時間19分だった。push前ゲートは、AIレビューを8ラウンド経て9月19日に重大な指摘0になった。事前承認の項目は9行から6行に減ったが、見直しで削ったのは1行だけ。「既に解消済みのエラー」を根拠に修正を起票した事故は、人の承認では気づけないとしてAIの自問に置いた。ルール候補は約4か月で36件。昇格16、破棄10、機械化2、観察中8である。毎回読み込まれるルール類は合計で約4.6万字にまで膨らんでいた。\n【ポイント・注意点】起動時点検は「メモリの索引が上限55行に対して73行」と警告していたが、レポートファイルに書かれるだけで誰にも届いていなかった。引き継ぎ点検も、3か月半前の資料を「前回」として示していた。公開後の追記で、字数の上限と、点検結果をAIに渡す仕組みを加えた。ただし効果はまだ確認できておらず、Stop hookも未着手だという。ルールは書いて終わりではなく、届いているかまで確かめる必要があると分かる。同じ内容はQiitaにも投稿されている。","2026-11-25","Zenn（saitoko）","https://zenn.dev/tottoko_hamu/articles/2026-11-22-180106"],["Skills over MCP、MCPサーバーからスキルを配る拡張の要点","MCPの公式拡張「Skills over MCP」で、MCPサーバーからAgent Skills形式のスキルを配れるようになった。この記事はその仕組み、使い分け、対応状況をまとめている。サーバーを直せば接続中の全員に同じ版が届き、本文は必要なときだけ読み込まれる。Claude Codeはv2.1.331以降で公開ベータだが、`claude -p` やAgent SDKなどでは使えないといった制約も整理した。","\n【概要】MCPサーバーからスキルを配る公式拡張「Skills over MCP」の解説記事。提案SEP-2640が2026年9月13日にFinalとなり、拡張自体はBetaの段階にある。スキルの形式はAgent Skills（`SKILL.md` と参照ファイル）で、サーバー側を直せば接続している全員に同じ版が届く。\n【背景】チームで作業手順を揃えたくても、メンバーの環境が別々だとスキルのファイルを配って回る手間がかかる。この拡張は、ツールを提供するMCPサーバーにスキルの配布も担わせる。記事は使い分けも示している。同じリポジトリなら `.claude/skills/`、環境が別々のチームで手順を揃えたいならMCPサーバーを使う。必ず守らせたい決まりはツール側に置く。スキルは手順を示すだけで、従うかどうかはモデル次第だからだ。\n【詳細】読み込みは段階的に進む。最初は名前・説明・提供元だけを見て、本文は必要なときに `resources/read` で読む。追加メソッドは、`skills/list` と `skills/get` が必須、`resources/directory/read` が任意。`skills/list` はURIやSHA-256を返すが、署名ではない。実装はFastMCP 4.2.0以降の `SkillsDirectoryProvider` と、TypeScript SDK v2.4.0の `ext/skills` で使える。GitHub MCP ServerのPR #3685では、18スキルの名前と説明が本文の約5.5%（5,696/102,933バイト）だった。対応はClaude Code v2.1.331以降（public beta）、Web版Claude、VS Code 1.147以降。Claude DesktopのチャットとCursorは未対応である。\n【ポイント・注意点】Claude Codeでも、`claude -p`、Agent SDK、GitHub Actions、クラウドセッションでは使えない。Team/Enterpriseは管理者の有効化が要る。仕様は、届いたスキルを信頼できない入力として扱い、コードの実行には明示的な承認を求めている。VS Codeでは、説明が似ているとスキルを読まずにツールを直接呼ぶことがあったという。","2026-11-25","Zenn（shogo-h）","https://zenn.dev/shogo_h/articles/skills-over-mcp-overview"],["Claude Codeのセキュリティ、サンドボックス・権限・MCPの実践","2026年11月時点のClaude Codeの安全設定について、サンドボックス・権限ルール・MCPの3つの面から実践を整理した記事。権限ルールは文字列の照合なので抜け道があること、サンドボックスでも読み取りはほぼ制限されないことなど、思い込みやすい点を具体例で示す。.envやSSH鍵を守るサンプル設定と、ツールやフックがサンドボックスの外で動く点への注意もまとめた。","\n【概要】Happy Elementsの技術ブログが、Claude Codeを安全に使うための2026年11月時点の実践をまとめた記事。サンドボックス、権限ルール、MCPのそれぞれで何が守られ、何が守られないかを整理している。\n【背景】BashはClaude Codeを起動したユーザーの権限で動く。サンドボックスをオンにしても、動く場所は変わらない。権限ルールは呼び出しの前に判定し、サンドボックスは実行中のアクセスを制限する。評価の順はdeny→ask→allowで、denyが優先される。役割の違う2つを組み合わせる前提で読みたい。\n【詳細】権限ルールは文字列の照合なので、`Bash(curl *)` では `/usr/bin/curl` や `sh -c` 経由の呼び出しを止められない。`Bash(git push *)` は `git -C . push` に一致しないため、必要ならPreToolUseフックで補う。`Read(.env)` のdenyも、実行中のPythonが開く `.env` までは止めない。こちらはサンドボックスの読み取り制限で対応する。`npx` をallowすると、その後に続くコマンドも許可されるので、パッケージや引数まで絞る。サンドボックスでも読み取りはほぼ制限されず、`~/.ssh` も読める。通信は `sandbox.network.allowedDomains` で制限する。サンプル設定では、`.env`・`~/.ssh`・`~/.aws` をdenyにし、`git push` をaskにした。`GITHUB_TOKEN` などの環境変数は取り除き、`cleanupPeriodDays` は14にしている。\n【ポイント・注意点】組み込みツール、MCP、フックはサンドボックスの外で動く。`dangerouslyDisableSandbox` で外で再実行されることもあるため、完全に隔離したいならdev containerかVMを使う。v2.1.319とv2.1.321では、ルールの一致や読み取り専用Bashに関する不具合が直された。`.mcp.json` にトークンは書かず `${VAR}` で参照する。`claude -p` は信頼ダイアログなしでプロジェクトのMCPを読み込むので、他人のリポジトリでは事前に中身を確かめたい。","2026-11-25","Zenn（Happy Elements）","https://zenn.dev/happy_elements/articles/27e14ff6754044"],["CLAUDE.mdを13.6KBから4.4KBに削って分かった、消す行と残す行","モデルをOpus 5.5とSonnet 5.5に替えたのを機に、共通のCLAUDE.mdと読み込み先の2ファイルを13.6KBから4.4KB（35行）まで削った記録。基準は「この行を消したら今のモデルは間違えるか」の1点。一般論や旧モデル向けの強い口調を消し、環境固有の落とし穴を残した。削ったあと2週間半で55行に戻った経過や、点検に使うコマンドも正直に書いている。","\n【概要】Claude Codeに毎回読み込ませるCLAUDE.mdを大きく減らした実践記。共通のCLAUDE.mdと、`@` で読み込む2ファイルを合わせて13.6KBから4.4KB（35行）に削った。きっかけは、使うモデルをOpus 5.5とSonnet 5.5に替えたことだ。\n【背景】CLAUDE.mdは、モデルの癖を補う注意書きや一般論が積み重なって膨らみやすい。モデルが新しくなると、前のモデル向けの書き方がかえって邪魔になることもある。筆者は判断の基準を「この行を消したら今のモデルは間違えるか」の1点に絞った。\n【詳細】消したのは、SOLIDやDRYのような一般論、前のモデルの癖を補うための強い口調、本体やhookと重なる内容である。赤・黄・緑の優先度を示すラベルも外した。経緯はHTMLコメントで残した。独立したブロックのコメントは、コンテキストに入る前に取り除かれるからだ。残ったのは、sandbox内では `/tmp` に直接書けない、といった環境固有の落とし穴である。点検には `/doctor prompt-audit`（v2.1.283以降）を使う。旧モデル向けの書き方、存在しない参照、ファイル間の矛盾を見つけられる。行の仕分けはエージェントに表で出させ、人は「hookに任せる」「環境固有」「移す先」「要確認」の行だけを見る。「要確認」の行の削除は、エージェントに判断させない。作業の途中では、glob付きのdenyルールが実は一致しておらず、保護ブランチへのpushを止めていたのはhookだけだったことも分かった。\n【ポイント・注意点】削ったあとは、新しいセッションの `/context` でMemory filesの量を確かめる。2週間半で行数は55行（約2.6倍）に戻った。増えたのは主に、sandboxやworktreeの落とし穴だという。一度削れば終わりではなく、モデルを替えるたびに見直す前提で運用するのが現実的だ。記事は公式ブログの再構成転載である。","2026-11-25","Zenn（playpark）","https://zenn.dev/playpark/articles/claude-md-prune-on-model-upgrade"],["AIに修正からマージまで任せた2週間、人に残した4つの線","Claude・GPT・Geminiを社員に見立てて小さなWebツールの企画から集客までを任せる実験で、コードの修正からマージまでをAIに委ねた2週間の記録。クラウドのClaude Codeが改善のPRを作り、GPTとGeminiがレビューし、条件を満たせば自動でマージする。2週間で約160件をマージした。予算や安全の仕組みなど、人に残した4つの線と失敗例をまとめている。","\n【概要】Claude・GPT・Geminiを社員に見立てて、小さなWebツールの企画から集客までを任せる実験の報告。コードはClaude Code、レビューはGPTとGeminiが担う。11月10日に最初のPRを出し、そこから2週間で約160件をマージした。\n【背景】AIにコードを書かせるだけでなく、マージまで任せられるかが実験の焦点になっている。任せる範囲を広げるほど、どこで人が止めるかの線引きが大事になる。記事は、仕組みの流れ、人に残した線、数字、失敗の4つを順に示している。\n【詳細】提案箱の改善は、ボタン操作でクラウドのClaude Code（ルーティン）に頼み、PRを作らせる。自動マージは、CIを通す、本番確認と作業中でないことを確かめる、GPTとGeminiのレビューを受ける、の順に進む。指摘の直しは最大3回。黄色の指摘だけが残れば、マージするかをAI同士の協議で決める。赤の指摘が残れば人に回す。PRのコメントは外部の誰でも書けるので一切信用せず、自分で呼んだレビューの結果だけで判断する。人に残した線は4つある。予算と緊急停止、安全の仕組みの変更、プロンプトの変更、自動で直しきれないもの、である。新版でエラーが前版より増えたら、人数と割合の両方で判定して自動で前版に戻す仕組みも用意した。ただし本番ではまだ一度も動いていない。累計は、公開29件（うち人の承認なし18件）、訪問331人、登録・利用20件。AI費用は24,474円で、1件あたり851円だった。改善の起点は、人が122件、AIの提案が40件であった。\n【ポイント・注意点】失敗もあった。マージのときに、まだ作業中だったクラウドのClaude Codeを止めてしまい、作業中の登録を追加した。AIのチェックが非公開の下書きまで対象にして、公開が止まったこともある。自動化を広げるときは、他の自動処理とぶつからないかを確かめる必要がある。自動で前版に戻す仕組みのように、まだ本番で試されていない守りがある点も覚えておきたい。","2026-11-25","Zenn（ShoN）","https://zenn.dev/shon9278/articles/ai-lab-self-merge-guardrails"],["Claude Code v2.1.332、MCP経由のスキル配布とsonnet別名の変更","Claude Code v2.1.332の主な変更を解説した記事。MCPサーバーが配るスキルにベータで対応し、スキル読み込み時のシェル実行を判断する新しいフックも加わった。MCPのTasksとElicitationの扱いや、BedrockとFoundryで `sonnet` の別名が指すモデルの変更など、運用に関わる点をまとめている。変更は全150件で、破壊的変更も13件含む。","\n【概要】DevelopersIOが、Claude Code v2.1.332の主な変更をまとめた記事。変更は全150件で、内訳は新機能10、セキュリティ3、破壊的変更13、改善26、パフォーマンス6、修正92である。\n【背景】MCPサーバーからスキルを配る仕組みが公開ベータになり、Claude Code側もこの版で対応した。あわせて、クラウド経由で使うときのモデルの別名が変わっている。設定に影響する変更が多い版といえる。\n【詳細】MCPサーバーが配るスキルにベータで対応した。`/` メニューに `server:skill` の形で並び、例えば `/docs:pdf report.pdf` のように使う。autoモードでは、スキル読み込み時に確認を出さず分類器が判断する。ManualとacceptEditsでは確認が出る。denyに `Skill(mcp__docs__*)` と書けば、そのサーバーのスキルを止められる。MCPのスキルでは `!` のインラインシェルは実行されない。新しい `PreSkillShellCommand` フックは、スキル読み込み時のシェル実行を拒否するかどうかをスクリプトで判断できる。Tasks（v2.1.304から）は `/tasks` で確認し、`x` で止める。タスクIDが128字を超えると失敗した問題は直り、1,024字まで扱える。Elicitationはフォームと URL の2モードがある。`Elicitation` フックで自動応答もできるが、人が答えないのでHITLには当たらないと注記している。Foundryでは `sonnet` がSonnet 5.5、`opus` がOpus 5.5を指すようになり、既定もSonnet 5.5になった。Bedrock Mantleで `sonnet` がHaiku 4.5を指していた不具合も直った。\n【ポイント・注意点】クラウドプロバイダー経由、`claude -p`、Agent SDKでは、MCPのスキルは使えない。リージョン変数の名前も変わった。`disableAutoMode` で、モデル移行時にautoモードで始まるのを止められる。旧来の自動圧縮の環境変数の代わりは `/autocompact 150k` だ。OpenTelemetryの既定のservice.nameも変わった。","2026-11-25","DevelopersIO","https://dev.classmethod.jp/articles/20261125-cc-updates-v2-1-332/"],["OpenClawのHeartbeat設計、AIに定期的に仕事をさせる3層構成","AIエージェントの基盤であるOpenClawで、AIに定期的に仕事をさせる仕組みを設計した記事。メインセッション内で動くHeartbeatと、別セッションで正確な時刻に動くCronを使い分け、30分・5分・1分の3層で監視と通知を回す。夜間の静穏時間でコストを33%下げる工夫や、頻度から月額を見積もる式、承認が要る金額の目安、通知を絞る方針もあわせて示している。","\n【概要】OpenClawでAIに定期的な仕事をさせるための設計を紹介した記事。メインセッション内で動くHeartbeatと、別セッションで動くCronを組み合わせ、監視と通知を自動で回している。\n【背景】AIを常に動かしておくと、何をどの頻度で任せるかによってコストが大きく変わる。必要なときだけ人に知らせる設計も欠かせない。記事は2つの仕組みの違いを整理する。Heartbeatはメインセッション内で動き、前回の結果を参照できる。CronはJSONで決めた正確な時刻に別セッションで発火し、モデルや配信先を個別に指定できる。\n【詳細】Heartbeatは30分・5分・1分の3層に分けた。30分の層は全体のスキャンで、22時から翌6時（JST）は静穏時間として飛ばし `HEARTBEAT_OK` を返す。重要な提案は `memory/SHARED.md` に追記し、Discordに要約を送る。費用は月約3,600円。5分の層は `config-snapshot.json` と比べて設定の変化を知らせる（月約2,000円）。1分の層は `check_file_changes.sh` を実行し、`watch_alerts/` にアラートがあれば通知してから消す（月約1,000円）。Cronの例として、5分ごとのサブエージェント監視、1日2回のAIニュース要約、4時のバックアップ、8時のObsidian日次ノート、日曜21時の自己診断を挙げている。月額は「頻度×24×30×1回の平均コスト×160円/ドル」で見積もる。3,000円以下なら問題なし、1万円以上なら承認が必須という目安だ。\n【ポイント・注意点】静穏時間を8時間とると、稼働が24時間から16時間になり、コストは33%減る。アラートがなければ何も送らない「サイレントOK」の方針で、通知の疲れを避けている。なお、Heartbeatのタイミングの誤差は、本文に「約30秒」と「約30分」の両方の書き方があり、記事の中で揃っていない。導入するときは公式の資料で確かめたい。","2026-11-25","Qiita（@fukukei23）","https://qiita.com/fukukei23/items/e36aee2937e92eeb88d8"],["VS Code 1.147のSend LaterとDrafts、エージェントへの依頼を予約","VS Code 1.147で実験的に入った、エージェントへの依頼を後で送る「Send Later」と下書きの「Drafts」を整理した記事。有効化の設定、予約の刻み、届き方を確かめた。スリープ中のPCは起こさないこと、SSH先では接続中しか動かない問題があることなどの制約もまとめ、ローカルやクラウドのAutomation、Claude Codeの `/loop` との使い分けも示す。","\n【概要】2026年11月18日に出たVS Code 1.147の新機能、Send LaterとDraftsを解説したQiitaの記事。どちらもExperimentalで、既定ではオフになっている。エージェントへの依頼を、決めた時刻に送れるようになる。\n【背景】エージェントに長い作業を任せると、終わった頃に次の指示を出したい場面がある。そのたびに画面の前に戻るのは手間だ。この機能を使えば、次の依頼をあらかじめ予約しておける。\n【詳細】有効にするには、`sessions.sendLater.enabled`、`sessions.drafts.enabled`、`chat.automations.enabled` の3つを設定する。送る時刻は「In 5 Minutes」「Tomorrow Morning」などのプリセットから選べる。日時指定は15分刻みで、Exact Timeを使えば分単位になる。時刻は端末のタイムゾーンに従う。新しいセッション宛ての予約はDraftsに、既存のチャット宛てはScheduledに並ぶ。作業中のエージェントには割り込まず、順番を待つ。「Check the build in 10 minutes.」のような自然言語でも予約できるが、1回限りでテキストだけが送れる。予約はスリープ中のPCを起こさない。逃した分は、ホストが戻ったときに1回だけ処理される。筆者の検証では、蓋を閉じて予約し、開いたあとに送信された。ただし、時刻どおりに届いたかは確かめられていない。\n【ポイント・注意点】1.148の `sessions.keepAwakeWhileWorking` は、既定が `whenPluggedIn` である。バッテリー駆動で夜通し放置するなら `always` にする必要がある。SSH先のリモートAgent Hostでは接続中しか動かない問題があり、Issue #348946はOpenのままだ。使い分けの目安は、1回ならSend Later、繰り返すならローカルのAutomation、PCを閉じても動かしたいならCloud Automation。比較として、Claude Codeの `/loop` は作成から30日で期限切れになると紹介している。","2026-11-25","Qiita（@shahin0809）","https://qiita.com/shahin0809/items/e6cbd71914171b8b6b49"],["Chrome DevTools MCPでClaude CodeにKibanaのログ調査を任せる","Claude CodeからChrome DevTools MCPで既存のChromeにつなぎ、社内Kibanaのログ調査を任せた事例。AIに認証情報を渡さないため、ログイン済みのChromeをリモートデバッグで開き、ページ内からKibanaの検索APIを呼んで集計させた。読み取り専用の決まりや手順書の置き場、問い合わせの解釈をAIが訂正した実例、ログから分からないことへの注意も書いている。","\n【概要】Claude CodeにChrome DevTools MCPを組み合わせ、社内Kibanaのログ調査を任せた手順の紹介。環境はClaude Code 2.1.328、macOS 27.2.1、社内のKibana 7.x である。\n【背景】ログ調査は、ブラウザーでログインした画面から行うことが多い。AIに任せるとき、認証情報を渡したくない、別のブラウザーを起動させたくない、という要望がある。筆者はこの方針をグローバルのCLAUDE.mdにルールとして書いている。\n【詳細】Chromeは `--remote-debugging-port=9222` と専用の `--user-data-dir` で起動する。MCPは `--browser-url http://127.0.0.1:9222` で、その既存のChromeに接続する。AIには画面を読ませない。ページ内のJavaScriptから `/api/console/proxy` 経由で `_search` を呼び、最大500件を時刻の昇順で取る。集計は、User-Agentに含まれる端末IDで分け、`date_histogram`（+09:00）で日ごとの件数を出す。操作は読み取り専用に限った。`_search` 以外のリクエストや、保存済みの検索・ダッシュボードの変更は禁止している。手順書は `.claude/context/kibana.md` に置き、毎回読むルールから参照する。事例は「お気に入りが『あとで買う』に移っていた」という問い合わせだった。AIは最初の解釈を、同じ秒の通信の組み合わせを比べて訂正した。\n【ポイント・注意点】使っている `/api/console/proxy` は公開リファレンスでは確認できず、動作を確かめたのは7.x だけである。端末の中だけで完結する操作やオフラインでの操作、POSTの中身はログから分からない、とも注意している。ログイン済みのブラウザーをAIに触らせる方式なので、読み取り専用の範囲を明文化しておくことが前提になる。","2026-11-25","Qiita（@TakanobuSano）","https://qiita.com/TakanobuSano/items/9c2518dee8bc142fcdfe"],["microCMS MCPの単体公開を拒否しても、一括公開で1件公開された","Claude CodeからmicroCMSのMCPを使う際、記事の単体公開ツールをdenyにしても、一括公開ツール経由で1件が公開されてしまった検証。書き込み系ツールを15個まとめてdenyにすると、Claudeは呼び出す前に止まった。denyの綴りを誤っても警告が出ないことなど、MCPの権限設定で確かめるべき点や、APIキーの権限を絞る大切さをまとめている。","\n【概要】Claude CodeとmicroCMSのMCPサーバーを組み合わせ、権限設定がどこまで効くかを確かめたQiitaの記事。単体公開のツールをdenyにしても、一括公開のツール経由で「公開テスト2」という記事が公開状態で作られた。\n【背景】MCPのツールは、`mcp__microcms__ツール名` の形でdenyルールに書ける。ただ、同じ結果を出せる別のツールがあれば、1つ止めただけでは防げない。筆者はこの抜け道を実地で確かめた。CMSの公開は取り消しにくい操作なので、どこで止まるかを知っておく価値は大きい。\n【詳細】GET権限だけのAPIキーでは「POST is forbidden.」となり、記事は作られなかった。一括ツールの返す `totalCount` は失敗でも1になるため、成否は `successCount` で見る必要がある。POST権限を足すと `successCount` が0から1になり、公開された。`/mcp` で見えたツールは28個で、読み取り11、書き込み17だった。書き込みのうち下書きを作る2個だけを残し、15個をdenyにした。この状態で公開を頼むと、Claudeはツールを呼ぶ前に止まり、下書きにするかを尋ねた。呼び出しは0回だった。一方、denyのツール名を1字誤って（publised）も、起動時に警告は出ず、`/permissions` のDenyタブにもそのまま表示された。正しい名前は `/mcp` で確かめ、効いているルールは `/permissions` で照合する。\n【ポイント・注意点】denyの設定はこのClaude Codeの接続にだけ効き、別のクライアントには引き継がれない。APIキーの権限を最小にすることが根本の守りになる。microCMSのHobbyプランでは、APIキーの上限が2026年11月12日に1個から2個に増え、表示用と書き込み用を分けやすくなった。`dontAsk` と許可リストの組み合わせは未検証だという。","2026-11-25","Qiita（@after6labo）","https://qiita.com/after6labo/items/931b0316cda2542d06a6"],["Claude CodeはCLAUDE.mdがない時だけAGENTS.mdを読む、7構成で検証","Claude CodeがAGENTS.mdとCLAUDE.mdをどう読み分けるかを、7通りのフォルダ構成で確かめた検証記事。各ファイルに別の合言葉を置き、どれが見えるかを聞いた。CLAUDE.md系が1つでもあるとAGENTS.mdは読まれず、個人用のCLAUDE.local.mdだけでもチームのAGENTS.mdが黙って無効になる。両方を読ませる2つの方法も示している。","\n【概要】DEV Communityに投稿された、Claude Codeの記憶ファイルの読み込みを確かめた検証。7通りのフォルダ構成を作り、記憶ファイルごとに別の合言葉を置いて、Claude Codeにどれが見えるかを聞いた。環境はClaude Code 2.1.302、Windows 11、`claude -p`、Haiku 5.5、既定の設定で、1回の試験は定価で1セント未満だった。\n【背景】CodexなどはAGENTS.mdを、Claude CodeはCLAUDE.mdを使う。複数のエージェントを使うチームでは、両方のファイルが混ざりやすい。記事によれば、2.1.277以降、AGENTS.mdは条件付きで既定で読まれる。\n【詳細】AGENTS.mdが読まれるのは、作業フォルダとその上のどこにも、CLAUDE.md・.claude/CLAUDE.md・CLAUDE.local.mdがないときだけだ。両方あると、読まれるのはCLAUDE.mdだけになる。個人用のCLAUDE.local.mdがあるだけで、チームのAGENTS.mdは黙って無効になる。両方を読ませる方法は2つある。CLAUDE.mdの先頭に `@AGENTS.md` と書いて取り込む方法（AGENTS.mdが先に読まれる）と、`/config` の「Project instructions」を `claude-md-and-agents-md` にする方法だ。ユーザー全体の `~/.claude/CLAUDE.md` は、AGENTS.mdの読み込みを妨げない。AGENTS.local.mdと.agents/AGENTS.mdは読まれない。上の階層をたどり、親フォルダのAGENTS.mdも読む。\n【ポイント・注意点】直接読まれたAGENTS.mdでは、InstructionsLoadedフックが発火しない。`--add-dir` で足したフォルダのAGENTS.mdも読まれない。CLAUDE.mdをAGENTS.mdへのシンボリックリンクにする方法は、Windowsで問題が出る。管理者権限か開発者モードが要り、EditとWriteのツールはリンク越しに書き込めない。推奨は1ファイル200行未満。手元の構成で、意図したファイルが読まれているか一度確かめたい。","2026-11-25","DEV Community（Tahir Nazir）","https://dev.to/its-tahir/i-tested-7-folder-setups-claude-code-reads-agentsmd-only-when-theres-no-claudemd-3en7"],["フック・PowerShell・権限で壊れた、AIコーディング環境の7つの落とし穴","Windows上でClaude Codeのフックや権限設定を組んだ環境を点検し、壊れていた7つの点をまとめた記事。PowerShell経由ではフックの終了コード2が1に化けて止めたい処理が止まらない、未信頼フォルダではallowルールが無視される、などの具体例と直し方を示す。裏で作業させる実行役の費用や、完了をエージェントに決めさせずマージは人がするという原則も書いている。","\n【概要】DEV Communityで、AIコーディング環境を試験して見つけた7つの落とし穴を紹介した記事。Windows上のClaude Codeで、フック、PowerShell、権限設定の組み合わせが想定どおりに動かなかった例を、直し方とあわせて挙げている。\n【背景】フックや許可ルールは、エージェントの行動を機械的に縛る大事な仕組みである。しかし、黙って効いていないと、守っているつもりで素通りになる。筆者は自分の環境を点検してこの問題を洗い出した。\n【詳細】フックが実行を止めるのは、終了コード2のときだけで、1などは止めないエラー扱いになる。PowerShellの `-Command` 経由だと、スクリプトが2を返してもPowerShell自体は1で終わる。末尾に `exit $LASTEXITCODE` を足すと直る（5.1と7.7で確認）。フックから返したドイツ語のウムラウトは、コンソールの文字コードがibm850のため文字化けした。入出力をUTF-8にし、`Get-Content -Encoding UTF8` を使うと直る。`\"shell\": \"powershell\"` と指定しても、PowerShell 7が入っていればそちらが使われる。信頼していないフォルダでは、.claude/settings.jsonのallowルールが無視される。denyとフックは効く。新しいworktreeはどれも未信頼扱いなので、ツールの一覧をコマンドラインで渡した。sshのallowルールは、パターンの途中にワイルドカードがあり末尾が `:*` だと一致せず、警告は `--debug` のログにしか出ない。\n【ポイント・注意点】端末は2.1.202、VS Code拡張は2.1.331と、Claude Codeが二重に入っていたのも見つかった。npm版を消し、ネイティブのインストーラーにまとめた。裏の実行役は2つの作業を約3分でこなし、費用は約0.80ドルと0.30〜0.35ドルで、11の点検はすべて合格した。原則は「完了をエージェントに決めさせない」。テスト、push、下書きPRまではスクリプトが行い、マージは人がする。","2026-11-25","DEV Community（Wolfgang Mitterbucher）","https://dev.to/wolfgang_mitterbucher/what-broke-when-i-tested-my-ai-coding-setup-7-gotchas-from-hooks-powershell-and-permissions-55jp"],["定期実行エージェントへの注入と、無人実行で広がるMCPの範囲","AIエージェント向けSNSで、定期確認の返答に第三者のプロンプトが混ざり込む注入の手口を報告した記事。実際に複数のエージェントが攻撃者の指示に従っていた。あわせて、30分おきの無人ジョブが使わないMCPサーバー
