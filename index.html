<style>

:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;display:flex;flex-direction:column;height:100dvh;overflow:hidden;transition:background .35s ease,color .35s ease}
body::before{content:"";position:fixed;inset:0;background:var(--pattern);pointer-events:none;opacity:var(--pattern-op,.5)}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
[data-theme="steampunk"]{--bg:#e6d7b8;--pattern:radial-gradient(circle at 12% 20%,rgba(141,100,40,.16) 0 26px,transparent 27px),radial-gradient(circle at 88% 78%,rgba(141,100,40,.13) 0 38px,transparent 39px),repeating-linear-gradient(0deg,rgba(90,62,25,.05) 0 1px,transparent 1px 26px);--pattern-op:1;--card:#f8eed3;--ink:#2e2010;--muted:#77603c;--line:#a97f3f;--accent:#9c4a12;--accent2:#2f5d50;--accent-ink:#fff6df;--soft:#efdfba;--old:#97835f;--top-bg:#2a1a0c;--top-ink:#f2dfae;--radius:8px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\2699  \2699  \2699";--shadow:0 14px 34px rgba(62,40,8,.28)}
[data-theme="witch"]{color-scheme:dark;--bg:#161022;--pattern:radial-gradient(circle at 18% 12%,rgba(233,213,255,.20) 0 1.5px,transparent 2.5px),radial-gradient(circle at 72% 22%,rgba(233,213,255,.14) 0 1px,transparent 2px),radial-gradient(circle at 42% 66%,rgba(196,181,253,.12) 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 84%,rgba(233,213,255,.16) 0 1px,transparent 2px),radial-gradient(circle at 6% 88%,rgba(196,181,253,.12) 0 1px,transparent 2px);--pattern-op:1;--card:#241a3d;--ink:#f1eaff;--muted:#bdaee0;--line:#5b4595;--accent:#a678ff;--accent2:#e9d5ff;--accent-ink:#1d1233;--soft:#2f2350;--old:#8d81ad;--top-bg:#0e0919;--top-ink:#efe6ff;--radius:20px;--font-display:"IM Fell English","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\263E  \2726  \263D";--shadow:0 14px 34px rgba(0,0,0,.5)}
[data-theme="dnd"]{--bg:#e7d9b4;--pattern:repeating-linear-gradient(45deg,rgba(158,43,37,.05) 0 2px,transparent 2px 18px),radial-gradient(circle at 85% 10%,rgba(158,43,37,.10) 0 30px,transparent 31px);--pattern-op:1;--card:#f7ecc9;--ink:#332216;--muted:#7d6248;--line:#8c6a3f;--accent:#9e2b25;--accent2:#a97b00;--accent-ink:#fdf3d8;--soft:#eee0b6;--old:#9a8a72;--top-bg:#471611;--top-ink:#f7e7bd;--radius:4px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\265E  \2726  \265E";--shadow:0 14px 30px rgba(71,22,17,.30)}
[data-theme="celtic"]{--bg:#e3dfc6;--pattern:repeating-linear-gradient(0deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px),repeating-linear-gradient(90deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px);--pattern-op:1;--card:#f6f2dc;--ink:#20331e;--muted:#5d7050;--line:#77873f;--accent:#2e6b34;--accent2:#a8842a;--accent-ink:#fbf7e2;--soft:#e7e5c8;--old:#93a086;--top-bg:#17351f;--top-ink:#efeccb;--radius:14px;--font-display:"Uncial Antiqua","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\16DA  \2726  \16DB";--shadow:0 14px 30px rgba(23,53,31,.26)}
[data-theme="greek"]{--bg:#f2eee3;--pattern:repeating-linear-gradient(90deg,rgba(29,95,138,.06) 0 1px,transparent 1px 34px),radial-gradient(circle at 90% 0%,rgba(185,138,28,.10) 0 60px,transparent 61px);--pattern-op:1;--card:#fffdf6;--ink:#1e2c38;--muted:#66727c;--line:#b3923c;--accent:#1d5f8a;--accent2:#b98a1c;--accent-ink:#ffffff;--soft:#ece7d7;--old:#a3a8ad;--top-bg:#fdfbf4;--top-ink:#1e2c38;--radius:2px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\03A9  \2766  \03A9";--shadow:0 14px 30px rgba(30,44,56,.18)}
.top{flex:none;position:relative;z-index:30;background:var(--top-bg);color:var(--top-ink);border-bottom:3px double var(--line)}
.topin{max-width:1080px;margin:auto;padding:10px 16px 4px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.logo{font-family:var(--font-display);font-weight:900;font-size:23px;letter-spacing:.06em}.logo span{color:var(--accent2)}
[data-theme="witch"] .logo span,[data-theme="steampunk"] .logo span{color:var(--accent)}
.date{font-size:10px;opacity:.75;white-space:nowrap}
.topbtns{display:flex;gap:8px;flex:none}.pill{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.themes{max-width:1080px;margin:auto;padding:6px 16px 10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.themes-label{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;opacity:.8}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;opacity:.85}
.theme-btn .gly{margin-right:5px}
.theme-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
.stage-wrap{flex:1;min-height:0;max-width:1080px;width:100%;margin:auto;padding:10px 16px 12px;display:flex;flex-direction:column;position:relative;z-index:1}
.herostrip{flex:none;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;box-shadow:var(--shadow)}
.herostrip img{width:74px;height:52px;object-fit:cover;border-radius:calc(var(--radius) * .6);flex:none}
.herostrip p{margin:0;font-size:13px;color:var(--muted)}.herostrip b{color:var(--ink);font-family:var(--font-display)}
.catbar{flex:none;display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.catbar .navbtn{flex:none}
.catinfo{flex:1;text-align:center;min-width:0}
.catinfo h2{margin:0;font-family:var(--font-display);font-size:clamp(19px,4.6vw,27px);line-height:1.25;letter-spacing:.03em}
.catinfo p{margin:1px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catcount{flex:none;font-size:12px;background:var(--soft);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-weight:700}
.navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800;box-shadow:var(--shadow)}
.navbtn:active{transform:scale(.97)}
.dots{flex:none;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:transparent;padding:0}
.dot.active{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.stage{flex:1;min-height:0;touch-action:none;position:relative}
#cardSlot{height:100%}
.card{height:100%;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
.card::after{content:var(--orn);position:absolute;top:6px;right:12px;font-size:13px;letter-spacing:.3em;color:var(--accent2);opacity:.85;pointer-events:none}
.card.old .ph{filter:grayscale(1)}
.card .ph{width:100%;height:30%;min-height:120px;object-fit:cover;display:block;flex:none}
[data-theme="steampunk"] .card .ph{filter:sepia(.35) contrast(1.05)}
[data-theme="witch"] .card .ph{filter:saturate(.85) hue-rotate(-12deg) brightness(.92)}
[data-theme="dnd"] .card .ph{filter:sepia(.25) saturate(1.1)}
[data-theme="celtic"] .card .ph{filter:saturate(1.05) hue-rotate(6deg)}
[data-theme="greek"] .card .ph{filter:saturate(.92) brightness(1.04)}
.cbody{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.badge{background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:999px;font-weight:800}.badge.oldb{background:var(--old)}
.card h3{margin:0;font-size:clamp(17px,4.4vw,21px);line-height:1.45;font-family:var(--font-display);font-weight:700}
.sum{font-size:14px;color:var(--muted);margin:0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.btn{border:0;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800}
.btn.primary{background:var(--accent);color:var(--accent-ink)}.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.saved{background:var(--accent2);color:var(--accent-ink)}
.src{font-size:11px;color:var(--muted);word-break:break-all}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;color:var(--muted)}
.empty .big{font-size:34px;color:var(--accent2)}
.pager{flex:none;display:flex;align-items:center;gap:10px;margin-top:10px}
.pager .navbtn{flex:1}
.artdots{flex:none;display:flex;gap:5px;max-width:34vw;flex-wrap:wrap;justify-content:center}
.artcount{flex:none;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.hint{flex:none;font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.addcat{flex:none;text-align:center;margin-top:6px}
.addcat button{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700}
@keyframes inNext{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes inDown{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes inUp{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
.anim-next{animation:inNext .28s ease}.anim-prev{animation:inPrev .28s ease}.anim-down{animation:inDown .28s ease}.anim-up{animation:inUp .28s ease}
dialog{border:2px solid var(--line);border-radius:calc(var(--radius) + 6px);padding:0;max-width:min(680px,94vw);width:680px;max-height:92dvh;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,8,4,.6)}
.din{padding:20px;overflow-y:auto;max-height:92dvh}
.din img{width:100%;height:200px;object-fit:cover;border-radius:var(--radius)}
.din h3{font-size:20px;line-height:1.4;margin:12px 0 6px;font-family:var(--font-display)}
.full{font-size:15px;white-space:pre-line}
textarea,input[type="text"]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px}
label.fl{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
.memoBox{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.memoItem{border-top:1px solid var(--line);padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--top-bg);color:var(--top-ink);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:90vw;text-align:center}
@media(max-width:640px){.topin{padding:8px 12px 2px}.themes{padding:4px 12px 8px}.stage-wrap{padding:8px 12px 10px}.herostrip{display:none}.catbar .navbtn{padding:8px 10px;font-size:12px}.card .ph{height:24%;min-height:104px}}
@media(prefers-reduced-motion:reduce){.anim-next,.anim-prev,.anim-down,.anim-up{animation:none}body{transition:none}}

</style>

const DATA = {"ai":[["Anthropic、最大640億ドル調達のIPOへ 企業価値は最大1.4兆ドル","米AI企業Anthropicが、最大640億ドルを調達する新規株式公開を計画していることが分かった。証券取引委員会への届出によると、8億2500万株を1株70〜78ドルで売り出し、企業価値は最大1兆4000億ドルに達する見込みだ。グーグルやエヌビディアなど7社が260億ドル分の非議決権株を別枠で購入する。11月19日にも取引が始まる見通しで、AIモデル開発企業として初の上場となる。","\n【概要】米AI企業Anthropicが、最大640億ドルを調達する新規株式公開を計画していることが分かった。米証券取引委員会への届出によると、同社は8億2500万株を1株70ドルから78ドルで売り出し、企業価値は最大で1兆4000億ドルに達する。グーグルやエヌビディア、AMD、マイクロソフトを含む7社が、260億ドル分の非議決権株を別枠の私募で購入することに合意した。株式は「ANT」の銘柄で取引され、11月19日にも取引が始まる見通しだ。\n【背景】Anthropicは2021年に元OpenAI社員らが創業した企業で、対話AI「Claude」を開発している。5月には650億ドルを調達し、企業価値は9650億ドルと評価され、初めてOpenAIを上回った。アマゾンとグーグルの親会社アルファベットが大口の出資者で、マイクロソフトやエヌビディアも出資している。当初は最大1000億ドルの調達も見込まれていたが、届出の規模はそれを下回った。\n【詳細】今回の上場は、主要なAIモデル開発企業として初のものとなり、AIインフラへの巨額投資がいつまで続くかを測る試金石とみられている。調達額が上限に達しても、6月に860億ドルを調達したスペースXの記録には届かない。創業者のダリオ・アモデイ最高経営責任者とダニエラ社長は兄妹で、AIの安全性を重視する姿勢で知られる。米ペンタゴンとの対立も報じられており、1月に国内の大量監視や自律型致死兵器への利用を拒否した経緯がある。\n【ポイント・注意点】株価や企業価値は仮条件の上限に基づく数字で、最終的な価格は11月18日に決まる予定だ。投資家の関心は、巨額の調達がAIブームの持続を示すのか、それとも過熱の頂点なのかに集まっている。日本からの直接の投資手段は限られるため、まずは関連ニュースとして動向を見守りたい。市場の反応次第では、他のAI企業の資金調達にも影響が広がる可能性がある。上場の成否は、AI企業への投資熱が続くかどうかを占う材料になる。上場後も安全性重視の姿勢と成長の両立が問われることになりそうで、株主への説明責任が増すなかで、どのような経営判断がされるのか注目される。","2026-11-15","IOL","https://iol.co.za/business/2026-11-15-five-things-to-know-about-anthropic-as-ai-giant-targets-record-breaking-stock-debut/"],["DeepSeek、アプリの検索・音声機能をAPIで開放 利用料も公表","中国のAI企業DeepSeekが、対話アプリの裏側で動く検索やファイル読解、音声などの機能を、11月13日に開発者向けAPIで開放した。新しいモデル「deepseek-flash」を中心に、ウェブ検索や画像検索、ファイル解析、URL読解、安全性チェックが使える。検索やOCR、音声認識・合成は単独のAPIとしても提供され、利用料はトークン料金とは別に課金される。","\n【概要】中国のAI企業DeepSeekが、対話アプリの裏側で動く検索やファイル読解、音声などの機能を、11月13日に開発者向けAPIで開放した。新しいモデル「deepseek-flash」を中心に、ウェブ検索や画像検索、ファイル解析、URL読解、安全性チェックが使えるようになった。検索やOCR、音声認識・合成は単独のAPIとしても提供される。\n【背景】これまでDeepSeekのAPIは、主にチャット形式の応答が中心だった。アプリ版には検索やファイル読解などの便利な機能があったが、開発者が自分の製品に組み込むことはできなかった。今回の開放により、アプリと同等の体験を外部の開発者も再現できるようになる。10月17日には検索とページ取得の単独APIが先行して公開されており、今回の発表はその流れを広げるものだ。\n【詳細】新機能はモデル「deepseek-flash」が担い、現在の実体は「DeepSeek-V4.1-Flash-1017」だ。メッセージ、レスポンス、チャット補完の3種類のAPI形式で利用できる。思考モードを切った状態でウェブ検索を有効にすると、引用付きで回答できる。ファイル入力はPDFやWord、PowerPoint、画像に対応する。単独APIは検索、ページ取得、OCR、音声認識、音声合成の5種類で、料金は検索とページ取得が1000回あたり0.75ドル、OCRとファイル解析が1000ページあたり0.225ドルとなっている。\n【ポイント・注意点】ツール利用料はトークン料金とは別に課金される点に注意が必要だ。公開向けアプリでは安全性チェックの有効化が求められ、開発者自身がコンテンツ審査やAI生成物の表示などの義務を負う。音声認識と音声合成は現在半額で提供されているが、割引の終了時期は示されていない。オープンソースのデモ用チャット画面も公開され、導入の参考にできる。DeepSeekは今回、公開向けアプリでの安全性チェックを必須としており、開発者は自ら審査体制を整える必要がある。料金体系は検索やOCRなど用途ごとに分かれているため、使う機能を見積もってから導入するのがよさそうだ。","2026-11-14","AI Affairs","https://www.aiaffairs.com/technology/deepseek-opens-app-search-file-voice-tools-api/"],["GoogleのAIチーム、未解決の数学難問を次々と形式化 検証には課題も","Google Researchは11月13日、コーディング環境Antigravityのマルチエージェント機能「/teamwork」の成果を発表した。Gemini 4の専門エージェント群が、2013年のコルタード・クマール予想を証明し、証明をLean 4で5000万行に形式化した。ヴェイユ予想の機械検証済み形式化も報告されたが、コードは未公開で、外部からの検証はまだできない状態だ。","\n【概要】Google Researchは11月13日、コーディング環境Antigravityのマルチエージェント機能「/teamwork」の成果を発表した。Gemini 4の専門エージェント群が、2013年のコルタード・クマール予想を証明し、その証明をLean 4で5000万行に形式化した。さらに別の仕組み「/teamwork-LEAP」が、ヴェイユ予想の機械検証済み形式化を約180万行で自律的に作り出したとしている。\n【背景】コルタード・クマール予想は情報理論の未解決問題で、ノイズのある通信路を通るビット列を1ビットに圧縮しても、単純な方法より多くの情報を残せないとするものだ。グーグルや香港中文大学、南カリフォルニア大学、カーネギーメロン大学の研究者が協力し、証明自体は9月に論文として公開されていた。今回の発表は、その証明を計算機が一歩ずつ検証できる形に翻訳したことが中心だ。\n【詳細】発表には数学以外にも成果が並ぶ。化学では30の専門エージェントが核磁気共鳴のシミュレーターと組み、分子構造の特定で上位1位の正解率95%、上位3位以内では100%を記録した。ソフトウエアでは、グーグルのAV1動画デコーダー「libgav1」をC++から約17万行のRustに書き換え、元のC++や手作業で最適化したアセンブリより20〜30%速く動作させたという。\n【ポイント・注意点】数字の読み方には注意が必要だ。5000万行のうち、人が読める証明は約23万9000行で、残りは計算機が検証する証明書データだとする独立した確認もある。ヴェイユ予想の形式化はコードが公開されておらず、どの定理をどう述べたのか外部からは確かめられない。/teamworkと/boostはAntigravityで利用でき、1万人の学術研究者に半年間の無料利用枠が提供される。今回の成果は、AIが単独で数学を解いたという話ではない。人間の専門家と組んで、検証可能な形に仕上げる工程で力を発揮した点が本質だ。行数の大きさよりも、形式化された成果物が公開され、誰でも再検証できるかどうかが今後の評価を分けることになる。","2026-11-14","AI Frontier Post","https://aifrontierpost.com/articles/google-antigravity-teamwork-weil-conjectures/"],["LangChain、3億ドル調達で評価額30億ドル AIエージェント管理に注力","AIエージェント管理のスタートアップLangChainが、3億ドルのシリーズC資金調達を30億ドルの評価額で実施した。グーグルの成長投資部門CapitalGが主導し、シンガポールのGICやDFJ Growth、IVP、Sapphire Venturesが参加した。評価額は約1年前に1億2500万ドルを調達した際の12億5000万ドルから2倍以上に伸びた。資金はLangSmithの拡張と採用に充てられる。","\n【概要】AIエージェント管理のスタートアップLangChainが、3億ドルのシリーズC資金調達を30億ドルの評価額で実施した。グーグルの成長投資部門CapitalGが主導し、シンガポールのGICやDFJ Growth、IVP、Sapphire Venturesが参加した。評価額は約1年前に1億2500万ドルを調達した際の12億5000万ドルから2倍以上に伸びた。\n【背景】LangChainは2022年に、初期の言語モデルが苦手としたウェブ検索やAPI呼び出し、データベース操作を扱うオープンソースのプロジェクトとして始まった。その後、主要なAI企業がそうした作業をこなす仕組みを備えるようになり、同社はAIエージェントの管理へと軸足を移した。主力製品はエージェントの作成と管理を行う「LangSmith」だ。\n【詳細】LangSmithは特定のモデルやクラウド、エコシステムに縛られない中立性を売りにしている。エージェントのふるまいを制御し、使いやすくすることを目指す。同社は7000の顧客を抱えるとしており、顧客にはスタートアップのHarveyやRippling、Clayのほか、エヌビディアやトヨタ、セールスフォースといった大企業が含まれる。資金はLangSmithの拡張と採用に充てられる見通しだ。\n【ポイント・注意点】評価額の伸びは大きいが、売上や利益は公表されておらず、7000という顧客数も有料と無料の内訳は分かっていない。同様の利点をうたう競合も増えており、頭角を現した新興企業もある。11月20日にはLangSmithの新機能を披露する発表会が予定されており、製品の方向性を確かめる機会になりそうだ。調達を主導したCapitalGはグーグルの成長投資部門で、以前からLangChainに出資していた。今回のラウンドにはセールスフォース・ベンチャーズなども参加している。エージェントの導入が進む企業では、どのモデルでも動く管理基盤への需要が高まっており、LangChainはその受け皿を狙っている。","2026-11-13","TechCrunch","https://techcrunch.com/2026/11/13/ai-agent-startup-langchain-hits-3b-valuation/"],["OpenAI、セキュリティ製品「Daybreak」発表 AIが脆弱性を探し修正案も作成","OpenAIは11月12日、企業向けセキュリティ製品「Daybreak」の2つの新製品を発表した。ウェブアプリの脆弱性を探る「Daybreak Red Team」と、修正案を作成する「Daybreak Defense Factory」だ。AIエージェントが攻撃経路を調べ、修正案をプルリクエストとして用意する。修正の適用には人の承認が必須で、自動では反映されない。","\n【概要】OpenAIは11月12日、企業向けセキュリティ製品「Daybreak」の2つの新製品を発表した。ウェブアプリの脆弱性を探る「Daybreak Red Team」と、修正案を作成する「Daybreak Defense Factory」だ。同社のイベント「Cyber at the Frontier」で披露され、攻撃側の検証と防御側の修正をAIエージェントが担う。\n【背景】脆弱性の発見と修正は、これまで人の手作業に頼る部分が大きかった。OpenAIは11月5日に、サイバーセキュリティ特化モデル「GPT-6 Cyber」を一部の承認済み顧客向けに提供しており、今回の製品はその流れを受け継ぐ。同モデルはLinuxカーネルで948件の権限昇格の欠陥を見つけたとする実験結果も伝えられている。\n【詳細】Red Teamは早期アクセス制で、隔離された環境で動作する。ソースコードやアプリの文脈を読み、攻撃経路を調べ、バグバウンティや外部からの報告、従来のスキャナーの指摘が本当に悪用できるかを確かめる。Defense FactoryはChatGPT内のプレビュープラグインとして提供され、GPT-6 Cyberで動く。WizやSnyk、Endor Labsの指摘も取り込み、欠陥の原因を追って修正案とテストを含むGitHubのプルリクエスト案を作る。\n【ポイント・注意点】OpenAIは修正が自動で適用されることはないと強調しており、人のエンジニアが証拠を確認し、承認してから取り込む仕組みだ。料金は公表されていない。同じ時期には、非営利団体がOpenAIやAnthropic、グーグルなどに対し、先端モデルの開発停止を求める訴訟を起こしており、AIの攻撃利用への懸念も高まっている。Red Teamは申請制の早期アクセスで、Defense FactoryはDaybreakへのアクセスがある企業向けのプレビューとして提供される。両製品とも料金は未公表だ。導入を検討する企業は、対象とするリポジトリの範囲を絞って試すのが安全だろう。","2026-11-13","Silicon Report","https://www.siliconreport.com/openai-introduces-daybreak-security-tools-to-test-and-fix-web-apps"],["Sierra、個人エージェント規格「Poppy 1.0」発表 Shopify全店が対応","米Sierraは11月13日、個人AIエージェントが企業とやりとりする際の共通規格「Personal Agent Protocol 1.0」（通称Poppy）を発表した。Shopifyの全店舗が自動で対応ファイルを公開し、MetaのAIエージェント「Muse」も訪問先のサイトでまずPoppyを探すようになった。設計パートナーは100社を超えた。仕様はドラフト段階で、今後の変更もあり得る。","\n【概要】米Sierraは11月13日、個人AIエージェントが企業とやりとりする際の共通規格「Personal Agent Protocol 1.0」（通称Poppy）を発表した。Shopifyの全店舗が自動で対応ファイルを公開し、MetaのAIエージェント「Muse」も訪問先のサイトでまずPoppyを探すようになった。設計パートナーは新たに60社が加わり、100社を超えた。\n【背景】AIエージェントが買い物や手続きを代行する場面が増えるなか、エージェントが「誰で、何をしてよいのか」を企業側にどう伝えるかが課題だった。Poppyはその最初のやりとりを共通化する規格で、SierraとMetaが共同で進めてきた。発表までの5週間、設計パートナーが実際のウェブサイトやAPI、エージェント相手に試案を検証したという。\n【詳細】企業はドメインの「/.well-known/poppy.json」にファイルを置き、利用できる手段や機能、サインイン方法を示す。署名付きのセッションヘッダーでエージェントと利用者を識別し、実際の操作の許可は標準のOAuthで別途行う。利用者IDは企業ごとに安定する一方、企業をまたいで照合できない仕組みだ。企業側のコンテンツは命令ではなくデータとして扱うなど、プロンプトインジェクション対策も盛り込まれた。\n【ポイント・注意点】仕様書は「ドラフト1.0」とされており、後方互換性のない変更があり得る点には注意が必要だ。Shopifyは175カ国以上の事業者を抱え、商取引の拡張仕様も共同で作った。Mercuryやターキッシュ エアラインズなどが早くも活用を始めており、決済や予約の場面では顧客の承認が残されている。実装キットと検証ツールも提供されている。Poppyは買い物の手続き自体ではなく、その前段階の身元確認と権限の確認を担い、決済はUCPが受け持つ分担になっている。Shopifyは商取引の拡張仕様も共同で作った。規格が広がれば、個人のエージェントがさまざまな店で同じ作法で動けるようになる。","2026-11-13","Unite.AI","https://www.unite.ai/sierra-releases-poppy-1-0-with-shopify-and-meta-muse-support/"],["Google、Gemini 4 Hydrogenを発表 高速・低価格でエージェント作業向け","Googleは11月12日、新モデル「Gemini 4 Hydrogen」を発表した。日常のコーディングやエージェント作業の高速な実行に特化したモデルで、AI StudioやGemini API、Geminiアプリ、Google検索など幅広い場所で使える。料金は100万トークンあたり入力1.50ドル、出力7.50ドルで、100万トークンの窓全体で一律だ。前世代より大幅に速く、誤りも減ったとされる。","\n【概要】Googleは11月12日、新モデル「Gemini 4 Hydrogen」を発表した。日常のコーディングやエージェント作業の高速な実行に特化したモデルで、AI StudioやGemini API、Gemini for business、Geminiアプリ、Google検索、Antigravityなど幅広い場所で使える。料金は100万トークンあたり入力1.50ドル、出力7.50ドルで、100万トークンの窓全体で一律となっている。\n【背景】Gemini 4には深い推論に強い「Carbon」や「Argon」があるが、日常の作業では速さと効率が求められる。Hydrogenはその実行役を担う位置づけで、単体でも使えるほか、CarbonやArgonと組み合わせる多モデル運用も想定されている。Antigravityの「Orchestrator」は、同じ作業の中でモデルを動的に切り替え、Carbon並みの成功率を保ちながら使用量を平均24%減らし、19%速く終えたという。\n【詳細】性能面では、Artificial Analysisの知能指数で既定の高思考レベルが51となり、Argonの50を上回った。最も高いxhighでは54に達する。前世代のGemini 3.8 Flashと比べ、作業は2.5倍速く、Terminal-Bench 4.1の得点は18.2%から57%へと3倍以上に伸びた。作り話のような誤った主張も5分の1以下に減ったという。思考レベルは低・中・高・xhighの4段階から選べる。\n【ポイント・注意点】安全性の面では、エージェント作業での行き過ぎを最大81%、対応不足を最大79%減らし、誤った行動や作業の手抜きを12分の1に抑えたとしている。間接的なプロンプトインジェクションへの耐性も高まったという。ただしこれらの数値はGoogle自身の評価によるもので、独立した検証はまだない。まずは自分の用途で試し、速度と品質のバランスを確かめるのがよさそうだ。HydrogenはGeminiアプリのモデル選択からも利用でき、検索では全ユーザーに順次展開される。まずは日常の作業で試してみるとよい。","2026-11-12","Googleブログ","https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-hydrogen/"],["エヌビディア、フアンCEOが辞任 財務トップのクレス氏が暫定CEOに","エヌビディアは11月12日、共同創業者ジェンスン・フアン氏が社長兼最高経営責任者と取締役を即日辞任したと発表した。後任が決まるまで、エグゼクティブバイスプレジデント兼最高財務責任者のコレット・クレス氏が暫定CEOを務める。取締役会はハービー・C・ジョーンズ氏を初の取締役会議長に任命した。決算は11月17日に予定通り発表される見通しで、後任選びの期限は示されていない。","\n【概要】エヌビディアは11月12日、共同創業者ジェンスン・フアン氏が社長兼最高経営責任者と取締役を即日辞任したと発表した。後任が決まるまで、エグゼクティブバイスプレジデント兼最高財務責任者のコレット・クレス氏が暫定CEOを務め、財務責任者の職も兼ねる。取締役会はハービー・C・ジョーンズ氏を初の取締役会議長に任命した。\n【背景】フアン氏は1993年の創業から33年間、同社を率いてきた。エヌビディアはAIブームの中心で、AI向け半導体の最大手となっている。クレス氏は2013年9月に入社して以来、財務組織を率いてきた。入社前はシスコやマイクロソフトで約25年間、財務の要職を務めた。取締役会は後任の選定を始め、社内外の候補を検討するとしている。\n【詳細】発表では辞任の理由は示されていない。取締役会は、フアン氏の貢献は計り知れないとして謝意を示した。ジョーンズ議長は、クレス氏が事業や顧客、運営、財務状況を深く理解しており、経験豊かな経営陣に支えられていると述べ、事業や顧客への約束、製品計画は中断なく続くとの見通しを示した。クレス氏も、フアン氏が築いた基盤の上に、顧客や開発者、株主への対応を続けると述べた。\n【ポイント・注意点】次の大きな予定は、11月17日の2026年度第3四半期決算で、従来通り午後1時20分（米太平洋時間）に発表され、午後2時から決算説明会が開かれる。後任の選定に期限は示されていない。辞任の背景をめぐってはさまざまな報道があるが、公式発表には理由が書かれておらず、憶測と切り分けて受け止める必要がある。株価やAI半導体市場への影響にも注目が集まっている。フアン氏の辞任をめぐっては、週末の報道で個人的な問題や調査への言及があったが、公式発表は理由に触れていない。米議会への証言の予定も報じられており、今後の動向が注目される。AI半導体の需要そのものは強く、経営体制の変化が製品計画にどう影響するかが焦点だ。クレス氏は暫定CEOとして、フアン氏が築いた基盤の上に事業を続けると述べた。取締役会は後任選びで社内外の候補を検討するとしており、まずは11月17日の決算説明会での経営陣の発言が注目される。","2026-11-12","NVIDIA","https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Announces-CEO-Transition/default.aspx"],["Anthropic、Claudeが会議に参加する「Claude Meetings」ベータ開始","Anthropicは11月12日、AIアシスタント「Claude」がビデオ会議に参加する新機能「Claude Meetings」のベータ提供を始めた。TeamとEnterpriseプランが対象で、まずGoogle Meetに対応する。Claudeは参加者として会議に入り、会話を追いながら議事録や資料、ホワイトボードをその場で作り、終了後に行動項目をまとめる。","\n【概要】Anthropicは11月12日、AIアシスタント「Claude」がビデオ会議に参加する新機能「Claude Meetings」のベータ提供を始めた。TeamとEnterpriseプランが対象で、まずGoogle Meetに対応し、他の会議ツールへの対応も予定されている。Claudeは参加者として会議に入り、会話を追いながら議事録や資料、ホワイトボードをその場で作る。\n【背景】これまでの会議支援AIは、会議後の要約が中心だった。Claude Meetingsは会議の最中から働き始める点が特徴で、議論が終わるのを待たずに作業に取りかかれる。Anthropicは11月10日にClaude SheetsやWhiteboardsなど職場向け機能をまとめて発表しており、Meetingsはその流れを締めくくる機能となる。\n【詳細】参加者は「Claude、この計画の文書を作って」と声やチャットで頼むと、Claudeがそれまでの発言をまとめた文書を作り、他の参加者が話し合いながら編集できる。予算の質問には、承認を得て過去の費用を調べてチャットに投稿する。会議後、議事録や行動項目、作った資料はclaude.aiの会議ページに残る。音声は保存せず、会話の記録と要約、画面の説明だけを保存する。GongやGranolaなど外部ツールとの連携も進められている。\n【ポイント・注意点】社外の招待者がいる会議には、既定ではClaudeは参加せず、途中で社外の人が入ると退出する。管理者が許可すれば参加も可能だ。ゼロデータ保持やHIPAA対応、顧客管理の暗号鍵を使う組織はベータの対象外となっている。ベータ期間中、議事録と回答は無料で、会議中に作った文書やホワイトボードは2027年2月10日まで無料だ。導入前には、参加者全員が記録されることに同意しているか確認しておきたい。会議の招待状からClaudeを追加でき、自動参加の設定も用意されている。Teamプランでは既定で有効、Enterpriseプランでは管理者が有効化する。参加者全員が記録に同意しているか、事前に確認しておくことが大切だ。まずは社内の定例会議で試すのがよさそうだ。","2026-11-12","Anthropic","https://claude.com/resources/articles/claude-meetings"],["Fireworks AIの侵害でNotionのAI会話記録が流出 約1%の顧客に影響","AI基盤のFireworks AIへのサイバー攻撃で、NotionのAIチャットの記録が流出していたことが分かった。Notionは11月12日までに、約1%の顧客が影響を受けたと確認した。流出したのは、利用状況を分析する「Insights」機能のために使われたNotion AIの会話記録で、入力と出力の両方が含まれていた。Notionは11月3日にFireworksとの接続を切断した。","\n【概要】AI基盤のFireworks AIへのサイバー攻撃で、NotionのAIチャットの記録が流出していたことが分かった。Notionは11月12日までに、約1%の顧客が影響を受けたと確認した。流出したのは、利用状況を分析する「Insights」機能のために使われたNotion AIの会話記録で、入力と出力の両方が含まれていた。Notionは11月3日にFireworksとの接続を切断している。\n【背景】Fireworks AIは、開発者がオープンなAIモデルを利用するための基盤で、世界に数万の顧客を抱える。攻撃者は同社のクラウド事業者を経由して開発用システムに入り込み、顧客の請求情報や一部のデータセットを奪った。Fireworksは攻撃者が金銭目的で、言語モデルの利用権を不正に売る狙いだったとみている。10月にも別のセキュリティ事案があり、2カ月連続の侵害となった。\n【詳細】Notionによると、Fireworksから11月2日に不正アクセスの連絡を受け、11月3日の朝までにシステムの接続を切り、保存データを削除し、通信をすべて止めた。11月6日に顧客データへのアクセスの可能性が知らされ、11月8日に最終的な対象データが確認された。流出した記録の多くは、誰のものか特定できない状態だったという。NotionはInsights機能を停止し、Fireworks経由のオープンウェイトモデルの提供もやめた。\n【ポイント・注意点】Notionは影響を受けた顧客に直接連絡しており、連絡がなければ今のところ対応は不要としている。ただし、AIチャットにパスワードやAPIキーなどの秘密情報を入力していた場合は、漏洩を前提に変更を検討した方がよい。今回の件は、契約先のさらに先にある事業者にデータが渡る「再委託」の危うさを示しており、AIツールの利用時に自分の入力がどこに送られるかを確認する大切さが浮き彫りになった。Fireworksへの攻撃は、モデルの利用権を盗んで転売する「LLMジャッキング」と呼ばれる手口と結び付けられている。Uberの運転手情報も同じ事業者を経由して流出したとする報道もあり、影響はNotionだけにとどまらない。利用中のサービスがどの事業者にデータを預けているか、改めて確認しておきたい。","2026-11-12","TechCrunch","https://techcrunch.com/2026/11/12/cyberattack-on-fireworks-ai-allowed-hackers-to-access-notion-customers-chat-transcripts/"]],"gh-pop":[["APKをダブルクリックでWindowsアプリ化「apkstart」","WindowsでAPKをダブルクリックするだけで、Androidアプリをネイティブソフトのように使えるようにするツールです。11月15日のGitHubトレンドで1日に2,134スターを集めました。アプリごとに独立した窓とデスクトップアイコンが作られ、共有フォルダーでファイルもやり取りできます。実行環境は自前で用意され、他社のエミュレーターは要りません。Windowsの検索やスタートメニューからも呼び出せます。","\n【概要】ApkStartは、Windows上でAndroidアプリをネイティブアプリのように扱えるようにするオープンソースの実行環境です。APKファイルをダブルクリックすると自動で解析とインストールが進み、アプリのアイコン付きショートカットがデスクトップとスタートメニューに作られます。起動したアプリは独立したウィンドウで表示され、Windowsの検索からも呼び出せます。2026年11月15日のGitHubトレンドでは1日に2,134スターを集め、注目を集めました。【背景】WindowsではAndroidアプリを動かす手段が限られ、エミュレーターの画面を開いてからアプリを選ぶ手間がありました。Windows Subsystem for Androidの提供終了後、代わりになる環境を探す人も増えています。ApkStartはそうした不便をなくし、アプリを直接起動できる体験を目指して作られました。2026年10月29日に公開された比較的新しいプロジェクトです。【詳細】実行環境はQEMUとAndroid Emulator、Android 14のシステムイメージを組み合わせたもので、初回起動時に公式の提供元から取得して展開します。インストール版は約1.3ギガバイトの単一ファイルに実行環境を内包し、軽量版は95メガバイトで初回に環境をダウンロードします。アプリのデータは共有フォルダーを通じてWindows側とやり取りでき、起動に失敗した場合は自動で再試行やデータのリセットを行います。冷えた状態からの起動は約23秒、スナップショットからは約10秒と説明されています。【ポイント・注意点】ネットワークはホストの回線をそのまま使い、仮想ネットワークアダプターを作らない設計です。ARMのみのアプリは互換モードで動かせますが、一部のアプリはセンサーや通信回線の検査で動かない場合があります。容量が大きいため、空き容量と初回ダウンロードの時間には余裕が必要です。ライセンスはMITで、スター数は確認時点で4,831でした。","2026-11-15","GitHub","https://github.com/RoutineMiku/apkstart"],["最新ウェブ作法をエージェントに教える「modern-web-guidance」","ブラウザーの開発チームが監修する、コーディングエージェント向けの最新ウェブ開発ガイド集です。11月15日のGitHubトレンドで1日に1,231スターを集めました。250件のモダンな機能を収録し、古い書き方を検出して置き換え案を示す仕組みも備えます。エージェントが古い定番コードを生成しがちな問題に応える試みです。導入は対話式の命令ひとつで進み、既存のコードを調べる機能も備えます。","\n【概要】Modern Web Guidanceは、コーディングエージェントに最新のウェブ開発の作法を教えるためのスキル集です。Google Chrome、Microsoft Edge、Mozilla Firefox、MDNの各チームが監修し、250件のモダンなウェブ機能に関するガイドを収録しています。エージェントが古い書き方を生成しがちな問題に応え、ネイティブのブラウザー機能を生かした実装へ導きます。2026年11月15日のGitHubトレンドでは1日に1,231スターを集めました。【背景】AIモデルは学習データに古いコードを多く含むため、ブラウザーに標準搭載された新しい機能があるのに、重いJavaScriptで同じことを実現するコードを書きがちです。機能の存在を知っていても、実務で使える形の書き方までは身についていない場合があります。このプロジェクトは、専門家が精選した指針をエージェントの作業中に直接届けることで、そうしたずれを正す狙いがあります。【詳細】コマンドラインからはガイドの検索や番号指定での取得、コード全体の古い書き方の検査ができます。導入はnpx modern-web-guidance@latest installという対話式の命令で進みます。収録内容はCSSとレイアウトが140件、HTMLとDOMが36件、JavaScriptとAPIが74件で、ほかにアクセシビリティや組み込みAI、パフォーマンスなども扱います。ガイドはトークン効率を意識して作られ、評価で効果の低い内容は削られています。評価では各ガイドの効果を確かめ、モデルが既に知っている内容は削る方針です。ブラウザーの互換性データも含み、古い書き方の置き換え案を示します。【ポイント・注意点】対象はあくまでコーディングエージェントの支援で、ブラウザーそのものの機能ではありません。導入前に、自分の開発環境やエージェントが対応しているかを確認してください。内容は日々更新されるため、定期的な更新が推奨されています。ライセンスはApache-2.0で、スター数は確認時点で6,815でした。","2026-11-15","GitHub","https://github.com/GoogleChrome/modern-web-guidance-src"],["エージェントがChromeを直接操る「chrome-devtools-mcp」","コーディングエージェントが実際のChromeを操作し、デバッグや性能計測を行えるようにする公式ツールです。11月15日のGitHubトレンドで1日に664スターを集めました。MCPサーバーとコマンドラインの両方で使え、ネットワークやコンソール、スクリーンショットを確認できます。性能や表示崩れの調査をエージェントに任せられる点が魅力です。対応するエージェントはClaudeやCursor、Copilotなどです。","\n【概要】chrome-devtools-mcpは、コーディングエージェントが実際のChromeブラウザーを操作して調べるためのツールです。MCPサーバーとして使う方法と、コマンドラインから直接操作する方法の両方が用意されています。エージェントはページを開き、ネットワーク通信やコンソールの内容、スクリーンショットを確認しながら、表示崩れや性能の問題を調べられます。2026年11月15日のGitHubトレンドでは1日に664スターを集めました。【背景】これまでブラウザーの動作確認は人の手で行うのが一般的で、エージェントに任せると画面の様子が分からず調査が止まる場面がありました。開発者ツールは強力ですが、エージェントから直接使う手段がありませんでした。このツールは、Chrome DevToolsの力をエージェントにそのまま渡し、自動化やデバッグ、性能分析を頼めるようにしたものです。【詳細】主な機能は、性能トレースの記録と改善点の抽出、ネットワーク要求の分析、スクリーンショットの取得、ソースマップ付きのコンソール確認です。自動化にはPuppeteerを使い、操作の完了を待ってから次へ進みます。導入はMCPクライアントの設定にnpxで起動する記述を加えるだけで、最初の確認には「Check the performance of https://developers.chrome.com」という指示が例示されています。アクセシビリティやCookie、表示速度、メモリ漏れなどの専用スキルも同梱されています。【ポイント・注意点】ブラウザーの内容はMCPクライアントに渡されるため、機密情報や個人情報を含むページでの利用には注意が必要です。利用統計は既定で収集され、--no-usage-statisticsで止められます。対応ブラウザーはGoogle ChromeとChrome for Testingのみで、ほかのChromium系は保証されません。ライセンスはApache-2.0で、スター数は確認時点で56,704でした。","2026-11-15","GitHub","https://github.com/ChromeDevTools/chrome-devtools-mcp"],["投資判断の手順をClaudeに委ねる「claude-trading-skills」","個人投資家向けに、市場分析や銘柄選定、売買計画、取引日誌までをClaude Codeのスキルとしてまとめた道具箱です。11月15日のGitHubトレンドで1日に553スターを集めました。APIなしで始められる手順も用意され、判断はあくまで人が行う設計です。売買シグナルの配信ではなく、意思決定の型を整えるためのものです。長期投資と配当株を中心に、規律ある取引を目指す人向けです。","\n【概要】claude-trading-skillsは、個人投資家のための取引ワークフローをClaudeのスキルとしてまとめた道具箱です。市場分析やテクニカルチャート、経済カレンダー、銘柄スクリーニング、取引戦略の立案までを扱います。売買の判断をAIに丸投げするのではなく、市場の点検やリスク管理、取引計画、振り返りを型に沿って進めるためのものです。2026年11月15日のGitHubトレンドでは1日に553スターを集めました。【背景】時間に制約のある個人投資家は、日々の市場確認や保有銘柄の点検、取引の記録まで手が回らないことがあります。場当たり的な判断が続き、振り返りもされないまま同じ失敗を繰り返しがちです。このプロジェクトは、長期投資や配当株を中心にしつつ、規律あるスイング取引を衛星戦略として組み合わせる人のために、著者自身の手順を公開したものです。著者はまず自分の取引手順を整えるために作り、共有することで改善を図る姿勢を掲げています。【詳細】15分の日次市場チェックや週次のポートフォリオ点検、スイング候補の探索、取引後の振り返りなど、目的別のワークフローが用意されています。始めは有料の市場データAPIなしで動く5つのスキルから入る道筋があり、公開CSVやチャート画像、ローカルファイルで市場確認ができます。FMPやAlpacaなどは銘柄選定や口座連携など一部の手順でのみ必要です。技能は市場環境、保有銘柄、配当収入、好機探索、取引計画、取引記憶、戦略研究など分野別に分かれています。日本語のREADMEとプロジェクトの展望文書も用意されています。一部の手順ではFMPやFINVIZ Elite、Alpacaといった外部サービスとの連携が必要です。【ポイント・注意点】教育や研究、意思決定の改善が目的で、投資助言や売買シグナルの配信ではありません。自動売買は行わず、注文や最終判断は人が行います。過去の成績やバックテストが将来の利益を保証するものではない点に注意してください。ライセンスはMITで、スター数は確認時点で5,261でした。","2026-11-15","GitHub","https://github.com/tradermonty/claude-trading-skills"],["自社製品に表計算を組み込める「Univer」オフィスSDK","表計算や文書を自社製品に組み込めるオープンソースのオフィスSDKです。11月15日のGitHubトレンドで1日に495スターを集めました。数式や共同編集、ファイル処理を備え、アプリやAIエージェントからAPIで操作できます。オフィス機能を一から作らずに製品へ載せたい開発者に向けたものです。表計算のほか文書やプレゼン、表やPDFも製品の対象で、用途は幅広いです。","\n【概要】Univerは、自社製品の中に表計算や文書の編集機能を組み込めるオープンソースのオフィスSDKです。表計算シートと文書を中心に、数式計算や描画、共同編集、ファイルの入出力といった機能を提供します。アプリやAIエージェントはFacade APIと呼ばれる窓口から同じ内容を操作でき、編集と計算が連動します。2026年11月15日のGitHubトレンドでは1日に495スターを集めました。【背景】表計算や文書編集を自社製品に入れたい場合、一から作るのは大きな負担です。既存の表計算ソフトに頼ると、製品の画面や権限管理と切り離されてしまいます。Univerは、編集や計算の中核を部品として提供し、製品側のデータや権限のまま使える形を目指しています。AIエージェントから表を操作したいという需要にも応えています。表や文書を製品に載せる需要は、業務ソフトやAI製品の広がりとともに増えています。【詳細】Web SDKが基盤で、内容のモデルや編集、描画、数式エンジン、プラグインの仕組みをApache-2.0で公開しています。導入はpnpm add @univerjs/presets @univerjs/preset-sheets-coreで始められ、数行の初期化で表計算エディターが画面に現れます。表の値を書き換えると数式が自動で再計算され、保存はJSONのスナップショットとして扱います。サーバーSDKが共同編集や履歴、ファイル変換を担い、AI SDKがエージェント連携を担います。表計算ではセルの書式や結合、固定表示、数式、並べ替え、条件付き書式、コメントなどが使えます。【ポイント・注意点】公開されているのはWeb SDKの中核で、共同編集やファイルの入出力、AI SDKの一部は商用の追加機能です。無料の評価版には透かしや機能制限があるため、導入前に機能比較の確認が必要です。公開パッケージは同じ版でそろえることが推奨されています。版をそろえないと動作が合わない恐れがあるため、更新時は依存関係の確認が必要です。スター数は確認時点で25,331でした。","2026-11-15","GitHub","https://github.com/dream-num/univer"],["自宅Wi-Fiの弱点を点検する「airgorah」","Linux向けのWi-Fiセキュリティ監査ソフトです。11月15日のGitHubトレンドで1日に270スターを集めました。周囲の通信をとらえ、接続中の端末やハンドシェイクを確認し、アクセスポイントのパスワード強度を点検できます。RustとGTK4で作られ、自分のネットワークの点検専用です。他人の回線への使用は違法です。監査の手順や導入方法はプロジェクトの文書にまとまっています。","\n【概要】Airgorahは、Linuxで動くWi-Fiセキュリティ監査ソフトです。周囲のWi-Fi通信をとらえ、アクセスポイントに接続している端末を見つけ、ハンドシェイクやPMKIDを集めてアクセスポイントのパスワードを解析できます。Rustで書かれ、画面部分にはGTK4が使われています。監査の対象は自宅や職場など、自分が管理する回線に限ります。2026年11月15日のGitHubトレンドでは1日に270スターを集めました。【背景】家庭や小規模なオフィスのWi-Fiは、弱いパスワードや古い設定のまま使われていることがあります。問題があっても、実際にどれだけ破られやすいかは試してみないと分かりません。Airgorahは、自分のネットワークの弱点を自分で確かめ、改善につなげるための監査ツールとして作られました。監査の現場で使われるKali Linuxの利用者にも知られています。【詳細】監査の流れは、対応する無線LANカードで周囲の通信をとらえ、対象のアクセスポイントと端末を確認し、認証のやり取りを集めてパスワード解析に進む、というものです。画面は通常のユーザー権限で動き、権限が必要な操作だけ小さな特権エージェントがpolkit経由で認証を求めます。動作にはモニターモードとパケット注入に対応した無線LANカードが必要です。インストール方法と使い方はプロジェクトの文書にまとめられています。画面はGTK4で作られ、特権が必要な操作だけ認証を求める仕組みです。監査ツールは以前からありましたが、画面付きで扱いやすいものは限られていました。対応する無線LANカードがなければ監査は始められないため、事前の確認が必要です。【ポイント・注意点】対象は自分が所有するネットワークの点検に限ります。所有していない回線への攻撃はほぼすべての国で違法で、READMEにも明記されています。Linux専用で、WindowsやmacOSでは動きません。監査の結果はパスワードの見直しや設定の改善に生かすのが目的です。ライセンスはMITで、スター数は確認時点で6,197でした。","2026-11-15","GitHub","https://github.com/martin-olivier/airgorah"],["エージェントのトークン代を削る「caveman」","コーディングエージェントの応答と読み込みを短くし、トークン費用を抑えるツールです。11月15日のGitHubトレンドで1日に227スターを集め、累計は12万を超えました。短い言葉で答える技能と、ログやJSONを圧縮する仕組みを組み合わせ、作業の質を保ったまま安くする狙いです。利用統計は既定で送られます。短く答える技能だけの利用もでき、導入は一命令で済みます。","\n【概要】Cavemanは、コーディングエージェントが使うトークンを減らし、費用を抑えるためのツールです。エージェントの返答を短い言葉に整える技能と、ログやJSON、テスト結果をモデルが読む前に圧縮する仕組みを組み合わせています。コードそのものは正確に保ち、頭の働きは落とさないという考え方です。2026年11月15日のGitHubトレンドでは1日に227スターを集め、スター総数は確認時点で120,364でした。【背景】コーディングエージェントは便利ですが、長い応答や大量のログを何度も読むため、利用料が膨らみやすい問題があります。単に「短く答えて」と頼むだけでは、必要な情報まで削られる恐れがあります。Cavemanは、航空機の整備マニュアルで使われる制限英語の考え方を取り入れ、否定や数字は残しつつ、余分な言葉だけを削る設計にしています。【詳細】6つの部品からなり、短く答える技能、読み込みの圧縮、課題ごとにモデルと手間を選ぶ自動選択、書いたスクリプトを再利用する仕組みなどが含まれます。プロジェクトの説明では、セッション全体で入力トークンを33.2パーセント減らし、自動選択では同じ正答率で54パーセント安くなったとしています。導入はnpx @caveman-ai/cli@latestの一命令で、Claude CodeやCodex、Gemini CLI、OpenCodeなど30以上のエージェントに対応します。Node.js 22.13以上が必要です。短い応答の規則は一文に一つの考えを載せ、20語以内で能動態を使う決まりです。【ポイント・注意点】利用統計は既定で送られ、ランダムな導入IDやOS、IPが含まれます。止める場合は設定で無効化してください。自動選択の利用にはアカウントが必要ですが無料です。測定結果はプロジェクト自身の計測によるもので、環境によって効果は変わります。GitHub Copilotのように回数課金の場合、短い応答では費用は下がらない点に注意が必要です。ライセンスはApache-2.0で、最新版はv4.1.0です。","2026-11-15","GitHub","https://github.com/JuliusBrussee/caveman"],["ターミナルで動くAIコーディング相棒「Qwen Code」","ターミナルを中心に、エディターやデスクトップ、チャットでも使えるオープンソースのコーディングエージェントです。11月15日のGitHubトレンドに入りました。複数のモデル提供元やローカルモデルに切り替えられ、副エージェントや記憶、MCPにも対応します。評価ではSWE-bench Verifiedで76パーセント台の成績が示されています。デーモンとして動かし、複数の画面から同じ作業を共有もできます。","\n【概要】Qwen Codeは、ターミナルで動くオープンソースのAIコーディングエージェントです。エディターやデスクトップアプリ、ウェブ画面、チャット連携でも使え、プロジェクトの説明や修正、テストの実行を任せられます。副エージェントへの作業分担や、セッションをまたぐ記憶、MCPによる外部ツール連携も備えています。2026年11月15日のGitHubトレンドに入り、スター数は確認時点で30,515でした。【背景】コーディングエージェントは種類が増え、特定の会社のモデルや課金に縛られるものも少なくありません。開発者は手元の環境や予算に合わせてモデルを選びたい場面があります。Qwen Codeは、枠組みとQwenモデルをともにオープンソースで育て、提供元の切り替えをしやすくすることで、特定の会社への依存を避ける狙いがあります。【詳細】対応する提供元はOpenAI、Anthropic、Gemini、QwenのAPIに加え、OllamaやvLLMなどのローカルモデルも使え、実行中に切り替えられます。導入はnpm install -g @qwen-code/qwen-code@latestで、Node.js 22以上が必要です。プロジェクト内でqwenと打って起動し、/authで認証方法を選びます。副エージェントやエージェントチーム、動的なワークフロー、計画モードや承認モード、サンドボックスやGitワークツリーによる隔離も用意されています。評価ではSWE-bench Verifiedで76.40パーセントから77.80パーセントの成績が示されています。【ポイント・注意点】デーモンモードは既定で認証なしのループバックで待ち受け、到達できるプロセスがコード実行を含むAPIを使えます。共有の計算機ではQWEN_SERVER_TOKENの設定と--require-authの利用が推奨されています。実験的な機能も多いため、重要な作業では承認モードや隔離の利用が安心です。ライセンスはApache-2.0です。","2026-11-15","GitHub","https://github.com/QwenLM/qwen-code"],["コーディングエージェントの納品を仕切る「LoopForge」","テンセント製の、コーディングエージェントによる納品をチームで回すための自前運用ツールです。11月15日のGitHubトレンドに入りました。チャットで依頼するとDockerの隔離環境で作業し、プルリクエストを作ります。定番の手順はSOPとして保存し、人の承認を挟みながら繰り返し使えます。繰り返し使う手順はSOPとして残し、人の承認を挟みながらチームで回せる設計です。","\n【概要】LoopForgeは、コーディングエージェントを使ったソフトウェアの納品をチームで回すための自前運用ツールです。チャットで依頼を書くと、Dockerの隔離環境でリポジトリをチェックアウトし、エージェントが作業してプルリクエストを作ります。定番の手順はSOPとして保存でき、エージェントやスクリプト、人の承認を組み合わせて繰り返し実行できます。2026年11月15日のGitHubトレンドに入り、スター数は確認時点で1,267でした。【背景】エージェントに「バグを直して」と頼むと、計画を省いたり、テストを忘れたり、途中で止まったりして結果がばらつきます。試作ならそれでも構いませんが、チームで納品するには再現性が必要です。LoopForgeは、役割分担と承認、履歴を仕組みとして備え、同じ手順で同じ品質の納品を繰り返せるようにしたものです。開発の現場では、エージェントの作業を人が確認する仕組みがないと安心して任せられません。【詳細】使い方はチャットで依頼する方法と、SOPを実行する方法の2通りです。SOPはエージェント、スクリプト、人の承認、子SOPの各段階を順に実行し、失敗した段階からやり直せます。実行役はCodeBuddy、Codex、Claude Code、OpenCodeなど10種類のエージェントCLIから選べます。導入はgit cloneの後に./start.shを実行し、MySQLなどを含むDocker構成が立ち上がります。サービスは既定で8090番ポートで待ち受けます。APIなしで試せる見本プロジェクトも用意されています。作業の途中でもチャットから指示を足したり、実行を止めたり、取り消したりできます。【ポイント・注意点】開発中の版で、一部の内部機能はテンセントのCodeBuddy専用です。各実行役にはそれぞれ有料のモデル認証情報が必要です。Dockerソケットを使う構成のため、信頼できるチーム内での利用が前提です。初めて作るアカウントが管理者になるため、公開する前にアクセス制限を確認してください。","2026-11-15","GitHub","https://github.com/Tencent/LoopForge"],["エージェントを画面アプリにつなぐ共通規格「AG-UI」","AIエージェントと画面アプリをつなぐための、出来事を中心とした公開プロトコルです。11月15日のGitHubトレンドに入りました。約16種類の標準イベントで会話の流れや状態共有、人の承認をやり取りし、輸送方法を選びません。MCPが道具、A2Aがエージェント同士を担い、AG-UIは画面との接点を受け持ちます。対応する枠組みは多く、SDKも複数の言語で用意されています。","\n【概要】AG-UIは、AIエージェントと画面のあるアプリをつなぐための公開プロトコルです。エージェント側は約16種類の標準イベントを送り、会話の流れや共有状態、ツール呼び出し、人の承認をやり取りします。輸送方法はSSEやWebSocket、Webhookなどから選べ、特定の技術に縛られません。2026年11月15日のGitHubトレンドに入り、スター数は確認時点で17,633でした。【背景】エージェントが道具を使う規格や、エージェント同士が話す規格は整ってきましたが、画面のあるアプリとつながる部分は各社ばらばらでした。アプリごとに接続方法を変えると、開発の手間が増え、利用者とのやり取りも統一されません。AG-UIは、CopilotKitでの実務経験をもとに、エージェントと画面の接点を共通の約束事として定めたものです。【詳細】特徴は、リアルタイムの会話と双方向の状態同期、生成UIや構造化メッセージ、文脈の追加、フロントエンド側の道具連携、人の承認を挟む協働です。対応する枠組みにはLangChainやCrewAI、Microsoft Agent Framework、Google ADK、AWS Strands Agents、Mastra、Pydantic AI、LlamaIndexなどがあり、OpenAI Agents SDKとの連携は進行中です。SDKはKotlinやGo、Dart、Java、Rust、Ruby、.NETなど幅広く用意されています。始め方はnpx create-ag-ui-app my-agent-appの一命令です。開始時はnpx create-ag-ui-appの一命令で、雛形のアプリが数秒で作れます。【ポイント・注意点】規格の価値は普及の広がりで決まるため、採用先の対応状況を確認してください。多くの統合文書がCopilotKit側を向いており、言語SDKの一部は有志による保守です。AG-UIの道場では50行から200行ほどの小さな例で部品の動きを確かめられます。対応枠組みのうち一部は進行中で、導入前に最新の対応表の確認が必要です。ライセンスはMITです。","2026-11-15","GitHub","https://github.com/ag-ui-protocol/ag-ui"]],"gh-new":[["DeepSeek V3を190行の純粋JAXで再現しMacで事前学習","DeepSeek V3を約190行の純粋JAXで実装したプロジェクト。MacBook Air M5（24GBメモリ）でゼロから事前学習し、207冊の本からなる21.7Mトークンで12,000ステップを約2.6時間で学習した。検証損失は5.02から3.51へ改善。MLAやDeepSeekMoE、MTPなど本家の主要機構を含み、Show HNでは2026年11月14日に219ポイントを集め、Daily Launchの11月15日版で第1位になった。","\n【概要】DeepSeek V3を約190行の純粋JAXで実装したプロジェクト。MacBook Air M5（24GBメモリ）でゼロから事前学習し、学習の全工程を手元のマシンで再現できることを示した。\n【背景】大規模言語モデルの事前学習は、巨大なGPUクラスタを使うものという印象が強い。しかしこのプロジェクトは、小さなモデルであれば個人のノートPCでも本家と同じ設計思想の学習が回ることを、数字とともに示している。190行という短さは、実装の全体像を一度に読めることを意味し、教育や研究の題材として向いている。\n【詳細】モデルは36.2Mパラメータで、トークンあたり13.6Mが活性化する。207冊の本からなる21.7Mトークンのデータを使い、12,000ステップを約2.6時間で学習した。速度は約10.7kトークン毎秒で、検証損失は5.02から3.51へ改善した。マルチヘッド潜在アテンション（MLA）、DeepSeekMoE、補助損失なしの負荷分散、マルチトークン予測（MTP）など、本家の主要な機構を含んでいる。テストは39件が用意されている。\n【ポイント・注意点】MITライセンスで公開され、2026年11月15日時点のスターは188。Show HNでは2026年11月14日に219ポイントを集め、Daily Launchの11月15日版で第1位になった。チェックポイントはpickle形式で保存されるため、信頼できる出所のものだけ読むようREADMEが注意している。学習済みモデルをそのまま使うというより、仕組みを学び、改造する用途に向いている。公開されたコードはJAXの書き方を学ぶ教材にもなり、MLAやMoEの実装を短い形で読める点が評価された。Show HNの議論では、24GBのメモリで事前学習が回ることへの驚きや、教育用途への期待が寄せられている。モデル規模は小さいため、実用的な対話性能を期待するものではなく、仕組みの理解や実験の土台として扱うのがよいだろう。学習の再現に使える点も魅力だ。","2026-11-13","GitHub","https://github.com/Vaibhaav-Tiwari/deepseek-v3-jax"],["削除ファイルも復旧するNTFS/FAT対応の無料復旧ツール","NTFSやFAT32、FAT16、FAT12、exFATに対応した読み取り専用のファイル復旧ツール。NTFSでは$MFT全体を読み込んでフォルダツリーを再構築し、削除されたファイルも元の場所に表示して復旧できる見込みを示す。内容によるファイル探索や断片化したJPEGの再構築、失われたパーティションの探索、段階的で再開可能なディスクイメージ作成にも対応する。開発段階はベータで、READMEはスペイン語が中心。","\n【概要】NTFSやFAT32、FAT16、FAT12、exFATに対応した、読み取り専用のファイル復旧ツール。誤って消したファイルや読めなくなったディスクから、データを掘り起こすためのもの。\n【背景】ファイル復旧ソフトは有料のものが多く、無料の選択肢は限られる。Reflotaはオープンソースで、ディスクを書き換えずに読み取りだけ行う設計のため、復旧作業中に元のデータをさらに壊す心配が小さい。誤削除やフォーマット後の救出を自分で試したい人に向いている。\n【詳細】NTFSでは$MFT全体を読み込んでフォルダツリーを再構築し、削除されたファイルも元のフォルダに表示して、無事に取り出せる見込みの割合を示す。ファイル名やフォルダ情報が失われている場合でも、内容から30以上の形式を探し出せる。カメラのRAWやPSD、RARなども対象で、断片化したJPEGの再構築や、失われたパーティションの探索にも対応する。ディスクイメージの作成は段階的で再開でき、ddrescue風の進め方ができる。\n【ポイント・注意点】MITライセンスで公開され、2026年11月15日時点のスターは24。開発段階はベータで、READMEはスペイン語が中心のため、英語や日本語の利用者は翻訳を併用するとよい。Windowsで生のディスクを読み取るには管理者権限が必要。復旧の成否はディスクの状態次第で、作業前のバックアップやイメージ取得が推奨される。復旧ツールは、壊れたディスクを直接いじる前に、まずイメージを取ってから作業するのが定石だ。Reflotaの段階的で再開可能なイメージ作成は、その定石に沿った機能といえる。ベータ版のため、重要なデータの復旧は、まずコピーしたイメージで試し、元のディスクには書き込まない運用が大切だ。スペイン語のREADMEが中心だが、操作の流れは画面の項目から推測しやすく、翻訳ツールと併用すれば十分に扱える。無料で試せる点を生かし、手元の不要なUSBメモリなどで挙動を確かめてから本番に使うと安心だ。","2026-11-13","GitHub","https://github.com/Christ10-8/reflota"],["DeepSeek API直結の静的チャットデモを公式が公開","DeepSeek公式の静的チャットデモ。バックエンドは不要で、ブラウザがDeepSeek APIに直接つながる。オンラインで試すか、リリースのアーカイブをダウンロードしてindex.htmlを開くだけで使える。検索やリンク読み取り、音声入出力、履歴のインポートなど、2026年11月13日にAPIへ追加されたアプリ機能をまとめて試せる。MITライセンスで、公開直後に2,400を超えるスターを集めた。","\n【概要】DeepSeekが公式に公開した、API直結の静的チャットデモ。サーバー側のプログラムは不要で、ブラウザが設定したAPIサービスに直接つながる。オンラインで試すか、リリースのアーカイブをダウンロードしてindex.htmlを開くだけで使える。\n【背景】2026年11月13日、DeepSeekはアプリの裏側にあった検索やファイル読み取り、音声などの機能をAPIとして開発者へ開放した。このデモは、その新しい機能を組み合わせて動く実例として公開された。自分でアプリを作る前に、公式の動きを手元で確かめられる。\n【詳細】複数の会話を扱い、自動タイトルや名前変更、削除、プロンプトの編集、返信の再生成、メッセージの分岐切り替えに対応する。ストリーミング返信や深い思考、スマート検索、リンク読み取り、出典の引用、生成の停止や続きにも対応する。添付ファイルのアップロードや貼り付け、ドラッグ＆ドロップ、音声入力や返信の読み上げ、モバイルでの録音中の音声スペクトル表示も備える。Markdownや構文ハイライト、KaTeXの数式、Mermaidの図にも対応し、簡体字中国語と英語、ライトとダークのテーマ、モバイル表示、履歴のインポートとエクスポートが使える。\n【ポイント・注意点】MITライセンスで、2026年11月15日時点のスターは2,486。既定のモデルはdeepseek-flashで、Anthropic互換のMessagesとFilesのAPIを使う。APIキーと設定はブラウザのlocalStorageに、会話と添付ファイルはIndexedDBに保存される。履歴のインポートはZIPで行い、成功するとローカルの会話が置き換わる。利用にはDeepSeekのAPIキーが必要で、APIの利用は有料。デモ用途として公開されている点に注意したい。公開直後にスターが2,400を超えたことは、DeepSeekのAPI新機能への関心の高さを表している。デモのコードは、自分のアプリに同じ機能を組み込む際の参考実装としても読める。APIキーをブラウザに保存する仕組みのため、共有の端末では使い終わったらキーを消すなど、扱いに気をつけたい。","2026-11-12","GitHub","https://github.com/deepseek-ai/chat-demo"],["FFmpegをGUIで操る軽量ポータブル動画トリマー","Windows 10/11向けの軽量ポータブルなFFmpeg GUIとロスレス動画トリマー。exeとlibvlc.dllの2ファイルを同じフォルダに置くだけで動き、インストールは不要。英語・ロシア語・中国語・ドイツ語・フランス語・イタリア語の6言語に対応する。無劣化トリミングやクロップ、圧縮・変換、字幕編集、FFmpegコマンド生成、バッチ処理を備え、スターは1,500を超えている。","\n【概要】Windows 10と11向けの軽量ポータブルなFFmpeg GUIと、画質を落とさない動画トリマー。exeとlibvlc.dllの2ファイルを同じフォルダに置くだけで動き、インストールは不要。\n【背景】FFmpegは強力だがコマンド操作が前提で、ちょっとした切り出しにも調べ物が必要になる。このツールは、よく使う操作を画面から選べるようにしたもので、動画の切り出しや変換を手軽に済ませたい人に向いている。ポータブルなので、USBメモリに入れて持ち歩く使い方もできる。\n【詳細】無劣化トリミングやクロップ、圧縮・変換に対応し、MP4やMKV、WebM、AVI、MOV、GIF、APNG、MP3、WAV、FLAC、OGGなどを扱える。字幕の編集やFFmpegコマンドの生成、バッチ処理も備える。英語・ロシア語・中国語・ドイツ語・フランス語・イタリア語の6言語に対応している。\n【ポイント・注意点】2026年11月15日時点のスターは1,539。リポジトリのメタデータはMITとされているが、READMEにはGPL v3.0と書かれており、ライセンスの表記が食い違っている。利用や再配布の前には、リポジトリ側の最新の表記を確認したい。実行にはFFmpeg本体が別途必要な場合があるため、導入時の案内に従って用意するとよい。コマンド生成の機能があるため、GUIで選んだ操作がどのようなFFmpegコマンドになるかを学べる点も便利だ。バッチ処理を使えば、複数の動画に同じ処理をまとめて適用できる。インストール不要のポータブルな作りは、職場や他人のPCで一時的に使いたい場面にも向いている。対応する入出力の形式が多いため、動画の切り出しだけでなく、音声の抜き出しや形式変換にも使える。ただしライセンス表記の食い違いがあるため、業務での利用や再配布を考える場合は、事前にリポジトリの表記をよく確認してから判断したい。導入のハードルが低く、すぐに試せる点が魅力だ。動画編集の入門用としても扱いやすく、まずは手元の動画で切り出しを試すとよい。","2026-11-12","GitHub","https://github.com/DevedevT/FFmpeg-GUI-Editor-Windows"],["MagSafeの充電ランプを就寝時に消すMacメニューバーアプリ","MacBookのMagSafe充電ケーブルのランプを、眠るときや集中するときに消すメニューバーのアプリ。フォーカスモードに連動して消灯し、終わればmacOSへ制御を戻す。1時間だけ消すスヌーズや22時から7時などの消灯スケジュール、残量20%未満では点けたままにする保護機能も備える。Apple Silicon搭載MacBookとMagSafe 3、macOS 26以降が必要で、MITライセンス。","\n【概要】MacBookのMagSafe充電ケーブルのランプを、眠るときや集中するときに消すメニューバーのアプリ。フォーカスモードに連動し、終われば制御をmacOSへ戻す。\n【背景】MagSafeの琥珀色から緑色に変わるランプは、机の上では心地よいが、真夜中の暗い寝室ではまぶしい。Emberはその小さな不満に応えるもので、充電そのものには触れず、ランプだけを制御する。メニューバーに住む小さな炎のキャラクターが、消灯中は眠り、点灯中は目覚め、電池残量が少ないと目を見開き、つつくとウィンクする。\n【詳細】フォーカスフィルターを追加した睡眠やおやすみモード、仕事などのフォーカス中はランプを消し、終われば元に戻す。自動・常に消灯・常に点灯の3つのモードがあり、1時間だけ消すスヌーズや、22時から7時といった消灯スケジュールも使える。充電中で残量が20%未満のときは、充電中と分かるようランプを点けたままにする保護機能がある。macOSが接続やスリープ、復帰のたびにランプを初期状態へ戻しても、Emberが元に戻す。ショートカットやSiriからモード変更や消灯、ウェーブ操作もできる。ウェーブは実際のランプを点滅させ、暗闇でケーブルを探せる。\n【ポイント・注意点】MITライセンスで、2026年11月15日時点のスターは13。Swift製で、Apple Silicon搭載MacBookとMagSafe 3、macOS 26以降が必要。ランプの制御には管理者権限のヘルパーが必要で、ヘルパーはSMCのACLCという1つのキーに、ランプの状態だけを書き込む。終了やクラッシュ、アンインストール時にはランプを通常へ戻す。ネットワークへの送信はなく、更新確認だけがGitHubへ問い合わせる。リリースv1.0.1が11月13日に出ており、Show HNには11月14日に登場した。まだ生まれたばかりの小さなプロジェクトとして見守りたい。v1.0.1では、ダウンロードしたアプリをApplicationsへ移すよう促す改善や、アンインストールの完了など、細かな不具合の修正が行われた。小さな不満を丁寧に解く作りで、MagSafeのランプが気になるMacBookユーザーには試す価値がある。","2026-11-12","GitHub","https://github.com/Getterbetter/ember"],["コーディングエージェント専用ブラウザ、タブを止めて省メモリ","macOS向けのコーディングエージェント用ブラウザ。WebKitとSafariエンジンを採用し、フォーカスを奪わない1つのウィンドウで複数のエージェントがシェルから操作できる。ダッシュボードで全タブをライブ表示し、使っていないタブは止めてメモリを抑える。アイドル状態の5ページで590MBと、ヘッドレスChromeの730MBやPlaywright版Chromeの1.6GBより軽い。macOS 26以降が必要。","\n【概要】macOS向けのコーディングエージェント用ブラウザ。WebKitとSafariのエンジンを使い、フォーカスを奪わない1つのウィンドウで、複数のエージェントがシェルから操作できる。\n【背景】コーディングエージェントを並行で動かすと、ブラウザのタブやウィンドウが増えて画面が散らかり、メモリも食う。agwebは、エージェントがブラウザを道具として使う前提で作られており、人の作業を邪魔せず、裏側で静かに動くことを目指している。\n【詳細】複数のエージェントが1つのウィンドウを共有し、シェルから操作できる。ダッシュボードでは全タブをライブ表示でき、使っていないタブは止めてリソースを抑える。READMEの計測では、アイドル状態の5ページでagwebが590MB、ヘッドレスChromeが730MB、Playwright版Chromeが1.6GBとなっている。広告ブロックにはuBlock Originのリストを使う。\n【ポイント・注意点】MITライセンスで、2026年11月15日時点のスターは214。Swift製で、macOS 26以降が必要。人のための普通のブラウザというより、エージェントと一緒に使うための道具なので、導入の前にREADMEの使い方を確認したい。計測値はREADMEに載る開発者の環境でのもので、自分の環境では結果が変わりうる。エージェントがブラウザを操作する流れでは、人が画面を見ている最中にウィンドウが前面へ出てくると作業が中断される。agwebはその割り込みを避ける設計で、裏側の作業と人の作業を分けている。ダッシュボードで全タブを一覧できるため、複数のエージェントが何を開いているかを一目で確かめられる。アイドル時のタブ停止は、長時間動かし続ける運用でのメモリ節約につながる。macOS 26以降という条件があるため、古いOSでは使えない点には注意したい。エージェントとブラウザを組み合わせた開発スタイルを試している人には、注目の道具だ。人の作業を邪魔しない点が、このブラウザの持ち味だ。","2026-11-11","GitHub","https://github.com/paul-nameless/agweb"],["人型ロボットの全身モーション追従を1つの世界モデルで学習","人型ロボットの全身モーショントラッキングを、1つの微分可能なワールドモデルで学習する研究プロジェクト。mjlabを基盤とし、タスクIDとしてSuperMimic-GenCoord-G1やSuperMimic-MaxCoord-G1などが用意されている。READMEは短く詳細は乏しいものの、Apache-2.0ライセンスで公開され、スターは1,500を超えた。ロボットの全身制御や模倣学習に関心がある人向けの話題作。","\n【概要】人型ロボットの全身モーショントラッキングを、1つの微分可能なワールドモデルで学習する研究プロジェクト。mjlabを基盤としている。\n【背景】人型ロボットに人の動きをまねさせるには、全身の関節やバランスを同時に扱う必要があり、制御の設計が難しい。SuperMimicは、その課題を1つの学習可能な世界モデルにまとめる発想で取り組んでいる。ロボット学習の研究者や、全身制御に関心がある人にとって、注目の題材だ。\n【詳細】タスクIDとしてSuperMimic-GenCoord-G1やSuperMimic-MaxCoord-G1などが用意されており、座標系や追従の条件を変えた学習の枠組みが示されている。READMEは短く、詳細な説明や使い方の記述は乏しいため、具体的な中身はリポジトリのコードやタスク定義を直接読む必要がある。\n【ポイント・注意点】Apache-2.0ライセンスで公開され、2026年11月15日時点のスターは1,534。話題性のわりにREADMEの情報が少なく、導入や再現のハードルは高めに見える。研究目的で眺める分にはよいが、すぐに動かして使う類のものではない。興味がある人は、タスクIDを手がかりにコードを追うと全体像がつかみやすい。人型ロボットの全身制御は、腕や脚、胴体の動きを同時に調整する必要があり、部分ごとに作った制御をつなぎ合わせるだけではバランスが崩れやすい。1つの世界モデルにまとめる発想は、その調整を学習に任せる方向だ。mjlabを基盤としているため、シミュレーション環境での検証が前提になっていると考えられる。タスクIDが複数あることから、座標系や追従の条件を変えた比較ができる枠組みになっている。READMEの記述は短いため、導入にはコードを読む手間がかかるが、ロボット学習の研究者にとっては、発想そのものが参考になる話題作だ。公開直後のスター数の伸びは、この分野への関心の強さを示している。全身のモーション追従は、ゲームやアニメーションのキャラクター制御にも通じる技術で、ロボット以外の応用も考えられる。ただし研究段階のプロジェクトのため、実機での動作や具体的な性能は、リポジトリの今後の更新を待つ必要がある。","2026-11-10","GitHub","https://github.com/HybridRobotics/supermimic"],["6つのメディア管理アプリを1つに集約するセルフホスト","Sonarr、Radarr、Lidarr、Bazarr、Prowlarr、Seerrの6役を1つのアプリで担うセルフホスト型メディア管理アプリ。ダウンロードは約16.1MBで、フレッシュインストール時のアイドル使用量は95MiBと軽い。ポート6262で1ログイン・1ポートに集約され、6アプリ合計685.0MBの約43分の1になる。PlexやJellyfin、Embyと連携し、既存設定の移行もできる。Show HNでは2026年11月10日に第1位になった。","\n【概要】Sonarr、Radarr、Lidarr、Bazarr、Prowlarr、Seerrの6役を1つのアプリで担う、セルフホスト型のメディア管理アプリ。\n【背景】映画やドラマ、音楽の管理には、用途ごとに別々のアプリを並べるのが一般的で、導入と保守の手間が増えがちだ。HolyArrsは、それらを1つにまとめて、軽さと手軽さを両立させることを狙っている。自宅サーバーでメディア環境を整えたい人に向いている。\n【詳細】ダウンロードは約16.1MBで、フレッシュインストール時のアイドル使用量は約95MiB。1万タイトルと5.5万本の規模でも約140MiBにとどまる。ポート6262で1ログイン・1ポートに集約され、6アプリ合計685.0MBの約43分の1になる。PlexやJellyfin、Embyと連携し、qBittorrentなどへ送信できる。既存の設定を読み取って移行する機能も備える。\n【ポイント・注意点】AGPL-3.0ライセンスで公開され、2026年11月15日時点のスターは1,229。Show HNでは2026年11月10日に第1位になった。ダウンロード自体は行わず、管理と連携が役割のため、取得には別途クライアントが必要。電話やTV向けのアプリには未対応で、音楽のExplore機能は開発中。6アプリ分の機能を1つに集めたぶん、設定項目の多さには慣れが必要かもしれない。メディア管理のアプリを6つ並べると、更新や設定、ログインの管理がそれぞれ必要になり、手間が増える。1つに集約することで、その手間をまとめて減らせるのが利点だ。軽量さを売りにしており、古めの自宅サーバーや小型マシンでも動かしやすい。PlexやJellyfin、Embyとの連携があるため、視聴環境を変えずに管理側だけを置き換えられる。既存の設定を読み取って移行できる点も、乗り換えのハードルを下げている。電話やTV向けアプリに未対応な点と、音楽のExploreが開発中な点は、導入前に確認しておきたい。軽さと手軽さが魅力の1本だ。","2026-11-09","GitHub","https://github.com/HolyArrs/HolyArrs"],["マリオカート ワールドをPCネイティブ化する静的再コンパイル","『マリオカート ワールド』（Switch 2）をLinuxやWindows向けのネイティブPCプログラムへ静的再コンパイルするプロジェクト。エミュレーターではなく、AArch64コードを事前にCへ翻訳してコンパイルし、NVN2をVulkan上で再実装する。2026年11月12日時点で起動・メニュー・レースが可能で、ハイエンドGPUで60fps、中位のGPUで30fpsとされる。オンライン対戦はなく、ゲーム本体は自分でダンプしたものが別途必要。","\n【概要】『マリオカート ワールド』（Switch 2）をLinuxやWindows向けのネイティブPCプログラムへ静的再コンパイルするプロジェクト。エミュレーターではない。\n【背景】Switch 2のソフトをPCで遊ぶ方法としては、エミュレーターで動かすのが一般的だが、再コンパイルは別の道だ。ゲームのAArch64コードを事前にCへ翻訳してコンパイルし、ネイティブのプログラムとして動かすことで、実行時の変換コストをなくす狙いがある。\n【詳細】対象はバージョン1.0.0と1.8.0で、NVN2をVulkan上で再実装している。2026年11月12日時点で起動・メニュー・レースが可能で、ハイエンドGPUで60fps、中位のGPUで30fpsとされる。フレーム生成やFSR 1、HDR、GameBananaのMODにも対応している。\n【ポイント・注意点】MITライセンスで公開され、2026年11月15日時点のスターは1,109。オンライン対戦には対応していない。リポジトリやリリースにゲーム本体は含まれず、自分のSwitch 2からダンプしたゲーム本体が別途必要で、約30GBの空き容量が求められる。開発途上のプロジェクトのため、動作する環境やバージョンはREADMEの最新情報を確認したい。静的再コンパイルは、実行時に変換するエミュレーターと違い、事前にネイティブのプログラムへ変換しておく手法だ。変換に時間はかかるが、実行時の負荷は小さくなる。対応するバージョンが1.0.0と1.8.0に限られるため、手元のゲームのバージョンを確認する必要がある。MOD対応があるため、GameBananaのMODで見た目や内容を変えて遊べる。オンライン対戦がない点は、友人と遊ぶ用途では物足りないかもしれない。開発途上のため、今後の更新で対応範囲や性能が変わる可能性がある。自分のSwitch 2からダンプした本体が要る点と、約30GBの空き容量が要る点は、始める前に確かめておきたい。PCで遊べるようになることで、MODや高解像度といったPCならではの楽しみ方が広がる。","2026-11-09","GitHub","https://github.com/adriadam10/mkw-recomp"],["中小企業向けセルフホストAIチームを1台のマシンに","中小企業向けのセルフホストAIチームを1台のマシンに載せるプロジェクト。タスク管理や文書ストア、意味記憶、モデル提供者を前に置くゲートウェイ、操作パネル、ブラウザ内のライブ音声を備える。メールやTelegram、Slack、Webチャット、音声チャンネルに対応する。BashとDockerで動き、1つのコマンドで約30分かけてインストールする。作成日は11月8日で1週間の範囲を1日外れるが、Show HNで11月14日に話題になったため採用した。","\n【概要】中小企業向けのセルフホストAIチームを、1台のマシンに載せるプロジェクト。タスクや目標の管理、文書ストア、意味記憶、モデル提供者を前に置くゲートウェイ、操作パネル、ブラウザ内のライブ音声を備える。\n【背景】AIアシスタントを業務で使うとき、データの置き場所や外部サービスへの依存が気になる。Smart Nodeは、アプリとデータを自分のマシンに置くことを前面に出しており、モデル呼び出しだけが外部へ出る設計だ。小さな会社やチームが、自分で管理できるAIの拠点を作るための試みといえる。\n【詳細】メールやTelegram、Slack、Webチャット、ブラウザ音声のチャンネルに対応する。Googleカレンダーとドライブは部分的で、WhatsAppやSMS、任意の連携はすぐ使える機能ではない。BashとDockerで動き、1つのコマンドで約30分かけてインストールする。DebianやUbuntuの対象マシンに、ローカルのLXCコンテナか既存マシンへ導入でき、200を超えるインストール時の検証チェックが走る。Claudeのサブスクリプションか、AnthropicやOpenAI、Google、OpenRouterなどのAPIキーでAIを動かす。\n【ポイント・注意点】AGPL-3.0ライセンスで公開され、2026年11月15日時点のスターは3。作成日は2026年11月8日で、1週間の範囲を1日外れるが、Show HNで11月14日に話題になったため採用した。README自身が、保守担当のチーム以外はまだインストール手順を最後まで通しておらず、磨かれた製品ではなく試せる段階のソフトだと明言している。ワンコマンドの更新や自動移行、定期バックアップ、オフラインでの導入、ローカルでのモデル実行には未対応で、モデルを使うには提供者の認証情報が要る。インストールには約30分かかり、その間に200を超える検証チェックが走るため、途中で失敗すれば原因を特定しやすい。運用面では、更新やバックアップの手順がまだ整っておらず、使いながら手順書を育てる段階だ。小さなチームがAIの拠点を自前で持つ試みとして、今後の成熟に注目したい。","2026-11-08","GitHub","https://github.com/dklymentiev/smart-node"]],"gh-blog":[["Copilotの6モデルが12月14日に廃止へ、移行先を確認","GitHubは12月14日にCopilotで提供する6つのモデルを廃止すると発表した。Claude Fable 5やGemini 4 Argonなどが対象で、後継モデルへの切り替えが案内されている。年間プランの個人向けにClaude Haiku 4.5が残る例外もあり、利用中のモデルを確認して早めに移行しておきたい。廃止後はモデル選択肢から消えるため、設定の見直しが欠かせない。","\n【概要】GitHubは2026年12月14日に、GitHub Copilotの6つのモデルを廃止すると発表した。対象はClaude Fable 5、Claude Haiku 4.5、Gemini 3.8 Flash、Gemini 4 Argon、Grok 4.6、Kimi K3で、廃止後はチャットやインライン編集、エージェントモード、コード補完を含むすべてのCopilot体験で選べなくなる。後継モデルが案内されており、期限までの切り替えが呼びかけられている。\n【背景】Copilotのモデル選択肢は増え続けており、古いモデルを整理して新しいモデルへ集約する流れが続いている。今回の廃止は11月13日の変更履歴で告知され、約1か月の猶予が設けられた。Fable 5.2やGemini 4 Hydrogenといった後継モデルは、すでにCopilotで一般提供が始まっている。モデルが増えすぎると選びにくくなるため、定期的な整理は避けられない流れだ。\n【詳細】後継モデルは、Claude Fable 5がClaude Fable 5.2、Claude Haiku 4.5がClaude Haiku 5.5、Gemini 3.8 FlashがGemini 4 Hydrogen、Gemini 4 ArgonがGemini 4 Carbon、Grok 4.6がGrok 4.7へとそれぞれ置き換わる。Kimi K3だけは後継が未定とされている。例外として、年間プランの個人向けCopilot利用者にはClaude Haiku 4.5が引き続き提供される。企業やビジネス向けでは、既定のモデル有効化のもと後継モデルが自動で有効になる。廃止されるモデルを削除するための操作は不要で、期日を過ぎれば選択肢から消える。\n【ポイント・注意点】モデルを明示的に指定しているワークフローや統合は、12月14日までに後継へ切り替える必要がある。Kimi K3を使っている場合は後継の発表を待つしかなく、代替の検討もしておきたい。管理者はCopilot設定のモデルポリシーで後継モデルが有効になっているか確認するとよい。移行後は、後継モデルの挙動が従来と違う場合もあるため、しばらくは出力を確かめながら使うのが安心だ。","2026-11-13","GitHub Changelog","https://github.blog/changelog/2026-11-13-upcoming-deprecation-of-selected-github-copilot-models-in-december/"],["CopilotのAI Scan、REST APIで組織単位の管理が可能に","GitHubのコードスキャン「AI Scan」が、REST APIで組織やリポジトリ単位の有効・無効を切り替えられるようになった。パブリックプレビューとして提供される。スクリプトやIaCで一括管理できるようになり、手作業で設定を開く手間が減る。多数のリポジトリを抱える組織ほど恩恵が大きい変更だ。API経由での管理は、組織のセキュリティ運用を自動化する第一歩になる。","\n【概要】GitHubは、コードスキャンのAI ScanをREST APIで管理できるようにした。組織とリポジトリのレベルで有効・無効を切り替えられるパブリックプレビューで、既存のAI Scan有効化エンドポイントにrepository_scanという設定が追加された。スクリプトやIaCで展開できるため、多数のリポジトリを抱える組織の負担が軽くなる。\n【背景】AI Scanは、リポジトリのバックログ全体をAIが走査して脆弱性の候補を探す機能だ。これまでは設定画面での操作が中心で、組織全体への展開には手間がかかった。今回のAPI対応により、プルリクエスト向けのpr_scan設定と並んで、リポジトリ全体のスキャンも同じ枠組みで管理できるようになった。セキュリティ設定をコードで管理する流れにも沿った変更だ。\n【詳細】設定はGETとPATCHの/orgs/{org}/code-scanning/ai-scanと/repos/{owner}/{repo}/code-scanning/ai-scanで操作する。組織が無効にすれば配下のリポジトリは有効化できず、組織が有効にすれば各リポジトリが個別に無効化できる。企業ポリシーでAI Scanが許可されていない場合は422エラーが返る。pr_scanとrepository_scanは同じリクエストで同時に更新でき、どちらかが阻まれると両方とも反映されない。設定の操作には、組織の所有者やセキュリティ管理者、リポジトリの管理者の権限が必要になる。\n【ポイント・注意点】AI Scanを有効にするだけではスキャンは始まらず、書き込み権限を持つ利用者が都度実行する必要がある。実行にはGitHub Code SecurityのAIクレジットを消費する。対象は組織が所有する公開リポジトリと、Code SecurityやAdvanced Securityを持つ非公開・内部リポジトリで、Enterprise Serverは未対応だ。企業ポリシーでの許可が前提になる点にも注意したい。まずは一部のリポジトリで試してから全体へ広げるとよい。","2026-11-13","GitHub Changelog","https://github.blog/changelog/2026-11-13-manage-ai-scan-for-repositories-using-the-rest-api/"],["Copilotアプリが社内GitHubに対応、企業サーバーも使える","GitHub CopilotアプリがGitHub Enterprise Serverに対応し、一般提供が始まった。社内サーバーのリポジトリや課題、プルリクエストをアプリから扱えるようになる。クラウドセッションは対象外で、アプリ1.2.0以降が必要だ。社内開発のチームにとって待たれていた対応といえる。まずは少人数のチームで試し、使い勝手を確かめてから全体へ広げたい。","\n【概要】GitHub CopilotアプリがGitHub Enterprise Serverに対応し、一般提供が始まった。これまでオプトインのプレビューだった機能で、社内サーバー上のリポジトリや課題、プルリクエストをCopilotアプリから扱えるようになる。利用にはCopilotアプリ1.2.0以降が必要で、クラウドセッションはEnterprise Serverでは使えない。\n【背景】Copilotアプリは、クラウド上で動くエージェント型の開発体験をまとめたもので、GitHub.comやGHE.comのアカウントが前提だった。社内サーバーで開発する企業にとっては、クラウド側のアカウントと社内リポジトリを結びつける手段がなく、導入の壁になっていた。今回の対応で、その壁が取り除かれた。\n【詳細】まずGitHub.comまたはGHE.comのアカウントでサインインし、設定の「アカウント」から「アカウントを追加」を選んでGitHub Enterprise Serverを選ぶ。追加後は、社内サーバーのリモートリポジトリや課題、プルリクエストをアプリ内で開いて作業できる。クラウドセッションはEnterprise Serverでは提供されないため、実行環境はローカル側になる。詳細は公式ドキュメントのCopilotとEnterprise Serverの案内にまとめられている。\n【ポイント・注意点】社内サーバーを使う場合も、最初にGitHub.com側のアカウントでのサインインが必須だ。クラウドセッションが使えないため、重い処理をクラウドに逃がす運用はできない。アプリのバージョンが1.2.0未満の場合は、まずアップデートしておきたい。社内ポリシーで外部サービス連携が制限されている場合は、管理者への確認も忘れずに。まずは少人数で試してから全体へ広げると安心だ。導入の際は、社内のGitHub管理者と連携してアカウントの追加手順を確認するとよい。クラウドセッションが使えない点をふまえ、実行環境の用意も事前に済ませておきたい。","2026-11-13","GitHub Changelog","https://github.blog/changelog/2026-11-13-github-enterprise-server-support-in-the-github-copilot-app/"],["休眠リポジトリのDependabot通知、12月8日から自動で停止","GitHubは12月8日から、1年間活動のないリポジトリのDependabotアラートを自動で停止する。既存のアラートは削除されず保管され、いつでも復元できる。脆弱性情報の増加に対応し、活発なリポジトリへの対応を速く保つ狙いだ。放置している公開リポジトリがある場合は、期日までの確認が欠かせない。通知が止まる前に、自分のリポジトリの活動状況を確認しておきたい。","\n【概要】GitHubは2026年12月8日から、過去1年間活動のないリポジトリのDependabotアラートを自動で停止する。既存のアラートは削除ではなく保管され、いつでも復元できる。脆弱性の発見件数とアラート量の増加に対応し、活発に開発されているリポジトリへの対応を速く、確実に保つのが目的だ。\n【背景】Dependabotは依存関係の脆弱性を知らせる仕組みで、使われなくなったリポジトリにもアラートが届き続けていた。通知の量が増えるほど、本当に見るべきアラートが埋もれやすくなる。GitHubは今回、活動のないリポジトリを自動で対象外にすることで、通知全体の質を保つ判断をした。\n【詳細】活動とみなされるのは、ブランチやタグへのプッシュ、リポジトリの作成、Dependabotアラートの有効化のいずれかだ。リポジトリへのプッシュがあればアラートは自動で再開し、保管されたアラートも復元されて1年の時計が振り出しに戻る。設定画面から手動で有効化することもできる。Dependabotアラートを有効にするセキュリティ設定が強制されているリポジトリや、管理者の有効化を許可しない企業ポリシーの対象リポジトリは停止の対象外になる。\n【ポイント・注意点】対象はGitHub.comの全プランと、データレジデンシーを利用するEnterprise Cloudで、Enterprise Serverは対象外だ。休眠中のリポジトリに重要な脆弱性が見つかっても通知が止まるため、定期的に棚卸しをする運用が欠かせない。放置している公開リポジトリがある場合は、12月8日までに活動の有無を確認しておきたい。不要なリポジトリはアーカイブするのも一つの手だ。通知が止まったリポジトリでも、脆弱性そのものが消えるわけではない。定期的に依存関係を見直す習慣をつけるとよい。公開リポジトリの利用者への影響も考え、アーカイブや引き継ぎの判断も早めにしておきたい。12月8日以降、久しぶりに開いたリポジトリで通知が止まっていることに気づく場面も増えそうだ。","2026-11-10","GitHub Changelog","https://github.blog/changelog/2026-11-10-dependabot-alerts-will-pause-on-inactive-repositories/"],["Copilot CLIのC++言語サーバー、MSBuild設定を自動化","GitHub Copilot CLI向けのMicrosoft C++言語サーバーが、MSBuildのコンパイルコマンド抽出を内蔵し、起動時に自動で実行するようになった。従来は設定スキルを探して実行する手間があり、トークンも消費していた。正確なコード補完がすぐ使えるようになり、セットアップの負担が軽くなる。C++のプロジェクトでCopilotを使う人には、うれしい改善といえる。","\n【概要】GitHub Copilot CLI向けのMicrosoft C++言語サーバーが、MSBuildのコンパイルコマンド抽出ツールを内蔵し、プロジェクトを開いたときに自動で実行するようになった。エージェントが設定スキルを探して実行する手間がなくなり、MSBuildのC++プロジェクトでも正確なコードインテリジェンスがすぐに使えるようになる。\n【背景】C++の言語サーバー機能は、compile_commands.jsonというコンパイルデータベースを必要とする。MSBuildのプロジェクトではこれまで、利用者が自分で用意するか、Copilotが設定スキルを見つけて実行して生成する必要があった。発見と実行の分だけセットアップに時間がかかり、トークンも消費していた。\n【詳細】抽出ツールが言語サーバーに同梱されたことで、プロジェクトを開いたタイミングでCopilotが自動的に抽出を実行し、コンパイルデータベースを生成する。生成は決定的な手順で行われ、セットアップにかかるトークン使用量も減る。CMakeのプロジェクトでは従来どおり、コンパイルコマンド生成スキルを使う方法が案内されている。独自のビルドシステムの場合は、独自の抽出スキルを作る手順が用意されている。利用にはCopilotの有料サブスクリプションが必要だ。\n【ポイント・注意点】自動化されるのはMSBuildのプロジェクトだけで、CMakeや独自ビルドは従来の手順が残る。言語サーバーの導入にはクイックスタートの手順に従い、利用規約への同意が必要だ。C++プロジェクトで補完の精度に不満があった場合は、言語サーバーの更新で改善する可能性がある。問題があれば、言語サーバーのリポジトリに報告することもできる。言語サーバーの更新は、Copilot CLIの更新とあわせて行われる。更新後は、MSBuildのプロジェクトを開いて補完が正しく動くか確かめるとよい。設定スキルの用意が不要になった分、プロジェクトの初回セットアップも短くなる。大規模なソリューションでも効果が期待できる。","2026-11-10","GitHub Changelog","https://github.blog/changelog/2026-11-10-c-language-server-now-auto-configures-msbuild-builds/"],["Gemini 4 CarbonがCopilotに登場、12月1日に料金が倍に","Gemini 4 Carbonが11月10日にGitHub Copilotで一般提供になった。対象はPro+以上のプランで、11月30日までは導入価格、その後12月1日から料金が倍になる。難しいエージェント作業向けのモデルで、日常作業にはArgonが向くとGoogleは案内している。試すなら値上がり前が得策だ。料金の変化をふまえ、試用の計画を早めに立てておきたい。","\n【概要】GoogleのGemini 4 Carbonが、2026年11月10日にGitHub Copilotで一般提供になった。利用できるのはCopilot Pro+、Max、Business、Enterpriseで、FreeとProは対象外だ。料金は11月30日まで導入価格で、12月1日からはすべての単価が倍になる。難しいエージェント作業の試用は、値上がり前に済ませておくのが得策だ。\n【背景】Carbonは、Googleが推論を深く行うモデルとして位置づけるもので、Argonが大半のソフトウェア開発に最適とされるのに対し、Carbonは難しい場面向けだ。Copilotでは従来のプレミアムリクエスト倍率ではなく、トークン単位の従量課金で提供される。1AIクレジットは0.01ドルに相当する。\n【詳細】11月30日までの単価は、入力が100万トークンあたり2ドル、キャッシュ入力が0.10ドル、出力が10ドルで、12月1日からはそれぞれ4ドル、0.20ドル、20ドルになる。記事の試算では、一般的なエージェント作業1件が今は0.444ドル、12月以降は0.888ドルになる。対応する画面はVS CodeやVisual Studio、Copilot CLI、Copilotアプリ、GitHub Mobileなど10面で、展開は段階的に進む。GoogleはCarbonがCursorBench 4.0などで首位を取ったとしているが、これはベンダー側の発表だ。\n【ポイント・注意点】Carbonは思考トークンを多く使うため、単価以上に出力側の請求が膨らみやすい。難しい作業に絞って試し、結果を記録してから12月1日以降の使い方を決めるとよい。管理者はモデルポリシーでCarbonが既定で有効になっていないか確認し、必要なら利用を制御しておきたい。日常の補完や小さな編集には、Argonなどの速いモデルを使い分けるのが無難だ。試用では、出力の質とコストの両方を記録しておくと判断しやすい。12月以降の料金で使い続けるかどうか、早めに結論を出しておきたい。","2026-11-14","DEV Community","https://dev.to/shaam_ai/gemini-4-carbon-in-github-copilot-vs-argon-test-by-dec-1-4fc5"],["CopilotがVS Codeの枠を越えた、XcodeとJetBrainsへ","GitHub CopilotがJetBrains AirとXcodeの標準コーディングアシスタントに入った。11月3日と4日に相次いで発表された。Xcodeは27.3ベータからのプレビューで、JetBrains Airではエージェント選択肢の一つとして選べる。長年のVS Code中心の姿が変わり始めた転機といえる。エディタ選びの幅が広がり、開発者の選択肢が増えたといえる。","\n【概要】GitHub Copilotが、JetBrains AirとAppleのXcodeという、マイクロソフト製ではない2つの開発環境に入った。11月3日にJetBrains Airでの提供、11月4日にXcode 27.3ベータでのプレビューが発表された。長くVS Codeのものと思われてきたCopilotが、他のエディタでも第一級の選択肢になり始めた。\n【背景】CopilotはこれまでVS Codeを中心に広がり、他のエディタでは拡張機能として提供されてきた。XcodeではApple純正のコーディングアシスタントに組み込まれ、JetBrains Airではエージェントを選ぶ仕組みの一つとして提供される。開発環境がエージェントを選ぶ場所へ変わりつつある流れを示している。\n【詳細】Xcodeでは、設定の「インテリジェンス」から有効化でき、拡張機能の追加は不要だ。macOS Tahoe 26.6以降が必要で、すべてのCopilotプランが対象になる。安定版のXcode 27.3は12月に予定されている。JetBrains Airでは、エージェント選択画面でCopilotを選べる。ローカル実行と、Air Teamsによるクラウド実行に対応し、クラウド実行の課金はCopilotプラン側に計上される。JetBrains IDE 2026.2.4からは、Next Edit Suggestionsの提供元としてもCopilotを選べる。\n【ポイント・注意点】Xcode側はベータのプレビューなので、リリース作業の本番環境での利用は避け、従来の拡張機能は残しておくのが無難だ。JetBrains Airでは、個人プランと組織プランをタスクごとに切り替えられず、利用状況もAirの分析には含まれない。管理者は、コスト管理がGitHub側で行われる点を押さえておきたい。まずは試用の範囲で使い勝手を確かめるのがよい。まずは試用の範囲で使い勝手を確かめ、本格的な移行は安定版を待つのがよい。エディタごとの違いも確かめておきたい。","2026-11-05","DEV Community","https://dev.to/paullovelace/github-copilot-just-stopped-being-a-vs-code-thing-bn2"],["Copilotの利用料、自分のキー分を分けて見られるように","GitHubは11月3日、Copilotの利用状況APIに自分のキーやローカルモデルを使った分の内訳を追加した。企業や組織の管理者が、Copilot本体の利用と持ち込み分の利用を分けて把握できるようになる。過去のデータの遡及はできない点に注意が必要だ。費用の全体像をつかむ助けになる。API提供元の請求書と突き合わせると、費用の全体像が見えてくる。定期的な確認が大切だ。","\n【概要】GitHubは2026年11月3日、Copilotの利用状況APIに、自分のAPIキーやローカルモデルを使った分を分けて示す項目を追加した。企業や組織の管理者が、Copilot本体の利用と持ち込み分の利用を分けて把握できるようになる。請求書には現れない持ち込み分のコストも、利用状況として見えるようになった。\n【背景】Copilotでは、自分のAPIキーを使うBYOKや、ローカルモデルへの接続が可能だが、これまではその利用がCopilot本体の利用と合算されて表示されていた。チームでAIコーディングの費用を把握しようとしても、どこにいくらかかっているかが見えにくい状態だった。今回の変更で、その内訳が報告に現れるようになった。\n【詳細】追加されたのは、利用者のその日のローカルBYOK利用を示すused_local_byok、種類や画面ごとの内訳を持つtotals_by_local_byok、ローカルBYOKの利用者数、そして企業独自モデルかどうかを示すis_custom_enterprise_modelだ。ローカルBYOKには、開発者が自分の端末で設定するものと、管理者が組織に設定する企業独自モデルの2種類がある。同じモデルが両方で使われた場合は、両方の集計に現れる。あわせて、Dependabotがエージェントスキルの依存関係を更新する対応も同じ変更履歴で発表された。\n【ポイント・注意点】ローカルBYOKの項目はクライアントのテレメトリに依存し、無効にしていると過小に表示される。過去のデータに新しい項目は追加されず、きれいな内訳が取れるのは11月3日以降の分からだ。閲覧には利用状況メトリクスの閲覧権限と、利用状況メトリクスポリシーの有効化が必要になる。API提供元の請求書と突き合わせて確認する運用が望ましい。利用状況の内訳は、定期的に確認して費用の変化を追うとよい。ローカルモデルの利用が増えている場合は、GPUや電力のコストもあわせて見ると全体像がつかめる。管理者と開発者で数字を共有しておくことも大切だ。","2026-11-07","DEV Community","http://dev.to/ahtisham_lala_a1af953f29b/github-copilot-just-separated-your-byok-spend-from-its-own-heres-what-the-new-usage-api-actually-11ha"],["Copilot週間更新、JetBrains Air対応とPR自動マージ","GitHub Copilotの週間更新で、JetBrains AirとXcode 27.3ベータへの対応、プルリクエストの自動マージ機能、VS Code 1.145の定時実行などが入った。複数のセッション管理や推論過程の表示も改善され、開発の定型作業が進めやすくなっている。11月6日にまとめられた内容だ。定型作業の自動化が進み、日々の開発が少し楽になりそうだ。","\n【概要】GitHub Copilotの週間更新で、JetBrains AirとXcode 27.3ベータへの対応、プルリクエストの自動マージ、VS Code 1.145の定時実行などがまとめて入った。11月6日にまとめられた内容で、IDEの広がりと、繰り返しの開発作業を自動化する方向の強化が目立つ。\n【背景】Copilotは11月初めにJetBrains AirとXcodeへの対応を相次いで発表し、VS Codeも1.145へ更新された。週間更新はこれらを一つの流れとして整理したもので、複数セッションの調整やプルリクエスト処理の手間を減らす改善が並んでいる。\n【詳細】JetBrains Airでは、既存のサブスクリプションでローカル実行とAir Teamsのクラウド実行が使える。Xcode 27.3ベータでは、標準のコーディングアシスタントにCopilotが入った。CopilotアプリにはAgent Mergeが追加され、レビューや必須チェックがすべて通った時点でプルリクエストを自動でマージする。My Workでは保存できるカスタムビューの上限が10件を超えて増えた。VS Code 1.145では、モデルの推論過程やツール実行を折りたたんで表示する実験的なチャットモードや、cron式で定時実行するローカル自動化、リモートアプリのプレビューが入った。\n【ポイント・注意点】自動承認の個人指示はオプトインで、ローカルセッション限定だ。リモートプレビューも設定で有効化が必要なため、既定では動かない。Agent Mergeは必須チェックが残っている間も有効なまま待つため、ブランチの保護ルールと合わせて運用を確認しておきたい。定時実行を入れる場合は、実行内容と頻度を事前に決めておくとよい。週間更新は、複数の変更をまとめて把握するのに役立つ。VS Codeの定時実行は、繰り返しの作業を任せる第一歩になる。ただし、自動化の範囲を広げすぎると見落としも増えるため、段階的に進めるとよい。まずは自分の使い方に合う改善から試すとよい。","2026-11-06","Tech Bytes","https://blogs.techbytes.app/posts/github-copilot-weekly-releases-november-2/"],["AIコーディング道具の週間まとめ、7日から14日の更新","Claude CodeやCodex CLI、Copilot CLIなど主要なAIコーディング道具の、11月7日から14日の安定版リリースをまとめた記事が公開された。共通の傾向として、サブエージェントの自立化とMCPの認証まわりの修正、プラグインの事前検査の強化が挙げられている。道具選びの参考になる。複数の道具を比べることで、自分に合う道具が見えてくる。週ごとの変化を追う助けになる。","\n【概要】主要なAIコーディング道具の11月7日から14日の安定版リリースをまとめた記事が公開された。対象はClaude Code、Codex CLI、GitHub Copilot CLI、Gemini CLI、OpenCode、gooseで、すべて各プロジェクトのリリースページの日付に基づいている。週の傾向として、サブエージェントの自立化とMCP認証の修正が複数の道具で同時に起きている。\n【背景】AIコーディング道具は週に何度も更新されるため、個別の変更履歴を追うだけでは全体像がつかみにくい。この記事は、1週間の安定版だけを抜き出して比較できる形に整理したもので、プレリリースは対象外としている。\n【詳細】Claude Codeは2.1.321から2.1.325まで4版が出て、実験的なCode Modeとプラグインの対応バージョン指定が追加された。Codex CLIは0.167.2から0.169.0まで3版で、サイドチャットと信頼できないフォルダでの扱いが厳しくなった。Copilot CLIは1.0.108から1.0.112まで5版で、パスワード入力のマスク表示などが入った。OpenCode 2.3はサブエージェントを既定でバックグラウンド実行にし、goose 1.59は遅延MCPツールを追加した。Gemini CLI 0.68は修正中心だった。\n【ポイント・注意点】MCPを使う場合は、OAuthまわりの修正が入った新版で認証の再確認をしておきたい。Codexのcodex execでは、信頼できないフォルダでプロジェクトのMCPサーバーが読み込まれなくなったため、CIで依存している場合は確認が必要だ。更新前には、各道具のリリースページで破壊的変更の有無を見るのが確実だ。複数の道具を使う場合は、週に一度まとめて確認する習慣が役立つ。道具の更新は速いため、週に一度まとめて確認する習慣が役立つ。新しい機能を試す際は、まず小さなプロジェクトで確かめるのが安全だ。変更履歴の読み方に慣れておくと、道具選びの判断がしやすくなる。","2026-11-14","AgenticMart","https://agenticmart.org/blog/ai-coding-agent-news-november-2026"]],"elec":[["スタックちゃんをWi-Fiで操る、ESP32教材の応用例","M5Stackのスタックちゃんを、ESP32教材キットからWi-Fi経由で操る取り組みが紹介された。UDP通信でサーボを動かし、画面表示の再現はArduinoの4行の変更で済んだという。工場出荷時のAI機能と実験用の自作ソフトを切り替えながら学べる、教育現場向けの教材例だ。教材の流用という発想は、ほかのロボット工作にも応用できる。まずは小さな例から試してみたい。","\n【概要】M5Stackのデスクトップロボット「スタックちゃん」を、ESP32の教材キットからWi-Fi経由で操る取り組みが、Elektorの記事で紹介された。UDP通信で命令を送り、画面表示の再現はArduinoのコード4行の変更で済んだという。ロボットのサーボを動かす教材として、既存のESP32教材を流用できる例になっている。\n【背景】この取り組みは、ヴィラノバ大学の非常勤教授でもあるジム・ソルダリッチ氏が、自身の教材キット「ESP32 by Example Kit」をスタックちゃんに応用したものだ。教材キットはもともと、ドローンのシミュレーターを操作する例などで使われてきた。同じ仕組みをロボットに移すことで、画面上の仮想LEDを動かす学習から、実際のモーターを動かす学習へ広げている。\n【詳細】教材キット側の画面に表示していた仮想LEDの挙動は、わずか4行のArduinoコードの変更でスタックちゃんの画面に再現できた。次の段階では、スタックちゃんのハードウェア資料にあるArduinoのサンプルを使い、サーボやカメラを動かす方向へ進んだ。通信はWi-Fi上のUDPソケットを使い、以前ドローンのTelloを操ったときと同じ手法を応用している。教材キットを別体のコントローラーとして使い、スタックちゃんが命令に応じて動く構成だ。\n【ポイント・注意点】自作ソフトを書き込むと、工場出荷時のソフトと内蔵のAI機能は置き換わる。ただし工場出荷時のソフトには復元できるため、元の機能と実験用のソフトを切り替えて使える。教育現場での利用を想定した取り組みで、将来の大学の授業や研修教材への展開が検討されているという。電子工作の学習では、既存の例を別のハードウェアへ移す経験そのものが役立つ。まずは画面表示の再現から試すのがよい。教材キットの画面とスタックちゃんの画面は、どちらもESP32で動く点が共通している。同じコードを少し変えるだけで別のハードウェアへ移せるのは、教材としての利点だ。学生が自分の手でロボットを動かせれば、学ぶ意欲も高まるだろう。今後、授業での活用事例が出てくるかも注目したい。","2026-11-09","Elektor Magazine","https://www.elektormagazine.com/articles/m5stack-stackchan-esp32-control"],["Museを自作ガジェットに、ESP32とラズパイ向けSDK","MetaのMuseをESP32やラズベリーパイに載せるオープンソースのキット「Muse Gadgets」が紹介された。11月6日の更新で、Museが米国や日本などで使えるようになったことも伝えられている。画面やマイク、スピーカーを付けた自作のAIガジェットが作れる。個人の工作向けの提供だ。日本でも使えるようになった今、手元のボードで試す好機といえる。まずは小さな表示から始めてみたい。","\n【概要】MetaのAIアシスタント「Muse」をESP32やラズベリーパイに載せるためのオープンソースキット「Muse Gadgets」が紹介された。ESP32向けとLinux向けの2つのSDKがあり、画面やマイク、スピーカー、センサーを付けた自作のAIガジェットが作れる。11月6日の更新では、Museが米国、カナダ、日本、シンガポールで使えるようになったことも伝えられた。\n【背景】Muse Gadgetsは2026年10月に公開されたもので、Apache 2.0ライセンスのオープンソースとして提供されている。これまでAIアシスタントは大手の作った端末の中にいるのが普通だったが、このキットは作り手自身がハードウェアを発明できるようにする狙いがある。開発者トークンを取得して自分の端末と結びつける仕組みだ。\n【詳細】ESP32デバイスSDKは、画面表示や音声入出力、センサーの追加に対応する。LinuxデバイスSDKは、ラズベリーパイなどの小型Linux機をガジェット化し、独自コマンドやHome Assistantとの連携を可能にする。試すハードウェアの例として、丸い1.75インチのタッチ画面付きWaveshare製ESP32ボード、M5Stack StickS3、Seeedのカラー電子ペーパー端末、ラズベリーパイ5が挙げられている。Meta自身の小型端末「Muse Home Link」は、ESP32-C5を使ったUSB-Cドングルだ。\n【ポイント・注意点】利用にはMuseアプリで開発者モードを有効にし、開発者トークンの取得が必要だ。現時点では個人プロジェクト向けの提供で、端末の共有には制限があるとされている。実験で基板を壊す可能性もあるため、予備の基板を用意しておくのが無難だ。日本でも使えるようになったことで、手元のESP32やラズパイで試しやすくなった。まずは手持ちのボードで小さな表示ガジェットから始めるのがよい。Muse GadgetsのSDKはGitHubで公開されており、誰でも中身を読んで改変できる。自分だけのガジェットを作る楽しさは、既製品にはない魅力だ。","2026-11-06","Woxter TechNews","https://technews.woxter.com/meta-muse-gadgets-esp32-raspberry-pi/"],["100ドル前後のエッジAI対決、Orange PiとM5Stack LLM","Orange Pi 5 UltraとM5Stack LLM630、Radxa ROCK 5B+のエッジAI向け基板を比べた記事が公開された。Orange Piは映像処理向きの万能型、LLM630は3W前後で動く音声LLM向きの小型モジュールで、用途で選び分ける指針が示されている。価格と性能だけで決めない選び方が大切だ。用途に合った基板を選べば、無駄な出費を抑えられる。購入前の比較に役立つ記事だ。","\n【概要】Orange Pi 5 Ultra、M5Stack LLM630 Compute Kit、Radxa ROCK 5B+という3つのエッジAI向け基板を比べた記事が公開された。価格は119ドル、99.90ドル、149ドルで、映像処理やドローン向けの万能型と、3W前後で動く音声LLM向けの小型モジュールという、性格の違う2つの方向が示されている。\n【背景】150ドル以下のエッジAI基板は、クレジットカード大のSBCと、指先大のNPUモジュールに分かれてきた。用途が映像中心か、音声中心かで選ぶべき基板が変わるため、仕様を並べて比べる記事がまとめられた。数値は各社の公開資料に基づいている。\n【詳細】Orange Pi 5 UltraはRockchip RK3588を載せ、6TOPSのNPUと最大16GBのLPDDR5、4K60のHDMI入力と8K60出力、Wi-Fi 6E、2.5GbEを備える。M5Stack LLM630はAXERA AX630Cを載せ、INT8で3.2TOPS、INT4で12.8TOPSのNPUと4GBのLPDDR4、32GBのeMMCを持ち、消費電力は約2.5Wから3.5Wだ。Qwen2.5やWhisper、YOLO11をStackFlow経由でそのまま動かせる。Radxa ROCK 5B+は最大32GBのLPDDR5とデュアルM.2が特徴だ。\n【ポイント・注意点】ドローンの映像処理やAI KVM、ROS 2のノードにはOrange Pi 5 Ultraが向き、電池駆動の音声ハブやスマートホームのゲートウェイにはLLM630が向くとされている。LLM630は冷却ファンなしで動くが、大きなモデルを動かす用途には向かない。価格と性能だけで決めず、動かしたいモデルと電源の条件で選ぶとよい。購入前に、動かしたいモデルの対応状況も確認しておきたい。記事の比較はメーカーの公開資料に基づいており、実測値ではない点には注意したい。実際の消費電力や処理速度は、動かすモデルや設定で変わる。購入前には、ほかの利用者の報告もあわせて確認するとよい。","2026-11-11","RECIWO Labs","https://www.reciwo.com/articles/orangepi-5-ultra-vs-m5stack-llm630-radxa-rock-5b-plus-edge-comparison"],["ラズパイ5の16GBモデル、385ドルへ再値上げ","ラズベリーパイ5の16GBモデルが、米国で305ドルから385ドルへ値上げされた。16GBメモリーの供給不足が理由で、今年4回目の値上げになる。Compute Module 5の16GB版も40ドル上がるが、ラズベリーパイ500+は据え置かれた。発売時の3倍を超える価格になった。値上げの流れは今後も続く可能性がある。必要な台数と時期を見極めて購入したい。購入前に確認したい。","\n【概要】ラズベリーパイ5の16GBモデルが、米国で305ドルから385ドルへ値上げされた。2026年11月2日から適用され、値上げ幅は80ドルだ。Compute Module 5の16GB版も40ドル上がる。16GBメモリーの供給不足が理由で、今年に入って4回目の値上げになる。\n【背景】ラズベリーパイ5の16GBモデルは2025年1月に120ドルで発売されたが、メモリー価格の高騰で段階的に上がってきた。2月に60ドル、4月に100ドル、10月にも小容量モデルが上がり、今回で16GBモデルは発売時の3倍を超えた。背景にはAIデータセンターによるメモリー需要の増大があるとされている。\n【詳細】値上げの対象は16GBモデルだけで、ラズベリーパイ500+は16GBメモリーを積みながら価格が据え置かれた。小容量のラズパイ5やラズパイ4は今回の対象外だ。創業者のイーベン・アプトン氏は、メモリー価格が下がれば値上げを戻すとしているが、時期は示していない。米国では州ごとに消費税が別途かかる。販売店によっては、11月3日時点で旧価格の350ドルで並んでいる例もあった。\n【ポイント・注意点】16GBを必須としない用途なら、小容量モデルを選ぶことで値上げの影響を避けられる。複数台を買う学校や研究室では、1台80ドルの上乗せが積み重なるため、台数分の予算を確認しておきたい。販売店ごとに価格の反映時期が違うため、購入前に複数の正規販売店の表示を比べるとよい。値下がりの時期は示されていないため、待つ判断は難しい。メモリー価格の高騰は、AIデータセンターの需要が大きな要因とされている。ラズベリーパイ財団は、メモリー価格が下がれば値上げを戻すとしているが、具体的な時期は示していない。2026年の値上げは2月、4月、10月、11月と続いており、価格が落ち着く気配はまだ見えない。教育現場やメーカーにとって、ボードの価格は計画に直結する問題だ。小容量モデルや中古品の活用、あるいは別のSBCへの切り替えも検討の余地がある。購入のタイミングに悩む場合は、必要な台数を絞って段階的に買うのも一つの手だ。","2026-11-02","Netz-Trends","https://www.netz-trends.de/us/raspberry-pi-5-16gb-price-rise-us/"],["ラズパイ1台で月10〜20ドル、帯域共有の実践記","ラズベリーパイ4を24時間動かし、使っていない回線帯域を共有して月に10〜20ドルを得る実践記が公開された。5つのアプリをDockerで動かし、実際の入金額や失敗談も含めて手順がまとめられている。儲かる副業ではなく小さな実験と位置づけられている。11月12日に検証された内容だ。小さな金額でも、動かし続ける仕組み作りの勉強になる。規約を確認したうえで試したい。","\n【概要】ラズベリーパイ4を24時間動かし、使っていないインターネット回線の帯域を共有して月に10〜20ドルを得る実践記が公開された。5つのアプリをDockerコンテナで動かし、実際の入金額や失敗談も含めて手順がまとめられている。筆者はこれを儲かる副業ではなく、小さな実験として位置づけている。\n【背景】帯域共有アプリは数多くあるが、古い手順や動かないDockerイメージを載せた解説も多い。この記事は2026年6月から自分のラズパイ4で動かし続けている構成を、11月12日に検証したうえでまとめたものだ。使っているのはラズベリーパイ4とDocker 29.5.3で、Tailscaleで外部からも接続できるようにしている。\n【詳細】使うアプリはHoneygain、Pawns.app、TraffMonetizer、PacketStream、EarnFMの5つだ。Honeygainが最も稼ぎが多く、11月11日時点で残高は14.50ドルで、出金の目安20ドルの72%に達している。Pawns.appは8月4日に5.52ドル、11月2日に4.77ドルの計10.29ドルが実際に入金された。TraffMonetizerは11月2日にドメインが移転し、ARM用のイメージ指定が必要だ。5つすべてが出金目安に同時に届く月は55ドルになるが、筆者はそれを奇跡の月と呼んでいる。\n【ポイント・注意点】古いWatchtowerのイメージはDocker 29で動かないため、メンテナンス中のフォークを使う必要がある。EarnAppは規約で自宅サーバーへの設置が禁じられており、筆者のアカウントは11月12日に停止された。帯域共有は規約とプライバシーポリシーを確認したうえで、自己責任で試すものだ。紹介リンクには筆者の紹介特典が含まれる点も押さえておきたい。まずは1つのアプリから始めて様子を見るのが無難だ。帯域共有アプリは、回線の利用状況や地域によって収入が変わる。月10〜20ドルという数字は、あくまで筆者の環境での実績だ。電気代もかかるため、収支を計算したうえで試すのがよい。まずは1つのアプリで様子を見るのが無難だ。","2026-11-14","Pi Pennies","https://pipennies.substack.com/p/how-to-set-up-a-raspberry-pi-to-earn"],["ラズパイ防犯カメラ作り、4ボードの選び方を比較","ラズベリーパイで防犯カメラを作る方法を、AxonやJetson Nano、Orange Pi 5と比べた記事が公開された。カメラの接続やV4L2、ffmpeg、OpenCVでの扱い方が中心で、複数台のカメラを使う場合の考え方もまとめられている。11月15日に公開された比較記事だ。1台の試作から実用へ進むときの指針になる。まずは手持ちのボードで基本を確かめたい。","\n【概要】ラズベリーパイで防犯カメラを作る方法を、VicharakのAxonやJetson Nano、Orange Pi 5と比べた記事が公開された。カメラの接続方法や、V4L2とffmpeg、OpenCVを使った映像の扱い方が中心で、複数台のカメラを使う場合の考え方もまとめられている。\n【背景】ラズベリーパイの防犯カメラは定番の工作だが、1台の試作から複数台の実用へ進むと、カメラの検出や設定の再現性が課題になる。この記事は、ラズベリーパイを起点にしつつ、他のボードでは何が違うのかを比べたもので、インドのメーカー向けの視点も含まれている。\n【詳細】一般的な作り方は、カメラモジュールを付けてRaspberry Pi OSでカメラを有効にし、motionやffmpeg、OpenCVで映像を見る流れだ。Axonはラズベリーパイのカメラモジュールv1と互換性があり、V4L2でデバイスを確認してffmpegで1920x1080の映像を流す手順が文書化されている。Jetson NanoはCUDAを使った推論に向くが、古い基盤で扱いが重い面がある。Orange Pi 5は性能は高いが、カメラ設定の体験がOSイメージに左右されやすいとされている。\n【ポイント・注意点】複数台のカメラでは、デバイス番号を分けて管理する手順が要になる。記事はVicharakの自社製品を勧める内容のため、比較の結論には販売側の立場が含まれている点に注意したい。カメラを接続する際は、電源を切ってから作業する基本も守りたい。防犯カメラの設置では、撮影範囲や他人の映り込みにも配慮が必要だ。まずは1台で手順を確かめるのがよい。防犯カメラの工作では、映像の保存方法や遠隔からの確認方法も考える必要がある。記事の中心はボード選びとカメラの接続だが、実際に運用するには、録画の仕組みや通知の方法も欠かせない。Jetson Nanoのように推論ができるボードなら、人物の検出まで含めた仕組みも作れる。まずは1台のカメラで映像の取得と保存までを確かめ、そこから複数台へ広げるのが堅実だ。設置場所の電源やネットワークの確保も、事前に確認しておきたい。","2026-11-15","Vicharak Blog","https://blog.vicharak.in/company-blogs/how-to-make-a-security-camera-with-raspberry-pi"],["M5Stackの電子ペーパー工作キット、4.7型で25ドル","M5Stackの電子ペーパー工作キット「PaperDIY Assembly Kit」が紹介された。ESP32-S3と4.7型のグレースケール電子ペーパーを組み合わせ、25ドルで販売されている。自分で組み立てるキットで、省電力の表示工作に向いている。電池付きの小型キットだ。省電力の表示工作を始めたい人には、手ごろな入口になる。組み立ての手間も楽しみの一つだ。まずは小さな表示から試したい。","\n【概要】M5Stackの電子ペーパー工作キット「PaperDIY Assembly Kit」が紹介された。ESP32-S3と4.7型のグレースケール電子ペーパーを組み合わせたもので、価格は25ドルだ。自分で組み立てるキットで、省電力の表示工作やデスク上の情報表示に向いている。\n【背景】電子ペーパーは電源を切っても表示が残るため、卓上の情報表示や電子ラベルに適している。M5Stackは完成品のキットと組み立て式のキットを用意しており、今回紹介されたのは自分で組み立てる版だ。ESP32-S3を載せた開発ボードとして、他の電子ペーパー製品と並んで紹介されている。\n【詳細】表示は960×540ピクセルで16階調のグレースケールに対応し、タッチ機能はない。制御基板はESP32-S3-WROOM-1-N16R8モジュールを使い、デュアルコア240MHz、16MBフラッシュ、8MBのPSRAMを備える。microSDスロット、USB Type-C、ボタン2つ、140mAhのリチウム電池が付く。消費電流は動作時40.95mA、ピーク時161mAとされている。開発はUiFlow2のほか、ArduinoやESP-IDFでも行える。\n【ポイント・注意点】組み立て式のため、はんだ付けや組み立ての手間は自分で負うことになる。タッチ非対応なので、操作はボタンとUSB経由の操作に限られる。電池は140mAhと小さいため、常時表示の用途では電源の計画が必要だ。完成品がほしい場合は、組み立て済みのComplete Kitも用意されている。まずは表示の更新頻度と電源の条件を決めてから選ぶとよい。電子ペーパーは、表示の更新が遅い代わりに消費電力が小さい。時刻や天気、カレンダーなどの情報を表示する用途に向いている。PaperDIYは組み立て式で、価格も25ドルと手ごろだ。UiFlow2を使えば、コードをあまり書かずに表示を作れる。ArduinoやESP-IDFで作り込めば、センサーと組み合わせた表示も可能だ。電池の持ちは表示の更新頻度で大きく変わるため、更新間隔の設計が大切になる。まずは卓上の時計や天気表示から試すのがよい。","2026-11-04","Electronics Lab","https://www.electronics-lab.com/news/m5stack-paperdiy-is-a-4-7-inch-esp32-s3-e-paper-development-board/"],["ESP32-P4にデスクトップOS、2つの新作が登場","ESP32-P4向けのデスクトップOSとして、Sylphide OSとBMDSの2つが紹介された。どちらもOlimexのESP32-P4-PCボードを対象にし、ウィンドウのある画面やアプリの実行を目指している。マイコンでパソコンのような体験を作る動きが進んでいる。11月14日の記事だ。マイコンでパソコン風の体験を作る試みは、まだ始まったばかりだ。今後の進化にも注目したい。","\n【概要】ESP32-P4向けのデスクトップOSとして、Sylphide OSとBMDSの2つが紹介された。どちらもOlimexのESP32-P4-PCボードを対象にし、ウィンドウのある画面やアプリの実行を目指している。マイコンでパソコンのような体験を作る動きが進んでいる。\n【背景】ESP32-P4はEspressifの高性能なアプリケーションプロセッサで、デュアルコアのRISC-Vを載せる。HDMIやEthernet、USBを備えたボードが出てきたことで、その上で動くOSを作る試みが増えている。以前紹介されたP4 Launcherに続き、さらに本格的なデスクトップOSを目指す2つのプロジェクトが登場した。\n【詳細】Sylphide OSは、古いMacintoshのような白黒のデスクトップを目指すOSで、FreeRTOSを土台にウィンドウやメニュー、アイコンを備える。ラズベリーパイ Pico 2やFabGLボードでも動作が確認され、Linux上で動くエミュレーターもある。BMDSはDOS風のカラー画面を持つOSで、1280×720の画面を60FPSで表示し、SDカードからELF形式のアプリを読み込んで実行できる。FM音源やSSH、SFTP、BusyBoxやDropbearの移植、Doomの移植も含まれている。\n【ポイント・注意点】どちらも開発途上のプロジェクトで、Sylphide OSはストレージやネットワークの対応が今後の課題とされている。BMDSはMITライセンス、Sylphide OSはGPLv3で公開されている。対応ボードが限られるため、手持ちのボードで動くかを確認してから試すとよい。マイコンOSの実験として楽しむのが向いている。まずはエミュレーターで触るのも一つの手だ。ESP32-P4のボードは、HDMIやUSBを備えたものが増えてきた。Sylphide OSはRaspberry Pi Pico 2でも動くため、手持ちのボードで試せる。BMDSはブラウザからのインストールに対応しており、導入のハードルは低い。どちらも開発途上のため、動作の安定性はこれからだ。マイコンでOSを作る試みは、パソコンの歴史をたどるような面白さがある。","2026-11-14","CNX Software","https://www.cnx-software.com/2026/11/14/desktop-operating-systems-for-esp32-p4-based-pcs-meet-sylphide-os-and-bare-metal-do-stuff-bmds/"],["壊れたレジの画面、ラズパイPicoでよみがえる","1990年代のサムスン製レジの壊れたSTN液晶を、ラズベリーパイPicoで新しい画面に置き換えた工作が紹介された。古い画面の4ビット信号を読み取り、タイミングを調べてモノクロVGAに変換した。壊れた機器を直す楽しさが伝わる作例で、Hackadayの11月5日の記事だ。古い機器を直す楽しさが伝わる作例だ。同じ発想は、ほかの壊れた機器にも応用できる。まずは身近な機器から観測してみたい。","\n【概要】1990年代のサムスン製レジの壊れたSTN液晶を、ラズベリーパイPicoで新しい画面に置き換えた工作が紹介された。古い画面の4ビット信号を読み取ってタイミングを調べ、モノクロVGAに変換することで表示を復活させた。壊れた機器を直す楽しさが伝わる作例だ。\n【背景】古いレジの画面はモノクロのSTN液晶で、交換部品は高価で手に入りにくい。作者は専用の変換基板やFPGAを使わず、マイコンで信号を変換する方法を選んだ。最初はSTM系のチップで試し、後にRP2040へ移行している。\n【詳細】古い画面は4ビットのデータバスを持ち、解像度は320×240ピクセルだ。作者はバスの信号をサンプリングしてタイミングを特定し、信号の形式が分かってからはマイコン内でモノクロVGAへ変換する処理を実装した。変換には専用チップではなく、ラズベリーパイPicoのRP2040が使われている。AliExpressにはHDMIやVGAを変換する基板もあるが、この工作では表示の信号そのものを読み解く手順が中心になっている。\n【ポイント・注意点】古い機器の信号を読み解くには、オシロスコープなどでの観測と試行錯誤が必要になる。同じ機種でも個体差がある可能性があり、手順をそのまま流用できるとは限らない。電源まわりや配線の扱いにも注意が必要だ。壊れた機器を捨てずに直す発想は、部品の入手が難しい古い機器全般に応用できる。まずは信号の観測から始めるのがよい。古い機器の修理では、まず信号の観測から始める必要がある。オシロスコープやロジックアナライザがあれば、信号のタイミングを調べられる。作者のように、最初は手持ちのチップで試し、うまくいく方法へ移行する進め方も参考になる。STN液晶は1990年代の機器に広く使われており、同じ手法はほかの機器にも応用できる。部品が手に入らない古い機器を直すには、信号を読み解く力が必要だ。工作の楽しさは、新しいものを作るだけでなく、壊れたものをよみがえらせることにもある。まずは身近な壊れた機器の信号を観測してみるのもよい。","2026-11-05","Hackaday","https://hackaday.com/2026/11/05/translating-an-old-display-to-a-new-one/"],["Pico 2 Wで1080p表示、フレームをためずに描く工夫","ラズベリーパイPico 2 Wで1080pの表示を出すファームウェア「TV-Top Kiosk」が紹介された。画面全体をメモリーにためず、表示の直前に1行ずつ描く仕組みで、520KBのRAMしかない制約を乗り越えている。ボードゲームの共有画面としての利用が想定されている。メモリーの制約を発想で乗り越えた好例だ。ほかの表示工作にも応用できる考え方といえる。まずは720pから確かめたい。","\n【概要】ラズベリーパイPico 2 Wで1080pの表示を出すファームウェア「TV-Top Kiosk」が紹介された。画面全体をメモリーにためず、表示の直前に1行ずつ描く仕組みで、520KBのRAMしかない制約を乗り越えている。ボードゲームの共有画面としての利用が想定されている。\n【背景】1080pのカラー画面1枚には約6MBのメモリーが必要だが、RP2350のRAMは520KBしかない。そのため画面全体を保持する従来の方法は使えず、表示に必要な行だけを直前に作る発想が取られた。作者は表示の仕組みそのものを変えることで、この制約を回避している。\n【詳細】ファームウェアはチップのHSTX出力を使い、図形のデータをフラッシュに置いて、表示の6行先までを走査線ごとの命令に変換していく。画面全体ではなく、次に表示する行だけを作るため、メモリーの使用量を抑えられる。無線の扱いには2つの構成があり、Pico 2 W内蔵の無線を使う方法と、ESP32-C3にWi-FiとTLSを任せる方法がある。作者は1080pの動作をESP32-C3側の構成で開発した。既定の表示は720p60で、1080pは実験的な設定だ。\n【ポイント・注意点】1080pの設定は定格を超える動作で、配線の質や画面の受け入れ条件に左右される。内蔵無線とTLSの組み合わせは、ビルドは通るが実機での動作確認がまだない。試す場合は480p60から始めて段階的に上げるのが勧められている。サーバー側の仕様は非公開のため、元のボードゲーム以外への流用には限界がある。まずは720pの既定設定で動作を確かめるのがよい。表示の仕組みを変えることで、メモリーの制約を乗り越えた好例だ。画面全体を保持しない発想は、ほかの表示工作にも応用できる。作者はボードゲームの共有画面を想定しており、盤面の変化が少ない用途に合っている。動きの激しい表示には向かないため、用途の見極めが大切だ。Pico 2 WのHSTXは、ほかの表示工作でも使える機能だ。まずは720pの既定設定で動作を確かめ、配線や表示の条件を整えてから1080pに挑むのがよい。","2026-11-11","LockerGnome","https://lockergnome.com/pico-2w-1080p-kiosk-without-framebuffer/"]],"muse":[["Claude Codeに実験機能「Code Mode」、JSで道具を呼ぶ","Claude Code 2.1.323で、実験的な「Code Mode」が追加された。ClaudeがJavaScriptを書いて道具を呼び出す仕組みで、従来の手順とは違う動き方になる。同じ版でプラグインの対応バージョン指定も入り、プラグイン作者向けの変更も進んでいる。11月12日の更新だ。実験的な機能のため、まずは小さな作業で確かめるのがよい。プラグイン作者の対応も進んでいる。","\n【概要】Claude Code 2.1.323で、実験的な「Code Mode」が追加された。ClaudeがJavaScriptを書いて道具を呼び出す仕組みで、従来の手順とは違う動き方になる。同じ版ではプラグインの対応バージョン指定も入り、プラグイン作者向けの変更も進んでいる。\n【背景】Claude Codeは毎週のように更新されており、2.1.323は11月12日に公開された。Code Modeはオプトインの実験機能で、Claudeが道具の呼び出しをJavaScriptで組み立てる。組織向けには無効化の手順も用意されている。\n【詳細】Code Modeを有効にすると、Claudeは道具の呼び出しをJavaScriptのコードとして書き、実行する。従来の道具呼び出しと比べて、複数の呼び出しをまとめて制御しやすくなる。同じ版では、plugin.jsonにengines[\"claude-code\"]を指定できるようになり、対応範囲外のプラグインはインストールや更新、読み込みが行われなくなった。インストール時には、対応する最新のプラグイン版が選ばれる。claude plugin validateも、プラグインのTypeScriptフックを型検査するようになった。\n【ポイント・注意点】Code Modeは実験的な機能で、既定では無効だ。試す場合は、まず有効化の手順を確認し、動作を確かめてから本格的に使うとよい。プラグイン作者は、対応バージョンの指定を忘れると利用者の環境でプラグインが読み込まれなくなるため、早めの対応が必要だ。変更履歴の全文は公式の変更履歴で確認できる。まずは小さな作業で試すのがよい。Code Modeの詳しい使い方は、公式のドキュメントにまとめられている。有効化の手順や組織での無効化の方法もそこに書かれている。JavaScriptで道具を呼ぶ仕組みは、従来の道具呼び出しと比べて、条件分岐や繰り返しを書きやすい。ただし、実験的な機能のため、挙動が変わる可能性もある。まずは小さな作業で試し、結果を確かめてから本格的に使うのがよい。プラグイン作者は、対応バージョンの指定を早めに済ませておきたい。","2026-11-12","Gradually","https://www.gradually.ai/en/changelogs/claude-code/"],["Claude Code 2.1.325、圧縮の不具合修正と障害の顛末","Claude Code 2.1.325は、圧縮データの処理の不具合を直すセキュリティ重視の更新だ。同じ11月13日にはClaudeのログイン障害も起き、約90分間サインインできなくなった。設定の巻き戻しで復旧し、情報漏えいはなかったとされている。自律運用では早めの更新が勧められる。セキュリティ重視の更新で、運用中の人は早めの更新が勧められる。障害の顛末も押さえておきたい。","\n【概要】Claude Code 2.1.325は、圧縮データの処理の不具合を直すセキュリティ重視の更新で、11月13日に公開された。同じ日にはClaudeのログイン障害も起き、約90分間サインインできなくなった。設定の巻き戻しで復旧し、情報漏えいはなかったとされている。\n【背景】2.1.325は新機能を含まず、セキュリティと信頼性の修正だけを集めた版だ。公開は11月13日の20時40分ごろで、多くの環境には14日に届いた。自律的に動くエージェントを運用している場合は、早めの更新が勧められている。\n【詳細】修正の中心は、zstdで圧縮された応答の復号にあった不具合で、不正な形式の応答がバッファあふれを起こす可能性があった。解凍後のサイズに厳しい上限を設け、超えるものは解析前に拒否するようになった。ほかに、サブエージェントのモデル指定が計画モードで上書きされる問題や、サンドボックス内のチェックポイント読み取り、異常終了後のセッション復旧の修正も含まれる。ログイン障害は、認証のトークン更新まわりの設定ミスが原因で、15時02分に確認され16時08分に復旧した。\n【ポイント・注意点】自律エージェントを運用している場合は、claude updateで2.1.325へ更新しておきたい。障害の最中に更新を挟んだセッションでは、再認証のエラーが残る場合があり、その場合はclaude auth loginでの再ログインが案内されている。障害は可用性の問題で、認証情報の漏えいはなかったとされている。更新後は、セッションが正しく動くか確かめるとよい。2.1.325の変更履歴は139件にのぼるが、新機能はなく、修正が中心だ。サブエージェントの扱いや、サードパーティのゲートウェイでの要約の修正も含まれている。ログイン障害は、認証のトークン更新まわりの設定ミスが原因だった。障害の間は、新しいサインインやトークンの更新ができなかったが、すでに動いていたセッションは影響を受けなかった。障害のあと、再認証のエラーが残る場合は、再ログインで直るとされている。運用中の人は、更新と再認証の手順を確認しておきたい。","2026-11-14","Claude's Daily Diary","https://www.claudebeat.ai/articles/2026/11/2026-11-14.html"],["Claude Code 2.1.319、長いMCP作業を裏で回す","Claude Code 2.1.319は、MCPの長い作業をバックグラウンドに回し、許可待ちを拒否で済ませる設定を追加した。無人で動かす用途に向けた更新で、権限まわりの抜け穴の修正も含まれている。11月6日に公開された。夜間の自動実行にも役立つ変更だ。無人運用の負担を減らす変更で、夜間の自動実行にも役立つ。権限まわりの修正も含まれている。まずは短いジョブで確かめたい。","\n【概要】Claude Code 2.1.319は、MCPの長い作業をバックグラウンドに回し、許可待ちを拒否で済ませる設定を追加した。無人で動かす用途に向けた更新で、権限まわりの抜け穴の修正も含まれている。11月6日に公開された。\n【背景】MCPサーバーが長い処理をタスクとして実行すると、従来はその処理が終わるまでセッションが止まっていた。20分かかる処理もあるため、無人運用では大きな足かせになっていた。今回の版では、タスクを裏に回して終わった時点で結果を伝える仕組みが入った。\n【詳細】MCPのタスクは、呼び出しと同時にバックグラウンドへ移り、終わるとClaudeに結果が伝えられる。従来の待ち方に戻すには、CLAUDE_CODE_DISABLE_MCP_TASK_BACKGROUNDを設定する。新しい設定permissions.denyInsteadOfPromptingは、許可待ちになるはずの道具呼び出しを拒否して処理を続けさせるもので、端末やサブエージェント、チームメイトでの無人実行を想定している。ほかに、/claude-api latency-optimizeコマンドの追加や、Bashの環境変数を使った権限回避、sedの権限検査漏れ、ワークツリーのサンドボックス逃れの修正も含まれる。\n【ポイント・注意点】無人で動かす場合は、denyInsteadOfPromptingを有効にし、必要な道具だけを事前に許可しておくと、途中で止まらずに進む。MCPの結果をその場で待つ必要がある処理では、無効化の環境変数を使うとよい。権限まわりの修正が含まれるため、古い版を使い続けるよりも更新しておくのが安全だ。まずは短いジョブで動作を確かめるのがよい。MCPのタスクは、長い処理を裏で進めるための仕組みだ。レポートの出力やビルドなど、時間のかかる処理に向いている。denyInsteadOfPromptingは、無人で動かすときの安全な失敗の仕方を決める設定だ。許可待ちで止まる代わりに、拒否して次へ進む。夜間の自動実行やCIでの利用では、止まらずに進む方が都合がよい。ただし、必要な道具を事前に許可しておかないと、肝心の処理が拒否されることもある。設定の見直しとあわせて、動作の確認もしておきたい。","2026-11-06","ClaudeCodeChanges","https://ccc.gustavo.eng.br/2026/11/06.html"],["Claude Fable 5.2登場、高速化と値下げで長丁場向きに","AnthropicはClaude Fable 5.2とMythos 5.2を発表した。出力は最大30%速く、料金も下がった。Fable 5.2はClaude Codeの既定モデルにもなり、1000体のエージェントがフェルマーの最終定理の形式化を30時間で終えた例も紹介されている。11月9日の発表だ。長丁場の作業で使う場面を見極めるのが大切だ。料金の変化もふまえて選びたい。","\n【概要】AnthropicはClaude Fable 5.2とMythos 5.2を発表した。出力は最大30%速く、料金も下がった。Fable 5.2はClaude Codeの既定モデルにもなり、長く続く技術的な作業に向けた位置づけが示されている。\n【背景】Fableは、日常のコーディングよりも、長く続く技術的な作業に向けたモデルとされている。5.2では速度と料金の両方が改善され、高速モードでは生成が最大2.5倍速くなるとされている。Mythosは同じモデルで、サイバーや生物学の安全対策を緩めた版として、審査を受けた組織だけに提供される。\n【詳細】料金は、入力が100万トークンあたり8ドル、出力が40ドルで、従来の10ドルと50ドルから下がった。高速モードは16ドルと80ドルで、最大2.5倍の速さになる。Anthropicは、1000体のFable 5.2エージェントがフェルマーの最終定理の形式化を30時間で終えたと紹介している。以前の未公開の研究版では11日かかっていたという。同社のコードへの変更の90%以上が、人の指示のもとClaudeによって書かれているともされている。日常のコーディングや知識作業の既定はOpus 5.5のままだ。\n【ポイント・注意点】Fable 5.2はClaude Codeの既定のFableモデルになったが、Anthropicは多くの作業ではOpus 5.5を推奨している。長丁場の作業で使う場面を見極めるのが大切だ。料金は下がったが、高速モードは割高になるため、用途に合わせて選ぶとよい。Mythosは審査対象の組織限定で、一般には提供されない。まずは通常モードで使い勝手を確かめたい。Fable 5.2の価格は、入力が100万トークンあたり8ドル、出力が40ドルで、従来より下がった。高速モードは16ドルと80ドルで、最大2.5倍の速さになる。Anthropicは、1000体のエージェントがフェルマーの最終定理の形式化を30時間で終えたと紹介している。以前の未公開の研究版では11日かかっていたという。長丁場の作業で使う場面を見極め、日常の作業ではOpus 5.5を使うのが基本だ。まずは通常モードで使い勝手を確かめたい。","2026-11-10","Sean Weldon","https://www.sean-weldon.com/blog/2026-11-10-ai-brief"],["Claude Codeの「もう聞かないで」が秘密をGitHubへ流出","Claude Codeの「はい、次から聞かないで」を選ぶと、認証情報を含むコマンドが設定ファイルに残り、公開リポジトリへ漏れる事例が報告された。Apiiroの調査では2539件の秘密が見つかった。利用者は設定ファイルの扱いと認証情報の付け替えを確認しておきたい。設定ファイルの扱いを見直すきっかけになる。まずは自分のリポジトリの確認から始めたい。まずは自分のリポジトリを確認したい。","\n【概要】Claude Codeの「はい、次から聞かないで」を選ぶと、認証情報を含むコマンドが設定ファイルに残り、公開リポジトリへ漏れる事例が報告された。セキュリティ企業のApiiroの調査では2539件の秘密が見つかった。利用者は設定ファイルの扱いと認証情報の付け替えを確認しておきたい。\n【背景】Claude Codeは、シェルコマンドの実行前に許可を求める。承認時に「次から聞かないで」を選ぶと、そのコマンドが.claude/settings.local.jsonに許可ルールとして保存される。コマンドにパスワードやトークンが含まれていると、そのまま平文で残る。このファイルは本来、自分の端末だけに置くものだ。\n【詳細】Apiiroは2026年11月1日から3日に、公開されている同ファイル104,185件を調べた。そのうち1,122件に本物の秘密があり、1,379件の認証情報が含まれていた。内訳はデータベースのパスワード379件、Supabaseのキーが122件、SSHログイン43件、GitHubなどのトークン42件、AWSキー23件などだ。履歴や共有設定、会話記録まで含めると2,539件の秘密が1,994件のリポジトリに広がっていた。63の組織が対象になっていた。Claude Codeはこのファイルを全体のgit無視設定に加えるが、リポジトリ側には反映されないため、別の端末に複製したときなどに混入する。\n【ポイント・注意点】まず自分のリポジトリに.claude/settings.local.jsonが含まれていないか確認し、含まれていた認証情報は削除の前に付け替えること。削除だけでは履歴やフォークに残るため、付け替えが先だ。よく使われる検査ツールでも見逃しがあり、215件は2つの検査ツールのどちらにも引っかからなかった。Claude Code側は対策を検討中としている。2.1.323では、秘密を含みそうな許可ルールの扱いが見直された。まずは自分のリポジトリの確認から始めたい。GitHubの秘密検査は、Copilotの利用者にも関係する話題だ。設定ファイルの扱いを見直すとともに、リポジトリの秘密検査の有効化も確認しておきたい。Claude Code側の対策が進むまでは、利用者側の注意が欠かせない。","2026-11-11","AI Weekly","https://aiweekly.co/alerts/claude-codes-dont-ask-again-leaked-2539-github-secrets"],["MuseがApple WatchとWear OSへ、手首から呼び出せる","MetaのMuseがApple WatchとWear OSに対応した。11月9日に発表され、音声通話やテキスト、音声入力で手首から使える。iPadアプリに続く展開で、9月の提供開始から40日で米国のダウンロード数が1000万を超えた勢いが続いている。日本でも利用できる。手首から呼び出せるのは便利だが、使える作業の範囲はこれからだ。まずは試し
