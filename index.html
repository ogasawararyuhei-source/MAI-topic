で8パス時1.5〜2㎡／時、大きな図柄や複数の小さな転写を並べて刷る使い方に向きます。A2は最大幅450mm（約17.7インチ）で8パス時1〜1.5㎡／時と、よりコンパクトな印刷エリアで蛍光デザインを試したいスタジオ向けです。ロールとシートの両方のPETフィルムに対応し、自動ヘッドクリーニングと定期的な白インク循環も備えます。なお、通常のCMYK＋白のDTF機とは別の、蛍光印刷専用のソフト設定が必要です。\n\n注意点\n同社は、生産を始める前に、生地との適合性、転写の接着、洗濯への耐久性、長期の色の持続を必ずテストするよう強調しています。仕上がりは蛍光インクの処方、白の下地、生地、転写条件、照明で変わるとされており、通常の照明と実際のUV照明の両方の下で実物サンプルを確認することが勧められています。「昼間は普通のデザイン、夜のイベントでは光る」という二面性が売りになる反面、見え方の確認を省けない表現だと言えます。", "2026-10-16", "Impressions Magazine", "https://impressionsmagazine.com/news/erasmart-a1-a2-fluorescent-dtf-printers/170810/"], ["Haolic XP-2 — 卓上DTF第3世代、タッチ操作と自動カット搭載（10月14日）", "DTFおよびUV DTF機器のブランドHaolicが2026年10月14日に発表した、卓上DTFプリンターの第3世代「XP-2」のニュースです。13インチ幅・XP600ヘッドの卓上機で、タッチスクリーンで制御するピンチローラーのリフト、フィルムの自動カット、改善されたインク管理、強化された機械部品を備えます。数年分の顧客フィードバックをもとに、日常の印刷とメンテナンスの簡素化に焦点を当てたモデルで、10月15日から公式サイトで販売開始とされています。", "概要\nDTFおよびUV DTF機器のブランドHaolicが2026年10月14日に発表した、卓上DTFプリンターの第3世代「XP-2」のニュースです。タッチスクリーンで制御するピンチローラーのリフト、フィルムの自動カット、改善されたインク管理を備え、日常の印刷とメンテナンスの簡素化に焦点を当てています。対象は独立クリエイター、自宅ビジネス、小規模スタジオで、Tシャツ、パーカー、トートバッグなどのカスタムアパレル生産を想定しています。\n\n開発の背景\n同社によれば、XP-2の開発は数年分の顧客体験の見直しから始まりました。材料は、アフターサポートの事例、セットアップやメンテナンス時の質問、Facebookユーザーコミュニティでの議論です。繰り返し挙がったのは、プリントヘッドのケア、使わない期間の白インク管理、フィルムの装填とカット、内部部品へのアクセスといった、印刷そのものではなく「印刷と印刷のあいだ」の困りごとでした。CEOは「完成した印刷物だけでなく、印刷ジョブのあいだに起きることに目を向けた」とコメントしています。同社は2022年に初のピンク色の卓上DTFプリンターを出し、XP-1 Proを経て今回が第3世代となります。\n\n操作とメンテナンスの新機能\nタッチスクリーンからは、ピンチローラーのワンタッチリフト、フィルムの自動カットと前進・後退、印刷枚数の設定（マルチコピー）が操作できます。日常の手入れでは、ワンタッチのヘッドクリーニングとインクプライミング、始動時の白インク自動循環（沈殿を抑える狙い）を搭載。一定時間使わないとバキュームファンを止めるSmart Sleep Mode、PCなしで白インク循環と軽いノズル噴射を定期実行するVacation Modeもあり、休暇中のインク詰まり対策を意識した構成です。ただし同社は、これらは定期メンテナンスを不要にするものではないと断っています。\n\n駆動系と仕様\n仕様はXP600プリントヘッド、13インチの印刷フォーマットで、駆動系は57系ステッピングモーターと10mmタイミングベルトに強化され、安定したフィルム搬送と位置決めを狙っています。メンテナンス用のアクセスドアは2か所に増え、非常停止機能も備えます。発売は10月15日から公式サイトです。卓上機の競争が「日々の運用のしやすさ」に移っていることを示す1台です。", "2026-10-14", "Krastin Times / Haolic", "https://www.krastintimes.com/2026/10/14/haolic-launches-third-gen-xp-2-desktop-dtf-printer-with-smarter-controls-and-simplified-maintenance/"], ["Morpho Kickstarter総括 — 目標5万ドルに対し約1,000万ドル調達、詰め替えインク0.108ドル／ml", "卓上UVプリンターMorphoのKickstarterキャンペーンが10月14日に終了し、目標額5万ドルに対して約1,000万ドル、約3,000人の支援者を集めた。最大の訴求点は詰め替え式インクで、発売時価格換算で標準CMYKが1mlあたり0.108ドルと、eufyMakeの0.30ドルを大きく下回る。標準モデルはF1080ヘッド（汎用XP600系）、プロは長寿命・高解像のi3200を搭載する。", "\nHacksterが、MorphoのKickstarterキャンペーンの詳細を報じた。キャンペーンは10月14日まで実施され、関連報道によれば調達額は1,000万ドル超、支援者は約3,000人に達し、Bambu LabのX1キャンペーンの総額を上回った。\n\n詳細: Morphoの設計思想の中心はランニングコストだ。チップ付きカートリッジをやめて詰め替え式タンクを採用し、発売時価格で換算した標準CMYKインクのコストは1mlあたり0.108ドル。これはeufyMakeの0.30ドル／mlと比べて3分の1近い。プリントヘッドは、標準モデルがF1080（市販の汎用XP600系）、プロモデルがi3200（高解像・長寿命の産業用）で、両ヘッドともユーザーが個別に購入できるという。機能面では、テクスチャの積層が最大60mm、対象面を読み取る2.5Dレリーフスキャン、ステレオビジョンによるカメラ位置合わせ、ベッド上へ自動で詰め込む一括配置印刷ソフトが案内されている。創業者のブレット・ワン氏はDJIのカメラチームを立ち上げた人物だ。\n\n入手先: 標準パックのアーリーバード価格は1,799ドルだった。キャンペーン終了後のメーカー希望価格は標準2,699ドル／プロ4,999ドルと整理されている。リワードの出荷は12月予定とされた。\n\nコスト構造の読み解き: UV印刷の総コストは、本体価格よりインク単価で決まる場面が多い。0.108ドル／mlというMorphoの数字は、盛り上げ印刷のようにインクを大量に使う用途ほど効いてくる。標準機のF1080（汎用XP600系）は市販の入手性が高いヘッドで、交換コストを抑える設計でもある。プロ機のi3200は解像度と寿命で勝るが、その分価格帯も上がる。2.5Dレリーフスキャンとステレオビジョン位置合わせは、立体物への「位置合わせの失敗」を減らすための機能で、歩留まりの改善に直結する。\n\n注意点: 調達額の大きさは出荷品質の保証ではない。価格・仕様はキャンペーン時点のメーカー提示であり、量産機での独立検証はこれからだ。", "2026-10-14", "Hackster.io", "https://www.hackster.io/news/the-new-morpho-uv-printer-is-blowing-up-on-kickstarter-3cc69d524d79"], ["ミマキ新UVフラットベッド JFX220-2515／UJF200シリーズ発表", "ミマキが新世代のUVフラットベッドプリンター3機種を発表しました。大型のJFX220-2515と、小型のUJF200シリーズ（UJF200-3042／UJF200-6042）です。いずれも新RIPソフト「RasterLink8」を搭載し、カメラによる自動位置合わせやジョブ管理の強化により、段取りの手間を減らす自動化と生産性の向上が柱になっています。まず欧州・中東・アフリカ（EMEA）で公開され、域内75を超えるローンチイベントが予定されています。", "概要\nミマキが、UVフラットベッドプリンターの新世代機3機種を発表しました。大型のJFX220-2515と、小型のUJF200シリーズ（UJF200-3042、UJF200-6042）です。英国の販売代理店Hybrid Servicesが、展示会The Print Show（バーミンガムNEC、9月29日〜10月1日）で披露したもので、これに先立ちSign Istanbul（9月23〜26日）でもEMEA初公開されました。今後はEMEA全域で75を超えるローンチイベントが予定されています。\n\nJFX220-2515の詳細\n大型機のJFX220-2515は、印刷エリアが2,500×1,500mmで、厚さ101.6mmまでの素材に対応します。目玉の「Anchor Technology」は、素材が置かれた場所だけにバキューム（吸着）を効かせる仕組みで、マスキングや手作業での吸着調整が要らず、準備時間を大きく減らせるとしています。自動ロケーティングピンにより、素材の位置決めも速く正確に行えます。ヘッドは4ヘッド構成でデュアルCMYK印刷が可能となり、生産速度は最大42㎡／時です。蛍光インクEFS-150にも対応し、ヘッドから最大20mm離して印刷できるLD4モードや、凹凸表現の2.5D Texture Maker、点字印刷といった仕上げも可能です。\n\nUJF200シリーズとRasterLink8\n小型のUJF200シリーズは、高精度ヘッドで細かい文字や滑らかなグラデーションを再現し、蛍光インクにも対応します。高さ250mmまで、重さ20kgまでの立体物に直接印刷でき、キャリーケースやPCケースのように従来は難しかった製品も対象に入ります。オプションのカメラで素材位置を自動検出して位置合わせでき、UJF200-6042にはベルト搬送システムも用意されています。共通の基盤が新RIPソフトRasterLink8で、ジョブ管理の強化や蛍光カラーのワークフローに対応し、RasterLink7対応機種でも使えます。\n\nポイント\nミマキ・ヨーロッパの販売責任者は、短納期化、コスト上昇、熟練オペレーター不足という現場の圧力を背景に挙げ、手作業の介入を減らすことが今回の開発の狙いだと説明しています。「速さ」そのものより、段取りを含めて止まらない生産が競われていることがうかがえます。", "2026-09-26", "TEXINTEL / Hybrid Services", "https://www.texintel.com/press-room/hybdridservices-09-26-cmp-hybrid-services-to-unveil-next-generation-mimaki-jfx-and-ujf-uv-printers-at-the-print-show"], ["ミマキ TxF330-800 — DTFの連続印刷を安定させる旗艦機", "ミマキのDTF（ダイレクト・トゥ・フィルム）旗艦機TxF330-800の詳細です。330プリントエンジンにより従来機より約50%高速化しながら画質を保ち、100mロールのDTFフィルムで連続した一貫出力ができるため、カスタムTシャツ受注の量産に向きます。インクは16カートリッジ構成で白インクの容量が拡大され、自動メンテナンスも備えます。併せて、DTF用の新色インクも発表されました。", "概要\nミマキの新製品群の発表に含まれる、DTF（ダイレクト・トゥ・フィルム）旗艦機TxF330-800の詳細です。DTFは、フィルムに印刷した図柄を熱で衣類などに転写する方式で、この機種は長い生産ランでも安定した品質を保ちながら連続出力できることを狙っています。一連の新製品は、ラスベガスで9月23日から開かれるPRINTING United Expo 2026でも実演される予定です。\n\n高速化と連続出力\n心臓部の330プリントエンジンにより、従来機より約50%高速でありながら画質を保てるのが売りです。100mロールのDTFフィルムに対応するため、途中で止めずに一貫した出力ができ、カスタムTシャツのような受注生産の量産に向きます。インクは16カートリッジ構成で、DTFで消費量が多くなりがちな白インクの容量が拡大されました。自動メンテナンスも備え、長時間の運転で人が張り付く場面を減らす設計です。\n\nインクとソフトウェア\n併せて、TxF330-800向けにペールピンクとスカイブルーのDTF新色インクが発表され、色域を広げて寒色・暖色の再現やグラデーションの滑らかさを高めるとしています。またUV蛍光インクにはピンクとイエローが追加され、こちらはJFX220-2515とUJF200シリーズで使えます。新RIPソフトRasterLink8は、カメラによる素材検出とデータの自動配置、多色印刷による色表現の強化、複数台のプリンター間での色合わせといった機能で、機体とインクの性能を引き出す役割を担います。\n\n位置づけ\n調査会社Precedence Researchは分析の中で、DTFは生地の前処理が不要な点で、衣類へ直接印刷するDTGと比べて販売価格を下げられる可能性があると指摘しています。また、専用ソフトが熟練者でなくても高品質な印刷をしやすくすることで、新規参入が増える可能性にも触れています。旗艦機の投入は、「速く、止まらず、色がぶれない」量産体制を作れるかどうかが競争の軸になっていることを示しています。", "2026-09-26", "Precedence Research / TEXINTEL", "https://www.precedenceresearch.com/news/mimaki-expands-industrial-printing-portfolio-with-new-printers-inks-and-software"], ["FESPA 2026のミマキ — ハイブリッドUV UJ330H-160と次世代DTFコンセプト", "FESPA 2026におけるミマキ・ヨーロッパの出展報告です。テーマは「Print Different — Powering Possibilities」で、用途別の体験エリア構成でした。UVでは、国際展示会初登場のハイブリッドUV機UJ330H-160が中心で、1つの技術基盤でロール素材と板物の両対応を示しました。DTFでは330プラットフォームを基にした次世代コンセプト機が参考出展され、「速さ」より「予測可能性と色の安定」がテーマになっています。", "概要\nFESPA 2026におけるミマキ・ヨーロッパの出展報告です。テーマは「Print Different — Powering Possibilities」で、ブースは用途別の体験エリアで構成されました。看板、産業用途、テキスタイルといった仕事の種類ごとに、実際のアプリケーションを見せる形です。\n\nハイブリッドUVのUJ330H-160\nUVでは、国際展示会初登場のUJ330H-160ハイブリッドUVプリンターが中心でした。ハイブリッド機とは、ロール状の柔らかい素材（ロール・トゥ・ロール）と、板状の硬い素材（板物）の両方を1台で扱えるタイプを指します。看板のような板物と、バナーやフィルムのようなロール素材では、求められる搬送の仕組みが異なります。通常は方式ごとに別々の機械が必要になるところを、1つの技術基盤で両対応を示したのが今回のポイントです。同じ会場ではUJV200シリーズも国際デビューしています。用途ごとに機械を分けずに済む構成は、置き場所や設備投資を抑えながら、受けられる仕事の幅を広げたい現場に向けた提案だと言えます。\n\n次世代DTFコンセプト機\nDTFでは、330プラットフォームを基にした次世代コンセプト機が参考出展されました。市販機そのものではなく、今後の製品化の方向性を示す位置づけです。背景として同社は、「DTFは成熟期に入り、顧客は入口の安さではなく、予測可能性、生産性、色の一貫性を求めている」とコメントしています。ここでいう予測可能性とは、刷り上がりの品質や生産の所要時間が読みやすく、受注や納期の約束がしやすいことだと受け取れます。\n\n読み解き\nこのコメントは、DTFが「安く始められる新しい方式」の段階を過ぎ、量産と再現性で評価される段階に入ったという見立てです。制作販売の現場でも、1枚あたりの安さだけでなく、同じ色が安定して出ること、機械が止まらないこと、納期が読めることが利益を左右します。規模を広げる段階の判断軸として参考になる視点であり、今回のハイブリッドUVの提案も、柔軟性と安定性を両立させる方向と地続きだと考えられます。", "2026-05-20", "QuickPrintPro / Mimaki Europe", "https://www.quickprintpro.co.uk/Mimaki-%e2%80%98Powers-Possibilities%e2%80%99-With-A-Market-Diverse-Application-And-Printer-Line-Up-At-FESPA-2026.6068744.cms"]], "risk": [["電動爪削りの巻き込み事故に注意 — 保管中の製品で幼児の舌や皮膚が巻き込まれる（国民生活センター）", "消費者庁と国民生活センターは2026年10月29日、電動爪削りの回転刃に皮膚や舌などが巻き込まれる事故について注意喚起しました。保管中の製品を子どもが手に取り、舌や唇、首の皮膚を巻き込まれる事故が医療機関から5件寄せられ、2〜4歳の幼児が大半でした。大人のための小さな家電が、置き場所ひとつで幼児の事故につながります。子どもの手の届かない場所での保管と使用が、予防の中心です。", "消費者庁と国民生活センターは2026年10月29日、電動爪削りによる巻き込み事故について注意喚起を行いました。電動爪削りは、回転する刃やヤスリで爪を削る電動のケア製品で、大人向けに販売されているものが多くあります。\n\n事故の情報は二つの経路で集まっています。事故情報データバンクには、2016年度以降、電動爪削りの使用中に皮膚などが巻き込まれる事故が13件登録されており、被害者の約8割は70歳以上でした。一方、医療機関ネットワークには、保管中の製品を子どもが手に取って起きた事故が5件寄せられており、被害は2〜4歳の幼児が大半を占めています。大人にとっての日常品が、幼児にとっては触って確かめたくなる「動くおもちゃ」に見えることが、事故の背景にあります。\n\n寄せられた事例には、「子どもがテーブルの下の引き出しから製品を取り出して電源を入れ、なめようと舌を出して巻き込まれた」（3歳）、「電気シェーバーのように扱って遊んでいて、喉にあてていたら皮膚が食い込んで取れなくなった」（4歳）といったものがあります。回転刃に皮膚や舌が食い込むと、自力では外せなくなる事態も起こります。\n\n万が一巻き込まれた場合の対処として、センターは、直ちに電源を切ることを挙げています。巻き込まれた組織を無理に引っ張ると、痛みや出血を強め、傷を広げるおそれがあります。安全に取り外せない場合は、速やかに医療機関などへ相談することが勧められています。\n\n予防のポイントはシンプルです。電動爪削りは子どもの手の届かない場所で保管し、使用中も子どもを近づけないこと。そして、子どもの爪切りには子ども向けの用品を使うことです。引き出しの中やテーブルの上など、「ちょっと置いただけ」の場所が事故の起点になっています。家庭内にある電動ケア製品全般についても、同じ観点で置き場所を見直すきっかけになる発表です。\n\nなお、今回の注意喚起は高齢者の使用中の事故も含むものですが、子どもの事故については「保管中に触ってしまう」という型がはっきりしている点が特徴です。使っている最中ではなく、使っていないときの管理こそが問われている――その点で、回転する部分を持つ小型のケア製品全般について、家庭内の置き場所を見直す機会にもなる発表です。", "2026-10-29", "国民生活センター", "https://www.kokusen.go.jp/soudan_now/data/kodomo_jiko.html"], ["子どもの傷害予防の研究地図 — 溺水・転倒・やけど等26研究の総括（Frontiers）", "Frontiers in Public Healthに掲載された26研究の特集を総括した記事です。溺水、交通事故、転倒、やけど、中毒、スポーツ傷害、脳震盪、情緒的ないじめまでを広く扱い、16研究が中国、残り10研究がバングラデシュ、ネパール、米国などからです。最も手厚く扱われるのが溺水で、保護者の90%以上が溺水は予防可能と考える一方、溺れている人への対応を子どもに教えているのは6%未満、救助知識がない人は84%を超えると示されています。", "概要\nFrontiers in Public Healthに掲載された26研究の特集を総括した記事です。中国CDC、中南大学、ニューサウスウェールズ大学の研究者らが編集しました。対象は溺水、交通事故、転倒、やけど、中毒、スポーツ傷害、脳震盪、情緒的ないじめまで広く、観察研究が中心で、介入試験や系統的レビューも含まれます。\n\n溺水における意識と行動の差\n最も手厚く扱われるのが溺水です。バングラデシュ農村部の調査では、保護者の90%以上が溺水は予防可能と考える一方、溺れている人を見たときの対応を子どもに教えているのは6%未満、救助知識がない人が84%を超えるという、「分かっているのに行動が伴わない」差が示されました。同国では、親が働く間幼い子を水の危険から遠ざける地域の保育施設（クレッシュ）の拡充計画がありますが、安全監査、訓練された監視、品質基準が伴わなければ予防効果は不十分になりうると指摘されています。中国の青少年でも、溺水予防の知識は高いのに危険な水辺の行動が続くという同様の傾向が見られ、特に男子と寄宿生で目立つとされています。\n\n監視体制と政策の効果\n編集者らは、すべての対策の基盤は「監視（サーベイランス）」、つまり事故の発生を継続的に記録・分析する体制だと言います。上海の32年分の分析では、交通政策や通学路の改善、製品安全規制とともに、交通事故、溺水、転倒、中毒による死亡が減ったことが示されました。一方で、年長青少年の自殺は依然として課題として残るとも指摘されています。格差と見落とされがちな傷害\n交通事故では、ポーランドでチャイルドシートの誤使用が広く見られ、購入の決め手は安全試験の結果より価格やシートの重量で、装着ミスが続いていると報告されました。米国では、アメリカ先住民・アラスカ先住民の青少年の自動車事故死亡率が白人の2倍を超える一方、黒人の青少年運転者は人口当たりでは低く、免許取得や車へのアクセス、運転機会の差を反映している可能性があると注意されています。河南省の調査では、祖父母が保育を担う場合の傷害オッズが母親より33%高いことも示されました。\n\nまとめ\n編集者らの結論は、子どもの傷害は「不運な事故」ではなく、構造があり、測定でき、予防できる公衆衛生の問題として捉えるべきだというものです。", "2026-10-27", "Bioengineer.org / Frontiers", "https://bioengineer.org/child-injury-prevention-research-maps-risk-equity-and-paths-to-safety/"], ["転倒の負担は2010年以降に再上昇 — 中国0〜14歳の疾病負担分析", "Frontiersの特集総括で紹介された、Global Burden of Disease Study 2021による分析です。中国の0〜14歳について、約30年分の転倒による負担を推計しています。2010年以降、年齢調整した発生率が再び上昇に転じ、障害調整生命年（DALY）に占める「障害とともに生きる年数」の割合が増えています。転倒は件数が最も多い傷害であり、命を落とさずに済んでも後遺症とともに暮らす負担が大きくなっていることが示されています。", "概要\nFrontiersの特集総括の中で紹介された、Global Burden of Disease Study 2021を用いた分析です。中国の0〜14歳について、約30年分の転倒による負担を推計しています。Global Burden of Disease（GBD）は、病気やけがによる死亡と障害の負担を国・年齢ごとに推計する国際的な枠組みで、単なる発生件数ではなく「どれだけの健康な年数が失われたか」で比べられるのが特徴です。\n\n指標の読み方\n中心となる指標が障害調整生命年（DALY）です。これは、早く亡くなることで失われた年数と、障害を持って生きる年数を合計したもので、DALYに占める「障害とともに生きる年数」の割合が増えるということは、死亡による負担より、後遺症とともに暮らす負担の比重が高まっていることを意味します。また発生率は年齢調整、つまり人口の年齢構成の違いを取り除いたうえで比べられており、時代による変化を追いやすい形になっています。\n\n結果\n2010年以降、年齢調整した発生率が再び上昇に転じ、DALYに占める「障害とともに生きる年数」の割合が増えていることが分かりました。つまり、亡くならずに済んでも、後遺症とともに暮らす負担が全体の中で大きくなっているということです。年齢調整した発生率が下がり続けているわけではなく、2010年を境に上向きに転じた点が、この分析の注意点です。件数の減少や死亡の減少だけを見ると改善に見える局面でも、生き延びた後の負担まで含めると評価が変わりうる、というのがこの分析の示すところです。\n\n読み解き\n転倒は件数が最も多い傷害であり、他の研究でも子どもの傷害原因の約半数を占めることが繰り返し報告されています。発生率の再上昇と後遺症の比重の増加は、家庭内の段差、滑り、落下の対策を後回しにしない理由になります。負担の測り方を件数から「失われた健康な年数」に変えると、予防の優先順位の見え方も変わります。「死なないから軽い」ではなく、「長く付き合う負担になりうる」という見方が、このデータから読み取れるポイントです。", "2026-10-27", "Bioengineer.org / Frontiers", "https://bioengineer.org/child-injury-prevention-research-maps-risk-equity-and-paths-to-safety/"], ["乳幼児の加熱式たばこの誤飲に注意 — スティックの置き場所の管理が予防の中心（国民生活センター）", "国民生活センターは2026年10月22日、「子ども・若者サポート情報」第234号で、乳幼児による加熱式たばこの誤飲への注意を改めて呼びかけました。加熱式たばこのスティックは小さく、子どもの目にも口にも入りやすい形状です。過去にも金属片を含むスティックの誤飲が問題になっており、スティックや本体、吸い殻を子どもの手の届く場所に置かない管理が、予防の中心だとしています。", "国民生活センターは2026年10月22日、見守り情報「子ども・若者サポート情報」第234号で、乳幼児の加熱式たばこの誤飲に注意するよう呼びかけました。見守り情報は、高齢者や障がい者、子ども・若者のトラブル防止のために同センターが継続的に発信しているシリーズで、今回は家庭内で起きやすい誤飲のリスクが取り上げられました。\n\n加熱式たばこは、専用のスティックを本体に差し込んで加熱する仕組みの製品です。そのスティックは細く小さく、乳幼児にとっては口に入れやすい大きさと形状をしています。乳幼児は身の回りの物を手に取り、口に入れて確かめながら育つ時期であり、大人が想像する以上に「置いたままの物」へ手が伸びます。加熱式たばこについては、過去にも金属片を含むスティックの誤飲が問題になっており、同センターは継続的に注意喚起を行っています。\n\n今回の呼びかけで中心になっているのは、特別な道具ではなく「置き場所の管理」です。スティックや本体を、テーブルの上やバッグの外ポケットなど、子どもの手が届く場所に置かないこと。吸い殻も含めて放置しないこと。こうした基本の徹底が求められています。\n\n家庭で点検する際の観点としては、まず喫煙する家族の動線を見直すことが挙げられます。帰宅後にスティックをどこに置くか、バッグを床に置いたときに子どもの手が届かないか、車の中やソファの周りに吸い殻が残っていないか。来客の持ち物が子どもの手の届く範囲に置かれる場面にも注意が必要です。\n\n誤飲は、乳幼児の事故の中でも繰り返し注意喚起されてきた類型です。新しい製品が家庭に入るたびに、その製品の形や置き場所に応じた管理を更新していくことが、事故を未然に防ぐことにつながります。\n\n管理を続けるうえでのコツは、置き場所を「決める」だけでなく、家族全員で共有することです。喫煙する本人だけが気をつけていても、他の家族や来客の置き場所までは目が届きません。「スティック類はここにしまう」という家庭内のルールとして言葉にして共有しておくことが、帰省先や旅行先など、環境が変わる場面でも効いてきます。", "2026-10-22", "国民生活センター", "https://www.kokusen.go.jp/soudan_now/data/kodomo_jiko.html"], ["コンセントまわりの感電・熱傷、5年余で38件 — 約7割は針金やヘアピンの差し込み（国民生活センター）", "国民生活センターが2026年10月21日に発表した資料によると、2021年4月〜2026年7月末に医療機関ネットワークへ寄せられた15歳以下の子どものコンセント事故は38件で、うち28件は差込口に針金やヘアピンなどを差し込んだ事故でした。9割近くが9歳以下の子どもで、入院を要した事例は8件あります。保護者がそばにいても事故は起きており、コンセントまわりの環境の見直しが求められています。", "国民生活センターは2026年10月21日、「コンセントまわりの安全対策を見直しましょう ―子どもの感電や熱傷を防ぐために―」を発表しました。家庭のコンセントや電源コードに関わる子どもの感電・やけど事故について、医療機関ネットワークに寄せられた事例を精査したものです。\n\n対象期間は2021年4月から2026年7月末までの5年余りで、15歳以下の子どもの事例は38件ありました。そのうち28件、約7割は、コンセントの差込口に針金やヘアピンなどの金属製の小物を差し込んで受傷した事故です。年齢では9割近くが9歳以下の子どもで、入院を要した事例は8件ありました。センターは、保護者がそばにいても事故は起きていると指摘しています。子どもの目線は低く、床に近いコンセントはちょうど手が届き、興味を引きやすい位置にあります。\n\n具体的な事例としては、1本のケーブルの両端にある違う端子をそれぞれ両手に持ってコンセントに差し込み、右手側の端子が焦げてII度熱傷を負い、電撃傷として3日間入院した3歳9か月の男児のケース（2026年6月発生）が紹介されています。感電は、目に見えるやけどだけでなく、心臓など体の内部に損傷を与えることがあり、重篤化するおそれがある点も事故の怖さです。\n\n予防策としてセンターが挙げるのは、コンセントカバーやキャップの使用、コード類を垂らさない配置、クリップ・ヘアピン・鍵などの金属製品を子どもの手の届かない場所に保管すること、そしてプラグの抜き差しを子どもだけでさせないことです。\n\nコンセントは家中のあらゆる部屋にある設備だけに、「見ていれば大丈夫」ではなく、環境側の対策を積み重ねることが現実的な予防になります。使っていない差込口にカバーを付ける、床に近い場所の小物を片付けるといった小さな点検から始めることが勧められます。\n\nなお、38件という件数は、医療機関ネットワークに寄せられた事例を精査したものであり、家庭内で起きた軽いやけどや、受診に至らなかったヒヤリハットまでを含む数字ではありません。報告された事故の背後には、より多くの危険な場面が存在すると考えるのが自然であり、件数の大小よりも、約7割を占める「差し込み」という型の明確さこそが、この発表の実務的な価値です。", "2026-10-21", "国民生活センター", "https://www.kokusen.go.jp/soudan_now/data/kodomo_jiko.html"], ["自転車などのハンドルが子どものお腹に当たる事故 — 内臓損傷など重篤化も（国民生活センター）", "国民生活センターの2026年10月7日の発表によると、医療機関ネットワークには2021年4月〜2026年7月末の間に、15歳以下の子どもが自転車などのハンドルで腹部を打つ「ハンドル外傷」により内臓損傷などをした事故情報が39件寄せられ、肝損傷と出血性ショックで緊急手術に至った例もあります。外見の傷が小さくても内臓が傷ついている可能性があり、腹部を強打した場合は軽そうでも医療機関の受診が勧められています。", "国民生活センターは2026年10月7日、「自転車などのハンドルによる子どものお腹のけがに注意 ―内臓損傷などの重篤化も―」を発表しました。自転車の転倒時などに、ハンドルの端が子どもの腹部を直撃して内臓を傷つける「ハンドル外傷」について、医療機関ネットワークに寄せられた事故情報をまとめたものです。\n\n2021年4月から2026年7月までの約5年4か月の間に寄せられた、15歳以下の子どもの事故情報は39件に上ります。中には、肝損傷に加えて外傷性出血性ショックを起こし、緊急手術に至った事故情報も含まれています。ハンドルの端は面積が小さいため、転倒のエネルギーが腹部の一点に集中しやすく、体の内部に大きな力が加わることが、重篤化の背景にあります。\n\n具体的な事例としては、自転車乗車中にマンホールでスリップし、自転車に覆いかぶさるように受傷して肝損傷を負った6歳の男児のケース（2026年2月発生）が紹介されています。日常の走行中の、ごくありふれた転倒でも起こりうることが分かります。\n\nこの事故の厄介な点は、外見の傷が小さくても内臓損傷の可能性があることです。転倒直後は元気そうに見えても、内部で出血などが進んでいる場合があります。センターは、腹部を強打した場合は、症状が軽そうでも医療機関を受診するよう呼びかけています。「様子を見よう」と判断する前に受診する、という対応が安全側の行動です。\n\n予防の面では、自転車のハンドルバーエンド（グリップの端部分）の破損や欠落がないかを点検することが挙げられます。端のカバーが外れた状態では、衝撃がより集中しやすくなります。子どもの自転車だけでなく、子どもが触れる大人の自転車についても、乗車前の点検項目に加えておきたいポイントです。\n\nセンターの発表の表題が「自転車などのハンドル」としているように、この事故はハンドルを持つ乗り物一般で起こりうる型です。転倒そのものを完全になくすことは難しくても、バーエンドの状態を保つことと、転倒後に腹部の受診を迷わないことの二点は、家庭の側で確実に実行できます。", "2026-10-07", "国民生活センター", "https://www.kokusen.go.jp/pdf/n-20261007_2.pdf"], ["教育・保育施設の重大事故は2025年に3,130件 — 骨折が81%、死亡1件（こども家庭庁集計）", "こども家庭庁が2026年7月29日に公表した「令和7年教育・保育施設等における事故報告集計」によると、2025年1〜12月の重大事故の報告は3,130件で、うち骨折が2,533件と全体の81%を占めました。死亡事故は1件で、放課後児童クラブのプール・水遊び中の溺死です。発生場所の89%は施設内で、その約半数は園庭やグラウンドなどの室外でした。施設の安全を考えるうえでの基礎データです。", "こども家庭庁は2026年7月29日、「令和7年教育・保育施設等における事故報告集計」を公表しました。保育所や幼稚園、放課後児童クラブなどの教育・保育施設で発生し、国へ報告された重大事故を集計したものです。対象となるのは、死亡、意識不明、治療に30日以上を要する重篤な事故であり、日常の小さなけがまでを含む数字ではない点に留意が必要です。\n\n2025年1月から12月までの報告は3,130件で、前年より61件減少しました。内訳では負傷等が3,129件、そのうち骨折が2,533件と全体の81%を占めています。死亡事故は1件で、放課後児童クラブにおけるプール・水遊び中の溺死でした。\n\n発生場所を見ると、89%が施設内で、その約半数は園庭やグラウンドなどの室外です。骨折の多くが屋外活動の場面で発生していることからは、遊具や園庭の環境点検と、活動中の見守り体制が、再発防止の中心であることが読み取れます。また、死亡事故が水遊びの場面で起きていることは、水辺の活動における監視の重要性を改めて示しています。\n\nこの集計は、個別の施設の評価ではなく、全国の傾向を把握するための統計です。家庭の側では、子どもが通う園や施設で、遊具の点検や水遊びの際の見守り体制がどうなっているかを知るきっかけとして活用できます。\n\n件数の増減だけに一喜一憂するのではなく、骨折と水の事故という二つの大きな型に絞って対策を積み重ねることが、数字の示す実務的な教訓だと言えます。\n\nこの集計を家庭の側から読むとき、件数そのものよりも、「事故が起きた際に施設から説明があり、再発防止が共有されるかどうか」が、安心して子どもを預けるうえでの材料になります。全国集計の公表は、施設と家庭が安全について話し合う土台にもなるものです。\n\nまた、報告対象が「治療30日以上」の重篤な事故である以上、その中心が骨折になるのは定義上自然な面もあります。裏を返せば、重大事故の予防は、命に関わる事故の防止と、骨折のような長期治療につながる事故の防止の、二層で考える必要があるということです。", "2026-07-29", "こども家庭庁", "https://www.cfa.go.jp/press/e109e058-a3e5-48a8-a598-a6357da035d3"], ["今年の「こどもの事故防止週間」は転落事故がテーマ — 予防の鍵は「環境づくり」（消費者庁）", "消費者庁のメールマガジン「みんなの消費安全ナビ」Vol.691（2026年7月10日配信）によると、令和8年度の「こどもの事故防止週間」は7月13日から19日まで実施され、テーマは「転落事故」でした。スローガンは「こどもの転落事故は『環境づくり』で防ぐことができます」。抱っこ・おんぶの状態、家具、階段、遊具、窓・ベランダなど、さまざまな場面での転落事故について、事故事例と防止のポイントが関係省庁から発信されました。", "消費者庁を含む関係10省庁から成る「こどもの事故防止に関する関係府省庁連絡会議」（事務局：こども家庭庁）は、平成29年度から毎年「こどもの事故防止週間」を設定し、子どもの事故防止のポイントを集中的に呼びかける取組を行っています。消費者庁のメールマガジン「みんなの消費安全ナビ」Vol.691（2026年7月10日配信）は、令和8年度の週間について伝えました。\n\n令和8年度の実施期間は7月13日（月）から7月19日（日）までで、テーマは「転落事故」です。スローガンは「身の回りに潜む転落事故の危機 ――こどもの転落事故は『環境づくり』で防ぐことができます」。子ども本人に注意を促すだけでなく、事故が起きにくい環境を大人が先に整えるという考え方が、前面に出されています。\n\n取り上げられた転落の場面は多岐にわたります。抱っこやおんぶの状態からの落下、家具からの転落、階段での転落、遊具からの転落、そして窓やベランダからの転落などです。週間に合わせて、ポスターやSNS、ウェブサイトなどを通じて、事故事例や事故防止のポイントが関係省庁から情報発信されました。\n\n「環境づくり」という視点は、家庭の点検にもそのまま応用できます。窓の近くに登れる家具や踏み台を置かない、階段には転落防止の工夫をする、遊具の状態を確認する、といった対策は、子どもを叱ったり見張り続けたりしなくても効く、持続可能な予防です。\n\n週間は年1回の取組ですが、テーマとして蓄積された事例と防止ポイントは、年間を通じて家庭の安全点検の材料になります。今年度は転落がテーマでしたが、自宅の中を「落ちる場所はないか」という目で一度見直すことが、発表の実践的な受け止め方です。\n\nなお、連絡会議に参加するのは、警察庁、消費者庁、こども家庭庁、総務省消防庁、文部科学省、厚生労働省、農林水産省、経済産業省、国土交通省、海上保安庁の関係府省庁です。転落ひとつを取っても、窓やベランダは住宅政策、遊具は施設管理、抱っこひも等の製品は製品安全と、所管が分かれており、省庁横断で取り組む意味がここにあります。", "2026-07-10", "消費者庁", "https://www.caa.go.jp/policies/policy/consumer_safety/child/project_001/mail/20260710"], ["車のパワーウインド挟まれ事故 — 窒息・切断・骨折など重篤なけが（国民生活センター）", "国民生活センターの2026年7月1日の発表です。子どもが遊びでスイッチを操作したり、運転者が窓の状態を確認せずに操作したりして、パワーウインドに挟まれる事故が発生し、窒息、切断、骨折など重篤なけがが報告されています。窓を操作する際は子どもの手や顔の位置を必ず確認すること、ウインドロック機能を使うこと、乳幼児にはチャイルドシートを正しく装着することが、予防策として示されています。", "国民生活センターは2026年7月1日、「パワーウインドによる事故に注意！ ―窒息や切断、骨折など重篤なけがを負っています―」を発表しました。自動車のパワーウインドに子どもが挟まれる事故についての注意喚起で、同内容は同センターのリーフレット「くらしの危険」No.393（2026年9月発行）にも収載され、継続的に呼びかけられています。\n\n事故の発生パターンは大きく二つあります。一つは、子どもが遊びでスイッチを操作して、自分やきょうだいの手・指・首などを挟んでしまうケース。もう一つは、運転者など大人が、窓の状態や子どもの位置を確認しないまま操作してしまうケースです。報告されているけがは、窒息、切断、骨折など重篤なものを含みます。窓ガラスを押し上げる力は、子どもの体にとっては十分に危険な強さになりうるのです。\n\n予防策として発表が示すのは、まず乳幼児にはチャイルドシートを正しく装着することです。体が固定されていれば、窓やスイッチに手が届く範囲は限られます。次に、パワーウインドを操作する際は、必ず子どもの手や顔の位置を確認してから行うこと。そして、後部座席のスイッチを無効化できるウインドロック機能を活用することです。\n\nパワーウインドは毎日使う身近な設備だからこそ、危険の意識が薄れがちです。「確認してから操作する」という一手間を習慣にできるかどうかが、予防の分かれ目になります。\n\nドライブの楽しい時間に水を差す話ではありますが、チャイルドシート、確認、ウインドロックという三つの基本を家族で共有しておくことが、発表の伝える実践的なメッセージです。\n\nとりわけ後部座席は、運転席から子どもの手や顔の位置が見えにくい場所です。ウインドロック機能が備わっている車では、子どもを乗せるときの初期設定としてロックをかけておくことが、発表の示す予防策を確実にする方法になります。逆に、大人だけが乗るときに解除する運用とセットにすれば、日常の不便も抑えられます。家族で車に乗る際の確認事項として共有しておくことが、発表の勧める実践です。", "2026-07-01", "国民生活センター", "https://www.kokusen.go.jp/soudan_now/data/kodomo_jiko.html"], ["乳幼児用ベッドガードとベビーカーの事故防止 — 挟まれ死亡4件、子供PSCマーク対象に（NITE）", "製品評価技術基盤機構（NITE）が2026年6月25日に公表した注意喚起です。2015年〜2026年6月の事故情報で、ベッドガードへの挟まれ等による死亡が4件、ベビーカーでの重大なけがが11件確認されています。2026年7月からは両製品が「子供用特定製品」となり、子供PSCマークのない製品は販売できなくなります。購入時のマーク確認と、対象年齢を守った正しい設置・使い方が予防の要点です。", "独立行政法人製品評価技術基盤機構（NITE）は2026年6月25日、「こどもの命を守るため、今知ってほしい ―乳幼児用ベッドガード・ベビーカーの事故を防ぐために―」と題する注意喚起を行いました。出産や子育ての準備を始める家庭に向けて、子供用製品の選び方と使い方の基本を改めて示したものです。\n\n背景にあるのは、2025年に施行された改正消費生活用製品安全法などによる「子供用特定製品」の枠組みです。乳幼児用ベッドガードとベビーカーが新たにこの枠組みに指定され、2026年7月からは、技術基準への適合確認や警告表示を行い、子供PSCマークを付した製品でなければ販売できない規制が始まります。\n\n事故の実態として、2015年から2026年6月までの約10年間にNITEへ通知された製品事故情報では、乳幼児用ベッドガードでマットレスとの間に挟まれて子どもが死亡する事故が4件、ベビーカーで段差につまずいて転倒するなど、子どもの重傷事故が11件発生しています。\n\nベッドガードの事故を防ぐポイントは、対象年齢・月齢を必ず守り、出生後18か月未満の乳幼児には使用しないこと、そして設置の際に取扱説明書の指示どおりに固定し、マットレスとの間に隙間が生じないようにすることです。隙間こそが、挟み込みの起こる場所になります。\n\nベビーカーについては、使用時にシートベルトを着用すること、折りたたみの操作は乳幼児から離れた場所で行い、開閉時の指の挟み込みに注意すること、走行の際には段差や溝に注意して操作することが挙げられています。これから製品を選ぶ家庭では、デザインや価格だけでなく、子供PSCマークの有無を含め、基準に適合した製品かどうかを確認することが大切だと、NITEは呼びかけています。\n\n購入ではなく、譲り受けや中古で製品を使う場面でも、対象年齢と取扱説明書の確認は欠かせません。特にベッドガードは、使うベッドやマットレスとの組み合わせで隙間のでき方が変わります。設置のたびに隙間を確認するという一手間を、使い始めの習慣にすることが、発表の内容を家庭で生かす道筋です。", "2026-06-25", "NITE（製品評価技術基盤機構）", "https://www.nite.go.jp/jiko/chuikanki/press/2026fy/index.html"], ["10代に多発する自転車事故 — 5年で299件、8割が重傷。乗車前の点検を（NITE）", "NITEが2026年4月23日に公表した注意喚起です。2021〜2025年の5年間にNITEへ通知された自転車の製品事故は299件で、その8割が重傷事故、年代別では10歳代の事故が最多でした。車輪への異物の巻き込みや、リコール対象製品での事故が目立ちます。2026年4月からは交通反則通告制度が自転車にも適用され、新年度を迎えたこの時期、乗車前に確認したいポイントが改めて示されています。", "独立行政法人製品評価技術基盤機構（NITE）は2026年4月23日、「新年度の安全チェック！ “10代”で多発、自転車事故に注意 ―乗車前に確認したい4つのポイント―」と題する注意喚起を行いました。新年度が始まり、通勤・通学で新たに自転車を使い始める人が増える時期に合わせた発表です。\n\nNITEに通知された製品事故情報では、2021年から2025年までの5年間に発生した自転車の事故は299件あり、そのうち8割が重傷事故でした。年代別では10歳代の事故が最多となっています。事故の内容では、「車輪への異物の巻き込みの事故」や「リコール対象製品での事故」が多く見られました。\n\nまた、2026年3月にNITEが実施した自転車の事故・ヒヤリハット経験に関するアンケート調査でも、車輪への異物の巻き込みのほか、「ブレーキの効きが悪く、ぶつかりそうになった」といった、整備不良に近い体験が多く寄せられています。事故に至らなかったヒヤリハットを含めると、点検不足が身近なリスクであることがうかがえます。\n\n制度面の変化もあります。2026年4月からは、交通反則通告制度（いわゆる青切符）が自転車にも適用されました。ルールと安全の両面で、自転車の乗り方を見直す機運が高まっています。\n\nNITEは、自転車の点検チェックリストや、自転車にチャイルドシートで子どもを乗せる際に気をつけるポイントも公開しています。子ども自身が自転車に乗り始める家庭はもちろん、小さな子どもを乗せる保護者にとっても、「乗る前のひと点検」を習慣にすることが、発表の伝える実践的な予防策です。\n\n読み取りの注意点として、NITEに通知される製品事故は重大なものが中心であり、299件の8割が重傷という構成には、制度上の集まりやすさも含まれます。それでも、巻き込みとリコール対象製品という「点検と確認で防げる類型」が目立つことは、実務的な教訓です。\n\n新年度は進学や生活環境の変化で、慣れない道や時間帯に自転車を使う機会も増えます。車両の点検に加えて、走行環境の変化そのものが事故の条件になることも、家庭で共有しておきたい視点です。", "2026-04-23", "NITE（製品評価技術基盤機構）", "https://www.nite.go.jp/jiko/chuikanki/press/2026fy/prs260423.html"], ["事故防止ハンドブック「窒息・誤飲」編 — 食品・フィルム・薬品の管理ルール（こども家庭庁）", "こども家庭庁の「事故防止ハンドブック」（0〜6歳対象）の窒息・誤飲に関する資料（2026年4月6日付）には、家庭でそのまま使える予防のルールが整理されています。フィルムやシール類を子どもの手の届く場所に置かない、薬品や洗剤は鍵のかかる場所に保管する、0〜5歳には乾いた豆・ナッツ類や粘着性・弾力性のある食品を与えない、といった具体策です。「置き場所」と「食品の形」が、今日から変えられるポイントです。", "こども家庭庁は、0歳から6歳（小学校入学前の未就学児）の子どもに予期せず起こりやすい事故について、その予防法と、もしもの時の対処法のポイントをまとめた「事故防止ハンドブック」を作成しました（完成時期：2026年3月）。ここで紹介するのは、そのうち窒息・誤飲を取り上げた資料（2026年4月6日付PDF）の内容です。\n\n窒息と誤飲は、乳幼児の事故の中でも重い結果につながりやすい類型です。小さな物は何でも口に入れるという乳幼児の行動特性に加え、家庭の中には、フィルムやシール、薬品、洗剤、食品など、口に入ると危険なものが数多くあります。ハンドブックでは、こうした典型的なパターンと、その予防策が整理されています。\n\n予防策の柱の一つは「置き場所」の管理です。小さな物やフィルム類を子どもの手の届く場所に置かないこと。薬品や洗剤は、鍵のかかる場所に保管すること。日常的に使うものほど、置き場所が漫然と決まってしまいがちですが、子どもの手の届く範囲が成長とともに広がる点も意識が必要です。\n\nもう一つの柱は「食品の形と与え方」です。0〜5歳には、乾いた豆やナッツ類、粘着性や弾力性のある食品を与えないといった、年齢に応じた食品のルールが示されています。のどに詰まりやすい形状を避け、年齢に合わせて切り分けや形状を調整することが、食卓でできる予防になります。\n\nこのハンドブックの利点は、チェックリストとして家庭でそのまま使える形にまとまっていることです。「置き場所」と「食品の形」は、特別な道具なしに今日から見直せるポイントであり、公的な予防策の実践版として手元に置いておく価値があります。\n\nハンドブックは、事故の類型ごとに予防法と対処法をまとめた構成で、窒息・誤飲はその一編です。子どもの成長に伴って手の届く範囲や口に入れるものは変わっていくため、新生児期、離乳食期、歩き始めの時期といった発達の節目ごとに読み返し、その時期のリスクに合わせて家の中を点検する、という使い方もできます。各家庭の住環境や子どもの月齢に合わせて、必要な項目から取り入れることができます。", "2026-04-06", "こども家庭庁", "https://www.cfa.go.jp/policies/child-safety-actions/handbook/content-1"], ["スマホで傷害予防 — アプリ等のmHealth活用を検証したスコーピングレビュー", "JMIR mHealth and uHealth 2026年（第14巻）に掲載されたスコーピングレビューです。子どもの不慮の傷害予防にスマホアプリ等のモバイルヘルス（mHealth）技術をどう使うかを調べた研究を集め、5つのデータベースから集めた1,085件のうち基準を満たした16研究を分析しました。使われた技術はアプリ、WeChat、モバイルeラーニング、VRとウェアラブルの組み合わせなどで、傷害の減少と保護者の意識向上に一定の効果が見られました。", "概要\nJMIR mHealth and uHealth 2026年（第14巻）に掲載されたスコーピングレビューです。スコーピングレビューとは、あるテーマの研究全体を幅広く集め、どんな方法が試され、何が分かっていないかを地図のように整理する手法です。子どもの傷害は、年齢や発達段階によってリスクの種類が変わるため、内容を更新し続けられるモバイル技術と相性が良いはずだ、というのが出発点です。\n\n方法と対象研究\n研究チームは、PubMed、Web of Science、Embase、Cochrane Library、CINAHLの5つのデータベースを、各データベースの開始から2025年12月31日まで検索しました。集まった1,085件のうち、基準を満たした15件に、参考文献からたどった1件を加えた16研究が分析対象です。内訳はランダム化比較試験が9件（56.2%）、準実験研究2件、混合法研究3件、質的研究1件、記述的研究1件となっています。\n\n使われた技術と機能\n使われた技術は、アプリ、WeChat、モバイルeラーニング、VRとウェアラブルの組み合わせなどです。アプリを使った研究が12件と中心でした。機能は健康教育、双方向のやり取り、監視とリマインド、行動訓練、アンケートと記録、緊急対応に分類されています。具体例として、WeChatで保護者に予防情報と緊急時対応を定期配信した研究、1歳未満の子の転落予防にアプリを使った研究、子どもが交通安全の標識を学ぶシリアスゲームなどが挙げられています。評価指標には、傷害の発生率のほか、保護者の知識・態度・行動、使いやすさなどが含まれます。\n\n結果と課題\n結果として、傷害発生の減少、保護者の知識・態度・行動の改善に前向きな効果が見られました。一方で、研究で作られたアプリのうち一般公開されているのは2つだけであり、研究が終わると使えなくなるものが多いのが現状です。著者らは、機能設計の最適化と持続性の強化、長期・大規模な検証が今後の課題だとしています。手軽なリマインドや記録の仕組みは有望でも、「作って終わり」にしない運用が問われる分野だと言えます。", "2026-04-01", "JMIR mHealth uHealth", "https://mhealth.jmir.org/2026/1/e94038"], ["河南・0〜17歳の大規模調査 — 傷害の67.71%で「効果的な見守り」が欠如", "中国・河南省で2022年6月〜2023年5月に実施された0〜17歳対象の住民ベース横断調査です（Frontiers in Public Health 2026年、第14巻）。全体の傷害発生率は6.88%で、女児の5.32%に対し男児は8.23%と有意に高く、毎日帰宅する通学児童も未就学の子どもより高くなっています。事故の54.17%は家庭での余暇時間に起き、その67.71%で効果的な見守りが欠けていました。原因は転倒が53.90%で最多です。", "概要\n中国・河南省で2022年6月〜2023年5月に実施された、0〜17歳を対象とする住民ベース横断調査です。Frontiers in Public Health 2026年（第14巻）に掲載されました。病院の記録ではなく地域の住民を対象に調べているため、受診に至らない軽いけがも含めた発生の実態に近い数字が得られる設計です。\n\n誰が・どこで起きるか\n全体の傷害発生率は6.88%で、女児5.32%に対し男児8.23%と有意に高く、男児のオッズ比は1.58でした。割合で見ても、男児8.23%と女児5.32%には3ポイント近くの開きがあります。オッズ比は、ある集団で出来事が起きやすさが基準の何倍かを示す数値で、1.58は男児の起きやすさが女児より約1.6倍高いことを意味します。毎日帰宅する通学児童も、未就学の子どもと比べてオッズ比1.69と高くなっています。事故の54.17%は家庭での余暇時間に起き、その67.71%で効果的な見守りが欠けていました。大人が家にいるかどうかではなく、実際に目が届いているかが問題になる、というのがこの数字の読み方です。祖父母が保育を担う家庭も、高リスク群として注意点が示されています。\n\nけがの中身と負担\n原因は転倒が53.90%で最多でした。傷害の種類は打撲・擦過傷が37.47%、部位は下肢が37.70%です。打撲・擦過傷が最も多く、下肢のけがが中心という結果は、転倒という原因の多さと重なります。平均入院は18日、平均費用は2,713元で、原因別では交通事故が最も高額でした。転倒は件数が多い一方、1件あたりの負担が重くなりやすいのは交通事故だという対比が見えます。\n\n結論\n著者らの挙げる優先策は、見守りの強化（特に家庭の余暇時間）、高リスク群への対策、転倒と交通事故への集中です。発生率6.88%という水準は、およそ15人に1人が調査期間中に傷害を経験する計算です。「家の中の自由時間」に「効果的な見守りがない」という組み合わせが過半を占める以上、対策の主戦場は日常生活の中にあるという結論になっています。", "2026-03-15", "Frontiers in Public Health", "https://public-pages-files-2025.frontiersin.org/journals/public-health/articles/10.3389/fpubh.2026.1794442/reference"], ["子どもの不慮の傷害は転倒が約半数・家庭内が43.6% — 救急の実態研究", "トルコの救急部門を対象にした前向き横断研究で、Turkish Journal of Trauma & Emergency Surgery 2026年（第32巻）に掲載されました。子どもの不慮の傷害の原因は転倒が49.8%で最も多く、次いで交通事故が12.4%でした。発生場所は家庭が43.6%で、特に台所と庭が目立ちます。患者の62.7%は男児でした。母親の教育水準や経済状況と、けがの重症度との関連も報告されています。", "概要\nトルコの救急部門を対象にした前向き横断研究で、Turkish Journal of Trauma & Emergency Surgery 2026年（第32巻）に掲載されました。救急を受診した子どもの不慮の傷害について、原因、発生場所、患者の属性、重症度などを記録し、全体像と重症化の要因を探った研究です。前向き研究とは、対象者を登録してから先の経過を追う設計を指し、後から記録を振り返る方法より記録の漏れが少ないとされます。\n\n結果の内訳\n結果では、不慮の傷害の原因は転倒が49.8%で最も多く、ほぼ半数を占めました。次いで交通事故が12.4%です。発生場所は家庭が43.6%で最多であり、特に台所と庭が目立つとされています。患者の62.7%は男児で、傷害の発生に性別による偏りがあることも示されました。家庭、それも日常的に過ごす台所や庭が中心だという結果は、「事故は外出先で起きる」という印象とは異なる実態を示しています。\n\n重症度と背景要因\n研究では、母親の教育水準が低いことや経済状況の厳しさと、傷害重症度スコア（けがの重さを数値化した指標）の高さに関連が見られています。これは、個々の家庭の注意不足というより、住環境や見守りの体制を整える余裕といった条件の差が、けがの重さに影響しうることを示唆する結果です。臨床面では、血清グルコース値などが死亡リスクの目安になりうることも示されています。これは救急の現場で、搬送された子どもの経過を予測する手がかりを探した分析です。\n\n読み解き\nこの研究が数字で裏づけるのは、件数の多い転倒と、家庭内という発生場所の組み合わせです。なお、救急部門のデータは受診に至った傷害が対象であり、受診しない軽傷は含まれません。その前提でも、原因の約半数が転倒で、場所の4割超が家庭である以上、対策の優先順位は家庭内の転倒対策に置くのが自然だと言えます。逆に言えば、特別な外出や乗り物の場面だけに注意を向けるのでは、大多数の発生場面を取りこぼすことになります。", "2026-03-01", "Turkish J. Trauma Emerg. Surg.", "https://openurl.ebsco.com/contentitem/doi%3A10.14744%252Ftjtes.2026.65814?sid=ebsco:ocu:record&id=ebsco:doi:10.14744%2Ftjtes.2026.65814&bquery=DE%20%22BLOOD%20sugar%22&page=1&link_origin=&searchDescription=BLOOD%20sugar"], ["見守り＋健康教育＋環境改善で傷害発生が下がった — 石家荘の介入研究", "Frontiers in Public Healthに2026年2月20日に掲載された原著研究です。中国・石家荘市の6〜17歳を対象に、小学校6校・中学校6校などを層化クラスター抽出（学校などの集団単位で割り当てる方法）し、見守りの強化、健康教育、環境改善を組み合わせた総合介入を行いました。結果として、介入群の傷害発生率は0.13%低下した一方、対照群は2.00%上昇しました。子どもの傷害予防に関する知識スコアも向上したと報告されています。", "概要\nFrontiers in Public Healthに2026年2月20日に掲載された原著研究です。中国・石家荘市の6〜17歳を対象に、小学校6校・中学校6校などを層化クラスター抽出しました。クラスター抽出とは、個人ではなく学校のような集団を単位として抽出・割り当てする方法で、学校単位で取り組みを変える介入の評価に向いています。層化とは、学校の種類などの属性でグループ分けしてから抽出することで、対象の偏りを抑える工夫です。\n\n介入の中身\n介入は、見守りの強化、健康教育、環境改善を組み合わせた総合型です。見守りは「大人が目を配る体制」、健康教育は「子どもや保護者が知識を得る機会」、環境改善は「事故が起きにくい物理的な環境への手当て」にあたります。単独の啓発ではなく、人の行動と環境の両方に同時に働きかける設計になっている点が特徴です。介入を受けない対照群を置くことで、時期による自然な増減と介入の効果を分けて見られるようにしています。\n\n結果\n結果として、介入群の傷害発生率は0.13%低下した一方、対照群は2.00%上昇し、差は2.13%（95%信頼区間0.506〜0.809、p<0.001）でした。p<0.001という値は、この差が偶然で生じる可能性が極めて低いことを示す目安です。また、子どもの傷害予防に関する知識スコアも2.830点上がっています。対照群で発生率が上がった時期に介入群では下がったという構図は、介入が増加傾向を押しとどめた可能性を示唆します。\n\n読み解き\n結論として、保育・見守り、健康教育、環境改善を統合した介入が、子どもの傷害の減少と知識の向上に良い影響を持つとされています。「知らせる」だけ、「見張る」だけでは届かない部分を、環境そのものを直すことで補う発想です。家庭でも「環境を先に直す」視点が活きます。たとえば注意喚起の声かけに頼る前に、転びやすい・手が届くと危ないといった物理的な条件そのものを見直す順序は、この研究の組み立てと通じます。学校単位で環境を変える介入は、個々の家庭への呼びかけと違い、取り組みが届く範囲がそろいやすい点も特徴です。", "2026-02-20", "Frontiers in Public Health", "https://www.frontiersin.org/journals/public-health/articles/10.3389/fpubh.2026.1733074/pdf"], ["洗剤・殺虫剤を飲料用ペットボトルに移し替えないで — 子どもの誤飲事故が発生（国民生活センター）", "国民生活センターが2026年2月4日に発表した注意喚起です。洗剤や殺虫剤を飲料用のペットボトルなどに移し替えたことによる誤飲事故が発生しています。飲み物と見分けのつかない容器に入れる行為自体が、子どもだけでなく大人も含めた誤飲の直接の原因になります。移し替えをしない、移し替えた容器は冷蔵庫や手の届く場所に置かない、元の容器のまま保管することが、基本の予防策です。", "国民生活センターは2026年2月4日、洗剤や殺虫剤などの誤飲事故について注意喚起を行いました。注意喚起の表題は「飲料用ペットボトルへの移し替えはやめましょう！」。日用品を飲料の容器に移し替えるという、一見ささいな行為が事故の出発点になっていることが示されています。\n\n発生しているのは、洗剤や殺虫剤を飲料用ペットボトルなどに移し替えたことによる誤飲事故です。飲料の容器に入った液体は、見た目では中身を判別できません。子どもが飲み物だと思って口にするだけでなく、大人自身が誤って飲んでしまう可能性もあります。冷蔵庫の中に置かれれば、家族の誰にとっても「飲み物」に見えてしまいます。\n\n予防策としてセンターが示すのは、まず飲料容器に洗剤類を絶対に移し替えないことです。やむを得ず移し替えた容器がある場合も、子どもの手の届く場所や冷蔵庫には置かず、元の容器のまま保管することを基本とします。ラベルを貼ったつもりでも、時間がたてば家族の中で情報が共有されなくなることが、こうした事故の怖さです。\n\nこの事故類型の特徴は、「危険な製品」ではなく「危険な習慣」が原因である点です。製品自体の使い方の問題ではないため、家庭のルールとして「飲料容器には飲料以外を入れない」を徹底するだけで、防げる事故だと言えます。\n\n掃除や害虫対策の季節用品が出てくる場面では、つい手近な空き容器を使ってしまいがちです。発表は、そうした何気ない場面こそ点検の対象だということを伝えています。\n\n飲料用ペットボトルは、そもそも口を付けて飲むことを前提に作られた容器です。キャップを開けやすく、中身を飲みやすいという、その「飲みやすさ」自体が、別の液体を入れた途端に誤飲の起こりやすさへと裏返ります。容器の形が行動を誘導してしまう点が、この事故類型の本質です。\n\n殺虫剤や洗剤を使う場面は、掃除や季節の害虫対策など、慌ただしい作業の最中であることも少なくありません。作業の途中こそ、容器の取り違えや置き場所の油断が起きやすいものです。「移し替えない」という一つのルールを、家族全員の約束として先に決めておくことが、発表の勧める最も確実な予防策です。", "2026-02-04", "国民生活センター", "https://www.kokusen.go.jp/soudan_now/data/kodomo_jiko.html"], ["節分の豆まきにも事故の危険 — 5歳以下には豆を食べさせないで（消費者庁）", "消費者庁の「みんなの消費安全ナビ」Vol.678（2026年1月30日配信）は、節分にまつわる事故への注意を呼びかけました。医療機関からは、豆を丸呑みして咳き込んだ9歳、片方の鼻の穴に乾燥大豆を入れて取れなくなった4歳、お面をかぶったままつまずいて家具に口元をぶつけた3歳などの事例が寄せられています。節分の豆は丸飲みしてのどに詰まらせやすい食品であり、5歳以下の子どもには食べさせないことが示されています。", "消費者庁のメールマガジン「みんなの消費安全ナビ」Vol.678「節分を安全に過ごしましょう」（2026年1月30日配信）は、2026年2月3日の節分を前に、風習に潜む事故の危険を取り上げました。消費者庁には、節分の時期にも起こりそうな事故の情報が医療機関から寄せられており、事故事例とともに防止のポイントが紹介されています。\n\n寄せられた事例は具体的です。「節分の豆まきの豆をこどもが丸呑みしてしまった。直後に咳き込んでおり、夕食後も『豆が喉にある感じがする』との訴えがあった」（9歳）。「片方の鼻の穴に豆（乾燥大豆）を入れてしまい、取れなくなった」（4歳）。「お面をかぶったまま遊んでいたところ、つまずいて家具に口元をぶつけ、出血した」（3歳）。楽しさの裏で、のどの詰まり、耳や鼻への異物、転倒といった、小さな子どもに典型的な事故が起きています。\n\n食べ物に関するポイントとして、豆は丸飲みしてのどに詰まらせやすい食品であるため、5歳以下の子どもには食べさせないことが示されています。また、たくさん口に含まず落ち着いて食べること、食べ物を含んだまま立ったり走ったりする「ながら食べ」をせず、座ってゆっくり食べることも挙げられています。\n\n豆まきの場面では、床に落ちた豆を子どもが拾って口に入れたり、耳や鼻に入れたりする事故も想定されます。豆まきの後は、床に豆が残っていないか確認すること。そして、お面をかぶると視界が狭まるため、つまずきやすい場所やぶつかりやすい場所を先に確認し、周囲の大人が見守ることが勧められています。恵方巻や餅なども、噛み切りにくくのどに付着しやすい食品であることから、小さく切り分け、よく噛んで食べることが大切だとされています。\n\n季節の行事は、普段と違う食品や道具が家に登場するタイミングでもあります。「行事の前には子どもの事故の型を先回りして確認する」という習慣づけの材料になる配信です。\n\n豆類や小さくて硬い食品をめぐる注意は、節分の時期に限らず、日常の食卓やおやつの場面にも応用が利きます。年に一度の行事の注意喚起を、家庭の食品管理を見直す定期点検の機会として使うことが、この配信の実用的な受け止め方です。", "2026-01-30", "消費者庁", "https://www.caa.go.jp/policies/policy/consumer_safety/child/project_001/mail/20260130"], ["3歳未満の製品事故は5年で47件、約8割が屋内 — 「できた！」が増える時期の落とし穴（NITE）", "NITEの製品安全情報マガジン「PSマガジン」Vol.492（2026年1月13日号）によると、2020〜2024年の5年間に3歳未満の子どもが被害に遭った製品事故は47件で、約8割（38件）が屋内で発生していました。家電の蒸気や熱湯によるやけど、おもちゃでのけがや誤飲が目立ち、おうち時間の増える冬から春に多い傾向があります。発達で「できること」が増える時期ほど、事故に遭う場面も増えることが示されています。", "独立行政法人製品評価技術基盤機構（NITE）の製品安全情報メールマガジン「PSマガジン」Vol.492（2026年1月13日号）は、「3歳未満のこどもの事故」を特集しました。屋内で起こる事故から3歳未満の子どもを守るための注意喚起です。\n\n現状として、2020年から2024年までの5年間にNITEへ通知された製品事故情報では、3歳未満の子どもが被害に遭った事故は47件発生し、そのうち約8割（38件）が屋内で発生しています。目立つのは、「家電の蒸気や熱湯に触れてやけどする事故」と「おもちゃでケガ・誤飲する事故」で、おうち時間が増える冬から春の時期に多い傾向があるとされています。\n\n背景としてマガジンが指摘するのは、発達との関係です。0歳から3歳までの時期は、「指で物をつかむ」「つかまり立ちする」といった運動機能の発達とともに、できることが増えていく時期です。子どもの「できた！」が増えることは喜ばしい一方で、それと同時に、事故に遭うリスクのある場面も増えていきます。届かなかった物に届くようになり、開けられなかった物が開けられるようになる、その変化の速さに大人の側の環境整備が追いつかないことが、事故の一因になります。\n\nマガジンは、日々の見守りに加えて、事故を防ぐポイントをよく確認し、家の中から危険を減らすよう呼びかけています。年末年始の帰省など、外出先の家でも同じ注意を忘れないよう求めている点も実践的です。普段と違う環境では、危険な物の配置も子どもの行動範囲も読みにくくなります。\n\n屋内事故が約8割という数字は、子どもの事故防止の主戦場が「いつもの家の中」であることを示しています。発達の節目ごとに、届く範囲と開けられる範囲を想像し直すことが、このデータの実用的な読み方です。\n\nなお、NITEのPSマガジンでは、その後もVol.497（2026年3月24日号）で乳幼児の誤飲が取り上げられるなど、乳幼児の事故は継続的なテーマになっています。一度読んで終わりではなく、製品安全の情報を定期的に受け取る仕組みを持つことが、家庭の安全点検を続けるうえでの助けになります。", "2026-01-13", "NITE（製品評価技術基盤機構）", "https://www.nite.go.jp/data/000160135.pdf"], ["水の事故は子どもの死因の上位 — 2024年は14歳以下の溺死45人、交通事故を上回る年齢層も（こども家庭庁）", "こども家庭庁の水の事故に関する資料（子どもの安全に関する検討会資料、2026年1月6日）によると、2020〜2024年の5年間で、14歳以下の溺死・溺水は不慮の事故の死因の上位を占め、10〜14歳では最多、5〜9歳では交通事故に次ぐ多さでした。2024年の死亡者は45人で、前年の54人からは減ったものの、毎年発生が続いています。溺れる子どもは声を出さず静かに沈むとされており、「音がしない」こと自体が危険のサインです。", "こども家庭庁は、水の事故防止の特設ページ「水の危険は近くにあります、みんなで危険回避！」で、子どもの溺死・溺水の実態と予防を伝えています。その動向は、同庁の子どもの安全に関する検討会資料（2026年1月6日）でも整理されました。\n\nデータによると、2020年から2024年の5年間で、14歳以下の溺死・溺水は、不慮の事故による死因の上位を占め続けています。年齢別に見ると、10〜14歳では死因の最多であり、5〜9歳でも交通事故に次ぐ多さです。2024年の死亡者は45人で、前年の54人からは減少したものの、毎年数十人規模の発生が続いています。\n\n水の事故の特徴は、発生から結果までの時間が非常に短いことです。溺れる子どもは、映画のように声を上げて暴れるのではなく、声を出せずに静かに沈むとされています。周囲が「うるさくないから大丈夫」と感じている間に事態が進む――「音がしない」こと自体が危険サインだという理解が、予防の出発点になります。\n\n予防策として示されているのは、監視員のいる管理された場所で泳ぐこと、川や海ではライフジャケットを着用させること、大人が目を離さず手の届く範囲で見守ること、そして危険な場所に子どもを近づけないことです。浴槽やプールなど家庭や施設の身近な水辺でも、同じ見守りの原則が当てはまります。\n\n水遊びは子どもにとって大きな楽しみですが、データが示すのは、水の事故が「まれな不運」ではなく、年齢によっては交通事故を上回る死因だという事実です。レジャーの計画に、監視体制とライフジャケットを最初から組み込むことが、実効性のある予防になります。\n\n特設ページの「水の危険は近くにあります」という表現が示すように、水の事故は海や川のレジャーに限りません。家庭の浴槽や、施設のプールなど、日常に近い水辺でも同じ見守りの原則が当てはまります。季節を問わず、「水のそばでは目を離さない・手を届く範囲に置く」という原則を家庭の約束にしておくことが、データの示す最大の予防策です。水辺のレジャーを計画するときに、思い出したいデータです。", "2026-01-06", "こども家庭庁", "https://www.cfa.go.jp/policies/child-safety-actions/cases/dekisui"]], "dev": [["母乳の脂肪酸と乳児の運動発達に関連 — 上海・北京コホート研究（11月6日）", "European Journal of Nutritionに10月31日に掲載された研究で、11月6日に報じられました。上海栄養健康研究所のGao Ying教授らによるものです。北京地域の前向き母子コホートで120組を追跡し、産後42日と8か月に母乳を採取、8か月時点でベイリー発達検査（第3版）により発達を評価しました。母乳中の奇数鎖脂肪酸（C15:0、C17:0）とOBCFA全体が高いほど、乳児の運動発達スコアが低い関連が見られ、調整後も有意でした。", "概要\nEuropean Journal of Nutritionに10月31日に掲載された研究で、11月6日に報じられました。中国科学院・上海栄養健康研究所のGao Ying教授らのチームによるものです。母乳に含まれる特定の脂肪酸と、乳児の初期の神経発達との関係を、集団データで検討した研究です。\n\nOBCFAとは\n対象となったのは、OBCFA（奇数鎖・分岐鎖脂肪酸）と呼ばれる脂肪酸のグループで、C15:0、C17:0、iso-C15:0、anteiso-C15:0などが含まれます。これらは微生物の代謝産物で、主な食事由来の供給源は乳製品や反すう動物の肉、発酵した植物性食品とされ、これまでは乳製品の摂取量を示すバイオマーカーとして扱われてきました。先行研究では、OBCFAが「微生物叢―腸―脳の軸」を介して脳の健康に影響する可能性が示唆されてきましたが、母乳中のOBCFAと乳児の神経発達に関する集団レベルの証拠は限られていました。\n\n方法と結果\n北京地域の前向き母子コホートで120組を追跡し、産後42日と8か月に母乳を採取しました。脂肪酸の組成はガスクロマトグラフィー質量分析（GC-MS）で定量し、8か月時点でベイリー発達検査（第3版）により認知と運動の発達を評価しています。結果として、産後42日と8か月のどちらの時点でも、母乳中の奇数鎖脂肪酸（C15:0、C17:0）とOBCFA全体の水準が高いほど、乳児の運動発達スコアが低い関連が見られ、複数の交絡因子を調整した後も有意でした。この関連は、帝王切開で生まれた子、30歳以下の若い母親の子、妊娠中の体重増加が過剰だった母親の子でより顕著だったとも報告されています。\n\n注意点\n対象集団の母乳中OBCFAの水準は欧米の報告より低く、中国の集団では乳製品以外に発酵した植物性食品が重要な供給源である可能性も示唆されています。研究者らは、腸内微生物叢を介した影響の可能性に触れつつも、これは観察研究であり、より大規模で長期の検証と仕組みの解明が必要だとしています。関連が見られたことは、特定の食品を避けるべきだという結論を直ちに意味するものではありません。", "2026-11-06", "MedicalXpress / Eur. J. Nutrition", "https://medicalxpress.com/news/2026-11-breast-fatty-acids-linked-infant.html"], ["妊娠中のコロナワクチンと子の発達 — 18〜30か月で差なし（JAMA Pediatrics）", "JAMA Pediatricsに11月2日に掲載された多施設コホート研究です。妊娠中または妊娠直前に新型コロナ（SARS-CoV-2）のmRNAワクチンを接種した母親の子どもと、接種していない母親の子ども、400人超を2年半追跡しました。発達はASQ-3という質問票で、意思疎通、粗大運動、微細運動、問題解決、個人・社会スキルの5領域を評価しています。18〜30か月の時点で両群のスコアは同等で、社会・情緒面の育ちにも差は見られませんでした。", "概要\nJAMA Pediatricsに11月2日に掲載された多施設コホート研究です。妊娠中の新型コロナワクチン接種が、生まれてくる子どもの脳の発達に影響するかどうかは、接種を考える妊婦にとって大きな関心事でした。この研究は、その疑問に対して追跡データで答えようとしたものです。研究は、米国の小児保健分野の公的研究資金（NICHD）の助成を受けて行われました。\n\n方法\n対象は、妊娠中または妊娠直前にSARS-CoV-2のmRNAワクチンを接種した母親の子どもと、接種していない母親の子どもで、400人超を2年半追跡しました。発達の評価にはASQ-3という質問票が使われています。ASQ-3は、保護者が子どもの様子に答える形式の発達スクリーニングで、意思疎通、粗大運動、微細運動、問題解決、個人・社会スキルの5領域を評価します。コホート研究とは、条件の異なる集団を時間を追って比べる観察研究の方法で、この研究は複数の施設のデータを使った多施設型です。ASQ-3は、医療機関での検査ではなく保護者の回答をもとにするため、大規模な追跡に向く一方、評価は回答者の観察に基づく点が特徴です。\n\n結果\n18〜30か月の時点で、接種群と非接種群のASQ-3スコアは同等でした。特定の領域だけではなく、ASQ-3全体として同等だったとされています。社会・情緒面のスキルや発達の進み具合についても、両群に差は見られなかったと報告されています。研究者らは、この結果が妊娠中のSARS-CoV-2 mRNAワクチン接種の推奨を支持するものだと述べています。\n\n位置づけ\n不安の大きいテーマについては、印象や短期の観察ではなく、実際に子どもを追跡したデータが積み上がることが判断の土台になります。この研究は、その積み上がりの一件として位置づけられます。なお、評価は18〜30か月時点の質問票によるものであり、それより先の年齢での発達を直接示すものではありません。また、この研究は観察研究であり、接種の有無は参加者の選択に基づくため、無作為化試験とは異なる前提で読む必要があります。", "2026-11-03", "SciMex / JAMA Pediatrics", "https://www.scimex.org/newsfeed/covid-19-vaccination-during-pregnancy-doesnt-appear-to-impact-childs-brain-development"], ["英・2〜2歳半の発達統計 — 「良好な発達」は83.1%に上昇（2025→2026）", "英国政府が公表した、イングランドの2〜2歳半の子どもの発達成果に関する統計解説です（2025〜2026年）。発達は、保健師による健康・発達レビューで、ASQ-3を用いて5領域（意思疎通、粗大運動、微細運動、問題解決、個人・社会スキル）で評価されます。5領域すべてで期待水準以上（良好な発達）に達した割合は83.1%で、前年2024〜2025年の81.4%から上昇しました。ただし任意のデータ収集で全対象をカバーしておらず、解釈には注意が必要だとされています。", "概要\n英国政府（GOV.UK）が公表した、2〜2歳半の子どもの発達成果に関する統計解説です。対象は2025〜2026年のイングランドのデータで、国として子どもの発達の到達度を定期的に把握し、公表している取り組みです。率の変化そのものに加えて、どの領域が伸び、どの領域が伸びていないかという内訳が公表されている点に特徴があります。\n\n評価の仕組み\n発達は、保健師による普遍的な健康・発達レビューで評価されます。これは特定の子だけを対象にするのではなく、原則として全員が受ける仕組みの中での確認です。評価にはASQ-3が用いられ、意思疎通（言葉の理解や表現）、粗大運動（歩く、走るなど大きな動き）、微細運動（つまむ、積むなど手先の動き）、問題解決（遊びの中での試行錯誤など）、個人・社会スキル（身の回りのことや他者との関わり）の5領域を見ます。5領域すべてで期待水準以上に達した場合に「良好な発達」と数えられます。\n\n結果の内訳\n5領域すべてで期待水準以上に達した割合は83.1%で、前年2024〜2025年の81.4%から上昇しました。領域別では問題解決だけが横ばいで、他の領域は上昇しています。過去5年の傾向もすべて上昇だとされています。83.1%という水準は、6人中5人以上が5領域すべてで期待水準に達している計算です。問題解決の横ばいは、他の領域と足並みがそろっていない点として読み取れますが、この統計だけからその理由までは分かりません。\n\n数字の読み方\n注意点として、これは任意のデータ収集であり、全対象をカバーしていないため、解釈には注意が必要だと但し書きがあります。提出されたデータが全体を代表しているとは限らない、という統計上の留保です。その留保を踏まえても、同じ仕組みで継続して測られている数字が前年より上がり、5年の傾向としても上昇が続いていることは、公衆衛生としての到達度のおおまかな方向を示す材料になります。領域別に公表されることで、「全体は上がったが、この領域は足踏み」という読み方ができます。自国の統計をこうして毎年公表し、領域別の偏りまで明らかにする姿勢自体も参考になります。", "2026-11-03", "GOV.UK / OHID", "https://www.gov.uk/government/statistics/child-development-outcomes-data-for-2025-to-2026/child-development-outcomes-at-2-to-2-and-a-half-years-2025-to-2026-statistical-commentary"], ["神経発達障害の子どもへ個別化治療を — UC DavisとUPennが共同研究助成を獲得", "UC Davis Healthとペンシルベニア大学の研究者が、イオンチャネル障害による神経発達障害の子ども向けに、精密（個別化）治療の開発を目指す共同研究を始めます。Hartwell Foundationの共同研究助成（2年間で直接費77万ドル）を獲得しました。担当は、UC Davis神経学助教でMIND研究所のRoy Ben-Shalom氏と、ペンシルベニア大学生体工学・計算機科学助教のPranam Chatterjee氏です。", "概要\nUC Davis Healthとペンシルベニア大学の研究者が、イオンチャネル障害による神経発達障害の子ども向けの精密（個別化）治療の共同研究を始めます。Hartwell Foundationの共同研究助成（2年間で直接費77万ドル）を獲得しました。担当は、UC Davis神経学助教でMIND研究所のRoy Ben-Shalom氏と、ペンシルベニア大学生体工学・計算機科学助教のPranam Chatterjee氏です。\n\nイオンチャネルとは\nイオンチャネルは、脳の細胞にある小さな門のようなタンパク質です。1つ1つが孔（あな）を形作り、1ミリ秒の何分の1かという速さで開閉します。ナトリウムやカリウムなど帯電したイオンの出入りを制御し、その移動がニューロン（神経細胞）の発火信号を生みます。開閉の速さが発火しやすさを決め、脳の回路と働きに影響します。イオンチャネル障害（チャネロパチー）は、遺伝的変化がこの働きに影響して起こります。変異によってチャネルが開きすぎる、閉じるのが遅すぎる、ほとんど開かないといった異常が生じ、ニューロンが過剰に、少なすぎる、または誤ったタイミングで発火して、回路の発達が通常と異なります。その結果、自閉症や小児てんかんのような障害が生じうるとされています。\n\n課題\nBen-Shalom氏は「イオンチャネルの変異を持つ子は一人ひとり、ニューロンの発火パターンが少しずつ違う。治療と結びつけるには変異ごとに実験室での測定が必要だ」と説明します。現状では、各変異を測るのに数か月の記録作業がかかり、知られている数千の変異のうち、調べられたのはごく一部にすぎません。\n\n研究の進め方\n両研究室は、シミュレーションで測定結果を予測して効率化を図ります。Chatterjee研究室は計算手法で、遺伝子変異がチャネルの立体構造や開閉をどう変えるかを予測するモデルを作り、振る舞いを正す分子の設計につなげます。そのうえで、変異ごとに既承認薬の中で合う可能性の高いものを順位づけし、合う薬がない変異には新しい分子を設計します。Ben-Shalom研究室は、同じ変異を持つニューロンの電流の実測と予測を照合します。財団側はこの枠組みを「変異から治療へ（variant-to-therapy）」と表現し、診断名ではなく変異に合った治療を届けることを目指すとしています。", "2026-11-03", "UC Davis Health", "https://health.ucdavis.edu/healthy-aging/news/headlines/research-to-develop-personalized-treatments-for-children-with-neurodevelopmental-disabilities/2026/10"], ["幼児にも運動が必要 — ParticipACTION初の0〜4歳レポートカード（11月2日）", "カナダのParticipACTIONが、0〜4歳対象のレポートカードを初めて公表しました（2026年11月2日報道）。カナダ内外の専門家チームが作り、身体活動、睡眠、画面時間、座りがちな行動、遊び、近隣環境まで14の指標で評価しています。最も良い成績は睡眠と、粗大・微細運動の発達で、どちらも80%の子どもが推奨を満たしました。十分に体を動かしている幼児は67%です。一方、画面時間は年齢群によって半数近くが推奨を満たしておらず、懸念が示されています。", "概要\nParticipACTIONが初めて0〜4歳だけを対象にしたレポートカードを公表しました（2026年11月2日報道）。カナダ内外の専門家チームが作り、身体活動、睡眠、画面時間、座りがちな行動、遊び、近隣環境まで14の指標で評価しています。家庭の習慣、保育の現場、公共空間の設計、政策といった、幼い子どもの暮らし全体を対象にしているのが特徴です。\n\n良い成績と課題\n最も良い成績は睡眠と、粗大・微細運動の発達で、どちらも80%の子どもが推奨を満たしました。十分に体を動かしている幼児は67%です。一方で懸念は画面時間です。年齢群によっては半数近くが推奨を満たしておらず、画面に向かう時間は、探索や物を手で扱うこと、人との関わり、運動、読み聞かせやパズルのような豊かな座り時間の機会を奪うと指摘されています。Mathieu教授は、2歳未満では画面は推奨されず、2〜4歳でも1日1時間以内で、少ないほど良いと述べています。\n\nガイドラインの目安\n判断材料として、カナダの「24時間の動きガイドライン」が具体的な目安を示しています。まだ移動できない赤ちゃんは、起きている間に合計30分以上のうつ伏せ時間を複数回に分けて取ること。1〜2歳はさまざまな強さの身体活動を1日合計180分以上。3〜4歳も同じく180分以上で、そのうち少なくとも60分は元気な遊び（エネルギッシュな活動）を含む、という内容です。Mathieu教授は「幼児の1日をトレーニングプログラムにすることが目的ではない」と述べ、走る、踊る、登る、外で遊ぶといった自由な遊びが、子どもが自分のペースで探索し発見する機会になるとしています。\n\n家庭の外の条件\n報告書は保護者だけでなく、保育施設、自治体、政府の役割にも光を当てています。保育の現場では、活発な遊びを促し、画面使用を制限することが挙げられます。移動についても、ベビーカーやチャイルドシートが必要な場面はある一方、年齢に応じて歩く、小さな自転車やキックボードで公園や保育園へ行くことが活動量を増やすと指摘されています。経済的な差も記録されており、構造化された身体活動への参加は最低所得層31%に対し最高所得層52%、施設や公園、緑地へのアクセスは79%対92%でした。「子どもを動かすことは、誰もが動ける条件を整えることでもある」というのが同教授の結びです。", "2026-11-02", "MedicalXpress / ParticipACTION", "https://medicalxpress.com/news/2026-11-toddlers.html"], ["緑の多い環境は子どもの注意と学力を助ける — ABCD研究の分析（11月2日）", "ワシントン大学セントルイス校の心理学者らがEnvironment Internationalに発表した研究で、11月2日に紹介されました。「注意回復理論」―自然や緑に触れることが集中する力を回復させるという考え―を子どもで検証したものです。使われたのは、中央値10歳の米国人児童約12,000人を追うABCD研究のデータです。緑地に近く、緑地へのアクセスが多い子どもほど、求められたときに注意を向ける課題や学力テストの成績が良い傾向が見られました。", "概要\nワシントン大学セントルイス校の心理学者らがEnvironment Internationalに発表した研究で、11月2日に紹介されました。「注意回復理論」―自然や緑に触れることが、現代の刺激で疲れた集中力（向けられた注意）を回復させるという考え―を子どもで検証したものです。筆頭著者はDeanna Barch教授の研究室の博士研究員Carina Fowler氏です。研究者らが問うたのは、「緑地の近くに住み、緑地へのアクセスが多い子どもは、必要な場面で注意を向けることがうまくでき、学校の成績も良いのか」という点でした。\n\n方法\n使われたのは、中央値10歳の米国人児童約12,000人を追うABCD研究のデータです。ABCD研究は、子どもたちを成長の過程で追い、注意や知能などの実測評価を繰り返し行う大規模な観察研究です。この研究では、緑地の測り方にも工夫があり、居住する地区の樹冠（木の覆い）の割合と公園の割合の平均を緑地の指標としました。そのうえで、所得水準、ADHDの診断、安全性の感覚、SNSの利用など、注意に影響しうる要因を統計的に取り除いて分析しています。\n\n結果\n緑地への近さが大きいほど、注意のパフォーマンスの客観的な評価が良いという結果でした。どんな草地でもよいわけではなく、樹冠や公園に近いことが鍵だと研究者らは述べています。仕組みについては、緑地の空気の良さとの関連は見られた一方、身体活動との関連は見られなかったとしています。注意回復理論の説明では、緑は注意をやわらかく引きつけながら心をさまよわせる余地も与えるため、集中力が回復すると考えられています。なお、緑地でも安全だと感じられなければ効果は弱く、緑地でSNSを使っている場合も回復効果は弱まると指摘されています。\n\n背景\n学校の庭や公園、自然の中の散歩のあとに、注意の持続、抑制、ワーキングメモリの課題成績が上がることは以前から報告されており、読書や計算の成績が緑の多い環境で高いことも知られていました。今回の研究は、それを裏づける大規模データです。静かな暗い部屋で休む方法では人は落ち着かないという先行研究にも触れられており、「何もない」ではなく「少しだけ心を占めるものがある」状態を自然が提供できる、というのが研究者らの見立てです。", "2026-11-02", "Washington Univ. in St. Louis", "https://source.washu.edu/2026/11/to-restore-attention-reach-out-to-nature/"], ["親子の遊びや読み聞かせの最中、幼児の脳はどう応答するか — EEGで捉えた研究（ノースウェスタン大学）", "ノースウェスタン大学の研究チームが2026年10月28日に発表した研究です。24〜44か月の幼児49人とその養育者がEEGキャップを着け、読み聞かせやパズルなどの関わり合いの遊びと、映画を一緒に見る場面とで脳活動を比べました。関わり合いの場面では、注意や学習、社会的な処理に関わる脳活動の高まりが一貫して見られたと報告されています。日常の遊びの時間を、脳科学の側面から捉えた研究です。", "ノースウェスタン大学の研究チームは2026年10月28日、幼児と養育者の脳活動を、自然な遊びの最中に測定した研究を発表しました。論文は学術誌 Brain and Language に掲載されています。子どもに優しい脳波計（EEG）を用いて、親子の自然な関わりの場面で幼児の脳がどう応答するかを捉えた、初めての試みだとされています。\n\n研究に参加したのは、24か月から44か月の幼児49人とその養育者です。言語能力には幅があり、自閉症のある子どもも含まれています。親子は伸縮性のある布製のEEGキャップを着け、インタラクティブな本の読み聞かせや、一緒にパズルを解くといった、家庭でもおなじみの活動を行いました。研究チームは、その場面の脳活動を、親子で一緒に映画を見ている場面と比較しました。\n\n結果として、親子が関わり合う遊びの場面では、映画視聴の場面と比べて、幼児の脳活動に一貫した違いが見られました。注意や学習、社会的な処理に関連づけられるパターンとして、アルファ波の活動の低下とシータ波の活動の上昇が報告されています。研究を率いたManning氏は、関わり合いの場面で幼児がこの脳活動のパターンを一貫して示したと述べています。\n\nこの研究の意義は、「一緒に遊ぶ」「読み聞かせる」といった日常の関わりが、子どもの注意や学びと関わる脳の働きと結びついている可能性を、実際の活動場面の測定で示した点にあります。実験室の課題ではなく、読み聞かせやパズルという自然な遊びの中で測定したことが、家庭の日常と地続きの知見になっています。\n\n家庭での受け止め方としては、特別な教材や訓練を持ち出す話ではありません。絵本を一緒に読み、パズルや積み木で一緒に遊ぶ、そうした応答のやりとりのある時間そのものに意味がある、という読み方ができます。研究はあくまで脳活動の関連を示したものであり、個々の子どもの発達を評価するものではありませんが、日々の関わりの価値を裏づける材料の一つです。\n\n49組という規模は脳計測を伴う研究としては限られたものですが、実験室の課題ではなく家庭に近い活動場面を測定した点に、この研究の新規性があります。", "2026-10-28", "ノースウェスタン大学", "https://www.einpresswire.com/article/952948910/study-tracks-brain-activity-of-toddlers-and-parents-during-story-and-play-time"], ["乳児期の言語ネットワークのつながりが2歳時点の発話を予測（UCLA発表）", "UCLAデイヴィッド・ゲフェン医学部の公式発表（2026年10月20日）です。乳児期に脳の言語ネットワークの結びつきを調べることで、2歳時点で話し始める様子を予測できる可能性が示されました。ことばの発達は個人差が大きい分野ですが、その最初期のサインを脳の側から捉えようとする研究です。発達の個人差を早い段階で理解し、必要な支援につなげる研究の流れの一つとして位置づけられています。", "UCLAデイヴィッド・ゲフェン医学部は2026年10月20日、「ことばの発達の最初期のサインを見ることはできるか」と題した研究の公式発表を行いました。テーマは、乳児期の脳における言語ネットワークのつながり（結合性）と、その後の発話の発達との関係です。\n\n発表によると、乳児の言語ネットワークの結合性を調べることで、2歳時点で話し始める様子を予測できる可能性が示されました。ことばの出始めは子どもによって時期もペースも大きく異なり、「うちの子は遅いのではないか」という不安は、多くの家庭にとって身近なものです。その個人差の一部が、ことばを話し始める前の時期の脳のつながり方と関係している可能性を、この研究は検討しています。\n\n言語発達の研究では、発話が始まってからでないと評価が難しい、という課題がありました。話し始める前の乳児期に、将来の発話と関係するサインを捉えられれば、発達の個人差をより早く理解し、見守りや支援のあり方を考える手がかりになります。この研究は、そうした「最初期のサイン」を探る流れの中にあります。\n\n注意しておきたいのは、発表が示しているのはあくまで「予測できる可能性」であり、個々の子どもの将来を断定するものではないという点です。具体的な数値や手法の詳細については、公式発表の本文で確認する必要があります。\n\n家庭での受け止め方としては、ことばの発達を見守る視点の一つとして、この研究の存在を知っておくことが挙げられます。発達の遅れが心配な場合の相談先は、地域の健診や専門機関であり、脳の研究はその代替ではありません。研究の蓄積が、将来の早期支援の選択肢を広げる可能性として受け止めるのが、発表の範囲に沿った読み方です。\n\n言語発達の個人差は大きく、同じ月齢でも発話の始まりには幅があります。行動として表れる前の段階で、脳のネットワークという水準から発達を捉えようとする研究は、個人差がどこから生まれるのかを理解する手がかりとして注目されます。今回の発表は、その方向の研究が着実に進んでいることを示すものと言えます。", "2026-10-20", "UCLA", "https://medschool.ucla.edu/articles/can-we-see-the-earliest-signs-of-language-development"], ["幼児は「耳に入ってくる言葉」からも学ぶ — 周囲の会話でよく聞く単語を認識（SRCD発表）", "米国の児童発達研究学会（SRCD）が2026年9月23日に発表した研究です。18・24・30か月の幼児79人を調べたところ、24か月と30か月の子どもは、周囲の会話で頻繁に耳にする単語をよく認識していました。直接話しかけられる言葉だけでなく、家庭で大人が交わす会話も含めた言語環境全体が、子どもの語彙の発達に関わる可能性を示す結果です。語りかけの量だけでは測れない、言語環境の広がりを捉えた研究です。", "米国の児童発達研究学会（Society for Research in Child Development、SRCD）は2026年9月23日、幼児の言語発達に関する研究のプレスリリースを発表しました。学術誌 Child Development に関連する研究として紹介されたもので、タイトルは「幼児の言語発達のダイナミックな側面を示す新研究」です。\n\n研究が注目したのは、子どもが「耳にする」言葉です。子どもへの語りかけだけでなく、大人同士の会話など、周囲で交わされる言葉を子どもがどの程度聞いているかという頻度（overheardness）が、語彙の理解と関係するかを調べました。対象は18か月、24か月、30か月の幼児、計79人です。\n\n結果として、24か月と30か月の幼児は、耳にする頻度が高い単語をよく認識していたと報告されています。つまり、直接話しかけられた言葉だけでなく、生活の中で繰り返し耳にする言葉が、語彙の育ちに関わっている可能性が示されたのです。月齢によって違いが見られる点も、発達の段階を考える材料になります。\n\nこの知見は、言語環境を「語りかけの量」だけで測らない視点を提示しています。家庭で大人が交わす日常の会話、きょうだいや祖父母とのやりとりなど、子どもを取り巻く言葉の環境全体が、語彙発達の土壌になりうるということです。\n\n家庭での受け止め方としては、大人同士の会話も含めて、ことばの豊かな環境を意識することの後押しになる研究です。もちろん、聞かせることを目的に会話を演出する必要はありません。普段の暮らしの中の言葉のやりとりそのものが、子どもの学びの環境の一部だという見方が、発表から読み取れます。\n\n語彙の発達は、絵本の読み聞かせや直接の語りかけだけでなく、こうした「環境として聞く言葉」からも形づくられる可能性が示された形です。発達の捉え方が、より生活全体に広がるものへと更新されつつあることを感じさせる研究です。日々の何気ない会話の積み重ねが、子どもの言葉の土台の一部になっている可能性があります。", "2026-09-23", "SRCD（米児童発達研究学会）", "https://www.srcd.org/news/new-study-shows-dynamic-side-language-development-toddlers"], ["読み聞かせは「始める早さ」より「続ける長さ」— 足立区の小学1年生2,609人の調査（東京科学大学）", "東京科学大学が2026年9月2日に発表した研究です。足立区の小学1年生2,609人を対象に、読み聞かせを長く続けることの方が、開始時期の早さよりも重要である可能性が示されました。論文は Pediatric Research に2026年8月25日に掲載されています。エコチル調査による東北大学の研究と合わせると、読み聞かせは「頻度と継続」が鍵という、一貫したメッセージが見えてきます。", "東京科学大学は2026年9月2日、絵本の読み聞かせと子どもの発達に関する研究成果を発表しました。対象は東京都足立区の小学1年生2,609人で、読み聞かせの経験と子どもの発達・学習との関連を分析したものです。論文は Pediatric Research に2026年8月25日に掲載されました。\n\nこの研究が注目したのは、読み聞かせの「始め方」ではなく「続け方」です。分析では、読み聞かせをいつ始めたかという開始時期の早さよりも、どのくらいの期間続けてきたかという継続期間の方が、子どもの発達と関連する可能性が示されました。早くから始める家庭が多い読み聞かせですが、「早く始められなかった」と感じる家庭にとって、続けること自体に意味があることを示す結果です。\n\n同じテーマでは、東北大学がエコチル調査の母子36,866組を解析し、読み聞かせの頻度が高い家庭ほど3歳時点の発達スクリーニングのスコアが良好な傾向を報告しています（2026年1月発表）。対象年齢も方法も異なる二つの研究が、読み聞かせの「頻度と継続」という同じ方向を向いている点は、読み聞かせをめぐる知見の一貫性として注目できます。\n\n家庭での受け止め方としては、量や開始時期を他人と比べるより、無理なく続けられる形を作ることが現実的です。短い本でも、寝る前の一冊でも、習慣として続くことが、この研究のメッセージに沿った実践になります。\n\nなお、こうした研究は集団としての傾向を示すものであり、個々の子どもの発達を読み聞かせの有無だけで説明するものではありません。日々の読み聞かせを、結果を急ぐものではなく、親子の時間として続けていく材料として受け止めるのがよいでしょう。\n\n開始時期をめぐっては、「読み聞かせは早ければ早いほどよい」という受け止めが広がりがちですが、本研究はその前提を相対化しました。早く始められなかったことを悔やむのではなく、今から続けることに意味がある。この結果は、忙しい家庭でも取り入れやすい、短時間の読み聞かせを長く続ける形の後押しにもなります。", "2026-09-02", "東京科学大学", "https://www.isct.ac.jp/ja/news/s45mhijnswdi"], ["子どもの発達と腸内細菌の関係を探る — 未就学児36人の解析で見えた関連の候補（三重大学）", "三重大学を中心とする研究チームが2026年7月21日に発表した研究です。日本の未就学児36人を対象に、便に含まれる腸内細菌の構成と、年齢・身長・体重などの成長指標、保護者が回答した行動評価（注意、睡眠、情緒、攻撃性など）との関連を解析しました。年齢や体格に伴う腸内細菌の変化に加え、行動特性と関連する腸内細菌や代謝機能の候補が見出され、腸内細菌とこころの発達を結ぶ新しい研究の手がかりになるとしています。", "三重大学教育学部、三重大学ゼブラフィッシュ研究センター、三重大学大学院医学系研究科を中心とする研究チームは、日本の未就学児を対象に、腸内細菌と子どもの成長・行動特性との関連を調べた研究を発表しました（2026年7月21日）。論文は Scientific Reports に掲載されています。\n\n研究に参加したのは国内の未就学児36人で、平均月齢は48.0か月、男児20人、女児16人でした。保護者が自宅で採取した便について、16S rRNA遺伝子解析という手法で腸内細菌の種類を調べ、その構成や予測される代謝機能と、子どもの年齢、身長、体重との関連を検討しました。あわせて、保護者回答式の行動評価尺度であるChild Behavior Checklist for Ages 1½–5（CBCL 1½–5）のスコアとの関連も解析しています。\n\n結果として、子どもの年齢や体格に伴って腸内細菌の構成が変化することに加え、注意、睡眠、情緒、社会的引きこもり、身体的訴え、攻撃性といった行動特性と関連する腸内細菌や代謝機能の「候補」が見出されました。研究チームは、この成果が腸内細菌とこころの発達に関する新しい研究の手がかりになると位置づけています。\n\nここで大切なのは、今回示されたのは「関連の候補」であり、特定の腸内細菌が子どもの行動を決めるといった因果関係が証明されたわけではない点です。対象も36人と小規模で、今後の大規模な検証につなげる段階の研究です。\n\n家庭での受け止め方としては、「腸活」といった流行の文脈で即座に生活を変える根拠にするのではなく、腸と脳・行動の関係を探る研究が、日本の未就学児を対象に進み始めたという進展として受け止めるのが、発表の範囲に沿った読み方です。\n\n腸内細菌の研究はこれまで、免疫や代謝との関係を中心に進んできました。本研究のように、就学前の子どもの行動特性との関連を、日本の子どもを対象に具体的に調べた例は、発達研究と腸内環境研究をつなぐ試みとして位置づけられます。今後、より大きな集団で同じ関連が確かめられるかが焦点になります。", "2026-07-21", "三重大学", "https://www.kyodo.co.jp/pr/2026-07-21_4023732/"], ["経済的に「苦しい」家庭が41%に増加、保護者の77.6%が時間的ゆとりのなさを実感（国立成育医療研究センター）", "国立成育医療研究センターが2026年6月2日に公表した、JAY思春期コホートの2025年調査結果です。家計が「苦しい」と感じる家庭は41%で、2023・2024年の34%から増加しました。保護者の77.6%は時間的なゆとりのなさを感じていました。子どもの発達そのものではなく、子どもが育つ家庭の経済的・時間的環境の変化を示す公的データとして、子育てを支える条件を考える基礎資料になります。", "国立成育医療研究センターは2026年6月2日、JAY思春期コホートの2025年調査の結果をプレスリリースとして公表しました。JAY思春期コホートは、思春期の子どもとその家庭を追跡する調査で、子どもの健康や発達を、家庭環境とあわせて捉えようとする取組です。\n\n今回の調査で目立ったのは、家庭の「ゆとり」の変化です。家計の状況について「苦しい」と感じる家庭は41%に上り、2023年・2024年の調査における34%から増加しました。また、保護者の77.6%が、時間的なゆとりのなさを感じていると回答しています。お金と時間、その両方のゆとりが痩せている様子が、数字の上でも浮かび上がりました。\n\n子どもの発達は、子ども自身の特性だけで決まるものではなく、家庭の経済状況や、保護者が子どもと向き合う時間といった環境の影響を受けます。保護者の負担感が増すことは、巡り巡って子どもの生活リズムや情緒の安定にも関わりうる条件です。この調査は、そうした「育つ環境」の側の変化を、継続的なデータで示している点に意義があります。\n\n家庭での受け止め方としては、個々の家庭の努力だけで解決する話ではない、という前提を確認することが大切です。時間のゆとりのなさは多くの保護者に共通する実感であり、支援制度や地域の資源につながることは、子どもを支える環境づくりの一部になります。\n\nこの種のコホート調査の結果は、子育て支援の政策や、学校・地域の取組を考える基礎資料としても使われます。一家庭の実感としてだけでなく、社会全体で子どもの育つ環境をどう支えるかという議論の土台として、継続的に公表される数字に注目する価値があります。\n\n「苦しい」が41%、「時間的なゆとりがない」が77.6%という数字は、いずれも保護者の実感を尋ねた結果です。客観的な所得水準とは別に、負担感そのものが積み重なっている現状は、子どもへの関わりの質を考えるうえでも無視できない条件です。調査が毎年の変化を追える形で続けられていること自体が、支援の効果を測る土台にもなります。", "2026-06-02", "国立成育医療研究センター", "https://www.ncchd.go.jp/press/2026/0602.html"], ["帝王切開と子どもの発達、全体として差は認められず — エコチル調査53,716組の解析（富山大学）", "富山大学などの研究グループが2026年5月11日に発表した、エコチル調査53,716組の母子を対象とした研究です。帝王切開で生まれた子どもと経腟分娩で生まれた子どもとの間で、全体として3歳時点の発達の遅れに大きな違いは見られませんでした。一方で、性別ごとの解析では、帝王切開で生まれた男児の粗大運動、女児の微細運動において、発達の遅れが疑われる割合がやや高いことも明らかになりました。", "富山県立大学看護学部の三善郁代准教授と、富山大学エコチル調査富山ユニットセンターの稲寺秀邦名誉教授らの研究グループは、「子どもの健康と環境に関する全国調査（エコチル調査）」のデータを用いて、分娩方法と子どもの発達との関連を調べました。発表は2026年5月11日、論文は Scientific Reports に2026年4月14日に掲載されています。\n\n対象は53,716組の母子です。帝王切開で生まれた子どもと経腟分娩で生まれた子どもを比較し、3歳時点での発達の遅れとの関連を検討しました。5万人を超える規模の出生コホートだからこそ、全体像と細部の両方に目を配れる分析になっています。\n\n結果の中心は、「全体として大きな違いは見られなかった」という点です。分娩方法の違いが、3歳時点の発達の遅れの割合に全体として大きな差を生んではいませんでした。その一方で、性別ごとに分けた解析では、帝王切開で生まれた男児では粗大運動（体の大きな動き）、女児では微細運動（手先の細かな動き）において、発達の遅れが疑われる割合がやや高いことが示されました。\n\nこの結果の読み方では、「全体の差はない」ことと、「一部の領域でやや高い傾向がある」ことを、両方とも正確に受け取る必要があります。傾向は「やや高い」という水準であり、分娩方法によって子どもの発達が決まるという話ではありません。なお、エコチル調査は環境省の予算で行われていますが、論文の見解は著者自身のもので、環境省の見解ではないことが明記されています。\n\n帝王切開は、母子の安全のために必要な医療として行われるものです。出産を控えた家庭や、帝王切開で出産した家庭にとって、この研究は「分娩方法への不安を過度に大きくしない」材料として受け止めることができます。\n\n5万組を超える規模の解析は、性別と分娩方法の組み合わせのような細かな切り分けを行っても、統計的に意味のある比較ができる点に強みがあります。今回見られた性別ごとの傾向については、今後の研究で再現されるかどうかが検証の焦点になります。", "2026-05-11", "富山大学", "https://www.u-toyama.ac.jp/news-press/133721/"], ["母乳で育った子どもは「睡眠不足が少ない傾向」— エコチル調査8万人超の解析（富山大学）", "富山大学の研究グループが2026年4月22日に発表した、エコチル調査の約8万人を分析した研究です。生後6か月までに母乳を与えられていた子どもは、人工乳のみで育った子どもと比べて、1歳時に睡眠不足となる子が少ない傾向にあることが明らかになりました。乳児期の栄養方法が、睡眠リズムの形成に関与している可能性を示した、大規模出生コホートならではの結果です。論文は欧州の栄養学専門誌に掲載されました。", "富山大学医学薬学教育学部の中川結理らのグループは、「子どもの健康と環境に関する全国調査（エコチル調査）」のデータを用いて、乳児期の栄養方法と1歳時の睡眠時間との関連を検討しました。発表は2026年4月22日、研究成果は European Journal of Clinical Nutrition に2026年3月31日にオンライン掲載されています。\n\n分析の対象は約8万人という大規模なものです。結果として、生後6か月までに母乳を与えられていた子どもは、人工乳のみで育った子どもと比べて、1歳時に睡眠不足となる子が少ない「傾向」にあることが明らかになりました。研究チームは、8万人規模の出生コホートで検証したことで、乳児期の栄養方法が睡眠リズムの形成に関与している可能性を示した点に意義があるとしています。\n\n1歳前後の睡眠は、保護者にとって関心の高いテーマです。夜泣きや寝つきの悪さに悩む家庭は多く、「何が睡眠に影響するのか」は繰り返し議論されてきました。栄養方法という、比較的早い時期の要因と1歳時の睡眠との関連が大規模データで示されたことは、睡眠研究の材料として注目されます。\n\n受け止め方で注意したいのは、この研究が示したのが統計的な「傾向」であり、母乳で育てなければ睡眠不足になる、あるいは人工乳が睡眠の妨げになる、といった因果の断定ではないという点です。授乳の形は家庭の事情や母親の体調によってさまざまであり、この結果だけで授乳方法を評価する材料にはなりません。\n\nエコチル調査は環境省の予算による全国調査で、論文の見解は著者自身のものであることが明記されています。睡眠リズムの形成には多くの要因が関わると考えられており、この研究はその全体像の一端を示したものとして読むのが適切です。\n\n1歳時の睡眠という、保護者の関心が特に高いテーマを、出生後早期の栄養方法と結びつけて大規模に検証した点が、この研究の特徴です。今後、睡眠の長さだけでなく、夜間覚醒や生活リズムといった睡眠の質の面で、どのような関連が示されるかも注目されます。", "2026-04-22", "富山大学", "https://www.u-toyama.ac.jp/news-press/132999/"], ["出産直後のカンガルーケアは、産後1年の母親の情緒的絆と関連する（富山大学・エコチル調査）", "富山大学の研究グループが2026年4月6日に発表した、エコチル調査81,634組の母子を対象とした研究です。出産直後に赤ちゃんと触れ合うカンガルーケアを経験した母親は、経験のなかった母親と比べて、産後1年時点で子どもへの情緒的絆（ボンディング）が良好な母親が多いことが分かりました。出産直後に衣服を着用して抱っこした場合でも、その関連は維持されていた点も示されています。", "富山大学学術研究部医学系母性看護学講座の齊藤佳余子助教らの研究グループは、「子どもの健康と環境に関する全国調査（エコチル調査）」のデータを用いて、出産直後のカンガルーケアと産後1年の母親のボンディング（子どもへの情緒的絆）との関連を調査しました。発表は2026年4月6日、論文は英国の周産期学術誌 BMC Pregnancy and Childbirth に2026年3月9日に掲載されています。\n\nカンガルーケアは、出産直後に母親が赤ちゃんを抱いて触れ合うケアのことです。対象となったのは81,634組の母子で、出生コホートとしては非常に大きな規模の分析です。\n\n結果として、出産直後に子どもと触れ合う経験をした母親は、触れ合う機会のなかった母親と比較して、産後1年でのボンディングが良好である母親が多いことが明らかになりました。興味深いのは、出産直後に衣服を着用して抱っこした場合でも、その関連性が維持されていた点です。「肌と肌の直接の触れ合い」でなければ意味がない、という単純な話ではないことが示唆されます。\n\nボンディングは、子どもの発達を支える親子の関係の土台の一つです。出産直後の短い時間の経験が、1年後の母親の気持ちと関連していたという結果は、出産前後のケアのあり方を考える材料になります。\n\n一方で、出産の状況によっては直後の触れ合いが難しいこともあります。この研究は関連を示したものであり、カンガルーケアができなかった場合に絆が育たないという話ではありません。衣服の上からの抱っこでも関連が保たれていたという結果は、形にこだわりすぎない受け止め方を支えるものです。\n\n81,634組という規模は、ボンディングのような主観的な指標を扱う分析でも、結果に統計的な安定性を持たせられる大きさです。出産直後の経験と産後1年という、時間の離れた二つの時点をつないで見られるのは、出生コホート研究ならではの強みだと言えます。出産する施設でどのようなケアが行われているかを事前に知っておくことも、家庭にとっての準備の一つになります。", "2026-04-06", "富山大学", "https://www.u-toyama.ac.jp/news-press/132117/"], ["低年齢層のインターネット利用率75.2% — 2歳で63.5%、5歳で79.6%（こども家庭庁調査）", "こども家庭庁の「令和7年度 青少年のインターネット利用環境実態調査」の低年齢層結果（結果資料は2026年3月27日付）です。低年齢層の保護者1,907人を対象とした調査で、子どものインターネット利用率は全体で75.2%、年齢別では2歳63.5%、5歳79.6%、8歳91.3%と、年齢とともに大きく上昇していました。スクリーンタイムや家庭のメディア利用ルールを考える際の、最新の公的な基準データです。", "こども家庭庁は、「令和7年度 青少年のインターネット利用環境実態調査」の結果を公表しています。そのうち低年齢層についての結果資料（2026年3月27日付）は、就学前後の子どものインターネット利用の実態を示すものとして注目されます。調査の対象は、低年齢層の子どもの保護者1,907人です。\n\n結果によると、低年齢層全体での子どものインターネット利用率は75.2%でした。年齢別に見ると、2歳で63.5%、5歳で79.6%、8歳で91.3%と、年齢が上がるにつれて大きく上昇しています。2歳の時点で6割を超えているという数字は、動画視聴などを中心に、未就学の早い段階からインターネットが子どもの生活に入り込んでいる実態を示しています。\n\nこの調査は、利用の是非を判定するものではなく、実態を把握するための公的な統計です。子どもの発達とメディア利用をめぐってはさまざまな議論がありますが、議論の出発点として「実際にどれだけの子どもが、どの年齢から使っているのか」という基準データがあること自体に意味があります。\n\n家庭での受け止め方としては、この数字を不安の材料にするのではなく、ルールづくりの出発点として使うことが勧められます。どの年齢で、どんな内容を、どのくらいの時間使うのかは家庭ごとに違いますが、同年代の利用実態を知ることで、自宅のルールを相対的に考えることができます。\n\n行政の調査は毎年度公表されており、推移を追うことで、低年齢化のペースも見えてきます。子どものメディア環境を考えるときは、印象や個別の報道ではなく、こうした一次統計に立ち返ることが、落ち着いた判断につながります。\n\n利用率の上昇は、スマートフォンやタブレットが家庭の日常的な道具になったことと切り離せません。家庭のルールづくりでは、使わせるか禁止するかの二択ではなく、年齢に応じて使い方を一緒に考える姿勢が現実的です。その話し合いの土台として、同年代の利用実態という一次統計を手元に置いておくことが役立ちます。次年度以降の結果との比較も、家庭のルールを見直す際の材料になります。", "2026-03-27", "こども家庭庁", "https://www.cfa.go.jp/policies/youth-kankyou/internet_research/results-etc"], ["「子ども睡眠健診」中間報告 — 全国225校・延べ約20,000人をウェアラブルで実測（東京大学）", "東京大学医学部が2026年3月18日に公表した「子ども睡眠健診」の中間報告です。2025年末時点で、全国225校、延べ約20,000人の子どもを対象に、ウェアラブル機器（ACCEL）で実際の睡眠を測定してきました。自己申告ではなく実測に基づく子どもの睡眠の把握は、国内でも大規模な取組です。子どもの睡眠時間や質の実態を客観データで捉えることで、発達や健康を支える環境づくりの基礎となります。", "東京大学医学部は2026年3月18日、「子ども睡眠健診」の中間報告を公表しました。子ども睡眠健診は、学齢期の子どもの睡眠を大規模に測定する取組で、2025年末時点で全国225校、延べ約20,000人の子どもが対象になってきました。\n\nこの取組の特徴は、睡眠を自己申告や保護者の印象ではなく、ウェアラブル機器（ACCEL）による実測で捉えている点です。睡眠は「何時間寝たつもりか」と実際の睡眠が食い違うことも多い領域であり、客観的なデータで子どもの睡眠の実態を把握することは、研究としても施策としても基礎になります。\n\n子どもの睡眠は、発達や学習、日中の活動に深く関わるテーマです。にもかかわらず、日本の子どもの睡眠の実態を、全国規模・実測ベースで捉えたデータは限られてきました。225校・延べ約2万人という規模の測定が積み重なっていること自体が、この中間報告の持つ意味です。\n\n今回公表されたのは中間報告であり、測定の蓄積は続いています。実態が明らかになることで、就寝時刻や起床時刻、学校生活との関係など、子どもの睡眠をめぐる議論が、印象論からデータに基づく検討へ進むことが期待されます。\n\n家庭での受け止め方としては、まず睡眠が「測って把握するもの」だという視点を持つことです。わが子の睡眠が十分かどうかは、朝の目覚めや日中の様子など、日常の観察と合わせて考える材料になります。大規模な実測研究の蓄積は、そうした家庭の見守りを支える社会的な基盤にもなります。\n\nウェアラブル機器による実測は、機器の装着や協力校の確保など、実施のハードルが高い方法です。全国225校という協力体制のもとで測定が積み重ねられていること自体が、今後の子ども睡眠研究の基盤になります。\n\n睡眠は、発達や学習、日中の情緒と関わる基本的な生活要素です。実測データの蓄積は、就寝・起床の目安づくりなど、学校や家庭へ知見を還元していくための土台にもなります。中間報告に続く今後の公表で、年齢ごとの睡眠の実態がどこまで具体的に示されるかが注目点です。", "2026-03-18", "東京大学", "https://www.m.u-tokyo.ac.jp/news/PR/2026/release_20260318.pdf"], ["第1子と第2子で発達に違いはあるのか — 乳児期から観察された出生順位の差（富山大学）", "富山大学の研究グループが2026年3月9日に発表した、エコチル調査のきょうだい2,117組を比較した研究です。生後6か月の時点で、第2子は第1子と比べて発達指標（ASQ-3）の得点が低い傾向が見られ、きょうだい間の差は生後1年以内から観察されることが分かりました。第2子では保護者の関わり得点も低い傾向がありました。家庭ごとの差異を統制する統計手法により、出生順位に関連する発達差が示されています。", "富山大学学術研究部医学系公衆衛生学講座の土田暁子助教らの研究グループは、「子どもの健康と環境に関する全国調査（エコチル調査）」のデータを用いて、出生順位と乳児期の発達との関連を調べました。発表は2026年3月9日、論文は JAMA Network Open に2026年3月6日に掲載されています。\n\n研究の設計で特徴的なのは、同じ母親から生まれた第1子と第2子のきょうだい2,117組を対象に、生後6か月および12か月時点の発達状況を比較した点です。きょうだい同士の比較は、家庭環境や遺伝的背景といった家庭ごとの差異を統計的に統制しやすく、出生順位そのものに関連する差を見つけやすい方法です。\n\n結果として、生後6か月の時点で、第2子は第1子と比べて発達指標（ASQ-3）の得点が低い傾向が見られ、こうしたきょうだい間の差は生後1年以内という早い時期から観察されることが明らかになりました。また、第2子では保護者の関わり得点も低い傾向が見られたと報告されています。上のお子さんの育児と並行する中では、下の子への一対一の関わりが相対的に少なくなりがちであることが、背景として考えられます。\n\n受け止め方としては、「第2子は発達が遅れる」という単純な話ではない点が重要です。示されたのは集団としての傾向であり、個々の子どもの発達には大きな個人差があります。むしろこの研究は、下の子にも意識的に関わる時間を持つことの意味を、データの側から照らしたものと読むことができます。\n\nきょうだい育児の忙しさの中で関わり得点が下がるのは、多くの家庭にとって自然なことです。この研究を、保護者を責める材料ではなく、地域の支援や家族内の分担を考えるきっかけとして受け止めるのが、発表に沿った読み方でしょう。\n\n生後6か月という早い時期に差が見えたことは、きょうだい間の関わり方の違いが、乳児期のごく初期から少しずつ積み重なっている可能性を示します。第1子のときと比べて何がどう違うのかを、家庭ごとに静かに振り返る材料として、この研究は読むことができます。", "2026-03-09", "富山大学", "https://www.u-toyama.ac.jp/news-press/130461/"], ["母親の更年期症状を放置すると、思春期の子の孤独感・不安等と関連（国立成育医療研究センター）", "国立成育医療研究センターが2026年1月22日に公表した研究です。母子1,541組の解析で、治療されていない母親の更年期症状、特に心理的な症状が、思春期の子どもの孤独感・不安・抑うつやインターネット依存と関連していました。論文は Menopause 誌に2026年1月20日に掲載されています。親自身の健康を守ることが、子どもの育つ環境を守ることにもつながるという視点を示す研究です。", "国立成育医療研究センターは2026年1月22日、母親の更年期症状と子どものメンタルヘルスとの関連を調べた研究を公表しました。論文は Menopause 誌に2026年1月20日に掲載されています。\n\n研究では、母子1,541組のデータが解析されました。その結果、治療されていない母親の更年期症状、とりわけ心理的な症状が、思春期の子どもの孤独感、不安、抑うつ、そしてインターネット依存と関連していることが示されました。更年期は母親自身の心身の不調として捉えられがちですが、その影響が同居する思春期の子どもの心の状態とも関連しうる、という視点が提示されています。\n\n子どもの発達やメンタルヘルスを考えるとき、目線は子ども本人に向かいがちです。しかし子どもは家庭という環境の中で育っており、保護者の健康状態は、その環境を形づくる大きな要素です。この研究は、「親の健康」という経路から子どもの発達環境を見る、研究の広がりを示しています。\n\n重要なのは、この研究が示したのは「関連」であり、母親を責める材料ではないという点です。むしろ読み取るべきは、更年期症状を「年齢のものだから」と放置せず、治療や相談につながることが、母親自身のためだけでなく、子育て支援にもなるというメッセージです。センターが公表資料の中で示すのも、まさにそうした支援の視点です。\n\n家庭での受け止め方としては、保護者自身の不調を後回しにしないことが挙げられます。婦人科などへの受診や相談は、子どものための環境づくりの一部でもあります。親のケアと子のケアを対立するものではなく、つながったものとして捉えることが、この研究から得られる実践的な視点です。\n\n思春期は、子ども自身の心も揺れ動きやすい時期です。親の不調と子の不調が重なりうる時期だからこそ、母親一人の健康問題としてではなく、家族全体の健康として捉え直す視点が、この公表からは読み取れます。親が相談や治療につながることを「家族のための行動」として位置づけ直すことが、社会的な受け止め方としても大切です。", "2026-01-22", "国立成育医療研究センター", "https://www.ncchd.go.jp/press/2026/0122.html"], ["読み聞かせの頻度が高いほど3歳の発達指標が良好 — エコチル調査36,866組の解析（東北大学）", "東北大学が2026年1月9日に発表した、環境省エコチル調査の母子36,866組を解析した研究です。絵本の読み聞かせの頻度が高い家庭ほど、3歳時点の発達スクリーニング（ASQ-3）のスコアが、5つの領域すべてで良好な傾向が示されました。論文は Pediatric Research に2026年1月8日に掲載されています。読み聞かせを日常の習慣として続けることの意義を、大規模データで示した研究です。", "東北大学は2026年1月9日、絵本の読み聞かせと子どもの発達との関連を調べた研究を発表しました。使用されたのは、環境省の「子どもの健康と環境に関する全国調査（エコチル調査）」のデータで、解析対象は母子36,866組に上ります。論文は Pediatric Research に2026年1月8日に掲載されました。\n\n研究では、読み聞かせの頻度と、3歳時点の発達スクリーニング（ASQ-3）のスコアとの関連が解析されました。ASQ-3は、子どもの発達を複数の領域から評価するスクリーニング指標です。結果として、読み聞かせの頻度が高い家庭ほど、3歳時点のASQ-3のスコアが5領域すべてで良好な傾向が示されました。一部の領域だけではなく、発達の幅広い領域にわたって傾向が見られた点が、この研究の特徴です。\n\n読み聞かせについては、東京科学大学が小学1年生を対象に「始める早さより続ける長さ」の重要性を示す研究も発表しています（2026年9月）。頻度と継続という二つのキーワードは、大規模調査に共通して浮かび上がる読み聞かせの姿だと言えます。\n\n家庭での受け止め方としては、読み聞かせを「毎日長くやらなければ」という義務にしないことが大切です。この研究が示すのは集団の傾向であり、回数を競う材料ではありません。短い絵本を一緒に開く時間を、日常の中に無理なく組み込むことが、結果として「頻度と継続」につながります。\n\n3万6千組を超える規模のデータで示された傾向は、読み聞かせという身近な営みに、確かな裏づけの一つを与えたものとして受け止めることができます。\n\nASQ-3の5領域すべてで良好な傾向が見られたことは、読み聞かせが特定の能力だけに効くというより、絵本を介した会話、本を指さすやりとり、子どもの反応への応答といった、読み聞かせに伴う親子の相互作用そのものが、発達の環境として広く関わっている可能性を示唆します。読む行為の周辺にあるやりとりまで含めて、読み聞かせの時間は成り立っています。日々の読み聞かせを続けるうえでの、確かな後押しになる研究です。", "2026-01-09", "東北大学", "https://www.tohoku.ac.jp/japanese/2026/01/press20260109-04-Storybook.html"]]};
let memos=[]; // {cat,title,note,date}
const OLD_CUT="2026-11-07";
function isOld(d){return d<OLD_CUT}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
/* ===== 項目（ジャンル）はデータ駆動：CATS／DATAに足すだけで自動で増えます ===== */
const extraCats=[];
function allCats(){
  const list=CATS.slice();
  Object.keys(DATA).forEach(id=>{ if(!list.some(c=>c.id===id)) list.push({id:id,name:id,desc:"追加された項目",img:"hero"}); });
  extraCats.forEach(c=>{ if(!list.some(x=>x.id===c.id)) list.push(c); });
  return list;
}
let cats=allCats();
let catIdx=0;
const artIdxMap={};
function itemsOf(c){return (DATA[c.id]||[]).map((a,i)=>({a:a,oi:i})).sort((x,y)=>y.a[3].localeCompare(x.a[3]))}
function curCat(){return cats[catIdx]}
function curItems(){return itemsOf(curCat())}
function curArtIdx(){const n=curItems().length;if(!n)return 0;let i=artIdxMap[curCat().id]||0;if(i>=n)i=n-1;if(i<0)i=0;return i}
function renderStage(dir){
  cats=allCats(); if(catIdx>=cats.length)catIdx=cats.length-1; if(catIdx<0)catIdx=0;
  const c=curCat(), items=curItems(), ai=curArtIdx();
  const total=cats.reduce((s,x)=>s+(DATA[x.id]||[]).length,0);
  document.getElementById('heroText').innerHTML="<b>今日のまとめ — 全"+cats.length+"ジャンル・"+total+"件。</b> タイトルと概要は日本語、カードの「和訳全文を読む」で全文が開きます。新しい順に並べ、48時間より古い記事はグレー表示です。";
  document.getElementById('catName').textContent=c.name;
  document.getElementById('catDesc').textContent=c.desc||"";
  document.getElementById('catCount').textContent="ジャンル "+(catIdx+1)+" / "+cats.length;
  document.getElementById('catDots').innerHTML=cats.map((x,i)=>'<button class="dot'+(i===catIdx?' active':'')+'" data-cat="'+i+'" aria-label="'+x.name+'へ移動"></button>').join('');
  document.querySelectorAll('#catDots .dot').forEach(d=>{d.onclick=()=>{const n=+d.dataset.cat; if(n!==catIdx){const dd=n>catIdx?'down':'up'; catIdx=n; renderStage(dd);}}});
      const slot=document.getElementById('cardSlot');
  if(!items.length){
    slot.innerHTML='<article class="card"><div class="empty"><div class="big">✦</div><p><b>'+c.name+'</b> は追加されたばかりの項目で、まだ記事がありません。</p><p>毎日の更新でこの項目の記事が集まると、ここに表示されます。<br>上スワイプで他のジャンルへ移動できます。</p></div></article>';
    document.getElementById('artDots').innerHTML=""; document.getElementById('artCount').textContent="0 / 0"; return;
  }
  const it=items[ai], a=it.a, old=isOld(a[3]);
  slot.innerHTML='<article class="card'+(old?' old':'')+(dir?' anim-'+dir:'')+'">'
    +'<img class="ph" src="'+IMGS[c.img]+'" alt="'+c.name+'のイメージイラスト">'
    +'<div class="cbody"><div class="meta"><span class="badge'+(old?' oldb':'')+'">'+(old?'少し前':'NEW')+'</span><span>'+a[3]+'</span><span>'+(ai+1)+' / '+items.length+'</span></div>'
    +'<h3>'+a[0]+'</h3><p class="sum">'+a[1]+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="openArticle(\''+c.id+'\','+it.oi+')">和訳全文を読む</button>'
    +'<button class="btn ghost" onclick="quickMemo(\''+c.id+'\','+it.oi+',this)">メモ保存</button>'
    +'<button class="btn ghost" onclick="shareArticle(\''+c.id+'\','+it.oi+')">共有</button></div>'
    +'<div class="src">出典：'+a[4]+'<br><a href="'+a[5]+'" target="_blank" rel="noopener">原文を開く</a></div></div></article>';
  document.getElementById('artDots').innerHTML=items.map((x,i)=>'<span class="dot'+(i===ai?' active':'')+'"></span>').join('');
  document.getElementById('artCount').textContent="記事 "+(ai+1)+" / "+items.length;
  requestAnimationFrame(fitCard);
}

function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;
  const sum=card.querySelector('.sum'), h3=card.querySelector('h3'), ph=card.querySelector('.ph');
  let ss=14, hs=Math.min(21, Math.max(17, window.innerWidth*0.044)), phh=ph?Math.round(ph.getBoundingClientRect().height):0; const ph0=phh;
  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }
    if(hs>13){ hs-=0.5; if(h3) h3.style.fontSize=hs+'px'; continue; }
    break;
  }
}
window.addEventListener('resize', fitCard);
function nextArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i>=n-1)return;artIdxMap[curCat().id]=i+1;renderStage('next')}
function prevArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i<=0)return;artIdxMap[curCat().id]=i-1;renderStage('prev')}
function nextCat(){if(catIdx>=cats.length-1)return;catIdx++;renderStage('down')}
function prevCat(){if(catIdx<=0)return;catIdx--;renderStage('up')}
/* ===== スワイプ操作（スクロールではなくスワイプで移動） ===== */
const stage=document.getElementById('stage');
let sx=null, sy=null, swipedAt=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;
  swipedAt=Date.now();
  if(Math.abs(dx)>Math.abs(dy)){ dx<0?nextArt():prevArt(); } else { dy<0?nextCat():prevCat(); }
});
stage.addEventListener('click',e=>{ if(Date.now()-swipedAt<120){e.stopPropagation();e.preventDefault();} },true);
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')nextArt(); else if(e.key==='ArrowLeft')prevArt();
  else if(e.key==='ArrowDown'){e.preventDefault();nextCat();} else if(e.key==='ArrowUp'){e.preventDefault();prevCat();}
});
/* ===== 項目の追加 ===== */
document.getElementById('addCatBtn').onclick=()=>{document.getElementById('newCatName').value="";document.getElementById('newCatDesc').value="";document.getElementById('addDlg').showModal()};
document.getElementById('addCatSave').onclick=()=>{
  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast("項目名を入力してください");return}
  const desc=document.getElementById('newCatDesc').value.trim()||"追加された項目";
  const id='custom-'+Date.now();
  extraCats.push({id:id,name:name,desc:desc,img:'hero'}); DATA[id]=[];
  cats=allCats(); catIdx=cats.length-1;
  document.getElementById('addDlg').close(); renderStage('down');
  toast("項目「"+name+"」を追加しました");
};
/* ===== 記事ダイアログ・メモ・共有 ===== */
function openArticle(cat,idx){
const c=allCats().find(x=>x.id==cat); const a=DATA[cat][idx];
document.getElementById('dlgIn').innerHTML=`<img src="${IMGS[c.img]}" alt=""><div class="meta" style="margin-top:10px"><span>${c.name}</span><span>${a[3]}</span></div><h3>${a[0]}</h3><p class="sum" style="font-size:14px">${a[1]}</p><div class="full">${a[2]}</div>
<p class="src" style="margin-top:12px">出典：${a[4]} — <a href="${a[5]}" target="_blank" rel="noopener">${a[5]}</a></p>
<div class="memoBox"><label style="font-weight:800;font-size:14px">ひとことメモ</label><textarea id="memoText" placeholder="気づいたこと、作りたいもの、家族への共有メモなど"></textarea>
<div class="actions"><button class="btn primary" onclick="saveMemo('${cat}',${idx})">このメモを保存</button><button class="btn ghost" onclick="shareArticle('${cat}',${idx})">iPhoneで共有</button><button class="btn ghost" onclick="document.getElementById('dlg').close()">閉じる</button></div></div>`;
document.getElementById('dlg').showModal();
}
function quickMemo(cat,idx,btn){const a=DATA[cat][idx];memos.unshift({cat,title:a[0],note:"",date:a[3]});updateMemoUI();btn.textContent="保存しました";btn.classList.add('saved');toast("メモに保存しました（このページを開いている間）")}
function saveMemo(cat,idx){const a=DATA[cat][idx];const note=document.getElementById('memoText').value.trim();memos.unshift({cat,title:a[0],note,date:a[3]});updateMemoUI();toast("メモを保存しました");document.getElementById('dlg').close()}
function updateMemoUI(){document.getElementById('memoCount').textContent=memos.length;const area=document.getElementById('memoList');
if(!memos.length){area.innerHTML='<p class="sum">まだメモがありません。記事の「メモ保存」をタップしてください。</p>';return}
area.innerHTML=memos.map(m=>`<div class="memoItem"><b style="font-size:14px">${m.title}</b><div style="font-size:13px;color:var(--muted)">${m.note||"（ひとことメモなし）"} ・ ${m.date}</div></div>`).join('')}
function exportMemos(){if(!memos.length){toast("まだメモがありません");return}const txt="MAI topic メモ — 2026-11-09\n\n"+memos.map((m,i)=>`${i+1}. ${m.title}\n${m.note||""}\n`).join("\n");const b=new Blob([txt],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="mai-topic-memo-2026-11-09.txt";a.click();URL.revokeObjectURL(u)}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}} try{await navigator.clipboard.writeText(text);toast("コピーしました — メモアプリなどに貼り付けできます")}catch(e){toast("共有できませんでした")}}
function shareArticle(cat,idx){const a=DATA[cat][idx];shareText(a[0],`${a[0]}\n\n${a[1]}\n\n出典：${a[4]} ${a[5]}`)}
function shareMemos(){if(!memos.length){toast("まだメモがありません");return}shareText("MAI topic メモ",memos.map(m=>`・${m.title} ${m.note}`).join("\n"))}
document.getElementById('sharePage').onclick=()=>shareText("MAI topic","MAI topic — 2026年11月9日朝版（全"+cats.length+"ジャンル）");
document.getElementById('memoBtn').onclick=()=>{updateMemoUI();document.getElementById('memoDlg').showModal()};

renderStage();
