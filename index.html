。TIMEの「Best Inventions of 2026」にも選ばれた。\n【背景】試作や小ロット生産では、金属部品を外注すると納期がかかり、設計の反復が遅くなる。机の上でチタンまで削れるCNCがあれば、試作の回転を速められる。C500はTIMEの「Best Inventions of 2026」に選ばれ、Formnext 2026で注目を集めた。\n【詳細】C500は剛性の高いフレームに800Wのスピンドルを載せ、最大1万8000回転で、材料除去率は最大で毎分80立方センチメートルとされる。加工範囲は240×210mmで、3軸構成に4軸モジュールを追加できる。段取りでは0.1mmの分解能を持つレーザー距離センサーでワーク表面を測り、RFIDタグ付きの工具ホルダーを使った5本の自動工具交換で工具を切り替える。最小量潤滑（MQL）で熱と切りくずの排出を管理する。NestStudioは設計から部品までを3段階で進め、AIが最適な工具経路を生成し、工具と切削条件を提案する。無線で機械とつながり、内蔵タッチ画面でも操作できる。標準のGコードにも対応し、他社のCAD/CAMとも組み合わせられる。本体は約550×590×744mm、重さ約120kgだ。\n【ポイント・注意点】加工範囲は試作や小ロット向きで、量産や大型部品には向かない。120kgの重さと大きさから、設置場所の確保が必要だ。AIが決める工具経路や切削条件も、最終的には人が確認する運用が安心だ。購入前には出荷状況と価格、対応材料を公式の発表で確認するとよい。机の上で金属を削れるCNCとして、試作の回転を速めたい現場からの関心は高そうだ。出荷の状況や価格は、購入前に公式の発表で確認するとよい。","2026-11-18","Techswire","https://techswire.com/desktop-cnc-titanium-nestworks-c500/"],["アマダ、AIとロボで板金工場全体を自律化する施設を開設","アマダが創業80周年の節目に、板金工場全体の自律化を提案する特別エリア「MIRAI factory」を開設した。AIが生産スケジュールや加工プログラムの作成を支援し、搬送や検査の自動化と製造DXで工程全体をつなぐ。完全無人化ではなく、AIとロボットが定型作業を担い、人が創造的な仕事に集中する「人とマシンの共創・協調工場」が狙いだ。板金工場の未来像を示した発表だ。","\n【概要】アマダは創業80周年の節目に、主力の提案施設「アマダ・グローバルイノベーションセンター（AGIC）」を刷新し、板金工場全体の自律化を提案する特別エリア「MIRAI factory」を開設した。2026年11月13日から公開している。AIが生産スケジュールや加工プログラムの作成を支援し、搬送や検査の自動化と製造DXで工程全体をつなぐ。定型作業をAIとロボットが担い、人が創造的な仕事に集中する「人とマシンの共創・協調工場」を目指す。\n【背景】多品種少量生産の板金工場では、加工機単体の自動化が進んでも、生産計画や段取り、搬送、検査、原価管理が人に残り、全体最適にならないことが多い。アマダは機械という「モノ」の提供にとどまらず、製造DXや運用支援という「コト」を組み合わせた価値づくりへ踏み出した。\n【詳細】「MIRAI factory」はMulti-process、Interlinked、Robotics、Artificial Intelligenceの頭文字を取った名前で、板金加工の各工程で、属人化しやすい生産スケジュールの立案や加工プログラムの作成にAIが最適な支援を行う。現場のデータをAIで活用し、生産効率の可視化やコスト分析から工場分析、コンサルティング提案へつなげる。従来は人手に頼っていた搬送や検査をはじめとする各工程の自動化も進め、製造DXで工場全体をつなぐ。施設内では一連の製造プロセスをツアー形式で案内する。あわせて、ファイバーレーザマシンやパンチ・レーザ複合マシン、溶接システム、切削機、プレスシステムなど多数の最新マシンを初披露した。\n【ポイント・注意点】完全無人化ではなく、人と機械の協調を掲げる点が特徴だ。展示デモの機能だけでなく、既存設備との接続やマスター整備、例外処理、保全体制を確認する必要がある。導入の効果は、設備稼働率だけでなく、納期や仕掛品、原価といった経営指標と現場データをつないで測ることが大切だ。公開は2026年11月13日からで、見学はアマダの施設で行われる。アマダは創業80周年を機に、機械の提供だけでなく製造DXや運用支援を組み合わせた価値づくりを進めている。施設の見学はツアー形式で行われ、板金加工の全工程を体感できる。","2026-11-17","PR TIMES（アマダ）","https://prtimes.jp/main/html/rd/p/000000159.000140940.html"],["小さな加工工場のAI活用、まず「面倒な仕事」から","加工業界のポッドキャスト「Today's Machining World」が、小さな製造業のAI活用を語る回を公開した。出演したデイモン・ピストゥルカ氏は、AIは工場を丸ごと動かすものではなく、面倒で属人化した仕事から1つずつ任せるものだと説く。在庫の数え方や日報づくり、見積もりメールの下書きなど、身近な作業での使い方を具体的に紹介している。身近な一歩を示している。","\n【概要】加工業界のポッドキャスト「Today's Machining World」が2026年11月17日、小さな製造業のAI活用を語る回を公開した。出演したデイモン・ピストゥルカ氏は、AIは工場を丸ごと動かすものではなく、面倒で属人化した仕事から1つずつ任せるものだと説く。在庫の数え方や日報づくり、見積もりメールの下書きなど、身近な作業での具体的な使い方を紹介している。\n【背景】AIの話題は多いが、小さな加工工場では何から手を付ければよいか分かりにくい。ピストゥルカ氏は2010年から小さな製造業の成長と売却を支援してきた機械技術者で、いまは在庫管理やダッシュボードづくりなど、現場の面倒な仕事にAIを使う方法を伝えている。\n【詳細】番組の要点は「痛いところから始める」ことだ。毎日新しいAIアプリが出てくるが、まず面倒で時間がかかり、1人しか知らない仕事にAIを入れる。在庫の循環棚卸では、AIに在庫システムをつないで、動きの多い部品や調整の多い部品を挙げさせる。新しいソフトを買うときはAPIがあることを確かめ、AIがERPから報告書を引いて表計算にまとめ、毎週月曜に自動で回す流れを作る。メールの下書きでは、過去の良い文面をAIに学ばせてから作らせると、質が上がるという。ピストゥルカ氏自身も、AIに自分の仕事を取材させて知識ベースを作り、Outlookとつないだメール作成支援を1日20回から30回使っている。コードが書けない状態から1年で、AIが1日4時間から6時間プログラムを書くようになったという。ただし10万ドルのチタン鋳物の加工にAIの判断をそのまま使うことはせず、人の確認を挟む。\n【ポイント・注意点】AIの幻覚（ハルシネーション）は今もあり、正確さが求められる場面ではコードや人の確認を組み合わせる必要がある。番組の助言は「AIが工場を動かすのではなく、人がAIを使って工場を動かす」という姿勢だ。小さな工場がAIを始めるときは、派手な導入より、面倒な仕事を1つ選び、効果を測って次へ進む進め方が現実的だ。番組はポッドキャストと動画で公開されており、通勤時間などに聞くこともできる。AIの導入を考える小さな工場にとって、等身大の事例として参考になる内容だ。","2026-11-17","Today's Machining World","https://todaysmachiningworld.com/ai-wont-run-your-shop-you-will-with-damon-pistulka-ep-278/"]],"cricut":[["名前入り靴下オーナメント、カードストックで手軽に","カードストックで作るクリスマスの靴下型オーナメントの無料SVGが公開された。CricutのExplore Air 2を使い、名前や年号を入れて自分だけの飾りにできる。雪の結晶やハート、「Merry Christmas」の文字などのパーツがそろい、色や柄紙を変えるだけで雰囲気ががらりと変わる。動画ではDesign Spaceでの文字入れやHTVの貼り方、組み立ての手順も紹介されている。端切れのカードストックで作れる手軽さも魅力だ。","\n【概要】カードストックで作るクリスマスの靴下型オーナメントの無料SVGが公開された。Cricutで切り出し、名前や年号を入れて贈り物やツリー飾りにできる手軽なクラフトだ。\n【背景】カードストックのオーナメントは短時間で量産でき、端切れの活用にも向いている。作者は毎年子どもたちへ名前入りのオーナメントを作っており、今年は靴下型のデザインを無料配布することにした。サイトのファイルは個人利用と商用利用のどちらも可能とされている。\n【詳細】SVGには靴下の層、雪の結晶、ハート、「Merry Christmas」の文字が含まれている。Design Spaceに読み込んでグループ解除すれば、色や柄紙を自由に変えられる。動画チュートリアルでは、ハートに穴を開けるスライス機能の使い方、名前や年号の入れ方、HTVをカードストックに貼る手順、フォームテープで立体感を出す組み立てまで紹介されている。「Merry Christmas」の文字にはKringle Avenueというフォントが使われ、作例の名前にはTessaにMicky Dicky、KatlynにLucky Girls Club、SpencerにCandies Honeymoonが使われている。材料はCricut（作者はExplore Air 2を使用）、ライトグリップマット、ブライヤー、80ポンドのカードストック、HTV、イージープレスミニ、接着剤、ひもなど。無料ファイルはサイトのフリーライブラリでデザイン番号293として配布されている。\n【ポイント・注意点】端切れのカードストックで作れるため材料費を抑えられる。作例は赤やピンクなど5色で、雪の結晶やハート、チェック柄のかかとやつま先などで表情が変わる。名前や年号を入れると贈り物やギフトタグにもなる。HTVを貼るときは温度と時間に注意し、薄いカードストックは焦がさないよう様子を見ながら作業するとよい。ダウンロードには無料の会員登録が必要だ。ハートの2026年タグを付けると記念の品にもなる。動画では年号入りのハートの作り方も紹介されている。","2026-11-20","Main Road Digital Creations","https://mainroaddigitalcreations.com/free-christmas-stocking-svg/"],["フェスティブ・チアの無料SVG、細線が映える冬の装飾に","クリスマスの「Festive Cheer」文字をあしらった無料SVGが公開された。すっきりした細い線のデザインで、ギフトタグやマグカップ、Tシャツ、木製オーナメントなど幅広い用途に使える。Cricut JoyやMaker、Exploreの各機種に対応し、HTVでカットする際は反転を忘れないことがポイントだ。個人利用向けの無料配布で、登録なしでダウンロードできる。","\n【概要】クリスマスの「Festive Cheer」をあしらった無料SVGが公開された。細い線のすっきりしたデザインで、ギフトタグやマグカップ、Tシャツ、オーナメントなど幅広い用途に使える。\n【背景】クラフトブログのCrafty Crafterが無料SVGライブラリに追加した季節のデザインで、ミニマルで上品な雰囲気が特徴だ。細線のカットには慣れた手つきが求められるため、中級者向けのファイルと位置づけられている。個人利用向けに無料で配布されている。\n【詳細】使い道として、厚手のカードストックとひもを使ったギフトタグ、白いHTVを黒いTシャツに貼った季節の服、光沢のある永久ビニールで作るマグカップ、ステンシルビニールを使った木製オーナメント、フロックHTVのクッションカバー、防水の永久ビニールによるワイングラスのデカールなどが紹介されている。材料面では、アクリル製のオーナメント土台やグリッターHTV、転写テープ、重ね貼り用の道具が挙げられ、服に使う場合はアイロン用ビニールや耐熱テープ、ミニヒートプレス、綿のブランクが役立つ。Cricut Design Spaceへの読み込みは、ダウンロードしたフォルダを解凍し、アップロード画面からSVGを選ぶだけ。HTVでカットする際はミラー（反転）を忘れないこと。Silhouette Studioにも対応している。Cricut Joy、Maker、Exploreの各機種で使える。\n【ポイント・注意点】細線が多いため、きれいにカットするには良質な素材と鋭いブレード、マットの粘着力が大切だ。SVGはベクター形式のため拡大縮小しても劣化しない。アップロードできないときは解凍し直すとよい。ファイルを販売したり再配布したりはできない。作った作品はギフト用として楽しむのが前提だ。ダウンロードは登録不要で、サイトから直接入手できる。関連デザインとしてサンタのレトロラベルも紹介され、コーヒー柄のSVGコレクションとの組み合わせも提案されている。細線のデザインはTシャツやマグカップ、ギフトタグなど、素材を変えるだけで印象が変わる。","2026-11-20","Crafty Crafter","https://crafty-crafter.club/christmas/festive-cheer-svg-for-cricut/amp/"],["サンタ夫妻のドライブ、立体ペーパークラフトの無料SVG","サンタとミセス・クロースが車に乗った姿を立体的に作る無料SVGが公開された。カラフルなカードストックを重ねて約6インチ四方の飾りに仕上げる。Cricut Makerで切り、スコア線を付けて折り、組み立てる手順を動画付きで解説。完成品 引き出し式のフィルム装填でロールの交換もしやすい。本体サイズは820×460×435mm、重さ48kg、消費電力250Wで、有線ネットワーク接続に対応する。注文管理ツール「PrintHub」と印刷ソフト「OMTech Print」と連携し、顧客からのデザイン受け取りから印刷までを一つの流れで扱える。\n【ポイント・注意点】エッセンシャルパッケージにはプリンター本体と6本250mLのスターターインク、Aフィルム1ロール、Bフィルム3ロール、フィルムサポートが含まれる。追加インク付きのパッケージは3,344ドル、iPhone 16 Pro用ブランクケース10個付きの最上位パッケージは3,369ドルだ。製品ページでは出荷まで15日以内と案内されており、ブラックフライデー価格は期間限定。60日間の価格保証も付く。購入前には対応素材とフィルムの在庫、設置スペースを確認しておきたい。","2026-11-23","Sci-Tech News Network","https://www.scitechnewsnetwork.com/article/956998758-omtech-introduces-the-krysta-desktop-uv-dtf-printer-for-small-business-custom-production"],["ミマキ欧州、UVフラットベッド3機種など新製品群を発表","ミマキヨーロッパがUVフラットベッドプリンター3機種を含む新製品群を発表した。大型のJFX220-2515と小型のUJF200シリーズで、蛍光インクや自動化機能を備える。RIPソフトの最新版RasterLink8も同時に投入し、印刷現場の効率化と自動化を進める。DTFプリンターTxF330-800もラインアップに加わった。9月の発表を経て、欧州市場での展開が本格化する。","\n【概要】ミマキヨーロッパがUVフラットベッドプリンター3機種を含む新製品群を発表した。大型のJFX220-2515と小型のUJF200シリーズ（UJF200-3042、UJF200-6042）で、蛍光インクへの対応と自動化機能が特徴だ。RIPソフトの最新版RasterLink8も同時に投入し、印刷現場の効率化を図る。DTFプリンターの新機種TxF330-800もラインアップに加わった。\n【背景】サインや販促物、工業製品の装飾では、短納期化と人手不足への対応が課題になっている。ミマキは9月に発表したこれらの機種で、段取りの手間を減らす自動化と、蛍光色による表現の幅広げを両立させる狙いだ。欧州の標準的なボードサイズに合わせた印刷エリアの拡大も、現場の使い勝手を意識した変更といえる。\n【詳細】JFX220-2515は印刷エリア2500×1500mmで、4ヘッド構成によるデュアルCMYK印刷により最大42平方メートル毎時の生産速度をうたう。メディアを置いた場所だけ真空吸着するアンカーテクノロジーで準備時間を短縮し、自動位置決めピンも備える。蛍光インクEFS-150に対応し、最大101.6mm厚のメディアに印刷できる。UJF200シリーズは高精細なプリントヘッドで細かい文字やグラデーションを再現し、蛍光ピンクと蛍光イエローのインクに対応。最大250mmの高さ、20kgまでの対象物に直接印刷できる。オプションのカメラでメディア位置を自動検出して画像を合わせ、UJF200-6042にはベルト搬送ユニットも用意される。RasterLink8はジョブ管理と自動カメラアライメントを強化し、RasterLink7対応の全機種で使える。\n【ポイント・注意点】JFX220-2515はLD4モードでプリントヘッドから最大20mm離れた位置への印刷に対応し、2.5Dテクスチャーメーカーでエンボスや点字表現も可能だ。TxF330-800は自動メンテナンスと16カートリッジのインクシステムを備え、スカイブルーとペールピンクの新色で色域を広げた。導入時は蛍光インクの用途と自動化オプションの費用対効果を、自社の受注内容と照らして検討したい。","2026-11-20","Sign Africa","https://www.signafrica.com/mimaki-europe-announces-latest-additions-to-portfolio/"],["LONGER、卓上UV機ePrintを軸に製作ラインアップを拡充","LONGERがレーザー彫刻、3Dプリンター、UVプリンターを組み合わせた卓上製作機器のラインアップ拡充を発表した。中心となる卓上UVプリンター「ePrint」は、2基のエプソンF1080プリントヘッドと12色のインクチャンネルで、最大15mmの立体レリーフ印刷に対応。AIソフト「LongerStudio AI」と組み合わせ、個人や小規模事業者のものづくりを支援する。価格面ではブラックフライデーで最大48%引きも案内されている。","\n【概要】LONGERがレーザー彫刻、3Dプリンター、UVプリンターを組み合わせた卓上製作機器のラインアップ拡充を発表した。中心となる卓上UVプリンター「ePrint」は、2基のエプソンF1080プリントヘッドと12のインクチャンネルを備え、最大15mmの立体レリーフ印刷に対応する。AIソフト「LongerStudio AI」と組み合わせ、個人や小規模事業者のものづくりを支援する。\n【背景】パーソナライズ商品や小ロット生産の需要が高まる中、作り手や小規模事業者は1台の機械だけでは対応しきれない場面が増えている。LONGERは3Dプリンターで形を作り、レーザーで切り出し、UVプリンターでフルカラーの装飾を加えるという、複数技術の組み合わせを1つの作業場で完結させる方向を打ち出した。\n【詳細】ePrintはデュアルヘッド構成で、ホワイト、カラー、バーニッシュのインクを使い分ける。メーカーによれば、シングルヘッドのePrint SEと比べて2D印刷で最大2倍、3Dテクスチャ印刷で最大6倍の速度をうたう。最大15mmの立体レリーフに対応し、高低差最大10mmの表面にも印刷できる。対応素材は300種類以上で、サードパーティ製インクも使えるオープンインクシステムを採用。印刷台は標準310×420mmで、ミニ台310×75mmも選べる。LongerStudio AIは背景除去やレイアウト、色調整、テキストからのロゴ生成、レイヤー処理などを備え、金銀や蛍光、蓄光、刺しゅう風、バーニッシュなどの特殊効果にも対応する。\n【ポイント・注意点】ブラックフライデーでは最大48%引きのセールを12月2日まで実施し、ePrintシングルUVはクーポン適用で1,766.07ドル、デュアルUVは2,299.08ドル、UV+DTモデルは2,483.08ドルと案内されている。セール価格はクーポン適用後の金額で、条件は製品ごとに異なる。速度や色再現の数値はメーカー発表のもので、実際の仕上がりは素材や設定で変わる。購入前には対応素材と維持費、ソフトの対応範囲を確認しておきたい。","2026-11-18","The Manila Times","https://beta.manilatimes.net/2026/11/18/tmt-newswire/globenewswire/longer-brings-laser-engraving-3d-printing-and-advanced-uv-printing-together-in-its-expanded-desktop-creative-manufacturing-lineup/2472920/amp"],["2,500ドル未満の卓上UV機、LONGER ePrintの実力を検証","LONGERの卓上UVプリンター「ePrint」について、価格の安さだけでなく維持費や安全性、ソフトの実力まで踏み込んだ検証記事が公開された。デュアルヘッドで最大15mmの立体レリーフ印刷をうたう一方、UVインクの扱いには換気や手袋などの安全対策が欠かせないと指摘。AIソフトによる作業の簡略化への期待と、実用面での課題を冷静に整理している。価格の安さの裏にある維持費や安全面の現実も、導入前に知っておきたい内容だ。","\n【概要】LONGERの卓上UVプリンター「ePrint」について、価格の安さだけでなく維持費や安全性、ソフトの実力まで踏み込んだ検証記事が公開された。デュアルヘッドで最大15mmの立体レリーフ印刷をうたう一方、UVインクの扱いには換気や手袋などの安全対策が欠かせないと指摘する。AIソフトへの期待と実用面の課題を冷静に整理した内容だ。\n【背景】これまでUVフラットベッド機はローランドDGやミマキといった産業用メーカーが中心で、価格は1万5,000ドルから4万ドル超が相場だった。ePrintはブラックフライデー価格でシングルヘッド1,766.07ドル、デュアルヘッド2,299.08ドルと、個人や小規模事業者でも手が届く価格帯に設定されている。記事はこの価格破壊の意味と、その裏にある現実を検証している。\n【詳細】デュアルヘッド機は2基のエプソンF1080プリントヘッドと12のインクチャンネルを備え、メーカーによれば2D印刷で最大2倍、3Dテクスチャ印刷で最大6倍の速度をうたう。最大15mmの立体レリーフに対応し、高低差最大10mmの表面にも印刷できる。300種類以上の素材に対応し、サードパーティ製インクも使える。記事は一方で、UVインクが化学感作性物質であり、印刷と硬化の過程で揮発性有機化合物を出す点を指摘する。家庭や小規模な作業場で使う場合は屋外へ排気する換気設備と、ニトリル手袋やUVカット眼鏡などの保護具が必要だとしている。ホワイトインクは沈殿を防ぐための攪拌と、毎日の洗浄やキャッピングなどの保守も欠かせない。\n【ポイント・注意点】ソフト面では「LongerStudio AI」が背景除去やレイヤー処理、テキストからのロゴ生成をうたい、2D画像から立体レリーフ用の高さ情報を作ることを目指す。記事はこの自動処理が複雑な図形の細部で苦労する可能性を指摘し、高精度な仕上がりには専用ソフトが必要になる場合もあるとしている。安価なサードパーティ製インクはプリントヘッドの劣化や密着不良、硬化不足を招く恐れもある。価格だけでなく、維持費と安全対策を含めた総コストで判断したい。","2026-11-18","BriefGlance","http://BriefGlance.com/articles/the-micro-factory-reality-check-can-longers-sub-2500-uv-printer-deliver-industrial-3d-relief"],["新興Inkera、卓上フルカラーUV 3Dプリンター「C1」を発表","フルカラー3Dプリントの新興企業Inkeraが、初の製品となる卓上フルカラーUV 3Dプリンター「C1」をFormnext 2026で初公開した。8つのマテリアルチャンネルで1,000万色以上を再現し、造形エリアは200×150×120mm。2027年第1四半期の市販開始を予定しており、価格や予約の詳細は今後発表される。新興企業の初製品として、実機の色再現や造形精度が今後の注目点になる。","\n【概要】フルカラー3Dプリントの新興企業Inkeraが、初の製品となる卓上フルカラーUV 3Dプリンター「C1」をFormnext 2026で初公開した。8つのマテリアルチャンネルで1,000万色以上を再現し、造形エリアは200×150×120mm。2027年第1四半期の市販開始を予定しており、価格や予約の詳細は今後発表される。\n【背景】フルカラーのジェッティング造形はこれまで高価で大型、操作も複雑な業務用機が中心で、個人の作業場には届きにくかった。InkeraはプリントヘッドやUV硬化、インクの流動特性、動作、スライシング、サポート材を一体で設計し直すことで、色と形状を全高で一致させる小型機を目指したという。\n【詳細】C1はCMYK、ホワイト、透明、サポート材、スポットカラーの8チャンネルで、1,000万色以上の色を造形物そのものに作り込む。不透明な表面やガラス調の表現、光沢、細部の再現に対応し、水溶性サポート材が顔や文字、細かい縁などの繊細な部分を守る。水溶性サポート材は造形後に水で溶かして除去でき、細部の仕上がりを損なわずに後処理できる点も利点だ。8番目のスポットカラーチャンネルは、プロセスカラーの混合では出しにくい色合いを安定して再現するための専用チャンネルだ。パーソナライズしたフィギュアやキャラクターモデル、創作ギフト、教室での教材、製品コンセプト、小ロットの試作などが想定用途として挙げられている。Formnext 2026ではホール12.1のブースB11で展示された。\n【ポイント・注意点】市販開始は2027年第1四半期の予定で、価格と予約の詳細は未発表だ。同分野ではFlashforgeのCJ270が10月に3,999ドルで出荷を始めており、競合との比較も今後の注目点になる。新興企業の初製品だけに、実機の色再現や造形精度、サポート体制は発売後の実機報告で確認したい。展示会での実機確認や、発売後のレビューも参考にしたい。導入を検討する場合は、対応素材と造形サイズが用途に合うかを見極めたい。","2026-11-17","WCIA","https://www.wcia.com/business/press-releases/cision/20261117CN98052/inkera-brings-full-color-3d-printing-to-the-desktop-with-the-c1/"],["ミマキ、UV硬化フルカラー3Dプリンター「3DUJ-553MkII」発表","ミマキエンジニアリングがUV硬化インクジェット方式のフルカラー3Dプリンター「3DUJ-553MkII」を発表した。色域を従来機比約1.4倍に広げ、内部充填用の低コストなインフィルインクで造形コストを抑える。次のジョブを自動で開始する「スマートリレー」機能も搭載。Formnext 2026で世界初公開し、2027年春の発売を予定している。色再現とコスト、稼働効率の三つを高め、フィギュアやモックアップの制作を支援する。","\n【概要】ミマキエンジニアリングがUV硬化インクジェット方式のフルカラー3Dプリンター「3DUJ-553MkII」を発表した。色域を従来機比約1.4倍に広げ、内部充填用の低コストなインフィルインクで造形コストを抑える。次のジョブを自動で開始する「スマートリレー」機能も搭載。Formnext 2026で世界初公開し、2027年春の発売を予定している。\n【背景】フルカラー3Dプリントはフィギュアや製品モックアップの分野で需要が広がる一方、色の再現性と造形コストが課題だった。従来機3DUJ-553は1,000万色以上の色表現が特長だったが、新機種は色域の拡大と内部インクのコスト削減で、大型造形物の商品化まで視野に入れている。\n【詳細】3DUJ-553MkIIはカラー制御を磨き上げ、色の表現領域を従来機比約1.4倍に拡大した。鮮やかな色彩と深みのある濃色を表現でき、ブランドカラーやキャラクター固有の色など、色再現性が重視されるデザインに対応する。木目や皮革調、カーボン柄、大理石調など素材ごとの色合いや模様もリアルに描ける。新開発のインフィルインクは造形物の内部を充填するための低コストインクで、従来は内部にもカラーインクを使っていた部分を置き換え、外観のフルカラー表現を保ちながらコストを低減する。内部充填の体積が大きい造形物ほど効果が大きいという。「スマートリレー」機能では次のジョブをあらかじめ予約しておくことで、造形終了後にテーブル奥側の空きスペースを使って自動的に次の造形を開始し、夜間など営業時間外の稼働効率も高める。\n【ポイント・注意点】発売は2027年春の予定で、価格は未発表だ。ミマキは8月に3Dデータ修正ソフト「Mimaki 3D Print prep Pro ver2」のウェブ提供も始めており、データ準備から造形までの支援を広げている。実機の色再現は展示会などで確認したい。導入を検討する場合は、造形サイズと色再現の実機確認、インフィルインクによるコスト削減の見込みを、自社の造形内容と照らして確認したい。","2026-11-17","PR TIMES","https://prtimes.jp/main/html/rd/p/000000131.000021708.html"],["京都ステッカー、UVDTFステッカーの注文方法と見積もり手順を解説","京都ステッカーがUVDTFステッカーの注文方法とWEB見積もりシステムの使い方を解説する記事を公開した。画像をアップロードしてサイズや数量を選ぶだけで見積もりが表示され、1枚から注文できる。対応形式はPNGとJPGで、解像度は300DPI以上が推奨。通常2〜4営業日で発送される通常プランと、1〜2営業日の特急プランがある。1枚からの注文に対応し、初めての人でも見積もりから入稿まで進めやすい仕組みだ。","\n【概要】京都ステッカーがUVDTFステッカーの注文方法とWEB見積もりシステムの使い方を解説する記事を公開した。画像をアップロードしてサイズや数量を選ぶだけで見積もりが表示され、1枚から注文できる。対応形式はPNGとJPGで、解像度は300DPI以上が推奨されている。納期は通常2〜4営業日、特急は1〜2営業日で発送される。\n【背景】UVDTFステッカーはUV硬化型インクで透明PETフィルムに印刷した転写ステッカーで、グラスやスマホケースなどに貼れる高耐久なグッズとして人気が高まっている。従来はUVプリンターで直接印刷する必要があったが、UVDTFなら台紙を剥がして貼るだけで施工できる。京都ステッカーでは自社工場での一貫製作により、1枚からの小ロット注文に対応している。\n【詳細】注文はWEB見積もりシステムでオンライン完結し、24時間いつでも受け付けている。基本の流れは画像のアップロード、サイズや数量、オプションの選択、見積もりの表示で、見積書PDFのダウンロードも可能だ。参考料金は税別で、50mm×50mmは10枚1,080円〜、100枚7,200円〜、100mm×100mmは10枚2,700円〜、100枚18,000円〜と案内されている。印刷はCMYKとホワイトインクで行われ、金銀インクやメタリック、箔押し、鏡面表現には対応しない。入稿データはPNGまたはJPGで、解像度300DPI以上が推奨されている。納期は通常スピードプランが決済後2〜4営業日以内で無料、特急スピードプランが1〜2営業日以内で有料だ。税別10,000円以上の注文で送料無料、製作実績の掲載許可で料金10%OFFのプランもある。\n【ポイント・注意点】曲面のコップやボトルなど緩やかな曲面にも貼れるが、デザインによっては剥がれる場合がある。京都ステッカーのテストでは家庭用食洗機で100回程度の洗浄でも剥がれなかったとしているが、貼り付け後は24時間〜72時間の定着期間を置くことが推奨されている。金色や銀色はデータ上で金色風・銀色風のカラー表現での仕上がりになるため、入稿前に仕様を確認しておきたい。","2026-11-17","京都ステッカー","https://www.kyoto-sticker.jp/2026/11/17/23800/"],["xToolの卓上UV機O1 Omni、数か月使った実機レビューが公開","クラフト系レビュアーがxToolの卓上UVプリンター「O1 Omni」を数か月使った実機レビューを公開した。木材や金属、ガラス、陶器など幅広い素材に直接印刷でき、質感や立体感のある仕上がりを高く評価。セットアップに約1.5時間かかる点や、ハンドル付きタンブラーへの印刷の難しさなど、実際に使って分かった注意点も率直にまとめている。レーザーカッターとの組み合わせや、ラミネーターなどの周辺機器を使った作例も紹介されている。","\n【概要】クラフト系レビュアーがxToolの卓上UVプリンター「O1 Omni」を数か月使った実機レビューを公開した。木材や金属、ガラス、陶器など幅広い素材に直接印刷でき、質感や立体感のある仕上がりを高く評価している。セットアップに約1.5時間かかる点や、ハンドル付きタンブラーへの印刷の難しさなど、実際に使って分かった注意点も率直にまとめている。\n【背景】O1 OmniはxTool初のUVプリンターで、UV光でインクを瞬時に硬化させて防水性と耐光性のある画像を作る。シングルUV、デュアルUV、DT+UVの3バージョンがあり、布への印刷やDTF転写にも対応する。レビュアーはDT+UV版を数か月使い、レーザーカッターとの組み合わせも試している。\n【詳細】印刷解像度は720×1440dpiで、大小2枚のベースプレートが付属する。大きいプレートは13×16.5インチで、大きな画像も印刷できる。レビュアーはフロリダの直射日光に2か月置いても色褪せがなかったとし、耐光性を評価した。テクスチャやバーニッシュ、箔の効果も試し、インク使用量を画面で確認できる点を気に入っているという。xTool Studioは操作が分かりやすく、同じソフトを全機種で使える点も評価された。ラミネーターL1とフィードローラー、ロータリーアクセサリーOR1も試し、ガラスタンブラーへの印刷やDTF転写ステッカーの作成ができたとしている。プリンターは約90ポンド（約41kg）と重く、設置には頑丈な作業台が必要だ。セットアップは約1.5時間で、動画の手順に沿って進められる。\n【ポイント・注意点】不満点として、プリントヘッドを動かしてスキャナーを掃除する手順が分かりにくい点、ハンドル付きのマグやタンブラーではハンドル近くに印刷できない点、衣類用ベースプレートが大きすぎる点が挙げられた。UVプリンターはインク循環のため電源を入れたままにする必要があり、気候管理された部屋での使用が求められる。購入前には設置スペースと換気、必要な消耗品やブランク素材の費用を確認しておきたい。","2026-11-17","Semigloss Design","https://www.semiglossdesign.com/xtool-o1-omni-review"]],"risk":[["生後5カ月の娘を抱いたまま転落 母死亡、赤ちゃんは軽傷","韓国・慶尚南道昌原市のマンションで11月20日午前、生後5カ月の女児を抱いた40代女性が転落し、女性は搬送先で死亡した。女児は頭部のこぶなど軽傷で命に別条はない。警察と消防は、転落の際に女性が赤ちゃんをかばったため大けがを免れたとみて、詳しい死因などを調べている。マンションの高層階からの転落事故は、ベランダや窓の安全対策の大切さを改めて突きつける。高層階のベランダや窓からの転落は、子どもを連れた家庭にとって身近な危険であり、日ごろの安全対策が欠かせない。","\n【概要】韓国南部・慶尚南道昌原市のマンションで11月20日午前9時23分ごろ、40代の女性と生後5カ月の女児が1階の花壇付近で倒れているのを住民が発見し、119番通報した。消防が到着したとき女性は心停止状態で、病院に搬送されたが死亡した。女児は頭部にこぶができるなどの軽傷で、命に別条はないという。警察と消防当局は、転落の過程で女性が赤ちゃんをかばったため、女児が大けがを免れたとみている。警察は詳しい死因などを調べている。【背景】マンションの高層階からの転落は、落ちた高さによっては命にかかわる重大な事故になる。赤ちゃんを抱いたままの移動や、ベランダ・窓の近くでの行動には、ふだん以上の注意が求められる。【詳細】記事によると、発見されたのはマンション1階の花壇付近だった。女性は40代、女児は生後5カ月。女児は泣いていたといい、救急隊員が女性に心肺蘇生を施しながら近くの病院に搬送したが、女性は死亡した。女児の命に別条はない。転落した階や経緯の詳細は、警察が調べている段階だ。【ポイント・注意点】小さな子どもを抱いてベランダや窓の近くに立つときは、手すりや窓の鍵の状態を確かめ、子どもが身を乗り出さないように気をつけたい。赤ちゃんを抱いたままの移動では足元にも注意し、無理な姿勢や急な動きを避けることが大切だ。マンションではベランダに踏み台になる物を置かない、窓に補助錠を付けるといった備えも、転落防止に役立つ。万が一の転落では、すぐに119番に通報し、子どもの意識や呼吸の様子を伝えることが重要だ。ベランダや窓からの転落を防ぐには、窓やベランダの鍵をこまめに確認し、子どもが自分で開けられない工夫をすることが大切だ。ベランダには、足場になるものを置かないことも重要だ。赤ちゃんを抱いたままベランダに出るときは、まず赤ちゃんを安全な場所に寝かせ、窓や鍵の状態を確かめてからにするとよい。転落事故は一瞬の出来事であり、家族みんなでベランダや窓の安全を確認する習慣をつけることが、子どもを守ることにつながる。","2026-11-23","Yahoo!ニュース（朝鮮日報日本語版）","https://news.yahoo.co.jp/articles/e60bab5cef5a03d8b07ac34724feb343615ae74d"],["インフルエンザの異常行動 発熱から2日間の見守りと転落防止","インフルエンザにかかった子どもに「急に走り出す」「部屋から飛び出そうとする」といった異常行動が起こることがあり、厚生労働省は少なくとも発熱から2日間、転落防止の対策をとるよう呼びかけている。全国の患者数は第46週で定点あたり11.94人と4週連続で増加した。横浜市都筑区では15.80人と注意報レベルを超えており、流行期の今こそ家庭での備えが欠かせない。発熱から2日間は、玄関と窓の施錠や寝る場所の工夫で転落を防ぐことが大切だ。","\n【概要】インフルエンザにかかったときに報告されている「異常行動」とは、厚生労働省の説明によれば「急に走り出す」「部屋から飛び出そうとする」といった、本人の意思とは思えない突発的な行動のことだ。会話がかみ合わない、呼びかけても反応がない、怖がって興奮するといった状態を伴うことがある。厚生労働省は少なくとも発熱から2日間、保護者が転落などの事故を防ぐ対策をとるよう呼びかけている。【背景】重度の異常行動は、就学以降の小児・未成年者、とくに男性での報告が多いとされている。発熱から2日以内に現れることが多い。報告の多くは自宅で、家族が眠っているあいだに子どもだけが起き上がって移動してしまうのが最も危険な状況だ。厚生労働省は「極めてまれですが、転落等による死亡事例も報告されています」と明記している。【詳細】厚生労働省が示す転落防止の4点は、玄関とすべての部屋の窓の施錠を確実にすること、ベランダに面していない部屋で寝かせること、窓に格子のある部屋で寝かせること、できる限り1階で寝かせることだ。抗インフルエンザ薬との因果関係は不明とされ、薬の服用の有無や種類にかかわらず注意が必要だ。薬をやめても異常行動のリスクは下がらず、合併症のリスクだけが上がるとされている。全国の第46週の定点あたり報告数は11.94人で4週連続の増加、横浜市都筑区は15.80人だった。【ポイント・注意点】異常行動と熱性けいれん、インフルエンザ脳症の見分け方の軸は「熱が下がったあと、元に戻るかどうか」だ。異常行動は数分から数十分で落ち着き、翌朝にはふだんどおりになることが多い。熱性けいれんは多くは5分以内におさまる。意識障害やけいれんが時間単位で続く、呼びかけへの反応が悪いままといった場合はインフルエンザ脳症を考え、ただちに救急受診が必要だ。けいれんが5分以上続く場合や、呼びかけても目を開けない場合は119番へ。子ども部屋のドアを開けたままにする、廊下の明かりを少しつけておくといった工夫も有効だ。発熱があるときは、子どもの様子をこまめに見守り、異常な行動がみられたら、すぐに医療機関に相談することが大切だ。","2026-11-23","五良ファミリークリニック","https://goryo-family.clinic/blog/influenza-abnormal-behavior-children-fall-prevention"],["はしか国内582例 7年ぶりの高水準 ワクチン2回接種の確認を","2026年11月、米国で世界保健機関が麻疹排除の認定を取り消した。日本でも2026年は11月時点で582例の報告があり、2019年以来7年ぶりの高い水準となっている。麻疹は感染力が極めて強く、肺炎や急性脳炎などの重い合併症を起こすことがある。特効薬はなく、予防にはMRワクチンの2回接種が最も有効で、発症予防効果は約97%とされている。日本でも報告数が増えており、予防接種の記録を確かめ、不安があればかかりつけ医に相談することが大切だ。","\n【概要】2025年から麻疹の流行が続いていた米国では、2026年11月、ついに世界保健機関によって麻疹排除の認定が取り消された。同じ時期にメキシコやボリビアも認定を失い、カナダは2025年に取り消されている。日本も例外ではなく、2026年には11月時点で582例の麻疹患者が報告され、2019年以来、7年ぶりの高い報告数となっている。【背景】麻疹は、ワクチンが普及する以前、世界中で多くの子どもたちの命と健康を奪ってきた感染症だ。免疫を持たない人が麻疹患者と濃厚接触すると、90%以上という非常に高い確率で感染するとされている。単なる発熱と発疹の病気ではなく、肺炎や急性脳炎などの重篤な合併症を引き起こすことがある。急性脳炎は約1000例に1例の割合で発症し、回復後も永続的な神経の後遺症を残すことがある。患者1000人のうち約1〜3人が死亡するとされ、米国では2026年に感染者数が5000例を超え、小児を含む6人の死亡が報告されている。【詳細】麻疹ウイルスに対する特効薬はなく、発症した場合は脱水や呼吸状態の悪化などに対する対症療法が治療の中心となる。麻疹から回復したあとも、5〜10年ほど経過してから致死率の高い脳炎である亜急性硬化性全脳炎を発症することが極めてまれにあるほか、免疫の記憶の一部が失われる「免疫健忘」が起こり、他の感染症にかかりやすくなる可能性もある。日本では2006年度からMRワクチンの2回接種が定期接種として導入され、2015年にWHOから麻疹の排除状態にあると認定された。しかし新型コロナのパンデミック以降、予防接種の遅れや接種率の低下などを背景に、世界各地で再流行が起きている。【ポイント・注意点】麻疹の予防にはMRワクチンが用いられ、発症予防効果は1回接種で約93%、2回接種で約97%と極めて高い。定期接種は第1期が1歳児、第2期が小学校入学前1年間の幼児が対象だ。予防接種について疑問や不安があるときは、かかりつけの小児科医など身近で信頼できる相談相手に相談してほしい。接種率の低下には、医療へのアクセスの問題や、SNS上の誤情報・偽情報の拡散によるワクチンへの不信感など、さまざまな要因が関係していると考えられている。","2026-11-22","Yahoo!ニュース エキスパート","https://news.yahoo.co.jp/expert/articles/9041b1e4a6f3069b8a43984fdc72ce7bf1cde1d8"],["CBDは知的障害のある子の重い行動問題に効果なし 世界初の試験","オーストラリア主導の世界初のランダム化比較試験で、カンナビジオール（CBD）が知的障害のある子どもの重い行動問題に効果がないことが分かった。6〜18歳の131人が参加し、CBDとプラセボを比べた。研究成果はJAMA Pediatricsに掲載された。CBD製品への期待が高まる中、効果のない治療に費用や時間をかける前に、確かな根拠のある支援を選ぶ大切さを示している。","\n【概要】カンナビジオール（CBD）は、知的障害のある子どもの重い行動問題に効果がないことが、世界初のランダム化比較試験で分かった。オーストラリアのマードック子どもの研究所が主導し、シドニー大学やモナッシュ大学の研究者らが参加した。研究成果はJAMA Pediatricsに掲載された。CBDは大麻やヘンプから抽出される成分で、陶酔作用のあるテトラヒドロカンナビノールを含まない。世界中で人気の製品となっているが、知的障害のある子どもの重い行動問題を対象にしたランダム化比較試験はこれまでなかった。【背景】知的障害のある子どもの多くは、不安や睡眠障害、易怒性、攻撃性、自傷、徘徊といった重い行動問題を抱えている。抗精神病薬や精神刺激薬、抗うつ薬といった既存の薬は効果が限られ、副作用のリスクもあるため、多くの親がCBDに希望を託してきた。2023年の調査では、ADHDや自閉症、不安のある子の親の約3分の1が、子どもに未承認のCBD製品を与えていたという。米国では、医薬品のCBDを受けている子どもの約3分の1が、承認された適応のないまま受けている可能性も指摘されている。【詳細】試験は、2021年から2025年の4年間にわたる並行群間・二重盲検・プラセボ対照のランダム化比較試験だった。対象は知的障害と重い行動問題のある6〜18歳の子ども131人で、メルボルンとシドニーの3つの小児病院から集められた。参加者の84%が自閉症と診断されていた。参加者は、CBDを1日あたり体重1キログラムあたり10ミリグラムで8週間飲む群と、プラセボを飲む群に無作為に分けられた。親が標準化されたチェックリストで行動を評価した結果、CBDは重い行動問題に効果がないことが示された。CBDによる副作用は軽度でまれで、過度の眠気や不眠、下痢、食欲の低下が最も多く報告された。【ポイント・注意点】研究者らは、厳密な試験でCBDが効かないことを確かめるのは、親に誤った希望を抱かせないためにも、限られた資源を効果のある治療の開発や利用に振り向けるためにも重要だと述べている。CBD製品は「より自然な選択肢」という印象から選ばれやすいが、人気や印象と効果は別だ。子どもの行動問題で悩むときは、根拠のある支援や治療について小児科医や専門医に相談し、家庭の負担や費用に見合う方法を選ぶことが大切だ。","2026-11-22","medicalxpress","https://medicalxpress.com/news/2026-11-cannabidiol-effective-severe-behavioral-problems.html"],["3歳女児死亡で両親逮捕 保育園は虐待疑いで市に複数回通報","大阪府枚方市で3歳の女児が死亡し、両親が逮捕された事件で、女児が通っていた保育園の関係者が取材に応じた。園は虐待の疑いで市に複数回通報していたといい、「複数の通報があったなか、一時保護のタイミングはなかったのか」と自問しているという。市と大阪府には、一時保護をめぐる検証を求める声が上がっている。保育園などの現場と自治体が情報を共有し、通告のあとの対応をていねいに検証していくことが、同じような悲劇を繰り返さないための課題となっている。","\n【概要】大阪府枚方市で3歳の女の子が死亡し、両親が逮捕された事件で、女の子が通っていた保育園の関係者が取材に応じ、「複数の通報があったなか、一時保護のタイミングはなかったのか」と話した。園は虐待の疑いで市に複数回通報していたという。市と大阪府には、一時保護をめぐり検証を求める声が上がっている。【背景】保育園や認定こども園は、子どもと毎日接する場であり、体にできた傷やあざ、様子の変化に気づきやすい立場にある。虐待が疑われる場合、園は市町村や児童相談所に通告する役割を担っている。通告を受けた自治体は、家庭の状況を調べ、必要に応じて子どもを一時的に保護するなど、安全を確保するための対応をとる。だが、通告があってもすぐに一時保護に至らない場合もあり、その判断の難しさが問われることがある。【詳細】記事によると、枚方市の会社員の両親が逮捕された事件で、女児が通っていた保育園の関係者は、複数の通報があったことを踏まえ、「もっとできることはなかったのか」と自問しているという。園の関係者は、市と大阪府に対して、一時保護をめぐる検証を求める考えを示している。事件の詳しい経緯や、通報の回数と時期、自治体側の対応の詳細については、記事では明らかにされていない。【ポイント・注意点】子どもの虐待は、周囲の大人が気づいて声を上げることが、子どもを守る第一歩になる。体の傷やあざだけでなく、急な様子の変化や、理由の説明が二転三転するといったサインも見逃さないことが大切だ。虐待が疑われるときは、児童相談所に相談できる。保育園などの現場と自治体が情報を共有し、通告のあとの対応をていねいに検証していくことが、同じような悲劇を繰り返さないための課題だ。虐待の疑いがあるとき、保育園や学校などの現場は、自治体や児童相談所に通告し、情報を共有する役割がある。通告を受けたあとの対応も含め、関係機関が連携して子どもの安全を守る仕組みが求められている。周囲の大人が「いつもと違う」と感じたら、ためらわずに相談することも大切だ。子どもの命を守るためには、現場の気づきと自治体の対応が、ていねいにつながることが欠かせない。","2026-11-22","MBSニュース","https://newsdig.tbs.co.jp/articles/mbs/3103885"],["クリニックの流行情報 インフル11人 RSウイルスも保育園で発生","福岡市のこどもクリニックが11月22日に更新した流行情報によると、11月16日〜22日の1週間でインフルエンザが11人と最も多く、手足口病2人、溶連菌咽頭炎4人、感染性胃腸炎とRSウイルス感染症が各1人だった。RSウイルス感染症は一部の保育園で発生しており、今後流行する可能性があるとして、4歳未満の子で咳がひどい場合の注意を呼びかけている。インフルエンザや溶連菌咽頭炎が前の週より増えており、流行は今も続いている。","\n【概要】福岡市のこどもクリニック友枝が11月22日に更新した「現在流行している病気について」によると、11月16日〜22日の1週間でインフルエンザが11人と最も多く、手足口病が2人、溶連菌咽頭炎が4人、感染性胃腸炎とRSウイルス感染症が各1人だった。RSウイルス感染症は一部の保育園で発生しており、今後、流行する可能性があるとして、4歳未満の子で咳がひどい場合の注意を呼びかけている。【背景】前の週の11月9日〜15日は、インフルエンザが7人、手足口病と感染性胃腸炎が0人、溶連菌咽頭炎が1人、RSウイルス感染症が0人だった。11月16日〜22日の週は、インフルエンザが7人から11人に増え、溶連菌咽頭炎も1人から4人に増えた。さらに前の週の11月2日〜8日は、インフルエンザが15人、感染性胃腸炎が5人だった。インフルエンザは週によって増減を繰り返しながら、流行が続いている。【詳細】RSウイルス感染症は一部の保育園で発生しており、クリニックは今後流行する可能性があるとして、4歳未満の子で咳がひどい場合は注意が必要だとしている。溶連菌咽頭炎も1人から4人に増えた。インフルエンザ、手足口病、感染性胃腸炎、溶連菌咽頭炎、RSウイルス感染症は、いずれも咳やくしゃみのしぶきや、ウイルスや細菌のついた手や物からうつりやすい。園や学校で複数の感染症が同時に流行する時期は、家庭での手洗いや換気の習慣がとくに大切になる。【ポイント・注意点】外出後の手洗いや、せきが出るときのマスク、こまめな換気が基本の予防になる。熱のある朝は登校や登園を控え、熱がひいたあとも咳だけが続くときは、咳が始まった日と夜の様子をメモして受診時に伝えるとよい。夜間や休日に子どもの具合で迷ったときは、かかりつけ医や地域の小児救急の相談窓口に相談できる。クリニックの流行情報は、地域の流行の様子を知る手がかりになる。インフルエンザやRSウイルス感染症など、子どもの感染症は流行の波があるため、家庭でもこまめな情報収集と予防を心がけたい。身近なクリニックの情報を確認し、子どもの体調の変化に気をつけることが、流行期の備えになる。","2026-11-22","こどもクリニック友枝","https://www.tomoeda.or.jp/prevalent"],["釣り人の転落死相次ぐ 淡路島で9歳男児も 海保が注意呼びかけ","淡路島の海岸で10〜11月、釣り人が転落して死亡する事故が相次いだ。9歳の男児が死亡する事故も起きている。第5管区海上保安本部は、救命胴衣の着用や天候の確認など安全確保を呼びかけている。南あわじ市灘黒岩の突堤では釣り人が高波にさらわれた。冬に向けて波が高くなる時期、子ども連れの釣りでは特に注意が必要だ。救命胴衣の着用や天候の確認など、釣りに行く前の安全対策を徹底することが大切だ。","\n【概要】淡路島の海岸で釣り人が転落して死亡する事故が、10〜11月に相次いだ。第5管区海上保安本部は、救命胴衣の着用や天候の確認など安全確保を呼びかけている。10月以降、9歳の男児が死亡する事故も起きている。南あわじ市灘黒岩の突堤では、釣り人が高波にさらわれた。【背景】海釣りでは、突堤や磯などの足場から海に転落する事故が繰り返し起きている。波が高い日や、足場がぬれているときは、思わぬタイミングでバランスを崩すことがある。子どもは体が小さく、波の力にあらがいにくいため、大人以上に危険が大きい。釣り場では、釣りに夢中になるあまり、周囲の波や足元の様子への注意がおろそかになりやすい。【詳細】記事によると、淡路島内の海岸で釣り人の転落死が10〜11月に相次ぎ、9歳の男児の死亡事故も含まれている。第5管区海上保安本部は、救命胴衣の着用や天候の確認など、安全確保を呼びかけている。南あわじ市灘黒岩では、釣り人が高波にさらわれた突堤の写真とともに報じられた。事故の件数や、男児の事故の詳しい経緯は記事では明らかにされていない。【ポイント・注意点】子ども連れで釣りに行くときは、子どもにも大人と同じく救命胴衣を着せ、突堤や磯の先端には近づかせないことが大切だ。出かける前に天気予報と波の高さを確認し、波が高い日や風が強い日は釣りを控える。足場がぬれている場所では、滑りにくい靴を選び、子どもから目を離さない。万が一、誰かが海に落ちたときは、無理に助けに入らず、すぐに118番（海上保安庁）や119番に通報し、浮き輪やロープなど浮く物を投げて助けることが重要だ。海釣りでは、足場が滑りやすかったり、波が急に高くなったりすることがある。子どもを連れていくときは、救命胴衣を着せ、足場の安定した場所を選び、子どもから目を離さないことが大切だ。大人も救命胴衣を着用し、天候や海の様子を確認してから釣りを始めることが、事故を防ぐことにつながる。波が高い日や風が強い日は、無理をせず釣りを控える判断も大切だ。釣りに行くときは、子どもの救命胴衣を忘れずに持っていき、足場のよい場所を選ぶことが大切だ。","2026-11-21","神戸新聞","https://www.kobe-np.co.jp/news/awaji/202611/0021056131.shtml"],["目隠し鬼で遊んでいた8歳少女 約8メートル転落もブドウ畑が救う","トルコ北部で11月16日、友人と「目隠し鬼」をしていた8歳の少女が、高さ約8メートルの擁壁から転落する事故が起きた。目隠しをしたまま鉄製の柵に衝突し、バランスを崩して壁の向こう側へ落ちた。壁の下にはブドウ畑があり、ブドウ棚の上に落ちてから地面に衝突。ブドウのつるなどがクッションとなり衝撃を和らげた可能性があり、少女は病院に搬送されたが容体は良好だった。目隠しをして遊ぶときは、平らで段差や高所のない安全な場所を選ぶことが大切だ。","\n【概要】トルコ北部の地域で11月16日、友人と「目隠し鬼」をしていた8歳の少女が、高さ約8メートルの擁壁から転落する事故が起きた。転落の瞬間を捉えた防犯カメラ映像がSNSで拡散されている。少女は救急隊から応急処置を受けて病院に搬送され、その後の容体は良好だった。【背景】現場はテペキョイ・ゲンチリク・シテシ地区。少女は3人の友人と遊んでいた際、目隠しをしたまま鉄製の柵に衝突し、バランスを崩して壁の向こう側へ落ちた。映像には、パーカーのフードを前後逆向きに被った少女が柵を越えて頭から転落し、友人らが驚いて壁際へ駆け寄る様子が映っている。目隠しをして遊ぶときは、周りが見えないため、高所や道路、段差のある場所では思わぬ事故につながりやすい。【詳細】壁の下にはブドウ畑があり、少女はブドウ棚の上に落ちてから、地面に衝突した。ブドウのつるなどがクッションとなり、衝撃を和らげた可能性があると伝えられている。少女は救急隊から応急処置を受けて病院に搬送され、その後の容体は良好だった。防犯カメラの映像がSNSで広がり、多くの人が事故の様子を目にしている。【ポイント・注意点】目隠し鬼やかくれんぼなど、目や視界をふさぐ遊びをするときは、平らで段差や高所のない安全な場所を選ぶことが大切だ。柵や壁の近く、道路の近くでは遊ばせない。子どもだけで遊ばせるときも、遊ぶ場所を事前に大人が確かめ、危険な場所を伝えておくことが重要だ。転落したときは、たとえ元気に見えても頭を打っている可能性があるため、すぐに救急車を呼び、病院で診てもらうことが大切だ。遊びの最中に起きた事故は、子ども自身が危険に気づけないことが多い。目隠しをして遊ぶときは、平らで段差や高所のない安全な場所を選び、大人がそばで見守ることが大切だ。遊び場に高所や水場、車の通り道がないかを確かめ、遊ぶ前に安全な範囲を子どもと一緒に確認しておくことも、事故を防ぐことにつながる。子どもが遊ぶ場所は、事前に大人が歩いて確かめ、危ない場所がないか見ておきたい。遊ぶ場所の安全は、遊ぶ前に大人が歩いて確かめ、子どもと一緒に確認しておきたい。","2026-11-21","Yahoo!ニュース（ハフポスト日本版）","https://news.yahoo.co.jp/articles/79e1fc577b279c1a8fc1f9ff35ca3fd894f13d50"],["飲酒運転で下校中の小学生3人はねる 2人重傷 男を送検","鹿児島県枕崎市で11月18日午後、酒を飲んで軽乗用車を運転していた52歳の男が、下校中の小学3〜4年生の男子児童3人をはねた。3人のうち2人は腰や頭の骨を折る重傷、1人は打撲などの軽傷だった。男は酒気帯び運転の疑いで現行犯逮捕され、11月20日に送検された。警察の調べに「飲酒運転をし、横断歩道を横断中の子どもをはねたことは間違いない」と容疑を認めているという。","\n【概要】鹿児島県枕崎市で11月18日午後3時半ごろ、酒を飲んで軽乗用車を運転していた52歳の男が、下校中の小学生3人をはねる事故があった。3人のうち2人が病院に運ばれ、腰や頭の骨が折れる重傷を負った。命に別条はないという。もう1人はひざに軽傷を負った。男は酒気帯び運転の疑いで現行犯逮捕され、11月20日に送検された。【背景】現場は枕崎市桜山本町の国道225号と市道の交差点付近。はねられたのは下校中の小学3年生から4年生の男子児童3人だった。警察が調べたところ、軽乗用車の運転手に飲酒運転の疑いがあり、呼気検査を実施した。男は枕崎市立神北町の農業、長野浩孝容疑者（52）で、警察の調べに対し「飲酒運転をし、横断歩道を横断中の子どもをはねたことは間違いない」と容疑を認めているという。警察は自動車運転死傷処罰法違反（過失運転致傷）の疑いも視野に、当時の信号の状況などを調べている。【詳細】事故があったのは18日午後3時半ごろで、子どもたちが下校する時間帯だった。3人のうち2人が病院に搬送され、1人が腰を、もう1人は頭を骨折するなどの重傷を負った。搬送されなかった児童は打撲などの軽傷だという。男は18日に酒気帯び運転の疑いで現行犯逮捕され、19日に身柄が知覧支部に送られた。警察は、飲んだ酒の量や車を運転した経緯などを調べている。【ポイント・注意点】飲酒運転は、判断力や反応を鈍らせ、子どもをはねる重大な事故につながる。酒を飲んだら絶対に車を運転しない、という当たり前のルールを守ることが、通学路の子どもを守る第一歩だ。保護者や地域の人も、通学路の危険な場所や、子どもの通学時間帯の車の動きに目を配り、危ないと感じた場所は学校や自治体に伝えることが大切だ。子どもには、横断歩道を渡るときは左右をよく確かめ、信号が青でも車が止まったことを見てから渡るよう、日ごろから伝えておきたい。下校中の子どもは、道路を横断するときに車の動きをよく見て、信号や横断歩道を使うことが大切だ。ドライバーも、学校や住宅街の近くでは速度を落とし、子どもが飛び出してくる可能性を想定して運転することが求められる。通学路の安全は、子どもとドライバー、地域の大人みんなで守るものだ。","2026-11-20","KYT NEWS NNN","https://news.ntv.co.jp/n/kyt/category/society/ky3347aae85d1b4d2fb06f13f1b973d40c"],["岡山の小学校と高校で学年・学級閉鎖 インフルエンザで","岡山県は11月20日、インフルエンザの感染で津山市の小学校1校と高校1校が学年・学級閉鎖したと発表した。小学校では3年生5人がインフルエンザとみられる症状を訴えて欠席し、学年閉鎖となった。高校では1年の1クラスで7人が症状を訴えて欠席し、学級閉鎖となった。県は9月28日にインフルエンザ注意報を発令し、マスクの着用や手洗いの徹底を呼びかけている。県はマスクの着用や手洗いの徹底を呼びかけており、流行は今も続いている。","\n【概要】岡山県は11月20日、インフルエンザの感染で津山市の小学校1校と高校1校が学年・学級閉鎖したと発表した。小学校では、3年生5人がインフルエンザとみられる症状を訴えて欠席し、20日に学年閉鎖を行った。高校では、1年の1クラスで7人がインフルエンザとみられる症状を訴え欠席し、20日に学級閉鎖を行った。【背景】岡山県は、9月28日にインフルエンザ注意報を発令し、マスクの着用や手洗いの徹底を呼びかけている。学校や保育施設での集団発生が各地で報告されており、インフルエンザの流行は今も続いている。インフルエンザにかかると、高い熱や頭痛、全身のだるさなどが急に出ることが多く、のどの痛みや鼻水、咳などの症状もみられる。子どもではまれに重症になることもあるため、早めの対応が大切だ。【詳細】津山市の小学校では、3年生の5人がインフルエンザとみられる症状を訴えて欠席した。高校では、1年生の1クラスで7人がインフルエンザとみられる症状を訴えて欠席した。いずれも20日に閉鎖の措置がとられた。県は、インフルエンザの感染予防として、マスクの着用や手洗いの徹底を呼びかけている。インフルエンザにかかった子どもは、熱が下がってもすぐには登校できない決まりがあり、回復するまで家で休ませることが大切だ。【ポイント・注意点】インフルエンザの予防の基本は、外出後の手洗いや、こまめな換気、十分な休養とバランスの取れた食事、人混みや繁華街への外出を控えること、そしてインフルエンザワクチンの接種だ。熱のある朝は登校や登園を控え、熱が下がっても、すぐには登校や登園ができない決まりがあるので、学校や園の指示に従って休ませることが大切だ。子どもがインフルエンザと診断されたら、熱や咳の様子をメモして受診時に伝え、家では水分をこまめにとらせることが大切だ。けいれんや意識の変化、呼吸が苦しそうな様子があれば、すぐに医療機関に相談してほしい。インフルエンザの流行期には、学校や家庭で体調の変化に気をつけ、熱があるときは無理をせず休むことが大切だ。流行の様子は日々変わるため、学校や自治体の情報をこまめに確認し、基本の予防を続けたい。","2026-11-20","KSB瀬戸内海放送","https://news.ksb.co.jp/article/17068730"],["米で子ども用自転車ヘルメット約1万6730個リコール 頭部守れず","米消費者製品安全委員会は11月19日、LEDライト付きの子ども用自転車ヘルメット約1万6730個のリコールを発表した。連邦の自転車ヘルメット基準の衝撃吸収や位置の安定性、認証の要件を満たしておらず、衝突時に頭を守れないおそれがある。対象は白色のユースサイズS、モデルCPSK300CCで、けがの報告はない。使用中止と全額返金が呼びかけられている。対象のヘルメットを持っている人は、すぐに使用をやめ、全額返金の手続きをとるよう呼びかけられている。","\n【概要】米消費者製品安全委員会（CPSC）は2026年11月19日、LEDライト付きの子ども用自転車ヘルメット約1万6730個のリコールを発表した。対象のヘルメットは、連邦の自転車ヘルメット基準の衝撃吸収や位置の安定性、認証の要件を満たしておらず、衝突時に頭を守れないおそれがある。けがの報告はない。対象のヘルメットを持っている人は、すぐに使用をやめ、全額返金の手続きをとるよう呼びかけられている。【背景】対象は、白色のユースサイズSのCiptonブランドの自転車ヘルメットで、頭囲は約19.7〜21.3インチ（約50〜54センチ）に合う。黒いパッドやストラップ、バックルと、内蔵された多色のLEDライトが付いており、内側のラベルには「CPSK300CC」と書かれている。販売したのはHardline Group（Cipton）で、中国製。2024年4月から2026年5月にかけて、米国のディックス・スポーティング・グッズやJ.C.ペニーなどで、約35ドルで販売された。【詳細】CPSCによると、ヘルメットは連邦基準「16 CFR Part 1203」の衝撃吸収、位置の安定性、認証の要件を満たしていない。衝撃吸収の試験では、ヘルメットを落として頭部に伝わる衝撃を測り、一定の値を超えると不合格になる。位置の安定性の試験では、重りを落として引っ張り、ヘルメットが頭から外れないかを確かめる。認証は、製造ロットごとに合理的な試験を行い、部品や供給元、製造方法が変われば新たな試験ロットを始めるという決まりがある。CPSCもCiptonも、なぜ基準を満たさなかったのか、原因は明らかにしていない。LEDライトが原因だという情報もない。【ポイント・注意点】リコール対象のヘルメットを持っている場合は、すぐに使用をやめ、ストラップを切り、「Recalled」と書いて写真をメールで送ると、全額返金される。ヘルメットにはリチウムイオン電池が内蔵されており、ごみやリサイクルに出さず、家庭の有害廃棄物の窓口に相談する必要がある。日本で同じ製品が売られているかは不明だが、子ども用ヘルメットを買うときは、サイズが頭に合っているか、あごひもがしっかり留まるか、認証マークがあるかを確かめることが大切だ。ヘルメットは転倒時の頭部外傷から子どもを守る大切な道具であり、基準を満たした製品を選ぶことが重要だ。","2026-11-20","Jackson Hedden","https://www.jacksonhedden.com/blog/cipton-youth-led-bike-helmet-recall-consumer-product-design"],["北海道で今季初のインフルエンザ警報 10年で最も早い発令","北海道は11月19日、今シーズン初めてインフルエンザ警報を出した。11月15日までの1週間で1医療機関あたりの患者数が30.63人となり、警報の目安である30人を超えた。この時期の警報は2025年と並び、ここ10年で最も早い。子どもたちの間でも流行が続き、この1週間で6校が休校し、170校以上で学級閉鎖が起きた。警報は札幌市など17の保健所管内で出ている。冬に向けて流行がさらに広がるおそれがあり、家庭や学校での感染予防が大切だ。","\n【概要】北海道は11月19日、今シーズン初めてインフルエンザ警報を出した。道内では11月15日までの1週間で、1医療機関あたりの感染者数が30.63人となり、警報の目安である30人を超えた。この時期のインフル警報は2025年などと並び、ここ10年で最も早いという。子どもたちの間でも流行が続いていて、道内ではこの1週間で6校が休校し、170校以上で学級閉鎖が起きている。インフル警報は札幌市など道内17の保健所管内で出ていて、感染拡大が止まらない。【背景】インフルエンザの流行は北海道だけでなく全国に広がっている。北海道では、札幌市など17の保健所管内で警報が出ており、子どもたちの間でも流行が続いている。学級閉鎖や休校が増えると、子どもたちの学びや、看病する家庭の負担にも影響が出る。冬に向けて流行がさらに広がるおそれがあり、早めの備えが大切だ。【詳細】北海道の警報は、札幌市を含む17の保健所管内で出ている。道内ではこの1週間で6校が休校し、170校以上で学級閉鎖が起きた。子どもたちの間でも流行が続いており、学校や保育施設での集団発生が広がっている。この時期の警報は2025年と並び、ここ10年で最も早い発令だという。冬に向けて流行がさらに広がるおそれがあり、家庭や学校での感染予防がますます大切になっている。【ポイント・注意点】インフルエンザの流行が続く中、これから本格化する受験シーズンに向け、受験生はもちろん、家族や周囲の人も感染予防を心がけたい。外出後の手洗いやこまめな換気、十分な休養とバランスの取れた食事といった基本の対策が大切だ。子どもが熱を出したときは、すぐに受診するかどうか迷う場合、地域の救急相談窓口やかかりつけ医に相談できる。まだワクチンを受けていない人は、今からでも接種を検討してほしい。熱のある朝は登校や登園を控え、家では水分をこまめにとらせることが大切だ。冬に向けて流行がさらに広がるおそれがあるため、家庭や学校での感染予防を心がけたい。マスクの着用や手洗い、換気といった基本的な対策を続け、体調が悪いときは無理をせず休むことが大切だ。流行の様子は日々変わるため、学校や自治体の情報をこまめに確認したい。","2026-11-19","FNNプライムオンライン","https://www.fnn.jp/articles/-/1155809"],["北海道・滝川管内で手足口病の警報 5歳以下の乳幼児が中心","北海道赤平市は11月19日、滝川保健所管内で手足口病の警報が発令されたと発表した。第46週（11月9日〜15日）の定点医療機関1カ所あたりの患者報告数が10人（5.0人）となり、警報基準の5人以上に達した。手足口病は口の中や手足に水ぶくれのような発疹が出るウイルス性の感染症で、子どもを中心に流行する。市は手洗いやうがいの励行と、集団生活でのタオルの共用を避けるよう呼びかけている。","\n【概要】北海道赤平市は11月19日、滝川保健所管内で手足口病が流行していると発表した。令和8年度第46週（11月9日〜15日）において、滝川保健所管内の手足口病患者報告数が、警報基準である5人以上となり警報が発令された。第46週の報告数は10人で、定点あたり5.0人だった。今後、滝川保健所管内において流行がさらに拡大する可能性があるため、感染予防に努めるよう呼びかけている。【背景】手足口病は、コクサッキーA16型やエンテロウイルス71型などの伝染性ウイルスに感染して起こる感染症で、飛沫感染や経口感染（糞口）を起こす。発熱と口腔、咽頭粘膜に痛みを伴う水疱ができ、唾液が増え、手・足末端や臀部に水疱が見られるのが特徴だ。子どもを中心に流行し、ほとんどの発病者は数日間のうちに治るが、ごくまれに髄膜炎や脳炎を生じることがあるので、持続する発熱や嘔吐、頭痛がある場合は注意が必要だ。【詳細】最近5週間の滝川保健所管内の報告数は、第42週が1人（0.5人）、第43週が1人（0.5人）、第44週が2人（1.0人）、第45週が2人（1.0人）、第46週が10人（5.0人）と、第46週に急に増えた。手足口病の警報は、厚生労働省の感染症発生動向調査により把握した、全道の定点医療機関を受診した手足口病患者数が、国立感染症研究所が設定した警報レベルの基準値に達したときに発令され、大きな流行の発生や継続が疑われることを指す。警報の開始基準値は定点あたり5人、終息基準値は2人だ。【ポイント・注意点】治癒後も3週間から4週間は原因ウイルスが便中に排出され、感染しても発症しない例も多いため、感染者との接触を避けることは現実的に困難であり、特別な予防法はない。手洗いやうがいを励行するとともに、集団生活ではタオルなどの共用は避けることが大切だ。水疱は1週間から10日で自然に消えるが、ごくまれに髄膜炎や脳炎を生じることがあるので、持続する発熱や嘔吐、頭痛がある場合は注意が必要だ。口の中の痛みで水分がとりにくくなることもあるため、水分がとれているかどうかにも気を配り、水分がとれないときは医療機関へ相談してほしい。","2026-11-19","北海道赤平市","https://www.city.akabira.hokkaido.jp/docs/2015081900017.html"],["愛知のインフルエンザ 14歳以下が中心 学年閉鎖4校・学級閉鎖63校","愛知県感染症情報センターが11月19日に発表した11月9日〜15日の感染症情報によると、インフルエンザの定点あたり報告数は11.57人、患者数は1886人で、前週の1.04倍と微増が続いている。年齢別では14歳以下を中心とした感染が目立ち、学校では学年閉鎖が4校、学級閉鎖が63校発生した。名古屋のほか、衣浦東部や岡崎、豊川で患者数が目立っている。流行は今も続いており、家庭や学校での感染予防が大切だ。","\n【概要】愛知県感染症情報センターは、11月9日〜15日における県内の感染症発生状況を発表した。インフルエンザの定点あたり報告数は11.57人、患者数は1886人で、前週（1812人）の1.04倍と微増傾向が続いている。年齢別では、14歳以下を中心とした感染が目立ち、学校では学年閉鎖が4校、学級閉鎖が63校発生した。【背景】愛知県のインフルエンザは、10月19日〜25日の週にも患者数が1.11倍と増加傾向にあり、各地で学級閉鎖が相次いでいた。11月9日〜15日の週も微増が続き、流行が収まっていない。名古屋のほか、衣浦東部や岡崎、豊川で患者数が目立っている。学校や園での集団発生が続いており、子どもたちの間での流行が広がっていることがうかがえる。【詳細】愛知県内の幼稚園・保育園・小学校・中学校・高等学校などでは、インフルエンザによる休校・休園、学年閉鎖・学級閉鎖の措置がとられている。11月9日〜15日の週は、学年閉鎖が4校、学級閉鎖が63校発生した。年齢別では14歳以下を中心に感染が目立っており、学校や園での流行が続いている。患者数は1886人で、前週の1812人から74人増えた。定点あたり報告数は11.57人で、注意報レベルの基準である10人を超えている。【ポイント・注意点】インフルエンザの予防の基本は、外出後の手洗いや、こまめな換気、十分な休養とバランスの取れた食事だ。熱のある朝は登校や登園を控え、熱が下がっても、すぐには登校や登園ができない決まりがあるので、学校や園の指示に従って休ませることが大切だ。まだワクチンを受けていない人は、今からでも接種を検討してほしい。子どもが熱を出したら、熱や咳の様子をメモして受診時に伝え、家では水分をこまめにとらせることが大切だ。けいれんや意識の変化、呼吸が苦しそうな様子があれば、すぐに医療機関に相談してほしい。インフルエンザの流行は、地域によって広がり方が異なる。家庭や学校では、こまめな情報収集と感染予防を心がけ、体調が悪いときは無理をせず休むことが大切だ。冬に向けて流行がさらに広がるおそれもあり、基本的な対策を続けたい。","2026-11-19","中京テレビNEWS NNN","https://news.ntv.co.jp/n/ctv/category/life/cta4152e7034c648d1aa6325080e890464"],["ノロウイルスによる胃腸炎 11月から増加へ 消毒液の備えを","ノロウイルスなどによる感染性胃腸炎は例年11月ごろから増え始め、12月から翌年1月にピークを迎える。全国の定点あたり報告数は11月2日〜8日の週で3.14人と、まだ流行の立ち上がり段階だが、東京都は11月6日に注意を呼びかけ、保育所を中心に集団感染が報告され始めている。アルコール消毒が効きにくいため、石けんと流水での手洗いと、塩素系漂白剤での消毒が大切だ。これからの1〜2か月が最も注意が必要な時期であり、手洗いと消毒の備えを整えたい。","\n【概要】ノロウイルスなどによる感染性胃腸炎は、例年11月ごろから増え始め、12月から翌年1月にピークを迎えるため、2026年もこれからの1〜2か月が最も注意が必要な時期だ。国立健康危機管理研究機構の速報によると、2026年第45週（11月2日〜8日）の感染性胃腸炎の定点あたり報告数は全国で3.14人で、前週の3.25人からは横ばいだった。東京都は11月6日に「感染性胃腸炎にご注意ください」と報道発表し、都内の保育所を中心に集団感染が報告され始めている。【背景】ノロウイルスは、手指や食品を介して口から入り、腸で増えるウイルスだ。厚生労働省のQ&Aによると、潜伏期間は24〜48時間で、主な症状は吐き気、嘔吐、下痢、腹痛だ。発熱は軽いことが多く、通常は1〜2日で治まり後遺症も残らないとされているが、子どもや高齢者では脱水や、吐いたものをのどに詰まらせる窒息に注意が必要だ。ノロウイルスは外側に脂の膜を持たないタイプのウイルスで、アルコールが効きにくい。厚生労働省のQ&Aでも、消毒用エタノールでの手指消毒は「石けんと流水での手洗いの代用にはならない」と明記されている。【詳細】都道府県別では、島根が6.45人、大分が6.14人、石川が6.11人と高く、東京は3.38人、大阪は2.62人だった。東京都では、都内の小児科定点で第44週に3.68人となり、11月8日までに保育所15件・小学校1件の集団感染が報告されている。【ポイント・注意点】予防の基本は手洗いだ。厚生労働省は、手に付いたノロウイルスを減らす最も有効な方法は石けんと流水での手洗いだとしていて、こども家庭庁の保育所向けガイドラインでは「石けんを使って30秒以上、流水で」が目安だ。調理の前、食事の前、トイレのあと、おむつ替えや嘔吐物の処理のあとが、特に大事なタイミングだ。家庭でつくる次亜塩素酸ナトリウム消毒液の目安は、原液の濃度が約5%の家庭用塩素系漂白剤なら、0.1%の消毒液は水500ミリリットルに原液10ミリリットル、0.02%は水500ミリリットルに約2ミリリットルだ。製品によって濃度が違うので、ボトルの表示を必ず確認してほしい。嘔吐物の片付けは乾く前に、窓を開けて、手袋とマスクをして行う。症状が出たときは脱水を防ぐことがいちばん大切で、水分がとれないときや、ぐったりしているときは医療機関へ相談してほしい。","2026-11-19","nics-gp","https://nics-gp.co.jp/media/health/norovirus-winter-2026-prevention-disinfectant/"],["小田原の小学校でインフルエンザの学級閉鎖 重症の児童なし","小田原市は11月19日、市立町田小学校でインフルエンザによる学級閉鎖を実施すると発表した。6年2組の在籍21人のうち5人が欠席し、うち2人はインフルエンザと診断されて欠席している。学級閉鎖の期間は11月19日から21日までで、インフルエンザと診断された中で重症化している児童はいない。市教育委員会は各学校や幼稚園にインフルエンザの感染予防の留意事項を周知し、徹底を図っている。","\n【概要】小田原市は11月19日、市立町田小学校でインフルエンザによる学級閉鎖を実施すると発表した。対象は6年2組で、在籍数21人のうち5人が欠席し、うち2人はインフルエンザと診断されて欠席している。学級閉鎖の期間は11月19日（木）から21日（土）までだ。インフルエンザと診断された中で、重症化している児童はいない。市教育委員会では、各学校、各幼稚園などにインフルエンザの感染予防などの留意事項を周知し、徹底を図っている。【背景】全国的にインフルエンザの流行が続いており、学校や保育施設での学級閉鎖や学年閉鎖も各地で相次いでいる。インフルエンザにかかると、高い熱や頭痛、全身のだるさなどが急に出ることが多く、のどの痛みや鼻水、咳などの症状もみられる。子どもではまれに重症になることもあるため、早めの対応が大切だ。学級閉鎖は、クラス内で感染が広がるのを防ぎ、子どもたちの回復を待つための措置だ。【詳細】町田小学校の6年2組では、在籍21人のうち5人が欠席し、うち2人がインフルエンザと診断されて欠席している。学級閉鎖の期間は11月19日から21日までの3日間だ。市は、インフルエンザと診断された中で重症化している児童はいないとしている。市教育委員会は、各学校や幼稚園などにインフルエンザの感染予防などの留意事項を周知し、徹底を図っている。学級閉鎖は、クラス内で感染が広がるのを防ぎ、子どもたちの回復を待つための措置だ。【ポイント・注意点】インフルエンザの予防の基本は、外出後の手洗いや、こまめな換気、十分な休養とバランスの取れた食事だ。熱のある朝は登校や登園を控え、熱が下がっても、すぐには登校や登園ができない決まりがあるので、学校や園の指示に従って休ませることが大切だ。まだワクチンを受けていない人は、今からでも接種を検討してほしい。子どもが熱を出したら、熱や咳の様子をメモして受診時に伝え、家では水分をこまめにとらせることが大切だ。けいれんや意識の変化、呼吸が苦しそうな様子があれば、すぐに医療機関に相談してほしい。","2026-11-19","小田原市","https://www.city.odawara.kanagawa.jp/press/detail.php?prs_id=13999"],["富山でインフルエンザが2週連続増加 注意報基準の10人超える","富山県は11月18日、インフルエンザの患者数が注意報レベルの基準である1医療機関あたり10人を超えたと発表した。11月15日までの1週間の定点あたり患者数は12.58人で、前の週より1.66人増加し、増加は2週連続となった。18日時点で、朝日町の小学校1年生が学年閉鎖、高岡第一高校の1年生1クラスと富山市の熊野小学校4年生1クラスが学級閉鎖となっている。流行は今も続いており、家庭や学校での感染予防が大切だ。","\n【概要】富山県は11月18日、インフルエンザの患者数が注意報レベルの基準である「1医療機関あたり10人」を超えたと発表した。患者数の増加は2週連続で、すでに複数の学校で学級閉鎖などの影響が出ている。県によると、11月15日までの1週間に報告された1医療機関あたりのインフルエンザの患者数は12.58人で、注意報レベルの基準である10人を超え、前の週よりも1.66人増加した。【背景】県内の各厚生センター・保健所の管内別では、富山市管内が最も多く、新川、高岡、砺波管内で先週から増加した。全国的にもインフルエンザの流行が続いており、各地で学級閉鎖や学年閉鎖が相次いでいる。インフルエンザにかかると、高い熱や頭痛、全身のだるさなどが急に出ることが多く、のどの痛みや鼻水、咳などの症状もみられる。子どもではまれに重症になることもあるため、早めの対応が大切だ。【詳細】18日時点で、朝日町のさみさと小学校の1年生が学年閉鎖、高岡第一高校の1年生1クラス、富山市の熊野小学校4年生1クラスがそれぞれ学級閉鎖となっている。富山県の定点あたり患者数は12.58人で、注意報レベルの基準である10人を2.58人上回った。増加は2週連続で、流行が広がりつつあることがうかがえる。学級閉鎖や学年閉鎖が増えると、子どもたちの学びや、看病する家庭の負担にも影響が出る。【ポイント・注意点】インフルエンザの予防の基本は、外出後の手洗いや、こまめな換気、十分な休養とバランスの取れた食事だ。熱のある朝は登校や登園を控え、熱が下がっても、すぐには登校や登園ができない決まりがあるので、学校や園の指示に従って休ませることが大切だ。まだワクチンを受けていない人は、今からでも接種を検討してほしい。子どもが熱を出したら、熱や咳の様子をメモして受診時に伝え、家では水分をこまめにとらせることが大切だ。けいれんや意識の変化、呼吸が苦しそうな様子があれば、すぐに医療機関に相談してほしい。冬に向けて流行がさらに広がるおそれがあるため、家庭や学校での感染予防を心がけたい。体調が悪いときは無理をせず休み、周囲への感染を広げないことも大切だ。","2026-11-18","チューリップテレビ","https://newsdig.tbs.co.jp/articles/tut/3095584?display=1"],["手術前の不安 ゲームで和らぐ? 4〜14歳の子どもの試験で","米エール大学の研究で、全身麻酔の手術を前に運転ゲームで遊ぶと、4〜14歳の子どもの手術前の不安の高まりが抑えられる可能性が分かった。研究成果はJournal of Clinical Anesthesiaに掲載された。持ち運べる大画面の装置でレゴバットマンのレースゲームを遊び、子どもは受動的にも能動的にも参加できる。手術前の不安は回復を難しくすることがあり、不安への対処が大切だという。","\n【概要】米エール大学麻酔科の研究で、全身麻酔の手術を前に運転をテーマにしたビデオゲームで遊ぶと、4〜14歳の子どもの手術前の不安の高まりが抑えられる可能性が分かった。研究成果はJournal of Clinical Anesthesiaに掲載された。子どもたちは全身麻酔を使う手術を受ける予定だった。手術前の不安は子どもによくみられ、回復を難しくすることがあるため、不安への対処が大切だとされている。【背景】研究では、持ち運べる「ベッドサイド・エンターテインメント・アンド・リラクゼーション・シアター（BERT）」という装置を使った。装置は手術台に取り付けたプロジェクターで、ベッドの足元に画面を映し出す。遊んだのはレゴバットマンのレースゲームで、ハンドルを使わなくてもコースを走り続けるため、子どもは能動的にも受動的にも参加できる。暴力的でも複雑でもなく、小さな子でも年長の子でも使えるものだ。研究チームは、子どもが周りの手術室のスタッフを意識しながら、積極的に関われる仕組みを重視した。【詳細】研究の結果、BERTを使ったグループの子どもたちは、通常のケアを受けた子どもたちと比べて、麻酔の導入前の不安の増加が有意に小さかった。没入感のあるビデオゲームが、手術への心配から子どもの気をそらし、不安を和らげたという。子どもたちは、麻酔の効果を感じ始めてからもゲームを続けようとすることが多く、たいてい1分ほど遊んでからマスクが装着された。手術室のスタッフもこの装置を好意的に受け止め、設置や片付けを手伝うようになったという。エール・ニューヘイブン病院のチームは、現在もBERTを使い続けている。【ポイント・注意点】手術前の不安は、子どもにとって大きな負担になるだけでなく、回復を難しくすることもある。ゲームや映像といった、子どもが楽しみながら気をそらせる工夫は、薬に頼らない不安への対処として注目されている。ただし、この研究は一つの病院での試験であり、すべての子どもに同じ効果があるとは限らない。子どもが手術を受けるときは、事前に病院のスタッフと話し合い、子どもが安心できる方法を一緒に考えることが大切だ。手術の前には、子どもが何をされるのかを年齢に合った言葉で説明し、質問に答えてあげることも、不安を和らげる助けになる。","2026-11-18","medicalxpress","https://medicalxpress.com/news/2026-11-video-games-presurgery-anxiety-children.html"],["千葉の新型コロナ感染者 0.88倍に減少 10歳未満と10代が最多","千葉県は11月18日、11月9日〜15日の新型コロナウイルス感染者報告数を発表した。16保健所のうち海匝を除く15保健所で感染の報告があり、合計151人、1医療機関あたり平均0.83人で、前週の0.94人から減少した。年代別では10歳未満と10代が最も多く、次いで20代、50代、70代と続いた。感染者は減っているものの、子ども世代が中心であることには変わりがない。","\n【概要】千葉県は11月18日、11月9日〜15日の各定点医療機関での新型コロナウイルス感染者報告数を発表した。全16保健所のうち海匝を除く15保健所で感染の報告があり、合計感染者数は151人だった。1医療機関あたり平均0.83人で、前週の0.94人から減少し、感染者は前週の0.88倍となった。年代別では10歳未満と10代が最も多く、次いで20代、50代および70代と続いた。【背景】千葉県でも、11月9日〜15日の週は感染者が減ったが、年代別では10歳未満と10代が最も多いという傾向が続いている。新型コロナウイルスは、子どもが感染したときは発熱や咳、のどの痛みなどの症状が出ることが多く、まれに重症化することもある。感染者が減っている時期でも、子ども世代を中心に感染が続いていることに変わりはなく、基本の予防を続けることが大切だ。【詳細】千葉県の11月9日〜15日の感染者報告数は、合計151人、1医療機関あたり平均0.83人で、前週の0.94人から0.11人減少した。感染者は前週の0.88倍となった。15の保健所で感染の報告があり、海匝保健所では報告がなかった。年代別では、10歳未満と10代が最も多く、次いで20代、50代、70代と続いた。感染者は減っているものの、子ども世代が中心であることには変わりがない。【ポイント・注意点】新型コロナウイルスの感染者は減っているものの、子ども世代が中心であることには変わりがない。子どもが感染したときは、発熱や咳、のどの痛みなどの症状が出ることが多く、まれに重症化することもある。外出後の手洗いや、こまめな換気、十分な休養とバランスの取れた食事が、基本の予防になる。子どもが熱を出したら、熱や咳の様子をメモして受診時に伝え、家では水分をこまめにとらせることが大切だ。家族に咳が続く人がいるときは、子どもとの距離にも気を配りたい。感染が疑われるときは、無理に登校や登園をさせず、かかりつけ医に相談してほしい。新型コロナウイルスは、季節によって増減を繰り返す。家庭や学校では、体調が悪いときは無理をせず休み、周囲への感染を広げないことが大切だ。基本の予防を続けることが、子どもを守ることにつながる。","2026-11-18","Yahoo!ニュース（千葉日報オンライン）","https://news.yahoo.co.jp/articles/5e3976af72acbaac94adc77393fa5a1a251332ab"],["おもちゃやシャンプーの化学物質 子どもの肝臓への影響を調査","韓国の研究チームが、プラスチック製品やシャンプーなど身の回りの製品に含まれるビスフェノールAやフタル酸エステルといった化学物質への曝露と、思春期の肝機能との関係を調べた。126人の子どもを追跡した結果、曝露の時期や性別によって肝酵素との関連の推定値に違いが見られたが、全体の関連は統計的に有意ではなく、因果関係や肝臓への害は示されていない。研究成果はScientific Reportsに掲載された。","\n【概要】韓国の研究チームが、プラスチック製品やシャンプーなど身の回りの製品に含まれる化学物質への曝露と、思春期の肝機能との関係を調べた。研究成果はScientific Reportsに掲載された。対象となったのは、ビスフェノールA（BPA）とフタル酸エステル類だ。子ども126人を追跡した結果、曝露の時期や性別によって肝酵素との関連の推定値に違いが見られたが、全体の関連は統計的に有意ではなく、因果関係や肝臓への害は示されていない。【背景】子どもは、食品容器やおもちゃ、シャンプー、ローションなど、日常の製品を通じて内分泌かく乱化学物質に触れている。BPAはプラスチックの製造に使われ、フタル酸エステル類は可塑剤やパーソナルケア製品の成分として広く使われている。子どもの体の仕組みはまだ発達途中で、体重あたりに食べる量や吸う空気の量が多いため、環境への曝露に特に弱い可能性がある。実験研究では、BPAやフタル酸エステル類の混合物が、酸化ストレスや炎症、脂質の調節の変化を通じて肝臓の代謝に干渉する可能性が示唆されている。肝酵素の上昇は、代謝の不調の目安になることがある。【詳細】研究では、韓国の梨花女子大学付属木洞病院でつくられた梨花出生成長コホートのデータを使った。幼児期（3〜5歳）と学童期（7〜9歳）に尿中のBPAと9種類のフタル酸エステル代謝物を測り、思春期（10〜15歳）に肝酵素を測った126人の子どもが分析の対象となった。肝臓の健康の目安として、血清中のAST、ALT、γ-GTPを測り、ASTとALTの比も計算した。【ポイント・注意点】この研究は、子どものころの化学物質への曝露と、思春期の肝酵素との関連を、2つの発達段階にわたって調べた初めての前向き研究だ。ただし、全体の関連は統計的に有意ではなく、因果関係や肝臓への害は示されていない。対象が126人と少なく、1回の尿検査だけに頼っていること、BPAやフタル酸エステル類は体内に残る時間が短いこと、思春期の喫煙や飲酒といった生活習慣が測られていないこと、韓国の限られた地域の子どもだけが対象であることが、結果の解釈を限っている。日用品の化学物質を過度に恐れる必要はないが、食品容器の使い方や、子どもの身の回りの製品の選び方に気をつけることは、家庭でできる備えの一つだ。","2026-11-17","news-medical.net","https://www.news-medical.net/news/20261117/From-plastic-toys-to-shampoo-Could-everyday-chemicals-influence-childrens-liver-health.aspx"]],"dev":[["ゲームとスマホの使い方が思春期の実行機能と関連 3年追跡で判明","ブラジルの研究チームが141人の思春期の若者を3年間追跡し、画面を使う行動と実行機能の関係を調べた。女子ではゲームの使用量とストループ課題の成績に山なりの関係が見られ、男子では携帯電話の使用量が多いほど正確さが下がる傾向があった。脳由来神経栄養因子との関連は見られなかった。画面の種類や使い方、男女の違いを分けて考える必要があることを示す結果だ。調査はブラジルで行われ、実行機能はストループ課題で評価された。","\n【概要】ブラジルの研究チームは、141人の思春期の若者を3年間追跡し、ゲームや携帯電話、動画視聴といった画面を使う行動が実行機能にどう関係するかを調べた。女子ではゲームの使用量と注意や切り替えの力を測るストループ課題の成績に山なりの関係が見られ、男子では携帯電話の使用量が多いほど課題の正確さが下がる傾向があった。血液中の脳由来神経栄養因子との関連は見られなかった。\n\n【背景】思春期は実行機能が大きく伸びる時期で、画面時間の影響をめぐっては心配の声が多い。一方で、画面の使い方をひとくくりにした議論では、種類による違いや男女差が見えにくくなる。今回の研究は、行動の種類ごとに分けて、3年後の認知機能との関係を調べた点が特徴だ。\n\n【詳細】対象は141人で、女子が51パーセント。2016年の開始時に平均12歳で、3年後の2019年に平均15歳で再評価を受けた。男子では、開始時の携帯電話の使用量が多いほど、ストループ課題の一致条件の正確さが低かった。回帰係数はマイナス0.552だった。動画視聴にも山なりの関係が見られた。女子では、開始時のゲーム使用量とストループ課題の不一致条件の正確さに山なりの関係があり、回帰係数はマイナス3.761、干渉の指標では0.035だった。どちらも誤発見率の補正後も有意だった。3年間の使用量の変化と実行機能の関係は、補正後には有意でなくなった。脳由来神経栄養因子との関連は検出されなかった。\n\n【ポイント・注意点】画面の種類や量、性別によって関係の形が違うため、「画面は一律に悪い」とは言えない。山なりの関係は、適度な使用と過度な使用で意味が変わる可能性を示す。ただし観察研究のため因果関係は分からず、対象はブラジルの141人と規模は小さい。家庭では、使う内容や時間の区切りを子どもと一緒に決め、勉強や睡眠、運動とのバランスを見ることが大切だ。研究はブラジルの思春期の若者を対象にしたもので、画面の種類ごとに分けて分析した点が特徴だ。画面の使い方と実行機能の関係は、男女で異なる形で現れた。","2026-11-22","scienmag","https://scienmag.com/adolescent-videogame-and-phone-use-linked-to-executive-function-in-study/"],["身長の伸びは時期で遺伝の働きが変わる ノルウェー7万人の解析","ノルウェーの7万2704人の子どもを対象に、出生から小児期の身長を調べた大規模な遺伝解析で、身長に関わる遺伝子の働きが成長の時期によって変わることが分かった。乳児期と小児期、生涯を通じた3つの遺伝子群が見つかり、胎児期の発育が小さいことや思春期前の身長が高いことが、成人後の2型糖尿病のリスク上昇と関係した。成長の記録が将来の健康を知る手がかりになる。英国のバイオバンクのデータも組み合わせて分析された。","\n【概要】ノルウェーの子ども7万2704人を対象に、出生から小児期までの身長測定57万4580件を解析したところ、身長に関わる遺伝子の働きが成長の時期によって変わることが分かった。乳児期、小児期、生涯を通じた3つの遺伝子群が見つかった。さらに、胎児期の発育が小さいことや思春期前の身長が高いことが、成人後の2型糖尿病のリスク上昇と関係していた。\n\n【背景】身長は子どもの健康の大切な指標だが、成長を決める遺伝子やたんぱく質の仕組みは、時期によってどう変わるのか十分に分かっていなかった。成人の身長データだけでは、子ども特有の遺伝的な影響は見えにくい。今回の研究は、出生から小児期までの縦断データと英国のバイオバンクのデータを組み合わせて、時期ごとの違いを調べた。\n\n【詳細】ゲノム全体の関連解析では、GLP1R遺伝子の近くなど、子どもに特有の新しい遺伝子効果が見つかった。身長に関わる遺伝子は3つの時期の集まりに分かれ、乳児期と小児期の集まりは内分泌や代謝の経路に、生涯を通じた集まりは骨格の生物学に関係していた。血液のたんぱく質の解析では、思春期前の身長と関連するたんぱく質が106種類見つかり、IGF1、IGF2、IGFBP3の量が小児期の身長の遺伝的スコアと関係した。メンデルランダム化解析では、胎児期の発育が小さいことと、思春期前の身長が高いことが、成人の身長とは別に2型糖尿病のリスクを高めることが示された。\n\n【ポイント・注意点】成長の時期ごとに遺伝子の働きが違うため、子どもの成長曲線は将来の健康を知る手がかりになる。ただし、今回の結果は主にノルウェーと英国のデータに基づくもので、他の集団でも同じかは検証が必要だ。身長そのものが病気を決めるわけではなく、成長の記録を定期健診で見守り、気になる変化があれば小児科医に相談することが大切だ。身長に関わるたんぱく質が106種類見つかったことは、成長の仕組みの解明につながる成果で、IGF1などの量が遺伝的なスコアと関係した。子どもの身長の遺伝的な影響は、成人のデータだけでは見えにくいことが示された。","2026-11-22","Nature Communications","https://www.nature.com/articles/s41467-026-79465-x"],["文の意味をとらえる脳の働き 子どもと青年で違い 21日発表","子ども28人と青年31人を対象に、脳波で文の意味を理解するときの脳のネットワークを調べた研究で、子どもは正しい文を聞くときに脳のネットワークが効率よくまとまって働くことが分かった。意味のおかしい文では両者の違いは消えた。子どもは意味をつなげるために脳のネットワークを強く使う一方、青年はより広い仕組みで理解している可能性が示された。脳波のシータ波に注目し、文を聞くときの脳のつながりを調べた。","\n【概要】8歳から10歳の子ども28人と、12歳から14歳の青年31人を対象に、脳波で文の意味を理解するときの脳のネットワークを調べた研究が発表された。正しい文を聞くとき、子どもは脳のネットワークが効率よくまとまって働いていたが、意味のおかしい文では両者の違いは消えた。子どもの言葉の理解の仕組みが、成長とともに変わっていく様子が示された。\n\n【背景】言葉の理解には、脳のあちこちの情報をつなげる必要がある。どのように脳のネットワークが成長とともに変わるのかは、まだよく分かっていなかった。今回の研究は、脳波のシータ波と呼ばれる4から8ヘルツの帯域に注目し、文を聞いている最中の脳のつながり方をグラフ理論で調べた。\n\n【詳細】参加者は、正しい文と、動作主と動作の組み合わせがおかしい文を聞いた。研究チームは、意味の処理に関わるN400と呼ばれる時間帯の脳のネットワークを調べ、全体効率、局所効率、モジュール性の3つの指標を出した。3つの指標すべてで、年齢と文の条件の交互作用が見られた。正しい文のとき、子どもは青年より全体効率、局所効率、モジュール性が高かったが、意味のおかしい文では両者に差がなかった。子どもでは、文の処理が上手な子ほど、意味のおかしい文のときにモジュール性が低かった。\n\n【ポイント・注意点】子どもは意味をつなげるときに、まとまった脳のネットワークに強く頼っていると考えられる。青年では正しい文のときの値が低いことから、複数の周波数帯を組み合わせたより広い仕組みで理解している可能性がある。対象は59人と少なく、聞く課題だけの結果なので、読む場合や会話の場合に同じかは分からない。子どもの言葉の発達を支えるには、文脈のある豊かなやり取りが大切だと考えられる。脳波の計測は、子どもが文を聞いている最中の脳の働きをとらえる方法で、発達の研究に広く使われている。言葉の理解の仕組みは、成長とともに変わっていく。脳波のシータ波は、言葉の理解や記憶と関わる脳の活動をとらえる手がかりになり、発達の研究で注目されている。","2026-11-21","Scientific Reports","https://www.nature.com/articles/s41598-026-81895-y"],["生後1週の皮膚がアトピー発症を予測 シンガポール119人の研究","シンガポールの出生コホートで、生後1週から18か月まで119人の乳児の皮膚を調べた研究で、アトピー性皮膚炎を発症する子は、発症する前から皮膚の菌や分子の状態が違うことが分かった。健康な子は皮膚の菌の多様性が増えたが、発症する子は生後1週で特定の菌が増えていた。皮膚のテープで採る検査で、将来の発症リスクを早い時期に見分けられる可能性が示された。皮膚のテープ採取による遺伝子や代謝物の解析を組み合わせた。","\n【概要】シンガポールの出生コホートで、119人の乳児の皮膚を生後1週から18か月まで追跡した研究で、アトピー性皮膚炎を発症する子は、発症する前から皮膚の菌や分子の状態が違うことが分かった。健康な子は皮膚の菌の多様性が増えていったが、発症する子は生後1週の時点で特定の菌が増えていた。皮膚にテープを貼るだけの検査で、将来の発症リスクを早く見分けられる可能性が示された。\n\n【背景】アトピー性皮膚炎のリスクが高い乳児を早く見つけることは、予防につなげるうえで大切だが、発症前に使える目印はほとんどなかった。今回の研究は、シンガポールのS-PRESTOコホートで、皮膚のテープ採取による遺伝子や代謝物、たんぱく質の解析を組み合わせ、発症を予測できるかを調べた。\n\n【詳細】対象は119人で、アトピー性皮膚炎と診断された子が60人、対照が59人だった。皮膚のテープは生後1週、3か月、6か月、18か月に採取し、18か月までに医師が診断した発症を調べた。健康な乳児では、皮膚の菌がブドウ球菌の一種から脂を好む常在菌へと移り変わり、酪酸の発酵や天然保湿因子の増加が見られた。一方、発症した子では生後1週でシュードモナス・スタッツェリが、3か月で黄色ブドウ球菌が増え、抗菌ペプチドが早くから増えていた。予測モデルは、生後1週では菌とペプチドの目印、3か月では持続する炎症の目印でリスクをよく分けた。\n\n【ポイント・注意点】皮膚のテープ検査は痛みが少なく、乳児にも使いやすい方法だ。ただし、対象はシンガポールの119人と少なく、他の地域や肌のタイプでも同じ目印が使えるかは検証が必要だ。予測はあくまでリスクの目安で、発症そのものを決めるものではない。皮膚の保湿や清潔など、日々のスキンケアを続けることが大切だ。皮膚のテープ採取は、針を使わずに皮膚の表面の情報を集められる方法で、乳児の研究に適している。発症前にリスクを見分けることが、予防につながると期待される。アトピー性皮膚炎は、乳児期に発症することが多い皮膚の病気で、かゆみや湿疹が特徴だ。","2026-11-21","scienmag","https://scienmag.com/early-skin-molecular-signatures-predict-atopic-dermatitis-risk-in-asian-infant-cohort/"],["恵まれない地域で育つ子の心の悩みが多く 249組を追跡","米国ペンシルベニア大学などの研究チームが、フィラデルフィア地域の母子249組を追跡したところ、住む地域の環境が恵まれないほど、幼い子の社会性や感情の悩みが多いことが分かった。家庭の収入に関わらず見られ、4歳で最も強かった。黒人や多民族の家庭で影響が大きく、子どもの健やかな発達には家庭だけでなく地域への投資も大切だと研究チームは述べている。結果はJAMA Network Openに発表された。","\n【概要】米国ペンシルベニア大学とフィラデルフィア小児病院の研究チームが、フィラデルフィア地域の母子249組を追跡したところ、住む地域の環境が恵まれないほど、幼い子の社会性や感情面の悩みが多いことが分かった。この関係は家庭の収入に関わらず見られ、4歳の時点で最も強かった。黒人や多民族の家庭で影響が大きく、子どもの健やかな発達には家庭だけでなく地域への投資も大切だと研究チームは述べている。\n\n【背景】これまで、地域の環境が子どもに与える影響は、学校の質や緑地、暑さなど1つか2つの指標で調べられることが多く、乳幼児を対象にした研究は少なかった。今回の研究は、経済的な資源、学校の質、汚染、暑さ、安全な屋外空間、貧困、交通、住宅密度などを組み合わせた新しい指標を作り、地域の不利さと発達の悩みの関係を調べた。\n\n【詳細】研究チームは、2021年6月から2025年3月にかけて、フィラデルフィア地域の母子249組を追跡し、子どもが1歳、2歳、4歳のときに評価した。母親への聞き取りと健康記録から、言葉の遅れ、自閉症、注意欠如・多動症、不安、素行の問題などの診断や支援への紹介を調べた。その結果、恵まれない地域に住む子ほど、発達や行動の診断を受けたり、支援に紹介されたりする割合が高かった。社会性や感情の困難は、年齢が上がるほど目立ち、4歳で最も強かった。歴史的な人種隔離や投資不足を背景に、黒人や多民族の家庭ほど恵まれない地域に住む割合が高く、影響も強かった。\n\n【ポイント・注意点】地域の環境と子どもの発達の関係は、家庭の収入だけでは説明できない。緑地や安全な遊び場、学校の質など、地域全体の環境を整えることが、子どもの発達を支えるうえで大切だ。ただし、対象はフィラデルフィア地域の249組で、他の地域でも同じかは検証が必要だ。気になる様子があれば、早めに小児科や支援機関に相談することが勧められる。子どもの発達を支えるには、家庭への支援と地域の環境整備の両方が大切だというのが研究チームの考えで、地域の不利さは家庭の収入だけでは説明できない。","2026-11-20","MedicalXpress","https://medicalxpress.com/news/2026-11-disadvantaged-neighborhood-socioemotional-behavioral-young.html"],["発達の遅れがある幼児の腸内細菌に特徴 16人と20人を比較","3歳以下の発達の遅れがある子ども16人と健康な子ども20人を比べた研究で、発達の遅れがある子どもの腸内細菌に炎症と関わる菌が多く、トリプトファン代謝の乱れが見られた。特定の菌は2.15倍に増え、代謝物の一つは大きく減っていた。腸と脳のつながりが発達に関わる可能性を示す手がかりだが、対象が少なく、確かめるにはもっと大きな研究が必要だ。腸内細菌の量を正確に測る方法と代謝物の解析を組み合わせた。","\n【概要】3歳以下の全体的な発達の遅れがある子ども16人と、健康な子ども20人を比べた研究で、発達の遅れがある子どもの腸内細菌に炎症と関わる特徴が見られた。特定の菌が2.15倍に増え、トリプトファンという物質の代謝の乱れが目立った。腸と脳のつながりが子どもの発達に関わる可能性を示す手がかりだが、対象が少なく、確かめるにはもっと大きな研究が必要だ。\n\n【背景】全体的な発達の遅れは子どもの1から3パーセントに見られ、遺伝子検査をしても40から50パーセントは原因が分からない。腸内細菌と脳のつながりが発達に関わるのではないかと考えられているが、幼い子での研究は少なかった。今回の研究は、腸内細菌の量を正確に測る方法と代謝物の解析を組み合わせて、発達の遅れがある子の腸内の特徴を調べた。\n\n【詳細】研究チームは、3歳以下の発達の遅れがある子ども16人と、年齢を合わせた健康な子ども20人を比べた。腸内細菌の解析では、炎症と関わるルミノコッカス・グナブスという菌のグループが、発達の遅れがある子で2.15倍に増えていた。代謝物の解析では、エチルジエタノールアミンという物質が0.73倍に減り、最も違いが大きい目印だった。トリプトファンの代謝が最も大きく乱れており、キヌレニンやメラトニン、微生物由来のインドール代謝物が増えていた。腸内細菌と代謝物の全体の関係も、発達の遅れがある子で乱れていた。\n\n【ポイント・注意点】今回の研究は16人と20人の小規模な横断研究で、腸内細菌の違いが発達の遅れの原因かどうかは分からない。研究チームも、より大きな集団での検証が必要だとしている。腸内細菌の検査や食事の工夫が発達支援に使える段階ではなく、発達の遅れが気になる場合は、専門の医療機関での評価や支援を受けることが大切だ。今回の研究は、腸内細菌の量を正確に測る方法を使った点が特徴で、従来の相対的な割合だけの解析とは違い、菌の絶対量の違いをとらえた。研究チームは、今後さらに大きな集団で検証する必要があるとしている。","2026-11-20","scienmag","https://scienmag.com/pro-inflammatory-gut-axis-and-metabolic-alterations-identified-in-global-developmental-delay/"],["5歳未満の子 栄養不足と貧血の併発が23％ 44か国19万人の調査","44の低中所得国で5歳未満の子ども19万432人を調べた研究で、栄養不足と貧血の両方がある子が22.85パーセントに上ることが分かった。国による差が大きく、イエメンでは51.67パーセントに達した。母親の教育や家庭の経済力、8回以上の妊婦健診が、両方の問題を減らす方向に関係した。栄養と貧血を別々ではなく一緒に見る対策が求められる。結果はDiscover Public Healthに発表された。","\n【概要】44の低中所得国で5歳未満の子ども19万432人を調べた研究で、栄養不足と貧血の両方がある子が22.85パーセントに上ることが分かった。国による差が大きく、イエメンでは51.67パーセントに達した。母親の教育や家庭の経済力、8回以上の妊婦健診が、両方の問題を減らす方向に関係した。栄養と貧血を別々ではなく一緒に見る対策が求められる。\n\n【背景】子どもの栄養不足と貧血は、5歳未満の死亡の約45パーセントに関わる大きな問題だ。これまでは栄養不足と貧血が別々に調べられることが多かったが、両方が重なると影響はさらに大きい。今回の研究は、44か国の人口保健調査のデータを統合し、両方が重なる割合と、その背景にある要因を調べた。\n\n【詳細】対象は2010年から2025年の調査に参加した5歳未満の子ども19万432人だった。低身長や低体重などの栄養不足を示す指標のいずれかに当てはまる子は36.92パーセントで、栄養不足と貧血の両方がある子は22.85パーセントだった。国別ではアルメニアの2.37パーセントからイエメンの51.67パーセントまで幅があり、サハラ以南のアフリカでは26.63パーセントと高かった。母親が初等教育を受けた子は、両方の問題がある確率が低く、調整オッズ比は0.87だった。裕福な家庭では0.64、8回以上の妊婦健診では0.88だった。一方、母親の貧血は1.35倍、多胎は1.69倍、下痢は1.19倍、発熱は1.17倍と確率を高めた。\n\n【ポイント・注意点】栄養不足と貧血が重なる子は、世界の低中所得国で5人に1人を超える。母親の教育や妊婦健診、清潔な水や衛生環境、家庭の経済的な支えが、両方の問題を減らすうえで大切だ。ただし、調査は横断的なため、因果関係は分からない。日本では状況が大きく異なるが、子どもの健診や食事、鉄分の摂取に気を配ることは、どの国でも大切だ。両方の問題が重なる割合は、国によって2.37パーセントから51.67パーセントまで大きく違い、地域の格差が大きいことが示された。","2026-11-20","bioengineer.org","https://bioengineer.org/malnutrition-and-anemia-coexist-in-nearly-twenty-three-percent-of-under-five-children/"],["離島で育つ若者のしなやかさ 家族と友人が支えに 9人の聞き取り","南大西洋のアセンション島で暮らす13歳から14歳の若者9人を対象にした研究で、家族や友人とのつながりやセントヘレナ島への結び付きが、若者のしなやかさを支えていることが分かった。限られた設備や暑さ、交通の不便さといった課題の中でも、多くの若者が中程度から強いしなやかさを示した。保護者との対話と仲間とのつながりを強めることが今後の課題だ。しなやかさはCYRM-Rという尺度で測られた。","\n【概要】南大西洋のアセンション島で暮らす13歳から14歳の若者9人を対象にした研究で、家族や友人とのつながりやセントヘレナ島への結び付きが、若者のしなやかさを支えていることが分かった。限られた設備や暑さ、交通の不便さといった課題の中でも、多くの若者が中程度から強いしなやかさを示した。保護者との対話と仲間とのつながりを強めることが今後の課題として挙げられた。\n\n【背景】若者のしなやかさは心の健康と深く関わるが、離れた場所で暮らす若者を対象にした研究は少ない。アセンション島は人口が少なく、医療や買い物、交通の便が限られる特殊な環境だ。今回の研究は、社会的・生態学的な枠組みで、若者がどんな資源を使って困難に適応しているかを調べた。\n\n【詳細】対象は島の中学校の9年生と10年生のうち参加した9人で、平均年齢は13歳8か月だった。しなやかさを測る尺度CYRM-Rの合計は35から49点で、平均は43.22点、9人中8人が40点を超え、若者は全体としてしなやかさを示した。聞き取りでは、家族や友人との親密な関係、セントヘレナ島とのつながり、内外の対処の力が、限られた設備や暑さ、交通の制約といった課題から若者を守っていることが分かった。一方、保護者との気持ちの伝え合いや仲間とのつながりの項目は低めで、改善の余地があった。\n\n【ポイント・注意点】離れた環境でも、家族や友人、学校、文化的なつながりが若者の心を支えることが示された。ただし、対象は9人と非常に少なく、1つの島の結果なので、他の地域にそのまま当てはめることはできない。思春期の子どもの心の健康を支えるには、家庭での対話の時間と、仲間とつながる機会を大切にすることが、どの地域でも役立つと考えられる。調査は2024年3月に実施され、2回のグループ討論と尺度への回答を組み合わせた。参加した若者は、島の中学校の9年生と10年生だった。島の人口は少なく、若者が利用できる施設や交通は限られており、そうした環境の中での適応が調べられた。若者のしなやかさは、家族や友人、学校、文化的なつながりといった周りの資源と関わっている。","2026-11-20","Frontiers in Developmental Psychology","https://www.frontiersin.org/journals/developmental-psychology/articles/10.3389/fdpys.2026.1979751/full"],["肥満で治療を受ける若者の3割が中度以上の痛み 437人の調査","米国の4つの医療機関で、肥満の治療を受ける7歳から17歳の若者437人を調べたところ、約3割が中程度以上の痛みを感じ、約4割が日常生活への支障があることが分かった。痛みが強いほど不安や疲れが強く、動きにくさや仲間との関係の悩みも多かった。体重の治療の場で痛みを聞き取ることが大切だと研究チームは述べている。痛みはPROMISという質問票で評価された。対象は米国の4施設の若者だった。","\n【概要】米国の4つの医療機関で、肥満の治療を受ける7歳から17歳の若者437人を調べたところ、約3割が中程度以上の痛みを感じ、約4割が日常生活への支障があることが分かった。痛みが強いほど不安や疲れが強く、動きにくさや仲間との関係の悩みも多かった。体重の治療の場で痛みを聞き取ることが大切だと研究チームは述べている。\n\n【背景】子どもの慢性的な痛みは5人に1人に見られるとされるが、肥満の治療を受ける若者の痛みはあまり調べられていなかった。痛みの専門外来を受診する子の半数以上が過体重や肥満だという報告もある。今回の研究は、米国のStay in Treatment研究に参加した4施設の若者を対象に、痛みの強さと日常生活への影響を調べた。\n\n【詳細】対象は437人で、平均年齢は11.9歳、平均BMIは35.7、95パーセンタイル値の145.9パーセントと重度の肥満だった。痛みの強さの平均は2.5点で、痛みがない子は31.6パーセント、中程度の痛みが26.5パーセント、強い痛みが6.0パーセントだった。日常生活への支障では、中程度が32.5パーセント、重度が7.3パーセントで、合わせて39.8パーセントが臨床的に目立つ支障を抱えていた。痛みの強さと支障は、不安や抑うつ症状、疲れと正の相関があり、相関係数は0.31から0.48だった。一方、動きやすさや仲間との関係の質とは負の相関があり、相関係数はマイナス0.20からマイナス0.34だった。\n\n【ポイント・注意点】肥満の治療では体重だけでなく、痛みの有無を聞き取ることが大切だ。痛みがある子は、体重だけが原因と決めつけられることを心配して話しにくい場合もある。ただし、今回の調査は1時点の横断研究で、痛みと肥満の因果関係は分からない。痛みが3か月以上続く場合は、早めに小児科や専門外来に相談することが勧められる。痛みの評価には、PROMISという質問票が使われ、痛みの強さと日常生活への支障を分けて調べた。体重の治療の場でも、痛みを聞き取ることが大切だと研究チームは述べている。","2026-11-20","scienmag","https://scienmag.com/many-youth-seeking-obesity-treatment-report-moderate-to-severe-pain/"],["離乳期の味の経験が大人の好みを決める マウスの研究","米オハイオ州立大学の研究チームがマウスで調べたところ、離乳後にさまざまな味を経験したマウスは、大人になって甘い水を好むようになった。味を感じる脳の領域の神経回路が、離乳期の経験で作り変えられることが分かった。乳児期の離乳食で多様な味に触れることが、将来の食の好みや健康的な選択につながる可能性を示す研究だ。研究成果は2026年11月15日の神経科学学会で発表された。","\n【概要】米オハイオ州立大学の研究チームがマウスで調べたところ、離乳後にさまざまな味を経験したマウスは、大人になって甘い水を好むようになった。味を感じる脳の領域の神経回路が、離乳期の経験で作り変えられることが分かった。乳児期の離乳食で多様な味に触れることが、将来の食の好みや健康的な選択につながる可能性を示す研究だ。\n\n【背景】幼い頃にさまざまな食べ物を経験すると、生涯にわたって食習慣や味の好みがよくなることは知られているが、脳がどう関わるのかは分かっていなかった。今回の研究は、味覚を担う脳の領域である味覚野に注目し、離乳期の味の経験が神経回路をどう変えるかをマウスで調べた。研究成果は2026年11月15日に神経科学学会で発表された。\n\n【詳細】研究チームは、離乳後のマウスに甘味、塩味、うま味を含む栄養ドリンクを与えた。すると、そのマウスは大人になって甘い水を好むようになり、のどが渇いているときも満腹のときも同じだった。味覚野の神経活動を抑える実験では、離乳期に味の経験をしたマウスは、のどが渇いているときに甘い水を求めにくくなった。一方、満腹のときは甘くない食品添加物マルティンに関心を示し、単に甘いものへの欲求だけでなく、味覚全体が洗練された可能性が示された。離乳後の数週間は、味覚野の抑制性の神経細胞が変化しやすく、経験によって回路が作り変えられる時期だと考えられる。\n\n【ポイント・注意点】今回の結果はマウスの研究で、人間の子どもにそのまま当てはまるかは分からない。離乳期の味の経験が大切な時期である可能性は示されたが、無理に多くの味を与える必要はない。離乳食では、月齢に合ったさまざまな食材を少しずつ試し、甘いものに偏らない食卓を心がけることが大切だ。気になることがあれば小児科医や管理栄養士に相談するとよい。研究チームは、離乳期の経験が脳の回路にどう関わるかをさらに調べている。味覚野の神経細胞の変化が、将来の食の好みにどうつながるのかが今後の課題だ。マウスの離乳期は、人間の乳児期にあたる大切な時期だと考えられている。","2026-11-19","MedicalXpress","https://medicalxpress.com/news/2026-11-child-sweet-affects-adult.html"],["精神科の若者 芸術ワークショップの感じ方は人それぞれ","オーストリアのザルツブルクで、精神科で治療を受ける42人の若者を対象に、美術や音楽、演劇、ダンス、映画のワークショップを行った研究で、感じ方は人によって大きく違うことが分かった。映画が最も好評で、半数以上が将来も芸術が役に立つと感じた。若者の好みに合わせた多様な芸術活動の機会が大切だと示された。モーツァルトの歌劇イドメネオをテーマに実施され、若者の声を聞き取った。","\n【概要】オーストリアのザルツブルクで、精神科で治療を受ける42人の若者を対象に、美術や音楽、演劇、ダンス、映画のワークショップを行った研究で、感じ方は人によって大きく違うことが分かった。映画が最も好評で、半数以上が将来も芸術が役に立つと感じた。若者の好みに合わせた多様な芸術活動の機会が大切だと示された。\n\n【背景】芸術を使った支援は子どもの精神科でも広がっているが、若者自身がどう感じているかを詳しく調べた研究は少なかった。これまでは1つの分野だけを対象にしたり、数値だけの評価が多かった。今回の研究は、モーツァルトの歌劇「イドメネオ」をテーマに、5つの分野のワークショップを行い、若者の声を聞き取った。\n\n【詳細】対象は42人で、平均年齢は16.22歳、女子22人、男子20人だった。3時間のワークショップを10回行い、美術、音楽、演劇、ダンス、映画の各分野を2回ずつ実施した。各回の後、若者は自由記述のアンケートに答えた。どの分野でも半数以上が、芸術が将来の生活で役に立ったり楽しみになったりすると答えた。映画は喜びや楽しさの声が18件と最も多く、否定的な声は少なかった。美術では興奮や誇りとともに緊張の声もあり、演劇では退屈や疲れの声もあった。ダンスでは落ち着きや楽しさとともに疲れの声があった。性別や芸術経験による違いは、補正後には有意ではなかった。\n\n【ポイント・注意点】芸術への感じ方は若者ごとに違い、1つの分野が全員に合うわけではない。映画のように好評な分野もあれば、演劇のように意見が分かれる分野もあった。対象は42人と少なく、1つの病院での探索的な研究なので、効果の有無を結論づけるものではない。学校や家庭でも、子どもが好きな表現の形を選び、無理なく続けられる機会を作ることが大切だ。若者の回答は、4人の評価者が独立して分類し、一致度が高いことが確認された。感じ方は人によって大きく違い、1つの分野が全員に合うわけではないことが示された。芸術活動は、若者が自分の気持ちを表現する機会にもなり、無理なく続けられる形を選ぶことが大切だ。","2026-11-19","scienmag","https://scienmag.com/adolescents-in-psychiatric-care-report-highly-individual-responses-to-arts-workshops/"],["心の病気の打ち明け方 仲間のプログラムで学んだ方法を実践","心の病気を抱える13歳から21歳の若者77人を対象にした研究で、仲間同士で学ぶ「正直に、オープンに、誇りをもって」プログラムの後、若者は相手や場面に合わせて打ち明け方を工夫していることが分かった。打ち明けるかどうかの決め方は、生活の質の変化よりも場面や関係によって決まることが多く、若者の自分で決める力を支える手がかりになる。プログラムは仲間が主導し、打ち明ける枠組みを学ぶものだ。","\n【概要】心の病気を抱える13歳から21歳の若者77人を対象にした研究で、仲間同士で学ぶ「正直に、オープンに、誇りをもって」プログラムの後、若者は相手や場面に合わせて打ち明け方を工夫していることが分かった。打ち明けるかどうかの決め方は、生活の質の変化よりも場面や関係によって決まることが多く、若者の自分で決める力を支える手がかりになる。\n\n【背景】心の病気を周囲に打ち明けるかどうかは、偏見や人間関係、自分の気持ちと関わる難しい選択だ。仲間が主導するHonest, Open, Proudプログラムは、打ち明けるかどうかを考える枠組みを学ぶものだが、学んだ方法が日常生活でどう使われているかは分かっていなかった。今回の研究は、プログラム後の若者の体験を聞き取った。\n\n【詳細】対象は、プログラムに参加した13歳から21歳の若者77人のうち、個別の聞き取りに応じた10人と、2回のグループ討論に参加した5人と3人だった。生活の質の変化を比べるため、向上した若者22人と低下した若者18人を対照的に選んだ。若者は、打ち明ける前に相手の態度を確かめたり、場面に合わせて話す量を調整したりしていた。過去の打ち明けの結果が、その後の決め方に影響していた。生活の質の変化による大きな違いは見られず、3つの型が見つかった。すでにあった方法を強めた「管理された打ち明け」、準備をして行う「意識的な打ち明け」、場面に応じて絞る「思慮深く限られた打ち明け」だった。\n\n【ポイント・注意点】打ち明け方は一度決めたら終わりではなく、相手や場面によって変わる ongoing な過程だ。若者はプログラムで、打ち明けるかどうかの選択肢と自信を広げていた。ただし、対象は聞き取りに応じた一部の若者で、すべての若者に当てはまるわけではない。子どもが心の悩みを話すときは、無理に聞き出さず、安心して話せる場を用意し、必要なら専門機関につなぐことが大切だ。打ち明け方の3つの型は、プログラムで学んだ方法を日常生活でどう使うかを整理したものだ。","2026-11-19","scienmag","https://scienmag.com/adolescents-apply-learned-peer-program-strategies-to-navigate-mental-illness-disclosure/"],["重度の小児肥満 APBA1遺伝子の変異を初めて確認 2人の症例","ドイツのウルム大学の研究チームが、重度の早期発症肥満の子ども209人の遺伝子を調べたところ、APBA1遺伝子の変異を持つ2人が見つかった。2人とも食欲が強く、言葉の発達の遅れがあった。APBA1はこれまで成人の肥満の遺伝子と考えられていたが、子どもの肥満や神経発達にも関わることが示され、遺伝子検査への追加が提案された。2人とも母親から変異を受け継いでいた。症例は2人だけだった。","\n【概要】ドイツのウルム大学の研究チームが、重度の早期発症肥満の子ども209人の遺伝子を調べたところ、APBA1遺伝子の変異を持つ2人が見つかった。2人とも食欲が強く、言葉の発達の遅れがあった。APBA1はこれまで成人の肥満の遺伝子と考えられていたが、子どもの肥満や神経発達にも関わることが示され、遺伝子検査への追加が提案された。\n\n【背景】重度の早期発症肥満の一部は、食欲を調節する脳の仕組みの遺伝子変異が原因だ。APBA1遺伝子の変異は、これまで成人の肥満に関わるものとして知られ、子どもの症例は報告がなかった。今回の研究は、重度の肥満で遺伝子検査を受けた子ども209人のデータを調べ直し、APBA1の変異が子どもの肥満に関わるかを調べた。\n\n【詳細】1人目は15歳の男子で、BMIは33.7、体脂肪率は49.5パーセント、食欲の強さを示すスコアは55点中27点だった。知能指数は84で、表出性の言葉の遅れと発達性ディスレクシアがあった。APBA1のナンセンス変異が見つかり、母親から受け継いでいた。母親もBMI48.1の重度肥満で、発達性ディスレクシアがあった。2人目は6歳の男子で、BMIは30.0、体脂肪率は43.6パーセント、食欲スコアは55点中32点だった。完全な文を作れないほど言葉の遅れがあり、5歳から言語療法と理学療法を受けていた。APBA1のスプライス変異が見つかり、母親から受け継いでいた。母親の最大体重は125キログラムだった。\n\n【ポイント・注意点】APBA1は、食欲を調節する脳の神経受容体の働きに関わると考えられ、子どもの肥満と神経発達の両方に関係する可能性がある。ただし、症例は2人だけで、結論を出すにはもっと多くの症例が必要だ。遺伝子の変異が見つかったからといって、子どもの将来が決まるわけではない。肥満や言葉の遅れが気になる場合は、小児科や専門外来で相談し、食事や運動、療育の支援を受けることが大切だ。2人の症例は、209人の子どもの遺伝子データを調べ直す中で見つかった。","2026-11-19","bioengineer.org","https://bioengineer.org/rare-apba1-genetic-variants-identified-in-children-with-severe-monogenic-obesity/"],["生後6か月の脳のつながりが睡眠と感覚の悩みと関係 自閉症リスクの乳児","自閉症のきょうだいがいる乳児62人を含む101人を調べた研究で、生後6か月の脳のつながり方が、その後の寝つきの悪さや感覚への過敏さと関係することが分かった。自閉症の家族歴がある乳児では、脳の島と感覚をつかさどる部分のつながりが強かった。生後6か月の脳の状態が、後の発達の手がかりになる可能性が示された。脳の画像は自然な眠りの最中に撮影され、101人の乳児が対象だった。","\n【概要】自閉症のきょうだいがいる乳児62人を含む101人を調べた研究で、生後6か月の脳のつながり方が、その後の寝つきの悪さや感覚への過敏さと関係することが分かった。自閉症の家族歴がある乳児では、脳の島と感覚をつかさどる部分のつながりが強かった。生後6か月の脳の状態が、後の発達の手がかりになる可能性が示された。\n\n【背景】睡眠の悩みと感覚の過敏さは、自閉症の子に多い早い時期からの特徴で、言葉や運動、認知の発達にも影響する。睡眠の悩みは自閉症の子の最大で80パーセントに見られるという。これまで、乳児期の脳のつながりとこうした特徴の関係は分かっていなかった。今回の研究は、生後6か月の脳の画像から、後の睡眠や感覚の様子を予測できるかを調べた。\n\n【詳細】対象は生後6か月の乳児101人で、自閉症のきょうだいがいる高リスク群が62人、家族歴のない低リスク群が39人だった。自然な眠りの最中に脳の画像を撮り、右前部島と呼ばれる脳の部位と、感覚運動野や小脳のつながりを調べた。高リスク群では、島と左の感覚運動野のつながりが強く、島と小脳のつながりが弱かった。高リスク群では、生後6か月の島と右の感覚運動野のつながりが強いほど、その時点の寝つきの悪さが強く、生後12か月の寝つきの悪さも予測した。12か月の寝つきの悪さは、12か月の感覚の過敏さと相関があり、相関係数は0.34だった。6か月の寝つきの悪さは、24か月から36か月の自閉症の重さとも相関した。\n\n【ポイント・注意点】生後6か月の脳のつながりが、後の睡眠や感覚の様子と関係することが示された。ただし、自閉症と診断されたのは7人と少なく、親への聞き取りによる評価が中心で、因果関係は分からない。脳の画像で発達を予測できる段階ではなく、乳児の寝つきや感覚の過敏さが気になる場合は、かかりつけの小児科医や発達の専門機関に早めに相談することが大切だ。対象の乳児は、米国とカナダの4つの施設で集められ、性別や年齢などでそろえて比べられた。脳の画像は、自然な眠りの最中に撮影された。","2026-11-18","bioengineer.org","http://bioengineer.org/infant-insular-brain-connectivity-links-early-sleep-disruption-and-sensory-over-responsivity/"],["自閉症の子 2人に1人超に脳波の異常 部位で特徴が違う 343人の調査","中国の北京大学第六医院で、自閉症の子ども343人の脳波を調べたところ、53.4パーセントに異常が見られた。発達の退行があった子や4歳から5歳の子、早産で生まれた子で異常が多かった。異常の出る脳の部位によって、関係する特徴が違うことも分かった。脳波の異常が自閉症の多様さを知る手がかりになる可能性が示された。脳波は4時間以上にわたり鎮静なしで記録され、343人が対象だった。","\n【概要】中国の北京大学第六医院で、自閉症の子ども343人の脳波を調べたところ、53.4パーセントに異常が見られた。発達の退行があった子や4歳から5歳の子、早産で生まれた子で異常が多かった。異常の出る脳の部位によって、関係する特徴が違うことも分かった。脳波の異常が自閉症の多様さを知る手がかりになる可能性が示された。\n\n【背景】自閉症の子どもの中には、けいれんがなくても脳波に異常が見られる子がいる。こうした異常が認知や言葉、行動と関係するのではないかと考えられているが、どんな子に多いのか、脳のどの部位に出るのかは分かっていなかった。今回の研究は、343人の子どもの長時間の脳波を調べ、特徴を部位ごとに分析した。\n\n【詳細】対象は343人で、平均年齢は5.13歳、79.6パーセントが男子だった。4時間以上の脳波を鎮静なしで記録し、312人は自然な眠りの記録も得られた。異常があったのは183人で53.4パーセントだった。発達の退行があった子は、異常がある確率が6.53倍と最も強く関係した。4歳から5歳の子は2.46倍、早産で生まれた子は2.54倍だった。部位別では、前頭葉が16.0パーセント、側頭葉が13.1パーセント、頭頂葉が10.8パーセント、後頭葉が3.8パーセント、複数の部位が16.3パーセント、全般性が32.4パーセントだった。前頭葉の異常は注意欠如・多動症や退行、早産と関係し、側頭葉の異常は退行だけと関係した。\n\n【ポイント・注意点】脳波の異常は、発達の退行や早産といった特徴と関係し、部位によって意味が違う可能性がある。ただし、今回の研究は1つの病院での後ろ向きの調査で、因果関係は分からない。脳波の異常があるからといって、必ずしも治療が必要なわけではなく、日常の脳波検査が子どものケアを改善するかも分かっていない。発達の退行や言葉の遅れが気になる場合は、専門医に相談することが大切だ。脳波の記録は、専門の技師が行い、2人の神経生理学者が子どもの情報を知らずに評価した。脳波の異常は、てんかんがなくても見られることがあり、認知や言葉と関係すると考えられている。","2026-11-18","bioengineer.org","https://bioengineer.org/study-links-specific-clinical-profiles-to-distinct-eeg-abnormalities-in-autistic-children/"],["早産で生まれた子 2歳で6割近くに発達の気がかり 86人の追跡","妊娠34週までに生まれた子ども86人を2歳前後まで追跡した研究で、58.1パーセントに少なくとも1つの領域で発達の気がかりがあることが分かった。言葉の気がかりが最も多く32.6パーセントだった。新生児期の敗血症やけいれん、人工呼吸などが、領域ごとに違う形で関係した。早産児のフォローでは、領域ごとの丁寧な評価が大切だ。発達はASQ-3という質問票で評価された。","\n【概要】妊娠34週までに生まれた子ども86人を2歳前後まで追跡した研究で、58.1パーセントに少なくとも1つの領域で発達の気がかりがあることが分かった。言葉の気がかりが最も多く32.6パーセントだった。新生児期の敗血症やけいれん、人工呼吸などが、領域ごとに違う形で関係した。早産児のフォローでは、領域ごとの丁寧な評価が大切だ。\n\n【背景】早産で生まれた子どもは、発達の遅れのリスクが高いことが知られている。どんな新生児期の問題が、どの発達の領域に影響するのかは、十分に分かっていなかった。今回の研究は、34週までに生まれた子どもを対象に、修正月齢24か月から30か月の発達をASQ-3という質問票で調べ、新生児期の要因との関係を分析した。\n\n【詳細】対象は86人で、少なくとも1つの領域で気がかりがあったのは58.1パーセントだった。領域別では、コミュニケーションが32.6パーセントと最も多く、個人・社会性が31.4パーセント、問題解決が26.7パーセント、微細運動が14.0パーセント、粗大運動が10.5パーセントだった。新生児敗血症は、コミュニケーション、粗大運動、問題解決の気がかりと関係した。コミュニケーションの気がかりには、新生児けいれんと人工呼吸の使用も関係し、調整オッズ比はそれぞれ1.90と1.93だった。粗大運動では、脳室内出血が2.55倍、出生後の成長不良が2.69倍、敗血症が3.82倍と関係した。問題解決では壊死性腸炎が2.30倍、個人・社会性では人工乳の使用が2.10倍と関係した。\n\n【ポイント・注意点】新生児期の問題は、発達のすべての領域に同じように影響するのではなく、領域ごとに違う形で関係することが分かった。早産児の健診では、運動や言葉、問題解決、社会性を分けて評価し、気になる領域に合わせた支援を早めに始めることが大切だ。ただし、対象は86人と少なく、1つの施設での観察研究のため、他の施設でも同じかは検証が必要だ。新生児期の要因は、性別と在胎週数で調整したうえで分析された。","2026-11-18","bioengineer.org","https://bioengineer.org/preterm-infants-frequently-experience-developmental-concerns-linked-to-specific-neonatal-complications/"],["幼児の1日 睡眠と激しい運動が多いほど発達によい 4856人の国際調査","世界各地の4856人の幼児を調べた国際研究で、1日のうち睡眠と激しい運動の時間が長いほど、体格や血圧、運動能力の指標がよいことが分かった。研究チームは、激しい運動129分、軽い運動250分、画面を使った座り時間78分、画面なしの座り時間389分、睡眠594分という1日の目安を示した。画面の座り時間は発達への影響が小さかった。データは世界各地の幼児を集めたSADEYを使った。","\n【概要】世界各地の4856人の幼児を調べた国際研究で、1日のうち睡眠と激しい運動の時間が長いほど、体格や血圧、運動能力の指標がよいことが分かった。研究チームは、激しい運動129分、軽い運動250分、画面を使った座り時間78分、画面なしの座り時間389分、睡眠594分という1日の目安を示した。画面の座り時間は発達への影響が小さかった。\n\n【背景】幼児の1日は、睡眠、運動、座って過ごす時間でできている。どれか1つだけを見るのではなく、1日全体の時間の配分が発達にどう関わるのかを調べることが大切だ。今回の研究は、世界各地の幼児のデータを集めたSADEYというデータベースを使い、加速度計で測った運動と、親が答えた睡眠や画面時間を組み合わせて分析した。\n\n【詳細】対象は4856人で、平均年齢は52.6か月だった。5つの時間の要素からなる1日の配分は、移動能力を除くほぼすべての発達の指標と関係した。激しい運動や睡眠の時間を増やすと、腹囲と身長の比、拡張期血圧、物を操作する力、全体の粗大運動能力がよくなる方向に働いた。画面を使った座り時間の配分を変えても、発達への影響はほとんどなかった。軽い運動の時間を増やすと、むしろよくない方向の関係が見られた。研究チームは、1日の最適な配分として、激しい運動129分、軽い運動250分、画面を使った座り時間78分、画面なしの座り時間389分、睡眠594分を示した。ただし、時間の配分で説明できる発達の違いは小さかった。\n\n【ポイント・注意点】幼児の発達には、十分な睡眠と激しい運動の時間が大切で、画面の時間そのものよりも、体を動かす時間と睡眠を確保することが鍵になる。ただし、示された時間は目安であり、子ども一人ひとりの体調や生活に合わせることが大切だ。無理に運動を増やすのではなく、外遊びや昼寝など、日常の中で自然に体を動かし、よく眠れるリズムを作ることが勧められる。時間の配分で説明できる発達の違いは小さく、運動や睡眠以外にも多くの要因が関わっている。幼児の1日は、睡眠、運動、座って過ごす時間の配分でできており、全体のバランスが大切だ。","2026-11-18","scienmag","https://scienmag.com/movement-composition-and-sleep-associated-with-preschooler-physical-development/"],["小学生がロボット手術の訓練で急成長 4歳から12歳35人の実験","ロボット手術の訓練装置を使った実験で、4歳から12歳の子ども35人が、3回の練習で手の動きを大きく上達させたことが分かった。年齢が高いほど上手だったが、7歳から9歳の子は練習による伸びが最も大きかった。子どもの運動能力の発達段階に合わせた訓練の大切さを示す結果だ。課題は両手で色の玉を仕分けるもので、3回の練習で上達の様子を調べた。年齢ごとの違いがはっきり出た。","\n【概要】ロボット手術の訓練装置を使った実験で、4歳から12歳の子ども35人が、3回の練習で手の動きを大きく上達させたことが分かった。年齢が高いほど上手だったが、7歳から9歳の子は練習による伸びが最も大きかった。子どもの運動能力の発達段階に合わせた訓練の大切さを示す結果だ。\n\n【背景】子どもは大人と違う仕組みで手の動きを覚える。脳の神経の発達が進む幼児期から学童期は、繰り返しの練習で運動の回路が作られる大切な時期だ。今回の研究は、持ち運びできるロボット手術の訓練装置を使い、年齢ごとに手の動きの上達の仕方がどう違うかを調べた。\n\n【詳細】対象は35人で、4歳から6歳が11人、7歳から9歳が12人、10歳から12歳が12人だった。子どもたちは、両手のロボット操作で色のついた玉を仕分ける課題を3回行った。かかった時間は、4歳から6歳の平均が201147ミリ秒、10歳から12歳の平均が97155ミリ秒で、年齢が高いほど速かった。ぶつかる回数は、最も若い子が年上の子の約3.2倍だった。7歳から9歳の子は、練習を重ねると手の動きの距離が34パーセント減り、ぶつかる回数が41パーセント減った。4歳から6歳の子も、1回目から2回目で時間が有意に短くなった。10歳から12歳の子は最初から上手で、変化は見られなかった。\n\n【ポイント・注意点】7歳から9歳は、運動の上達が大きい時期で、繰り返しの練習が特に効果的だと考えられる。ただし、対象は35人と少なく、1回の実験での結果なので、長く続けた練習の効果は分からない。ロボット手術の訓練そのものが子どもの教育に使われるわけではないが、手先の器用さや空間をとらえる力は、遊びや工作、運動の中で育てることができる。装置は、持ち運びできるロボットの操作台と仮想現実の画面を組み合わせたものだった。子どもの運動能力の発達段階に合わせた訓練の大切さを示す結果だと研究チームは述べている。手先の器用さや空間をとらえる力は、遊びや工作、運動の中で育てることができ、両手を使う遊びを日常に取り入れるとよい。","2026-11-18","bioengineer.org","https://bioengineer.org/young-schoolchildren-rapidly-develop-robotic-surgery-skills-on-portable-virtual-reality-simulator/"],["家庭の経済格差 幼児の社会性の発達には家庭環境がカギ 370人調査","中国の武漢で1歳から3歳の幼児370人を調べた研究で、家庭の経済的な状況と幼児の社会性や感情の発達の関係は、家庭の育む環境を通じて間接的に働くことが分かった。家庭環境がよいほど社会性の発達がよく、経済格差の影響は家庭環境の質で説明できた。低所得の家庭でも、温かく刺激のある家庭環境が子どもの発達を支えることが示された。社会性の発達はITSEAという尺度で測られた。","\n【概要】中国の武漢で1歳から3歳の幼児370人を調べた研究で、家庭の経済的な状況と幼児の社会性や感情の発達の関係は、家庭の育む環境を通じて間接的に働くことが分かった。家庭環境がよいほど社会性の発達がよく、経済格差の影響は家庭環境の質で説明できた。低所得の家庭でも、温かく刺激のある家庭環境が子どもの発達を支えることが示された。\n\n【背景】家庭の経済的な状況が低いほど、子どもの発達が遅れやすいことは知られているが、その仕組みは十分に分かっていなかった。家庭の育む環境、つまり家族の温かさや親子の関わり、言葉や学びの刺激が、経済的な状況と子どもの発達の間に入っているのではないかと考えられた。今回の研究は、中国の1歳から3歳の幼児を対象に、この関係を調べた。\n\n【詳細】対象は武漢の母子保健病院を受診した健康な幼児370人で、平均月齢は27.71か月だった。家庭の経済的な状況は、親の教育と世帯収入から作った指標で測り、家庭の育む環境は家庭養育環境尺度で、幼児の社会性や感情の発達はITSEAという尺度で測った。家庭の経済的な状況は、社会性の能力と弱い正の相関があり、相関係数は0.146だった。家庭環境と社会性の能力の相関は0.545と強かった。家庭環境を分析に入れると、経済的な状況から社会性の発達への直接の関係は有意でなくなり、間接的な効果は0.099で有意だった。つまり、経済的な状況の影響は、家庭環境を通じて完全に説明できることが示された。\n\n【ポイント・注意点】家庭の経済的な状況そのものよりも、家庭での関わり方や刺激の質が、幼児の社会性や感情の発達に直接関わることが示された。経済的に厳しい家庭でも、親子の温かい関わりや言葉かけ、遊びの機会を増やす支援が、子どもの発達を支える。ただし、今回の調査は1時点の横断研究で、因果関係は分からない。子育ての悩みがあれば、地域の子育て支援や保健機関に相談することが勧められる。分析では、子どもの性別や年齢、居住地、家族構成を考慮したうえで、家庭環境の役割を調べた。","2026-11-17","Frontiers in Psychology","https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2026.1880127/full"],["親が歌うと赤ちゃんの言葉が育つ 42人を2歳まで追跡","生後6か月から12か月の赤ちゃん42人を対象にした研究で、家庭での音楽環境や親が歌う量が多いほど、1歳半と2歳のときの話す言葉の数が多いことが分かった。親の音楽の得意さや学歴、言葉かけの量を考慮しても、歌うことの効果は残った。歌や音楽のある家庭環境が、言葉の発達を支える可能性が示された。音楽環境はMusic@Homeという質問票で調べられ、言葉の数は親の回答で測られた。","\n【概要】生後6か月から12か月の赤ちゃん42人を対象にした研究で、家庭での音楽環境や親が歌う量が多いほど、1歳半と2歳のときの話す言葉の数が多いことが分かった。親の音楽の得意さや学歴、言葉かけの量を考慮しても、歌うことの効果は残った。歌や音楽のある家庭環境が、言葉の発達を支える可能性が示された。\n\n【背景】歌や音楽は、言葉と似たリズムや音の高さの特徴を持ち、脳の中でも言葉と近い仕組みで処理されると考えられている。これまでの研究では、家庭の音楽環境と言葉の理解の関係が示されていたが、話す言葉の発達との関係は十分に調べられていなかった。今回の研究は、42組の親子を2歳まで追跡し、家庭の音楽環境が話す言葉の発達を予測するかを調べた。\n\n【詳細】対象は42人の赤ちゃんで、生後6か月から12か月のときに、親がMusic@Homeという質問票に答えた。18か月と24か月のときに、親が子どもの話す言葉の数を答える質問票に記入した。分析の結果、家庭の音楽環境全般と、親が歌う量の多さが、18か月と24か月の話す言葉の数を予測した。親の音楽の得意さや学歴、言葉かけの量、子どもへの愛着を考慮しても、関係は残った。親が歌う量だけを入れたモデルのほうが、音楽環境全般のモデルよりもよく当てはまった。歌は話し言葉よりもゆっくりでリズミカルなため、赤ちゃんの注意を引きやすく、口の動きへの注目が言葉の発達につながると考えられる。\n\n【ポイント・注意点】親が歌うことは、特別な技術がなくてもできる言葉の発達の支えになる。ただし、対象は42人と少なく、歌うことと言葉の発達の因果関係は分からない。音楽が好きな親ほど歌う量が多いなど、遺伝的な影響も考えられる。歌が苦手でも、絵本の読み聞かせや話しかけなど、声を使った関わりを日常に取り入れることが大切だ。言葉の数は、親が答えるマッカーサー・ベイツの質問票で測られた。歌や音楽のある家庭環境が、言葉の発達を支える可能性が示されたが、因果関係は今後の研究課題だ。家庭での音楽の時間は、親子のふれあいにもなり、言葉の発達の土台になると考えられる。","2026-11-17","PLOS ONE","https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0362762"]]};

function curArtIdx(){const n=curItems().length;if(!n)return 0;let i=artIdxMap[curCat().id]||0;if(i>=n)i=n-1;if(i<0)i=0;return i}
function renderStage(dir){
  cats=allCats(); if(catIdx>=cats.length)catIdx=cats.length-1; if(catIdx<0)catIdx=0;
  const c=curCat(), items=curItems(), ai=curArtIdx();
  const total=cats.reduce((s,x)=>s+(DATA[x.id]||[]).length,0);
  document.getElementById('heroText').innerHTML="<b>今日のまとめ — 全"+cats.length+"ジャンル・"+total+"件。</b> タイトルと概要は日本語、カードの「和訳全文を読む」で全文が開きます。新しい順に並べ、48時間より古い記事はグレー表示です。";
  document.getElementById('catName').textContent=c.name;
  document.getElementById('catDesc').textContent=c.desc||"";
  document.getElementById('catCount').textContent="ジャンル "+(catIdx+1)+" / "+cats.length;
  document.getElementById('catDots').innerHTML=cats.map((x,i)=>'<button class="dot'+(i===catIdx?' active':'')+'" data-cat="'+i+'" aria-label="'+x.name+'へ移動"></button>').join('');
  document.querySelectorAll('#catDots .dot').forEach(d=>{d.onclick=()=>{const n=+d.dataset.cat; if(n!==catIdx){const dd=n>catIdx?'down':'up'; catIdx=n; renderStage(dd);}}});
      const slot=document.getElementById('cardSlot');
  if(!items.length){
    slot.innerHTML='<article class="card"><div class="empty"><div class="big">✦</div><p><b>'+c.name+'</b> は追加されたばかりの項目で、まだ記事がありません。</p><p>毎日の更新でこの項目の記事が集まると、ここに表示されます。<br>上スワイプで他のジャンルへ移動できます。</p></div></article>';
    document.getElementById('artDots').innerHTML=""; document.getElementById('artCount').textContent="0 / 0"; return;
  }
  const it=items[ai], a=it.a, old=isOld(a[3]);
  slot.innerHTML='<article class="card'+(old?' old':'')+(dir?' anim-'+dir:'')+'">'
    +'<img class="ph" src="'+IMGS[c.img]+'" alt="'+c.name+'のイメージイラスト">'
    +'<div class="cbody"><div class="meta"><span class="badge'+(old?' oldb':'')+'">'+(old?'少し前':'NEW')+'</span><span>'+a[3]+'</span><span>'+(ai+1)+' / '+items.length+'</span></div>'
    +'<h3>'+a[0]+'</h3><p class="sum">'+a[1]+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="openArticle(\''+c.id+'\','+it.oi+')">和訳全文を読む</button>'
    +'<button class="btn ghost" onclick="quickMemo(\''+c.id+'\','+it.oi+',this)">メモ保存</button>'
    +'<button class="btn ghost" onclick="shareArticle(\''+c.id+'\','+it.oi+')">共有</button></div>'
    +'<div class="src">出典：'+a[4]+'<br><a href="'+a[5]+'" target="_blank" rel="noopener">原文を開く</a></div></div></article>';
  document.getElementById('artDots').innerHTML=items.map((x,i)=>'<span class="dot'+(i===ai?' active':'')+'"></span>').join('');
  document.getElementById('artCount').textContent="記事 "+(ai+1)+" / "+items.length;
  requestAnimationFrame(fitCard);
}

function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;
  const sum=card.querySelector('.sum'), h3=card.querySelector('h3'), ph=card.querySelector('.ph');
  let ss=14, hs=Math.min(21, Math.max(17, window.innerWidth*0.044)), phh=ph?Math.round(ph.getBoundingClientRect().height):0; const ph0=phh;
  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }
    if(hs>13){ hs-=0.5; if(h3) h3.style.fontSize=hs+'px'; continue; }
    break;
  }
}
window.addEventListener('resize', fitCard);
function nextArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i>=n-1)return;artIdxMap[curCat().id]=i+1;renderStage('next')}
function prevArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i<=0)return;artIdxMap[curCat().id]=i-1;renderStage('prev')}
function nextCat(){if(catIdx>=cats.length-1)return;catIdx++;renderStage('down')}
function prevCat(){if(catIdx<=0)return;catIdx--;renderStage('up')}
/* ===== スワイプ操作（スクロールではなくスワイプで移動） ===== */
const stage=document.getElementById('stage');
let sx=null, sy=null, swipedAt=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;
  swipedAt=Date.now();
  if(Math.abs(dx)>Math.abs(dy)){ dx<0?nextArt():prevArt(); } else { dy<0?nextCat():prevCat(); }
});
stage.addEventListener('click',e=>{ if(Date.now()-swipedAt<120){e.stopPropagation();e.preventDefault();} },true);
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')nextArt(); else if(e.key==='ArrowLeft')prevArt();
  else if(e.key==='ArrowDown'){e.preventDefault();nextCat();} else if(e.key==='ArrowUp'){e.preventDefault();prevCat();}
});
/* ===== 項目の追加 ===== */
document.getElementById('addCatBtn').onclick=()=>{document.getElementById('newCatName').value="";document.getElementById('newCatDesc').value="";document.getElementById('addDlg').showModal()};
document.getElementById('addCatSave').onclick=()=>{
  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast("項目名を入力してください");return}
  const desc=document.getElementById('newCatDesc').value.trim()||"追加された項目";
  const id='custom-'+Date.now();
  extraCats.push({id:id,name:name,desc:desc,img:'hero'}); DATA[id]=[];
  cats=allCats(); catIdx=cats.length-1;
  document.getElementById('addDlg').close(); renderStage('down');
  toast("項目「"+name+"」を追加しました");
};
/* ===== 記事ダイアログ・メモ・共有 ===== */
function openArticle(cat,idx){
const c=allCats().find(x=>x.id==cat); const a=DATA[cat][idx];
document.getElementById('dlgIn').innerHTML=`<img src="${IMGS[c.img]}" alt=""><div class="meta" style="margin-top:10px"><span>${c.name}</span><span>${a[3]}</span></div><h3>${a[0]}</h3><p class="sum" style="font-size:14px">${a[1]}</p><div class="full">${a[2]}</div>
<p class="src" style="margin-top:12px">出典：${a[4]} — <a href="${a[5]}" target="_blank" rel="noopener">${a[5]}</a></p>
<div class="memoBox"><label style="font-weight:800;font-size:14px">ひとことメモ</label><textarea id="memoText" placeholder="気づいたこと、作りたいもの、家族への共有メモなど"></textarea>
<div class="actions"><button class="btn primary" onclick="saveMemo('${cat}',${idx})">このメモを保存</button><button class="btn ghost" onclick="shareArticle('${cat}',${idx})">iPhoneで共有</button><button class="btn ghost" onclick="document.getElementById('dlg').close()">閉じる</button></div></div>`;
document.getElementById('dlg').showModal();
}
function quickMemo(cat,idx,btn){const a=DATA[cat][idx];memos.unshift({cat,title:a[0],note:"",date:a[3]});updateMemoUI();btn.textContent="保存しました";btn.classList.add('saved');toast("メモに保存しました（このページを開いている間）")}
function saveMemo(cat,idx){const a=DATA[cat][idx];const note=document.getElementById('memoText').value.trim();memos.unshift({cat,title:a[0],note,date:a[3]});updateMemoUI();toast("メモを保存しました");document.getElementById('dlg').close()}
function updateMemoUI(){document.getElementById('memoCount').textContent=memos.length;const area=document.getElementById('memoList');
if(!memos.length){area.innerHTML='<p class="sum">まだメモがありません。記事の「メモ保存」をタップしてください。</p>';return}
area.innerHTML=memos.map(m=>`<div class="memoItem"><b style="font-size:14px">${m.title}</b><div style="font-size:13px;color:var(--muted)">${m.note||"（ひとことメモなし）"} ・ ${m.date}</div></div>`).join('')}
function exportMemos(){if(!memos.length){toast("まだメモがありません");return}const txt="MAI topic メモ — 2026-11-10\n\n"+memos.map((m,i)=>`${i+1}. ${m.title}\n${m.note||""}\n`).join("\n");const b=new Blob([txt],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="mai-topic-memo-2026-11-10.txt";a.click();URL.revokeObjectURL(u)}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}} try{await navigator.clipboard.writeText(text);toast("コピーしました — メモアプリなどに貼り付けできます")}catch(e){toast("共有できませんでした")}}
function shareArticle(cat,idx){const a=DATA[cat][idx];shareText(a[0],`${a[0]}\n\n${a[1]}\n\n出典：${a[4]} ${a[5]}`)}
function shareMemos(){if(!memos.length){toast("まだメモがありません");return}shareText("MAI topic メモ",memos.map(m=>`・${m.title} ${m.note}`).join("\n"))}
document.getElementById('sharePage').onclick=()=>shareText("MAI topic","MAI topic — 2026年11月24日朝版（全"+cats.length+"ジャンル）");
document.getElementById('memoBtn').onclick=()=>{updateMemoUI();document.getElementById('memoDlg').showModal()};
updateMemoUI();
renderStage();
</script>

<script>
try {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
} catch (e) {}
</script>
