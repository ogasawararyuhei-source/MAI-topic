<style>

:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;display:flex;flex-direction:column;height:100dvh;overflow:hidden;transition:background .35s ease,color .35s ease}
body::before{content:"";position:fixed;inset:0;background:var(--pattern);pointer-events:none;opacity:var(--pattern-op,.5)}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
[data-theme="steampunk"]{--bg:#e6d7b8;--pattern:radial-gradient(circle at 12% 20%,rgba(141,100,40,.16) 0 26px,transparent 27px),radial-gradient(circle at 88% 78%,rgba(141,100,40,.13) 0 38px,transparent 39px),repeating-linear-gradient(0deg,rgba(90,62,25,.05) 0 1px,transparent 1px 26px);--pattern-op:1;--card:#f8eed3;--ink:#2e2010;--muted:#77603c;--line:#a97f3f;--accent:#9c4a12;--accent2:#2f5d50;--accent-ink:#fff6df;--soft:#efdfba;--old:#97835f;--top-bg:#2a1a0c;--top-ink:#f2dfae;--radius:8px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\2699  \2699  \2699";--shadow:0 14px 34px rgba(62,40,8,.28)}
[data-theme="witch"]{color-scheme:dark;--bg:#161022;--pattern:radial-gradient(circle at 18% 12%,rgba(233,213,255,.20) 0 1.5px,transparent 2.5px),radial-gradient(circle at 72% 22%,rgba(233,213,255,.14) 0 1px,transparent 2px),radial-gradient(circle at 42% 66%,rgba(196,181,253,.12) 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 84%,rgba(233,213,255,.16) 0 1px,transparent 2px),radial-gradient(circle at 6% 88%,rgba(196,181,253,.12) 0 1px,transparent 2px);--pattern-op:1;--card:#241a3d;--ink:#f1eaff;--muted:#bdaee0;--line:#5b4595;--accent:#a678ff;--accent2:#e9d5ff;--accent-ink:#1d1233;--soft:#2f2350;--old:#8d81ad;--top-bg:#0e0919;--top-ink:#efe6ff;--radius:20px;--font-display:"IM Fell English","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\263E  \2726  \263D";--shadow:0 14px 34px rgba(0,0,0,.5)}
[data-theme="dnd"]{--bg:#e7d9b4;--pattern:repeating-linear-gradient(45deg,rgba(158,43,37,.05) 0 2px,transparent 2px 18px),radial-gradient(circle at 85% 10%,rgba(158,43,37,.10) 0 30px,transparent 31px);--pattern-op:1;--card:#f7ecc9;--ink:#332216;--muted:#7d6248;--line:#8c6a3f;--accent:#9e2b25;--accent2:#a97b00;--accent-ink:#fdf3d8;--soft:#eee0b6;--old:#9a8a72;--top-bg:#471611;--top-ink:#f7e7bd;--radius:4px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\265E  \2726  \265E";--shadow:0 14px 30px rgba(71,22,17,.30)}
[data-theme="celtic"]{--bg:#e3dfc6;--pattern:repeating-linear-gradient(0deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px),repeating-linear-gradient(90deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px);--pattern-op:1;--card:#f6f2dc;--ink:#20331e;--muted:#5d7050;--line:#77873f;--accent:#2e6b34;--accent2:#a8842a;--accent-ink:#fbf7e2;--soft:#e7e5c8;--old:#93a086;--top-bg:#17351f;--top-ink:#efeccb;--radius:14px;--font-display:"Uncial Antiqua","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\16DA  \2726  \16DB";--shadow:0 14px 30px rgba(23,53,31,.26)}
[data-theme="greek"]{--bg:#f2eee3;--pattern:repeating-linear-gradient(90deg,rgba(29,95,138,.06) 0 1px,transparent 1px 34px),radial-gradient(circle at 90% 0%,rgba(185,138,28,.10) 0 60px,transparent 61px);--pattern-op:1;--card:#fffdf6;--ink:#1e2c38;--muted:#66727c;--line:#b3923c;--accent:#1d5f8a;--accent2:#b98a1c;--accent-ink:#ffffff;--soft:#ece7d7;--old:#a3a8ad;--top-bg:#fdfbf4;--top-ink:#1e2c38;--radius:2px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\03A9  \2766  \03A9";--shadow:0 14px 30px rgba(30,44,56,.18)}
.top{flex:none;position:relative;z-index:30;background:var(--top-bg);color:var(--top-ink);border-bottom:3px double var(--line)}
.topin{max-width:1080px;margin:auto;padding:10px 16px 4px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.logo{font-family:var(--font-display);font-weight:900;font-size:23px;letter-spacing:.06em}.logo span{color:var(--accent2)}
[data-theme="witch"] .logo span,[data-theme="steampunk"] .logo span{color:var(--accent)}
.date{font-size:10px;opacity:.75;white-space:nowrap}
.topbtns{display:flex;gap:8px;flex:none}.pill{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.themes{max-width:1080px;margin:auto;padding:6px 16px 10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.themes-label{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;opacity:.8}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;opacity:.85}
.theme-btn .gly{margin-right:5px}
.theme-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
.stage-wrap{flex:1;min-height:0;max-width:1080px;width:100%;margin:auto;padding:10px 16px 12px;display:flex;flex-direction:column;position:relative;z-index:1}
.herostrip{flex:none;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;box-shadow:var(--shadow)}
.herostrip img{width:74px;height:52px;object-fit:cover;border-radius:calc(var(--radius) * .6);flex:none}
.herostrip p{margin:0;font-size:13px;color:var(--muted)}.herostrip b{color:var(--ink);font-family:var(--font-display)}
.catbar{flex:none;display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.catbar .navbtn{flex:none}
.catinfo{flex:1;text-align:center;min-width:0}
.catinfo h2{margin:0;font-family:var(--font-display);font-size:clamp(19px,4.6vw,27px);line-height:1.25;letter-spacing:.03em}
.catinfo p{margin:1px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catcount{flex:none;font-size:12px;background:var(--soft);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-weight:700}
.navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800;box-shadow:var(--shadow)}
.navbtn:active{transform:scale(.97)}
.dots{flex:none;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:transparent;padding:0}
.dot.active{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.stage{flex:1;min-height:0;touch-action:none;position:relative}
#cardSlot{height:100%}
.card{height:100%;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
.card::after{content:var(--orn);position:absolute;top:6px;right:12px;font-size:13px;letter-spacing:.3em;color:var(--accent2);opacity:.85;pointer-events:none}
.card.old .ph{filter:grayscale(1)}
.card .ph{width:100%;height:30%;min-height:120px;object-fit:cover;display:block;flex:none}
[data-theme="steampunk"] .card .ph{filter:sepia(.35) contrast(1.05)}
[data-theme="witch"] .card .ph{filter:saturate(.85) hue-rotate(-12deg) brightness(.92)}
[data-theme="dnd"] .card .ph{filter:sepia(.25) saturate(1.1)}
[data-theme="celtic"] .card .ph{filter:saturate(1.05) hue-rotate(6deg)}
[data-theme="greek"] .card .ph{filter:saturate(.92) brightness(1.04)}
.cbody{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.badge{background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:999px;font-weight:800}.badge.oldb{background:var(--old)}
.card h3{margin:0;font-size:clamp(17px,4.4vw,21px);line-height:1.45;font-family:var(--font-display);font-weight:700}
.sum{font-size:14px;color:var(--muted);margin:0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.btn{border:0;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800}
.btn.primary{background:var(--accent);color:var(--accent-ink)}.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.saved{background:var(--accent2);color:var(--accent-ink)}
.src{font-size:11px;color:var(--muted);word-break:break-all}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;color:var(--muted)}
.empty .big{font-size:34px;color:var(--accent2)}
.pager{flex:none;display:flex;align-items:center;gap:10px;margin-top:10px}
.pager .navbtn{flex:1}
.artdots{flex:none;display:flex;gap:5px;max-width:34vw;flex-wrap:wrap;justify-content:center}
.artcount{flex:none;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.hint{flex:none;font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.addcat{flex:none;text-align:center;margin-top:6px}
.addcat button{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700}
@keyframes inNext{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes inDown{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes inUp{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
.anim-next{animation:inNext .28s ease}.anim-prev{animation:inPrev .28s ease}.anim-down{animation:inDown .28s ease}.anim-up{animation:inUp .28s ease}
dialog{border:2px solid var(--line);border-radius:calc(var(--radius) + 6px);padding:0;max-width:min(680px,94vw);width:680px;max-height:92dvh;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,8,4,.6)}
.din{padding:20px;overflow-y:auto;max-height:92dvh}
.din img{width:100%;height:200px;object-fit:cover;border-radius:var(--radius)}
.din h3{font-size:20px;line-height:1.4;margin:12px 0 6px;font-family:var(--font-display)}
.full{font-size:15px;white-space:pre-line}
textarea,input[type="text"]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px}
label.fl{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
.memoBox{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.memoItem{border-top:1px solid var(--line);padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--top-bg);color:var(--top-ink);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:90vw;text-align:center}
@media(max-width:640px){.topin{padding:8px 12px 2px}.themes{padding:4px 12px 8px}.stage-wrap{padding:8px 12px 10px}.herostrip{display:none}.catbar .navbtn{padding:8px 10px;font-size:12px}.card .ph{height:24%;min-height:104px}}
@media(prefers-reduced-motion:reduce){.anim-next,.anim-prev,.anim-down,.anim-up{animation:none}body{transition:none}}

</style>

const DATA = {"ai":[["Anthropicの数学者、Claudeとリーマン予想を証明と主張　Leanで認定","米Anthropicの数学者レベント・アルポーゲ氏が、同社のAI「Claude」と共同で未解決問題「リーマン予想」の証明を見つけたと11月20日に主張した。証明は証明支援系「Lean」の形式証明として公開され、Leanのコミュニティは21日に正しいと認める共同声明を出した。Leanの証明は1700万行に及ぶ一方、数学者が読める論文はまだ公開されておらず、今後まとめる方針だという。","\n【概要】米Anthropicに所属する数学者レベント・アルポーゲ氏は11月20日（現地時間）、自身のWebサイトで声明を出し、同社のAI「Claude」と共同で未解決問題「リーマン予想」の証明を見つけたと主張した。証明は証明支援系「Lean」による形式証明として公開され、Leanの開発者・利用者のコミュニティは21日、この証明が正しいと認定する共同声明を出した。アルポーゲ氏によれば、今回の手法は「一般化リーマン予想」も解決するという。【背景】リーマン予想は1859年にリーマンが提唱したもので、リーマンゼータ関数の自明でないゼロ点がすべて一直線上にあると主張する。クレイ研究所のミレニアム懸賞問題の一つとして知られる。Anthropicは8月にも関連する成果を発表していたが、それは零点の割合の下限を引き上げるもので、証明そのものではなかった。Scientific Americanによれば、今回の発表はAnthropicの株式上場の翌日だった。【詳細】声明には作業の時系列が示されている。10月6日以降に鍵となるアイデアが見つかり、11月16日に一般化リーマン予想の証明に到達したとされる。Claudeとの作業について、アルポーゲ氏は「ゴール目前で、Claudeは私をはるかに上回った」と述べた。MITのアンドリュー・サザーランド氏ら外部の研究者は、公開されたコードを独自にコンパイルし、エラーなく完了することを確認した。Leanの証明は1700万行に及ぶ。一方で、数学者が読める形の論文はまだ公開されていない。詳細な文書を生成すると25万ページを超えたため、現時点ではLeanのコードだけを公開し、今後論文にまとめる方針だという。【ポイント・注意点】形式証明は機械が一行ずつ検証するため、コンパイルが通ることは証明の正しさを強く裏付ける。外部研究者が独自に再現した点も重みがある。ただし、人が読んで理解できる論文はまだなく、証明の考え方を数学界がどう評価するかはこれからだ。AIが最難関級の数学問題で人間を上回る働きをしたと当事者が語ったことは、研究でのAIの役割を考えるうえで注目に値する。今後公開される論文と、数学者による検証の行方を見守りたい。","2026-11-22","ITmedia NEWS","https://www.itmedia.co.jp/news/article/2611/22/2000003388/"],["導入したAIの56.5％で使われないものあり　管理職170人調査","従業員300人以上の企業でAIを業務に使う部門の管理職を対象にした調査で、導入したAIツールや用途のうち「ほとんど使われていないもの」がある人が合計56.5％に上った。使われなくなった理由は「期待した精度が出なかった」と「費用対効果を説明できなかった」が各36.5％で首位。記事は、AIが一般知識では答えられても自社独自の判断基準を反映できない点を背景に挙げている。","\n【概要】企業でAIツールを導入しても、十分に使われないまま残っていることがある。taiziiiが2026年9月1〜4日に実施したインターネット調査によると、所属部門で導入したAIツールや用途のうち「ほとんど使われていないもの」が「複数ある」は42.9％（73人）、「1つある」は13.5％（23人）で、合計56.5％に上った。調査の対象は、従業員300人以上の企業でAIを業務に使う部門の課長級以上の管理職で、回答200人のうち有効回答は170人だった。【背景】生成AIの導入は多くの企業で進んでいるが、精度が期待を下回ったり、費用対効果を説明できなかったりして、定着しないケースがあると記事は問題提起している。導入した段階で満足せず、現場で使われ続けるかどうかが問われる局面に入っているといえる。【詳細】利用されなくなった理由（複数回答）は、「期待した精度が出なかった」と「費用対効果を説明できなかった」が各36.5％で並んで首位だった。続いて「使い方が現場に浸透しなかった」が32.3％となった。「自社の事情や判断基準を踏まえた回答にならなかった」と「入力や準備の手間が元の業務より重かった」がそれぞれ28.1％だった。記事は、AIが一般的な知識では答えられても、自社独自のルールや過去の経験に基づく判断を反映できないことが背景にあると分析する。記事の最後では、taiziiiの「SkillRelay」（スキルリレー）が紹介されている。ベテラン社員の判断基準を対話から引き出して検証し、次世代へ継承する判断継承AIプラットフォームだという。AIが人に代わって判断するのではなく、人が適切に判断するための基準を参照できる環境づくりを支援するとしている。【ポイント・注意点】使われない理由の上位には、精度や費用対効果だけでなく、現場への浸透や入力の手間といった運用面の課題も並んだ。ツールの性能だけでなく、自社の判断基準をどう渡すかが定着の鍵になりそうだ。なお、この調査は記事の最後で自社サービスを紹介しているtaiziii自身によるもので、有効回答は170人と規模も限られる点には注意したい。記事の後半は会員向けで、本稿は公開範囲の内容に基づいている。","2026-11-22","キーマンズネット（ITmedia）","https://kn.itmedia.co.jp/kn/article/2611/22/2000003384/"],["Signal、スマホでの画面撮影を制限　OSのAIエージェントを「存亡の脅威」","暗号化メッセージアプリのSignalは11月21日、AndroidとiOSのアプリで画面のスクリーンショットを制限すると発表した。メレディス・ウィテカー代表は、画面の中身を読み取れるAIエージェントをOSに組み込む動きを「存亡に関わる脅威」と呼び、取得されたデータはSignalの管理外に保存されうると指摘した。設定は無効にできるが、その場合はプライバシーの保証が崩れるという。代表自身もこの対策は「不完全」と認めている。","\n【概要】暗号化メッセージアプリのSignalは11月21日（金）、AndroidとiOSのアプリでスクリーンショットを制限すると発表した。TechCrunchによると、これはSignalのメレディス・ウィテカー代表が、エージェント型AIを組み込むOSによる「存亡に関わる脅威（existential threat）」と呼ぶ問題への対応だという。Signalはすでに、Windowsではスクリーンショットを既定で禁止しており、同様の制限をモバイルにも広げる形になる。【背景】WindowsやAndroid、macOSやiOSといったOSに、画面の内容を読み取って作業を代行するAIエージェントを組み込む動きが進んでいる。ウィテカー氏は、画面を「スキャン」できるAIエージェントがあることで、各OSがSignal単独でプライバシーを保証する力を損なっていると書いた。アプリ側でいくら通信を暗号化しても、端末の画面に表示された内容がOSの側で読み取られれば、その保護は及ばなくなる。【詳細】ウィテカー氏によれば、こうした形で取得されたデータは、OSレベルのエージェントが使うローカルのデータベースや遠隔のサーバーに保存されうるが、それはSignalの管理の外にある。今回の制限は、ユーザーが設定で無効にすることもできる。ただし同氏は、無効にすると「プライバシーの保証が壊れる」と説明している。さらに同氏は、この対策は「不完全」だとも述べた。AIエージェントがアプリのデータにたどり着く手段は画面の撮影以外にもあり、それらには対処していないためだ。【ポイント・注意点】AIエージェントの便利さと、他のアプリが守ろうとする秘密との間に衝突が起きていることを示す事例だ。OSに組み込まれたAIは、ユーザーの許可のもとでも、アプリ開発者が想定しない形で画面の情報を扱う可能性がある。Signalの対策はあくまでスクリーンショットに限られ、根本的な解決にはOS側の仕組みや、アプリとAIの間のルール作りが必要になりそうだ。利用者は、自分の端末でどのAI機能が画面を読み取っているかを確かめておきたい。","2026-11-21","TechCrunch","https://techcrunch.com/2026/11/21/signal-restricts-mobile-screenshots-as-it-confronts-existential-threat-of-ai-surveillance/"],["Thinking Machines、ノートPCで動く「Inkling 2 Mini」公開","Thinking Machines Labがオープンウェイトのマルチモーダルモデル「Inkling 2 Mini」を公開した。総パラメータは26.4Bで、約20GBのメモリで32GBのMacBook Proや単一のデスクトップGPUでもオフラインで動く。中間の12層を3回繰り返す「looped transformer」を採用し、SWE-bench Verifiedで79.2％を記録した。Apache 2.0ライセンスだが、事実の想起では大型モデルに劣る。","\n【概要】米VentureBeatによると、Thinking Machines Labはオープンウェイトのマルチモーダルモデル「Inkling 2 Mini」を公開した。総パラメータは26.4Bで、約20GBのメモリで動作し、32GBのMacBook Proや単一のデスクトップGPUでオフライン利用できる。ライセンスはApache 2.0となっている。【背景】Thinking Machines Labは、ミラ・ムラティ氏らが2025年初めに創業した企業で、2025年7月に20億ドルのシード資金を調達した。11月5日には、総パラメータ594B（アクティブ17B）の「Inkling 2 Small」を公開しており、今回のMiniはそれに続くモデルとなる。手元の機器で動く高性能モデルへの需要が高まる中での発表だ。【詳細】最大の特徴は「looped transformer」という設計だ。中間の12層を3回繰り返して使うことで、トークンあたり48層分の実効的な深さと、実効アクティブ5.4Bパラメータを得る。記事が引用するベンチマークでは、DeepSWE v1.1で48.2％、SWE-bench Verifiedで79.2％、SWE-bench Pro v2 Hardで77.9％を記録した。Artificial Analysis Intelligence Indexでは20.1で、Alibabaの「Qwen3.8-27B」と並ぶ。同社によれば、タスクあたりの計算量は約2.8分の1、速度は約4倍、コストは約6分の1になるという。一方、事実の想起を測るAA-Omniscience v1.1では-8.6と、大型モデルに劣る結果だった。【ポイント・注意点】同じ層を繰り返し使うことで、メモリを抑えながら深い計算をさせる発想は、ローカルで動くモデルの性能を引き上げる一つの道筋になりうる。プログラミング系の指標で高い値を示した点は、開発者が手元で使うコーディング支援への応用を期待させる。ただし、知識を問う課題では弱さが見えており、事実確認が重要な用途では注意が必要だ。また、計算量や速度、コストの比較は同社の説明によるもので、比較の条件は利用者自身の環境で確かめたい。","2026-11-21","VentureBeat","https://venturebeat.com/technology/thinking-machines-wows-with-inkling-2-mini-looped-transformer-model-that-runs-locally-on-laptops"],["AI動画編集は人並みか　FlexClipとCutBayを小寺信良氏が試す","ITmedia NEWSで小寺信良氏が、香港PearlMountain社のAI動画編集ツール2種を試した。ブラウザで使う「FlexClip」は51分の講座動画から約1分の切り抜きを複数作り、「バズる可能性」を82％などと評価した。AIと対話して作る「CutBay」では開封動画の1分版を依頼したが、1回目は素材がそのまま出力され、2回目は指示したオープニングや音楽が入らなかった。","\n【概要】ITmedia NEWSで、映像の専門家である小寺信良氏が、AIによる動画編集ツール2種を試した記事が公開された。対象は香港のPearlMountain社の「FlexClip」と「CutBay」だ。同社は2006年から事業を続けており、香港法人は2016年7月に設立された。筆者はテスト用の生成クレジットの提供を受けて試用している。【背景】動画の切り抜きや短尺化は、YouTubeやSNSで発信する人にとって手間のかかる作業だ。AIで長い動画から見どころを抜き出したり、指示どおりに編集したりするサービスが増えており、どこまで人の手に代われるかが関心を集めている。【詳細】FlexClipはブラウザで使うオンライン動画編集ツールだ。筆者が以前YouTubeに上げた51分の「DaVinci Resolve」のチュートリアル動画を素材にすると、約1分の切り抜き動画が複数生成され、それぞれに「バズる可能性」のAI評価が付いた。最初の動画は82％と表示された。切り抜く範囲は書き起こし文から指定でき、YouTubeへ投稿する際はAIが煽り系のタイトルを書き、タグも自動で入れる。ただし、2人の対談動画では、タイムライン編集画面との連携が「Chrome」限定のようで、「Opera Air」では移れなかった。字幕と映像のタイミングは「リンク」で固定する必要があった。編集後の結果は一覧に戻せず、書き出してからアップロードするため、その場合はAIのタイトル支援を使えないという。CutBayはAIと対話して動画を作るWebサービスで、素材は300MBまでアップロードできる。「MacBook Neo」の開封動画を素材に1分の動画を頼むと、AIは編集のテーマや音楽の方針を選択肢で尋ね、音楽は試聴して選べた。しかし1回目は素材動画がそのまま完成品として出力され、生成クレジットは消費されなかった。2回目は1分にまとまったが、指示したオープニングとエンディング、音楽が入っていなかった。【ポイント・注意点】切り抜きの候補出しやタイトル付けなど、部分的な作業ではAIが役に立つ一方、細かな指示どおりの仕上げにはまだ課題があることがうかがえる。記事は3ページ構成で、AIと人間がそれぞれ作った動画の出来の比較は最終ページで扱われている。","2026-11-21","ITmedia NEWS","https://www.itmedia.co.jp/news/article/2611/21/2000003387/"],["自分の顔をAIに貸す俳優　マイクロドラマ新興Shorticalの試み","2025年1月創業のShorticalは、AIで生成する短い恋愛ドラマを配信する新興企業だ。最新作「Inevitable」は全編AI製で、自分の顔の利用権を同社に許諾したイスラエルの俳優アキ・アヴニ氏が本人役で出演した。同社の「顔の利用許諾」プログラムはまだ契約実績がなく、報酬額も非公表。中国の企業が顔の利用に15〜700ドルを払っているという報道もあり、業界には懐疑の声もある。","\n【概要】TechCrunchは、AIで生成した短い連続ドラマ（マイクロドラマ）を手がける新興企業Shorticalを取り上げた。同社は2025年1月の創業で、AI生成の短い恋愛シリーズを制作している。最新作「Inevitable」は先週ロサンゼルスで初公開された全編AI製の作品で、イスラエルの俳優アキ・アヴニ氏が、自分の顔の利用権を同社に許諾したうえで本人役として出演している。【背景】スマートフォンで見る短いドラマは新しい娯楽の形として広がっており、AIで制作費を抑えようとする動きもある。一方で、俳優の顔や姿をAIで再現することには、報酬や権利をめぐる懸念がつきまとう。マイクロドラマ業界の関係者からは、投資家がAIの要素を求めるようになっているとの声も出ている。【詳細】Shorticalは主に購読料で収益を上げており、最初の7〜10話は無料で見られる。ガイ・シモニCEOは、AIによって少人数のチームでも壮大な作品を作れるようになったと語り、視聴者の多くは米国にいるという。アヴニ氏はTechCrunchに対し、これを新しい種類の芸術であり新しい形式だと考えていると話した。同社には「顔の利用許諾（LICENSE YOUR FACE）」というプログラムがあるが、広報によればまだ契約は一件も結ばれていない。アヴニ氏の契約は直接交渉によるもので、報酬は同等のAIを使わない役の業界水準に沿っていたというが、同社は金額を明らかにしていない。Rest of Worldの報道では、中国のマイクロドラマ企業が顔の利用に15〜700ドルを支払っていたという。Shorticalはクリエイターへの支払いのためにPayouts.comと提携した。Vertical Drama Loveのジェニファー・クーパー氏は、ベンチャー投資家がAIの要素を求めていると指摘しつつ、視聴者の需要には懐疑的だ。【ポイント・注意点】俳優が自分の顔を「貸す」形は、AI時代の新しい出演の形として注目される。ただし契約実績はまだ一件にとどまり、報酬の水準も公開されていない。顔の利用料の相場は大きく開いており、権利の扱いや適正な対価をどう決めるかは、業界全体の課題として残る。","2026-11-21","TechCrunch","https://techcrunch.com/2026/11/21/is-selling-an-ai-version-of-your-face-to-this-microdrama-startup-the-future-of-hollywood/"],["メッセージアプリで使えるAIエージェントまとめ　評価額100億ドルも","TechCrunchは、iMessageやSMS、WhatsAppなど普段のメッセージで呼び出せるAIエージェントをまとめた。最も話題のInstinctは2026年9月に評価額100億ドルで10億ドルを調達した。Ask Proxyは個人向けが1日1ドル、Pokeは6月にAppleのMessages for Business初のAIエージェントとして承認された。Townは6月に5500万ドルを調達するなど、資金の流入が続いている。","\n【概要】TechCrunchは、iMessageやSMS、WhatsAppといった普段使いのメッセージで呼び出せるAIエージェントを一覧にまとめた記事を公開した。専用アプリを開かずに、友人とやり取りするようにAIへ用事を頼める形のサービスが増えている。【背景】AIエージェントは、予約や調べ物などの用事をユーザーの代わりにこなす仕組みとして注目されている。新しいアプリを入れずに済むメッセージの形は利用の敷居が低く、新興企業が次々に参入し、多額の資金を集めている。【詳細】記事によると、最も話題を集めているのはInstinctで、2026年9月に評価額100億ドルで10億ドルを調達した。Ask Proxyは個人向け版が1日1ドルで、企業向けは大企業で従業員1人あたり月15ドル、49人未満のチームでは23ドルからとなっている。Fambotは2026年9月にベータ版を公開し、プレシードで350万ドルを調達しており、ベータ期間中は無料だ。Pokeは2026年3月に公開され、6月にはAppleのMessages for Businessで初めてのAIエージェントとして承認された。その後、Cognitionが同社の親会社を買収し、取引額は9桁ドル台の前半とされる。Townは2026年6月に、Andreessen HorowitzとForerunnerが主導するシリーズAで5500万ドルを調達した。Tabは評価額3億ドルで表舞台に出た。Sznは16カ国の7500以上の事業者に提供してきたとしている。ほかにも、月21ドルからのMartin、月19.99ドルのTomo、月27ユーロで500タスクのMaverickのProプランなどが紹介され、Caddy、Folk、Haven、Miso、Ohai、Orbits、Rene、Stanley、Wajoといった小規模なサービスにも触れている。【ポイント・注意点】料金は1日単位、月額、タスク数など形がさまざまで、個人向けと企業向けで設計も異なる。大型の資金調達や買収が相次いでおり、競争が激しい分野だといえる。一方、メッセージでAIに用事を任せる場合、やり取りの内容や連絡先などの情報をどこまで渡すかは利用者が意識しておきたい。サービスの入れ替わりも早いため、使う前に提供元や料金の条件を確かめることが大切だ。","2026-11-21","TechCrunch","https://techcrunch.com/2026/11/21/all-the-ai-agents-that-can-live-in-your-text-messages/"],["AIクラスタの性能はリリースの仕組みが決める　VentureBeat寄稿","VentureBeatに、インフラのリリース技術者ヴィナヤク・ヴァシシュタ氏が寄稿した。Metaの論文によれば、Llama 3の訓練では約1万6000基のH100で54日間に466回の中断があり、約78％がハードウェアに関連していた。同氏は、AIクラスタの性能の上限はリリースの仕組みで決まると主張し、テスト専用機での数日の検証や2週間かけた地域別の展開を勧める。AIエージェントの役割は限定すべきだとする。","\n【概要】VentureBeatに、インフラのリリースエンジニアリングを率いるヴィナヤク・ヴァシシュタ氏が寄稿した。同氏は、どれほど高速なAIクラスタでも、更新を配るリリースの仕組み（パイプライン）が性能の上限を決めると主張している。【背景】大規模なAIの訓練では、多数のGPUを長期間動かし続ける必要があり、途中の障害は大きな損失につながる。記事は、Metaが公開したLlama 3の訓練論文を引き、約1万6000基のH100で54日間に466回の中断があり、そのうち419回が予期しないもので、約78％がハードウェアの問題に関連していたと紹介する。【詳細】記事の冒頭では、ファームウェアを段階的に配る作業が6日間進んだところで、ある地域で不正な再起動の割合が基準値を超え、自動的に止まった事例を紹介している。原因は更新そのものではなく、更新前から止まっていたホストのハードウェアの不具合だった。チェックを更新前の状態と比べる形に直し、9日後に作業を終えたという。同氏はGoogle Cloudの「goodput」という考え方を使い、3時間ごとに障害が起き、30分ごとにチェックポイントを取る場合、時間の約6分の1が失われると試算する。対策としては、専用のテスト用機群で数日かけて検証すること、更新と巻き戻しを往復させる試験を行うこと、2週間かけて地域ごとに展開することを挙げる。AIエージェントの役割は、原因の切り分けや後片付け、文書の下書きに限り、ホスト群を操作する判断は人間が行うべきだとしている。【ポイント・注意点】AIの性能競争はGPUの数や速さに目が向きがちだが、実際の稼働では障害と復旧の扱いが成果を大きく左右することを示す論考だ。障害の原因を更新と取り違えないよう、比較の基準をきちんと定める重要性も読み取れる。運用の自動化にAIを使う流れの中で、判断を人間に残すという線引きを示した点も参考になる。なお記事は寄稿であり、試算は特定の条件を置いたものとして読む必要がある。自社の環境に当てはめる際は、障害の頻度や保存の間隔を実情に合わせて見直したい。","2026-11-21","VentureBeat","https://venturebeat.com/orchestration/even-the-fastest-ai-clusters-can-be-held-back-by-their-release-pipelines"],["NVIDIA、決算は好調も株価下落　H200の中国販売停止を表明","TechCrunchのポッドキャスト「Equity」の回の紹介記事で、NVIDIAの近況が語られた。同社は売上の急増を報告したが、ジェンスン・フアン氏のCEO復帰はないとし、株価は下落している。暫定CEOのコレット・クレス氏はH200を中国で販売しないと表明。中国向けの間接的な売上が事業の約20％に上るとの批判的な推計もある。出演者はフアン氏の復帰は考えにくいとみている。","\n【概要】TechCrunchは、ポッドキャスト「Equity」の回を文章で紹介する記事を公開し、AI半導体大手NVIDIAの近況を取り上げた。出演はカースティン・コロセック氏、ティム・デ・シャント氏、アンソニー・ハ氏。NVIDIAは売上が急増したと報告し、経営陣は事態を掌握していると説明したが、株価は下がっており、市場は安心していない様子だという。【背景】記事によると、NVIDIAはジェンスン・フアン氏がCEOに戻ることはないと強調している。一方で、イーロン・マスク氏らはフアン氏の復帰を求めており、署名活動も広がっている。フアン氏自身は、戻る用意があると話しているという。AI向け半導体で圧倒的な存在感を持つ同社の経営をめぐる混乱は、AI業界全体の関心事となっている。【詳細】暫定CEOのコレット・クレス氏は、NVIDIAが今後、H200チップを中国で販売しないと述べた。出演者は、トランプ政権も遠隔からの利用を含めて規制を強めていると指摘した。アンソニー・ハ氏は、NVIDIAの事業の約20％が、マレーシアなど東アジアや東南アジアの国々への販売を通じて、間接的に中国から来ているとする批判的な見方を紹介した。カースティン・コロセック氏は、取締役会は事態を掌握しているように見せたいと考えており、外部の圧力に押されることはないだろうと話した。出演者は、チップが中国へひそかに売られていたとされる件の調査にも触れた。アンソニー・ハ氏は、フアン氏の復帰は考えにくいとしつつ、「絶対にないとは言えない」と述べた。【ポイント・注意点】AIの計算基盤を支える企業の経営体制と、中国向けの輸出をめぐる規制の行方は、AI開発に必要な半導体の供給にも影響しうる。ただし、この記事はポッドキャストでの議論を紹介したもので、事業の約20％という数字も批判的な立場からの推計として紹介されている点に注意したい。今後の経営体制や中国向け販売の扱いは、同社の正式な発表で確かめる必要がある。株価の動きも含め、市場がどう受け止めるかを引き続き見守りたい。","2026-11-21","TechCrunch","https://techcrunch.com/2026/11/21/a-tale-of-two-nvidias/"],["攻撃者のAIエージェントが11分でゼロデイ悪用　Amazonが報告","Amazonによると、攻撃者のAIエージェントがオープンソースの医療画像AIアプリ「MONAI Label」の未知の脆弱性を自ら見つけ、約11分で悪用した。運用者は「シェルを取れ」という目標だけを与えていた。Amazonは攻撃側の調整基盤「Cairn」のサーバーが認証なしで動いているのを見つけ、指示文を読めたという。修正はコードに取り込まれたが、配布中の最新版0.8.5には反映されていない。","\n【概要】VentureBeatは、攻撃者のAIエージェントが未知の脆弱性（ゼロデイ）を自ら見つけて悪用したとするAmazonの発表を報じた。対象はオープンソースの医療画像AIアプリ「MONAI Label」で、エージェントは約11分で、ファイルを本来の保存場所の外に書き込むことに成功したという。攻撃の運用者は、エージェントに「シェルのアクセスを得よ」という一つの目標だけを与えていた。【背景】AIエージェントは防御側だけでなく攻撃側にも使われ始めている。人間が細かく手順を指示しなくても、目標を与えるだけで脆弱性の発見から悪用までを進められるとなれば、攻撃の速度と規模は大きく変わる。【詳細】Amazonは9月10日、攻撃者側のAIエージェントを調整する基盤「Cairn」のサーバーが認証なしで動いているのを見つけ、運用者のプロンプトを読めたとしている。攻撃は9月8日から約48時間続き、中国本土以外の東アジアの大学が狙われた。中国の関与の可能性は「中程度の確度」と評価された。修正は10月19日にメインのブランチに取り込まれた（PR #1915）が、PyPIで配布されている最新版はいまも0.8.5のままで、アドバイザリーにも修正済みの版は示されていない。認証は既定で無効になっており、ANNOTATORという権限でも悪用できるという。管理者には、0.8.5以前が動いていないかの確認、認証の有効化、信頼できないネットワークからの遮断、管理者権限を使わない実行などの回避策が示されている。すでに侵害されていないかの確認も勧められている。【ポイント・注意点】AIが短時間で未知の脆弱性を突いたという報告は、修正の配布が遅れることの危うさを浮き彫りにした。今回は、修正がコード上に存在しても、利用者が入手する配布版には反映されていないという隙間が問題になっている。MONAI Labelを使う組織は、記事に挙げられた回避策をすぐに確かめたい。また、既定で認証が無効なソフトをネットワークに公開する運用自体を見直すきっかけにもなりそうだ。","2026-11-20","VentureBeat","https://venturebeat.com/security/amazon-says-attackers-ai-agents-found-and-exploited-a-zero-day-in-11-minutes-but-no-patched-release-is-available"],["Anthropic、IPOを完了　私募と合わせ約1195億ドル調達","Anthropicは新規株式公開（IPO）の完了を発表した。クラスA普通株11億2700万株を1株83ドルで発行し、引受人の追加購入権1億4700万株の全額行使を含む。総調達額は約935億ドル。同時にAMDやGoogle、Microsoft、NVIDIAなどへの私募で約260億ドルを集め、合計の調達額は約1195億ドルとなった。株式は11月19日にNasdaqで「ANT」として取引が始まった。","\n【概要】米Anthropicは、新規株式公開（IPO）の手続きが完了したと公式に発表した。クラスA普通株式11億2700万株を1株83.00ドルで発行し、これには引受人が持つ1億4700万株の追加購入権がすべて行使された分も含まれる。IPOによる総調達額は約935億ドルで、そのうちAnthropicが受け取る分は約916億ドルとなる。【背景】AnthropicはAI「Claude」を開発する企業で、クラスA株は2026年11月19日にNasdaq Global Select Marketで「ANT」の銘柄コードで取引を始めた。登録届出書は11月18日に米証券取引委員会（SEC）で効力を持った。同社は2026年5月28日付で、650億ドルのシリーズH（ポストマネーの評価額9650億ドル）を発表していた。【詳細】IPOの内訳は、Anthropicが売り出した分が11億335万1354株、既存株主が売り出した分が2364万8646株となっている。IPOと同時に行われた私募では、AMD、Broadcom、Google、Micron、Microsoft、NVIDIA、TSMCの関連会社に対し、クラスN株3億1325万3007株を同じ1株83.00ドルで売却し、約260億ドルを調達した。IPOと私募を合わせた粗調達額は約1195億ドルに上る。主幹事はGoldman SachsとMorgan Stanleyが務めた。【ポイント・注意点】私募の引き受け手には、半導体やクラウドなど、AIの開発と提供を支える主要企業が名を連ねている。巨額の資金は、モデルの開発や計算基盤の確保に充てられるとみられ、AI開発競争の規模の大きさを改めて示した。一方、上場によって同社は株主への説明責任を負うことになり、安全性を重視する方針と成長の両立がこれまで以上に注目される。発表文は手続きの完了を伝える公式の告知で、今後の業績や事業計画は別途の開示を見る必要がある。AI企業の上場としては異例の規模であり、他のAI企業の資金調達の動きにも影響を与える可能性がある。","2026-11-20","Anthropic","https://www.anthropic.com/news/ipo-close"],["アンソロピック上場、時価総額1.27兆ドル　CEO「リスクは避けられる」","Anthropicは11月19日（米国時間）、米NASDAQに上場した。終値は97.17ドルで公開価格の83ドルを上回り、時価総額は1.27兆ドルとなった。ダリオ・アモデイCEOは上場に合わせた挨拶で、AIで科学や医学の進歩を大きく速められると強調する一方、悪用や経済の混乱、制御不能といったリスクも挙げた。そのうえで、リスクは避けられ、それは開発する人々の選択次第だと述べた。","\n【概要】Impress Watchによると、Anthropicは11月19日（米国時間）、米NASDAQ市場に上場した。銘柄コードは「ANT」。終値は97.17ドルで、公開価格の83ドルを上回り、時価総額は1.27兆ドルとなった。上場に合わせて、ダリオ・アモデイCEOがNASDAQで挨拶し、同社のXにも同じ内容の声明が投稿された。【背景】Anthropicは「この時代で最も強力な技術は人類の利益のために開発されるべき」という信念で設立されたと声明で述べている。同社は2026年10月26日に、上場に向けた目論見書を公表していた。安全性を重視する姿勢で知られる企業が、株式市場という新たな舞台に立つことになる。【詳細】アモデイ氏は、父親を、数年後には治療できるようになった病気で亡くしたことに触れ、AIで科学や医学の進歩を大きく速められると強調した。医療のほか、経済成長、貧困からの脱却、民主主義と自由な社会の保護、行政サービスの改善などへのAIの活用にも言及した。一方でリスクとして、悪用による混乱、経済の混乱、AIシステムが制御できなくなることなどを挙げた。そのうえで、リスクは避けられると考えており、避けるかどうかはAIを開発する人々の選択にかかっていると述べた。安全性を重視し、AIシステムが人間の制御の下に置かれ続けると確信できるまで、訓練と導入のペースを調整すると表明した。また、事業上や政治上の圧力には屈しないとしている。【ポイント・注意点】上場初日に株価が公開価格を上回り、市場の期待の大きさを示した。CEOが上場の場で、利益だけでなくリスクと開発のペースの調整にまで踏み込んで語った点は特徴的だ。今後は、株主から成長を求められる中で、表明した安全性の方針をどう守っていくかが注目される。株価や時価総額は日々変わるため、投資判断の材料にする場合は最新の情報を確かめたい。AIの恩恵とリスクの両方を正面から語った声明は、上場企業となった同社の姿勢を測る基準として、今後も繰り返し参照されることになりそうだ。","2026-11-20","Impress Watch","https://www.watch.impress.co.jp/docs/news/2158232.html"],["OpenAI、創薬化学のAI評価指標「MedChemBench」を公開","OpenAIは、AIモデルの創薬化学での推論力を測るベンチマーク「MedChemBench」を公開した。117の論文・特許と761の分子構造に基づく99問で、分子構造の正しさや化合物の選択、数値の予測などを評価する。11モデルを測り、GPT-6.2 Astraが84.5％で首位だった。一方、化合物選択と数値予測は約半分の得点にとどまり、新薬発見の能力を示すものではないと留保している。","\n【概要】OpenAIは、AIモデルが創薬化学（メディシナルケミストリー）でどれだけ推論できるかを測るベンチマーク「MedChemBench」を公開した。分子構造の正しさ、実験結果の説明、化合物の選択、数値の予測といった観点で評価する。問題数は99問で、117の論文・特許と761の分子構造に基づいている。【背景】新薬の候補となる化合物を探す作業は、専門家の知識と多くの実験を必要とする。AIがこの分野でどこまで役立つかを測る物差しが求められており、OpenAIは科学研究向けの取り組みの一環としてこの指標を示した。【詳細】評価したモデルは全体で11。推論の設定を「xhigh」にした場合のスコアは、GPT-6.2 Astraが84.5％、GPT-6 Astraが83.3％、GPT-6.1 Solが82.0％、GPT-5.6 Solが58.2％だった。分野別では、分子構造でAstraが95.4％を得た一方、化合物の選択と数値の予測は約半分の得点にとどまった。例として、18原子の環を組み立て直す問題では、GPT-6 Astraが10回すべてで正解した。これに対し、GPT-5.6 Solは15原子の環を、GPT-5.6 Lunaはばらばらの断片を生成したと説明されている。OpenAIは、モデルが公開された文献に事前に触れていた可能性を否定できないこと、各回答がツールを使わない一回きりの試行だったことを挙げ、この結果は新薬の発見や実験の判断ができることを示すものではないと留保している。【ポイント・注意点】新しい世代のモデルで構造の理解が大きく伸びたことがうかがえる一方、実際の創薬で重要な「どの化合物を選ぶか」「数値をどう見積もるか」はまだ課題が大きい。開発元自身が評価の限界を明記している点は、結果を読むうえで重要だ。なお、ページ内ではGPT-6.2 Astraのスコアについて84.5％と83.3％の両方の記述があり、表記に食い違いが見られる。数字を引用する際は原典を確かめたい。今後、ツールを使える条件での評価が出てくるかも注目点だ。","2026-11-20","OpenAI","https://openai.com/index/introducing-medchembench/"],["Microsoft、AI攻撃にAIで対抗する「Microsoft Perception」","米Microsoftは年次イベント「Microsoft Ignite 2026」で、AIによるサイバー攻撃にAIエージェントで対抗する新サービス「Microsoft Perception」の提供を始めると発表した。攻撃者の視点で弱点を探すレッドチーム、検知と対応のブルーチーム、修復を担うグリーンチームの3エージェントが手順書に沿って自律的に連携し、重要な判断は人間に仰ぐ。修復はAWSやGoogle Cloudにも対応する。","\n【概要】米Microsoftは、日本時間11月18日未明に始まった年次イベント「Microsoft Ignite 2026」で、AIによるサイバー攻撃にAIエージェントで対抗する新サービス「Microsoft Perception」の提供開始を発表した。ITmedia NEWSが、新野淳一氏のブログ「Publickey」（2026年11月19日掲載）の記事を一部編集して転載した。【背景】AIを使った攻撃は完全な自動化が進み、弱点の発見から攻撃までの時間が劇的に縮まっている。そのため、人間が操作して対応するのは難しくなっていると説明されている。守る側にも、同じ速さで動ける仕組みが求められている。【詳細】Perceptionは「レッドチーム」「ブルーチーム」「グリーンチーム」の3つのチームエージェントで構成される。レッドチームは、攻撃を受ける前に攻撃者の視点で脆弱性を見つける。ブルーチームは攻撃の検知、調査、インシデントへの対応を担う。グリーンチームは脆弱性やバグを修復し、リスクを下げる役割を持つ。3つのエージェントは「プレイブック」と呼ばれる手順書に従って日常的に連携し、自律的に動作する。一方で、重要な判断が必要な段階では人間の判断を仰ぐ設計になっている。グリーンチーム用のプレイブックは、Microsoftのプラットフォームだけでなく、AWSやGoogle Cloudにも対応するという。【ポイント・注意点】攻撃、防御、修復の役割を分けたエージェントが協調する構成は、セキュリティ業務の分担をAIに置き換える試みといえる。他社のクラウドまで修復の対象に含める点は、複数のクラウドを併用する企業にとって意味が大きい。ただし、自律的に動くエージェントがシステムに手を入れる以上、どの判断を人間に残すかの設定が重要になる。導入を検討する企業は、手順書の内容と承認の流れを自社の体制に合わせて確かめる必要がある。料金や提供範囲の詳細は、記事の範囲では示されていない。攻撃と防御の双方でAIが使われる時代の到来を象徴する発表といえる。","2026-11-20","ITmedia NEWS","https://www.itmedia.co.jp/news/article/2611/20/2000003368/"],["Meta「Muse」専用メールアドレス、無料ユーザーも作成可能に","米Metaは11月20日（日本時間）、AIエージェント「Muse」専用のメールアドレスを、無料ユーザーを含む全ユーザーが取得できるようにしたと発表した。Museがメールの送受信を代わりに行い、レストランの予約や複数人の予定調整などができる。別のアドレスを認証すれば、そこからメールでMuseに指示も出せる。Metaは予期しない動きをする場合があるとして、監視と必要に応じた介入を呼びかけている。","\n【概要】米Metaは11月20日（日本時間）、AIエージェント「Muse」専用のメールアドレスを、無料ユーザーを含むすべてのユーザーが取得できるようにしたと発表した。これまでは有料ユーザーから順に提供していた。【背景】Museは9月に発表されたMetaのAIエージェントで、公式サイトとアプリで利用できる。日本では10月に提供が始まった。AIエージェントが人に代わって外部とやり取りする場面が増える中、専用のメールアドレスはその窓口となる機能だ。【詳細】専用アドレスは、サービスにログインしてアバターをタップし、「メール」タブに移るか、Museに直接話しかけることで取得できる。メールアドレスと差出人の名前は自分で決められる。ユーザーが持つ別のメールアドレスを認証すると、そのアドレスからメールでMuseに指示を出すこともできる。Museがメールの送受信を代わりに行うことで、レストランの予約や複数人での予定の調整などができるという。一方でMetaは、Museが予期しない行動を取る場合があるとして、動作を見守り、必要に応じて介入するよう注意を促している。【ポイント・注意点】AIが自分専用のアドレスで外部とやり取りすることで、ユーザー本人のメールアドレスを使わずに用事を任せられる点が特徴だ。無料ユーザーにも開放されたことで、AIエージェントに連絡業務を任せる体験が一気に身近になる。ただし、AIが送るメールは相手から見ればユーザーの代理であり、内容の誤りや意図しない約束が生じれば責任の所在が問題になりうる。Meta自身が予期しない動きの可能性を認めている以上、重要なやり取りは送信前後の内容を確かめるなど、人の目による確認を欠かさないようにしたい。また、AIに外部とのやり取りを任せると、相手の連絡先や予定といった情報もAIに渡ることになる。どの用事を任せ、どの用事は自分で行うかを、あらかじめ線引きしておくと安心だ。AIエージェントが人の代わりに連絡を取る使い方が広がれば、受け取る側の企業や店も、AIからの問い合わせへの対応を考える必要が出てくるだろう。","2026-11-20","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/20/2000003372/"],["ChatGPTの常時稼働エージェント「dots」、Plusの一部に解禁","OpenAIのプロダクト責任者ティボー・ソティオ氏は11月19日、ChatGPTの「Plus」プラン加入者の一部に、常時稼働型エージェント「dots」の提供を始めると発表した。法人向け「Business Standard」にも広げる。dotsは設定した目標に沿ってクラウドや手元のコンピューターを操作し、自律的に動く機能だ。OpenAI Japanによると、dotsの週間利用者数は日本が世界2位だという。","\n【概要】OpenAIのプロダクト責任者ティボー・ソティオ氏（通称Tibo）は11月19日（現地時間）、Xで、ChatGPTの「Plus」プラン加入者の一部に、常時稼働型のエージェント「dots」の提供を始めると発表した。法人向けの「Business Standard」への展開もあわせて発表された。【背景】dotsは9月に発表された常時稼働型のエージェント機能で、ユーザーが設定した目標に応じて、クラウドや手元のコンピューターを操作しながら自律的に動く。9月29日に開かれた「OpenAI DevDay」で、サム・アルトマンCEOが発表した。発表当初は、個人向けの「Pro」プラン（月額1万6800円から）と、法人向けの「Business Premium」「Enterprise」でのみ使えた。【詳細】今回、利用できる範囲が、個人向けの「Plus」プラン（月額3000円）と法人向けの「Business Standard」に広がる。Plusについては、まず一部のユーザーから提供を始める。日本法人のOpenAI Japanによると、dotsの週間アクティブユーザー数は日本が世界で2位だという。同社の長﨑忠雄社長も業務でdotsを活用していると紹介されている。【ポイント・注意点】これまで高額なプランに限られていた機能が、より手ごろなプランでも使えるようになることで、利用者の裾野が大きく広がりそうだ。日本での利用が世界でも上位にあるという点は、国内でのエージェント活用への関心の高さを示している。一方、常に動き続け、コンピューターを操作するエージェントは、意図しない操作や情報の扱いに注意が必要になる。どの範囲の操作を任せるか、どのデータに触れさせるかを、使い始める前に整理しておきたい。Plusでの提供は一部のユーザーからで、全員がすぐに使えるわけではない点にも留意したい。法人向けでも提供プランが広がったことで、企業が業務の一部をエージェントに任せる試みが増えるかどうかも注目される。料金と機能のバランスをどう見るかは、利用者それぞれの使い方次第だろう。","2026-11-20","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/20/2000003359/"],["Mac版Geminiに「computer use」　アプリ操作をAIが代行","米Googleは11月19日、Mac版「Gemini」アプリに、AIが画面を認識してクリックや文字入力でアプリを操作する「computer use」機能を追加した。Mac内のファイルやデスクトップアプリ、Webをまたぐ作業を任せられ、作業は別のウィンドウで進むため、ユーザーは自分の作業を続けられる。まず米国の英語版で、有料プラン加入者向けに提供し、日本での提供時期は明らかにしていない。","\n【概要】米Googleは11月19日（現地時間）、Mac版「Gemini」アプリに「computer use」機能を追加したと発表した。AIが画面を認識し、クリックや文字入力でアプリを操作する機能で、まず米国で提供する。日本での提供時期は明らかにされていない。【背景】AIがパソコンの画面を見て人の代わりに操作する機能は、各社が競って取り入れている。記事によると、Anthropicは2026年3月にMac版「Claude」にcomputer useを搭載し、OpenAIは4月にMac版「Codex」にバックグラウンドで操作する機能を加えていた。Googleも今回、Mac版アプリで同様の機能をそろえた形だ。【詳細】ユーザーが複数の手順を要する作業をチャットで伝えると、Geminiがクリック、文字入力、メニューの操作、フォームの入力などを実行する。対象はMac内のファイル、デスクトップアプリ、Webで、これらをまたぐ作業も任せられる。作業は別のバックグラウンドのウィンドウで進み、チャット画面の中にライブプレビューとして表示されるため、ユーザーは自分の作業を続けられる。例として、子どもが描いた蝶のスケッチをBlenderでアニメーション付きの3Dモデルにし、ARアプリで動かす作業や、PDFから重量・寸法・住所を読み取って配送見積もりのフォームに入力する作業、「Googleスライド」で資料を作る作業が紹介された。安全対策として、操作できるアプリはユーザーが選べ、手順はリアルタイムで確認や一時停止ができ、重要な操作の前には承認を求められる。利用には、Apple Siliconを搭載しmacOS Sequoia（15.0）以降のMac、18歳以上の個人向けGoogleアカウント、「Google AI Plus」「Google AI Pro」「Google AI Ultra」のいずれかへの加入が必要で、提供は米国の英語版のみとなる。【ポイント・注意点】作業がメイン画面と別の場所で進むため、AIに任せている間も手が空く点が使い勝手の要になる。ただし、操作できるアプリの選択や承認の設定は利用者に委ねられており、どこまで任せるかを自分で決める必要がある。日本のユーザーは提供開始を待つことになる。","2026-11-20","ITmedia NEWS","https://www.itmedia.co.jp/news/article/2611/20/2000003356/"],["Antigravityを他社AIから使うと停止？　Google Cloud日本法人に聞く","「Google Antigravity」をサードパーティ製のAIツール経由で使うと規約違反となり、アカウント停止もありうるとする規約が話題になっている。Google Cloud Japanは取材に対し、この規約は個人向けプランが対象で、個人向けでは第三者ツール経由の利用を控えるよう求めた。法人プランには別の規約が適用される。Google DeepMindの担当者は「Googleアカウントに影響することはない」と発言したという。","\n【概要】Googleの開発ツール「Google Antigravity」を、サードパーティ製のAIツールを通して使うと規約違反になり、アカウントが停止される可能性があるという規約が話題になっている。ITmedia AI+は、Google Cloudの日本法人に取材し、注意点を整理した。【背景】Antigravityの追加利用規約の6条は、サードパーティのツールでAntigravityにアクセスすることを違反とし、アカウント停止の理由になりうるとしている。一部のユーザーの間では、画面を出さずに起動する「agy -p」コマンドなどを使うと「Googleアカウント全体が止められるのでは」との不安が広がった。有志のXユーザー「金のニワトリ」氏がこの問題を整理した投稿は、表示回数が49万回に達した。【詳細】Googleは公式のFAQで、この制限の理由を「正規の製品ユーザーのエクスペリエンスを著しく低下させる」ためと説明している。記事はGoogle Cloud Japanへの取材を基に、この規約は個人向けプランが対象で、「正規の製品ユーザー」は主に法人向けプランの利用者を指すと整理した。同社は、個人向けの無料プランや「Google AI Pro」で第三者ツールを通じた不正な利用や過剰な利用が起きると、法人ユーザーの体験を損なうおそれがあると説明した。そのうえで、個人向けでは第三者ツールを通じた利用を控えるよう求める一方、法人プランには別の規約が適用されると回答した。法人プランでも、正規のAPIやCLI、IDEの拡張機能などを組織で管理する認証と正規の課金で使い、料金や使用量の制限を回避しないことが前提とされた。また記事は、Google DeepMindのヴァルン・モハン氏が日本のユーザーに対し「Googleアカウントに影響することはない」と発言したと伝えている。【ポイント・注意点】AI開発ツールを別のAIから操作する使い方は広がっているが、プランごとに規約が異なる点には注意が必要だ。個人向けプランの利用者は、第三者ツールを通じた利用を控えるのが無難といえる。規約は改定されることもあるため、使う前に最新の内容を確かめたい。","2026-11-20","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/20/2000003353/"],["京大がAI依存チェックリスト公開　当てはまれば「しばらく離れて」","京都大学の学生相談部門が「AIに悩みを相談する際に気をつけて欲しいこと」と題した文書を公開した。あわせて6項目のAI依存チェックリストを示し、「1日3時間を超えて毎日AIと話す」などに当てはまれば、しばらくAIに触れずに生活してみるよう勧めている。誤情報や迎合的な回答などの課題を挙げつつ、注意して使えば悩み相談に有用だとも述べ、「魔法の杖ではない」と呼びかけた。","\n【概要】京都大学の学生相談部門が、「AIに悩みを相談する際に気をつけて欲しいこと」と題した文書を公開した。現在のAIサービスが抱える課題を指摘したうえで、学生がAIに悩みを相談する際の注意点を挙げている。あわせて6項目のAI依存チェックリストを公開し、当てはまるものがあれば「しばらくAIを触らないで生活してみること」を勧めている。【背景】生成AIは手軽に話を聞いてくれる相手として、悩みを打ち明ける用途にも使われるようになっている。人に相談しにくいことでも気軽に話せる一方、頼りすぎることへの心配も出てきており、大学の相談窓口が学生向けに注意を呼びかけた形だ。【詳細】チェックリストの6項目は、「AIと毎日話しており1日3時間を超える」「AIなしの生活が不安」「人に相談するよりAIに相談している」「AIは機械だと言われると深く傷つく」「人と話すのは煩わしいと感じる」「AIの言うことは疑わない」となっている。現在のAIサービスの課題としては、もっともらしい誤った情報を出すハルシネーション、ユーザーに迎合するような回答、人間のように感じさせてしまう作用が挙げられた。一方で同部門は、AIは「注意して適切に使えば、悩み相談においてとても有用なもの」とも述べている。そのうえで「AIはただお願いさえすれば結果を出してくれる魔法の杖ではありません」と注意を促した。【ポイント・注意点】AIの利用そのものを否定せず、上手な付き合い方を具体的な目安で示した点が特徴だ。チェックリストは、利用時間だけでなく、人との関わりの変化やAIへの信頼の度合いにも目を向けている。学生に限らず、日常的にAIと話す人が自分の使い方を振り返る材料になりそうだ。ただし、このリストは同部門が示した目安であり、診断の基準ではない。不安が強い場合は、AIではなく人の相談窓口を頼ることが大切だ。AIに話を聞いてもらうことと、人とのつながりを保つことを両立させる工夫が、これからの使い方の鍵になるだろう。ほかの大学や職場でも、同じような目安づくりが広がるかが注目される。","2026-11-20","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/20/2000003378/"],["SwitchBot「ハブ4」発表　GPT活用、話しかけて家電を操作","SwitchBotは11月18日、直接話しかけて家電を操作できるスマートリモコン「ハブ4」を発表した。市場想定価格は1万9980円。「Hello Kata」と呼びかけるだけで操作でき、OpenAIのGPTモデルを使って日常の自然な言葉から適切な操作を提案する。画面には状態に応じて変わる目のアニメーションを表示し、天気や室温の確認、ロックやセンサーとの連携にも対応する。","\n【概要】SWITCHBOT株式会社は11月18日、直接話しかけて家電を操作できるスマートリモコン「ハブ4」を発表した。INTERNET Watchが報じた。市場想定価格は1万9980円。本体に音声操作の機能を搭載し、「Hello Kata」と話しかけるだけで家電を操作できる。【背景】スマートリモコンはこれまで、スマートフォンのアプリや別売りのスマートスピーカーを通じて操作するのが一般的だった。生成AIの言語理解を取り入れることで、決まった言い回しでなくても、普段の言葉で家電を動かせるようにする動きが広がっている。【詳細】ハブ4はOpenAIのGPTモデルを活用し、日常の自然な言葉から適切な操作を提案する。画面には目をモチーフにしたアニメーションが表示され、待機中、聞き取り中、処理中、エラー時で表示が変わる。使い方の例として、寝る前に照明を消したりエアコンを調整したりする操作を「おやすみ」シーンとして登録し、「Hello Kata、おやすみシーンを実行して」と話しかけてまとめて実行できる。天気や室内の温度・湿度を声で確認することもできる。SwitchBotロックやCO2センサーと連携すれば、玄関の施錠の状態やCO2の濃度を声で確かめられる。別売りの「SwitchBot スマートデイリーステーション」と連携すると、その日の予定やゴミの収集日も声で確認できる。本体の大きさは約126×94×38mmで、重さは約190g。タッチやダイヤルでの操作にも対応する。【ポイント・注意点】リモコン本体に話しかけるだけで済むため、スマートスピーカーを別に用意しなくてよい点が利点だ。表情のように変わる画面で、AIが聞いているのか処理中なのかが分かるのも使いやすさにつながる。一方、GPTモデルを使う以上、音声の処理がどこで行われるかや、通信が必要かどうかは気になる点で、記事の範囲では詳しく示されていない。購入を考える場合は、提供元の説明でプライバシーの扱いを確かめたい。生成AIが家電の操作という身近な場面に入ってきた例として注目される。","2026-11-20","INTERNET Watch","https://internet.watch.impress.co.jp/docs/news/2157797.html"]],"gh-pop":[["「SiYuan」v3.8.12-alpha.3、ベトナム語とモバイル共有に対応","ノートアプリ「SiYuan（思源笔记）」が11月22日、試験版v3.8.12-alpha.3を公開した。改善は10項目あり、モバイルでの添付ファイル共有、ベトナム語の画面表示、Linuxの動的リンク版でのプロセス内OCR、タグ一覧の並べ替えなどが入った。iOSで起動中に落ちることがある不具合も直した。内部ではElectronをv44.11.5に上げ、ロシア語の利用ガイドも同梱した。正式版の前の確認用で、まだ試験段階の版である。","\n【概要】\nノートアプリ「SiYuan（思源笔记）」の開発チームは2026年11月22日、試験版（プレリリース）のv3.8.12-alpha.3をGitHubで公開した。リリースページは説明文のない変更項目の一覧で、改善10項目、不具合修正1項目、文書1項目、内部の作り直し1項目、開発向け1項目が並ぶ。モバイルまわりの使い勝手と、多言語対応の強化が目立つ内容である。\n\n【背景】\nSiYuanは11月21日にalpha.1、22日にalpha.2とalpha.3を立て続けに出しており、v3.8.12に向けた試験版を短い間隔で重ねている。今回の版には「Pre-release」の印が付いており、正式版の前に利用者が動きを確かめるための版という位置付けだ。ページには公開時点でmasterへの追加コミットが0件と表示されていた。\n\n【詳細】\n改善の10項目は次のとおり。モバイルで添付ファイルを共有できるようにした。AIツール「WorkBuddy」向けの公式コネクタを用意した。モバイルの画像プレビューで指による操作を改善した。動的リンクで作ったLinux版で、OCR（画像の文字読み取り）をプロセス内で動かせるようにした。画面の表示言語にベトナム語を加えた。データベースのセル編集画面の位置合わせを直した。デスクトップのMarkdown編集で、文書への相対リンクに対応した。同期でputFileとスナップショットの索引作りが重なった時の信頼性を高めた。タグ一覧を追加の新しい順に並べられるようにした。同じ階層のタグを手で並べ替えられるようにした。不具合修正は、iOSで起動中にアプリが終了することがある問題の1件。文書では、ロシア語の利用ガイドを組み込んだ。内部ではElectronをv44.11.5に上げた。開発向けには、デスクトップのメインメニューの名前をそろえた。\n\n【ポイント・注意点】\n公開ファイルは11個が並ぶ。破壊的変更は書かれていない。ただし試験版なので、大事なノートを扱う環境では、正式版を待つか、先にバックアップを取ってから試すのが無難だ。iOSで起動時に落ちていた人や、同期の失敗に悩んでいた人には、確かめる価値のある版である。ベトナム語とロシア語への対応で、使える言語の幅も広がった。","2026-11-22","GitHub（siyuan-note/siyuan リリース）","https://github.com/siyuan-note/siyuan/releases/tag/v3.8.12-alpha.3"],["「ffmpeg-skill」v4.7.0、1本の動画に複数の音声トラック","FFmpeg関連のスキル「ffmpeg-skill」が11月22日にv4.7.0を公開した。目玉はaudio.pyの新しい--trackオプションで、1つのファイルに名前と言語付きの音声トラックを複数入れられる。出力は.mov・.mkv・.mp4のどれかに限られ、.movと.mkvは24ビットPCM、.mp4はAACで書き出す。言語はISO 639-2の3文字小文字で指定し、条件に合わない時はerror.reasonで断る理由を返す。","\n【概要】\nGitHubのリポジトリ「kajisho5/ffmpeg-skill」は2026年11月22日、v4.7.0を公開した。リリースノートは4.6.5以降に取り込まれたプルリクエストから自動で作られたもので、新機能は1つ。audio.pyに--track FILEオプションが加わり、1本のファイルへ、名前と言語を付けた音声トラックを複数まとめて入れられるようになった。\n\n【背景】\nこのリポジトリは11月22日だけでv4.6.3、v4.6.4、v4.6.5、v4.7.0と立て続けに版を出しており、開発が非常に活発だ。今回の機能はissue #420の要望に応えたもので、プルリクエスト#714で取り込まれた。ページには「Latest」の印が付いている。\n\n【詳細】\n入力ファイル自身の音（--audio-stream）と、各--trackファイルの最初の音声ストリームが、映像のあとにそれぞれ1本ずつのストリームとして並ぶ。映像は再変換せずにそのまま写す。出力できる形式は.mov、.mkv、.mp4の3つで、.movと.mkvでは音声を24ビットPCM、.mp4ではAACとして書き出す。トラックの名前は--track-name（別名--track-title）、言語は--track-lang（別名--track-language）で、トラックの順番に合わせて繰り返し指定する。言語はISO 639-2の3文字の小文字コードでなければならない。結果のtracks一覧には、番号、ファイル、題名、言語、チャンネル数、長さが入る。track_tagsという手順で名前と言語が正しく付いたかを確かめ、.movではQuickTimeが扱える言語だけを残す。映像より長いトラックは切らずにそのまま残し、track_longer_than_pictureという警告を出す。\n\n【ポイント・注意点】\n条件に合わない指定は、error.reasonで理由を示して断る。理由の種類はtrack_container、track_rebuilds_sound、track_labels、track_languageの4つ。開始タイムコード付きのBWFや多トラックのWAVは書き出さない。不具合修正と破壊的変更は書かれていない。吹き替えや解説音声など、複数の音声を1本にまとめたい作業で役立ちそうな機能だ。","2026-11-22","GitHub（kajisho5/ffmpeg-skill リリース）","https://github.com/kajisho5/ffmpeg-skill/releases/tag/v4.7.0"],["パッケージ管理「pnpm」12.23、platform variants を廃止","JavaScriptのパッケージ管理ツール「pnpm」が11月22日に12.23を公開した。pnpm editなど3つのコマンドが加わった。一方で、プラットフォーム別の作り分け（variant）は廃止され、該当するパッケージはoptionalDependenciesへ移る必要がある。安全面では、otpを設定ファイルから読まなくなり、認証情報はHTTPSかローカル接続にだけ送るようになった。","\n【概要】\nJavaScriptのパッケージ管理ツール「pnpm」は2026年11月22日、pnpm 12.23（タグv12.23.0）を公開した。新しいコマンドとして、pnpm edit、pnpm catalog migrate、pnpm link --hardが加わった。非推奨の警告は、インストール後のまとめ表示に移った。最も大きいのは、プラットフォーム別の作り分けの仕組みを取り除く破壊的変更である。\n\n【背景】\npnpmは同じ日に、11系の11.29も公開した。12.23は12系の最新版にあたり、リリースノートは非常に長い。\n\n【詳細】\n破壊的変更として、platform variants（プラットフォームごとの作り分け）がなくなった。pnpm pack --variant、pnpm publishのvariant関連の設定、package.jsonのvariant項目はすべて廃止された。OSごとの成果物を配っていたパッケージは、optionalDependenciesに並べる形へ移る必要がある。variantを記録したロックファイルで凍結インストールを行うとERR_PNPM_BROKEN_LOCKFILEで失敗するが、pnpm installを一度実行すれば直る。安全面では、otp（ワンタイムパスワード）を設定ファイルから読まなくなり、--otpかPNPM_CONFIG_OTPで渡す形になった。レジストリの認証情報は、HTTPSか、ローカルのループバックへのHTTPにだけ送る。公開するパッケージがdependenciesに非公開のワークスペースパッケージを含む場合は、pnpm packとpnpm publishが失敗するようになった。ほかに、pnpm publishの--new-version、referenceTime設定、--minimum-release-ageも加わった。\n\n【ポイント・注意点】\n数値では、64KiBのデータ片が234KBのメッセージに膨らむ問題が解消され、Homebrew版のNode.jsでは凍結インストールが約3倍速くなったとしている。variantを使っていたパッケージの作者は、移行の手順を先に確かめておきたい。otpを設定ファイルに書いていた人も、渡し方を変える必要がある。","2026-11-22","GitHub（pnpm/pnpm リリース）","https://github.com/pnpm/pnpm/releases/tag/v12.23.0"],["審査対応ツール「app-store-compliance」2.5.1、中国と Google Play の期限を追加","アプリストアの規則対応を調べるツール「app-store-compliance」が11月22日に2.5.1を公開した。Appleの中国本土向け申告とGoogle Playのトレーダー申告という新しい期限を追加し、追跡する期限は33の地域・範囲で112件になった。EUのAI法の記述は統合版の条文に合わせて直した。Windowsで落ちる不具合も直し、「2.5.0で通ったものは止めない」修正版と説明している。","\n【概要】\nGitHubのリポジトリ「mjmirza/app-store-compliance」は2026年11月22日、2.5.1を公開した。題名は「China declarations, Play trader dates, Windows fixes, every X question answered」。ページでは「修正版であり、2.5.0で通ったものが新たに止まることはない」と説明している。アプリストアの規則と期限を追うツールの、新しい期限の追加と記述の訂正が中心だ。\n\n【背景】\n同じ日の未明には2.5.0が出ており、そこで受けた意見に応える形で2.5.1がまとめられた。今回の追加で、追跡する期限は33の地域・範囲にまたがる112件になった。\n\n【詳細】\n新しい期限は3つ。Appleの中国本土向け「App Compliance」の申告（AIで作った合成コンテンツと、安全評価）は、既存アプリでは2027年1月31日までに済ませる必要がある（APPLE-CN-APP-COMPLIANCE-2027）。Google Playのトレーダー（事業者）かどうかの申告は、既存アカウントで2027年2月1日まで（GOOGLE-PLAY-TRADER-STATUS-2027）。2027年3月1日からは、トレーダーと申告した者の連絡先とD-U-N-S番号が表示され、EEAと英国の利用者には「提供元」欄にトレーダー名が出る（GOOGLE-PLAY-MARKETPLACE-DISPLAY-2027）。訂正では、EUのAI法の項目を統合版の条文（CELEX 02024R1689-20260727）に合わせた。以前の記述は第5条(1a)の禁止と第4条のAIリテラシー義務を強く書きすぎていたという。引用の検証機能は、キャッシュ回避の文字列で作り話のニュースIDが隠れないように直した。\n\n【ポイント・注意点】\nWindowsでは、期限の報告が非ASCIIの法律名で落ちる問題を直し、データをUTF-8で読むようにした（#2331）。check-docs.pyとリリース監査もWindowsで動くようになった（#2334）。ただしCIはLinuxで動いており、Windows側は模擬で試したとページは断っている。21の質問すべてに答えるFAQも、4回の事実確認を経て用意された。","2026-11-22","GitHub（mjmirza/app-store-compliance リリース）","https://github.com/mjmirza/app-store-compliance/releases/tag/v2.5.1"],["「Qwen Code」v0.28.4、Gemini 4 の推論の初期値を内蔵","アリババのQwenチームが手がけるAIコーディングツール「Qwen Code」が11月22日にv0.28.4を公開した。Web Shellには作業の成果物を一覧するライブラリの画面が加わり、中核部にはGemini 4向けの推論の初期設定が入った。ローカルの実行状態の保存先を本人だけが読める権限で作るなど、安全面の直しも多い。変更は54件のプルリクエストからなり、破壊的変更はないとしている。","\n【概要】\nAIコーディングツール「Qwen Code」は2026年11月22日、v0.28.4を公開した。リリースページには54件のプルリクエストが並び、Web Shellの新しい画面、Gemini 4向けの推論の初期値、ファイルの権限や文字の扱いの見直しが入った。「破壊的変更」の欄には「既知の破壊的変更はない」と書かれている。\n\n【背景】\nQwen Codeは11月21日にv0.28.3を出したばかりで、同じ22日にはデスクトップ版のv0.28.4も公開された。今回の版には「Latest」の印が付き、公開ファイルは16個ある。ページには中国語のまとめも添えられている。\n\n【詳細】\nWeb Shellには、ローカルのデーモンが扱う作業の成果物を一覧するライブラリの画面が加わった。中身は少しずつ調べ、届いた分から順に表示を更新する（#18071）。画面まわりでは、共通のChatSurface、続きを示すContinueの印、提案のボタンを入れ、スマートフォンでの表示崩れも直した。中核部ではGemini 4の推論の初期値を内蔵した（#18039）。ローカルの実行状態のフォルダは、プロセスの起動時に本人だけが使える権限で作るようにした（#17964）。コマンドの移行では、Markdownの書き出し先を他と重ならない形で作り、衝突した時は元のTOMLを残す（#17873）。拡張機能は、UTF-8のBOM付きで保存されたマニフェストも読めるようになった（#15786）。\n\n【ポイント・注意点】\n修正では、ホスト型Harnessのクライアントの競合（#17961）、空の作業フォルダ設定を未設定として扱う直し（#17965）、テレメトリの新しい区分値（#18022）が入った。自動修正の記録からは、端末の制御文字とUnicodeの双方向上書き文字を取り除く（#16748）。作業中にmcpServersの設定を変えると、対話中のセッションに自動で反映される（#17743）。なお「その他の変更」には、成果物ライブラリの設計を「承認済みだが未実装」とする項目もあり、目玉の説明と食い違って見える点には注意したい。","2026-11-22","GitHub（QwenLM/qwen-code リリース）","https://github.com/QwenLM/qwen-code/releases/tag/v0.28.4"],["AIチャット「LobeHub」v2.3.5、エージェントの表紙色の不具合を修正","AIチャット基盤「LobeHub」が11月22日にv2.3.5を公開した。新しく入れるとUI部品の6.19.0が選ばれ、古い7色の色表で型検査に失敗したり、自動で作るアバターの表紙色が未定義になったりする問題があった。今回は水色・緑・赤の3色を戻し、各色をテーマの値に結び付けて直した。共有アップロードの排他制御の試験も取り込み、505件の試験が通ったとしている。","\n【概要】\nAIチャット基盤「LobeHub」は2026年11月22日、v2.3.5を公開した。ページの説明によると、これは本体のプルリクエスト#23632を一般向けのリリース系統に移した版で、「AIの支援を受けた貢献」という印が付いている。中身は、エージェントの表紙色が欠ける不具合と、試験の修正の2つである。\n\n【背景】\n問題は、mainを新しく入れた時に起きていた。依存関係の解決でUI部品の@lobehub/ui@6.19.0が選ばれると、古い7色の色表では型検査に通らず、自動で作るアバターの一部で表紙色が未定義になっていた。修正前の版は型検査でTS2739というエラーを出して失敗していたという。\n\n【詳細】\n今回の版は、プルリクエスト#23624で入った水色、緑、赤のエージェント表紙色を、一般向けのリリース系統へ持ち込んだ。新しい色はそれぞれテーマの値に結び付け、色を引くキーは型から推し量る形にした。こうすることで、このリリースが許す範囲にある古い版のUI部品でも動き続ける。あわせて、トランザクション単位で行う共有アップロードの排他制御について、試験版系統の試験も移した。この試験の問い合わせは、試している共有のロックだけを数えるように直された。\n\n【ポイント・注意点】\n検証では、修正後の版は型検査を通り、ワークスペースの505件の試験もすべて通った。関係のない勧告ロックを2つ持った状態でも、エージェント共有の試験60件が通ったという。受け入れの確認は/agentsの画面で行い、修正前はカードの背景が無地だったのに対し、修正後はテーマの色が出た。デスクトップ版の基準はv2.3.4を引き継いでいる。破壊的変更は書かれていない。今回の不具合は、新しく入れた環境で依存関係の解決によって新しい版のUI部品が選ばれた時に起きるもので、前から使っている環境では気付きにくい。自分で立てて使っている人で、エージェントのカードが無地に見えていた場合は、この版で直る可能性がある。AIの支援を受けた貢献である点も、ページで明示されている。","2026-11-22","GitHub（lobehub/lobehub リリース）","https://github.com/lobehub/lobehub/releases/tag/v2.3.5"],["メモアプリ「Memos」26.11.2、コメントをメモの一種に統合","自分で立てて使うメモアプリ「Memos」が11月22日に26.11.2を公開した。一覧でメモの横にコメントを出せるようになり、全幅のタイムライン表示や保存済みビューの並べ替えも加わった。コメントは親を持つメモとして扱う形に変わり、コメント専用のAPIとMCPツールは廃止された。26.11.1でMariaDBの移行が失敗した問題も直り、起動できなかった環境はこの版へ直接上げられる。","\n【概要】\nメモアプリ「Memos」は2026年11月22日、26.11.2を公開した。見どころは3つで、一覧でメモの横にコメントを出す表示、全幅のタイムライン表示、保存済みビューの並べ替えである。一方で、コメントの仕組みが作り替えられ、コメント専用のAPIがなくなる破壊的な変更も含まれる。\n\n【背景】\n前の26.11.1では、添付ファイルの索引を作る移行処理が、MariaDBで「Unknown column 'IS_VISIBLE'」というエラーを出して失敗していた。今回の版はこの問題を直し、試験にもMariaDB 11.4を加えた。新しい貢献者は5人で、Windows（ARM64）向けの実行ファイルも配る。\n\n【詳細】\nコメントを一覧に出す機能は、「設定」の「好み」にある「この端末」で有効にする。直した点は多く、公開範囲を選ぶ画面の文言、Markdownモードでの韓国語IMEでの空白、引用符やバックスラッシュを含むメモのリンク検索などがある。外部リンクの添付のサムネイル、HTTPのサーバーでの共有リンク、タグの件数、カレンダーも直した。長いメモの解析が速くなり、500件を超えるメモを書き出した時にリンクが重複する問題も解消された。APIにはUserService.ReorderMemoViews、メモのparentとnameで絞る条件、Memo.comment_countが加わった。\n\n【ポイント・注意点】\nコメントは、親（parent）を持つメモとして扱うように変わった。そのためListMemoComments、GET /api/memos/{memo}/comments、CreateMemoComment、MemoRelation.Type.COMMENTは廃止された。MCPツールのmemo_list_memo_commentsとmemo_create_memo_commentもなくなった。コンパクト表示の切り替えは「好み」に移った。データベースの形は26.11.1から変わらないので、26.11.1で起動できなかった環境はそのまま26.11.2へ上げられる。26.11.0以前から上げる場合は26.11.1の手順に従う。MySQLとMariaDBで失敗の残りのidx_attachment_memo_id_typeがある時は、消してからやり直す必要がある。","2026-11-22","GitHub（usememos/memos リリース）","https://github.com/usememos/memos/releases/tag/26.11.2"],["「Plannotator」v0.29.2、エージェントのコマンド実行カードを追加","AIエージェントとの作業を受け取る「Plannotator」が11月22日にv0.29.2を公開した。「ほぼInboxのための版」で、107件のプルリクエストのうち32件は外部の25人によるもの。エージェントが示したコマンドをその場で実行するRunカードや、APIキーなどの秘密情報をOSの保管庫に預ける仕組みが加わった。Claude Code向けの表示にはClaude Code 2.1.322以降が必要になる。","\n【概要】\n「Plannotator」は2026年11月22日、v0.29.2を公開した。ページは「ほぼInboxのリリース」と説明しており、取り込んだプルリクエストは107件、そのうち32件は外部の25人の貢献者によるものだという。エージェントがメッセージに書いたコマンドを実行するカードや、秘密情報の受け渡しなど、エージェントとのやり取りを扱う機能が大きく増えた。\n\n【背景】\nPlannotatorは11月18日にv0.29.0、19日にv0.29.1を出しており、今回は1週間で3つ目の版になる。今回の版には「Latest」の印が付いている。リリースノートは長く、新機能の一覧に加えて既知の問題の一覧も載っている。\n\n【詳細】\nRunカードでは、エージェントがメッセージに入れたコマンドを、そのスレッドを持つコンピューターで実行できる。停止ボタン、終了コード、かかった時間が表示され、見えない文字を含むコマンドは実行できない。秘密情報の機能では、エージェントがAPIキーなどを求めると、macOSのキーチェーン、LinuxのSecret Service、WindowsのDPAPI、または本人だけが読めるファイルに保存し、エージェントには名前しか見せない。ほかに、一覧のエージェント表示、Cmd+Kやエージェントが連携先のコンピューターのスレッドを読む機能、未解決の質問をまとめて聞き直す「Re-ask all」が入った。コードレビューには含める・除くの絞り込み、独自テーマを足すplannotator theme add、NightfoxとTritanopiaの内蔵テーマ、一括既読も加わった。\n\n【ポイント・注意点】\nClaude Codeのエージェントカードに文脈の量を出すには、Claude Code 2.1.322以降が必要だ。Claude Codeのプラグインが自動で再読み込みしないようにするには、PLANNOTATOR_AUTO_RELOAD=0か、config.jsonの\"autoReload\": falseを使う。多数のスレッドを持つサーバーでは、ある報告例で見回り1回が約160ミリ秒から4ミリ秒に縮んだ。Mermaidのラベルからページが移動・送信されうる問題など、安全面の修正も含まれる。破壊的変更は書かれていない。","2026-11-22","GitHub（backnotprop/plannotator リリース）","https://github.com/backnotprop/plannotator/releases/tag/v0.29.2"],["「KoboldCpp」1.125.1、音声認識と読み上げを強化","ローカルでAIを動かす「KoboldCpp」が11月22日に1.125.1を公開した。上流のllama.cppの読み上げモデルや、Qwen3ASRとSenseVoiceによる文字起こし、単語ごとの時刻合わせに対応した。ウェブ検索をMCPのツールとして出す機能や、BeaverNetの作業役の内蔵も入った。一方、--passwordを付けると生成の窓口すべてにAPIキーが必要になるなど、小さな破壊的変更もある。","\n【概要】\nローカルでAIモデルを動かすソフト「KoboldCpp」は2026年11月22日、koboldcpp-1.125.1（タグv1.125.1）を公開した。同じ日に出た1.125の修正版で、「Latest」の印が付いている。文章生成の新しいモデルへの対応に加え、音声の読み上げ、文字起こし、画像生成と、扱える範囲が大きく広がった。\n\n【背景】\n今回は上流の対応を引き継ぐ形で、Inkling 2 MiniやXing 4.0 29BA4Bといった文章生成モデルに対応した。配布ファイルは9つで、Windows用のkoboldcpp.exe、Linux用、古いPC向けのCUDA 11とAVX1版、CUDAなし版、Apple Silicon版が並ぶ。\n\n【詳細】\n音声では、上流のllama.cppの読み上げモデル（例としてKokoro）、Qwen3ASRとSenseVoiceによる文字起こし、単語ごとの時刻を出すMMSとQwen3の強制アライナーに対応した。BeaverNetの作業役を内蔵して動かせるようになり、KoboldCppのウェブ検索はMCPのツールとして使えるようになった。gzipで圧縮したHTTPリクエストも受け付ける。画像では、MiniMax H3 Imageと、参照画像を文中に挟むプロンプト（<image:1>）に対応し、sdcppのAPIとの簡単な互換層も加わった。エージェントには削除のツールと/attachコマンドが入った。修正では、CUDAでのChatterboxの読み上げ、noscript表示でのXSSのおそれ、FreeBSDとtermuxのビルドなどを直し、Windows版はWindows 7でも動く形になった。\n\n【ポイント・注意点】\n「小さな破壊的変更」として、LTXの動画生成から音声への対応が外された。--passwordを設定すると、生成の窓口すべてにAPIキーが必要になり、noscript表示は--passwordと併用できなくなる。--whispermodelは--transcribemodelに名前が変わり、要求の時間切れは--reqtimeoutの値を読む。YuE2のVRAM使用量は減った。1.125.1では、BeaverNetの作業役が接続時に提供元を有効にする直しと、単語単位で一致させるWIキーが加わった。","2026-11-22","GitHub（LostRuins/koboldcpp リリース）","https://github.com/LostRuins/koboldcpp/releases/tag/v1.125.1"],["「Browser Use」1.0.8、判定役のキャッシュ活用で課金を抑制","AIにブラウザーを操作させる「Browser Use」が11月22日に1.0.8を公開した。判定役を実行の延長の1手として動かし、提供元のキャッシュを使って記録の再課金を避けるようにした。APIキーがないSSHや画面のない機械では、表示されるリンクとコードを別の端末で承認すれば続行できる。パスワード欄の値を表示しない直しや、残高が少ない時に途中で断られにくくする変更も入った。","\n【概要】\nAIにブラウザーを操作させるライブラリ「Browser Use」は2026年11月22日、browser-use 1.0.8を公開した。インストールはpip install 'browser-use==1.0.8'で行う。リリースノートは6項目と短いが、費用の抑え方、認証の手間、安全面の直しなど、日々の利用に効く変更がそろっている。\n\n【背景】\nBrowser Useは前の1.0.7でMCP呼び出しが60秒で切れる問題を直したばかりで、短い間隔で修正版を重ねている。今回の版には「Latest」の印が付き、関連するプルリクエストとして#6489と#6504が挙げられている。\n\n【詳細】\n1つ目は判定役（judge）の動かし方で、実行の延長の1手として動かすようにした。これにより提供元は記録をキャッシュから読めるので、記録全体にもう一度課金されずに済む。判定の項目は変わらない（#6457）。2つ目は認証で、SSH越しや画面のない機械でAPIキーがない場合、リンクとコードを表示し、別の端末で承認すれば実行を続けられる（#6427）。3つ目は、思考モードのDeepSeekやQwenが、手数の上限で強制する最後の呼び出しを拒んだ場合の扱いで、強制せずにもう一度頼むことで、答えを返せるようにした（#6453）。\n\n【ポイント・注意点】\n安全面では、bu.typeがパスワード欄の値を表示しなくなった（#6455）。Browser(cdp_url=...)は、すでに開いているページが1つだけの時、新しい空のタブを開かずにそのページにつながる（#6456）。Browser Useのゲートウェイ経由の呼び出しでは、出力用に確保するクレジットを32,768トークン分から16,384トークン分へ減らした。これで残高が少ない利用者が実行の途中で断られにくくなる（#6461）。破壊的変更は書かれていない。全体として、大きな新機能よりも、費用、認証、安全の3つの面で日々の使い勝手を整える修正版である。SSH越しや画面のない機械で動かしている人や、DeepSeekやQwenの思考モードで答えが返らなかった人は、上げて試す価値がある。","2026-11-22","GitHub（browser-use/browser-use リリース）","https://github.com/browser-use/browser-use/releases/tag/1.0.8"],["障害対応AI「OpenSRE」、MCPサーバーを道具として取り込み","障害対応のAIエージェント「OpenSRE」が11月22日に0.1.2026.11.22を公開した。opensre integrations setup mcpでMCPサーバーを設定でき、設定したMCPサーバーを型付きで、許可の関門を通る道具としてエージェントに渡せるようになった。外部への書き込みは強い自動モード以外では事前に確認し、すべての道具の副作用を明示する。Windowsでは引き続きWSLの利用を求めている。","\n【概要】\nTracer-Cloudのリポジトリ「opensre」は2026年11月22日、OpenSRE 0.1.2026.11.22（タグv0.1.2026.11.22）を公開した。前日の0.1.2026.11.21からのコミットは6件で、すべて同じ開発者によるもの。MCPサーバーの取り込みと、外部への書き込みに対する確認の強化が柱である。\n\n【背景】\nOpenSREは日付を版番号にした形で、ほぼ毎日新しい版を出している。今回の版には「Latest」の印が付き、公開ファイルは14個ある。インストールはcurl -fsSL https://install.opensre.com | bash -s -- --release --version 0.1.2026.11.22を実行し、opensreで起動する。Windowsについては「WSLを使う」よう案内している。\n\n【詳細】\n新機能は2つ。1つ目は、opensre integrations setup mcpでMCPサーバーを設定できるようにしたこと（#7088）。2つ目は、設定したMCPサーバーを、型付きで、許可の関門を通るエージェントの道具として橋渡しすること（#7085）。修正は3つで、ログ検索を別の窓口へ回してしまう索引パターンを拒むようにした（#7086）。CloudWatchの道具はAWS_REGIONの設定に従い、指標の時間幅を送るようになった（#7090）。/auto highより下の自動モードでは、外部への書き込みの前に確認を求め、すべての道具の副作用を明示するようにした（#7083）。文書では、CloudWatchとEKSのページを加え、CI/CD以外の障害対応にも使えることを書き足した（#7081）。\n\n【ポイント・注意点】\n外部への書き込みを事前に確認する変更は、エージェントが本番環境に勝手に手を加える事態を防ぐ方向の改良だ。ログ検索の行き先をすり替える索引パターンを拒む直しも、安全面で意味がある。破壊的変更は書かれていない。CloudWatchを使っている人は、AWS_REGIONの設定がそのまま効くようになった点を確かめておきたい。","2026-11-22","GitHub（Tracer-Cloud/opensre リリース）","https://github.com/Tracer-Cloud/opensre/releases/tag/v0.1.2026.11.22"],["PDF道具箱「Stirling-PDF」3.5.0、LibreOfficeを独自変換に置き換え","PDFを編集・変換する「Stirling-PDF」が11月22日に3.5.0を公開した。Dockerのコンテナ内でLibreOfficeの代わりに独自の「Stirling Office Convert」を使うようになり、Officeの変換が速く質も上がったという。次の3.5.1ではDockerイメージが半分の大きさになる見込み。一方で、Word 97-2003形式（.doc）への書き出しなど、いくつかの形式が使えなくなる。","\n【概要】\nPDFの編集・変換ツール「Stirling-PDF」は2026年11月22日、v3.5.0を公開した。題名は「3.5.0 New Conversions are Live! and Desktop reload fix and more」。最大の変更は、Dockerのコンテナで使っていたLibreOfficeを、独自の「Stirling Office Convert」に置き換えたことである。作者は、3.5.1ではDockerイメージが半分の大きさになると書いている。\n\n【背景】\nこれまでOffice文書の変換はLibreOfficeに頼っていた。今回の置き換えで、Officeの変換は速くなり、質も上がったとリリースノートは説明する。あわせて、LibreOffice、Calibre、Weasyprint、OpenCVといった外部の道具に頼る作りからも離れつつある。\n\n【詳細】\nOffice変換まわりでは、圧縮の機能もOffice Convertを使うようになった。HTMLからPDFへの変換では拡大率の指定が再び使える。管理者向けには、同時に走らせるOffice変換の数に上限を設け、残りを順番待ちにする設定が加わった。壊れたOffice文書、電子書籍、HTMLのファイルには「読み取れなかった」という案内を出す。デスクトップ版はPDFの処理部品を最初から入れて操作を速くし、表示やファイル一覧の動きも改善した。JPDFiumは1.3.1と1.3.2に上げた。テキスト編集では数式にアクセシビリティ用のタグを付けられ、サインインしていないデスクトップ利用者には、アカウントが必要な道具でサインインを促す。修正では、開いて間もなく文書が読み直される問題、フォームの値が二重に見える問題、ダークモードで値が見えない問題、サムネイルが「読み込み中」で止まる問題を直した。\n\n【ポイント・注意点】\n破壊的変更がある。PDFからWord 97-2003形式（.doc）への書き出しはなくなり、docxかodtを使う必要がある。APIでdocを求めるとエラーが返る。.wpd、.wps、.lwp、.abw、.hwp、.xpsの各形式は変換の入力として受け付けなくなった。消えた道具を指すgroupsToRemoveは何も無効にしない。古い形式を扱っている人は、上げる前に確かめたい。","2026-11-22","GitHub（Stirling-Tools/Stirling-PDF リリース）","https://github.com/Stirling-Tools/Stirling-PDF/releases/tag/v3.5.0"],["AIとUIをつなぐ「AG-UI」、認証の抜け穴を修正し破壊的変更多数","AIエージェントと画面をつなぐ通信規約「AG-UI」が11月21日、複数パッケージをまとめたリリースを出した。Python向けのag_ui_adk 0.14.0は、/agents/stateと/capabilitiesで依存関係を渡さず認証を飛ばせた問題（GHSA-jhvp-j8pf-5vh5）を直した。LangGraph向けは再開の扱いを見直し、OpenAI Agents向けは一時停止した道具の呼び出しに署名を付ける。各パッケージに破壊的変更がある。","\n【概要】\nAIエージェントと利用者の画面をつなぐ通信規約「AG-UI」は2026年11月21日、「Release 2026-11-21」を公開した。npmとPyPIの複数のパッケージをまとめて出した版で、パッケージごとに説明が付いている。認証の抜け穴を含む安全面の修正が中心で、どのパッケージにも破壊的変更が含まれる。\n\n【背景】\nAG-UIは日付を名前にしたリリースを出しており、前回は11月17日だった。今回はLangGraph、ADK、OpenAI Agents向けのパッケージが一斉に更新された。\n\n【詳細】\nnpmの@ag-ui/langgraph 0.0.47は、durabilityの設定と、forwardedPropsの許可リストを加えた。続きの実行は、スレッドの履歴で最後に動いたノードからだけ再開し、保留中の割り込みを落とさなくなった。PyPIのag_ui_adk 0.14.0は、/agents/stateと/capabilitiesにdependenciesを渡すようにして、認証を飛ばせた問題（GHSA-jhvp-j8pf-5vh5）を直した。要求のヘッダーをstate.headersより優先し、オブジェクトでない実行状態はHTTP 422で拒む。ag-ui-langgraph 0.0.48は、続きの実行の抜け穴と道具の結果の流し方を直し、取り消した実行には取り消しの道具メッセージを作る。固定するlanggraphは1.2.8から1.2.12に上がった。ag-ui-openai-agents 0.2.0は、一時停止した道具の呼び出しにHMACの署名を付け、承認の札を止めたエージェントに結び付けた。\n\n【ポイント・注意点】\n破壊的変更は多い。許可リスト外のforwardedPropsは無視され、forwardedProps.commandはresumeだけを受け付ける。/agents/stateと/capabilitiesは依存関係を必ず通す。state.headersで要求のヘッダーは上書きできなくなり、道具メッセージのIDも変わった。既定の範囲なしの署名役は拒まれ、複数のワーカーで動かす場合は共有のconsumed_tokens=を渡す必要がある。Interrupt.response_schemaにはlanggraph 1.2.12が必要だ。","2026-11-21","GitHub（ag-ui-protocol/ag-ui リリース）","https://github.com/ag-ui-protocol/ag-ui/releases/tag/release/2026-11-21"],["「Claude Code Router」v3.1.6、Codexで画像生成を使えるように","AIコーディングの要求を振り分ける「Claude Code Router」が11月21日にv3.1.6を公開した。Codexのデスクトップアプリで、CCRに設定した提供元の利用状況を見られるようになった。Codexのプロファイルでは、画像APIの提供元のモデルを選んで、画像の生成と編集をそのまま使える。Grok Imagine向けには要求の形を合わせる。macOS版Codexでの署名付きNode実行環境の見つけ方も直した。","\n【概要】\nリポジトリ「musistudio/claude-code-router」は2026年11月21日、v3.1.6を公開した。リリースノートは3項目と短く、いずれもOpenAIのCodexとの連携に関わる内容である。版には「Latest」の印が付いており、プルリクエスト#1986で出された。\n\n【背景】\nClaude Code Router（CCR）は、名前のとおりAIコーディングツールの要求を、設定した提供元へ振り分けるためのソフトだ。今回の版では、Claude Codeに加えて、Codexのデスクトップアプリとのつながりを深める変更がまとめられた。配布はWindows x64のEXE、Linux x64のAppImage、Apple Silicon版とIntel版のmacOS用DMG、それにDockerイメージである。\n\n【詳細】\n1つ目は、Codexのデスクトップアプリの中で、CCRに設定した提供元の利用状況を見られるようにしたこと。2つ目は、Codexのプロファイルで、画像の生成と編集をそのまま使えるようにしたことだ。設定済みのImages APIの提供元からモデルを選ぶ形で、CCRは本来のプレビューを1回だけ表示し、Grok Imagine向けには要求の形を合わせる。3つ目は修正で、今のmacOS版Codexアプリの配置で、署名付きのNode実行環境を見つけられるようにした。Dockerではdocker pull musistudio/claude-code-router:3.1.6で取得でき、AMD64とARM64の両方に対応する。\n\n【ポイント・注意点】\n破壊的変更や、必要な版の条件は書かれていない。公開ファイルは16個ある。Codexを日常的に使っていて、複数の提供元を切り替えている人にとっては、利用状況の確認と画像機能の追加が手間を減らす変更になる。一方で、macOSでCodexアプリとの連携がうまく動かなかった人は、Node実行環境の見つけ方が直ったこの版で改善するか試してみるとよい。","2026-11-21","GitHub（musistudio/claude-code-router リリース）","https://github.com/musistudio/claude-code-router/releases/tag/v3.1.6"],["ノート「Trilium」v0.108.0 候補版、Vimモードと見出しへのリンク","階層型ノートアプリ「Trilium」が11月21日、v0.108.0の候補版rc.1を公開した。文章やMarkdownのノート、PDFやEPUB、Word文書の見出しへ直接リンクできるようになり、文章ノートにはVimモードが加わった。Android版は初めての安定版となり、APKが添付された。遅い回線を模した試験では、ノートを編集できるまでの時間が約半分になったという。","\n【概要】\n階層型のノートアプリ「Trilium」は2026年11月21日、v0.108.0の候補版（rc.1）を公開した。「Pre-release」の印が付いた正式版前の版である。見出しへのリンク、Vimモード、折りたためる見出し、Android版の初の安定版と、目に見える新機能が多い。\n\n【背景】\nリリースノートには、文章エディター15件、画面12件、共有7件、取り込み・書き出し7件、検索4件、ツリー4件、デスクトップ4件など、数多くの修正が並ぶ。公開ファイルは23個。ページには、公開後にmainへ122件のコミットが入ったと表示されていた。\n\n【詳細】\nリンクは、文章とMarkdownのノートに加え、PDF、EPUB、Word、OpenDocumentのファイルの見出しや目印を指せるようになった。「アウトライン」のタブにはそれらの見出しが並び、絞り込みもできる。文章ノートのVimモードは、オプションの「文章ノート」→「機能」→「Vimモード」で有効にでき、:w、:q、gfといったTriliumのコマンドに対応する。文章ノートには、折りたためる見出し、補足の枠、検索結果や色付き文字をスクロールバーに示す印も加わった。Android版は初めての安定版で、APKが添付されている。同じ版のサーバーと同期でき、毎晩版と並べて入れられる。速さでは、20Mbit/sの遅い端末を模した試験で、ノートを編集できるまでの時間がデスクトップで5.2秒から2.5秒に、スマートフォンで4.8秒から2.3秒に縮んだ。\n\n【ポイント・注意点】\n破壊的変更として、CSS変数の--background-materialが効かなくなり、window.electronApi.windowのsetBackgroundMaterial()とsetVibrancy()は廃止された。安全面の修正は6件あり、ウェブページからデスクトップのウェブクリッパーの窓口へノートを送れた問題や、共有ノートの検索から共有していないノートの題名や中身が漏れる問題を直した。RPM 4.20以降ではRPMのパッケージ作りに失敗するという既知の問題もある。候補版なので、試す前にバックアップを取りたい。","2026-11-21","GitHub（TriliumNext/Trilium リリース）","https://github.com/TriliumNext/Trilium/releases/tag/v0.108.0-rc.1"],["表計算基盤「Univer」v1.6.0、ガントの計画日程とモバイルPDF","文書や表計算の部品群「Univer」が11月21日にv1.6.0を公開した。データベース機能のガント表示で、計画の日程を今の日程と並べて持てるようになり、前後関係のつながりも結べる。モバイルではPDFの表示と編集に対応した。AMORDEGRCとEUROCONVERTの関数も加わった。編集やコメントの権限は、手元の画面と共同編集サーバーの両方で厳しく見直された。","\n【概要】\n文書・表計算の部品群「Univer」は2026年11月21日、v1.6.0を公開した。まとめによると、柱は2つある。データベース機能（Base）のガント表示で計画の日程と前後関係を扱えるようになったこと、そしてモバイルでPDFを表示・編集できるようになったことだ。PDFとデータのリボンは整理し直され、新しい関数も加わった。\n\n【背景】\n前の版は11月16日に出たv1.5.1とv1.5.2で、それから5日ほどでの新しい版になる。今回の版には「Latest」の印が付いている。編集とコメントの権限は、クライアント側と共同編集サーバー側の両方で厳しくなった。\n\n【詳細】\nPro版の新機能として、Baseのガントでは、今の日程の横に計画の日程を持てる。進み具合の列と結び付けた完了度の項目は、バーの上に完了の度合いを表示する。前工程は記録のつながりに結び付き、終わってから始めるつながりを作る。つながりが輪になる設定は受け付けない。モバイルのPDF画面には、サムネイル、ページの整理、引き出し式の画面が加わった。@univerjs-pro/pdfs-exchange-clientには入口が加わり、PdfSetZoomRatioOperationで拡大率を設定できる。関数では、AMORDEGRC、EUROCONVERT、ISO.CEILINGが入った。グラフにはsetRadarAxisLabelとresetRadarAxisLabelが加わった。\n\n【ポイント・注意点】\n権限の変更に注意したい。表計算の編集権限が、ウィンドウ枠の固定、セルの結合、並べ替えなどにもかかるようになった。メモとコメントにはそれぞれ専用の権限ができた。グループ化と折りたたみも編集として数えるため、閲覧だけの利用者はグループを開いたり閉じたりできなくなる。破壊的変更とは書かれていないが、動きは変わる。また、新しいBaseのOT変換を含むゲートウェイを、クライアントより先に配備する必要があるとページは注意している。","2026-11-21","GitHub（dream-num/univer リリース）","https://github.com/dream-num/univer/releases/tag/v1.6.0"],["アリババ「open-code-review」v1.14.0、SQLやRubyの審査規則を追加","アリババのコードレビューツール「open-code-review」が11月21日にv1.14.0を公開した。新機能は7つで、SQL・Dhall・Rubyの審査規則を加え、CUDAとHIPのファイルも審査の対象にした。審査の中で振る舞いと影響を任意で分析できるようになり、CLIでは指摘を重大度の順に並べる。GitLab CIで審査が失敗したのに合格の印を付けてしまう問題なども直した。","\n【概要】\nアリババのリポジトリ「open-code-review」は2026年11月21日、v1.14.0を公開した。新機能7件、不具合修正5件、文書3件、その他1件という構成で、審査できる言語とファイルの種類が広がった。翌22日には修正版のv1.14.1も出ている。\n\n【背景】\nopen-code-reviewは11月19日にv1.13.13を出しており、今回はその次の版にあたる。リリースノートはプルリクエストの一覧を種類ごとにまとめた形で、公開ファイルは9個ある。ページには、公開後にmainへ8件のコミットが入ったと表示されていた。\n\n【詳細】\n新機能では、Cargoのテストとベンチマークのパスを除外し、Rustの規則を練り直した（#1971）。審査の中で、振る舞いと影響を任意で分析できるようにした（#1937）。CLIでは、審査と走査の指摘を重大度の順に並べる（#2003）。審査規則には、SQL（#1941）、Dhall（#963）、Ruby（#1940）が加わった。許可リストには、CUDA（.cu/.cuh）とHIP（.hip）のファイルが入った（#1768）。不具合修正では、表示画面でタブを切り替えても報告の見出しが動かないようにした（#2022）。TypeScriptのモジュール拡張子を審査に含めた（#1962）。MCPの道具の定義が、登録したサーバーと合うようにした（#1972）。Pagesでは、一部の言語だけの翻訳への切り替えと、ページ内の移動を直した（#2000）。\n\n【ポイント・注意点】\nGitLab CIとの連携では、審査が失敗したのにチェックマーク付きの合格（LGTM）を書き込んでしまう問題を直した（#1999）。審査の結果をそのまま信じて合流させる運用では見落としにつながりかねない問題だったので、GitLabで使っている人は上げておきたい。文書では、外部のChat Completionsの提供元、仕様を踏まえた審査、翻訳での重大度の並び順の説明が加わった。破壊的変更と必要な版の条件は書かれていない。","2026-11-21","GitHub（alibaba/open-code-review リリース）","https://github.com/alibaba/open-code-review/releases/tag/v1.14.0"],["家計管理「Sure」v0.7.6、ローン口座とバックアップを強化","自分で立てて使える家計管理アプリ「Sure」が11月21日にv0.7.6-hotfix.2を公開した。月ごとの版で、自分の過去と比べた支出の変化を示す機能、返済予定と元金・利息の内訳を見せるローン口座、学習で分類する仕組みなどが入った。データベースやアップロード、設定をまとめるバックアップと復元にも対応した。製品改善のための匿名の計測は初期設定で有効になっている。","\n【概要】\n家計管理アプリ「Sure」は2026年11月21日、v0.7.6-hotfix.2を公開した。題名は「Clearer spending, smarter rules, and better backups」。ページは月ごとのリリースと説明しており、支出の見え方、取引の分類の規則、バックアップの3つを大きく改めた。\n\n【背景】\nSureは同じ日に試験版のv2026.11.20-alphaも出しており、正式な系統と試験の系統を並べて進めている。今回の版の変更履歴には、Rails 8.1.4.1、rack 3.2.8、nokogiri 1.19.7の安全面の更新をv0.7.6へ持ち込んだと書かれている。\n\n【詳細】\n「普段と比べた支出」は、利用者自身の過去の記録と今の支出を比べ、分類ごとの面積図と、変化の大きい順の一覧で示す。これはまだ試験的な機能だ。ローン口座では、残高、返済予定（変動金利の金利変更も含む）、元金と利息の内訳を表示する。ベイズ分類器は、トークンを使わずに分類し、過去の記録で試せる。店名の照合と分類も、順番付きの規則の一覧に入った。規則はドラッグで並べ替えられ、例外のための「処理を止める」や、定期の取引を金額か割合で分ける設定も加わった。ダッシュボードではウィジェットを隠したり、口座を並べ替えたりでき、活動を分類・タグ・店・種類で絞れる。金額の欄は計算式とコンマの小数点を受け付ける。Flutterのアプリには読み取り専用の予算画面が入った。\n\n【ポイント・注意点】\nバックアップは、データベース、アップロード、設定、版の情報をまとめて扱い、復元、巻き戻し、定期の取得、任意の外部保存に対応する。ただし外部のオブジェクトストレージに置いたアップロードは含まれない。また、製品改善のための匿名の計測は初期設定で有効になっている。自分で立てて使う人は、POSTHOG_FEEDBACK_ENABLED=falseで止められる。家計という秘密性の高いデータを扱うので、この設定は確かめておきたい。","2026-11-21","GitHub（we-promise/sure リリース）","https://github.com/we-promise/sure/releases/tag/v0.7.6-hotfix.2"],["AI学習「Unsloth」、16GBで動く26.4BのInkling 2 Miniに対応","AIモデルの学習・実行を速くする「Unsloth」が11月20日にv0.1.922-betaを公開した。16GBのメモリで動く26.4Bのモデル「Inkling 2 Mini」を動かせるようにした。画像生成では、8GBのGPUでMiniMax-H3-Imageの1回の描画が82.7秒から36.7秒に縮んだ。学習やチャットの高速化も多く、道具を使う試験ではプロンプトのトークンが83〜87%減ったという。","\n【概要】\nAIモデルの学習と実行を手がける「Unsloth」は2026年11月20日、v0.1.922-betaを公開した。題名は「Inkling Mini + Bug fixes」。目玉は、ページが「16GBのRAMで動く最強の26.4Bモデル」と紹介するInkling 2 Miniへの対応で、要点には「新しい26B（有効5.4B）、100万トークンの文脈」とある。\n\n【背景】\nUnslothは同じ日にv0.1.921-betaも出しており、今回はその直後の版になる。リリースノートには、画像、動画、学習、チャットの各分野で、具体的な数字付きの改善が並ぶ。公開ファイルは10個ある。\n\n【詳細】\n画像では、FLUX.1で重みをシステムのRAMから流し込む時、1手あたりの時間が16〜28%短くなった。FLUX.3 kleinのINT8は、T4で1手あたり13%短い。GTX 16xxでNaNのエラーで失敗する問題も直った。8GBのGPUでのMiniMax-H3-Imageは、1回の描画が82.7秒から36.7秒に縮んだ。GGUFの画像モデルは、LinuxとmacOSで読み込みに使うRAMが52〜66%減った。動画では、Cosmos3-Edge-FP8がL4で約1.45倍速くなった。学習では、SDXLのLoRAがT4とL4で1手あたり28〜31%短く、FLUX.2-kleinの9BはL4で約30%短い。AsyncGRPOは、TRL 1.17以降のA100で1.46〜2.47倍速い。DoRAは約3〜5%速くなり、AMDのROCmでのQwen3.5はStrix Haloで1秒あたりのトークンが約1.4倍になった。\n\n【ポイント・注意点】\nチャットとMCPでは、道具を使う試験でプロンプトのトークンが83〜87%減った。道具の出力の長さの制限は、llama.cpp、vLLM、Ollama、独自の接続でのMCPの結果にもかかるようになり、スキャンしたPDFはOCRで読む。Gemma-4のLoRAが長さの違う束で失敗する問題は、PyTorch 2.14より前で直り、PEFT 0.22でも動く。数字の多くは特定のGPUでの測定なので、自分の環境で同じ伸びが出るとは限らない点に注意したい。","2026-11-20","GitHub（unslothai/unsloth リリース）","https://github.com/unslothai/unsloth/releases/tag/v0.1.922-beta"],["データベース「DuckDB」v2.0.1、2.0公開後の不具合を修正","分析向けデータベース「DuckDB」が11月20日にv2.0.1を公開した。v2.0.0の公開後に見つかった不具合を直す版で、約50件のプルリクエストが並ぶ。Parquetの書き出しで、NULLだけの行グループでも最小・最大の統計を残すようにした。httpfsではS3の流量制限とファイルごとの認証情報に対応した。Postgres、MySQL、SQLiteなどの拡張機能も更新された。","\n【概要】\n分析向けの組み込みデータベース「DuckDB」は2026年11月20日、「DuckDB v2.0.1 Bugfix Release」を公開した。ページはこれを、v2.0.0の公開後に見つかった問題を直す修正版と説明しており、告知のブログ記事へのリンクと、取り込んだ約50件のプルリクエストの一覧が載っている。版には「Latest」の印が付いている。\n\n【背景】\nDuckDBにとって2.0は大きな節目の版で、利用者が増えるにつれて細かな不具合が見つかってきた。今回のv2.0.1は、その最初のまとまった直しにあたる。公開ファイルは32個あり、変更の全体はv2.0.0からv2.0.1までの比較で見られる。\n\n【詳細】\n直した点として、型の変換が必要な時に、ベクトルの大きさを超えるデータの塊を追加する処理を直した。ARRAY(SELECT ...)に対するANYとALLの比較を、リストの要素と正しく比べるようにした。Parquetの書き出しでは、NULLだけを含む行グループでも最小・最大の統計を残す。TIMESTAMPTZ_NSからTIMESTAMPへの新しい変換を加え、parquet_can_have_nanという設定も入った。相関の解消ではerror()を揮発性でないものとして扱い、貪欲な結合順序の決め方では入ってきた結合の順を保つ。安全モードの秘密情報では、refresh_infoを伏せて表示する。一方、「enable_external_accessがfalseの時にCREATE SECRETを拒む」変更は取り消された。\n\n【ポイント・注意点】\n拡張機能では、Postgres、MySQL、SQLiteが2.0.1に上がり、aws、glue、iceberg、azure、vortex、ducklakeも更新された。httpfsはS3の流量制限とファイルごとの認証情報に対応した。WindowsのARM64版はLLVM 22でビルドされ、C APIで読み込む拡張機能は入口だけを外に出すようになった。破壊的変更と必要な版の条件は書かれていない。v2.0.0を使っている人は、早めに上げておくとよい修正版である。","2026-11-20","GitHub（duckdb/duckdb リリース）","https://github.com/duckdb/duckdb/releases/tag/v2.0.1"]],"gh-new":[["Witnis：継承をたどって変更の影響範囲を示す道具","Witnisは、コーディングエージェント向けの手元で動く「証拠」の道具です。リポジトリに索引を作り、ある変更がどこまで影響するか（影響範囲）を示します。grepでは見つからない、クラスの継承の先まで追いかけるのが特徴です。MCPの道具としても使え、プルリクエストに「何に触れたか」「テストは動いたか」を書き込むGitHub Actionも付いています。RustとPythonで作られ、Apache-2.0で公開されています。","\n【概要】Witnisは、エージェントや人がコードを変えるときに、その変更がどこまで響くかを手元で確かめるための道具です。リポジトリに索引を作り、変更の影響範囲を示し、プルリクエストには変更が触れた場所とテストが動いたかどうかを書き込めます。【背景】コードの影響を調べるとき、まずgit grepで名前を探すのが普通です。しかし文字列の検索では、別のクラスが元のクラスを継承している場合、その先で使われている場所を見落とします。エージェントに作業を任せる場面が増え、変更の影響を機械的に、根拠つきで示す仕組みが求められています。【詳細】READMEの例では、Spring PetClinicというサンプルの特定の版で「git grep -lw Person」を実行すると5つのファイルが見つかります。一方「witnis impact Person」は「Owner extends Person」という継承をたどり、OwnerController、PetController、VisitControllerまで届きます。MCPの道具としてindex、look、impact、verifyの4つがあり、索引は既定で.witnis/index.sqliteというSQLiteのファイルに保存されます。導入は「pip install witnis」か「uvx witnis」で、「witnis index .」で索引を作ってから「witnis impact Person --plain」のように使います。プルリクエストの関門として使えるGitHub Actionも用意されています。言語はRustとPythonで、ライセンスはApache-2.0です。【ポイント・注意点】verifyは、WITNIS_ALLOW_VERIFY=1を設定し、--executeを付けないと何も実行しません。READMEは「automation_verified」の意味を「許可リストのコマンドが動いた」ことで、人による確認ではないと断っています。試験的なMCPの道具はWITNIS_MCP_EXPERIMENTAL=1が必要です。GitHub Actionの@v1タグは固定しないと動くので、版を固定して使う方が安心です。確認した時点ではスター0、コミット3件の生まれたばかりのリポジトリです。","2026-11-22","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50600064"],["ReallySimpleDocs：Astroで作るAI向けの文書サイト","ReallySimpleDocsは、Astroの上で動くシンプルな文書サイトの仕組みです。BasecoatとTailwind CSSで見た目を整え、MarkdownとMDXから各ページを作ります。サイドバーの目次、Lunrによる検索、コピーボタン付きのコード表示に加え、AIが読みやすいllms.txtとllms-full.txt、ページごとのMarkdownも書き出せます。npmで入れてAstroの設定に足すだけで使え、MITライセンスで公開されています。","\n【概要】ReallySimpleDocsは、Astroで文書サイトを手早く作るための部品です。文書はdocs/フォルダーに置き、目次はdocs/docs.jsonに書きます。人が読むサイトと同時に、AIが読みやすい形の書き出しも作れるのが特徴です。【背景】ソフトウェアの説明書は、人が読むだけでなく、AIのエージェントが読んで使う場面が増えています。そのため、サイトの中身をまとめたllms.txtのような、機械が読みやすい書き出しを用意する動きが広がっています。ReallySimpleDocsは、その両方を一つの仕組みで済ませようとするものです。【詳細】機能は、MarkdownとMDXからの静的なページ作り、サイドバーの目次、Lunrを使った検索（コマンドの窓から呼べる）、構文の色分けとコピーボタン付きのコード、そしてllms.txt、llms-full.txt、ページごとのMarkdownの書き出しです。head、サイドバー、ヘッダーには自分の部品を差し込めます。導入は「npm install reallysimpledocs basecoat-css tailwindcss」で、astro.config.mjsにreallySimpleDocs({ docsDir: \"./docs\", routeBase: \"/docs\" })のような設定を足します。あとは「npm run dev」で確認できます。必要な環境はAstro 7.4.13以上、Node.js 22.23.4以上、Basecoat 1.2.1以上、Tailwind CSS 4.3以上です。Cloudflare Wranglerの設定も入っています。確認した時点でスター78、フォーク4、コミット102件でした。【ポイント・注意点】READMEは、版1.1でAstro 6への対応をやめたと書いています。古いAstroのまま使っている人は注意が必要です。また「css: false」を指定すると、Tailwind、Basecoat、本体のスタイルを読み込む仕組みを自分で用意しなければなりません。見た目を細かく変えたい人向けの選択肢ですが、手間は増えます。ライセンスはMITです。","2026-11-22","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50599773"],["worker755：LLMの部下になって指示をこなすゲーム","worker755は、AIの上司があなたを自分の部下のエージェントだと思い込んでいる、という設定のブラウザゲームです。上司役はClaudeやGPT、Geminiなど本物のLLMで、仕事の列と読み取り専用の機械を持っています。プレイヤーは端末に届く指示を90秒以内にこなします。各任務には隠れた正解の確認があり、上司が間違えた回数も数えられます。TypeScript製で、MITライセンスです。","\n【概要】worker755は、いつもと立場を逆にしたゲームです。普段は人がAIに仕事を頼みますが、ここではAIの上司が人を部下のエージェントとして扱い、端末越しに指示を出してきます。worker755.comで遊べるほか、自分で動かすこともできます。【背景】AIのエージェントが部下のエージェントに仕事を割り振る仕組みは、今の開発の道具でよく使われています。しかし部下の側から見ると、上司の指示はあいまいだったり、間違っていたりします。このゲームは、その立場を人が体験できるようにしたものです。【詳細】上司役のLLMは、Claude、GPT、Gemini、DeepSeek、GLM、Kimiから選べます。上司は仕事の列と、読み取り専用で機械に触れる権限を持ちます。プレイヤーは端末に届く指示に90秒の制限時間でこたえます。任務ごとに隠れた正解の確認があり、ゲームは「上司が間違えた回数」も記録します。進行役は台本どおりにも、LLMに任せることもできます。結果を共有できる振り返りもあり、失敗した仕事を飛ばせる設定（既定は切）もあります。作りはTypeScript（Node 24以上）とReactの画面で、メモリの中で動く疑似的なシェルとSQLiteに似た仕組みを持ちます。動かし方は「npm run setup」「npm run build」「npm start」で、http://127.0.0.1:8755で開けます。「npm run mock」ならネットにつながずに試せます。【ポイント・注意点】遊ぶには、OpenRouterかVercel AI Gatewayの鍵を自分で用意するか、サーバー側が無料の回を用意している場合はそれを使います。無料の回は既定で1日3回などの上限があります。READMEは、Claude Haikuで1回分遊んでも、かかるのは多くて数セントだとしています。ログインや追加の購入には別の設定が必要です。HNでは22点を集めていました。コミットは54件で、Dockerでも動かせます。ライセンスはMITです。","2026-11-22","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50599762"],["Grassline：手元のエージェントとスマホから静かに話す","Grasslineは、自分のコンピューターで動くClaude Code、opencode、Codexなどのエージェントと、スマホからチャットするための仕組みです。通知もファイル閲覧もコマンドラインもあえて持たない「落ち着いた」作りをうたいます。スマホとの間はirohで暗号化してつなぎ、仲介のサーバーはいりません。手元の音声認識モデルで声の指示も出せます。常駐部はRust製で、Androidアプリがあります。","\n【概要】Grasslineは、離れた場所からエージェントを操るための小さな仕組みです。作者は、同じ目的のPaseoという道具のシンプルな代わりとして紹介しています。コンピューターで常駐部を動かし、スマホのアプリから話しかけます。【背景】エージェントに長い作業を任せると、席を離れている間も様子を見たり、次の指示を出したりしたくなります。そのための道具はいくつかありますが、機能が多くなりがちです。Grasslineは、READMEで「通知も、ファイル閲覧も、コマンドラインもない」と書くほど、機能を絞っています。【詳細】対応するエージェントはClaude Code、opencode、Codexなどです。スマホとコンピューターの間はirohという仕組みで暗号化してつなぎ、サーバーを用意する必要はありません。声の指示は、手元で動く音声認識（sherpa-onnx）か、自分のAPIの鍵で使えます。作業の単位は「プロジェクト」で、決めた親フォルダーの下のフォルダーがそのままプロジェクトになります。スマホを結び付けるための管理画面もあります。常駐部grasslinedはRustで書かれ、Androidアプリが付きます。配布はLinux向けの.deb、.rpm、.pkg.tar.zst、x86_64とaarch64の圧縮ファイル、macOS向けの圧縮ファイル、そして.apkです。Linuxではsystemdのユーザーサービスとして動きます。「grasslined --port 9000」で番号を変えられます。【ポイント・注意点】管理画面は「hyperb://127.0.0.1:7878/」で、hyperbというブラウザーが必要です。macOSにはsystemdがないため、圧縮ファイルを展開してgrasslinedを直接動かします。ログアウト中も動かし続けるには「sudo loginctl enable-linger $USER」が必要です。音声モデルは使うときに読み込まれます。確認したページにはライセンスの記載がありませんでした。","2026-11-22","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50598949"],["paperfold：紙飛行機を折って街に飛ばすWebゲーム","paperfoldは、紙飛行機を折って色を塗り、塔から投げて街に残していくブラウザゲームです。A4の紙を作業場で折り、面の一枚一枚を揚力・抗力・失速を持つ平らな板として計算します。風や上昇気流、交通のある3Dの街をみんなで共有し、順位表もあります。静かな空気で設計を試す「ラボ」もあります。TypeScriptとthree.jsで作られ、MITライセンスで公開されています。","\n【概要】paperfoldは、紙飛行機の空気の流れを計算して飛ばす、みんなで遊べるWebゲームです。michidk.github.io/paperfoldで遊べます。紹介文は「紙飛行機を折り、塗り、塔から投げて、みんなが見つけられるよう街に残そう」です。【背景】紙飛行機は、折り方の小さな違いで飛び方が大きく変わります。このゲームはその面白さを、物理の計算で画面の中に再現しようとしています。自分の機体を他の人の機体と同じ街に残せるので、一人で遊ぶ物理の実験を、みんなで共有する遊びに広げています。【詳細】作業場ではA4の紙を折って色を塗ります。機体の各面は「揚力・抗力・失速を持つ平らな板」として扱われます。投げる先は、風、上昇気流、交通のある共有の3Dの街です。みんなで遊べて順位表があり、静かな空気の中で設計を確かめられる「ラボ」も付いています。サーバーにつながらないときは、自動でひとり遊びに切り替わり、点数はブラウザーに残ります。作りはTypeScriptで、画面側はViteとthree.js、サーバー側はBunとSQLite（Drizzle経由）です。手元で動かすにはBun 1.4が必要で、「bun install」「bun run dev:server」（3001番）「bun run dev」の順に実行します。Dockerならghcr.io/michidk/paperfoldの像を「docker run -d -p 3000:3000 -v paperfold-data:/data ghcr.io/michidk/paperfold:latest」で起動できます。【ポイント・注意点】READMEは、紙は破れず、自分自身を突き抜けて折ることもできないと書いています。点数などの判断はサーバーが持ちます。HNの題には「WebGL」とありますが、README自体はthree.jsと書いています。確認した時点ではスター0、コミット5件の、公開されたばかりのリポジトリです。サーバーの既定の番号は3000です。ライセンスはMITです。","2026-11-22","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50598833"],["Kobo向けLichess：電子書籍端末でチェスと詰め問題","Kobo電子書籍端末で、ネットのチェス対局場Lichessを遊ぶための非公式アプリが公開されました。対局、詰め問題（パズル）、ネット不要のコンピューター相手の対局ができます。作者は、電子ペーパーで長くパズルを解きたい、飛行機の中でも遊びたいと考えて作ったそうです。Rustで書かれ、Cobaltという端末向けの仕組みの上で動きます。チャットや待ったはなく、対応はlichess.orgだけです。","\n【概要】このアプリは、Kobo電子書籍端末の上で動く非公式のLichessクライアントです。Cobaltという、Kobo向けにアプリを動かす仕組みのリポジトリの中の一つとして公開されています。【背景】電子ペーパーの画面は目が疲れにくく、電池も長持ちします。チェスの盤面は白黒でも十分見やすく、ゆっくり考えるパズルとも相性がよいものです。作者は、電子ペーパーで長くパズルを解き、飛行機の中でも弱いエンジン相手に遊びたいと考えて作ったと書いています。【詳細】できることは、レート対局と気軽な対局（10+0、10+5、15+10、30+0、30+20の持ち時間）、相手の名前を指定した挑戦、アカウント不要のコンピューター相手の対局、レートに影響しないネット不要のパズルです。時計、引き分けの提案、投了、中止があり、接続が切れても自動でつなぎ直します。作りはRustで、Pythonの模擬画面の道具も付きます。端末に入れるには、端末から直接入れるか、コンピューターからkoboコマンドで「kobo setup」を実行し、「kobo secret set lichess --from token.txt」でLichessの鍵を渡します。鍵に必要な権限はboard:playだけです。Cobalt 0.3.18以上が必要で、気軽な対局の持ち時間の表示には0.3.30より新しい版が必要です。【ポイント・注意点】チャットと待ったはありません。自分から出す挑戦は気軽な対局で、標準の持ち時間だけです。対応はlichess.orgだけです。ネット不要のコンピューター相手は4手先までしか読まず、作者もClara BWの1コアではまだ改善が必要と書いています。その対局はアプリを閉じると保存されません。このフォルダーのページではライセンスを確認できませんでした。対局の時計や接続の再開まで備えており、電子書籍端末を小さな対局盤として使えるようにする、遊び心のあるアプリです。チェスの好きな電子書籍端末の持ち主には試す価値があります。","2026-11-22","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50598709"],["リーマン証明ハンドブック：Leanの証明を言葉の数学に","The Riemann Proof Handbookは、tamnd/riemann-leanというLeanの証明を、定義・定理・補題とその証明という「言葉の数学」として書き直した本です。PDFとEPUBで、GitHubのリリースから入手できます。第0巻から第12巻までの構成です。ただしREADME自身が「主張は確かめられていない」「誰もLeanのプロジェクト全体をまだ組み立てていない」と書いており、HNでも証明の扱いをめぐって議論になりました。","\n【概要】このリポジトリは、Leanという証明支援の言語で書かれた、リーマン予想についての証明のコードを、人が読める数学の文章にした本です。PDFとEPUBの形で配られ、本を組み立てる道具も一緒に公開されています。【背景】リーマン予想は、数学で最も有名な未解決問題の一つです。Leanのような証明支援の言語では、コンピューターが証明の一歩一歩を確かめられます。ただしコードはそのままでは数学者にも読みにくいため、何をしているかを言葉で説明する本には意味があります。【詳細】本は第0巻から第12巻までに分かれています。Leanの宣言を使われ方で段に分けた一覧があり、1,000件以上の宣言にかかわるものが591件、300件以上が1,927件、100件以上が5,764件と書かれています。EPUBはEPUB 3で、数式はMathMLです。組み立てにはPython 3.11以上、pandoc 3.8以上、Tectonicを使います。「pip install .」のあと「python -m rhb survey」「python -m rhb check」で確かめ、「python -m rhb build --volume 0,1,2 --formats pdf,epub」で巻を指定して本を作れます。本文はCC BY 4.0、組み立ての道具はMITライセンスです。HNでは78点、コメント50件と大きな注目を集めました。【ポイント・注意点】いちばん大事なのは、READMEが自ら「主張は確かめられていない。誰もまだLeanのプロジェクト全体を組み立てていない」と書いている点です。この本は「Leanのコードを説明するもので、数学を別に確かめるものではない」とも書いています。HNのコメントでも証明の扱いをめぐって疑問が出ています。リーマン予想が解けたという話として読まないよう注意が必要です。なお、リポジトリは確認した時点でスター40、フォーク2、未解決の課題8件でした。中身の正しさを判断するには、Leanのプロジェクトが実際に組み立てられ、確かめられるのを待つ必要があります。","2026-11-22","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50596664"],["Hikari.ImGui：Dear ImGuiをC#だけで作り直した","Hikari.ImGuiは、ゲームや3Dアプリでよく使われる即時モードのGUIライブラリDear ImGuiを、C#だけで作り直したものです。ネイティブのライブラリに頼らず、Dear ImGuiのv1.93.0-docking版との互換を目指しています。NuGetのパッケージとして配られ、見本のアプリはSilk.NETでOpenGLかVulkanを使って動きます。465件のテストも付いています。MITライセンスで公開されています。","\n【概要】Hikari.ImGuiは、C++で書かれた人気のGUIライブラリDear ImGuiを、C#で一から作り直したものです。作者はHNで、自分のプロジェクトに自由に使ってほしいと書いています。【背景】Dear ImGuiは、ゲームの開発用の道具や3Dアプリの画面によく使われます。C#から使うには、C++の本体を呼び出す橋渡しを使うのが普通でした。この方法では、ネイティブのライブラリを機械ごとに用意する手間がかかります。全部をC#で書けば、その手間がなくなります。【詳細】対象はDear ImGuiのv1.93.0-docking版で、ネイティブへの依存はありません。本体はNuGetのパッケージとして公開されています。READMEの最初の例は、おなじみのImGui.BeginとImGui.Buttonを毎フレーム呼ぶ書き方で、できた描画データは使う人が自分の描画の仕組みに渡します。見本のアプリはSilk.NETを使い、OpenGLかVulkanで動きます。「dotnet run --project Hikari.ImGui.Demo -c Release」で起動し、「--backend vulkan」でVulkanを選べます。テストは465件あり、「dotnet test Hikari.ImGui.Test -c Release」で実行できます。元のDear ImGuiとの違いを調べるPythonの道具も入っています。【ポイント・注意点】リポジトリの説明は「純粋なC#への移植」で、HNの題の「作り直し」とは言い方が違います。HNで作者は「対象とする」とは機能とAPIの互換のことだと説明しています。READMEには制限の記載がありません。確認した時点ではスター0、コミット14件の新しいリポジトリです。ライセンスはMITです。C#だけで完結するため、.NETの上で動くゲームや道具に、ネイティブの部品の配布を気にせずDear ImGuiと同じ書き方の画面を組み込めるようになる点が魅力です。今後、元のDear ImGuiとどこまで同じに動くかが評価の分かれ目になりそうです。","2026-11-22","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50595885"],["GPP：クラスや例外を足したGoの拡張言語","GPPは、Go言語にクラス、継承、オーバーロード、名前付き引数、例外、拡張メソッド、注釈、レコード、列挙型などを足した拡張言語です。書いたコードはGoに変換されるので、Goのパッケージや道具をそのまま使えます。ほかにHTTPサーバー、OpenAPI、型付きのSQL、テンプレート、cronなども持ちます。BSD-3-Clauseで公開され、GoogleやGoの公式とは関係がないとしています。","\n【概要】GPPは、Goの上に機能を重ねた「上位互換」の言語です。作者はHNで、なじみのGoの道具とパッケージの仕組みを使えるようにGoを出力先にした、と説明しています。名前はGo++への遊び心だとしています。【背景】Goは、機能を少なくして読みやすさを大事にする言語です。その一方で、クラスや例外など、ほかの言語でよく使われる書き方がほしいという声もあります。GPPは、Goそのものを変えず、変換によってそうした機能を足すやり方をとっています。【詳細】足される機能は、クラス、継承、ジェネリクス、オーバーロード、名前付き引数、例外、拡張メソッド、注釈、レコード、列挙型です。さらに、シリアライズ、経路付きのHTTPサーバー、OpenAPIとSwagger、型付きのSQLとORM、型付きのテンプレート、cron、整形の道具、言語サーバーも用意されています。Go 1.27以上が必要です。導入は「brew tap telgatech/gpp」のあと「brew install --HEAD telgatech/gpp/gpp」、または「go install github.com/telgatech/gpp@main」です。そのあと「gpp init hello」「cd hello」「gpp run」で最初のプログラムを動かせます。説明のサイトはVitePressで作られています。確認した時点でコミット174件、スター18、フォーク4でした。【ポイント・注意点】Homebrewの手順はmainを追いかけるため、版付きの公開までは--HEADが必要です。Homebrewの本体には無関係なgppという別のソフトがあり、入っている場合は先に消す必要があります。READMEはGoogleやGoの公式とは関係がないと明記しています。ライセンスはBSD-3-Clauseです。Goの道具とパッケージをそのまま使えるため、既存のGoのコードと混ぜて使えるのが強みです。一方で、Goらしさをどこまで崩してよいかは好みが分かれる点で、試すときは変換されたGoのコードも確かめるとよいでしょう。","2026-11-22","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50595828"],["iphone-linux：iPhoneをWi-Fi越しにLinuxへつなぐ","iphone-linuxは、iPhoneをWi-Fi越しにLinuxのファイルシステムとしてつなぐ道具です。ケーブルもiTunesもiCloudもいりません。XcodeのWi-Fiデバッグの仕組み（mobdev2）を使い、FUSEで見せます。読み取り専用でのマウントや、アプリ1つの中だけを見る使い方、自動でつなぎ直す見張りの機能もあります。Python製で、MITライセンスです。iPhoneの開発者モードが必要です。","\n【概要】iphone-linuxは、LinuxのパソコンからiPhoneの中身を、普通のフォルダーのように開けるようにする道具です。つなぎ方はケーブルではなく、同じWi-Fiを通します。【背景】LinuxでiPhoneのファイルを扱うのは、昔から手間のかかる作業でした。ケーブルでつなぐ方法はありますが、無線で、しかも普通のフォルダーとして扱える方法は多くありません。この道具は、Appleの開発の道具であるXcodeがWi-Fiでデバッグするときの仕組みを使って、それを実現しています。【詳細】コマンドは、mount（つなぐ）、mount-ro（読み取り専用でつなぐ）、mount-app（IPアドレスとアプリのIDを指定して、そのアプリの中だけを見る）、watch（自動でつなぐ）、apps（アプリの一覧）、unmount（外す）です。watchは、つながらないときに5秒から60秒まで間を広げながら試し直します。systemdのユーザーサービスも付いています。作りはPython 3.10以上で、pymobiledevice3、fusepy、libfuse2t64、zeroconfを使います。導入は「git clone」のあと「bash install.sh」です。root以外で使うには/etc/fuse.confにuser_allow_otherを書き足します。読み込みには3つ分、3MBの先読みの仕組みがあります。テストは13件で、本物のiPhoneを相手に動かします。【ポイント・注意点】使うにはLinux（試したのはUbuntu 24.04以降）、iPhoneの開発者モード、そして両方が同じWi-Fiにいることが必要です。ルーターによってはmDNSが通らないため、そのときはIPアドレスを直接指定します。読み取り専用のときは書き込みを断ります。テストには本物のiPhoneが必要です。ライセンスはMITです。確認した時点でスター4、コミット20件の新しいリポジトリです。ケーブルなしで写真や書類を取り出したい人には手軽な選択肢になりそうです。","2026-11-22","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50595241"],["Security Watch：使う部品に新しい脆弱性が出たら知らせる","Security Watchは、自分のサーバーで動かす、脆弱性の情報と依存関係の見張り役です。ロックファイルや手で書いた一覧を読み、cve.nowやThe Hacker Newsを確かめ、自分の使う部品にかかわる新しい脆弱性が出たらSlackやメールで知らせます。12の言語の仕組みのロックファイルから部品の一覧（SBOM）も作れます。TypeScript製で、Apache-2.0で公開されています。","\n【概要】Security Watchは、自分のソフトが使っている部品に、新しい脆弱性が見つかったときだけ知らせてくれる見張りの道具です。自分のサーバーで動かす作りで、作者の会社ShieldaAIが公開しています。【背景】脆弱性の情報は毎日たくさん出ますが、その多くは自分には関係ありません。大事なのは、自分の使う部品にかかわるものを早く知ることです。そのためには、自分の部品の一覧と、新しい情報を照らし合わせる仕組みが必要になります。【詳細】この道具は、ロックファイルや手で書いた一覧を読み、cve.nowとThe Hacker Newsを確かめて、当てはまるものをSlackかメールで知らせます。12の言語の仕組みのロックファイルから部品の一覧（SBOM）を作れ、CycloneDXやSPDXの形の一覧も読み込めます。GitHub Actionもあり、OSV、GitHub、CISA KEVの情報も追加で使えます。ニュースをAIで分析する機能もあり、22の提供元の設定があります。送る通知はSQLiteの列に貯めて順に届けます。既定では30分ごとに確かめ、40分の幅でニュースを見ます。最初の確認は1秒に約1回の問い合わせで、15〜20分ほどかかります。作りはTypeScript（Node.js 24.10.0以上）とSQLiteで、DockerやDocker Composeでも動きます。導入は「npm install --global @shieldaai/security-watch」のあと、init、doctor、「scan --dry-run」、startの順です。【ポイント・注意点】READMEは、外部の専門家による安全の監査は受けていないと書いています。小さな規模での利用を想定し、SQLiteの書き手は1つだけです。cve.nowはすべてを調べ尽くすものではなく、部品の版の当てはめにも不確かさが残ります。cve.nowにはnpmの部品名と版が、AIの提供元には当てはまった名前が送られます。「届けた」は「読まれた」という意味ではありません。","2026-11-21","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50594649"],["noclip：ニューラルネットが描くバックルームを歩く","noclipは、ネット上の怪談で知られる「バックルーム」を、ニューラルネットワークだけで描いて歩けるようにしたものです。地図もゲームエンジンもなく、2億1100万の値を持つ変換器のモデルが、直前の2.4秒の映像とキーやマウスの入力から次の画面を描きます。18の階を持つ模擬環境で440時間分の遊びを記録し、一から学習させました。4GBほどのNVIDIAのGPUで動きます。","\n【概要】noclipは「遊べる世界モデル」です。普通のゲームは地図と物理の計算で画面を作りますが、ここではAIのモデルが「次に見える画面」を予想して描き続けます。作者は、Minecraftを同じように描いたOasisに影響を受けたと書いています。【背景】世界モデルは、AIが世界の動きを内側に持って、先を予想する仕組みです。最近はゲームの画面を丸ごとAIに描かせる試みが続いています。noclipは、その考えを、似た部屋がどこまでも続くバックルームという題材に当てはめました。【詳細】作者はPyTorchで18の階を持つバックルームの模擬環境を作り、台本どおりに動かして440時間分の遊びを記録しました。モデルはそれを使って一から学習させたもので、学習済みの自動符号化器（DC-AE）の内側の表現の上で、フロー・マッチングという方法を使っています。2億1100万の値を持つ因果的な変換器で、自分が描いた不完全な画面を手がかりに学習させたため、すぐには崩れません。少し前の画面を位置で思い出すので、振り返ってもたいてい同じものが見えます。画面は512×288で毎秒10コマ、12回のノイズ除去で、RTX 5000 Adaで1コマ47ミリ秒、CPU 12コアでは1コマ2.5秒です。モデルの読み込みは2.2GBです。学習にはGPU 6〜11台で2日かかりました。遊ぶには「pip install -r requirements.txt」のあと「python -m wm.play」で、ブラウザーの127.0.0.1:8765で開きます。【ポイント・注意点】扉や怪物は出ますが、確実ではありません。場所の記憶は短い間だけです。夢がほどけるように画面が崩れると、別の階に移されます。Python 3.10以上と、空きが約4GBあるNVIDIAのGPUが必要で、AppleのGPUは試されていません。PyTorchの版が合わないと「CUDAの装置がない」と出ることがあります。コードも重みもApache-2.0です。","2026-11-21","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50594070"],["ripcloc：コードの行を実装・テスト・説明に分けて数える","ripclocは、とても速いコードの行数を数える道具です。各行を「実装」「テスト」「コメント・説明」に分けて数え、Rustの#[cfg(test)]のように同じファイルの中にあるテストもテストとして数えます。Linuxのカーネル全体を230ミリ秒で数えられるとしています。作者は、エージェントが書いた行の量を、道具を使うたびやコミットのたびに確かめる使い方を勧めています。Rust製で、MITライセンスです。","\n【概要】ripclocは、cloc（行を数える古い道具）の考えを受け継ぎ、ずっと速くした道具です。名前もそれにちなんでいます。数えた結果は、プロジェクトの定義のファイルごとにまとめられます。【背景】作者はHNで、エージェントに作業を任せるとき、行が増えることの重さを早く、何度も考えさせていると書いています。そうすると、必要のない複雑さを抑え、設計の悪い兆しについて話すきっかけになるからです。もう一つの目的は、テストの量を数えることです。実装とテストがどのくらいの割合かを、すぐに知りたいという考えです。【詳細】ripclocは、Cargo.toml、package.json、pyproject.tomlなどのプロジェクトの定義ごとに数をまとめます。言語ごとのテストの決まりを知っていて、Rustのファイルの中にある#[cfg(test)]のテストもテストとして数えます。「-o json」でJSONを出せ、--depth、--no-ignore、--deps、--languagesなどの指定もあります。速さは、似た道具の「ほぼ3倍」、clocの150倍以上だとしています。Linuxのカーネルでは230ミリ秒（clocは123秒）、1ファイルでは2.9ミリ秒、9万ファイルでも使うメモリは最大63MiBです。測ったのはAMD EPYCの16個の仮想CPUのうち15個です。導入は「brew install alfredjeanlab/tap/ripcloc」か「cargo install ripcloc」で、配布ページから実行ファイルも入手できます。【ポイント・注意点】文字で出す結果の形は、どの版でも変わる可能性があります。版の決まりに従うのはJSONの出力と終了コードだけです。道具ごとに「どれをコードと数えるか」が違うため、速さの比べっこは共通のファイルの組で測ったとしています。エージェントやコミットごとの使い方はHNの投稿の説明で、README自体は速く数える道具として書かれています。","2026-11-21","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50593391"],["Lithent：状態をクロージャーに持つ小さなUIライブラリ","Lithentは、部品の状態をクロージャー（関数の中に閉じ込めた値）で持つ、軽い仮想DOMのライブラリです。中心部分は約4.8KBで、JSXでも、組み立ての手間なしのテンプレートでも書けます。サーバー側での描画や、カスタム要素にも対応します。js-framework-benchmarkの結果も示しています。npmで入れられ、MITライセンスで公開されています。","\n【概要】Lithentは、Webの画面を作るための小さなライブラリです。ReactやPreactと同じく仮想DOMの仕組みを使いますが、部品の状態の持ち方が違います。状態は関数のクロージャーの中に置かれます。【背景】Webの画面の部品づくりでは、Reactの「フック」のような仕組みで状態を持つのが一般的です。ただ、その決まりは慣れるまで分かりにくいところがあります。Lithentは、JavaScriptがもともと持つクロージャーを使い、より素直な書き方を目指しています。【詳細】中心の機能は、部品のmount/lmount、Portal、作られたときや消えるときの処理、Refです。必要なら、state/lstate、computed、effect、store、contextなどの補助も使えます。サーバー側での描画、lithent/elementによるカスタム要素、FTags、HTM、Viteの追加機能によるJSXにも対応します。大きさは中心部分が圧縮して約4.8KBで、READMEの比べた表ではPreactが約4.5KB、Reactが約94KBです。js-framework-benchmarkでは、CPUの点数1.29、最初の描画60.5ミリ秒、転送5.9kBで、213ある実装のう
