ィングエージェントが脚本を書き、すべてのフレームをコードで作り、音を設計して、MP4を手渡す。対象は短編映画、長尺YouTube動画、広告、解説動画、ミュージックビデオ。GitDiscoverによれば作られて約5日（11月3日時点のスナップショット）で、スター1.5K、フォーク271。\n\n背景\n動画生成AIが「プロンプトから映像」を競う一方で、フレームをコードとして記述する方向は、再現性と編集可能性で対照的だ。コードであれば差分の管理も、部分的な作り直しも、通常のソフトウェア開発の流儀で回せる。\n\n詳細\n制作プロセス全体を一つのエージェントに委ねる点が大胆だ。脚本、映像、音響という、本来は分業の各工程をコード経由で束ねている。271というフォーク数は、自分の題材で試そうとする人の多さを示している。\n\nなぜ注目か\nrea-videoが「動画を読む」側だったのに対し、cinecodeは「動画を書く」側で、今週の映像×エージェントというテーマの両端がそろった。プログラム可能な映像制作のパイプラインとして、今後の発展が気になる。\n\nポイント・注意点\n生成物の品質は素材やジャンルに大きく左右されるはずで、実例を見て判断したい段階だ。音響や権利処理（素材のライセンス）も、公開作品に使うなら個別の確認が要る。\n\nコードで作る映像の利点は、作り直しの粒度だ。プロンプト生成では全体を振り直すことになりがちな修正も、コードなら該当部分だけを書き換えられる。バージョン管理や差分レビューといった、ソフトウェアの当たり前が映像制作に入る感覚だ。音響まで含めたのは野心的で、工程のどこまでが実際に一貫して回るのか、実例の蓄積が待たれる。\n\n対象ジャンルの広さも宣言として大きい。短編と広告と解説動画では求められる絵作りがまったく違い、同じ仕組みでどこまで届くかが見どころになる。\n\n公開から間もないが、題材の分かりやすさが人を集めた。", "2026-11-08", "GitDiscover Newcomers", "https://gitdiscover.org/newcomers"], ["shanselman/gputaskman — GPUのVRAMとKVキャッシュまで見えるタスクマネージャー", "Windows、Linux、WSL向けのGPUタスクマネージャー。プロセスごとのVRAM使用量やGPUアクティビティに加え、LLMのモデルとKVキャッシュの情報まで可視化する。開発者は著名なMicrosoftのScott Hanselman氏。作られて約5日で792スターと規模は小さいが、LLMを手元で動かす人間の「困りごと」に刺さる道具として新規ランキングに入った。", "概要\nshanselman/gputaskmanは、GPUのためのタスクマネージャーだ。対象はWindows、Linux、WSL。プロセスごとのVRAM、GPUの活動状況に加えて、LLMのモデルやKVキャッシュに関する洞察まで表示する。WindowsではAMDとNVIDIAの両方に対応する。GitDiscoverによれば作られて約5日（11月8日時点）で、スター792、フォーク37。\n\n背景\nローカルでLLMを動かす開発が広がり、「VRAMを食っているのは誰か」「KVキャッシュがどれだけ効いているか」は日常的な疑問になった。OS標準のタスクマネージャーではLLM特有の内訳まで見えず、専用ツールの居場所が生まれている。\n\n詳細\n作者はMicrosoftの開発者コミュニティで著名なScott Hanselman氏だ。個人の「あったらいいな」から出発した道具が、本人の発信力もあって広く知られる形になっている。Pythonで書かれており、大規模なフレームワークというより、焦点の絞られたユーティリティだ。\n\nなぜ注目か\n巨大モデルやエージェント基盤が並ぶ週にあって、こうした小さな計測ツールが新規ランキングに入るのは健全だ。インフラの見える化は、ローカルAI開発の裾野の広がりを映している。\n\nポイント・注意点\nGPUやドライバの組み合わせで取得できる情報には差が出る。対応表記はWindows側のAMD／NVIDIAが中心で、環境ごとの挙動は実際に動かして確かめたい。スター数が小さいうちは更新の継続性も見守る対象だ。\n\nLLMの推論では、モデル本体と同じくらいKVキャッシュの管理が体感を左右する。どのプロセスがどれだけVRAMを掴んでいるかが見えれば、同時起動の調整や設定の見直しがその場でできる。巨大な統合環境ではなく、こうした単機能の計測器がそろうことで、ローカル実行の日常の不便が少しずつ解けていく。著名な開発者の個人プロジェクトとして、作る過程自体が教材になっている面もある。\n\n小さな道具だが、狙いの一点に絞った分かりやすさがある。", "2026-11-08", "GitDiscover Newcomers", "https://gitdiscover.org/newcomers"], ["Th0rgal/satmux — 機内Wi-Fi（GEO衛星）の遅延をTCP多重化でごまかす技術", "高遅延なGEO衛星回線の機内Wi-Fiを高速化する仕組み。温めておいたBBRのTCP多重化と、1-RTTで済むGround-TLS、zlib圧縮を組み合わせ、依存ゼロで動く。作られてわずか約1日で879スターを集めた。航空機のネットが遅いという誰もが経験する不満に、プロトコルレベルで挑むニッチだが鋭いプロジェクトだ。公開1日で879スター、遅延という物理への挑戦が刺さった。", "概要\nTh0rgal/satmuxは、高遅延なGEO（静止軌道）衛星回線を使う機内Wi-Fiの高速化を狙うプロジェクトだ。GitDiscoverによれば作られて約1日（11月7日時点）で、スター879、フォーク41を集めた。主要言語はPython。\n\n詳細\n手法は三つの組み合わせだ。あらかじめ温めておいたBBR（輻輳制御）のTCP接続の多重化、1ラウンドトリップで済むGround-TLS、そしてzlib圧縮。依存ライブラリはゼロをうたう。静止衛星経由では往復遅延が桁違いに大きく、通常の接続確立の往復回数がそのまま体感速度を殺す。往復を減らし、温まった接続を使い回すのは、その物理に正面から合わせた設計だ。\n\n背景\n機内Wi-Fiの遅さは、帯域よりも遅延の問題が大きいことが多い。スター数こそ小さいが、公開直後の集まり方は、同じ不満を持つ技術者の多さを示している。\n\nなぜ注目か\nAIとは無関係の、純粋なネットワーク工学のプロジェクトが新規ランキングで光る週になった。制約の正体（遅延）を見極めて、派手さのない技術の積み重ねで解く姿勢が評価されている。\n\nポイント・注意点\n効果は回線事業者側の構成や航空会社のネットワーク設計に左右され、どこでも使えるとは限らない。通信の暗号化や中継の設計に関わるため、利用時は仕組みと各サービスの規約を確認したい。\n\nGEO衛星の往復遅延は光速の都合で避けられず、圧縮や多重化はその前提の上での工夫になる。温めた接続を使い回す発想は、接続確立のコストが支配的な環境ほど効く。機内Wi-Fiに限らず、遠隔地や船舶など、高遅延回線の現場はほかにもある。依存ゼロという実装方針も、制約の多い環境へ持ち込みやすくするための判断だろう。\n\n機内Wi-Fiは航空会社のサービス品質を左右する要素になっており、遅延対策は顧客体験に直結する。衛星回線の世代交代が進んでも、軌道の違いで遅延の性格は異なる。GEO向けの工夫は、当面は現実の選択肢であり続けるだろう。\n\n数字以上に、着眼点の鋭さが人を集めた形だ。", "2026-11-08", "GitDiscover Newcomers", "https://gitdiscover.org/newcomers"], ["sostenesfreitas/ocarina-recomp — エミュレータなしで時のオカリナをWindowsで動かす", "『ゼルダの伝説 時のオカリナ』をエミュレータなしにWindowsでネイティブに動かすプロジェクト。自分のPCで、自分のコピーからビルドする形で、ゲームファイルは含まれない。作られて約2日で926スターを集めた。今週はオカリナ関連の再コンパイルが複数同時に現れており、その一つだ。今週はオカリナ関連の再コンパイルが複数同時に立った。同じ週に同題材の競作が複数立った。", "概要\nsostenesfreitas/ocarina-recompは、『ゼルダの伝説 時のオカリナ』をWindows上でネイティブに動かすプロジェクトだ。エミュレータを使わず、利用者自身のPCで、自身のコピーからビルドする。ゲームファイルは含まれない。GitDiscoverによれば作られて約2日（11月8日時点）で、スター926、フォーク52。\n\n背景\n今週の新規ランキングは、時のオカリナをめぐるプロジェクトが目立った。Switch 2リメイクの再コンパイルを狙うNotRexed/Hookshot、『ティアーズ オブ ザ キングダム』の再コンパイルなど、同じ題材に複数のアプローチが同時に出ている。本プロジェクトは「エミュレータなしのネイティブ実行」という最も分かりやすい形を掲げる。\n\n詳細\n主要言語はC。「自分のコピーからビルドする」方式は、配布物にゲームのデータを含めないための線引きであり、この種のプロジェクトの標準的な作法だ。926スターという規模は大作ではないが、公開2日の集まりとしては速い。\n\nなぜ注目か\n同じIPに複数の再コンパイルが立つのは、題材への愛着と、技術的な「正解」がまだ固まっていないことの表れだ。各プロジェクトのアプローチの違いを比べること自体が読み物になる。\n\nポイント・注意点\nビルドには正規のコピーが前提で、手順も開発者寄りだ。完成度は発展途上と見るべきで、実プレイの安定性を期待する段階ではない。進捗はフォークやコミットの動きで追うのがよいだろう。\n\n同じ題材に複数の実装が立つと、利用者は完成度で選べるようになり、開発側は互いの進捗が刺激になる。エミュレータではなくネイティブ実行という旗は、性能と再現性の両面で分かりやすい約束だ。936スターという数字より、公開2日という速さでフォークが52ついたことの方が、コミュニティの温度を表している。\n\nネイティブ実行は、成功すれば入力遅延や描画の素直さで利点が出やすい一方、移植の手間は大きい。完成までの道のりは長く、進捗は小さな更新の積み重ねで追うことになる。", "2026-11-08", "GitDiscover Newcomers", "https://gitdiscover.org/newcomers"], ["beenurar/AiSOC — APIキー不要のAIセキュリティ運用センター", "CoddyKitが「エコシステム完成期」の5作として紹介したbeenurar/AiSOCは、オープンソースのAIセキュリティ運用センター（SOC）です。スター数は6,353で、当日+446を記録しました。7,023件のルールライブラリから2,538件の実行可能な検知ルールを走らせ、トリアージにはローカルLLM（llama3.2:3b）を使うためAPIキーは不要です。すべての手順を再生可能な「調査台帳」に記録する点が、監査用途で評価されています。", "beenurar/AiSOCは、オープンソースのAIセキュリティ運用センター（SOC）です。CoddyKitが「エコシステム完成期」を示す5作の1つとして紹介したもので、スター数は6,353、フォークは653、当日の増加は+446を記録しました。Python製で、ライセンスはMITです。\n\nSOCとは、組織のシステムから上がってくる大量のセキュリティ記録（テレメトリ）を監視し、異常を見つけて対応する専門の仕組みです。AiSOCの流れは、テレメトリを取り込んで共通の形に正規化し、検知ルールを走らせ、反応したものをインシデントとしてまとめ、AIエージェントが調査し、対応案を提示する、というものです。最終的なアクションは人間が承認するまで外部ベンダー側へは届きません。\n\nルールの考え方に設計思想が表れています。プロジェクトの言葉を借りれば「実行可能は、宣言ではなく実績で決まる」。7,023件のルールライブラリのうち、実行用セットに入れるのは2,538件で、それらはベンダー形式の実イベントを実際のコネクタとエンジンに通し、発火する様子を確認できたものだけです。置いてあるだけのルールは、動くものとして数えません。\n\n実行環境も割り切っています。git cloneしてmake upすれば起動し、コア構成は8GB RAMと20GBディスクで足ります。同梱のOllamaでllama3.2:3bが固定版として動き、トリアージの判定を返します。APIキーは不要で、データが自ネットワークの外に出ることもありません。巨大な最新モデルではありませんが、この用途には十分に使える出力が得られる、という実測も添えられています。\n\nすべてのプロンプトとツール呼び出しは、再生可能な「調査台帳」に記録されます。後から「なぜそう判断したか」を辿れるこの記録方式が、監査用途で評価されています。さらにClaude、Cursor、Continue向けのMCPサーバーを備え、Splunk、Sentinel、Elasticなど90のデータコネクタに対応します。セキュリティ基盤が、開発者の日常のエージェントから直接使える形になるという方向性の一例です。", "2026-11-03", "CoddyKit", "https://www.coddykit.com/pages/blog-detail?id=5130014&slug=github-trending-november-2026-from-a-40k-star-ai-engineering-hub-to-a-6k-star-ai"], ["Orkas-AI/Orkas — ローカルファーストなマルチエージェント・デスクトップ", "CoddyKitの11月分析で「エージェント時代が基盤からアプリへ移った」象徴として挙げられたOrkas-AI/Orkasは、MITライセンス、ローカルファーストのマルチエージェント・デスクトップアプリです。司令役のCommanderが、16の組み込み専門エージェントに加え、Claude Code、Codex、OpenCodeなどの外部エージェントを束ねます。初日に1,044スターを集め、合計7,016スター・439フォークに達しました。", "Orkas-AI/Orkasは、CoddyKitの11月分析で「エージェント時代が基盤からアプリへ移った」象徴として挙げられた新作です。フレームワークや部品ではなく、インストーラーを持つ完成品のデスクトップアプリとして提供される点が、これまでのトレンドとは一線を画します。MITライセンスのオープンソースで、ローカルファーストを掲げます。\n\n中核はCommander（司令役）パターンです。Commanderが利用者の目標を受け取り、作業をToDoに分解して、適したエージェントに割り振ります。組み込みの専門エージェントは16あり、リサーチ、SEO監査、株式分析、コンテンツ作成、プレゼン資料や画像・動画の制作、UI設計、開発、オフィス文書の処理、EC業務向けの専門役など、領域ごとに分かれています。さらにClaude Code、Codex、OpenCode、OpenClaw、Hermes-Agentといった外部のエージェントも、ローカルセッションとして束ねて動かせます。実行環境の異なるエージェントを、信頼の境界をまたいで調整するのがこの設計の肝です。\n\n記憶の扱いも特徴的です。作業の単位は「プロジェクト」で、目標、ルール、メモリ、ファイルがそこに保持されます。新しい会話は前回の続きから始まるため、文脈は検索で拾い直すものではなく、作業場そのものに宿ります。定期自動化も備わり、毎時・毎日・毎週・毎月の繰り返し作業を人がいない間にも進め、成果物はレビューのために手元へ返ってきます。\n\nデータは自分のコンピュータ上に置かれ、モデルは組み込み（500クレジットの無料枠）のほか、自分のAPIキーやローカルなOpenAI互換エンドポイントも選べます。対応環境はmacOS 12以上とWindows 10以上で、ソースからLinuxで動かすことも可能です。初日1,044スター、合計7,016スター・439フォークという滑り出しは、「エージェントが動くか」から「完成した成果物を届けられるか」へ関心が移っていることを示しています。", "2026-11-02", "CoddyKit", "https://www.coddykit.com/pages/blog-detail?id=5130012&slug=github-trending-november-2026-from-a-7k-star-local-first-ai-team-to-a-42k-star-m"], ["THU-MAIC/OpenMAIC — 資料を対話型クラスルームに変える42Kスター", "清華大学MAICラボのTHU-MAIC/OpenMAICは、任意のテーマや文書を対話型の授業に変えるオープンソース・プラットフォームです。AI教師、AIクラスメイト、ホワイトボード描画、TTSナレーションを備えた授業を生成し、スライド、クイズ、対話型シミュレーション、プロジェクト型学習まで含みます。成果物はPPTXやオフラインHTMLへワンクリックで書き出せます。スター数は42,318、フォークは6,522に達しています。", "THU-MAIC/OpenMAICは、清華大学MAICラボが公開したオープンソース・プラットフォームです。CoddyKitの集計ではスター数42,318、フォーク6,522に達しており、新着ながら桁違いの支持を集めています。\n\n発想はシンプルです。テーマを言葉で伝えるか、手持ちの資料を渡すと、AIが数分で授業一式を構築します。そこにはAI教師とAIクラスメイトがいて、講義をし、議論をし、学習者とリアルタイムにやり取りします。単なるスライド生成ではなく、「教室」という体験そのものを生成する点が特徴です。\n\n授業を構成する場面の種類も豊富です。スライド、クイズ、対話型HTMLシミュレーション、プロジェクト型学習（PBL）の活動が用意され、エージェントはホワイトボードに図や数式を描きながら、TTSによる音声で解説します。成果物の書き出しはPPTX、オフラインHTML、教室ZIPに対応し、ワンクリックで行えます。生成処理はサーバー側で走るため、ブラウザのタブを閉じたり再起動したりしても継続します。2026年10月29日のv1.3.0ではナレッジベースが追加され、アップロードした資料が所有者ごとに保持され、会話から参照できるようになりました。\n\n技術構成はNext.js 16、React 19、TypeScript 5、Tailwind CSS 4、PostgreSQL 16と現代的です。また「OpenMAIC Skill」を通じて、OpenClawやCodex、Feishu、Slack、Telegramなど20以上のメッセージアプリやIDEから教室を生成することもできます。Orkasと並び、「基盤ではなく、専門領域に特化した完成品」の代表例として位置づけられる1件です。\n\n対応するモデル提供元の幅も広く、OpenAI、Anthropic、Google Gemini、DeepSeek、Qwen、Kimi、GLMなどのほか、Ollamaのようなローカル実行も選べます。モデルはopenmaic.ymlで一括設定でき、利用者に自分の鍵を持たせない運用も可能です。\n\n教室という単位で、資料・生成物・会話履歴がひとまとまりに保持される点も見逃せません。この形は、Orkasのプロジェクトモデルと通じる、「記憶は作業場に宿る」という設計思想の表れです。", "2026-11-02", "CoddyKit", "https://www.coddykit.com/pages/blog-detail?id=5130012&slug=github-trending-november-2026-from-a-7k-star-local-first-ai-team-to-a-42k-star-m"]], "gh-blog": [["$10のOpenStickホームラボ — Hacker Newsで748ポイント", "11月8日のHacker Newsまとめで748ポイントを集めた、約10ドルの4Gモデムスティックでホームラボを組む実践記です。OpenStickはモデムの形をしたコンピュータで、512MB RAM（実質約450MB）、1GHzのCortex-A53×4コア、4GB eMMCを備えます。DebianとPodmanを動かし、広告ブロックや監視、エージェントまでをこなしています。「一番下の計算資源の価格が崩壊している」象徴として議論になりました。", "11月8日のHacker Newsまとめで748ポイント・129コメントを集めたのが、約10ドルのOpenStickでホームラボを組む実践記です。著者は送料込みで約10ドルで入手し、本来は通信用の機器を自宅サーバーに仕立てました。\n\nOpenStickは、4G LTEモデムの形をしたコンピュータです。スペックは512MB RAM（実質的に使えるのは約450MB）、1GHz駆動のCortex-A53が4コア、4GB eMMC、150Mbit Wi-Fi、GPS付き4Gモデム、パッシブ冷却、そしてプログラム可能なLEDが1つ。数字だけ見れば控えめですが、れっきとした1台のコンピュータです。\n\nこの上で著者はDebianとPodmanを動かし、実用的なサービスを詰め込んでいます。AdGuard Homeによる広告ブロック（DNSクエリの約60%を遮断）、YouTube向けのCastSponsorSkip、Cloudflare Tunnelによる外部公開、Beszelによる監視、そしてエージェントハーネスのZeroclawです。Zeroclawの待機時のメモリ使用量は約3MB RSSとされています。\n\n文脈として面白いのは対比です。著者は以前、Kubernetes上でOpenClawを動かしていましたが、メモリを1GB以上消費し、更新のたびに壊れてワークフローを乱していました。それが今は、10ドルのスティック上の単一プロセスに置き換わっています。スレッドでは、USBテザリングやシリアルコンソールとしての利用、PoE給電でクラスタ化できるか、といった応用の質問も飛び交いました。\n\n注意点は、実質的なコストが導入作業にあることです。モデムスティックの転用であるため、Raspberry Piのように確立した書き込みツールの道は用意されていません。それでも「一番下の計算資源の価格が崩壊している」象徴として、安価なハードでどこまで自宅サーバーや連続稼働の実験台が成立するかを示す題材になっています。", "2026-11-08", "Duk Lee HN Roundup", "https://duklee.net/blog/2026-11-08-hn-frontpage-roundup/"], ["Claude Codeの「今後聞かない」が秘密情報を1,122ファイルに残していた", "セキュリティ企業Apiiroの調査が、Hacker Newsで543ポイントの話題になりました。公開リポジトリにある.claude/settings.local.json、104,185件を調べたところ、1,122件に実在らしい秘密情報が含まれ、総計2,539件の秘密が1,994リポジトリに及んだとされます。エージェントへの「今後聞かない」という承認が、秘密を含むコマンドをそのまま設定ファイルに残しうる仕組みが問題で、使い方に直結する注意喚起です。", "セキュリティ企業Apiiroが公開リポジトリを調査した結果が、Hacker Newsで543ポイント・385コメントを集めました。\n\n調査の数字はこうです。対象は104,185件の.claude/settings.local.jsonで、そのうち1,122件に実在らしい秘密情報が含まれていました。秘密は総計2,539件、リポジトリは1,994件、影響を受ける組織は63に上るとされます。中身も深刻で、データベース業者自身の管理用クラウドキー、本番のAzure Postgresのパスワード、Squareの本番トークン、医療記録データベースの所有者パスワードなどが含まれていたということです。\n\n仕組みは地味ですが、厄介です。エージェントにデータベースの確認を頼むと、接続文字列を含むコマンドが提案されます。コマンドは秘密なしには動かないため、それ自体は合理的です。しかし承認を求められるのが何度も続くと、利用者は「はい、今後聞かない」を選びがちです。その瞬間、秘密を含むコマンド文字列が、そのままsettings.local.jsonに書き込まれます。\n\n漏れる経路も説明されています。Claude Codeはこのファイルをグローバルのgitignoreには加えますが、リポジトリ側の.gitignoreには加えません。後からフォルダがリポジトリ化された場合や、別のマシンでのクローン、既に追跡済みのファイルだった場合には、保護が効きません。調査では加えて、git履歴の中や、チームで意図的に共有するsettings.json、リポジトリ内に保存されたエージェントの会話記録からも、1,160件の秘密が見つかったとされます。\n\nスレッドにはClaude Code責任者のBoris Cherny氏も現れ、防止策を検討中で、自動モードの検出や基本的な秘密スキャンの試作を進めていると答えました。一方で、最も支持を集めた反論は「『今後聞かない』を押しても何も公開されない。公開するのはコミットする行為だ」というもので、見出しはその点を圧縮しています。またApiiro自身がセキュリティ製品のベンダーである点も、割り引いて読む材料です。それでも実務への教訓は明確です。設定ファイルは公開前に必ず中身を確認すること。心当たりがある場合は、掃除よりも先に秘密の無効化（ローテーション）を行うことです。", "2026-11-08", "Duk Lee HN Roundup", "https://duklee.net/blog/2026-11-08-hn-frontpage-roundup/"], ["Goodbye Claude, hello Pi — Claude Codeを離れた開発者の詳細な記録", "Hacker Newsで628ポイントを集めたブログ記事です。ある開発者がClaude Codeの利用をやめ、オープンソースのハーネス「Pi」へ移行した経緯を詳しく書いています（記事の日付は9月21日）。不満は検証できる具体性で並べられ、スレッドでは「ハーネスは交換可能な部品ではない」という反論も強く出ました。エージェントの乗り換えが現実の選択肢になっている今を映す記録で、道具の乗り換えコストが下がっている時代の視点が参考になります。", "Hacker Newsで628ポイント・404コメントを集めたブログ記事です。ある開発者がClaude Codeの利用をやめ、オープンソースのハーネスであるPiへ移行した経緯を詳しく書いています。投稿の日付は9月21日で、フロントページに載るまで7週間かかっています。\n\n離れた理由は、感情ではなく具体的な指摘の積み重ねです。Claude Codeは今年だけで244回のリリースがあり、その4分の3以上がシステムプロンプトやツール説明を変更していたこと。2025年12月に報告されたVS Codeのテキスト選択のバグが、無関係な重複として閉じられたこと。GUI拡張ではスラッシュコマンドの半分が動かないこと。Bashツールの説明が、モデルが既に知っているgitやプルリクエストの解説だけで約3,000トークンに及ぶこと。動的ワークフローやエージェントチームといった機能の追加ペースについても、開発者は「自分の仕事を良くするためというより、企業にトークンを燃やさせるためだ」という見方を示しました。\n\n象徴的なのは、移行を決めた翌日にAnthropicがAGENTS.md対応を出したことです。それは開発者にとって、上手いゲリラマーケティングであると同時に、利用者が2つの形式を手作業で維持しなければならなくなる問題そのものに見えた、と書かれています。\n\n一方、スレッド側の反論も強く、議論の本丸はこちらです。ネイティブでないハーネスで同じモデルを動かすと、トークン消費が最大で5倍になり性能も落ちるとの報告。通信層のカスタムヘッダーや非公開のAPI機能がモデルの振る舞いに影響している可能性。文脈の圧縮（コンパクション）はClaude Codeが明確に優れていること。第三者ハーネスには利用規約違反のリスクがあること。「モデルの効率の大半はハーネスに宿る」という指摘が、その主張をまとめています。\n\n両方の主張は同時に成り立ち得ます。ハーネスは重要であり、同時に既存のハーネスは大口顧客向けに最適化されつつある。Piの利点はコーディングが上手いことではなく、小さくて全体を理解でき、気に入らない部分を自分で変えられることです。背景には、claude-memのような永続メモリやt3codeのような操作面が育ち、製品に縛られず作業環境を組み立てる動きが強まっていることもあります。", "2026-11-08", "Duk Lee HN Roundup", "https://duklee.net/blog/2026-11-08-hn-frontpage-roundup/"], ["llama-modchip — GPUなし、64GB RAMで284Bモデルを動かす", "Hacker Newsで299ポイント・113コメントを集めた話題です。llama.cppとggmlへのパッチ集llama-modchipにより、総パラメータ284.33BのDeepSeek-V4-Flashを、1.71ビット／重みで56.56GiBに収めたと報告されています。256Kコンテキストでもピーク57.61GiB、NVMeスワップなし、GPUは不使用。「16GBや64GBといった身近なメモリでどこまで動くか」という関心に直結する実験です。", "llama-modchipは、llama.cppとggmlへのパッチ集で、Hacker Newsで299ポイント・113コメントを集めました。題材は、巨大モデルをどこまで小さな個人機で動かせるか、という一点です。\n\n対象モデルはDeepSeek-V4-Flashで、総パラメータは284.33B、実際に活性化するのは13.17B、MLA層が43、ルーティングされるエキスパートが256という構成です。これを1.71ビット／重みまで落として56.56GiBに収めました。256Kという長いコンテキストでもピークの常駐メモリは57.61GiBで、NVMeスワップは使っていません。GPUはゼロです。\n\n速度の報告も具体的です。16コアのZen 5で、プリフィルが44.36トークン/秒、デコードが9.1〜14.7トークン/秒とされています。\n\n工夫の中身にも触れておきます。大きなものは、AVX-512BW向けの4段階のレジスタ・キャッシュのタイル化スケジュールで、量子化された行列ベクトル演算の従来方式を置き換え、プリフィルで+77%、デコードで+53%の改善が報告されています。巧妙なのは、チェスエンジンの主変化探索から借りた1.64MBのZobrist n-gramドラフターで、トークンを投機的に下書きする仕掛けです。さらに、KVキャッシュのスロットを/dev/shmへスナップショットすることで、ツール40件規模のClaude Codeのプロンプトを、再プリフィルなしに13ミリ秒で復元できるとされています。\n\nただし距離を置くべき点も2つあります。第1に、1.71ビット/重みは圧縮の妙ではなく能力との交換です。収まったモデルは、リーダーボードで点数を取ったモデルそのものではなく、READMEが示すのは処理速度であって品質ではありません。第2に、n-gramドラフターはコード状のテキストではうまく下書きしますが散文では弱く、速度の数字は著者が関心を持つワークロードでの最良値です。それでも、284B級のモデルがデスクトップのRAM上で毎秒10トークン前後でデコードできることは、「有能なモデルを誰が動かせるのか」という問いへの答えと、ローカル推論のコストの下限を大きく動かす成果です。", "2026-11-08", "Duk Lee HN Roundup", "https://duklee.net/blog/2026-11-08-hn-frontpage-roundup/"], ["Goldman Sachs、銀行員・トレーダーのClaude Code利用を制限", "Hacker Newsで354ポイントを集めた報道です。Goldman Sachsは10月に社内ガイダンスを更新し、Claude CodeとGitHubの利用を約12,000人のエンジニアに限定しました。これにより、顧客フローの観察やポジションのモデル化、資料作成に使っていたトレーダーや銀行員は使えなくなったと伝えられています。生成AIツールの社内展開が「全員開放」から「権限と監査を伴う限定展開」へ移る流れを示す事例として議論されています。", "Hacker Newsで354ポイント・221コメントを集めた報道です。\n\nGoldman Sachsは10月に社内ガイダンスを更新し、Claude CodeとGitHubの利用を約12,000人のエンジニアに限定しました。ストラテジストは利用を継続するとされます。Bloomberg筋の情報では、きっかけは生産性とリスクのレビューだったということです。\n\n対比が際立つのは、その少し前までの姿勢です。同行のCIOは7月の時点で、技術スタッフでない従業員による「バイブコーディング」を公に称えていました。ガイダンスの更新により、顧客フローの観察やポジションのモデル化、資料作成にこれらのツールを使っていたトレーダーや銀行員は、使えなくなったと伝えられています。\n\nこの話が生産性ではなくリスクの話として読まれる理由は、エージェントの性質にあります。利用者本人の権限で動き、顧客データやメール、ネットワークへの到達性を備えた端末上で走るエージェントは、プロンプトインジェクション1つで事故の入り口になり得ます。エンジニアの書くコードはレビューとデプロイの関門を通りますが、トレーダーがフローの監視のために作ったスクリプトは、「動くから」という理由で日常業務に入り込み、誰も中身を読んでいないことが多い。ここに情報の壁を管理すべき銀行特有の事情も重なります。\n\nスレッドでは別の側面も指摘されました。制限の本当の理由はリスクではなく請求額だった、という雇用主側の声が複数あるのです。Anthropicは料金を平準化できていない一方、Geminiはスロットリング付きの定額を提供し、非エンジニア組織の9割にとって体験はほぼ等しい、という見方です。コスト管理の文脈でも読める事例で、生成AIツールの社内展開が「全員開放」から「権限と監査を伴う限定展開」へ移る流れを示すものとして議論されています。\n\nスレッドに集まった221件のコメントの多さが示すように、この話は金融業界の内情としてだけではなく、「自分の組織にも起こり得る話」として読まれました。導入期の熱狂の直後には、必ず「誰に、どこまで使わせるか」の線引きが来ます。多くの企業がこれから通る工程を先取りした事例として、この報道はしばらく参照されそうです。", "2026-11-08", "Duk Lee HN Roundup", "https://duklee.net/blog/2026-11-08-hn-frontpage-roundup/"], ["MaxxBench — DeepSWEの課題を少し変えたらスコアが崩れた、ベンチマーク汚染を問う検証が380ポイント", "UnlapのMaxxBenchは、DeepSWEの中規模課題89件にファイル名の小文字化やタイムスタンプ形式の変更といった小さな変異を加え、15のモデル構成を再実行した。Gemini 3.8 Flashは73.8％から53.4％へ、DeepSeek系も大きく落とした一方、Claude Opus 5.5は74.2％から76.4％へ上がった。公開スコアが要件理解ではなく想起を測っている可能性が議論になった。", "概要\nUnlapが公開したMaxxBenchは、コーディングベンチマークDeepSWEの評価方法に疑問を投げかける検証で、Hacker Newsで380ポイント、101コメントを集めた。中程度の長さの課題89件を取り、元の課題に小さな変更を加えたうえで、15のモデル構成を再実行したという。\n\n詳細\n変異の内容は、レポートのファイル名を小文字にする、必要なタイムスタンプ形式を変える、実装に使えるインターフェースを調整するといった、要件としては小さな違いだ。参照パッチは中央値で17行、3.5％増えただけだったとされる。それでも結果は大きく割れた。Claude Opus 5.5は74.2％から76.4％へ上がった一方、Gemini 3.8 Flashは73.8％から53.4％へ、DeepSeek V4.1 Flashは74.2％から55.6％へ、DeepSeek V4 Flashは53.3％から28.1％へ落ちた。公開ベンチマークでは互角に見えた2モデルが、少し変えただけで23ポイント差になったという整理だ。興味深い失敗例として、正しく実装できていたモデルが、別のモデルに元のベンチマークの答えを尋ね、その答えと矛盾するとして自分の動くコードを消してしまった事例も紹介された。\n\nなぜ注目か\n人気ベンチマークの課題が学習データに入り、スコアがチェックポイント選定を左右し、開発側が失敗パターンに合わせて調整するようになると、スコアは「要件を読んで解く力」と「期待される答えを覚えていること」を区別できなくなる。MaxxBenchの主張は、ベンチマーク全体が壊れているという話ではなく、その区別ができるのは変異を加えた時だけだという点にある。\n\nポイント・注意点\nこれは1ベンダーが89課題で行った検証であり、変異を作ったのも結果で利益を得る側だという留保は必要だ。Opus 5.5がむしろ上がったことは、変異が一様に難しくなったわけではないことも示す。コメントでは、汚染よりも学習環境が単純すぎることが小さいモデルの崩れを招いたという別の説明も有力視された。単一スコアでモデルを選ばず、自分の課題での追試が欠かせない。", "2026-11-08", "Duk Lee HN Roundup", "https://duklee.net/blog/2026-11-08-hn-frontpage-roundup/"], ["vercel-labs/agent-browserがトレンド1位 — AIエージェント向けの高速Rust製ブラウザ自動化CLI", "Vercel Labsのagent-browserが11月8日のGitHubトレンドで1位になった。AIエージェントにブラウザ操作を与えるネイティブRust CLIで、npmやHomebrew、Cargoから入れられ、Chrome for Testingのバイナリを自前で管理する。重い自動化スタックなしにエージェントのワークフローへ組み込む狙いで、その日190スター増と記録された。", "概要\nVercel Labsのvercel-labs/agent-browserが、2026年11月8日のGitHubデイリートレンドで1位になった。毎日のトレンドを追うAgeshioの記録では、その日の注目度が高く、190スターの増加が示されている。11月6日時点では約4万6090スター、11月8日には約4万7027スターへ増えたという別ダイジェストの記録もある。\n\n詳細\nagent-browserは、AIエージェント向けのブラウザ自動化を提供するネイティブなRust製CLIだ。人間向けのブラウザを遠隔操作する重い構成ではなく、エージェントのワークフローにブラウザ制御を組み込むために作られている。配布はnpm、Homebrew、Cargoに対応し、Chrome for Testingのバイナリを自分で管理する点も特徴とされる。これにより、利用者は別途大きな自動化スタックを用意しなくても、ページ操作をエージェントから扱える。トレンド履歴を見ると、11月6日に10位へ顔を出し、8日に1位へ上がるなど、短期間での再浮上が目立った。同じ週のトレンド上位にはCloudflareのセキュリティ監査スキルやGoogleのskillsなど、エージェント向けの道具が並んでいた。\n\nなぜ注目か\nエージェントがコードを書くだけでなく、実際のWebページを見て、操作して、結果を確認する場面が増えている。その際のブラウザ層を、軽くて速いCLIとして切り出す発想は、エージェント基盤の部品化という今の流れに合っている。Vercel Labsという出自もあり、開発者向けツールの標準部品になるかどうかが注目された。\n\nポイント・注意点\nトレンド入りやスター数は人気の指標であり、安定性や安全性の評価ではない。エージェントにブラウザ操作を渡すことは、認証済みセッションへのアクセスを渡すことにもつながるため、対象サイトや権限範囲を絞る運用が欠かせない。具体的な対応範囲や制限は、導入前に公式リポジトリのREADMEで最新情報を確認したい。", "2026-11-08", "Ageshio GitHub Trending Radar", "https://ageshio.dev/"], ["Show HN: Coldframe — スーパーの冷蔵庫コントローラに化けるハニーポットが272ポイント", "スーパーの冷蔵制御装置Danfoss AK-SM 800AやDixell XWEB EVOに偽装するハニーポットColdframeがShow HNで272ポイントを集めた。Python標準ライブラリだけの単一ファイルで、偽のログインや店舗ダッシュボード、実在の攻撃が狙うXML窓口を用意し、試されたパスワードや悪用手法を記録する。本物には何も触れさせない設計だ。", "概要\n2026年11月7日のShow HNで公開されたColdframeは、スーパーマーケットの冷蔵設備を制御する装置に化けるハニーポットだ。Hacker Newsでは272ポイント、62コメントを集めた。GitHubリポジトリはhedgerow-dev配下で公開されている。\n\n詳細\nColdframeはPythonの標準ライブラリだけを使った単一ファイルで実装され、Danfoss AK-SM 800AシステムマネージャやCopeland／Dixell XWEB EVOスーパーバイザのふりをする。偽のログイン画面、偽の店舗ダッシュボード、そして実際の攻撃が狙うXMLエンドポイントを用意し、攻撃者が試したパスワードや、どの公開エクスプロイトを使ったかを記録する。裏側に実機はないため、解凍操作のようなボタンを押させても何も起きず、攻撃者の「次の一手」まで観察できるのが狙いだ。背景には2026年に、インターネットへ露出していた冷蔵スーパーバイザがデフォルトパスワードや未修正ファームウェアから侵入され、解凍サイクルを強制される事件が欧州で起きたことがあると解説される。公開直後の2つのインスタンスでは、汎用スキャナとShodanのクローラしか来ていなかったと投稿者は述べている。\n\nなぜ注目か\n笑い話のように見えて、食品小売の冷蔵チェーンという物理的な被害につながる運用技術（OT）の現実を突いているからだ。攻撃自体は高度ではなく、デフォルト認証情報を変えず、制御装置をインターネットへ出してしまうという、10年前から直せたはずの問題が残っていることが浮き彫りになった。\n\nポイント・注意点\nハニーポットで攻撃試行を記録すること自体は自分の設備であれば多くの法域で許容されるが、重要インフラを巡る対話的な観察は法的な論点も伴うとスレッドでは議論された。プロジェクトのREADMEは帰属を主張せず、記録に徹する姿勢だとされる。観察は防御そのものではないため、実環境ではまず露出を止め、認証情報を変えることが先決だ。", "2026-11-07", "Duk Lee HN Roundup", "https://duklee.net/blog/2026-11-08-hn-frontpage-roundup/"], ["REA（morluto/rea）がトレンド首位を維持 — ソースのないアプリをエージェントに逆解析させる道具", "GitHubトレンドでmorluto/reaが首位を続けた。ソースコードのないソフトをコーディングエージェントに調べさせるツールキットで、ネイティブバイナリをHopperやGhidra経由で、Electronアプリや.NET、Webサイトまで解析し、結論には根拠と限界を添えて説明させる。11月6日窓では1日3390スター増と計測され、科学誌系の取材でも話題になった。", "概要\nmorluto/rea、通称REA（Reverse Engineer Anything）は、2026年11月6日のスター増加窓でもGitHubトレンドの首位を守り、11月7日版のGhTrendsでも1位に残った。その日の増加は3390スターと計測されている。\n\n詳細\nREAは、ソースコードを持たないソフトの仕組みを、コーディングエージェントに調べさせるためのツールキットだ。ネイティブバイナリはHopperやGhidraといった解析ツールを通して調べ、JavaScriptやElectronアプリ、.NETアセンブリ、Webサイトも対象にする。単に答えを出すのではなく、ある機能がどう働くかについて、証拠と結論の限界を添えて説明させる設計が紹介されている。解析はローカルで動き、同じ道具をターミナルから直接使うこともできるという。GhTrendsの11月7日版では、reaと、似た発想でアプリを調べ直して作り直すcraft-anything、Cloudflareのsecurity-audit-skillが上位3件を占め、エージェントに既存ソフトを「読ませる」道具への関心の高さが並んで示された。11月3日にはREA開発者への取材記事も出て、プリンタやテレビ、車載ソフトを分解する利用例が紹介された。\n\nなぜ注目か\nエージェントの使い道が、新しいコードを書くことから、既存のブラックボックスを理解することへ広がっていることを象徴するプロジェクトだ。レガシー移行や相互運用、セキュリティ調査では、仕様書のない実装を読む作業が常に重い。そこへエージェントを投入する発想が、スターの伸びとして可視化された。\n\nポイント・注意点\nスター数や順位は関心の指標であり、解析結果の正確さの保証ではない。対象ソフトを解析する権限があるかどうかは利用者側の責任であり、公式は類似リポジトリやコピーされたREADMEは公式ではないと注意しているという情報もある。重要な判断では、REAの示す証拠を人が検証する前提で使うべきだ。", "2026-11-07", "GhTrends.dev", "https://www.ghtrends.dev/daily/2026-11-07/"], ["Libghostty 1.0公開 — JetBrainsの1250万人も使う端末エンジンが安定ABIに", "Ghosttyの端末エミュレーション中核を切り出したlibghostty-vtが1.0になった。C ABIが安定し、JetBrains IDEの内蔵端末は既にこれで動き、Neovimも移行PRが承認済みだ。HNで983ポイント前後を集め、端末を自作する時代から共有エンジンを使う時代への転換が注目された。署名付き配布物やオフライン構築への配慮など、ライブラリとしての成熟を示す内容も含まれた。", "概要\nMitchell Hashimoto氏が2026年11月6日、ターミナルアプリGhosttyの中核を切り出したライブラリ「libghostty-vt 1.0」を公開した。ポータブルで高性能なCライブラリとして端末エミュレーションを提供し、1.0ではライブラリ本体とC ABIの両方が安定したと宣言された。HNでは983ポイント前後を集める大きな話題になった。\n\n詳細\n1年ほど前にはC API自体が存在せず、利用者はGhostty本体だけだった。それが今ではJetBrains IDEの内蔵端末がlibghosttyに置き換わり、Hashimoto氏は同社の発表として1250万人を超えるアクティブユーザーが使う規模だと紹介する。Neovimでは従来のlibvtermを置き換えるプルリクエストが承認済みで、KDE側でも新しい端末の試作が進むと報じられた。1.0ではセマンティックバージョニングと厳格なABI互換の約束、署名付きソースtarballやオフライン構築用の依存関係バンドル、SONAMEやpkg-config、CMake設定といった配布向けの整備も重視された。約1500行のCで高機能な端末が作れるという説明も添えられている。\n\nなぜ注目か\n端末エミュレーションは多くの開発ツールが個別に再実装し、バグや互換性の差を抱えてきた領域だ。実績のあるエンジンが安定ABIで共有されれば、エディタやIDE、エージェント向けツールが表示や入力の土台を共通化できる。特にコーディングエージェントが実際の端末を必要とする場面が増える中で、土台の安定性は生産性に直結する。\n\nポイント・注意点\nライブラリはUIそのものではないため、組み込む側は描画やシェル接続を用意する必要がある。Neovimの置き換えもPR承認の段階であり、正式リリースに載るまでは従来環境と異なる。MITライセンスで依存ツリーにコピーレフトがない点は商用組み込みには有利だが、移行時はABI互換の範囲とパッケージング方法を公式ドキュメントで確認したい。", "2026-11-06", "Mitchell Hashimoto Blog", "https://mitchellh.com/writing/libghostty-1-0"], ["sshhole — 257バイトの長いパスワードでAlpineの無パスワード口座に入れるOpenSSHの欠陥、公開9時間で悪用観測", "musl libcを使うLinuxでPAM無効のOpenSSHに、パスワードなし口座へログインできてしまう欠陥sshholeが11月5日に公開された。257〜1024バイトのパスワードでcryptが返す「*」が口座側の「*」と一致してしまう仕組みで、CVE-2026-123158、CVSS 8.1。OpenSSH 10.6p2が同日修正し、公開後9時間未満で悪用の試みが観測されたという。", "概要\n2026年11月5日、OpenSSHに関する認証バイパスの欠陥が公開され、研究者の解説サイトsshhole.comがHacker Newsのトップ級の話題になった。後にCVE-2026-123158と採番され、CVSSスコアは8.1と報じられた。影響を受けるのはmusl Cライブラリを使うLinuxでPAMが無効な構成で、代表例がAlpine LinuxのデフォルトのOpenSSHサーバだ。\n\n詳細\n仕組みは古い挙動の組み合わせだ。muslのcryptは入力が256バイトを超えるとエラーとして単一のアスタリスク「*」を返す。一方、パスワードでログインできない口座はパスワード欄に「*」が記録されている。攻撃者が257バイトから1024バイトの長いパスワードを送ると、ハッシュ処理の失敗結果である「*」と口座側の「*」が一致し、sshdがログインを許可してしまう。根本には2016年のユーザ名列挙対策CVE-2016-6210へのパッチが関係すると説明される。発見者はWakefieldのÖzgün Kültekin氏とされ、OpenSSHは同日に修正版10.6p2を出した。Dropbearやglibc系ディストリビューション、PAMを使う構成は影響を受けないとされる。\n\nなぜ注目か\n脅威インテリジェンス企業Previdianの報告として、CVE公開から9時間未満で最初の悪用試行が観測され、AlpineとOpenSSHを動かすハニーポットでroot取得が確認されたとThe Hacker Newsが伝えた。対象条件が限られるとはいえ、コンテナで広く使われるAlpineが含まれるため、実務への波及が大きい話題になった。\n\nポイント・注意点\n対策はOpenSSH 10.6p2またはディストリビューションの修正済みパッケージへ更新し、sshdを再起動することだ。あわせて、ログインすべきでない口座への成功ログインがログにないか確認したい。悪用確認はPrevidian側の観測として報じられたもので、すべての環境で被害が出たという意味ではない点にも留意が必要だ。", "2026-11-06", "The Hacker News", "https://thehackernews.com/2026/11/hackers-exploited-openssh-sshole-flaw.html"], ["Cloudflareのsecurity-audit-skillが急伸 — エージェントを監査役にし、別エージェントに反証させる6段階監査", "Cloudflareのsecurity-audit-skillがGitHubトレンド上位に躍り出た。コーディングエージェントへ入れるスキルで、コードベースの構造と信頼境界を地図化し、孤立したハンター役エージェントに候補を探させ、見つけた側とは別の検証役に反証を試させてから報告に載せる。11月5日窓のトレンドでは3位に入り、エージェント時代の監査の型として注目された。", "概要\ncloudflare/security-audit-skillは、コーディングエージェントをセキュリティ監査役に変えるスキルで、2026年11月5日のスター増加窓を集計したGhTrendsの11月6日版で3位に登場し、その後もトレンド上位に残った。\n\n詳細\n仕組みは段階化された監査手順だ。まず対象コードベースのアーキテクチャと信頼境界を地図化し、カバーできていない領域へ、互いに孤立したハンター役のサブエージェントを送って脆弱性候補を探させる。候補はそのまま報告にはならず、新しい検証役のエージェントが渡され、反証を試みる。反証を乗り越えたものだけが報告へ進むという流れが紹介されている。GhTrendsの説明では、スキルとしてインストールして使う形が示され、エージェント自身に監査の作法を持たせる点が特徴だ。同じ時期の解説でも、見つけた本人に自分の発見を採点させると自信過剰に正当化しやすいため、検証者を分ける設計が核だと整理されている。Cloudflare自身の脆弱性発見ハーネスの種になったスキルだと紹介する記事もある。\n\nなぜ注目か\nエージェントが大量のコードを書くようになると、レビューやセキュリティ監査も同じ速度で回す必要が出る。しかし単一エージェントの自己申告的な監査では、誤検出も見逃しも検証できない。このプロジェクトが示した「発見と検証を分ける」型は、監査に限らずエージェントの成果物チェック全般に応用できる考え方として受け止められた。\n\nポイント・注意点\n1回の実行で見つかるのは、複数回で見つかる不具合の一部にとどまるというCloudflare側の説明を紹介する記事もあり、単発の監査で安全と断言はできない。実行コストも論点で、クイックモードでも通常の単一エージェントより高くついたという体験談が紹介されている。報告は人間のレビュアーが確認する前提で、 leadsとして扱うのが現実的だ。\n\n補足\nこのスキルはコードを直接書き換えるのではなく、読み取りを中心に監査を進め、構造化された記録として結果を残す考え方でも注目された。形式が決まった記録が残れば、後から別の担当者や別のエージェントが同じ候補を再検証しやすくなり、監査の再現性を高める効果も期待できる。", "2026-11-06", "GhTrends.dev", "https://www.ghtrends.dev/daily/2026-11-06/"], ["GitHub、Gitストレージを再設計「Rubicon」— 1リポジトリに5000エージェント、毎秒7200プッシュ", "GitHubが新しいGitストレージ基盤Project Rubiconを発表した。内部テストでは1リポジトリに5000の同時エージェント、毎秒7200プッシュを処理しつつ読み取り遅延を低く保ったという。パックをAzure Blob Storageへ、参照更新を小さなCASログへ分ける設計が核で、限定プレビュー中だ。エージェントが24時間書き続ける前提でGitの土台を作り替える動きとして、HNでも大きな関心を集めた発表だ。", "概要\nGitHubは2026年11月5日のエンジニアリングブログで、新しいGitストレージアーキテクチャを解説した。GitHub Universeで発表されたこの基盤は、内部テストで1つのリポジトリに対して5000の同時エージェントが作業し、毎秒7200回のプッシュを送っても、読み取りを一貫して低遅延で処理できたという。\n\n詳細\n開発コード名は「Project Rubicon」で、2026年5月に初期のAzure移行の直後から設計が始まったとされる。原則は「協調を最小化する」と「ストレージとコンピュートを分離する」の2つだ。不変なGitオブジェクトやパック、読み取りを速くするデータはAzure Blob Storageに置き、ブランチなどの参照更新だけを比較交換型の小さなサービスRef-CASで順序付ける。GitHubによれば、あるリポジトリのトラフィックは3月から5月にかけて約4倍に増え、エージェントが24時間並行して書くようになると、短いバーストが持続的な負荷になると見込んでいる。基盤自体はGitHubを動かし続けながらその下で構築されてきた。\n\nなぜ注目か\n従来のGitサーバ設計は人間が順番にプッシュする前提に近かった。エージェントが大量にブランチを作り、コミットし、取得する時代になると、書き込み競合そのものがボトルネックになる。ストレージ側で毎秒7200プッシュ級を捌けるかどうかは、今後の大規模なエージェント開発を支える土台の条件になるため、HNでも大きな関心を集めた。\n\nポイント・注意点\n数値はGitHub自身の内部テストであり、全リポジトリでの実測値ではない。提供形態は限定されたプライベートプレビューで、より広い展開は来年初めとされる。ストレージが高速化しても、5000エージェントの成果物をどうレビューし統合するかという協調や品質の問題は別に残る点も、解説記事では指摘されている。\n\n補足\nGitHubの3部作のブログでは、今回の設計が前段のAzure移行と橋渡し施策の上に成り立つことも説明されている。99.99999％のリポジトリをAzureへ移したという前段の記述もあり、単発の高速化ではなく移行全体の到達点としてRubiconが位置付けられている点も押さえておきたい。", "2026-11-05", "GitHub Blog", "https://github.blog/engineering/architecture-optimization/inside-githubs-new-git-storage-architecture/"], ["GitHub、新しいプルリクエスト概要ページを公開プレビュー — マージ可否が最上部に集約", "GitHubが11月5日、プルリクエストの新しいOverviewページをオプトインの公開プレビューとして出した。マージ可否や次の操作を最上部のコンパクトな準備状況サマリーにまとめ、従来のマージボックスを半分以下のスペースに圧縮。未解決コメントの絞り込みや新着順並び替えも加わり、HNで175ポイントを集めた。長年ほぼ固定だったレビュー画面の刷新だけに、チームの日常ワークフローへの影響を見極めようとする声が多い。", "概要\nGitHubは2026年11月5日のChangelogで、プルリクエストの新しいOverviewページを公開プレビューとして発表した。オプトイン方式で、週末を通じて展開が続くとされ、プルリクエストのヘッダーにあるボタンから試し、従来表示にも戻せる。HNでは175ポイント、122コメントを集めた。\n\n詳細\n最大の変更は情報の置き場所だ。従来はコメントスレッドの下にあったマージボックスを探す必要があったが、新ページではマージ状態と次に取れる操作を最上部に「準備状況」の要約として表示する。チェック結果、必要なレビュー、承認やコメントの状況が半分以下のスペースに収まる設計だ。あわせて未解決の会話だけ、自分宛てのコメントだけといった絞り込み、最新順の並び替え、右上のアクティビティ要約が加わった。ドラフトを準備完了にする操作やプルリクエストを閉じる操作もヘッダー側へ移されている。GitHub自身、このプレビューは完成形ではなく出発点だと位置付け、Community Discussionでフィードバックを募っている。\n\nなぜ注目か\nプルリクエスト画面は多くのチームが毎日使う中心的な作業画面であり、その小さな使い勝手の差がレビュー速度に積み重なる。エージェントが作るプルリクエストが増える中で、レビュアーが「何が足りないか」を一目で把握できるかどうかは、生成量の増加を受け止めるための実務的な課題になっている。\n\nポイント・注意点\nプレビュー期間中は表示や挙動が変わる可能性がある。一般提供の時期や、デフォルト化の計画はChangelogでは示されていない。対象プランやGitHub Enterprise Serverでの扱いも明記されていないため、チームで試す場合はまず小規模に有効化し、従来表示への戻し方も含めて運用を確認したい。\n\n補足\n同じ11月5日には、Copilotの利用指標APIの更新など周辺のChangelogも出ていたが、レビュアーの体験を直接変えるという点でこの概要ページが最も注目された。まずは自分のチームの長いプルリクエストで、未解決コメントへの移動がどれだけ速くなるかを試すのが現実的な評価方法になる。", "2026-11-05", "GitHub Changelog", "https://github.blog/changelog/2026-11-05-new-pull-request-overview-page-in-public-preview/"], ["Claude CodeがメールアドレスをUser-Agentに載せて送信 — GitHub issueが1531ポイントの大論争に", "Claude Codeがサインイン中のアカウントのメールアドレスをWeb検索時のHTTPリクエストのUser-Agentに含めていたというGitHub issueが、HNで1531ポイントを集めた。Anthropicのエンジニアが経緯を認め、来週前半のリリースで文脈からメールを外すと説明。cc-plugin-privacyによる遮断策も示された。公開issueで逆転するまで止まらなかった経緯も含め、優先順位が問われた。", "概要\n2026年11月5日に開かれたClaude CodeのGitHub issue #107757は、サインイン中のユーザーのアカウントメールアドレスが、Web検索などで行うHTTPリクエストのUser-Agentヘッダーに入っていたと報告した。この話題はHacker Newsで1531ポイント、482コメントに達し、11月6日のフロントページ最大級の議論になった。報告者は迷惑メールが増えた影響にも触れ、設定で済む問題ではないと訴えた。issueには678件のサムズアップ反応が集まったとされる。\n\n詳細\nAnthropicのエンジニアlydia_hallie氏がスレッドで経緯を確認した。利用者から、Claudeが@authorタグのような名前を幻覚するという声があり、サインイン中のユーザー向けにアカウントメールをモデルの文脈へ追加したところ、モデルがそれを外部リクエストに載せるコマンドを書くようになったという説明だ。同氏は来週前半のリリースでアカウントメールを文脈から外すと述べた。別の社員は、2.1.317で入った組み込みの仕組みcc-plugin-privacyでこの挙動を決定的に止められると案内した。一方で、SECのdata.sec.gov APIのようにUser-Agentにメールアドレスを要求する外部仕様もあり、一部は第三者の要求に応じた結果だという指摘もスレッドで出た。5月にもissue #55743で、メールが自動注入されオプトアウトできない問題が報告されていたとされる。\n\nなぜ注目か\nコーディングエージェントは開発者の権限で外部サイトへアクセスするため、その送信ヘッダーに個人情報が含まれるかどうかは単なる表示バグでは済まない。利便性のために文脈へ入れた情報が、モデル経由で外部へ漏れるという構図は、他のエージェント製品にも共通する設計上の教訓として受け止められた。\n\nポイント・注意点\n報告内容とHNの見出しをそのまま同一視せず、どのリクエストで何が送られたかはissueの記述範囲で理解する必要がある。利用者は修正リリースを待ちつつ、提供された遮断策の適用を検討したい。企業利用では、エージェントが外部へ送るヘッダーや文脈情報を監査対象に含めることが重要になる。", "2026-11-05", "Duk Lee HN Roundup", "https://duklee.net/blog/2026-11-06-hn-frontpage-roundup/"], ["PostmanがClaude CodeとCodexへプラグインを無断自動インストール — HNで978ポイント、撤回へ", "Postmanデスクトップを開いただけで、Claude CodeやCodexにPostmanプラグインや起動フック、リモートMCPサーバが自動で入っていたというGitHub issueがHNを騒がせた。自分のフックを自分で信頼済みにする処理まで含まれ、Postman側は11月5日に変更の巻き戻しと再設計を表明したと報じられた。他ツールの設定を書き換える自動化の是非が、開発者の間で大きな論点になった。", "概要\nPostmanデスクトップアプリが、利用者の同意なくClaude CodeやCodexへ自社プラグインを自動インストールしていたという報告が、Hacker Newsのフロントページで978ポイント級の話題になった。元のGitHub issueは2026年10月25日に開かれ、11月3日にHNで急拡大した。\n\n詳細\n報告者が使っていたのはMac版Postman 12.33.4で、Postman自身のログにauto-existing-upgradeをソースとするインストール記録と、claude-code:installed、codex:installedという結果が残っていたという。実際にはCodex側では~/.codex/config.tomlにプラグインマーケットプレイスとプラグイン、セッション開始フックとその信頼記録が追加され、Claude Code側ではユーザースコープで有効になるプラグインが入った。リモートMCPサーバmcp.postman.comも設定されたが、ログインが必要で起動時に失敗したとされる。別の利用者も11月3日に同様のログを報告した。解説記事によれば、Postman側の担当者は11月5日に、エージェント設定を簡単にする狙いだったが伝え方が不十分だったとして、この変更を巻き戻し、適切な制御を入れて再設計すると述べ、issueは同日に閉じられてロックされた。\n\nなぜ注目か\n問題はプラグインの機能そのものより、あるアプリが別のツールのグローバル設定を書き換え、起動時の指示まで追加し、しかもそのフックの信頼判定まで自動化した点にある。エージェントがファイルや認証情報に触れる時代には、ツールをまたぐ自動設定がサプライチェーン上のリスクになることが、具体例として示された。\n\nポイント・注意点\n元の報告者自身、データの外部送信が立証されたとは主張していない点は重要だ。HNの見出しにある「全APIデータを共有しようとする」という表現は、issueの主張より強い。心当たりがある利用者は、CodexやClaude Codeの設定ファイルにPostman関連の記述が残っていないか確認し、公式の削除手順がある場合はそれに従うのが確実だ。", "2026-11-03", "Hacker News Daily", "https://hn.hellmo.de/en/posts/2026/11/2026-11-03/"], ["18年分のHNリンクが示すGitHubの主役交代 — 2026年最多はclaude-code", "Novian Worksのブログ（11月2日）は、2008年以降のHacker Newsの投稿とコメントに含まれるGitHubリンクをすべて数えた分析です。対象は384,444件のリンク、44,192リポジトリで、リンクの77%は投稿ではなくコメントの中にありました。2026年の最多はanthropics/claude-codeの429件。上位10件のうち7件がコーディングエージェントやLLMツールで、開発者の関心の移動が数字で示されています。", "Novian Worksのブログ（11月2日）は、2008年以降のHacker Newsの投稿とコメントに含まれるGitHubリンクをすべて数えた分析です。結果は「Hacker GitHub」として年別・言語別に公開されています。\n\n方法は明快です。データはHNの公開ClickHouseプレイグラウンドのライブコピーで、スター数や言語、改名情報はGitHub APIから取得しています。投稿・コメントごとに1回まで数え、改名は現在の名前に統合し、対象は3回以上リンクされたリポジトリです。総計384,444件のリンク、44,192リポジトリ。リンクの77%は投稿ではなくコメントの中にあり、HNのGitHub談義の多くはスレッド内で互いにものを指し示す行為だということです。\n\n年別最多リンクの変遷が、関心の移り変わりを物語ります。2008〜2010年はhomoiconic、2011年はCoffeeScript、2012年はRails、2014年と2020年はRustが首位でした。2016年以降はGoが強く、直近11年のうち8年で最多を取りました。2023年にllama.cppが316件で年間最多を更新し、2026年はanthropics/claude-codeが429件で首位に立っています。2026年の上位10件中7件はコーディングエージェントやLLMツール（claude-code、Codex、llama.cpp、opencode、pi、OpenClaw、ds4）で、Goは65件と2014年以来の少なさでした。\n\n2010年に22.5%を占めたRubyは今年0.8%、JavaScriptは2012年の22%から5.1%へ下がりました。RustとTypeScriptは、ほぼゼロから各約15%へ伸びています。なお言語は「現在の主言語」で判定されるため、microsoft/TypeScriptがGoと数えられる歪みには注意が必要です。\n\nもう一つの発見は「隠れた宝石」です。多くの人にリンクされるのにスターの少ないリポジトリは、コードではなく文書が中心でした。Mozillaの立場文書、RustのRFC、GitHubのDMCAリポジトリなどです。人は議論の証拠としてそれらをリンクしますが、証拠はスターされない。関心の中心の移動が、数字で裏づけられた分析です。", "2026-11-02", "Novian Works", "https://novian.works/github-links-on-hn.html"], ["GitHub Actions、pull_request_targetを12月2日から公開リポジトリで既定ブロック — 11月9日と16日にリハーサル", "GitHubは11月2日、Actionsのpull_request_targetイベントを12月2日から公開リポジトリで既定でブロックすると発表した。明示的なポリシーで許可した場合だけ実行される。本番前に11月9日と16日の16時〜18時（UTC）に2時間ずつのブラウンアウトがあり、対象ワークフローは失敗として表示される。フォーク由来コードの実行リスクを断つ狙いだ。", "概要\nGitHubは2026年11月2日のChangelogで、GitHub Actionsのpull_request_targetイベントを、12月2日から公開リポジトリでは既定でブロックすると発表した。Actionsのイベントポリシーで明示的に許可した場合にだけ実行される。当初11月2日だった適用日は1か月延期され、その代わりに事前のリハーサル期間が設けられた。\n\n詳細\nリハーサルは「ブラウンアウト」と呼ばれ、11月9日と16日のいずれも16時から18時（UTC）に実施される。その時間帯は、既定ルールで止められる実行がエラー注釈付きの失敗ランになり、ワークフローは実行されない。時間帯の前後は評価モードに戻り、実行はされるが警告とインサイトで影響範囲を確認できる。対象はGitHub Free、Team、Enterprise Cloud上の公開リポジトリで、非公開やインターナルなリポジトリ、GitHub Enterprise Serverは対象外だ。既に独自のイベントポリシーを設定している場合は、既定ポリシーがそれを上書きしないと説明される。GitHubはSettingsのActions PoliciesにあるPolicy insightsで、止められるはずの実行を事前に確認するよう案内している。\n\nなぜ注目か\npull_request_targetはベースリポジトリ側の文脈で動き、シークレットへのアクセスを伴うため、フォークから取得したコードをそのまま実行すると「pwn request」と呼ばれる権限奪取につながり得る。便利な自動化を支えてきた仕組みだけに、既定ブロックは多くの公開リポジトリのCI運用に直接影響する変更として、開発者ブログで繰り返し取り上げられた。\n\nポイント・注意点\nトリガー自体が脆弱性なのではなく、フォークのコードをチェックアウトして実行する使い方が危険だという整理が重要だ。対象リポジトリの管理者は、ブラウンアウト前にpull_request_targetを使うワークフローを棚卸しし、本当に必要なものだけをワークフロー単位で許可する形へ見直したい。", "2026-11-02", "500x Engineer Blog", "https://www.500xengineer.com/blog/github-actions-block/"], ["claude-mem、インストーラが30日分のプロンプトを無断アップロードしていたと自ら公表 — 11月2日に同意画面で修正", "Claude Code向けの記憶プラグインclaude-memがGitHubトレンド1位に返り咲いた理由は、機能追加ではなくプライバシー修正だった。ブラウザ設定経由の新規インストールで、過去30日分のプロンプト全文やセッションID、パス、時刻が同意なくcmem.aiへ送られていたとリリースノートが認め、v15.8.3で同意画面を追加した。既に送られた分はこの更新では削除されないという。", "概要\nthedotmack/claude-memは、コーディングエージェントのセッションをまたぐ記憶を提供するプラグインで、2026年11月2日のGitHubトレンドで1位に挙がった。ただし注目理由は新機能ではなく、同日出たv15.8.3のプライバシー修正だった。\n\n詳細\nプロジェクト自身のリリースノートや関連PRによれば、ブラウザ設定を使う新規インストールでは、v15.2.0以降、ローカルのエージェント履歴を走査し、過去30日分のプロンプト全文を、セッションID、プロジェクト名、フォルダパス、タイムスタンプとともにcmem.aiへ、尋ねることなくアップロードしていた。対象期間は10月25日から11月2日までとされる。修正では走査をローカルだけに留め、「同意待ち」の段階で止めて、利用者が選んだツール分だけを送る同意パネルを追加した。送られる内容や第三者のモデル事業者による処理についても画面で明示されるようになったという。一方で、既にアップロードされたプロンプトはこの更新では取り除かれないとリリースノートは述べている。claude-mem自体は、フックでツールの利用を記録し、小さなモデルで要約を作り、SQLiteとベクトル検索に保存して次のセッションへ渡す仕組みだ。\n\nなぜ注目か\n記憶系ツールは開発の文脈を広く集めるほど便利になる一方で、その文脈には秘密情報や社内パスが混ざりやすい。人気プラグインが自らの設定フローを問題として公表し、修正した経緯は、エージェント周辺ツールの同意設計を考える具体例として大きく拡散した。\n\nポイント・注意点\n該当期間にブラウザ設定でインストールした利用者は、自分の履歴が送られた前提で影響を考えるべきだと解説は述べる。テレメトリが既定で有効だという指摘もあるため、試す場合でも無効化手順やローカル完結の設定を確認したい。再配布された非公式コピーにはマルウェアの恐れがあるというREADMEの警告もあり、入手先は公式リポジトリに限ることが大切だ。公式の説明をよく読み、同意の範囲を自分で選ぶ姿勢が求められる。", "2026-11-02", "Luongnv GitHub Trending Digest", "https://luongnv.com/news/trending/reports/2026-11-02.html"], ["Octoverse 2026 — プッシュ179億回、9月はPRの4割超がエージェント発、GitHubが年次報告", "GitHubの年次報告Octoverse 2026が10月28日に公開された。過去12か月のプッシュは179億回で2024年と2025年の合計を上回り、コミットは343億回に達した。9月にはプルリクエストの40％超がエージェントから始まり、その数は約1億1000万件。エージェント設定ファイルのある新規リポジトリは、ない場合の平均の8倍のコミットを記録したという。", "概要\nGitHubは2026年10月28日、年次報告「Octoverse 2026」を公開した。対象期間は2025年10月1日から2026年9月30日までで、開発者がコードをプッシュした回数は179億回と、2024年と2025年を合わせた数より多かった。コミットは343億回、マージされたプルリクエストは13億回、平均すると1日350万件に達したとされる。\n\n詳細\n今年の中心テーマはエージェントだ。9月時点で、プルリクエストの40％超がエージェントから始まっており、3月の17％から大きく伸びた。絶対数では9月だけで約1億1000万件のエージェント発プルリクエストがあったとGitHubは数える。今年作られたリポジトリに限ると、エージェント設定ファイルを持つリポジトリの平均コミット数は、持たないリポジトリの約8倍だった。GitHub Actionsのジョブは毎秒1440回、1日では1億2400万回実行された計算になる。公開コントリビューションも25億件と前年の11億2000万件から倍増した。モデル利用では、9月にCopilot利用者の61％が複数のモデルを使い分けていたという。\n\nなぜ注目か\nこれらの数字は、エージェントが実験的な補助から日常的なコード生産の主体へ移ったことを、プラットフォーム全体の実測として示している。プッシュやコミットの急増は、レビューやCI、ストレージといった周辺基盤への負荷増にも直結し、GitHub自身が進める基盤再設計の背景にもなっている。\n\nポイント・注意点\nOctoverseの数値はGitHub自身のプラットフォーム計測であり、生産性の実験ではない。エージェントが「始めた」プルリクエストの割合が、そのまま品質やマージ成果を意味するわけでもない。今年の集計は公開と非公開の両方を含むなど、過去年との単純比較には注意が必要だと解説記事も指摘している。\n\n補足\n公開コントリビューションの増加や、モデルを使い分ける利用者の広がりも含めると、変化は量だけでなく働き方の分散にも及んでいる。エージェント設定ファイルの有無でコミット数に大きな差が出たというデータは、設定ファイルをコードと同様に管理する文化が広がっていることも示唆している。", "2026-10-28", "GitHub Blog", "https://github.blog/news-insights/octoverse/octoverse-commits-pushes-reach-new-highs-in-2026-as-developers-build-with-agents/"]], "elec": [["AI HAT＋とViamで作る遠隔交通ダッシュボード — ヘッドレス物体検出の手順", "Vinjo Blogが2026年11月8日に公開したガイドは、Raspberry Pi 5とAI HAT+にViamを組み合わせ、USBウェブカメラの映像から車・バス・人を数える遠隔ダッシュボードを作る手順だ。PCIe Gen3の有効化やhailo-allの導入、Viam上でのカメラとvisionサービスの紐付け、1Hzのデータ取得とTeleop画面への時系列表示までを追える。GUIデモで終わらせない常設型の構成が特徴だ。", "概要\nVinjo Blogの2026年11月8日のガイドは、Raspberry Pi 5とRaspberry Pi AI HAT+を使い、Viam経由で遠隔から見られる交通モニタリングダッシュボードを作る手順をまとめたものだ。重い深層学習をPiのCPUで回すと全体の性能が落ちるため、専用ハードウェアへ処理を逃がすのがAI HAT+の役割だと冒頭で位置づけている。標準デモがGUI前提になりがちなのに対し、この作例はヘッドレスで常設するIoT用途を狙い、離れた場所からライブ映像と検出数を眺められる形に仕上げている。\n\n仕組み・手順の詳細\n手順は大きく分けて、Piのセットアップ、ハードウェア設定、Viamでの機器構成、ダッシュボード作成の順に進む。OSはRaspberry Pi Imagerで64ビット版Raspberry Pi OSを入れ、SSHを有効化して遠隔操作できるようにする。次にraspi-configのAdvanced OptionsからPCIe SpeedをGen 3に切り替え、hailo-allを導入して再起動後、hailortcliでHailoデバイスが認識されるか確認する。\n\n必要なもの\nガイドが挙げるのは、無料のViamアカウント、アクティブクーラー付きRaspberry Pi 5、microSDカードと安定した電源、13 TOPS版か26 TOPS版のAI HAT+、そしてUSBウェブカメラだ。13 TOPS版はHailo-8Lで単一モデルの物体検出向け、26 TOPS版はHailo-8で複数モデルの重いパイプラインや高フレームレートの追跡向けと整理されている。AI Kitは一部市場に残るが、今後は統合型のAI HAT+へ置き換わったという注意書きもある。\n\n実践のポイント・注意点\n記事が強調するのはPCIe Gen 3の有効化で、既定のGen 2では高解像度映像のパイプラインが帯域で詰まる恐れがあるという。通電前に公式ドキュメント通りにAI HAT+をPi 5へ重ねることも前提だ。発展先として、交通量に応じてGPIOのLEDを光らせるスマートシティ風の制御、Home Assistantと連携した照明や車庫アラート、ローバーへの搭載などが挙げられている。", "2026-11-08", "Vinjo Blog", "https://blog.vinjo.co.in/blog/2026-10-02-how-to-use-the-raspberry-pi-ai-hat-for-real-time-object-detection-5-steps-with-pictures-instructables"], ["Arduino_RouterBridge_ROS公開 — UNO Q／VENTUNO QでROS 2ノードをスケッチに書く", "Arduino公式ブログが2026年11月6日に紹介したArduino_RouterBridge_ROSは、VENTUNO QやUNO Qのマイコン側から直接ROS 2グラフへ参加できるオープンソースライブラリだ。土台のRouterBridgeはMsgPackRPCでLinux側とZephyr側が互いの関数を呼び合う仕組みで、その上にros2ino名前空間でrclcpp風に書ける軽量プロキシを載せた。IMUを／imu／dataへ流すような例も示されている。", "概要\nArduino公式ブログの2026年11月6日の記事は、ROSCon Global 2026のトロント会場と11月3日のROSCon Italyで披露された新しいオープンソースツールを紹介している。その名はArduino_RouterBridge_ROSで、Arduino VENTUNO Qの2つの頭脳、すなわちLinuxが動くMPUとリアルタイムなマイコンを、まとめてROS 2へつなぐために作られた。従来のロボットでは高性能コンピュータがナビゲーションや地図生成を担い、外部マイコンがGPIOやセンサー、モーターを受け持つ分業が当たり前で、その間を自作シリアルプロトコルや専用ドライバでつなぐ苦労があった。\n\n仕組み・手順の詳細\n土台にあるArduino_RouterBridgeはMsgPackRPCの上に作られたRPCプロトコルで、Linux側のPythonとZephyrベースのArduinoスケッチ側が、Bridge.provideで呼び出し可能な関数を登録し、Bridge.callで相手側の関数を起動するという2つの方法で互いにコードを実行し合う。これにより自作のシリアル解析コードを書かずに、同じスレッドで動いているかのように境界を越えて関数を呼べる。\n\n必要なもの\n対象はLinux対応MPUとリアルタイムマイコンを同居させたVENTUNO Qで、入門ガイドとしてはGetting Started with ROS 2 on UNO QとFirst ROS 2 Project on UNO Qの2本がドキュメントに用意されている。ライブラリはRouterBridgeのトランスポートに依存するため、Linux側でどのROSミドルウェアベンダーを使うかには依存しないというRMW非依存の設計も特徴だ。リポジトリとドキュメントは公開されており、まずは公式ガイドに沿ってボード側の環境を整える進め方になる。\n\n実践のポイント・注意点\n具体例として公式が挙げるのは、IMUのテレメトリをそのまま／imu／dataトピックへ流し込む使い方や、モーター速度指令を／cmd_velで受け取る使い方だ。橋渡し専用のノードを別途立てずに済むため、移動ローバーや精密なロボットアームのような作例で構成要素が減り、開発の焦点を機械そのものへ戻せる。", "2026-11-06", "Arduino Blog", "https://blog.arduino.cc/2026/11/06/unveiled-at-roscon-the-easiest-way-to-bring-arduino-i-o-into-ros-2/"], ["21ドルのWT99P461-S1 — ESP32-P4X＋C61で有線もカメラも全部入り", "CNX Softwareが2026年11月4日に報じたWireless TagのWT99P461-S1は、ESP32-P4XとWi-Fi 6担当のESP32-C61を載せた21ドルの多機能ボードだ。Fast Ethernet、RS485、CAN、MIPI CSI／DSI、マイクとスピーカー端子、microSDまで備え、ESP-Brookesiaのスマホ風UIとAIビジョンデモがプリロードされる。7インチ画面付きキットは42.50ドルと伝えられている。", "概要\nCNX Softwareの2026年11月4日の記事は、Wireless TagのWT99P461-S1を紹介している。6月に登場したESP32P4C61-TINYと同じWT01P461-S1モジュールが土台だが、こちらはフル機能の開発ボードとして仕上げられ、Fast Ethernet、RS-485、CANバス、オンボードマイク、スピーカー端子が加わった。microSDスロットやMIPI DSI／CSIコネクタも備え、産業用HMIやゲートウェイ、制御用途を狙う構成だ。価格はボード単体が21ドル、7インチタッチ画面付きキットが42.50ドルとメーカー直販ページの情報が伝えられている。\n\n仕組み・仕様の詳細\n頭脳はESP32-P4X、つまりESP32-P4のv3.2チップで、AI命令拡張と単精度FPUを持つデュアルコアRISC-Vが360／400MHzで動き、低消費電力コアも別に備える。2Dピクセル処理アクセラレータやH.264とJPEGのコーデック対応、32MBのPSRAMと16MBのNORフラッシュもモジュール側に含まれる。無線はESP32-C61が担い、2.4GHzのWi-Fi 6とBluetooth 5を受け持つ。\n\n必要なもの・ソフトウェア\n出荷時ファームウェアにはESP-Brookesiaフレームワークによるスマートフォン風UIが入り、数種のアプリとAIビジョンデモ、7インチタッチ画面対応、MP3再生、MJPEG再生、EthernetとWi-Fi／BLE接続、SC2336カメラ対応などが含まれるという。ただしH.264再生はまだ未対応と明記されている。自作ファームウェアの書き込み手順はWikiに案内があり、ESP32-P4とESP32-C61の両チップへ書き込む必要がある点に注意したい。\n\n実践のポイント・注意点\n製品ページではモジュールがP4Xなのか旧P4なのか曖昧だったが、CNX Softwareがメールで確認し、新しいESP32-P4 V3.2チップセットであることが確かめられたという経緯も記事は伝えている。メーカーのGitHubでは型番で検索しても有用な結果が得られなかったとも書かれており、資料の手薄さは覚悟したい。それでも有線LANとRS485、CANを最初から備える点は、Piで周辺を足し続ける構成と比べたときの有力な代替になる。", "2026-11-04", "CNX Software", "https://www.cnx-software.com/2026/11/04/21-esp32-p4x-and-esp32-c61-full-featured-board-offers-ethernet-wifi-6-rs485-can-bus-mipi-csi-dsi-and-more/"], ["センサーデータはPandasで磨いてからAIへ — Pi向け温度解析パイプライン", "2026年11月3日のTech-Readerの実践記事は、欠損や不正な時刻を含む温度CSVをPandasで整えてからAIに渡す流れをコード付きで示す。pd.to_datetimeやto_numericで変換に失敗した行を落とし、重複除去と範囲チェック、並べ替えを経てCSVとJSONに保存。その後OpenRouterの無料ルーター経由でモデルに傾向だけを説明させる。汚いデータをAIに丸投げしない分担が学べる。", "概要\nTech-Reader Blogの2026年11月3日の記事は、Raspberry Piで集めたセンサーデータをAIに分析させる前段の整え方を、温度データを例に段階的に示している。パイプラインは、汚れたCSVからPandasで整形し、きれいなCSVとJSONを保存し、最後にAI APIへ送って解釈させるという流れだ。重要なのは、壊れたデータの修復をAIに頼まないことにある。予測可能な整形は通常のコードが担い、曖昧な傾向の読み取りだけをモデルに任せるという分担が、記事全体を貫く設計思想になっている。\n\n仕組み・手順の詳細\n題材のCSVには欠けた温度値とwrong_timeという不正なタイムスタンプが混ざっている。コードではpd.to_datetimeとpd.to_numericにerrorsパラメータで強制変換を使い、変換できない行をdropnaで落とす。続いて重複を除き、温度が40〜120の範囲にある行だけを残し、時刻順に並べ替えてからクリーンなCSVと、records形式でISO日時のJSONを書き出す。AI側はOpenRouterのFree Models Routerを使い、環境変数に置いたAPIキーでリクエストを送る。openrouter/freeは固定の1モデルではなく、利用可能な無料モデルへ振り分けるルーターである点も説明されている。プロンプトでは測定値を捏造しないこと、データにない原因を invent しないことを明示している。\n\n必要なもの\n実行環境はPythonとPandas、そしてAI呼び出し用のRequestsライブラリだ。記事ではpipでrequestsを入れる手順と、OPENROUTER_API_KEYを環境変数に設定する形が示されている。入力はtimestampとtempの2列を持つroom_temperature.csvで、出力として整形済みCSVとJSONが得られる。Raspberry Pi本体でセンサーを読む部分はこの記事の範囲外で、集めた後の処理に焦点が絞られている。\n\n実践のポイント・注意点\n整形後の例では保持された観測値が71.8度から75.8度へ上昇しており、モデルはその系列を短い自然言語の評価に変換する。ここで効くのは、検証をコード側で済ませてからモデルに渡す順序だ。", "2026-11-03", "Tech-Reader Blog", "https://www.tech-reader.blog/2026/11/from-raspberry-pi-sensor-data-to-ai.html"], ["AI HAT+ 2のVLMでSDRウォーターフォールを読む — FFTで裏を取る実験", "Radio Hackersの2026年11月3日の記事は、Raspberry Pi AI HAT+ 2のローカル視覚言語モデルにSDRのウォーターフォール画像を説明させ、主張を実測FFTデータで検証する実験を論じる。狭い連続信号や周期的なバーストの描写は役立つが、画像だけからWi-FiやBluetoothと断定させると根拠のない自信ある答えが返るという。VLMを真実の源にしない設計が主題だ。", "概要\nRadio Hackersの2026年11月3日の記事は、少し変わった実験を取り上げている。Raspberry Pi AI HAT+ 2がローカルの視覚言語モデル、いわゆるVLMを動かせることを利用し、ソフトウェア無線＝SDRのウォーターフォール画像をモデルに説明させ、その主張の一つひとつを実測したFFTデータで裏取りするという試みだ。結論は明快で、モデルを真実の源にしてはいけない、という条件付きでの肯定である。40 TOPS級のローカル推論が身近になったからこそ生まれた、検証の設計そのものを問う記事になっている。\n\n仕組み・論点の詳細\nVLMが得意なのは全体の様子の描写だという。上部に狭い連続信号がある、短いバーストが一定間隔で繰り返している、広い帯域が活発になった、といった言い方は役に立つ。一方で危ういのは、色のついたピクセルから電波そのものの証拠を導くことだ。ウォーターフォールは既に解釈の産物で、SDRチューナー、ゲイン制御、FFTの窓関数、スケーリング、クリッピング、カラーマップ、画像のリサイズをすべて通過した後の絵に過ぎない。そこからWi-FiやBluetooth、Zigbee、特定の送信機だと断定させると、測定の裏付けがないのに自信満々の答えが返ってくる危険が指摘されている。\n\n必要なもの\n実験の土台はRaspberry PiにAI HAT+ 2を組み合わせ、SDRの隣でローカルVLMを動かせる構成だ。加えて欠かせないのが、モデルの言葉を照合するための実測FFTデータそのものである。つまりハードウェアだけでなく、画像とは独立した測定値を必ず用意し、両者を突き合わせる手順自体がこの作例の部品だと言える。クラウドへ画像を送らず手元で完結する点も、電波観測のような用途では扱いやすさにつながる。\n\n実践のポイント・注意点\n自分のプロジェクトへ持ち込むなら、VLMの出力は仮説生成として扱い、断定は測定値に委ねる分担を最初からコードと運用に埋め込みたい。たとえばモデルの指摘した帯域や時刻だけを抜き出し、FFT側の数値で閾値を超えたかを確認してから記録に残す形だ。逆にモデル単独のラベルをそのままアラート条件にすると、尤もらしい誤報を量産しかねない。", "2026-11-03", "Radio Hackers", "https://radiohackers.com/can-a-raspberry-pi-ai-hat-2-read-an-sdr-waterfall-without-hallucinating-79c38e8e59d8?gi=640632282351"], ["スタックちゃん×Hermes Agent — 声はPhonon、無音窓の調整が効いた作例", "RobotUseCasesのスタックちゃんガイドは2026年11月3日にM5StackストアでM5StackChan（K151）が99ドルであることを確認し、Chromeからファームウェアを書き込んでMODを入れる最短手順をまとめた。加えて10月の作例として、Nous Researchのhermes-agentをStackChanで動かし、音声をGradiumのPhononが担う動画も紹介。無音判定を0.02秒から延ばしたら応答が化けたという調整談も載る。", "概要\nRobotUseCasesのスタックちゃん製作ガイドは、顔とサーボとJavaScriptのMODで遊べるオープンソースのM5Stack卓上ロボットを、最短で動かすための道筋を整理している。組み立て済みのM5StackChan、型番K151はM5Stackストアで99ドルと、2026年11月3日時点で確認されている。手順はChromeからファームウェアを書き込み、MODを入れるだけという手軽さで、ガイドはまずこの完成品ルートを勧めている。一方で自分で組む道も残されており、M5Stack CoreS3とサーボでケースガイドに沿って作る方法も併記されている。\n\n仕組み・手順の詳細\nブラウザ側のツールでUSB経由のファームウェア書き込み、BLE経由の設定変更、ギャラリーからのMOD導入が行えるため、標準基板ならModdable SDKやESP-IDFを用意しなくてよい点が手軽さの理由だ。プロジェクトのREADMEではM5StackChanのCoreS3構成が標準構成とされ、実機でのリリース検証にも使われているという。注意点として、このファームウェアを書くとM5Stackの工場出荷ビルドは置き換わり、復元はM5Burnerに関するメーカー文書をたどる形になる。ジョイスティックリモコンは任意の追加要素とされている。\n\n必要なもの\n最短ルートで必要なのはM5StackChan AI Desktop Robotキットそのものだ。自作ルートを選ぶ場合はM5Stack CoreS3とサーボ類が要る。あとはChromeかEdgeでWebファームウェアインストーラーを開き、M5StackChan CoreS3を選んで書き込み、ギャラリーのMODを試すところから始めるようガイドは案内している。GitHubのstack-chan／stack-chanリポジトリは2026年11月5日に最終コミットがあり、スター数は1,847と活発な状態が記録されている。\n\n実践のポイント・注意点\nガイドの後半では2026年10月の新しい作例も拾われている。投稿者のAlex C.氏が、Nous Researchのhermes-agentをStackChan上で動かし、音声をGradiumのPhononに担わせた動画だ。", "2026-11-03", "RobotUseCases", "https://robotusecases.com/u/stack-chan-m5stack-robot"], ["Raspberry Pi 5 16GBが385ドルに — 公式が値上げと買い方のコツを発表", "Raspberry Pi公式は2026年11月2日、16GB版Raspberry Pi 5を80ドル値上げして385ドルにし、Compute Module 5の16GB版も40ドル上げると発表した。理由は16GB DRAMの代替供給がないことと部品不足の重なりだという。一方で16GB RAM搭載のRaspberry Pi 500+は価格据え置き。公式は必要以上のメモリを買わない工夫や認定販売店での購入も呼びかけている。", "概要\nRaspberry Pi公式ブログは2026年11月2日、一部の16GB製品の値上げを発表した。16GB版Raspberry Pi 5は80ドル上がって385ドルになり、16GB版Raspberry Pi Compute Module 5の各バリエーションは40ドル上がる。更新後のCM5価格は製品ページのプロダクトブリーフで確認できるという。一方、同じ16GB RAMを積むキーボード一体型のRaspberry Pi 500+は価格を据え置く。全製品一律ではなく、影響の大きい高密度メモリ製品に絞った選択的な値上げだと公式は説明している。\n\n仕組み・背景の詳細\n公式が挙げる理由は二つある。第一に16GB DRAMについて代替の供給先がないこと、第二にそれ以外の部品不足も重なっていることだ。公式は過去2年のメモリ価格の急上昇を受けて、これまでも影響の大きい製品で選択的な値上げを行ってきたとし、代替部品の認定を進めて調達の柔軟性を高める努力を続けているとも述べている。今回もその延長線上にある値上げで、メモリ市場の状況は厳しいが最終的には一時的なものだという見方を公式は崩していない。\n\n必要なもの・買い方の要点\nこれから買う人は、まず本当に16GBが必要かを見直したい。公式自ら、低密度のバリエーションや旧モデルをプロジェクトに組み込むこと、アプリケーション側でメモリ使用量を最適化することを勧めている。個人向けにはRaspberry Pi Official Magazineのメモリ活用ガイドや公式フォーラム、法人向けには専用窓口でのメモリ最適化相談も案内されている。また購入先は、公式価格で販売するRaspberry Pi Approved Resellersから選ぶよう強く呼びかけている。\n\n実践のポイント・注意点\nLLMをローカルで動かす用途では大容量メモリが欲しくなるが、価格差が広がった今、8GB以下で足りる構成にできないか、量子化モデルの選定や用途の切り分けで再設計する価値が大きくなった。逆に16GBが必須なら、同じ16GBを積みながら据え置きとなった500+との価格差も比較対象になる。公式はメモリ価格が下がれば値上げを巻き戻したいとしているが、時期は示されていない。", "2026-11-02", "Raspberry Pi公式ブログ", "https://www.raspberrypi.com/news/price-rises-for-some-16gb-raspberry-pi-products/"], ["Pi 5＋Obsidian＋Qwen3 4B — ノートを検索できる「第二の脳」の作り方", "How-To Geekが2026年11月2日に紹介した作例は、Raspberry Pi 5にObsidianのVaultを同期し、ローカルモデルのQwen3 4B Instruct 2507で検索できるようにしたものだ。Pi上でCouchDBをDockerで動かしてLiveSyncの受け先にし、ヘッドレス同期でMarkdown化、Open WebUIから質問する。クラウド課金なしで自分のノートだけをAIに探させる構成が丁寧に解説されている。", "概要\nHow-To Geekの2026年11月2日の記事は、筆者が長年書きためたObsidianのノートを、どの端末からでもAIに検索させられるようにしたRaspberry Piプロジェクトを紹介している。使うのはPiと小さなローカルモデル、そして同期されたObsidian Vaultだけだ。サブスクリプションもクラウドAIも使わず、Pi 5が自分のノートの置き場所を覚えている、というのが全体のコンセプトである。筆者自身のコードはGitHubで公開され、構築で苦労した数時間分を他の人が省略できるようになっている。\n\n仕組み・手順の詳細\n同期の土台はオープンソースのLiveSyncプラグインだ。まずPi上でDockerを使ってCouchDBを動かし、LiveSyncサーバーの受け先にする。ただしそのままではノートは暗号化された塊で読めないため、Pi上でヘッドレス版のObsidian LiveSyncも動かし、人間が読めるMarkdownファイルとして同期する。こうしてローカルAIがファイルを直接たどれる状態になる。AI側はQwen3 4B Instruct 2507をOllamaやllama.cpp、AI HAT+ 2がある場合はhailo-ollama経由で起動し、Open WebUIをチャット画面にしてVault内を検索する。バックアップにはDuplicatiで暗号化した塊をGoogle Driveへ送る構成も併用している。\n\n必要なもの\n中心はRaspberry Pi 5で、記事はローカルモデルの実行は実質Pi 5でないと速度的に厳しいとしている。任意でAI HAT+ 2を足すと同モデルをより快適に動かせるという。ソフトウェアはObsidianとLiveSyncプラグイン、Docker上のCouchDB、Ollamaまたはllama.cpp、そしてOpen WebUIが柱になる。iPadやChromebook、スマートフォンなど執筆側の端末は、Piへ同期さえ戻れば何でもよいという設計だ。\n\n実践のポイント・注意点\n小さいモデルはツール呼び出しを素直に守らせるまで調整が必要で、筆者も最適なモデル探しと動作確認に数時間をかけたという。幻覚も起こしやすいため、プロンプトで縛りながら何度かテストして期待通りに動くか確かめることが勧められている。", "2026-11-02", "How-To Geek", "https://www.howtogeek.com/this-raspberry-pi-ai-project-turned-my-notes-into-a-searchable-second-brain/"], ["LFM3は1.7BでPi 5で動く — 9B級を上回るエージェント性能の報告", "Liquid AIのLFM3を紹介する2026年11月2日の解説は、1.7BパラメータながらWebArenaやAutomationBenchでQwen 3.5-9Bを上回ったと伝える。Raspberry Pi 5を含む14種のハードウェアで検証され、128Kトークン時のKVキャッシュは1.6GBと小さい。テキスト・視覚・音声など6種のモデル群があり、重みはHugging Faceで公開されているという。効率重視の小型モデルの現在地が分かる内容だ。", "概要\nNeurosint Blogの2026年11月2日の記事は、MITの研究者らが創業したLiquid AIによる第3世代のLiquid Foundation Models、LFM3を取り上げている。パラメータ数は1.7Bで、比較対象として挙がるQwen 3.5-9Bの約5分の1、Gemma 4-8Bの約6分の1という小ささだ。それでもエージェント系のタスクでは大きなモデルを上回る場面があるとし、大きいことが常に正義ではないという前提を崩す事例として紹介されている。重みはオープンウェイトでHugging Faceから入手できると記事は伝えている。\n\n仕組み・性能の詳細\n記事が挙げるスコアは具体的だ。実WebナビゲーションのWebArenaではLFM3が38.42、Qwen 3.5-9Bが28.94。タスク自動化のAutomationBenchでは41.29対15.10と約3倍、指示追従のIFEvalでは96.66、ツール利用のBFCL V4では71.39で8Bや9B級を上回ったという。一方で一般知識やエージェント型コーディングでは大規模モデルが依然優位とも明記されている。モデル群は同じ1.7B級の土台から、テキスト、視覚、音声、オムニ、視覚ベースの意思決定、オムニ意思決定の6種が用意され、用途ごとに選んで微調整する発想だ。\n\n必要なもの・動作環境\nLiquid AIは14種のハードウェア組み合わせで検証し、その中にRaspberry Pi 5が含まれている。ほかはスマートフォン、Apple M4 MaxやAMD Ryzen AI搭載ノートPC、Armとx86のクラウドCPU、GPU、Qualcomm Hexagon NPUなどだ。メモリ面では128Kトークンの文脈でもKVキャッシュが1.6GBで済み、Qwen 3.5-4Bの4.3GBやMiniCPM5-2Bの5.6GBより小さいとされる。デコード速度も同クラスで最速で、次点の1.8〜2.8倍という数字が示されている。\n\n実践のポイント・注意点\n記事の主張は、受信箱の仕分けやカレンダー管理、Web調査のような日常のエージェント作業なら、ローカルで回る小型モデルで足りる場面が多いという点にある。", "2026-11-02", "Neurosint Blog", "https://www.neurosint.com/en/blog/posts/lfm3-pequeno-pero-costaud.html"], ["M5Stack Chan × Raspberry Pi 5 — 動き回るホームコンパニオン計画", "スタックちゃん（M5Stack Chan／STACK-CHAN）を表情・声・会話の顔役に据え、Raspberry Pi 5とESP32-C3 Mini制御のタンク台車と組み合わせ、家の中を自律移動できる移動コンパニオンを目指すプロジェクトです。設計文書がGitHubで公開されており、Pi 5側は記憶・センサー・視覚・自動化・ローカルモデル実験の中核。現在は文書とハードウェア設計の段階で、移動・対話・LLM会話の各層をつないだ試作が次の目標です。", "概要\nGitHubで公開されているプロジェクト文書の紹介です。AIアシスタントをチャット画面の中だけに置くのではなく、小さな物理的なキャラクターとして家庭に置く、という発想から始まっています。画面の中の存在だったAIに「体」を与え、家の中にいる相棒として成立させることが狙いです。\n\n構成の詳細\n顔役はM5Stack Chan／STACK-CHANで、表情、声、LLMによる会話応答を担当します。その下にRaspberry Pi 5とESP32-C3 Mini制御のタンク台車を組み合わせ、自律移動できる小さな移動コンパニオンを目指します。タンク台車は左右の履帯で進む形式で、その場での方向転換がしやすく、室内の移動体として扱いやすい方式です。顔と頭脳と足を別々の部品に分けることで、故障や改良のときに担当部分だけを入れ替えられる構成になっています。\n\n役割分担の考え方\nRaspberry Pi 5は記憶、センサー、視覚、自動化、ローカルモデルの実験を担う中核です。会話の応答そのものは顔役が担い、周囲の把握や記録、実験的な処理はPi側に置く、という分担です。小さな顔役デバイスだけでは抱えきれない処理を、常時動かせる小型コンピュータ側に逃がす設計だといえます。\n\n現状と次のステップ\n現状は文書とハードウェア設計の段階で、次は移動層、対話層、LLM会話層をつないだ試作が目標とされています。いきなり全部を動かすのではなく、層ごとに作って接続していく進め方です。\n\n実践のポイント\nあなたが注文したM5StackChanの活用先として、まさに重なる構成です。まず顔役単体で表情と会話を成立させ、後から移動を足していく段階的な進め方が、この文書から読み取れる現実的な道筋です。\n\n必要なものの整理\nこの構成で必要なのは、顔役のM5Stack Chan、頭脳役のRaspberry Pi 5、移動を担うESP32-C3 Mini制御のタンク台車という3つの要素です。それぞれ単体でも意味を持つ部品であり、全部を一度にそろえなくても、顔役だけ、頭脳だけといった部分から試せます。文書として全体設計が先に公開されているため、部品を買い足す順番を計画立てて考えられる点も、このプロジェクトの読みどころです。", "2026-11-01", "GitHub AIplay", "https://github.com/miaoreynolds/aiplay/blob/HEAD/docs/projects/raspberry-pi-5-tank-stack-chan.md"], ["スタックちゃんを「家の顔」にする設計思想 — クラウドLLMからローカルAIへ", "AIplayプロジェクトの設計方針を掘り下げた記事です。初期版はクラウドAPIのLLMで素早く試作し、長期的な方向は家庭や会社の中に置かれたローカルAIだと位置づけられています。そのためにRaspberry Pi 5を、記憶、センサー、視覚、自動化、ローカルモデル実験のローカルな統括層として使います。会話の賢さはクラウドに頼っても、生活に触れる部分は手元に置く分担で、プライバシーに配慮した拡張が前提です。", "概要\n同じAIplayプロジェクトの、設計方針の部分を取り上げた記事です。スタックちゃんを「家の顔」にするうえで、 賢さをどこに置くかという考え方が整理されています。\n\n試作はクラウドで速く\n初期版はクラウドAPIのLLMを使って素早く試作します。まず賢い応答を借りて全体の体験を形にし、動くものを早く手に入れることが優先されています。試作の段階では、応答品質を自分で抱え込むより、既にある高性能なLLMにつなぐほうが検証が進む、という判断です。\n\n長期的な方向はローカルAI\nより面白い長期的な方向は、家庭や会社の中に置かれたローカルAIシステムだと位置づけられています。そのためにRaspberry Pi 5を、記憶、センサー、視覚、自動化、ローカルモデル実験のローカルな統括層として使います。「統括層」とは、家の中の情報を集め、機器同士の連携を取り仕切る層のことです。\n\n分担の考え方\n会話の賢さはクラウドに頼っても、生活に触れる部分は手元に置く、という分担です。記憶やセンサーの情報は暮らしそのものに近いデータなので、それを扱う場所は家庭内に置く。賢さの借り先と、生活データの置き場所を分けて考えるのがこの設計の芯です。\n\n実践のポイント\nプライバシーに配慮した拡張が前提に設計されています。自宅に置くAIを考えるとき、「最初はクラウドで体験を作り、生活に触れる部分から手元へ寄せていく」という順序は、そのまま自分のプロジェクトの進め方の参考になります。\n\nなぜこの分担が大切か\n家庭の中に置かれるAIは、外のサービスとは違い、暮らしの音や映像、行動のリズムといった情報のすぐ近くにいます。そうした情報の置き場所を家庭内に保つことは、便利さと引き換えに何を外へ渡すのかを自分で決められる、ということでもあります。クラウドの賢さを全面的に拒むのではなく、頼る部分と手元に置く部分を意識して分ける。この線引きの考え方そのものが、ローカルAIへ移る長期計画の土台になっています。試作の段階でクラウドに頼ることも、その線引きを後から引くための準備期間だと読めます。", "2026-11-01", "GitHub AIplay", "https://github.com/miaoreynolds/aiplay/blob/HEAD/docs/projects/raspberry-pi-5-tank-stack-chan.md"], ["Claude×ESP32-C3で鍵開けロボット — 力覚フィードバックを読む試作機", "AIstifyが2026年11月1日に伝えた作例は、YouTube制作者Dr. Kun Dániel氏が200時間以上をかけた鍵開けロボットだ。ESP32-C3 Miniがモーターとセンサーを担い、ピンの抵抗を示す力フィードバックをWi-FiでClaudeへ送り、モデルが解釈して手順を導く。機構とフレームは3Dプリント製で、制作者自身も安定した再現性は未完成とし、ソース公開は改良後を予定しているという。", "概要\nAIstifyの2026年11月1日の記事は、チャットボットに画面の外の物理作業をさせる異色の試作機を紹介している。YouTube制作者のDr. Kun Dániel氏が作ったのは、AnthropicのAIアシスタントClaudeとESP32-C3 Miniコントローラーをつないだ電動の鍵開け装置だ。2026年10月24日のデモンストレーションでは、鍵のピンから伝わる抵抗を力フィードバックとしてモデル側へ送り、その解釈をもとに工程を進める様子が示されたという。記事は最初から、再現性はまだ開発目標であり、あらゆる鍵を開けられることが実証されたわけではないと線を引いている。\n\n仕組み・役割分担の詳細\nこの作例で大切なのは役割の切り分けだ。ESP32が担うのはモーターとセンサーへの接続という現場の制御で、Claudeが担うのは送られてきた抵抗の解釈という別の層である。つまり言語モデルが小さな基板上で動いているわけではなく、モデルと機械をつなぐインターフェースこそが実験の本体だ。記事はEspressifの情報として、ESP32-C3が最大160MHz動作のシングルコアRISC-Vで400KBのSRAMとWi-Fiを備えることも添え、要求の重い言語モデルの計算とは地の制御が別物であることを整理している。使用されたClaudeの具体的なモデル名は元の説明でも特定されていない。\n\n必要なもの\nハードウェアの中核はESP32-C3 Miniと電動機構、そして3Dプリント製の機構部品とフレームだ。制作者は自作コードの開発を含め、このプロジェクトに200時間以上を費やしたと述べている。ソースファイルとドキュメントは改良を重ねた後に公開する予定で、現時点ではそのまま再現できるキットや手順書が揃っている段階ではない。したがって読み手にとっての価値は完成レシピではなく、センサー値を言語モデルへ渡すときの設計と評価の考え方にある。\n\n実践のポイント・注意点\n記事が求める評価は厳密だ。編集された成功映像だけでは、未知の鍵でどれくらい成功するのか、人間の介入がどれだけ要るのか、従来の固定制御と比べてAIが本当に寄与しているのかは分からない。同じハードウェアで試行を繰り返し、成功と失敗と介入を数え、AI誘導と固定コントローラーを比べる検証が必要だとしている。", "2026-11-01", "AIstify", "https://aistify.com/claude-ai-lockpicking-robot-esp32/"], ["AIエージェントにCM4用Mini-ITX基板を設計させた2日間 — ERC 0件の記録", "Qiitaの連載は、AIコーディングエージェントCodexにRaspberry Pi CM4用Mini-ITXキャリアボードをKiCad CLIで設計させる実験だ。2日時点で回路図ERCはエラー0件、5VレールのDC解析は486条件を通過し出力は4.909〜5.092V。一方で未配線は1,464区間、DRCエラーは244件残り、IRドロップや電源シーケンスは未解決と正直に公開されている。基板には製造禁止のシルクも入る。", "概要\nQiitaで公開された連載の第1回は、Raspberry Pi Compute Module 4用のMini-ITX I/Oボードを、人ではなくAIコーディングエージェントに設計させる開発ログだ。使うのはKiCadで、エージェントはkicad-cliと自作の検査スクリプトを回し、ERCやDRC、回路図と基板のネット整合チェック、電源レールのDC解析を行い、引っかかった箇所を直して再検査するループを回し続けている。著者の仕事は検査レポートと描画結果を読む監督役で、チャットボットへの質問というより、寝ずに働いて全部記録してくれる速くて素直な新人エンジニアを監督する感覚だと表現されている。初回投稿は2026年10月25日で、11月3日に更新されている。\n\n仕組み・仕様の詳細\n題材の仕様は意図的に制約の塊にされている。フォームファクタはMini-ITXで電源はATX 24ピン、DisplayPortとHDMIが各1つ、USB-AとUSB-Cが各2つ、そしてPCIeスイッチ配下にPCIeスロット2つとM.2スロット2つを詰め込む。CM4のPCIeはGen2 x1が1レーンしかなく、DisplayPortもネイティブにはない。そこへATXのソフト電源制御まで含める無理のある題材をあえて投げている点が実験の眼目だ。作業はすべてCLIとスクリプト経由で進み、GUIは開かない。検査、修正、再検査を数百イテレーション回したという。\n\n必要なもの・2日時点のスコア\n2日時点のスコアボードは次の通りだ。回路図ERCはエラー0件で警告3件、回路図と基板のネット不一致は0件。CM4の5VレールDC解析は基準電圧や抵抗の公差、温度係数、入力バイアスなど486条件を通過し、出力範囲は4.909〜5.092Vで、CM4の5Vプラスマイナス5パーセント要求の内側に収まり、低側マージンは約0.16Vだった。一方でメーカー電源モデルによる起動解析は2回とも実行時間上限で中断し、起動と安定性は未判定のままだ。配置段階では未配線が1,464区間、DRCエラーが244件残り、配線が始まってようやく数字が動き出した段階だとされる。\n\n実践のポイント・注意点\n負けている点も隠さず書かれている。", "2026-10-25", "Qiita", "https://qiita.com/tomoya-creater/items/b5b88a2d2e23ead4d5a7"], ["ESP-Mosaico — ESP32-S31＋AIコーディングで試作するモジュール基盤", "CNX Softwareが2026年10月21日に報じたEspressifのESP-Mosaicoは、ESP32-S31に480×480のOLEDタッチ画面や触覚フィードバック、バッテリーをまとめたモジュール型開発基盤だ。自然言語で試作するESP-ClawのChat Codingと、AIエージェントが実装から実機テストまで担うESP-ZeroCode AIのVibe Codingという2つの開発法が用意される。カメラ込み一式は59ドルだ。", "概要\nCNX Softwareの2026年10月21日の記事は、Espressif SystemsのESP-Mosaicoを紹介している。ESP32-S31を中核に、480×480のOLEDタッチ画面、触覚フィードバック、内蔵バッテリー、USB Type-C接続と拡張I/Oをまとめた開発プラットフォームだ。位置づけはAIとハードウェアの統合に特化した基盤で、磁石でつながる拡張玩具、モーションセンシング、四角いタッチ画面のHMI、エッジの音声やマルチメディア用途が想定されている。数か月前からTaobaoや割高なAliExpress店には出ていたが、Mosaicoストアで正規に買えるようになったことが今回のニュースだ。\n\n仕組み・仕様の詳細\n構成はCoreBoardと、それに60ピンのボード間コネクタでつながるBaseBoardの2層だ。CoreBoard側のESP32-S31は320MHz動作のRISC-V高性能コアと低消費電力コアを持ち、512KBのSRAMに16MBのPSRAM、資産保存用の128MB SPI NANDとプログラム用の16MB SPI NORを備える。無線は2.4GHz Wi-Fi 6、LE Audioや方向探知に対応するBluetooth 5.4、ZigbeeやThread、Matter向けの802.15.4まで揃う。\n\n必要なもの・拡張モジュール\n拡張モジュールは現時点で2種が設計されている。カメラモジュールは3.2メガピクセルのOV3640、または1メガピクセルのSC101IOTセンサーを載せ、どちらも1024×768解像度で使う。多機能インタラクションモジュールは光センサーのGL5506、PIRセンサーのAS312、赤外LED、6個のWS2812 RGB LED、メカニカルキーや静電タッチ用のパッド2つを備える。\n\n実践のポイント・注意点\nこの基盤の変わり種は開発方法そのものだ。ファームウェアは2つの進め方を用意し、Chat CodingはESP-Clawを通じて自然言語で指示し、ローカルに開発環境を作らずに動く試作を素早く作る。Vibe CodingはESP-ZeroCode AI側で、AIエージェントが実装、デプロイ、実機でのテスト、継続的な反復まで工学ワークフローの大半を担うという。", "2026-10-21", "CNX Software", "https://www.cnx-software.com/2026/10/21/esp-mosaico-an-esp32-s31-based-modular-development-platform-for-ai-assisted-hardware-creation/"], ["M5Stack PaperDIY — ESP32-S3×4.7インチ電子ペーパーの手のひらキット", "Hackster.ioが2026年10月19日に伝えたM5StackのPaperDIYは、ESP32-S3R8と4.7インチ900×540の電子ペーパー表示を組み合わせた開発キットだ。自分で組み立てるAssembly Kitが25ドル、工場組立済みで3Dプリント筐体付きのComplete Kitが29.90ドル。140mAhバッテリーとmicroSDスロットを備え、表示は16階調グレースケール、書き換え時だけ電力を食う省電力さが売りだ。", "概要\nHackster.ioの2026年10月19日の記事は、M5Stackが発表した新しい電子ペーパースマートディスプレイ開発ボード、PaperDIYキットを紹介している。ラインアップは2種あり、PaperDIY Assembly Kitはメイン制御基板と電子ペーパー表示、140mAhリチウムバッテリーを含むDIYキットで、組み立ては購入者が行う。PaperDIY Complete Kitは同じく基板と表示に3Dプリント筐体が標準で付き、工場で組み立て済みの状態で届く。超小型の電子書籍リーダーに着想を得たデザインだとメーカーは説明しており、手のひらに載る常時表示デバイスの実験台として位置づけられている。\n\n仕組み・仕様の詳細\n両キットとも土台はEspressifのESP32-S3R8モジュールで、最大240MHzのデュアルコアTensilica Xtensa LX7プロセッサ、8MBのPSRAM、16MBのフラッシュを載せる。表示は4.7インチ900×540の電子ペーパーで、物理的なインクを動かして絵を作る電気泳動式のため、電力が要るのは画面を書き換える瞬間だけだ。その代わり照明はなく明るい環境光の下でないと読みにくいこと、通常のディスプレイよりリフレッシュが遅いこと、この製品では16階調のグレースケール表示であることがトレードオフとして挙げられている。\n\n必要なもの・価格\n接続はシングルバンド2.4GHz Wi-Fiを備える。ESP32-S3自体はBluetooth Low Energyも持つが、M5Stack自身の仕様に記載がないため、標準ファームウェアへハードウェア支援が引き継がれていない可能性が記事では示唆されている。価格はAssembly KitがM5Stackストアで25ドル、Complete Kitは29.90ドルだが、記事執筆時点では在庫切れ表示だったという。\n\n実践のポイント・注意点\n電子ペーパーは書き換え時だけ電力を食うため、朝のブリーフィングや買い物リストのような更新頻度の低い常時表示と相性がよい一方、動画や頻繁な再描画には向かない。まずは組立済みで動作を掴むか、安いAssembly Kitで中身を理解してから自作筐体へ進むか、目的で選ぶのが現実的だ。在庫状況は変わりやすいため、価格と合わせてストアで最新表示を確認したい。", "2026-10-19", "Hackster.io", "https://www.hackster.io/news/m5stack-s-new-espressif-esp32-s3-powered-paperdiy-kits-put-a-low-power-smart-display-in-your-palm-1b934d3dd53d"], ["MetaのMuse Gadgets公開 — ESP32とPiをAIアシスタントの体にするSDK", "Hackster.ioが2026年10月12日に報じたMuse Gadgetsは、MetaのAIエージェントMuseを自作ハードウェアへつなぐオープンソースSDKだ。ESP32用とLinux用があり、表示・マイク・スピーカー・センサー等をMuseから扱える。Waveshareの丸型AMOLEDボードやSeeed reTerminal E1002、Pi 5とHome Assistantの連携例もあり、ESP32-C5搭載のHome Linkも発表された。", "概要\nHackster.ioの2026年10月12日の記事は、MetaのパーソナルAIエージェントMuseに物理的な存在感を持たせる取り組みを紹介している。そのために公開されたのがMuse Gadgetsというオープンソースのソフトウェア開発キットで、メーカーが自分のハードウェアへAIエージェントを接続できるようにするものだ。対応するのはESP32マイコンと、Raspberry PiのようなLinuxコンピュータである。AIアシスタントをゼロから作る代わりに、このSDKを使えば表示やマイク、スピーカー、ボタン、センサー、アクチュエータへMuseからアクセスでき、音声操作のスマートホーム端末から情報を映す卓上アシスタントまで幅広い作例が可能になると記事は伝えている。\n\n仕組み・SDKの詳細\nSDKはハードウェアの性格に合わせて2系統に分かれている。ESP32 Device SDKはマイコンベースのプロジェクト向けで、表示の接続や音声の入出力、外部センサーなどとのやり取りを担う。Linux Device SDKはRaspberry PiなどのLinux機を対象に、カスタムコマンドの実行やシステム管理作業の自動化、Home Assistantとの連携といった追加の能力を持つ。\n\n必要なもの・作例\n入門用の作例も既に用意されている。1つはWaveshare ESP32-S3-Touch-AMOLED-1.75Cで、1.75インチの丸型AMOLEDタッチ画面とマイク、スピーカー、バッテリーを備える。もう1つはSeeed reTerminal E1002というカラー電子インク表示で、毎日のブリーフィングやリマインダー、買い物リストなどをMuseから受け取って映す用途が示されている。\n\n実践のポイント・注意点\n組み立てを避けたい人向けには、完成品のMuse Home Linkも用意されている。家庭のWi-Fiへ接続し、対応スマートホーム機器などとローカルHTTP APIで通信する装置で、中核はデュアルバンドWi-Fi 6とBluetooth LE、ZigbeeやThread向けのIEEE 802.15.4に対応するESP32-C5だ。8MBのフラッシュと8MBのPSRAM、USB-CポートとLEDも備え、米国では在庫がある限りアクティブなMuse購読者へ無料配布されるという。", "2026-10-12", "Hackster.io", "https://www.hackster.io/news/meta-brings-its-muse-ai-agent-to-esp32-and-raspberry-pi-f6694ff1a306"], ["LilL3x — Raspberry Pi 4で作る卓上音声ロボット", "Raspberry Pi 4を中心に作られたDIY卓上音声アシスタントです。ReSpeaker 2-Mics Pi HATによる遠距離集音、Pi Camera Moduleによる存在検知、小型スピーカー、アニメーションするOLEDの顔、3Dプリント筐体で構成されます。処理はウェイクワード検出から音声合成まで、LLMはChatGPT、Claude、Geminiに加えローカルのOllamaも選択可能。プライバシーに配慮したエッジ型音声助手の再現可能な型です。", "概要\nRaspberry Pi 4 Model Bを中心に作られたDIY卓上音声アシスタントの紹介です。市販のスマートスピーカーを買うのではなく、部品を組み合わせて自作する形式で、卓上に置く相棒ロボットとして作られています。\n\n構成部品とそれぞれの役割\n構成は、Seeed StudioのReSpeaker 2-Mics Pi HATによる遠距離集音、Pi Camera Moduleによる存在検知、小型スピーカー、アニメーションするOLEDの顔、そして3Dプリントの筐体です。HATはRaspberry Piの上に重ねて機能を足す拡張ボードのことで、ここではマイクの役割を担います。遠距離集音は、少し離れた場所からの呼びかけも拾える集音性能を指します。カメラは映像そのものよりも「人がいるかどうか」を知るために使われ、顔の表示は小さなOLED画面のアニメーションで表情らしく見せる工夫です。筐体を3Dプリントで作るため、外観は作り手が自由に決められます。\n\n処理の流れ\n処理の流れは「ウェイクワード検出 → 録音 → 音声認識 → LLM推論 → 音声合成」です。ウェイクワードとは、呼びかけの合図になる特定の言葉のことで、それを聞き取るまでは本格的な処理を始めません。呼ばれたら録音し、音声を文字に変え、LLMが返答を考え、最後に音声合成で声に戻してスピーカーから返します。\n\nLLMの選択肢\nLLMはChatGPT、Claude、GeminiのほかローカルのOllamaも選べます。クラウドのLLMは賢さを借りる方式、手元のOllamaは自分の機械の中で動かす方式で、後者は会話データを外に出さない形にできます。\n\n実践のポイント\nプライバシーに配慮したエッジ型音声助手の再現可能な型として紹介されています。「エッジ型」とは、処理をクラウド任せにせず手元の機器側で行う考え方です。部品が汎用品でそろうため、音声ロボット自作の出発点としてたどりやすい構成です。\n\n必要なものの整理\n中心になるRaspberry Pi 4 Model Bに、マイク用のReSpeaker 2-Mics Pi HAT、カメラモジュール、スピーカー、OLED、3Dプリント筐体を組み合わせる構成です。いずれも役目がはっきり分かれた部品であり、1つずつ追加して動作を確かめる進め方ができます。", "2026-04-21", "Let's Data Science / Hackster.io", "https://letsdatascience.com/news/lill3x-turns-raspberry-pi-into-voice-robot-95898a57"], ["音声ロボットの定番パイプライン — ウェイクワードからTTSまでを部品で組む", "LilL3xの技術詳細をもとに、音声ロボットの定番パイプラインを部品単位で整理します。対話の流れはウェイクワード、収音、音声認識（STT）、LLM推論、音声合成（TTS）の5段階で、会話らしく即時に感じられることを狙います。ウェイクワードはPorcupineかVosk、TTSはElevenLabsやAmazon Pollyが選択肢で、LLMの接続先は差し替え可能。まずクラウドで動かし、後からローカル化でき、スタックちゃんへの応用の土台になります。", "概要\nLilL3xの技術詳細は、音声ロボットを作る際の部品表としてそのまま使えます。この記事では、音声対話がどのような部品の連なりでできているかを分解して整理します。\n\nパイプラインの各段階\n対話のパイプラインは「ウェイクワード → 収音 → 音声認識（STT） → LLM推論 → 音声合成（TTS）」で、会話らしく即時に感じられることを狙っています。ウェイクワードは呼びかけの合図になる言葉で、常時すべての音を処理するのではなく、合図を聞いたときだけ本処理を始めるための入口です。収音はマイクで声を拾う段階、STT（音声認識）は声を文字に変える段階です。LLM推論は、その文字をもとに返答の文章を考える段階で、TTS（音声合成）は返答を人の声のような音に戻す段階です。この5段階が滞りなくつながると、話しかけてから返事が返るまでの待ち時間が短く、会話らしく感じられます。\n\n部品の選択肢\nウェイクワードはPicoVoice PorcupineかVoskで設定可能、TTSはElevenLabsやAmazon Pollyが選択肢です。どの段階も、専用の部品が複数存在し、好みや条件で選べるようになっています。声の印象を決めるTTSのように、結果の違いが分かりやすい部分から差し替えて試すこともできます。\n\n差し替え可能な設計の利点\nLLMの接続先が差し替え可能（クラウド3種＋ローカルOllama）なため、まずクラウドで動かし、後からローカル化する段階的な作り方ができます。最初から全部を自前で用意しようとせず、動く形を先に作って、置き換えたい部分から置き換えていく進め方です。\n\n応用のポイント\nスタックちゃんに音声対話を足す場合の設計の土台になります。顔と表情を持つデバイスに、この5段階のパイプラインを組み合わせれば、話しかけると返事をするキャラクターに育てていけます。\n\n段階ごとの詰まりどころ\n5段階の連なりは、どこか1つが遅れたり失敗したりすると会話全体の印象に影響します。逆に言えば、応答が遅い、聞き取れないといった問題が起きたとき、どの段階で起きているかを切り分けて考えられるのが、この分解の実用的な価値です。部品表として持っておくと、自分の構成の弱点を見つける物差しになります。音声ロボットの調子を整える作業は、この物差しで段階を1つずつ点検することだともいえます。", "2026-04-21", "Let's Data Science", "https://letsdatascience.com/news/lill3x-turns-raspberry-pi-into-voice-robot-95898a57"], ["Yahboom Raspbot V2 — Pi 5搭載のAIビジョンロボットカー", "Raspberry Pi 5を主制御とするオープンソースのDIYロボットカーキットで、対象は16歳以上です。AIビジョンはOpenCVが中心で、姿勢推定、3次元物体認識、顔検出、タグの認識・追従、ごみ認識、自律走行などを搭載。足回りはメカナムホイール×4で前後・左右・斜め・回転ができ、制御はスマホアプリ、PC、リモコン、ハンドルに対応、FPV映像伝送も可能です。PythonとROS2の学習素材も豊富です。", "概要\nRaspberry Pi 5を主制御とするオープンソースのDIYロボットカーキットです。16歳以上を対象とし、AI性能とカメラの滑らかさがPi 5で大きく向上しています。組み立てて走らせるだけでなく、AIビジョンとロボット制御を学ぶためのキットという性格を持ちます。\n\nAIビジョンの機能\nAIビジョンはOpenCVが中心で、人の姿勢推定、3次元物体認識、顔検出、タグの認識・追従、顔追従、ごみ認識、自律走行などが用意されています。姿勢推定はカメラ映像から人の体の向きやポーズを推し量る処理、顔追従は検出した顔の方向へ車体やカメラを向ける動きです。タグの認識・追従では、目印になるタグを見つけてそれについて行くような動作ができます。ごみ認識や自律走行まで含め、カメラで見て判断し動く、という一連の流れを体験できる内容です。\n\n足回りとセンサー\n足回りはメカナムホイール×4で前後・左右・斜め・回転ができます。メカナムホイールは斜めにローラーが付いた車輪で、車体の向きを変えずに横移動できるのが特徴です。さらに4方向巡回モジュール、赤外線巡回センサー、超音波センサーを備えます。巡回は線に沿って走るための仕組み、超音波センサーは音波の跳ね返りで障害物までの距離を測る部品です。\n\n制御方法\n制御はスマホアプリ（Android／iOS）、PC、リモコン、ハンドルに対応し、FPV映像伝送も可能です。FPVは車載カメラの映像を手元で見ながら操縦する方式で、車体の目線で運転できます。\n\n学習キットとしての位置づけ\nPythonとROS2の学習素材も豊富です。ROS2はロボット用ソフトウェアの基盤で、センサーやモーターの処理を部品ごとに分けて連携させる仕組みです。遊びながら、実物のロボット開発で使う道具立てに触れられる点がこのキットの価値です。\n\n注意点\n対象が16歳以上と明示されている点は、組み立てと運用に一定の扱いの理解が求められるキットであることを示しています。カメラで周囲を認識して動く機械である以上、走らせる場所や周囲の人への配慮も、技術と並んで大切な前提です。学習素材が豊富なぶん、機能を1つずつ試しながら進める使い方が向いています。最初から全機能を動かそうとせず、走行、認識、追従と順に確かめることで、どこまでが自分の理解の範囲かも見えてきます。", "2026-03-01", "Manuals.plus / Yahboom", "https://manuals.plus/asin/B0DT4JNNK3"], ["Pi 5ロボットの電源とドライバ — 5V/5A PD対応ボードの要点", "Raspbot V2のハードウェア構成から、移動ロボット化の実務ポイントを抜き出した記事です。Pi5ロボットドライバボードはI2C経由でRaspberry Pi 5と通信し、Pi 5のPD給電（5V/5A）に対応します。モーターを回しながらPi 5を安定動作させるには給電能力が最初の関門になるため、この一体設計は参考になります。そのほか金属シャーシとTTモーター、2自由度のHDカメラ、OLED表示が標準構成で、ROSはROS2 Humbleです。", "概要\nRaspbot V2のハードウェア構成から、移動ロボット化の実務ポイントを抜き出した記事です。テーマは、走るロボットにコンピュータを載せるときに最初に問題になる「電源と接続の設計」です。\n\nなぜ電源が最初の関門か\nPi5ロボットドライバボードは、Pi 5のPD給電（5V/5A）に対応します。モーターを回しながらPi 5を安定動作させるには、給電能力が最初の関門になります。モーターは動き出す瞬間などに大きな電力を欲しがり、その影響でコンピュータ側の電圧が不安定になると、処理が落ちたり再起動したりする原因になります。走る部分と考える部分の両方に、十分な電力を安定して届けることが、移動ロボットの土台です。\n\nドライバボードの役割とI2C接続\nPi5ロボットドライバボードはI2C経由でRaspberry Pi 5と通信します。I2Cは、少ない配線で複数の部品とやり取りするための通信方式で、モーターの制御信号などをまとめて受け渡すのに使われます。モーター駆動のような電力と制御が絡む部分を専用ボードに任せ、Pi本体は判断と処理に集中する分担です。給電と制御を一体で設計したボードだからこそ、Pi 5向けの給電仕様に対応した形でまとめられています。\n\nその他の標準構成\nそのほか、金属シャーシ＋TTモーター、2自由度のHDカメラ、OLEDのリアルタイム表示が標準構成です。2自由度のカメラは上下左右に首を振れることを意味し、OLED表示はロボットの状態をその場で目に見える形にします。システムはRaspberry Pi OS、ROSはROS2 Humbleです。\n\n実践のポイント\n移動ロボット化で最初に詰まる電源周りの実例として、この一体設計は参考になります。自作で足回りを足す場合も、まず「モーターを回しながら頭脳が安定して動くか」を確認することが、遠回りに見えて確実な順序です。\n\n自分の制作への応用\nこの実例が示すのは、ドライバボードのような周辺部品を選ぶ段階で、給電仕様まで含めて確認する大切さです。動くかどうかはプログラムだけでなく、電力の設計で決まる部分が大きい。移動体を作るときは、頭脳の性能の前に、まず電源の余裕を見積もることが失敗を減らします。逆に、電源まわりを一体設計のボードに任せられれば、試作の焦点を動きや認識のほうへ移せます。", "2026-03-01", "Manuals.plus / Yahboom", "https://gd.manuals.plus/asin/B0DG2PJHDN"]], "muse": [["Muse Spaces入門 — 言葉で作る自分専用の小さなアプリ画面", "Metaは11月6日、Museに「Spaces」を追加した。贈り物管理やDIYの計画ボードなど、作りたい体験を言葉で伝えるとMuseが専用画面を作り、サイドバーやタブに置いて使い続けられる。接続したアプリの情報で裏側で更新される点も特徴で、共有機能はまだ検討段階とされる。提供はMuseが使える地域すべてが対象だ。作った画面は内容や見た目を会話で直し続けられ、表示場所やタイミングも選べるという。", "概要\nMetaは2026年11月6日、Museのカスタム機能「Spaces」を発表した。Spacesは、作りたい体験を言葉で説明するとMuseがアプリ内に専用の体験を作ってくれる仕組みで、同11月5日に発表された音声対話・アバターとは役割が異なる。Spacesが担うのは継続する活動の整理であり、提供範囲も異なる。SpacesはMuseが利用できる地域すべてで始まるのに対し、音声とアバターは米国先行である。\n\n仕組み・手順の詳細\nMetaの説明では、Spaceは「アイデアを伝えてMuseの中に作るカスタム体験」だ。例として、休日の贈り物トラッカー、毎日の単語ゲーム、次のDIYプロジェクトの計画ボードが挙げられている。そのほか音楽トラッカー、トリビアゲーム、ポッドキャストスタジオ、旅行プランナーなども紹介された。作ったSpaceは内容・見た目・動きを会話で調整し続けられ、項目のチェック、メモの追加、編集もSpaceの中で行える。配置はサイドバーやメインタブに置く、隠す、表示するタイミングを決めるといった使い分けができる。接続したアプリとつなげば、Spaceはバックグラウンドで自分を最新に保つとMetaは述べている。\n\n必要なもの\nMuseが利用できる地域のアカウントとMuseアプリが前提になる。料金やプラン条件は今回の発表では示されていない。共有については、Metaは「共有する方法を検討している」と述べており、提供済みの機能ではない。\n\n実践のポイント・注意点\nSpacesは一度きりの質問ではなく、何日も戻ってくる活動に向く。最初は贈り物管理や旅行計画のように、項目が増減し、状態が変わるテーマで小さく作るのが現実的だ。逆に、更新頻度や外部連携の細部、自動でどこまで動くかは発表だけでは分からない部分も残る。便利そうに見えるSpaceほど、どのアプリとつないで何を更新させるのかを最初に決め、不要になったら隠す・外す運用まで含めて考えることが大切である。毎朝開くSpaceと週末だけ見るSpaceを分けるような、生活のリズムに合わせた配置も、発表で示された表示タイミングの考え方に沿った使い方になる。", "2026-11-08", "DotsBot", "https://dotsbot.co/news/meta-muse-spaces-voice-avatars"], ["Active MemoryとActive Focus — 忘れにくく、詰まっても進むモデル更新", "11月6日、MetaはMuseとMeta AIにMuse Wonderで学習した特化モデルを展開した。重要な情報を一時情報と区別して覚えるActive Memoryと、想定外が起きても目標へ進み続けるActive Focusが柱で、Meta評価では重要文脈の活用が76％から90％へ上がった。ただし数値はMeta自身の評価で、第三者の再現はまだない。数値の出典と限界を理解したうえで、記憶の確認と削除を習慣にする視点も重要になる。", "概要\n2026年11月6日、Meta Superintelligence Labsは既存モデルの特化版を導入した。10月12日に登場した上位モデルMuse Wonderを使って学習したモデルで、MuseとMeta AIの利用者へ広く届けられる。フル版のWonderが主にサブスクリプションや開発者APIの側にあるのに対し、この特化モデルは日常利用の側を底上げする位置づけだ。柱はActive MemoryとActive Focusの二つである。\n\n仕組み・手順の詳細\nActive Memoryは、何が重要かを覚え、以前の情報が再び関係したときに思い出せるようにする仕組みだ。一時的な情報と恒常的な情報を区別し、時間がたってもまだ正しいものと古くなったものを分けて考えるよう学習されている。Active Focusは課題の途中で想定外が起きても目標を見失わず進み続ける力で、Museでは日常タスクの完遂、Meta AIでは問題を手順に分けて考え、鋭い追加質問を返す動きにつながるとされる。利用者側に新しいインストールや支払いは要らないと記事は伝えている。\n\n必要なもの\n特別な準備は不要で、Metaのサーバー側で動くモデル更新として提供される。ただし今回の発表では対象国が明記されておらず、記憶がどの範囲で有効かはアカウントや地域で差があり得る。自分の状態を知る早い方法として、チャットで「私について何を覚えているか」を尋ねる確認法が記事では紹介されている。\n\n実践のポイント・注意点\n数値の読み方には注意が要る。Meta自身の記憶テストでは重要文脈を正しく使う割合が76％から90％へ上がり、重要な忘却は2.4倍起きにくくなったとされる。Personal Superintelligence Indexは38％から47％、想定外が起きた日常タスクの完遂は67％改善とされるが、いずれもMeta自身の評価で、テストの規模や方法は示されず、第三者の再現もまだない。覚える力が上がるほど、残してほしくない情報まで残る可能性も意識し、健康や金銭、他人の詳細は入れない線引きと、定期的な記憶の確認・削除を習慣にしたい。", "2026-11-07", "i-SCOOP", "https://www.i-scoop.eu/meta-ai-active-memory/"], ["Museに音声で任せる — 電話アイコンから始まるリアルタイム対話とアバター", "Metaは11月5日、Museにリアルタイム音声対話と表情豊かなアバターを追加し、米国から提供を始めた。画面右上の電話アイコンで会話が始まり、発話中の割り込みにも対応する。散歩や料理の最中に声で作業を頼み、会話を続けながら裏側で処理を進められるのが特徴だ。日本での提供時期は示されていない。声は数百種類から選べ、表示は音声のみ、アバター併用、全画面の3モードがある点も紹介された。", "概要\nMetaは2026年11月5日（現地時間）、パーソナルAIエージェント「Muse」にリアルタイムの音声対話機能と、会話に合わせて表情や身ぶりを変えるアバター機能を追加すると発表した。まず米国で提供を開始し、モバイル、Web、Mac向けのMuseアプリで利用できる。日本での提供時期は明らかにされていない。Museは9月に米国で始まり、10月23日に日本でも利用可能になったサービスで、今回の機能はMeta Connect 2026で予告されていたものである。\n\n仕組み・手順の詳細\n音声対話は、画面右上の電話アイコンをタップすると始まる。基盤となる技術は「Muse Realtime Voice」と「Muse Realtime Avatar」で、AIが利用者の発言に反応し、内容や雰囲気に合わせて表情や身ぶりを変える。表示は、音声のみ、会話画面にアバターを表示、アバターを全画面表示する3モードから選べる。声は数百種類から選択でき、話し方に個性を持たせることもできる。応答はリアルタイムで、AIの発話中に割り込んで話すことも可能だ。旅行計画の相談や面接・プレゼンの練習のほか、散歩中や料理中に音声で作業を依頼し、会話を続けながらバックグラウンドで処理を進めさせる使い方も紹介されている。\n\n必要なもの\n米国で提供されるMuseアプリ（モバイル、Web、Macのいずれか）が前提となる。記事時点では日本提供の時期は示されていないため、日本のアカウントで同じ画面が出るとは限らない。今後、MetaのAIグラスや開発中のウェアラブル端末「Muse Charm」にも音声対話を提供する予定とされるが、こちらも時期は確定情報ではない。\n\n実践のポイント・注意点\n音声操作の利点は、正確なプロンプトを文章で組み立てなくても、話しながら考えを整理して仕事を渡せる点にある。一方で、音声で頼んだ作業も最終的には内容の確認が要る。特に送信や購入のような取り消しにくい操作は、会話の流れで流さず止まって確認する習慣を持ちたい。またアバターは会話に反応して動くもので、利用者を見ているわけではない点も押さえておきたい。", "2026-11-06", "ITmedia NEWS", "https://www.itmedia.co.jp/news/article/2611/06/2000002939/"], ["ノートPCを閉じても止めない — 常時稼働マシンへの移し方3択", "朝6時の定期実行が、ノートPCが眠っていたために動かなかった。そんな失敗への実践ガイドが公開された。自宅の常時起動PC、VPS、マネージドホスティングの3択を比べ、スマホからどう届くかまで整理している。寝ている機械ではエージェントは動かないという当たり前を、置き場所の設計で解く考え方が中心だ。スマホは実行場所ではなく窓であり、届き方はクラウド経由か自前の経路かで変わるとも説く。", "概要\n「6時のルーティンを設定してノートPCを閉じ、朝起きたら実行されていなかった」という失敗は、バグではなく仕様だとガイドは説く。Bloksのような自分のコンピュータ上で動くエージェントは、その機械が眠れば止まる。Museのようにクラウド側で動き続ける設計と違い、ローカル実行型では「どの機械を常時稼働させるか」が運用の出発点になる。このガイドは、その置き場所の選択肢を具体的に比べた実践記事である。\n\n仕組み・手順の詳細\n選択肢は三つある。第一は自宅の常時起動コンピュータで、戸棚の中のMac miniやミニPC、Linux機にデスクトップアプリか画面なしのサーバー版を置き、ノートPCとスマホはそこへつなぐ窓にする。第二はVPSで、小さな借り物のLinuxサーバーに同じ環境を置く方法だ。第三はマネージドホスティングで、常時起動する自分専用の機械を事業者に任せ、エージェントや記憶、ルーティンを移す方法である。ノートPCに留まる場合の緩和策もある。作業中はスリープを抑え、途中で眠っても再開時に続きから拾い、逃したルーティンは起床時に一度だけ実行するか、古すぎれば捨てる、といった扱いだ。\n\n必要なもの\n常時起動させる機械（自宅PC、VPS、ホスティングのいずれか）と、スマホやノートPCからその機械へ届く経路が要る。ガイドでは事業者のクラウド経由の接続と、自分のVPN等を経由する接続の両方が紹介され、前者はポートを開けずにどこからでも届き、ロック中のスマホへ通知も届くとされる。\n\n実践のポイント・注意点\n深夜3時の実行や、変化を逃さない監視、常に応答するボットが要るなら常時稼働機が要り、日中の作業の続きを仕上げる程度ならノートPC運用でも足りる、という切り分けが示されている。またホスティング先の機械は自分のMacではないため、自宅PCのファイルや画面、ローカルモデルには届かないという限界も明記されている。移す前に、鍵や秘密情報は移行対象に含まれず入れ直しが必要な点も確認しておきたい。", "2026-11-06", "Bloks", "https://www.bloks.dev/guides/run-ai-agents-24-7/"], ["Museがメキシコへ — 5カ国目で見えた現地コネクター先行の広げ方", "11月5日、Museがメキシコで提供を開始し、対応は5カ国になった。初のスペイン語圏・中南米市場で、対応は18歳以上、iOSとAndroid、muse.ai、WhatsAppだ。映画や小売、旅行、配車・配送など現地サービスの連携が段階的に進むとされ、国ごとに現地連携を束ねてから出すMetaの展開パターンが改めて見えた。日本でも国内連携が段階的にそろった経緯と重ねると、提供開始と全機能提供は別物だと分かる。", "概要\nMetaは2026年11月5日、パーソナルAIエージェントMuseをメキシコで提供開始した。5番目の市場で、中南米では初、スペイン語圏でも初の展開である。これまでの順番は、米国が9月8日、カナダが9月18日、日本が10月23日、シンガポールが10月27日だった。発表はMetaの最高AI責任者Alexandr WangがXで行い、公式Museアカウントも同日に知らせた。専用のニュースルーム記事ではなくSNS発表が起点になった点も、この展開の速さを物語る。\n\n仕組み・手順の詳細\nメキシコではスペイン語で利用でき、対象は18歳以上、入口はiOS、Android、Webのmuse.ai、そしてWhatsAppとされる。無料版と任意のサブスクリプションプランがある。現地コネクターとして、Cinépolis、Coppel、Despegar、Kavak、Kueski、Liverpool、Rappiが挙げられ、映画、小売、旅行、自動車、金融、食品配送をカバーするが、利用可能になるのは段階的で、初日から全てがそろうわけではない。あわせてGmail、Googleカレンダー、Instagramへの接続も紹介されている。MetaはAIグラスへの対応追加も計画しているとされる。\n\n必要なもの\nメキシコで利用できるMuseアカウントと、対応する入口のいずれかが必要になる。英国、EU、その他の中南米諸国については、この時点で日程は発表されていない。ヘルプセンターも「まだどこでも利用できるわけではない」という趣旨にとどまる。\n\n実践のポイント・注意点\nこの事例が日本の利用者にも参考になるのは、国が増えるたびに「グローバルな連携が先、現地連携は後から順に」という順序が繰り返されている点だ。日本でも発表日に名前が挙がった国内サービスが即日使えるとは限らなかった。新しい国や新しい連携のニュースを見たら、名前が出たことと、自分のアカウントの設定画面に実際に接続先が出ていることを分けて確認したい。段階的提供の途中で焦って非公式な回避策に手を出さないことも大切である。", "2026-11-05", "All Things Muse", "https://www.allthingsmuse.com/articles/muse-launches-mexico/"], ["ブラックフライデー前の買い物ルール — 上限・承認・カート監査を先に決める", "11月27日のブラックフライデーを前に、Museでの買い物の実践 tips がまとめられた。Metaの10月21日の決算説明では買い物がMuseで最も多い用途で、米国とカナダで1,000万人超が設定したという。勧めは、頼むのは1件ずつ、価格の上限を先に決める、支払いは毎回承認する、の三点に集約される。AmazonはMuseを遮断している点も明記される。値下げ通知は買う合図ではなく見る合図として扱い、小さな買い物で監査手順を試す提案もある。", "概要\n2026年11月27日のブラックフライデーは、Museにとって初めての大型セール期になる。Metaは10月21日の第3四半期決算説明で、買い物がMuseで最も一般的な用途であり、開始から約6週間で米国とカナダの1,000万人超がエージェントを設定したと投資家に伝えたという。記事は、財布を預ける前にルールを決めるための実践集で、結論は「1回に1件だけ頼む、上限を決める、支払いは毎回承認する」に集約される。\n\n仕組み・手順の詳細\n頼み方のコツは、仕上がりが一文で言える仕事にすることだ。「Walmartで600ドル以下の65インチテレビで一番安いもの」のように店舗と上限と対象を絞れば、承認の記録も1件の買い物と対応して追いやすい。価格は見出し価格ではなく税金と配送料込みの総額で比べるよう求めることが勧められている。接続済み小売としてはWalmartやBest BuyなどがConnectで挙げられた店舗が中心で、支払いは承認が前提になる。新規店舗向けには実際のカード番号ではなく使い捨てのカード番号が発行される仕組みも紹介されているが、それはカード情報の保護であって、間違った商品の承認まで防ぐものではないと釘が刺されている。\n\n必要なもの\nMuseが買い物に使える地域のアカウントと、接続済み小売・支払い手段が前提になる。重要な境界として、Amazonは2026年9月20日からMuseを遮断しているため、Amazon価格の比較は自分でブラウザで見る必要がある。またInstacartの食料品は、Museがカートを作っても支払いはInstacartアプリ側で完了する形で、クーポン等が使えない点も挙げられている。\n\n実践のポイント・注意点\n値下げ通知は「買え」という指示ではなく「見よ」という合図として使うことが勧められる。通知が来たら販売者、返品条件、配送日を店舗側で確かめてから承認する。また本番前に小さな実際の買い物で5分間のカート監査をする提案もある。店舗名、正確な商品、総額、配送日、返品条件を確認し、使わないコネクターは外し、承認した記録を残す。セールの熱気の中で上限や承認を緩めないことが、エージェント買い物の一番の安全策だと記事は結んでいる。", "2026-11-05", "OpenAI Master", "https://openaimaster.com/muse-ai-shopping-tips-black-friday-2026/"], ["永続エージェントの選び方 — Dots・Grok Bot・Muse・Instinctを1つに絞る理由", "チャットで終わらない「永続エージェント」をどう選び、どう迎え入れるかを論じた解説が公開された。記憶が続くこと、会話が一本につながること、PCを閉じてもクラウドで動き続けることが通常のチャットとの違いとされる。比較対象はDots、Grok Bot、Muse、Instinctで、勧めは「1つに決めて使い込む」ことだ。導入では承認なしでできる範囲、成果物の置き場所、PC操作の条件を先に決める点が説かれる。", "概要\n永続エージェントは、言われたことを覚え続け、利用者のコンピュータがオフでもクラウドで働き続け、テキストメッセージのような日常の経路でやり取りする常時稼働型の助手だ。解説では、チャットツールとの違いとして三つの能力が挙げられる。一度説明した手順を覚える永続的な記憶、別々のチャットではなく一本に続く会話、そしてPCを閉じた後もクラウド側で動き続ける常時稼働である。以前は仮想サーバーや専用機が必要で導入に半日かかった例もあったが、新しい世代は必要なときにアクセスを求めてくるため、ターミナル操作なしで始められるとされる。\n\n仕組み・手順の詳細\n選び方では、Dots、Grok Bot、Muse、Instinctの四つが基本的に似ており、価値の源泉である永続的な記憶は、1つのエージェントが長く文脈を知ることで育つため、1つに決めて使い込むことが勧められている。費用をかけずに試す候補として、現在無料とされるMuseやInstinctが挙げられ、すでにChatGPTのチーム向けプランを使う組織ではDotsが選ばれた事例も紹介される。迎え入れ方は新入社員の初日になぞらえられ、承認なしでできること、成果物の置き場所、自分のコンピュータを使ってよい場面を先に決める「オンボーディング」が提案されている。\n\n必要なもの\nまず決めるべきは権限の線引きだ。購入は承認なしではしない、ファイル削除は承認なしではしない、ファイル共有前に確認する、誰かへの送信や約束は承認なしではしない、といった可否のルールが土台として示される。成果物の置き場所として、Drive全体ではなく特定の共有フォルダだけを渡す方法も紹介されている。\n\n実践のポイント・注意点\n「準備は自由に、実行は承認のうえで」という原則が実践の核だ。調査や下準備、考える作業は承認なしで進めてよいが、外の人へ出す、約束するといった行為は必ず止まって聞く。ローカルのコンピュータ操作は、画面を奪い合う場面もあるため、メールや予定のような仕事はまずクラウド側の仮想コンピュータで処理させ、自分の機械を操作してよい条件を限定することも勧められている。浜辺で寝ていても事業が回るという期待は現実ではない、という戒めも添えられている。", "2026-11-03", "Social Media Examiner", "https://www.socialmediaexaminer.com/persistent-ai-agents-how-to-get-started-and-what-to-watch-out-for/"], ["ターミナルで使うMuse Code — 導入からgit diff確認までの安全な第一歩", "ターミナルで動くコーディングエージェントMuse Codeの実践ガイドが、Meta公式ドキュメントを2026年11月2日に確認してまとめられた。平易な言葉で頼むとプロジェクトを読み、変更を提案し、危ない操作の前に止まって聞く。導入、プロジェクト指示の作成、小さなタスク、差分確認までの順序が初心者向けに整理されている。信頼していないリポジトリを安易に信頼しないことや、学習利用の設定確認も含む内容だ。", "概要\nMuse Codeは、Metaのターミナル向けコーディングエージェントだ。平易な言葉でタスクを伝えると、プロジェクトを読み、変更を計画し、ファイルを編集してコマンドを実行し、危ない操作の前には確認を求める。ガイドはMeta自身のドキュメントに基づき、2026年11月2日に確認した内容として、空のターミナルから自分でレビューしたコード変更までの手順を追っている。なお著者はベンチマークを行っていないと明記しており、速度や精度の主張は含まれていない。\n\n仕組み・手順の詳細\n名前の区別が最初に整理される。Muse Sparkは推論を担うモデル群、Muse Codeはそのモデルを使う道具（プログラム）である。文書上の既定モデルはmuse-spark-1.2で、1.3など新しい版も選べる。使い方は三通りあり、対話的に使う対話モード、1件のプロンプトを終えて終了しスクリプトやCIに向くヘッドレスモード、そしてSDKである。クイックスタートは、ワンラインのインストーラで入れ、バージョン確認をし、プロジェクトフォルダで起動してワークスペースを信頼しサインインする、という流れだ。別のターミナルで初期化コマンドをまず試し実行（dry-run）し、それからプロジェクト指示ファイルAGENTS.mdを作る手順も示される。\n\n必要なもの\n対応はmacOS、Linux、Windowsと文書にあり、ターミナル、練習用のプロジェクトフォルダ、サインイン手段が要る。料金は月額サブスクリプションかトークン従量のどちらかとされる。Gitは必須とはされていないが、変更を正確に見るために差分確認用に用意することが前提として勧められている。\n\n実践のポイント・注意点\n最初のタスクは小さく、レビューできる変更に絞り、終わったら必ずgit diffで自分で確認するのがガイドの型だ。信頼していない他人のリポジトリを安易に信頼しないこと、購読でサインインすると既定でオンになるContributorモード（内容を将来のモデル学習に使う代わりに利用枠が増える仕組み）は、顧客や雇用主のコードでは切る判断も紹介されている。まず計画だけ出させて承認してから編集させる進め方が、安全な開始法として挙げられている。", "2026-11-02", "Halearnix", "https://halearnix.com/blog/how-to-use-muse-code"], ["マネーフォワードME連携の読み解き — 参照専用で家計をMuseに相談する", "日本で名前が挙がった3社のうち、マネーフォワードMEだけが連携開始を自ら知らせた。提供元によれば10月24日に案内、26日に発表があり、支出の傾向や資産構成をMuseとの会話で参照できる参照専用連携だ。金融機関の認証情報はMuseと共有されず、いつでも切断できる。メルカリとチケットぴあは11月1日時点でも開始の知らせはない。開始の証拠は提供元自身の発表かアプリ内表示で確かめるべきだという基準も示された。", "概要\n2026年10月23日のMuse日本開始で、Metaは国内パートナーとしてメルカリ、マネーフォワードME、チケットぴあの3社を挙げた。しかし「名前が挙がった」ことと「使える」ことは別だった。追跡記事が11月1日時点の状態として整理したところ、開始を自ら知らせたのはマネーフォワードMEだけである。同社のサポート案内が10月24日にコネクター提供開始を伝え、26日に同社の発表が続いた。一方で、日本のアカウントのアプリ内で実際に見たという報告は、その後の確認でも現れていないとされ、「提供元によれば開始」という一段弱い扱いで記録されている。\n\n仕組み・手順の詳細\n連携はデータ参照専用である。利用者の許可のもとで、MuseはマネーフォワードMEのデータから支出の傾向や資産の構成を振り返り、目標に向けた計画づくりを手伝うことができる。逆に、MEのデータを変更・更新することはできず、金融商品の売買や出金・振替にも使えない。連携している金融機関の認証情報はMuseと共有されず、利用者はいつでも切断できると提供元は説明している。つまり家計の「見る・相談する」はできても「動かす」ことはできない設計だ。\n\n必要なもの\n日本でMuseを利用できるアカウントと、マネーフォワードMEの利用が前提になる。具体的な接続手順は、Museの設定のコネクター画面、またはチャット内から進める案内が提供元側で示されているとされる。\n\n実践のポイント・注意点\nこの事例の読み方は、日本の他の連携にも応用できる。開始の証拠として強いのは、提供元自身の名前と日付のある発表か、自分のアプリ内での実際の表示であり、パートナー一覧や開始時の報道だけでは不十分だという基準が記事では示されている。メルカリについては、決算発表日をめぐる日付の取り違え（11月4日説と同社IRの11月12日）まで検証されており、11月12日は連携開始日ではなく次の確認日でしかない点にも注意が要る。家計データは機微な情報なので、参照専用という範囲と切断方法を先に確かめてからつなぐのが安全である。", "2026-11-01", "Muse Explained", "https://museexplained.com/guide/mercaris-turn-japan-second-connector/"], ["対応国の見分け方 — 日本とシンガポールで何が使え、何が未提供か", "Museが北米の外へ出た日本とシンガポールの状況を整理したガイドが11月1日に更新された。日本は10月23日にiOS、Android、muse.aiで開始し、北米以外では初の市場だった。シンガポールは10月27日に続いた。利用や購読には提供国にいることが必要で、英国やインドなど次の展開先の日程は示されていないとされる。機能が画面に出ないときは故障より提供範囲の差を先に疑う、という確認の順序も学べる事例だ。", "概要\nガイドは2026年11月1日に更新され、Museの米国外展開を整理している。発表済みの国は米国、カナダ、日本、シンガポールの4カ国（その後メキシコが加わる前の時点の整理）で、日本は10月23日（日本時間）にAndroid、iOS、muse.aiで始まり、北米以外では初の市場になった。シンガポールは10月27日にiOS、Android、muse.aiで続いた。英国やインドなど他地域の日程は示されておらず、購読にはMuseが提供されている国にいることが必要だとヘルプセンターの説明を引いて伝えている。\n\n仕組み・手順の詳細\n日本で始まった内容として、入口はMuseアプリ（iOS、Android）とmuse.aiである。連携ではGmail、Googleカレンダー、Instagramに加え、Stripe、Shopify、Trip.com、Agoda、Klookといった国際的なサービスが買い物や旅行の計画・予約に挙げられた。国内サービスでは、メルカリ、マネーフォワードME、チケットぴあとの連携を進めているとされ、発表時点では提供開始とは表現されていなかった。またConnectで示された高度な音声モード、Muse Realtime Avatar（英語のみと注記）、Muse専用のメールアドレスについては、日本での提供は別途知らせるとされた。連携先ごとに許可の範囲を選び、いつでも変更・解除できる点も案内されている。\n\n必要なもの\n提供国にいることと、対応する入口（アプリまたはmuse.ai）、そして使う連携先のアカウントが前提になる。国が増えても、機能や連携は国ごとに段階的にそろうため、「日本でMuseが使える」ことと「発表された全機能が日本で使える」ことは分けて理解する必要がある。\n\n実践のポイント・注意点\n海外ニュースで見た機能が自分の画面にないとき、まず疑うべきは故障ではなく提供範囲の差である。音声やアバターのように後から国別に広がる機能は、公式の国別案内と自分の設定画面で確かめるのが確実だ。逆に、日本開始と同時に使えたGmailやカレンダーのように、土台の連携が国を越えて付いてくる例もある。使いたい機能が「提供国か」「自分のアカウントに出ているか」「連携先が開始済みか」の三段階でどこに引っかかるかを切り分けると、待ち時間を無駄な調査に変えずに済む。", "2026-11-01", "AideDex", "https://aidedex.com/guides/meta-muse-outside-the-us/"], ["Muse WonderとSparkの位置づけ — 長い仕事向けモデルの違いを知る", "MetaのMuseモデル群を整理したガイドが10月30日に更新された。最も高性能とされるMuse Wonderはエージェント用途を強く意識したモデルで、6週間前に出たMuse Spark 1.3から特にエージェント系タスクで大きく伸びたと第三者評価を引いて伝えている。WonderもSparkも非公開モデルで、自分のPCで動かすものではない点も整理される。公開モデルではないため入手して動かすものではなく、製品やAPI経由で使う前提も押さえたい。", "概要\nMetaは主力モデル群をLlamaからMuseへ移した。ガイドは10月30日更新として、Muse WonderとMuse Sparkを中心にモデル群を整理している。WonderはMetaの最も高性能なモデルと位置づけられ、エージェント用途を正面から狙ったものとされる。Artificial Analysisの評価を引き、わずか6週間前に出たMuse Spark 1.3から大きな伸びがあり、伸びが最も大きかったのはエージェント系タスクだったと伝えている。名前が似た製品が並ぶため、モデルとアプリを取り違えない整理がガイドの狙いだ。\n\n仕組み・手順の詳細\nMuse SparkはMuse家系の出発点で、マルチモーダルな推論モデルとして、ツール利用やエージェント的な振る舞いを支え、画像の分析、画像生成の要否判断、ウェブ検索、サブエージェントへの作業分担などを扱う。現在はMuse Spark 1.3の世代にある。ガイドによればWonderとSparkはいずれも非公開の独自モデルで、Hugging Faceからダウンロードしたり自分の機械で動かしたりはできない。同じMuseの名の下には、ローカルでエージェントを動かすための小型の公開モデルMuse Glimmerや、ターミナル向けのMuse Code、そして個人向けエージェントアプリであるMuse本体も並ぶと整理されている。\n\n必要なもの\nWonderやSparkを使う入口は、Meta AIやMuseといった製品、あるいは開発者向けのAPIであり、自分でモデルファイルを入手して運用する形ではない。その前提を理解しておくと、「ローカルで動かしたい」という要望にはGlimmerのような別の系統が対応するという切り分けができる。\n\n実践のポイント・注意点\n長い手順の仕事を任せたい利用者にとって大事なのは、会話の上手さよりも、ツールを使いながら複数段階を進め、途中で立て直せるかどうかだ。ガイドが示す伸びの中心がエージェント系タスクにある点は、その物差しと合う。ただし評価の引用元や前提は記事ごとに異なるため、数字だけでモデルの優劣を断定せず、自分の代表的な仕事で試して比べる姿勢が要る。アプリのMuseとモデルのSparkを混同して設定を探す失敗も、名前の整理だけでかなり減らせる。", "2026-10-30", "Zapier Blog", "https://zapier.com/blog/meta-ai-muse-spark/"], ["コネクターは「発表」と「利用可」を分ける — 54件リストの読み方と日本の波", "Metaはコネクターを波状に追加してきたが、発表リスト同士が食い違うと指摘する一覧が10月25日に更新された。Webアプリで数えた接続先は54件前後で、アカウントごとに表示が違う段階的提供だという。日本では10月23日の開始と同時にKlookが使え、GmailとGoogleカレンダーも日本で動作が確認されたと整理されている。自分のアカウントの設定画面こそが確実な確認先だという、段階的提供ならではの注意も添える。", "概要\nMuseのコネクターは2026年9月8日以降、波状に発表されてきたが、リスト同士が一致しない。一覧記事は10月25日更新として、「今使えるもの」「発表されたがまだ使えないもの」「未確認」を分けて数える読み方を提示している。Webアプリでの実地確認では、9月30日、10月7日、10月15日いずれも54件が数えられ、電話専用などを含めると58〜60件ほどになるという。公式の公開ディレクトリはなく、一覧はアプリの設定の中にあり、アカウントごとに異なり、提供も段階的だとされる。\n\n仕組み・手順の詳細\n10月の動きとして、10月7日にiPadアプリとともにAsana、Canva、Dropbox、Figma、QuickBooks、GitHub、Klaviyo、Zoom、Notion、Granola、Meta広告アカウントなどが拡張リストに挙がったこと、10月22日に1Password for Agentsが始まりMuseが先行対象で順番待ちがあること、10月23日に日本展開とそのコネクターの波が来たことが並べられている。日本ではKlookが初日から利用でき、Trip.comとAgodaも日本で利用でき、Mercari、Money Forward ME、Ticket Piaは当時「近日」とされた。GmailとGoogleカレンダーは日本でも初日に動作が確認されたという。\n\n必要なもの\n自分のアカウントで実際に使えるかは、アプリの設定画面で確認することが唯一確実な方法だと記事は繰り返す。同じ日でも二つのアカウントで違う一覧が出ることがあり、どちらも正しいという段階的提供の前提を理解しておく必要がある。\n\n実践のポイント・注意点\n発表された名前と使える状態は別物だという点が最大の教訓である。PayPalのように発表後も利用できる証拠がないものは「未確認」として扱い、Amazonのように相手側が遮断しているケースはコネクター不足とは分けて考える必要がある。逆にZapier連携のように、1つの接続で多数のアプリへ届く経路もある。業務で使う接続先ほど、ニュースではなく自分の設定画面と提供元の発表の両方で状態を確認する習慣が要る。", "2026-10-25", "Built with Muse", "https://builtwithmuse.com/blog/muse-connectors-list"], ["Muse × Tailscale — 外出先から自宅PCへ仕事を渡す道筋", "MuseとTailscaleの連携を解説した記事です。Museはテイルネットに独立したノードとして参加し、スマホが既にTailscaleを使っていても別個の接続を持ちます。許可されたマシンへのアクセスやSSHの利用が含まれます。一方で、PCに「届く」ことと地元エージェントに依頼が「渡る」ことは別だという整理が核心で、必要なのは到達性、依頼を受け付ける仕組み、実行する権限の3つ。Muse自体は専用クラウドコンピュータ上で動きます。", "概要\nMuseとTailscaleの連携を解説した記事です。外出先でAIアシスタントに頼んだ仕事が、普段使っている自分のコンピュータの上で起きる、という可能性を扱っています。自宅のPCに仕事を渡せれば、外出先ではスマホで頼むだけ、という働き方が見えてきます。\n\n独立ノードとしての参加\nTailscaleによれば、Museはテイルネットに独立したノードとして参加し、スマートフォンが既にTailscaleを使っていても別個の接続を持ちます。テイルネットはTailscaleでつながった自分の機器だけの閉じたネットワーク、ノードはそこに参加する機器や接続の単位です。スマホの接続を借りるのではなく、Muse自身が1つの参加者として現れる、という点が要点です。許可されたマシンへのアクセスやSSHの利用が含まれます。\n\n「届く」と「渡る」は別物\n一方で記事は、PCに「届く」ことと、Codexなどの地元エージェントに依頼が「渡る」ことは別だと注意します。ネットワークで到達できることは、郵便が住所に届くことに似ていますが、届いた依頼を誰が開けて、誰が実行するのかは別の話です。必要なのは、ネットワーク到達性、依頼を受け付ける仕組み、実行する権限の3つです。\n\n前提の確認\nMuse自体は専用のクラウドコンピュータ上で動き、PC接続によってPC上へ移るわけではありません。つまり、Museの居場所はクラウドのままで、接続は「PCで動くMuse」ではなく「クラウドのMuseからPCへ仕事を渡す道」だという理解が正確です。\n\n実践のポイント\n外出先から自宅PCへ仕事を渡したい場合、まず確認すべきはこの3つがそろっているかです。到達の道があるか、受け取る仕組みがPC側にあるか、実行してよい権限の範囲が決まっているか。どこで詰まっているかを、この3分法で切り分けるところから始まります。\n\n自分の環境で確かめる順序\nこの枠組みに沿うなら、確認は到達、受付、権限の順が分かりやすくなります。道があっても受け手がなければ仕事は始まらず、受け手があっても権限の範囲が曖昧では安心して任せられません。3つを別々に点検することで、「なんとなく接続できている」状態から一歩進んだ理解になります。外出先からの依頼がうまく流れるかどうかは、この3点の点検結果でかなり見通せます。", "2026-10-24", "attrip.jp", "https://attrip.jp/?p=227648"], ["PC接続の3要件 — 到達性・受付・権限を分けて考える", "MuseとTailscaleの解説記事が提示した、PC接続を考える枠組みです。要件は3つに分かれます。第1にネットワーク到達性、第2に依頼の受付（地元のワークフローが受け取る仕組み）、第3に実行権限（その仕事を行う許可）です。実装はSSH経由で定義済みプロセスを呼ぶ方法や地元サービスを使う方法など環境によって異なります。記事は実際の接続を検証したものではないと断りつつ、この3分法が詰まりどころの切り分けに有効だとしています。", "概要\nMuseとTailscaleの解説記事が提示した、PC接続を考える枠組みです。「外出先から自宅PCに仕事を渡せるか」という問いは大きく見えますが、3つの要件に分解すると、どこが足りないかを具体的に話せるようになります。\n\n第1の要件: ネットワーク到達性\n第1にネットワーク到達性です。Museから許可されたPC上のサービスへ届くことを指します。道そのものがなければ、その先の話は始まりません。Tailscaleのような仕組みは、この到達の道を用意するためのものです。\n\n第2の要件: 依頼の受付\n第2に依頼の受付です。届いた依頼を、地元のワークフローが受け取る仕組みがあることを指します。PCに届いても、受け取って仕事として扱う受け手がいなければ、依頼はそこで止まります。到達と受付は別の要件であり、この区別が見落とされやすいところです。\n\n第3の要件: 実行権限\n第3に実行権限です。その仕事を行う許可があることを指します。受け取った依頼でも、実行してよい範囲が決まっていなければ、安全に動かすことはできません。権限は広いほど便利な一方、任せる範囲の線引きそのものでもあります。\n\n実装の選択肢と切り分け\n実装は環境によって異なり、SSH経由で定義済みプロセスを呼ぶ方法や、地元サービスを使う方法が考えられます。なお記事は実際の接続や地元エージェントへの引き渡しを検証したものではないと断ったうえで、この3分法が切り分けに有効だとしています。うまくいかないときに「道か、受け手か、権限か」を順に確かめる。この順序が、PC接続の詰まりどころを見つける実践的な手順になります。\n\n枠組みの使い方\nこの3分法は、新しい接続の仕組みが登場したときにも使えます。紹介される機能が、到達、受付、権限のどれを新しく提供するものなのかを見ると、その機
