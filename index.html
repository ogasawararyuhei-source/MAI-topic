<style>

:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;display:flex;flex-direction:column;height:100dvh;overflow:hidden;transition:background .35s ease,color .35s ease}
body::before{content:"";position:fixed;inset:0;background:var(--pattern);pointer-events:none;opacity:var(--pattern-op,.5)}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
[data-theme="steampunk"]{--bg:#e6d7b8;--pattern:radial-gradient(circle at 12% 20%,rgba(141,100,40,.16) 0 26px,transparent 27px),radial-gradient(circle at 88% 78%,rgba(141,100,40,.13) 0 38px,transparent 39px),repeating-linear-gradient(0deg,rgba(90,62,25,.05) 0 1px,transparent 1px 26px);--pattern-op:1;--card:#f8eed3;--ink:#2e2010;--muted:#77603c;--line:#a97f3f;--accent:#9c4a12;--accent2:#2f5d50;--accent-ink:#fff6df;--soft:#efdfba;--old:#97835f;--top-bg:#2a1a0c;--top-ink:#f2dfae;--radius:8px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\2699  \2699  \2699";--shadow:0 14px 34px rgba(62,40,8,.28)}
[data-theme="witch"]{color-scheme:dark;--bg:#161022;--pattern:radial-gradient(circle at 18% 12%,rgba(233,213,255,.20) 0 1.5px,transparent 2.5px),radial-gradient(circle at 72% 22%,rgba(233,213,255,.14) 0 1px,transparent 2px),radial-gradient(circle at 42% 66%,rgba(196,181,253,.12) 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 84%,rgba(233,213,255,.16) 0 1px,transparent 2px),radial-gradient(circle at 6% 88%,rgba(196,181,253,.12) 0 1px,transparent 2px);--pattern-op:1;--card:#241a3d;--ink:#f1eaff;--muted:#bdaee0;--line:#5b4595;--accent:#a678ff;--accent2:#e9d5ff;--accent-ink:#1d1233;--soft:#2f2350;--old:#8d81ad;--top-bg:#0e0919;--top-ink:#efe6ff;--radius:20px;--font-display:"IM Fell English","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\263E  \2726  \263D";--shadow:0 14px 34px rgba(0,0,0,.5)}
[data-theme="dnd"]{--bg:#e7d9b4;--pattern:repeating-linear-gradient(45deg,rgba(158,43,37,.05) 0 2px,transparent 2px 18px),radial-gradient(circle at 85% 10%,rgba(158,43,37,.10) 0 30px,transparent 31px);--pattern-op:1;--card:#f7ecc9;--ink:#332216;--muted:#7d6248;--line:#8c6a3f;--accent:#9e2b25;--accent2:#a97b00;--accent-ink:#fdf3d8;--soft:#eee0b6;--old:#9a8a72;--top-bg:#471611;--top-ink:#f7e7bd;--radius:4px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\265E  \2726  \265E";--shadow:0 14px 30px rgba(71,22,17,.30)}
[data-theme="celtic"]{--bg:#e3dfc6;--pattern:repeating-linear-gradient(0deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px),repeating-linear-gradient(90deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px);--pattern-op:1;--card:#f6f2dc;--ink:#20331e;--muted:#5d7050;--line:#77873f;--accent:#2e6b34;--accent2:#a8842a;--accent-ink:#fbf7e2;--soft:#e7e5c8;--old:#93a086;--top-bg:#17351f;--top-ink:#efeccb;--radius:14px;--font-display:"Uncial Antiqua","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\16DA  \2726  \16DB";--shadow:0 14px 30px rgba(23,53,31,.26)}
[data-theme="greek"]{--bg:#f2eee3;--pattern:repeating-linear-gradient(90deg,rgba(29,95,138,.06) 0 1px,transparent 1px 34px),radial-gradient(circle at 90% 0%,rgba(185,138,28,.10) 0 60px,transparent 61px);--pattern-op:1;--card:#fffdf6;--ink:#1e2c38;--muted:#66727c;--line:#b3923c;--accent:#1d5f8a;--accent2:#b98a1c;--accent-ink:#ffffff;--soft:#ece7d7;--old:#a3a8ad;--top-bg:#fdfbf4;--top-ink:#1e2c38;--radius:2px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\03A9  \2766  \03A9";--shadow:0 14px 30px rgba(30,44,56,.18)}
.top{flex:none;position:relative;z-index:30;background:var(--top-bg);color:var(--top-ink);border-bottom:3px double var(--line)}
.topin{max-width:1080px;margin:auto;padding:10px 16px 4px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.logo{font-family:var(--font-display);font-weight:900;font-size:23px;letter-spacing:.06em}.logo span{color:var(--accent2)}
[data-theme="witch"] .logo span,[data-theme="steampunk"] .logo span{color:var(--accent)}
.date{font-size:10px;opacity:.75;white-space:nowrap}
.topbtns{display:flex;gap:8px;flex:none}.pill{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.themes{max-width:1080px;margin:auto;padding:6px 16px 10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.themes-label{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;opacity:.8}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;opacity:.85}
.theme-btn .gly{margin-right:5px}
.theme-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
.stage-wrap{flex:1;min-height:0;max-width:1080px;width:100%;margin:auto;padding:10px 16px 12px;display:flex;flex-direction:column;position:relative;z-index:1}
.herostrip{flex:none;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;box-shadow:var(--shadow)}
.herostrip img{width:74px;height:52px;object-fit:cover;border-radius:calc(var(--radius) * .6);flex:none}
.herostrip p{margin:0;font-size:13px;color:var(--muted)}.herostrip b{color:var(--ink);font-family:var(--font-display)}
.catbar{flex:none;display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.catbar .navbtn{flex:none}
.catinfo{flex:1;text-align:center;min-width:0}
.catinfo h2{margin:0;font-family:var(--font-display);font-size:clamp(19px,4.6vw,27px);line-height:1.25;letter-spacing:.03em}
.catinfo p{margin:1px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catcount{flex:none;font-size:12px;background:var(--soft);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-weight:700}
.navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800;box-shadow:var(--shadow)}
.navbtn:active{transform:scale(.97)}
.dots{flex:none;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:transparent;padding:0}
.dot.active{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.stage{flex:1;min-height:0;touch-action:none;position:relative}
#cardSlot{height:100%}
.card{height:100%;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
.card::after{content:var(--orn);position:absolute;top:6px;right:12px;font-size:13px;letter-spacing:.3em;color:var(--accent2);opacity:.85;pointer-events:none}
.card.old .ph{filter:grayscale(1)}
.card .ph{width:100%;height:30%;min-height:120px;object-fit:cover;display:block;flex:none}
[data-theme="steampunk"] .card .ph{filter:sepia(.35) contrast(1.05)}
[data-theme="witch"] .card .ph{filter:saturate(.85) hue-rotate(-12deg) brightness(.92)}
[data-theme="dnd"] .card .ph{filter:sepia(.25) saturate(1.1)}
[data-theme="celtic"] .card .ph{filter:saturate(1.05) hue-rotate(6deg)}
[data-theme="greek"] .card .ph{filter:saturate(.92) brightness(1.04)}
.cbody{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.badge{background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:999px;font-weight:800}.badge.oldb{background:var(--old)}
.card h3{margin:0;font-size:clamp(17px,4.4vw,21px);line-height:1.45;font-family:var(--font-display);font-weight:700}
.sum{font-size:14px;color:var(--muted);margin:0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.btn{border:0;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800}
.btn.primary{background:var(--accent);color:var(--accent-ink)}.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.saved{background:var(--accent2);color:var(--accent-ink)}
.src{font-size:11px;color:var(--muted);word-break:break-all}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;color:var(--muted)}
.empty .big{font-size:34px;color:var(--accent2)}
.pager{flex:none;display:flex;align-items:center;gap:10px;margin-top:10px}
.pager .navbtn{flex:1}
.artdots{flex:none;display:flex;gap:5px;max-width:34vw;flex-wrap:wrap;justify-content:center}
.artcount{flex:none;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.hint{flex:none;font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.addcat{flex:none;text-align:center;margin-top:6px}
.addcat button{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700}
@keyframes inNext{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes inDown{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes inUp{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
.anim-next{animation:inNext .28s ease}.anim-prev{animation:inPrev .28s ease}.anim-down{animation:inDown .28s ease}.anim-up{animation:inUp .28s ease}
dialog{border:2px solid var(--line);border-radius:calc(var(--radius) + 6px);padding:0;max-width:min(680px,94vw);width:680px;max-height:92dvh;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,8,4,.6)}
.din{padding:20px;overflow-y:auto;max-height:92dvh}
.din img{width:100%;height:200px;object-fit:cover;border-radius:var(--radius)}
.din h3{font-size:20px;line-height:1.4;margin:12px 0 6px;font-family:var(--font-display)}
.full{font-size:15px;white-space:pre-line}
textarea,input[type="text"]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px}
label.fl{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
.memoBox{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.memoItem{border-top:1px solid var(--line);padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--top-bg);color:var(--top-ink);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:90vw;text-align:center}
@media(max-width:640px){.topin{padding:8px 12px 2px}.themes{padding:4px 12px 8px}.stage-wrap{padding:8px 12px 10px}.herostrip{display:none}.catbar .navbtn{padding:8px 10px;font-size:12px}.card .ph{height:24%;min-height:104px}}
@media(prefers-reduced-motion:reduce){.anim-next,.anim-prev,.anim-down,.anim-up{animation:none}body{transition:none}}

</style>

const DATA = {"ai":[["アリババ、旗艦モデル「Qwen4-Max」を正式公開","アリババのQwenチームが、Qwen4世代の旗艦モデル「Qwen4-Max」を正式に公開した。11月11日のプレビュー公開から5日での一般提供開始で、QwenCloudの従量課金APIから利用できる。入力が100万トークンあたり1.50ドル、出力が4.50ドルで、100万トークンのコンテキストを持つ。2.4兆パラメータの基盤モデルで、コーディングや長時間のエージェント作業を狙う。クラウド経由で提供され、企業向けの業務支援や長時間の自動化に使われる見込みだ。","\n【概要】アリババのQwenチームは、Qwen4世代の旗艦モデル「Qwen4-Max」を正式に公開した。11月11日にToken Plan限定で始まったプレビューから5日での一般提供で、QwenCloudの従量課金API（モデルIDはqwen4-max）から使える。価格は入力が100万トークンあたり1.50ドル、出力が4.50ドル。100万トークンのコンテキスト窓と最大39.3万トークンの出力を持ち、テキスト・画像・動画の入力に対応する。【背景】前世代のQwen3.8-Maxの後継にあたる。プレビューはToken Planの月額サブスクリプション経由だけで、11月25日までの期間限定だった。正式版ではAPIが開かれ、アプリのバックエンドや自動化からも直接呼べるようになった。アリババは基盤モデルを2.4兆パラメータ（トークンあたり71Bが活性化）の疎なMoEと説明している。【詳細】アリババ自身のベンチマークでは、26分野の業務タスクを測るWork360で52.69と、前世代の47.74から改善した。同じタスクのトークン使用量は約24〜35％減り、平均コストは1件あたり4.43ドルから1.67ドルへ約62％下がったという。安全性の指標では、動いて安全なコードの割合が22.0％から31.8％に上がった。長時間のエージェント作業向けに、使える中間版を先に届ける「Live Delivery」も用意され、関連プラグインがオープンソース化された。【ポイント・注意点】ベンチマークはすべてアリババ自身の発表で、独立した検証はこれから。重みは公開されておらず、利用はクラウドAPI経由のみ。小規模なQwen4モデルは「オープンソース化予定」とされるが、名前や時期は未定だ。プレビュー版のモデルIDは11月25日で廃止されるため、使っている場合は正式版のIDへ切り替えが必要になる。導入時は、プレビュー版のモデルIDが11月25日で使えなくなる点に注意したい。料金は利用量に応じて変わるため、長時間の処理では事前に上限を決めておくと安心だ。","2026-11-16","Apidog","https://apidog.com/blog/what-is-qwen-4-max/"],["美団、1.6兆パラメータの「LongCat-2.5」をMITで公開","美団が、エージェント向け大規模モデル「LongCat-2.5」の重みをMITライセンスで公開した。総パラメータ約1.6兆、トークンあたり約48Bが活性化するMoEで、画像も読める。11月2日の発表から2週間弱での公開で、商用利用や再学習も認められる。ただし学習と推論は中国製ハードウェアを前提としており、NVIDIAのGPUで動かす公式の手順はない。公開から間もなく、コミュニティによる検証や移植の動きが注目されている。","\n【概要】美団は11月15日、エージェント向けモデル「LongCat-2.5」の重みをMITライセンスで公開した。総パラメータ約1.6兆、トークンあたり約48Bが活性化する混合専門家（MoE）モデルで、画像の理解にも対応する。11月2日の発表から2週間弱での公開で、商用利用やファインチューニングも認められる。長く多段階の作業、とくにコーディングを想定したモデルだ。【背景】LongCat-2.5は、美団のLongCatシリーズの最新版だ。前世代の2.0は6月30日に重みが公開され、1.6兆パラメータという規模はそのままに、2.5では画像・動画の入力と、長時間のエージェント作業に向けた学習が加わった。発表当初はAPI経由での提供だけで、重みは「近日公開」とされていた。【詳細】美団の発表では、Terminal-Benchのスコアが88.4で、Claude Opus 5のすぐ後ろにつけるという。ただしこれは美団自身の測定で、独立した再現はまだない。学習とファインチューニングは中国製アクセラレータだけで行われ、前世代の2.0は5万枚以上の中国製AIチップで学習されたという。参考の配備構成はファーウェイのAscend Atlas A2を194基使うものだ。美団はAPI経由での提供も続けており、重みの公開で研究者や開発者が自分の環境で試せるようになった。ただ、対応するハードウェアが限られるため、手元のGPUで動かすにはコミュニティによる移植や変換の進み具合が鍵になる。Terminal-Benchの88.4という数字も、再現実験を待つ必要がある。【ポイント・注意点】「オープン」には大きなただし書きがある。NVIDIAのGPUで動かす公式の手順がなく、ほとんどの開発者の手元の環境ではそのまま動かせない。現実的な利用は美団のAPI経由で、開始時の価格は入力が100万トークンあたり約0.27ユーロ、出力が約1.07ユーロとされる。ベンチマークの再現と、コミュニティによるNVIDIA向け移植が今後の見どころだ。","2026-11-15","dev.to","https://dev.to/paullovelace/longcat-25s-weights-are-now-open-a-16t-parameter-agent-model-trained-without-a-single-nvidia-50ko"],["ユナイテッド航空、AIエージェントの予約代行を禁止","ユナイテッド航空は11月11日、第三者の個人向けAIエージェントによる航空券の予約・変更・購入を禁止すると発表した。運送約款を改定し、AIエージェントが関わった予約は予告なしに取り消せるようにした。米国の大手航空会社として初の公式な制限で、AIにログイン情報を渡すことによる情報漏えいや、意図しない購入、連邦規則違反の恐れを理由に挙げている。他社が追随するか、認可された形での連携が今後出てくるかが注目される。","\n【概要】ユナイテッド航空は11月11日、第三者の個人向けAIエージェントが航空券の予約・変更・購入などを行うことを禁止すると発表した。運送約款を同日付で改定し、AIエージェントが関わった予約は予告なしに取り消せる条項も加えた。米国の大手航空会社がこうした制限を公式に打ち出すのは初めてで、11月11日より前の予約は取り消さないとしている。【背景】背景には、ChatGPTの「Dots」やMetaの「Muse」など、利用者に代わって買い物や手続きをする個人向けエージェントの広がりがある。航空券の検索や予約は、エージェントが活躍する代表的な場面とみられてきた。一方で航空会社側は、ログイン情報の受け渡しや自動化された大量検索のコストを懸念してきた。デルタ航空も先月、同様のツールを遮断していると報じられていた。【詳細】改定された約款の規則6.J.6は、禁止行為の一覧に「AIエージェントを使って航空券を作成・変更・処理すること、またサービスや商品を購入すること」を加えた。規則5.Hは、AIエージェントが作成・変更・処理した予約を取り消せる対象に加えた。対象は自社のサイトやアプリだけでなく、旅行代理店や予約サイト経由の利用も含む。定義は広く、AIアシスタントやAI対応ブラウザも含まれる。航空業界では、自動化された検索がサイトに負荷をかける問題も以前から指摘されてきた。ユナイテッドは今回の改定で、人の手による予約とAIによる代行の線を明確に引いた。利用者は、AIに計画を立てさせても、予約の確定は自分で行う運用が求められる。【ポイント・注意点】禁止は利用者が監督したり承認したりした場合でも適用される。理由としてユナイテッドは、ログイン情報の共有による情報漏えい、意図しない購入やマイルの使用、チェックイン時の危険物確認など連邦規則への抵触の恐れを挙げた。AIでの旅行の計画や運賃の検索自体は引き続き可能だ。同社は将来、認可した形での連携を検討するとしており、他社が追随するかが注目される。今後の動きに注目したい。","2026-11-12","Simple Flying","https://simpleflying.com/united-airlines-bans-ai-agents-booking-flights-check-in/"],["Google、Antigravityに2モデル連携「Orchestrator」追加","Googleは11月12日、AI開発環境Antigravityに新モード「Orchestrator」を追加した。計画と見直しはGemini 4 Carbon、実装はGemini 4 Hydrogenと、1つの会話の中で2つのモデルを自動で切り替える。Googleの計測では、Carbon単独と同等の成功率で、使用量が平均24％少なく、19％速く終わったという。同日、Hydrogenの単独利用も始まった。","\n【概要】Googleは11月12日、AI開発環境Antigravityに、2つのGemini 4モデルを自動で使い分ける新モード「Orchestrator」を追加した。計画と見直しはGemini 4 Carbon、実装はGemini 4 Hydrogenが担い、1つの会話の中で役割が切り替わる。同日、Hydrogenの単独利用も始まった。長いコーディング作業を、モデルの切り替えなしで進める狙いだ。【背景】Antigravityは5月にマルチエージェント対応の開発環境へ広がり、11月10日のCarbon公開では複数エージェントを並行させる「/swarm」のプレビューも始まった。Orchestratorは並行ではなく、1つの会話の中で計画役と実行役を交代させる方式だ。Hydrogenは日常的なコーディングとツール利用向けの軽量・高速モデルとして位置づけられる。【詳細】仕組みはこうだ。利用者のメッセージごとに、まずCarbonが計画を立て、Hydrogenがファイル変更やビルド、テストを行う。検証に2回失敗したり判断が決まらなかったりすると、会話の状態がCarbonに戻り、計画を修正して再びHydrogenへ渡す。Googleの計測では、Carbon単独とほぼ同じ成功率で、使用量が平均24％少なく、19％速く終わったという。Hydrogen単独では、従来の高速モデルより2.5倍速くタスクを終えるとしている。【ポイント・注意点】利用条件には注意が必要だ。HydrogenはGoogle AI ProとUltraの加入者向け、OrchestratorはUltra向けとされ、無料アカウントでの扱いは資料によって食い違う。HydrogenのAPI価格は入力が100万トークンあたり1.50ドル、出力が7.50ドル。Orchestratorでは推論の深さを選べず、固定の設定で動く。成果の数字はGoogle自身の計測で、自分の作業での効果は試して確かめたい。無料プランでの扱いは資料によって食い違うため、自分のプランで使えるか事前に確かめたい。長い作業を任せる場合は、途中で計画が切り替わる挙動も含めて、小さな課題から試すのが無難だ。","2026-11-12","WinBuzzer","https://winbuzzer.com/2026/11/12/google-antigravity-pairs-gemini-4-models-for-coding-xcxwbn/"],["サウジHUMAIN、3兆パラメータの公開モデルを12月に投入","サウジアラビアの国営AI企業HUMAINのタレク・アミンCEOは11月12日、同社のAIスタック全体を12月15日に国内で提供すると発表した。目玉は3兆パラメータのオープンモデルで、世界最大の公開重みモデルだと主張する。国外のモデルよりコストとトークン消費が88％少ないとも述べており、AI教育プラットフォーム「HUMAIN+」は2027年第1四半期に本格始動する。","\n【概要】サウジアラビアの国営AI企業HUMAINのタレク・アミンCEOは11月12日、同社のAIスタック全体を12月15日に国内で提供すると発表した。目玉は3兆パラメータのオープンモデルで、CEOは「世界最大の公開重みモデル」と述べた。国外のモデルと比べ、コストとトークン消費が88％少ないとも主張している。AI教育プラットフォーム「HUMAIN+」は2027年第1四半期に本格始動する予定だ。【背景】HUMAINはサウジの政府系ファンドPIFが出資し、2025年5月に設立された。データセンター、クラウド、モデルまでを自国で持つ「主権AI」を掲げている。今回の発表はリヤドの本社で行われたHUMAIN+の発表会の場で、CEOは約15か月でスタック全体を築いたと説明した。AWSのサウジ初リージョンも12月に始まる予定だ。【詳細】CEOの発言によれば、モデルとインフラは12月15日にそろう。ソフトウェアもクラウド推論も運用も「すべてサウジ人が作り、動かす」と強調した。ただ、モデルの名前は明かされず、ベンチマーク結果や価格、国外からの利用可否も示されていない。HUMAIN+はリヤドのキャンパスで年約1,500人を収容し、役割別の学習や分野別の実習室を備えるという。サウジはデータセンターやクラウドへの投資を続けており、HUMAINはその中核を担う。今回の発表は、モデルだけでなくインフラや教育までを一つの発表にまとめた点が特徴だ。ただ、具体的な中身が示されていないため、12月15日の提供開始時に何が届くかを見極める必要がある。【ポイント・注意点】「88％少ない」という数字は、比較対象のモデル名も示されていないCEOの主張で、独立した検証はない。3兆パラメータという規模も、重みの公開条件やライセンスが未定の段階だ。同社が9月に発表したアラビア語モデル「humain-m3」（428B）も、重みはまだ公開されていない。12月15日に何が実際に届くかが、主張を確かめる最初の試金石になる。12月の提供開始が注目される。","2026-11-12","Arab News","https://www.arabnews.com/saudi-arabia/humain-ceo-unveils-december-ai-stack-rollout-humain-launch-plans-for-2027-3011422"],["OpenAI、ChatGPT内に企業の公式プロフィールを開設","OpenAIは11月10日、ChatGPT内に企業が公式プロフィールを登録できる「Businesses in ChatGPT」をベータで始めた。Business Hubで情報を管理し、言及回数やクリック数などの集計を確認できる。米国の対象企業は、顧客と話す「Business Agent」も出せる。週12億人が使うChatGPTを、企業の顔が見える場所に変える動きだ。","\n【概要】OpenAIは11月10日、企業がChatGPT内に公式プロフィールを登録できる「Businesses in ChatGPT」をベータで始めた。管理画面のBusiness Hubで情報を修正し、ChatGPTの回答でどれだけ言及されたかなどの集計を見られる。米国の対象企業は、顧客と対話する「Business Agent」も出せる。週12億人が使うとされるChatGPTを、企業の顔が見える場所に変える動きだ。【背景】これまでChatGPTの回答に出る企業情報は、企業側が管理できないものだった。Google検索のビジネスプロフィールのように、情報を正して表示を整えたいという要望があった。OpenAIは9月から一部の広告主向けに「Sponsored Agents」の試験も始めており、広告事業は年10億ドルの規模に達したと報じられている。【詳細】登録は電話、メール、DNSのTXTレコード、Shopify経由などで行い、本人確認を経て青いチェックマークがつく。集計では言及回数、サイトへのクリック、「発見トピック」を過去28日分見られる。Business Agentは米国のeコマースやオンラインサービス企業が対象で、商品やポリシーの情報をもとに顧客の質問に答える。購入や予約の完了はまだできない。ChatGPTが買い物や相談の入口になりつつある中で、企業側も公式の顔を持つ必要が出てきた。OpenAIは広告とエージェントを組み合わせ、検索広告に近い収益の柱に育てたい考えとみられる。利用者にとっては、公式マークの有無が情報の信頼性を見分ける手がかりになる。【ポイント・注意点】登録しても表示や売上が増える保証はないとOpenAIは明言しており、ChatGPTは引き続き独自に推薦や比較を行う。企業は個々の会話内容は見られず、集計は一定量を超えてから表示される。エージェントはAIであることを明示し、価格や在庫の正確さを保つなどの規則がある。登録は無料で始まったが、将来の課金は否定されていない。","2026-11-11","Nullbot","https://www.nullbot.ai/en/actu/chatgpt-business-hub-agents/"],["Google、文章を生成しない判定専用「Gemini Decisions API」","Googleは11月11日、文章を生成せずに質問へ答える「Gemini Decisions API」を公開した。専用モデル「gemini-decision-1」が、1つの入力に対して最大1,000件の質問を一度に判定し、確率と信頼度を返す。入力は100万トークンあたり0.10ドルで、出力は常に0トークンのため無料。分類や振り分け、採点など、決まった答えがほしい場面に向く。","\n【概要】Googleは11月11日、文章を生成せずに質問へ答える「Gemini Decisions API」を公開した。専用モデル「gemini-decision-1」が、1つの入力に対して最大1,000件の質問を一度に判定し、確率と信頼度を返す。入力は100万トークンあたり0.10ドルで、出力は常に0トークンのため無料だ。分類や振り分け、採点など、決まった答えがほしい場面に向く。【背景】従来、こうした判定は生成モデルにJSONで答えさせるのが一般的だった。出力トークンの費用がかかり、形式が崩れることもあった。OpenAIも10月に似た判定用APIを出しており、判定だけを担う専用モデルの流れが広がっている。Googleは「生成の手間を省き、数値で分岐できる」点を売りにしている。【詳細】質問は3種類ある。真偽を問う「noul」は0.01〜0.99の確率を返し、選択肢から選ぶ「choice」は2〜255の選択肢に対応し、段階評価の「score」は順序つきの目盛りで採点する。入力はテキスト、画像、音声、動画、PDFに対応し、共有する入力と質問を合わせて26万2144トークンまで。レイテンシは中央値で50〜100ミリ秒、全体で150〜250ミリ秒とされる。専用エンドポイントのPOST /v1beta/decisionsで呼び、SDKはgoogle-genai 3.2以降に対応する。【ポイント・注意点】無料枠は毎分200リクエスト、毎分5万トークン、毎日1万リクエスト。Vertex AI（Google Cloud）への対応は「近日中」で、現時点では開発者向けAPIのみ。バッチAPIやコンテキストキャッシュには非対応で、繰り返し送ると都度課金される。Googleは自社ベンチマークで最も較正誤差が小さいと主張するが、これは自社の数字だ。信頼度のしきい値は自分のデータで決めるのが前提とされている。導入時は、信頼度のしきい値を自分のデータで調整し、誤判定の影響が大きい場面では人の確認を挟む運用が望ましい。無料枠の範囲内で試せるため、まずは小規模な分類から始めるのがよい。","2026-11-11","Apidog","https://apidog.com/blog/gemini-decisions-api/"],["DeepMind、AIエージェントがSignalの暗号を数学的に検証","Google DeepMindは11月10日、AIエージェントによる形式検証の枠組み「AlphaProof Code」を発表した。Signalの暗号プロトコルの実装コードを対象に、約650万行のLeanによる証明を4週間で生成し、転送秘密性などの性質が成り立つことを機械的に確かめた。検証の成果物は公開され、対象は1対1のセッションに限られる。検証の成果物は公開され、他の重要システムへの応用も検討されている。","\n【概要】Google DeepMindは11月10日、AIエージェントによる形式検証の枠組み「AlphaProof Code」を発表した。Signalの暗号プロトコルの実装コードを対象に、約650万行のLeanによる証明を4週間で生成し、転送秘密性や認証などの性質が成り立つことを機械的に確かめた。設計図ではなく、実際に動くコードを検証した点が新しい。検証の成果物は公開されている。【背景】形式検証は、コードが仕様通り動くことを数学的に証明する最も厳しい保証だが、手間がかかりすぎて広がらなかった。暗号プロトコルはこれまで設計レベルの検証が中心で、実装とのずれが弱点になっていた。DeepMindは、人が「何を証明するか」を決め、エージェントのチームが証明を書く体制を組んだ。【詳細】対象はlibsignal v0.105.4とSPQR v1.6.0で、標準のRustコンパイラで作ったAArch64向けの実行ファイルを検証した。Gemini Carbonなどを動かしたエージェントが、約2.6万行の仕様をもとに証明を書き、Leanがすべて機械的に検査した。証明の対象はPQXDHハンドシェイクとTriple Ratchetによる1対1のセッションで、10の定理が示された。検証のため、過去に修正済みのバグを2件わざと戻したところ、システムはその版が安全でないことを証明できたという。形式検証はこれまで専門家の手作業が中心で、1つのプロトコルに数か月から数年かかることもあった。AIが証明の大部分を担うことで、検証の対象を広げられる可能性が出てきた。Signalの採用は、暗号の安全性を裏づける実例として注目される。【ポイント・注意点】対象は1対1のセッションに限られ、グループチャットや鍵生成、複数デバイスの状態は範囲外だ。SPQRの量子耐性の回復性についても証明されていない。SignalのCTOは「コードのプライバシー保証への信頼がさらに高まる」と述べた。DeepMindは、医療機器のファームウェアや電力網のソフトなど、他の重要システムへの応用を目指している。","2026-11-10","Google DeepMind","https://deepmind.google/blog/introducing-alphaproof-code/"],["Anthropic、Claudeに表計算とホワイトボードを追加","Anthropicは11月10日、Claudeに「Claude Sheets」と「Claude Whiteboards」をベータで追加し、ダッシュボード製品を「Claude Data」として正式提供に移した。表計算や共有ボードをClaudeの中で作り、チームで編集し続けられる。有料プランで利用でき、Teamでは既定で有効、EnterpriseではSheetsとWhiteboardsは既定で無効になっている。","\n【概要】Anthropicは11月10日、Claudeに「Claude Sheets」と「Claude Whiteboards」をベータで追加し、ダッシュボード製品を「Claude Data」として正式提供に移した。表計算や共有ボードをClaudeの中で作り、チームで編集し続けられる。有料プランで利用でき、Teamでは既定で有効、EnterpriseではSheetsとWhiteboardsは既定で無効になっている。【背景】これまでClaudeが作った資料は、別のアプリへ移すとClaudeの手が届かなくなった。Anthropicは、企画から表計算、報告までをClaudeの中で回す「オフィススイート化」を進めている。同じ日に、相手先アプリをClaudeの横に開く「インタラクティブコネクタ」も広げられた。Microsoft 365やGoogle Workspaceへの対抗とみられている。【詳細】Sheetsは、1つの指示からタブや数式、書式、ドロップダウン付きの表を作り、セル単位で編集して変更点を説明する。xlsxやCSVへ書き出せる。Whiteboardsは、話し合った計画をタイムラインや担当者付きのボードにし、LucidやMiroなどへ送ることもできる。DataはRedshiftやBigQuery、Salesforceなどとつなぎ、自然文の質問からダッシュボードを作る。認定済みのクエリやライブ共有はベータのままだ。【ポイント・注意点】Sheetsは現状「シンプル」な機能にとどまるとAnthropic自身が述べており、Excelの全機能を求める場合は書き出しやExcel用アドインを使う。Claude Meetingsは同じ日に発表されたが、Anthropicの資料では「近日公開」とされ、提供状況は報道と食い違う。料金はベータ期間中の追加費用は示されておらず、会議中の文書やボードは2027年2月10日まで無料とされる。導入時は、自分のプランでどの機能が既定で有効かを確認しておきたい。既存の表計算ソフトと比べると機能は控えめなため、複雑な表は書き出して使う運用が現実的だ。","2026-11-10","Unite.AI","https://www.unite.ai/anthropic-launches-claude-whiteboards-and-sheets-in-beta/"],["Google、図面や資料を読むAIの新ベンチマーク「MKA」公開","Google DeepMindとArtificial Analysisは11月10日、AIエージェントの実務力を測る新ベンチマーク「MKA」を公開した。図面や設計書、臨床スキャンなど視覚的な資料を読み、報告書や表計算、スライドなどの成果物を作る200件の課題で評価する。Gemini 4 Carbonは品質2位で、首位のモデルより平均6分の1のコストで課題を終えたという。","\n【概要】Google DeepMindとArtificial Analysisは11月10日、AIエージェントの実務力を測る新ベンチマーク「MKA（Multimodal Knowledge Agent）」を公開した。図面や設計書、臨床スキャンなど視覚的な資料を読み、報告書や表計算、スライドなどの成果物を作る200件の課題で評価する。Gemini 4 Carbonは品質2位で、首位のモデルより平均6分の1のコストで課題を終えたという。【背景】従来の知識労働のベンチマークは、文章だけでも解けるものが多かった。しかし実際の仕事は、図面や表、レイアウトを読む場面が多い。そこでDeepMindは、10分野・83職種の専門家と組み、熟練者が3〜8時間かける多段階の課題を作った。各課題には約70項目の判定基準があり、事実の正確さを75％、見た目の出来を25％の重みで評価する。【詳細】評価はArtificial Analysisが運用し、200件の課題は非公開で、漏えいを防ぐため自社で実行する。公開された10件のサンプル課題はHugging Faceで見られる。共通のオープンソースの実行環境「Stirrup」で全モデルを同じ条件で動かし、Google以外のモデルで作った自動採点が成果物を判定する。専門家が自分で採点した場合との一致率は96％だったという。難しい基準での達成率は、首位のClaude Fable 5.2が57％、Gemini 4 Carbonが54％、Claude Opus 5.5が53％だった。【ポイント・注意点】結果はGoogle自身の発表で、とくに自社モデルの順位には割り引いて読む必要がある。200件の課題は非公開のため、外部が再現しにくい。文章やテキストファイルの出力はどのモデルも52％を超えず、苦手分野が残る。とはいえ、視覚資料を読む力を測る物差しができた意味は大きく、エージェントの実務導入を比べる基準になりそうだ。課題が非公開のため外部からの再現は難しいが、公開された10件のサンプルで評価の雰囲気は確かめられる。エージェント導入を検討する際は、自社の資料で試す比較とあわせて参考にしたい。","2026-11-10","Google","https://blog.google/innovation-and-ai/models-and-research/gemini-models/multimodal-knowledge-agent-benchmark/"]],"gh-pop":[["「arcane」：誰でも使えるモダンなDocker管理画面","Dockerの管理をブラウザで行う「arcane」が、GitHubのデイリートレンドに上がった。コンテナやCompose、イメージ、ボリュームを1つの画面で扱えるセルフホスト型ツールで、GoのバックエンドとSvelteKitの画面で作られている。2025年4月に生まれ、約8,500スターを集める。v3が現在の主軸で、コマンドライン版も用意されている。日本語を含む多言語対応も進められている。","\n【概要】Dockerの管理をブラウザで行う「arcane」が、GitHubのデイリートレンドに上がった。コンテナやCompose、イメージ、ボリュームを1つの画面で扱えるセルフホスト型のツールで、GoのバックエンドとSvelteKitの画面で作られている。2025年4月に生まれ、約8,500スターと350超のフォークを集める。現在の主軸はv3で、コマンドライン版も用意されている。【背景】Dockerの操作はコマンドラインが基本だが、複数のコンテナやネットワーク、ボリュームを日常的に触る人には画面があると楽だ。Portainerのような先行ツールがある中で、arcaneは「誰でも使えるモダンな管理」を掲げ、AIエージェント向けの利用も意識した設計を進めている。BSD-3-Clauseで公開されている。【詳細】機能は、コンテナの起動・停止やログの確認、Composeプロジェクトの管理、イメージやボリューム、ネットワークの操作が中心だ。セットアップはDockerで動かし、設定ファイルや環境変数で調整する。セキュリティ面では、利用状況をまとめたSBOM（ソフトウェア部品表）を公開している。翻訳はCrowdinで進められており、リリースは114件、タグは285件にのぼる。管理画面があることで、コンテナの状態を一覧で把握しやすく、ログの確認や再起動も画面から行える。チームでサーバーを共有する場合、誰が何を操作したかを画面で追える点も利点になる。導入はDockerで1つのコンテナを起動する形が基本だ。【ポイント・注意点】v3が現在の主軸で、2.x系は別ブランチに残る。機能要望はDiscussionsで受け付け、Issuesはバグ報告専用としている。導入前に、自分の環境で求める機能がそろっているか、ドキュメントで確かめたい。セルフホスト型のため、公開する場合は認証やネットワークの扱いに注意が必要だ。公開する場合は、認証を必ず設定し、社内ネットワークだけに限定するなどの対策が要る。v2系からの移行では、設定の互換性を事前に確認しておきたい。","2026-11-16","GitHub","https://github.com/getarcaneapp/arcane"],["「jiangshan-map」：中国2400年の歴史を地図でたどる","中国の歴史を地図上でたどる「jiangshan-map」が、GitHubのデイリートレンドに上がった。紀元前403年の戦国時代から現在まで、18の時代と198の領土スナップショットを収めた対話型の歴史地図だ。都市の変遷や人物の足跡、詩の舞台もたどれ、約6,600スターを集めている。日本語のREADMEも用意されている。地図データはGeoJSONで書き出せ、他のツールでも使える。","\n【概要】中国の歴史を地図上でたどる「jiangshan-map」が、GitHubのデイリートレンドに上がった。紀元前403年の戦国時代から現在まで、18の時代と198の領土スナップショットを収めた対話型の歴史地図だ。都市の変遷や人物の足跡、詩の舞台もたどることができ、約6,600スターと700超のフォークを集めている。日本語のREADMEも用意されている。【背景】歴史の教科書の地図は静止画だが、領土は時代とともに変わる。このプロジェクトは、タイムラインをなぞるだけで版図の移り変わりが見える地図を目指した。作者は中国史の愛好者で、都市の系譜や詩人の旅路までを1つの地図に載せた。GPL-3.0で公開されている。【詳細】地図は羊皮紙風の見た目で、時代を進めると黄河の流路や万里の長城、運河、シルクロードも変化する。都市をクリックすると、2400年にわたる行政の系譜や出来事が表示され、長安のように名前が何度も変わった都市も追える。人物の年代記では、始皇帝や張騫、李白、蘇軾などの足跡を地図上でたどれる。AIエージェント向けの連携機能として、URLでの指定やブラウザ内API、MCPも備える。歴史の流れを地図で見ることで、王朝の盛衰や都市の移り変わりが直感的に理解できる。学校の授業や独学の教材としても使いやすい。タイムラインを動かすだけで時代が進むため、子どもと一緒に歴史をたどる使い方もできる。【ポイント・注意点】データの出典はプロジェクト内の資料にまとめられているが、歴史の解釈には幅があるため、学術的な利用では原典の確認が必要だ。動作はブラウザだけで、Dockerでも動かせる。音声読み上げはブラウザの音声合成に依存する。地図データはGeoJSONで書き出せるため、他の地図ツールでの利用も可能だ。データの出典はプロジェクト内にまとめられているが、解釈の違いもあるため、学術的な引用には原典の確認が必要だ。音声読み上げはブラウザの機能に依存する点にも注意したい。ブラウザだけで動くため、気軽に試せる。","2026-11-16","GitHub","https://github.com/DeanChensj/jiangshan-map"],["「stitch-skills」：Stitchと連携するデザイン用スキル集","Googleのデザイン生成サービスStitchと連携する「stitch-skills」が、GitHubのデイリートレンドに上がった。Agent Skillsの公開標準に沿ったスキル集で、デザイン生成やReactへの変換、画面の抽出などをコーディングエージェントに教える。約9,600スターを集め、CodexやClaude Code、Cursorなどに対応する。","\n【概要】Googleのデザイン生成サービスStitchと連携する「stitch-skills」が、GitHubのデイリートレンドに上がった。Agent Skillsの公開標準に沿ったスキル集で、デザイン生成やReactへの変換、画面の抽出などをコーディングエージェントに教える。約9,600スターと1,200超のフォークを集め、CodexやClaude Code、Cursor、OpenCodeなどに対応する。Apache-2.0で公開されている。【背景】AIに画面を作らせる流れが広がる中で、生成したデザインをそのまま開発に回す仕組みが求められている。GoogleのStitchは、文章や画像からUI画面を作るサービスで、MCPサーバー経由でエージェントと連携する。このスキル集は、そのStitchをエージェントが使いこなすための手順書にあたる。【詳細】スキルは3つのプラグインに分かれる。デザインでは画面の生成や編集、デザインシステムの管理、コードからの抽出を行う。ビルドではStitchの画面をReactやReact Native、Viteのダッシュボードへ変換し、shadcn/uiとの連携も扱う。ユーティリティでは指示文の改善やDESIGN.mdの生成、複数ページのサイト生成を担う。導入はマーケットプレイス経由か、npxでのインストールだ。デザインから実装への流れが短くなることで、試作の回数が増やせる。エージェントが画面を作り、人が仕上げを確認する分業が進めば、開発の速度はさらに上がるだろう。Google以外のエージェントでも使える点が、普及を後押ししている。【ポイント・注意点】利用にはStitchのMCPサーバーの設定が前提で、Stitch側のアカウントや認証が別途必要だ。このプロジェクトはGoogleの公式サポート対象外と明記されている。スキル同士に依存関係があるため、個別に取り出す場合は依存先も一緒に含める必要がある。OpenCodeでは名前の形式など、一部手直しが要る点にも注意したい。","2026-11-16","GitHub","https://github.com/google-labs-code/stitch-skills"],["「last30days-skill」：SNSの声から直近30日を調べるAI","RedditやX、YouTube、Hacker Newsなどを横断して直近30日を調べる「last30days-skill」が、GitHubのデイリートレンドに上がった。約6.8万スターを集める人気のエージェントスキルで、編集者ではなく人々の反応を手がかりに要約を作る。Claude CodeやCodex、Cursorなど50以上の環境に対応する。日本語のREADMEも用意されている。","\n【概要】RedditやX、YouTube、Hacker Newsなどを横断して直近30日を調べる「last30days-skill」が、GitHubのデイリートレンドに上がった。約6.8万スターと約6,000のフォークを集める人気のエージェントスキルで、編集者ではなく人々の反応を手がかりに要約を作る。Claude CodeやCodex、Cursorなど50以上の環境に対応する。MITライセンスで公開されている。【背景】AIの知識は数か月遅れがちで、最新動向はRedditやXの議論が先に拾うことが多い。ただ各サービスは壁に囲まれ、1つのAIでは横断できなかった。このスキルは、利用者自身の鍵やブラウザセッションを持ち込むことで、複数の情報源を一度に調べ、根拠つきの要約にまとめる。【詳細】対象はReddit、X、YouTube、TikTok、Instagram、Hacker News、Polymarket、arXiv、Techmeme、LinkedInなど多岐にわたる。Redditの支持数やXの「いいね」、YouTubeの全文書き起こし、Polymarketの賭け率といった、人々の関心を示す数字で重みづける。設定なしでRedditやHacker News、GitHubはすぐ使え、XやYouTubeなどは初回設定で鍵を入れる。会議前の人物調査や採用動向の把握、特許の調査にも使えるという。最新情報の収集は、ニュースサイトだけでなくSNSの議論まで広げることで、話題の温度感までつかめる。投資判断や採用動向の調査では、数字の裏づけがある要約が役立つ。ただし、情報源によっては偏りもあるため、複数の場所で確かめる姿勢が大切だ。【ポイント・注意点】XやTikTokなど一部の情報源は認証や別ツールの導入が必要で、鍵は自分の管理になる。収集する情報には個人の投稿も含まれるため、扱いには配慮が要る。要約はAIの判断によるもので、元投稿の確認なしに引用しないほうがよい。日本語のREADMEも用意されている。","2026-11-16","GitHub","https://github.com/mvanhorn/last30days-skill"],["「SkillEvaluator」：AIスキルの質を3段階で測るNVIDIA製ツール","AIエージェントの「スキル」の質を測るNVIDIA製ツール「SkillEvaluator」が、GitHubのデイリートレンドに上がった。品質チェック、重複の検出、実際のエージェントでの評価という3段階で、スキルが作業に役立つかを測る。約2,350スターで、Apache-2.0で公開されている。pipやuvから導入でき、CIへの組み込みにも対応する。導入の判断材料になる。","\n【概要】AIエージェントの「スキル」の質を測るNVIDIA製ツール「SkillEvaluator」が、GitHubのデイリートレンドに上がった。品質チェック、重複の検出、実際のエージェントでの評価という3段階で、スキルが作業に役立つかを測る。約2,350スターを集め、Apache-2.0で公開されている。Python製で、pipやuvから導入できる。【背景】エージェントに手順を教える「スキル」が増える中で、質のばらつきや重複、安全性の問題が目立ってきた。NVIDIAは、スキルを検証する枠組みとしてこのツールを出し、論文も公開している。スキルが増えるほど、導入前のチェックの価値が高まっている。【詳細】第1段階では、形式や安全性、実行環境との適合を静的に検査し、100点満点で採点する。LLMなしでも動き、例では88.8点が出たという。第2段階では、埋め込みでスキル同士の重なりを調べ、重複を報告する。第3段階では、サンドボックスでエージェントを実際に動かし、スキルありとなしで結果を比べる。CIへの組み込みや、エージェントから直接呼ぶ使い方も用意されている。スキルが増えるほど、どれが本当に役立つかを見極めるのが難しくなる。評価の枠組みがあれば、質の低いスキルを導入前に弾ける。NVIDIAが論文まで出している点からも、エージェントの品質管理への関心の高まりがうかがえる。導入前のチェックは、チームでスキルを共有する際の安心材料にもなる。【ポイント・注意点】対応状況は「実験的」とされ、コミュニティ対応でSLAはない。フル機能には外部スキャナやLLMの提供者、Dockerの用意が必要で、実行環境の準備が要る。評価にはモデル利用料がかかる場合がある。スキルを作る側も使う側も、まず第1段階の品質チェックから試すのが無難だ。フル機能を使うにはDockerや外部サービスの準備が要るため、まずは第1段階の品質チェックから試すのがよい。評価の結果は、あくまで目安として扱いたい。まずは品質チェックから試したい。","2026-11-16","GitHub","https://github.com/NVIDIA/SkillEvaluator"],["「paper-orchestra」：論文執筆をマルチエージェントで自動化","研究論文の執筆をマルチエージェントで自動化する「paper-orchestra」が、GitHubのデイリートレンドに上がった。Google Cloud AI Researchのチームによるもので、アイデアや実験記録から投稿用のLaTeX原稿を作る。公開から約1,150スターを集め、1日で306スター増えた。出力は学会のテンプレートに沿ったLaTeXで、デモ画面も用意されている。","\n【概要】研究論文の執筆をマルチエージェントで自動化する「paper-orchestra」が、GitHubのデイリートレンドに上がった。Google Cloud AI Researchのチームによるもので、アイデアや実験記録から投稿用のLaTeX原稿を作る。公開から約1,150スターを集め、1日で306スター増えた。Apache-2.0で公開されている。【背景】論文執筆は、構成、文献調査、執筆、図の作成と工程が多く、研究者の時間を大きく奪う。AIに丸ごと任せるのではなく、専門のエージェントが分担する枠組みが注目されている。このプロジェクトは、素材から投稿可能な原稿までを一気通貫で作ることを目指した。【詳細】エージェントは、アウトライン、文献レビュー、章の執筆、内容の改善、作図という役割に分かれる。文献を自動で探して優先順位をつけ、原稿に組み込む。図はコードから生成し、概念図も作れる。出力は学会のテンプレートに沿ったLaTeXで、Streamlitのデモ画面も用意されている。モデルはGeminiやOpenAIのAPIキーを指定して使う。研究者の作業時間の多くは執筆に費やされており、自動化の効果は大きい。文献調査から作図までを一貫して行えるため、下書きの段階から全体像を把握しやすい。ただし、生成された原稿の正確さは人の確認が欠かせない。執筆の負担が減れば、研究そのものに使える時間が増える。【ポイント・注意点】執筆に使うデータセットは別途公開予定で、現時点では含まれていない。生成された原稿の正確さは利用者自身の確認が前提で、そのまま投稿できる品質を保証するものではない。Googleの公式サポート対象外と明記されている。APIキーの利用料は自己負担で、図や文献の扱いには著作権の確認が必要だ。APIキーの利用料は自己負担で、図や文献の扱いには著作権の確認が必要だ。データセットは別途公開予定のため、現時点では自分の素材で試す形になる。研究者の負担軽減につながることが期待される取り組みだ。","2026-11-16","GitHub","https://github.com/google-research/paper-orchestra"],["「svelte」：コンパイラ型のWebフレームワークが再び注目","コンパイラ型のWebフレームワーク「svelte」が、GitHubのデイリートレンドに再び上がった。約8.9万スターを集める定番で、宣言的なコンポーネントを効率的なJavaScriptへ変換する。最近はエージェント向けの性能調査スキルも加わり、開発の現場で改めて注目されている。公式サイトやDiscordでの議論が活発で、リリースは640件にのぼる。学習資料も公式にまとまっている。","\n【概要】コンパイラ型のWebフレームワーク「svelte」が、GitHubのデイリートレンドに再び上がった。約8.9万スターと約6,000のフォークを集める定番で、宣言的なコンポーネントを効率的なJavaScriptへ変換する。最近はエージェント向けの性能調査スキルも加わり、開発の現場で改めて注目されている。MITライセンスで公開されている。【背景】Svelteは2016年に生まれ、ReactやVueとは違う「コンパイラ」の道を選んだ。実行時のライブラリを極力減らし、必要な更新だけをDOMに反映する。近年はAIエージェントがコードを書く場面が増え、フレームワーク側もエージェントへの対応を進めている。【詳細】Svelteの特徴は、コンポーネントを書くと、ビルド時にDOMを直接操作する効率的なコードへ変換される点だ。仮想DOMを使わないため、実行時の負担が小さい。公式サイトやDiscordでの議論が活発で、リリースは64
