<style>

:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;display:flex;flex-direction:column;height:100dvh;overflow:hidden;transition:background .35s ease,color .35s ease}
body::before{content:"";position:fixed;inset:0;background:var(--pattern);pointer-events:none;opacity:var(--pattern-op,.5)}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
[data-theme="steampunk"]{--bg:#e6d7b8;--pattern:radial-gradient(circle at 12% 20%,rgba(141,100,40,.16) 0 26px,transparent 27px),radial-gradient(circle at 88% 78%,rgba(141,100,40,.13) 0 38px,transparent 39px),repeating-linear-gradient(0deg,rgba(90,62,25,.05) 0 1px,transparent 1px 26px);--pattern-op:1;--card:#f8eed3;--ink:#2e2010;--muted:#77603c;--line:#a97f3f;--accent:#9c4a12;--accent2:#2f5d50;--accent-ink:#fff6df;--soft:#efdfba;--old:#97835f;--top-bg:#2a1a0c;--top-ink:#f2dfae;--radius:8px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\2699  \2699  \2699";--shadow:0 14px 34px rgba(62,40,8,.28)}
[data-theme="witch"]{color-scheme:dark;--bg:#161022;--pattern:radial-gradient(circle at 18% 12%,rgba(233,213,255,.20) 0 1.5px,transparent 2.5px),radial-gradient(circle at 72% 22%,rgba(233,213,255,.14) 0 1px,transparent 2px),radial-gradient(circle at 42% 66%,rgba(196,181,253,.12) 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 84%,rgba(233,213,255,.16) 0 1px,transparent 2px),radial-gradient(circle at 6% 88%,rgba(196,181,253,.12) 0 1px,transparent 2px);--pattern-op:1;--card:#241a3d;--ink:#f1eaff;--muted:#bdaee0;--line:#5b4595;--accent:#a678ff;--accent2:#e9d5ff;--accent-ink:#1d1233;--soft:#2f2350;--old:#8d81ad;--top-bg:#0e0919;--top-ink:#efe6ff;--radius:20px;--font-display:"IM Fell English","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\263E  \2726  \263D";--shadow:0 14px 34px rgba(0,0,0,.5)}
[data-theme="dnd"]{--bg:#e7d9b4;--pattern:repeating-linear-gradient(45deg,rgba(158,43,37,.05) 0 2px,transparent 2px 18px),radial-gradient(circle at 85% 10%,rgba(158,43,37,.10) 0 30px,transparent 31px);--pattern-op:1;--card:#f7ecc9;--ink:#332216;--muted:#7d6248;--line:#8c6a3f;--accent:#9e2b25;--accent2:#a97b00;--accent-ink:#fdf3d8;--soft:#eee0b6;--old:#9a8a72;--top-bg:#471611;--top-ink:#f7e7bd;--radius:4px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\265E  \2726  \265E";--shadow:0 14px 30px rgba(71,22,17,.30)}
[data-theme="celtic"]{--bg:#e3dfc6;--pattern:repeating-linear-gradient(0deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px),repeating-linear-gradient(90deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px);--pattern-op:1;--card:#f6f2dc;--ink:#20331e;--muted:#5d7050;--line:#77873f;--accent:#2e6b34;--accent2:#a8842a;--accent-ink:#fbf7e2;--soft:#e7e5c8;--old:#93a086;--top-bg:#17351f;--top-ink:#efeccb;--radius:14px;--font-display:"Uncial Antiqua","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\16DA  \2726  \16DB";--shadow:0 14px 30px rgba(23,53,31,.26)}
[data-theme="greek"]{--bg:#f2eee3;--pattern:repeating-linear-gradient(90deg,rgba(29,95,138,.06) 0 1px,transparent 1px 34px),radial-gradient(circle at 90% 0%,rgba(185,138,28,.10) 0 60px,transparent 61px);--pattern-op:1;--card:#fffdf6;--ink:#1e2c38;--muted:#66727c;--line:#b3923c;--accent:#1d5f8a;--accent2:#b98a1c;--accent-ink:#ffffff;--soft:#ece7d7;--old:#a3a8ad;--top-bg:#fdfbf4;--top-ink:#1e2c38;--radius:2px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\03A9  \2766  \03A9";--shadow:0 14px 30px rgba(30,44,56,.18)}
.top{flex:none;position:relative;z-index:30;background:var(--top-bg);color:var(--top-ink);border-bottom:3px double var(--line)}
.topin{max-width:1080px;margin:auto;padding:10px 16px 4px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.logo{font-family:var(--font-display);font-weight:900;font-size:23px;letter-spacing:.06em}.logo span{color:var(--accent2)}
[data-theme="witch"] .logo span,[data-theme="steampunk"] .logo span{color:var(--accent)}
.date{font-size:10px;opacity:.75;white-space:nowrap}
.topbtns{display:flex;gap:8px;flex:none}.pill{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.themes{max-width:1080px;margin:auto;padding:6px 16px 10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.themes-label{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;opacity:.8}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;opacity:.85}
.theme-btn .gly{margin-right:5px}
.theme-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
.stage-wrap{flex:1;min-height:0;max-width:1080px;width:100%;margin:auto;padding:10px 16px 12px;display:flex;flex-direction:column;position:relative;z-index:1}
.herostrip{flex:none;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;box-shadow:var(--shadow)}
.herostrip img{width:74px;height:52px;object-fit:cover;border-radius:calc(var(--radius) * .6);flex:none}
.herostrip p{margin:0;font-size:13px;color:var(--muted)}.herostrip b{color:var(--ink);font-family:var(--font-display)}
.catbar{flex:none;display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.catbar .navbtn{flex:none}
.catinfo{flex:1;text-align:center;min-width:0}
.catinfo h2{margin:0;font-family:var(--font-display);font-size:clamp(19px,4.6vw,27px);line-height:1.25;letter-spacing:.03em}
.catinfo p{margin:1px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catcount{flex:none;font-size:12px;background:var(--soft);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-weight:700}
.navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800;box-shadow:var(--shadow)}
.navbtn:active{transform:scale(.97)}
.dots{flex:none;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:transparent;padding:0}
.dot.active{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.stage{flex:1;min-height:0;touch-action:none;position:relative}
#cardSlot{height:100%}
.card{height:100%;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
.card::after{content:var(--orn);position:absolute;top:6px;right:12px;font-size:13px;letter-spacing:.3em;color:var(--accent2);opacity:.85;pointer-events:none}
.card.old .ph{filter:grayscale(1)}
.card .ph{width:100%;height:30%;min-height:120px;object-fit:cover;display:block;flex:none}
[data-theme="steampunk"] .card .ph{filter:sepia(.35) contrast(1.05)}
[data-theme="witch"] .card .ph{filter:saturate(.85) hue-rotate(-12deg) brightness(.92)}
[data-theme="dnd"] .card .ph{filter:sepia(.25) saturate(1.1)}
[data-theme="celtic"] .card .ph{filter:saturate(1.05) hue-rotate(6deg)}
[data-theme="greek"] .card .ph{filter:saturate(.92) brightness(1.04)}
.cbody{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.badge{background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:999px;font-weight:800}.badge.oldb{background:var(--old)}
.card h3{margin:0;font-size:clamp(17px,4.4vw,21px);line-height:1.45;font-family:var(--font-display);font-weight:700}
.sum{font-size:14px;color:var(--muted);margin:0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.btn{border:0;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800}
.btn.primary{background:var(--accent);color:var(--accent-ink)}.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.saved{background:var(--accent2);color:var(--accent-ink)}
.src{font-size:11px;color:var(--muted);word-break:break-all}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;color:var(--muted)}
.empty .big{font-size:34px;color:var(--accent2)}
.pager{flex:none;display:flex;align-items:center;gap:10px;margin-top:10px}
.pager .navbtn{flex:1}
.artdots{flex:none;display:flex;gap:5px;max-width:34vw;flex-wrap:wrap;justify-content:center}
.artcount{flex:none;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.hint{flex:none;font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.addcat{flex:none;text-align:center;margin-top:6px}
.addcat button{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700}
@keyframes inNext{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes inDown{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes inUp{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
.anim-next{animation:inNext .28s ease}.anim-prev{animation:inPrev .28s ease}.anim-down{animation:inDown .28s ease}.anim-up{animation:inUp .28s ease}
dialog{border:2px solid var(--line);border-radius:calc(var(--radius) + 6px);padding:0;max-width:min(680px,94vw);width:680px;max-height:92dvh;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,8,4,.6)}
.din{padding:20px;overflow-y:auto;max-height:92dvh}
.din img{width:100%;height:200px;object-fit:cover;border-radius:var(--radius)}
.din h3{font-size:20px;line-height:1.4;margin:12px 0 6px;font-family:var(--font-display)}
.full{font-size:15px;white-space:pre-line}
textarea,input[type="text"]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px}
label.fl{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
.memoBox{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.memoItem{border-top:1px solid var(--line);padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--top-bg);color:var(--top-ink);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:90vw;text-align:center}
@media(max-width:640px){.topin{padding:8px 12px 2px}.themes{padding:4px 12px 8px}.stage-wrap{padding:8px 12px 10px}.herostrip{display:none}.catbar .navbtn{padding:8px 10px;font-size:12px}.card .ph{height:24%;min-height:104px}}
@media(prefers-reduced-motion:reduce){.anim-next,.anim-prev,.anim-down,.anim-up{animation:none}body{transition:none}}

</style>

const DATA = {"ai":[["企業のAI選び、CopilotとGeminiが35％で並ぶ　AIworker調査","東京大学発のAIベンチャーAIworkerが、2025年5月から2026年11月上旬に受けたAI導入の新規相談を集計した。社内で使うAIとして名前が挙がった割合は、2025年はChatGPTが66％で最多だったが、2026年はCopilotとGeminiが各35％で並び、ChatGPTは28％、Claudeは27％となった。導入が停滞する理由では「使いこなせる人・推進役がいない」が34％で最多だった。","\n【概要】キーマンズネットは2026年11月21日、AIworkerによるAI導入相談の分析結果を紹介した。企業が社内で使うAIサービスの顔ぶれが1年で大きく変わり、ChatGPTが突出していた構図から、Copilot、Gemini、Claudeを含む分散した構図に移ったことが示された。\n【背景】調査の対象は、2025年5月から2026年11月上旬にかけて同社が受けたAI導入の新規相談のうち、録画と文字起こしが残る会議に限られる。会議冒頭の15分をClaudeで分類し、分類できなかった相談は除いた。同社は、結果は自社に寄せられた相談に基づくもので、日本企業全体の傾向ではないとしている。\n【詳細】社内で使うAIの名前が挙がった相談では、2025年はChatGPTが66％、Geminiが20％、CopilotとClaudeが各13％だった。2026年はCopilotとGeminiが各35％、ChatGPTが28％、Claudeが27％となった。同社は、契約中の業務ソフトに付属するAIを全社に配る企業が増えた可能性を指摘する。導入が停滞する理由（複数回答）は「使いこなせる人・推進役がいない」34％、「社内の理解・手続き」30％、「予算・費用の根拠」29％、「セキュリティ・情報漏えい」24％、「効果や精度が読めない」17％、「データ・社内システムの準備」8％だった。活用段階では「一部の人が個人で使う」が71％から57％に下がる一方、「全社で導入したが活用が進まない」は9％から19％に増えた。「まだ使っていない」は11％から21％に増え、「活用が進んでいる」は9％から4％に下がっている。内製化への関心は、DX推進・情報システム部門の相談で41％、経営者・役員の相談で13％だった。\n【ポイント・注意点】全社への配布が進んでも、活用が伴わない企業が増えている点が目を引く。同社は部署ごとに推進役を決め、AIを適用する業務を選ぶよう提言している。ただし部署別の件数は少なく、同社も傾向として捉えるよう求めている。記事の後半は会員限定で、本稿は公開部分の内容に基づく。","2026-11-21","キーマンズネット","https://kn.itmedia.co.jp/kn/article/2611/21/2000003385/"],["AIで成果を出す企業ほど人を増やす　IDCが通説と異なる調査","調査会社IDCは2026年11月17日、AI投資で50％以上のROIを得ている「リーダー」企業の過半数が、今後18カ月で人員の増加を見込むとする調査結果を公表した。初級職の増員を見込む割合はリーダーが68％で、ROIがまだプラスでない「ラガード」の40％を上回った。AI推進の専門組織CoEの全面稼働もリーダー63％、ラガード15％と差が大きい。IDCは、AIが主に置き換えるのは人ではなく仕事だと分析している。","\n【概要】ITmedia エンタープライズは11月21日、IDCが公式ブログで公表した調査結果を紹介した。AIを使いこなす企業ほど人員を増やす傾向があるという内容で、AIの普及で企業の人員もソフトウェアの利用者数も減るという、この1年の通説と食い違う結果となった。\n【背景】IDCは、AI投資で50％以上のROIを得たと答えた組織を「リーダー」、ROIがまだプラスでない組織を「ラガード」、その中間を「アチーバー」と分類した。データは同社の「Worldwide Future of Work Survey」（2026年5月）による。3分類ともに一部の人員は削減しているが、リーダーは削減と並行して増員も見込み、その割合は他の分類を上回る。IDCの別のレポート「Economic Impact of AI: 2026 Edition」も、AIが主に置き換えるのは労働者ではなく仕事だという同様の結論に至っている。\n【詳細】今後18カ月で初級職が増えると見込む割合は、リーダーが68％、アチーバーが51％、ラガードが40％だった。中間管理職ではリーダー63％に対しラガード39％、上級管理職ではリーダー59％に対しラガード36％となった。リーダーのうち人員の減少を見込む割合はどの階層でも12％以下で、中間・上級管理職では3％にとどまる。体制面では、AI推進の専門組織CoEが全面稼働している割合がリーダー63％、ラガード15％、ガードレールを設けたうえでAIエージェントを完全に自律稼働させている割合が33％と20％だった。\n【ポイント・注意点】IDCは、人員の削減と増員は二者択一ではなく、新しい役割へ投資を移す動きだと説明する。一方で、レイオフが起きていることや、AIの影響を受けやすい職種で初級職の採用が減っていることも認めている。IT部門への提言は、仕事の割り当てに責任を持つ担当者を1人決める、常勤・外部人材・AIエージェントを横断して管理できるかでベンダーを評価する、AI前提の働き方を見直し続ける、の3点。注視すべきは人員数より仕事の配分だとしている。","2026-11-21","ITmedia エンタープライズ","https://www.itmedia.co.jp/enterprise/articles/2611/21/news003.html"],["TikTok、AI生成かを確かめる機能を公開　肖像検出も世界展開","TikTokは11月20日、AI生成コンテンツの透明性を高める2つの新機能を発表した。画像や動画をアップロードしてTikTokのAI作成機能で作られたかを確認できる「透明性確認」は、TikTokのアカウントがなくても使える。また、本人の同意なく肖像が使われた可能性があるAI生成コンテンツを検出・報告できる「肖像検出」を世界で展開し、政治家や政党なども対象に含める。","\n【概要】Impress Watchによると、TikTokは20日、AI生成コンテンツの透明性と管理を強める2つの機能を発表した。1つはAIで作られたかを確かめる「透明性確認」、もう1つは本人の肖像が無断で使われたコンテンツを見つける「肖像検出」のグローバル展開である。\n【背景】TikTokはAI生成コンテンツへのラベル表示を進めており、これまでに累計50億本以上のAI生成動画にラベルを付けてきた。「トピックを管理」機能では、「おすすめ」フィードに表示されるAI生成コンテンツの量も調整できる。今回の2機能は、こうした取り組みをさらに広げるもので、AIで作られた画像や動画が増える中、見る側と写される側の双方を守る狙いがある。\n【詳細】「透明性確認」は、画像や動画をアップロードすると、TikTokのAI作成機能で生成・編集されたものかどうかを確認できる機能だ。TikTokの透明性センターから利用でき、アカウントは不要である。判定には、作成履歴などを記録する「コンテンツクレデンシャル」と、TikTok独自の不可視ウォーターマーク技術「VeraDura」を使う。「肖像検出」はオプトイン型で、クリエイターや公人が対象となり、政府機関、政治家、政党のアカウントも含まれる。第三者パートナーを通じた本人確認と登録を済ませると、自分の肖像が使われている可能性のあるコンテンツが見つかった際に通知が届く。該当コンテンツはTikTokのセーフティチームへ直接報告でき、コミュニティガイドラインに違反していれば削除される。\n【ポイント・注意点】透明性確認で分かるのは、TikTokのAI作成機能で作られたかどうかである点に注意したい。他社のツールで作られた画像や動画を見分けられるかについて、記事は触れていない。肖像検出では収集するデータを最小限に抑え、本人確認に使った身分証明資料をTikTokが継続して保持しないとしている。なりすましや偽の動画への対策として、利用者自身が確認できる手段が広がる動きといえる。なお肖像検出は、本人確認と登録を済ませた人だけが使える仕組みである。","2026-11-21","Impress Watch","https://www.watch.impress.co.jp/docs/news/2158347.html"],["T-Mobile、AIに資料を多く読ませたら回答が悪化　単純な表に転換","VentureBeatは11月20日、米T-Mobileが顧客対応AIエージェントにサポート文書をすべて読み込ませたところ、文書間の矛盾で誤った手順に導かれ「まったく機能しなかった」と報じた。ナレッジグラフも探索に時間がかかって断念し、現在はキーバリュー型のルックアップテーブルで処理を振り分けている。小型モデルによる監視で、実在しない保留音を生成する幻覚も見つかった。","\n【概要】VentureBeatは11月20日、米通信大手T-MobileのCIO、ジェフ・サイモン氏の話として、顧客対応AIエージェントに与える文脈づくりの失敗と立て直しの経緯を伝えた。同氏が2026年10月にVentureBeatのイベントで語った内容で、AIに読ませる情報を増やすほど良くなるとは限らないことを示す事例となっている。\n【背景】T-Mobileは当初、サポート文書をすべて、大きなコンテキストウィンドウを持つモデルに読み込ませた。しかし文書同士に矛盾があり、AIが誤った手順に案内してしまった。サイモン氏は「まったく機能しなかった」と振り返る。次に試したナレッジグラフも、探索に時間がかかり、うまく動かなかった。\n【詳細】最終的に同社は、キーバリュー型データベースのキャッシュを使った単純なルックアップテーブルに切り替えた。オーケストレーターが顧客の希望を確かめてから担当エージェントに渡す仕組みで、エージェントは国際データパスの購入など限られた操作もできる。すべてのチャットと音声のセッションでは小型言語モデルが審査役となり、誤った回答や怒っている顧客を人の確認に回す。この審査役が、T-Mobileが流していない保留音が多くの通話で流れていることを見つけた。原因の特定には数週間かかり、検索やツールの実行中に顧客向けモデルが保留音を作り出していたと判明した。現在はプロンプトで保留音の幻覚を禁じている。記事はほかに、Uberが8月27日のブログで、グラフを使うとデータの表を38秒で見つけられ、使わない場合は20分以上かかったと報告した例も紹介している。\n【ポイント・注意点】審査役の仕組みにはコストがかかることを、サイモン氏も認めている。記事が紹介したVB Pulseの調査では、業務データでAIエージェントを使う97人のうち78％が、過去6カ月に文脈の不足や不整合による誤った回答を経験した。そのうち76人の回答では、42％が誤情報の外部流出や公式報告への混入、決定の取り消しに至ったという。AIに渡す文脈は、量よりも整理が大切だという教訓といえる。","2026-11-20","VentureBeat","https://venturebeat.com/orchestration/giving-its-ai-more-to-read-made-t-mobiles-answers-worse"],["Spotify創業者エク氏、AI研究者の核融合スタートアップに出資","Spotify創業者のダニエル・エク氏が、AI研究者のナンタス・ナルデッリ氏が立ち上げた英国の核融合発電スタートアップ「Europa Fusion」に出資したとTechCrunchが伝えた。同社は2026年2月設立の非公開企業で、米Pacific Fusionと同じパルスパワー方式を採用し、ハードウェア中心ではなくシミュレーションとデータを重視する手法を取るという。調達額は明らかにされていない。","\n【概要】TechCrunchは11月20日、Spotify創業者のダニエル・エク氏が核融合発電スタートアップ「Europa Fusion」に出資したと報じた。最初に報じたのは11月18日のBloombergで、TechCrunchはその後の取材内容を伝えている。創業者が機械学習の研究者であり、AI研究の手法を核融合の開発に持ち込む点が注目される。\n【背景】Europa Fusionは英国を拠点とするステルス型（非公開）の企業で、2026年2月に設立された。創業者のナンタス・ナルデッリ氏は、Google DeepMind、Facebook AI Research、Microsoft Research Cambridgeで働いた経歴を持つ。直近では、米カリフォルニア州フリーモントの核融合企業Pacific Fusionで機械学習の責任者を務めていた。Pacific Fusionはニューメキシコで実証施設の建設に着手している。\n【詳細】情報源によると、ナルデッリ氏は設立以前からこの構想に取り組んでおり、ハードウェア中心の開発よりも、シミュレーションやデータを重視する手法が望ましいと考えていたという。Europa FusionはPacific Fusionと同じパルスパワー方式を採用する。強力で正確にタイミングを合わせた電流で燃料の標的を圧縮し、核融合を起こす方式だ。ナルデッリ氏は自身のウェブサイトで、もともとは電子工学と制御工学の出身で「気候変動を根本から解決する時が来た」と書いている。記事は、この気候問題への関心が、AIから核融合へ転じたきっかけとみられるとしている。\n【ポイント・注意点】電力網に電気を供給できる核融合発電所は、まだ存在しないと記事は指摘する。Europa Fusionの調達額やエク氏の出資額、事業化の時期は明らかにされていない。AI研究で培ったシミュレーションとデータの手法が、核融合という難しい分野でどこまで通用するかが焦点となるが、技術的な実現性はこれからの検証を待つ段階である。","2026-11-20","TechCrunch","https://techcrunch.com/2026/11/20/daniel-ek-backs-ai-researchers-fusion-power-startup-heres-what-theyre-building/"],["AIがリーマン予想の解決を主張　Leanで検証、人間の証明も登場","Anthropicに在籍する数学者レヴェント・アルポゲ氏が、1859年に提唱されたリーマン予想を解いたとする証明を公開したとTechCrunchが報じた。証明は定理証明支援系Leanでコンパイルでき、独立した情報源による確認も取れたという。ただし人間が理解できる説明はまだない。同じ時期に、スタンフォード大学のポスドクもAIを使わない一般化リーマン予想の証明草稿を公表した。","\n【概要】TechCrunchは11月20日、数学の未解決問題であるリーマン予想について、AIによる解決の主張と、人間による証明の発表が相次いだと報じた。リーマン予想は1859年に提唱され、ミレニアム懸賞問題の一つに数えられる。AIが最難関級の数学問題に取り組む時代を象徴する出来事となっている。\n【背景】発表したのは、Anthropicに在籍する数学者のレヴェント・アルポゲ氏だ。同氏は、Leanでコンパイルできる解を見つけたとするエッセイを公開した。Leanは数学の証明を機械で検証するための言語である。同氏は発表の方法について、AnthropicのCEOダリオ・アモデイ氏に日曜の夜にメッセージで相談したという。\n【詳細】数学者のコミュニティは、チャットサービスZulipで議論を重ねた。英イーストアングリア大学の数論学者クリス・バークベック氏らが意見を投稿し、MITの数学者アンドリュー・サザーランド氏を含む複数の参加者が、証明がLeanでコンパイルできることを確認したと述べた。TechCrunchは後に、独立した情報源による確認が取れたと記事を更新している。アルポゲ氏はニューヨーク大学のトリスタン・バックマスター氏とともに、ナビエ・ストークス方程式に関する別の証明も公開した。一方、スタンフォード大学のラヴィ・ヴァキル氏は、同大ポスドクのアレッサンドロ・マスッロ氏による一般化リーマン予想の証明を投稿した。ヴァキル氏は「AIは使っていない」と述べ、草稿だとしている。マスッロ氏は12年の研究の成果だと記している。\n【ポイント・注意点】アルポゲ氏の証明には、人間が理解できる説明がまだない。同氏は説明に取り組むと約束し、説明なしに証明を公開したことへの罪悪感も示した。記事は、Leanで形式化されていない段階では、証明が正しいかを判断するのは早すぎると結んでいる。記事のタイトルが示すように、AIと人間の双方から証明の主張が出そろった形だ。機械による検証と、人間による理解の両方がそろうかが今後の焦点となる。","2026-11-20","TechCrunch","https://techcrunch.com/2026/11/20/ai-claimed-a-solution-to-the-167-year-old-riemann-hypothesis-and-a-human-did-too/"],["Gemini API、必要なツールだけ読み込む新機能　トークン消費を削減","Googleは11月19日（米国時間）、Gemini APIのInteractions APIで、AIエージェントが必要なツールだけを取得する新機能「Tool Retrieval」のプレビュー提供を始めた。ツールの名前と説明だけを先に認識させ、詳しい定義は使うときに読み込む仕組みで、入力トークンの削減とツール選択の精度維持を狙う。対応はGemini 3.6以降のモデルで、リモートMCPサーバーにも対応する。","\n【概要】Impress Watchによると、Googleは19日、Gemini APIに「Tool Retrieval」をプレビューとして追加した。多数の外部ツールを接続したAIエージェントでも、処理に必要なツールの定義だけを読み込めるようにする機能で、Interactions APIで使える。対応モデルはGemini 3.6以降となる。\n【背景】これまでは、アプリに多くのツールを接続すると、処理を依頼するたびに全ツールのパラメータ定義を読み込む必要があった。ツールが増えるほど入力トークン数と処理時間が膨らみ、どのツールを使うべきかの選択精度も下がるという課題があった。今回の機能は、この負担を減らすことを目的としている。\n【詳細】Tool Retrievalでは、Geminiには各ツールの名前と説明だけを認識させ、詳しい定義は必要になるまで読み込まない。Geminiが処理に使うツールを判断すると、そのツールのパラメータ定義を取得し、関数呼び出しまでを1回のリクエストの中で実行する。これにより、数十から数百のツールを接続している場合でも、不要な読み込みを減らせるとしている。利用するには、APIリクエストに「tool_search」を加え、必要なときだけ読み込みたいツールを指定する。ツールの検索はGoogleのサーバー側で実行されるため、利用者がインデックスを作成・管理する必要はない。また、この機能はGemini APIのリモートMCPサーバーにも対応している。\n【ポイント・注意点】今回はプレビューでの提供であり、料金や正式提供の時期について記事は触れていない。本番で使う前には、プレビュー段階であることを踏まえた検証が欠かせない。開発者にとっては、接続するツールを増やしても、コストや応答速度への影響を抑えやすくなる点が利点となる。AIエージェントが多くの外部サービスと連携する使い方を後押しする機能といえる。詳細はGoogleのブログ「Introducing Tool Retrieval in the Gemini API」で説明されている。","2026-11-20","Impress Watch","https://www.watch.impress.co.jp/docs/news/2158217.html"],["グーグル、宇宙でAIを動かす計画でブルーオリジンと打ち上げ提携","Googleは、地球軌道上で太陽光発電とAIインフラを拡張する計画「プロジェクト・サンキャッチャー」の最初の大型打ち上げで、Blue Originと提携したと発表した。2029年第1四半期を目標に大型ロケット「New Glenn」で打ち上げ、GoogleのAIチップTPUを搭載し、データセンターのラック相当の処理能力を持つ太陽光発電衛星を太陽同期軌道に投入する計画だ。","\n【概要】Impress Watchは11月20日、GoogleがBlue Originと提携し、宇宙空間でAIの計算を行う構想の最初の大型打ち上げを任せると発表したと報じた。打ち上げは2029年第1四半期が目標で、ブルーオリジンの大型ロケット「New Glenn（ニューグレン）」による専用の打ち上げとなる。宇宙の太陽光でAIの計算を行う構想が、具体的な打ち上げ計画の段階に進んだ。\n【背景】「プロジェクト・サンキャッチャー」は、軌道上の豊富な太陽光発電を使い、複数の衛星を連携させて宇宙空間にAIインフラを広げる長期的な構想である。すでに試験衛星が打ち上げられており、追加の計画も明らかにされてきた。今回の提携は、この計画で最初の大型衛星の打ち上げに位置づけられる。ブルーオリジンはジェフ・ベゾス氏が創業した宇宙企業だ。\n【詳細】計画では、GoogleのAIチップであるTPUを搭載し、データセンターのラックに相当する処理能力を持つ太陽光発電衛星を、太陽同期軌道に投入する。Googleは今回の打ち上げについて、宇宙空間での機械学習コンピューティングの規模拡大を目指す研究にとって重要な節目になるとしている。軌道上の豊富な太陽光を電力として使える点が、この構想の土台になっている。今回の打ち上げは、ニューグレンを丸ごと使う専用の打ち上げとして行われる予定だ。提携はGoogleとブルーオリジンの双方がニュースリリースで発表した。同計画については、9月にも関連の発表が報じられている。\n【ポイント・注意点】打ち上げを担うニューグレンには不安材料もある。4月の3号機の打ち上げでは搭載衛星の軌道投入に失敗し、米AST SpaceMobileの低軌道通信衛星7号機の運用が断念された。6月には4号機向けエンジンの燃焼試験中に大きな爆発が起き、発射場が損傷した。打ち上げ関連の施設は現在も復旧作業中とされる。2029年という目標の達成には、ロケット側の信頼性の回復と施設の再建が前提となる。AIの計算基盤を宇宙に広げる試みが、実際の大型打ち上げの段階に入るかが注目される。","2026-11-20","Impress Watch","https://www.watch.impress.co.jp/docs/news/2158139.html"],["日立、3.5万人の新会社でフィジカルAI推進　5年で事業規模2倍狙う","日立製作所は米国子会社のGlobalLogicとHitachi Digital Servicesを統合し、2027年4月に世界27カ国・約3万5000人のHitachi Digitalを発足させる。CEO兼Chairmanに就くアナンド・ビルジェ氏は、社会インフラをAIで自律化する「フィジカルAI」などで5年後に事業規模を2倍にする方針を示し、顧客の現場に入る技術者FDEを1年で3倍の3000人に増やすと明らかにした。","\n【概要】ITmedia ビジネスオンラインは11月20日、日立製作所が設立する新会社Hitachi Digitalのトップ、アナンド・ビルジェ氏への取材記事を掲載した。同氏は今後5年で事業規模を2倍に引き上げる目標を掲げ、「2026年度がリセットであれば、2027年度は加速していく」と述べた。\n【背景】Hitachi Digitalの設立は、10月28日に2026年度第2四半期決算とともに発表された。グループの米国子会社で、デジタルエンジニアリングを手掛けるGlobalLogicと、デジタルコンサルティングとテクノロジーサービスを担うHitachi Digital Servicesを統合し、2027年4月に発足する。日立が培ってきた産業分野の知見を背景に、デジタルエンジニアリングと運用を一つの会社に集め、世界規模で提供する狙いがある。\n【詳細】新会社は27カ国に約3万5000人の従業員を抱え、そのうち約1000人が顧客の現場に入り込むFDE（Forward Deployed Engineers）だ。FDEはエンジニアやコンサルタント、AIスペシャリストなどからなるチームで、顧客の業界の業務や課題を理解したうえで、AI、データ、クラウドで刷新できるシステムを検討する。ビルジェ氏はFDEを今後1年で3倍の3000人に増やす考えを示した。また、880社以上ある顧客を、売り上げの9割を占める上位200〜300社に絞り込む方針も打ち出した。米国の調剤薬局で動くロボットや自動車工場のデジタルツイン、電力網の制御など、社会インフラをAIで自律化させる「フィジカルAI」の実装もすでに始まっているという。\n【ポイント・注意点】対象とする市場は、自動車、金融、ヘルスケア、半導体、製造・エネルギー、小売、通信など幅広い。一方で、顧客を大きく絞り込むことは、小規模な案件からの撤退も意味する。AI導入の担い手として注目されるFDEを大幅に増やす戦略が、5年で2倍という成長目標にどう結び付くかが焦点となる。ビルジェ氏は、統合に向けてこの3カ月で戦略の定義と新しい経営体制の整備を終え、顧客やパートナーへの説明も済ませたとしている。","2026-11-20","ITmedia ビジネスオンライン","https://www.itmedia.co.jp/business/articles/2611/20/news024.html"],["東京ガスiネット、生成AI面談でベテランPMの暗黙知を継承","東京ガスのIT子会社である東京ガスiネットは、熟練プロジェクトマネジャー（PM）の暗黙知を残すため、AIが質問役を務める「生成AI面談」の仕組みを導入した。日立ソリューションズの面談支援AIサービスとAllganizeの「Alli LLM App Market」を組み合わせ、回答に応じて深掘りの質問を投げかける。協力した熟練PMは50〜60分にわたって話し、暗黙知を十分に引き出せたという。","\n【概要】@ITは11月20日、東京ガスiネットが生成AIとの面談を通じて熟練PMの暗黙知を抽出・蓄積する仕組みを導入した事例を紹介した。単なるチャットではなく、回答の内容に応じてAIが深掘りの質問を重ねる「深掘り面談」が特徴だ。記事は日立ソリューションズが10月14日に公開したプレスリリースと導入事例を基にしている。\n【背景】東京ガスグループのシステム構築や維持管理は、IT子会社である東京ガスiネットのPMが担っている。熟練PMの退職や人手不足が進み、若い世代が会社を離れることもある中で、熟練者の経験や思考プロセスといった個人に依存した知見を、次の世代に引き継ぎにくくなっていた。同社は複数のベンダーに相談したが、暗黙知を集める「入り口」まで含めて提案したのは日立ソリューションズだけだったという。\n【詳細】面談には日立ソリューションズの「面談支援AIサービス」を使い、AIが会話形式で質問を進める。熟練PMの回答に暗黙知の手がかりがあれば、Allganizeの「Alli LLM App Market」が深掘りの質問を考え、面談支援AIを通じて投げかける。質疑応答はテキスト化され、Alli LLM App Marketがそれを読み込んでナレッジベースを築く。面談のシナリオは、プロジェクトマネジメントの知識体系「PMBOK」の12の原理・原則を基に作り、PMが遭遇しそうな場面を質問に盛り込んだ。経験の浅いPMが作ったプロジェクト計画書をレビューする仕組みや、面談結果からPMのスキルをスコア化する仕組みも用意した。\n【ポイント・注意点】日立ソリューションズによると、一般にこうした面談では知見をなかなか話してもらえず、15〜20分で終わることもある。東京ガスiネットでは熟練PMが50〜60分話し、想定場面を盛り込んだ質問が関心を引いたとみられる。仕組みを使ったPMからは、自身の課題や強みが明確になったとの声が出ている。同社は他の業務への展開や、AIエージェントによるスキル評価・人材育成への活用も検討している。","2026-11-20","@IT","https://atmarkit.itmedia.co.jp/ait/articles/2611/20/news021.html"],["「名ばかりFDE」を見抜く10項目　ゴムマリが国内40社を調査","AIエージェントの導入支援を手掛けるゴムマリは、FDE（Forward Deployed Engineer）を名乗ってAI導入支援を提供する国内40社の公式サイトを調査した。依頼前に確認すべき10項目のうち、成果物の権利や引き渡し方を記載していたのは5社、発注側に求めることを記載していたのは7社にとどまった。料金を掲載していたのは12社で、最安プランは月額20万〜60万円だった。調査は10月31日に実施した。","\n【概要】ITmedia エンタープライズは11月20日、ゴムマリが11月16日に発表したFDEサービスの調査を紹介した。顧客先に入り込み、開発から本番業務まで支援するFDEを名乗るAI導入支援サービスが相次いでいるが、名前だけでは何を頼めるか分からないとして、依頼前に確かめるべき10項目と各社の記載状況をまとめた。\n【背景】ゴムマリはFDEを「提供する側のエンジニアが顧客の中に入り、作り、本番の業務まで届ける働き方の名前」と定義する。10項目の整理には、IPAの「情報システム・モデル取引・契約書」第二版や、経済産業省の「AI・データの利用に関する契約ガイドライン」などを使い、Palantir Technologies、OpenAI、AnthropicによるFDEの説明も参照した。\n【詳細】主なプランで提供側が開発すると記載していたのは31社、現場に入ると記載していたのは37社だったが、常駐または週1日以上と明記したのは10社だった。体制を記載していたのは20社、効果の測り方も20社、データの扱いは18社、最低契約期間か区切りは14社だった。発注側に求めることは7社、成果物の権利や引き渡し方は5社にとどまった。料金を掲載していたのは12社で、月額を確認できた8社の最も安いプランは月額20万〜60万円の範囲だった。調査は10月31日に実施し、各社のサイトから計77ページを選び、LLMで2回判定したうえで、食い違った箇所を同社が確認した。\n【ポイント・注意点】同社は、完了の条件を数字で決めること、段階ごとに継続か終了かを決められる形にすること、成果物の権利と支援終了後の修正方法を併せて決めることの3点が、後から費用と手間に影響するとしている。調査には限界もあり、自社サービスは対象外で、利用規約や実際の契約内容は調べていない。7社はお知らせなどしか参照できず、「記載なし」に分類された可能性がある。また、提供側が開発すると記載していなかった企業には、伴走や助言、既製ツールの設定、自社製品の導入を内容とするものがあった。","2026-11-20","ITmedia エンタープライズ","https://www.itmedia.co.jp/enterprise/articles/2611/20/news028.html"],["なぜ中国はヒューマノイドを量産するのか　背景にある「焦り」","MONOistは、中国ビジネス支援のSUGENAが10月29日に開いたセミナーの内容を報じた。2026年上半期には、ヒューマノイドの世界出荷台数の97％超を中国メーカーが占めたとの調査もある。須毛原勲社長は、EV産業で育った供給網に加え、労働力不足や不動産不況などへの「焦り」が国を旗振り役にしたと分析し、日本が先行しながら事業化が続かなかった4つの理由も挙げた。","\n【概要】MONOistは11月20日、SUGENAのオンラインセミナー「フィジカルAIから読む 中国の次の一手――EVの次に、なぜロボットなのか」の内容を伝えた。登壇した須毛原勲社長は、中国がヒト型ロボットに注力する理由から、日本企業が取るべき戦略までを解説した。2026年上半期には、ヒューマノイドの世界出荷台数の97％超を中国メーカーが占めたとする調査結果もあるという。\n【背景】須毛原氏は「中国が先行しているように見えるが、先行せざるを得ないところがある」と述べ、5つの理由を挙げた。1つ目はEV産業の基盤で、モーターや電池、磁石などの供給網と技術者が育ち、EVの供給過剰や価格競争の中で次の行き先としてロボットが浮上した。残る4つは、人口減少による労働力不足、不動産不況を受けた新たな成長産業の育成、生成AIの進化に伴うフィジカルAIへの期待、海外市場への展開で、日本にも当てはまるという。\n【詳細】中国政府は2023年11月にヒト型ロボットの発展方針を示し、2026年3月には第15次5カ年計画で「具身智能（フィジカルAI）」を未来産業に位置付けた。ただし開発はスタートアップが先行し、政府が後から支援を明確にした面もある。政府が方針を示すと国有企業が率先して買い、地方にも波及して需要が生まれる仕組みが中国の強みだという。一方の日本は、1973年に早稲田大学が「WABOT-1」を開発し、2000年にホンダが「ASIMO」を発表するなど先行していた。東大発のSCHAFTは2013年にGoogleに買収され、2018年に事業を終えた。その間、米国ではBoston Dynamics、中国ではUnitreeなどが研究や量産技術を蓄積し、2023年前後の生成AIの進化が中国企業の開発を加速させた。\n【ポイント・注意点】須毛原氏は、日本が続かなかった理由に、最初の買い手がいなかったこと、生成AIの登場前に開発がピークを迎えたこと、大企業の研究所が中心だったこと、資金の不足の4点を挙げた。「技術で負けたのではない。ただ、買う人がいなかった」と述べ、ロボットを使う場所と開発を続ける資金の確保が課題だと強調した。","2026-11-20","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/20/news014.html"],["伊藤忠の繊維カンパニー、生成AIで月1.3万時間を削減","伊藤忠商事の繊維カンパニーでは、グループ会社を含め1700人以上が生成AIを使い、利用者の申告による削減時間は月約1.3万時間に達した。現場から生まれた活用事例は100を超える。全社共通のAIツールでは繊維業界特有の業務に届かず、Googleの生成AIを使える独自環境を整えた。推進役の若谷哲也氏は「経営層が『定量の匂い』を感じると導入が一気に進む」と語った。","\n【概要】ITmedia ビジネスオンラインは11月20日、伊藤忠商事の繊維カンパニーによる生成AI活用の取り組みを紹介した。10月21〜23日に開かれた「Japan DX & AX Week 秋 2026」の講演を取材したもので、繊維デジタル戦略室の若谷哲也室長が登壇した。現場の熱意を経営判断につなげ、AI活用を広げた事例として注目される。\n【背景】伊藤忠商事は、繊維、機械、エネルギー・化学品など8領域で「ディビジョンカンパニー」という独自の組織制度を採る。繊維デジタル戦略室の専任スタッフは7人で、情報システム部門の出身者がいないのが特徴だ。同社は2023年12月、データ基盤の整備とAI活用をまとめた「Dataloomプロジェクト」を始めた。全社共通の生成AIサービスはすでにあったが、繊維業界特有の複雑な取引や、転記が続く細かな業務には手が届かなかった。\n【詳細】若谷氏は取り組みを「環境を整える」「現場の熱量を上げる」「経営が意思決定する」の3段階で説明した。まず本社がグループ会社20社分のライセンスを一括購入し、機密データも扱える企業向けのAI環境を用意して、子会社の予算や人員の制約を取り除いた。次に子会社を回って勉強会を開き、「ファクスで届く注文を基幹システムに打ち込んでいる」「百貨店から届く支払明細の消し込みが面倒だ」といった声を集め、その場で生成AIによる解決策を示して本人に試してもらった。若谷氏は、やりたくないことをやらずに済んだときに人は感動すると話し、不安そうだった人の表情が変わる瞬間を「コトンと音がする」と表現した。AIモデルの進化は同室が追い続け、新しい機能の使いどころを現場に提案している。\n【ポイント・注意点】月約1.3万時間という削減時間は、利用者アンケートで申告された値の合計である点に留意したい。同室は、使い込んで精度を高める「極める人」と、周囲に声をかけて横のつながりを作る「巻き込む人」という2タイプのキーマンに合わせて接し方を変えている。効果を数字で示して経営層を動かすことが、導入を広げる鍵になったという。","2026-11-20","ITmedia ビジネスオンライン","https://www.itmedia.co.jp/business/articles/2611/20/news042.html"],["Arm、データセンターでシェア0→50％に　AIエージェントでCPU再評価","Arm日本法人の横山崇幸社長は「Japan IT Week 秋 2026」の講演で、AIの用途が対話型ツールから仕事をこなすAIエージェントへ移り、CPUの役割が大きくなっていると語った。8年前に0％だったデータセンターでのArmのシェアは、2025年に主要な大規模クラウド事業者で50％に達した。スマホ向けの新しい設計パッケージでは、小規模言語モデルの処理速度が最大70％向上するという。","\n【概要】ITmedia ビジネスオンラインは11月20日、半導体設計の英Armが、AI時代のビジネス戦略をどう描き直しているかを紹介した。10月21〜23日開催の「Japan IT Week 秋 2026」で、Arm日本法人の横山崇幸社長が講演した内容を取材したものだ。生成AIではNVIDIAのGPUが注目されがちだが、AIの使われ方の変化でCPUの存在感が増しているという。\n【背景】Armは、半導体チップの回路の設計図（IP）を開発し、その使用権を半導体メーカーに提供する事業を柱とする。同社の設計を基にしたチップは、データセンターからロボットまで幅広く使われ、ほぼ全機種のスマートフォンに採用されているという。横山社長は、AIエージェントがツールを呼び出し、データベースから情報を取り出し、別のエージェントと連携する一連の処理を繰り返す中で、その多くがCPU上で行われていると説明した。\n【詳細】横山社長によると、8年前にはデータセンターでのArmのシェアは0％だったが、2025年には主要な大規模クラウド事業者のデータセンターで50％に達した。データセンター向けCPU設計「Neoverse」を採用したCPUコアの累計出荷数は15億に上り、うち5億は直近9カ月の出荷だという。端末側では、利用コストやプライバシー、応答の速さから、端末内でAI処理を終える需要が高まっている。これに応えるため、Armは9月にスマートフォン向けの設計パッケージ「CSS for Mobile 2」を発表した。中核の新型CPU「C2-Ultra」はAI向けの計算を効率化する「SME2」を搭載し、端末上の小規模言語モデルの処理速度が最大70％向上するとしている。\n【ポイント・注意点】CSSは複数の設計図を組み合わせ、最適化や動作検証まで済ませた状態で提供するもので、メーカーは設計から出荷までの期間を大幅に短縮できる。部品ごとに設計図を提供してきた従来の形からの変化を象徴する。ディナーの計画・予約をAIエージェントが行うテストでは、処理時間が前世代比で24％短くなったというが、いずれも同社が示した数値である。","2026-11-20","ITmedia ビジネスオンライン","https://www.itmedia.co.jp/business/articles/2611/20/news041.html"],["「Claude Code」から「Pi」へ　あるエンジニアが乗り換えた理由","キーマンズネットの連載は、ソフトウェアエンジニアのカレブ氏がAIコーディングツール「Claude Code」から、オープンソースの開発実行環境「Pi」へ移った経緯を紹介した。指示ファイルの二重管理、VS Code連携の制約、相次ぐ新機能によるトークン消費、頻繁に変わる内部指示といった小さな不満が積み重なったという。移行後は、安定性とシンプルな設計、柔軟なカスタマイズ性を評価している。","\n【概要】キーマンズネットの連載「金曜Black★ピット」は11月20日、人気のAIコーディングツール「Claude Code」を離れたエンジニアの事例を取り上げた。ソフトウェアエンジニアのカレブ氏は、自身のブログに2026年9月21日付で「Goodbye Claude, Hello Pi」を公開し、乗り換えの理由を説明している。\n【背景】カレブ氏は、Claude Proの契約でClaude Codeが使えるようになった頃から使い続け、1回の指示でPythonのコードが生成されたことに興奮したという。移行先の「Pi」は、AIモデルにファイル編集やコマンド実行を指示して開発を進めるオープンソースの実行環境で、AIモデルそのものではない。基本機能はシンプルで、拡張機能や指示テンプレートで調整でき、Anthropic、OpenAI、GoogleなどのAIモデルに対応する。\n【詳細】移行の背景は小さな不満の積み重ねだった。指示ファイルはClaude Codeでは「CLAUDE.md」、他のツールでは「AGENTS.md」が使われ、両方を管理する手間があった。Claude CodeがAGENTS.mdへの対応を発表したのは移行を決めた翌日で、遅すぎたという。VS Codeとの連携でも、以前の方法は同時接続が1セッションに限られ、GUI拡張は一部の組み込みコマンドが使えないなどの制約があった。複数のサブエージェントの出力が一つの画面に時系列で並び、把握しにくい点も挙げた。さらに「動的ワークフロー」「エージェントチーム」「Ultrareviews」など新機能の追加が続き、企業のトークン消費を増やす可能性があるが、同氏は必要性を感じていない。Bashツールの説明だけで約3000トークンに達することも不満の一つだった。\n【ポイント・注意点】Piへの移行後、最初の数日は調整が必要だったが、その後は快適に使えているという。複数タブのコード選択機能も、約20分で拡張機能として実装できた。記事はClaude Codeの功績を認めたうえで、ツールは機能の多さではなく、自分の開発スタイルに合うかどうかで選ぶべきだとまとめている。","2026-11-20","キーマンズネット","https://kn.itmedia.co.jp/kn/article/2611/20/2000003337/"],["さくらのAI Engine、GLM-5.3-FlashとDeepSeek新版を月3000回無料に","さくらインターネットは11月18日、生成AI向け推論API基盤「さくらのAI Engine」で、中国Z.aiの「GLM-5.3-Flash」と中国DeepSeekの「DeepSeek-V4.1-Flash-1017」の試験提供を始めた。1カ月当たり3000リクエストまで無料で使える。通常料金は両モデルとも1万トークン当たり入力0.4円、出力4.0円で、いずれも重みが公開されたオープンウェイトモデルである。","\n【概要】ITmedia AI+は11月19日、さくらインターネットが推論API基盤「さくらのAI Engine」に新たなAIモデル2種を加えたと報じた。追加されたのは「GLM-5.3-Flash」と「DeepSeek-V4.1-Flash-1017」で、試験提供として月3000リクエストまで無料で利用できる。国内のデータセンターで動く基盤から、海外発の新しいモデルを試せるようになる。\n【背景】さくらのAI Engineは、2025年9月に一般提供を始めた推論API基盤である。同社の生成AI向けクラウドサービス「高火力」を土台に、国内のデータセンターで運用するインフラ上で、国内外の複数の基盤モデルやRAG（検索拡張生成）機能をAPI経由で提供している。国内のインフラで生成AIを使いたい利用者にとって、選べるモデルの幅が広がる形となる。\n【詳細】GLM-5.3-Flashは中国Z.aiが8月に発表したモデルで、DeepSeek-V4.1-Flash-1017は中国DeepSeekが10月に発表したモデルである。いずれも重みが公開されたオープンウェイトモデルだ。今回の試験提供では、1カ月当たり3000リクエストまでを無料で使える。通常料金は両モデルとも、1万トークン当たり入力0.4円、出力4.0円と記載されている。関連情報として、さくらインターネットのプレスリリースに加え、Z.aiの公式ブログやDeepSeekのAPIページも示されている。\n【ポイント・注意点】記事は、両モデルの性能や評価には触れていない。無料枠の提供期間や試験提供の終了時期も書かれておらず、利用を検討する場合は同社の発表を確認する必要がある。また、記事の本文では「さくらのAI Engine」、見出しでは「さくらのAI推論基盤」と表記されている。通常料金は両モデルで同じ水準に設定されている。中国企業が開発したモデルである点も踏まえ、用途に応じて性能や扱いを見極めることが求められる。無料枠を使って、実際の業務での使い勝手を確かめる入り口になりそうだ。","2026-11-19","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/19/2000003339/"],["ファミマ、飲料補充にAIロボット導入　2027年1月から全国で順次","ファミリーマートは11月19日、飲料の補充業務を自動化するロボットを導入すると発表した。Telexistenceのロボット「TX GHOST」と在庫管理用の棚「スマートシェルフ」を使い、2027年1月から全国の店舗で順次導入する。ロボットは冷蔵庫内で24時間稼働し、1日最大1800本ほどを陳列できる。先行店舗では、飲料補充の作業時間を1日約7割削減する効果を確認した。","\n【概要】ITmedia AI+は11月19日、ファミリーマートが飲料補充を自動化するAIロボットを本格導入すると報じた。従業員の業務負荷の軽減と店舗運営の効率化が狙いで、全国のファミリーマート店舗を対象に2027年1月から順次導入する。使うのはロボット開発企業Telexistenceの「TX GHOST」と、在庫管理用の棚「スマートシェルフ」である。\n【背景】ファミリーマートとTelexistenceは、2020年から店舗での実証実験とロボットの改良を続けてきた。こうした積み重ねを経て、全国規模での導入に踏み切る。先行して導入した店舗では、1店舗当たり、飲料補充の作業時間を1日約7割削減する効果を確認したという。記事の見出しは「作業時間の約7割を削減」だが、本文では1店舗当たり・1日当たりの効果と明記されている。\n【詳細】新しい仕組みでは、従業員はスマートシェルフへの補充だけを行い、売り場への陳列はTX GHOSTが自動で行う。TX GHOSTは飲料を保管する冷蔵庫の中で24時間稼働し、1日当たり最大1800本ほどを陳列できる。Telexistence独自のAIが店舗の販売実績を分析し、売れ筋商品を優先して並べることで、欠品による販売機会の損失も減らせるという。スマートシェルフは、商品の最初の1本をスキャンして並べるだけで、同じ商品の場所や本数を管理できる。各商品に必要な補充本数をAIで分析し、従業員に示す機能も備える。従業員は、示された本数に沿ってスマートシェルフに補充すればよい。\n【ポイント・注意点】陳列作業の大部分はロボットが自律的にこなせるが、棚の中で倒れた飲料を立て直すなど、事前に想定しきれない場面では、人が遠隔操作でロボットを補助する。完全な無人化ではなく、人とロボットが役割を分けて効率を高める設計といえる。一方で、導入する店舗の数や費用、削減効果の測定条件については記事に記載がない。人手不足が続く小売業で、店舗ロボットがどこまで広がるかを占う取り組みとして注目される。","2026-11-19","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/19/2000003329/"],["Google「Gemini 4 Neon」公開　2カ月で4つ目、一部でFable並み","Googleは11月18日、AIモデル「Gemini 4 Neon」を公開した。Gemini 4シリーズでは2カ月足らずで4つ目となる。上位のCarbonを基にした中間的な位置付けで、Artificial Analysisのコーディング指標では59ポイントと「Claude Fable 5.2」の58ポイントと同水準ながら、タスク当たりのコストは半分以下だった。有料プラン「Google AI」のPro・Ultra加入者向けに提供を始めた。","\n【概要】ITmedia AI+によると、米Googleは11月18日（現地時間）、AIモデル「Gemini 4 Neon」を公開した。「Gemini 4」シリーズは「Argon」「Carbon」「Hydrogen」に続く4つ目で、2カ月足らずでの投入となった。一部の指標でAnthropicの最上位モデルに並ぶ性能を、低いコストで実現したとしている。\n【背景】Neonは上位モデルのCarbonをベースにしており、難度の高い長期プロジェクト向けのCarbonと、高速な日常作業向けのHydrogenの中間に位置する。Googleは開発者向けドキュメントで、Argonを一般的なコーディングや推論に使っている場合の移行先として、Neonを挙げている。\n【詳細】Artificial Analysisの「Coding Agent Index」では、Antigravity CLI版のNeon（xhigh）が59ポイントを記録し、Claude Codeで動かした「Claude Fable 5.2」（xhigh）の58ポイントと同水準だった。タスク当たりの平均コストはNeonが6.86ドル、Fable 5.2が15.47ドルで、半分以下に収まった。総合指標「Intelligence Index」ではNeonが61ポイントで3位となり、上位はFable 5.2とOpenAIの「GPT-6.2 Astra」だった。Google自身の比較では、「Claude Opus 5.5」や「GPT-6.2 Sol」と比べた19項目のうち16項目で首位だったが、「Terminal-Bench 4.1」では65.2％とOpus 5.5の65.8％に届かないなど、3項目で他社を下回った。\n【ポイント・注意点】提供は発表当日から、有料プラン「Google AI」のPro・Ultra加入者向けに、GeminiアプリやAntigravityで順次始まった。CarbonのGeminiアプリでの利用はUltra限定だが、NeonはProでも使える。API料金は100万トークン当たり入力3ドル、出力15ドルで、Carbonの標準価格より25％安い。ただしCarbonは11月30日まで半額の導入価格のため、その間はNeonの方が高くなる点に注意したい。","2026-11-19","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/19/2000003322/"],["OpenAI、AIによるAI研究のレポート公開　「依然として人間中心」","OpenAIは11月18日、社内のAI研究にAIがどう貢献しているかをまとめたレポートを公開した。AIは2〜4時間の研究タスクの約半分を自力で終えるようになり、研究者1人当たりのAI利用額は中央値で1日2400ドルに達した。一方でタスクの成功率は作業によってまちまちで、同社は「人間が依然として中心的な役割を担っている」と結論付けた。新しい評価指標「OpenAI ECI」も導入した。","\n【概要】ITmedia AI+によると、米OpenAIは11月18日（現地時間）、同社内のAI研究にAIがどう貢献しているかをまとめたレポートを公開した。社内でのAI利用は指数関数的に増えているが、AI開発では人間がいまも中心にいるとの見方を示した。9月に公開したレポートに、新たな調査結果を加えたものである。\n【背景】OpenAIは、AIが自分自身や後継システムの能力を高める「再帰的自己改善（RSI）」の進み具合を、研究機関が公表すべきだという姿勢を示している。今回の公開もその姿勢に沿ったものだという。同社は、AIの自己改善能力が高まるにつれ、競争圧力とガバナンス上の課題が増すと指摘している。\n【詳細】レポートによると、AIは2〜4時間の研究タスクの約半分を自力で完了するようになった。研究者1人当たりのAI利用額は、API料金換算の中央値で1日2400ドル（約38万円）に達し、利用額上位10％の研究者は1日2万3000ドル（約360万円）を使っている。9月時点からそれぞれ62％、105％の増加で、伸びは上位層ほど大きい。利用する研究者の数も増えているという。一方、タスクの成功率は、モデル学習の実行を監視する作業で79％、学習の実行を起動する作業で35％、推論や計算資源向けのコーディングで25％と、向上の度合いはまちまちだった。7月に同社のAIがHugging Faceの環境に侵入した事件以降、人間の研究者がAIの安全性研究に割く時間が増えたことも報告された。\n【ポイント・注意点】レポートでは、能力の向上を測る新しい指標「OpenAI ECI（OECI）」を導入し、他社のモデルを含む評価結果も公表した。モデルの性能は向上しているものの、同社は能力の向上が「加速している」とは結論付けておらず、グラフでは一定のペースでの向上を示している。同社は、人間がこの過程に関わり続けることが重要だとしている。なお、今回の数値はOpenAI自身が社内の状況をまとめたものである点にも留意したい。","2026-11-19","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/19/2000003318/"],["ElevenLabs、日本の音声AI企業Kotobaを約159億円で買収へ","AI音声サービスの米ElevenLabsは11月17日、音声AIスタートアップのKotoba Technologiesを約1億ドル（約159億円）で買収すると発表した。Kotobaは2023年創業で従業員は15人。東京都の拠点で東アジアの言語に強い音声AI「Koto」を開発してきた。買収は2026年第4四半期後半に完了する見込みで、買収後も開発拠点は東京都に置く予定だ。","\n【概要】ITmedia AI+は11月19日、米ElevenLabsによるKotoba Technologiesの買収を取り上げた。買収額は約1億ドル（約159億円、1ドル159円換算）で、2026年第4四半期後半に完了する見込みだ。社員15人のスタートアップに大きな値が付いた理由として、東アジアの言語に関する知見が挙げられている。\n【背景】Kotoba Technologiesは2023年創業で、本社は米国にある。経済産業省のAI開発プロジェクト「GENIAC」に採択された実績を持ち、東京都の開発拠点で、東アジアの言語に強い音声AI「Koto」を開発してきた。ElevenLabsは2025年4月に日本法人ElevenLabs Japanを設立し、同年11月には声優事務所のエイティワンプロデュースなどと「声の保護と多言語化協会」を立ち上げるなど、日本での活動を広げてきた。\n【詳細】ElevenLabsのマティ・スタニシェフスキーCEOは、AI音声技術では各言語のニュアンスや社会規範を開発の最初期から組み込むことが重要で、Kotobaはこの点が評価されたと説明した。「東アジアの言葉を最も熟知しているのがKotoba Technologies」と述べ、その知見を生かして、日本語を含む東アジア言語に特化した音声AIの研究開発を進める方針を示した。Kotobaの小島熙之CEOは、日本に研究開発組織を残しつつ、世界トップのAI企業の計算資源などを使って地域に合った製品やモデルを作る例はこれまでなかったと語り、「国益に資するのではないか」との見方を示した。\n【ポイント・注意点】買収後も開発拠点は東京都に置く予定で、日本の研究開発組織は維持される。海外の大手が日本の専門チームを取り込み、日本語を含む東アジア言語の音声AIに力を入れる動きとして注目される。ElevenLabsが立ち上げに関わった協会は、声優や俳優の声の権利保護と、日本語以外への多言語化を目指している。ただし買収の完了はこれからであり、具体的な製品やサービスへの反映時期は、今後の発表を待つ必要がある。","2026-11-19","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/19/2000003306/"]],"gh-pop":[["ゲーム配信ホスト「Sunshine」新版、macOSでゲームパッド対応","ゲーム画面を別の端末へストリーミングするホストソフト「Sunshine」が、11月21日にプレリリース版v2026.1121.135813を公開した。macOSでlibvirtualhidを使ったゲームパッド対応、LinuxでのPortal方式の画面取り込みへの切り替え、Vulkanの画質設定vk_qualityの追加など多くの機能が入った。Windowsでは外部で管理する音声の取り込みに対応した。macOSのビルドはmacOS 15へ移行している。","\n【概要】ゲーム画面を別の端末へストリーミングするためのホストソフト「Sunshine」が、11月21日にv2026.1121.135813を公開した。正式版ではなくプレリリースの扱いで、前回のタグ以降にたまった多数の変更がまとめて載っている。\n【背景】Sunshineは、ストリーミング用の通信部品moonlight-common-cを取り込み、PCの画面と音声を符号化して送る役目を担う。対応するOSや画面の取り込み方式が多く、各OSでの取り込みや入力の改善が更新の中心になりやすい。\n【詳細】新機能では、macOSでlibvirtualhidを使ったゲームパッド対応が入った。Linuxでは、Portal方式の画面取り込みへの切り替えに対応したほか、wlroots系の取り込みでVulkanによる符号化を使えるようにした。NVIDIA以外の取り込みではRAMを経由する方式に切り替え、画面のないNVIDIA環境ではSHM方式への切り替えとGBMの確保の粘り強さを加えた。Vulkanには画質を調整するvk_qualityの設定が加わり、Windowsでは外部で管理する音声の取り込みに対応した。権限まわりでは、各OSのアクセス状況を表示し、許可のあとに再起動する仕組みを入れた。修正では、fec_percentageを0にして誤り訂正を無効にできるようにし、入力パケットを配信ごとに順番どおり処理するよう改めた。MiniUPnPc 2.2.8以降の状態表示への対応、ディスク上で変更されたアプリ一覧の再読み込み、配信中にWindowsの画面配置を保つ修正、ペアリング時に重複したクライアント証明書を置き換える修正も含む。Web画面は1ページ構成のアプリに作り替えられた。\n【ポイント・注意点】macOSのビルドはmacOS 15へ移行しており、変更履歴では互換性に関わる変更を示す「!」の印が付いている。プレリリースのため、安定性を重視する人は正式版を待つのが無難だ。依存部品の自動更新も多数含まれる。","2026-11-21","GitHub（SunshineStream/Sunshine）","https://github.com/SunshineStream/Sunshine/releases/tag/v2026.1121.135813"],["CRM「Twenty」v2.60.3、AI向けツールに破壊的操作の印","オープンソースのCRM「Twenty」が11月21日にv2.60.3を公開した。AIが外部から操作するためのMCPツールのうち、記録の更新・削除・統合など、データを上書きしたり消したりするものに「destructiveHint: true」の印を付けた。これまで書き込み系のツールはすべてfalseを送っていた。OpenAIの指針に合わせた変更で、利用側のAIが確認を求める場面が増える可能性があると作者は説明している。","\n【概要】顧客管理（CRM）をオープンソースで提供する「Twenty」が、11月21日にv2.60.3を公開した。今回の変更は1点に絞られており、AIからTwentyを操作するためのMCPツールに、データを上書きまたは削除するかどうかを示す印を正しく付けるようにした。\n【背景】リリースノートによると、公開中のChatGPT向けアプリには記録の作成・検索・集計・削除のツールが並ぶ一方、update_recordやupsert_records、merge_recordsなど更新系のツールや、項目定義を削除するツールが載っていなかった。原因は、MCPの書き込み系ツールがすべてdestructiveHint: falseを送っていたことにある。作者は、OpenAIの指針では上書きや削除の効果を持つツールにはtrueが必要で、OpenAIの日次の審査で該当ツールが止められていたと説明している。\n【詳細】記録の更新、upsert、削除、統合のツールはtrueに変わり、検索、集計、作成はfalseのまま。@DefineToolで定義された30個のツールにも、isDestructive: trueで印を付けた。項目定義やビュー、ロール、Webhook、ページ配置、検証ルールなどの削除・更新・upsertと、メンバーにロールを割り当てるツールが対象だ。ワークフローでは、手順やトリガーの更新、手順や接続の削除、版の有効化と無効化、ワークフロー自体の削除という7つのツールが対象になった。印は名前から推測せず、ツールごとに宣言する方式を選び、DefineToolOptionsにisDestructiveを追加した。手元のテストでは、MCPやワークフロー関連の単体テスト263件と、ツール一覧の結合テスト36件がすべて通ったという。\n【ポイント・注意点】作者自身が、AIの利用側が確認を求める回数が増えうると書いている。公開済みのdelete_recordsも印が変わるが、更新が審査で止められた場合も、既存のツールは承認済みの情報のまま残ると説明されている。AIとCRMをつなぐ使い方では、確認の手間と安全性の釣り合いが変わる点を押さえておきたい。","2026-11-21","GitHub（twentyhq/twenty）","https://github.com/twentyhq/twenty/releases/tag/twenty%2Fv2.60.3"],["「Transformers」v5.24.0、新モデル多数と引数名の整理","Hugging Faceの機械学習ライブラリ「Transformers」が11月21日にv5.24.0を公開した。1,600を超える言語に対応する音声認識のOmnilingual ASRや、Inkling 2 Mini、Apertus 1.5など新モデルを多数追加した。破壊的変更として、生成時のキャッシュを渡す引数past_key_valuesとcache_paramsを「cache」に改名した。peft 0.22.0以上が必須になった点にも注意が要る。","\n【概要】Hugging Faceが開発する機械学習ライブラリ「Transformers」が、11月21日にv5.24.0を公開した。v5.23.0からの更新で、新しいモデルの追加、引数名の整理を含む破壊的変更、生成や推論まわりの多数の修正が含まれる。\n【背景】Transformersは、公開されたモデルを共通の書き方で読み込み、学習や推論に使えるようにするライブラリだ。新しいモデルへの対応の速さが特徴で、今回の版も新モデルの取り込みと内部の整理を同時に進めた。\n【詳細】新モデルは、24層の構成で一部の層を3回繰り返す多モーダルのInkling 2 Mini、映像のEMU3.5や音声のWavTokenizerと組み合わせるApertus 1.5、24kHzの音声を扱うWavTokenizer、1,600を超える言語に対応し300Mから7Bまでの大きさがある音声認識のOmnilingual ASR、総パラメーター7.2Bのうち働くのは0.6BのLara Miniなど。専門家を128個持つSarvamMLAとSarvamMoE、EXAONE、Dory、HY4-VLも加わった。破壊的変更では、past_key_valuesとcache_paramsを「cache」に改名した。旧名は非推奨の警告付きで動き、forwardなどではv5.40.0まで、generateではv6.0.0まで受け付ける。両方を渡すとValueErrorになる。またpeft 0.22.0以上が必須となり、modeling_attn_mask_utils.pyは削除された。書き出したモデルは、ONNXやOpenVINO、ExecuTorch形式ならtrust_remote_codeなしで読めるようになった一方、pickle形式の.pt2はtrust_remote_code=Trueが必要になった。\n【ポイント・注意点】新モデルを試したい人には魅力の大きい更新だが、独自のコードでpast_key_valuesを直接渡している場合は警告が出始める。猶予はあるものの、早めの書き換えが望ましい。PEFTと組み合わせる環境ではpeftの版も同時に上げる必要がある。.pt2の読み込み方も変わるため、既存の手順を確かめておきたい。","2026-11-21","GitHub（huggingface/transformers）","https://github.com/huggingface/transformers/releases/tag/v5.24.0"],["AIコーディング「Cline」v4.1.27、ファイル読み込み上限を拡大","エディター上で動くAIコーディング支援「Cline」が11月21日にv4.1.27を公開した。read_filesの結果を8千字で切る制限をなくし、ツール本来の上限である2,000行・約4万8千字まで読めるようにした。LM Studioの設定にAPIキー欄を加え、MCPの読み取り専用ツールに印を表示する。モデル一覧にはmodels.devから94のプロバイダーを加えた。推論の強さの設定まわりの不具合も多く直している。","\n【概要】VS Codeなどのエディターで動くAIコーディング支援「Cline」が、11月21日にv4.1.27を公開した。追加・変更・修正の3区分で、ファイルの読み込み、モデルの選択、推論の強さの扱いを中心に手が入っている。\n【背景】Clineは多数のAIプロバイダーとモデルを切り替えて使えるのが特徴だ。モデルの入れ替わりが激しい中、一覧や既定値の更新が頻繁に行われており、今回も一覧の大幅な見直しが含まれる。\n【詳細】追加では、「Require Authentication」を有効にしたLM Studioのサーバー向けにAPIキーの入力欄を設けた。MCPの画面では、サーバーが読み取り専用と宣言したツールに「read-only」の印を表示する。アカウント画面にはデータ利用の設定へのリンクを置き、拡張機能に第三者ライセンスの表記を同梱した。変更では、保存済みのモデルがない場合、Clineプロバイダーは「Claude Sonnet 5.5」ではなく最初の無料モデルで始まるようになった。推論の強さの選択欄には、新しいタスクで使われる値と「Default」の項目を表示する。read_filesの結果は8千字で切られなくなり、ツール自身の上限である2,000行、約4万8千字まで届く。モデル一覧ではmodels.devから94のプロバイダーを加え、LilacとTemprを外した。ほかに67のプロバイダーで既定のモデルが変わった。修正では、推論の強さで「None」を選んだ設定が保存・送信されるようになり、Azure上のGPT-6がツール呼び出しを拒む問題が解消した。中断した回の推論の文章が次の回の頭に出る問題や、LiteLLMで入力の上限を取り違える問題も直した。コミット検索は引用符付きの語句を正確に探せるようになった。\n【ポイント・注意点】セキュリティ面では、undiciを7.30.1に上げ、処理が落ちる問題2件に対応した。モデルを保存していない利用者は起動時のモデルが変わるため、意図したモデルが選ばれているか確認したい。読み込み上限の拡大は便利な半面、一度にやりとりする量が増える点は意識しておきたい。","2026-11-21","GitHub（cline/cline）","https://github.com/cline/cline/releases/tag/v4.1.27"],["プロキシ管理「v2rayN」8.0.0、WebUIとネイティブAOTに対応","プロキシの接続を管理するクライアント「v2rayN」が、11月21日にプレリリース版8.0.0を公開した。Web画面（WebUI）と、画面なしで操作できるWebAPIに対応したほか、ネイティブAOTでビルドした版を配布に加えた。MASQUE方式のWARP、XrayのXDRIVE通信方式、複数の出口を扱うCustomOutboundにも対応する。Windows向けのプロジェクト名はv2rayN.Windowsに改めた。","\n【概要】Xrayなどの通信方式を使うプロキシクライアント「v2rayN」が、11月21日に8.0.0を公開した。プレリリースの扱いで、メジャー番号が上がった今回は、操作の入口と配布形式に大きな変更が加わった。\n【背景】v2rayNはこれまで、デスクトップの画面から設定を操作する使い方が中心だった。今回Web画面とAPIを備えたことで、画面を持たない環境で動かす道が開かれる。リリースノートは中国語で書かれ、「本次更新」の見出しの下に変更点が並ぶ。\n【詳細】最大の追加は、WebUIの機能と、画面なしで使うWebAPIへの対応だ。設定方法の案内もディスカッションとして用意された。配布では、ネイティブAOTに対応し、AOTでビルドした版をダウンロード一覧に加えた。画面まわりでは、ReactiveUIを新しくし、デスクトップ版の表の部品ProDataGridを更新して、列の幅を動的に調整できるようにした。通信面では、MASQUE方式のWARPに対応し、XrayのXDRIVEという通信方式を追加した。購読した設定に含まれるドメインを事前に名前解決し、IPアドレスに置き換える機能も入った。CustomOutboundは複数の出口を扱えるよう拡張された。このほか、Windows向けのWPFプロジェクトの名前をv2rayN.Windowsに変えた。ダウンロードできるファイルは89に上り、どれを選べばよいかはWikiの説明ページで案内している。主な変更点にはIssueやプルリクエストの番号が添えられ、リリースには38人が反応を寄せている。\n【ポイント・注意点】プロジェクト名の変更は破壊的変更とは書かれていないが、自分でビルドしている人には影響しうる。プレリリースのため、普段使いの環境では安定版との違いを確かめてから切り替えたい。不具合の修正としてまとめられた項目はなく、今回は機能の追加が中心の版となっている。プロキシ関連のソフトは国や地域によって扱いが異なるため、使う場合は各地の法令や利用規約の確認も欠かせない。","2026-11-21","GitHub（2dust/v2rayN）","https://github.com/2dust/v2rayN/releases/tag/8.0.0"],["Claude Code v2.1.330、定期タスクの期間を30日に延長","AnthropicのAIコーディングの道具「Claude Code」が11月20日にv2.1.330を公開した。定期実行のタスクと/loopの上限を7日から30日に延ばし、Enterprise Admin Consoleで管理する組織へのサインインに対応した。グラフを描く組み込みのmod「easel」も加わった。長い会話の圧縮後に固まる問題や、WebFetchが数分止まる問題など、多くの不具合も直している。","\n【概要】Anthropicが開発するAIコーディングの道具「Claude Code」が、11月20日にv2.1.330を公開した。変更の一覧は長く、追加、変更、修正、差し戻し、VS Code拡張の各項目にわたる。\n【背景】Claude Codeは端末で動くCLIを中心に、VS Codeの拡張などからも使える。企業での利用や、自前の実行環境で動かす使い方も広がっており、今回も管理や運用に関わる機能が多く入った。\n【詳細】追加では、claude auth loginのあと、AnthropicのEnterprise Admin Consoleで管理される組織にサインインできるようにした。グラフを描く組み込みのmod「easel」も入り、/configで無効にできる。自前の実行環境では、開始フォルダーを指定する--start-dirと、登録や最初のセッションまでの時間を数える/metricsの計測値が加わった。変更では、定期実行のタスクと/loopが動ける期間を7日から30日に延ばした。deniedMcpServersに名前で書いた項目は、その名前のclaude.aiのコネクターだけを隠すようになった。spawn-runnerのフックは、既定で4つまで同時に動く。修正では、非常に長い会話を圧縮したあとに固まる問題、WebFetchが数分止まる問題、ディスクがいっぱいでもclaude -pが成功として終わる問題などに対処した。最後の件は終了コード1を返すよう改めた。/statsが日付をUTCで数えていた点も直した。差し戻しとして、v2.1.329で外した、max_tokensがモデルやゲートウェイの上限を超えた場合の自動再試行を元に戻した。VS Code拡張には/forkや/workflowsのほか、escapeStopsClaude、pinPrompt、contextUsageThresholdといった設定が加わった。\n【ポイント・注意点】claude --teleportがgitのコマンドを実行せずに表示するだけの場合があり、-pを付けると終了コード1で終わるなど、自動処理に組み込んでいる人には挙動の変化がある。終了コードを見て判断するスクリプトは確認しておきたい。","2026-11-20","GitHub（anthropics/claude-code）","https://github.com/anthropics/claude-code/releases/tag/v2.1.330"],["OpenAI Agents SDK、1.0初のアルファでCodexを内蔵","OpenAIのPython向けエージェント開発キット「Agents SDK」が、11月20日にv1.0.0-alpha.1を公開した。1.0系の最初の試験版で、Codexの中核部分（Codex Core rust-v0.166.0）をPyO3経由でそのまま組み込み、実行ごとにCodexを選べるCodexProviderを用意した。配布はGitHub Releasesのみで、CPython 3.10〜3.14向けに4種類のwheelがある。","\n【概要】OpenAIが公開しているPython向けのエージェント開発キット「Agents SDK」が、11月20日にv1.0.0-alpha.1を公開した。プレリリースの扱いで、feat/simple-codexという開発系統からの最初のプレビューと位置付けられている。\n【背景】Agents SDKは、AIモデルに道具を使わせたり、複数のエージェントの間で処理を引き継がせたりする仕組みを提供する。今回の版は、OpenAIのコーディング用エージェント「Codex」をPythonの中から直接使えるようにする点が柱になっている。\n【詳細】新しいCodexProviderをagents.models.codexから読み込み、RunConfigのmodel_providerに渡すと、その実行でCodexを選べる。認証は保存済みのログイン情報か、api_keyの指定で行う。wheelには、手を加えていないCodex Core rust-v0.166.0がPyO3を通して組み込まれており、codex app-serverの起動やJSON-RPCでのやりとりが要らなくなった。使い終わったらaclose()で閉じる。SDK側の機能としては、文章のストリーミング、引き継ぎ、Pythonのツールを動かす前の承認、型付きの出力に対応する。修正では、自動の会話圧縮がCodexでも手元の会話履歴を使うようにしたほか、保存したサンドボックスの構成が再開時にバイナリーファイルを保つようにした。配布は1.0.0a1という版番号のwheelで、GitHub Releasesでのみ提供される。対象はCPython 3.10から3.14で、Linuxのx86-64とARM64、Apple silicon搭載のmacOS 11以降、Windows x64の4種類が用意され、SHA256SUMSも添えられている。\n【ポイント・注意点】v0.24.0-alpha.8のハーネス版でAgent.run()やSession.submit()を使っていた場合は、Runner.run()かRunner.run_streamed()への移行が求められる。SessionStateの保存形式はRunStateと異なるため、途中の実行は先に終えておく必要がある。配布元がGitHub Releasesに限られる点にも注意したい。","2026-11-20","GitHub（openai/openai-agents-python）","https://github.com/openai/openai-agents-python/releases/tag/v1.0.0-alpha.1"],["「Browser Use」1.0.7、MCP呼び出しの60秒切れを解消","AIエージェントにWebブラウザーを操作させるライブラリ「Browser Use」が、11月20日に1.0.7を公開した。MCP経由の呼び出しが60秒で時間切れになる問題を直し、時間のかかるbrowser_execは50秒以内にそれまでの出力を返すようにした。処理自体は続き、空のコードで再び呼ぶと残りを受け取れる。READMEには企業向けの案内を加え、コーディングエージェントに連携の感想を求める仕組みも入れた。","\n【概要】AIエージェントにWebブラウザーを操作させるためのライブラリ「Browser Use」が、11月20日に1.0.7を公開した。変更は3点と小さいが、MCP経由で使う際の使い勝手に直結する修正が含まれる。導入はpip install 'browser-use==1.0.7'で行える。\n【背景】Browser Useは、AIにWebページを開かせ、クリックや入力をさせて作業を進めるための道具だ。コーディング用のAIエージェントから、MCPという共通の接続方式で呼び出す使い方も用意されている。ただ、MCPの呼び出しが60秒で時間切れになり、時間のかかるブラウザー操作では応答が途切れる問題があった。\n【詳細】今回の中心は、MCPの呼び出しが60秒で時間切れにならないようにした修正だ。時間のかかるbrowser_execは、50秒以内にその時点までの出力を返す。50秒未満で終わる呼び出しは従来どおりの応答になる（#6477）。返事を返したあとも処理の単位であるセルは動き続けており、空のコードでbrowser_execをもう一度呼ぶと残りの結果を受け取れる。長い操作を途中で打ち切られずに最後まで進められるようにする工夫と言える。2点目はREADMEの更新で、企業向けのBrowser Useの案内を加え、Pythonの導入手順にクラウドのAPIキーへのリンクを戻した。3点目として、スキル、README、CLI、MCPの各所で、コーディングエージェントに連携についての感想を求めるようにした。コミットはGPGの署名で検証済みと表示されている。\n【ポイント・注意点】MCPから長い操作を呼ぶと、途中で返事が来る形に変わる。呼び出す側は、結果が途中までの場合に空のコードで続きを取りに行く流れを想定しておく必要がある。破壊的変更の記載はなく、短い操作だけを使う人への影響は小さい。エージェントに感想を求める仕組みが加わった点は、連携の手触りを改善したいという開発陣の姿勢の表れと言えそうだ。","2026-11-20","GitHub（browser-use/browser-use）","https://github.com/browser-use/browser-use/releases/tag/1.0.7"],["TypeScriptのORM「Drizzle」1.0 RC6、ESM専用に","TypeScript向けのデータベース操作ライブラリ「Drizzle ORM」が11月20日に1.0.0-rc.6を公開した。drizzle-ormをESM専用とし、Node.jsの対応を^20.19.0または22.12.0以降に絞った。クエリーのキャッシュ機能を削除するなど破壊的変更が多い一方、複数の問い合わせをまとめて送るpipelineやparallel、PostgreSQL向けの一括挿入・一括更新などを追加した。","\n【概要】TypeScriptでデータベースを型安全に扱うためのライブラリ「Drizzle ORM」が、11月20日に1.0.0-rc.6を公開した。正式版1.0に向けたリリース候補で、プレリリースの扱いだ。破壊的変更と新機能の両方が多い。\n【背景】Drizzleは、SQLに近い書き方で問い合わせを組み立てられるORMだ。1.0に向けて内部の仕組みや対応する実行環境を整理する作業が続いており、今回の候補版でも古い仕組みの削除が目立つ。\n【詳細】破壊的変更では、ドライバーが出力の変換を設定しなくなり、型変換の仕組みを削除した。これにより、order byを伴うselect distinctの不具合が直るという。クエリーのキャッシュ機能（cache/coreやcache/upstash、$withCache）も削除した。drizzle-ormはESM専用となり、Node.jsは^20.19.0または22.12.0以降が必要になる。以前@drizzle-team/minipgと呼ばれていたPostgreSQL用ドライバーは本体に同梱された。concatとsubstringの書き方が変わり、項目として選んだ副問い合わせの型にnullが含まれるようになった。pgのインデックスの.concurrently()も外された。新機能では、複数の問い合わせをまとめるdb.pipelineとdb.parallel、PostgreSQL向けのdb.bulkInsertとdb.bulkUpdateを加えた。PGliteやEffect向けのドライバー、変更データを取り出すcdc、トランザクション用の接続プールの検出、SQLiteのrowId.big()も入った。修正では、offsetの0が落ちる問題や、西暦1〜9999年の範囲外の日付の扱いなどに対処した。drizzle-kitもESM専用となり、PostgreSQLのスナップショット形式は10に上がった。pullとpushの読み取りは速くなった。\n【ポイント・注意点】ESM専用化とNode.jsの版の制限は、既存の構成に直接響く。キャッシュ機能を使っている場合は代わりの手段が要る。リリース候補の段階のため、移行の前に変更点を一つずつ確かめたい。","2026-11-20","GitHub（drizzle-team/drizzle-orm）","https://github.com/drizzle-team/drizzle-orm/releases/tag/v1.0.0-rc.6"],["AI開発エージェント「OpenHands」v1.43.0、決定カードを試験導入","AIがソフトウェア開発を進めるエージェント「OpenHands」が11月20日にv1.43.0を公開した。セットアップの案内から自動処理を作れるようにしたほか、試験機能を切り替える「Features」ページ、チャット内の決定カード、エージェントによるメッセージ編集を試験的に加えた。会話のメッセージ一覧を仮想化して表示を軽くする性能改善も入った。破壊的変更の記載はない。","\n【概要】ソフトウェア開発をAIエージェントに任せるためのオープンソース「OpenHands」が、11月20日にv1.43.0を公開した。変更一覧はRelease Pleaseで自動生成されており、新機能5件、不具合修正2件、性能改善1件、文書3件、保守15件が並ぶ。\n【背景】OpenHandsは、エージェント本体のサーバーや自動処理の部品、拡張機能を組み合わせて動く。決まった作業を自動で走らせる「automation」の機能も備えており、今回はその使い勝手に関わる変更が目立つ。\n【詳細】新機能では、セットアップの案内画面から自動処理を作れるようにした。利用者ごとの試験機能を切り替える「Features」ページを設け、会話への反応機能をその対象とした。チャットに表示する決定カードと、エージェントによるメッセージの編集も、試験機能として加わった。自動処理の実行一覧には、会話があることを示すアイコンを表示する。修正では、会話を切り替えても自動処理の設定画面の入力が消えないようにし、設定の一覧で「Experimental」をSecretsのあと、最後に並べるようにした。性能面では、会話のメッセージ一覧を仮想化した。変更の全体はv1.42.0からの差分として示されている。保守では、driver.jsやvite、posthog-jsなど依存部品の更新が中心で、エージェントサーバーや自動処理、拡張機能の版も引き上げた。貢献者はneubig氏、enyst氏ほか計8人と表示されている。\n【ポイント・注意点】破壊的変更は記載されていない。macOS向けのアプリ「OpenHands Agent Canvas」はまだAppleの開発者IDで署名されておらず、xattrコマンドで隔離属性を外す手順が案内されている。署名の対応はIssue #16774で追跡中だ。試験機能は今後変わる可能性があるため、日々の作業で頼る前に動作を確かめたい。メッセージ一覧の仮想化は、長い会話を扱う人ほど効果を感じやすい改善になりそうだ。","2026-11-20","GitHub（OpenHands/OpenHands）","https://github.com/OpenHands/OpenHands/releases/tag/v1.43.0"],["「LocalAI」v5.0.1、Windowsでのネイティブ動作に対応","手元のマシンでAIモデルを動かすための「LocalAI」が、11月20日にv5.0.1を公開した。サーバーとllama.cppの処理部をWindows上でそのまま動かせるネイティブ対応が入ったほか、AMDのGPU向けにROCm 10.1での既定ビルド、ベンガル語の翻訳、起動用アプリのデスクトップ通知などを加えた。新しいモデルファイルの検証が済むまで古いファイルを残す修正も入っている。","\n【概要】自分のマシンでAIモデルを動かすためのオープンソース「LocalAI」が、11月20日にv5.0.1を公開した。5.0系の最初の修正版で、機能追加9件、修正6件、取り込み部品の更新7件などが並ぶ。\n【背景】LocalAIは、llama.cppやwhisper.cppなど複数の推論エンジンを取り込み、まとめて扱えるようにしている。今回もそれらの部品の更新が多く、対応する環境を広げる変更が目立つ。\n【詳細】最も大きいのは、Windowsへのネイティブ対応だ。サーバー本体と、windows/amd64向けのllama-cppの処理部が対象になる。AMDのGPU向けには、hipblasのイメージを既定でROCm 10.1でビルドするようにし、privacy-filterにもROCm版のイメージを用意した。画面まわりでは、ネットワークの中間の選択肢を「Custom」と呼び、対象のドメインを表示するようにした。起動用アプリはサーバーの受信箱をデスクトップ通知で知らせ、glibcのない環境でもx64のAppImageを起動できるようにした。React製の画面と追加機能にはベンガル語の翻訳が加わり、darwin/arm64向けのサンドボックスの包みも有効になった。Studioではループの設定を簡単にした。修正では、新しいモデルファイルの検証が終わるまで古いファイルを残すようにしたほか、ROCmで実際に入っているGPUのフォルダーを参照するようにした。追加機能の一覧は、GitHubのリリースの転送先を追うようになった。ik_llama.cpp、whisper.cpp、llama.cppなどの取り込み部品も更新されている。新しい貢献者として2人が名を連ねた。\n【ポイント・注意点】Windowsでそのまま動かせるようになったことで、Windows利用者が試しやすくなる。ただし対象はamd64向けのllama-cppの処理部で、すべての機能がWindowsで動くとは書かれていない。AMDのGPUを使う人は、ROCmの版の変更にも注意したい。","2026-11-20","GitHub（mudler/LocalAI）","https://github.com/mudler/LocalAI/releases/tag/v5.0.1"],["Anthropic公式Python SDK v2.12.0、Bedrockの設定を修正","AnthropicのAPIをPythonから使う公式SDKが、11月20日にv2.12.0を公開した。Amazon Bedrock経由でユーザープロファイルIDを指定しても反映されていなかった問題を直し、IDをヘッダーではなく要求の本文に入れて送るようにした。一方、プロファイルに対応しないBedrockのモデルでは、IDを付けると400エラーになる。画像の大きさが上限を超えた場合のエラーコードも追加した。","\n【概要】AnthropicのAIモデルをPythonから呼び出すための公式SDK「anthropic-sdk-python」が、11月20日にv2.12.0を公開した。変更は機能追加1件、修正1件、文書の整理1件で、中でもAmazon Bedrockで使う人に関わる修正が中心になる。\n【背景】このSDKは、Anthropic自身のAPIのほか、Amazon Bedrock経由でClaudeを使うためのクライアントも備えている。Bedrock用にはAnthropicBedrockとAsyncAnthropicBedrockという2つのクライアントがあり、利用者ごとのプロファイルIDを指定できる。\n【詳細】リリースノートによると、Amazon Bedrockはuser_profile_idを要求の本文から読み取り、anthropic-user-profile-idというヘッダーは無視する。このため、2つのBedrock用クライアントにプロファイルIDを渡しても、実際には反映されていなかった。今回の修正で、両クライアントはIDをMessagesの要求の本文に移し、ヘッダーとしては送らなくなった。本文にすでにuser_profile_idが入っている場合は、そちらが優先される。機能追加としては、APIのエラーコードにimage_dimensions_too_largeを加えた。画像の縦横の大きさが大きすぎる場合を見分けられるようになる。文書の整理では、一括処理のbilling_policyと、課金に関する2つのエラーについての説明を明確にした。\n【ポイント・注意点】注意したいのは挙動の変化だ。Bedrockの一部のモデルはユーザープロファイルに対応しておらず、そうしたモデルにプロファイルIDを付けて要求すると、今後は400エラーで失敗する。これまではIDが無視されるだけだった。リリースノートは、そうしたモデルへの要求ではIDを付けないよう勧めている。破壊的変更とは書かれていないが、Bedrockで全モデルに一律でIDを付けている構成では、更新後にエラーが出ないか確かめておきたい。","2026-11-20","GitHub（anthropics/anthropic-sdk-python）","https://github.com/anthropics/anthropic-sdk-python/releases/tag/v2.12.0"],["ホワイトボード「tldraw」v5.6.2、危険なリンクを遮断","Webアプリに組み込めるホワイトボード「tldraw」が11月20日にv5.6.2を公開した。tldrawが知らないアプリを開くリンクは開く前に確認するようにし、smb:やms-word:など悪用が知られた方式のリンクを新たに遮断した。こうした方式を使う既存のリンクは消去される。開発者向けには、リンクの開き方を決めるgetLinkOpenPolicy()やopenLink()などを追加した。","\n【概要】Webアプリにホワイトボードを組み込むための部品「tldraw」が、11月20日にv5.6.2を公開した。変更は改善1件で、図の中に置いたリンクを開くときの安全性を高める内容だ。\n【背景】tldrawでは、図形などにリンクを付け、クリックして開くことができる。リンクの先頭にある方式名によっては、Webページではなく端末上の別のアプリが起動する。中には悪用の手口が知られているものもあり、利用者がうっかり開くと危険につながりうる。\n【詳細】今回の版では、tldrawが知らないアプリを開くリンクについて、開く前に利用者に確認するようにした。あわせて、smb:やms-word:のように悪用が知られている方式を遮断する対象を増やした。これらの方式を使っている既存のリンクは消去される。開発者向けには、tldrawのパッケージにgetLinkOpenPolicy()、openLink()、TLLinkOpenPolicyを追加した。リンクを開くときの方針を確かめたり、決まった手順で開いたりできるようになる。イベントの一覧であるTLEventMapにはconfirm-open-linkというイベントが加わり、確認の場面を受け取れる。リンクのURLを検証するT.linkUrlも、受け付けない方式を増やした。変更の一覧は、v5.6.1からの差分をもとに自動で生成されたもので、今回の変更は#11561と#11594の2つのプルリクエストに基づく。\n【ポイント・注意点】安全性の向上は歓迎できる一方、既存の図に含まれる該当方式のリンクは消えてしまう点に注意が要る。社内のファイル共有をsmb:のリンクで参照していた場合などは、更新後にそのリンクが使えなくなる。tldrawを組み込んだアプリを作っている開発者は、確認の画面が利用者にどう見えるかや、confirm-open-linkのイベントを使って独自の扱いが必要かを検討しておきたい。破壊的変更として区別された記載はないが、実質的には既存データに影響する変更と言える。","2026-11-20","GitHub（tldraw/tldraw）","https://github.com/tldraw/tldraw/releases/tag/v5.6.2"],["自動化ツール「n8n」2.49.3、HTTP要求のページ送りを修正","ワークフロー自動化ツール「n8n」が11月20日に2.49.3を公開した。不具合修正だけの版で、HTTP Requestノードのページ送りで応答の本文が空の場合の処理、メモリーを守る仕組みが空きを作れなかった場合の保留解除、スクリプト系ノードのエラー出力に元の入力を保存する修正、お知らせ表示の操作性の4件を直した。GitHub上ではプレリリースの扱いとなっている。","\n【概要】様々なサービスをつないで作業を自動化するワークフローツール「n8n」が、11月20日に2.49.3を公開した。変更一覧にあるのは「Bug Fixes」の4件だけで、新機能や破壊的変更はない。GitHub上ではプレリリースとして扱われている。\n【背景】n8nは、画面上でノードをつないで処理の流れを組み立てる道具で、外部のAPIを呼ぶHTTP Requestノードや、コードで処理を書くスクリプト系のノードがよく使われる。今回の版は2.49.2に続く修正版となる。リポジトリの画面には開いたままのプルリクエストが922件表示されており、開発が活発に続いている。\n【詳細】1件目は、中核部分とHTTP Requestノードの修正で、ページ送り（ページネーション）の途中で応答の本文が空だった場合を正しく扱えるようにした。複数ページに分かれた結果を順に取りに行く処理で、空の応答に当たったときの扱いを改めたものだ。2件目は、メモリーを守る仕組みの修正で、保留して処理を止めても空きが生まれなかった場合に、保留の状態を終えるようにした。3件目は、スクリプト系のノードのエラー出力に、加工していない入力データを保存するようにしたもの。失敗したときに、どのデータで問題が起きたかを追いやすくなる。4件目は編集画面の修正で、アカウントのメニューの上に出るお知らせを操作できる状態に保つようにし、案内が隠れて押せなくなる事態を防ぐ。4件はいずれもプルリクエストの番号付きで示され、配布物は5つ用意されている。変更点の比較はn8n@2.49.2からの差分として示されている。\n【ポイント・注意点】いずれも日常的に使う機能に関わる修正で、特にHTTP Requestノードでページ送りを使っている人や、メモリーに制限のある環境で動かしている人には意味がある。ただ、GitHub上ではプレリリース扱いのため、本番の環境に入れる前に、使っているワークフローで動作を確かめておきたい。新機能を待っている人にとっては、見送っても困らない小さな更新と言える。","2026-11-20","GitHub（n8n-io/n8n）","https://github.com/n8n-io/n8n/releases/tag/n8n%402.49.3"],["ダウンローダー「Ghost Downloader 3」v4.5.11、5言語を追加","「必要な唯一のダウンローダー」をうたうオープンソースのダウンロード管理ソフト「Ghost Downloader 3」が11月20日にv4.5.11を公開した。ドイツ語、フランス語、インドネシア語、イタリア語、韓国語の5言語に対応したほか、タスクバーが進み具合の表示に対応しないWindows環境で、毎秒エラーが出る問題を直した。開発者は学業のため今後の更新頻度が下がると告知している。","\n【概要】GitHubのTrendingで注目を集めるダウンロード管理ソフト「Ghost Downloader 3」が、11月20日にv4.5.11を公開した。変更は新機能1件と不具合修正1件で、表示言語の追加と、Windowsでの細かなエラーの解消が中心になる。\n【背景】Ghost Downloader 3は、READMEで「The only downloader you need（必要な唯一のダウンローダー）」とうたうオープンソースのダウンローダーだ。今回の配布ファイルを見ると、WindowsのインストーラーとZIP版、macOSのApple silicon用とIntel用のdmg、LinuxのAppImage、deb、tar.xz、さらにAndroidのarm64-v8a用のapkまで用意されており、幅広い環境で使える。READMEには英語版と中国語版があり、QQのグループやDiscordも案内されている。\n【詳細】新機能として、ドイツ語、フランス語、インドネシア語、イタリア語、韓国語の5つの表示言語を加えた。修正では、Windowsで、タスクバーが進み具合の表示に対応していない環境において、エラーが毎秒報告されてしまう問題を直した（#1121）。どちらも開発者のXiaoYouChR氏によるもので、今回の貢献者の一覧も同氏1人となっている。リリースノートの冒頭には、学業のために今後は更新の頻度が下がるという告知があり、寄付の案内も添えられている。同じ内容は中国語でも書かれている。配布物は19個で、v4.5.10からの差分がFull Changelogとして示されている。\n【ポイント・注意点】今回追加された5言語に日本語は含まれていない。破壊的変更の記載はなく、Windowsでエラーの表示に悩まされていた人には手軽な更新になる。一方で、更新頻度が下がると告知されているため、今後の不具合の修正や新機能の追加には時間がかかる可能性がある。長く使う予定の人は、こうした開発の状況も頭に入れておきたい。","2026-11-20","GitHub（XiaoYouChR/Ghost-Downloader-3）","https://github.com/XiaoYouChR/Ghost-Downloader-3/releases/tag/v4.5.11"],["AI検索スキル「last30days」v4.4.0、職業人の調査に対応","AIエージェントが主導する検索スキル「last30days」が11月20日にv4.4.0を公開した。勤め先やLinkedIn、メールアドレスを手がかりに職業人を調べる人物の調査と、有料の経路の利用料をひとつのAPIキーで払う代理モードを追加した。ウォッチリストの出力からWebhookの認証情報を伏せる修正など、20件の修正も含む。トルコ語のREADMEも加わった。","\n【概要】AIエージェントが主導する検索スキル「last30days」が、11月20日にv4.4.0を公開した。GitHubのTrendingで注目を集めているリポジトリで、今回の版では「What's Changed」に27項目が並ぶ。新機能2件と、20件の修正が中心だ。\n【背景】last30daysはREADMEで、編集者ではなく、投票や「いいね」、実際のお金で評価される検索エンジンだと自らを説明している。Claude Codeのプラグインとして導入できるほか、Codex、Cursor、Copilot、Gemini CLIなど、Agent Skillsに対応する50以上の環境で使えるという。\n【詳細】新機能の1つ目は代理モードで、有料の経路の利用料をひとつのAPIキーにまとめて請求できるようにした。あわせて、ホスト型の確認の流れとエラーの修正も入った。2つ目は職業人を対象にした人物の調査で、--employer、--linkedin、--emailの指定で、勤め先やLinkedIn、メールアドレスを手がかりにできる。修正は、ウォッチリスト、MCP、GitHub、X、パッケージング、HTML、セットアップ、キャッシュ、Perplexity、プライバシー、調査、事前確認、ホスト型の入力処理など幅広い。例えば、ウォッチリストの出力からWebhookの認証情報を伏せるようにした。調査のデータベースと要約の保管庫を保護し、続けての質問をその報告の生成に結び付ける修正も入った。依存部品の更新は3件で、文書ではトルコ語のREADMEが加わった。翻訳を寄せた@alkank氏が新しい貢献者として紹介されている。変更の全体はv4.3.2からの差分として示されている。\n【ポイント・注意点】人物の調査はメールアドレスなど個人に結び付く情報を扱うため、使う際は相手のプライバシーや各サービスの規約への配慮が欠かせない。代理モードは利用料の管理を楽にする半面、ひとつのキーに支払いが集まる点を意識したい。破壊的変更の明記はない。","2026-11-20","GitHub（mvanhorn/last30days-skill）","https://github.com/mvanhorn/last30days-skill/releases/tag/v4.4.0"],["Googleの「Gemini CLI」v0.70.0、MCPの安全確認を強化","Googleの端末向けAIエージェント「Gemini CLI」が11月19日にv0.70.0を公開した。23件のプルリクエストからなる版で、コマンドの権限設定が安全でないシステムのMCPサーバーを読み飛ばすほか、ポリシーの引数パターンの照合にre2jsを使い線形時間で終えるようにした。セッションの一覧でUnicodeの入力を保つ修正や、環境変数の既定値の扱いの修正など、15件の不具合修正を含む。","\n【概要】Googleが開発する端末向けのAIエージェント「Gemini CLI」が、11月19日にv0.70.0を公開した。変更一覧には23件のプルリクエストが並び、そのうち15件が不具合の修正だ。貢献者は10人と表示されている。\n【背景】Gemini CLIは、端末からGeminiのモデルを使ってコードの作成や調査を進める道具だ。外部の道具をつなぐMCPや、実行を許す範囲を決めるポリシーなど、安全に関わる仕組みも備えており、今回はその点の改善が目立つ。\n【詳細】安全面では、コマンドの権限設定が安全でないシステムのMCPサーバーを読み飛ばすようにした。ポリシーの引数パターンの評価にはre2jsを使い、照合を線形時間で終えるようにした。使い勝手では、セッションのプレビューでUnicodeの入力を保ち、ANSIの制御文字の断片を取り除くようにした。認証のやり直しをまたいでも選んだworktreeが保たれ、${VAR:-default}という書き方では、変数が空のときにも既定値が使われるようになった。要求の時間切れを既定の300秒より長くした場合は、undiciの本文の待ち時間も合わせて延びる。モデル一覧には出力トークンの上限が正しく表示され、commandPrefixやcommandRegexの規則は最上位のコマンドの引数に照合するよう直った。IDE連携では利用者ごとの探索用フォルダーを使い、ポート番号のファイルを一度に書き換える方式にした。CLIは、作業フォルダーではなくCLIの置き場所から、手元のgitの複製を見つけるようになった。このほか、変更履歴の更新2件、版の引き上げ、テストとリファクタリング、CIの変更、依存部品の更新2件も含まれる。\n【ポイント・注意点】新機能よりも、安全性と安定性を地道に高める版だ。システムのMCPサーバーの権限設定が緩い環境では、更新後にそのサーバーが読み込まれなくなるため、設定の確認が必要になる。v0.69.0からの差分はFull Changelogで確認できる。","2026-11-19","GitHub（google-gemini/gemini-cli）","https://github.com/google-gemini/gemini-cli/releases/tag/v0.70.0"],["「PEFT」v0.22.0、新手法PaCAを追加しPython 3.11以上必須","Hugging Faceの微調整ライブラリ「PEFT」が11月19日にv0.22.0を公開した。新手法のPaCAと、LoRAの初期化方法AstraとNoRAを追加し、テンソル並列やFSDP2での使い勝手を高めた。モデルの状態を点検するhealthcheckの機能も入った。一方でPython 3.11以上が必須になり、modules_to_saveの照合方法も変わった。次の版はPEFT 1.0となる予定で、リリース候補を出すという。","\n【概要】Hugging Faceが開発する、大規模なモデルを少ない計算資源で微調整するためのライブラリ「PEFT」が、11月19日にv0.22.0を公開した。新しい手法の追加、分散学習への対応の強化、点検機能の追加に加え、利用環境に関わる変更も含む。\n【背景】PEFTは、LoRAに代表される、モデルの一部だけを学習させる手法をまとめたライブラリだ。Transformersと組み合わせて使われることが多く、11月21日に公開されたTransformers v5.24.0は、peft 0.22.0以上を必須としている。\n【詳細】新しい手法として、ICLR 2025で発表されたPaCA（Partial Connection Adaptation）を加えた。LoRAの初期化方法には、init_lora_weights=\"astra\"で使うAstraと、\"nora\"で使うNoRAが加わった。テンソル並列では、LoRAがembedding_colwiseの分割方法に対応した。FSDP2やHSDPでは、形状、チェックポイント、統合に関わる不具合を直し、Transformersはv5.17以上を入れるよう勧めている。便利な機能としては、モデルの状態を確かめるprint_healthcheck()とhealthcheck()を追加した。差し替え用のダミー設定を作るcreate_dummy_lora_config、OFTやBOFTなどの部品をLoRAに変換する機能、より効率的なその場での統合も入った。読み込みでは、from_pretrained()とload_adapter()が、足りない重みや想定外の重みを既定で警告するようになり、strict_adapter_check=\"error\"を指定すると失敗させられる。\n【ポイント・注意点】PEFTはPython 3.11以上を必須とした。modules_to_saveは名前の末尾ではなく、モジュール名全体で照合するようになった。Conv2dを対象にしたOFTの計算を直したため、既存のチェックポイントは統合しないままだと出力が変わる可能性がある。古いPythonで動かしている環境は、更新前に移行の計画が必要だ。","2026-11-19","GitHub（huggingface/peft）","https://github.com/huggingface/peft/releases/tag/v0.22.0"],["「AdGuard Home」ついにv1.0.0、Web画面を全面刷新","ネットワーク全体で広告や追跡を遮断するDNSサーバー「AdGuard Home」が、11月19日に正式版v1.0.0を公開した。Web画面を作り直して軽く速くし、スマートフォンでも使いやすくした。v0.107.xと同じ設定形式のため移行作業は要らない。新規導入時の既定の上流DNSはQuad9からCloudflareに変わり、非推奨だったHTTP APIの入口12個などを削除した。","\n【概要】ネットワーク全体で広告や追跡を遮断するDNSサーバー「AdGuard Home」が、11月19日にv1.0.0を公開した。ベータ版を経た1.0の安定版で、Web画面の作り直しと、リリースの方針の変更が大きな柱になっている。\n【背景】AdGuard Homeは長くv0.107系で更新を重ねてきた。リリースノートによると、v1.0のベータは9月下旬に始まり、2回目のベータでは18件の変更が入っていた。今回、正式に1.0へ進んだ。\n【詳細】Web画面はきめ細かい反応の仕組みで作り直され、軽く速くなり、スマートフォン向けの表示にも対応し、メモリーの使用量も減ったという。設定の形式はv0.107.xと同じなので、移行作業は要らない。新しく導入した場合の上流DNSと起動時のDNSは、Quad9からCloudflareに変わった。既存の設定は自動では書き換えられない。設定面では、「Use global settings」が保護の設定だけを対象とし、ブロックするサービスには別のスイッチを設けた。Go言語の版も上げ、Go 1.27.4で直った脆弱性に対応した。修正はDHCPやクライアントIDの検証、新しい画面、DNSの書き換えなど多岐にわたる。削除では、GET /control/stats_infoなど非推奨のHTTP APIの入口12個と、--hostや--portなど4つのコマンドラインの指定を外した。更新は、ベータやedgeでは内蔵の更新機能、安定版では画面の案内、CLIでは--updateの指定、Dockerでは:latestのタグで行える。今後は自己診断のページ、フィルター一覧の一括取り込み、検索の道具、TLS証明書の自動発行と更新を予定している。\n【ポイント・注意点】新しいリリース方針では、マイナー版でも後方互換のない変更が入りうるとされた点に注意したい。フランスの利用者には、Quad9がフランスでの提供をやめる11月24日より前に上流DNSを変えるよう案内している。削除されたAPIや起動時の指定を使う自動化がある場合は、更新前に見直しが必要だ。","2026-11-19","GitHub（AdguardTeam/AdGuardHome）","https://github.com/AdguardTeam/AdGuardHome/releases/tag/v1.0.0"],["Redis互換「Valkey」9.2.0、9.2系初の安定版","Redis互換のインメモリーデータベース「Valkey」が、9.2系初の安定版となる9.2.0を公開した。リリースノートの日付は11月18日。forkせずに複製や保存を行う仕組み、Zstdによる保存データの圧縮、ACLのロール、新しいデータ型Path Hash、HOTKEYSコマンドなど多くの機能を加えた。ソート済み集合の範囲指定で空の境界を拒むなど、挙動の変更もある。更新の緊急度は「低」とされた。","\n【概要】Redis互換のインメモリーデータベース「Valkey」が9.2.0を公開した。リリースノートには「Released Wed 18 November 2026」とあり、9.2系で最初の安定版と位置付けられている。更新の緊急度は「LOW」とされた。\n【背景】Valkeyは、キーと値の組をメモリー上で高速に扱うデータベースで、Redisと互換性を持つ。互換性を保ちながら、性能や運用面の機能を広げる開発が続いており、9.2では運用に関わる機能が大幅に増えた。\n【詳細】新機能では、forkを使わずにレプリカへ全体を同期する仕組みと、forkを使わないRDBの保存が加わった。保存データの圧縮では、Zstdによるストリーミング圧縮と、ストリーム全体をLZ4で圧縮する方式に対応した。権限まわりでは、ACLのロールとACL DIGESTを用意した。新しいデータ型Path HashとPH系のコマンド、条件付きで削除するDELEXのIFEQとIFNE、ストリーム向けのXACKDELとXDELEX、INCREXも入った。よく使われるキーを調べるHOTKEYS GETとRESET、複製の速度を抑えるrepl-throttling-enabled、特定の接続元を優先するpriority-subnetsとmaxclients-reserved、スクリプトのメモリー上限maxmemory-scriptsも追加された。性能面では20件を超える高速化と省メモリー化が並び、XTRIMでMAXLENを0にした場合は約2.5倍速くなったという。修正には、PFMERGEでACLを迂回できた問題や、2GiBのSORTでの異常終了など、クラッシュやメモリーリーク、正しさに関わるものが多数含まれる。\n【ポイント・注意点】挙動の変更として、ZRANGEBYSCOREやZCOUNTなどが、「(」だけの境界や空の境界を拒むようになった。Path Hashで最後のパスを消すと、キー自体も消える。期限切れキーの能動的な削除が変更カウンターを増やすため、BGSAVEが以前より頻繁に走る可能性がある。運用中の設定に照らして確認したい。","2026-11-18","GitHub（valkey-io/valkey）","https://github.com/valkey-io/valkey/releases/tag/9.2.0"]],"gh-new":[["agent-mcts：Claude Codeにモンテカルロ木探索をかぶせる","コーディングエージェントのCLIをモンテカルロ木探索で包み、複数の解き筋を探らせる道具「agent-mcts」がShow HNに出た。MITライセンスで現在v0.3。Claude Codeで動作確認済みで、Codex CLI向けの部品もある。作者は自前の測定で「まだ効果は出ていない」と正直に書いており、判定役を足すと改善した例と悪化した例の両方があること、時間が約5倍かかることも示している。","\n【概要】\nagent-mctsは、コーディングエージェントのCLIをモンテカルロ木探索（MCTS）で包む、テスト時の探索用の道具だ。MITライセンスのオープンソースで、2026年11月21日にShow HNへ投稿された。1本の試行で成功か失敗かが決まるのではなく、複数の解き筋に枝分かれし、行き止まりから戻り、見込みのある道に予算を寄せる、という考え方である。\n\n【背景】\nエージェントに同じ課題を何度か解かせ、良い答えを選べば成績が上がるのではないか、という発想は以前からある。ただし「どの答えが良いか」をどう見分けるかが難しい。agent-mctsはこの点を正面から測ろうとしている。\n\n【詳細】\nREADMEによると現状はv0.3で、探索、木の表示、適用という一通りの流れがClaude Codeで動く。Codex CLI向けの部品も同梱されているが、今のところ偽の実行ファイルでしか試していないと明記されている。測定はClaude Codeのhaikuで、5回分の予算、隠しテストで採点する方式だ。npmのsemver範囲とISO 8601の期間という2つの難しめの課題を各10回走らせた結果、テストだけで探索する設定では最初の試行より良くなったのが0回、同じが9回、悪くなったのが1回だった。判定役（--judge）を加えると、良くなった4回、同じ4回、悪くなった2回で、平均の変化はマイナス0.1点だった。判定役は、見えるテストは通るのに隠しテストで73%と85%だった答えを86%と90%に引き上げた一方、91%の答えを68%の答えに置き換えた例もあった。\n\n【ポイント・注意点】\n作者は「まだ役に立つとは言えない」と自ら書いており、宣伝より測定を優先した姿勢が目を引く。判定役は見えるテストを両方通る2つの答えのうち良い方を62回中38回しか選べず、ここが限界だという。判定役を使うと試行回数も時間も約5倍かかる。試すなら、手元の課題で効くかどうかを確かめる実験道具として扱うのがよさそうだ。","2026-11-21","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50589235"],["NitroView：MPlayerの作者が作ったとても速い画像ビューア","MPlayerの作者が作った画像ビューア「NitroView」がShow HNに登場した。macOS、Windows、Linuxで動き、写真、Photoshopのファイル、RAW画像、ベクター画像、PDF、フォントまで開ける。独自のデコーダが画像を複数のCPUコアで同時に読み解き、2400万画素のJPEGをデスクトップのIntel CPUで約11ミリ秒で開くという。OS標準のデコーダの10倍の速さだとしている。","\n【概要】\nNitroViewは、とにかく速く画像を開くことを目指したビューアだ。リポジトリ名はjpeg-nitroで、2026年11月21日にShow HNへ投稿された。投稿文では「MPlayerの作者がバイブコーディングで作った、とても（とても！）速い画像ビューア」と紹介されている。\n\n【背景】\n大量の写真を一枚ずつ見ていくとき、表示の待ち時間は積み重なると大きな負担になる。OSに付いてくるビューアは機能が多い代わりに、デコードが速いとは限らない。NitroViewは画面の飾りをほぼなくし、速さに絞って作られている。\n\n【詳細】\nREADMEによると、対応する形式は写真、スキャン画像、Photoshopのファイル、RAW画像、ベクター画像、PDF、フォントファイルと幅広い。独自のデコーダで画像を複数のCPUコアに分けて読み解き、2400万画素のJPEGがデスクトップのIntel CPUで約11ミリ秒で開く。これはシステムのデコーダの10倍の速さで、連続した写真をキーを押す速さでめくれるとしている。ベクター画像はどの倍率でもくっきり描く。配布物は4種類あり、macOS 12以降のIntelとApple Silicon向けのCocoaとMetal版、Direct3D 11以上のWindows 10以降向けの単一ファイル版、GNOME向けのGTK 4とlibadwaita版（Flatpakあり）、SDL3とOpenGL版がある。どれもキー操作、マウスやトラックパッドの身振り、拡大、全画面、スライドショー、先読みが同じように動く。macOSのdmgは公証済みで、Gatekeeperの警告なしで開けるという。\n\n【ポイント・注意点】\n画面は「絵が入った窓があるだけ」で、操作はキーとマウスに任されている。設定画面やライブラリ管理を求める人には向かないが、見ることだけに集中したい人には魅力がある。READMEはハンガリー語版もある。速さの数値は作者の環境での測定なので、手元の機械や画像で差は出るだろう。","2026-11-21","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50589127"],["ILoveNotch 2.0：Macのノッチを操作盤に変える無料アプリ","MacBookの画面上部にある切り欠き（ノッチ）を、音楽、ファイル、予定、メモ、タイマーなどを扱う小さな操作盤に変える無料のオープンソースアプリ「ILoveNotch」が2.0になり、Show HNに投稿された。2.0では全タブを描き直し、10種類のテーマ、並べ替えられるホームタブ、カメラの真下に出るテレプロンプターを加えた。メモリ使用量とアイドル時のCPU負荷を低く抑えることを重視している。","\n【概要】\nILoveNotchは、Apple Silicon搭載MacBookのノッチ部分を、さまざまな機能を出し入れできる「トレイ」に変えるmacOSアプリだ。無料のオープンソースで、2026年11月21日にバージョン2.0がShow HNに投稿された。SwiftUIとAppKitで作られたネイティブアプリである。\n\n【背景】\nMacBookのノッチは画面の一部を占めるものの、普段は何にも使われていない。この場所を活用する有料アプリはすでにあるが、ILoveNotchは無料で、ソースコードも公開している点が違う。READMEでは、市販のノッチアプリとは無関係で、逆アセンブルや逆コンパイルしたコードを一切含まない一から書いた実装だと明記している。\n\n【詳細】\nREADMEによると、ノッチから扱えるのはメディアと音、ファイル、カレンダー、タスク、メモ、ショートカット、タイマー、テレプロンプター、ネットワーク速度、カメラ、AIサービスの使用量などだ。2.0では全タブが描き直され、すべてのタブの見た目を変える10種類のテーマ、自分で並べられるホームタブ、カメラの下に原稿を流すテレプロンプターが加わった。動作環境はmacOS 14.6以降。公式のdmgのほか、Homebrewでも入れられ、Mac App Store版もある。ただしApp Store版には、AIの使用量、エージェント、サウンドタブ、Androidとの共有が含まれない。新しい版はまずTestFlightのベータに出る。\n\n【ポイント・注意点】\n低いメモリ使用量とアイドル時のほぼゼロのCPU負荷を重視し、READMEには測定結果の節もある。常に動く小物アプリでは軽さが大事なので、この点は評価しやすい。テレプロンプターはビデオ会議や撮影で目線をカメラに向けたまま原稿を読みたい人に便利そうだ。配布版とApp Store版で機能が違うので、入れる前に確認したい。ソースからの組み立て方もREADMEに書かれており、中身を読んでから使いたい人も手を出しやすい。第三者のコードは許諾の緩いMIT、BSD、CC0のものだけで、一覧も同梱されている。","2026-11-21","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50588088"],["KeepPlain：エージェントの過去の会話を覚えさせる追加機能","コーディングエージェントは会話が終わると全部忘れてしまう。その履歴を残して共有の記憶にする追加機能「KeepPlain」がShow HNに出た。Claude Code、Codex、Cursorなどで動き、過去に解いた問題を探す、繰り返す間違いを規則にする、利用上限が近いと別のエージェントへ引き継ぐ、どの会話がどの行を書いたかをgit blameのように見る、といった機能を持つ。追加機能はMITライセンスだ。","\n【概要】\nKeepPlainは、コーディングエージェントの会話履歴を保存して使い回すための追加機能だ。2026年11月21日に「エージェント向けのオープンソースの共有記憶、規則、Git blameの追加機能」としてShow HNに投稿された。Claude Code、Codex、Cursor、Pi、Antigravityで動き、ほかにも多くのエージェントの会話記録を読み込める。\n\n【背景】\nエージェントは会話が終わると前のことを覚えていない。そのため、同じ説明を何度もしたり、同じ間違いを何度も直したりすることになる。KeepPlainはこの手間を減らすことを狙っている。\n\n【詳細】\nREADMEによると、主な機能は4つある。1つ目は、過去の会話を検索して答えが出た場面を開くこと。/keepplain:resumeで作業を別のエージェントに引き継げる。2つ目は、1日に1回、モデルが会話を読み、2回以上の会話で繰り返された間違いを提案すること。ワンクリックで規則にすると、次の会話の最初や関係するプロンプトのときにエージェントへ渡される。3つ目は、Claudeの5時間または週の上限の90%を超えると、CodexやPiで続けるボタンが出ること。引き継ぎの要約はモデルを使わず手元で作る。4つ目は、keepplain blameで、各行の背後にあるエージェントの会話を表示すること。他の人の公開された会話から解き方を探す機能もある。導入は1ファイルで、Node.jsも管理者権限も要らない。\n\n【ポイント・注意点】\n会話は、利用者が送信を確認したとき、または自動モードを有効にしたときだけkeepplain.comへ送られ、非公開の下書きとして保存される。秘密情報は送信前に手元で置き換えるが、パターン照合なので見落とすことがあり、プレビューを読むよう勧めている。追加機能自体はMITだが、サイトはオープンソースではない。個人利用は無料で、チームは席ごとの課金だ。便利さの裏で、会話が外部に保存される仕組みでもあるので、仕事のコードで使う前に送られる中身の一覧を確かめておきたい。","2026-11-21","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50588072"],["PhoneBox：古いAndroidスマホをPCの操作盤にする","使わなくなったAndroidスマホを、パソコンの横に置く操作盤に変える「PhoneBox」がShow HNに出た。USBかWi-Fiでつなぎ、CPUやGPUの状態、AIコーディングの利用枠や作業中の会話、音楽、タッチで押すショートカットなどを表示する。ブラウザ上の編集画面で126種類の部品と30種類のひな形から画面を組める。Windows、Linux、macOSに対応し、root化やアカウント、クラウドは要らない。","\n【概要】\nPhoneBoxは、古いAndroidスマホをパソコン用の机上パネルにするソフトだ。2026年11月21日にShow HNへ投稿された。全画面で動くAndroidアプリと、パソコン側の小さな常駐プログラムを組み合わせて使う。対応するパソコンはWindows、Linux、macOSである。\n\n【背景】\n引き出しに眠っている古いスマホは多い。一方で、配信や作業のために専用の操作盤を買う人もいる。PhoneBoxは手持ちのスマホをその代わりにする発想で、root化やPhoneBoxのアカウント、クラウドサービスを必要としない点を打ち出している。\n\n【詳細】\nREADMEによると、画面はブラウザで動く編集画面で組み立てる。部品は126種類、ひな形は30種類あり、複数のページや実際の見え方の確認もできる。複数のスマホにそれぞれ別の配置を割り当てたり、1台のスマホを複数のパソコンで切り替えて使ったりもできる。表示できるのは、CPU、GPU、メモリ、ディスク、ネットワーク、応答時間などの状態、Claude、Codex、Antigravityの利用枠とリセット時刻と消費の予測、手元のClaude Code、Codex、OpenCodeの作業中の会話（WSLの中も含む）、GitHubのレビューやCIの状態などだ。アプリやURLのショートカット、キーの組み合わせ、マクロ、音量やマイク、OBSの操作も置ける。時計、天気、予定、メモ、ポモドーロ、ネットラジオ、Home Assistantの操作もある。\n\n【ポイント・注意点】\n希望すれば、Codex、Claude Code、OpenCodeの許可を求める確認に、スマホから「許可」「拒否」で答えられる。エージェントに長い作業を任せている間、パソコンの前にいなくても応じられるのは便利だ。READMEは英語、トルコ語、中国語など13言語で用意されている。デモデータで動く見本もあるので、まずはそこで画面の雰囲気を見るとよい。CodexBarとの連携を足すと、利用枠の提供元と費用の一覧も表示できる。","2026-11-21","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50587831"],["Musset：AIが本文を書かない小説執筆アプリ","初めての長編小説を書いている作者が、自分の書き方に合う道具がないとして作った執筆アプリ「Musset」がShow HNに出た。iA Writerのように静かで、Scrivenerのように整理でき、AIと本について話し合える。本は普通のMarkdownファイルのフォルダで、版の管理はgitで自動に行う。AIは任意で、文章は書かず、余白への書き込みや矛盾の点検を担う。GPL-3.0で、ベータ中は無料だ。","\n【概要】\nMussetは、長い文章や小説を書くためのオープンソースのアプリだ。2026年11月21日に「本文を決して書かないAIを持つ、Scrivenerのオープンソースの代替」としてShow HNへ投稿された。作者は初めての長編小説を書いている最中で、自分の流れに合うアプリが見つからなかったので作ったという。\n\n【背景】\n作者が求めたのは、iA Writerのような静かさ、Scrivenerのような整理のしやすさ、そして書きながら本について話せるAIだ。投稿文では、AIが相談相手になることで、書いている間に「ひとりぼっち」だと感じにくくなると書いている。AIに書かせるのではなく、AIを壁打ちの相手にする設計である。\n\n【詳細】\n投稿文によると、1冊の本は普通のMarkdownファイルが入ったフォルダになる。Mussetはそれをgitのリポジトリに記録し、利用者がgitを知らなくても版と下書きを追える。修正はCriticMarkupという書式で本文の中に入る。Wordの修正履歴も扱えるので、編集者がWord文書に入れたコメントを取り込める。PDFは内蔵のTypstで組版し、言語ごとの組版の決まりに従う。スペルと文法の点検には、これも内蔵のLanguageToolを使う。キー操作はMacやWord風のほか、WordStar、vi、Emacsの方式を選べる。AIは任意で、利用者のCodexかClaude CodeのCLIを使う。AIはコメントや余白への書き込みを残し、話のつじつまや、章が自分の文体の決まりに沿っているかを点検する。\n\n【ポイント・注意点】\nライセンスはGPL-3.0で、ベータの間は無料だ。1.0に達し、十分な関心があれば、9.90ドルの買い切りにする考えだという。ベータ読者や編集者と本を共有するための有料の同期サービス（gitのホスティング）もある。原稿を普通のMarkdownで持てるので、アプリをやめても文章が閉じ込められない点は安心材料だ。AIを使うには別途CodexかClaude CodeのCLIを用意する必要がある。ダウンロードは公式サイトmusset.appから行う。","2026-11-21","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50586323"],["Factuio：端末で遊ぶRust製の工場づくりゲーム","端末の中で遊ぶ工場の自動化ゲーム「Factuio」がShow HNに出た。Rustとratatuiで書かれ、自動生成された地図で鉱石を掘り、溶かし、ベルトコンベヤーやアーム、レールの台車で運び、研究を進めて最後に通信装置を完成させれば勝ちとなる。チュートリアルもあり、遊んでいる間はその場で合成されるオリジナルの音楽が流れる。Linux、macOS、Windows向けの実行ファイルが配布されている。","\n【概要】\nFactuioは、ターミナル（端末）で動く工場づくりのゲームだ。2026年11月21日に「Rustで書いた工場のTUIゲーム」としてShow HNへ投稿された。描画にはRust向けの端末UIライブラリratatuiを使っている。\n\n【背景】\n資源を掘って加工し、運ぶ仕組みを自動化していく工場ゲームは、プログラマーに人気のある分野だ。Factuioはそれを、文字だけで描く端末の画面に持ち込んだ。重いグラフィックが要らないので、普段使っている端末でそのまま遊べる。\n\n【詳細】\nREADMEによると、ゲームは自動生成された地図の上で、少しの建物から始まる。鉱石を掘って溶かし、ベルトコンベヤー、アーム、レールの台車で運び、霧の向こうを探検し、部品を作り、新しい技術を研究する。最後に「Uplink array」を建て、20個の中継部品を納めれば勝ちだ。初めての人向けに、新しいゲームの項目にチュートリアルがある。遊んでいる間はオリジナルのサウンドトラックがその場で合成されて流れ、Jキーで止められる。操作は矢印キーかWASDで動き、数字キーで建物を選び、スペースで置く。Rで向きを変え、Vの塗りモードではカーソルの道に沿ってコンベヤーを敷ける。Uで直前の建設を取り消せる。手で作るときに足りない中間部品を自動で作る機能や、研究の木、直近10分の生産統計の画面もある。\n\n【ポイント・注意点】\nLinux、macOS、Windows向けの実行ファイルがリリースのページにあり、展開してすぐ動かせる。Rust 1.85以上があればソースから組み立てることもできる。端末は100×30以上を勧めており、COLORTERMで24ビット色を名乗る端末ではフルカラー、そうでなければ256色で描く。macOSでは署名のない実行ファイルがGatekeeperに止められることがあり、READMEに解除の手順がある。公式サイトfactuio.comも用意されている。キー操作が多いので、最初はチュートリアルから始めて、ホットバーへの割り当てなどに慣れるのがよさそうだ。","2026-11-21","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50585876"],["ObFUSEcate：root不要の暗号化・圧縮ファイルシステム","Linuxで、管理者権限なしに使える暗号化と圧縮つきの仮想ディスク「ObFUSEcate」がShow HNに出た。中身は1つの不透明なファイルで、FUSEでマウントすると普通のext4として読み書きできる。ブロックごとにChaCha20-Poly1305で暗号化して改ざんを防ぎ、独自の算術符号で圧縮する。CRC-8とXORのパリティで小さな破損を自動で直す。システムプログラミングを深く学ぶための個人の作品だという。","\n【概要】\nObFUSEcateは、C++で書かれた、利用者空間で動く仮想ブロックデバイスだ。2026年11月21日に「Linux向けの軽いFUSEベースの暗号化・圧縮ファイルシステム」としてShow HNへ投稿された。作者は、Linuxのシステムプログラミングをより深く学ぶための個人の作品だと説明している。\n\n【背景】\nファイルを暗号化して保存する方法には、gocryptfsやEncFSのように1ファイルずつ暗号化する道具がある。ただしその方式では、ディレクトリの構造やファイルの数、各ファイルの大きさが外から見えてしまう。ObFUSEcateは全体を1つの平らなファイルにまとめることで、こうした情報も隠す。\n\n【詳細】\nREADMEによると、FUSEとfuse2fsを使って利用者空間だけでマウントし、標準のext4ファイルシステムとして見せる。root権限もカーネルモジュールも要らない。16KBの論理ブロックごとに、RFC 8439のChaCha20-Poly1305で暗号化と認証を行い、ブロックの番号を付加情報に含めることで、ブロックの入れ替えや改ざんを防ぐ。暗号化の前に32ビットの算術符号で圧縮し、圧縮できないブロックはそのまま通して膨らみを防ぐ。10GBの領域を作っても実際のディスク消費は数KBで、書かれていない部分やゼロの部分は場所を取らない。各ブロックは128バイトの断片に分けられ、CRC-8とXORのパリティ断片で守られるので、断片1つの破損は自動で直せる。鍵はスワップされないメモリに固定し、コアダンプやptraceからも守る。\n\n【ポイント・注意点】\n依存はlibfuse3だけという軽さが特徴だ。削除したファイルの領域は、アンマウント時にzerofreeで取り戻す。個人の学習の作品なので、大事なデータを預ける前に、手元で十分に試すのが無難だろう。暗号の部分は標準の方式を使う一方、圧縮と誤り訂正は独自の実装である点も覚えておきたい。それでも、暗号化、圧縮、誤り訂正を1つの小さな部品にまとめた設計は、ファイルシステムの仕組みを学ぶ教材としても読みごたえがある。","2026-11-21","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50585222"],["rigtune：自分のGPUで一番速いLLMの設定を測って探す","LLMを動かすときの設定を、推測ではなく実測で選ぶ道具「rigtune」がShow HNに出た。推論エンジン、重みの精度、KVキャッシュの種類、投機的デコードを手元のGPUと自分のプロンプトで試し、勝った設定をOpenAI互換のAPIとして立ち上げる。作者の比較では、Qwen3.5-9Bで他の道具や推奨設定より1.8倍以上速く、答えの質もGSM8Kで確かめたという。","\n【概要】\nrigtuneは、手元のGPUとモデルにとって一番速い推論の設定を、実際に測って見つける道具だ。2026年11月21日にShow HNへ投稿された。見つけた設定は、そのままOpenAI互換のAPIとして配信できる。\n\n【背景】\n作者は投稿で、品質を落とさずに最大の処理量を引き出す設定を見つけるのに苦労したと書いている。READMEでも、案内ごとに言うことが違い、あるGPUで最速の設定が別のGPUでは遅いことが多いので、推測をやめて測ることにしたと説明している。\n\n【詳細】\nREADMEによると、rigtuneは推論エンジン、重みの精度、KVキャッシュの型、投機的デコードを、利用者のGPUと利用者のプロンプトで試す。作者は2026年11月に、素のvLLMとSGLang、vLLM自身のauto_tune、BentoMLのllm-optimizer、各エンジンの文書が勧める設定と比べた。Qwen3.5-9Bでは全部より1.8倍以上速く、Gemma 4 12Bでは別の工夫で専門家の最良の設定を1.5〜1.7倍上回った。混合専門家モデルのQwen3.5-35B-A3BをH200で動かした場合は、素のvLLMより2.26倍速かった。8人が同時に使う条件の出力速度は、A40のQwen3.5-9Bで478〜479トークン毎秒、素のvLLMは252だった。答えの質はGSM8Kで採点し、毎回保たれたという。勝因は、Qwenではチェックポイントに入っているのに既定で切られている複数トークン予測の頭、H200ではfp8の重みとfp8のKVキャッシュ、Gemmaではsuffix decodingだった。\n\n【ポイント・注意点】\n勝つ設定がモデルとGPUの組み合わせで大きく変わる、という結果そのものが興味深い。H200の比較はvLLMだけで行い、採点も300問に絞ったと注記がある。数値は作者の環境での結果なので、作者自身も利用者に結果の共有を呼びかけている。答えの質を落とす設定には「マイナス3点まで」という許容の線を設け、比較表にもその差を載せている。速さだけでなく品質の確認を道具の中に組み込んでいる点は、設定探しの道具として信頼しやすい。","2026-11-21","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50584965"],["Voxstead：Macで動く字幕と二か国語の通話の手助け","通話や会議の音声を聞き取って字幕を出し、二か国語の会話を手助けするmacOSアプリ「Voxstead」がShow HNに出た。通話の前に目的や事実を書いておくと、相手の話を追いながら、必要なときだけ短い返事の案を出してくれる。会議の要約や決まったことの一覧、キーを押している間だけ録る口述入力もある。音声認識はMacの中で行う。対応はApple Siliconで、macOS 26以降だ。","\n【概要】\nVoxsteadは、ライブの字幕、二か国語の通話の補助、会議メモ、押して話す口述入力をまとめたmacOSアプリだ。2026年11月21日にShow HNへ投稿された。音声認識はMacの上で行う。対応するのはApple Silicon搭載のMacで、macOS 26以降が必要だ。\n\n【背景】\n外国語での電話や会議では、相手の言葉を聞き取ることと、返す言葉を考えることを同時にこなさなければならない。Voxsteadは、字幕で聞き取りを助け、返事の案を必要なときだけ出すことで、この負担を軽くしようとしている。\n\n【詳細】\nREADMEによると、使い方は3つに分かれる。1対1の通話では、事前の準備メモを画面に留め、話し手のラベル付きの字幕を出し、Command+Option+3で短い返事の案を呼び出す。会議では、字幕に加え「Catch me up」で追いつけるようにし、終わったあとに振り返りと編集できるやることの一覧を作る。他のアプリへの口述では、Control+Option+Dを押している間だけ録音し、離すと文字にしてコピーする。通話の前には、返事の参考にする事実、目的、限界を書き、話す言語を選ぶ。スピーカーにしたスマホの通話ならマイクだけを、Macでの通話ならマイクと通話アプリの音を選ぶ。マイクだけのときは自分の発言に「That's me」と印を付け、入力が分かれていれば自分と相手を自動で分ける。返事は最大2文までだ。\n\n【ポイント・注意点】\nホームの「Try an example」には組み込みの例があり、マイクもAIのアカウントもなしで、英語の短い返事とそのスペイン語の意味を出す流れを1分で試せる。配布物は簡易署名なので、初回の起動がmacOSに止められたら、プライバシーとセキュリティの設定で確認するよう案内している。各リリースにはSHA-256のチェックサムが付く。通話の相手の声を録って処理する道具なので、使う場面では相手への配慮も忘れないようにしたい。返事の案は最大2文と短く、画面を読みながら話す負担を抑える作りになっている。","2026-11-21","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50584857"],["pstview：Outlookのファイルを書き換えずに読む閲覧ソフト","Outlookの.pstや.ostのファイル、MBOX形式のメールボックスを、元のファイルを一切書き換えずに読む閲覧ソフト「pstview」がShow HNに出た。Zigで書かれ、外部の部品に頼らない。画面つきの閲覧ソフトとコマンドの道具の2つがあり、Windows、macOS、Linuxで動く。ヘッダーの分析や削除されたメールの復元もできる。ブラウザ版もあり、メールボックスはアップロードされずに手元で読まれる。","\n【概要】\npstviewは、Outlookのデータファイル（.pstと.ost）とMBOXのメールボックスを読み、書き出すための小さな閲覧ソフトだ。2026年11月21日にShow HNへ投稿された。Zigで書かれ、第三者の部品に依存しない。ヘッダーの分析をオフラインで行い、削除された項目の復元もできる。\n\n【背景】\n作者は投稿で、仕事で古いOutlookのファイルやバックアップの道具からメールを取り出すことがあると書いている。従来のOutlookで開くのは手間がかかるうえ、うっかりファイルを書き換えてしまうおそれがある。それを避けるために作ったという。READMEでも、Outlookはデータファイルを開いた時点で変更するので、Outlookを閉じるか複製で作業するよう勧めている。\n\n【詳細】\nREADMEによると、元のファイルは読み取り専用で開き、何も書き込まず、隣に新しいファイルも作らない。リリースにはWindows、macOS、Linux向けの圧縮ファイルのほか、AppImageとFlatpakがある。中身は2つのプログラムで、pstviewはフォルダの木、メールの一覧、ヘッダー分析と添付つきの閲覧画面を持つアプリ、pstxは読み取りと報告用のコマンドの道具だ。pstxにはtree、list、show、search、triage、headers、props、hash、verify、hidden、recover、analyseといった命令があるが、書き出しはしない。ブラウザ版も公開されており、メールボックスは手元で読まれてアップロードされない。オフラインのアプリとして入れることもできる。\n\n【ポイント・注意点】\nメールはスクリプト、ネットワーク接続、外部の画像を止めた状態で表示されるので、何も実行されず、追跡用の画像も読み込まれない。リンクはどこにもつながらず、添付ファイルは開かれない。文字と画像は下見でき、それ以外は保存だけできる。動かすには、WindowsではWebView2、macOSは11以降、LinuxはGTK 4.12以降とWebKitGTK 6.0が要る。macOS版は公証されていないので、READMEにある手順で隔離の印を外す必要がある。インストールは管理者権限なしで、今の利用者だけに入る。","2026-11-21","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50584843"],["LUMINOL：Windowsに残るAI利用の痕跡と残る期間を調べる","WindowsのパソコンにAIを使った痕跡がどれだけ残っていて、それがいつまで残るのかを調べる無料の点検道具「LUMINOL」がShow HNに出た。19種類の証拠を確かめ、それぞれに陽性と陰性の合成テストを用意している。会話の文面は保存も報告もせず、記録の有無と最終更新の時刻だけを示す。所有するか、調べる権限のあるパソコンでだけ使うよう、使い方の限界も詳しく書いている。","\n【概要】\nLUMINOLは、Shadow AI Forensicsが出した、Windows向けの無料の点検道具だ。2026年11月20日にバージョン0.1.1がShow HNへ投稿された。READMEは「法科学の道具はパソコンにどんなAIの証拠があるかを示す。LUMINOLはそれがどれだけ長く残るかを示す」と説明している。\n\n【背景】\n生成AIを仕事で使う場面が増え、企業の調査や紛争の場で、誰がいつAIを使ったかが問われることが出てきた。ただ、痕跡は時間がたつと消えていく。LUMINOLは、今ある記録が何で、いつ消えそうかを見える化することを狙っている。\n\n【詳細】\nREADMEによると、LUMINOLは19種類の証拠を調べ、それぞれに陽性と陰性の合成テストがある。報告するのは記録があるかどうかと、そのファイルが最後に変わった時刻で、会話の文面は保存も報告もしない。人が何を言ったかを証明することもできない。残る期間の見積もりは、日付つきの実験の観察、提供元のページ、Windowsの動きを組み合わせたもので、実験の観察は1台の機械から取ったとしている。調べるのは今のWindowsアカウントの決まった場所で、全体のパスが260文字を超えるファイルは読まず、その場所は完全には調べていないと報告に書く。0.1.1では、ChatGPTのデスクトップアプリが.codexの下に置く2つのファイルをまだ調べておらず、0.1.2で対応する予定だ。\n\n【ポイント・注意点】\nREADMEは限界を細かく書いている。使うのは自分が所有するか、調べる権限のあるパソコンだけにすること。報告は使う人の個人情報として、メールと同じように扱うこと。結果がないことはAIを使っていない証明にはならないこと。特定の人を疑っているなら本人に実行させず、IT部門に任せるか、パソコンに手を加える前に連絡すること。法的な助言ではなく、裁判所や規制当局が受け入れる保証もないとしている。調べる側にも慎重さを求める道具だ。結果は調べた日のパソコンの状態の記録にとどまる点も明記されている。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50582358"],["OpenComputer：自社のクラウドで動かせるDevinの代わり","Slackで頼むと自分専用の計算機で作業し、結果をプルリクエストで返すクラウドのコーディングエージェント「OpenComputer」がShow HNに出た。Devinのオープンソースの代わりをうたい、AWS、GCP、Azureの自社アカウントで動かせる。作者らの測定では、最初のコミットまで24秒で、比べた他の選択肢は53〜72秒だったという。ライセンスはApache 2.0で、クラウド版も用意されている。","\n【概要】\nOpenComputerは、チームで使うクラウドのコーディングエージェントだ。2026年11月20日に「Devinのオープンソースの代わり」としてShow HNへ投稿された。Slackのスレッドで@Computerに作業を頼むと、エージェントが自分の計算機で作業し、チームはその様子を見て方向を直せる。結果はプルリクエストとして届く。ライセンスはApache 2.0だ。\n\n【背景】\nクラウドで動くコーディングエージェントは便利だが、手元のノートパソコンで動かすClaude Codeなどに比べて遅く感じられることがある。また、自社のコードを外部のサービスに預けることをためらう企業もある。OpenComputerは計算の層からオープンソースにし、自社のクラウドで全部を動かせるようにした。\n\n【詳細】\n投稿文によると、エージェントを動かす仕組みと隔離された作業場を、同じ長く生きる仮想機械の上で動かす。最初のコミットまで24秒で、比べた他の選択肢は53〜72秒だった。チームごとに1台の仮想機械を使い、横に増やせる。作業の会話はgitのworktreeで分けられ、会話のファイルは手番ごとにリポジトリへ保存されるので、別の仮想機械で再開できる。READMEでは、仮想機械の中でCalvinという中継役がSlackの出来事を受け、設定に応じてClaude Code、Codex、OpenCodeの会話を始めると説明している。各会話は権限を持たないPodmanで隔離され、残りの部分はCloudflare WorkersとDurable Objectsで動く。\n\n【ポイント・注意点】\n作者らは、月に約640時間を超えると、常時動く4 vCPUの仮想機械1台の方が、会話ごとのE2Bの作業場より安くなると見積もっている。READMEでは、Devinより3.3倍速くプルリクエストを開いたとする測定も示している。速さの数字は作者側の比較である点に注意したい。クラウド版には600分の作業時間つきの3日間の無料体験があり、ChatGPTやCodexの契約を持ち込める。仮想機械は外向きの通信だけに絞ることを勧めている。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50581403"],["Prefixwise：プロンプトキャッシュが外れる理由を突き止める","エージェントは毎回会話全体を送り直すため、先頭近くの1バイトが変わるだけで、その後ろ全部が定価で課金される。どのバイトが変わり、いくらかかったかを示し、よくある原因を直す道具「Prefixwise」の0.12がShow HNに出た。エージェントとモデルの間に入り、原因の特定、送信前の修正、CIでの予防、vLLMやSGLangの自動検出を行う。プロンプトそのものは保存しない。","\n【概要】\nPrefixwiseは、プロンプトキャッシュが外れる原因を調べて直すための道具だ。2026年11月20日に「プロンプトキャッシュが外れる理由についての論文と仕様」として、バージョン0.12がShow HNへ投稿された。PyPIで配布されている。\n\n【背景】\nLLMの提供元は、入力の先頭部分が前回と同じならキャッシュを使い、料金を安くする。ところがエージェントは毎回会話全体を送り直すので、上の方で1バイトでも変わると、その後ろがすべて定価になる。READMEによると、提供元やエンジンが報告するのはキャッシュを外したトークンの数だけで、なぜ外れたかは教えてくれない。\n\n【詳細】\nPrefixwiseはエージェントとモデルの間に入り、4つのことをする。1つ目は特定で、リクエストごとに原因を1つ名指しし、証拠、費用、直し方を示す。2つ目は修正で、--optimizeを付けると送る前にリクエストを直す。使うのは、実際のモデルで再生して効果が確かめられた直し方だけだ。3つ目は予防で、prefixwise checkはコードの変更がキャッシュを壊すときにCIを失敗させる。4つ目は自動検出で、URLの裏にあるvLLMやSGLangを見分け、エンジンがKVの出来事を公開していれば自分で購読する。READMEの例では、Claude Sonnet 4.6を使う8手番のエージェントで、道具の一覧の順番が4手番目で変わり、6手番目で戻った。報告では、どのブロックで前回と一致しなくなったかを、道具、システム、メッセージの順に数えて示し、4手番目でプロンプト全体を払い直したことが分かる。\n\n【ポイント・注意点】\n保存するのはハッシュと数だけで、プロンプトの中身は残さない。APIキーを持たず、Claude CodeやCodexを月額契約で使っている人は、prefixwise import claude-codeで手元にある記録を読み込める。道具の並び順のような小さな揺れが費用を押し上げる、という指摘は、エージェントを作る人には見落としやすい点だろう。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50581015"],["nostromo：使わないときは眠るKubernetesの管理部分","たくさんのKubernetesの管理部分（コントロールプレーン）を1つのプログラムでまとめて動かし、それぞれについて今必要なものだけを動かす「nostromo」がShow HNに出た。誰もつないでいなければ何も動かさず、つながると約2秒で起きる。何かが書き込まれたときだけ全部を動かす。管理されたKubernetesを売る事業者に向けたもので、顧客ごとの固定費を減らすことを狙う。","\n【概要】\nnostromoは、多数のKubernetesのコントロールプレーンを1つのプログラムで受け持ち、それぞれについて今必要な部分だけを動かす仕組みだ。2026年11月20日に「使っていないときは眠る、ホスト型のKubernetesのコントロールプレーン」としてShow HNへ投稿された。\n\n【背景】\nREADMEによると、対象は管理されたKubernetesを売る事業者、つまりクラウドの提供者だ。顧客ごとのコントロールプレーンは固定の費用になるが、ほとんどの時間は何もしていない。この無駄を減らすのが狙いである。\n\n【詳細】\nnostromoには3つの段がある。「眠り」は何も動いていない状態で、誰もクラスターにつないでいないとき。「待機」はAPIサーバーだけが動く状態で、ノードや利用者はつないでいるが仕事がないとき。「全開」はAPIサーバーにコントローラーマネージャーとスケジューラーを加えた状態で、クラスターで何かが変わっているときだ。段の移り変わりは自動で、最初の接続で眠りから待機に移り、つないだ人は約2秒待つと普段どおり使える。ポッドやデプロイ、新しいノードなど実際の書き込みがあると全開になり、ノードの生存通知は数に入らない。書き込みがしばらくなければ待機に戻るが、CronJob、オートスケーラー、動いているJob、最近黙ったノードなど時計で動く仕事があるときは戻らない。安全のため、ノードの反応が途絶えたときや一定の間隔ごとにも全開にする。接続がまったくなけ
