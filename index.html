。【詳細】分析によると、減少が大きかったのは呼吸器感染症によく使われるマクロライド系とセフェム系の抗菌薬だった。世界保健機関（WHO）が耐性菌のリスクが低く優先的な使用を推奨する「Access」に分類される抗菌薬の割合は、11.2％から19.0％に上昇した。ただし、WHOが以前に掲げた60％という目標には届いていない。日本では幅広い細菌に効く広域の抗菌薬が好まれる傾向があり、対象を絞った薬への切り替えが進みにくいという。年齢別では15〜19歳の減少幅が小さく、テトラサイクリン系の使用が増えていた。処方に占めるニキビ（ざ瘡）の割合が大きく伸びており、診療ガイドラインの変更との関連が指摘されている。【ポイント・注意点】大久保氏は、今後は使用量だけでなく、どのように使われているかという中身を検証していく必要があると指摘する。また、抗菌薬を一律に避けるのではなく、必要な時には適切に使うことが大切だと強調している。保護者は、かぜなどウイルスによる病気には抗菌薬が効かないことを理解したうえで、処方された場合は医師や薬剤師の指示どおりに服用することが望ましい。気になる点があれば、処方の理由や飲み方を遠慮なく医師に尋ねるとよい。","2026-11-24","日本経済新聞（共同通信）","https://www.nikkei.com/article/DGXZQOUD2952Q0Z21C26A0000000/"],["埼玉・加須市で自転車通学の女子高校生が大型トラックにはねられ死亡","11月24日午前7時ごろ、埼玉県加須市の国道交差点で、自転車で登校中だった18歳の女子高校生が、コンビニの敷地に入ろうと左折した大型トラックに巻き込まれました。高校生は頭を強く打って意識不明の重体で病院に搬送されましたが、約2時間半後に死亡が確認されました。警察はトラックを運転していた55歳の男を過失運転致傷の疑いで現行犯逮捕し、容疑を過失運転致死に切り替えて事故の詳しい原因を調べています。","\n【概要】埼玉県加須市で11月24日の朝、自転車で登校していた18歳の女子高校生が大型トラックにはねられ、死亡しました。テレ玉が同日夕方に報じました。トラックは国道の交差点でコンビニの敷地に入るため左折した際に、自転車の高校生を巻き込んだとみられています。警察は運転していた男を現行犯逮捕し、事故の原因を調べています。\n【背景】事故が起きたのは、通学や通勤で人や車の行き来が多くなる朝の時間帯です。現場は加須市不動岡の国道の交差点で、沿道にはコンビニがあり、トラックはその敷地に入ろうとしていました。大型車が交差点で左折する際には、車体の側方や後方に運転席から見えにくい範囲が生じやすく、同じ方向に進む自転車が巻き込まれる事故は、以前から典型的な危険の一つとして知られています。\n【詳細】報道によりますと、事故は24日午前7時ごろに発生しました。18歳の女子高校生は自転車で学校に向かう途中で、左折してきた大型トラックに巻き込まれました。高校生は頭に強い衝撃を受けて意識不明の重体となり、病院に運ばれましたが、およそ2時間半後に死亡が確認されました。警察は、トラックを運転していた群馬県桐生市に住む55歳の男を、過失運転致傷の疑いでその場で逮捕しました。男は調べに対し、安全確認を怠り、自転車に気付かないままぶつかったという趣旨の話をして、容疑を認めているということです。警察は今後、容疑を過失運転致死に切り替え、当時の詳しい状況や事故の原因を調べる方針です。\n【ポイント・注意点】交差点で大型車の左側を自転車で走る場面では、運転手から自分が見えていない可能性があることを常に意識する必要があります。大型車が左折の合図を出しているときや減速しているときは、無理に並んで進まず、手前で止まって先に曲がらせることが命を守る行動につながります。ドライバー側も、左折時には速度を落とし、ミラーや目視で左側と後方を何度も確認することが欠かせません。家庭や学校では、通学路にある大型車の出入りが多い交差点や店舗の出入り口を子どもと一緒に確認し、危ない場所での止まり方や待ち方を具体的に話し合っておくことが大切です。朝の慌ただしい時間でも、時間に余裕を持って家を出る習慣も事故防止に役立ちます。","2026-11-24","テレ玉（Yahoo!ニュース）","https://news.yahoo.co.jp/articles/beb2f99764e541be226544823fc01681a83f34ae"],["凍らせたゼリーで4歳児死亡受け 香芝市が保育職員向け窒息防止研修","奈良県香芝市の認定こども園で2026年9月、4歳の男の子が凍らせたゼリーをのどに詰まらせて死亡した事故を受け、市は11月24日、教育・保育施設などの職員を対象にした研修を開きました。公立・私立の施設から40人あまりが参加し、グループワークで各施設の実情や対策を共有したほか、消防署職員から窒息時の応急措置を学びました。市長は今後も研修を重ね、再発防止に努める考えを示しました。","\n【概要】奈良県香芝市で、認定こども園に通っていた4歳の男の子が凍らせたゼリーをのどに詰まらせて亡くなった事故を受け、市は11月24日、市内の教育・保育施設などで働く職員を対象とした研修を行いました。奈良テレビ放送が同日報じました。職員同士で各施設の現状や対策を話し合い、消防署の職員から窒息事故が起きた際の応急措置についても学びました。\n【背景】事故は2026年9月、香芝市の認定こども園「あけぼの・幼保学院」で起きました。4歳の男の子が、凍らせたゼリーをのどに詰まらせて死亡したものです。保育や教育の現場で子どもが食べ物を詰まらせる事故は、命に直結する重大な事故であり、同じような事故を繰り返さないための取り組みが求められていました。市は今回の研修を、その再発防止策の一つとして位置づけています。\n【詳細】研修は11月24日に行われ、市内にある公立・私立の教育・保育施設などに勤める職員、あわせて40人あまりが参加しました。グループワークでは、それぞれの施設が抱える実情や、すでに取り組んでいる対策が共有されました。参加者からは、水筒に入れた氷が溶けて小さくなると誤嚥につながるおそれがあるため、保護者にも氷を入れないよう伝えているという具体的な例が紹介されました。また、消防署の職員による講習も行われ、窒息事故が起きた際の応急措置を確認しました。三橋市長は、今回の研修を大きな一歩だとしたうえで、同様の事故を繰り返さないために必要な取り組みだと述べ、今後も研修を重ねて再発防止に努める考えを示しました。\n【ポイント・注意点】子どもは食べ物をかみ砕いたり飲み込んだりする力が未熟で、形や大きさ、硬さによっては簡単にのどに詰まってしまいます。凍らせた食品や氷のように、溶ける途中で小さく滑りやすくなるものにも注意が必要です。家庭でも保育の場でも、食べ物の形状や与え方を見直し、食べている間は子どもから目を離さないことが基本です。あわせて、万が一詰まらせたときに慌てず対応できるよう、大人が背部叩打法などの応急手当を学び、緊急時の通報の流れを日頃から確認しておくことが大切です。","2026-11-24","奈良テレビ放送（Yahoo!ニュース）","https://news.yahoo.co.jp/articles/00311c770fbf4aa208302b3a00e89da743af7550"],["沖縄県のインフル警報、約2カ月ぶり解除も県が予防徹底を呼びかけ","沖縄県で9月に流行が始まったインフルエンザが落ち着き、10月2日に出された警報が11月20日に解除された。11月9日～15日に県内44カ所の定点医療機関から報告された患者は344人、1医療機関あたり7.82人で、すべての管内で注意報基準の10人を下回った。ただ県内では寒さが本格化する年明けにも感染が広がる傾向があり、今季はA型が中心だったため別の型による2度目の感染にも注意が必要だとして、県は手洗いやせきエチケットの徹底を呼びかけている。","\n【概要】沖縄ニュースQABによると、沖縄県で2026年9月に流行が始まり猛威を振るっていたインフルエンザが落ち着きを見せたことから、2カ月近く続いていた「インフルエンザ警報」が解除された。一方で、冬の流行期が迫っているとして、県は引き続き感染予防の徹底を呼びかけている。警報解除はひと安心の材料だが、県は「油断禁物」の姿勢を崩していない。\n【背景】今シーズンの沖縄県では9月に流行が始まり、県は10月2日に「インフルエンザ警報」を出していた。県内では、夏の終わりから秋にかけてだけでなく、寒さが本格化する年明けにも感染が拡大する傾向があるという。警報の解除は秋の流行が一段落したことを示すものだが、これから迎える冬の流行期に向けて、家庭や学校での備えが改めて求められている。\n【詳細】県によると、11月9日から15日までの1週間に県内44カ所の定点医療機関から報告されたインフルエンザの患者数は344人で、1医療機関あたり7.82人だった。すべての管内で注意報の基準となる10人を下回ったことから、県は11月20日に警報を解除した。ただし、今回流行したのはA型で、冬に別の型が流行した場合には2度目の感染に注意が必要だとしている。県は県民に対し、人混みを避けることや、手洗い・せきエチケットを徹底することなど、引き続き感染予防に努めるよう求めている。\n【ポイント・注意点】警報が解除されても、インフルエンザの感染がなくなったわけではない。特に今季A型にかかった子どもでも、別の型に再びかかる可能性があるため、「一度かかったから大丈夫」と考えないことが大切だ。家庭では、帰宅後や食事前の手洗いを習慣づけ、せきやくしゃみが出るときはマスクを着けたり、ティッシュや袖で口と鼻を覆ったりするよう子どもに教えたい。年末年始は帰省や行事で人が集まる機会が増えるため、混雑した場所を避ける工夫も有効だ。発熱やせきなどの症状が出た場合は無理に登校・登園させず、早めにかかりつけ医に相談し、家庭内でもタオルの共用を避けるなどして感染の広がりを防ぎたい。","2026-11-24","沖縄ニュースQAB（Yahoo!ニュース）","https://news.yahoo.co.jp/articles/6aa608d8c8e46d12db31eb78ccad99b9e77012ca"],["岡山県内11校でインフル様の集団風邪 患者計214人、最長27日まで閉鎖","岡山県などは24日、県内の11校でインフルエンザとみられる集団風邪が発生し、患者は計214人に上ったと発表した。内訳は県所管の4校、岡山市の3校、倉敷市の4校で、備前市や津山市、瀬戸内市、笠岡市、岡山市、倉敷市の小学校9校と高校2校が含まれる。各校は最長で27日まで学年閉鎖や学級閉鎖の措置を取る。学校ごとの患者数や閉鎖の対象学年は示されておらず、対象の大半は小学校だ。","\n【概要】山陽新聞デジタルによると、岡山県などは11月24日、県内の11校でインフルエンザとみられる集団風邪が発生したと発表した。患者は計214人に上り、各校は最長で27日まで学年閉鎖や学級閉鎖を実施する。対象の大半は小学校で、子どもたちの間で感染が広がっている様子がうかがえる。\n【背景】集団風邪の発生状況は、県と、岡山市・倉敷市がそれぞれの所管分を取りまとめる形で公表されており、今回の発表も県所管が4校、岡山市が3校、倉敷市が4校という区分になっている。学年閉鎖や学級閉鎖は、同じ学年や学級で欠席者が増えた際に、一定期間授業を止めて子ども同士の接触を減らし、感染の連鎖を断ち切るための措置だ。対象校が複数の市にまたがっている点も今回の特徴といえる。\n【詳細】県所管では、備前市、津山市、瀬戸内市の小学校各1校と、笠岡市の高校1校で集団風邪が確認された。岡山市では小学校2校(うち1校は分校)と高校1校、倉敷市では小学校4校が対象となった。合計すると小学校9校、高校2校の計11校で、患者は合わせて214人。閉鎖期間は学校によって異なり、最も長いところで27日までとなっている。記事では、学校ごとの患者数や閉鎖の開始日、どの学年が対象かといった内訳までは示されていない。\n【ポイント・注意点】学年・学級閉鎖の期間は、感染拡大を防ぐために家庭で過ごす期間であり、塾や習い事、人が集まる場所への外出はできるだけ控えたい。閉鎖中に症状が出た場合は早めに医療機関を受診し、出席停止の期間や登校の目安については学校や医師の指示に従うことが大切だ。家庭内では、石けんを使った手洗いやこまめな換気、適度な加湿を心がけ、タオルを共用しないことなどで、きょうだいや家族への感染を防ぐ工夫をしたい。急な高熱が出たり、呼びかけへの反応が鈍い、おかしな言動があるといった異変に気付いたりした場合は、ためらわずに受診しよう。周囲で流行が続いている時期は、睡眠と食事をしっかりとって体調を整えておくことも、子どもの体を守る基本になる。","2026-11-24","山陽新聞デジタル（Yahoo!ニュース）","https://news.yahoo.co.jp/articles/2101d3bf71adb2b6ed3fa462e50f5088b6f26af6"],["インフル感染で香川県の小学校3校が学級閉鎖 欠席者最多11人","香川県教育委員会は11月24日、インフルエンザの感染により県内の3つの小学校で学級閉鎖を行うと発表した。高松市の小学校では2年生の1クラスで5人、坂出市の小学校では1年生の1クラスで11人がインフルエンザで欠席し、いずれも24日と25日の2日間を学級閉鎖とする。多度津町の小学校では4年生の1クラスでインフルエンザによる欠席が7人、別の症状による欠席が4人となり、25日と26日の2日間閉鎖する。","\n【概要】KSB瀬戸内海放送によると、香川県教育委員会は11月24日、インフルエンザの感染により県内の3つの小学校で学級閉鎖を行うと発表した。対象は高松市、坂出市、多度津町の小学校で、いずれも1クラスずつ、2日間の学級閉鎖となる。低学年のクラスでもまとまった数の欠席者が出ており、地域の子どもたちの間で感染が広がりつつある様子がうかがえる。\n【背景】学級閉鎖は、同じクラスで欠席者が増えた際に一定期間授業を止め、子ども同士の接触を減らすことで感染の連鎖を断ち切るための措置だ。今回の発表は、週明けの24日の時点で県内の3つの小学校がそろって学級閉鎖に踏み切るという内容で、高松市、坂出市、多度津町と、県内の複数の地域にまたがっている。寒さが増すこれからの季節に向けて、家庭や学校での感染対策がいっそう重要になる。\n【詳細】発表によると、高松市の小学校では2年生の1クラスで5人がインフルエンザで欠席し、24日と25日の2日間を学級閉鎖とした。坂出市の小学校では1年生の1クラスで11人がインフルエンザで欠席しており、同じく24日と25日の2日間閉鎖する。多度津町の小学校では4年生の1クラスで、インフルエンザによる欠席が7人、別の症状による欠席が4人となり、25日と26日の2日間を学級閉鎖とする。記事では、それぞれの学校名は明らかにされていない。\n【ポイント・注意点】学級閉鎖は、症状のない子どもも含めて家庭で過ごし、感染を広げないための期間だ。閉鎖中は外出や友達同士で集まることを控え、家で体を休めることを心がけたい。子どもに発熱やせき、のどの痛み、だるさなどの症状が見られた場合は早めに医療機関を受診し、登校の再開時期は学校や医師の指示に従うことが大切だ。家庭では、帰宅後や食事前の手洗い、部屋の換気、適度な加湿、十分な睡眠を意識し、家族の誰かが発症した場合はタオルや食器の共用を避けるなどして家庭内感染を防ぎたい。特に低学年の子どもは自分で体調の変化を伝えにくいため、顔色や食欲、元気の有無など、普段との違いに大人が気を配ることも大切だ。","2026-11-24","KSB瀬戸内海放送","https://news.ksb.co.jp/article/17075025"],["名古屋市、小学校で学級・学年閉鎖8件 今季の累計は248件に","名古屋市は11月24日、インフルエンザ様疾患による学級閉鎖等の状況を更新した。同日判明分はすべて小学校で、学級閉鎖7件、学年閉鎖1件の計8件、閉鎖期間は11月25日から26日まで。今シーズンの累計は休校5件、学年閉鎖20件、学級閉鎖223件の計248件となり、うち小学校が143件、中学校が56件、高校が34件を占める。市衛生研究所の検査では、9月から11月の小学生の検体からA/H1pdm09ウイルスの遺伝子が検出されている。","\n【概要】名古屋市は2026年11月24日、市公式ウェブサイトで「集団かぜ(インフルエンザ様疾患)による学級閉鎖等の状況」を更新した。同日に判明した集団発生はすべて小学校で、学級閉鎖が7件、学年閉鎖が1件の計8件だった。閉鎖期間は11月25日から26日までとなっている。今シーズンの累計は計248件に達しており、小学校を中心に集団かぜの報告が続いている。\n【背景】市は、学校などから報告された集団かぜによる休校や学年・学級閉鎖の状況を公表している。同じ施設で複数の学級や学年が閉鎖された場合、同じ日の報告は1件として数え、別の日の報告はそれぞれ別件として数える。また、学校から市役所への報告が遅れるなどして、掲載が数日後になる場合があるとしている。表に掲載されるのはその日に判明した集団発生施設のみで、過去の措置は履歴ファイルで確認できる仕組みだ。\n【詳細】今シーズン(2026～2027年シーズン)の累計は、休校5件、学年閉鎖20件、学級閉鎖223件の計248件。施設別では、小学校が学年閉鎖13件・学級閉鎖130件の計143件で最も多く、中学校が学年閉鎖4件・学級閉鎖52件の計56件、高校が休校5件・学年閉鎖1件・学級閉鎖28件の計34件、幼稚園が計7件、その他が計8件だった。保育園からの報告はなかった。なお、ページ上の「患者数」は、閉鎖を決めた日にインフルエンザ様症状やその疑いを含むかぜ症状があると学校が判断した人数を指す。市衛生研究所のウイルス検査では、2026年9月から11月にかけての小学生の検体から、A/H1pdm09ウイルスの遺伝子が検出されている。\n【ポイント・注意点】累計の数字からは、小学校で集団発生が特に多いことが分かる。子どもが通う学校で閉鎖が出た場合は、閉鎖期間中の外出を控え、家庭で体調の変化に気を配りたい。発熱やせきなどの症状が出たら早めに医療機関に相談し、登校再開の時期は学校や医師の指示に従おう。家庭では、手洗いやこまめな換気、十分な睡眠とバランスのよい食事を心がけ、体調を崩しにくい生活習慣を整えることが予防の基本となる。きょうだいが別の学校や園に通っている場合は、家庭内で感染が広がらないよう、タオルの共用を避けるなどの工夫も役立つ。","2026-11-24","名古屋市公式ウェブサイト","https://www.city.nagoya.jp/kenkofukushi/eisei/1015269/1015388/1015389/1015390.html"],["シカゴの珍しい砂嵐後、子どものアレルギー関連受診の割合が上昇","米イリノイ大学医学部の研究チームは、2025年5月16日にシカゴ周辺を襲った珍しい砂嵐の前後で、小児外来クリニックの受診内容を調べた。砂嵐後の最初の3診療日ではアレルギー関連の受診が全体の20%を占め、直前3診療日の13%から増加した。湿疹やぜんそく、花粉症などが含まれ、救急外来だけでなくプライマリケアにも負担が及ぶことが示された。研究成果は「Annals of Family Medicine」に掲載された。","\n【概要】米国家庭医学会（AAFP）によると、イリノイ大学医学部の研究チームは、シカゴで発生した珍しい砂嵐の後、小児外来クリニックでアレルギー関連の受診の割合が増えたとする研究を「The Annals of Family Medicine」に発表した。砂嵐後の最初の3診療日では受診の20%がアレルギー関連で、砂嵐前の3診療日の13%を上回った。【背景】砂嵐は、微小な粒子に加え、花粉、真菌の胞子、細菌、農薬などの化学汚染物質を運ぶことがあり、ぜんそくやアレルギーの一因になり得るとされる。これまでの砂嵐に関する研究の多くは救急外来の受診に注目しており、地域の診療所などプライマリケアへの影響は十分に調べられていなかった。今回の砂嵐は2025年5月16日に発生し、イリノイ州北東部の1万2000平方マイル（3万1000平方キロメートル）以上を覆った。通常は砂嵐の影響を受けない地域で起きた点も特徴である。【詳細】研究チームは、シカゴの小児外来クリニックにおける砂嵐前後それぞれ7診療日の受診記録を見直した。その結果、砂嵐直後の3診療日でアレルギー関連の受診割合が20%に達し、直前の3診療日の13%から上昇していた。該当した受診の診断名には、湿疹、ぜんそく・反応性気道疾患、花粉症、アレルギー性結膜炎、アレルギー性皮膚炎、季節性アレルギーが含まれていた。著者らは、この事例を、極端な気象現象が子どもの健康に与える影響の一例として位置づけている。また、救急外来だけでなくプライマリケアにも広く負担が及ぶことを示したとしている。【ポイント・注意点】今回の研究は1カ所のクリニックの短期間の記録を分析したもので、記事では受診の総数や統計的な有意性は示されていない。結果の解釈には慎重さが必要だが、ふだん砂嵐が起きない地域でも、異常気象によって子どものアレルギー症状が悪化し得ることを示唆している。ぜんそくやアトピー性皮膚炎などの持病がある子どもの家庭では、砂ぼこりや大気汚染の情報に注意し、外出を控えたり窓を閉めたりするなどの対策を検討するとよい。症状が悪化した場合は、早めにかかりつけ医に相談することが大切である。","2026-11-24","Medical Xpress（American Academy of Family Physicians提供）","https://medicalxpress.com/news/2026-11-percentage-children-allergy-rare-chicago.html"],["高松の国道で正面衝突 母親死亡、生後9カ月の娘や2歳・9歳男児もけが","11月22日午後3時40分ごろ、高松市国分寺町の国道11号で、中央分離帯を乗り越えた乗用車が対向車線の乗用車と正面衝突しました。衝突された車の助手席にいた30歳の女性が約11時間後に死亡し、運転していた28歳の夫が重傷、後部座席の生後9カ月の娘が軽傷を負いました。相手の車に乗っていた2歳と9歳の男の子も軽傷の見込みです。警察は相手の車の40歳の男を逮捕しました。","\n【概要】香川県高松市の国道11号で11月22日午後、中央分離帯を越えた乗用車が対向車線の乗用車と正面衝突し、30歳の女性が死亡しました。KSB瀬戸内海放送が23日に続報として伝えました。双方の車には乳幼児や小学生くらいの子どもが乗っており、生後9カ月の女の子と2歳、9歳の男の子がけがをしました。警察は中央分離帯を越えた車を運転していた男を逮捕し、詳しい状況を調べています。\n【背景】現場は高松市国分寺町の国道11号で、片側3車線の直線道路です。交通量の多い幹線道路での正面衝突は、速度が出ていることもあって被害が大きくなりやすく、車内にいる子どもも巻き込まれる危険があります。今回の事故でも、家族で乗っていた車の母親が亡くなり、乳児を含む子どもたちがけがをする結果となりました。\n【詳細】報道によりますと、事故は22日午後3時40分ごろに起きました。乗用車が中央分離帯を乗り越えて対向車線に入り、走ってきた乗用車と正面からぶつかりました。衝突された車の助手席に乗っていた30歳の女性は、およそ11時間後に出血性ショックで死亡しました。運転していた28歳の夫は頭の骨を折る重傷を負い、後部座席に乗っていた生後9カ月の娘は軽いけがでした。中央分離帯を越えた側の車に乗っていた2歳と9歳の男の子も、軽傷の見込みだということです。警察は、この車を運転していた40歳の会社員の男を過失運転傷害の疑いで逮捕しました。男にけがはありませんでした。警察は容疑を過失運転致死傷に切り替えて調べています。事故の影響で、坂出方面の車線は午後7時ごろまで通行止めとなりました。\n【ポイント・注意点】自分たちが安全運転をしていても、対向車がはみ出してくるような事故を完全に避けることは難しく、車内での子どもの守り方が重要になります。乳幼児は年齢や体格に合ったチャイルドシートを正しく取り付けて使い、ベルトの緩みがないか乗車のたびに確認することが大切です。小学生も体格に応じてジュニアシートを使い、後部座席でもシートベルトを必ず締めさせましょう。運転する大人は、疲れや眠気を感じたら無理をせず休憩を取り、車間距離と速度に余裕を持った運転を心がけることが、事故そのものを防ぐことにもつながります。","2026-11-23","KSB瀬戸内海放送（ライブドアニュース）","https://news.livedoor.com/article/detail/32878717/"],["各地で寒暖差大きく インフル患者4週連続増、北海道は警報基準超え","日本気象協会の気象予報士は11月23日、今後1週間の天気傾向とあわせて感染症への注意を呼びかけた。厚生労働省の20日の発表では、第46週(11月9日～15日)のインフルエンザの報告数は44,563、定点当たり11.94で、患者報告数は4週連続で増加。北海道は定点当たり30以上と警報基準を超え、東北でも増加が続いている。関東～九州は横ばいか微増の所が多いが、寒さや乾燥で患者が増えている可能性があるとして、手洗いや加湿、十分な睡眠を促している。","\n【概要】日本気象協会のtenki.jpは2026年11月23日、気象予報士による解説記事で、今後1週間の気温の見通しとともに、インフルエンザなど感染症への注意を呼びかけた。関東から九州では一日の気温差が大きく、東北から北海道では日ごとの寒暖差が激しくなる見込みで、体調管理が難しい時期となっている。\n【背景】23日は東京都心の最低気温が4.3℃と今シーズン一番の冷え込みとなり、大阪市は4.5℃、神戸市は4.9℃を観測した。11月に最低気温が5℃を下回ったのは大阪市で5年ぶり、神戸市で7年ぶりだった。関東から九州では25日に一時的に寒さが戻った後、26日からは寒さが緩んで高温傾向となる一方、東北から北海道では25日と29日に厳しい寒さとなる見込みだ。25日夜から26日朝にかけては放射冷却で冷え込みが強まる所が多いとしている。\n【詳細】記事によると、厚生労働省が20日に発表した令和8年第46週(11月9日～15日)のインフルエンザの指定医療機関からの報告数は44,563、定点当たり報告数は11.94で、患者報告数は4週連続で増加した。北海道と東北では増加が続いており、北海道は定点当たり30以上の警報基準を超えている。関東から九州は横ばいか微増の所が多いものの、ここ数日の寒さや乾燥で罹患者が増加している可能性があるという。記事は、こまめな手洗いとうがい、室内の適度な加湿、バランスのとれた食事、十分な睡眠など、体調管理に努めるよう促している。\n【ポイント・注意点】気温差が大きい時期は体調を崩しやすく、子どもは特に疲れや冷えから感染症にかかりやすくなる。朝晩の冷え込みに備えて重ね着で体温調節しやすい服装を用意し、暖房を使う季節は室内が乾燥しやすいため、加湿器や洗濯物の部屋干しなどで湿度を保つ工夫をしたい。帰宅後や食事前の手洗い・うがいを習慣にし、早寝や栄養のある食事で体調を整えることが予防の基本となる。発熱やせきなど気になる症状がある場合は無理をさせず、早めにかかりつけの医療機関に相談しよう。","2026-11-23","tenki.jp（日本気象協会）","https://tenki.jp/forecaster/t_fujikawa/2026/11/23/41415.html"],["ライム病の子どもの12人に1人にポワッサンウイルス重複感染の兆候","米ボストン小児病院などの研究チームは、ライム病が疑われた子ども600人の血液を分析し、ライム病と診断された子どもの8.5%にポワッサンウイルスの最近の感染を示す抗体が見つかったと「Clinical Infectious Diseases」に報告した。比較群では0.7%で、ライム病の子どもは抗体陽性のオッズが約5倍だった。いずれの感染も診療時には診断されていなかった。","\n【概要】米ミネソタ大学の発表によると、ボストン小児病院が主導する研究チームは、ライム病の子どものおよそ12人に1人に、ポワッサンウイルスの最近の感染を示す抗体が見つかったとする研究を「Clinical Infectious Diseases」に発表した。こうした感染は、治療にあたった医師によって一件も診断されていなかった。【背景】ポワッサンウイルスは、ライム病を媒介するのと同じクロアシマダニ（シカダニ）によって運ばれる。症状はインフルエンザのような軽いものから、脳炎のような重いものまである。ライム病の感染には通常24時間以上のマダニの吸着が必要とされるが、ポワッサンウイルスはわずか15分の吸着でも感染し得るとされる。【詳細】研究チームは、2015〜2024年にライム病の評価を受けた子ども600人の血液検査を分析した。対象はマダニが多い地域にある8つの救急部門の患者で、早期ライム病と診断された305人と、似た症状がありながらライム病が陰性だった295人を比較した。両群は年齢、性別、地域、症状をそろえており、年齢の中央値は9歳だった。その結果、ポワッサンウイルス抗体はライム病陽性の子ども26人（8.5%）、比較群の2人（0.7%）で検出された。交絡因子を調整すると、ライム病の子どもは抗体陽性となるオッズが約5倍高かった。著者らは、ポワッサンウイルス感染の頻度は報告よりはるかに高いとする先行研究を支持する結果であり、特にライム病が確定した患者でその傾向が強いと述べている。【ポイント・注意点】研究には、ライム病の発疹が他の発疹と取り違えられた可能性や、ライム病検査が早期感染を見逃したり過去の感染を検出したりし得ること、ポワッサンウイルス検査に偽陽性があること、採血が1回のみで抗体の変化を追えなかったことなどの限界がある。研究チームは、ライム病が疑われる子ども、特に症状が典型的でない場合やライム病の治療への反応が遅い場合に、ポワッサンウイルス検査を検討するよう提言している。マダニの生息する野山に出かける際は、肌の露出を避け、帰宅後に体にマダニが付いていないか早めに確認することが重要である。","2026-11-23","Medical Xpress（University of Minnesota提供）","https://medicalxpress.com/news/2026-11-children-lyme-disease-powassan-virus.html"],["シナモンの鉛は子どもに危険か　米研究が市販品を検査・推計","米バッファロー大学の研究チームは、ニューヨーク州西部で購入した市販のシナモンパウダーの鉛濃度を測定し、3〜5歳児の摂取シナリオをモデルで推計した。大半の製品は州の香辛料の基準値を下回り、頻繁に使っても血中鉛濃度を通常の水準以上に押し上げる可能性は低いとされた。一方、水や土など他の経路と重なれば曝露を上乗せし得るとして、複数の鉛源を減らす対策を勧めている。研究は「Journal of Xenobiotics」に掲載された。","\n【概要】米バッファロー大学公衆衛生・保健専門職学部のカタジナ・コルダス氏らの研究チームは、市販のシナモンに含まれる鉛が3〜5歳の子どもにどの程度影響し得るかを調べた研究を、11月3日付で「Journal of Xenobiotics」に発表した。検査した製品の大半は鉛濃度が低く、おおむね安心できる結果だった。【背景】子どもの鉛曝露は認知機能の低下などと関連する。幼い子どもは摂取した鉛の約40〜50%を腸から吸収し、成人の3〜10%に比べて影響を受けやすい。鉛は汚染された土壌や加工工程でシナモンに混入し得る。米国では2023年、ある銘柄のアップルソースに関連して、主に子どもで約600人の血中鉛濃度の上昇が確認された。2024年には米食品医薬品局（FDA）が一部のシナモン製品の鉛について警告し、消費者団体コンシューマー・リポートは調査した製品の3分の1でリコール相当の鉛濃度を確認していた。【詳細】研究チームはニューヨーク州西部の食料品店やディスカウント店でブランド品のシナモンパウダーを購入し、州保健局ワズワース研究所で高感度の方法により検査した。さらに、食品だけの場合と、土壌・水・空気も含めた場合など、複数のシナモン摂取シナリオを「IEUBK」モデルで比較した。料理やお菓子の1食分（小さじ8分の1にあたる約0.6mLから約小さじ2杯の10mLまで）を想定し、何食分でFDAの子ども向け1日上限を超えるかも推計した。その結果、大半の製品は州の香辛料に関する現行の基準値を下回り、低い鉛濃度であれば頻繁に使っても、血中鉛濃度が現在の米国の幼児に一般的な水準を超える可能性は低いと示された。ただし、毎日大量に食べれば曝露を上乗せし得る。【ポイント・注意点】共著者のガウリ・デサイ氏は、シナモン入りの食べ物は家庭の伝統の一部であり楽しみ続けてよいとしたうえで、購入するブランドを変えることや、特に甘いお菓子の量に気を配ることを勧めている。研究チームは、浄水器の設置、壁や窓のはがれた塗料の確認、玄関マットの使用など、他の鉛源を減らす工夫も挙げた。検査したサンプルが全製品を代表するわけではない点にも留意が必要である。","2026-11-23","Medical Xpress（University at Buffalo提供）","https://medicalxpress.com/news/2026-11-cinnamon-pose-danger-kids.html"],["家庭の大人の喫煙・電子たばこで10代の物質使用リスク上昇　米研究","米フィラデルフィア小児病院（CHOP）の研究チームは、10代の若者6万69人の電子カルテデータを分析し、家庭内の大人が喫煙や電子たばこを使っている場合、10代がたばこ・ニコチン、アルコール、大麻を使用する割合が高いことを「Pediatrics」に報告した。親と他の大人の両方が使用する家庭では高リスクの物質使用の判定オッズが約15倍で、親の電子たばこ使用も低リスクではなかった。","\n【概要】米フィラデルフィア小児病院（CHOP）と米ペンシルベニア大学のブライアン・ジェンセン氏らの研究チームは、家庭内の大人がたばこや電子たばこを使用している場合、10代の若者がたばこ・ニコチン、アルコール、大麻などを使用する可能性が高いとする研究を「Pediatrics」に発表した。【背景】研究は、CHOPのケアネットワークで2025年1月から2026年5月に行われた定期受診の電子カルテデータを用いた横断研究である。自動化されたたばこ治療プログラムで親や養育者が回答したたばこのスクリーニング質問と、10代が回答した秘密保持の健康質問票を組み合わせ、6万69人の10代を分析した。【詳細】10代のたばこ・ニコチン使用の割合は、親・養育者と家庭内の他の大人の両方が使用する家庭で23.5%、親・養育者のみが使用する家庭で13.5%、他の大人のみが使用する家庭で11.8%だったのに対し、誰も使用しない家庭では2.0%にとどまった。アルコールや大麻など他の物質でも同様の傾向がみられた。年齢、性別、保険、地域の機会指数を調整すると、親と他の大人の両方が使用する家庭の10代は、使用のない家庭に比べ、高リスクの物質使用と判定されるオッズが約15倍だった。また、使用のない家庭と比べたたばこ・ニコチン使用のオッズは、親が電子たばこのみを使用する場合に5.6倍、紙巻きたばこのみの場合に2.6倍で、研究チームは親の電子たばこ使用が低リスクの代替手段ではないと指摘した。【ポイント・注意点】横断研究のため、家庭内の使用が10代の物質使用を引き起こすとは断定できず、家族や社会、環境の共通要因が関与している可能性もある。ただし研究チームは、物質を問わず一貫したパターンがみられたことから、家庭内の使用は臨床医にとって実用的なリスクのサインになると述べている。研究チームによると、このスクリーニングの仕組みはCHOPの31のケアネットワーク診療所すべてなどで使われており、親のたばこ陽性判定は親への禁煙支援と10代への予防的な働きかけにつながり得る。ジェンセン氏は、家庭内のたばこや電子たばこの使用は親だけの健康問題ではないと強調した。保護者自身が禁煙・禁電子たばこに取り組むことは、子どもを守ることにもつながる。","2026-11-23","Medical Xpress（Children's Hospital of Philadelphia提供）","https://medicalxpress.com/news/2026-11-teens-tobacco-alcohol-marijuana-adults.html"],["子ども時代に果物や魚を多く食べるとクローン病リスク低下と関連","北欧3カ国の出生コホートを統合した約11万2000人の研究で、子ども時代に果物を多く食べた人はクローン病のリスクが34%低く、魚を多く食べた人も35%低かった。10代の果物の多量摂取では64%低かった。また、10代でポテトチップスなどの塩味スナックを多く食べると炎症性腸疾患（IBD）全体のリスクが32%高かった。一方、子ども時代の果物の多量摂取は潰瘍性大腸炎のリスク上昇とも関連した。研究は医学誌「Gut」に掲載された。","\n【概要】英国医師会雑誌（BMJ）グループによると、ノルウェー、デンマーク、スウェーデンの3つの出生コホートを統合した観察研究で、子ども時代や10代に果物や魚を多く食べることがクローン病のリスク低下と関連していることが分かった。研究成果は医学誌「Gut」に掲載された。【背景】炎症性腸疾患（IBD）はクローン病と潰瘍性大腸炎を含む病気である。研究では、ノルウェーのMoBa、デンマークのDNBC、スウェーデンのABISの参加者計11万1999人を、妊娠中または出生時から追跡した。7〜15歳の間に2回、食物摂取頻度質問票で果物、野菜、乳製品、肉、魚、加糖飲料、スナックなどの摂取を調べ、2024年までの国の患者登録からIBDの診断を確認した。平均12〜17年の追跡で653人がIBDと診断された。【詳細】摂取が少ない人と比べ、子ども時代に果物を多く食べた人はクローン病のリスクが34%低かった一方、潰瘍性大腸炎のリスクは54%高かった。10代での果物の多量摂取はクローン病のリスクが64%低く、潰瘍性大腸炎とは有意な関連がなかった。子ども時代の魚の多量摂取はクローン病のリスクが35%低かったが、10代の魚の摂取では関連はみられなかった。10代にポテトチップス、コーンチップス、ポップコーンなどの塩味スナックを多く食べた人は、IBD全体のリスクが32%、潰瘍性大腸炎のリスクが51%高かった。他の食品群では統計的に有意な関連はなかった。結果は、生後1年の抗菌薬使用や母乳育児期間など幼少期の微生物関連要因を考慮してもほとんど変わらなかった。研究チームは、果物の食物繊維が腸内細菌の多様性や短鎖脂肪酸の産生を高めることや、脂の多い魚に含まれる長鎖オメガ3脂肪酸が炎症経路を調整する可能性を挙げている。【ポイント・注意点】観察研究のため因果関係は証明できず、その後の運動習慣や抗菌薬使用などは調整できていない。著者らは、他の研究でも確認されれば、健康的な食習慣の推進がIBD予防の戦略になり得るとしている。子どもの頃からバランスのよい食事を心がけ、塩味スナックの食べ過ぎに注意することが大切である。","2026-11-23","Medical Xpress（British Medical Journal提供）","https://medicalxpress.com/news/2026-11-childhood-diet-high-fruit-fish.html"],["10カ月超の母乳育児、子どもの拡張期血圧のわずかな上昇と関連　中国研究","中国・重慶医科大学附属児童病院などの研究チームは、重慶市の子ども2025人を5年間追跡した観察研究で、母乳育児が10カ月を超えると拡張期血圧と平均動脈圧がやや高いことと関連したと「Scientific Reports」に報告した。拡張期血圧の差は約0.64mmHgと小さく、長期的な臨床的意義は不明で、この結果だけで母乳育児の推奨を変える根拠にはならないとされている。","\n【概要】ニュース・メディカルによると、中国・重慶医科大学附属児童病院が主導する研究チームは、母乳育児の期間が10カ月を超えると、学童期から思春期の子どもの拡張期血圧（DBP）と平均動脈圧（MAP）がやや高いことと関連したとする研究を「Scientific Reports」に発表した。収縮期血圧には調整後、明確な関連はみられなかった。【背景】研究は、2014年に始まり2019年に再評価が行われた中国南西部の「重慶健康児童コホート」を用いた。ベースラインでは都市部、郊外、農村部から6〜13歳の子ども1万5007人を募集した。再評価の対象となった小学1・2年生5931人のうち、5年後に測定を終えた2025人を縦断的に分析した。血圧は10分以上の安静後に右腕で繰り返し測定し、その平均を用いた。母乳育児の期間などは質問票で把握した。【詳細】全体では、10カ月を超えて母乳育児を受けた子どもの拡張期血圧は約0.64mmHg高く、拡張期血圧が高値となるオッズは約24%高かった。著者らはこの差は小さく、長期的な臨床的意義は不確かだとしている。男児では3つの指標すべてでわずかに高かったが、女児では有意な関連はなかった。年齢の中央値9.3歳未満の子どもでは3つの指標で関連がみられたが、年長の子どもではみられなかった。出生体重3kg以下の子どもでも3つの指標で関連があった。都市部の子どもでは拡張期血圧と平均動脈圧が高く、農村部では有意な関連はなかった。出生体重3.6kg超の子どもでも拡張期血圧と平均動脈圧が高かった。なお、10カ月という区切りは臨床的な基準ではなく、このコホートのデータから統計的に導かれたもので、他の集団での確認が必要とされる。【ポイント・注意点】観察研究のため因果関係は示せず、母乳育児の期間は親の申告に基づき、完全母乳と混合栄養も明確に区別されていない。対象者の約3分の2が追跡から外れたことによる偏りや、早産のデータがない点も限界である。記事は、この結果だけでは現行の母乳育児の推奨を変える根拠にはならないとしている。保護者は母乳育児をためらう必要はなく、子どもの血圧が気になる場合は健診などで医師に相談するとよい。","2026-11-22","News-Medical","https://www.news-medical.net/news/20261122/Breastfeeding-beyond-10-months-linked-to-unexpected-blood-pressure-findings-in-children.aspx"],["エナジードリンクを多く飲む10代、睡眠不足や飲酒・喫煙も多い傾向","ドイツ連邦リスク評価研究所などの研究チームは、ベルリンの15〜18歳の生徒4893人を調査し、エナジードリンクを慢性的に多く飲む層では、飲用後に動悸や睡眠不良などの症状を訴えた割合が50.2%に上ったと「European Journal of Nutrition」に報告した。摂取量が多いほど飲酒、喫煙、大麻使用や短い睡眠、長いスクリーンタイムとの関連もみられた。","\n【概要】ニュース・メディカルによると、ドイツ連邦リスク評価研究所やシャリテー・ベルリン医科大学などの研究チームは、エナジードリンク（ED）を多く飲む10代の若者は、カフェインの総摂取量が多いだけでなく、飲酒や喫煙、睡眠不足などの傾向も併せ持つとする研究を「European Journal of Nutrition」に発表した。【背景】研究は、EDの慢性的な多量摂取と心血管リスクを調べる「EDKAR研究」の横断的分析である。ベルリンの学校に通う15〜18歳の4893人（男子53.8%、平均16.2歳）が質問票に回答した。過去1年にEDを飲んだのは66%だった。週4回以上を1年以上続け、ED単独で1日のカフェイン量が体重1kgあたり3mgの目安を超える人を「慢性高摂取群」と定義し、全体の5.9%が該当した。【詳細】ED飲用者の1日の摂取量の中央値は82.9mL（カフェイン約26.5mg）だったが、慢性高摂取群ではEDから平均262mg、全てのカフェイン飲料から平均428mgのカフェインを摂っていた。同群の44.9%は1日に1リットルを超えるEDを飲んだことがあった。ED飲用後に睡眠不良、動悸、胸の圧迫感、頭痛などの症状を報告した人は飲用者全体で28.7%、慢性高摂取群では50.2%に上り、たまに飲む層の23.2%を大きく上回った。ED摂取が多いほど喫煙、大麻、飲酒が多く、アルコールとの混用も慢性高摂取群で最も多かった。平日の睡眠が短い人の割合もED摂取とともに増え、1日8時間を超えるスクリーンタイムは慢性高摂取群で約73%、非飲用者で36%だった。【ポイント・注意点】横断研究で自己申告に基づくため因果関係は不明で、EDが睡眠を短くするのか、睡眠不足の人がEDに頼るのかは判断できない。ベルリンの結果が他地域に当てはまるとも限らない。著者らは、EDの健康リスクや関連する有害な行動について認識を高める予防策や教育プログラムが必要だとしている。保護者は子どもが飲む量や頻度に目を配り、睡眠や生活習慣も含めて話し合うことが大切である。","2026-11-22","News-Medical","https://www.news-medical.net/news/20261122/Teens-who-drink-the-most-energy-drinks-have-something-else-in-common.aspx"]],"dev":[["自閉症の子 施設での集中療育で症状スコアが大きく改善 中国60人","中国安徽省蚌埠市で、自閉症の子ども60人を対象に、施設での構造化された療育と家庭での訓練を比べた研究が発表された。言語行動療法など3つの手法を週5日、24週間続けた施設群では、自閉症の評価尺度CARS-2の得点が46.77から41.70へ下がり、家庭群の減少幅1.13を大きく上回った。ただし割り付けは無作為ではなく、評価者も群を知っていたため、因果関係は言えないと著者は述べている。","\n【概要】中国の研究チームが、自閉症の子どもに対する施設での構造化された療育が、家庭での訓練に比べて症状の評価得点をより大きく下げたとする研究を、学術誌Frontiers in Child and Adolescent Psychiatryに発表した。対象は安徽省蚌埠市の生後24〜146か月の子ども60人で、施設に通う30人と、主に年齢で1対1に組み合わせた家庭訓練の30人を比べた。【背景】自閉症の子どもへの支援には、施設に通って専門的な療育を受ける方法と、家庭で訓練する方法がある。今回は前向きの準実験研究として、同じ時期に両群を追跡し、得点の変化を比べた。評価には自閉症の評価尺度CARS-2の中国語版と、自閉症治療評価チェックリストATECを用いた。【詳細】施設群は、言語行動療法、絵カード交換式コミュニケーション（PECS）、感覚統合療法の3つを、それぞれ1日1時間、週5日、24週間受けた。全員が85％以上のセッションに出席し、平均出席率は88.3〜90.0％だった。評価は2026年1月の開始時、3か月後、6か月後に行い、60人全員が追跡を終えた。CARS-2の得点は施設群で46.77から41.70へ5.07下がり、家庭群は46.87から45.73へ1.13の低下にとどまった。6か月時点の調整後の差は3.95点だった。別の尺度ATECでも、施設群は13.33、家庭群は4.30の低下で、調整後の差は8.55で、年齢、性別、親の学歴を調整しても8.22だった。言葉・コミュニケーション、社会性、感覚・認知の領域は有意に改善したが、健康・身体・行動の領域では差がなかった。開始時の平均月齢は両群とも約68.7か月で、男児の割合は83.3％と80.0％だった。【ポイント・注意点】割り付けは無作為ではなく、筆頭著者が群を知ったうえでCARS-2を評価した。家庭群の評価は一部を保護者への聞き取りに頼っている。3つの手法を同時に行ったため、それぞれの効果は区別できず、標準的なCARS-2に適した子ども以外に当てはまるかも分からない。著者は因果関係は主張できないとし、評価者に群を伏せた無作為化試験が必要だとしている。","2026-11-24","Scienmag","https://scienmag.com/structured-institutional-therapy-linked-to-greater-autism-score-reductions-in-children/"],["日々のストレスが多い10〜12歳 体重や身長が低い傾向 メキシコ319人","メキシコ・ソノラ州の公立小学校4校で、2〜6年生319人の日常的なストレスと体格の関係を調べた研究が発表された。全体ではストレスが多いほど体重や身長などが低い弱い関連があり、とくに10〜12歳では、ストレス得点が1点上がるごとに体重が0.70kg、身長が0.39cm低いなど、8つの指標すべてで低い値と関連した。7〜9歳では関連はなかった。一時点の調査のため因果関係は分からない。","\n【概要】メキシコの研究チームが、小学生の日常的なストレスと成長の指標の関係を調べた横断研究を、学術誌Clinical Nutrition Open Scienceに発表した。対象はソノラ州シウダー・オブレゴンの公立小学校4校に通う2〜6年生319人で、年齢の中央値は9.0歳、女子が54.55％だった。調査は2025年9月から2026年4月に行われ、対象者は条件を満たす624人から登録された。【背景】ストレスは子どもの心だけでなく体にも影響する可能性がある。著者らは、ストレスホルモンである糖質コルチコイドが骨の成長や成長ホルモンの働きに影響するという仕組みを想定し、学童期のストレスと体格の関連を確かめようとした。【詳細】ストレスは25項目の子ども用日常ストレス尺度で測り、体格は生体電気インピーダンス法やWHOの基準による標準偏差スコアなどで評価した。対象の36.36％が過体重または肥満、38.24％が体脂肪過多だった。全体では、ストレスが多いほど体重、年齢相応の身長、上腕周囲長、脂肪量、除脂肪量が低いという、弱いが有意な逆の関連が見られた。ストレス得点の中央値は9だった。年齢別では7〜9歳で関連はなかった。一方10〜12歳では、性別と年齢を調整したうえで、ストレス得点が1点上がるごとに体重が0.70kg、身長が0.39cm、BMIが0.21、腹囲が0.65cm、脂肪量が0.37kg、除脂肪量が0.33kg低いなど、8つの指標すべてで低い値と関連した。この年齢層をストレスの多さで3つに分けると、身長の中央値は150.0cm、145.0cm、144.6cmと下がり、除脂肪量も32.6kgから29.2kgへ減った。学校ごとのまとまりを考慮して分析し直しても、結果は変わらなかった。【ポイント・注意点】一時点の調査のため因果関係は示せず、体重へのからかいが心の負担を生むといった逆向きの関係もありうる。食事、睡眠、運動、思春期の段階は記録しておらず、コルチゾールなどの生体指標も測っていないため、仕組みは仮説にとどまる。対象は1つの市の公立校に限られ、著者は長期追跡研究が必要だとしている。","2026-11-24","Scienmag","https://scienmag.com/daily-stress-linked-to-lower-growth-indicators-in-older-schoolchildren/"],["生殖補助医療で生まれた早産児 2歳までに成長の差が解消 1353人","生殖補助医療（ART）で妊娠し早産で生まれた赤ちゃんの成長を、自然妊娠の早産児と比べた中国の研究が発表された。2010〜2020年生まれの早産児1,353人を修正月齢24か月まで追ったところ、ARTで生まれた262人は出生時の体重や身長、頭囲が小さかったが、差は2歳までに縮まり有意でなくなった。健康上の問題や神経発達にも差はなく、著者は親への説明に役立つ安心材料だとしている。","\n【概要】中国の研究チームが、生殖補助医療（ART）で妊娠した早産児と、自然妊娠の早産児の成長を比べた後ろ向きコホート研究を、学術誌Reproductive Biology and Endocrinologyに発表した。2010〜2020年に生まれた早産児1,353人（ART262人、自然妊娠1,091人）を、出生から修正月齢24か月まで追跡した。対象の約2割がARTによる妊娠だった。【背景】体外受精などのARTで生まれた子どもが、早産だった場合に成長や発達で不利にならないかは、親にとって大きな関心事だ。記事によると、これまでの研究では、早産や多胎などの周産期の要因を十分に調整していないものが多かった。今回の研究は、周産期の要因を考慮したうえでART自体の影響を見極めることを目指した。【詳細】研究チームは、線形混合効果モデルによる成長曲線の解析、多変量回帰、そして差の要因を分けるオアハカ・ブラインダー分解などを用い、ARTの手技に関する条件と出生体重の関連も調べた。比べたのは、出生時から修正月齢24か月までの体格の推移である。出生時点では、ARTで生まれた早産児は体重、身長、頭囲、BMIがいずれも有意に小さかった。しかし差は成長とともに縮まり、修正月齢24か月では有意でなくなった。24か月までの健康上の問題の累積や神経発達の指標にも、両群で有意な差はなかった。分解の結果、出生時の差は主にART自体ではなく周産期の特徴によるもので、調整後は多胎妊娠が最大の要因だった。また、ARTの手技に関するどの条件も、出生体重と有意な関連はなかった。【ポイント・注意点】著者は結果を「親へのカウンセリングにとって安心できる証拠」とし、周産期管理の改善を続けることを支持するとしている。ARTで生まれた早産児の出生時の小ささは、ARTそのものより多胎などの周産期の条件で説明されるという見方だ。ただし研究は過去の記録を振り返る後ろ向きの設計で、記事では限界について詳しく触れられていない。また追跡は修正月齢24か月までで、それ以降の発達は今回の分析の対象外である。","2026-11-24","Scienmag","https://scienmag.com/preterm-infants-conceived-via-assisted-reproduction-catch-up-by-two-years/"],["素行障害の10代 睡眠の問題があると衝動的な攻撃が強まる 92人追跡","米バージニア・コモンウェルス大学の研究者が、素行障害と診断された13〜17歳の92人を12か月追跡した研究を発表した。実行機能の困難が大きい若者ほど1年後の攻撃性が高かったが、挑発に反応して起こる「反応的攻撃」との関連は、睡眠の問題を抱える若者にだけ見られた。計画的な「能動的攻撃」では睡眠による違いは見られなかった。睡眠を改善すれば攻撃性が変わるかは今後の検証課題だという。","\n【概要】米バージニア・コモンウェルス大学のジェシカ・ジェームズ氏とニコラス・トムソン氏が、素行障害のある若者で、実行機能の困難と攻撃性の関係が睡眠の問題によって変わるとする研究を、学術誌Frontiers in Child and Adolescent Psychiatryに発表した。対象は素行障害と診断された13〜17歳の92人で、64％が男性、平均年齢は15.74歳だった。【背景】素行障害は、攻撃的な行動やルール違反が続く状態を指す。攻撃性には、挑発や脅威に反応してかっとなる「反応的攻撃」と、目的のために計画的に行う「能動的攻撃」がある。計画や自己制御をつかさどる実行機能の弱さは攻撃性と関係するとされるが、どんな条件でその関係が強まるかは十分わかっていなかった。今回の研究は、睡眠の問題がこの関係を強めるかどうかに注目した。【詳細】研究は12か月の前向き追跡で、開始時の攻撃性、年齢、性別、民族を統制した階層的回帰分析を行い、実行機能と睡眠の問題の掛け合わせが攻撃性を左右するかを調べた。その結果、実行機能の困難が大きいほど、12か月後の反応的攻撃と能動的攻撃がともに高かった。さらに反応的攻撃については、睡眠の問題が関係を有意に左右し、実行機能の困難が反応的攻撃を予測したのは睡眠の問題がある若者だけだった。睡眠の問題がない若者では、この関連は見られなかった。一方、能動的攻撃では睡眠との掛け合わせは有意でなく、睡眠の有無にかかわらず実行機能の困難と関連していた。攻撃性の型によって、睡眠の問題が関わるかどうかが異なるという結果だ。【ポイント・注意点】著者は、睡眠の問題を、素行障害の若者が反応的攻撃に陥りやすくなる重要な背景要因と位置づけ、心身と社会の両面から自己調整を捉える枠組みで説明している。ただし記事には効果量や検定値、使った尺度、睡眠の問題を抱えた人数は示されていない。対象は92人と比較的少数で、男性が多い集団である。睡眠を改善すれば攻撃性が変わるのかは、今後の研究で確かめる必要があると著者は述べている。","2026-11-24","Scienmag","https://scienmag.com/sleep-problems-moderate-executive-functioning-link-to-reactive-aggression-in-adolescents-with-conduct-disorder/"],["脳が原因の視覚障害の子 コリン補給後に視力改善 25人で確認","イタリアの研究チームが、脳が原因の視覚障害（CVI）が疑われる子ども70人の特徴と、うち4〜12歳の25人にコリンを4か月補給した後の視力の変化を報告した。視力の指標（logMAR）は0.315から0.199へ改善し、補給をやめた4か月後も開始時より良い状態が保たれた。ただ比較対照群がなく、ビタミンや遮眼訓練などの影響と区別できないため、著者は探索的な結果だとしている。","\n【概要】イタリア・トリエステの母子保健研究所「ブルロ・ガロフォロ」などの研究チームが、脳性視覚障害（CVI）の子どもの特徴と、コリンの補給後の視力の変化を調べた前向き研究を、学術誌Frontiers in Pediatricsに発表した。2024年4月から2026年3月に、CVIが疑われる生後18か月〜18歳の子ども70人を登録した。研究にはトリエステ大学やコネリアーノのIRCCS E. Medeaも参加し、ブルロ・ガロフォロの眼科部門で行われた。【背景】CVIは、目そのものではなく、見た情報を処理する脳の働きの障害によって起こる視覚障害だ。研究チームは、子どもたちの原因や目の状態を整理するとともに、栄養素のコリンを補給した後に視力がどう変わるかを調べた。【詳細】70人の平均年齢は6.6歳で、男児44人、女児26人だった。原因は遺伝性が48.6％、周産期の要因が31.4％を占めた。屈折異常が74.3％、斜視が62.9％、眼振などの眼球運動の問題が37.1％に見られ、脳のMRIでは82.9％に異常があった。このうち4〜12歳の25人には、コリン205mgを含む酒石酸水素コリン500mgを、ビタミンB6、B12、Cとともに毎日4か月服用してもらった。あわせて1日2時間の交互の遮眼とタブレットでの視覚刺激も行った。矯正視力（logMAR、値が小さいほど良い）は0.315から4か月後に0.199へ改善し、補給をやめて4か月後も0.230と開始時より良かったが、一部は戻っていた。4か月時点で50眼中44眼、最終確認時に39眼が改善しており、年齢による違いは見られなかった。解析には線形混合効果モデルを用い、見え方の良い目と悪い目で改善の程度は同様だった。【ポイント・注意点】治療を受けない比較群がないため、コリンの効果を、ビタミンや遮眼、視覚刺激、検査の慣れ、自然な発達と切り分けられない。対象は専門病院の少人数で、視力検査の方法も子どもによって異なった。著者は結果を探索的な関連にとどまるとし、コリンの役割や量、期間を確かめるより大きな対照試験が必要だとしている。","2026-11-24","Frontiers in Pediatrics","https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2026.1988036/full"],["いじめる子もいじめられる子も ネットの問題使用と関連 小学生924人","中国・湖南省の研究チームが、小学4〜6年生924人を対象に、いじめの被害・加害とインターネットの問題的な使い方との関係を調べた。被害と加害を同時に分析しても、両方とも問題的使用と関連し、その強さに有意な差はなかった。どちらの場合も、他人に向けた「受動的攻撃性」を通じた小さな間接的な関連が見られた。周囲の支えを通じた経路は被害を受けた子にだけ見られた。一時点の調査で、因果の向きは分からない。","\n【概要】中国の湖南第一師範学院などの研究チームが、いじめの被害と加害が、子どものインターネットの問題的な使い方とどう結びつくかを調べた横断研究を、学術誌Frontiers in Psychologyに発表した。公立小学校2校の4〜6年生から集めた950件の質問票のうち、有効な924件（有効回答率97.3％）を分析した。男子は56.2％で、学年は4年生が59.0％、5年生が30.7％、6年生が10.3％だった。【背景】いじめは被害を受けた子だけでなく、加害をした子にも影響しうる。研究チームは、被害と加害を同時に分析し、どんな心理的な経路でネットの問題的使用につながるのか、両者で経路が違うのかを比べようとした。人生の意味を感じることや周囲の支えが、どのように関わるかにも注目した。被害と加害という2つの立場を同時に分析した点が、この研究の特徴だ。【詳細】ネットの問題的使用はヤングのインターネット依存テストで測った。いじめの被害と加害を同時にモデルに入れ、他人に向けた受動的攻撃性（不満を直接ぶつけず、遠回しに表す攻撃）を第1の媒介要因、人生の意味と周囲からの支えを第2の媒介要因とする経路モデルで分析した。互いの影響を調整しても、被害（β＝0.162）と加害（β＝0.264）はいずれも問題的使用と関連し、両者に有意な差はなかった。受動的攻撃性を通じた小さいが有意な間接効果が、被害（β＝0.022）でも加害（β＝0.017）でも見られた。周囲の支えだけを通る間接効果は被害にだけ見られ、これが両者の唯一の違いだった。問題的使用との相関は、被害0.31、加害0.37、受動的攻撃性0.26で、人生の意味（−0.28）と周囲の支え（−0.25）は逆向きだった。【ポイント・注意点】要因の順番を入れ替えたモデルも同程度にデータに合ったため、因果の向きは判断できない。一時点の自己申告の調査で、学級内のまとまりも考慮しておらず、間接効果は小さく、対象は2校の便宜的な標本に限られる。著者は、受動的攻撃性が今後の長期研究や支援の対象になりうるとしている。","2026-11-24","Frontiers in Psychology","https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2026.1935251/full"],["よく体を動かす10代はボランティアに参加しやすい 米国3.5万人分析","米国の全国子ども健康調査（2022〜2023年）のデータで、12〜17歳の身体活動とボランティア活動の関係を分析した研究が発表された。週に体を動かす日が1日増えるごとにボランティア参加が約2.65ポイント高く、その18.0％は心の充実感や仲間関係を通じた関連だった。ただ週4日以上では差が頭打ちになった。保護者の回答に基づく一時点の調査で、運動を増やせば参加が増えるとまでは言えない。","\n【概要】中国・洛陽理工学院のワン・ホンガン氏が、米国の全国子ども健康調査（2022〜2023年）を使い、10代の身体活動と、人を助ける向社会的行動の一つであるボランティア活動との関係を分析した研究を、学術誌Frontiers in Psychologyに発表した。対象は12〜17歳で、欠けたデータのない34,939人、補完を行った解析では37,425人だった。平均年齢は14.48歳、女子は48.7％だった。既存の全国調査のデータを使った二次分析である。【背景】運動やスポーツは体力だけでなく、責任感や他者への配慮を育てるとも考えられてきた。研究は、体育を通じて個人と社会への責任を教える考え方（TPSR）を参考に、身体活動がどんな経路で向社会的行動につながるかを調べようとした。とくに心の充実感や仲間関係が、その間をつなぐ役割を果たすかに注目した。【詳細】1週間に体を動かした日数を説明変数、過去12か月のボランティア参加（全体の42.5％）を結果とし、心の充実感（フラーリッシング）と仲間関係の質を媒介要因とした。測定はすべて保護者の回答によるもので、分析には調査の重み付けと多重補完を用いた。分析の結果、運動する日が1日増えるごとに、ボランティア参加は約2.65ポイント高かった。このうち18.0％が媒介要因を通じたもので、心の充実感が14.7％、仲間関係が2.3％、両者を順に通る経路が1.1％だった。運動しない子に比べ、週1〜3日は13.0ポイント、4〜6日は20.3ポイント、毎日は20.0ポイント高く、著者は着実な増加ではなく頭打ちだと述べている。スポーツチームへの参加は18.5ポイントと、より大きな関連を示した。【ポイント・注意点】一時点の調査で、保護者が答えた限られた指標を使っており、心の充実感も3項目だけで測っている。また測っていない要因の影響も否定できない。題名にあるTPSRの理論自体は実際には検証されていない。著者は、この結果は運動を増やせばボランティアが増えることを示すものではないとしている。","2026-11-24","Frontiers in Psychology","https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2026.2004057/full"],["高校時代の喫煙や薬物使用 大人になってからの早い死亡と関連 10万人超","米ミシガン大学の研究チームが、1976〜2019年に高校3年生だった米国人107,346人を大人になるまで追跡し、高校時代の物質使用と死亡の関係を調べた。2026年3月までに3,773人が亡くなっていた。複数の物質を同時に分析すると、早く亡くなるリスクは喫煙で36％、その他の薬物で28％、大麻で14％高かった。過度の飲酒は、ほかの物質使用を考慮すると有意な関連が消えた。","\n【概要】米ミシガン大学社会調査研究所の研究チームが、高校時代の喫煙や大麻、その他の薬物の使用が、大人になってからの早い死亡と関連するとの研究を、学術誌American Journal of Public Healthに発表した。全国を代表する長期調査「モニタリング・ザ・フューチャー」の追跡パネルで、1976〜2019年に高校3年生として調査を受けた107,346人を分析した。共著者はジョイ・ボヒョン・ジャン氏、ナンシー・フライシャー氏、リチャード・ミーチ氏である。【背景】10代の物質使用に関する研究の多くは、数年間しか参加者を追跡していない。研究を率いたミーガン・パトリック氏は、大規模で代表性のある集団を長く追ったことで、高校での行動が生涯にわたる結果とどう関係するかを見られる点がこの研究の特徴だとしている。【詳細】2026年3月までに3,773人、全体の約3.5％（約29人に1人）が亡くなっていた。18歳の時点で物質を使っていた若者は、使っていなかった同級生に比べて亡くなりやすく、亡くなった年齢も若かった。データは全国を代表するもので、複数の行動をあわせて分析できる。研究チームはそれぞれの物質を単独で分析したあと、すべてを同時に分析した。単独では関連がより強く見えたが、重なり合う使用を分けると差は縮まった。共変量を調整し、すべての物質を一つのモデルに入れた分析では、早く亡くなるリスクが、喫煙で36％、その他の薬物の使用で28％、大麻の使用で14％高かった。過度の飲酒は、調整前の分析では早い死亡と関連したが、ほかの物質使用を考慮すると有意ではなくなった。【ポイント・注意点】10代では複数の物質の使用が大きく重なっており、今回の結果は関連を示すもので、仕組みは今後の研究で明らかにする必要がある。パトリック氏は物質使用を「広い影響をもちうるリスクの指標」と表現し、すでに使っている若者への介入が長期的な健康を支えうると述べた。研究は、10代の物質使用のスクリーニング、予防、介入を後押しする結果だとしている。","2026-11-24","News-Medical","https://www.news-medical.net/news/20261124/Five-decade-study-tracks-adolescent-substance-use-into-early-adult-mortality.aspx"],["中学生のストレス指標を機械学習で予測 学業の失敗回避が鍵 83人","ドイツ・グライフスバルト大学の研究者が、7〜8年生83人を対象に、心理や学校生活に関する最大59の要因から、4種類のストレスの生体指標を機械学習で予測できるか調べた。唾液のαアミラーゼとテロメアの長さは基準のモデルより正確に予測でき、αアミラーゼで最も重要な要因は「学業の失敗を避けたい気持ち」だった。コルチゾールなどは予測できず、著者は探索的な結果だとしている。","\n【概要】ドイツ・グライフスバルト大学のヨンネ・ロヒラハティ氏とフランシス・ホーフェリヒター氏が、中等学校の生徒のストレスの生体指標を、心理的・社会的な要因から機械学習で予測しようとした研究を、学術誌Frontiers in Psychologyに発表した。対象はドイツ北東部の7〜8年生83人（平均13.72歳、女子48％）で、733人の調査参加者から無作為に選ばれた。【背景】思春期の生徒は学業や人間関係など多くのストレスにさらされる。ストレスは体内の指標にも表れるとされるが、どの心理的・社会的な要因がどの指標と結びつくかは、はっきりしていない。研究は、体の4つの指標それぞれについて予測の手がかりを探った。【詳細】幸福感、周囲の支え、学習意欲、いじめ、孤独感、テクノロジーの使用など最大59の要因を使い、コルチゾール、唾液αアミラーゼ、尿中の酸化ストレス指標、テロメアの長さの4つを予測した。ラッソ回帰とランダムフォレストの2種類のモデルを基準のモデルと比べ、10分割交差検証を100回繰り返して評価し、多重比較はホルム法で補正した。その結果、ランダムフォレストは唾液αアミラーゼを基準より正確に予測し、誤差（RMSE）は0.848から0.795へ6.3％減った。最も重要な要因は学業の失敗を避けたいという気持ちだった。ラッソはテロメアの長さを基準より正確に予測し、誤差は0.191から0.162へ15.2％減った。上位の学校コースに通う生徒はテロメアがやや短かった。コルチゾールと酸化ストレスは、どちらのモデルも基準を上回れなかった。要因を絞ると、αアミラーゼのモデルは精度を保ったが補正後は有意でなくなり、テロメアのモデルは基準を上回らなくなった。【ポイント・注意点】要因の数に比べて対象が少なく、一時点の調査で、試料採取の時刻は自己申告、尿の値の補正もなく、思春期の段階も考慮していない。尺度の信頼性の基準をゆるく設定した点も限界に挙げられている。著者は結果を探索的なものとし、個人のスクリーニングには使えないとしている。","2026-11-24","Frontiers in Psychology","https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2026.2006169/full"],["肥満の小学生に地中海食と運動 2年でインスリン抵抗性などが改善","スペイン・マラガの研究チームが、代謝的には健康な肥満の思春期前の子ども144人に、カロリー制限なしで地中海食と身体活動を組み合わせたプログラムを24か月行った。BMIの標準偏差スコアは2.61から1.92に下がり、インスリン抵抗性の指標や炎症の指標も改善した。一方、頸動脈の壁の厚さは全体では変わらなかった。対照群がなく、2年後まで残ったのは75人と脱落も多かった。","\n【概要】スペインのマラガ大学やセビリア大学などの研究チームが、地中海食の実践と心臓・代謝の指標の関係を、肥満の思春期前の子どもで調べた研究を、学術誌Frontiers in Pediatricsに発表した。949人をスクリーニングし、代謝的には健康な肥満の子ども144人（男児75人、女児69人、平均7.8歳）が参加した。【背景】血液検査などにまだ異常が出ていない「代謝的に健康な肥満」の段階の子どもに対し、食事と運動の取り組みが体格や血液の指標、血管にどんな変化をもたらすかを調べた。【詳細】研究は対照群のない24か月の単群試験で、子ども自身を比較の基準とした。プログラムはカロリー制限をせず、地中海食と身体活動を組み合わせた。参加者は12か月で100人、24か月で75人に減り、脱落率は48％で、計画した最低人数の110人を下回った。BMIの標準偏差スコアは2.61から1.92へ下がった。体重は45.79kgから57.47kgに増えたが、著者は主に成長によるものとしている。除脂肪量は26.96kgから34.09kgに増え、体脂肪率は12か月で40.38％から37.99％に下がったあと、24か月で39.40％に戻った。地中海食の得点は7.04から9.29に上がり、エネルギー摂取量は1日2,180kcalから1,945kcalに減り、中程度の運動は1日15.15分から26.44分に、激しい運動は1.16分から7.81分に増えた。インスリン抵抗性の指標（HOMA-IR）は4.31から3.06に、LDLコレステロールは94.16から86.08mg/dLに下がり、炎症の指標であるIL-6やhs-CRPも下がった。頸動脈の壁の厚さは全体では有意に変わらず、開始時に軽い異常があった子でのみ正常化した。【ポイント・注意点】対照群がない単一施設の研究で、脱落が多く、食事や活動の一部は自己申告だった。座って過ごす時間も1日103.16分から354.97分に増えていた。対象は代謝的に健康な肥満の思春期前の子どもに限られ、DNAのメチル化は肝臓や脂肪ではなく血液細胞で測ったものである。","2026-11-24","Frontiers in Pediatrics","https://www.frontiersin.org/journals/pediatrics/articles/10.3389/fped.2026.1998174/full"],["自閉症の子の繰り返し行動 自分を落ち着かせる役割の可能性 フィンランド","フィンランド・タンペレ大学の研究チームが、3〜6歳の自閉症の子どもを2年間追跡し、呼吸に合わせた心拍の揺らぎ（RSA）を、発達の遅れのある子や定型発達の子と比べた。幼児期の自閉症の子はRSAが低かったが、2年で他の子に近づいた。また繰り返し行動と自律神経の関係は自閉症の子で異なり、一部の子では行動が自己調整を助けている可能性があるという。研究者は、行動の量ではなく、その役割に目を向けるべきだとしている。","\n【概要】フィンランド・タンペレ大学の自閉症・神経発達研究グループが、自閉症の子どもの繰り返し行動が、一部の子では自分を落ち着かせる助けになっている可能性があるとする研究を、学術誌American Journal on Intellectual and Developmental Disabilitiesに発表した。ヤンニ・ラウッティア氏らの論文で、グループを率いるアンネリ・キュリアイネン准教授がコメントしている。【背景】自閉症の特徴の一つである限定的・反復的な行動は、これまで主に症状として扱われてきた。研究チームは、呼吸に合わせて心拍が自然に揺らぐ「呼吸性洞性不整脈（RSA）」に注目した。RSAは自己調整や社会的な関わりと関係するとされる。同じ行動が、子どもによって異なる役割を果たしている可能性を探るため、体の反応に着目した。【詳細】研究は、3〜6歳の自閉症の子どもを2年間追跡し、自閉症ではない発達の遅れのある子どもと、定型発達の子どもの2つの群と比べた。心拍は、画面の画像や動画を見ながら脳波を測る間に記録した。自閉症の子どもを、定型発達の子と、同じくらいの認知発達水準で自閉症ではない子の両方と比べた長期研究は、これが初期のものの一つだという。比較の対象に発達の遅れがある子どもを含めたことで、発達水準の違いを考慮できる点が特徴だ。幼児期の自閉症の子はRSAが両群より低かったが、2年の間に上昇し、他の子の水準に近づいた。著者らは、根本的に異なる仕組みというより発達の遅れを反映している可能性があるとしている。さらに、繰り返し行動と自律神経の働きとの関係は、自閉症の子と、自閉症のない知的障害の子で違っていた。【ポイント・注意点】キュリアイネン氏は、同じ行動でも子どもによって役割が違い、重要なのは行動の量ではなく、その子のその場面で行動が何の役に立っているかだと述べた。著者は行動の目的や意味に目を向ける「ニューロアファーマティブ」な考え方を支持するとしつつ、言葉や生活技能の支援が不要という意味ではないと強調する。記事には対象人数や数値、限界は示されていない。","2026-11-23","Medical Xpress","https://medicalxpress.com/news/2026-11-autism-repetitive-behavior-child.html"],["自閉症の女子 学校の長期欠席が最も多い 英イングランドの全国データ","英サウサンプトン大学の研究チームが、2016/17年度から2022/23年度のイングランドの公立普通校の出席記録を分析し、自閉症の女子生徒が特に学校を長く休みやすいことを示した。授業の10％超を欠席する「持続的欠席」は、中等学校で自閉症の女子が約45％に達し、自閉症の男子の約30％を上回った。研究者は、欠席を意欲の欠如ではなく苦痛への反応と捉えるべきだとしている。","\n【概要】英サウサンプトン大学の研究チームが、自閉症の女子生徒が学校の持続的な欠席に最もなりやすいとする研究を、学術誌Autismに発表した。研究を主導したのは大学院生のクロエ・エディ氏で、ハンナ・コフショフ教授が責任著者、サラ・パーソンズ教授が共著者を務めた。エディ氏は同大学の自閉症コミュニティ研究ネットワークに所属している。【背景】学校を長く休む子どもの問題は、英国で社会的な関心を集めている。エディ氏によれば、今回の結果は、自閉症の女子が持続的欠席の特有のリスクを抱えていることを示す初めての全国規模の証拠だという。【詳細】研究チームは、2016/17年度から2022/23年度のイングランドの公立普通校に通う全小中学生の年間出席記録を分析した。各年度のデータは約500万〜600万人分にのぼる。授業の10％を超えて欠席した場合を持続的欠席とした。小学校では、自閉症の女子の持続的欠席は2021/22年度に30％でピークに達した。同じ年、自閉症の男子は26％、特別な教育的支援の記録がない子は15％だった。中等学校ではすべての群で割合が上がり、新型コロナウイルスの流行後に急増した。自閉症の女子は約45％、自閉症の男子は約30％、支援の記録がない女子は約25％、男子は約20％に達した。エディ氏は、この傾向が女子の学校生活のなぜ早い段階で現れるのか、学校がどうすればより早く手を打てるのかを理解する必要があると強調した。【ポイント・注意点】コフショフ教授は、数字は話の一部にすぎないとし、感覚や人間関係、学校の制度などの負担が積み重なると説明する。欠席は意欲の欠如ではなく、安心や支え、居場所を感じられないことによる苦痛への反応だという。パーソンズ教授は、出席の管理を超えて、早めの介入や、自閉症の若者とともにつくる学校環境が必要だと述べた。研究者は、出席データだけでは傾向の理由は説明できないとしている。記事は、短編映画『Unauthorised Absence』など、この問題への全国的な関心の高まりにも触れている。","2026-11-23","Medical Xpress","https://medicalxpress.com/news/2026-11-autistic-girls-greatest-persistent-absence.html"],["家で大人が喫煙・電子たばこ 10代の飲酒や大麻使用も多く 6万人分析","米フィラデルフィア小児病院の研究チームが、10代60,069人の電子カルテを分析し、家庭内の大人の喫煙や電子たばこの使用と、子どもの物質使用の関係を調べた。親とほかの大人の両方が使う家庭では10代のたばこ・ニコチン使用が23.5％で、誰も使わない家庭の2.0％を大きく上回った。親が電子たばこだけを使う場合も、子の使用リスクは低くなかった。一時点の調査で、因果関係は示せない。","\n【概要】米フィラデルフィア小児病院（CHOP）の研究チームが、家庭で大人がたばこや電子たばこを使っていると、10代の子どもがたばこだけでなく飲酒や大麻なども使う割合が高いとする研究を、学術誌Pediatricsに発表した。対象は10代の60,069人だった。筆頭著者はCHOPとペンシルベニア大学ペレルマン医学部に所属するブライアン・ジェンセン医師である。【背景】これまでの研究で、親のたばこや電子たばこの使用は、子どもが同じ製品を使うことを予測すると分かっていた。今回は、飲酒や大麻、その他の薬物、さらに検証済みの尺度で測る高リスクの使用まで範囲を広げて調べた。【詳細】研究は横断研究で、2025年1月から2026年5月のCHOPの診療網での定期受診の電子カルテを結びつけた。保護者のたばこに関する質問への回答と、10代の子どもの秘密が守られる健康質問票の回答を用いた。10代のたばこ・ニコチン使用は、親とほかの大人の両方が使う家庭で23.5％、親だけが使う家庭で13.5％、ほかの大人だけが使う家庭で11.8％、誰も使わない家庭で2.0％だった。飲酒や大麻なども同じ傾向だった。年齢や性別、保険、地域の機会を調整すると、親とほかの大人の両方が使う家庭の10代は、高リスクの物質使用と判定されるオッズが約15倍だった。誰も使わない家庭と比べると、親が電子たばこだけを使う場合の子のたばこ・ニコチン使用のオッズは5.6倍で、紙巻きたばこだけの2.6倍より高かった。親の電子たばこが低リスクの選択肢とは言えず、この傾向は多くの物質で同様だった。【ポイント・注意点】一時点のデータのため、家庭の使用が子の物質使用を引き起こすとは言えず、家族や環境の共通の要因も関わりうる。ジェンセン医師は、家庭のたばこ使用は親の健康だけの問題ではなく小児科医が対処できるリスク要因で、親の受診のたびに家族全体を守る機会があると述べた。この仕組みはCHOPの31の診療所などで使われ、親が陽性なら禁煙支援と子への予防指導につなげられる。","2026-11-23","Medical Xpress","https://medicalxpress.com/news/2026-11-teens-tobacco-alcohol-marijuana-adults.html"],["ADHDの子 認知の特徴で3タイプに分類 北京の526人を解析","中国・北京の首都医科大学の研究チームが、ADHDと診断された子ども526人のゲーム形式の認知テストの結果を分析し、認知の特徴によって3つのタイプに分けられることを示した。実行機能・抑制の弱さが目立つ群が約4割、注意・空間認知の弱さが目立つ群が約27％、比較的保たれている群が約33％だった。保護者による症状の評価はタイプ間で違わなかった。著者は探索的な分類だとしている。","\n【概要】中国・北京の首都医科大学附属の首都児童保健センターの研究チームが、ADHDの子どもを認知の特徴で3つのタイプに分けられるとする研究を、学術誌BMC Psychiatryに発表した。DSM-5の基準を満たす子ども569人のうち、検査に十分取り組めなかった43人を除く526人を分析した。平均年齢は8.54歳で、74.3％が男児だった。【背景】ADHDは不注意や多動性・衝動性を特徴とするが、どの認知機能が弱いかは子どもによって異なりうる。研究チームは、症状の評価だけでは見えにくい違いを、デジタルの認知テストで捉えようとした。症状の重さではなく、認知の得意・不得意の組み合わせでグループを探った点が特徴だ。【詳細】研究は過去の記録を使った横断研究で、6つの領域を測るゲーム形式の小児認知能力テストの結果を用いた。平均得点は持続的注意が79.18、葛藤の抑制が100.72、総合が91.02だった。女児は持続的注意や集中した注意、総合得点で高く、年齢との相関は小さかった。k平均法でグループ分けし、ブートストラップ法で安定性を確かめたところ、2群に分けると成績の良し悪しで分かれるだけだったため、著者は3群を採用した。実行機能・抑制の弱さが目立つ群は210人（39.92％）で、葛藤の抑制が平均より0.72標準偏差低かった。注意・空間認知の弱さが目立つ群は140人（26.62％）で、年齢が低く女児が少なかった。比較的保たれている群は176人（33.46％）だった。保護者によるSNAP-IVの評価（439人分）や、併存症（11.4％）、服薬（4.6％）の割合はタイプ間で差がなかった。タイプ間の効果量は0.20〜0.43だった。【ポイント・注意点】保護者の評価では区別されない認知の違いが、テストで見えた点が特徴だ。ただし著者は、これらのタイプは探索的なもので、確立した臨床的な下位分類ではないとしている。生体指標や脳画像、長期のデータはなく、併存症は保護者の申告による。著者は多施設での前向き研究が必要だとしている。","2026-11-23","Bioengineer.org","https://bioengineer.org/digital-cognitive-tasks-reveal-three-distinct-neurocognitive-profiles-in-children-with-adhd/"],["産後の母の精神科入院 先住民の子の防げる入院が24％増 豪州5.9万人","豪メンジーズ保健研究所の研究チームが、オーストラリア北部準州で2002〜2017年に生まれた子ども59,159人のデータを分析した。出産後1年以内に母親が精神科に入院した場合、アボリジニの子どもは、本来防げる病気での入院のリスクが24％高く、初めての入院も約2.8か月早かった。非アボリジニの子どもでは有意な関連はなかった。著者はアボリジニ主導の家族支援を求めている。","\n【概要】オーストラリアのメンジーズ保健研究所の研究チームが、出産後の母親の精神科入院が、アボリジニの子どもの予防可能な入院の増加と関連するとの研究を、学術誌Archives of Women's Mental Healthに発表した。北部準州の16年分の行政データをつないだ、住民全体の後ろ向きコホート研究だ。【背景】適切な医療や予防で本来避けられるはずの入院は、子どもの健康と医療へのアクセスを映す指標となる。研究チームは、出産後の母親の心の健康の問題が、幼い子どものこうした入院とどう関係するかを、アボリジニとそれ以外の家庭で比べた。【詳細】対象は2002〜2017年に生まれた子ども59,159人で、生後12か月から60か月まで追跡し、オーバーラップ重み付けを用いた多層ワイブルモデルで分析した。出産後1年以内に母親が精神科に入院した子どもは全体の1.24％で、アボリジニの母親の子ども20,718人では1.96％、非アボリジニの母親の子ども38,441人では0.85％だった。全体（ハザード比1.12）と非アボリジニの子ども（同0.73）では有意な関連はなかった。一方、アボリジニの子どもでは、予防可能な入院のリスクが24％高く（調整ハザード比1.24）、初めての入院は約2.8か月早かった（中央値16.4か月対19.2か月）。1,000人月あたりの粗い発生率は11.85対8.94だった。主な原因は、アボリジニの子どもでは胃腸炎と皮膚感染症、非アボリジニの子どもでは胃腸炎とぜんそくだった。【ポイント・注意点】母親の精神科入院は多様な診断をまとめた「あり・なし」の指標で、生後1年以内の子どもの入院は除外されている。遠隔地の母親は精神科入院を利用できなかった可能性もある。E値は1.79で、中程度に強い未測定の要因で結果が説明されうる。人口寄与割合は0.55％で、非アボリジニの子どもの分析は検出力が足りなかった可能性もある。著者は、トラウマに配慮したアボリジニ主導の家族支援と、構造的な投資を組み合わせることを求めている。","2026-11-23","Scienmag","https://scienmag.com/postnatal-maternal-mental-health-admissions-linked-to-preventable-hospitalisations-in-aboriginal-children/"],["小学生の発想の固定化を防ぐ授業法 設計理論で独創性が向上","8〜11歳の小学生を対象に、創作文のワークショップで創造性を伸ばす方法を比べた研究が発表された。「概念‐知識（C-K）設計理論」に基づく方法を使った群だけが、ありきたりな発想を減らしつつ独創的なアイデアを有意に増やした。例を示された群はアイデアの数が倍以上に増えたが、増えたのは型にはまった発想だった。研究は公立小学校1校だけで行われ、著者は再現研究が必要だとしている。","\n【概要】カマルダ氏らの研究チームが、小学生の創造性の授業で、設計理論に基づく方法が発想の固定化を抑え、独創的なアイデアを増やすとの研究を、学術誌Design Scienceの第12巻に発表した。公立小学校1校の5つの学級で、8〜11歳の子どもを対象に5週間の介入を行い、子どもたちは学級ごとに4つの条件に分かれた。【背景】人は一度思いついた考えや、示された例に引きずられて、似た発想ばかりしてしまうことがある。これを「認知的固定」と呼ぶ。研究チームは、授業でよく使われるブレインストーミングや例の提示と、設計理論に基づく方法を比べ、どれが子どもの独創性を高めるかを調べた。【詳細】子どもたちは週1回90分の創作文のワークショップを4回受けた。条件は、型にはまった例を示す群（25人）、発想を広げる例を示す群（26人）、ブレインストーミング群（20人）、概念‐知識（C-K）設計理論に基づく群（49人）の4つだった。記事では参加者を123人としているが、各群を足すと120人になる。評価は、アイデアの数（流暢さ）、種類の幅（柔軟性）、独創性の3つの観点で行った。例を示された2つの群は、アイデアの数が2倍以上に増えたが、増えたのはすべて型にはまった発想で、アイデアの種類の幅は狭まった。設計理論の群はアイデアの幅がブレインストーミング群と同じ水準まで広がった。型にはまった発想を減らしながら独創的な発想を有意に増やしたのは、設計理論の群だけだった。ブレインストーミング群は主にありきたりな発想を生み、独創性の面では設計理論の群に及ばなかった。卵を落としても割れないようにする課題でも、設計理論の群で独創的な解決策が増える傾向が見られ、著者は近い課題への転移の予備的な証拠としている。【ポイント・注意点】研究は1校のみで、ブレインストーミング群は1学級だけ、発想を広げる例の群は年齢が低かった。授業は普段の教員ではなく専門の進行役が行い、時間をおいた追跡もない。例を示すだけでは独創性は伸びにくいことを示唆する結果だが、著者は再現研究が必要だとしている。","2026-11-23","Scienmag","https://scienmag.com/design-theory-method-curbs-cognitive-fixation-and-expands-classroom-creativity-in-schoolchildren/"],["発達に特性のある子のダンス教室 自信や仲間との関わりを後押し","自閉症やダウン症、ADHDなどのある6〜10歳の子ども向けに、バレエ学校で行われたインクルーシブな創作ダンスのプログラムについて、保護者の受け止めを調べた研究が発表された。保護者は、子どもの自信や自立、自分の思いを伝える力の向上、バランスや持久力の改善、自分から仲間に関わる姿などを挙げた。家族の孤立感がやわらいだという声もあった。保護者6人への聞き取りなどに基づく小規模な質的研究だ。","\n【概要】ケナー氏、ヒバート氏、フォークナー氏が、神経発達に特性のある子ども向けのインクルーシブな創作ダンスのプログラムについて、保護者の視点から調べた質的研究を、学術誌American Journal of Dance Therapyに発表した。プログラムは一流のバレエ学校で、週1回1時間、10週間にわたって行われた。論文は同誌の第48巻第2号に掲載された。【背景】自閉症やダウン症、ADHDなどのある子どもは、地域の習い事や活動に参加しにくいことがある。研究は、子どもを取り巻く家庭や地域などの環境を重層的に捉えるブロンフェンブレンナーの生態学的システム理論を枠組みに、保護者の経験を整理した。分析には、語りから共通のテーマを見いだすブラウンとクラークのテーマ分析の手法を用いた。【詳細】対象は、自閉症、ダウン症、ADHDなどのある6〜10歳の子どもが参加したプログラムで、8人の子どもについての保護者6人への聞き取りと、2回のフォーカスグループを行った。参加した子どもには、自閉症、ダウン症、ADHDのほかにも、さまざまな特性のある子が含まれていた。保護者は参加の壁として、柔軟性に欠ける地域のプログラム、費用、送迎などの負担を挙げ、ほかの活動での嫌な経験も語った。親たちに共通した願いは、子どもが楽しみ、居場所を感じることだった。参加の効果としては、自信、自立心、自分の思いを伝える力の向上が挙げられた。体の面ではバランスや持久力の改善が報告された。家で自然に踊り出す、自分から仲間に声をかけて関わるといった日常の変化も語られ、家族の孤立感がやわらいだという声もあった。【ポイント・注意点】特性のある子どもの参加には、費用や柔軟性などの壁があり、受け入れる側の工夫が重要であることを示す報告だ。ただし調べたのは保護者の受け止めだけで、子ども本人の声や客観的な測定はない。研究者自身がカリキュラムをつくり、指導もしていた。プログラムは短期間で、対象は1つのプログラムの少人数に限られるため、結果を一般化するには注意が必要だ。","2026-11-23","Scienmag","https://scienmag.com/inclusive-creative-movement-supports-everyday-confidence-and-participation-for-neurodivergent-children/"],["マインドフルな子育てと祖父母の支え 幼児の感情の力と関連 中国4020人","中国8省の幼稚園40園の養育者4,020人を対象に、子育てのあり方と幼児の感情の力（感情コンピテンス）の関係を調べた研究が発表された。子どもの年齢、祖父母の支え、マインドフルな子育て、親の関与が感情の力と正の関連を示し、親の抑うつや子どもの引っ込み思案は負の関連を示した。親がスマホに気を取られる「ファビング」は有意ではなかった。一時点の調査で、因果関係は分からない。","\n【概要】中国のワン氏、ワン氏、ジョウ氏、ウー氏の研究チームが、マインドフルな子育てや祖父母の支えが、幼児の感情を理解し調整する力と関連するとの研究を、学術誌Psicologia: Reflexão e Críticaに発表した。中国8省の幼稚園40園の主な養育者4,020人に調査を行い、その後20人の親に聞き取りをする、説明的順次型の混合研究法を用いた。論文は同誌の第39巻に掲載された。【背景】幼児期に育つ感情の力は、子どもの発達にとって重要な要素の一つだ。研究チームは、親の子育てのあり方や祖父母の支え、親の心の状態などが、幼児の感情の力とどう結びつくかを、量的な調査と聞き取りの両面から調べた。親がスマートフォンなどに気を取られて子どもをないがしろにする「ファビング」の影響も対象とした。【詳細】回答した養育者の80.52％は母親または女性の保護者で、子どもの平均月齢は53.62か月だった。最終的な回帰モデルは、感情の力のばらつきの18.9％を説明した。つまり差の多くは、今回のモデルの要因では説明されていない。子どもの年齢、祖父母の支え、マインドフルな子育て、親の関与は正の関連を示した。一方、親の性別、子どもの性別、親の抑うつ、子どもの社会的な引っ込み思案は負の関連を示した。社会経済的地位、夫婦関係の満足度、親がスマホに気を取られる「ファビング」は有意ではなかった。18の変数のネットワーク分析では、家庭での関与、マインドフルなしつけ、祖父母の支えが、子育ての要因群と子どもの結果の要因群をつなぐ最も強い要素だった。聞き取りでは、親の疲れや機器への気の散りが子どもとの関わりを損なうと語られ、祖父母の関与がしつけをめぐる対立を生むという声もあった。【ポイント・注意点】著者は、親が関わる頻度だけでなく、養育の感情面の質や世代間の協力が大切だと強調する。ただし一時点の調査で、養育者が自分の子育てと子どもの感情の力の両方を答えているため、回答の偏りが入りうる。対象も全国を代表するものではなく、結果は因果関係を示すものではない。","2026-11-23","Scienmag","https://scienmag.com/mindful-parenting-and-grandparent-support-correlate-with-preschoolers-emotional-competence-in-china/"],["母親のてんかんと妊娠中の抗てんかん薬 子の特別支援ニーズと関連 英国","英グラスゴー大学の研究チームが、ウェールズで2009〜2016年に生まれた子ども179,024人の記録を分析し、母親のてんかんや胎内での抗てんかん薬への曝露と、子どもの特別な教育的支援ニーズとの関係を調べた。治療の有無にかかわらず母親のてんかんは支援ニーズの増加と関連し、薬ではバルプロ酸で関連が最も強かった。著者は、この結果を妊娠中の薬選びに使わないよう求めている。","\n【概要】英グラスゴー大学の研究チームが、母親のてんかんと妊娠中の抗てんかん薬への曝露が、子どもの特別な教育的支援ニーズ（SEN）のリスクと関連するとの研究を、学術誌PLOS ONEに発表した。ウェールズの住民データベースSAILの記録をつないだ後ろ向きコホート研究で、著者は全員グラスゴー大学に所属する。【背景】妊娠中の母親のてんかんや、抗てんかん薬への胎内での曝露が、子どもの学齢期の発達や学習にどう関わるかは重要な関心事だ。研究チームは、病気そのものと薬の影響を区別するため、治療中、未治療、薬だけの曝露に分けて分析した。【詳細】対象は2009〜2016年にウェールズで生まれ、2014〜2021年に小学校に通った子ども179,024人で、13歳まで追跡した。このうち1,725人（約1.0％）が胎内で母親のてんかんや抗てんかん薬に曝露していた。内訳は、治療中のてんかん851人、未治療のてんかん355人、てんかんの記録がなく薬だけに曝露した519人だった。全体の28.7％にSENの記録があり、1.8％がADHDだった。調整後、SENのオッズ比は未治療のてんかんで1.58、治療中のてんかんで1.63だった。薬別では、バルプロ酸2.48、レベチラセタム1.67、カルバマゼピン1.62、ガバペンチン1.58、プレガバリン1.55だった。ADHDは母親のてんかんと関連した（ハザード比1.49）が、薬の曝露とは関連しなかった。自閉症はバルプロ酸と関連した（オッズ比3.07）が、媒介要因を調整したモデルでは残らなかった。治療を受けていない母親のてんかんでも支援ニーズとの関連が見られた点は、病気そのものが関わる可能性を示している。【ポイント・注意点】著者は、関連は薬よりもてんかんそのものや重症度を反映している可能性があるとし、バルプロ酸と自閉症の関連は精度が低いが既存の規制上の指針と合うとしている。発作の重症度や薬の量、葉酸、飲酒のデータはなく、処方が実際の服用を反映しない可能性もある。多重検定の補正もしておらず、著者は妊娠中の薬の選択にこの結果を使わないよう勧めている。","2026-11-23","PLOS ONE","https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0363068"],["10代での塩味スナック 炎症性腸疾患のリスク上昇と関連 北欧11万人","北欧3か国の出生コホートの111,999人を分析し、子ども時代と10代の食事と炎症性腸疾患（IBD）の関係を調べた研究が発表された。10代で塩味のスナック菓子を多く食べていた人は、IBD全体のリスクが32％、潰瘍性大腸炎のリスクが51％高かった。10代で果物を多く食べた人はクローン病のリスクが64％低く、子ども時代に魚を多く食べた人もクローン病のリスクが35％低かった。観察研究のため、因果関係は示せない。","\n【概要】子ども時代と10代の食事が、後の炎症性腸疾患（IBD）のリスクと関連するとの研究が、学術誌Gutに発表された。ノルウェー、デンマーク、スウェーデンの3つの出生コホートをまとめ、111,999人を平均12〜17年追跡した。2024年までに国の登録で653人のIBDが確認された。使ったのはノルウェーのMoBa、デンマークのDNBC、スウェーデンのABISで、論文はグオ氏らによる。【背景】IBDは、クローン病や潰瘍性大腸炎など、腸に慢性の炎症が起こる病気だ。研究チームは、成長期の食事の内容が後の発症リスクとどう関係するかを、子ども時代と10代に分けて調べた。果物、魚、スナック菓子などの食品群ごとに関連を見た点が特徴だ。【詳細】食事は7〜15歳の間の2時点で食物摂取頻度の質問票で調べ、果物、野菜、乳製品、肉、魚、砂糖入り飲料、スナック菓子に分けた。塩味のスナック菓子は10代でのみ質問した。摂取が多い群と少ない群を比べると、子ども時代に果物を多く食べるとクローン病のリスクが34％低かった一方、潰瘍性大腸炎のリスクは54％高かった。10代の果物はクローン病のリスクが64％低く、潰瘍性大腸炎とは関連がなかった。子ども時代の魚はクローン病のリスクが35％低かったが、10代の魚では関連がなかった。10代の塩味のスナック菓子は、IBD全体のリスクが32％、潰瘍性大腸炎のリスクが51％高かった。ほかの食品群では有意な関連はなかった。結果は、社会的な要因や周産期の要因、親のIBDや母親の喫煙などを調整しても変わらず、生後1年の抗生物質や母乳の期間を加えた分析でも保たれた。【ポイント・注意点】研究者は、果物の食物繊維が腸内細菌の多様性や短鎖脂肪酸を通じて、魚のオメガ3脂肪酸が炎症の経路を通じて働く可能性を挙げ、どの種類の繊維が役立つかはさらに研究が必要だとしている。ただし観察研究で、成長後の生活習慣は調整しておらず、食事パターン全体も評価していない。結果が確かめられれば、健康的な食習慣がIBD予防の一つになりうるという。","2026-11-23","News-Medical","https://www.news-medical.net/news/20261123/Salty-snacks-in-adolescence-linked-to-higher-risk-of-IBD.aspx"]]};
let memos=[]; // {cat,title,note,date}
const OLD_CUT="2026-11-07";
function isOld(d){return d<OLD_CUT}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
/* ===== 項目（ジャンル）はデータ駆動：CATS／DATAに足すだけで自動で増えます ===== */
const extraCats=[];
function allCats(){
  const list=CATS.slice();
  Object.keys(DATA).forEach(id=>{ if(!list.some(c=>c.id===id)) list.push({id:id,name:id,desc:"追加された項目",img:"hero"}); });
  extraCats.forEach(c=>{ if(!list.some(x=>x.id===c.id)) list.push(c); });
  return list;
}
let cats=allCats();
let catIdx=0;
const artIdxMap={};
function itemsOf(c){return (DATA[c.id]||[]).map((a,i)=>({a:a,oi:i})).sort((x,y)=>y.a[3].localeCompare(x.a[3]))}
function curCat(){return cats[catIdx]}
function curItems(){return itemsOf(curCat())}
function curArtIdx(){const n=curItems().length;if(!n)return 0;let i=artIdxMap[curCat().id]||0;if(i>=n)i=n-1;if(i<0)i=0;return i}
function renderStage(dir){
  cats=allCats(); if(catIdx>=cats.length)catIdx=cats.length-1; if(catIdx<0)catIdx=0;
  const c=curCat(), items=curItems(), ai=curArtIdx();
  const total=cats.reduce((s,x)=>s+(DATA[x.id]||[]).length,0);
  document.getElementById('heroText').innerHTML="<b>今日のまとめ — 全"+cats.length+"ジャンル・"+total+"件。</b> タイトルと概要は日本語、カードの「和訳全文を読む」で全文が開きます。新しい順に並べ、48時間より古い記事はグレー表示です。";
  document.getElementById('catName').textContent=c.name;
  document.getElementById('catDesc').textContent=c.desc||"";
  document.getElementById('catCount').textContent="ジャンル "+(catIdx+1)+" / "+cats.length;
  document.getElementById('catDots').innerHTML=cats.map((x,i)=>'<button class="dot'+(i===catIdx?' active':'')+'" data-cat="'+i+'" aria-label="'+x.name+'へ移動"></button>').join('');
  document.querySelectorAll('#catDots .dot').forEach(d=>{d.onclick=()=>{const n=+d.dataset.cat; if(n!==catIdx){const dd=n>catIdx?'down':'up'; catIdx=n; renderStage(dd);}}});
      const slot=document.getElementById('cardSlot');
  if(!items.length){
    slot.innerHTML='<article class="card"><div class="empty"><div class="big">✦</div><p><b>'+c.name+'</b> は追加されたばかりの項目で、まだ記事がありません。</p><p>毎日の更新でこの項目の記事が集まると、ここに表示されます。<br>上スワイプで他のジャンルへ移動できます。</p></div></article>';
    document.getElementById('artDots').innerHTML=""; document.getElementById('artCount').textContent="0 / 0"; return;
  }
  const it=items[ai], a=it.a, old=isOld(a[3]);
  slot.innerHTML='<article class="card'+(old?' old':'')+(dir?' anim-'+dir:'')+'">'
    +'<img class="ph" src="'+IMGS[c.img]+'" alt="'+c.name+'のイメージイラスト">'
    +'<div class="cbody"><div class="meta"><span class="badge'+(old?' oldb':'')+'">'+(old?'少し前':'NEW')+'</span><span>'+a[3]+'</span><span>'+(ai+1)+' / '+items.length+'</span></div>'
    +'<h3>'+a[0]+'</h3><p class="sum">'+a[1]+'</p>'
    +'<div class="actions"><button class="btn primary" onclick="openArticle(\''+c.id+'\','+it.oi+')">和訳全文を読む</button>'
    +'<button class="btn ghost" onclick="quickMemo(\''+c.id+'\','+it.oi+',this)">メモ保存</button>'
    +'<button class="btn ghost" onclick="shareArticle(\''+c.id+'\','+it.oi+')">共有</button></div>'
    +'<div class="src">出典：'+a[4]+'<br><a href="'+a[5]+'" target="_blank" rel="noopener">原文を開く</a></div></div></article>';
  document.getElementById('artDots').innerHTML=items.map((x,i)=>'<span class="dot'+(i===ai?' active':'')+'"></span>').join('');
  document.getElementById('artCount').textContent="記事 "+(ai+1)+" / "+items.length;
  requestAnimationFrame(fitCard);
}

function fitCard(){
  const card=document.querySelector('#cardSlot .card'); if(!card) return;
  const body=card.querySelector('.cbody'); if(!body) return;
  const sum=card.querySelector('.sum'), h3=card.querySelector('h3'), ph=card.querySelector('.ph');
  let ss=14, hs=Math.min(21, Math.max(17, window.innerWidth*0.044)), phh=ph?Math.round(ph.getBoundingClientRect().height):0; const ph0=phh;
  if(sum) sum.style.fontSize=ss+'px'; if(h3) h3.style.fontSize=hs+'px';
  let guard=0;
  while(body.scrollHeight>body.clientHeight+1 && guard<40){
    guard++;
    if(phh>76){ phh-=12; if(ph) ph.style.height=phh+'px'; continue; }
    if(ss>10.5){ ss-=0.5; if(sum) sum.style.fontSize=ss+'px'; continue; }
    if(hs>13){ hs-=0.5; if(h3) h3.style.fontSize=hs+'px'; continue; }
    break;
  }
}
window.addEventListener('resize', fitCard);
function nextArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i>=n-1)return;artIdxMap[curCat().id]=i+1;renderStage('next')}
function prevArt(){const n=curItems().length;if(!n)return;const i=curArtIdx();if(i<=0)return;artIdxMap[curCat().id]=i-1;renderStage('prev')}
function nextCat(){if(catIdx>=cats.length-1)return;catIdx++;renderStage('down')}
function prevCat(){if(catIdx<=0)return;catIdx--;renderStage('up')}
/* ===== スワイプ操作（スクロールではなくスワイプで移動） ===== */
const stage=document.getElementById('stage');
let sx=null, sy=null, swipedAt=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;
  swipedAt=Date.now();
  if(Math.abs(dx)>Math.abs(dy)){ dx<0?nextArt():prevArt(); } else { dy<0?nextCat():prevCat(); }
});
stage.addEventListener('click',e=>{ if(Date.now()-swipedAt<120){e.stopPropagation();e.preventDefault();} },true);
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight')nextArt(); else if(e.key==='ArrowLeft')prevArt();
  else if(e.key==='ArrowDown'){e.preventDefault();nextCat();} else if(e.key==='ArrowUp'){e.preventDefault();prevCat();}
});
/* ===== 項目の追加 ===== */
document.getElementById('addCatBtn').onclick=()=>{document.getElementById('newCatName').value="";document.getElementById('newCatDesc').value="";document.getElementById('addDlg').showModal()};
document.getElementById('addCatSave').onclick=()=>{
  const name=document.getElementById('newCatName').value.trim();
  if(!name){toast("項目名を入力してください");return}
  const desc=document.getElementById('newCatDesc').value.trim()||"追加された項目";
  const id='custom-'+Date.now();
  extraCats.push({id:id,name:name,desc:desc,img:'hero'}); DATA[id]=[];
  cats=allCats(); catIdx=cats.length-1;
  document.getElementById('addDlg').close(); renderStage('down');
  toast("項目「"+name+"」を追加しました");
};
/* ===== 記事ダイアログ・メモ・共有 ===== */
function openArticle(cat,idx){
const c=allCats().find(x=>x.id==cat); const a=DATA[cat][idx];
document.getElementById('dlgIn').innerHTML=`<img src="${IMGS[c.img]}" alt=""><div class="meta" style="margin-top:10px"><span>${c.name}</span><span>${a[3]}</span></div><h3>${a[0]}</h3><p class="sum" style="font-size:14px">${a[1]}</p><div class="full">${a[2]}</div>
<p class="src" style="margin-top:12px">出典：${a[4]} — <a href="${a[5]}" target="_blank" rel="noopener">${a[5]}</a></p>
<div class="memoBox"><label style="font-weight:800;font-size:14px">ひとことメモ</label><textarea id="memoText" placeholder="気づいたこと、作りたいもの、家族への共有メモなど"></textarea>
<div class="actions"><button class="btn primary" onclick="saveMemo('${cat}',${idx})">このメモを保存</button><button class="btn ghost" onclick="shareArticle('${cat}',${idx})">iPhoneで共有</button><button class="btn ghost" onclick="document.getElementById('dlg').close()">閉じる</button></div></div>`;
document.getElementById('dlg').showModal();
}
function quickMemo(cat,idx,btn){const a=DATA[cat][idx];memos.unshift({cat,title:a[0],note:"",date:a[3]});updateMemoUI();btn.textContent="保存しました";btn.classList.add('saved');toast("メモに保存しました（このページを開いている間）")}
function saveMemo(cat,idx){const a=DATA[cat][idx];const note=document.getElementById('memoText').value.trim();memos.unshift({cat,title:a[0],note,date:a[3]});updateMemoUI();toast("メモを保存しました");document.getElementById('dlg').close()}
function updateMemoUI(){document.getElementById('memoCount').textContent=memos.length;const area=document.getElementById('memoList');
if(!memos.length){area.innerHTML='<p class="sum">まだメモがありません。記事の「メモ保存」をタップしてください。</p>';return}
area.innerHTML=memos.map(m=>`<div class="memoItem"><b style="font-size:14px">${m.title}</b><div style="font-size:13px;color:var(--muted)">${m.note||"（ひとことメモなし）"} ・ ${m.date}</div></div>`).join('')}
function exportMemos(){if(!memos.length){toast("まだメモがありません");return}const txt="MAI topic メモ — 2026-11-10\n\n"+memos.map((m,i)=>`${i+1}. ${m.title}\n${m.note||""}\n`).join("\n");const b=new Blob([txt],{type:"text/plain"});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="mai-topic-memo-2026-11-10.txt";a.click();URL.revokeObjectURL(u)}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}} try{await navigator.clipboard.writeText(text);toast("コピーしました — メモアプリなどに貼り付けできます")}catch(e){toast("共有できませんでした")}}
function shareArticle(cat,idx){const a=DATA[cat][idx];shareText(a[0],`${a[0]}\n\n${a[1]}\n\n出典：${a[4]} ${a[5]}`)}
function shareMemos(){if(!memos.length){toast("まだメモがありません");return}shareText("MAI topic メモ",memos.map(m=>`・${m.title} ${m.note}`).join("\n"))}
document.getElementById('sharePage').onclick=()=>shareText("MAI topic","MAI topic — 2026年11月25日朝版（全"+cats.length+"ジャンル）");
document.getElementById('memoBtn').onclick=()=>{updateMemoUI();document.getElementById('memoDlg').showModal()};
updateMemoUI();
renderStage();
</script>
