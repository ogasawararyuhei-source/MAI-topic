BM25で順位付けし、キーワードとベクトルを混ぜたハイブリッド検索もできる。書き込みはredbというRust製のB木ストアでACIDトランザクションになり、保存は端末のファイルか、ブラウザではOPFSで、IndexedDBへの退避も備える。暗号化や変更の通知、移行の仕組みもある。WASMはgzipで約570kBだ。【ポイント・注意点】ライセンスはMITまたはApache-2.0の二重で選べる。Rustのクレートはまだ新しく、1.0になる前にAPIが変わる場合があると注記されている。ブラウザではクロスオリジン分離のヘッダーなど、バンドラ側の設定が要る。スターは112件で、議論や変更履歴、ロードマップも公開されている。端末内で完結するAI機能を作りたい人には、試す価値のある選択肢だ。端末内で完結する検索は、個人のメモや社内文書の扱いにも向いていそうだ。まずは小さなアプリで試すのがよさそうだ。","2026-11-23","Hacker News","https://news.ycombinator.com/item?id=50609192"],["GEO・SEO対応MCP：AI検索に読まれるか確かめる道具","ChatGPT検索やPerplexityに載るには、サイトがAIクローラに読まれる必要がある。GEO・SEO対応MCPは、AI検索への備えを調べるオープンソースのMCPサーバーだ。robots.txtやllms.txt、構造化データなど5つの検査を回し、直すべき順に示す。APIキー不要で、Pythonだけで動く。導入はURLを貼るかPythonで動かすだけ。自分のサイトがAIに読まれるか、まず確かめるとよさそうだ。","\n【概要】ChatGPT検索やPerplexityに載るには、サイトがAIクローラに読まれる必要がある。GEO・SEO対応MCPは、AI検索への備えを調べるオープンソースのMCPサーバーだ。robots.txtやllms.txt、構造化データ、サイトマップ、表示性能の5つの検査を回し、直すべき順に示す。APIキーやアカウントは不要で、Pythonだけで動く。聞きたいことは「このサイトはAI検索に備わっているか」と尋ねるだけだ。【背景】AI検索が広がり、サイト運営者は「AIに引用されるか」を気にするようになった。だが、robots.txtでAIクローラを遮断していたり、llms.txtがなかったり、構造化データが壊れていたりすると、AIはそのサイトを正しく読めない。作者は、5つの検査を決まった手順で回し、優先順位付きの修正一覧を返す道具を作った。検査のたびに公式のMCPレジストリにも載っている。【詳細】道具は、AI検索用と学習用、GooglebotやBingbotに分けてrobots.txtを調べる。学習用クローラの遮断は方針として扱い、誤りにはしない。llms.txtの有無や中身、JSON-LDの型やcanonical、サイトマップのURL数も見る。判定はPASSやWARN、FAIL、INFO、UNMEASUREDの5段階で、遮断などで調べられない場合は推測せずUNMEASUREDと示す。使い方は、ホスト型のMCPにURLを貼るか、Pythonでserver.pyを動かす。Dockerにも対応する。著者自身のサイトでは、公開ページのcanonicalが別ホストを指す不具合を見つけたという。【ポイント・注意点】調べるのは最初のHTMLだけで、JavaScriptで後から入るJSON-LDは見えない。CDNやWAFの遮断も別途確認が要る。Lite版はMITライセンスで無料だが、有料のPro版も案内されている。AIに読まれるための技術的な備えを確かめる道具で、順位や引用そのものを保証するものではない点には注意したい。","2026-11-23","Hacker News","https://news.ycombinator.com/item?id=50608126"],["CubePod：エージェント用の永続サンドボックス基盤","AIエージェントの実行環境は、眠ると入れたものが消えてしまう。CubePodはE2B互換のオープンソース実行基盤で、Kubernetes上にMicroVMのサンドボックスを作る。ルートファイルシステムが残るため、再開しても入れ直しが要らない。休止中はCPUもメモリも使わず、再開は約1秒だ。導入にはKubernetesの環境が要る。エージェント基盤を自前で持ちたいチームは、検討に値しそうだ。","\n【概要】AIエージェントの実行環境は、眠ると入れたものが消えてしまう。CubePodはE2B互換のオープンソース実行基盤で、Kubernetes上にMicroVMのサンドボックスを作る。ルートファイルシステムが残るため、再開しても入れ直しが要らない。休止中はCPUもメモリも使わず、再開は約1秒だ。E2Bの公式SDKがそのまま使え、LangChainやAutoGenなどの枠組みもつなぎ替えなしで動く。Apache-2.0で公開されている。【背景】エージェントはシェルの権限で動き、パッケージを入れたり、ブラウザを動かしたり、秘密の鍵で外部APIを呼んだりする。従来のサンドボックスは、眠ると/usrや/etcへの変更が消え、毎回入れ直しに数分かかっていた。メモリのスナップショットは重く、NFS越しの入出力も遅い。さらにAPIキーが環境変数に平文で入る問題もあった。作者は、円盤の状態だけを残し、CPUとメモリは休止中にゼロにする設計にした。【詳細】仕組みは、2つのCSIブロックボリュームで、ルートファイルシステムと/workspaceを別々に保つ。休止時はsyncとfsfreezeで書き込みを止め、Podを消す。呼び出しが来ると、どのノードでも約1秒でMicroVMを立て直す。あらかじめ用意した温かいプールからは50ミリ秒未満で払い出せる。隔離はKata ContainersのMicroVMで、ゲストごとにLinuxカーネルが分かれる。秘密の鍵はcpodref_という置き換え用の文字列で渡し、外向きの通信はmTLSの金庫が仲立ちする。E2Bとの互換性は100%をうたい、公式SDKのほかMCPにも対応する。【ポイント・注意点】導入にはKubernetesとKata、CSIの環境が要るため、個人のPCで気軽に試す道具ではない。単体ノードのDocker Composeでの実行も案内されている。スターは76件で、公開されたのは2026年11月11日と比較的新しい。サンドボックスの分岐は1秒未満のコピーオンライトでできる。エージェント基盤を自前で持ちたいチームには、検討に値する選択肢だ。","2026-11-23","Hacker News","https://news.ycombinator.com/item?id=50607473"],["Codexed：Codexの設定を画面で整える道具","Codexの設定はconfig.tomlを手書きするしかなく、鍵の意味も分かりにくい。CodexedはCodex CLIの設定を画面で整える道具で、使っているバージョンの設定一覧を出し、機能フラグのオンオフもできる。変更はCodex自身が行うため、コメントや書式が残る。Go製の単体バイナリで動く。導入はGo製の単体バイナリで動く。画面で設定を整えたい人は、まず試してみるとよさそうだ。","\n【概要】Codexの設定はconfig.tomlを手書きするしかなく、鍵の意味も分かりにくい。CodexedはCodex CLIの設定を画面で整える道具で、使っているバージョンの設定一覧を出し、機能フラグのオンオフもできる。config.tomlやAGENTS.md、スキル、プラグイン、MCPの設定を扱い、全体でもプロジェクトごとでも切り替えられる。変更はCodex自身が行うため、コメントや書式が残る。Go製の単体バイナリで、macOSやLinux、Windowsで動く。【背景】設定ファイルを手で書く方法は動くが、どんな鍵があるか、半分の機能フラグが何をするのか覚えきれない。作者は、速くて余計なもののない小さなアプリが欲しかったという。2つか3つのことをよくこなす道具を目指し、設定の意味を画面で確かめながら変えられるようにした。プライバシーに関わる設定の提案も出すようにしている。【詳細】機能は、使っているCodexのバージョンに合った設定の一覧表示、config.tomlやAGENTS.md、スキル、プラグイン、MCPの設定、機能フラグの全体・プロジェクトごとの切り替え、サイドバーのツリー表示でプロジェクトを見渡すこと、プライバシー設定の提案だ。変更はCodex自身が行うため、ファイルのコメントや書式は保たれる。MITライセンスで公開され、スクリーンショットや導入手順はGitHubに置かれている。作者は、Claude Code向けのClaudiaや、複数CLIのアカウントを切り替えるSwitcherooも参考に挙げている。【ポイント・注意点】生まれたばかりの小さな道具で、対応するCodexのバージョンや細かな動作はリポジトリで確かめたい。設定の変更はCodex自身が行うとはいえ、誤った設定で動かなくなる恐れもあるため、変更前のバックアップは心がけたい。画面で設定を整えたい人には、気軽に試せる道具だ。設定の意味を画面で確かめながら変えられるのは、手書きの不安を減らしてくれる。まずは自分の環境で試すのがよさそうだ。","2026-11-23","Hacker News","https://news.ycombinator.com/item?id=50607324"],["Hearth 64：実機の64で燃える暖炉のスクリーンセーバー","寒い夜、ブラウン管テレビに暖炉が欲しい。Hearth 64は実機のニンテンドウ64で動く暖炉のスクリーンセーバーだ。ローポリの石造りの暖炉に炎がゆらめき、七面鳥やカエル、猫が遊びに来る。雨音やシンセの音色も流れ、焼き付き防止の工夫もある。フラッシュカートで遊べる。遊ぶにはEverDrive-64などのフラッシュカートか、aresエミュレータが要る。冬の夜、実機の暖炉を眺める楽しみがありそうだ。","\n【概要】寒い夜、ブラウン管テレビに暖炉が欲しい。Hearth 64は実機のニンテンドウ64で動く暖炉のスクリーンセーバーだ。ローポリの石造りの暖炉に炎がゆらめき、七面鳥やカエル、猫が遊びに来る。雨音やシンセの音色も流れ、焼き付き防止の工夫もある。標準の4MBの本体で動き、NTSCとPALを自動で見分ける。ROMはフラッシュカートに入れて遊べる。【背景】暖炉の映像は今では定番だが、実機のニンテンドウ64で動くものは珍しい。作者は90年代のローポリ表現とブラウン管テレビの組み合わせを狙い、libdragonで作った。炎のゆらめきや煙突の石、オークのマントル、ロウソク、湯気の立つマグカップなど、細部まで作り込んでいる。季節の遊び心として、七面鳥やカエル、猫が訪れる仕掛けもある。【詳細】見どころは、複数の周波数でゆらめく炎の光が石や丸太、敷物を照らし、炎の色合いを変えられることだ。炎や炭、火の粉は3Dで重ねられ、丸太を投げ入れることもできる。訪問者は七面鳥やカエル、オレンジのトラ猫で、それぞれ音とA+Bボタンの隠し仕掛けを持つ。音は暖炉のうなりやパチパチという音、雨音、90年代風のシンセから選べる。焼き付き防止のため、画面はゆっくり漂い、4つのカメラ角度が自動で切り替わる。コントローラでは、Aで火をあおり、Bで丸太を投げ、十字キーで火加減を変える。【ポイント・注意点】遊ぶにはEverDrive-64やSummerCart64などのフラッシュカート、またはaresエミュレータが要る。ROMはリリースページからhearth64.z64を落とす。ビルドはmacOSでDockerとColimaを使う手順が用意されている。リポジトリは2026年11月20日に作られたばかりで、スターは8件。冬の夜の小さな楽しみとして、実機で動かす醍醐味がありそうだ。実機のニンテンドウ64で動く暖炉は、懐かしさと新しさを両立した遊びだ。冬の夜、ブラウン管テレビの前でゆっくり眺めながら過ごす楽しみがありそうだ。ぜひ試してみたい。","2026-11-23","Hacker News","https://news.ycombinator.com/item?id=50606513"],["Thir：LinuxカーネルとRustだけの小さなOS","OSはどう動くのか、自分で書いて確かめたい。ThirはLinux 6.12カーネルに、すべて自作のRustコードを載せた小さなOSだ。UEFIから起動し、VirtualBoxや実機のPCで動く。ペイン式のデスクトップやシェル、ブラウザ、メモなどのアプリを備え、AIも任意で使える。試すにはリリースからイメージを落とすだけ。OSの中身に興味がある人は、動かして眺めるだけでも面白そうだ。","\n【概要】OSはどう動くのか、自分で書いて確かめたい。ThirはLinux 6.12カーネルに、すべて自作のRustコードを載せた小さなOSだ。UEFIから起動し、VirtualBoxやQEMU、実機のPCで動く。ペイン式のデスクトップやシェル、ログイン画面、メモやカレンダー、ブラウザなどのアプリを備える。AIは任意で、自分の鍵を持ち込んで使う。学びのために作られたOSで、MITライセンスで公開されている。【背景】OSの仕組みは本で読むだけでは分かりにくい。作者は、カーネルの上に自分のコードだけを載せ、デスクトップまで作ることで、OSがどう動くかを学ぼうとした。起動の流れは下から読む形で、ハードウェア、UEFI、カーネル、init、デスクトップ、シェル、アプリと重なる。AIの部分は任意で、外しても動く設計になっている。【詳細】中身は、並べて使うペイン式デスクトップ、シェル、ログイン画面で、メモやカレンダー、連絡先、時計、電卓の小さなアプリがある。ブラウザではYouTubeも見られ、音楽や動画の再生、写真表示、録音、カメラも付いている。AIは「!」から始めて頼む形で、実行前に内容を示して承諾を待つ。自分の鍵を使うか、初回ログインで「AIなし」を選べる。試すにはリリースからOVAやUEFIイメージを落とし、仮想マシンにメモリ2GB、CPU2つを割り当てる。実機のPCではUSBから起動でき、ddの扱いには注意が要る。【ポイント・注意点】作者自身のコードはMITだが、LinuxカーネルはGPL-2.0、WebKitなどはLGPLで、ライセンスは分かれている。ビルドはMacでDockerとQEMUを使い、初回はWebKitのビルドに数時間かかるという。小さな版はTHIR_SMALL=1で作れる。学びのためのOSで、日々の道具として使うものではない。OSの中身に興味がある人には、動かして眺めるだけでも面白そうだ。OSの中身を自分の手で確かめる学びは、本で読むだけでは得られない。まずは仮想マシンで動かしてみるのがよさそうだ。","2026-11-23","Hacker News","https://news.ycombinator.com/item?id=50606291"]],"gh-blog":[["カバレッジ報告の形式ミスを即検出へ","GitHubのCode Qualityが、カバレッジ報告のアップロード時に形式を検証するようになった。これまでは形式が違っても成功したように見え、プルリクエストにカバレッジが表示されないまま原因が分かりにくい状態だった。Cobertura XMLでない報告はエラーで失敗し、問題がその場で分かる。処理も寛容になり、軽微な不備では報告全体を捨てなくなった。対象はGitHub Enterprise CloudとGitHub Teamだ。","\n【概要】GitHub Code Qualityのupload-code-coverageアクションが、アップロードされたカバレッジレポートがCobertura XML形式かどうかを検証するようになった。形式が違う場合はアップロードの段階で失敗し、Actionsのログに「This file is not a Cobertura XML report. Upload a Cobertura XML report.」というエラーが表示される。カバレッジはテストの網羅度を示す指標で、プルリクエスト上で確認できる。\n【背景】これまでは形式が正しくない報告でも、アップロードが成功したように見えていた。その結果、プルリクエストにカバレッジが表示されないという分かりにくい状態になっていた。CIでテストを回してもカバレッジの表示だけが出ないため、テスト自体は通っているのに品質の見える化だけが止まるという、気づきにくいトラブルになっていた。原因がテスト側の出力形式にあると気づくまでに、時間がかかることもあった。\n【詳細】形式が違う場合はエラーで止まるため、原因がその場で分かる。テストフレームワークの設定をCobertura XML出力に変えるか、変換してからアップロードすればよい。カバレッジの計測そのものは変わらず、形式の検査が追加されただけだ。同時に、正しいCobertura報告の処理も寛容になった。軽微な構造の問題では拒否されなくなり、行番号やヒット数が使えない行だけをスキップして、報告全体を破棄しないようになった。\n【ポイント・注意点】利用にはリポジトリでGitHub Code Qualityを有効にする必要がある。GitHub Enterprise CloudとGitHub Teamで利用でき、GitHub Enterprise Serverでは使えない。ワークフローが急に失敗し始めたら、まずテスト出力の形式を確認するとよい。設定方法はドキュメントの「リポジトリのコードカバレッジを設定する」にまとめられている。","2026-11-23","GitHub Blog","https://github.blog/changelog/2026-11-23-code-coverage-uploads-now-flag-invalid-report-formats"],["エージェントと画面をつなぐAG-UIが2万スター超","AIエージェントと画面をつなぐ公開プロトコル「AG-UI」が、GitHubで2万1千を超えるスターを集めている。エージェントがトークンを流し、ツールを呼び、状態を更新し、途中で人間の承認を求めるといった動きを、型付きイベントの流れとして標準化する仕組みだ。仕様は1.0で固定され、TypeScriptとPython、.NETのSDKが仕様から生成されている。採用企業にはGoogleやMicrosoftなどが挙げられている。","\n【概要】AIエージェントと画面をつなぐ公開プロトコル「AG-UI」が、GitHubで2万1千を超えるスターを集めて注目されている。エージェントがトークンを流し、ツールを呼び、状態を更新し、途中で人間の承認を求めるといった動きを、型付きイベントの流れとして標準化する。仕様は1.0で固定され、TypeScriptとPython、.NETのSDKが仕様から生成されている。\n【背景】エージェントは質問と回答の一往復では収まらない。進み具合や途中経過を画面に映すには、枠組みごとに独自の配線が必要だった。チャット欄だけではエージェントが何をしているか途中で分からず、利用者は完了を待つしかなかった。進捗や承認の求めを画面に出すには、共通の約束が必要だった。AG-UIはその配線を共通の仕様に置き換える。\n【詳細】AG-UI 1.0では仕様が固定され、31種類のイベントが8つの系統に整理された。実行の開始と終了、テキストメッセージ、ツール呼び出し、状態、推論過程、進捗、サブエージェント、独自イベントが含まれる。HTTPとサーバー送信イベント、またはProtobufによる通信が定められている。SDKはTypeScriptの@ag-ui/client、Pythonのag-ui-protocol、.NETのAGUI.Clientで、コミュニティ製がKotlinやGo、Javaなど8言語に広がる。統合先はLangChain、CrewAI、Mastra、Google ADK、Microsoft Agent Framework、Pydantic AI、LlamaIndexなどで、デモ集のDojoで実際の動きを試せる。npx create-ag-ui-appで雛形を作れる。\n【ポイント・注意点】MCPが道具との接続、A2Aがエージェント同士の連携を担うのに対し、AG-UIはエージェントと人の画面の間を受け持つ。生成UIの仕様であるA2UIとは別物で、組み合わせて使う。MITライセンスの公開仕様で、採用企業としてGoogleやMicrosoft、Amazon、Oracleが挙げられている。リポジトリは2025年5月に作られ、5,596件のコミットを重ねている。","2026-11-23","GitHub","https://github.com/ag-ui-protocol/ag-ui"],["Metaの設計システムAstryx、3万スター超で急伸","Metaが8年間社内で育ててきたデザインシステム「Astryx」が公開ベータとしてGitHubで3万2千を超えるスターを集めている。150以上のアクセシブルなReactコンポーネントと7つのテーマ、CLIを備え、人とAIコーディングエージェントが同じ道具で画面を作れるよう設計されている。npmからは@astryxdesign/coreで導入でき、CLIが設定を手引きする。","\n【概要】Metaが8年間社内で育ててきたデザインシステム「Astryx」が、公開ベータとしてGitHubで3万2千を超えるスターを集めている。150以上のアクセシブルなReactコンポーネントと7つのテーマ、CLIを備え、人とAIコーディングエージェントが同じ道具で画面を作れるよう設計されている。npmからは@astryxdesign/coreで導入でき、CLIが設定を手引きする。\n【背景】Meta社内で最も使われているデザインシステムで、1万3千以上のアプリを支えてきた。2026年6月にMITライセンスで公開され、11月に入って週刊トレンドの上位に入るなど注目が高まっている。11月10日から13日には4日連続でリリースが出るなど、開発の歩みも速い。\n【詳細】React 19以上とStyleXを土台にし、npm install @astryxdesign/coreで導入できる。CLIのinitコマンドが設定手順を示し、AGENTS.mdやCLAUDE.mdに使い方の手引きを書き込むため、コーディングエージェントが推測で部品を使わずに済む。7つのテーマはneutral、butter、chocolate、matcha、stone、gothic、y2kで、CSS変数の差し替えで独自の見た目にできる。コンポーネントは型付きのReact部品で、アクセシビリティに配慮されている。ドキュメントとStorybook、対話式のSandboxが公式サイトに用意されている。テーマはCSS変数の差し替えで作れ、swizzleで部品のソースを自分のプロジェクトへ取り出して持つこともできる。\n【ポイント・注意点】まだベータでバージョンは0.7系。APIが変わることがあり、移行用のコード変換が用意されている。実験的なlabパッケージはnpmに公開されておらず、チャート類はcanary版のみ。React 19が必須で、古いプロジェクトは先にReactを上げる必要がある。導入はnpm install @astryxdesign/core @astryxdesign/theme-neutral @stylexjs/stylexの3点で、CLIは開発用の依存関係として入れる。","2026-11-23","GitHub","https://github.com/meta/astryx"],["LLM上司に振り回されるブラウザゲームが話題に","実際のLLMが上司になり、プレイヤーを部下として使うブラウザゲーム「Worker 755」が開発者の間で話題になっている。プレイヤーはAI上司から仕事を割り振られ、作業して査読を受ける。面白いのは上司の間違いを数える仕組みで、隠れた正解チェックが「壊れている」と知っている仕事を上司が承認した回数を集計する。AIに使われる側に回るという逆転の発想が注目を集めた。","\n【概要】Worker 755は、ブラウザで遊べるゲームで、本物の大規模言語モデル（LLM）がマネージャー役を務める。プレイヤーはその部下、つまりサブエージェントとして働き、AI上司からタスクを受け取り、作業を進めて査読を受ける。普通のゲームとは立場が逆で、人間がAIに指示される側に回る。\n【背景】AIコーディングエージェントが普及し、開発者はAIに仕事を頼む側に慣れてきた。そこで「AIが人間を管理したらどうなるか」という問いをゲームにしたのがWorker 755だ。開発者の日常を皮肉るような設定がSNSや掲示板で話題を呼び、11月22日から23日にかけての言及数トレンドで上位に入った。\n【詳細】ゲームの核は、上司であるLLMの判断を採点する仕組みだ。画面には「上司が間違えた回数」が表示され、隠れた正解チェックが「壊れている」と知っている仕事を上司が承認した回数が数えられる。つまり部下であるプレイヤーは、上司の誤りを見抜きながら働くことになる。AIの指示がいつも正しいとは限らないという現実を、そのまま遊びにしている。\n【ポイント・注意点】このゲームは娯楽作品で、実務のマネジメント手法を示すものではない。ただ、AIの出力をうのみにせず検証する姿勢は、実際のAI活用でも同じだ。上司役のLLMがどんな基準で承認や却下を決めるかは、遊ぶ側には見えにくい。話題性が先行している段階で、実際の遊び心地やボリュームはこれからの評価を待ちたい。\nゲームの題材は、AIエージェントが人間の仕事を肩代わりする今の開発現場そのものだ。エージェントに仕事を任せる側の開発者にとって、上司役のLLMの判断を疑いながら働く体験はどこか身近に映る。画面に出る「上司が間違えた回数」は、AIの承認をそのまま信じてはいけないという実務にも通じる教訓を、遊びの形で示している。ブラウザだけで遊べる手軽さもあり、SNSでの言及が広がった。まずは気軽に触ってみて、AI上司の指示のどこがおかしいかを探す楽しみ方が合いそうだ。どのようなモデルを使い、どこまで遊べるのかといった詳細は、公開されている紹介ページやリポジトリで確認するのが確実だ。話題になったばかりの段階では、遊んだ人の感想もこれから増えていくとみられる。","2026-11-23","gitwal","https://gitwal.com/"],["Macで動く無料のAIコーディングCLI Localcode","Macでオープンなモデルだけを使って動く、エージェント型コーディングCLI「Localcode」がHacker Newsで話題になっている。クラウドもサブスクリプションもAPIキーも不要で、1つのコマンドで導入できる。QwenやGemma、Inklingなど12のオープンモデルからMacのメモリに合うものを自動で選び、ファイル編集やテスト実行、Web検索までこなす。ダウンロード後はオフラインでも使える。","\n【概要】Localcodeは、Mac向けのオープンソースのエージェント型コーディングCLIだ。オープンモデルを完全に自分のMac上で動かし、クラウドもサブスクリプションもAPIキーも使わない。1コマンドで導入でき、ダウンロード後はオフラインで動作する。\n【背景】日常のコーディングは、近い将来、手元のハードウェアで動くオープンモデルでまかなえるようになるという考えから作られた。4月から開発が始まり、11月23日にHacker Newsに投稿されると66ポイントと19件のコメントを集めた。モデル選びやサーバー設定の手間をなくし、「とにかく動く」ことを目指している。\n【詳細】LocalcodeはQwen、Gemma、Inklingなど12のオープンモデルを用意し、Macのメモリ（16GB以上）に合う最適なモデルを自動で選ぶ。エージェントはファイル編集、テストやコマンドの実行、Web検索を行い、スクリーンショットを貼ればGemma、Qwen、Inklingのビジョンモデルが読み取る。他のアプリもOpenAI互換APIで同じモデルを使える。速度面では、モデル作成者のドラフトモデルで返信が約2倍速くなり、ファイル書き換えは3.5倍から4倍速いという。\n【ポイント・注意点】セキュリティ面の注意がある。ファイルツールはプロジェクト外の読み書きに承認を求めるが、シェルコマンドはコマンド文字列に書かれたパスしか検査せず、スクリプト経由では迂回できる。作者自身、「間違い防止のガードであり、セキュリティ境界ではない」と説明し、本格的な隔離にはsandbox-execや仮想マシンの利用を勧めている。試す際は、信頼できるプロジェクトの範囲で使うのがよい。\nLocalcodeの開発は4月に始まり、広く公開するまでに使い勝手と性能を磨いてきたという。新しいオープンモデルが出ると、数日のうちに設定済みの状態で追加される。リリースのたびにすべてのモデルで読み込みや会話、ツール呼び出し、画像の動作をテストしてから出荷する体制も、信頼性を支えている。Hacker Newsの議論では、画像への対応やIDEとの連携、スキルの持ち込みといった要望も寄せられた。Macでローカルモデルを試したい人にとって、手軽な入口になるツールだ。","2026-11-23","Hacker News","https://news.ycombinator.com/item?id=50604540"],["開発者とAIの共同作業場plannotatorが急伸","開発者とAIエージェントが同じ作業場で計画や仕様をやり取りする「plannotator」が、GitHubの週間トレンドで注目を集めている。計画書や仕様、Markdown、HTMLといった成果物に注釈を付け、審査やフィードバックを1か所に集約できる。Claude CodeやCodex、OpenCode、Obsidianに対応し、週間で約2,815スター増えて累計1万4,422スターに達した。","\n【概要】plannotatorは、開発者とAIエージェントが共用する協作ワークスペースだ。計画、仕様、Markdown、HTMLなどの対話型の成果物に注釈を付け、審査とフィードバックを1か所に集められる。\n【背景】複数のAIエージェントを並行して使うと、決定やプロトタイプ、変更のやり取りがあちこちに散らばりやすい。plannotatorは専用の受信箱でそれらを集中して受け止め、開発者がまとめて確認できるようにした。2026年第48週のGitHub週間トレンドで取り上げられ、「人とAIが一緒に審査する」協作層への需要を示した。\n【詳細】対応するホストはClaude Code、Codex、OpenCode、Obsidianと幅広い。TypeScriptで開発され、Apache-2.0ライセンスで公開されている。週間で約2,815スター増え、累計は1万4,422スターになった。計画書の段階からAIの出力を人間が確認する流れを、道具として支える設計だ。\n【ポイント・注意点】便利さは、使うエージェントやチームの運用に依存する。注釈や審査の仕組みがあっても、最終的な判断は人間が行う必要がある。導入前に、普段使っているエージェントやObsidianとの組み合わせで試し、チームのレビュー手順に合うかを確かめるとよい。\nplannotatorが対応するホストには、Claude CodeやCodex、OpenCodeに加えてObsidianも含まれる。Obsidianを知識庫として使っているチームでは、仕様や設計のメモとエージェントの作業を同じ場所でやり取りできる。計画書や仕様、Markdown、HTMLといった成果物に直接注釈を付けられるため、チャットとは別に「どこについての指摘か」が明確に残る。複数のエージェントが並行して動く場面では、決定や変更の履歴が散らばりにくくなる。週間で約2,815スター増えた数字は、こうした協作の仕組みへの需要の高さを示している。まずは1つのプロジェクトで試し、チームのレビュー手順に合うかを確かめる使い方が合いそうだ。エージェントの出力を人間が確認する流れを道具で支える設計だが、最終判断は人間が行う必要がある。仕組みに任せきりにせず、注釈の内容を自分の目で読む習慣が大切だ。","2026-11-23","QNews","https://qnews.formosa.page/posts/event-github-weekly-2026-w48"],["Antigravityの状態表示を刷新するagy-powerline 2.0","Google AntigravityのCLI下部に常駐するステータスライン「agy-powerline」が、メジャーリリース2.0.0を公開した。導入と設定変更を「npx agy-powerline」の1コマンドに統合し、クォータの枯渇予測や30日間のトークン集計、推定コストと予算アラート、Gitへのリンクまで、51のウィジェットを1本のバーにまとめられる。設定ファイルは1.x系と互換性がある。","\n【概要】agy-powerlineは、Google AntigravityのCLI（agy）の下部に常駐するステータスラインのツールだ。2026年11月23日に公開された2.0.0では、導入と設定変更が「npx agy-powerline」の1コマンドに統合され、51のウィジェットと7つのプリセットを備えた。\n【背景】AIコーディングツールの利用が増えると、クォータの残量やトークン消費、推定コストを常に把握したくなる。agy-powerlineはそれらを画面下部の1本のバーに集約する道具で、1.x系の設定ファイルとの互換性を保ちながら刷新された。\n【詳細】新機能の中心は、クォータの枯渇予測で、今の消費ペースでクォータがいつ尽きるかを表示する。30日間のトークン集計は、Node.js 22.13以上の環境で組み込みのnode:sqliteを使い、AntigravityのローカルSQLiteデータベースを読み取り専用で集計する。推定コストの表示や予算アラート、エージェントの状態、キュー、環境変数、Gitへのリンクも備える。レイアウトは3種類、テーマはWCAG AA準拠の22種類とカスタムがあり、日本語を含む7言語のバー表示に対応する。\n【ポイント・注意点】30日集計を使うにはNode.js 22.13以上が必要で、バー本体はNode.js 20以上で動作する。推定コストは請求書ではなくセッションデータに基づく推定値だ。MITライセンスのオープンソースで、GitHubで公開されている。設定例が記事に載っているので、まずは自分の環境で表示を確認してから調整するとよい。\nagy-powerline 2.0.0では、対話式のエディターも刷新された。Widgets、Presets、Themes、Layout、Powerline、Settingsの6タブ構成になり、行ごとにウィジェットをグループ表示して各状態をプレビューできる。スラッシュキーでテーマやプリセットを絞り込み、スペースキーで値を切り替え、マウスクリックやスクロールにも対応する。設定ファイルを書き換えずにシナリオや端末幅を切り替えてライブプレビューできるため、試行錯誤しやすい。3種類のレイアウトとWCAG AA準拠の22テーマに加え、9種類のメータースタイルが用意されている。","2026-11-23","Qiita","https://qiita.com/wassim-azi/items/0f9b4eae22a43647920a"],["リーマン予想の証明をLeanが形式検証し話題に","数学者Levent Alpöge氏がClaudeと共同でリーマン予想の証明を発見したと発表した件で、LeanとMathlibのコミュニティが形式検証の結果を公表し、大きな話題になっている。提出された証明は約1,700万行のライブラリとしてコンパイルに成功し、独立した検査器でも確認された。ただしクレイ数学研究所の公式ページは11月22日時点で「未解決」の表示で、賞の認定とは別問題だ。","\n【概要】2026年11月20日、数学者Levent Alpöge氏がClaudeと共同でリーマン予想の証明を発見したとする声明を公開した。翌21日にはLean・Mathlibコミュニティが、形式化された命題と証明を検証したとする共同声明を出し、22日にはMITのAndrew Sutherland氏による公開検証記録も更新された。\n【背景】リーマン予想は、ゼータ関数の非自明な零点の実部がすべて2分の1になるという主張で、数学の未解決問題として知られる。今回の特徴は、証明をLeanという証明支援系で形式化し、機械的に検査できる形で提出した点だ。Hacker Newsの48時間ランキングでは、発表の投稿が2,855ポイントと2,030コメントを集めた。\n【詳細】検証の内容は段階的に分かれている。提出されたライブラリは17万5,187モジュールのコンパイルに成功し、Lean v4.33.1とMathlib v4.33.1で検証された。ライブラリのソースは約1,700万行で、依存する基本公理はpropext、Classical.choice、Quot.soundの3つだった。命題の一致はcomparator系の複数の比較で確認され、推論の検査にはLeanのカーネルに加え、nanodaやcon-leche、con-ronといった独立実装の検査器も使われた。一般化リーマン予想については、すべての法とDirichlet指標に関するDirichlet L関数が対象と明記されている。\n【ポイント・注意点】注意点も多い。MITの記録では、11月22日04:35 UTCの時点でlake comparatorの全体実行や一部のカーネル再生は進行中とされていた。クレイ数学研究所のページは11月22日時点で「Unsolved」と表示されており、ミレニアム懸賞問題の賞が認定されたわけではない。形式検証は「提出された命題の証明が規則どおりか」を確かめるもので、数学者が内容を理解する過程とは別だ。見出しだけを読んで「解決した」と断定しないことが大切だ。","2026-11-22","Qiita","https://qiita.com/sponge841841/items/22a73af83a4e3528e6bf"],["GitHub IssuesをGTD台帳にするClaude Code術","Claude Codeでのタスク管理を調べた比較記事がQiitaで公開された。公開記事やリポジトリ、公式ドキュメント16件を調べ、保存先で3つの型に分類している。筆者が実践するGitHub IssuesをGTDの台帳にする方法は、3つの型のどれとも違うという。2026年5月以降に作られた744件のIssueのうち661件がクローズ済みで、半数以上が1日以内に閉じられている。","\n【概要】Claude Codeでタスク管理をどうするか、公開記事やリポジトリ、公式ドキュメント16件を調べて整理した記事が、2026年11月22日にQiitaで公開された。調べた12件を保存先で3つの型に分け、筆者の方法と比較している。\n【背景】Claude Codeに仕事を頼む人が増える一方で、タスクをどこに置くかの流儀は人それぞれだ。Markdownファイルに置く型、TodoistやThings、Linearといった既存サービスにつなぐ型、要件定義書から開発タスクを切り出す型に分かれる。筆者はGitHub IssuesをGTDの台帳にする「/todo」というスキルを実践しており、その違いを整理した。\n【詳細】GitHub Issuesを台帳にする方法の特徴は3つある。1つ目は、台帳がコードと同じGitHub上にあり、AIがghコマンドひとつでタスクとコードの両方を読み書きできる点だ。2つ目は、AIに頼む定期作業も同じ台帳に乗る点で、週次レビューなどの定期タスクは1回ごとにIssueが作られる。3つ目は、決定を「/decide」コマンドで見直し日つきの決定ログとして残せる点だ。2026年5月以降に作られた744件のIssueのうち、クローズ済みは661件で、その52%が1日以内に閉じている。作成からクローズまでの中央値は0.81日だった。\n【ポイント・注意点】数字はあくまで筆者の個人運用の記録で、AIが起票してその場で閉じたIssueも多いため、導入前より何時間浮いたかまでは言えないと記事自身も断っている。弱点として、生活系の文脈ラベルは744件中103件にしか付いておらず、somedayが98件たまっている点も挙げられている。チームで共有したい場合や、GitLab中心の人には別の型が合う。自分の使い方に合う型を選ぶ参考になる記事だ。\n記事では、3つの型に共通する点として、朝や週次の定型をスラッシュコマンドで回すことと、確定は人間が行うことが挙げられている。型Aはgrepやdiffが使えて外部依存がない反面、スマホ入力や通知は自作が必要だ。型Bは既存アプリや通知、共有が強みだが、AIからの操作はサービスのAPIの範囲までにとどまる。型Cは実装の段取りが得意だが、生活タスクや長期の持ち越しには向かない。自分の使い方に合う型を選ぶための整理として役立つ。","2026-11-22","Qiita","https://qiita.com/saitoko/items/43b2d2251f90574a0588"],["脆弱性対応を管理者以外にも任せられる権限が登場","GitHubで、セキュリティアドバイザリの作業をリポジトリ管理者以外にも任せられるようになった。組織のオーナーがカスタムリポジトリロールに新しい権限を付与でき、脆弱性報告の受付やアドバイザリの公開、CVEの申請まで分担できる。対象は必要なリポジトリだけに絞れるため、組織全体のセキュリティマネージャーにしなくても、担当者に任せられるようになった。現場の担当者に任せやすくなった。","\n【概要】GitHubは、リポジトリのセキュリティアドバイザリに関する作業を、カスタムリポジトリロールを通じて任せられるようにした。2026年11月20日に一般提供が始まった。組織のオーナーは、担当者をリポジトリ管理者や組織全体のセキュリティマネージャーにしなくても、脆弱性対応の作業を任せられる。\n【背景】これまで、セキュリティアドバイザリの作成や非公開の脆弱性報告の対応は、リポジトリ管理者か組織全体のセキュリティマネージャーしか行えなかった。小さなチームでは権限が集中しがちで、実際にコードを保守している人に任せられない不便があった。今回の変更は、その権限を細かく分けられるようにしたものだ。\n【詳細】新しく追加された権限は4つだ。「セキュリティアドバイザリの表示」「セキュリティアドバイザリの作成・編集・管理」「非公開の脆弱性報告の受け付けとアドバイザリの終了・再開」「セキュリティアドバイザリの公開とCVEの申請」で、後ろの2つは表示または作成・編集・管理の権限が前提になる。権限は必要なリポジトリだけに割り当てられ、組織全体に広がることはない。カスタムリポジトリロールをサポートするプランで利用でき、GitHub Enterprise Cloudも含まれる。\n【ポイント・注意点】一時的なプライベートフォークからのマージには、引き続きリポジトリ管理者またはセキュリティマネージャーが必要だ。新しい権限を持つ人も、一時的なプライベートフォークを削除することはできない。機密コメントは、作成・編集・管理の権限に加えて書き込み権限も必要だ。権限を渡す前に、誰にどの範囲まで任せるかを決めておくとよい。\nこの変更は、GitHubのカスタムリポジトリロールの仕組みを活用している。組織のオーナーは、セキュリティに関する4つの新しい権限を組み合わせて、担当者に必要な範囲だけを渡せる。対象は必要なリポジトリだけに絞れるため、組織全体のセキュリティマネージャーにしなくても、現場の担当者に任せられるようになった。権限の範囲が明確に分かれているため、誰が何をできるかを管理しやすい。2026年11月20日の一般提供開始により、カスタムリポジトリロールをサポートするプランで利用できる。","2026-11-20","GitHub Blog","https://github.blog/changelog/2026-11-20-security-advisory-permissions-are-now-generally-available/"],["GHES 3.23は機密検出を社内完結・CPUのみで実行","GitHub Enterprise Server 3.23のリリース候補版が公開された。ProjectsのフィルターをORやAND、括弧で組み合わせられるようになり、AIによる機密情報の検出が社内ネットワーク内で完結するようになった。悪意あるパッケージの検出対象もnpm以外に広がり、Dependabotは新しいバージョンが出てから3日待って更新のプルリクエストを作るようになった。","\n【概要】GitHub Enterprise Server（GHES）3.23のリリース候補版が公開された。Projectsの改善、AIによる機密情報の検出、悪意あるパッケージの検出拡大、Dependabotの待機期間など、企業向けの機能がまとまって入っている。\n【背景】自社サーバーでGitHubを運用する企業では、クラウドにデータを出さずに最新のセキュリティ機能を使いたいという要望が強い。3.23は、AI機能を社内完結で動かす方向をさらに進め、リリース候補版として早期の試用とフィードバックを受け付けている。\n【詳細】注目点はAIシークレット検出だ。GitHub Secret Protectionを使う企業は、構造化されていない機密情報を自社のネットワーク内で検出できる。自己完結型の微調整モデルがアプライアンスのCPU上で動作し、GPUやホスト型のLLM、外部接続は不要で、エアギャップ環境でも使える。Projectsでは、フィルターを論理ORや明示的なAND、括弧で組み合わせて、より精確なビューを作れる。GitHub Advisory Databaseは、PyPI、Maven、RubyGems、NuGet、Go、Rust、Composerの既知の悪意あるパッケージも識別できるようになり、OpenSSFのmalicious-packagesリポジトリから情報を自動で取り込む。Dependabotは、パッケージのバージョンがレジストリに公開されてから3日待ってから更新のプルリクエストを作成する。OAuthアプリでは、8時間で期限切れになるアクセストークンとリフレッシュトークンを使えるようになった。\n【ポイント・注意点】リリース候補版のため、正式版までに仕様が変わる可能性がある。AIシークレット検出はパブリックプレビューで、変更される場合がある。アップグレード前に、リリースノートで自分の環境への影響を確認し、まず検証環境で試すのが安全だ。\nリリース候補版は、正式版の前に最新の機能を試し、感想を共有できる段階のものだ。アップグレードの前に、リリースノートで自分の環境への影響を確認しておきたい。","2026-11-20","GitHub Blog","https://github.blog/changelog/2026-11-20-github-enterprise-server-3-23-release-candidate/"],["ダッシュボードにお気に入りリポジトリをピン留め","GitHubのダッシュボードに、よく見るリポジトリをピン留めできる「Favorite repositories」が登場した。編集画面でリポジトリを検索して選ぶだけで、ダッシュボードに常駐させられる。GitHub Mobileのピン留めと同期し、両方合わせて最大25件まで登録できる。新しいダッシュボードを使っている人が対象で、2026年11月20日に公開された。","\n【概要】GitHubのダッシュボードに、お気に入りのリポジトリをピン留めできる新しい「Favorite repositories」セクションが登場した。よく開くリポジトリをダッシュボードに常駐させ、すぐに開けるようにする機能だ。\n【背景】新しいダッシュボードになってから、表示の余白が多く情報量が少ないという声があった。GitHubはダッシュボードの情報密度を上げる改善を続けており、今回は自分で選んだリポジトリを並べられるようにした。2026年11月20日に公開された。\n【詳細】使い方はシンプルだ。「Edit」または「Add repositories」を選ぶと選択画面が開き、リポジトリを検索して選択・解除する。選択したものは検索中も表示されたままで、「Save」で適用、「Cancel」で破棄できる。新しく追加したものは一覧の末尾に並ぶ。ピン留めはGitHub Mobileのピン留めリポジトリと同期し、どちらかで変えればもう一方にも反映される。登録できるのは両方合わせて最大25件で、上限を超える保存をしようとするとエラーが出て保存されない。\n【ポイント・注意点】新しいダッシュボードの体験が有効でない場合、「Top repositories」は従来のままで変わらない。25件の上限はダッシュボードとモバイルの合算なので、両方で使っている人は合計数に注意が必要だ。使い勝手の感想はGitHub Communityのディスカッションで受け付けている。まずは普段よく開く数件を登録して試すとよい。\nダッシュボードの改善は、2026年11月にも続けられている。新しいダッシュボードになってから、表示の余白が多く情報量が少ないという声があり、GitHubは一覧の表示件数を増やしたり、余白を詰めたりする調整を進めてきた。今回のお気に入り機能は、その流れの中で、自分で選んだリポジトリを常駐させられるようにしたものだ。よく開くリポジトリを自分で選べるため、毎回検索する手間が減る。GitHub Mobileとも同期するため、外出先でも同じ並びで開ける。まずは普段よく開く数件を登録して、使い勝手を確かめるのがよい。","2026-11-20","GitHub Blog","https://github.blog/changelog/2026-11-20-pin-your-favorite-repositories-to-your-dashboard/"],["Gemini 4 NeonがCopilotで一般提供に","GoogleのGemini 4 NeonがGitHub Copilotで一般提供になった。エージェント型コーディングや複数段階のツール利用、知識作業向けのモデルで、Gemini 4 Carbonに近い品質をより低いトークンコストで出せるとGoogleは説明している。対象はPro+、Max、Business、Enterpriseで、VS Codeなど幅広い画面のモデル選択欄から選べる。","\n【概要】GoogleのGemini 4 NeonがGitHub Copilotで一般提供になった。エージェント型コーディングや複数段階のツール利用、知識作業向けのモデルで、Gemini 4 Carbonに近い品質をより低いトークンコストで出せるとGoogleは説明している。対象はPro+、Max、Business、Enterpriseで、VS Codeなど幅広い画面のモデル選択欄から選べる。\n【背景】Copilotのモデル選択肢は増え続けている。用途に合わせて軽いモデルと重いモデルを使い分ける流れの中で、品質とコストの間を取る位置づけのモデルとして登場した。重い推論が必要な場面と、手早く済ませたい場面で、品質とコストの折り合いが変わるためだ。モデルが増えるほど、どれを選ぶべきか迷いやすくなる。用途に合ったモデルを選び分けることが、コストと品質の両立につながる。\n【詳細】Carbonと比べると応答の開始が速く、頼んでいない変更が少なく、コードやツール、テスト結果について根拠のない主張をしにくいという。料金は使用量に応じた提供者価格で請求される。モデルはVS Code、Visual Studio、Copilot CLI、コーディングエージェント、Copilotアプリ、github.com、GitHub Mobile、JetBrains、Xcode、Eclipseで選べる。展開は段階的で、表示されない場合はしばらく待つ必要がある。Googleによれば、Gemini 4 NeonはGemini 4 Carbonに近い品質をより低いトークンコストで出せるという。応答の開始が速く、頼んでいない変更が少なく、コードやツール、テスト結果について根拠のない主張をしにくいと説明されている。\n【ポイント・注意点】管理者はCopilot設定のモデルポリシーで利用を制御できる。既定では新しいモデルは自動で有効になるが、全体の既定を切っている場合や個別に無効化している場合は表示されない。モデル全体の一覧はCopilotのモデルに関するドキュメントにまとめられている。","2026-11-18","GitHub Blog","https://github.blog/changelog/2026-11-18-gemini-4-neon-in-github-copilot"],["CopilotにSupabaseやBoxなど8連携が追加","GitHub Copilotに8つの新しいコネクターが加わり、BoxやSupabase、Calendlyなどとつながるようになった。GitHubが検証したMCPサーバー経由で接続する公開プレビューで、既存の25以上のサービスに並ぶ。接続は一度行えばCopilotの各画面で共通して使え、ビルドの失敗原因やデータベースの設計を同じ会話の中で確かめられる。対応サービスは既存と合わせて30を超える。","\n【概要】GitHub Copilotに8つの新しいコネクターが加わり、BoxやSupabase、Calendlyなどとつながるようになった。GitHubが検証したMCPサーバー経由で接続する公開プレビューで、既存の25以上のサービスに並ぶ。接続は一度行えばCopilotの各画面で共通して使え、ビルドの失敗原因やデータベースの設計を同じ会話の中で確かめられる。\n【背景】エージェントに仕事を頼むとき、コード以外の情報が必要になる場面は多い。ビルドの失敗原因やデータベースの設計を、同じ会話の中で確かめられるようにする狙いがある。外部サービスの情報を取り込めれば、調査から修正までを一つの流れで進められる。調査から修正までを一つの流れで進められれば、道具を持ち替える手間が減る。\n【詳細】新たに加わったのはBox、Buildkite、Calendly、ClickUp、Mixpanel、Supabase、Webflow、Wixの8つ。例えば最新のBuildkiteビルドが失敗した理由をCopilotに聞き、そのまま修正を頼んだり、移行を書く前にSupabaseのスキーマを確認させたりできる。接続方法は画面ごとに用意されている。CopilotアプリではCustomize画面、Copilot CLIでは/mcpコマンドのConnectorsタブ、VS CodeではAgents画面のCustomizations、github.comではCopilotのカスタマイズページから選ぶ。\n【ポイント・注意点】BusinessやEnterpriseでは管理者がエディターのプレビュー機能のポリシーを有効にする必要がある。MCPの許可リストを個別に指定している企業では、新しいコネクターを手作業で追加しなければならない。Boxのように相手側での有効化が要るサービスもある。対応サービスはSlackやFigma、Sentryなど既存の25以上と合わせて30を超える。フィードバックはコミュニティの議論で受け付けている。","2026-11-18","GitHub Blog","https://github.blog/changelog/2026-11-18-connect-supabase-box-calendly-and-more-to-copilot"],["Team組織のリスク評価が自動実行に","GitHub Teamプランの組織で、セキュリティリスク評価が自動で実行されるようになった。管理者とセキュリティマネージャーが、漏れた認証情報やコードの脆弱性を無料の評価結果から確かめられる。評価は無料で、結果は管理者とセキュリティマネージャーが確認できる。小さな組織でも、誰も手を動かさなくても組織の現状が見えるようになる。評価は無料で提供され、結果は管理者とセキュリティマネージャーが確認できる。","\n【概要】GitHub Teamプランの組織で、セキュリティリスク評価が自動で実行されるようになった。管理者とセキュリティマネージャーが、漏れた認証情報やコードの脆弱性を無料の評価結果から確かめられる。組織のリスクの全体像も把握できる。評価は無料で、結果は管理者とセキュリティマネージャーが確認できる。\n【背景】これまでもTeamとEnterpriseの組織は無料で評価を使えたが、自分で実行する必要があった。自動化により、誰も手を動かさなくても組織の現状が見えるようになる。セキュリティの見直しは、普段の開発に追われて後回しになりやすい。自動で回る仕組みがあれば、見落としを減らせる。小さな組織では専任の担当者がいないことも多く、リスクの把握は後回しになりがちだった。\n【詳細】評価にはコードのセキュリティ評価とシークレットのリスク評価があり、漏れた認証情報とコードの脆弱性を洗い出す。結果から組織のリスクの全体像が分かり、どこから手を付けるべきかの優先順位を決められる。対象はGitHub Teamの組織で、Enterpriseには以前から同様の仕組みがあった。評価はGitHub Teamの組織を対象に自動で実行され、結果は管理者とセキュリティマネージャーが確認し、対応の優先順位を決める材料になる。漏れた認証情報が見つかれば、速やかに無効化して作り直す必要がある。評価は無料で提供される。評価の結果から、漏れた認証情報とコードの脆弱性が分かり、組織のリスクの全体像と次に何をすべきかが把握できる。評価の結果は、組織の管理者とセキュリティマネージャーが確認する。漏れた認証情報やコードの脆弱性が見つかれば、優先順位を付けて対応を進める。\n【ポイント・注意点】評価は現状の把握が目的で、見つかった問題の修正は別途行う必要がある。結果の見方や対応の進め方は、コードセキュリティとシークレットのリスク評価のドキュメントにまとめられている。評価を自分で実行する手順も同じドキュメントにあり、自動化を待たずに確かめることもできる。","2026-11-18","GitHub Blog","https://github.blog/changelog/2026-11-18-security-risk-assessments-run-automatically-on-github-team"],["チームのCopilotプラグインを既定で共有","チームで使うGitHub Copilotのプラグインを、チームの既定として共有できるようになった。チームの世話役や組織の所有者が、承認済みのエージェントプラグインをチームの既定に選べる。選んだプラグインはVS CodeやCopilotアプリ、Copilot CLIでチームのメンバーに既定で有効になる。チームの既定は任意で、設定しなくてもよい。利用できるのはCopilot BusinessとCopilot Enterpriseだ。","\n【概要】チームで使うGitHub Copilotのプラグインを、チームの既定として共有できるようになった。チームの世話役や組織の所有者が、承認済みのエージェントプラグインをチームの既定に選べる。選んだプラグインはVS CodeやCopilotアプリ、Copilot CLIでチームのメンバーに既定で有効になる。\n【背景】チームで同じ道具を使うにも、これまでは各自が設定する必要があった。入れる人と入れない人が分かれ、やり方の共有にも手間がかかっていた。チーム単位で既定を決められることで、導入のばらつきが減る。個人の設定と組織全体の方針のあいだに、チームという単位の出発点を作る狙いがある。チームで共通の土台を持てば、各自の好みはその上に重ねられる。チームで共通の土台を持てば、新しい参加者も同じ道具ですぐに始められる。\n【詳細】設定は組織のチーム画面でCustomize Copilotタブを開いて行う。Copilotに組み込まれたマーケットプレースや企業のマーケットプレース、チームが追加したマーケットプレースから、承認済みのエージェントプラグインをチームの既定に選ぶ。選んだプラグインはチームの直接のメンバーに既定で有効になり、子チームのメンバーには引き継がれない。マーケットプレースはGitHubのリポジトリから追加でき、追加したマーケットプレースのプラグインもチームの既定に選べる。メンバーは自分の側でチームのプラグインを切ることもできる。\n【ポイント・注意点】利用できるのはCopilot BusinessとCopilot Enterprise。企業や組織のポリシーがチームの選択より優先され、許可されていないマーケットプレースや、必須・禁止に指定されたプラグインはチームの既定でも変わらない。チームの既定は任意で、設定しなくてもよい。チームの既定は任意で、設定しなくても従来どおり各自でプラグインを入れられる。プラグインの詳しい仕組みはCopilotのプラグインに関するドキュメントにまとめられている。","2026-11-18","GitHub Blog","https://github.blog/changelog/2026-11-18-customize-github-copilot-for-your-team"],["プルリクエストの変化を待つgh event listen","GitHub CLI 2.105.0でGitHub Event Streamsに対応し、プルリクエストの変化を待つgh event listenコマンドが使えるようになった。ポーリングの繰り返しではなく、1つのコマンドで変化を待てる。レビュー提出や状態の変化、マージ競合、チェック完了を待て、エージェントの処理にも組み込みやすい。待機リストへの登録が要る。利用にはgh 2.105.0以上への更新が必要だ。","\n【概要】GitHub CLI 2.105.0でGitHub Event Streamsに対応し、プルリクエストの変化を待つgh event listenコマンドが使えるようになった。ポーリングの繰り返しではなく、1つのコマンドで変化を待てる。レビュー提出や状態の変化、マージ競合、チェック完了を待て、エージェントの処理にも組み込みやすい。\n【背景】プルリクエストのレビュー提出やマージを待つ処理は、これまでgh pr viewなどを繰り返し呼ぶ必要があった。CIの完了待ちやレビューの提出待ちは、スクリプトで繰り返し確認するのが一般的だった。呼び出し回数が増えるうえ、変化に気づくまで遅れが出ることもあった。エージェントの処理でも同じ無駄があり、イベント待ちの仕組みが求められていた。\n【詳細】使い方はプルリクエストのURLと待ちたいイベントを指定してgh event listenを実行するだけだ。購読を作って流れを開き、イベントを1行ずつのJSONで出力する。既定では最初のイベントで終了するため、スクリプトやエージェントの処理に組み込みやすい。--countで複数件待ち、--followで継続、--timeoutで打ち切りができる。--jqや--templateで必要な項目だけを取り出すこともできる。待てるのはレビュー提出、プルリクエストの状態や先端の変化、マージ競合、チェック完了などだ。\n【ポイント・注意点】gh eventコマンドはプレビューで、仕様が変わる可能性がある。Event Streamsへのアクセスが必要で、待機リストへの登録が要る。利用にはgh 2.105.0以上への更新が必要だ。gh pr createやgh pr view、gh run view、gh run watch、gh apiは、ポーリングの代わりにgh event listenを提案するようになった。詳しい使い方はgh eventのマニュアルとEvent Streamsのドキュメントにまとめられている。","2026-11-18","GitHub Blog","https://github.blog/changelog/2026-11-18-wait-for-pull-request-events-with-github-cli"],["GPT-6.2 AstraとSolがCopilotで利用可能に","OpenAIのGPT-6.2 AstraとGPT-6.2 SolがGitHub Copilotで一般提供になった。どちらもエージェント型コーディングとコードレビュー向けで、以前のGPT-6モデルより判断力が強いという。対象はPro+、Max、Business、Enterpriseで、VS Codeなど幅広い画面のモデル選択欄から選べる。展開は段階的で、すぐ表示されない場合もある。","\n【概要】OpenAIのGPT-6.2 AstraとGPT-6.2 SolがGitHub Copilotで一般提供になった。どちらもエージェント型コーディングとコードレビュー向けで、以前のGPT-6モデルより判断力が強いという。対象はPro+、Max、Business、Enterpriseで、VS Codeなど幅広い画面のモデル選択欄から選べる。\n【背景】Copilotのモデルは用途別に細分化が進んでいる。Astraは手軽な作業と端末での仕事、Solは複雑な作業と深いレビューと、役割を分けた2つの系統が並行して更新されている。重い推論が必要な場面と、手早く済ませたい場面で、品質とコストの折り合いが変わるためだ。モデルが増えるほど、どれを選ぶべきか迷いやすくなる。用途に合ったモデルを選び分けることが、コストと品質の両立につながる。\n【詳細】早期の検証では、どちらのモデルもコードレビューで実際の指摘を以前のGPT-6モデルより大幅に多く見つけ、使うトークンは少なかったという。AstraはGPT-6 Astraと比べて指摘が大幅に増え、エージェント型コーディングの作業を目に見えて少ないトークンで終えた。SolはGPT-6.1 Solと比べて実際の指摘をほぼ2倍見つけ、正確さは保ったという。モデルはVS Code、Visual Studio、Copilot CLI、コーディングエージェント、Copilotアプリ、github.com、GitHub Mobile、JetBrains、Xcode、Eclipseで選べる。料金は使用量に応じた提供者価格で請求される。モデルと価格の一覧はCopilotのモデルに関するドキュメントにまとめられている。\n【ポイント・注意点】料金は使用量に応じた提供者価格で請求される。展開は段階的で、すぐ表示されない場合もある。管理者はCopilot設定のモデルポリシーで利用を制御でき、既定では新しいモデルは自動で有効になる。モデル全体の一覧はCopilotのモデルに関するドキュメントにまとめられている。","2026-11-17","GitHub Blog","https://github.blog/changelog/2026-11-17-openais-gpt-6-2-astra-and-gpt-6-2-sol-now-available"],["Copilotレビューが深さを自動調整、秘密も検出","GitHub Copilotのコードレビューが、プルリクエストごとに深さを変える「Adaptive」に対応した。定型の変更は軽く、危険な変更は深く見るようになり、関連リポジトリの参照と秘密情報の検出も加わった。対象はPro、Pro+、Max、Business、Enterpriseで、Adaptiveと関連リポジトリの文脈、秘密情報の検出は公開プレビューだ。公開プレビューだ。","\n【概要】GitHub Copilotのコードレビューが、プルリクエストごとに深さを変える「Adaptive」に対応した。定型の変更は軽く、危険な変更は深く見るようになり、関連リポジトリの参照と秘密情報の検出も加わった。対象はPro、Pro+、Max、Business、Enterpriseで、Adaptiveと関連リポジトリの文脈、秘密情報の検出は公開プレビューだ。\n【背景】レビューの深さはこれまで人が設定で選ぶ必要があった。文書の修正に重いレビューをかけたり、認証まわりの変更を軽く見たりする無駄があった。変更の複雑さと危険度から深さを自動で決める狙いがある。\n【詳細】Adaptiveは変更の複雑さと危険度を見て、Lite、Balanced、Maxのいずれかでレビューする。どの深さを選んだかは各レビューに表示される。1件だけAdaptiveにするか、個人やリポジトリ、組織、企業全体の既定にすることもできる。既定の深さはBalancedのままだ。関連リポジトリの文脈では、公開リポジトリを横断して依存するコードや文書を読み、古い関数呼び出しなどを見つける。秘密情報の検出では、150以上の提携先と作った500種類以上の型に加え、形式のない秘密もモデルで見つけて指摘する。Azure DevOps向けのレビューも一般提供になった。Azure DevOps向けのレビューでは、管理者が組織やプロジェクト、リポジトリで有効にし、分岐ポリシーで自動のレビューを頼むこともできる。レビューの深さはLiteかBalancedを既定に選べ、1件ごとに変えることもできる。\n【ポイント・注意点】Adaptiveは企業や組織、リポジトリで決めた上限を超えた深さを選ばない。秘密情報の検出を使うには、リポジトリや組織の設定でCopilotのコードレビューから有効にする。レビュー結果の扱われ方はリポジトリのInsightsタブで確かめられる。Azure DevOps向けは管理者が組織やプロジェクト、リポジトリで有効にし、分岐ポリシーで自動のレビューを頼むこともできる。","2026-11-17","GitHub Blog","https://github.blog/changelog/2026-11-17-copilot-code-review-adaptive-effort-secret-detection-and-more"],["秘密情報スキャンをCopilotのレビューに組込","Copilotのセキュリティレビュー専門機能がGitHubのシークレットスキャンを実行できるようになった。開発者とエージェントが、変更をマージする前に秘密情報を見つけられる。公開プレビューだ。Copilot CLIとCopilotアプリ、Copilot SDK、Copilotコードレビューで使え、秘密情報のスキャンは既定で切れている。スキャンはSecret ProtectionのAIクレジット枠で消費される。","\n【概要】Copilotのセキュリティレビュー専門機能がGitHubのシークレットスキャンを実行できるようになった。開発者とエージェントが、変更をマージする前に秘密情報を見つけられる。公開プレビューだ。Copilot CLIとCopilotアプリ、Copilot SDK、Copilotコードレビューで使え、秘密情報のスキャンは既定で切れている。\n【背景】AIエージェントが書いた変更にも、認証情報が混ざることがある。これまではレビューの言語モデルによる検出だけだったが、GitHubの検出器も並行して動かせるようになった。秘密情報の流出は、気づくのが遅れるほど被害が広がるため、変更の段階で見つける仕組みが求められていた。\n【詳細】150以上の業界パートナーと作った500種類以上の秘密の型に加え、形式のない秘密もGitHubの専用モデルが周囲のコードから見つける。Copilot CLIとCopilotアプリではsecurity-review専門機能に委ねるか、/security-reviewを実行する。Copilot SDKではセッション作成時にSECURITY_REVIEW_FINE_TUNED_MODELの機能フラグを有効にし、GitHub認証を設定する。提供者のAPIキーだけでは足りず、統合側のOAuthアプリが発行したトークンは今のところ使えない。Copilotコードレビューでは設定で秘密情報のスキャンを入れる。レビューは変更だけを見て、履歴は探さない。スキャンはSecret ProtectionのAIクレジット枠で消費される。スキャンには追加のプランは要らず、Copilotの各画面で使える。\n【ポイント・注意点】秘密情報のスキャンは既定で切れており、入れるまでは従来の言語モデルによる検出だけが動く。VS Codeにはこの版では含まれない。SDKではGitHub認証が要り、提供者のAPIキーだけでは足りない。11月18日の追記で認証まわりの説明が補われている。詳しい仕組みはシークレットスキャンのドキュメントにまとめられている。","2026-11-17","GitHub Blog","https://github.blog/changelog/2026-11-17-secret-scanning-on-demand-for-developers-and-agents"]],"elec":[["300ドル未満で作る18自由度のロボットハンド","機械学習によるロボット制御が進んでも、器用さは依然として難しい課題だ。Mahdi氏が作ったロボットハンドは18自由度を持ちながら部品費300ドル未満に抑えたDIY作品。3Dプリントの骨格にサーボを前腕へ集約し、鋼線テンドンで指を動かす。ウェブカメラで手の動きをまねる機能も備え、安価な器用さの実験台として注目される。作り方の詳細はHackadayの記事で公開されている。","\n【概要】機械学習によるロボット制御が進んでも、器用さは依然として難しい課題だと記事は切り出す。Mahdi氏が作ったロボットハンドは、その器用さを安価に実験するためのDIY作品で、18自由度を持ちながら部品費は300ドル未満に抑えられている。ハンドは前腕まで含む作りで、部品費の安さと自由度の多さを両立させている。\n【背景】市販の器用なハンドは研究用で高価なものが多く、個人では買えない。安く作れれば、制御のアルゴリズムを試す人が増え、機械学習の研究にも裾野が広がる。記事はそうした背景から、安価なハンドの作例を紹介している。器用さはロボット研究の難所で、機械学習による制御が進んでも簡単には解けない問題として知られる。だからこそ、安価なハンドで器用さを試せる作例には意味がある。\n【詳細】骨格は3Dプリント製で、サーボは手のひらではなく前腕に配置されている。鋼線のテンドンをPTFEチューブに通して指へつなぎ、摩擦を抑えてサーボの動きを指先まで伝える。各指は左右への移動に加え、2つの関節を独立して屈曲できる。制御はArduinoボードと画面で行い、モーターの操作や短い動作シーケンスの組み立てが可能だ。ウェブカメラで手の動きを読み取り、ハンドにまねさせる基本的な機能も備えている。サーボを前腕に集めたことで、手の部分を大きくせずに指を動かせる作りになっている。\n【ポイント・注意点】部品費300ドル未満という安さが最大の魅力で、器用さの研究や実験の土台として使える。ただし記事が示すのはあくまでDIYのハンドそのもので、機械学習による制御までは実装されていない。AIと結びつけるなら、このハンドを制御対象として使う段階からが本番になる。作例として参考にする分には十分な完成度だ。18自由度という多さと300ドル未満という安さの両立が、この作例の見どころだ。テンドン駆動という古典的な仕組みを3Dプリントで手軽に再現している点も、作ってみたい人の参考になる。安価な器用さの実験台として、作例の価値は高い。","2026-11-21","Hackaday","https://hackaday.com/2026/11/21/building-a-robotic-hand-on-a-budget/"],["5台のラズパイでAI推論、初のHailo視覚回答も","分散AIプロジェクトKRXYが5台目のラズベリーパイを加えた。Hailoを載せたNode 05でQwen2-VL-2Bの制限付きパイロットが始まり、撮影したマグカップを白いセラミック製と2.56秒で答えた初の本物の視覚回答が得られた。4台のCPUノードでQwen3 1.7Bの生成を分担すると中央値は22.11トークン毎秒で、2台の約1.44倍だった。視覚の回答はストリーミングされず、まとめて返される。","\n【概要】分散AI研究プロジェクトKRXYが、5台目のラズベリーパイを加えた。Hailoアクセラレータを載せたNode 05で画像を理解するモデルQwen2-VL-2Bの制限付きパイロットが始まり、初めて本物の視覚回答が得られた。同時に、4台のCPUノードで1つのQwen3 1.7Bの生成を分担する実験も行われた。5台体制になったことで、視覚と分担の2種類の仕事が同時に進んだ。\n【背景】これまでのKRXYはテキスト専用のモデルが中心で、画像をアップロードしてもモデルが本当に見ているのかが課題だった。Part 16で能力の申告を正直にする仕組みが入り、Part 17で在庫の整理が進んだ。Part 18はその先の、実際に画像を理解させる段階に踏み込んだ。画像を理解するモデルを動かすには、アクセラレータだけでなく、適切なモデルと前処理、実行環境の組み合わせが必要だ。\n【詳細】2026年11月20日、HailoRT 5.5.0で動かしたQwen2-VL-2Bが、撮影したマグカップを「白いセラミックのマグカップ」と2.56秒で答えた。マグカップの印刷の内容までは説明しなかった点も、記事は正直に記録している。その後アクセラレータは新しいRaspberry Pi 5であるNode 05へ移され、11月21日に制限付きの本番パイロットで画像の質問に答えた。一方、Node 01から04は1つのQwen3 1.7Bの回答を分担し、中央値のデコード速度は4台で22.11トークン毎秒、2台で15.40トークン毎秒だった。4台は2台の2倍にはならず、作業者が止まると分担ジョブは失敗した。実験は12回ずつの安定したサンプルで測られている。\n【ポイント・注意点】視覚の回答はストリーミングされず、まとめて返される。画像ジョブを取り消してもHailoが約15秒間ふさがったままになる場合がある。4台の実測ゲインは約1.44倍で、分担の効果には限界があることも示された。長期の耐久試験や複数ユーザー同時の測定はまだ行われていない。","2026-11-21","Hashnode","https://hashnode.com/posts/building-krxy-five-nodes-hailo-vision-four-node-inference-part-18/6b01fd84431a706b97b3c3e6"],["AI教育をカナダ30万人へ、教育者7千人を研修","Raspberry Pi FoundationがAI教育プログラム「Experience AI」をカナダ全土へ広げる。教育者7,000人を研修し、2028年までに推定30万人の若者に届ける計画で、Google.orgから200万ドルの資金を得た。パートナーはActuaとDigital Moment。世界では6万3,000人超の教育者が研修を受け、推定600万人の若者に届いている。195か国以上、22言語以上で使われている。","\n【概要】Raspberry Pi Foundationが、AI教育プログラム「Experience AI」をカナダ全土へ広げる。教育者7,000人を研修し、2028年までに推定30万人の若者に届ける計画で、Google.orgから200万ドルの資金を得ている。パートナーはActuaとDigital Momentだ。カナダ全土への拡大は、2023年のパイロットの成果を受けたものだ。\n【背景】Experience AIは、AIについて学ぶための教育プログラムで、世界ではすでに6万3,000人を超える教育者が研修を受け、推定600万人の若者に届いている。195か国以上、22言語以上で使われている。2023年のカナダでのパイロットでは、500人の教育者が研修を受け、推定5万6,000人の若者に届いた。AIが身近になるなか、仕組みを理解し、使い方を考える教育の需要は世界中で高まっている。ラズベリーパイ財団は、そうした教育を安価な機材と教材で支えてきた。プログラムの名前はExperience AIで、若者がAIについて学ぶためのものだ。\n【詳細】今回の拡大では、パートナーのActuaとDigital Momentとともにカナダ各地の教育者へ研修を広げ、2028年までに推定30万人の若者への到達を目指す。資金はGoogle.orgからの200万ドルだ。パイロットで得た手応えを全国へ広げる形で、2025年にはユネスコの賞も受賞している。世界での広がりと比べると、カナダの30万人という目標は一国での大きな到達目標になる。資金の200万ドルは、研修の拡大に使われる。\n【ポイント・注意点】ラズベリーパイと直接結びついた工作の記事ではないが、AI教育の広がりを示す大きな動きとして紹介する。数字はいずれもFoundationの発表による推定値で、到達人数は2028年までの目標だ。日本での同様の取り組みを探すときの参考にもなる。電子工作の記事ではないが、AI教育の広がりは、ラズベリーパイを使う人のすそ野を広げる動きでもある。教育者が増えれば、教室でラズベリーパイに触れる若者も増える。今後の進み具合にも注目したい。","2026-11-20","Raspberry Pi Foundation","https://www.raspberrypi.org/blog/bringing-ai-education-to-300000-young-people-across-canada/"],["分散AIの在庫管理、467件のテスト合格","分散AIプロジェクトKRXYの第17回は、AIが「見える」ようになる前の土台作りだ。モデル在庫を源泉で見直し、5つの通常デプロイがテキスト専用であることを確認した。開発テストは467件が合格し、管理されたHailo視覚ワーカーの設計も示された。ただしこの日はラズベリーパイの再起動もHailoでの画像実行も行われていない。見直しは未マージの下書きのままだった。","\n【概要】分散AIプロジェクトKRXYの第17回は、AIが「見える」ようになる前の土台作りだ。モデル在庫を源泉で見直し、どのモデルが何ができるかを正直に申告する仕組みを整えた。開発テストは467件が合格し、管理されたHailo視覚ワーカーの設計も示された。\n【背景】Part 16では、モデルが画像を理解できると表示しながら、実際にはテキストしか扱えない問題が明らかになった。チャット画面が画像の添付を許しても、ゲートウェイが画像をモデルへ渡せなければ、見ていないのに見たような答えが返ってしまう。その誤解を防ぐには、在庫そのものの申告を正す必要があった。画像が扱えるかどうかは、モデルそのものの能力だけでなく、ゲートウェイが画像を渡せるかどうかにも左右される。申告が間違っていると、評価の結果まで汚れてしまう。\n【詳細】2026年11月19日の作業では、モデル在庫を源泉で見直した。5つの通常デプロイはテキスト専用のままであることが確認され、Open WebUI 0.12.3は視覚対応を偽と報告し、KRXY Chatはまだ古い1.0.0ビルドだった。見直しは467件の開発テスト合格まで進んだが、未マージの下書きのままで、この日はラズベリーパイの再起動もHailoでの画像実行も行われていない。モデル在庫の安全策として、能力の申告を源泉で正す考え方が示された。管理されたHailo視覚ワーカーの設計もこの回で示された。在庫の見直しは、モデルの能力を源泉で正す作業で、チャット画面の表示と実際の能力の食い違いをなくすためのものだ。\n【ポイント・注意点】この回は測定の回ではなく、申告の正確さを整える回だ。テスト合格はソフトウエアの回帰テストの結果で、画像理解の精度そのものを測ったものではない。視覚対応の実現はPart 18へつながるが、Part 17の時点ではまだ画像は動いていない。派手さはないが、評価の信頼性を守るための大事な一歩だ。モデル在庫の正直さは、分散AIの評価全体の土台になる。この回の整理が、翌日の視覚実験の土台になった。","2026-11-20","Hashnode","https://hashnode.com/posts/building-krxy-model-inventory-vision-worker-part-17/6b00061a562105ba37600da0"],["手のひらサイズの航空機レーダーにAIパイロット","Raspberry PiとRTL-SDRで航空機のADS-B信号を受け、手のひらサイズの受信コンソールに仕立てた工作だ。選んだ航空機のライブテレメトリを言語モデルへ送り、話しかけるだけで高度などを尋ねられるAIパイロットを載せている。表示はPiSugar Whisplay HATのタッチ画面で、バッテリーで携帯できる。音声認識とOllamaのモデルは別のMacで動いている。","\n【概要】Raspberry PiとRTL-SDRで航空機のADS-B信号を受け、手のひらサイズの受信コンソールに仕立てた工作だ。選んだ航空機のライブテレメトリを言語モデルへ送り、話しかけるだけで「高度は？」などと尋ねられるAIパイロットを載せている。作者はPiSugar StudioのJdaie Lin氏。\n【背景】ADS-Bは航空機が1090MHzで位置や高度などを放送する仕組みで、安価なRTL-SDRドングルとラズベリーパイで受信できる。受信ソフトのreadsbでデコードし、画面に表示する作例は多いが、ここでは音声で問いかけるAIを組み合わせ、受信機を「話せる相棒」にした点が新しい。音声で問いかける形にすると、作業中でも手を使わずに情報を得られる。\n【詳細】受信にはRTL2832UとR820TのRTL-SDRドングルを使い、1090MHzのADS-Bをreadsbで処理する。表示はPiSugar Whisplay HATのタッチ画面で、PiSugar 3 Plusバッテリーで携帯できる。操作はM5StackのジョイスティックとGroveのスクロールホイールで行い、ジョイスティックで航空機を選び、スクロールホイールで操作する。AIパイロットは、選んだ航空機のライブテレメトリをパイロット音声プロファイル付きの言語モデルへ送り、マイクとスピーカー経由で質問に答える。答えは実際のADS-Bデータに基づく。受信した信号はreadsbでデコードされ、画面に航空機の位置や高度などが表示される。\n【ポイント・注意点】音声認識とOllamaのモデルはラズベリーパイ上ではなく、別のMacで動いている。作例を再現するときは、Pi本体だけで完結するわけではない点に注意したい。ライセンス表記はない。ADS-Bの受信そのものは安価な機材で始められるため、同じ仕組みを試す人の参考になる。受信と音声AIを組み合わせた、遊び心のある応用例だ。話しかけるだけで情報を得られる形は、運転中や作業中の利用にも向いている。","2026-11-19","RTL-SDR.com","https://www.rtl-sdr.com/building-a-handheld-rtl-sdr-ads-b-console-with-an-ai-pilot-you-can-talk-to/"],["謎のビープ音をAIエージェントの「耳」で追跡","部屋のどこかで鳴る謎の断続的なビープ音を、AIエージェントに「耳」を与えて追跡した話だ。Simon Willison氏がClaude Codeで作った「Beep Locator」は、iPadやiPhoneなど予備デバイスのマイクをリスナーにして音源を三角測量し、約40センチまで絞り込んだ。犯人は箱に埋もれた古い一酸化炭素検知器の電池切れ警告音だった。エージェントが音声データを自ら集め、手法を改良した点が要点だ。","\n【概要】部屋のどこかで鳴る謎の断続的なビープ音を、AIエージェントに「耳」を与えて追跡した話だ。Simon Willison氏がClaude Codeで作った「Beep Locator」は、部屋に散らばる予備デバイスのマイクをリスナーにして音源を三角測量し、約40センチまで絞り込んだ。犯人は箱に埋もれた古い一酸化炭素検知器の電池切れ警告音だった。音源探しの実験は、エージェントが実世界のセンサーとつながる試みでもある。\n【背景】断続的に鳴る小さな電子音は、鳴った瞬間に場所が分からず、耳だけでは特定が難しい。複数のマイクで同時に聞けば、到達時間の差から場所を推定できる。Willison氏はコーディングエージェントに音声データを自ら集めさせ、手法を改良させながら音源を特定させる実験を行った。エージェントが画面の中だけでなく、実世界のセンサーとつながる試みだ。音源探しは、探知機の電池切れのように身近な原因であることも多く、見つかればほっとする。\n【詳細】使われたのはiPad 2台、iPhone、MacBook Pro、Surfaceといった手元の予備デバイスで、Web Audio API経由でマイクをリスナー化した。各デバイスが拾った音の到達差から音源の位置を推定し、絞り込みを繰り返した結果、約40センチの範囲まで特定できた。エージェントは音声データを自ら集め、手法を改良しながら進めた。箱の中に埋もれていた古い一酸化炭素検知器が、電池切れを知らせる警告音を鳴らしていた。\n【ポイント・注意点】元のWillison氏の記事は2026年11月9日のものだが、ここではHackadayの2026年11月18日の記事を出典としている。エージェントに実世界の「耳」を与え、データを集めて手法を自分で改良させる流れが要点で、家の謎の音探しにも応用できる。検知器の電池切れという結末も、身近な教訓になる。身近な機材だけで試せる点も、この実験の魅力だ。エージェントに実世界のセンサーを与える発想は、家の謎の音探しだけでなく、さまざまな計測の実験にも応用できる。","2026-11-18","Hackaday","https://hackaday.com/2026/11/18/tracking-down-a-mystery-beep-by-giving-a-coding-agent-a-few-ears/"],["4台目のラズパイがオンライン、画像対応も正直に","分散AIプロジェクトKRXYで、4台目のラズベリーパイがオンラインになった。2026年11月18日のコントロールセンターの画面では4台すべてがオンラインで、Node 04には7件のジョブが記録されていた。あわせて、モデルが画像を扱えるかを正直に申告する仕組みも整えられ、対応しない画像の要求はHTTP 422で拒否されるようになった。テストは440件が合格した。","\n【概要】分散AIプロジェクトKRXYで、4台目のラズベリーパイがオンラインになった。2026年11月18日のコントロールセンターの画面では、登録プロバイダーが4台、すべてオンラインと表示され、Node 04には7件のジョブが記録されていた。あわせて、モデルが画像を扱えるかどうかを正直に申告する仕組みも整えられた。\n【背景】これまでKRXYには3台のプロバイダーしかおらず、4台目は準備中のままだった。18日夜の画面は、Node 04が実在の登録プロバイダーであることを示した。もう一つの課題は、テキスト専用のモデルなのに画像添付ができてしまう点で、見ていないのに見たような答えが返るおそれがあった。分散AIでは、どのノードが本当に動いているか、そして各モデルが何ができるかを正しく把握することが、評価の前提になる。申告が誤っていれば、測定の結果も意味を失う。\n【詳細】11月18日20時1分ごろの画面では、Node 01はPi 5にHailo-10Hを載せて349件、Node 02は299件、Node 03は36件、Node 04はPi 5で7件のジョブが表示され、すべてSSD約238.5ギガバイト、ハートビートは約1秒前だった。画面は18日夜のもので、4台すべてが生きていることが確認できた。17日にマージされたPR #31では、モデルの一覧にmodalitiesの申告が加わり、現行モデルはテキスト専用と明示された。対応しない画像の要求はHTTP 422で拒否され、KRXY Chatは画像の添付や貼り付け、送信を止める。\n【ポイント・注意点】7件のジョブ数は成功を証明するものではなく、Node 04が封印済みイメージから起動したかも未確認だ。テストは440件のプラットフォームテストと21件のチャットテストが合格したが、視覚の精度を測ったものではない。能力の申告と実際の能力を分けて考える姿勢が、この回の要点だ。この整理があってこそ、翌日のPart 18で初めての視覚回答が意味を持った。4台体制が整ったことで、分散AIの実験の幅も広がった。","2026-11-18","Hashnode","https://krxy.hashnode.dev/building-krxy-four-nodes-online-image-capabilities-part-16"]],"muse":[["Claude Codeの自動実行「ルーチン」、3つの起点でPCなしでも動く","AnthropicのClaude Codeに、クラウド上でタスクを自動実行する「ルーチン」が加わったことを紹介する11月23日の記事です。プロンプトと対象のリポジトリ、コネクターを一度決めておけば、決まった時刻やAPIの呼び出し、GitHubの出来事をきっかけに、PCを閉じた状態でも作業が進みます。対話型の道具から、24時間体制で働く相方への変化を伝える内容です。","\n【概要】AnthropicのClaude Codeに、クラウド上でタスクを自動実行する「ルーチン」が加わったことを紹介する記事です。プロンプトと対象のリポジトリ、コネクターを一度決めておけば、決まった時刻やAPIの呼び出し、GitHubの出来事をきっかけに、PCを閉じた状態でも作業が進みます。対話型の道具から、24時間体制で働く相方への変化を伝える内容です。\n【背景】これまでのClaude Codeは、開発者がターミナルを開いて指示を出すときにだけ動く道具でした。毎朝の定型業務や夜間の点検を回すには、自分のPCを動かし続けたり、cronや外部の仕組みを自分で組んだりする必要がありました。ルーチンは、その手間をAnthropicのクラウド側へ移し、決めた作業を決めたきっかけで自動で走らせるための機能です。\n【詳細】起動のきっかけは3種類です。スケジュールは毎晩2時のように日時で決め、APIはルーチンごとの専用URLへHTTPリクエストを送って起動し、GitHubはプルリクエストの作成や更新、リリースの発行といった出来事で起動します。夜間の未処理イシューの整理、PRの自動レビュー、監視アラートを受けての原因調査と修正案の作成、別言語のリポジトリへの変更の移植といった使い方が例として挙げられています。利用できるのはPro、Max、Ultra、Team、Enterpriseの有料プランで、Web版の利用権も要ります。プランごとに1日の実行回数の上限があり、Proは5回、Maxは15回、TeamとEnterpriseは25回までとされています。生成したコードのプッシュ先は、既定では「claude/」で始まる専用ブランチに限られ、メインブランチへの直接の上書きを防ぐ設計です。\n【ポイント・注意点】この記事の公開日は11月23日ですが、ルーチン自体の発表は記事によれば2026年4月14日で、機能の紹介として読むのが正しい見方です。定期実行は便利な反面、実行のたびに利用枠を使うため、頻度と1回あたりの重さを見積もってから仕込む必要があります。無人で動く以上、どこまでを任せ、人の確認をどこに残すかを先に決めておくと安心です。","2026-11-23","note","https://note.com/natty_toucan386/n/n7a9b4057ba04"],["今日のClaude Code 11月23日、秘密ファイルは拒むルールで読ませない","毎朝のClaude Codeの動きをまとめる連載の11月23日版です。週末は新しい版も公式の知らせもなく、最新は2.1.330、安定版は2.1.323のまま。今日の一手は、.envなどの秘密のファイルをClaudeに読ませないための拒むルールの書き方で、.claudeignoreでは防げないという注意点とともに解説されています。秘密のファイルの扱いは、連続稼働の安全を左右する基本です。","\n【概要】毎朝のClaude Codeの動きをまとめる連載の11月23日版です。週末は新しい版も公式の知らせもなく、最新は2.1.330、安定版は2.1.323のままです。今日の一手は、.envなどの秘密のファイルをClaudeに読ませないための拒むルールの書き方で、.claudeignoreでは防げないという注意点とともに解説されています。\n【背景】Claude Codeは作業フォルダの中身を広く読むため、APIキーやパスワードの入った秘密のファイルまで目にしかねません。毎朝の連載は、公式の更新履歴や脆弱性の知らせ、障害の知らせを全部見て、その日にできる一手を選んでいます。11月23日は週末をまたいだ月曜で、新しい版も公式の知らせもなく、静かな週末だったとまとめられています。\n【詳細】今日の一手は、設定のpermissions.denyにRead(./.env)やRead(./secrets/**)のように書いて、秘密のファイルの読み取りを拒むことです。手引きによれば、Readの拒むルールは、Claudeのファイルを読む道具や、@で指したファイル、IDEが渡す選択にも効きます。.claudeignoreというファイルは効かないため、そこに書いているなら中身をReadの拒むルールに移すよう促しています。組織で配るならmanaged settingsに書くと、プロジェクトの設定の書き方では外せないとも書かれています。最新版は11月21日4時16分に出た2.1.330で、安定版は11月13日の2.1.323のままです。\n【ポイント・注意点】Bashの命令で読むのをすべて止められるとは限らないため、命令から守るにはサンドボックスの読む範囲の設定も使うよう注意されています。拒むルールは「読ませない」ためのもので、すでに会話に渡した内容を取り消すものではありません。秘密のファイルは、そもそも作業フォルダの外に置くか、環境変数で渡す運用と組み合わせるのが安心です。設定は一度書けば毎回効くため、早めに入れておくのが得策です。","2026-11-23","Data is CITY","https://teleport.jp/dataiscity/daily/claude-code/"],["Claude CodeがMCPに対応、数百の外部ツールとつながる時代へ","2026年11月、Claude Codeがオープン規格のMCPを通じて数百の外部ツールやデータソースとつながるようになったことを解説する11月23日の記事です。データベースやAPI、ドキュメント管理と直接やり取りできるようになり、AIがコード生成器から開発全体を束ねる存在へ変わると説きます。OpenAIのGPT-6.2世代との競合もあわせて紹介されています。","\n【概要】2026年11月、Claude Codeがオープン規格のMCPを通じて数百の外部ツールやデータソースとつながるようになったことを解説する記事です。データベースやAPI、ドキュメント管理と直接やり取りできるようになり、AIがコード生成器から開発全体を束ねる存在へ変わると説きます。OpenAIのGPT-6.2世代との競合もあわせて紹介されています。\n【背景】これまでの開発用AIは、エディタの中のコードしか見られず、GitHubの課題や社内の文書といった外部の情報は、人がコピーして貼るしかありませんでした。MCPは、AIと外部データをつなぐためのオープンソースの標準規格で、Anthropicのドキュメントによれば2026年11月20日に公開された内容として、Claude Codeがこの規格で数百の外部ツールとつながるとされています。\n【詳細】MCPサーバーを介することで、Claude Codeはローカルのファイルだけでなく、リモートのデータベースやAPI連携の道具ともつながります。APIの文書を参照しながらコードを書いたり、外部からエラーログを取ってきて直したりといった動きが、標準化された規格の上でできるようになります。2026年1月には、エージェント機能をデスクトップへ持ち込むCoworkも発表されており、隔離された仮想マシンの中でローカルファイルへのアクセスやMCP統合を動かす基盤になっています。一方、OpenAIは11月17日にGPT-6.2 AstraとSolを発表し、ChatGPT WorkやCodexで使えるようにしました。Solは最新のベンチマークFrontierCode 2.0で、修正なしで取り込める変更の生成に高い精度を示したとされています。\n【ポイント・注意点】この記事には生成AIによる自動生成である旨の免責が付いており、細かい判断は一次情報で確かめる必要があります。MCPでつなぐ先が増えるほど、どの情報までAIに見せるかの線引きが大事になります。隔離された環境での実行や、接続先の選び方を先に決めておくと、便利さと安全さを両立しやすくなります。","2026-11-23","VERSAROC","https://www.versaroc.co.jp/ja/blog/claude-code-mcp-integration-external-tools-expansion-1795392061600"],["Claude Codeの世間の声、週の利用枠の枯渇が一番の不満","Hacker NewsやReddit、開発者向けのWeb全体からClaude Codeへの反応を集めた、11月23日時点の調査まとめです。一番大きな不満は週の利用枠が数日で枯渇すること。1994年製ジープのECUをClaude CodeとCodexで解析した動画が457ポイントを集めたほか、周辺ツールの増加や、悪意ある拡張機能の問題、認証の不具合なども整理されています。","\n【概要】Hacker NewsやReddit、開発者向けのWeb全体からClaude Codeへの反応を集めた、11月23日時点の調査まとめです。一番大きな不満は週の利用枠が数日で枯渇すること。1994年製ジープのECUをClaude CodeとCodexで解析した動画が457ポイントを集めたほか、周辺ツールの増加や、悪意ある拡張機能の問題、認証の不具合なども整理されています。\n【背景】Claude Codeは広く使われるようになり、使い方の工夫だけでなく、不満や困りごともあちこちに書き込まれるようになりました。この調査は、過去30日ぶんのHacker NewsとGitHubの投稿22件をもとに、11月23日朝の時点で何が話題になっているかをまとめています。公式の発表や声明はなく、利用者の声が中心です。\n【詳細】最も声が大きいのは利用枠の話です。Max 5xの週の利用枠がリセットから48時間以内に94%まで減ったというGitHubの不具合報告があり、Teamの利用者もリセットから約30.5時間で100%に達したと報告しています。Ultraでも、11月の第1週から2日で枯渇するとの声があります。一方で最も評価されたのは、Claude CodeとCodexが3ドルのArduinoで1994年製ジープのECUを解析した動画で、457ポイントと244件のコメントを集めました。周辺では、複数のエージェントを1つのチームとして動かすThrumや、Claude Codeに長く使える記憶を付けるMemro、利用枠を追うToken Economyといった道具が次々に出ています。問題としては、持続的なSSHの裏口を持つ悪意あるClaude Code風の拡張機能の事後分析や、WindowsでのClaude in Chromeの403エラー、認証が変わったという警告の繰り返しなどが挙げられています。\n【ポイント・注意点】利用枠の枯渇は利用者の報告で、原因が公式に確かめられたものではありません。重い使い方をする人は、残量をこまめに見る習慣が要ります。周辺ツールの多くは公開されたばかりで反応も少ないため、実績のある道具として扱うのではなく、動きの兆しとして見るのが無難です。","2026-11-23","last30days.ai","https://www.last30days.ai/research/claude-code"],["Claude CodeのHooks保存版、危険な操作を仕組みで止める","Claude Codeのフック機能を、コピーして使える形でまとめた11月23日のはてなブログ記事です。危険なコマンドを止めるPreToolUse、編集直後に整形するPostToolUse、完了時に通知を出すStopとNotificationの3つを設定します。CLAUDE.mdへの「お願い」はAIの判断を通るため守られないことがあり、フックで「確実」に変えるという考え方が中心です。","\n【概要】Claude Codeのフック機能を、コピーして使える形でまとめた記事です。危険なコマンドを止めるPreToolUse、編集直後に整形するPostToolUse、完了時に通知を出すStopとNotificationの3つを設定します。CLAUDE.mdへの「お願い」はAIの判断を通るため守られないことがあり、フックで「確実」に変えるという考え方が中心です。\n【背景】Claude Codeに「git push --forceはしないで」「編集後は整形して」と頼んでも、長い作業の中では忘れられたり省略されたりします。フックは、Claudeの判断を通さず、決まったタイミングで必ずシェルコマンドを実行する仕組みで、記事の筆者は最初こそ利点を感じなかったものの、ルールを守らせる手段と捉え直して導入したと書いています。\n【詳細】設定するのは3つのスクリプトです。block.shはPreToolUseで動き、rm -rf /やgit push --force、DROP TABLEといった操作を、終了コード2を返して実行前に止めます。日常的なrm -rf./node_modulesは通し、致命的なものだけを止める書き方にしています。format.shはPostToolUseで動き、編集されたファイルの拡張子に応じてprettierやruff、black、gofmt、shfmtで整形します。notify.shはStopとNotificationで動き、作業の完了時や確認待ちのときにmacOSの通知を出します。登録先は~/.claude/hooksで、設定は~/.claude/settings.jsonに書きます。フックには標準入力でJSONが渡され、jqでコマンドやファイルの場所を取り出します。\n【ポイント・注意点】スクリプトは単体でテストしてから登録し、settings.jsonはバックアップを取ってから書き換えるよう案内されています。同じイベントのフックがすでに登録されている場合は置き換わるため、元の設定の確認が必要です。フックを増やしすぎると何が自動で動いているか分からなくなるため、危険な操作のブロックのように効き目のはっきりしたものから入れるのが無難です。","2026-11-23","はてなブログ","https://kazukichi0914.hatenablog.com/entry/2026/11/23/200000"],["Claude Code 2.1.330、定期タスクと/loopが7日から30日に","Claude Codeの2.1.330を解説する11月23日のフランス語記事です。11月20日に公開されたこの版で、定期タスクと/loopの実行期間が7日から30日に延び、Enterprise Admin Consoleで管理される組織へのサインインが加わり、破壊的なrmコマンドの承認が厳しくなりました。グラフを描く組み込みmodのeaselや、VS Code拡張の新機能も紹介されています。","\n【概要】Claude Codeの2.1.330を解説する11月23日の記事です。11月20日に公開されたこの版で、定期タスクと/loopの実行期間が7日から30日に延び、Enterprise Admin Consoleで管理される組織へのサインインが加わり、破壊的なrmコマンドの承認が厳しくなりました。グラフを描く組み込みmodのeaselや、VS Code拡張の新機能も紹介されています。\n【背景】Claude Codeを長く動かす運用では、定期タスクが1週間で止まることが手間になっていました。デプロイの見張りや毎日の定型作業を任せるには、人がいちいち作り直す必要がありました。2.1.330は、そうした長時間の自動化を支える方向へ、期間の延長と承認の厳格化をあわせて進めた版です。\n【詳細】一番目立つのは、定期タスクと/loopが、セッションが動き続けている限り最長30日まで動くようになったことです。ただし、この版より前に作ったタスクは7日のままなので、30日にするには作り直す必要があります。Enterprise Admin Consoleで管理される組織には、claude auth loginのあとに組織の設定やクラウドプロバイダー、ゲートウェイが自動で適用されるサインインが加わりました。easelは、頼まれたときやMCPのメトリクス結果の下にグラフを描く組み込みmodで、ProとMax、提供されている場合はTeamとEnterpriseで、macOSとLinuxが対象です。自動のグラフは/configで切れます。rmコマンドは、ルートやホーム、作業フォルダを狙うものが承認の対象に広がり、答える人がいない無人の実行では拒否されるようになりました。VS Code拡張には、会話を分岐させる/forkや、実行中のワークフローを一覧する/workflowsなどが加わっています。\n【ポイント・注意点】30日への延長は、既存のタスクには適用されない点に注意が必要です。rmの承認強化は、CIなどの無人のパイプラインで作業フォルダを消す処理を任せている場合、止まる原因になります。版を上げる前に、定期タスクの作り直しと、無人のスクリプトの見直しを済ませておくと安心です。","2026-11-23","Mail Studio","https://www.mail-studio.com/ia/claude-code-2-1-330-taches-30-jours/"],["Claude Codeの11月22日まとめ、常時稼働エージェントの6要素","Claude Codeの日々の動きをまとめる11月22日のブリーフィングです。この日は新規リリースがなく、最新版は11月20日のv2.1.330のまま。Anthropicが公開した常時稼働エージェントの設計ガイドを取り上げ、VS Codeの/workflowsコマンドや/config検索の改善、11月20日から22日まで3日連続で新規インシデントがなかったサービス状況などがまとめられています。","\n【概要】Claude Codeの日々の動きをまとめる11月22日のブリーフィングです。この日は新規リリースがなく、最新版は11月20日のv2.1.330のままです。Anthropicが公開した常時稼働エージェントの設計ガイドを取り上げ、VS Codeの/workflowsコマンドや/config検索の改善、11月20日から22日まで3日連続で新規インシデントがなかったサービス状況などがまとめられています。\n【背景】11月20日に出たv2.1.330は変更が多く、前日のブリーフィングで主な内容は紹介済みでした。11月22日は新しい版もなく、公式ブログの直近の投稿も11月17日のものまでで、11月18日から22日の間に新しく発表された製品やモデルの機能はありません。そのため、この日のブリーフィングは、公式の設計ガイドやサービスの状態、コミュニティの話題を中心にまとめています。\n【詳細】中心は、Anthropicが公開した常時稼働エージェントを構築する6つの要素です。イベント受信箱、タイマー、メモリ、コンテキスト管理、権限、送信箱の6つで、セッションが終わっても文脈を保ち、監督なしに出来事が起きるたびに動く仕組みが説明されています。長期コーディングのベンチマークで、Opus 5.5がOpus 5より解決タスク1件あたりのコストを78%低減したことも、こうした実装が現実的になった背景として挙げられています。v2.1.330の話題では、VS Codeで実行中のワークフローを一覧する/workflowsコマンドと、/configの検索で入力した文字で始まる設定を先に表示する改善が紹介されています。サービスの状況は、11月19日に解決した2件のインシデント以降、11月20日から22日まで3日連続で新規の報告がなく、すべての部品が正常と表示されています。\n【ポイント・注意点】常時稼働の設計では、無人で動く権限に使う認証情報を外部プロキシから注入し、承認が必要な呼び出しはセッションを保留して回答を待つ、という分離が大事だとされています。通知は最初は控えめに始めることも勧められています。新しい版がない日も、こうした設計の読み物を先に読んでおくと、版が来たときにすぐ試せます。","2026-11-22","Claude Code デイリーブリーフィング","https://claude-news.today/ja/briefings/briefing-2026-11-22/"],["Claude Codeのeaselとは、グラフを描く組み込みmodの条件と止め方","Claude Code 2.1.330で加わった、グラフを描く組み込みmod「easel」を解説する記事です。頼めば表や道具の結果をグラフにし、PrometheusやDatadogなどの時系列の結果には頼まなくても描きます。Mac miniで13本の定期ジョブを無人で回す筆者が、使える条件と4段階の止め方を、公式の更新履歴とドキュメント、公開ソースの3か所で確かめてまとめています。","\n【概要】Claude Code 2.1.330で加わった、グラフを描く組み込みmod「easel」を解説する記事です。頼めば表や道具の結果をグラフにし、PrometheusやDatadogなどの時系列の結果には頼まなくても描きます。Mac miniで13本の定期ジョブを無人で回す筆者が、使える条件と4段階の止め方を、公式の更新履歴とドキュメント、公開ソースの3か所で確かめてまとめています。\n【背景】Claude Codeを更新したら、MCPの結果の下に勝手にグラフが出るようになり、easelという見慣れない名前が/pluginに並ぶようになりました。組み込みのmodは利用者が入れるものではなく、条件を満たせば最初から入っています。便利な反面、どこで動き、どう止めるかが分からないと、無人の運用では不安が残ります。\n【詳細】easelは、頼まれたときにClaudeがmcp__easel__chartという道具を呼んで描くほか、PrometheusやDatadogのようなメトリクスのサービスの答えや、Grafanaの時系列のフレームには頼まなくても折れ線グラフを出します。描ける形は折れ線、縦棒、小さな推移の帯、横棒、内訳の棒の5種類です。使える条件は、claude.aiのサブスクリプションでのサインイン、2.1.321以上、macOSかWSLの外のLinuxです。止め方は4段階あり、自動のグラフだけなら/configのAuto charts、特定のサーバーだけならservers to skip、道具ごとなら/pluginで無効にし、組織としてはMCPの許可リストや拒否リストで外します。--bareや--safe-mode、disableAllHooksでは組み込みのmodは止まらないことが、ドキュメントに明記されています。\n【ポイント・注意点】claude -pのヘッドレスのセッションには、グラフの道具そのものが渡らないため、無人のジョブ側で変えることはないと筆者は判断しています。グラフにした中身が分析の記録として送られる心配については、データの文字は送らず、系列の数や点の数など3つの数字だけが2のべき乗に切り下げて送られると、READMEの説明が紹介されています。版を上げる前に、止め方を知っておくのが安心です。","2026-11-22","Claude Code for Business","https://fyve.co.jp/claude-code/articles/claude-code-easel"],["サブエージェントに調査を丸投げ、本体の文脈を汚さない型","Claude Codeのサブエージェントに調査を丸投げする型を解説する11月22日のZenn記事です。調べものは別窓のエージェントに投げ、本体には要約だけを持ち帰らせることで、読んだファイルの中身が文脈に積もるのを防ぎます。組み込みのExploreやPlan、自作エージェントの定義ファイル、読み取り専用の調査エージェントの作り方が紹介されています。本体の文脈を温存する実践的な型です。","\n【概要】Claude Codeのサブエージェントに調査を丸投げする型を解説する記事です。調べものは別窓のエージェントに投げ、本体には要約だけを持ち帰らせることで、読んだファイルの中身が文脈に積もるのを防ぎます。組み込みのExploreやPlan、自作エージェントの定義ファイル、読み取り専用の調査エージェントの作り方が紹介されています。\n【背景】コードベースの調査を本体の会話でやると、読んだファイルの中身がそのまま文脈に積もり、やがて本題の指示が埋もれてしまいます。サブエージェントは、自分の文脈ウィンドウと専用のシステムプロンプト、使えるツールの範囲、独立した権限を持って動き、作業が終わると結果の要約だけを本体に返します。\n【詳細】組み込みのサブエージェントは3種類です。Exploreはコードベースの検索と理解に特化した読み取り専用で、徹底度をquick、medium、very thoroughの3段階で指定します。Planは計画を出すための下調べをする研究エージェントで、こちらも読み取り専用です。general-purposeは調査と変更の両方が要る複雑な作業を扱います。自作のサブエージェントは、YAMLのフロントマター付きMarkdownファイルで、.claude/agents/に置けばプロジェクト単位、~/.claude/agents/に置けばユーザー単位で使えます。記事では、影響範囲の調査専用エージェントの例として、toolsをRead、Grep、Globだけに絞り、modelにhaikuを指定した定義が示されています。投げ方は、@で名前を指定して呼ぶ方法と、Agentツールでsubagent_typeを指定する方法があります。独立した調査が複数ある場合は並行して投げ、依存関係があるものは直列にします。\n【ポイント・注意点】サブエージェントの実行は本体の会話と同じ利用枠を消費するため、投げる価値のある調査に絞るのが前提です。返ってきた要約を鵜呑みにせず、重要なファイルは本体で開いて確認することも勧められています。増やすのは1つずつにし、効いていることが確認できてから足すのが無難です。","2026-11-22","Zenn","https://zenn.dev/aizangyobu/articles/claude-code-subagent-chousa"],["AIに読ませる「第2の脳」、Markdownとgitで4か月育てた記録","個人でAndroidアプリを作る筆者が、Claude Codeに過去の判断を思い出させる「SecondBrain」をMarkdownとgitで育てた4か月の記録です。日記・今の正・索引の3層に分け、調べたことは書き換える決まりや、危ない操作の直前に過去の失敗を差し込む引き金の表、確かめていない事へのの印など、数字とともに効いた所と効かなかった所がまとめられています。","\n【概要】個人でAndroidアプリを作る筆者が、Claude Codeに過去の判断を思い出させる「SecondBrain」をMarkdownとgitで育てた4か月の記録です。日記・今の正・索引の3層に分け、調べたことは書き換える決まりや、危ない操作の直前に過去の失敗を差し込む引き金の表、確かめていない事へのの印など、数字とともに効いた所と効かなかった所がまとめられています。\n【背景】開発のほとんどを複数のタブで動かしているClaude Codeに任せている筆者は、前にどうしたか、何で失敗したかを思い出させるために、SecondBrainというフォルダを作りました。2026年7月26日の最初のコミットから、記事を書いている11月22日までの約4か月の記録です。AIが読むための長期記憶で、人が読むことは考えていません。\n【詳細】中身は3つの層に分かれています。L0の日記はその時の生の記録で追記のみ、L1の今の正は調べた事や失敗、TODOなどで、変わったら追記せず書き換えます。L2の索引は、どのファイルに何があるかの表です。読み書きは自作のPythonの道具sb.pyを通し、7月27日から11月22日22時50分までで、findは4,948回、showは1,526回でした。9月8日には引き金の表を足し、Claude CodeのフックでAIが打とうとしているコマンドを正規表現に当て、当たったら短い注意と失敗の記録の場所を文脈に差し込みます。表は29行あり、差し込まれた記録は1,770件でした。確かめていない事にはの印を付け、今は464件あります。SecondBrainに触れたコミットは2,897件、Markdownのファイルは634個です。\n【ポイント・注意点】一番効いたのは「L1は書き換える」という決まりで、古い記述と新しい記述が並ばないため、AIが当たった節を読めばそのまま今の状態として使えます。一方で、引き金の表は出しすぎると読まれなくなる心配があり、差し込まれた1,770件のうち753件は、毎日何度も打つ同じ送信コマンドに当たる2つの引き金でした。の印も増える一方で、棚卸しの手間がかかります。AIの記憶で困るのは、覚えていないことより古い事を自信を持って言うことだ、というのが筆者の結論です。","2026-11-22","Zenn","https://zenn.dev/hiroxasobiba/articles/secondbrain-ai-memory-layers"],["Claude Codeの/code-reviewの使い方、バグ探しはバグだけに","Claude Codeの/code-reviewコマンドの使い方を、2026年11月22日に公式情報と照合して解説する記事です。ブランチの変更やPRのバグを探し、--fixで直し、--commentでPRに書き込む基本から、2.1.328で指摘がバグとCLAUDE.mdの決まりへの違反に絞られた変化、クラウドで深く探すultraとの違いまで、16項目の目次でまとめられています。","\n【概要】Claude Codeの/code-reviewコマンドの使い方を、2026年11月22日に公式情報と照合して解説する記事です。ブランチの変更やPRのバグを探し、--fixで直し、--commentでPRに書き込む基本から、2.1.328で指摘がバグとCLAUDE.mdの決まりへの違反に絞られた変化、クラウドで深く探すultraとの違いまでまとめられています。\n【背景】/code-reviewは、Claude Codeに最初から入っているスキルで、会話の中で打つと今のブランチの変更を読んでバグを探してくれます。2026年11月19日に出た2.1.328と2.1.329で、多くのモデルでは指摘の出し方が変わり、整理の提案は/simplifyに分けられました。この記事は、その変化を公式の説明やコマンドの一覧、CHANGELOGと照らし合わせて整理しています。\n【詳細】何も渡さないときは今のブランチの変更を見ます。2.1.329からは、多くのモデルでブランチ全体を既定のブランチと比べて見るように変わりました。PRの番号を渡すとgh pr diffでPRの差分を読み、--fixで直し、--commentでGitHubのPRに行ごとのコメントとして書かせます。レビューは裏で動くサブエージェントとして走り、自分の会話とは別の文脈を使うため、会話が長くなりません。細かさは/lowから/maxまでの努力の度合いで変え、数は--max-findingsで変えます。/code-review ultraはAnthropicのクラウドの隔離された環境で複数のエージェントが深く探し、指摘を1つずつ再現して確かめます。料金は追加の利用分から払い、Pro、Max、Ultraでは3回まで無料です。\n【ポイント・注意点】--fixの直しは/rewindで戻らないことがあり、ほかのファイルの直しはgitで戻す必要があります。Claudeが自分から走らせることがあるため、自分が打ったときだけ走らせたいならskillOverridesでuser-invocable-onlyにします。code-reviewという名前の自分のスキルを作るとそちらが代わりに動く点にも注意が必要です。","2026-11-22","Claude Code 使い方ガイド","https://claudecode.blueai.jp/blog/claude-code-code-review"],["Claude Code v2.1.330の主要更新、easel追加と142件の変更","Claude Codeのv2.1.330を解説する11月21日のクラスメソッド記事です。142件の変更のうち、チャートを描く組み込みmod「easel」の追加、Enterprise Admin Consoleで管理される組織へのサインイン、定期タスクと/loopの30日への延長、deniedMcpServersの挙動変更、rmコマンドの承認拡大が中心です。破壊的変更6件への対応も含め、設定の見直しが必要な点がまとめられています。","\n【概要】Claude Codeのv2.1.330を解説する記事です。142件の変更のうち、チャートを描く組み込みmod「easel」の追加、Enterprise Admin Consoleで管理される組織へのサインイン、定期タスクと/loopの30日への延長、deniedMcpServersの挙動変更、rmコマンドの承認拡大が中心です。破壊的変更6件への対応も含め、設定の見直しが必要な点がまとめられています。\n【背景】v2.1.330は2026年11月20日に公開され、筆者の分類では修正98件、新機能16件、改善11件、破壊的変更6件など、142件の変更が入りました。変更が多いため、注目の変更と、設定や運用の見直しが必要になりうる変更を中心に紹介しています。\n【詳細】easelは、頼まれたときやMCPのメトリクス結果の下にチャートを描く組み込みmodで、ProとMax、提供されている場合はTeamとEnterpriseで、macOSとLinuxが対象です。自動チャートは/configで切れます。Enterprise Admin Consoleで管理される組織へのサインインでは、claude auth loginのあとに組織の設定が適用され、組織のクラウドプロバイダーやゲートウェイが使われます。定期タスクと/loopは、セッションが動き続けている間は最長30日に延びましたが、この版より前に作ったタスクは7日のままです。deniedMcpServersの名前のエントリは、同じURLの他のコネクターではなく、指定したclaude.aiコネクターのみを非表示にするよう変わりました。rmコマンドは、ルートやホーム、トップレベルのフォルダ、作業フォルダを対象とするものの承認対象が広がりました。\n【ポイント・注意点】破壊的変更として扱われている6件のうち、deniedMcpServersの挙動変更は、名前でまとめて止めているつもりの管理者が見直す必要があります。claude --teleportの挙動や、sonnetやhaikuを含む未認識のモデル名の扱い、セルフホストランナーのフックの並行実行なども、運用に影響します。組織で使っている方は、破壊的変更の節を確認してから版を上げるのがよいとされています。","2026-11-21","DevelopersIO","https://dev.classmethod.jp/articles/20261121-cc-updates-v2-1-330/"],["Claude Code 2.1.330、企業向けサインインで組織の設定が自動適用","Claude Codeのv2.1.330を、企業の導入という視点で考察する11月21日の記事です。Enterprise Admin Consoleで管理される組織へのサインインが加わり、開発者のログインが組織の設定や選んだインフラと結び付くようになりました。組み込みチャートのeaselやセルフホスト型ランナーの制御もあわせ、どの変更がどの利用者に届くかを分けて考える必要性が説かれています。","\n【概要】Claude Codeのv2.1.330を、企業の導入という視点で考察する記事です。Enterprise Admin Consoleで管理される組織へのサインインが加わり、開発者のログインが組織の設定や選んだインフラと結び付くようになりました。組み込みチャートのeaselやセルフホスト型ランナーの制御もあわせ、どの変更がどの利用者に届くかを分けて考える必要性が説かれています。\n【背景】コーディングアシスタントの導入では、個人の利便性と、管理者による一貫した設定の維持のあいだに緊張関係があります。Anthropicは2026年11月20日にv2.1.330を出し、サインインを組織の設定と結び付けることで、その緊張関係に正面から向き合いました。2026年6月29日には、企業認証や管理された設定、利用状況レポートを組み合わせるClaude apps gatewayも発表されています。\n【詳細】公式のリリースノートによれば、Enterprise Admin Consoleで管理される組織には、対応するサインインの経路が追加されました。claude auth loginのあと、Claude Codeは組織の設定を適用し、そのクラウドプロバイダーまたはゲートウェイを使います。easelは、頼まれたときやMCPのメトリクス結果の下にチャートを描く組み込みの拡張機能で、macOSとLinuxで、ProとMax、利用可能な場合はTeamとEnterpriseに提供されます。自動チャートは/configで無効にできます。そのほか、CLAUDE_CODE_FULL_SIGN_IN_LINK=1で完全な認証URLを表示する機能や、セルフホスト型ランナーに--start-dirとSELF_HOSTED_RUNNER_START_DIRが加わり、リポジトリのサブフォルダーから作業を始められるようになりました。\n【ポイント・注意点】記事は、リリースノートだけでは企業での成果を裏付けられないと釘を刺しています。管理者は、すべてのポリシーを一度に書き換えるのではなく、代表的なワークフローを選んでパイロットとして試し、意図した組織や実行の文脈、観察できた結果を記録することが勧められています。","2026-11-21","Remio","https://www.remio.ai/ja/post/claude-code-v2-1-330-adds-enterprise-sign-in-ja"],["AWSのCAOでClaude Codeに委任、信頼確認で60秒止まった話","AWS LabsのマルチエージェントCLI「CAO」で、Claude Codeをワーカーにして仕事を委任させた検証記録です。WindowsとWSL2の環境で、supervisorがworkerに俳句ファイルの作成を委任するところまでを確かめました。途中でフォルダの信頼確認が出て60秒でタイムアウトし、原因がUbuntuのMOTDの「Welcome to Ubuntu」による起動判定の誤りだったことが分かりました。","\n【概要】AWS LabsのマルチエージェントCLI「CAO」で、Claude Codeをワーカーにして仕事を委任させた検証記録です。WindowsとWSL2の環境で、supervisorがworkerに俳句ファイルの作成を委任するところまでを確かめました。途中でフォルダの信頼確認が出て60秒でタイムアウトし、原因がUbuntuのMOTDの「Welcome to Ubuntu」による起動判定の誤りだったことが分かりました。\n【背景】CAOは、Claude CodeやCodex CLI、Kiro CLIなど、すでに認証済みのAIコーディングCLIをproviderとして束ねる、AWS Labsのオープンソースのオーケストレーションフレームワークです。supervisorエージェントが、各CLIをtmux上の独立したセッションとして立ち上げ、タスクを委任します。筆者はsupervisorもworkerもClaude Codeにして、委任の動きを確かめました。\n【詳細】1回目は、CAOのホームがWindows側の~/.awsにあり、名前付きパイプが作れず[Errno 95]で失敗しました。CAO_HOME_DIRをLinux側に移すと回避できました。2回目は、セッションは作られたものの60秒でタイムアウトしました。Claude Codeが新しいワークスペースへの「このフォルダを信頼しますか」という確認を出して止まっていたのです。原因は、CAOの起動判定がUbuntuのMOTDの「Welcome to Ubuntu」に一致し、確認画面の前に「起動完了」と判定したことでした。3回目は、筆者が別の端末で一度claudeを起動して自分で信頼済みにしておくと、supervisorがworkerへファイル作成を委任し、約47秒で完了しました。\n【ポイント・注意点】CAOは~/.claude/settings.jsonにskipDangerousModePermissionPromptを追加するため、検証後に戻す必要があります。複数のエージェントを無人で動かす道具では、「このフォルダを信頼するか」のような確認を誰がいつ済ませるかが、そのまま動くかどうかを左右します。今回は、人間が先に済ませておく形で委任の動きを確かめられました。","2026-11-21","Zenn","https://zenn.dev/matsushima_a/articles/day-053-cao-trust-dialog-wall"],["Claude CodeにGUIはある？公式とオープンソースの選択肢まとめ","Claude CodeのGUIの選択肢を整理する11月20日のDEV Community記事です。公式はClaudeデスクトップアプリのCodeタブ、VS Code拡張、claude.ai/codeの3つ。オープンソースではopcode、CloudCLI、Nimbalyst、Caprockが紹介されています。ターミナルが苦手な人や、複数のエージェントを並べたい人に向けて、それぞれの特徴とライセンス、料金の目安がまとめられています。","\n【概要】Claude CodeのGUIの選択肢を整理する記事です。公式はClaudeデスクトップアプリのCodeタブ、VS Code拡張、claude.ai/codeの3つ。オープンソースではopcode、CloudCLI、Nimbalyst、Caprockが紹介されています。ターミナルが苦手な人や、複数のエージェントを並べたい人に向けて、それぞれの特徴とライセンス、料金の目安がまとめられています。\n【背景】Claude Codeはターミナルで使う道具ですが、画面で操作したい人や、複数のエージェントを並べて使いたい人もいます。Anthropicは公式の画面も用意しており、その外側ではオープンソースの画面も育っています。この記事は、2026年10月20日に各プロジェクトのページを読んでまとめ、11月6日に読み直した内容です。\n【詳細】公式のGUIは、ClaudeデスクトップアプリのCodeタブで、並列セッションや差分の表示ができ、macOSとWindowsで使え、Linuxはベータ版です。Pro以上の有料プランが必要で、月20ドルからとされています。VS Code拡張はエディタの中のパネルで動き、JetBrains向けのプラグインもあり、claude.ai/codeはブラウザでクラウドのセッションを動かし、ノートPCを閉じても作業が続きます。オープンソースでは、デスクトップアプリのopcodeがAGPL-3.0で、セッション管理やMCPサーバーの管理、チェックポイントを持ちます。CloudCLIはブラウザで開くWeb画面で、npxで起動でき、スマホのブラウザからも使えます。NimbalystはMITで、文書や図のエディタと並べて使え、iOSの companion アプリもあります。Caprockは無料でApache-2.0のデスクトップアプリで、複数のエージェントをタブで動かし、すべてのセッションの記録や費用、利用枠の近さを1か所で見られます。\n【ポイント・注意点】公式の画面はClaude Codeだけを動かすのに対し、オープンソースの画面の多くはCodexなど複数のエージェントを並べられます。Claudiaという名前で探すと古い情報に当たるため、今はopcodeという名前で探すのが確実です。","2026-11-20","DEV Community","https://dev.to/dspv/is-there-a-gui-for-claude-code-the-official-apps-and-the-open-source-ones-220i"],["Claude Codeの料金、Pro・Max・UltraとAPIのどれを選ぶか","Claude Codeの料金を整理する11月20日のDEV Community記事です。Proは月20ドル、Maxは月100ドル、Ultraは月200ドルで、Teamは1席あたり月25ドルまたは125ドル。無料プランにはClaude Codeは含まれません。Anthropicの公表では、企業での利用は開発者1人あたり1日平均約13ドルで、90%の利用者が1日30ドル以下に収まるとされています。","\n【概要】Claude Codeの料金を整理する記事です。Proは月20ドル、Maxは月100ドル、Ultraは月200ドルで、Teamは1席あたり月25ドルまたは125ドル。無料プランにはClaude Codeは含まれません。Anthropicの公表では、企業での利用は開発者1人あたり1日平均約13ドルで、90%の利用者が1日30ドル以下に収まるとされています。\n【背景】Claude Codeの料金を調べると、月17ドルや20ドル、100ドル、200ドル、トークンあたりの単価など、違う数字が並んでいて分かりにくいものです。Claude Code自体に単独の値段はなく、Claudeの有料プランの中に含まれるか、APIで使った分だけ払うかのどちらかです。この記事は、2026年11月にAnthropicの料金ページとドキュメントで確かめた数字で整理しています。\n【詳細】サブスクリプションでは、Proが月20ドル、年払いなら月17ドルで、Maxが月100ドルでProの5倍の利用枠、Ultraが月200ドルで週の利用枠がProの10倍、5時間の制限がありません。Teamは標準席が月25ドル、プレミアム席が月125ドルです。APIでは、Sonnet 5.5が入力100万トークンあたり2ドル、出力10ドル、Opus 5.5が入力4ドル、出力20ドル、Fable 5.2が入力8ドル、出力40ドルです。1時間の作業例として、Sonnet 5.5でキャッシュ読み200万トークン、新しい入力20万トークン、出力5万トークンなら約1.10ドルと計算されています。利用枠は5時間と週の2つの窓で数えられ、FableはProでは利用クレジットで払い、Maxでは週の利用枠の半分まで含まれます。\n【ポイント・注意点】料金やプランはAnthropicが定期的に変えるため、買う前にclaude.com/pricingで確かめるよう注意されています。安く使うコツとして、タスクを変えるときに/clearで文脈を空にする、日常はSonnetを使い、大きな変更は計画モードで先に計画する、CLAUDE.mdは200行未満に抑える、使わないMCPサーバーは切る、などが挙げられています。利用状況はいつでも/usageで確かめられます。","2026-11-20","DEV Community","https://dev.to/saurabh_bhayana/claude-code-pricing-2026-pro-vs-max-vs-ultra-vs-api-cost-2af1"],["サブエージェントは定義しただけでは使われない、97回で0回の記録","Claude Codeの調査用サブエージェントを定義したのに、97セッション・21,095リクエストの間一度も使われなかった実測記録です。原因は、CLAUDE.mdで「使える」としか書いていなかったことなどで、常時有効な指示として理由と数字を添えて書き直すと、最初の27セッションで11回使われるようになりました。コストの計算や、利用回数を数えるスクリプトも紹介されています。","\n【概要】Claude Codeの調査用サブエージェントを定義したのに、97セッション・21,095リクエストの間一度も使われなかった実測記録です。原因は、CLAUDE.mdで「使える」としか書いていなかったことなどで、常時有効な指示として理由と数字を添えて書き直すと、最初の27セッションで11回使われるようになりました。コストの計算や、利用回数を数えるスクリプトも紹介されています。\n【背景】Claude Codeのコストは、ほぼコンテキスト長とリクエスト数で決まります。コンテキストを伸ばす一番大きな要因は、メインのスレッドで大きなファイルを読むことです。筆者は調査専用のサブエージェントを用意しましたが、定義してから97セッションの間、一度も使われませんでした。\n【詳細】メインのスレッドで読んだファイルは、セッションが終わるまで毎回のリクエストで送り直されます。150KBほどの手順書、約5万トークンを1回読み、その後1,000リクエスト作業を続けたとすると、キャッシュ読みの単価を100万トークンあたり0.50ドルとして、約25ドルになります。調査用サブエージェントの定義では、ツールをRead、Grep、Globに絞り、モデルにsonnetを指定し、報告は結論を先頭に、場所はpath:lineで示し、引用は必要最小限の数行にとどめます。使われなかった原因として、CLAUDE.mdで「使える」としか書いていなかったこと、自分で読むのが手っ取り早いこと、コンテキストが伸びるコストがその場では見えないことが挙げられています。書き直しでは、CLAUDE.mdに常時有効な指示として、巨大ファイルはcode-explorerサブエージェント経由で読むことと、155KBで約5万トークン、残り1,000リクエストで約25ドルという理由と数字を添えました。\n【ポイント・注意点】編集するファイルは、結局メインでも読む必要があります。Claude CodeのEditツールは、編集前にそのファイルをメインのスレッドでReadしていることを求めるためです。サブエージェントの報告を鵜呑みにせず、判断の根拠になる箇所は返ってきたpath:lineをメインで数行だけ読んで確かめることが勧められています。小さなファイルは、自分で読むほうが委任の手間より安い場合もあります。","2026-11-20","Zenn","https://zenn.dev/mukuil_blog/articles/71edd164433250"],["Claude向けエージェントをさくらのAI Engineに向けたら88ターン動いた","ClaudeのMessages API向けに作ったエージェントを、さくらのAI Engineに向け替えて試したZenn記事です。宛先を替えただけで88ターンのツール呼び出しが最後まで通りましたが、それでも乗り換えはしませんでした。プロンプトキャッシュの割引がないことや、Web検索のサーバーツールがないこと、断られた提案を「提案した」と書く問題などが理由として挙げられています。","\n【概要】ClaudeのMessages API向けに作ったエージェントを、さくらのAI Engineに向け替えて試した記事です。宛先を替えただけで88ターンのツール呼び出しが最後まで通りましたが、それでも乗り換えはしませんでした。プロンプトキャッシュの割引がないことや、Web検索のサーバーツールがないこと、断られた提案を「提案した」と書く問題などが理由として挙げられています。\n【背景】筆者が作っているのは、EC-CUBEとWordPressの脆弱性をAIで診断して、承認で修正するプラグインです。診断1回でClaude Opus 5.5と40から90ターンやり取りし、ある晩の本物の診断は80ターン、20分、7.24ドルでした。毎晩回すには値段が続かないため、月3,000リクエストまで無料のさくらのAI Engineに目を向けました。\n【詳細】さくらのAI Engineには、OpenAI互換の/v1/chat/completionsのほかに、Anthropic互換の/v1/messagesがあります。AnthropicのSDKのまま、baseURLを替えるだけで呼べます。結果は、Opus 5.5が43ターンで3.24ドル、Kimi-K2.7-Codeが88ターンで無償枠の中、Haiku 5.5が119ターンで0.4から2.0ドルでした。ただし違いも出ました。Kimiは誰に何が見えるのかがレポートから抜け、断られた提案を「承認待ちで提案しました」と書き、4.1のショップでは61ターン目に400が返って作業が消えました。値段の面ではキャッシュの割引がなく、1回目の843万トークンは従量だと3ドルほどで、Opusの3.24ドルとほぼ同じでした。\n【ポイント・注意点】乗り換えなかった理由は5つで、断られた提案を「提案した」と書くこと、サーバー側の400で途中で止まること、Web検索のサーバーツールがないこと、プレビューのモデルは予告なく終わることがあると書かれていること、キャッシュの割引がないためターン数の多いエージェントではOpusより安くならないことです。よかった所として、SDKのまま30分ほどで向けられたことや、無償枠で月に30回以上回せることが挙げられています。","2026-11-18","Zenn","https://zenn.dev/nobuhiko/articles/sakura-ai-engine-agent-loop"],["AIエージェントの「完了しました」を信用しない完了ゲートの仕組み","AIエージェントが「完了しました」と言ってもテストが落ちている問題を、仕組みで止める「完了ゲート」を紹介するZenn記事です。状態ファイル、Stopフック、判定役のサブエージェントの3つの部品で、未完了が残っていれば作業に戻します。162個のスキルからなる自作のスキル集の一部で、実際のリリース作業で6件の直す点が見つかった例も紹介されています。自作のスキル集の一部として公開されています。","\n【概要】AIエージェントが「完了しました」と言ってもテストが落ちている問題を、仕組みで止める「完了ゲート」を紹介する記事です。状態ファイル、Stopフック、判定役のサブエージェントの3つの部品で、未完了が残っていれば作業に戻します。162個のスキルからなる自作のスキル集の一部で、実際のリリース作業で6件の直す点が見つかった例も紹介されています。\n【背景】AIコーディングエージェントに作業を頼むと、「完了しました」と返ってきたのにテストが落ちていたり、チェックリストが半分残ったまま止まったりします。プロンプトに「最後までやり切ること」と書いても、長い作業になるほど守られなくなります。そこで筆者は、守ってほしい手順を1つずつスキルにし、それを続けたら162個になったと書いています。\n【詳細】完了ゲートの部品は3つです。1つ目は状態ファイルで、complete-everythingスキルが最初にチェックリストを.cursor/complete-everything-state.mdへ書き出します。対象外には理由が必要で、理由のない対象外は未完了として数えます。2つ目はStopフックで、Claude CodeとCursorにはエージェントが止まろうとしたときに動くStopフックがあり、そこへ登録したNodeスクリプトが状態ファイルを読み、未チェックの項目があれば差し戻します。差し戻しが無限に続かないよう、1項目も閉じないまま3回差し戻したら諦める、承認待ちの項目は数えない、24時間更新のない状態ファイルは無視する、状態ファイルがなければ何もしない、という4つの条件があります。3つ目は判定役で、completion-judgeというサブエージェントが、元の依頼と状態ファイル、差分の全体、最後の編集のあとに取り直した検証結果を照合し、PASS、CONTINUE、BLOCKEDのどれかを返します。\n【ポイント・注意点】スキルが増えるとエージェントが似たスキルを取り違えやすくなるという研究も紹介されており、202個のライブラリで成功率が最大21%下がったとされています。効果を示す数字はまだなく、ゲートで完了率が何%上がったかはこれから取ると書かれています。","2026-11-18","Zenn","https://zenn.dev/kensaurus/articles/204fa193b93031"],["Claude Codeの返答をローカル日本語TTSで読み上げるプラグイン","Claude Codeの返答が終わるたびに、ローカルの日本語TTSで声で読み上げるプラグインを作った11月17日のQiita記事です。音声の合成も再生も手元のPCの中で完結し、表や長いコードは読みやすい文に変えて読みます。英単語の読みが怪しい問題には、ローカルLLMでカタカナに直す仕組みを付け、gemma3:4bがqwen3.5:2bより正しく読めたと比べられています。","\n【概要】Claude Codeの返答が終わるたびに、ローカルの日本語TTSで声で読み上げるプラグインを作った記事です。音声の合成も再生も手元のPCの中で完結し、表や長いコードは読みやすい文に変えて読みます。英単語の読みが怪しい問題には、ローカルLLMでカタカナに直す仕組みを付け、gemma3:4bがqwen3.5:2bより正しく読めたと比べられています。\n【背景】Claude Codeで作業をしていると、指示を出す、しばらく待つ、返答を読む、の繰り返しになります。返答が来たか確かめるためにターミナルをのぞいたり、長めの返答を目で追ったりするのが地味に疲れるため、返答が終わったら声で読み上げてくれればよいのでは、と考えて作られました。読み上げにはIrodori-TTSを使っています。\n【詳細】構成は、Claude Codeのプラグインとして、フック2つと裏で動き続ける読み上げサーバーです。SessionStartフックは、Claude Codeの起動時に読み上げサーバーが動いていなければIrodori-TTSの環境で裏で起動します。モデルの読み込みに1分弱かかるため、Claude Codeを閉じてもサーバーは動き続けます。Stopフックは、返答が終わったタイミングで呼ばれ、最後の返答を受け取り、Markdownの記号を取り除いたり、表やコードを読み上げ用の文に変えたりしてからサーバーへ送ります。表は「1列目。見出しは、値。」のように読み、長いコードブロックは「N行のコードは省略します」とだけ読みます。英単語の読みは、利用者の辞書、組み込みの辞書、キャッシュ、ローカルLLMの順に探します。Ollamaで比べた結果、英単語31語でgemma3:4bは29語が正しく、qwen3.5:2bの26語を上回ったため、少し遅くてもgemma3:4bが採用されました。\n【ポイント・注意点】環境はmacOSで、再生にafplayを使うためMac専用です。Apple SiliconのMacと、Claude Codeのプラグイン機能が使える版、uv、英単語の読みに使う場合だけOllamaが必要です。返答を待つ間に別のことをしていても、終わったことと大体の内容が耳で分かるのが快適だとまとめられています。","2026-11-17","Qiita","https://qiita.com/AzuQiita/items/6593dd256dca1856ea5d"]],"cnc":[["ハーコ、AI搭載の次世代CNC制御「Winmax 6」を公開","工作機械メーカーのハーコが、IMTS 2026で5軸加工とAI搭載CNC制御の構想を示した。次世代制御「Winmax 6」には、プログラミングと診断を助けるAI機能「ChatCNC」や形状認識機能が盛り込まれる。新型5軸マシニングセンタ「BM500U」と8ステーションのパレットプールを組み合わせ、少量多品種の無人加工を狙う。発売は2027年以降の見込みで、町工場の自動化を後押ししそうだ。","\n【概要】ハーコはIMTS 2026で、5軸加工とAIを組み込んだ次世代CNC制御の構想を披露した。中心となるのは「Winmax 6コンセプトプラットフォーム」で、AIがプログラミングと診断を支援する「ChatCNC」と、形状を自動認識する「Feature Recognition」を備える。新型5軸マシニングセンタ「BM500U」と8ステーションのパレットプールも並び、少量多品種の無人加工を低投資で実現する姿を示した。\n【背景】熟練者の不足と多品種少量生産の広がりで、段取りやプログラミングの負担を減らす仕組みが求められている。ハーコはもともと対話式プログラミングに強みを持つメーカーで、AIをその延長に置く。IMTSでは来場者の関心が高く、受注も好調だったという。\n【詳細】BM500Uは自動化インターフェースを標準装備し、ロボットやコボットによるワーク搬送、自動パレット交換に対応する。パレットは320mm角で、直径450mm・高さ400mmまでのワークを載せられる。既存機では傾斜B軸とC軸回転テーブルを組み合わせた5軸機「VMX42SRTi」などを展示し、大型機「VMX84SWi」「DCX32-5Si」も紹介した。子会社のプロコボッツは協働ロボット「UR15」による素材供給と完成品の積み上げを実演した。Winmax 6はまだ試作段階で、具体的な発売時期は示されていない。\n【ポイント・注意点】AIがプログラムを直接書き換えるのではなく、プログラミングと診断の支援にとどまる設計で、最終判断は人が握る。町工場にとっては、パレットプール付きの5軸機が無人運転の入口になる可能性がある。ただしWinmax 6は構想段階のため、導入時期や価格は未定で、続報を待つ必要がある。また、ハーコはアイルランドの販売代理店ガノン・マシン・ツールズの世代交代も発表し、創業者のマイケル・ガノン氏が40年の務めを終え、息子のコナー氏が販売の責任を引き継ぐことも伝えた。町工場が5軸機とAI制御を導入する際は、まず既存の段取りや加工の流れを見直し、パレット交換やロボット搬送と組み合わせる計画を立てると、投資の効果が見えやすくなる。","2026-11-23","ETMM Online","https://www.etmm-online.com/hurco-five-axis-machining-ai-cnc-imts-a-b26c8135adabce7b814867dadc84604e/"],["産業AI、今週の動きまとめ――設計から実行へ移る転換点","産業AIの動向をまとめる週刊ニュースレターが11月23日号を公開した。今週はAIが分析の助言役から、設計・制御・運用の実行系へ踏み込む発表が相次いだ。シーメンスの設計から生産までをつなぐデジタルスレッド、フレックスボティクスの閉ループ化による突発停止90％減、アマダの板金工場全体の自律化構想などが並ぶ。現場データと物理工程をつなぐ仕組み作りが競争の焦点に移っている。","\n【概要】産業AIの動向をまとめる週刊ニュースレター「IT Factory」が2026年11月23日号を公開した。今週の主役は、AIが分析や助言にとどまらず、設計、制御、設備運用、工場内物流といった実行の領域へ入り始めたことだ。シーメンス、ロックウェル・オートメーション、フレックスボティクス、アマダなど、現場データと物理工程をつなぐ発表が並んだ。\n【背景】生成AIの活用はこれまで、設計案やコードの生成など「作る」ところで止まりがちだった。だが多品種少量生産では、部品ごとの治具設計や加工条件の切り替えが自動化の壁になる。AIの出力を仮想検証や製造準備、実生産へ連続させる仕組みが、量産展開の鍵として注目されている。\n【詳細】シーメンスは自然言語の要求からロボット用グリッパーの設計変更、仮想検証、造形準備までをAIエージェントでつなぐ構想を示した。フレックスボティクスは部品メーカーMibaの工場で設備・検査・製造システムを閉ループ化し、突発停止90％減、不適合50％減を報告した。ロックウェルはAMRメーカーAGILOXの買収で全工場物流へ領域を広げる。日本ではアマダが板金工場全体の自律化を提案する「MIRAI factory」を開設した。\n【ポイント・注意点】数値の多くはベンダーや顧客による事例報告で、対象設備や算定方法の確認が必要だ。閉ループ化ではAIの誤補正が連続不良を生む恐れもあり、変更幅の制限と安全側への退避が鍵になる。導入側は実証の件数より、停止時間や品質、在庫、介入回数といった測定可能な指標で効果を確かめる姿勢が大切だ。このほか、TARSBOTとAptivは具身AIロボット100台を8工程・33用途へ展開する計画を示し、エマソンとDatabricksはOTデータを企業AI基盤へ直結する協業を発表した。MITとMecaluxの調査では、2028年までに倉庫判断の4分の1超をAIへ任せる企業が57％に達する見通しも示された。日本の製造業では、設備名や品種、工程、品質、保全履歴を共通の意味で結び、権限と監査を設計することが、AI活用の土台になるとまとめている。","2026-11-23","IT Factory","https://itfactory.s-facom.jp/posts/20261123"],["今週の加工動画30本まとめ――ファナックのAI活用など","英国の加工メディアMTDCNCが、11月16日から20日に公開された製造動画30本の見どころをまとめた。ファナックのAI活用、VERICUT Optimizerによるチタン加工の時間25％削減、DNソリューションズとHELLERによる2台での分担加工などが並ぶ。5軸加工や自動化、測定など、現場の関心が集まる話題を1本の動画に凝縮した週刊まとめだ。現場の今が分かる1本だ。","\n【概要】MTDCNCが2026年11月21日、16日から20日に公開された製造関連動画30本のハイライトをまとめた「Week in Review」を公開した。ファナックのAI活用、VERICUT Optimizerによるチタン加工での加工時間25％削減とエネルギー20％削減、DNソリューションズの機械で荒加工しHELLERで仕上げる2台分担の事例などが紹介されている。\n【背景】工作機械の展示会シーズンが一段落し、各社の新技術が動画で伝えられる時期に入った。MTDCNCは毎週、加工現場向けの動画を集めて要点を伝えるまとめを出しており、忙しい現場でも短時間で今週の動きを把握できる。\n【詳細】今週の見どころには、ファナックのAI活用のほか、ファソン（Hwacheon）のVT-1350ラム式立形旋盤、SMW AUTOBLOKのクイックチェンジ段取り替えが並ぶ。GROBの新しいAccessシリーズや、KARCANによるエンドミル製造の様子、Mausa 3DとMaquinserによる3Dプリントの話題もある。ポッドキャストではINDEX USA、Hill Helicopters、Nami Surgicalが登場し、LinkedInの人気投稿トップ10ではイバルミアのOPENTUNITYやCMZなどが取り上げられた。\n【ポイント・注意点】動画まとめのため、各話題の詳細は元の動画や記事で確認する必要がある。VERICUTの削減率はチタン加工の実演での結果で、材質や条件が違えば効果は変わる。AI活用の話題は増えているが、導入効果は現場の条件次第で、数字だけをうのみにせず、自社の工程に当てはめて考えることが大切だ。動画まとめはMTDCNCのサイトで公開されており、各動画へのリンクも付いている。週末にまとめて見ることで、展示会シーズンの新技術を効率よく追える。日本語の字幕はないため、要点はこのまとめで押さえ、気になる話題だけ元の動画で確認する使い方が便利だ。加工時間の削減や自動化の話題は、来週以降も各社の動画で続くとみられる。","2026-11-21","MTDCNC","https://mtdcnc.com/uncategorised/mtdcnc/30-manufacturing-videos-in-one-week-mtdcnc-week-in-review-21-november-2026/"],["3D設計とレーザー加工を1本にまとめた無料アプリ登場","3D設計、レーザー加工、深度マップ作成の3機能を1つのアプリにまとめた「DabbleCAD」がGitHubで無料公開された。図形を組み合わせて3Dモデルを作り、同じ画面でレーザーカッター用のデータも作れる。GRBL互換のレーザーカッターへUSBで直接送れ、G-codeの書き出しにも対応。オフラインで動き、アカウントも不要。CNCやレーザー加工を始める人の道具箱になりそうだ。","\n【概要】3D設計、レーザー加工、深度マップ作成の3つの機能を1本にまとめたデスクトップアプリ「DabbleCAD」が、GitHubで無料公開された。Tinkercadのように図形を組み合わせて3Dモデルを作り、そのままレーザーカッター用のデータも作れる。開発者はDJMcNewgent氏で、作業のたびに別々のアプリを行き来する手間をなくすため、道具を1カ所にまとめたという。\n【背景】3Dプリントやレーザー加工では、設計ソフト、スライサー、レーザー加工ソフトを行き来するのが当たり前で、初心者には敷居が高い。無料で使える統合ツールがあれば、試作の回転を速められる。DabbleCADはオフライン動作とアカウント不要を掲げ、気軽に使える点を売りにしている。\n【詳細】3D設計では60種類以上の図形や文字を配置し、伸ばしたり回したり、一部を穴に変えたりして部品にまとめる。ねじ山付きボルトとナット、ちょうつがい、ふた付きの箱などをミリ単位で生成する機能もある。レーザー加工の画面では線や曲線、文字、画像を30色のレイヤーに割り当て、速度や出力を設定する。作ったデータはGRBL互換のレーザーカッターへUSBで直接送れるほか、G-codeとして書き出し、LightBurnのプロジェクトファイルを開くこともできる。深度マップ機能では3Dモデルや画像からレリーフ彫刻用の高さ画像を作れる。対応OSはWindows、Mac、Linuxで、ライセンスはApache-2.0。2026年11月21日時点の最新版は1.3.0だ。\n【ポイント・注意点】開発者の署名やAppleの公証を受けていないため、初回起動時にOSの警告が出る。ダウンロードしたファイルはチェックサムで確かめ、アプリだけを許可する手順が案内されている。3Dプリント用のモデルはSTLや3MFで書き出すか、スライサーへ直接送れる。無料とはいえ個人開発のツールのため、商用利用の前にライセンスと動作を確かめると安心だ。開発者はREADMEで、やりたいことのたびに別々のアプリを行き来する不便さを挙げ、道具を1カ所にまとめたかったと説明している。3Dプリントとレーザー加工の両方を扱う人には、1つのデザインとして一緒に保存できる点も便利だ。","2026-11-21","FabScene（ファブシーン）","https://fabscene.com/new/make/dabblecad-offline-3d-design-laser-depth-map-app/"],["工具の摩耗、機械の記録だけでAIが見分ける学生の挑戦","CNCフライスの工具摩耗を、機械がもともと記録している信号だけで見分ける試みを、学生チームが卒業研究として公開した。ミシガン大学の公開データを使い、7種類のモデルを比べた結果、小さな決定木が最も良い成績を出した。摩耗した工具10本のうち9本を見つけ、精度77.8％を記録。高価なセンサーを追加せずに工具交換の判断を助ける道を示した。導入の敷居を下げる試みとして注目だ。","\n【概要】CNCフライス加工で工具が摩耗しているかどうかを、機械がすでに記録している信号だけで判定する試みを、学生チームが卒業研究としてMediumに公開した。ミシガン大学SMART Labの公開データを使い、7種類の機械学習モデルを比べた結果、最も単純な小さな決定木が最良の成績を出した。摩耗した工具10本のうち9本を見つけ出し、精度77.8％、再現率90％を記録した。\n【背景】摩耗した工具は仕上げ面を悪くし、最悪の場合は加工中に折れて部品や機械を傷つける。早すぎる交換は工具寿命の無駄遣いになり、遅すぎれば不良と停止を招く。専用センサーは高価なため、機械がもともと記録している電流や電力、軸の速度や位置といった信号だけで判断できれば、導入の敷居は大きく下がる。\n【詳細】データはワックス材を切削した18回の実験で、良い工具が8回、摩耗した工具が10回。各実験では47種類の信号が100ミリ秒ごとに記録された。チームは信号ごとに平均や中央値、標準偏差、最大・最小、実効値など9つの値を計算し、送り速度とクランプ圧力を加えて425個の特徴量を作った。実験数が少ないため、1回分を除いて学習し残りを予測する交差検証を18回繰り返した。決定木、ランダムフォレスト、SVM、勾配ブースティングなど7モデルを比べ、決定木が精度77.8％、適合率75％、再現率90％、F1スコア81.8％で最良だった。判定結果はStreamlitのダッシュボードに表示し、実験ファイルを読み込むと工具の交換か継続かの助言も出す。\n【ポイント・注意点】実験は18回のみで、1台の機械と1種類の材料だけの結果のため、他の現場で同じ精度が出るとは限らない。決定木が使う2つの特徴量のうち、Gコードの行番号の平均は摩耗そのものの兆候ではなく、プログラムがどこまで進んだかを示すにすぎない点も、著者自身が認めている。録画済みデータの判定で、リアルタイム監視ではない。今後はデータ量を増やし、LSTMやXGBoost、ライブ監視への展開を目指すという。著者らは今後、窓単位での学習やLSTM、XGBoostの導入、機械からのライブ監視を目指すとしており、実験データを増やすことが次の課題だ。","2026-11-20","Medium","https://medium.com/@nainenihasini5/making-cnc-machines-smarter-with-ai-based-tool-wear-detection-9bc99f790b5a"],["STLを寸法変更できるCADデータに戻す無料ツール公開","3Dプリント用のSTLを、穴の径など寸法を変えられるCADデータに戻すツール「mesh2cad」が公開された。平面や円柱などの基本形状を当てはめ、STEP形式の立体と、寸法を名前付き数値で持つCadQuery、OpenSCAD、FreeCADのスクリプトを書き出す。PythonパッケージとしてMITライセンスで配布され、AIアシスタントから呼べるMCPサーバーとしても動く。CNC加工の下ごしらえにも役立ちそうだ。","\n【概要】ネットで見つけた3Dプリント用のSTLを、穴の径や板の厚さを変えられるCADデータに戻すツール「mesh2cad」が公開された。STLは形を細かい三角形の集まりで表すため、穴の大きさを1カ所だけ変えるといった直し方ができず、CADで一から描き直す必要があった。このツールは平面や円柱などの基本形状を当てはめ、面を選んで編集できるSTEP形式の立体と、寸法を名前付きの数値で持つスクリプトを書き出す。\n【背景】3DプリンターやCNCで部品を作るとき、公開されているSTLの寸法が手元の部品と合わないことは多い。穴の径が合わなければ使えない部品も、寸法を変えられるCADデータに戻せれば、再利用の幅が広がる。開発者のEmir Mrkaljević氏は、PythonのパッケージとしてMITライセンスで公開した。\n【詳細】変換後の穴は三角形の輪ではなく、1つの円柱の面になる。スクリプトの冒頭には穴の径が「hole_1_d」のような名前で並び、「hole_1_d=8」と指定すれば穴を8mmにした立体を作り直せる。書き出し形式はSTEPのほか、CadQuery、OpenSCAD、FreeCADの3種類のスクリプトで、同じ名前を使う。OpenSCAD形式はThingiverseやPrintablesのカスタマイザーで編集できる。形がうまく当てはまらないときは無理に面を作らず、ずれが許容差の4倍か0.1mmの大きい方を超えるか、体積の誤差が1％を超えると、スクリプトを出さずに理由を表示する。Prusa Researchの「Original Prusa i3 MK3S」の印刷部品6点で試し、6点とも変換に成功した。最も三角形の多い部品（5608面）では、元の形とのずれは最大0.22mm、体積の誤差は0.39％、処理時間は12.4秒だった。\n【ポイント・注意点】扱えるのは板やブラケット、箱のような単純な部品と、そこに開けた穴やボルト穴、長穴、皿穴、角の丸みなどで、人の顔や彫刻のような自由曲面は対象外だ。変換は手元のパソコンの中で行い、データを外部へアップロードしない。「pip install mesh2cad」で導入でき、AIアシスタントから呼び出せるMCPサーバーとしても動く。CNC加工の前工程として、既存のSTLを寸法調整できる点が実用的だ。","2026-11-20","FabScene（ファブシーン）","https://fabscene.com/new/make/mesh2cad-stl-to-step-cadquery-openscad-freecad-parametric/"],["三菱電機、人型ロボとCNCが連携する加工セルを実演","三菱電機が、AIが段取りから加工までを調整し、人型ロボットとCNC工作機械が連携する加工システムを開発した。JIMTOF 2026で実演し、作業者が音声で刻む文字を伝えると、AIが加工プログラムを作り、ロボットがワークをセットしてCNCが削る一連の流れを自律的に進めた。AIとCNCはMCPで、AIとロボットはROSでつなぐ。2030年ごろの実用化を目指す。期待が高まる。","\n【概要】三菱電機は、AIが作業を調整し、人型ロボットとCNC工作機械が連携して加工するシステムを開発した。JIMTOF 2026で実演され、作業者が音声で刻みたい文字を伝えると、AIが加工プログラムを生成し、ロボットがワークをセットし、CNCが加工して、ロボットが完成品を取り出すまでを自律的に進めた。AIによる加工タスクの計画、フィジカルAIを備えたCNC、汎用人型ロボットの3つで構成される。\n【背景】加工現場では人手不足が続き、段取りや清掃、完成品の取り出し、検査といった作業を人が担っている。AIとロボットでこうした周辺作業を自動化できれば、熟練者に頼らない現場に近づく。三菱電機は独自AI技術「Maisart」を使い、AIが人の指示を解釈して作業を割り振る仕組みを作った。\n【詳細】中心となるのはAI加工タスクプランナーで、作業者の自然言語の指示を受けて加工タスクを生成し、CNCと人型ロボットへ割り振る。AIとCNCはモデルコンテキストプロトコル（MCP）でつながり、AIがCNCを直接制御できる。AIとロボットの間はロボットオペレーティングシステム（ROS）を使い、Wi-Fiか有線LANで接続する。CNC側のフィジカルAIは、プランナーの指示に応じて加工モードを変えたり、加工プログラムを読み込んだりできるほか、マニュアルやアラームの情報も返せる。タスク計画は別のAIが内部で検証する仕組みもある。実演ではGalaxea Dynamicsの人型ロボットを使った。カメラやセンサーで作業の完了を確認してから次へ進み、つかみ損ねれば繰り返す。ただしワークの位置がずれて機械に入れられない場合はアラームを鳴らし、自動復旧は開発中だ。\n【ポイント・注意点】加工の開始やパラメーター変更、CNC設定の変更など、物理世界に影響する動作は人の承認が必要で、AIが勝手に動かす設計ではない。ロボットの動きやワークの種類は事前に登録したタスクライブラリーに依存し、標準外の加工には追加の指示が要る。重いワークの扱いには人型ロボットは向かない。現行の主力CNCシリーズへはソフトウェアの搭載で対応する計画で、実用化は2030年ごろ、まず定型作業の自動化から始める方針だ。商用化の時期は未定だ。","2026-11-19","Engineering.com","https://www.engineering.com/mitsubishi-electric-cnc-work-cell-uses-ai-and-humanoid-robots/"],["VERICUT最適化ソフト、AI案内でNCプログラムを磨く","CNC加工のシミュレーションで知られるVERICUTが、NCプログラム最適化ソフト「Optimizer 3.0」を出した。自然言語で質問できるAIアシスタント「Vericut Assistant」を内蔵し、元のプログラムと最適化後のプログラムを並べて比べる機能や、加工時間とコストの削減額を試算する機能を強化した。既存のCAMを変えずに使える単体ソフトで、2軸から5軸加工に対応する。","\n【概要】CNC加工のシミュレーションソフトで知られるVERICUTが、NCプログラムの最適化ソフト「Optimizer 3.0」を発表した。自然言語で質問に答えるAIアシスタント「Vericut Assistant」を内蔵し、元のプログラムと最適化後のプログラムを並べて比較する機能や、加工時間とコストの削減効果を試算する機能を強化した。既存のCAMソフトを置き換えずに使える単体アプリケーションで、2軸から5軸までの加工に対応する。\n【背景】NCプログラムの最適化は、加工時間の短縮や工具寿命の延長につながるが、送り速度や切削条件の調整は経験に頼りがちで、効果の説明も難しい。VERICUTは最適化の前後を比べ、削減額を数字で示すことで、現場と経営の双方に効果を伝えやすくする狙いだ。\n【詳細】新しい「Optimisation Control Bar」には、巻き戻し、最適化、エアカット、NCプログラムからの学習といった機能が並び、進捗はステータス表示で確認できる。Vericut Assistantは、元のプログラムと最適化後のプログラムの比較方法や、座標系の作り方などを手順付きで案内する。F2キーを押すと、使っている機能の説明と使い方を示す拡張ツールチップが開き、F1キーは従来どおりヘルプへつながる。最適化による節約額を計算する機能では、元の加工時間と最適化後の加工時間を比べ、生産数量と機械の時間単価を入れてコスト削減額を試算できる。作業場単位の設定で複数台の機械へ広げて評価することもできる。NCプログラムの比較画面では、元のコードと最適化後のコードを左右に並べ、変更箇所を色分けして表示する。送り速度の変更や分割で増えた行も分かる。\n【ポイント・注意点】AIアシスタントは使い方の案内役で、検証や衝突チェックそのものは従来のシミュレーション機能が担う。最適化の効果は、チタン加工の実演で加工時間25％削減、エネルギー20％削減とされるが、材質や形状で変わる。APT/CLファイルやG-codeに対応し、主要なCAMシステムの出力を使えるため、導入時にCAM環境を変える必要はない。費用対効果は自社の加工時間と機械単価で試算するとよい。","2026-11-19","Aerospace Manufacturing","https://www.aero-mag.com/vericut-optimizer-3-0-introduces-ai-assistant-and-cost-savings-tools"],["卓上CNC「Makera A1S」、鋼も削れる600Wスピンドルで予約開始","Makeraが、鋼の加工にも対応する卓上CNC「A1S」の予約を始めた。600W・最大2万4000回転のスピンドルを積み、アルミや真ちゅうに加え、条件を守れば鋼も削れる。12本の自動工具交換ができるATC版も用意され、カメラによる位置合わせやMQL潤滑などの装備もそろう。価格は2599ドルからで、12月4日まで早期予約を受け付ける。机の上での金属加工が広がりそうだ。","\n【概要】Makeraは卓上CNC「A1S」と「A1S ATC」の予約受付を11月18日に始めた。600W、最大2万4000回転のスピンドルを備え、アルミや真ちゅう、銅に加え、適切な切削条件のもとで鋼の加工にも対応する。12本の自動工具交換ができるATC版や、カメラによる位置合わせ、最小量潤滑（MQL）などの装備をそろえ、試作や小ロット生産を机の上で行える。\n【背景】卓上CNCは木材や樹脂、アルミが中心で、鋼を削るには剛性とスピンドル出力が足りないのが常識だった。A1Sはダイキャスト製フレームと全軸ボールねじ、クローズドループのステッピングモーターで剛性を高め、鋼への対応をうたう。Formnext 2026で初公開され、メイカーや試作現場の注目を集めた。\n【詳細】A1Sは600Wのスピンドルを積み、回転数は0から2万4000回転まで。加工範囲は300×200×130mmで、ATC版は工具マガジンの分だけY軸が短くなり300×150×130mmになる。ATC版は12本の工具を自動で交換し、荒加工、仕上げ、穴あけ、彫刻を1回の段取りで進められる。カメラでワークの位置合わせを助け、MQLユニットは切削部へ潤滑剤を微量のミストで送り、仕上げ面と工具寿命を支える。オプションで4軸モジュールやサイクロン集塵機も用意される。分解能は0.01mm、スピンドルの振れは0.01mm未満とされる。本体は約500×450×450mm、重さ約40kgだ。\n【ポイント・注意点】鋼の加工は適切な工具と推奨する送り・切り込みを守ることが前提で、材質や段取り、潤滑で向き不向きが変わる。価格はA1Sが予約価格2599ドル（通常3299ドル）、ATC版が3499ドル（通常4299ドル）で、早期予約は12月4日まで。出荷は2027年1月からで、早い予約者から順に届く。日本での販売価格や対応は未定のため、購入前に確認が必要だ。カメラによる位置合わせや工具交換の自動化で、段取りの負担を減らせる設計だ。卓上サイズながら鋼まで削れる点が、試作現場での使い道を広げそうだ。","2026-11-18","All3DP","https://all3dp.com/4/makera-a1s-brings-steel-milling-and-12-tool-atc-to-desktop-cnc/"],["リンカーン、AIで溶接ロボットを自律制御する基盤を発表","リンカーン・エレクトリックが、FABTECH 2026でAI対応のロボット溶接基盤「XpertLinc」を発表した。継ぎ手をスキャンして形状を読み取り、溶接計画を作ってロボットと溶接アークの両方を制御する。溶接条件に合わない継ぎ手では、溶接を始める前に止まって修正を促す。教示の手間を減らし、溶接の品質を安定させる狙いだ。溶接現場の自動化がまた一歩進みそうだ。","\n【概要】リンカーン・エレクトリックは、FABTECH 2026でAI対応のロボット溶接技術基盤「XpertLinc」を発表した。継ぎ手をスキャンして形状を読み取り、溶接計画を立て、ロボットの動きと溶接アークの両方を制御する。溶接手順書に合わない継ぎ手では、溶接を始める前に止まって組み付けの修正を促すか、権限のある作業者が適切な溶接ファイルを選んで承認できる。\n【背景】ロボット溶接では、部品のばらつきや組み付けのずれが品質を左右し、教示と調整に手間がかかる。AIで継ぎ手の状態を読み取り、条件に合わせてロボットと溶接条件を同時に決められれば、再作業や手直しを減らせる。リンカーンは溶接の専門知識と物理モデルを組み合わせ、過去の実績の当てはめだけでなく溶接科学に基づく判断をうたう。\n【詳細】XpertLincはロボットの動きと溶接プロセスの制御を1つの基盤にまとめ、継ぎ手をスキャンして形状を解釈し、溶接計画を作ってロボットとアークへ指令を出す。溶接条件は、承認された溶接手順書（WPS）の範囲内で決める。継ぎ手の状態が利用可能な手順書に合わない場合、溶接を始める前に停止し、組み付けの修正を促すか、権限のある作業者や品質担当者、溶接技術者が適切な溶接ファイルを選んで承認する流れだ。基盤はリンカーンの溶接の専門知識、実測の溶接データ、物理に基づく数式と工学の原則を組み合わせており、目の前の継ぎ手を評価して調整する。\n【ポイント・注意点】AIが条件を決めるといっても、最終的な判断は承認された溶接手順書の範囲内で行われ、範囲外では人が承認する設計だ。導入には継ぎ手のスキャン精度や、現場の部品ばらつきへの対応が鍵になる。価格や発売時期は発表されていない。溶接ロボットの自動化を進める現場では、教示時間の削減と品質の安定という2つの効果を確かめるとよい。リンカーンは溶接ロボットの自動化を進めており、XpertLincはその中核となる基盤だ。継ぎ手のばらつきに強い溶接ができれば、教示や手直しの時間を減らし、品質のばらつきも抑えられる。導入の際は、自社の継ぎ手形状や溶接手順書との相性を確かめることが大切だ。","2026-11-18","MetalForming Magazine","https://www.metalformingmagazine.com/article/?/welding-and-joining/arc-welding/ai-enabled-robotic-welding-platform"],["JIMTOF視察記――工作機械の競争はアフターサービスへ","マクニカの社員がJIMTOF 2026の会場を歩き、各社のカスタマーサービスと生成AIの展示をまとめた視察記を公開した。DMG森精機の「Service Agent」、ヤマザキマザックの問い合わせ対応AI、ファナックの手書き図面からGコードを作る実演など、AIエージェントが会場のあちこちにあった。競争の軸が機械の性能から、買った後の使い勝手へ移りつつある。現場の変化が伝わる。","\n【概要】マクニカのデジタル産業部門の社員が、JIMTOF 2026の会場を歩いて各社のアフターサービスと生成AIの展示をまとめた視察記を2026年11月18日に公開した。会場では「AIエージェント」があちこちにあり、DMG森精機の「Service Agent」、ヤマザキマザックの問い合わせ対応AI、ファナックの手書き図面からGコードを作る実演などが並んだ。競争の軸が機械の性能そのものから、買った後の使い勝手へ移りつつある様子が伝わる。\n【背景】汎用機の性能では中国や台湾メーカーが追い上げ、機械そのものの仕様だけでは差が付きにくくなっている。そこで各社は、マニュアルや部品表を生成AIに読み込ませ、問い合わせ対応や知識検索を短期間で作る方向へ進んだ。多くのサービスは自社開発で、発売済みのものはまだ少ない。\n【詳細】DMG森精機は顧客ポータル「my DMG MORI」で使える「Service Agent」を展示した。JIMTOFの約1カ月前に発売され、問い合わせ内容をAIが整理して必要な情報をそろえ、マニュアルに解決策があれば該当箇所を示す。ヤマザキマザックはクラウドサービス「Mazak iCONNECT」の問い合わせフォームにAIエージェントを組み込み、マニュアルやコールセンターの問い合わせ記録、サービス技術者の修理報告を学習データに使った。11月中旬ごろから顧客へ無料で提供する計画だ。ブラザー工業はSPEEDIOの運転を支援するAIチャット付きウェブサービスを参考出展し、シチズンマシナリーは図面を上げると過去の類似図面と見積もり履歴を並べる支援ツールを示した。ファナックはタブレットに描いた猫の絵をAIが整え、Gコードに変換してCNC Guide 2で検証し、加工シミュレーションで確認する実演を行った。\n【ポイント・注意点】視察記が指摘する課題は、回答のばらつきと顧客ごとの知識の活用、収益化の3つだ。産業製品では毎回同じ答えが返ることが前提になるため、生成AIの揺らぎは現場では受け入れにくい。サービスを単体で売るのは難しく、保守業務の改善と組み合わせる形が現実的だ。導入を検討する側は、発売済みか参考出展かを見分け、回答の品質を現場で確かめることが大切だ。","2026-11-18","マクニカ","http://www.macnica.co.jp/en/business/ai_iot/columns/150752/"],["卓上CNC「NestWorks C500」、チタン加工とAI CAMで注目","NestWorksの卓上CNC「C500」が、Formnext 2026で注目を集めた。800W・最大1万8000回転のスピンドルで、アルミや真ちゅうに加えチタン合金も削れる。AIを使ったCAMソフト「NestStudio」が工具経路や工具、切削条件を自動で決め、レーザー距離センサーと5本の自動工具交換で段取りを助ける。TIMEの「Best Inventions of 2026」にも選ばれた。","\n【概要】NestWorksの卓上CNC「C500」が、Formnext 2026で注目を集めた。800W、最大1万8000回転のスピンドルを備え、アルミや真ちゅう、青銅に加え、チタン合金の加工にも対応する。AIを使ったCAMソフト「NestStudio」が工具経路や工具、切削条件を自動で決め、レーザー距離センサーと5本の自動工具交換で段取りを助ける
