<style>

:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;display:flex;flex-direction:column;height:100dvh;overflow:hidden;transition:background .35s ease,color .35s ease}
body::before{content:"";position:fixed;inset:0;background:var(--pattern);pointer-events:none;opacity:var(--pattern-op,.5)}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
[data-theme="steampunk"]{--bg:#e6d7b8;--pattern:radial-gradient(circle at 12% 20%,rgba(141,100,40,.16) 0 26px,transparent 27px),radial-gradient(circle at 88% 78%,rgba(141,100,40,.13) 0 38px,transparent 39px),repeating-linear-gradient(0deg,rgba(90,62,25,.05) 0 1px,transparent 1px 26px);--pattern-op:1;--card:#f8eed3;--ink:#2e2010;--muted:#77603c;--line:#a97f3f;--accent:#9c4a12;--accent2:#2f5d50;--accent-ink:#fff6df;--soft:#efdfba;--old:#97835f;--top-bg:#2a1a0c;--top-ink:#f2dfae;--radius:8px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\2699  \2699  \2699";--shadow:0 14px 34px rgba(62,40,8,.28)}
[data-theme="witch"]{color-scheme:dark;--bg:#161022;--pattern:radial-gradient(circle at 18% 12%,rgba(233,213,255,.20) 0 1.5px,transparent 2.5px),radial-gradient(circle at 72% 22%,rgba(233,213,255,.14) 0 1px,transparent 2px),radial-gradient(circle at 42% 66%,rgba(196,181,253,.12) 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 84%,rgba(233,213,255,.16) 0 1px,transparent 2px),radial-gradient(circle at 6% 88%,rgba(196,181,253,.12) 0 1px,transparent 2px);--pattern-op:1;--card:#241a3d;--ink:#f1eaff;--muted:#bdaee0;--line:#5b4595;--accent:#a678ff;--accent2:#e9d5ff;--accent-ink:#1d1233;--soft:#2f2350;--old:#8d81ad;--top-bg:#0e0919;--top-ink:#efe6ff;--radius:20px;--font-display:"IM Fell English","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\263E  \2726  \263D";--shadow:0 14px 34px rgba(0,0,0,.5)}
[data-theme="dnd"]{--bg:#e7d9b4;--pattern:repeating-linear-gradient(45deg,rgba(158,43,37,.05) 0 2px,transparent 2px 18px),radial-gradient(circle at 85% 10%,rgba(158,43,37,.10) 0 30px,transparent 31px);--pattern-op:1;--card:#f7ecc9;--ink:#332216;--muted:#7d6248;--line:#8c6a3f;--accent:#9e2b25;--accent2:#a97b00;--accent-ink:#fdf3d8;--soft:#eee0b6;--old:#9a8a72;--top-bg:#471611;--top-ink:#f7e7bd;--radius:4px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\265E  \2726  \265E";--shadow:0 14px 30px rgba(71,22,17,.30)}
[data-theme="celtic"]{--bg:#e3dfc6;--pattern:repeating-linear-gradient(0deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px),repeating-linear-gradient(90deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px);--pattern-op:1;--card:#f6f2dc;--ink:#20331e;--muted:#5d7050;--line:#77873f;--accent:#2e6b34;--accent2:#a8842a;--accent-ink:#fbf7e2;--soft:#e7e5c8;--old:#93a086;--top-bg:#17351f;--top-ink:#efeccb;--radius:14px;--font-display:"Uncial Antiqua","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\16DA  \2726  \16DB";--shadow:0 14px 30px rgba(23,53,31,.26)}
[data-theme="greek"]{--bg:#f2eee3;--pattern:repeating-linear-gradient(90deg,rgba(29,95,138,.06) 0 1px,transparent 1px 34px),radial-gradient(circle at 90% 0%,rgba(185,138,28,.10) 0 60px,transparent 61px);--pattern-op:1;--card:#fffdf6;--ink:#1e2c38;--muted:#66727c;--line:#b3923c;--accent:#1d5f8a;--accent2:#b98a1c;--accent-ink:#ffffff;--soft:#ece7d7;--old:#a3a8ad;--top-bg:#fdfbf4;--top-ink:#1e2c38;--radius:2px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\03A9  \2766  \03A9";--shadow:0 14px 30px rgba(30,44,56,.18)}
.top{flex:none;position:relative;z-index:30;background:var(--top-bg);color:var(--top-ink);border-bottom:3px double var(--line)}
.topin{max-width:1080px;margin:auto;padding:10px 16px 4px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.logo{font-family:var(--font-display);font-weight:900;font-size:23px;letter-spacing:.06em}.logo span{color:var(--accent2)}
[data-theme="witch"] .logo span,[data-theme="steampunk"] .logo span{color:var(--accent)}
.date{font-size:10px;opacity:.75;white-space:nowrap}
.topbtns{display:flex;gap:8px;flex:none}.pill{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.themes{max-width:1080px;margin:auto;padding:6px 16px 10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.themes-label{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;opacity:.8}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;opacity:.85}
.theme-btn .gly{margin-right:5px}
.theme-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
.stage-wrap{flex:1;min-height:0;max-width:1080px;width:100%;margin:auto;padding:10px 16px 12px;display:flex;flex-direction:column;position:relative;z-index:1}
.herostrip{flex:none;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;box-shadow:var(--shadow)}
.herostrip img{width:74px;height:52px;object-fit:cover;border-radius:calc(var(--radius) * .6);flex:none}
.herostrip p{margin:0;font-size:13px;color:var(--muted)}.herostrip b{color:var(--ink);font-family:var(--font-display)}
.catbar{flex:none;display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.catbar .navbtn{flex:none}
.catinfo{flex:1;text-align:center;min-width:0}
.catinfo h2{margin:0;font-family:var(--font-display);font-size:clamp(19px,4.6vw,27px);line-height:1.25;letter-spacing:.03em}
.catinfo p{margin:1px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catcount{flex:none;font-size:12px;background:var(--soft);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-weight:700}
.navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800;box-shadow:var(--shadow)}
.navbtn:active{transform:scale(.97)}
.dots{flex:none;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:transparent;padding:0}
.dot.active{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.stage{flex:1;min-height:0;touch-action:none;position:relative}
#cardSlot{height:100%}
.card{height:100%;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
.card::after{content:var(--orn);position:absolute;top:6px;right:12px;font-size:13px;letter-spacing:.3em;color:var(--accent2);opacity:.85;pointer-events:none}
.card.old .ph{filter:grayscale(1)}
.card .ph{width:100%;height:30%;min-height:120px;object-fit:cover;display:block;flex:none}
[data-theme="steampunk"] .card .ph{filter:sepia(.35) contrast(1.05)}
[data-theme="witch"] .card .ph{filter:saturate(.85) hue-rotate(-12deg) brightness(.92)}
[data-theme="dnd"] .card .ph{filter:sepia(.25) saturate(1.1)}
[data-theme="celtic"] .card .ph{filter:saturate(1.05) hue-rotate(6deg)}
[data-theme="greek"] .card .ph{filter:saturate(.92) brightness(1.04)}
.cbody{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.badge{background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:999px;font-weight:800}.badge.oldb{background:var(--old)}
.card h3{margin:0;font-size:clamp(17px,4.4vw,21px);line-height:1.45;font-family:var(--font-display);font-weight:700}
.sum{font-size:14px;color:var(--muted);margin:0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.btn{border:0;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800}
.btn.primary{background:var(--accent);color:var(--accent-ink)}.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.saved{background:var(--accent2);color:var(--accent-ink)}
.src{font-size:11px;color:var(--muted);word-break:break-all}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;color:var(--muted)}
.empty .big{font-size:34px;color:var(--accent2)}
.pager{flex:none;display:flex;align-items:center;gap:10px;margin-top:10px}
.pager .navbtn{flex:1}
.artdots{flex:none;display:flex;gap:5px;max-width:34vw;flex-wrap:wrap;justify-content:center}
.artcount{flex:none;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.hint{flex:none;font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.addcat{flex:none;text-align:center;margin-top:6px}
.addcat button{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700}
@keyframes inNext{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes inDown{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes inUp{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
.anim-next{animation:inNext .28s ease}.anim-prev{animation:inPrev .28s ease}.anim-down{animation:inDown .28s ease}.anim-up{animation:inUp .28s ease}
dialog{border:2px solid var(--line);border-radius:calc(var(--radius) + 6px);padding:0;max-width:min(680px,94vw);width:680px;max-height:92dvh;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,8,4,.6)}
.din{padding:20px;overflow-y:auto;max-height:92dvh}
.din img{width:100%;height:200px;object-fit:cover;border-radius:var(--radius)}
.din h3{font-size:20px;line-height:1.4;margin:12px 0 6px;font-family:var(--font-display)}
.full{font-size:15px;white-space:pre-line}
textarea,input[type="text"]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px}
label.fl{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
.memoBox{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.memoItem{border-top:1px solid var(--line);padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--top-bg);color:var(--top-ink);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:90vw;text-align:center}
@media(max-width:640px){.topin{padding:8px 12px 2px}.themes{padding:4px 12px 8px}.stage-wrap{padding:8px 12px 10px}.herostrip{display:none}.catbar .navbtn{padding:8px 10px;font-size:12px}.card .ph{height:24%;min-height:104px}}
@media(prefers-reduced-motion:reduce){.anim-next,.anim-prev,.anim-down,.anim-up{animation:none}body{transition:none}}

</style>

const DATA = {"ai":[["マイクロソフト、Ignite 2026でCopilotを自律型エージェント中心に刷新","米マイクロソフトはサンフランシスコで開いたIgnite 2026で、Copilotを生成AIアシスタントから企業業務を自律的にこなす基盤へ作り替える構想を示した。中核は業務向けの推論層WorkIQで、チャットと仕事の委任を統合した新画面Home、常時稼働のエージェントAutopilot、自然言語で業務アプリを作るCopilot Codeなどを発表。Salesforceとの提携Copilotforceも明らかにした。","\n【概要】マイクロソフトは年次イベントIgnite 2026で、Copilotを「職場の新しいOS」と位置づけ、AIエージェントが自律的に仕事を進める仕組みへ刷新すると発表した。SiliconANGLEが11月18日に報じた。\n【背景】最高マーケティング責任者ジャレッド・スパタロ氏によると、Microsoft 365には約19.5エクサバイトの顧客業務データが保存され、毎日数十億件のファイルやメールが加わる。こうした雑多なデータを扱うため、全Copilotエージェント共通の推論層「WorkIQ」が、データの取得や意図の解釈、必要な情報の選別を担う。\n【詳細】新しい画面「Home」は従来のチャットと、エージェントに仕事を任せる「Cowork」を統合した。依頼を最適なモデルへ振り分ける「Auto」や、メール・予定表・Teamsを見てその日の作業を示す「Today」（プライベートプレビュー）を備える。早期アクセスプログラムFrontierの加入者向けには、独自のEntra IDと記憶を持ち、受信箱やTeamsを見張って定型業務や複数段階の案件を進める常時稼働エージェント「Autopilot」の提供を始めた。数週間後には、自然言語でダッシュボードや軽量な業務アプリを作る「Copilot Code」も登場する。Officeの機能もCopilotに取り込まれ、メモやホワイトボードでの発想から完成したWordやExcelの文書へそのまま移れる。文書はCopilotの中に置かれ、Microsoft 365のセキュリティとコンプライアンスの管理下に入る。共有キャンバス「Copilot Workspaces」では、エージェントが下書きした部分を人が確認し、コメントを返せる。Agent 365にはエージェントごとの投資対効果を測るBusiness Analyticsが加わり、Salesforceとの提携「Copilotforce」では38の営業向けスキルを用意する。\n【ポイント・注意点】Autopilotの行動は専用の名前で記録され、重要な操作の前には利用者に確認し、IT部門がいつでも止められるという。エージェントに任せる範囲が広がる分、権限の設計と監視の運用が導入企業の課題になる。","2026-11-18","SiliconANGLE","https://siliconangle.com/2026/11/18/at-ignite-2026-microsoft-reinvents-copilot-as-the-autonomous-engine-of-enterprise-work/"],["「AIによる雇用崩壊はない」とIndeedが分析、働き手の不安は拡大","求人サイトIndeedのHiring LabとGlassdoorの経済調査チームは11月18日、AIが広範な失業を引き起こしている証拠はほとんどないとする分析を公表した。AI関連語を含む求人の割合は1年で3.6%から7.2%へ倍増し、技術職以外にも広がった。一方、Glassdoorの口コミではAIへの批判的な言及が51%に達し、働き手の不安が強まっていることも示された。","\n【概要】Indeed Hiring LabとGlassdoor Economic Researchは11月18日、「AIによる雇用崩壊（Jobpocalypse）はないが、AI不安は多い」と題する分析を公開した。\n【背景】生成AIの普及で雇用が失われるとの懸念が続くなか、両者は求人データと口コミ、働き手への調査からAIの影響を整理した。長期的な影響はなお不確かだとしている。\n【詳細】求人のうちAI関連語を含む割合を示すIndeed AI Trackerは、2025年9月の3.6%から2026年9月に7.2%へほぼ倍増し、AI関連語の入った求人を1件以上出した企業の割合も44%増えた。職種名にAIを含む求人の約3分の2は、トラック運転や小売販売、理学療法など従来の技術職以外だった。データセンター建設に伴い設置・保守職の需要も伸び、2026年上半期のデータセンター関連求人の4分の1を占めた。提示賃金は同種の職より42%高い。ソフトウェア開発の求人は回復したが、増加分の71%は上級職で、37%は職種名にAIを明記していた。働き手のAI利用も広がり、私生活で週1回以上使う人は44%から53%に、仕事では36%から42%に増えた。ただ、職場で日常的にAIを使う人の推定の時間短縮は、1日2.3時間から2.1時間へ縮んだ。一方、生産性の伸びは長期平均並みにとどまり、働く米国人の56%はAIで効率が上がることに同意しなかった。Glassdoorの口コミでAIへの言及は2.6倍に増え、肯定的な扱いは2019年の82%から45%へ下がり、批判的な言及は15%から51%へ上がった。AIに批判的な投稿者は、解雇に触れる割合が7.1倍高く、CEOを支持する割合は37%と、AIに肯定的な投稿者の89%を大きく下回った。\n【ポイント・注意点】報告はAIの影響を「目立たないが意味のあるもの」と表現し、インフラ需要の一部は景気循環的な可能性があるとする。労働市場の弱さで企業が働き手の不安を見過ごせている現状は、将来の人材流出の危険になると警告している。","2026-11-18","Indeed Hiring Lab","https://hiringlab.indeed.com/2026/11/18/there-is-no-ai-jobpocalypse/"],["Nvidia、ネオクラウドへの融資保証の条件を明確化","米Nvidiaは、データセンター建設向けローンの保証について、顧客が資金調達や機器の設置を済ませて初めて効力を持つ仕組みだと説明した。暫定CEOのコレット・クレス氏は、今後も新設データセンターなどを支援するものの対象はより厳しく選ぶと述べ、ジェンスン・フアン前CEO時代の積極的な出資・融資路線からの転換をにじませた。OpenAIのオハイオ州の施設に対する1050億ドルの保証も、この条件に当てはまる例として挙げた。","\n【概要】TechCrunchによると、Nvidiaは四半期のCFOコメンタリーで、ネオクラウド（AI特化型のクラウド事業者）などへのローン保証の条件を初めて公に説明し、顧客への資金支援でもより選別的になる姿勢を示した。\n【背景】フアン氏の突然の退任後、CFOのクレス氏が暫定CEOを務めている。週末にはイーロン・マスク氏を含む19万7000人がフアン氏の復帰を求める署名に加わった。Nvidiaはフアン氏のもとでAIスタートアップやネオクラウドに多額を投じ、最近はデータセンター向けの巨額ローンの保証も始めていた。最大の案件は8月に発表した、OpenAIのオハイオ州のデータセンター群「PORTS-Pike」への1050億ドルの保証で、見返りにOpenAIは同施設でNvidia製品だけを使うことに同意した。クレス氏はフアン氏のますます大胆になる取引に反対し、この保証を2500億ドルから1050億ドルに減らしたとも報じられたが、記事はこの報道を確認していない。\n【詳細】クレス氏によれば、保証はNvidia自身が資金を出すことを意味しない。顧客が必要な株式や負債による資金を確保し、計算機を調達・設置し、施設の準備を終えた時点で初めて発効する。建設が遅れたり問題が生じたりすれば、保証は「存在しなくなる」。同氏はこれを方針の変更ではなく既存条件の明確化だとし、PORTS-Pikeもこの条件が当てはまる例だと説明したが、こうした開示がこれまで公にされていなかったことも認めた。今後も新設データセンターの支援は続けるが、土地・電力・建屋の確保状況を重視し、どの企業を支えるかを「非常に厳しく見ている」という。\n【ポイント・注意点】Nvidiaは第3四半期に、前四半期の597億ドルを上回る649億ドルの純利益を計上した。顧客に投資し、その顧客が製品を買う「循環取引」への批判もあるなか、急な支援の打ち切りを避けつつ融資を絞る姿勢が、AIインフラ投資の勢いにどう響くかが注目される。スタートアップへの出資も約650億ドルに膨らんでおり、今後の案件の行方にも関心が集まる。","2026-11-18","TechCrunch","https://techcrunch.com/2026/11/18/nvidia-clarifies-when-it-will-and-wont-keep-financing-neoclouds/"],["企業文書をAIエージェント向けに変換するUnsiloed AI、750万ドル調達","米サンフランシスコのUnsiloed AIは、Felicis主導のシードラウンドで750万ドルを調達した。表やグラフを含む複雑な企業文書を分解し、AIエージェントが使える構造化データに変換するソフトを開発する。抽出した情報が元の文書のどこにあるかも示し、利用者が結果を検証できるのが特徴で、金融・法律・医療分野の顧客がすでに使っているという。料金は1ページ1セントから。","\n【概要】TechCrunchは11月18日、文書処理スタートアップのUnsiloed AIがFelicis主導で750万ドルのシード資金を調達したと報じた。Y Combinatorなども参加した。\n【背景】企業の業務自動化でAIエージェントの利用が広がる一方、業務文書には表やグラフ、複雑なレイアウトが多く、AIは正確に読み取りにくい。銀行や病院、法律事務所では誤りの代償が大きい。CEOのアマン・ミシュラ氏は、大規模言語モデルは確率的なため逸脱や幻覚が生じうると指摘する。同氏はIITカラグプルの同級生アドナン・アッバス氏と共同創業し、Y Combinatorの2025年秋バッチに参加した。\n【詳細】同社のソフトは文書から表やグラフなどのデータを抽出して構造化し、抽出元の位置も示す。文字と画像を別々に処理する「デュアルストリーム」の視覚モデルや、重要な部分を見極める「ヒートマップ型チャンキング」を使い、数値や図に多くの計算資源を割く。業界ごとに意味が変わる専門用語は専用のデコーダーで扱い、文書のすべての部分に同じ処理をかけないことでコストも抑える。料金は1ページ1セントから。顧客名は明かしていないが、ある銀行は文書処理に、ある法律事務所は自社サーバーに導入して契約書や古い訴訟記録の処理に使っている。音声AIのBolna AIは、音声エージェントを作るための知識ベースの取り込みに利用する。顧客が提供した金融文書542件の試験では、約8万4000のデータ点で99.78%の精度を示したとする。Allen AIの公開ベンチマークolmOCR-Benchでは、自社計測で88.0点と、Reductoの66.0点、Unstructuredの39.9点を上回ったという。同ベンチマークは1403ページのPDFで、表や数式、スキャン文書、複雑なレイアウトの扱いを評価する。\n【ポイント・注意点】これらの成績は独立した検証を経ていない。ReductoやUnstructured、マイクロソフトやアマゾンの製品と競う市場で、従業員は現在7人。資金は研究者・技術者の採用や独自データセットの構築に充てる。","2026-11-18","TechCrunch","https://techcrunch.com/2026/11/18/felicis-leads-7-5m-bet-on-unsiloed-ai-to-make-enterprise-documents-usable-by-ai-agents/"],["インドのHumyn Labs、ロボット学習用データで4700万ドル調達","インド・ベンガルールのHumyn Labsは、Accel主導のシリーズAで計4700万ドルを調達した。家庭や職場で人が日常の作業をする様子を独自の2カメラ機器で撮影し、動作のラベルを付けて米国のAI・ロボット企業向けの学習データとして提供する。4〜10月の売上高は1000万ドルで、売上の約9割を米国が占める。家の中での撮影をめぐるプライバシーや同意の課題も指摘される。","\n【概要】TechCrunchによると、Humyn Labsは株式2600万ドルとベンチャーデット2100万ドルの計4700万ドルを調達した。株式部分はAccelが主導し、Prosus Ventures、Dallas Venture Capital、Jump Tradingなどが参加した。\n【背景】現実世界で動くAIを開発するロボット企業は、人の日常作業を学ばせる良質なデータを十分に集めにくい。インドは豊富な労働力を生かした物理AI向けデータ収集の拠点になりつつあり、Mecka AIやXDOF、MicroAGIなども同様の事業を手がけ、インドのHuman ArchiveやBuildAIも同国の大きな労働力を使って日常作業を記録している。\n【詳細】同社はゲーム企業Nazara Technologiesの元CEOマニッシュ・アガルワル氏と、AB InBev元幹部のイシャンク・グプタ氏が2月に創業した。二人は以前Kratos Studios（現KGeN）を創業しており、新興国にまたがるその協力者のネットワークが家庭内の映像収集を支える。従業員は51人で大半がベンガルールにおり、各国では現地の提携先が撮影場所を探し、作業を監督する。独自の2カメラ機器で人の作業を撮り、ソフトで手の動きや物とのやり取りを追跡し、動作ごとにタグを付けて学習データに変える。演出ではなく普段の仕事や家事を記録し、中南米とアジアの20か国以上で収集しており、ブラジル・インド・韓国が主な拠点だ。アガルワル氏は、規模と多様性、品質の釣り合いが必要だと強調する。グプタ氏によると売上の約9割は米国からで、4〜10月の売上高は1000万ドルだった。有料顧客は先端AI研究所やロボット企業など12社で、契約済みの案件は2000万ドル、まだ確定していない商談もさらに2000万ドルある。\n【ポイント・注意点】撮影の担い手には日ごと・週ごとに支払う一方、顧客からの入金は30〜60日後になるため、借入で資金繰りの差を埋める。家の中での撮影はプライバシーや同意の面で疑問も呼んでおり、データ供給の拡大と倫理面の両立が問われる。","2026-11-18","TechCrunch","https://techcrunch.com/2026/11/18/accel-backs-indias-humyn-labs-to-supply-training-data-needed-by-u-s-robotics-ai-developers/"],["Nvidia、中国向けAI半導体H200の販売を停止へ","米Nvidiaの暫定CEOコレット・クレス氏は11月17日の決算説明会で、中国向けのAI半導体H200の販売をやめると表明した。米国経由で出荷し25%の関税を課す条件付きの販売の枠組みは、退任したジェンスン・フアン氏がトランプ大統領と取りまとめたものだった。中国の顧客に遠隔でサービスする海外データセンターへの販売を禁じる新規則も出され、売上への影響が議論されている。","\n【概要】TechCrunchによると、Nvidiaはフアン氏の退任後初の決算説明会で、中国でのH200販売を停止すると明らかにした。同じ日には、国家安全保障や輸出管理を監督する取締役会レベルの委員会も発表した。\n【背景】H200の対中販売は、チップを米国経由で出荷し、政府が25%の関税を徴収する条件で認められていた。対中強硬派はこの経路に反対していたが、フアン氏は4月、ポッドキャスト司会者のドワーケシュ・パテル氏に、中国市場を明け渡すのは国にとって損失だと述べていた。同氏の退任は、中国へのチップ密輸で調査を受ける企業のCEOとの不倫が一因とされる。\n【詳細】退任と時を同じくして、中国の顧客に遠隔でサービスを提供する海外データセンターへの先端チップ販売を禁じる新規則が出された。投資銀行Jefferiesは、これでNvidiaの来年のデータセンター売上が440億〜620億ドル減る可能性があると試算した。クレス氏は、Vera Rubinなど先端チップの受注残があるため売上全体には影響しないとしている。長期的には、シンガポールやマレーシア、タイ、インドネシアの潜在顧客を失う可能性もある。Nvidiaの中国依存を批判する人々は売上の最大20%が中国関連の需要だと主張しており、シンガポール子会社の売上は、開示をやめる前の2025年に1040億ドルに達していた。もっとも、ジョージタウン大学安全保障・新興技術センターのジェイコブ・フェルドゴイズ氏によると、中国はもともとH200の受け入れをほぼ拒んでおり、主要なAI計算の利用者がより先進的なNvidia製品を望む一方で、国内半導体の需要を育てることを優先しているという。\n【ポイント・注意点】中国の主要なAIモデルには、輸出が禁じられたGrace Blackwellで学習した形跡があるとされる。輸出管理に詳しい弁護士ダン・フィッシャー＝オーウェンズ氏によれば、今後データセンターは中国の顧客にサービスしていないことの証明を求められる見通しで、証明できない施設が他社のチップに移れば、Nvidiaのシェアがさらに下がるおそれがある。","2026-11-17","TechCrunch","https://techcrunch.com/2026/11/17/nvidia-is-abandoning-china-after-jensen-huangs-ouster/"],["Nvidia、フアン氏退任後もオープンなAIモデル戦略は維持と表明","米Nvidiaの暫定CEOコレット・クレス氏は11月17日の決算説明会で、オープンなAIモデルの生態系を育てる方針は変わらないと述べた。9月に129億ドルで買収することで合意したHugging Faceの取引も予定どおり進めるとし、自社のオープンウェイトモデル群Nemotronが、OpenRouterで最も使われている米国製のオープンモデルになったと強調した。","\n【概要】TechCrunchによると、クレス氏はジェンスン・フアン前CEOの辞任後初となる決算説明会の冒頭で、「活気あるオープンモデルの生態系」の育成に引き続き取り組むと語った。\n【背景】フアン氏はオープンソースAIの強力な推進者で、その退任は同社のオープンモデル戦略の行方に疑問を投げかけていた。Hugging FaceのCEOも退任を「悲しい日」と述べ、オープンソースAIのために戦い続けると表明していた。フアン氏の辞任は、シンガポールのMegaspeedの幹部で中国のスパイと疑われるアリス・フアン氏との関係を含む不倫の報道を受けたもので、部下2人との関係も伝えられている。同氏は感謝祭までに議会で証言する予定だ。また、米証券取引委員会（SEC）が同社の開示が投資家を誤導したかを調べているとWall Street Journalが報じている。\n【詳細】クレス氏は、オープンモデルがAIの普及を加速させているとして、OpenRouterの週間トークン量が前年比35倍、過去3か月でも3.5倍に増えたと紹介した。9月に129億ドルで買収することで合意したHugging Faceは、同社史上2番目の規模の買収で、1800万人以上の開発者と20万社が利用する。クレス氏は買収が順調に進んでいるとし、プラットフォームを拡大してAIをより開かれた身近なものにすると述べた。またフアン氏が主導した、長時間動くエージェントや推論向けのオープンウェイトモデル群Nemotronについて、OpenRouterで最も使われている米国製オープンモデルになったと説明した。開発者が自前のAIシステムを作り始める場所がNemotronであり、その土台が幅広い生態系を後押ししているとも語った。\n【ポイント・注意点】質疑応答では、アナリストから買収について直接の質問は出なかった。指導者の交代後も開発者向けの基盤づくりを続けるかどうかは、オープンモデルの陣営全体に影響する。Hugging FaceのCEOが懸念を示していただけに、買収を続けるという表明は開発者の不安を和らげる材料になりうる。","2026-11-17","TechCrunch","https://techcrunch.com/2026/11/17/nvidia-says-its-open-source-ai-strategy-remains-intact-after-jensen-huangs-exit/"],["アマゾンとグーグル、上場後のAnthropic株を合計約3割保有へ","AnthropicはIPOに関する開示で、アマゾンが上場後に14.7%、グーグルが13.7%の株式を保有する見通しを明らかにした。いずれも議決権のない株式で、両社合わせて約3割となる。AMDやNvidia、マイクロソフトなど7社が計260億ドル分の議決権のない株式を買う私募も示され、グーグルとNvidiaはそれぞれ100億ドル分を引き受ける。アマゾンは手形をすべて転換すれば約23.8%まで持てる。","\n【概要】TechCrunchは11月17日、Anthropicが新規株式公開（IPO）に関連して、アマゾンとグーグルとの出資契約の詳細を開示したと報じた。開示によれば、上場後に両社が持つ株式は合わせて3割近くに上る。\n【背景】アマゾンは2023年と2024年、Anthropicがまだ目立たない存在だった時期に数十億ドルを投じ、その際に将来株式へ転換できる約束手形を組み合わせていた。当時のAnthropicはOpenAIの陰に隠れたままと見られていたが、その後、企業の間で人気を集めたClaude Codeを原動力に法人事業を大きく伸ばした。\n【詳細】アマゾンの投資には株式に転換できる約束手形が付いており、転換価格は投資の年に応じて1株約2.09ドルまたは5.05ドル。IPOに合わせて一部を議決権のない特別な株式に転換し、保有比率は14.7%となる。この株式は配当を受け取れ、売却時には議決権のあるクラスA株に転換される。アマゾンは数十億ドル分の手形を当面は転換せずに残しており、すべて転換すれば比率は約23.8%に達する。記事は、アマゾンが望めばより大きな比率を持てたと指摘する。グーグルも議決権のない株式で、約束手形の転換とIPOに伴う私募という二つの経路を合わせて、上場後に13.7%を保有する。私募にはAMD、Broadcom、グーグル、Micron、マイクロソフト、Nvidia、TSMC Partnersが参加し、計260億ドル分を購入する。このうちグーグルとNvidiaはそれぞれ100億ドル分の購入に同意しており、半導体やクラウドの大手が出資者として並ぶ。\n【ポイント・注意点】記事は、多くの投資家が大きな利益を得る見通しだとしつつ、アマゾンをIPOの最大の勝者の一つと位置づける。Anthropicは今後10年でAWSのクラウドに1000億ドル超を支出すると約束しており、その利益は株式の評価益とは別にAWSにもたらされる。巨大クラウド企業が主要株主となる構図は、AI企業の独立性を考えるうえでも注目点だ。","2026-11-17","TechCrunch","https://techcrunch.com/2026/11/17/amazon-and-google-will-together-own-nearly-30-of-anthropic-after-its-ipo/"],["投資銀行の定型業務を自動化するModel ML、2億5000万ドル調達","ロンドンのスタートアップModel MLは、General AtlanticとQED Investorsが共同で主導したシリーズBで2億5000万ドルを調達した。評価額は15億ドル。若手のバンカーやコンサルタントが担う財務モデルの作成、提案資料、デューデリジェンス報告書づくりをAIエージェントで自動化する。オープンソースのモデルを使い、最先端モデルの約2%のコストで動くとしている。","\n【概要】TechCrunchによると、Model MLは評価額15億ドルで2億5000万ドルのシリーズBを実施した。General AtlanticとQED Investorsが共同で主導した。約1年前には7500万ドルのシリーズAを発表しており、今回共同で主導した2社は以前からの出資者でもある。\n【背景】同社は約3年前、チャズ・イングランダー氏とアーニー・イングランダー氏の兄弟が創業した。兄弟は以前、個人間レンタルの市場Fat Llamaなどを共同創業し、Fat Llamaは2022年にスウェーデンのHyggloに4150万ドルで買収された。投資銀行や経営コンサルティングの定型業務を自動化する分野では、HebbiaやRogoなどのスタートアップが競い、AnthropicやOpenAIも金融の専門家向けのツールを出している。競合のRogoは4月に、評価額20億ドルで1億6000万ドルを調達した。\n【詳細】Model MLのAIエージェントは、顧客のシステムやデータ、ExcelやPowerPointなどのツールに接続し、バンカーやコンサルタントが扱う案件の「全体の文脈」を把握するという。新たな動きが分析に影響すれば、財務モデルやプレゼン資料を自動で更新する。対象は財務モデルの作成、ピッチ資料の作成、デューデリジェンス報告書の執筆など、従来は若手が担ってきた作業だ。資料を一度作って終わりにせず、案件の進み具合に合わせて中身を保つ点が売りで、人が数字や資料を手で直す手間を減らすことを狙う。差別化の要はオープンソースモデルの採用で、最先端モデルの約2%のコストで、より速く結果を出せると同社は説明する。\n【ポイント・注意点】前回のシリーズAから約1年で、調達額は3倍を超えた。ただしコストや速度の優位は同社の説明に基づく。金融の現場でAIが若手の仕事を担う流れが強まるなか、競合の資金力も大きく、精度と信頼性で選ばれ続けるかが焦点になる。オープンソースモデルで安さを打ち出す戦略が、大手AI企業の金融向け製品に対してどこまで通じるかも注目点だ。","2026-11-17","TechCrunch","https://techcrunch.com/2026/11/17/model-ml-raises-250m-to-automate-investment-banking-grunt-work/"],["グーグル、GeminiのTasks機能を数億人に無料で提供","グーグルは、Geminiアプリで電話での予約や購入などの雑務を代行する「Tasks」の提供範囲を広げた。5月にGemini Sparkとして一部のテスターに公開し、米国のGoogle AI Ultra加入者に広げていた機能を、新モデルGemini 4 Hydrogenを使って数億人に無料で開放する。アプリでChatからTasksへ切り替えるほか、テキストや電話でも指示できる。","\n【概要】TechCrunchは11月17日、グーグルがGeminiアプリの「Tasks」を幅広い利用者に提供すると報じた。Tasksはチャットボットを、利用者に代わって日常の事務作業をこなす個人秘書のような存在に変えるモードだ。\n【背景】従来のChatモードは、情報を得るためにAIと対話する使い方が中心だった。Tasksは5月に、24時間働くエージェント「Gemini Spark」として一部のテスターに公開され、その後米国のGoogle AI Ultra加入者に広がり、9to5Googleの報道によれば「Task Mode」へと発展した。今回、新モデルGemini 4 Hydrogenを使い、数億人に無料で提供される。質問に答えるAIから、利用者の代わりに行動するAIへの移行を象徴する動きといえる。\n【詳細】Tasksでは、店に電話をかけて予約を取る、Google Payで購入を済ませる、求められた際にウェブサイトへ安全にサインインする、といったことができる。Gemini担当副社長のジョシュ・ウッドワード氏はブログで、地元の自動車販売店に電話させて家族のミニバンの点検予約を入れたほか、電気料金の請求書の分析にも使ったと紹介した。電話での問い合わせから書類の分析まで、細かな用事をまとめて任せる使い方を想定している。使い方はアプリ内のトグルでChatからTasksに切り替えるだけで、Geminiにテキストを送ったり電話をかけたりして指示することもできる。電話をかける、支払う、ログインするといった、これまで利用者自身が手を動かしていた作業を任せられる点が、従来のチャットとの大きな違いだ。\n【ポイント・注意点】記事は、取引の途中でアシスタントがどこまで操作できるのか、購入や予約を利用者がどう確認するのか、どんなプライバシー・安全対策があるのかについて詳細を示していない。拡大後の対象国も明示されていない。支払いやアカウント操作に使う前に、グーグルの公式の説明を確認したい。無料化で利用者が一気に増えれば、誤った予約や意図しない購入への備えも重要になる。","2026-11-17","TechCrunch","https://techcrunch.com/2026/11/17/google-expands-access-to-gemini-tasks-which-can-help-with-calls-purchases/"],["Gemini、履歴オフの会話も約2か月保存へ　従来は72時間","グーグルは、Geminiの一時的なチャットや履歴をオフにした状態の会話の保存期間を、従来の72時間から約2か月に延ばす。AIの能力向上に伴う安全・セキュリティ対策が理由で、今後数週間で世界のGeminiアプリに適用する。同時に、チャット履歴とAI学習への利用を別々に設定できるようにし、履歴を残しつつ学習には使わせない選択ができるようになる。変更のきっかけは明らかにしていない。","\n【概要】TechCrunchによると、グーグルはGeminiの一時チャットと履歴オフ時の会話の保存期間を約2か月に延長する。対象は一時チャットと、チャット履歴をオフにした状態での会話だ。変更は今後数週間で、世界のGeminiアプリに順次反映される。グーグルは、AIシステムの能力が高まるなかでの安全とセキュリティの向上を目的に挙げている。\n【背景】11月12日付のGemini Apps Privacy Hubのアーカイブでは、保存期間は72時間とされていた。他社では、OpenAIがChatGPTの一時チャットを最大30日保存する場合があるとし、AnthropicはClaudeのシークレットチャットを既定で30日保存している。各社とも法的・安全上の理由や規約違反の調査のため、一部をより長く保持することがある。\n【詳細】グーグルは変更のきっかけを明らかにせず、会話へのアクセスや確認の方法が変わるかという質問にも答えなかった。代わりにブログを示し、利用者への応答、フィードバックの処理、サービスと利用者の保護のために長く保存すると説明した。更新後のPrivacy Hubはシステム障害への備えも理由に挙げ、一時的な会話はAIモデルの学習に使わないとしている。あわせて、これまで「Keep Activity」という一つの設定で管理していたチャット履歴とAI学習への利用を分ける。以前Keep Activityをオフにしていた利用者は両方が既定でオフになり、オンだった利用者は履歴が残ったまま、学習への利用を別に選べる。これにより、履歴は残したいが学習には使われたくないという利用者の希望に応えられるようになる。\n【ポイント・注意点】学習には使わないとはいえ、保存期間は約20倍に延びるうえ、会話の閲覧や確認の扱いは不透明なままだ。機密性の高い内容を一時チャットで扱ってきた利用者は、使い方を見直す必要がある。他社の30日と比べても長く、AIとの会話をどこまで、なぜ残すのかという説明の丁寧さが、各社のプライバシー姿勢を比べる材料になりそうだ。","2026-11-17","TechCrunch","https://techcrunch.com/2026/11/17/google-to-keep-gemini-chats-for-two-months-up-from-72-hours-even-with-history-off/"],["配送物流をAIエージェントで効率化するPedestal AI、470万ドル調達","配送物流にAIエージェントを導入するPedestal AIが、470万ドルのシード資金を得てステルス状態から姿を現した。Eclipseが主導した。大手家具会社との取り組みでは、配達の約30分前にエージェントが顧客へ電話して指示を聞き取り、つながらなければテキストを送る仕組みで配達の失敗を20%減らした。すでにフォーチュン500企業や大手海運会社と取引がある。資金は人員の拡充などに充てる。","\n【概要】TechCrunchは11月17日、サプライチェーンをAIエージェントで速く確実にするPedestal AIが470万ドルのシード資金を調達したと報じた。Eclipseが主導し、RRE、Converge VC、Timescale Ventures、VitalStageが参加した。同社はエージェントを道具に、配送の流れから摩擦を取り除くことを目指す。\n【背景】同社はエージェント型AIでサプライチェーンを速く確実にすることを掲げ、特に配送の物流に力を入れる。物流の情報は整理されておらず常に変わり、多くの古いシステムに散らばっている。CEOのラジ・アガルワル氏は、だからこそ現代のAIに向いた難題だと話す。この分野では自動運転チーム出身者による起業が相次ぎ、元テスラのメンバーが創業し在庫最適化を手がけるAtomicや、Uber出身者による供給途絶の予測分析のLoopなどがある。\n【詳細】Pedestalはすでにフォーチュン500企業や世界最大級の海運会社と取引している。大手家具会社の事例では、これまで配達ドライバーが担っていた作業をエージェントに任せた。配達の約30分前に顧客へ電話して特別な指示を聞き、電話がつながらなければ別の仕組みがテキストメッセージを送る。これで配達の失敗が20%減ったうえ、配送工程のつまずきの箇所に関するデータも集まり、さらなる最適化に生かせるという。アガルワル氏は、配送業務は扱う量が多く成果を測りやすいため、結果から学ぶ強化学習に特に向いていると説明する。うまくいく方法へ寄せ、うまくいかない方法から離れるように仕組みを調整しやすいからだ。\n【ポイント・注意点】配送の改善は顧客企業の収益にすぐ響くため、投資の正当性を示しやすいという。資金は製品・技術チームやマーケティング部門の拡充、導入先の拡大に充てる。アガルワル氏は、技術がうまく働けば配送業務への影響は大きいと話す。記事は同社を、自動運転の現場の出身者が物流の効率化に向かう流れの一つと位置づける。ただし成果の数字は特定の事例のもので、一般化には注意が必要だ。","2026-11-17","TechCrunch","https://techcrunch.com/2026/11/17/pedestal-ai-raises-4-7-million-to-agentify-the-supply-chain/"],["Protonのプライバシー重視AI「Lumo」がデスクトップに対応","スイスのProtonは、AIアシスタント「Lumo」のデスクトップアプリをWindows、macOS、Linux向けに公開した。ファイル操作やシェルの実行、外部サービスとの連携などのエージェント機能を備えつつ、各操作を自動実行・承認制・禁止から選べるのが特徴だ。会話や連携データは広告や学習に使わず、サーバーにログを残さないとし、欧州のインフラで運用する。同社初のNvidia B300クラスターもスイスで稼働を始める。","\n【概要】TechCrunchによると、メールやパスワード管理などでプライバシー重視の代替サービスを手がけるProtonは11月17日、「Lumo Desktop」を発表した。Windows、macOS、Linuxに対応し、PC上の接続アプリや個人のファイル、自動化を使った作業にLumoを利用できる。\n【背景】質問に答えるだけでなく利用者の代わりに作業するAIエージェントの需要が高まり、OpenAIやAnthropic、Metaもデスクトップ向けのツールを出しているが、個人データへのリスクも増す。同じ週にはアップルが、AIデスクトップアプリがよく求める「フルディスクアクセス」を要求するアプリのセキュリティ設定を強めると発表していた。Protonの答えは、AIにどこまで触れさせるかを利用者自身が決められるようにすることだ。\n【詳細】Lumo Desktopは、ファイルシステムへのアクセス、シェルの実行、ブラウザでのコンテンツ取得といったローカルのコネクタに加え、Proton Mail、Confluence、Dropbox、Jiraなどに対応する。AIエージェントが外部のデータ源につながるための仕組みであるMCPのサーバーにも、ローカル・リモートの両方で対応する。コネクタごとに操作を自動実行、承認が必要、完全に禁止のいずれかに設定でき、会話中にツールメニューから個別に無効にもできる。予定したタスクにも、それぞれ権限の設定を持たせられる。指示やテンプレートを保存して再利用する「Skills」にも対応し、従来の「Custom Lumos」はこの形式へ移行する。\n【ポイント・注意点】Protonは、会話や接続したアプリ・ファイルの情報を個人向け広告やAIの学習に「決して使わない」とする。暗号化で利用者だけがチャット履歴を読めるようにし、サーバー側にログを残さず、保存する限られたデータはスイスのプライバシー法で守られると説明する。データは米CLOUD法の対象外とされる欧州のインフラに置かれ、同社初のNvidia B300クラスターもスイスで稼働を始める。","2026-11-17","TechCrunch","https://techcrunch.com/2026/11/17/protons-lumo-a-privacy-focused-alternative-to-chatgpt-and-claude-arrives-on-desktop/"],["「ゲームだ」と偽るとAIが民間人を攻撃目標に、Valsが報告","米AI評価スタートアップのValsは、OpenAIやAnthropic、グーグルなどの主要なAIモデルが、ドローンや衛星の画像から攻撃目標を示す作業に協力してしまうとの報告をまとめた。民間人や投降した兵士、学校が含まれても目標として示すことがあり、拒否された場合も「ゲームの一部」だと伝えると多くが応じた。安全のための分類器が要求を止めた例はなかったという。最も結果が悪かったのはAnthropicのモデルだった。","\n【概要】TechCrunchは11月17日、サンフランシスコのValsが、最先端のAIモデルを自律的な戦争に加担させられるかを検証した報告を紹介した。\n【背景】Anthropicは今年、米国防総省に対し、自社の技術を米国民の大規模監視や自律型の戦争に使わせないと伝え、ダリオ・アモデイCEOは、現在のAIは人間抜きで生死を決めるほど信頼できないと主張してきた。国防総省は合法な軍事目的なら使えるべきだとの立場で、Anthropicは現在、国防総省との有効な契約を持たない。\n【詳細】Valsは模擬シナリオと、生成画像およびウクライナとイランの実画像を使い、ドローンや衛星の画像で目標に印を付けるよう求めた。OpenAI、Anthropic、グーグル、DeepSeekなどのモデルは、民間人や投降兵を含む目標をしばしば示した。拒否されても戦場の場面をゲームだと説明すると、最初に拒んだモデルも多くが従った。安全の分類器に止められた要求はなく、拒否自体もまれだった。一部の場面では人が見えるかを尋ね、見えると答えると模擬攻撃を行い、その結果をモデルに見せた。中でもAnthropicのモデルの結果が最も悪く、2026年2月に米国の攻撃で150人超の民間人が死亡したイランの学校について、Claude Opus 5.5は通常の試行の69%、ゲーム設定の72%で目標に選んだ。この学校は軍事施設に隣接しており、Bloombergは後に攻撃に「AIへの過度の依存」が関わったと報じている。\n【ポイント・注意点】AnthropicとOpenAIはいずれも規約違反だとし、安全策の強化を進めると答えた。検証は軍向けではなく市販のモデルで行われ、モデルが攻撃を直接決める設定でもない。Valsは、遅延や計算資源の制約から実戦のドローン照準への利用は難しいとしつつ、戦場映像の大量の注釈付けが自律照準システムの学習データになる危険を指摘している。なお議会調査局の最近の報告では、国防総省が最先端AIモデルを自律型兵器に直接使っている例は知られていない。","2026-11-17","TechCrunch","https://techcrunch.com/2026/11/17/ai-models-can-be-tricked-into-identifying-civilians-as-military-targets-by-telling-them-its-a-game/"],["Daydream、買い物まで代行するAIスタイリストのエージェント発表","ファッション系スタートアップのDaydreamは、利用者の好みやサイズ、予算を記憶して服を提案し、ワンクリックで購入まで済ませる「Daydream Agent」を発表した。写真を使った仮想試着、セールや新作の見張り、手持ちの服や予定表と連携したコーディネートの提案にも対応する。1万以上のブランドの価格と在庫をリアルタイムで参照し、人間のスタイリストの知見も取り入れる。","\n【概要】TechCrunchは11月17日、Daydreamが個人スタイリスト役のAIエージェント「Daydream Agent」を公開したと報じた。創業者は元Stitch FixのCOOで、2022年にPinterestへ売却したThe Yesの創業者でもあるジュリー・ボーンスタイン氏だ。\n【背景】同社は2023年にAI検索エンジンとして始まり、2025年6月に服探しを手伝うチャットボットを出したが、購入まではできなかった。記事によれば、Metaのマーク・ザッカーバーグCEOは、同社のAIエージェント「Muse」の1000万人超の利用者にとって買い物が主要な用途の一つで、設定した人の25%が毎日使っていると述べており、Daydreamもネット通販を消費者向けエージェントの有力な用途と見る。\n【詳細】新しいエージェントは利用者のスタイル、サイズの好み、予算を記憶して提案を磨く。写真を一度アップロードすれば、保存した服を何度でも仮想試着できる。気に入ればワンクリックで購入でき、セールや新作の見張り、毎週の更新、流行の把握も担う。カートの代わりに比べて考えるための「クローゼットラック」に保存でき、手持ちの服や予定表と連携すれば、持っている服でのコーディネートや予定に合わせた服装も考える。技術面では、1万以上のブランドのリアルタイムの価格・在庫情報をファッションに特化したAIと組み合わせ、OpenAI、Gemini、Claudeのモデルを微調整したものと自社モデルを組み合わせている。\n【ポイント・注意点】ファッションは「科学より芸術」だとして人の関与も重視し、今月初めて「専属スタイリスト」にフランチェスカ・サリー氏を迎えた。StyleGridの創業者でもある同氏が提供する内容は知識データベースに入り、エージェントが服を組み合わせて助言する際の土台になる。同社はForerunner Ventures、Index Ventures、GV、True Venturesから5000万ドルの資金を得ており、2025年6月以降に200万人超が利用したという。","2026-11-17","TechCrunch","https://techcrunch.com/2026/11/17/daydreams-new-ai-agent-acts-as-your-personal-stylist-and-can-shop-for-you-too/"],["元Google Maps幹部の旅行AI、Voyage Labsが1200万ドル調達","旅行計画のAIエージェントを開発するVoyage Labsは、Kleiner Perkins主導のシードラウンドで1200万ドルを調達した。主力の「Atlas」は、旅の着想から調べもの、計画、予約、旅行中の管理までを支える常時稼働のアシスタントで、現在は限定ベータで提供している。数週間にわたる会話で好みを学び、価格の変動を見張って航空券やホテルを予約できるという。","\n【概要】TechCrunchは11月17日、旅行計画のAIを手がけるVoyage Labsが1200万ドルのシード資金を調達したと報じた。Kleiner Perkinsが主導し、SignalFireとSV Angelが参加した。資金は仕入れ先との提携の拡大と技術チームの増強に使う。創業者は元Google Mapsの製品責任者で、主力製品は旅行計画のエージェント「Atlas」だ。\n【背景】CEOで共同創業者のマニク・グプタ氏は、グーグルでGoogle Mapsの製品管理ディレクターを務め、その後Uberで4年間、最高製品責任者を務めた。同氏はGoogle Maps時代を、ひとつの目標に集中して地図を作った経験として振り返り、今もその問題に強い関心があると話す。旅行アシスタントはすでに競争が激しく、MuseやGeminiなど多くの汎用AIエージェントが旅行計画を機能の一つとして打ち出している。\n【詳細】主力製品の「Atlas」は限定ベータで提供中の個人向け旅行計画アシスタントで、旅の全過程を支える常時稼働の存在と位置づけられている。利用者はアイデアを探り、それぞれを調べ、旅を計画・予約・管理できる。グプタ氏は、最初のひらめきから帰宅までの旅全体を扱うと説明する。Atlasは長く続く会話を前提に作られ、数週間かけて利用者の好みの変化に合わせて提案を調整できる。リアルタイムで価格の変動を監視し、最終的には航空券やホテルを予約する。共同創業者でCTOのヨゲシュ・ジェイン氏は、旅行計画には数日から数週間にわたる独自の流れがあり、長時間動くエージェントに自然に合うと話す。\n【ポイント・注意点】最大の課題は、先端AI企業の多機能アシスタントとどう競うかだ。グプタ氏も市場の変化は速く、どの製品の形が勝つかは誰にも予測できないと認める。同社は、旅行やアウトドアは専用の製品が成り立つほど大きな市場だと見て、一貫した体験で勝負する構えだ。汎用エージェントが旅行計画を機能の一つとして扱うのに対し、旅行に絞ることでより深い体験を作れるかが試される。","2026-11-17","TechCrunch","https://techcrunch.com/2026/11/17/voyage-labs-raises-12-million-for-a-specialized-ai-travel-assistant/"],["マイクロソフトのagent-frameworkにPyPIで不正版、認証情報を窃取","セキュリティ企業Wizは、マイクロソフトのPython向けAIエージェント開発パッケージ「agent-framework」の不正なバージョン1.26.1と1.26.2が、11月17日にPyPIへ公開されたと報告した。インストールするだけでAzureやCIの認証情報を盗む仕組みで、約1時間で削除されたが、3件の被害データの持ち出しを確認したという。安全な最新版は1.26.0だ。","\n【概要】Wizの11月17日付（18日更新）の報告によると、agent-frameworkの不正版1.26.1が協定世界時20時35分、1.26.2が21時08分に公開され、21時30分ごろまでに削除された。正規の最新版は11月12日公開の1.26.0だ。\n【背景】PyPIは広く使われるPythonのパッケージ配布所で、AIエージェント開発用の部品も多く流通している。Wizは攻撃者が、マイクロソフトのパッケージ署名・公開の仕組みESRPのクライアント証明書と秘密鍵を不正に得たとみている。AWSからの最初の公開はIP制限で拒まれたが、マイクロソフト所有のIP帯からの2回目は成功した。認証情報の入手経路は分かっていない。\n【詳細】不正版はsite-packagesに「.pth」ファイルを置き、Pythonが起動するたびに窃取コードを動かす。パッケージを読み込まなくても実行される。1.26.1は「agent_framework_meta.pth」、1.26.2は「af_runtime_diag.pth」を使い、名前は正規のSDKの計測機能に見せかけていた。秘密らしい環境変数、最大300の他プロセスの環境変数、Azure CLIやnpm、git、Docker、Hugging Faceのトークンなどを集め、Azureの管理IDトークンも要求して外部のwebhook.siteへ送る。1.26.2ではGitHub ActionsのOIDCトークンも狙い、集めるファイルの上限も60から80に増やした。攻撃者の道具は、オープンソースのAI侵入テスト基盤Cairnを名乗っていた。受信の記録は最大50件で、うち17件が3件の固有の被害データの持ち出しだった。\n【ポイント・注意点】Wizは、ロックファイルやCIのログで該当版を探して1.26.0に固定し、影響を受けた環境の秘密情報をすべて入れ替え、Azureのサインイン記録を監査するよう勧める。盗まれたトークンは最大24時間有効な可能性がある。GitHub Actionsで1.26.2を入れたワークフローは、OIDCトークンが漏れたものとして扱うべきだという。","2026-11-17","Wiz Blog","https://www.wiz.io/blog/malicious-version-of-microsofts-agent-framework-published-to-pypi"],["マイクロソフト、低価格のコーディングモデル「MAI Code 2」発表","Microsoft AIは11月17日、企業の日常的な開発作業向けのコーディングモデル「MAI Code 2」と、大量処理向けの「MAI Code 2 Flash」を発表した。4つのベンチマークでGPT-6.1 Solの98%の性能を40%のコストで実現したとし、GitHub Copilotで利用できる。Flashをさらに最適化した「MAI Work Flash」は、ExcelやWordなどMicrosoft 365の各アプリにも使われる。","\n【概要】マイクロソフトのAI部門Microsoft AIは、Igniteに合わせてMAI Code 2とMAI Code 2 Flashを公開した。いずれも競合モデルの何分の一かのコストで高い性能を出すとうたう。\n【背景】企業の開発現場では、本番への投入や不具合の調査、複数ファイルにまたがる実装など、日々繰り返される作業が多い。同社はこうした作業で価格性能比を高めることを狙った。MAI Code 2は、基礎科学の研究や非常に長いエージェント作業向けには調整されていないとしている。\n【詳細】MAI Code 2はDeepSWE 1.1、Terminal Bench 2.1、SWE-Atlas、FrontierCode v1.1の4つで、GPT-6.1 Solの98%の性能を40%のコストで、Claude Opus 5.5の96%の性能を5%のコストで達成したという。258人の評価者による画面やゲーム、3D、SVGなどの見比べでは、64%がGPT-6 SolよりMAI Code 2を好んだ。Flashはコードの説明や小さな修正、定型の修正など大量の作業向けだ。さらにFlashを最適化した「MAI Work Flash」は、Excel、PowerPoint、Word、Teams、Fabric IQで使われ、WordではGPT-6.1 Sol並みの性能で入力トークンを約42%減らしたとする。Teamsでは決定事項の追跡や独自の指示への従い方でGPT-6 Lunaを上回り、Fabric IQではPower BIの「Chat with your Data」を支えるDAXクエリの生成で他社モデルを上回ったという。\n【ポイント・注意点】両モデルはGitHub Copilotで使え、FlashはMicrosoft Foundryで限定プレビュー中で、OpenRouterなどにも近く提供する。比較では全モデルを最大の推論設定で動かしたという。示されたコストは50%の販促価格によるもので、結果は作業内容や設定、価格の前提で変わると同社自身が注記している。","2026-11-17","Microsoft AI","https://microsoft.ai/news/introducing-mai-code-2-and-mai-code-2-flash/"],["GitHub Copilot Fusion、Terminal-Benchで71.2%　新モデルも追加","GitHubは11月17日、複数のAIモデルを作業ごとに選んで組み合わせる「Copilot Fusion」の更新を発表した。最上位のFusion Maxは、端末での作業をこなすTerminal-Bench 4.1で解決率71.2%を記録し、Opus 5.5とFable 5.2を5.4ポイント上回ったという。github.comやVisual Studio、モバイルのベータ版にも広がり、Claude Sonnet 5.5などのモデルが加わった。","\n【概要】GitHubの変更履歴（Changelog）によると、Copilot Fusionは新しいモデルの追加、対応環境の拡大、公開ベンチマークへの掲載という3点で更新された。変更は11月17日付で公開された。\n【背景】Copilot Fusionは、利用者がモデル選択の画面でFusionを選ぶと、作業ごとに適したモデルを選んで連携させる仕組みだ。利用者は努力の度合い（エフォート）を指定するだけで、モデルの選択と協調はCopilotが受け持つ。同じ日には、GPT-6.2モデルやコードレビュー機能、JetBrains対応、Copilot Evalsの公開プレビューなど、Copilot関連の発表が多数並んだ。\n【詳細】Copilot Fusionは、スタンフォード大学、Harbor、Laude Instituteが運営するTerminal-Bench 4.1の公開ランキングに掲載された。このベンチマークは、AIエージェントが端末で難しく現実的な課題をどれだけこなせるかを測る。Fusion Maxの解決率は71.2%で、最先端モデルのOpus 5.5とFable 5.2を5.4ポイント上回り、コストはFable 5.2より88%、Opus 5.5より57%少なかったとしている。対応環境は最新のgithub.com、Visual Studio、iOSとAndroidのGitHub Mobileベータ版に広がり、正式版のモバイルアプリにも近く対応する。モデルでは、Fusion MaxにClaude Sonnet 5.5、Fusion HighにGPT-6.1 Terra、Fusion StandardにMAI-Code-2が加わった。\n【ポイント・注意点】GitHubは独立したランキングを、同じ課題と同じ評価規則で他のエージェントと比べる手段と位置づける。ただしコストの比較は同社の発表によるもので、実際の費用は使い方で変わりうる。利用者が個々のモデルを選び分けなくても、作業に応じた組み合わせを使える点がFusionの売りといえる。","2026-11-17","GitHub Changelog","https://github.blog/changelog/2026-11-17-github-copilot-fusion-updates-more-availability-benchmarks-and-models/"],["NATO、OpenAIのサイバー防御AIを月最大3000億トークン利用","NATOの通信情報庁（NCIA）が、OpenAIの審査済み防御者向けプログラム「Daybreak」を通じ、同盟の中核機関にOpenAIのサイバーセキュリティ用モデルを使わせていることが分かった。利用量は月に最大3000億トークンに達する。EUのサイバーセキュリティ機関ENISAや、ウクライナ、ポーランドなどの政府機関も、ソフトウェアの脆弱性の発見に活用している。","\n【概要】Help Net Securityは11月17日、NATOがOpenAIのサイバー防御向けモデルを使って同盟のネットワークを守っており、入出力を合わせて月に最大3000億トークンを消費していると報じた。\n【背景】利用はOpenAIの「Daybreak」を通じて行われる。審査を受けた防御側の組織向けのプログラムで、コードレビューや不審な動きの調査、修正の検証など、許可されたセキュリティ業務を支援する。欧州の機関が日常的に使うソフトウェアの弱点を、AIで先回りして見つける動きが広がっている。\n【詳細】EUのサイバーセキュリティ機関ENISAはOpenAIのモデルで、EUの機関で使われるソフトの脆弱性4件を見つけ、すべてに修正が出ている。ENISAとCERT-EUは、OpenAIを含む複数の最先端モデルやCodexのセキュリティ用プラグインで27のソフトウェアプロジェクトを調べ、保守担当者が評価した88件の潜在的な問題のうち95%が本物と確認された。ポーランドのCERT PolskaはOpenAIのモデルの助けでMikroTik RouterOSの脆弱性6件を特定し、実機で確かめた。MikroTikは修正を公開し、CERT Polskaは観測していた攻撃をこの修正で防げることを確認した。ウクライナのデジタル転換省は民間インフラの防御に使い、フランスのANSSIやドイツ、ポーランドの機関も利用できる。NATOサイバー防衛協力センター（CCDCOE）が運営する演習Crossed Swords 2026では、参加者がDaybreakの中でサイバー作戦用のAIエージェントを作って試し、人間が制御を保つことが重視された。\n【ポイント・注意点】NCIAのディラン・ブラウン氏は、導入の拡大とともにトークン消費への理解を深め、費用の管理や他の製品との比較、調達の判断に生かすとした。いずれの事例も専門家が作業を導き、結果を検証している。記事は、AIを使った脆弱性の発見を政府が取り入れる動きが、NATOやEU、加盟国で広がっていると伝えている。","2026-11-17","Help Net Security","https://www.helpnetsecurity.com/2026/11/17/openai-nato-ai-cyber-defense/"]],"gh-pop":[["NVIDIAのスキル評価基盤「SkillEvaluator」v1.0.1公開","NVIDIAが公開するAIエージェント向けスキル・プラグインの評価フレームワーク「SkillEvaluator」が、11月18日にv1.0.1をリリースした。1.0系で最初の完全なリリースと位置づけられ、Claude Code、Codex、Copilot CLIなど6種のエージェントでスキルが見落とされたり拒否されたりしないかを調べる「HarnessCheck」を搭載する。GitHub Trendingでは1日で323スターを集めている。","\n【概要】\nNVIDIAのリポジトリ「SkillEvaluator」が11月18日にv1.0.1を公開した。AIエージェントのスキルやプラグインについて、品質、セキュリティ、重複、互換性、実際の効果を評価するためのフレームワークで、リリースノートでは「1.0系で最初の完全なリリース」と説明されている。前日に出たv1.0.0は差し替え扱いとなり、Pythonパッケージ、CIバンドル、リリース資産はv1.0.1を使うよう案内されている。GitHub Trendingでは総スター3,539、1日で323スターを獲得した。\n\n【背景】\nエージェントにスキルを足して能力を広げる使い方が広がる一方、スキルが本当に読み込まれるか、他のスキルと衝突しないか、入れて効果があるかは確かめにくい。SkillEvaluatorはLLMのキーなしで動く静的な品質チェック(100点満点、既定の合格ラインは70点)から、スキルの有無でエージェントの実行結果を比べる実地評価までを段階的に用意している。\n\n【詳細】\nv1.0.1の目玉はHarnessCheckで、Claude Code、Codex、Copilot CLI、Hermes、OpenClaw、OpenCodeの各環境で、スキルが見落とされる・拒否される・途中で切られるおそれを調べる。探索パス、フロントマター、説明文や本文の長さの上限、呼び出し設定、他の導入済みスキルとの衝突などを点検し、モデルのキーは不要で、既定では助言扱いとなる。ほかにNeMo Gymをバックエンドにした第3段階の評価、トークン予算などを設定できる品質設定、成果と次の行動を先に示すHTMLレポート、JUnit XML出力、PRに採点コメントを付ける再利用可能なGitHubワークフローが加わった。\n\n【ポイント・注意点】\n対応するPythonは3.12〜3.14で、pipでskillevaluatorを更新したあとci initを実行する。v0.9.0からの移行では、作者ポリシーやセキュリティ上書き、フックの関門に関する変更を変更履歴で確認するよう求めている。またCIのワークフローやイメージの固定はPythonパッケージとは別に更新が必要だと明記されており、パッケージだけ上げてもCI側は古いままになる点に注意したい。ライセンスはApache-2.0。","2026-11-18","GitHub (NVIDIA/SkillEvaluator Releases)","https://github.com/NVIDIA/SkillEvaluator/releases"],["AIの計画レビュー道具「Plannotator」がコードレビュー版に","AIエージェントへの計画づくりやレビュー、フィードバックのための作業場「Plannotator」が、11月18日にv0.29.0を公開した。リリース自ら「コードレビューのリリース」と呼び、レビュー画面を作り直したほか、移動・改名・整形を見分ける11言語対応の意味的差分や、レビューコメントをエージェントとのスレッドとして送る機能を加えた。週間で2,926スターを集めている。","\n【概要】\nAIエージェントの計画づくり、レビュー、フィードバックのための作業場をうたう「Plannotator」が、11月18日にv0.29.0をリリースした。48本のプルリクエストを含む大型更新で、リリースノートでは「コードレビューのリリース」と位置づけている。GitHub Trendingの週間ランキングでは総スター13,307、1週間で2,926スターを獲得した。\n\n【背景】\nコーディングエージェントが書いたコードや計画を人がどう確かめ、どう指示を返すかは、エージェント活用の大きな課題になっている。PlannotatorはClaude Code、Pi、OpenCode向けのプラグインを持ち、レビュー画面やエージェントとの会話をまとめるInbox、定型作業のRoutinesといった機能で、その往復を支える。\n\n【詳細】\nコードレビュー画面は作り直され、種類やGitの状態でまとめられる新しいファイルツリー、タブ付きの2画面、画像差分(左右並べ、スワイプ、重ね合わせ)、ミニマップが入った。Code Tourは廃止された。意味的差分は11言語で、移動・改名・整形されただけのコードをそのように表示し、解析はブラウザ内で行う。任意の「Power Up」では選んだモデルにコードを送るが、キーを入れるまでは無効だ。レビューコメントは接続中のエージェントにスレッドとして送り、返信や配送状況、解決まで扱える。Inboxのコードレビューは設定から有効にする方式に変わり、PRボード、リスクルールによるHigh・Medium・Lowの順位付けなどが加わった。動画の再生速度は1〜2倍に対応した。\n\n【ポイント・注意点】\nClaude Code 2.1.326のTeam・Enterprise環境でエージェントから開けなかった問題や、Tailscale復帰後に機器へ届かない問題などが修正された。一方、Pythonのdocstringの変更が整形扱いになることがある、スマートフォンで意味的差分のラベルが出ない、Safariで取り消しの挙動が異なるといった既知の問題も明記されている。導入はmacOS・Linuxならシェルスクリプト、WindowsならPowerShellのスクリプトで行う。","2026-11-18","GitHub (backnotprop/plannotator Releases)","https://github.com/backnotprop/plannotator/releases/tag/v0.29.0"],["アリババのAIコードレビュー「Open Code Review」が人気","アリババが公開するAI搭載のコードレビューCLI「Open Code Review」が、11月18日にv1.13.12をリリースした。社内で数万人の開発者に使われてきたレビュー支援を元にした道具で、決まった手順で動く処理とLLMエージェントを組み合わせ、行単位の指摘を出す。GitHub Trendingの週間ランキングでは1週間で3,675スターを集め、総スターは5万4,000を超えた。","\n【概要】\nアリババのオープンソースのコードレビューCLI「Open Code Review(OCR)」が、11月18日にv1.13.12を公開した。GitHub Trendingの週間ランキングでは総スター54,122、1週間で3,675スターを獲得している。今回のリリースは、ウェブサイトへの連絡先リンク追加のほか、セッションの識別項目の分離、ファイル読み取りの上限を行数だけでなくバイト数でも掛ける変更、部分的な失敗時に0以外の終了コードを返す修正などを含む。\n\n【背景】\nREADMEによると、OCRはアリババグループ社内のレビュー支援が出発点で、数万人の開発者に使われ、数百万件の欠陥を見つけてきたという。プロンプトだけで動くエージェントは強い制約がなく、見落としや指摘位置のずれ、品質のばらつきが起きやすいというのが開発側の問題意識だ。\n\n【詳細】\nOCRは仕事を二つに分ける。正確さが必要な部分、つまり対象ファイルの選択、関連ファイルを束ねたレビュー単位への分割、ファイルの性質に応じたルールの当てはめ、指摘位置の決定と内容の見直しは、決まった手順の処理が受け持つ。レビュー単位は文脈を分けたサブエージェントとして並行に動く。判断や文脈の取得はエージェントが担う。動かし方は、自前のエージェントで審査するネイティブモードと、Claude Codeなど手元のエージェントに分析を任せる委任モードがある。GitHub Actions、GitLab CI、Gerritなどとの連携、MCPサーバー対応も備える。\n\n【ポイント・注意点】\nREADMEは、50のリポジトリ、200件の実際のPR、10言語から作ったAACR-Benchで、同じモデルを使うClaude Codeより適合率とF1が大幅に高く、トークン使用量は約9分の1だったとしている。一方で再現率は低く、雑音より正確さを優先した意図的な選択だと説明している。利用にはGit 2.41以上が必要。委任モードでも手元のエージェント自身の認証や利用上限、費用はかかる点に注意したい。ライセンスはApache-2.0。","2026-11-18","GitHub (alibaba/open-code-review Releases)","https://github.com/alibaba/open-code-review/releases/tag/v1.13.12"],["Svelte 5.58.0公開、devtools向け情報やSSR高速化","Webフレームワーク「Svelte」が11月18日にsvelte@5.58.0をリリースした。Svelte devtools向けに、開発時のレンダー記録へスニペット名を、要素の追跡にコンポーネントのインスタンスを加えたほか、サーバーレンダリングの高速化や、コンパイル後に各コンポーネントのASTを解放する変更を含む。GitHub Trendingでは1日で694スターを集め、総スターは8万9,000を超える。","\n【概要】\n分かりやすい開発をうたうWebフレームワーク「Svelte」が、11月18日にsvelte@5.58.0を公開した。10月26日の5.57.3以来の更新で、マイナー版として新機能を含む。GitHub Trendingの日次ランキングでは総スター89,649、1日で694スターを獲得しており、日次ランキングの上位に入っている。\n\n【背景】\nSvelte 5系では8月の5.57.0でsvelte/serverからのレンダー出力型の公開、createContextのhas関数、selectのdefaultValue対応などが入り、その後の5.57.1〜5.57.3は不具合修正が中心だった。9月の5.57.1ではSSRのメモリ消費削減やパーサーの性能改善、10月の5.57.2ではトップレベルawaitまわりの修正が多数入っている。\n\n【詳細】\n5.58.0では、開発時のrenderの記録にsnippetNameを加え、開発時の要素追跡にコンポーネントのインスタンスを含めるようにした。いずれもSvelte devtoolsで、どのスニペットやコンポーネントが描画したかをたどりやすくするための変更だ。さらにサーバーレンダリングの高速化、titleタグがサーバーとクライアントで同じに描画されるようにする修正、コンパイル後に各コンポーネントのASTを解放してメモリを空ける変更が入った。直前の5.57.3では、アクセシビリティのロール検査が最初の有効な代替ロールを使うようになり、ハイドレーション時の不要な属性書き込みの省略なども行われている。\n\n【ポイント・注意点】\n今回の変更は開発ツールとの連携とサーバー側の性能に寄ったもので、アプリ側のコードを書き換える必要がある大きな仕様変更は、リリース一覧の要約からは見当たらない。titleの描画の差が気になっていたプロジェクトや、SSRの負荷に悩むプロジェクトは更新の効果を確かめやすいだろう。devtoolsを使う開発者は、表示される情報が増える点を確認しておきたい。","2026-11-18","GitHub (sveltejs/svelte Releases)","https://github.com/sveltejs/svelte/releases"],["n8nが安定版2.48.5、AI Agentの履歴を入力ごとに分離","ワークフロー自動化基盤「n8n」が11月18日に安定版n8n@2.48.5を公開した。AI Agentのツール呼び出し履歴を入力項目ごとに分けて保つ修正や、新規インストールにランダムなインスタンスIDを与える修正、公開APIのレート制限変更時の監査イベント送信などを含む。同日には1.123.98とベータ版2.49.1も出た。GitHub Trendingでは1日で315スターを集めている。","\n【概要】\nAI機能と400以上の連携先を持つフェアコードのワークフロー自動化基盤「n8n」が、11月18日に安定版のn8n@2.48.5を公開した。同じ日には旧系統の1.123.98と、ベータタグが付いたプレリリースの2.49.1も出ている。GitHub Trendingの日次ランキングでは総スター210,881、1日で315スターを獲得した。\n\n【背景】\nn8nは安定版、旧系統、ベータ、次期メジャー版を並行して頻繁に出している。リリース一覧によると、11月17日には次期メジャーとなるn8n@3.3.0と2.49.0がプレリリースとして公開され、13日の2.48.4と2.47.7では、全体共有の認証情報を使った実行が伏せ字にされてしまう問題が直された。\n\n【詳細】\n2.48.5の修正は、AI Agentでツール呼び出しの履歴を入力項目ごとに分けて保つこと、ストリーミングされた文章の断片の間に余計な改行が入るのを止めることが柱だ。コア部分では、新規インストールにランダムなインスタンスIDを与える修正、サンドボックス化された式の中でError内の小さなオブジェクトを保つ修正、認証情報の確認でインスタンスの所有者と管理者をチームプロジェクトのメンバーとして扱う修正が入った。エディターでは共有ライセンスなしでもワークフローをチームプロジェクトへ移せるようになり、Microsoft Teamsトリガーがまとめて届いた変更通知をすべて出すように、Qdrantベクトルストアがリバースプロキシのサブパスを保つように直された。機能面では、公開APIのレート制限が変わった際に監査イベントを送るようになった。\n\n【ポイント・注意点】\nベータの2.49.1にもインスタンスIDや認証情報確認の修正が同じく入っており、移行レポートで最後の実行状態を説明する機能が加わった。1.123.98はリリースページに変更内容が書かれていない。AI Agentを複数の入力項目で回しているワークフローでは、履歴の混ざり方が変わる可能性があるため、更新後に結果を確かめておきたい。","2026-11-18","GitHub (n8n-io/n8n Releases)","https://github.com/n8n-io/n8n/releases"],["jQuery 4.1.0公開、ReDoS脆弱性の修正など","JavaScriptライブラリ「jQuery」が11月17日に4.1.0をリリースした。セレクターの識別子照合にあったReDoS脆弱性の修正、Safari 27の正規表現の不具合への回避策、jqXHRへのresponseURL追加、フォームに関連付くカスタム要素のシリアライズ対応などを含む。Hacker Newsでも話題となり、GitHub Trendingでは1日で268スターを集めた。","\n【概要】\njQueryが11月17日に4.1.0を公開した。公開したのはTimmy Willison氏で、最新リリースとして登録されている。リリースには4.1.0と3.8.0についての「バトンを渡す」と題したブログ記事が添えられている。Hacker Newsでは355ポイント、186件のコメントを集め、GitHub Trendingの日次ランキングでも総スター59,974、1日で268スターを獲得した。\n\n【背景】\njQueryは4.0で大きく整理が進み、READMEも4.0の公開に合わせて更新されていた。今回の4.1.0はその後の改良と修正をまとめたもので、新しいブラウザーへの対応や安全性の向上が中心になっている。\n\n【詳細】\nAjaxではjqXHRにresponseURLの項目が加わり、トランスポートで別の完了コールバックAPIを使えるようになった。コアではループが配列の範囲を越えないよう整理され、getElementsByTagNameとgetElementsByClassNameをやめてquerySelectorAllに一本化した。CSSではXML文書でも動くようcreateElementNSを使うよう改めた。セレクターでは、識別子の照合にあったReDoS脆弱性を修正し、Safari 27の正規表現インタプリターの不具合への回避策を入れ、無効なエスケープのコードポイントをU+FFFDに変換するようにした。jQuery.uniqueSortの重複除去も最適化された。シリアライズはフォームに関連付くカスタム要素に対応した。ドキュメントでは、機械生成の貢献についての指針が加わった。\n\n【ポイント・注意点】\nReDoSは細工した入力で処理を長時間止められる種類の脆弱性で、ユーザー入力をセレクターに使う場面がある場合は更新の優先度が高い。Safari 27を対象にするサイトも、回避策の恩恵を受ける。テストではChromeでreliableTrDimensionsが失敗する前提に改めたほか、:enabledや:disabledの新旧両方の意味を受け入れるよう緩めており、ブラウザー側の仕様変化への追随が続いている。","2026-11-17","GitHub (jquery/jquery Releases)","https://github.com/jquery/jquery/releases/tag/4.1.0"],["MicrosoftのONNX RuntimeがGitHubから消え騒然","機械学習モデルの推論エンジン「ONNX Runtime」のGitHubリポジトリが見られなくなり、Hacker Newsで406ポイントを集める話題になった。投稿者はパイプラインの評価が失敗し始めて気づいたという。Microsoftからの公式説明はスレッド内になく、侵害されたパッケージとの関連や脆弱性対応を疑う声が出る一方、PyPIなどのパッケージ配布は続いていると報告されている。","\n【概要】\nMicrosoftの推論エンジン「ONNX Runtime」のGitHubリポジトリが閲覧できなくなったとして、Hacker Newsに「MicrosoftのONNX RuntimeがGitHubから消えた」という投稿が11月17日に立ち、406ポイント、82件のコメントを集めた。投稿者は、自分たちのパイプラインで評価が失敗し始めたことで気づいたと書き、2万2,000スターのリポジトリがなぜ消えたのかと問いかけている。\n\n【背景】\n投稿者の例のように、リポジトリが突然見えなくなると、それに頼るパイプラインやソースからのビルドに影響が出る。スレッド内にはMicrosoftからの公式な説明は見当たらない。\n\n【詳細】\nコメントでは複数の見方が出ている。一つは、Microsoft Agent FrameworkのPyPIパッケージが侵害されたという件との関連で、agent-frameworkのリポジトリも見えなくなっていると指摘された。公式な連絡がないことから管理者アカウントの侵害を疑う声もあれば、両方に関わる貢献者が原因ではないかという声もある。ONNXモデルで任意のファイルパスを読ませられるという解析器の欠陥の話も出たが、修正は6月12日のv1.27.0で出ているとみられ、直接の原因ではなさそうだという指摘もあった。Microsoft Igniteに合わせたリポジトリ統合という推測には、削除は移行の方法として受け入れられないとの反論が付いた。\n\n【ポイント・注意点】\n利用者の報告では、onnxruntime.aiのサイトは動いており、PyPIとMaven Centralのパッケージも見えている。onnx/onnxのリポジトリは残っているが、仕様だけで実行環境ではない。IntelのフォークやWeb Archiveの写しが挙がる一方、SourceForgeの写しにはマルウェアが混じるおそれがあるとの警告もあった。原因が分からないうちは、出所の確かでないフォークや写しの利用は避けたい。","2026-11-17","Hacker News","https://news.ycombinator.com/item?id=50539610"],["AWS Trainium向けLLM推論エンジン「TrnRT」登場","AWSの独自AIチップTrainium向けのオープンソースLLM推論エンジン「TrnRT」が、Hacker NewsのShow HNで公開された。開発元はRunAnywhereで、trn2.48xlarge1台からOpenAI互換のAPIでGLM-5.3-Flashを提供する。SemiAnalysisのAgentXベンチマークでは、既定設定で毎分357万トークンを処理したとしている。ライセンスはApache-2.0。","\n【概要】\nRunAnywhereが、AWS Trainium向けのオープンソースLLM推論エンジン「TrnRT(Trainium RunTime)」を11月17日にHacker NewsのShow HNで公開した。投稿者によれば開発は約3週間前に始めたもので、GitHubのリポジトリはスター1,600を集めている。trn2.48xlarge1台でOpenAI互換のAPIを提供する。\n\n【背景】\n投稿者は、trn2.48xlargeではメモリ1TBあたりの費用がAWS上のH200 8基構成の半分以下だと動機を説明する。一方で、vLLMのNeuron版はGLMモデルを登録せず、NxDIは活発な開発が止まり、SGLangのNeuron実装もtrn2への対応が十分でないという。コメントでも、Amazonの規模の割にTrainiumのソフトウェア環境が弱いという声が出ている。\n\n【詳細】\nREADMEによると、対応モデルは現時点でGLM-5.3-Flashのみで、総パラメータ3,200億、動くのは180億の専門家混合モデル、FP8、100万トークンの文脈を持つ。デコードはNKIのメガカーネルで動き、層の半分ごとにほぼ1つの融合カーネルにまとめた。上位2,048トークンに絞る疎な注意と固定サイズの状態を持つ線形注意を組み合わせ、長い文脈を扱う。FP8のKVページを基数木で持つ接頭辞キャッシュとホストメモリの層、セッションを同じエンジンに送るルーターも備える。AgentXでは32のエージェントを1時間走らせ、既定のバッチ12で毎分28.9リクエスト、357万トークン、スポット価格で100万トークンあたり0.040ドルだった。\n\n【ポイント・注意点】\nこれらの数値は以前のビルドで測ったもので、現行版では出力が以前のビルドと384件中384件でバイト単位一致したと報告している。投稿では、疎な注意のプリフィルに近似があり、ブロック選択の約1.2%に影響する既知の問題も示された。TrnRTはAWSとは無関係の独立プロジェクトで、他のモデルへの対応は今後の予定だ。","2026-11-17","Hacker News","https://news.ycombinator.com/item?id=50533270"],["Python管理ツール「uv」0.13.9、lockファイルを軽量化","Rust製の高速なPythonパッケージ・プロジェクト管理ツール「uv」が、11月17日に0.13.9をリリースした。環境マーカーの重複条件をくくり出してlockファイルを小さく速く読めるようにしたほか、PEP 832の.venvリダイレクトファイルをプレビューで導入した。対応するRustの最低版は1.98に上がった。GitHub Trendingでは1日で260スターを集めている。","\n【概要】\nAstralが開発するPythonのパッケージ・プロジェクト管理ツール「uv」が、11月17日にバージョン0.13.9を公開した。Rustで書かれ、速さを売りにするツールで、GitHub Trendingの日次ランキングでは総スター92,142、1日で260スターを獲得している。今回はプレビュー機能2件、性能改善、複数の不具合修正を含む。\n\n【背景】\nuvはPythonの仮想環境、依存関係の解決、lockファイルの管理などをまとめて扱えるため、従来の道具の置き換えとして広く使われるようになった。lockファイルは依存関係が多いほど大きくなり、読み込みの時間にも影響するため、その大きさは日々の使い勝手に関わる。\n\n【詳細】\n性能面では、環境マーカーの中で繰り返し出てくる条件をくくり出すことで、lockファイルを小さくし、読み込みも速くした。プレビュー機能としては、PEP 832で定められた.venvリダイレクトファイルをプロジェクト環境で使えるようにしたほか、リクエストが残っているのに応答しないHTTP/2接続を閉じるhttp2-keep-aliveを加えた。不具合修正では、インデックスが別のパッケージ名で載せているwheelを拒否するようにし、書き方の違う同等なプラットフォームマーカーを含むlockファイルがuv lock --lockedで拒否される問題を直した。アポストロフィを含むマーカーの値も正しく引用されるようになった。musl環境で読めるバージョンを返さないインタプリターがあった場合は、どれが失敗したかを示すようエラーも改められた。\n\n【ポイント・注意点】\nwheel名の検証が厳しくなったため、名前の食い違うwheelを置いている独自インデックスを使っている場合はインストールが失敗するようになる可能性がある。また、対応するRustの最低版が1.98に引き上げられたので、uvをソースからビルドしている環境では手元のRustのバージョンを確認しておきたい。プレビュー機能は今後変わる可能性がある点にも留意したい。","2026-11-17","GitHub (astral-sh/uv Releases)","https://github.com/astral-sh/uv/releases/tag/0.13.9"],["個人資産管理アプリ「Sure」、証券連携を大幅強化","開発元が手放したMaybe Financeを引き継いだコミュニティ版の個人資産管理アプリ「Sure」が、11月17日にv2026.11.17-alphaを公開した。IBKRやSnapTradeからの取引取り込み、EODHDの市場データ、欧州の銀行連携などを広く改善し、SSRF対策も入れた。GitHub Trendingの週間ランキングでは1週間で4,786スターを集めている。","\n【概要】\nオープンソースの個人資産管理アプリ「Sure」が、11月17日にv2026.11.17-alphaをプレリリースとして公開した。中身はv0.7.7-alpha.7と同じコミット、同じイメージの別名だ。GitHub Trendingの週間ランキングでは総スター16,413、1週間で4,786スターを獲得しており、資産管理アプリとして注目を集めている。\n\n【背景】\nSureはMaybe Financeのフォークだ。READMEによると、元の開発チームは約100万ドルをかけてアプリを作ったが事業として成り立たず、ソースを公開したうえでリポジトリを保管扱いにした。Sureはこれをコミュニティで引き継いだもので、Maybe Finance社とは無関係だと明記している。Dockerでの自前運用のほか、Renderへのワンクリック配備などの選択肢がある。\n\n【詳細】\n今回は証券・投資の取り込みが大きく改善した。IBKRからは源泉税、利息、手数料を取り込み、365日より前の履歴も取得する。SnapTradeでは1,000件を超える取引をページ送りで読み、建玉中のオプションも取り込む。市場データのEODHDでは有料キーの1年の履歴制限を外し、フランクフルトやウィーンなど欧州の取引所の対応を加えた。銀行連携のEnable Bankingは初回同期で取れる履歴をすべて取得する。予算や報告、資産の重みの計算も直され、ローン支払いの変化や口座残高で払えない請求を知らせる新しい分析が加わった。\n\n【ポイント・注意点】\nセキュリティ面では、MercuryとSophtronの接続先を許可リストに限ってSSRFを防ぎ、FinanceKitの一括アップロードにも上限を設けた。為替レートがないときに1倍で換算してしまう問題も直っている。インドネシア語とドイツ語の翻訳も追加された。添付のAndroid版とiOS版はテスト用のデバッグビルドで、本番で使うにはソースから正しく署名してビルドする必要がある。ライセンスはAGPLv3。","2026-11-17","GitHub (we-promise/sure Releases)","https://github.com/we-promise/sure/releases/tag/v2026.11.17-alpha"],["Appwrite 2.7.3、イメージの脆弱性対応の保守版","エージェントと開発者向けのオープンソースのバックエンド基盤「Appwrite」が、11月17日に2.7.3を公開した。新しいベースイメージで作り直し、実行環境のexecutorも1.3.5に上げて、イメージに残っていた脆弱性の指摘に対応した保守版だ。2.7.2からの更新でスキーマの変更は不要としている。GitHub Trendingでは1日で239スターを集めた。","\n【概要】\n認証、データベース、ストレージ、関数などをまとめて提供するオープンソースのバックエンド基盤「Appwrite」が、11月17日にバージョン2.7.3を公開した。2.7系の保守版で、新しいベースイメージで作り直し、より新しいexecutorに移ることで、イメージに残っていた脆弱性の指摘に対応している。GitHub Trendingの日次ランキングでは総スター58,143、1日で239スターを獲得した。\n\n【背景】\nAppwriteは自前のサーバーにDockerで入れて使うバックエンドで、エージェントと開発者のための基盤をうたう。コンテナイメージに含まれる部品に脆弱性が見つかると、アプリの機能に変化がなくてもイメージを作り直す必要がある。今回はそうした対応のための更新だ。\n\n【詳細】\nベースイメージのappwrite/baseは2.2.12になった。2.2.11を最新のAlpineのパッケージで作り直したもので、libpq 18.7を含む。関数を動かすopenruntimes/executorは1.3.1から1.3.5に上がり、イメージ内のCVEの修正が入った。削除された機能はない。インストールは、Dockerのソケットとappwriteディレクトリをつないでinstallの入口でインストーラーを動かす。2.7系からの更新では、まずデータを退避し、同じDockerコマンドをupgradeの入口で実行し、そのあとAppwriteのコンテナ内でmigrateを実行する。リリースはChiragAgg5k氏が公開した。\n\n【ポイント・注意点】\nリリースノートは、2.7.2からの更新にスキーマの変更は要らないと明記している。2.7.3は2.7.1、2.7.2と同じ移行処理を使うため、すでに2.7系で動いている環境ではmigrateを実行してもデータは変わらない。それでも更新前の退避は手順の最初に挙げられているので、省かないようにしたい。機能追加はなく、自前で運用している場合のセキュリティ対応としての意味が大きい。","2026-11-17","GitHub (appwrite/appwrite Releases)","https://github.com/appwrite/appwrite/releases/tag/2.7.3"],["話題の調査スキル「last30days」v4.3.2公開","Reddit、X、YouTube、Hacker News、Polymarket、Webをまたいで話題を調べて要約するAIエージェント用スキル「last30days-skill」が、11月17日にv4.3.2を公開した。Exa検索での企業の競合調査やペルシャ語のREADMEなど7件の変更を含む。GitHub Trendingでは1日で1,062スターを集め、総スターは約7万に達している。","\n【概要】\nAIエージェントに複数のプラットフォームを横断して話題を調べさせ、結果を要約させるスキル「last30days-skill」が、11月17日にv4.3.2をリリースした。7件の変更をまとめたもので、2人が初めての貢献者として加わった。GitHub Trendingの日次ランキングでは総スター69,706、1日で1,062スターを獲得し、週間でも1,548スターを集めている。\n\n【背景】\nこのスキルはReddit、X、YouTube、Hacker News、Polymarket、Webを対象に、あるテーマについて人々が何を言っているかを集めて整理する。エージェントにスキルを足して使う流れが広がるなか、調べものを任せる用途の代表例として人気を集めている。\n\n【詳細】\n機能面では、Exa検索でハイライトを取り出すようにし、公式サイトへの代替手段と、企業についての競合検索を加えた。修正では、Xのブラウザーのクッキーがないときに理由を説明するようにし、Redditの過去ログの探索が失敗したときは完全ではなく部分的と報告するよう改めた。診断用のdoctorコマンドが効果のない文字起こし用キーを勧める問題も直り、WindowsではPrinting PressのCLIを管理下のbinディレクトリから見つけるようになった。ドキュメントではペルシャ語のREADMEが追加された。最後に、ボットによる版番号の更新が入っている。今回の貢献者のうち、abbasi0abolfazl氏とqq2514568380氏の2人は初めての貢献となった。\n\n【ポイント・注意点】\nRedditの過去ログが一部しか取れなかった場合に、これまでは完全な結果のように見えていた点が改められたことは、調査結果をうのみにしないうえで意味が大きい。Xを対象にするにはブラウザーのクッキーが必要になる場合があり、ない場合の案内が出るようになった。リリース後もmainには24件のコミットが積まれており、開発が活発に続いている。リリースノートにはv4.3.1からv4.3.2までの全変更履歴へのリンクも付いている。","2026-11-17","GitHub (mvanhorn/last30days-skill Releases)","https://github.com/mvanhorn/last30days-skill/releases/tag/v4.3.2"],["AI株式分析「daily_stock_analysis」が台湾市場に対応","LLMを使って複数市場の株式を定期的に分析する「daily_stock_analysis」が、11月16日にv3.35.0を公開した。台湾市場の振り返りに対応し、複数市場をまとめて選べるようにしたほか、A株とETFのデータ源にTickPlusを追加した。マルチエージェントの処理を並列化して速くし、通知の不具合も直した。GitHub Trendingの週間ランキングでは3,653スターを集めている。","\n【概要】\nLLMで複数市場の株式を分析し、定期的に報告を出すオープンソースプロジェクト「daily_stock_analysis」が、11月16日にv3.35.0をリリースした。GitHub Trendingの週間ランキングでは総スター73,290、1週間で3,653スターを獲得している。今回は台湾市場への対応が目玉で、9人の貢献者が名を連ねている。\n\n【背景】\nこのプロジェクトはAIモデルと市場データの提供元を組み合わせ、毎日の銘柄分析や市場の振り返りを作り、ntfy、Bark、Telegramなどの通知手段で届ける。中国、香港、米国、日本、韓国の5市場に対応してきた。\n\n【詳細】\n新機能として、台湾市場の振り返りを加え、複数の市場をまとめて銘柄選びの対象にできるようにした。A株とETFのデータ源として任意のTickPlusを、モデルの接続先にx6.aiのプリセットを用意した。Tushareでは権限エラーを窓口ごとに切り分け、失敗した窓口だけ予備のデータ源に切り替える。ファンダメンタル分析は同じ回の相場データを使い回し、マルチエージェントの処理ではテクニカルとニュースの調査を並列で走らせて速くした。修正では、リアルタイム相場の取引日を過去比較の基準に合わせ、Yahooの未調整価格の扱いを直した。WindowsのCLIで分析後に固まる問題や、ARM64のDockerで起きるOpenBLASの不正命令エラーも解消した。通知では、長いntfyの報告を分割し、Barkの送信内容に大きさの上限を設け、Telegramの再試行がretry_afterの値に従うようにした。\n\n【ポイント・注意点】\nMARKET_REVIEW_REGIONをbothにすると台湾も含まれるようになったため、以前の5市場のままにしたい場合はcn,hk,us,jp,krと明示する必要がある。台湾の騰落の広がりのデータとMarket Lightの指標はまだ使えない。TickPlusとx6.aiは任意で、明示した設定が優先される。更新前には設定とデータの退避が勧められている。","2026-11-16","GitHub (ZhuLinsen/daily_stock_analysis Releases)","https://github.com/ZhuLinsen/daily_stock_analysis/releases/tag/v3.35.0"],["誰でも使えるDocker管理「Arcane」が3.0.1に","一般の利用者を想定したGo製のDocker管理ツール「Arcane」が、11月15日にv3.0.1を公開した。前日の3.0.0に続く修正版で、エージェントモードの起動と性能の問題を直したほか、古いエッジ用クライアント証明書の拒否や更新の常時検証といったセキュリティ面の変更を含む。GitHub Trendingの日次ランキングでは1日で547スターを集め、総スターは9,647に達した。","\n【概要】\nDockerの管理を一般の利用者にも扱いやすくすることを狙ったツール「Arcane」が、11月15日にv3.0.1をリリースした。11月14日に出たメジャー版3.0.0の直後の修正版で、リリースノートは「エージェントモードの起動と性能の問題を直す」と説明している。GitHub Trendingの日次ランキングでは総スター9,647、1日で547スターを獲得した。\n\n【背景】\nDockerのコンテナやスタックの管理はコマンド操作が中心で、慣れない人には敷居が高い。ArcaneはGoで書かれた管理ツールで、コンテナの更新やスタック、バックアップなどを画面から扱えるようにする。3.0系では、管理側の本体とは別にエージェントとして動くモードを持つ。リリース一覧によれば、その前の版は11月4日の2.17.3だった。\n\n【詳細】\n3.0.1では、エージェントとして動くときに、管理側だけで必要な定期ジョブや、管理側だけのRBACとOIDCの後埋め処理を起動時に飛ばすようにした。セキュリティと更新の面では、古いエッジ用のSPIFFEクライアント証明書を拒否し、更新は常に検証するようにした。プレビューだったnewSelfUpdaterは取り除かれた。DockerとコンテナではDockerのディスク使用量の問い合わせにタイムアウトを設け、ダイジェストで追うコンテナをタグの更新記録と照らし合わせるようにした。スタックとバックアップでは、スタックの.envファイルがgit同期やエディターでの保存をまたいで残るようにし、Rusticの認証局の束を起動前にコンテナへ写すようにした。\n\n【ポイント・注意点】\n3.0.0から間もない修正版で、特にエージェントモードを使っている環境は早めの更新が勧められる内容だ。古いエッジ用証明書を使い続けている環境は、拒否されて接続できなくなる可能性があるため、更新前に確認しておきたい。.envがgit同期で消える問題に悩んでいた場合も、今回で改善される。リリースノートは修正を、エージェントモード、セキュリティと更新、Dockerとコンテナ、スタックとバックアップの4分野に分けて記している。","2026-11-15","GitHub (getarcaneapp/arcane Releases)","https://github.com/getarcaneapp/arcane/releases"],["約200行の純JAXでDeepSeek V3を再現した教材が話題","DeepSeek V3の主要な仕組みを約190行の純粋なJAXで書き直したリポジトリ「deepseek-v3-jax」が、Hacker NewsのShow HNで276ポイントを集めた。潜在注意MLA、補助損失なしの負荷分散を使う専門家混合、複数トークン予測を実装し、3,620万パラメータの模型をMacBook Airで約2.6時間かけて学習させた。学習済みの重みも公開されている。","\n【概要】\nDeepSeek V3の構造を小さく読みやすく実装したリポジトリ「deepseek-v3-jax」が、11月14日にHacker NewsのShow HNに投稿され、276ポイント、30件のコメントを集めた。作者はVaibhaav Tiwari氏で、モデル本体のdeepseek_v3.pyは空行とコメントを除いて190行だという。ライセンスはMIT。\n\n【背景】\n大規模モデルの論文を読んでも、仕組みを手で動かして確かめるのは難しい。作者はDeepSeek V3の技術報告にある考え方のうち三つを、JAXで一から組み直した。作者はJAXについて、自動微分とコンパイラーを備えたNumPyのようなもので、逆伝播やカーネルを手で書く必要がなかったと説明している。\n\n【詳細】\n実装したのは、トークンごとに小さな潜在ベクトルだけを保持して層あたりの保持量を480から144に減らすMulti-head Latent Attention、常に動く共有専門家1つと上位4つを選ぶ16の専門家からなる専門家混合、次の次のトークンも予測する複数トークン予測だ。専門家の偏りは補助損失ではなく専門家ごとのバイアスで選び方を変えて抑える。学習はMacBook Air M5(24GB)でjax-metalを使い、パブリックドメインの探偵小説207冊、約2,170万トークンで12,000ステップ、約2.6時間。総パラメータは3,620万、トークンごとに動くのは1,360万で、検証損失は5.02から3.51まで下がった。\n\n【ポイント・注意点】\n作者は強い言語モデルではなく構造のデモだと明言している。全専門家を毎回計算する密な実装で、FP8学習や長文脈の拡張、事後学習は含まない。規模も本物の6,710億パラメータ・61層に対し、3,620万・6層にとどまる。コメントでは、元の実装から何が欠けているかを明記すべきだとの指摘もあった。AMDのGPUではROCmのコンテナで動き、学習済みの重みはPythonのpickleなので信頼できる出所のものだけを読み込むよう注意書きがある。","2026-11-14","Hacker News","https://news.ycombinator.com/item?id=50497589"],["中国史の対話型地図「江山地図」、海岸線の変遷を追加","紀元前403年から現代までの中国の歴史を地図でたどれる対話型アトラス「jiangshan-map」が、11月13日にv1.3.0を公開した。時代ごとの海岸線の地図9枚、安史の乱など陣営別の出来事の物語、地形の陰影、年表の読み上げ機能を加え、初回表示のスクリプトを約35%軽くした。GitHub Trendingでは1日で991スターを集めている。日本語のREADMEも加わった。","\n【概要】\n紀元前403年から現在までの中国を扱う対話型の歴史地図「jiangshan-map」が、11月13日にv1.3.0をリリースした。GitHub Trendingの日次ランキングでは総スター7,844、1日で991スターを獲得している。今回は海岸線の変遷や出来事の物語、地形表示など見せ方を大きく広げ、日本語のREADMEも加わった。\n\n【背景】\nリリース一覧によると、このプロジェクトは10月27日のv1.1.0、11月3日のv1.2.0と短い間隔で更新を重ねている。王朝ごとの版図を年表に沿って切り替えて見られる地図で、データの出典の確かさにも力を入れている。\n\n【詳細】\n海岸線では、渤海湾と黄河の河口、江蘇北部と長江の河口、珠江デルタで海岸の進退を示す昔の海の地図9枚を加え、1823年以前の台南の台江内海も描いた。出来事では安史の乱、靖康の変、楚漢戦争を、それぞれ3幕10か所の物語として対立する陣営を色分けして見せる。拡大時にはSRTMなどパブリックドメインのデータから作った地形の陰影を必要に応じて読み込む。自動再生中には年や元号、主な出来事をブラウザーの音声で読み上げられ、読み上げ中は古琴の背景音楽が小さくなる。年表の両端をドラッグすると短い時代を最大16倍まで拡大でき、ダブルクリックで元に戻る。地図の時点は188から198に、年表の節目は485から526に増え、1,455件の記録のうち139件が史料を示すようになった。\n\n【ポイント・注意点】\n初回表示に必要なスクリプトは圧縮後で約576KBから374KBへ約35%減り、CIで大きさの上限を守らせている。地形の陰影は通信量節約の設定や遅い回線では読み込まない。繁体字の文言177か所の校正、繁体字と日本語のREADME、ピンイン検索も加わった。古琴の音楽は自前で配信するようになり、iOSのSafariで検索欄が拡大されてしまう不具合も直された。国境線は北西部や南西部などで見直されており、歴史地図として扱う境界は今後も調整が続くとみられる。","2026-11-13","GitHub (DeanChensj/jiangshan-map Releases)","https://github.com/DeanChensj/jiangshan-map/releases"],["機械学習ライブラリ「ggml」がついにv1.0.0に","llama.cppなどの土台となる機械学習テンソルライブラリ「ggml」が、11月13日にv1.0.0を公開した。古いAPIと旧来のマスク演算を取り除き、YaRNの切り捨て設定やFP8への対応を加えたうえ、CUDA、Metal、Vulkanなど多くのバックエンドで性能を改善した。Hacker Newsでは420ポイントを集めている。変更の多くはllama.cppから取り込まれた。","\n【概要】\nllama.cppと同じ組織が開発する機械学習のテンソルライブラリ「ggml」が、11月13日にv1.0.0をリリースした。v0.29.0以降の変更をまとめた節目の版で、最新リリースとして登録されている。Hacker Newsでは翌14日に「Ggml v1.0.0」として投稿され、420ポイントを集めた。\n\n【背景】\nggmlはllama.cppと同じggml-orgが手がけるライブラリで、両者は開発を共有している。変更の多くはllama.cppのプルリクエストから取り込まれたもので、リリースノートはggml側の個々のコミットへのリンクを並べている。\n\n【詳細】\nAPIでは、非推奨だったAPIと旧来のDIAG_MASK演算を取り除き、互換性のない相手を拒むようRPCのプロトコルを第9版に上げた。YaRNの補正範囲の丸めを取得・設定する関数も加わった。コアでは、読まれない入力のアップロードを省き、専門家混合のキャッシュの取りこぼしの一部をCPUで計算して非同期に書き戻せるようにした。バックエンドでは、CUDAが少数行の量子化行列積やOCPのFP8に対応し、MetalはMoEの振り分けを融合した。VulkanはIntel向けのFlashAttentionのプリフィル用カーネルを、SYCLは端末側のMoEスケジューラーを、OpenCLはAdreno向けの分解したFlashAttentionを加えた。HexagonはQ5_0とQ5_1に対応し、CPUではSpacemiTのRVV向けカーネルが加わるなど、WebGPUを含む他のバックエンドにも改良が入っている。\n\n【ポイント・注意点】\n1.0の到達とともに古いAPIが削除されたため、ggmlを直接使っているプログラムは更新の際に呼び出しの見直しが必要になる可能性がある。RPCのプロトコルが上がったことで、版の違う相手とはつながらなくなる点にも注意したい。新しいRPCでは読み込みが速くなり、届かない相手や接続確立の失敗時にはきちんと失敗するようになった。対応するバックエンドの幅広さは、さまざまな機器で手元推論を動かしたい利用者にとって引き続き大きな魅力だ。","2026-11-13","GitHub (ggml-org/ggml Releases)","https://github.com/ggml-org/ggml/releases/tag/v1.0.0"],["AIエージェント用ブラウザー操作CLI「agent-browser」v0.43.0","Vercel Labsが公開するAIエージェント向けのブラウザー自動操作CLI「agent-browser」が、11月12日にv0.43.0を公開した。名前のない操作部品に手がかりを添えるスナップショットのヒントや、Chromeの指針を取りに行くスキルを加え、大きなページのスナップショットを速くした。週間で3,429スターを集め、総スターは5万2,000を超えた。","\n【概要】\nVercel LabsのAIエージェント向けブラウザー自動操作CLI「agent-browser」が、11月12日にv0.43.0をリリースした。Rustで書かれたツールで、GitHub Trendingの週間ランキングでは総スター52,569、1週間で3,429スターを獲得している。今回の更新は、エージェントがページを正しく読み取るための改良が中心だ。\n\n【背景】\nリリースノートによると、agent-browserはWebページのアクセシビリティツリーのスナップショットを取り、Chrome DevTools Protocolを通じてChromeを操作し、操作の記録も取れる。エージェントがボタンなどを見分けるにはアクセシビリティ上の名前が手がかりになるが、名前が空だったり重複していたりすると、どれを押せばよいか分からなくなる。\n\n【詳細】\n新機能のスナップショットのヒントは、操作部品の名前が空のときや他の要素と同じ名前のときに、アイコン、画像ファイル、テストID、nameやid、近くの行や一覧の文字を使って部品を特定する手がかりを添える。もう一つの新機能はModern Web Guidanceのスキルで、作業に応じたChromeの指針を取得し、作ったページをagent-browserで確かめる。修正では、Chromeが応答する前に閉じたタブへの命令がタイムアウトまで固まらず、切り離されたCDPセッションを示すTarget closedのエラーで止まるようにした。画面の縮尺を変えた環境での録画も、画素密度を落とさず記録できるようになった。\n\n【ポイント・注意点】\nネイティブのバイナリはプラットフォームごとの別パッケージで配るようになり、インストール時には手元の環境向けだけを取得する。インストールスクリプトが止められている環境でも、グローバルコマンドは正しいバイナリにつながる。アクセシビリティツリーを1回だけ解析するよう改め、大きなページのスナップショットが速くなった。リリース後もmainに16件のコミットがあり、更新が続いている。","2026-11-12","GitHub (vercel-labs/agent-browser Releases)","https://github.com/vercel-labs/agent-browser/releases/tag/v0.43.0"],["OpenAIの脆弱性修正ツール「Codex Security」0.10.0","OpenAIが公開する、脆弱性を見つけて確かめ、修正までを行うCLIとTypeScript SDK「Codex Security」が、11月12日に0.10.0をリリースした。中断したスキャンを保存地点から再開する機能や、複数リポジトリで1つの予算を共有する上限設定、修正が止まった理由の説明を加えた。GitHub Trendingでは1週間で2,531スターを集めている。","\n【概要】\nOpenAIのセキュリティツール「Codex Security」が、11月12日にCodex Security 0.10.0を公開した。同日にはGitHub Action版の0.10.0も出ている。リポジトリはセキュリティの脆弱性を見つけ、検証し、修正するためのCLIとTypeScript SDKを提供しており、GitHub Trendingの週間ランキングでは総スター14,055、1週間で2,531スターを獲得した。\n\n【背景】\nリリースノートによると、このツールはCLI、SDK、プラグイン、GitHub Actionとして配られ、StandardとDeepの二つの方式でリポジトリを調べ、見つけた問題の確認、修正案の準備と検証、他のスキャナーの結果の取り込みまでを扱う。検査から修正の確認までを一つの道具で回せるのが特徴だ。\n\n【詳細】\n0.10.0では、修正の結果に、ファイルが変わったかどうか、何が修正を止めたか、次に何をすべきかを示すようにした。チェックアウトの外で直す必要がある場合も、その理由と分かる範囲で直すべき場所を示す。Standardの調査は脆弱性の監査から始まり、中断した場合はscans resumeで元のCodexのセッションの保存地点から使用量と予算を保ったまま再開できる。--max-total-costで、複数のリポジトリや部品、再試行を含めて1つの見積もり予算を共有させられる。ArmorCodeのSASTの結果の取り込みや、SDKから選んだ結果をクラウドに公開する機能も加わった。\n\n【ポイント・注意点】\n互換性を壊す変更が3件含まれる。シンボリックリンクを通るパスは実際のたどり方に従うようになり、古い一括処理ではCSVに保存時のパスを正確に書くか、新しい出力先を使う必要がある。MCP登録スクリプトの指定方法も変わった。予算の見積もりは、すでに進んでいる作業によって超えることがある。費用上限を付けたスキャンでは修正の準備を別に実行する必要がある。","2026-11-12","GitHub (openai/codex-security Releases)","https://github.com/openai/codex-security/releases"],["古い端末で大きなLLMを動かす「smolmaxxing」","使えるメモリが1GBほどしかないテレビ用の小型機器や2013年のiPad Airで、160億パラメータの専門家混合モデルを動かすプロジェクト「smolmaxxing」がHacker Newsで484ポイントを集めた。llama.cppへの改造に、端末ごとのカーネルや、使う専門家だけをフラッシュから読み出す工夫を組み合わせている。数値はすべて実機で測ったという。","\n【概要】\n手持ちの最も小さな機器で、できるだけ大きな言語モデルを動かすことを目標にしたオープンソース「smolmaxxing」が、11月12日にHacker Newsに投稿され、484ポイント、180件のコメントを集めた。作者はAI企業での取り組みを公開したと説明し、使えるメモリが1GB未満のiPad Air(初代)とXiaomiのテレビ用機器で160億パラメータのモデルを動かしたと報告している。コードのライセンスはMIT。\n\n【背景】\n大規模言語モデルは大量のメモリを必要とし、古い機器や安価な機器では動かないのが普通だ。smolmaxxingはllama.cppへの改造の集まりで、独自のカーネル、メモリの工夫、フラッシュからの重みの読み出しを組み合わせ、すべての数値を実機で測ったとしている。\n\n【詳細】\n対象はXiaomi TV Box S(第3世代、使えるメモリ約1GB)、2013年のiPad Air(約700MB)、OnePlus Nord CE 2の3機種だ。テレビ用機器ではLing-mini-2.0(160億)が毎秒5.1トークン、iPad Airでは2.6〜4.5トークンで動く。スマートフォンではQwen3.6-35B-A3Bが毎秒4.9〜5.7トークン、Qwen3-Next-80B-A3Bが毎秒2.6〜3.1トークンだった。手法は、基本的なNEONだけで動く1ビットの表引きカーネルなど端末に合わせたカーネル、あまり使わない語彙の出力行を落としてメモリを減らす工夫、よく使う専門家だけをメモリに置き、ほかはフラッシュから必要なときに読む専門家のページングだ。\n\n【ポイント・注意点】\nテレビ用機器とiPad向けのモデルファイルは改造したllama.cppでなければ読めない。実験ノートには失敗も含めて165の実験が記録されている。コメントでは、Qwenは小型モデルとしては向かないとしてMiniCPMやLFMなどを勧める声があり、作者もLFMに移ったと応じた。小型モデルが実際に何に役立つのかを問う声もあった。","2026-11-12","Hacker News","https://news.ycombinator.com/item?id=50468888"]],"gh-new":[["Jira好きのためのOSS代替「Windshift」","Jiraの柔軟なカスタマイズ性を好む開発者が、Jiraに最も近いオープンソースの代替を目指して作った自己ホスト型の作業管理基盤「Windshift」がShow HNで公開された。AGPL-3.0の単一バイナリで動き、Jira CloudとData Centerからの移行用インポーター、GitHubやGitLabとの連携、MCPサーバーを通じたAIエージェント連携を備える。スプリントやロードマップ、サービス管理まで1つにまとめている。","\n【概要】Windshiftは、オープンソースで自己ホスト型の作業管理プラットフォームで、Jiraの代替を掲げる。ライセンスはAGPL v3。2026年11月18日にHacker NewsのShow HNで紹介された。\n【背景】作者はJira ServerとData Centerを長年使ってきており、そのカスタマイズ性にいまも愛着があるという。そこで「Jiraの働き方に最も近いオープンソース」を目指し、作業項目、カスタムフィールド、ワークフロー、画面、スプリントなどを移せるJira Cloud／Data Center用インポーターを用意した。\n【詳細】リポジトリによると、ワークスペース、エピック、ストーリー、サブタスク、ボード、バックログ、スプリント、ロードマップ、ダッシュボードなどの計画機能に加え、JQL風の「Windshift Query Language」、SLAや承認、顧客向け申請ポータルを含むサービス管理、テスト管理、時間記録、ナレッジベース、資産台帳（CMDB）まで備える。ソース管理はGitHub、GitLab、Gitea、Forgejoと連携し、LDAPやOIDCのシングルサインオン、REST API v2、WASMのプラグイン実行環境もある。AI面では、コーディングエージェントを作業項目から起動して結果のプルリクエストを紐付ける「Agent Studio」と、OAuth付きのMCPサーバーを持つ。MCP経由のエージェントは実在のユーザーとして動き、その権限を引き継ぐ。バックエンドはGo、フロントエンドはSvelte、保存先は既定でSQLite、またはPostgreSQL 15以降。\n【ポイント・注意点】Dockerイメージ、単体バイナリ、Mac用のアプリで動かせる。作者は、ワークフローや優先度などをまとめた「Configuration Set」を複数のワークスペースに一度に適用できる点を、Jiraより改善した点に挙げる。一方、リポジトリのページにはインポーターがどこまで対応するかや成熟度の記載はなく、コードの貢献にはCLAへの署名が必要だ。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50547381"],["Claude CodeとCodexを公式CLIのまま束ねる「Terminess」","Claude CodeとCodexの公式CLIを改変せずに動かし、自分の契約プランのまま複数のエージェントを一か所で扱えるターミナル兼ハーネス「Terminess」がShow HNで公開された。セッションはMacや自前のサーバーに置かれ、iPhoneアプリから同じセッションの続きを操作できる。エージェント同士でレビューや作業の引き継ぎもできる。ソースはApache 2.0で公開されている。","\n【概要】Terminessは、Claude CodeとCodexのためのエージェント用ハーネス兼ターミナルだ。独自に書いたターミナルエンジンの上で、公式のclaudeとcodexのCLIを改変せずに動かす。2026年11月18日にShow HNで紹介された。\n【背景】作者は、Anthropicが2月にClaudeのサブスクリプションをサードパーティのハーネスで使えなくしたことを挙げ、規約に沿う形のハーネスを作ったと説明する。ノートPCとサーバーで複数のエージェントを並行して使い、スマートフォンから様子を見るのに4つ以上のアプリが必要だったことも動機だという。Terminessはログイントークンを読まず、保存も再利用もせず、リクエストを中継もしないとしている。\n【詳細】リポジトリによれば、もう一方のエージェントに読み取り専用で意見を聞くask、指摘と「Apply Fix」を返すreview、作業のhand off、別のリポジトリ複製で同時に動かすparallelといった連携の型がある。コマンドの許可や拒否、エージェントからの質問への回答はMacからもiPhoneからもできる。セッションはアプリを閉じてもバックグラウンドのサービスで続き、Linux上ではterminessdがユーザーサービスとして動く。CLAUDE.mdやAGENTS.mdの編集、スキルやMCPサーバーの管理画面、GitHubのissueとPRの表示、本物のターミナルと会話表示の切り替えも備える。AnthropicのAPIキーかローカルのOllamaで動く独自の「Terminess Agent」もある。\n【ポイント・注意点】動作環境はmacOS 14以降とiOS 17以降で、iPhoneアプリはApp Storeにある。ソースはSwiftで、ライセンスはApache License 2.0。名称とアイコンは商標としてライセンスの対象外だ。READMEはAnthropicやOpenAIとは無関係だと明記している。作者自身も、規約に沿っているのは「現時点で」と但し書きを付けている。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50547235"],["CardDAV用の軽量な連絡先エディタ「Natel」","Googleの連絡先から自前のCardDAVサーバーへ移った作者が、デスクトップで連絡先を編集する手段として作った自己ホスト型のWebアプリ「Natel」がShow HNで公開された。作者によれば待機時のメモリは20MB未満、圧縮イメージは30MB未満と軽い。Nextcloud、Radicale、Baïkal、Xandikosで試験済みで、ライセンスはMIT。まだベータ版の位置づけだ。","\n【概要】Natelは、CardDAVサーバー上の連絡先をブラウザから検索、修正、整理するための軽量なWebアプリだ。アドレス帳そのものは持たず、端末間の同期は既存のCardDAVサーバーに任せる。2026年11月18日にShow HNで紹介された。\n【背景】作者は2か月前にGoogleの連絡先をやめ、Radicaleサーバーで自己ホストを始めたが、デスクトップで連絡先を編集する手段がなかったという。Nextcloudは自分には過剰で、ほかに唯一あるWeb編集ツールのInfCloudは10年以上リリースがない。そこで足りない部品として自作した。\n【詳細】Dockerイメージは、Caddyのプロキシと、認証情報をメモリ上にだけ持つGoのプロセスで構成される。作者によれば圧縮イメージは30MB未満、待機時のメモリ使用量は20MB未満だ。機能は検索、複数アドレス帳、連絡先の作成・編集・削除・移動、写真のトリミング、Apple、DAVx⁵、Nextcloud形式のグループ、vcfの読み込みと書き出し、スマホとデスクトップ向けの画面、ライトとダークのテーマ、英語とフランス語など。画面に出していない項目も保存時にそのまま書き戻し、別の端末で変更された連絡先は上書きせずに衝突として知らせる。パスワードはセッション中メモリにだけ置き、ディスクには書かない。\n【ポイント・注意点】作者はNextcloud、Radicale、Baïkal、Xandikosの4つのCardDAVサーバーで試し、自身もDAVx5と双方向で同期して使っている。ただしREADMEは「ベータ版」と明記し、初めて編集する前にアドレス帳の書き出しかサーバーのバックアップを勧めている。外部から使うにはHTTPSが必要で、カレンダーやメールは扱わない。作者はコードの大半をエージェントに書かせたと述べている。公開デモもあるが、編集内容は再読み込みで元に戻る。例に示された版は0.6.0で、1.0.0でベータを抜ける予定だ。ライセンスはMIT。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50547169"],["エージェントの変更を読めるレポートにする「Reflektor」","AIでコードを書く時代に、人間のレビューがリリースの足かせになっているという問題意識から作られた「Reflektor」がShow HNで公開された。コーディングエージェント用のスキル兼ツールで、ブランチの変更をブラウザで読めるレビューレポートに変える。テスト、リンター、型チェックの結果や処理の流れ、DB変更の図を1つにまとめ、チームと共有もできる。MITライセンス。","\n【概要】Reflektorは、コーディングエージェント向けのスキル兼ツールで、ブランチの変更をブラウザで読むレビューレポートに変換する。2026年11月18日にShow HNで紹介された。\n【背景】作者は、AIでこの1年にコードの書き方が変わり、いまはリリースのボトルネックが人間になったと述べる。そのうえで、本当の解決策はプルリクエストのレビューの仕方を変えることだとし、重要な変更だけをじっくり見て残りは流し読みできるレポートを作るツールにしたという。\n【詳細】READMEによると、ブランチ上で作業を繰り返すと、コミットごとに新しいレポートが作られる。プロジェクト自身のテスト、リンター、型チェッカーがバックグラウンドで走り、終わり次第その結果がレポートに加わる。UI部分はスクリーンショット付きでE2Eテストされる。「How it Works」は画面からデータベースまでのリクエストの流れを図示し、追加・変更・削除された型、インターフェース、列挙型、定数も示す。マイグレーションやスキーマの変更、テストカバレッジの要約と提案も含む。小さなローカルのデーモンがすべてのレビューを1つの受信箱にまとめ、開いているレポートを更新し、レビューで書いたコメントをエージェントに返す。\n【ポイント・注意点】対応するのはClaude Code、Codex、Cursor、Gemini CLI、GitHub Copilotなど。npx skills addで入れ、Claude Codeでは/reflektorで呼び出す。Node.js 18以降とgitが必要で、変更のあるブランチの上で使う。Codexでは既定のサンドボックスが.git配下への書き込みやローカルサーバーを塞ぐため、権限の設定が要る。レポートはreflektor.devでチームと共有できる。macOS、Linux向けとWindowsのPowerShell向けに、署名付きのインストーラーも用意されている。ライセンスはMITで、要望や不具合はGitHubのissueで受け付けている。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50546530"],["Rust製のリアルタイム音声エージェント基盤「brisvox」","電話とブラウザの両方で動く、リアルタイム音声エージェント用のRust製エンジン「brisvox」がShow HNで公開された。1つのプロセスで通話ごとに隔離された非同期セッションを走らせ、1コンテナで数百の通話を扱えるとする。TwilioとTelnyx、WebRTCに対応し、音声認識、LLM、音声合成の提供元を選べる。ライセンスはApache-2.0とMITの選択制だ。","\n【概要】brisvoxは、発話を聞き、ツール付きのLLMが応答し、話し手が途中で割り込むこともできる、リアルタイム音声エージェントのためのRust製エンジンだ。2026年11月18日にShow HNで紹介された。\n【背景】READMEは「1プロセスで、コンテナ1つあたり数百の隔離された通話」を掲げる。通話ごとに1つの隔離された非同期セッションを持ち、モデルは専用のスレッドプールで動かす設計だ。エージェント本体はPythonかTypeScriptのSDK、またはRustで書き、ツールはエージェント側に置く。\n【詳細】処理の流れは、発話区間の検出と話者交代の判定、音声認識、ツール付きLLM、音声合成。音声認識はDeepgram、AssemblyAI、Gladia、LLMはOpenAI、Anthropic、Geminiに加えOpenAI互換の各種エンドポイント、音声合成はCartesia、ElevenLabs、Deepgram Auraに対応し、ローカルのモデルも使える。電話はTwilioとTelnyxのメディアストリームを内蔵し、転送やDTMFも扱う。ブラウザ向けにはWebRTCを優先し、同じポートでWebSocketに自動で切り替える依存なしのモジュールがある。割り込みのあとは実際に再生した文だけをLLMの文脈に残し、副作用のあるツールは投機的に実行せず、同じ通話IDで二度実行しない。言語は英語とトルコ語に対応する。\n【ポイント・注意点】作者の計測では、4vCPU・4GBの環境で偽の提供元を使ったとき、遅延の目標内で250通話を保ち、Pipecat 1.12.0は1通話だった。実際の提供元を使った5同時通話の比較では、音声から音声までの中央値が1.85秒、Pipecatは1.97秒。ただしREADMEは、LLM自体のばらつきがこの差と同程度であること、容量の計測は偽の提供元によること、すべて作者自身の計測であることを注記している。配布はcrates.io、PyPI、npm、Dockerイメージで、自己ホスト専用だ。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50546485"],["自前LLMを40の道具使い課題で測る「Werkbank」","自分で動かす言語モデルを、道具を使う40の固定課題でエージェントとして評価するベンチマーク「Werkbank」がShow HNで公開された。OpenAI互換のエンドポイントにつなぎ、結果を自動で判定し、解けた課題ごとにかかった時間とトークンも記録する。モデル単体ではなく、量子化やサーバー、設定、ハードウェアまで含めた構成全体を測るのが特徴だ。順位表は設けていない。","\n【概要】Victor's Werkbankは、自前で提供する言語モデルのためのベンチマークだ。OpenAI互換のチャット補完エンドポイントにつなぎ、道具を使う40の固定課題を与えて、結果を自動で判定する。2026年11月18日にShow HNで紹介された。\n【背景】READMEは、測る対象はモデル単体ではなく、モデル、量子化、サーバー、設定、ハードウェアを合わせた「構成全体」をエージェントとして見たものだと説明する。時間などの予算が固定されているため、遅い構成ほど時間内に解ける課題が減る仕組みだ。解けた課題1つあたりの秒数と出力トークン数も記録される。\n【詳細】各課題はプロンプト、道具一式、決定的な環境、最終状態や提出コード、最終回答の自動判定からなる。モデルが書いたコードはコンテナの中だけで動く。内訳はエージェント10問（重み30%）、コーディング6問（20%）、セキュリティ5問（15%）、検索5問（15%）、信頼性5問（10%）、数学4問（5%）、データ分析5問（5%）。セキュリティ課題は攻撃ありとなしで1回ずつ走り、コーディング課題はモデルに見せないテストで判定する。モードは導入確認用のTrial（7問、1回、64K）、Quick（14問、3回、64K）、Normal（31問、3回、128K）、Full（40問、3回、256K）。NormalとFullでは0〜100の総合点を95%区間付きで出す。\n【ポイント・注意点】LinuxかWSL2、Python 3.12以降、Docker、ネイティブのツール呼び出しとトークン数を返すモデルサーバー（vLLM、llama.cpp、SGLang、Ollama、LM Studioなど）が必要だ。READMEは順位表を設けないと明言し、結果は同じ版と同じ課題集の中でだけ比べられるとしている。課題データを学習に使わないよう求めている。導入は./werkbankを一度呼ぶだけで、管理者権限は要らない。コードのライセンスはApache-2.0、文書はCC BY 4.0だ。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50546239"],["ブラウザで動くOSSの文書・表・スライド編集「MR Office」","MR Officeで使われている文書、表計算、プレゼンテーション、PDF、手書き、コードの各エディタのソースがGitHubで公開され、Show HNで紹介された。いずれもブラウザで動き、TypeScriptのモノレポで構成される。ただし完全なオフィススイートではなく、Word、Excel、PowerPointのファイルの読み書きなどは、無料だが非公開のデスクトップ版だけの機能だ。AGPL-3.0。","\n【概要】MROfficeは、MR Officeで使われるオープンソースのエディタ群のソースを公開したリポジトリだ。文書、表計算、プレゼンテーション、PDF、手書き、コードの各エディタがブラウザで動く。2026年11月18日にShow HNで紹介された。\n【背景】READMEは、これは「オープンソースのエディタ」であって「完全なオープンソースのオフィススイートではない」とはっきり書いている。.docx、.xlsx、.pptxの読み書き、関数を使う数式の計算、グラフ、SmartArtの編集、PDFへの編集内容の保存は、無料だがソース非公開のデスクトップ版にだけある。\n【詳細】文書エディタはページ単位のワープロで、スタイル、表、コメント、変更履歴、ペン入力に対応し、.mrdocで保存してHTML、Markdown、テキストを開ける。表計算はセル、数式、表示形式、複数シートを扱い、CSVとTSVを読み書きできるが、計算されるのは「=A1*B1+10」のようなセル間の算術だけで、SUMやVLOOKUPは書いたまま残る。表計算は.mrsheetで保存する。プレゼンテーションは8つの組み込みテーマ、レイアウト、切り替え効果、アニメーション、スライドショーを持ち、.mrslidesで保存する。PDFは閲覧、検索、発表、印刷、テキストへの書き込みができる。手書きは筆圧対応のペンや図形への変換に対応し、コードエディタは構文の色分けに加えて、JavaScript/TypeScript、Python、SQL、Lua、シェルをブラウザ内で実行できる。\n【ポイント・注意点】ライブデモはインストール不要で試せ、ローカルではnpmで構築でき、Electronのデスクトップ用の殻も同梱する。ライセンスはGNU AGPL-3.0で、NOTICE.mdの追加条件として「MR Office」の表記とmroffice.aiへのリンクを残す必要があり、名称やロゴの権利は与えられない。商用ライセンスも別にある。公開時点でコミットは10件と、始まったばかりの段階だ。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50546074"],["1つのNeovimを多重化端末のペインで見せる「neopane」","Neovimをバックグラウンドで1つだけ動かし、その各ウィンドウをtmuxやzellij、herdrの本物のペインとして表示するツール「neopane」がShow HNで公開された。:vsplitで新しいペインが開くが、裏にあるのは同じNeovimで、バッファやレジスタ、アンドゥ、言語サーバーを共有する。Rust製でMITライセンス。作者はまだ粗い初期段階だとしている。","\n【概要】neopane（旧名neorex）は、Neovimを1つのデーモンとして動かし、接続したすべての端末に表示するツールだ。対応する端末多重化ソフトの中では、Neovimのウィンドウ1つずつに専用のペインを割り当てる。2026年11月18日にShow HNで紹介された。\n【背景】作者は、Neovimが自分で分割を描く代わりに、ふだん使う多重化ソフトの分割をそのまま使えるようにしたかったという。見た目よりも操作感の問題で、多重化ソフトとNeovimが張り合うのをやめ、継ぎ目なく協調させるのが狙いだと説明している。作者はmacOSで日常的に使い、nvimをこのツールの別名にしているという。\n【詳細】tmuxではウィンドウごとに隣へペインを分割し、タブページはtmuxのウィンドウになる。tmux 3.2以降が必要で、3.7以降ではピッカーなどの浮動グループを枠付きの浮動ペインで出す。zellijではウィンドウがペイン、タブページがタブになり、<C-w>h/j/k/lでzellijのフォーカスが動く。herdrにも対応する。多重化ソフトがなくても、デーモンが描くNeovimにほかの端末から接続できる。独自のペインの提供方法を~/.config/neopane/init.luaで定義することもできる。導入はインストールスクリプト、Homebrew、cargo installから選べ、Neovim 0.12以降が要る。\n【ポイント・注意点】READMEは「とても初期で粗い。バグや欠けた機能を覚悟して」と書き、AIを多用して作ったと明かしている。Linuxはビルドとテストは通るが、実地ではまだ試していない。<C-w>による入れ替えや移動、<C-w>=などの大きさ調整は未実装で、lualineのタブ表示がずれる、ウィンドウを並べるプラグインが期待どおりに置けないといった制約もある。外部のコマンドラインやメッセージ領域がなく、長いメッセージでは「Press ENTER」が出る。ライセンスは元のneorexと同じMITだ。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50544553"],["文章のテスト手順をChromeで実行するAI「qpilot」","文章で書かれた手動テストの手順を貼り付けると、AIエージェントが本物のChromeで一つずつ実行し、どの手順で壊れたかを証拠付きで示すツール「qpilot」がShow HNで公開された。決まった書式は不要で、画面はアクセシビリティツリーとして読む。Anthropicの鍵かOpenAI互換のエンドポイントで動き、npx qpilotで起動できる。MITライセンス。","\n【概要】qpilotは、手動テストのケースを実際のブラウザで走らせるAIエージェントだ。READMEは「手動テストのケースを貼り付ける。AIエージェントが本物のChromeで実行し、どの手順が壊れたかを証拠付きで伝える」と説明する。2026年11月18日にShow HNで紹介された。\n【背景】テストケースに決まった書式は要らず、見出し、番号付け、「Expected:」の行はどれも省略できる。設定ファイルもテストコードも書かずに、npx qpilotで始められるのが売りだ。\n【詳細】エージェントはChromeを開いて各手順を実行し、操作のたびに画面を保存済みのセレクタではなくアクセシビリティツリーとして読み直す。結果は手順ごとに次々と表示される。ワンタイムパスワードやCAPTCHAでは実行を止めて入力を求め、そのあと続ける。複数のケースを順に走らせたり、.mdファイルのフォルダをまとめて流したりもできる。合格した手順は、文脈を切り離した別のモデル呼び出しで再確認されるが、この確認は警告を出せるだけで不合格を覆すことはない。大きさ、重なり、色はスクリーンショットから推測せず、ブラウザ内でピクセルとRGBの値として測る。各手順はpass、fail、warnのいずれかになり、期待値と実際の結果、スクリーンショットが付く。報告はMarkdownでの複製と、画像を埋め込んだ1つのHTMLとして書き出せる。\n【ポイント・注意点】Node.js 20.12以降とGoogle Chrome、AnthropicのAPIキーかツール呼び出しに対応したOpenAI互換エンドポイントが必要で、Anthropicの既定モデルはclaude-haiku-4-5。対象はデスクトップのChromeだけだ。作者による精度の数字は1つのモデルでの小さな試験に基づく。実行記録はメモリ上に直近50件だけ残り、サーバーを再起動すると消える。TypeScript、Next.js、Playwrightで作られ、ライセンスはMIT。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50544348"],["エージェントの秘密漏れと危険コマンドを防ぐ「AgentShield」","Claude CodeやCursorなどのコーディングエージェントが.envの秘密やSSH鍵を漏らしたり、破壊的なシェルコマンドを実行したりするのを防ぐローカルの防御層「AgentShield」がShow HNで公開された。実行前のコマンド検査と、出力に含まれる秘密の置き換えを行い、Claude CodeにはPreToolUseフックで組み込める。実行時の依存はなく、ライセンスはApache-2.0。","\n【概要】AgentShieldは、AIエージェント、LLM、MCPツールのための実行時のセキュリティ防壁兼統制層をうたうツールだ。資格情報がモデルのAPIやgitの履歴に届く前に、コマンドと出力を横取りして検査する。2026年11月18日にShow HNで紹介された。\n【背景】READMEによると、狙いはClaude Code、Cursor、Windsurfといったコーディングエージェントが.envの秘密やSSH鍵を漏らしたり、破壊的なシェルコマンドを走らせたりするのを止めることだ。実行時の依存はなく、既定で完全にローカルで動くとしている。\n【詳細】シェルの防壁は、構文木の解析と正規表現のヒューリスティックで実行前のコマンドを調べる。「cat .e\"\"nv」のような難読化や/proc/self/environ、base64による持ち出し、nodeやpythonでの環境変数の書き出しも捉えるとしている。秘密の置き換えは標準出力とエラー出力を塊ごとに走査し、塊の境目にまたがる秘密や複数行のPEMも扱う。見つけた秘密は「[AGENT_SHIELD:ID:hash]」形式の代替トークンに置き換え、rehydrateで手元だけで元に戻せる。OpenAI、Anthropic、Google、Hugging Face、AWS、Stripe、GitHubのトークン、秘密鍵、JWTなどの形を検出する。Claude Codeにはinit-claudeで.claude/settings.jsonにPreToolUseフックを作り、許可しないコマンドは終了コード2で止める。Cursor用の設定生成、pre-commitフック、GitHub Action、Python、Go、Rust向けのSDKもある。\n【ポイント・注意点】READMEは、ユーザー空間での検査は多層防御の一つであってOSカーネルの境界ではなく、任意のバイナリや直接のシステムコールにはコンテナなどOSの隔離が要ると認めている。性能の数字は自己申告で、見出しの毎秒14万9千回超と比較表の毎秒2万8千回超が食い違う。complianceコマンドもSOC 2などへの準拠を示すものではないと注記している。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50541937"],["HP LaserJet 1005をWindows 11で動かす自作ドライバ","HPがWindows XPの時代にサポートを打ち切ったプリンター「HP LaserJet 1005」を、Windows 11 x64で使えるようにするオープンソースのドライバ「Project Benteveo」がShow HNで公開された。作者は、まだ問題なく動く機器を捨てたくないとして、Codexを使いC++20で書いたという。ZjStreamの公開実装を手がかりにしており、ライセンスはGPL-2.0以降。","\n【概要】Project Benteveoは、初代HP LaserJet 1005（USB ID 03f0:1317）のためのWindows用プリンタードライバを独自に実装したものだ。対象はWindows 11 x64。2026年11月18日にShow HNで紹介された。\n【背景】作者は2000年代前半にこのプリンターを買ったが、HPはXPやServer 2003の時代にサポートを終え、Windows 11用のドライバはない。作者は「まったく問題なく動くハードウェアを捨てることには賛成しない」とし、Codexを使ってC++20でドライバを書いたと説明する。トナー転写の印刷に使うために復活させたといい、名前は印刷に使った鳥、ベンテベオの絵に由来する。\n【詳細】ウェブ上の仕様と、CUPS向けのZenographics ZjStreamの公開実装を頼りに作られ、構成は「JBIG + ZJS」。アプリから出た印刷はWindowsのGDIとUnidrvでラスタ化と網点化をされ、lj1005render.dllを経てスプーラーに入り、lj1005monitor.dllがファームウェアの送信や同期、完了の確認を受け持って、標準のUSBかパラレルポートへ送られる。レンダリングDLLはIPrintOemUniを実装する。検証済みのUSB経路では独自のカーネルドライバは要らないという。導入では、元のHPソフトに含まれるファームウェアsihp1005.imgを用意し、テスト証明書を信頼済みのストアに入れ、プリンターの追加で「ディスク使用」を選ぶ。\n【ポイント・注意点】初期の対応はUSB接続のプリンター1台、A4とレター、600dpi、モノクロ、片面に限られる。ドライバはテスト証明書で署名されており、正式な署名は今後の課題だ。P1005とM1005は別のドライバのため対象外で、ファームウェアは利用者が元のソフトから用意する必要がある。作者はこれを「バイブなソフトとハードのハック」の例と位置づけている。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50541736"],["端末で細胞が動く顕微鏡スライド「cells」","asciiquariumやcbonsaiに着想を得た、端末の中で微生物の世界を眺めるアニメーション「cells」がShow HNで公開された。細胞が分裂し、免疫細胞が細菌を追いかけ、ときにはバクテリオファージが騒ぎを起こす。pipxでterminal-cellsを入れてcellsと打つだけで動き、実行時に外部のライブラリを必要としない。ライセンスは0BSDだ。","\n【概要】cellsは「端末の中の生きた顕微鏡スライド」をうたうアニメーションだ。免疫細胞が細菌を追い、細胞が分裂し、バクテリオファージが時おり騒ぎを起こす。2026年11月18日にShow HNで紹介された。\n【背景】作者は、端末に水族館を描くasciiquariumや盆栽を育てるcbonsaiに着想を得たという。READMEは、大きさや時間の進み方を誇張した生物の図解だと断っている。Show HNでは、文字の制約の中で見分けやすい生き物や出来事の案を募り、「細胞生物学者はいますか」と呼びかけている。\n【詳細】登場するのはマクロファージ、好中球、赤血球、9種類の微生物、真菌、ファージ。貪食、有糸分裂、出芽、ウイルスの増殖といった振る舞いを見せ、長時間動かしても顔ぶれが偏らないよう、ときどき「珍しい訪問者」が現れる。--screensaverを付けると、いずれかのキーを押すまで動き続ける。--observeを付けると生活環の説明が出る。qで終了、スペースで一時停止、+と-で速度、rで新しいスライド、?でヘルプと種の凡例を表示する。--interactiveでは調べる、溶かす、餌をやる、かき混ぜるの道具をマウスかキーボードで使える。微生物や血液の場面、落ち着いたライトテーマ、ASCIIのみの表示、スクリーンセーバーとしての動作も選べる。\n【ポイント・注意点】pipx install terminal-cellsのほか、UbuntuのPPAやHomebrewでも入る。Python 3.10以降とcursesがあればLinuxとmacOSで動き、WindowsではWSLを使う。端末は80×24以上、推奨は120×40以上。Hacker Newsのコメントで絵が込み入っていると指摘されると、作者は細胞膜を整え内部を暗くするなど、すぐに手を入れている。半角ブロックや点字の文字を使う案も寄せられ、作者は課題として記録した。なお、コマンド名はcellsだがパッケージ名はterminal-cellsだ。ライセンスは帰属表示の要らない0BSD。","2026-11-18","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50541047"],["knipやsyncpackを1つにまとめるRust製リンター「skif」","JavaScriptとTypeScriptの依存関係、ワークスペース設定、使われていないコードをまとめて検査するRust製のツール「skif」がShow HNで公開された。保守が止まった依存リンターsherifのフォークから始まり、syncpackやknipが別々に担っていた検査を1つのバイナリと設定ファイルに集める。プロジェクト自身の計測では、knipより中央値で5.5倍速いという。","\n【概要】skifは、JavaScriptとTypeScriptのリポジトリやモノレポのための、依存関係とパッケージマネージャーのリンターだ。sherif、syncpack、knipがそれぞれ担う検査を、1つのバイナリと1つのskif.tomlで受け持つ。2026年11月17日にShow HNで紹介された。\n【背景】作者によると、skifは活発に保守されていない依存リンターsherifの保守版フォークとして始まった。READMEは、syncpackの一部を取り込み、knipの問題の分類とプラグインの知識に沿っていると説明し、由来するコードをATTRIBUTIONS.mdに記している。いくつもの大規模なリポジトリで鍛え、精度を上げたとしている。\n【詳細】検査は大きく4つ。npm、pnpm、Yarn、Bunのワークスペースの規則、使われていない依存の発見、依存の方針の強制、使われていないコードの発見だ。コード解析はoxcを土台にし、未使用のファイル、エクスポート、依存、解決できないインポート、循環インポートを見つける。規則は54、よく使われるツールの設定を読むプラグインは213ある。安全と危険の2段階の自動修正や差分の事前表示、既存のsherif、syncpack、knipの設定を移すskif migrateもある。出力はSARIFなどに対応し、言語サーバー、MCPサーバー、GitHub Actionも用意する。\n【ポイント・注意点】プロジェクト自身の2026年11月17日の計測では、knipより4.0〜8.0倍（中央値5.5倍）、syncpackより1.6〜22.3倍（中央値8.6倍）、sherifより最大7.9倍（中央値3.2倍）速い。ただしsherifとの比較では12の対象のうち3つで遅かった。まだ0.9系の若いプロジェクトで、npm、cargo、Homebrew、Scoopで入る。対応するのはnpm、pnpm、Yarn 2以降、Yarn Classic、Bunで、Node.js 22、24、26かBun 1.xで動く。ライセンスはMIT。","2026-11-17","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50537604"],["サイトの隠れたAPIをMCPツールにする「Machine Internet」","公式のAPIを持たないサイトでも、画面の裏で使われているJSON APIを見つけ出し、AIエージェントが呼べるMCPツールに変える「Machine Internet」がShow HNで公開された。ヘッドレスブラウザで通信を記録し、LLMがツールに整える。作者が試した51サイトのうち、完全に動いたのはおよそ3つに1つ。設計上は読み取り専用で、ライセンスはApache 2.0。","\n【概要】Machine Internetは、公開APIのないウェブアプリをMCPサーバーに変えるツールだ。生成したツールはClaudeやCursorなど、どのMCPクライアントからも使える。アルバータ大学でコンピューター科学を学ぶ学生が作り、2026年11月17日にShow HNで紹介した。\n【背景】作者は、公式APIのない多くのサイトでも、フロントエンドは十分使えるJSON APIを呼んでいると指摘する。ページの中身を削り取る道具と違い、エージェントが生きたAPIを直接呼ぶのが特徴だという。\n【詳細】uvx machine-internet wrapにURLを渡すと、まず/openapi.jsonなど約20の決まった場所に仕様書がないか探す。なければヘッドレスのChromiumでページを読み込み、スクロールやクリックをしながら同じサイトへのJSONの要求を記録し、解析や広告の通信は除く。次にLLMが記録した要求と応答から各エンドポイントの経路、引数、型を推定し、最大15個の「動詞_名詞」形式のツールにまとめる。結果はJSONで保存され、標準入出力かSSEのMCPサーバーとして提供される。LLMは無料枠のあるGeminiを勧めるが、AnthropicやOpenAIの鍵も使え、提供する段階ではLLMは要らない。保存先は~/.machine-internet/schemas/だ。\n【ポイント・注意点】作者が試した51サイトでは、完全に動いたのが15、手直しで動いたのが2、一部動いたのが3。サーバー側で描画する10サイトやボット対策のある9サイトでは動かなかった。設計上読み取り専用で、カートやログイン、投稿など変更を伴う呼び出しは除く。サイトが画面を作り直すと壊れることがあり、READMEはサイトの規約を確かめ、アクセス制限の回避に使わないよう求めている。LLMの出力はばらつくため、ツールの作り直しや対象ページの絞り込みが要ることもある。認証はMI_TOKENなどの環境変数で渡せ、インストールせずに5つのサイトで試せるデモもある。","2026-11-17","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50534582"],["AWS Trainium向けのOSS推論エンジン「TrnRT」","YC W26のRunAnywhereが、AWSの独自チップTrainium向けのLLM推論エンジン「TrnRT」をオープンソースで公開し、Show HNで紹介した。trn2.48xlarge 1台でGLM-5.3-Flashを動かし、SemiAnalysisのAgentXベンチマークで毎分357万トークンを処理したという。開発を始めてから3週間で、Apache 2.0のもと外部からの貢献も受け付けている。","\n【概要】TrnRT（Trainium RunTime）は、AWS Trainiumのためのオープンな LLM推論エンジンだ。trn2.48xlarge 1台からOpenAI互換のAPIを提供する。2026年11月17日にShow HNで紹介された。\n【背景】開発元は3週間前に作業を始めたという。1Mトークンの文脈を持つGLM-5.3-Flashのような大きなMoEは多くのメモリを要し、AWSではtrn2.48xlargeのメモリ容量あたりの費用がH200 8基の半分以下だとして、H100やH200と比べた費用対効果を試したかったと説明する。ところがAWSの既存の仕組みはこのモデルに対応しておらず、vLLM Neuronの最新版はGLMを登録せず、AWS自身の分散推論フレームワークNxDIも活発な開発が終わっていたという。\n【詳細】デコードはAWSのNKIで書いた融合カーネルで動き、層の半分ごとに1つのカーネル、疎な注意機構の11層では2つのブロックを1つのカーネルにまとめる。1Mトークンの文脈は上位2,048件の疎な注意と固定サイズの状態を持つ線形注意で支える。FP8のKVページを基数木で持つプレフィックスキャッシュ、1台に2つのエンジンを置きセッションごとに振り分けるルーター、ストリーミングやツール呼び出しに対応したOpenAI APIも備える。対象はGLM-5.3-Flash（総パラメータ320B、活性18B、FP8）。AgentXでは32の同時エージェントで、既定のバッチ12のとき毎分357万トークン、スポット価格で100万トークンあたり0.040ドルとしている。\n【ポイント・注意点】対応モデルは現時点で1つ、
