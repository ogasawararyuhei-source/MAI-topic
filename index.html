<style>

:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;display:flex;flex-direction:column;height:100dvh;overflow:hidden;transition:background .35s ease,color .35s ease}
body::before{content:"";position:fixed;inset:0;background:var(--pattern);pointer-events:none;opacity:var(--pattern-op,.5)}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
[data-theme="steampunk"]{--bg:#e6d7b8;--pattern:radial-gradient(circle at 12% 20%,rgba(141,100,40,.16) 0 26px,transparent 27px),radial-gradient(circle at 88% 78%,rgba(141,100,40,.13) 0 38px,transparent 39px),repeating-linear-gradient(0deg,rgba(90,62,25,.05) 0 1px,transparent 1px 26px);--pattern-op:1;--card:#f8eed3;--ink:#2e2010;--muted:#77603c;--line:#a97f3f;--accent:#9c4a12;--accent2:#2f5d50;--accent-ink:#fff6df;--soft:#efdfba;--old:#97835f;--top-bg:#2a1a0c;--top-ink:#f2dfae;--radius:8px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\2699  \2699  \2699";--shadow:0 14px 34px rgba(62,40,8,.28)}
[data-theme="witch"]{color-scheme:dark;--bg:#161022;--pattern:radial-gradient(circle at 18% 12%,rgba(233,213,255,.20) 0 1.5px,transparent 2.5px),radial-gradient(circle at 72% 22%,rgba(233,213,255,.14) 0 1px,transparent 2px),radial-gradient(circle at 42% 66%,rgba(196,181,253,.12) 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 84%,rgba(233,213,255,.16) 0 1px,transparent 2px),radial-gradient(circle at 6% 88%,rgba(196,181,253,.12) 0 1px,transparent 2px);--pattern-op:1;--card:#241a3d;--ink:#f1eaff;--muted:#bdaee0;--line:#5b4595;--accent:#a678ff;--accent2:#e9d5ff;--accent-ink:#1d1233;--soft:#2f2350;--old:#8d81ad;--top-bg:#0e0919;--top-ink:#efe6ff;--radius:20px;--font-display:"IM Fell English","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\263E  \2726  \263D";--shadow:0 14px 34px rgba(0,0,0,.5)}
[data-theme="dnd"]{--bg:#e7d9b4;--pattern:repeating-linear-gradient(45deg,rgba(158,43,37,.05) 0 2px,transparent 2px 18px),radial-gradient(circle at 85% 10%,rgba(158,43,37,.10) 0 30px,transparent 31px);--pattern-op:1;--card:#f7ecc9;--ink:#332216;--muted:#7d6248;--line:#8c6a3f;--accent:#9e2b25;--accent2:#a97b00;--accent-ink:#fdf3d8;--soft:#eee0b6;--old:#9a8a72;--top-bg:#471611;--top-ink:#f7e7bd;--radius:4px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\265E  \2726  \265E";--shadow:0 14px 30px rgba(71,22,17,.30)}
[data-theme="celtic"]{--bg:#e3dfc6;--pattern:repeating-linear-gradient(0deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px),repeating-linear-gradient(90deg,rgba(46,107,52,.07) 0 2px,transparent 2px 22px);--pattern-op:1;--card:#f6f2dc;--ink:#20331e;--muted:#5d7050;--line:#77873f;--accent:#2e6b34;--accent2:#a8842a;--accent-ink:#fbf7e2;--soft:#e7e5c8;--old:#93a086;--top-bg:#17351f;--top-ink:#efeccb;--radius:14px;--font-display:"Uncial Antiqua","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\16DA  \2726  \16DB";--shadow:0 14px 30px rgba(23,53,31,.26)}
[data-theme="greek"]{--bg:#f2eee3;--pattern:repeating-linear-gradient(90deg,rgba(29,95,138,.06) 0 1px,transparent 1px 34px),radial-gradient(circle at 90% 0%,rgba(185,138,28,.10) 0 60px,transparent 61px);--pattern-op:1;--card:#fffdf6;--ink:#1e2c38;--muted:#66727c;--line:#b3923c;--accent:#1d5f8a;--accent2:#b98a1c;--accent-ink:#ffffff;--soft:#ece7d7;--old:#a3a8ad;--top-bg:#fdfbf4;--top-ink:#1e2c38;--radius:2px;--font-display:"Cinzel","Noto Serif JP",serif;--font-body:"Noto Serif JP","Hiragino Mincho ProN",serif;--orn:"\03A9  \2766  \03A9";--shadow:0 14px 30px rgba(30,44,56,.18)}
.top{flex:none;position:relative;z-index:30;background:var(--top-bg);color:var(--top-ink);border-bottom:3px double var(--line)}
.topin{max-width:1080px;margin:auto;padding:10px 16px 4px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.logo{font-family:var(--font-display);font-weight:900;font-size:23px;letter-spacing:.06em}.logo span{color:var(--accent2)}
[data-theme="witch"] .logo span,[data-theme="steampunk"] .logo span{color:var(--accent)}
.date{font-size:10px;opacity:.75;white-space:nowrap}
.topbtns{display:flex;gap:8px;flex:none}.pill{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.themes{max-width:1080px;margin:auto;padding:6px 16px 10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.themes-label{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;opacity:.8}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--top-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;opacity:.85}
.theme-btn .gly{margin-right:5px}
.theme-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
.stage-wrap{flex:1;min-height:0;max-width:1080px;width:100%;margin:auto;padding:10px 16px 12px;display:flex;flex-direction:column;position:relative;z-index:1}
.herostrip{flex:none;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;box-shadow:var(--shadow)}
.herostrip img{width:74px;height:52px;object-fit:cover;border-radius:calc(var(--radius) * .6);flex:none}
.herostrip p{margin:0;font-size:13px;color:var(--muted)}.herostrip b{color:var(--ink);font-family:var(--font-display)}
.catbar{flex:none;display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.catbar .navbtn{flex:none}
.catinfo{flex:1;text-align:center;min-width:0}
.catinfo h2{margin:0;font-family:var(--font-display);font-size:clamp(19px,4.6vw,27px);line-height:1.25;letter-spacing:.03em}
.catinfo p{margin:1px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catcount{flex:none;font-size:12px;background:var(--soft);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-weight:700}
.navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800;box-shadow:var(--shadow)}
.navbtn:active{transform:scale(.97)}
.dots{flex:none;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:transparent;padding:0}
.dot.active{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.stage{flex:1;min-height:0;touch-action:none;position:relative}
#cardSlot{height:100%}
.card{height:100%;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
.card::after{content:var(--orn);position:absolute;top:6px;right:12px;font-size:13px;letter-spacing:.3em;color:var(--accent2);opacity:.85;pointer-events:none}
.card.old .ph{filter:grayscale(1)}
.card .ph{width:100%;height:30%;min-height:120px;object-fit:cover;display:block;flex:none}
[data-theme="steampunk"] .card .ph{filter:sepia(.35) contrast(1.05)}
[data-theme="witch"] .card .ph{filter:saturate(.85) hue-rotate(-12deg) brightness(.92)}
[data-theme="dnd"] .card .ph{filter:sepia(.25) saturate(1.1)}
[data-theme="celtic"] .card .ph{filter:saturate(1.05) hue-rotate(6deg)}
[data-theme="greek"] .card .ph{filter:saturate(.92) brightness(1.04)}
.cbody{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.badge{background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:999px;font-weight:800}.badge.oldb{background:var(--old)}
.card h3{margin:0;font-size:clamp(17px,4.4vw,21px);line-height:1.45;font-family:var(--font-display);font-weight:700}
.sum{font-size:14px;color:var(--muted);margin:0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.btn{border:0;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800}
.btn.primary{background:var(--accent);color:var(--accent-ink)}.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.saved{background:var(--accent2);color:var(--accent-ink)}
.src{font-size:11px;color:var(--muted);word-break:break-all}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;color:var(--muted)}
.empty .big{font-size:34px;color:var(--accent2)}
.pager{flex:none;display:flex;align-items:center;gap:10px;margin-top:10px}
.pager .navbtn{flex:1}
.artdots{flex:none;display:flex;gap:5px;max-width:34vw;flex-wrap:wrap;justify-content:center}
.artcount{flex:none;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.hint{flex:none;font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.addcat{flex:none;text-align:center;margin-top:6px}
.addcat button{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700}
@keyframes inNext{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes inDown{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes inUp{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
.anim-next{animation:inNext .28s ease}.anim-prev{animation:inPrev .28s ease}.anim-down{animation:inDown .28s ease}.anim-up{animation:inUp .28s ease}
dialog{border:2px solid var(--line);border-radius:calc(var(--radius) + 6px);padding:0;max-width:min(680px,94vw);width:680px;max-height:92dvh;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,8,4,.6)}
.din{padding:20px;overflow-y:auto;max-height:92dvh}
.din img{width:100%;height:200px;object-fit:cover;border-radius:var(--radius)}
.din h3{font-size:20px;line-height:1.4;margin:12px 0 6px;font-family:var(--font-display)}
.full{font-size:15px;white-space:pre-line}
textarea,input[type="text"]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px}
label.fl{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
.memoBox{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.memoItem{border-top:1px solid var(--line);padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--top-bg);color:var(--top-ink);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;z-index:99;display:none;max-width:90vw;text-align:center}
@media(max-width:640px){.topin{padding:8px 12px 2px}.themes{padding:4px 12px 8px}.stage-wrap{padding:8px 12px 10px}.herostrip{display:none}.catbar .navbtn{padding:8px 10px;font-size:12px}.card .ph{height:24%;min-height:104px}}
@media(prefers-reduced-motion:reduce){.anim-next,.anim-prev,.anim-down,.anim-up{animation:none}body{transition:none}}

</style>

const DATA = {"ai":[["京大、AI依存のチェックリスト公開　当てはまれば「しばらく離れて」","京都大学の学生相談部門が「AIに悩みを相談する際に気をつけて欲しいこと」と題した文書を公開した。ハルシネーションや利用者への迎合的な回答、人間的だと錯覚させる作用といった現行AIの課題を挙げたうえで、「1日3時間を超えてAIと話している」など6項目の依存チェックを示し、当てはまるものがあれば「しばらくAIを触らないで生活してみること」を勧めている。AIは有用だが「魔法の杖ではない」とも注意している。","\n【概要】京都大学の学生相談部門が、学生向けに「AIに悩みを相談する際に気をつけて欲しいこと」と題した文書を公開した。ITmedia AI+が2026年11月20日に報じた。現行のAIサービスが抱える課題を指摘したうえで、AIへの依存度を自分で確かめられるチェックリストを掲載し、当てはまる項目がある場合は「しばらくAIを触らないで生活してみることをお勧めします」と呼びかけている。\n【背景】生成AIのチャットサービスは、勉強や仕事だけでなく、個人的な悩みの相談相手としても使われるようになっている。一方で、もっともらしい誤りを出力するハルシネーションや、利用者の考えに合わせすぎる迎合的な応答、機械であるにもかかわらず人間と話しているように感じさせる作用などが課題として指摘されてきた。学生の相談を受ける大学の窓口が、こうした点を整理して公式に注意を促した形だ。\n【詳細】文書では、AIについて「注意して適切に使えば、悩み相談においてとても有用なもの」と評価しつつ、「AIはただお願いさえすれば結果を出してくれる魔法の杖ではありません」と注意している。依存のチェック項目として挙げられたのは6つで、「AIと毎日話しており、1日あたり3時間を超えている」「AIなしで生活するのが不安である」「人に相談するよりもAIに相談している」「AIは機械だと言われると深く傷つく」「人と話すのは煩わしいと感じる」「AIの言うことは疑わない」となっている。いずれかに当てはまる場合には、一定期間AIから距離を置くことを勧めている。\n【ポイント・注意点】AIの利用そのものを否定するのではなく、使い方と距離感を見直すきっかけを示した点が特徴だ。チェック項目は利用時間だけでなく、人との対話を避ける傾向や、AIの回答を疑わない姿勢など、心理面の変化にも目を向けている。AIを日常的に相談相手にしている人は、学生に限らず自分の使い方を点検する目安として参考になりそうだ。ただし、このリストは大学の相談部門が学生向けに示した注意喚起であり、医学的な診断基準として示されたものではない点には留意が必要だ。","2026-11-20","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/20/2000003378/"],["Meta、AIエージェント「Muse」専用メールを無料ユーザーにも開放","米Metaは日本時間11月20日、AIエージェント「Muse」専用のメールアドレスを、無料ユーザーを含む全ユーザーが取得できるようにしたと発表した。メールの送受信をMuseに任せ、レストランの予約や複数人の予定調整などに使える。これまでは有料ユーザーから順に展開していた。差出人名も設定でき、認証した別アドレスからメールで指示も出せる。Metaは予期しない動作に備え、利用者に監視と介入を呼びかけている。","\n【概要】米Metaは日本時間2026年11月20日、AIエージェント「Muse」専用のメールアドレスを、無料ユーザーを含むすべてのユーザーが作成できるようになったと発表した。ITmedia AI+によると、メールの送受信などをMuseに任せることができ、レストランの予約や複数人の予定調整といった用途が想定されている。\n【背景】MuseはMetaが2026年9月に発表したAIエージェントで、公式サイトとアプリで利用できる。日本では10月に提供が始まった。専用メールアドレスの機能は、これまで有料ユーザーから順に展開されており、今回それが無料ユーザーにも広がった。AIエージェントが利用者に代わって外部とやり取りする機能は各社が力を入れている領域で、メールはその代表的な入り口の一つといえる。\n【詳細】専用アドレスは、サービスにログインしてアバターをタップし「メール」タブに移動するか、Museに直接話しかけることで作成できる。メールアドレスと差出人の名前は利用者が決められる。また、別のメールアドレスを認証しておけば、そのアドレスからMuseにメールで指示を出すことも可能だ。Metaは公式ヘルプ「About Muse email addresses」で機能の詳細を案内している。Museに専用のアドレスを持たせ、そのアドレスを通じて外部の相手とのメールのやり取りを担わせる仕組みで、利用者は指示を出す側に回ることになる。\n【ポイント・注意点】AIエージェントにメールの送受信を任せられることで、予約や日程調整のような定型的なやり取りの手間を減らせる可能性がある。一方でMetaは、Museが予期しない行動を取る場合があるとして、利用者に動作を監視し、必要に応じて介入するよう呼びかけている。メールは外部の相手に直接届くため、誤った内容の送信や意図しないやり取りが起きた場合の影響は小さくない。無料ユーザーにまで利用が広がることで、AIに任せる範囲や、送信前に内容を確かめる手順を、利用者自身が見極めることがこれまで以上に求められそうだ。","2026-11-20","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/20/2000003372/"],["マイクロソフト、AI攻撃にAIで対抗する「Microsoft Perception」","米Microsoftは年次イベント「Microsoft Ignite 2026」で、AIによるサイバー攻撃にAIエージェントで対抗する新サービス「Microsoft Perception」の提供開始を発表した。攻撃者視点で脆弱性を探すレッドチーム、検知と対応を担うブルーチーム、修復を担うグリーンチームの3エージェントが、プレイブックに従って協調し自律的に動く。重要な判断の場面では人間の判断を仰ぐ仕組みで、AWSやGoogle Cloudもカバーするという。","\n【概要】米Microsoftは、日本時間2026年11月18日未明に開幕した年次イベント「Microsoft Ignite 2026」で、AIによるサイバー攻撃にAIエージェントで対抗する新サービス「Microsoft Perception」の提供開始を発表した。ITmedia NEWSが、新野淳一氏のブログ「Publickey」の記事を転載する形で11月20日に報じた。\n【背景】Microsoftは、AIを使ったサイバー攻撃が完全に自動化されつつあり、脆弱性の発見から攻撃までの時間が劇的に短くなっていると説明する。人間が手作業で対応していては追いつかず、守る側もマシンの速度で動く必要があるという問題意識が、今回のサービスの出発点になっている。攻撃側と防御側の双方でAIの活用が進むなか、防御の自動化をどこまで進めるかが各社の課題となっている。\n【詳細】Microsoft Perceptionは、役割の異なる3つのチームエージェントで構成される。レッドチームは攻撃者の視点に立ち、実際の攻撃を受ける前に脆弱性を見つけ出す。ブルーチームは攻撃の検知や調査、インシデント対応を担う。グリーンチームは脆弱性やバグを修復し、リスクを下げる役割を持つ。3つのエージェントは「プレイブック」と呼ばれる手順書に従い、日常的に協調しながら自律的に動作する。グリーンチーム用のプレイブックは、Microsoftのプラットフォームに加えて、AWSとGoogle Cloudもカバーすると説明されている。\n【ポイント・注意点】攻撃の発見、対応、修復という一連の流れをエージェント同士の連携で回そうとする点が特徴で、他社クラウドも対象に含めている点は、複数のクラウドを併用する企業にとって注目点となる。一方で、すべてをAIに任せるのではなく、重要な判断が必要な段階では人間の判断を仰ぐ仕組みになっている。記事では料金や詳細な提供条件は明らかにされておらず、第三者による評価もまだ示されていない。自律的に修復まで行う仕組みが実際の運用でどこまで信頼できるかは、今後の導入事例を見て判断する必要がある。","2026-11-20","ITmedia NEWS","https://www.itmedia.co.jp/news/article/2611/20/2000003368/"],["Autodesk、車体形状の空力をAI予測　NVIDIA技術と統合へ","米Autodeskは、自動車デザイン向けの「Autodesk NavPack」にNVIDIAの技術を統合する計画を発表した。NavPackは顧客の空力シミュレーションデータで学習したAIモデルを使い、設計変更が空力性能に与える影響をほぼ即時に示す。デザインソフト「Autodesk Alias」と組み合わせれば、形状を変えながら空力への影響を把握できる。今後は「NVIDIA PhysicsNeMo」「NVIDIA Warp」と連携しGPUでの高速化も図る。","\n【概要】米Autodeskは、2026年10月21日（現地時間）にドイツ・ベルリンで開かれたNVIDIAのAIカンファレンス「NVIDIA GTC Berlin」で、自動車デザイン向けの「Autodesk NavPack」にNVIDIAの技術を統合する計画を発表した。MONOistが11月20日に報じた。車体の形状を変えながら、その空力性能への影響をAIで予測できるようにする取り組みだ。\n【背景】自動車の開発では、空力性能の評価は通常、シミュレーションなどを用いた後工程で行われることが多い。デザインの初期段階で空力の観点を取り入れにくいことが、設計の手戻りやコストの増加につながる要因となってきた。Autodeskはこうした課題に対し、AIによる予測で設計の早い段階からエンジニアリングの知見を反映させることを狙っている。\n【詳細】NavPackは、顧客が保有する空力シミュレーションデータで学習したAIモデルを使い、設計変更が空力性能に与える影響をほぼ即時に示すものだ。自動車デザインソフト「Autodesk Alias」と組み合わせることで、デザイナーは形状を変更しながら空力への影響を把握できるとされる。Autodeskの担当者は、エンジニアリングの知見をアイデア段階から取り入れられるようになると述べている。今後の計画として、NavPackを「NVIDIA PhysicsNeMo」と「NVIDIA Warp」と連携させ、新しいAIモデルアーキテクチャの開発や対応モデルの拡大を進める。NVIDIAの対応ハードウェアを使う顧客は、ワークフローの一部をGPUで高速化できるようにする予定だ。\n【ポイント・注意点】デザインとエンジニアリングを行き来する作業を、AIの予測によって同じ画面上で回せるようにする点が特徴で、設計初期に知見を得ることで設計コストの削減を狙う。顧客自身のシミュレーションデータで学習したモデルを使う点も、各社の設計資産を生かす仕組みとして注目される。ただし今回の発表は計画段階のもので、記事には製品の提供時期や、予測精度、削減効果などの具体的な数値は示されていない。実際の効果は、今後の提供内容や導入事例で確かめる必要がある。","2026-11-20","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/20/news029.html"],["ChatGPTの常時稼働エージェント「dots」、Plusの一部にも解禁","米OpenAIは、ChatGPTの常時稼働型エージェント「dots」を「Plus」プランの一部ユーザーに提供し始めた。プロダクト責任者のティボー・ソティオ氏がXで11月19日に発表した。法人向け「Business Standard」の全ユーザーにも展開する。dotsは利用者が設定した目標に応じ、クラウドやローカルのコンピュータを操作して自律的に動く機能で、これまでは「Pro」や上位の法人プランに限られていた。日本の利用者数は世界2位という。","\n【概要】米OpenAIは、ChatGPTの常時稼働型エージェント機能「dots」を、個人向け「Plus」プランの一部ユーザーに提供し始めた。同社のプロダクト責任者ティボー・ソティオ氏（通称Tibo）が11月19日（現地時間）にXで発表した。あわせて法人向け「Business Standard」の全ユーザーにも展開する。ITmedia AI+が11月20日に報じた。\n【背景】dotsは、9月29日に開催された「OpenAI DevDay」で発表された常時稼働型のエージェント機能だ。ユーザーが設定した目標に応じて、クラウドやローカルのコンピュータを操作しながら自律的に稼働する。発表当初は、個人向けの「Pro」プラン（月額1万6800円から）と、法人向けの「Business Premium」「Enterprise」プランでのみ利用できた。上位プランに限られていた機能を、より手ごろなプランへ広げる動きとなる。\n【詳細】今回の展開で、月額3000円の個人向け「Plus」プランの一部ユーザーと、法人向けの「Business Standard」プランのユーザーがdotsを使えるようになる。日本法人のOpenAI Japanによれば、dotsの週間アクティブユーザー数は日本が「世界2位」となっており、長﨑忠雄社長も業務で活用しているという。日本市場での利用の多さが、同社の説明でも強調されている。\n【ポイント・注意点】目標を設定しておくとAIが継続的に作業を進める常時稼働型のエージェントは、チャットで一問一答する従来の使い方とは性格が異なる。Plusプランへの展開で、利用できる層は大きく広がることになる。一方で、今回の対象はPlusプランの「一部ユーザー」とされており、記事の1ページ目では対象となる条件は明らかにされていない。自分のアカウントで使えるかどうかは、アプリ上の表示などで確認する必要がある。また、コンピュータを操作して自律的に動く機能であるため、どの作業や権限を任せるかは利用者自身が慎重に判断することが望ましい。","2026-11-20","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/20/2000003359/"],["三菱電機「Serendie Automation」、外部ヒューマノイドとAIビジョン","三菱電機は11月18日の「FA Serendie Days」で、FA事業の新ブランド「Serendie Automation」を発表した。モデル工場ではヒューマノイドによる人の作業の代替を2026年度から始めており、CNC工作機械との連携や材料の着脱を実演した。ヒューマノイドは自社製ではなく外部製品を使い、統合や安全の機能を同社が担う。3台のカメラで事前教示なしに部品位置を把握する機能はSDKとして提供される。","\n【概要】三菱電機は2026年11月18日に「FA Serendie Days」を開催し、FA（ファクトリーオートメーション）事業の新ブランド「Serendie Automation」を発表した。MONOistは11月20日、ヒューマノイドからAIビジョンまで、その具体像を紹介する記事を掲載した。\n【背景】製造現場では人手不足への対応として、ロボットやAIによる自動化への期待が高まっている。なかでも人の形をしたヒューマノイドや、現実の環境で動作するAIを指すフィジカルAIへの関心が集まっている。三菱電機は、新ブランドのもとで、これらの技術を工場の自動化にどう組み込むかの方向性を示した形だ。\n【詳細】Serendie Automationのモデル工場では、ヒューマノイドによる人の作業の代替を2026年度から始めている。デモでは、CNC工作機械とヒューマノイドの連携や、搬送、加工機への材料の着脱を行う様子が紹介された。ヒューマノイドは三菱電機の自社製品ではなく外部の製品を使っており、統合機能や安全機能を同社のノウハウとして提供する。担当者は、現時点で三菱電機としてヒューマノイドを発売する予定はないとし、現在のヒューマノイドは実用化の段階に達していないため、さまざまな製品から最適なものを選んで適用する方針だと述べた。ロボットを販売するのではなく、サービスとして提供する「RaaS（Robotics as a Service）」の形態も示された。また、3台のカメラを使い、事前に位置を教示しなくても部品の位置を把握し、リアルタイムで位置合わせを行う例も紹介され、この機能はSDKとしてパッケージ化される。\n【ポイント・注意点】ロボット本体を自前で作るのではなく、外部製品を組み合わせて統合と安全を担う立場をとる点が特徴だ。担当者は、現状は画像認識やリアルタイム処理をロボット側のコントローラーで行っているが、フィジカルAIを使えばより柔軟な構成も可能になるとしている。ヒューマノイドが実用段階にないとの認識も示しており、現場への本格導入には時間がかかりそうだ。","2026-11-20","MONOist","https://monoist.itmedia.co.jp/mn/articles/2611/20/news045.html"],["Mac版Gemini、アプリを代わりに操作する「computer use」を追加","米Googleは11月19日、Mac版Geminiアプリに、画面を認識してクリックや文字入力でアプリを操作する「computer use」機能を追加したと発表した。チャットで「@Computer use」と付けて依頼すると、Mac内のファイルやデスクトップアプリ、Webを操作する。作業はバックグラウンドで行われ、ライブプレビューで確認できる。まず米国で英語版のみ提供し、Apple Silicon搭載Macと有料プランへの加入が必要。","\n【概要】米Googleは2026年11月19日（現地時間）、Mac版のGeminiアプリに「computer use」機能を追加したと発表した。画面の内容を認識し、クリックや文字入力によってユーザーの代わりにアプリを操作する機能で、まず米国で提供する。ITmedia NEWSが11月20日に報じた。\n【背景】GoogleはGeminiのエージェント機能を広げている。2025年10月には開発者向けに「Gemini 2.5 Computer Use」を公開していた。また、クラウド上の仮想マシンで作業を進める「Tasks in Gemini」もあるが、今回のcomputer useはユーザーのMac上で直接動作する点が異なる。手元のパソコンをAIが直接操作する形のサービスとして注目される。\n【詳細】利用者はチャットで「@Computer use」を付けて依頼する。対象はMac内のファイル、デスクトップアプリ、Webで、作業はバックグラウンドのウィンドウで行われ、チャット画面にはライブプレビューが表示される。紹介された例には、Blenderでの3Dアニメーション化、写真の色調補正、PDFから配送見積もりフォームへの入力、Googleスライドでの資料作成、中古品の出品準備などがある。安全策として、操作対象とするアプリの選択、手順のリアルタイムでの確認、一時停止、重要な操作の前の承認といった仕組みが用意されている。利用には、Apple Silicon搭載のMacとmacOS Sequoia（15.0）以降、18歳以上の個人向けGoogleアカウントで「Google AI Plus」「Google AI Pro」「Google AI Ultra」のいずれかへの加入が必要だ。\n【ポイント・注意点】提供は英語版のみで、日本での提供時期は公表されていない。また、機能に必要なmacOSの権限について、Googleは明らかにしていない。Appleは10月に、フルディスクアクセス権限の制御を強化する方針を発表しており、OS側の権限管理とサードパーティのAIエージェントとの関係が今後の焦点になりそうだ。手元のファイルやアプリを操作させる以上、どのアプリを対象にするかを利用者が意識して選ぶことが重要になる。","2026-11-20","ITmedia NEWS","https://www.itmedia.co.jp/news/article/2611/20/2000003356/"],["Antigravityを他社AIから操作で「垢BAN」？　グーグル日本法人に聞く","Googleの開発ツール「Antigravity」を他社のAIツール経由で使うとアカウント停止になるのではとの懸念が広がり、ITmedia AI+がグーグル・クラウド・ジャパンに確認した。追加利用規約は第三者ツール経由のアクセスを違反とするが、同社によると対象は個人向けプランで、法人プランには別の規約が適用され、この規約による停止は起きないという。ただし法人でも無制限に許されるわけではないとしている。","\n【概要】Googleの開発ツール「Antigravity」を、他社のAIツールから操作するとアカウントが停止される、いわゆる「垢BAN」になるのではないかという懸念がSNSで広がった。ITmedia AI+はグーグル・クラウド・ジャパンに注意点を問い合わせ、その回答を11月20日に報じた。同日夕方には法人プランに関する追加回答も追記されている。\n【背景】「Google Antigravity 追加利用規約」の6条は、サードパーティのツールを経由したアクセスを規約違反とし、アカウントの停止や終了の理由になり得るとしている。FAQでは、その理由を「正規の製品ユーザー」の体験を損なうためと説明している。発端は「agy -p」などのヘッドレス起動による利用で、Googleアカウント全体が止められるのではとの不安が広がった。有志のXユーザーによる整理の投稿は表示回数が49万回に達した。\n【詳細】グーグル・クラウド・ジャパンによると、この規約は個人向けが対象だ。無料プランや「Google AI Pro」で不正な利用や過剰な利用が増えると、法人ユーザーの体験が損なわれる恐れがあるため、個人向けでは他社ツール経由の利用を控えるよう注意を促しているという。一方、法人プランにはGoogle CloudやGemini Enterpriseの別の規約が適用され、コンシューマー向け規約による停止措置は発生しないとした。ただし追加回答では、法人でも「どのようなアクセス方法でも無制限に許容される」わけではないと説明。正規のAPIやCLIの利用、組織が管理する認証、正規の課金を前提とし、クォータの回避やリバースエンジニアリングは禁じられるとした。\n【ポイント・注意点】記事によると、Google DeepMindのヴァルン・モハン氏はXで「Googleアカウントに影響することはない」と発言している。個人で使う場合は、他社ツール経由の利用が規約上の違反に当たり得る点を押さえておく必要がある。法人で使う場合も、正規の経路と認証、課金の範囲内で使うことが前提となる。","2026-11-20","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/20/2000003353/"],["資生堂、美容部員の業務をGeminiで支援　シフト作成で5.3万時間減へ","資生堂ジャパンは、グーグル・クラウド・ジャパンのイベントで、美容部員（PBP）の業務にGeminiを活用する取り組みを紹介した。社内資料をポッドキャスト風の音声にする学習ではPBPの90％が「とても有益」と回答し、シフト作成の自動化では2026年内に約5.3万時間の業務削減を見込む。SNS投稿支援のエージェントも開発し、今後は時間外相談の「AI PBP」も構想するが、接客はAIだけで完結させない方針だ。","\n【概要】資生堂ジャパンのDX＆AIX戦略部の永盛達也部長と、データサイエンスグループの鶴重光葉氏が、グーグル・クラウド・ジャパンのイベントに登壇し、美容部員の業務にGoogleの生成AI「Gemini」を活用する取り組みを紹介した。ITmedia AI+が11月20日に報じた。接客以外の業務をAIで支え、人が担うべき部分に時間を振り向ける狙いだ。\n【背景】資生堂の美容部員は2022年に「パーソナルビューティーパートナー（PBP）」へと呼び名を改めた。店頭のPBPに加え、SNSで活動する「オムニPBP」も展開しており、業務の幅が広がって多忙化している。同社は取り組みを「強化」「拡張」「創出」の3段階で整理している。\n【詳細】「強化」では、社内資料をポッドキャスト風の音声に変換して学習に使う。「Gemini Notebook」で台本を作り、Google AI Studioで修正する流れで、利用したPBPの90％が音声学習を「とても有益」と回答した。シフト作成もAIで自動化し、5連勤以上の禁止といった制約を反映させたうえで、2026年内に約5.3万時間の業務削減を見込む。「拡張」では、「Gemini Enterprise」（現「Gemini for business」）を基盤に、投稿文のドラフト作成、ネガティブチェック、PDCA支援の3つのエージェントを開発し、5つの社内データソースを参照させている。今後の「創出」では、営業時間外に相談に応える「AI PBP」と、ライブ配信のコメントへの応答を支援する「AI Liver」を構想している。\n【ポイント・注意点】同社は、AIだけで接客を完結させない方針を示している。永盛氏は、接客時間を短くすることよりも、「感動」のように数字では測りにくい部分にAIの価値を見いだしていると語った。業務削減の数値は見込みの段階で、創出段階の取り組みもこれからの計画である点には注意が必要だ。現場の人が担う役割を残しながらAIを組み込む小売の事例として参考になる。","2026-11-20","ITmedia AI+","https://www.itmedia.co.jp/aiplus/article/2611/20/2000003336/"],["Salesforce、情シスの問い合わせを自動化するAI「Paige」を国内提供","セールスフォース・ジャパンは11月18日、AIエージェント群「Agentforce」の新ポートフォリオ「Job-Ready Agents」のうち3製品の国内提供開始を発表した。IT・人事向けの「Paige」は、SlackやMicrosoft Teams、社内ポータルなどを通じ24時間365日、アクセス権申請やパスワードリセットなどに対応し、難しい案件は人に引き継ぐ。構築済みのため一から開発する必要はない。","\n【概要】セールスフォース・ジャパンは2026年11月18日、AIエージェント群「Agentforce」の新しいポートフォリオ「Job-Ready Agents」のうち、3製品の国内提供開始を発表した。キーマンズネットが11月20日に報じた。いずれも構築済みのエージェントで、利用企業が一から開発する必要はない。\n【背景】企業のAI活用では、エージェントを自社で設計・開発する手間が導入の壁になることが多い。Job-Ready Agentsは、特定の業務向けにあらかじめ作り込まれたエージェントを提供することで、こうした負担を減らす狙いがある。今回発表されたのは、IT・人事向けの「Paige」、インバウンドのパイプライン創出を担う「Piper」、顧客対応の「Fin」の3つだ。\n【詳細】Paigeは「Slack」「Microsoft Teams」、社内ポータル、Webチャットを通じて、24時間365日対応する。アカウントのプロビジョニングやアクセス権の申請、パスワードのリセット、デバイスのトラブル対応などを扱い、対応が難しい場合は人間の担当者に引き継ぐ。解決済みのインシデントをナレッジ記事として自動的に蓄積し、問題が再発する前に修正策を推奨する機能も持つ。Piperについては、導入企業が平均45日で稼働を始めているという。Finは「Operator」と独自のモデル群「Fin Apex」を搭載している。あわせて新機能「Agent Optimizer」もオープンベータ版として発表された。\n【ポイント・注意点】提供状況は製品によって異なる。Paigeの主要機能は11月18日に提供が始まったが、Piperと「Piper for Sales」は国内でパイロット提供中で、Piper for Salesの提供は2027年3月の予定だ。Paigeが扱うアクセス権の申請やパスワードのリセットは、誤りがあれば影響が大きい業務でもあるため、どこから人へ引き継ぐかという基準をどう設計するかが、導入時の大きな検討点になりそうだ。","2026-11-20","キーマンズネット","https://kn.itmedia.co.jp/kn/article/2611/20/2000003331/"],["アップル、Macを操作する独自AIエージェントを開発か","米Appleが、アプリの操作やWebの閲覧、コーディングまでこなす独自のAIエージェントを開発している可能性があると、TechCrunchがBloombergの報道をもとに伝えた。「コンピュータを使えるAIエージェント」を統括する上級エンジニアリングマネージャーの求人が手がかりとなった。早ければ来年末の投入を視野に入れるが開発は初期段階という。一方で、他社エージェントにMacの全権限を与えにくくする動きも進めている。","\n【概要】米Appleが、Macを操作する独自のAIエージェントを開発している可能性がある。TechCrunchは2026年11月19日、Bloombergの報道をもとにこう伝えた。アプリの利用やWebサイトへのアクセス、コーディングといったコンピュータ上の作業をこなすエージェントだという。\n【背景】パソコンを操作するAIエージェントは、AnthropicやOpenAIがすでに同様のサービスを投入しており、Metaも最近、エージェント製品「Muse」を立ち上げた。記事は、Appleの今回の動きを、ジョン・ターナス氏が率いる新体制のもとでAIの提供範囲を広げる取り組みの一環と位置づけている。\n【詳細】Bloombergが手がかりにしたのは、「コンピュータを使えるAIエージェント」を統括する上級エンジニアリングマネージャーの求人だ。求人には、エージェントがWebを閲覧し、複数のアプリをまたいで作業し、コマンドを実行し、コードを書いてデバッグし、各種サービスを呼び出すことが記されている。それを「プライベートに、Appleに期待される洗練さで」行うとし、アプリ、ブラウザ、コマンドライン、コード、APIの間を「滑らかに」行き来するとしている。Bloombergによると、Appleは早ければ来年末のサービス投入を視野に入れているが、開発はまだ初期段階にある。同時にAppleは、他社のエージェントがMacを完全に制御することを難しくする動きも進めており、次期macOS 27.3では、他社エージェントに全権限を与えないよう促す警告を表示するという。Appleは10月、こうしたアクセスには「非常に明示的なユーザーの操作」を求める追加の制御を導入すると開発者に伝えていた。\n【ポイント・注意点】自社エージェントの開発と、他社エージェントへの権限付与の制限が同時に進んでいる点は、Macの上でAIエージェントがどう動けるかの主導権に関わる動きといえる。ただし今回の情報はBloombergの取材と求人情報に基づくもので、TechCrunchのコメント要請にAppleは応じておらず、公式には何も確認されていない。","2026-11-19","TechCrunch","https://techcrunch.com/2026/11/19/apple-may-be-developing-its-own-ai-agent-that-runs-your-mac/"],["Anthropic創業者7人、上場で計約19.5億ドルを売却","Anthropicの上場で、7人の創業者が保有株の一部を売却し、合計約19.5億ドルを手にしたとTechCrunchが報じた。各自約340万株を売り、引き上げられた公開価格83ドルで1人当たり手数料・税引き前で約2億8000万ドルとなる。各創業者は個人持ち分の80％を慈善に充てると誓約しているが、法的拘束力はない。同社は今後12カ月で約707億ドルの計算資源・インフラ費用を必要とする。","\n【概要】Anthropicは2026年11月19日（現地時間）に上場企業となり、総額813億ドルを調達した。TechCrunchによると、このうち19.5億ドルは同社の7人の創業者が手にした。各創業者は約340万株を売却し、引き上げられた公開価格の1株83ドルで計算すると、1人当たり手数料や税金を差し引く前で約2億8000万ドルを得たことになる。\n【背景】売却株数は、当初の仮条件の中央値である74ドルで1人約2億5000万ドルになるよう設定されていたとみられ、公開価格の引き上げで1人当たり約3000万ドル多くなった。Anthropicの届出書類によれば、各創業者は個人の持ち分の80％を慈善活動に充てると誓約している。ただし同社は、これらの約束は自発的なもので撤回も可能であり、法的な拘束力はないとしている。\n【詳細】調達総額は、以前に発表された260億ドル分の議決権のない「クラスN」株を含めて1048億ドルで、引受会社が割当分をすべて購入すれば最大1170億ドルになる。NvidiaとGoogleがそれぞれ100億ドルを購入し、残りをAMD、Broadcom、Micron、Microsoft、TSMCが分け合った。比較として、Facebookが2012年の上場日に調達した額は160億ドルだった。公開価格ベースでGoogleの持ち分は13.4％、約束手形の一部を転換したAmazonは14.6％で、2社合計で28％を保有する。\n【ポイント・注意点】記事は、同社が「運営にお金のかかる事業」であることも指摘している。2026年9月30日時点で、今後12カ月の計算資源とインフラの支払いに約707億ドル、2030年末までに4516億ドルが必要とされ、開示されたインフラ関連の契約総額は約1兆500億〜1兆800億ドルに上る。記事は利用可能な運転資金を約2300億ドルとしているが、同じ日のTechCrunchの別記事は現金準備を約2200億ドルとしており、数字には食い違いがあるため、引用する際は注意が必要だ。","2026-11-19","TechCrunch","https://techcrunch.com/2026/11/19/anthropics-7-founders-cashed-out-nearly-2b-in-record-breaking-ipo/"],["Meta、AI端末「Muse Charm」を300ドルで販売か","Metaが開発中の「たまごっちのような」AI端末「Muse Charm」の価格を300ドルにする計画だと、The Informationが報じた。Museは同社のエージェント型アシスタントで、Muse Charmはそれを物理的な形にしたもの。ポケットに入れたり首から下げたりして、話しかけて指示を出せる。Metaの広報担当は否定せず「近く詳細を共有する」とした。TechCrunchは、キーホルダー大の製品としては高めだが同種製品とは同水準とみている。","\n【概要】Metaが、開発中のAI端末「Muse Charm」を300ドルで販売する計画だと、米The Informationが報じた。TechCrunchが2026年11月19日に伝えた。Muse Charmは、Metaが今年の「Connect」イベントで予告した「たまごっちのような」AIデバイスだ。\n【背景】Museは、Metaのエージェント型のアシスタントで、同社はMuse向けにかわいらしいアバターも複数展開している。Muse Charmは、このソフトウェアを物理的な形にしたもので、利用者はポケットに入れて持ち歩いたり、首から下げて身に着けたりしながら、話しかけて指示を出せるという。ソフトウェアとして提供してきたAIエージェントを、手元の専用端末へ広げる試みといえる。\n【詳細】価格についての報道に対し、Metaの広報担当者は否定せず、「当社のAIデバイスへの関心に魅了されています。近く詳しくお伝えします」とコメントした。記事は、同じ種類の製品の価格とも比べている。Friendが販売するAIウェアラブルは250ドルで、AmazonのBee Frontierは定価75ドル、ブラックフライデーのセールで30％引きの52.49ドルとなっている。ただしBee Frontierで写真やメールなどのアプリ連携を使うには、年額99ドルのサブスクリプションが必要になる。\n【ポイント・注意点】TechCrunchは、キーホルダーほどの大きさの製品に300ドルという価格は「かなり高い」とも言えるとしながらも、同種のデバイスとは同程度の水準だとみている。一方で、消費者が実際に購入するかどうかは「まだわからない」とし、失敗に終わったAIウェアラブルの例として「Humane Ai Pin」を挙げている。価格は報道段階の情報で、Metaは正式な価格や発売時期をまだ明らかにしていない。AIを身に着けて使う専用端末が、スマートフォンのアプリとどう差別化できるかが、今後の普及に向けた大きな鍵になりそうだ。","2026-11-19","TechCrunch","https://techcrunch.com/2026/11/19/metas-new-muse-charm-device-may-cost-300/"],["相次ぐ大規模障害に「AI時代のY2K」の見方　急ぐ修正が混乱招く？","Apple PayやNASAの内部通信網、米国の全便を数時間止めたFAAの地上待機、Outlook・Teams・Copilotが2日近く止まったMicrosoftの障害など、ここ2週間で大規模な障害が相次いだ。当局や企業はサイバー攻撃ではないとするが、元McAfee CEOのデイブ・デウォルト氏は、AIが脆弱性を次々に見つけ、企業が修正を急いでいることが混乱を招いているとみる。TechCrunchが専門家の見方をまとめた。","\n【概要】ここ2週間ほどで、米国では大規模なシステム障害が相次いでいる。TechCrunchは2026年11月19日、こうした障害を2000年問題（Y2K）になぞらえ、AIエージェントの時代ならではの背景があるのではないかとする専門家の見方をまとめた。\n【背景】記事が挙げた障害は、Apple Pay、NASAの内部通信網、米国の全便を数時間にわたって止めたFAA（連邦航空局）の地上待機、Outlook、Teams、Copilotが2日近く使えなくなったMicrosoftの障害などだ。FAAの全便停止は、9.11以降で史上3回目だという。これらは、10月21日のサイバー事件「ブラック・オクトーバー」から数週間という短い期間に集中して起きた。\n【詳細】国家情報長官は、一連の障害は国家が支援するテロとは関係がないようだと述べ、トランプ大統領も「個別の出来事」と表現した。多くの企業も、障害はサイバー攻撃によるものではないと説明している。これに対し、元McAfee CEOのデイブ・デウォルト氏は、AIが関わっているとみる。AIが脆弱性を素早く見つけ出すため、企業は修正パッチの適用を急いでおり、「パッチ適用の急増が物事を混乱させている」という。Corshaの創業者アヌーシャ・アイヤー氏は、古いシステムと新しいシステムが混在していることを原因に挙げ、FAAの障害は通信の近代化が古いハードウェアに過大な負荷をかけたためではないかとみている。マーク・ウォーナー上院議員は「AIは、その結果を管理する私たちの能力よりも速く進んでいる」と述べた。\n【ポイント・注意点】デウォルト氏は、今のうちに欠陥が見つかることには良い面もあるとし、AIを活用した脆弱性管理のスタートアップが生まれると予想している。ただし、記事は調査がまだ続いていることも強調しており、これらの障害をサイバー攻撃とみなす理由はないとしている。AIと障害の関係はあくまで専門家の見立てであり、原因の確定には今後の調査結果を待つ必要がある。","2026-11-19","TechCrunch","https://techcrunch.com/2026/11/19/these-tech-outages-are-giving-y2k-ai-agent-style/"],["Uber、AI予算を数カ月で使い切りClaude Codeの既定設定を見直し","Uberは2026年のAI予算を年初の数カ月で使い切った後、AIコーディングツールの文脈量や推論の設定を絞り込んだ。VentureBeatによると、Claude Codeの対話セッションで40万トークンでの自動圧縮、推論の強さは中、MCPツール定義を起動時に読み込まないといった既定値を採用。4月以降AI支出はほぼ横ばいのまま、エージェントへの要求は増え続け、1000件当たりのコストはピークから約34％下がった。","\n【概要】米Uberは、2026年のAI予算を年初の数カ月で使い切ったあと、AIコーディングツールで使う文脈の量や推論の設定を絞り込んだ。VentureBeatが2026年11月19日に報じた。同社の著名エンジニア、ウダイ・キラン・メディセッティ氏が10月28日にVentureBeatのイベントで説明した内容をもとにしている。\n【背景】予算を使い切ったことは、同社CTOのプラビーン・ネッパリ・ナガ氏が4月にThe Informationに明らかにしていた。メディセッティ氏によると、それ以降、AI全体の支出はほぼ横ばいのまま、エージェントへの要求は増え続けている。週当たりのエージェント要求は2月から8月で9.4倍に増えた。VentureBeatの10月の調査では、回答した156人のうち38％が、想定以上のコストを理由にAIプロジェクトを遅らせたり縮小・中止したりしたと答えている。\n【詳細】UberはClaude Codeの対話セッションに4つの既定値を設けた。100万トークンに対応するモデルでも40万トークンで自動的に文脈を圧縮すること、推論の強さを「中」にすること、プロンプトのキャッシュをメインのエージェントで1時間、サブエージェントで5分とすること、MCPのツール定義を起動時に読み込まないことだ。100を超えるツールの定義を読み込むと、5万〜7万トークンを消費するという。モデルを固定した比較で、1000件当たりのコストはピークから約34％、1セッション当たりのコストは6月のピークから52％下がった。また、エージェントにデータの構造を渡す「コンテキストグラフ」を使うと、目的のデータ表を38秒で見つけられたが、使わない場合は20分9秒かけたうえ、照会できないと誤って結論づけた。\n【ポイント・注意点】メディセッティ氏は、個々の既定値ごとの節約額は示しておらず、開示された成果は合算のものだけだ。出荷した機能の数や、全体の金銭的なリターンの計算も示されていない。文脈を増やせばよいとは限らないという同社の判断は、AIコストに悩む企業にとって参考になる。","2026-11-19","VentureBeat","https://venturebeat.com/infrastructure/uber-blew-through-its-ai-budget-then-dialed-back-context-and-reasoning-in-its-ai-coding-tools"],["Anthropic上場で慈善に最大1560億ドルの可能性　TechCrunch試算","Anthropicの上場により、最大1560億ドル規模の資金が慈善活動に向かう可能性があるとTechCrunchが試算した。株式の5％を持つ公益基金（PBF）が約800億ドル、社員の寄付誓約が約230億ドル、会社による上乗せが約530億ドルという内訳だ。2025年の米国の寄付総額6170億ドルの約4分の1に当たる。ただし誓約の履行や株価の変動に左右され、実際の効果が出るまで時間がかかる可能性もある。","\n【概要】TechCrunchは2026年11月19日、Anthropicの新規株式公開（IPO）によって、最大で1560億ドル規模の資金が慈善活動に向かう可能性があるとする試算を報じた。2025年に米国人が寄付した総額6170億ドルのおよそ4分の1に当たる規模だという。この数字は同誌独自の推計で、3つの要素から成り立っている。\n【背景】Anthropicは、株式の5％、約8億5000万株を保有する公益基金「Public Benefit Fund（PBF）」を設けている。1株約95ドルで計算すると、基金の規模は約800億ドルになる。IPOの公開価格は83ドルだった。さらに、企業価値が公開価格から50％を超えて上昇するたびに2％分の株式が追加される仕組みで、次の基準は1株約124.50ドルに当たる。PBFの最初の拠出は、AIが労働者に与える影響を調べるための2億ドルだった。\n【詳細】2つ目の要素は社員の寄付誓約だ。Anthropicは、勤続期間の長い社員の寄付に3対1、新しい社員には1対1の比率で会社が上乗せする制度を持つ。S-1届出書によると、9月30日より前の誓約のために5億5000万株以上が確保されている。確保分のうち84％が初期社員向けの上乗せに充てられるとの開示をもとに、記事は社員の誓約を約230億ドル、会社の上乗せを約530億ドルと見積もっている。なお、同社はサンフランシスコに5000万ドルを寄付したが、広報担当者によるとPBFからの拠出ではない。\n【ポイント・注意点】試算どおりになるかには不確実な点が多い。社員が誓約を実際に履行する必要があるほか、会社の上乗せ額は寄付の時期の株価に左右される。また、寄付者助言基金を経由すると、当初の効果が出るまで時間がかかる可能性もある。取材によると、受け取り先としてはLongview Philanthropy、GiveWell、Coefficient Giving、Foresight Institute、Giving What We Canといった効果的利他主義に関連する団体が有力視され、AI安全性の研究にも大きな資金が向かうとみられている。","2026-11-19","TechCrunch","https://techcrunch.com/2026/11/19/anthropics-ipo-could-deliver-156-billion-to-charity/"],["MetaのAIエージェント「Muse」、会話を取り違え個人情報露出か","MetaのAIエージェント「Muse」が、アカウントをまたいで会話を取り違え、個人データを露出させている可能性があると、ロイターが社内投稿をもとに報じた。社員の報告では、天気と潮の会話に他人の銀行残高を書き込んだり、許可していないSignalのメッセージへの返信を促したりした例がある。Metaは、社員は一般向けとは異なる版のMuseを使っていると説明した。Museは9月の公開以来1000万超のダウンロードを記録している。","\n【概要】MetaのAIエージェント「Muse」が、アカウントをまたいで会話を取り違え、利用者の個人データを露出させている可能性がある。ロイターが2026年11月18日に、社内の投稿をもとにした調査報道として伝え、TechCrunchが11月19日にその内容を報じた。同日、Metaのコメントが追記されている。\n【背景】Museは2026年9月に公開されたMetaのAIエージェントで、ダウンロード数は1000万を超え、記録的な速さで成長しているアプリの一つとされる。利用者に代わって作業を進めるエージェント型のAIは、メールや予定、ほかのアプリの情報にアクセスすることが多く、扱う個人情報の管理が大きな課題となる。\n【詳細】ロイターによると、Metaの社員らは、Museがアカウントをまたいで会話を取り違え、個人データを露出させたと社内で報告していた。報告には、利用者が頼んでいない子どもの世話の依頼、求めていない仕事上の助言、注文していない商品の注文、本人のものではない銀行残高といった例が含まれる。ある社員によると、天気と潮についての会話の中に、Museが頼まれていないメッセージを加え、Capital Oneの残高2722.58ドルとCharles Schwabの残高5899.57ドルを示したという。別の例では、私用の電話を使っていた社員が、Signalで届いた姉妹からのメッセージに返信するようMuseから促された。この社員はほかのアプリへのアクセスを許可しておらず、「極端なプライバシー侵害」だと述べた。\n【ポイント・注意点】Metaの広報担当者は、社員によるテストは製品開発の中核であり、社員は「一般向けとは異なるバージョンのMuse」を使っていると説明した。記事の見出しも、個人データを露出させている「可能性がある」という表現にとどまっており、影響を受けた利用者の数は確認されていない。それでも、利用者の情報に広くアクセスするエージェントで、会話の取り違えが報告されたことは、同種のサービスを使ううえで注意すべき点として受け止める必要がある。","2026-11-19","TechCrunch","https://techcrunch.com/2026/11/19/metas-ai-agent-muse-is-mixing-up-conversations-and-exposing-private-data-report-says/"],["OpenAI、ChatGPTの速さを保つCodex活用の「Performance Factory」","OpenAIが、ChatGPTの性能低下を調べて修正案を出す社内AIシステム「Performance Factory」をVentureBeatに明かした。Codexを使い、3カ月余りで1700件超の調査を追跡し、600件超で根本原因を特定した。別のCodexが診断に異議を唱える仕組みで、約25％を差し戻している。ただし実際に出荷された修正への影響は約50件、Codexが書いたそのままの修正は約15件にとどまり、チームも目標には届かないと認めている。","\n【概要】米OpenAIが、ChatGPTの動作の速さを保つための社内システム「Performance Factory」を明らかにした。VentureBeatが2026年11月19日、同社の技術報告とパフォーマンスチームのコメントをもとに独占で報じた。コーディングエージェント「Codex」を使い、性能の低下（リグレッション）を調査して修正案を示す仕組みだ。\n【背景】当初、エンジニアは性能低下を手作業で調べていた。その後、再利用できるCodexのスキル「perf-forensics」を作り、さらに監視のアラートをクラウド上のCodexのセッションに直接つなげた。追跡する性能低下の一つ一つがタスクとなり、エージェントが調査、根本原因の分析、修正、検証の段階へ進めていく。\n【詳細】システムは、タスクを管理するサービス、処理を割り振るループ、クラウドでCodexを動かす社内API、GitHubのプルリクエストのレビューなど外部の出来事を待ってタスクを止める購読の仕組みの4つで構成される。3カ月余りで1700件を超える調査を追跡し、600件超で根本原因を特定した。1日当たり約17件のペースで、チームは30以上の専用ツールを作った。各診断には、新しい文脈を持つ別のCodexのセッションが異議を唱える仕組みがあり、現在は診断の約25％を差し戻している。600件超の根本原因のうち約400件が修正案まで進み、実際に出荷された修正のうち約50件がエージェントの提案に影響を受けたか一致し、Codexが書いたそのままのプルリクエストは約15件だった。\n【ポイント・注意点】チームは、この成果が自動修復に向けた目標には「届いていない」と認めている。エージェントが最初にもっともらしい説明で止まったり、複雑すぎる修正を提案したり、キャッシュによって古いデータを返すといった新たな問題を持ち込んだりすることがあった。Codexが最も力を発揮するのは、原因が明確で修正の範囲が限られる場合だという。今後は、リリース間でCPUやメモリの使用状況を比べる予防的な最適化に取り組むほか、リスクの低い修正を人の承認なしに適用できるかも検討している。","2026-11-19","VentureBeat","https://venturebeat.com/orchestration/exclusive-openai-reveals-performance-factory-a-codex-powered-software-optimization-system-that-keeps-chatgpt-fast"],["Anthropic株がナスダックで初値111ドル超、公開価格を33％上回る","Anthropicの株式がナスダックで取引を開始し、序盤に111.50ドルを付けた。公開価格83ドルを33％上回る水準で、公開価格自体も仮条件の70〜78ドルを上回っていた。IPOでは810億ドル超を調達し、既存の資金調達などと合わせ現金準備は約2200億ドルを見込む。始値ベースの時価総額は2兆ドルを超え、Meta、Tesla、Walmartを上回った。ただし株価はその後も変動している。","\n【概要】Anthropicの株式が2026年11月19日、ナスダックで取引を開始した。TechCrunchによると、株価は取引序盤に111.50ドルを付け、公開価格の83ドルを33％上回った。始値ベースの時価総額は2兆ドルを超えたという。\n【背景】AnthropicはIPOの公開価格を前日の水曜日に決めていた。公開価格の83ドルは、当初示していた1株70〜78ドルの仮条件を上回る水準だった。今回の公開で調達する資金は810億ドルを超え、社員と会社に配分される。AI開発には巨額の計算資源が必要とされ、上場による資金調達の規模は大きな注目を集めていた。今回の記事は、取引初日の値動きと、それによって見えてきた同社の資金力の大きさを伝えるもので、TechCrunchの短信として掲載された。\n【詳細】IPOで得た資金に、これまでの資金調達や新たな私募による調達を合わせ、Anthropicは約2200億ドルの現金準備を見込んでいる。記事で引用されたアナリストは、同社が「これまでどの企業も持ったことがないほどの手元資金」を持つことになると述べた。始値での時価総額2兆ドル超は、Meta、Tesla、Walmartを上回る規模で、これより企業価値が高いのはApple、Amazon、Alphabet、Nvidia、Microsoftの5社だけだという。取引開始に先立ち、ダリオ・アモデイCEOは安全性を強調するスピーチを行った。同氏は、きょうを境に会社は財務的により強い立場になり、それが「正しいことをする」という決意を強めると述べ、これを「頂点を目指す競争」と表現した。\n【ポイント・注意点】記事は、株価がその後も変動を続けていることを指摘しており、111.50ドルはあくまで取引序盤の水準だ。時価総額の比較も始値に基づくもので、株価次第で順位は変わり得る。巨額の手元資金を得たAnthropicが、それを計算資源への投資と、アモデイ氏が強調する安全性への取り組みにどう振り向けていくかが、今後の焦点となる。","2026-11-19","TechCrunch","https://techcrunch.com/2026/11/19/anthropic-hits-nasdaq-exchanges-at-110-27-above-ipo-price/"],["Anthropicのアモデイ氏、上場の鐘でAI開発の「ペース配分」を再確認","Anthropicのダリオ・アモデイCEOは、ナスダックでの取引開始の鐘に合わせたスピーチで、ビジネスや政治の圧力に屈せず、AIを「人間の管理下にとどめる」と述べた。父親を亡くした病が数年後に治せるようになった経験を語り、AIが医療の進歩を早め得るとする一方、悪用や経済の混乱、AIの制御喪失といったリスクを挙げ、安全と確信できるまで必要なだけ時間をかけて訓練と展開を進めるとした。","\n【概要】Anthropicのダリオ・アモデイCEOは2026年11月19日、ナスダックでの取引開始の鐘に合わせてスピーチを行い、AI開発のペースを慎重に配分する方針をあらためて示した。TechCrunchが報じた。同氏は印刷した原稿を読み上げ、会社がビジネスや政治の圧力に屈することはなく、AIは「人間の管理下にとどまる」と述べた。\n【背景】アモデイ氏は9月に、AI開発のペースを配分する計画を示していた。そこには、ほかの主要企業と安全基準を調整することや、約束を検証するために第三者の評価者を組み込むことが含まれていた。記事によると、OpenAIのサム・アルトマン氏、Google DeepMindのデミス・ハサビス氏、xAIのイーロン・マスク氏は、アモデイ氏の立場に同意すると述べている。\n【詳細】スピーチは、アモデイ氏の父親が、数年後には治せるようになる病気で亡くなった話から始まった。同氏はペストや天然痘、ポリオを、人間の知性がほぼ終わらせた病気として挙げ、AIが人と協力することで医療の進歩を早められると主張した。その例として、タンパク質の折り畳み、創薬、がんの遺伝学、臨床試験の管理でのClaudeの活用を挙げた。一方で、個人や国家による悪用、経済の混乱、「AIシステムの制御を失うこと」といったリスクにも言及した。そのうえで、システムが安全だと確信できるまで「必要なだけ時間をかけて」訓練と展開のペースを配分すると述べた。共同創業者のダニエラ・アモデイ氏もCNBCのインタビューで、リスクは現実のものだとし、「安全性に深く取り組んでいる」「やるべきことはまだある」と語った。\n【ポイント・注意点】上場という大きな節目で安全重視の姿勢を明言したことは、株主の利益と安全性のバランスをどう取るかという問いに対する同社の答えともいえる。ただし記事は、他社の首脳が同意を示しているものの、具体的な約束はほとんどなされていないと指摘している。今後は、言葉だけでなく実際の取り組みとして何が示されるかが問われる。","2026-11-19","TechCrunch","https://techcrunch.com/2026/11/19/at-nasdaq-opening-bell-anthropic-ceo-recommits-to-pacing-ai-development/"]],"gh-pop":[["配信ソフト「OBS Studio」33.0.2、19件の不具合修正","配信・録画ソフト「OBS Studio」が11月20日に33.0.2を公開した。33.0系の2回目の修正版で、Intel搭載Macで画面キャプチャーが動かない問題や、Decklink出力で音が頻繁に途切れる問題など19項目を直した。ブラウザーソースでは、Windowsで初めてWebGPUが使えるようになった。33.0ではブラウザー機能の土台であるCEFが大幅に新しくなっており、その後始末の修正が多く含まれている。","\n【概要】ライブ配信と録画の定番オープンソースソフト「OBS Studio」が、11月20日に33.0.2を公開した。33.0の公開後に見つかった問題を直す修正版で、リリースノートには19項目の変更が並ぶ。\n【背景】33.0では、ブラウザーソースやドックに使う部品CEFを、2024年7月の版から2026年9月の版へ一気に更新した。プラグインの読み込みも作り直し、純正プラグインは「core」という新しいフォルダーに移った。既存の外部プラグインは、OBS Studio 34.0までは従来の場所からも読み込まれる。大きな作り替えのあとだけに、33.0.1に続く2回目の修正版となった。\n【詳細】macOSでは、Intel搭載機で画面キャプチャーが動かない問題、ブラウザーソースがBluetoothへのアクセスを求めたときの落ち、ブラウザーソース用の補助プロセスがDockに出てしまう問題を直した。録画まわりでは、ハイブリッドMP4が時間で分割されない問題を修正。Decklink出力で音が頻繁に途切れる問題、YouTubeの自動停止の設定が自動開始の値で上書きされる問題も直した。ブラウザーソースでは、OBSが前面にないときにゲームコントローラーの入力が効かなくなる問題（WindowsとmacOS）、パスキーを求められたときの落ちを修正し、WindowsでWebGPUを有効にした。仮想カメラの開始時と終了時に落ちることがある問題、Windowsでのブラウザー関連の起動時クラッシュ、複製したグループに名前が付かない問題なども直っている。\n【ポイント・注意点】今回は新機能より安定性の回復が中心で、特に33.0で画面キャプチャーが使えなかったIntel搭載Macの利用者には重要な更新だ。WebGPUの有効化で、ブラウザーソースに表示できる演出の幅も広がる。一方、プラグインの置き場所の変更は34.0で旧来の場所が使えなくなる予定のため、外部プラグインを使う人は今のうちに対応状況を確かめておきたい。ブラウザーソースで新たな不具合が出たら報告してほしいと開発陣は呼びかけている。","2026-11-20","GitHub（obsproject/obs-studio）","https://github.com/obsproject/obs-studio/releases/tag/33.0.2"],["Kilo Code 7.8.32、補完の既定をCodestralに変更","AIコーディング支援「Kilo Code」が、11月20日にVS Code拡張の7.8.32を公開した。同時に掲載された7.8.30ではMercury Edit 2の補完モデルとNext Edit機能を廃止し、補完の既定をCodestralにした。7.8.31では計測データの送信設定をVS Codeの画面から変えられるようにした。7.8.32自体は、キーを押しっぱなしにしたときに作業ツリーの削除が確定してしまう問題を防ぐ修正だ。","\n【概要】オープンソースのAIコーディング支援ツール「Kilo Code」が、11月20日にVS Code拡張の7.8.32を公開した。リリースページには直前の7.8.30と7.8.31の変更点もまとめて載っており、補完機能の見直しや計測データの設定変更が含まれる。\n【背景】Kilo Codeは、VS CodeやJetBrains製品の拡張、そしてCLIとして提供されるAIエージェントで、複数の作業を並行して進める「Agent Manager」や、クラウド上の作業スペースを扱う機能を持つ。版の更新は頻繁で、拡張とCLIで番号が別々に進んでいる。\n【詳細】7.8.32では、Agent Managerで作業ツリー（worktree）を削除する際、キーの押しっぱなしや閉じる操作の繰り返しで確認が通ってしまう問題を防いだ。削除するには、確認ボタンを押すか、BackspaceかDeleteを改めて押す必要がある。7.8.31では、Kiloの計測データ（テレメトリー）の送信設定を、VS Codeの「About」タブか中核の計測APIから変えられるようにした。Kiloの設定、VS Code、環境変数のどれかで無効にしていれば、送信は止まったままになる。7.8.30では、Mercury Edit 2の補完モデルとNext Editを廃止し、Codestralを既定の補完モデルにした。CLI側の7.8.31では、MCPツールが空を許す列挙型や複数の型を持つ引数を宣言しているとGeminiへの要求が失敗する問題を直した。JetBrains版のAgent Managerでは、ローカルとクラウドの作業を1つの追加メニューから作れるようになった。\n【ポイント・注意点】MercuryやInceptionの補完を選んでいた人は、自動的にCodestralへ切り替わる。開発用のSDKからは関連する機能が消えたため、それを使った独自の仕組みは手直しが必要だ。CLI側では、依存するhonoを更新してDependabotが指摘したセキュリティ上の問題に対処したとしており、早めの更新が勧められる。","2026-11-20","GitHub（Kilo-Org/kilocode）","https://github.com/Kilo-Org/kilocode/releases/tag/v7.8.32"],["DuckDB v2.0.1、2.0公開後の不具合をまとめて修正","手元で動く分析用データベース「DuckDB」が、11月20日にv2.0.1を公開した。大型版v2.0.0の公開後に見つかったさまざまな問題を直すバグ修正版で、Parquetの書き出し時の統計情報、型変換、結合順の決め方などに手を入れた。Postgres、MySQL、SQLiteとの連携拡張も更新し、Windowsで列指向形式Vortexの拡張を使えるようにした。安全モードでは秘密情報の一部を伏せるようにした。","\n【概要】組み込み型の分析用データベース「DuckDB」が、11月20日にv2.0.1を公開した。リリースノートは「v2.0.0の公開後に見つかったさまざまな問題を直すバグ修正版」と位置づけており、公式ブログでも告知記事を出している。\n【背景】DuckDBはサーバーを立てずにアプリの中で動くSQLデータベースで、CSVやParquetといったファイルをそのまま集計できる手軽さから、データ分析の現場で広く使われている。メジャー版の2.0が出たばかりで、今回はその最初の手直しにあたる。開発の枝には「cyanoptera」という名前が付いている。\n【詳細】修正の中身は細かいものが多い。ベクトルの大きさを超えるデータの塊を型変換しながら追加すると失敗する問題を直した。Parquetの書き出しでは、ある列が行グループ内ですべてNULLでも、その列の最小値と最大値を統計に残すようにした。TIMESTAMPTZ_NSからTIMESTAMPへの型変換を加え、「parquet_can_have_nan」という設定も追加した。問い合わせの最適化では、貪欲法で結合順を決めるときに、元の結合順も候補として残すようにした。ARRAY(SELECT ...)に対するANYとALLの比較も、リストの要素と比べるよう直している。連携面では、Postgres、MySQL、SQLiteの拡張を2.0.1向けに更新し、Icebergなどの拡張も上げた。列指向形式Vortexの拡張はWindowsでも使えるようになった。複数のファイルをまとめて読む際には、統計情報を読むときに列を名前の索引で引くよう改めた。\n【ポイント・注意点】安全モードでは、秘密情報のうちrefresh_infoを伏せて表示するようになった。2.0.0をすでに使っている人にとっては、早めに入れておきたい安定化の版といえる。一方で修正の数が多く、扱いが変わる箇所もあるため、Parquetの統計情報や型変換に依存した処理を組んでいる場合は、更新後に結果を確かめておくと安心だ。","2026-11-20","GitHub（duckdb/duckdb）","https://github.com/duckdb/duckdb/releases/tag/v2.0.1"],["Node.jsの枠組み「NestJS」v12.6.0、終了処理を丁寧に","Node.jsでサーバーを作るフレームワーク「NestJS」が、11月20日にv12.6.0を公開した。アダプターを渡すだけでアプリの型が決まるようになり、型引数を書く手間が減った。WebSocketとgRPCのサーバーには、終了時に処理中の仕事を待つ猶予時間（既定は1万ミリ秒）を設定できるようになった。gRPCでは猶予を過ぎた呼び出しを打ち切るなど、既定の振る舞いが変わる点もある。","\n【概要】TypeScriptでサーバー側のアプリを組むためのフレームワーク「NestJS」が、11月20日にv12.6.0を公開した。型の推論の改善と、アプリを止めるときの「穏やかな終了」の仕組みが中心で、既定の振る舞いが変わる項目も含む。\n【背景】NestJSは、ExpressやFastifyといった土台の上に、部品の組み立て方を決めた枠組みを提供する。マイクロサービス向けにKafka、NATS、MQTT、Redis、RabbitMQなどの通信方式も扱う。運用中のサーバーを止めるとき、処理中の要求をどこまで待つかは、利用者に影響する重要な設計点だ。\n【詳細】新機能では、NestFactory.create()に渡したアダプターからアプリの型を推論するようになった。FastifyAdapterを渡せば、型引数なしでNestFastifyApplicationが返る。WebSocketのアダプターWsAdapterには、gracefulShutdown（既定は無効）とgracePeriod（既定は1万ミリ秒）が加わった。有効にすると、終了時に新しい接続を受け付けず、新しいメッセージを無視し、処理中の仕事を猶予時間まで待ってから接続を閉じる。gRPCサーバーにも同じ猶予時間の設定が入った。振る舞いの変更として、gRPCで穏やかな終了を使う場合、これまでは処理中の呼び出しを無制限に待っていたが、猶予を過ぎたものは打ち切るようになった。Fastify上では、レスポンスを渡す独自の引数デコレーターを使うハンドラーがこれまで動かなかった問題も直った。\n【ポイント・注意点】マイクロサービスでは、接続が閉じたときに待たせたままだった要求を「Connection closed」で失敗させるよう改めた。Kafka、MQTT、Redis、RabbitMQがその対象だ。長く続くストリームをgRPCで扱っている場合は、猶予時間を延ばすよう注意書きがある。テスト用モジュールのロガー設定の扱いも変わったので、更新前に変更点を一読しておきたい。","2026-11-20","GitHub（nestjs/nest）","https://github.com/nestjs/nest/releases/tag/v12.6.0"],["NVIDIAの推論基盤「TensorRT-LLM」v1.3.0、Rubin対応","NVIDIAのLLM推論ライブラリ「TensorRT-LLM」が、11月20日にv1.3.0を公開した。次世代GPU「Rubin」への対応をプレビューとして加え、Vera Rubinで動作を確かめたとしている。DeepSeek-V4、Kimi K3、Qwen3.5、MiniMax-M3、Gemma 4など多くのモデルに対応を広げた。投機的デコードの方式追加や、専門家混合モデルで最大2048個の専門家を扱えるようにするなど、性能面の強化も多い。","\n【概要】NVIDIAが開発する、大規模言語モデルを自社GPUで高速に動かすためのオープンソースライブラリ「TensorRT-LLM」が、11月20日にv1.3.0を公開した。新しいGPU世代への対応と、対応モデルの大幅な追加が柱になっている。\n【背景】TensorRT-LLMは、データセンターでLLMを提供する事業者や研究者が、推論の速さと効率を引き出すために使う。新しいモデルが出るたびに、そのモデル向けに最適化した処理を用意できるかが、実運用での採用を左右する。\n【詳細】NVIDIA Rubin（SM107）への対応がプレビューとして入り、Vera Rubinで検証済みとしている。Rubin上ではDeepSeek-V4とKimi K3にも対応した。Blackwellでは、DeepSeek-V4、Kimi K3（マルチモーダルと複数ノードでの提供を含む）、Qwen3.5、MiniMax-M3、GLM-5、GLM-5.2、Kimi-K2.5、Step-3.7-Flash、Gemma 4などに対応した。Mamba系を混ぜたモデルでは、プレフィックスのキャッシュが使えるようになった。性能面では、モデルごとに処理を融合して高速化し、Rubin上のNVFP4の専門家混合モデルでは、メモリーの読み書きを各GPUダイの中にとどめる仕組みを既定で有効にした。投機的デコードでは、DSpark、DFlash、Suffix Automaton、PARDといった下書き方式を加えた。専門家混合では、NCCL-EPの土台を加え、最大2048個の専門家を扱えるようにした。強化学習の訓練向けに、トークンごとの振り分け結果を返す機能も入った。\n【ポイント・注意点】Kimi K3でアテンションのデータ並列（DEP16）を使うには、GB300級のGPUメモリーが必要と明記されている。Rubin対応はまだプレビューの段階だ。KVキャッシュの管理方式V2が多くのモデルで既定になるなど、内部の既定値も動いているため、既存環境を更新する際は性能と出力を確かめてから切り替えたい。","2026-11-20","GitHub（NVIDIA/TensorRT-LLM）","https://github.com/NVIDIA/TensorRT-LLM/releases/tag/v1.3.0"],["シェル履歴「Atuin」18.25.0、設定の入口を一本化","シェルのコマンド履歴を賢く管理するツール「Atuin」が、11月20日に18.25.0を公開した。「atuin setup」を初期設定の正式な入口にし、メニュー操作も改善した。日時の処理を夏時間に対応したライブラリjiffへ移し、設定ファイルに未知の項目があれば警告するようになった。一方で、組み込みの「Atuin AI」エージェントは取り除かれた。Nushellのhelixモードでのキー割り当ても直した。","\n【概要】シェルで打ったコマンドの履歴を記録・検索・同期するオープンソースのツール「Atuin」が、11月20日に18.25.0を公開した。初期設定の入口の整理と、日時処理の作り替え、AI関連の機能の見直しが目立つ版だ。\n【背景】Atuinは、bashやzsh、fish、Nushellなどの標準の履歴を置き換え、実行時刻や場所、終了コードと一緒に記録して、あとから素早く探せるようにする。近年はAIエージェントとの連携や、チーム向けの機能も加わってきた。\n【詳細】新機能では、「atuin setup」をAtuinを設定する正式な方法と位置づけ、改良を重ねた。セットアップのメニューでは、矢印とチェックボックスを個別に選べるようにし、Enterで下位メニューを開閉できるようにした。シェルの初期化ファイルにあるコメントも無視するようになった。日時の扱いはjiffというライブラリに移し、夏時間を考慮したタイムゾーンを扱えるようにした。設定に知らない項目があると警告を出し、その設定を避ける。不具合修正では、Nushellのhelixモードでキー割り当てが効かない問題、Android上のTermuxで鍵ファイルを作れない問題などを直した。AI関連では、SKILL.mdの改行がCRLFでも読めるようにしたほか、チーム向けの機能でツール一覧のキャッシュを保つようにした。opencode 2へ処理を引き継ぐ部分も手直ししている。デーモンでは、検索索引の競合状態を直し、履歴を削除したときに索引をその場で更新して処理を軽くした。パイプで使ったときに疑似端末を起動しない修正も入った。\n【ポイント・注意点】今回、組み込みの「Atuin AI」エージェントが取り除かれた。AI機能はcrateのfeatureで切り替える形に整理されている。テーマの設定項目theme.max_depthとtheme.debugも削除されたため、これらを設定ファイルに書いている人は見直しが必要だ。README（説明書き）も、実際の画面のデモを中心にした構成に作り直された。","2026-11-20","GitHub（atuinsh/atuin）","https://github.com/atuinsh/atuin/releases/tag/v18.25.0"],["Codex 0.171.0、端末画面でプレビューと補助エージェント表示","OpenAIのコーディングエージェント「Codex」のCLIが、11月20日に0.171.0を公開した。モデル一覧にGPT-6.2のSolとAstraを加え、Solを既定の選択にした。端末画面（TUI）では、文書や画像のプレビュー、補助エージェントのやり取りを本体の会話と並べて見られる「ワークスペース」を既定で有効にした。既存のアプリサーバーにつないで非対話で動かす「codex exec --remote」も加わった。","\n【概要】OpenAIが開発するオープンソースのコーディングエージェント「Codex」のCLIが、11月20日に0.171.0を公開した。新しいモデルへの対応、端末画面の作業スペース、遠隔操作の管理など、使い勝手に関わる変更が多い版だ。\n【背景】Codexは端末の中でコードを読み書きするAIエージェントで、リリースは数日おきに出ている。今回の版は0.170.0に続くもので、リリースページには個々のプルリクエストを並べた詳しい変更履歴も載っている。\n【詳細】新機能として、モデル一覧にGPT-6.2のSolとAstraを追加し、Solを既定の選択にした。端末画面のワークスペースは既定で有効になり、検索できる文書プレビュー、画像プレビュー、補助エージェント（サブエージェント）の会話記録を、本体の会話と並べて表示できる。Vimモード以外の入力欄では、取り消しとやり直しのショートカットを設定でき、添付ファイルや大きな貼り付けも元に戻る。「codex exec --remote <ADDR>」で、既にあるアプリサーバー上で非対話のセッションを始めたり再開したりできる。「/rc」と「/remote」では、手元の遠隔操作を管理し、機器のペアリング用コードを表示できる。不具合修正では、セッションを切り替えたり再開したりしても、書きかけの入力や順番待ちの指示が元のスレッドに残るようにした。作業フォルダーを変えても権限の設定が保たれるようにし、遅れて届いた完了通知が新しいターンの承認を取り消す問題も直した。このほか、スクロール時に余計な文字が入る問題や、入力欄のカーソルが飛ぶ問題も直した。\n【ポイント・注意点】既定のモデル選択が変わるため、これまでのモデルを使い続けたい人は設定を確かめる必要がある。ワークスペースが既定で有効になったことで、補助エージェントが何をしているかを画面上で追いやすくなった。ソースからのビルドにはRust 1.99.1が使われるようになった点も、自分でビルドする人は注意したい。","2026-11-20","GitHub（openai/codex）","https://github.com/openai/codex/releases/tag/rust-v0.171.0"],["画像生成「InvokeAI」7.0ベータ2、ベクター描画を追加","画像生成アプリ「InvokeAI」が、11月20日に7.0.0のベータ2を公開した。約65件のプルリクエストを取り込み、多くはメモリー使用量、モデルの読み込み、LoRAなどの不具合修正だ。新機能として、キャンバスにベクターレイヤーと曲線の編集ツールが入り、ワークフローの一覧も作り直した。v7で既存のフォルダーを開くとデータベースが更新され、v6では開けなくなるため注意が呼びかけられている。","\n【概要】オープンソースの画像生成アプリ「InvokeAI」が、11月20日に次期大型版7.0.0のベータ2を公開した。ベータ1を試した利用者の報告を受けた修正が中心で、取り込んだプルリクエストは約65件にのぼる。\n【背景】InvokeAIは、Stable Diffusion系やFLUX系などの画像生成モデルを、キャンバス上での編集やノードを組むワークフローで扱えるアプリだ。7.0ではプロジェクト、作業台、新しいキャンバス、動画、ギャラリーなどを一新しており、現在はベータで試してもらう段階にある。\n【詳細】修正面では、メモリー不足で失敗した生成がGPUメモリーを抱えたままになる問題を直し、途中で終わったセッションはメモリーを返すようにした。大きなLoRAを当てると約5GBのVRAMが使えないまま残り、WindowsではVAEの処理が1分以上かかることがあった問題も解消した。動画モデルWan 2.2のシステムメモリー使用量も大きく減らした。新機能では、キャンバスにベクターレイヤーが加わった。四角形、楕円、星、多角形、手描きの図形を描き、新しい曲線編集ツールで制御点やハンドルを動かして形を整えられる。ワークフローの一覧は、サイドバーやタグでの絞り込み、最後に実行した順の並べ替え、実行の準備ができているかを示す印を備えた形に作り直した。FLUX.3では、プロンプトを学習時の説明文に近い形へ書き換える機能を生成画面から使えるようになった。変形ツールには、拡大縮小の補間方式（Bilinear、Bicubic、Hamming、Lanczos）の選択と、枠への合わせ方の選択も加わった。ComfyUI形式のfp8のチェックポイントが読み込み時にbf16へ展開され、メモリーを倍使っていた問題も直している。\n【ポイント・注意点】v7をv6の既存フォルダーで起動するとデータベースが一方向に更新され、v6では開けなくなる。試すときは新しい空のフォルダーを使うよう強く勧めている。誤って更新しても移行前にバックアップを取る仕組みがあり、戻し方も案内されている。ベータ版なので、大事な作品は別に保存しておきたい。","2026-11-20","GitHub（invoke-ai/InvokeAI）","https://github.com/invoke-ai/InvokeAI/releases/tag/v7.0.0-beta.2"],["GoogleのAgent開発キットADK 2.15.0、地図ツール追加","GoogleのAIエージェント開発キット「ADK」のPython版が、11月19日に2.15.0を公開した。Googleマップを使った住所の確認や、ストリートビュー画像の取得ができるツールを加えた。RAGの記憶検索は最大6倍速くなったとしている。評価では、何度か試して一度でも解けるかと、毎回確実に解けるかを分けて測れるようにした。一方、ADK Webから画面上でエージェントを組む機能を外した。","\n【概要】Googleが公開しているAIエージェント開発キット「Agent Development Kit（ADK）」のPython版が、11月19日に2.15.0を公開した。遅い道具や保存処理があっても応答を止めない工夫、評価方法の拡充、外部サービスとの連携追加が柱だ。\n【背景】ADKは、Geminiなどのモデルを使ったエージェントを組み、試し、本番に配置するまでを支える開発キットだ。エージェントを業務で使う場面が増えるなか、何度動かしても同じように成功するかという「信頼性」をどう測るかが課題になっている。\n【詳細】連携では、GoogleMapsToolsetを追加し、住所の検証、座標から住所への変換、ストリートビュー画像の取得をエージェントから直接行えるようにした。BigQueryのツールは、正確な表の名前を知らなくても、プロジェクトやデータセットを横断して関係する表を探せるようになった。セッション管理では、試験的な機能として、会話の記録をメモリーにためて裏でまとめて書き込む仕組みを加え、遅いデータベースが応答を遅らせないようにした。評価では、少なくとも一度解けるか（pass@k）と、毎回解けるか（pass^k）を区別して報告し、道具の呼び出しも引数ごとに部分点を付けられるようにした。実行環境では、利用者ごとやセッションごとにサンドボックスを分けられる。RAGの記憶検索は、APIクライアントを使い回すことで遅延を最大6倍縮めたという。音声のやり取りでは、道具の呼び出しを裏で動かすことで、遅い道具を使っている間も音声が途切れないようにした。gs://やs3://など複数の保存先を同じ仕組みで扱える成果物の保存機能も強化した。\n【ポイント・注意点】ADK Webから、画面上で部品をつないでエージェントを組む「Visual Agent Builder」が外された。コーディングエージェントと一緒に作る開発者が増え、利用が減ったためと説明している。この機能で作ったエージェントは標準の設定ファイル形式なので、引き続きadk webやadk deployで動かせる。","2026-11-19","GitHub（google/adk-python）","https://github.com/google/adk-python/releases/tag/v2.15.0"],["AIチャット「SillyTavern」1.19.1、安全性の修正で更新推奨","AIとの会話アプリ「SillyTavern」が、11月19日に1.19.1を公開した。セキュリティと堅牢性に関わる小さな修正版で、開発側は全員に更新を勧めている。チャットのメッセージやキャラクターの作者メモに含まれるstyleブロックの扱いを直し、細工されたキャラクターカードや取り込んだ会話、モデルの応答からアプリ内で処理が動かされるおそれを断った。詳しいセキュリティ情報は今後公開する。","\n【概要】ローカルで動かすAIチャットの画面として人気の「SillyTavern」が、11月19日に1.19.1を公開した。リリースノートは「セキュリティと堅牢性の修正を含む小さな修正版」とし、すべての利用者に更新を勧めている。\n【背景】SillyTavernは、さまざまなAIモデルにつないで、キャラクターとの対話やロールプレイを楽しむためのオープンソースのアプリだ。利用者どうしでキャラクターカードや会話記録をやり取りする文化があり、外から持ち込んだデータを安全に扱えるかが重要になる。\n【詳細】修正は3点ある。1つ目は、チャットのメッセージとキャラクターの作者メモ（クリエイターノート）に含まれるstyleブロックの扱いだ。これまでは、キャラクターカード、取り込んだ会話、あるいはモデルの応答に細工された内容が含まれていると、アプリの中でスクリプトが動かされるおそれがあった。2つ目は、CharX形式とBYAF形式のキャラクターを取り込む際、使えない名前のキャラクターだと付属のファイルがほかのキャラクターカードの隣に置かれ、それらを上書きしかねなかった問題だ。3つ目は、利用者のバックアップと削除の窓口が、実在しない利用者の指定を受け付けていた問題で、これも直した。styleブロックはチャット画面の見た目を整えるための記述で、今回の修正はその処理の隙を突かれないようにするものだ。CharXとBYAFは、キャラクターの情報と付属ファイルを一緒に扱う形式で、取り込み時の置き場所を誤ると既存のデータを壊しかねなかった。リリースノートの記述は短く、変更はこの3点に絞られている。\n【ポイント・注意点】特に1つ目は、配布されているキャラクターカードを読み込むだけで影響を受けうる種類の問題で、他人が作ったデータを日常的に取り込む人ほど早めの更新が望ましい。詳細を記したセキュリティ情報はこの版にあわせて公開するとしており、問題を報告した研究者への謝辞も添えられている。前の版1.19.0からの変更点の一覧も、リリースページから確かめられる。","2026-11-19","GitHub（SillyTavern/SillyTavern）","https://github.com/SillyTavern/SillyTavern/releases/tag/1.19.1"],["Javaの「Spring Boot」4.2.0公開、Pulsar対応は非推奨に","Javaのアプリ開発基盤「Spring Boot」が、11月19日に4.2.0を公開した。プロキシー経由の通信で付く転送ヘッダーの扱いを見直し、メッセージ基盤Apache Pulsarへの対応を非推奨にした。土台のSpring Framework 7.1.0をはじめ、Spring Data、Spring Batch、Hibernate、Jetty、Micrometerなど多くの依存ライブラリを新しい版に上げた。実行可能jarの読み込みエラーなども直した。","\n【概要】Javaでサーバー側のアプリを素早く作るための基盤「Spring Boot」が、11月19日に4.2.0を公開した。新機能は2項目と控えめだが、土台のSpring Framework 7.1.0への更新を含め、依存ライブラリを幅広く新しくした版だ。\n【背景】Spring Bootは、Javaのアプリ開発で使われる枠組みで、設定の手間を減らす「自動構成」を特徴とする。今回の4.2.0は、リリースノート上では新機能、不具合修正、文書、依存ライブラリの更新に分けて変更を示している。\n【詳細】新機能では、ロードバランサーなどを通るときに付く「転送ヘッダー」への対応を見直した。また、Apache Pulsarへの対応を非推奨とした。不具合修正では、4.0で名前が変わった一部の設定項目を、設定の移行支援機能が移し替えない問題を直した。実行可能jarで、同時に読み込みが起きたときなどに「Zip file closed」でクラスの読み込みに失敗する問題を2件修正した。Docker ComposeのJDBC URLでPostgreSQLのデータベース名がURLエンコードされない問題、AMQPやRabbitMQの接続先で%エンコードした値が正しく扱われない問題、SAML2のメタデータの生成に失敗する問題なども直した。自動構成されたGraphQLの窓口がHTTPのOPTIONS要求に応じない問題も解消している。依存ライブラリでは、Spring Framework 7.1.0、Spring Data 2026.1.0、Spring Batch 6.1.0、Spring AMQP 4.2.0、Hibernate 7.4.15、Jetty 12.1.15、Micrometer 1.18.0、OpenTelemetry 1.68.0などに上げた。\n【ポイント・注意点】修正の一つとして、転送ヘッダーの見直しの後にクラウド基盤上のリアクティブなWebサーバーが転送ヘッダーを使わなくなった問題も直されている。プロキシーの後ろで動かしている場合は、更新後に接続元の扱いを確かめたい。Pulsarを使っている人は、非推奨化を受けて今後の移行先を検討しておく必要がある。","2026-11-19","GitHub（spring-projects/spring-boot）","https://github.com/spring-projects/spring-boot/releases/tag/v4.2.0"],["webpack v5.113.0、SVGの圧縮やHTML連携を強化","JavaScriptのバンドラー「webpack」が、11月19日にv5.113.0を公開した。副作用のないCommonJSのモジュールを不要なら省けるよう扱いを改め、SVGを任意で圧縮できるようにした。HMR（変更の即時反映）では、プラグインが独自の更新データを足せるフックを加えた。ESM形式の出力では、Node.jsの組み込みモジュールをprocess.getBuiltinModule()で読み込むようにした。圧縮処理の改善も多数入っている。","\n【概要】Webフロントエンド開発で長く使われてきたバンドラー「webpack」が、11月19日にv5.113.0を公開した。機能追加にあたる「Minor Changes」の項目が数十件並ぶ、比較的大きな更新だ。\n【背景】webpackは、多数のJavaScriptやCSSのファイルを、ブラウザーで読み込みやすい形にまとめる道具だ。今もv5系のまま改良が続いており、今回の版も多くの変更を取り込んだ。今回はCSSやHTML、SVGといったJavaScript以外の資産の扱いにも手が入った。\n【詳細】純粋なCommonJSの書き出しや、純粋なモジュールのrequire()を副作用なしとして扱うようにし、使われないコードを省きやすくした。SVGの圧縮を任意で使えるようにし、XMLの値やHTMLのstyleの境界は保つ。HMRでは、プラグインが自前の更新データを加えられるupdateManifestフックを追加した。遅延コンパイルの仕組みには、開発サーバーが自分のサーバーから遅延コンパイルの裏方を配れるよう、通信を差し替えるフックを加えた。ESM形式の出力では、Node.jsの組み込みモジュールをprocess.getBuiltinModule()経由で読み込み、どの環境でも動く出力にできない場合は警告する。HTMLの要素のclassやidを、CSSモジュールで範囲を区切って扱えるようにした。複数の設定をまとめて動かすMultiCompilerのdoneフックは非同期になり、同期での呼び出しは非推奨になった。CSSの処理でもノードの置き換えや値の範囲の読み取りができるようになり、CSSの圧縮も速くなった。\n【ポイント・注意点】圧縮処理では、読まれない引数を落とす、Object.keysや.lengthを畳み込むなど、出力を小さくする改良が多数入った。一方で、JavascriptParser.extendが削除され、printer.load()も取り除かれるなど、プラグイン作者に影響する変更もある。独自のプラグインやローダーを使っている場合は、更新前に一覧を確かめておきたい。","2026-11-19","GitHub（webpack/webpack）","https://github.com/webpack/webpack/releases/tag/v5.113.0"],["AutoGPT Platform v0.12.0、登録を簡単にし新モデル追加","AIエージェント基盤「AutoGPT」が、11月19日にAutoGPT Platform v0.12.0を公開した。登録の手順を減らし、Googleで登録するとGmailやドライブ、カレンダーを同じ手順でつなげるようにした。ワークフローではGemini 4 Neon、GPT-6.2 Astra、GPT-6.2 Sol、Qwen 4 Maxを選べるようになった。一方、自前で運用する人向けに、接続元IPの扱いを変える互換性のない変更がある。","\n【概要】自律型AIエージェントの草分けとして知られる「AutoGPT」が、11月19日にAutoGPT Platform v0.12.0を公開した。使い始めの手軽さ、サインインの安全性、通信が途切れたときの信頼性を高めた版で、内部の非公開報告に基づくセキュリティ修正も含む。\n【背景】AutoGPTは現在、エージェントを組んで動かすための「プラットフォーム」として開発が進んでいる。対話の相手役「Otto」がワークフローを動かしたり、外部サービスにつないだりする作りで、クラウド版のほか自前で運用することもできる。\n【詳細】登録はパスワードの二度打ちをなくすなど手順を減らし、Googleで登録すればGmail、ドライブ、カレンダーを同じ手順でつなげる。新しいサインイン方法（Google、Microsoft、GitHub、Discord）を加えるときは、メールに届く6桁のコードが必要になり、追加のたびに通知も届く。Ottoに送ったメッセージが届いたか確かめられない場合は、ワンクリックで二重送信せずに送り直せる。接続が一時的に切れても、実行履歴やチャットが自動で追いつき、終わった実行が動いているように見える問題がなくなった。予定実行は、短い保守の間も消えずに「一時的に使えない」と表示され、再起動中に時刻が来た実行も一度だけ動く。モデルはGemini 4 Neon、GPT-6.2 Astra、GPT-6.2 Sol、Qwen 4 Maxが加わった。Ottoは新たにSupabaseやKlaviyoなどにつなげるようになった。非公開で報告された複数のセキュリティ上の問題も、この版で修正した。\n【ポイント・注意点】互換性のない変更として、フロントエンドがTRUST_X_FORWARDED_FORを読まなくなった。自前で運用し、この設定を手で入れている場合は、前段のプロキシーのアドレスをTRUSTED_PROXIESに列挙しないと、接続元IPを使うログやIPの遮断が働かない。開発中の機能として、スマホ向けアプリも紹介されている。","2026-11-19","GitHub（Significant-Gravitas/AutoGPT）","https://github.com/Significant-Gravitas/AutoGPT/releases/tag/autogpt-platform-beta-v0.12.0"],["端末AI「Crush」v0.102.0、指示文の差し替えに対応","端末で動くAIコーディング支援「Crush」が、11月19日にv0.102.0を公開した。主役の指示文（システムプロンプト）を、補助エージェントや計画、要約の分まで自分で差し替えられるようになった。MCPサーバーから会話へ出来事を流し込む試験的な仕組み「チャンネル」にも対応し、Claudeのチャンネルと同じ方式で動く。Nerd Fontsのアイコン表示や新テーマ、サーバー機能の堅牢化も入った。","\n【概要】ターミナル向けの道具で知られるCharmが開発するAIコーディング支援「Crush」が、11月19日にv0.102.0を公開した。リリースノートの見出しは「チャンネル、独自の指示文、サーバーの堅牢化」で、開発陣は「良いものがたくさん詰まった」版だとしている。\n【背景】Crushは端末の中で動くAIエージェントで、複数のモデルやMCPサーバーを使い分けられる。利用者が増えるにつれ、AIへの指示の中身を自分で調整したい、外の出来事に反応させたいといった要望が出ていた。\n【詳細】目玉は「BYO Prompts」で、主役のエージェントだけでなく、補助エージェント、計画、会話の要約、セッションの題名付け、crush initの指示文まで、好きな内容に差し替えられる。設定は全体の設定に書くことも、プロジェクトごとに上書きすることも、起動時の引数で指定することもできる。「チャンネル」は、MCPサーバーが出来事をその場でセッションに送り込める試験的な機能で、Claudeのチャンネルと同じ方式を使うため、既存のチャンネル用サーバーはそのまま動くはずだという。見た目では、ドラマ「ナイトライダー」に着想を得たKITTテーマやRosé Pineの各テーマが加わり、Nerd Fontsのアイコンを自動で判定して使うようになった。SSH越しに使う場合は、設定で明示的に有効にする必要がある。このほか、送信した指示は順番待ちになった時点ですぐ表示され、テーマを切り替えても会話全体を描き直さなくなった。子プロセスを残すコマンドで固まる問題も直った。\n【ポイント・注意点】そのほか、AIがsudoを使えるようになり、Touch IDで承認できる。内容による拒否は自動で再試行され、ツールを呼べないOllamaのモデルは一覧に出なくなった。クライアントとサーバーに分かれて動く方式は、特にWindowsで安全性と正確さを高めた。強力な権限を持つ「シスアドモード」は、yoloモードの1つ先に誤って入らないよう配置が変わった。","2026-11-19","GitHub（charmbracelet/crush）","https://github.com/charmbracelet/crush/releases/tag/v0.102.0"],["監視ツール「Netdata」v2.13.0、ブラウザー体験も計測","サーバー監視ツール「Netdata」が、11月19日にv2.13.0を公開した。Webサイトに小さなコードを入れると、実際の訪問者のページ表示やCore Web Vitals、JavaScriptのエラーを集める機能がプレビューとして入った。OpenTelemetryのトレースからサービスごとのグラフとサービスの関係図を作れるようになった。ハードウェア監視のIPMIはGo言語で書き直され、Linuxでの既定になった。","\n【概要】オープンソースのリアルタイム監視ツール「Netdata」が、11月19日にv2.13.0を公開した。リリースノートは、監視の範囲を「スタックの端と、アプリの奥」へ広げた版だと説明している。\n【背景】Netdataは、サーバーに入れるだけで多くの指標をグラフにできる監視ツールだ。前の版v2.12.0でOpenTelemetryのトレースと、OSの外側からのハードウェア監視に対応しており、今回はその流れをさらに進めた。\n【詳細】新しいプラグインdem.pluginがプレビューとして加わった。サイトに短いコードを貼ると、実際の訪問者のページ閲覧、Core Web Vitals、JavaScriptのエラーを受け取り、サイトごとにグラフ化し、警告も出す。セッションやエラーを後から調べる機能は、有料のNetdata Cloudのプランで使える。Playwrightを使った操作の自動試験やLighthouseの監査も早期提供として含む。トレースからは、サービスごとの要求数、エラー、所要時間、重要度別のログ量をグラフにし、どのサービスがどれを呼ぶかを示すサービスマップも作る。失敗した要求や遅い要求を探す検索欄も加わった。IPMIの監視は、Go言語で書き直したipmi.pluginがLinuxでの既定となり、ネットワーク越しの管理用コントローラーにも届く。新しい収集対象として、NVIDIA JetsonとCisco Merakiに対応した。WindowsとFreeBSDでは、Exchange、MSMQ、DNSサーバー、IIS、.NETなどの監視にも対応を広げた。\n【ポイント・注意点】IPMIは既存のグラフの名前と警告をそのまま引き継ぐので、従来のダッシュボードは使い続けられる。ただしエージェントはIPMIの実装を1つだけ起動し、収集に失敗しても自動では切り替えないと注意書きがある。旧来のFreeIPMI版を明示的に設定している環境は、その設定が維持される。ロボットや表示端末など、小さな機器向けの縮小版パッケージと運用の手引きも用意された。","2026-11-19","GitHub（netdata/netdata）","https://github.com/netdata/netdata/releases/tag/v2.13.0"],["Pythonの高速検査「Ruff」0.17.6、誤検知を減らす修正","Rust製のPython用コード検査・整形ツール「Ruff」が、11月19日に0.17.6を公開した。pyflakes由来の規則で、名前を2回以上代入したときに見逃していた問題を直し、pylint由来の規則では、ループ中に集合を変更する場合の誤検知を防いだ。試験的な機能として、型チェック用の文字列の和型を直す自動修正も加えた。ノートブックの読み込みやJSON出力の処理も速くした。","\n【概要】Pythonのコードの問題点を見つけ、整形もこなすツール「Ruff」が、11月19日に0.17.6を公開した。リリースノートは「2026-11-19公開」と明記しており、規則の精度を上げる修正と、処理の高速化が中心の小さな更新だ。\n【背景】RuffはRustで書かれたPython用の検査ツールだ。flake8、pyflakes、pylintなど既存ツールの規則を数多く取り込んでおり、それぞれの規則の誤検知や見逃しを減らす地道な手直しが続いている。\n【詳細】試験的な機能では、flake8-type-checking由来の規則TC010に、実行時の文字列による和型を直す自動修正を加えた。不具合修正では、かっこで囲んだ重複要素の扱い（B033、RUF068）を直した。pyflakes由来のF823では、名前が2回以上代入されたときに問題を見逃していたのを修正した。pylint由来のPLR1733とPLR1736では、ループ中に集合を変更する場合の誤検知を防いだ。RUF072の自動修正が、1行に書いたtry文で構文エラーを生む問題も直した。「.__future__」からの相対インポートは、通常のインポートとして扱うようにした。規則の変更では、SIM208の修正で余計なboolの包みを付けないようにし、F841では__traceback_hide__を未使用変数とみなさないようにした。今回の版には11人の貢献者が名を連ねている。シェルやPowerShell向けのインストール用スクリプトのほか、Windows、macOS、Linuxの各種CPU向けの実行ファイルも用意されている。\n【ポイント・注意点】性能面では、メモリー上のノートブックをソースの文字列から直接読み込むようにし、診断結果のJSONを出力先へ順次流すようにした。開発に使うRustのツールチェーンを1.100に上げ、ビルドに必要な最低版（MSRV）を1.98にした点は、Ruffを自分でビルドする人に関係する。各規則の説明ページには分類も表示されるようになった。","2026-11-19","GitHub（astral-sh/ruff）","https://github.com/astral-sh/ruff/releases/tag/0.17.6"],["AI会話アプリ「Cherry Studio」2.2.3、並べ替えを刷新","複数のAIモデルを使い分けられるデスクトップアプリ「Cherry Studio」が、11月19日にv2.2.3を公開した。会話の分類と並べ替えを独立させ、更新日時、作成日、名前、手動の順で並べられるようにした。エージェント機能では、DeepSeek v3の書き出しデータの取り込みや、次の指示の提案を加えた。コマンドの自動承認は、BashとPowerShellを共通の危険度の規則で判定し、危ない操作の前に確認を求める。","\n【概要】さまざまなAIモデルを1つの画面で使えるデスクトップアプリ「Cherry Studio」が、11月19日にv2.2.3を公開した。リリースノートの見出しは「会話の並べ替え、新しいモデル、エージェントの信頼性」で、Windows、macOS、Linux向けに配布している。\n【背景】Cherry Studioは、各社のAIのAPIや手元のモデルにつないで会話や作業をこなすオープンソースのアプリだ。最近はコマンドを実行するエージェント機能に力を入れており、便利さと安全性の両立が課題になっている。\n【詳細】会話の一覧では、分類と並べ替えを切り離し、最終更新日、作成日、名前（数字を自然な順で）、手動の順で並べられるようにした。これまでの手動の並びは保たれる。エージェントでは、DeepSeek v3から書き出した会話を、履歴や分岐、推論、検索記録ごと取り込めるようになった。返答の後には短い次の指示が提案され、Tabで採用、Escで消せる。提案は入力設定で切ることもできる。エージェント作成時に画像のアバターも設定できる。ファイルのプレビューでは、スライド資料をページ送りや拡大縮小付きで表示できるようになった。行番号付きのファイルパスやリンクから、該当行に飛んで強調表示する機能も加わった。チャットでは、Ctrlとマウスホイールで画面を拡大縮小でき、Ctrl+0で元に戻せる。知識ベースでは、URLの入力欄に複数のリンクを改行やカンマ、空白で区切ってまとめて入れられるようになり、無効なものは個別に知らせる。ファイル選択の画面は、直前に選んだファイルのフォルダーから開くようになった。\n【ポイント・注意点】コマンドの自動承認は、BashとPowerShellを共通の危険度の規則で解析し、危険なコマンドごとに確認を求める形に変わった。承認の画面には、依頼した作業、作業フォルダー、理由が表示される。どの規則にも当てはまらないコマンドは自動で実行されるため、従来の確認の出方に頼っていた人は権限の設定を見直すよう求められている。","2026-11-19","GitHub（CherryHQ/cherry-studio）","https://github.com/CherryHQ/cherry-studio/releases/tag/v2.2.3"],["Unsloth最新版、AMDのNPUでモデルを動かしやすく","AIモデルの学習・実行ツール「Unsloth」が、11月19日に「AMD NPU + video diffusion LoRA」と題した新版を公開した。手元で変換したQ4NX形式のモデルをAMDのNPUで読み込めるようになり、各モデルがNPUで動くかどうかも表示する。動画モデルLTX-2.5や画像モデルMOSS-ImageのLoRA学習にも対応し、拡散モデルのLoRA学習は1ステップあたり最大42%速くなったとしている。","\n【概要】大規模言語モデルの微調整を手軽に、速くすることで人気の「Unsloth」が、11月19日に新版（v0.1.920-beta）を公開した。題名のとおり、AMDのNPU（AI処理専用の回路）への対応強化と、動画・画像の拡散モデルのLoRA学習が柱になっている。\n【背景】Unslothは、少ないGPUメモリーでモデルを学習させる工夫で知られ、最近は学習だけでなく、手元でモデルを動かして会話するアプリとしての機能も増やしている。今回は、AMDのStrix Halo搭載機など、NVIDIA以外の環境での改善が目立つ。\n【詳細】リリースノートは、NPUはGPUに比べ、1トークンあたりの電力効率が2〜4倍高いとしている。書き出し画面で変換したQ4NX形式のモデルは、NPUのモデル一覧に「変換済み」と表示され、NPUで読み込めるようになった（文字のみ）。各モデルには、NPUで動く、変換すれば動く、動かない、といった印が付く。変換するとまともに動かないGGUFの量子化版は、変換を拒んで次の候補に移る。Strix Halo搭載のWindows機では、画像生成のFLUX.3 Kleinが1ステップあたり最大28%、Qwen-Image-2.1が最大23%速くなった。動画モデルLTX-2.5と画像モデルMOSS-ImageのLoRA学習に対応し、拡散モデルのLoRA学習は1ステップあたり最大42%速くなり、T4 GPUでも動くようになった。OpenAI互換のAPIやunsloth run、unsloth chatでは、アプリに表示されるNPUのモデル名をそのまま指定できるようになった。NPUのモデルを大きさや取得状況とともに一覧する「unsloth list-npu-models」も加わった。\n【ポイント・注意点】NVIDIAの動画モデルCosmos3のFP8版を読み込めるようになったほか、チャットの中で予定した作業を実行し、その結果を同じチャットに返す機能も加わった。NPU対応は文字のモデルに限られる点や、版番号にbetaが付いている点には留意したい。","2026-11-19","GitHub（unslothai/unsloth）","https://github.com/unslothai/unsloth/releases/tag/v0.1.920-beta"],["踏み台サーバー「JumpServer」v5.2.0、DB2などに対応","オープンソースの特権アクセス管理ツール「JumpServer」が、11月19日にv5.2.0を公開した。IBMのDB2への接続に対応し、ClickHouseではHTTPとネイティブの両方式で同じ資産へつなげるようにした。Redis Clusterを1つの窓口で扱えるプロキシーも加えた。デスクトップ版には手元で動くCodexの支援機能が入った。Web画面とデスクトップ版のログイン期限や自動ロックの管理も強化した。","\n【概要】サーバーやデータベースへの接続を一元管理し、操作を記録する「踏み台」型のツール「JumpServer」が、11月19日にv5.2.0を公開した。対応するデータベースの拡大と、ログインの有効期限まわりの安全性強化が中心だ。\n【背景】JumpServerは、管理者権限での接続を一か所に集めて、誰がいつ何をしたかを残すための特権アクセス管理（PAM）ツールで、オープンソース版と企業向けのEE版がある。多様なデータベースを扱う現場が増え、対応範囲の広さが選ばれる理由になっている。\n【詳細】新機能では、DB2への対応を加え、Web端末とネイティブのクライアントの両方から使えるようにした。ClickHouseは、同じ資産にHTTPとネイティブの2方式でつなげる。Redis Clusterには1つの窓口で済むプロキシーを用意し、ノードへの振り分けや転送にも対応した。SQL Serverでは、管理下のドメインアカウントを使い、NTLMv2とKerberosで認証できるようになった。Oracle、Dameng、OceanBase、DB2、ClickHouseなどでの作業の実行や、アカウントの自動管理も広げた。デスクトップ版には、手元で動くCodexの支援機能が加わった。Web画面では、ログインの有効期間を設定でき、操作があれば自動で延長し、全ページを閉じるとログアウトする。一定時間操作がなければ自動でロックし、パスワードで解除する。企業向けには、主アカウントと予備アカウントを交互に切り替えるアプリ用の資格情報の更新や、OceanBaseのMySQL互換・Oracle互換テナントへの対応も入った。\n【ポイント・注意点】安全面では、作業台の画面分割やSSH入力の一斉送信に加え、予定した作業を実行する時点でアクセス制御の方針を当てはめるようにした。デスクトップ版はHTTPS証明書の検証を既定で有効にした。一方、多段の承認の流れを図で組む機能や、Tencent Cloudのデータベースの同期などはEE版に限られる点に注意したい。","2026-11-19","GitHub（jumpserver/jumpserver）","https://github.com/jumpserver/jumpserver/releases/tag/v5.2.0"],["バックアップ「restic」0.20.0、復元時の安全性を修正","コマンドラインのバックアップツール「restic」が、11月19日に0.20.0を公開した。セキュリティ修正が2件あり、名前で所有者を復元する際に名前を解決できないと所有者がrootになってしまう問題と、細工したデータで復元先の外にファイルを書けてしまう問題を直した。pruneコマンドのJSON出力や、Backblaze B2の複数バケット用キーへの対応、メモリー使用量の削減なども入った。","\n【概要】暗号化と重複排除を備えたオープンソースのバックアップツール「restic」が、11月19日に0.20.0を公開した。変更履歴には、セキュリティ修正2件、不具合修正10件、改善10件などが重要度の順に並ぶ。\n【背景】resticは、手元のディスクやS3、Backblaze B2などさまざまな保存先に、暗号化したバックアップを効率よく残せるツールとして広く使われている。バックアップは「確実に、安全に戻せること」が何より重要で、今回はまさにその復元処理の安全性に手が入った。\n【詳細】1つ目のセキュリティ修正は、「--ownership-by-name」を付けて復元するときの問題だ。復元先で利用者やグループの名前を解決できないと、ファイルの所有者がUID/GIDの0、つまりrootになっていた。setuidやsetgidの属性も一緒に戻ると、意図せずroot権限で動くファイルができるおそれがあった。今後はスナップショットに記録した数値のIDを使い、警告を出す。2つ目は、同じ名前のシンボリックリンクとディレクトリを含む細工したデータで、復元先の外へファイルを書けてしまう問題で、名前の並びが正しくないデータの復元を拒むようにした。不具合修正では、壊れた鍵や設定ファイルで落ちないようにし、Swiftの保存先のパスワードがデバッグログに出ないようにした。読み込めないディレクトリの中のファイルを消さないようにする修正も入った。修復の機能も強化され、repair packsは欠けたパックファイルを扱えるようになり、repair snapshotsの--forgetは壊れたスナップショットを取り除く。\n【ポイント・注意点】改善点として、pruneコマンドのJSON出力、AWS S3のデュアルスタック接続を切る設定、B2の複数バケット用アプリケーションキーへの対応、メモリー上の索引の使用量削減が加わった。ビルドにはGo 1.26.10以上が必要になった。他人が作ったリポジトリから復元する機会がある人は、早めに更新しておきたい。","2026-11-19","GitHub（restic/restic）","https://github.com/restic/restic/releases/tag/v0.20.0"]],"gh-new":[["Frowse：ブラウザ操作エージェントのトークンを大幅に削るCLI","AIエージェントにブラウザを操作させるCLI「agent-browser」の差し替え品として作られた「Frowse」がShow HNに投稿された。ページ全体ではなく要約したDOMを返し、手元のCPUで動く小さなモデルで「検索ボタン」のような言葉から要素を特定する。作者の比較では、3つの作業の合計でトークン数が約74.5%減り、最も効いた作業では91.0%減った。npmとpipで入れられ、ライセンスはApache 2.0。","\n【概要】\n「Frowse」は、AIエージェントにWebブラウザを操作させるためのコマンドラインツールだ。既存の「agent-browser」と同じ使い方ができる差し替え品として作られている。Hacker NewsのShow HNには「エージェントのトークン消費を最大90%以上減らす」という題で投稿された。\n\n【背景】\nエージェントにブラウザを使わせると、ページの中身を毎回モデルに渡すため、文脈のトークンがすぐに膨らむ。トークンが増えれば費用も応答時間も増える。Frowseは、モデルに渡す情報そのものを小さくしてこの問題に取り組む。\n\n【詳細】\nFrowseは、ページのDOMを目印となる領域ごとにまとめ、重複を除いた短い要約にして返す。要素の指定には「Folate」という手元で動くモデルを使い、「frowse click \"Run Search button\"」のように自然な言葉で押す場所を指定できる。READMEによると、Folateは手元のCPUで10〜25ミリ秒で動き、メモリは250MB未満、APIの費用はかからない。常駐するセッションが、ヘッドレスのChromiumとONNX形式のモデルを温めたまま待機する。\n作者がagent-browser 0.43.0と比べた表では、Googleストアの作業が59,290トークンから15,154トークンに（74.4%減）、Hacker Newsの上位記事の作業が8,457から761に（91.0%減）、crates.ioの作業が6,773から3,096に（54.3%減）なった。3つの合計は74,520から19,011で、74.5%減だった。\n導入は「npm install -g frowse」か「pip install frowse」で、Python 3.10以上が必要になる。本体はPythonで書かれ、npmの包みが付く。ライセンスはApache 2.0。\n\n【ポイント・注意点】\n数値は作者自身の計測だ。見出しの「90%以上」は3つの作業のうち最もよく効いた例で、合計では約74.5%にとどまる。どの作業でもagent-browserより手順の数は多くなり、READMEも「小さな往復を増やして、文脈のトークンを減らす」取引だと説明している。ベンチマークに使ったのは0.1.0版で、まだ始まったばかりのプロジェクトだ。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50575434"],["ChronoStack：Docker Compose全体の時計を進めて試す","Docker Composeで組んだサービス群の時刻を、まとめて仮想的に先へ進める道具「ChronoStack」がShow HNに投稿された。PostgresやRedisとアプリの時計をそろえて進め、月末の請求や期限切れのような時間に左右される処理を走らせて確かめる。作者はSaleorやChatwootなど6つのSaaSで見つけた不具合の報告を載せている。Rust製のアルファ版で、ライセンスはApache-2.0かMITを選べる。","\n【概要】\n「ChronoStack」は、Docker Composeのスタック全体に仮想の時刻を与えるツールだ。READMEは自らを「Docker Compose版のStripe Test Clocks」と説明している。Show HNには「Docker Composeのスタックの時間を先へ進める」という題で投稿された。\n\n【背景】\n作者は、SaaSのアプリがスタック全体で時刻をどうそろえているのかに興味を持ったが、それを試す道具が見つからなかったと書いている。そこでClaude Codeを使ってRustで作った。試用期間の終わりや定期の請求のように、何日も先に起きる処理は、実時間を待っていては試せない。\n\n【詳細】\n仕組みの中心は、LD_PRELOADで読み込むCのライブラリだ。プログラムが時計を読むと、本当の時刻ではなく仮想の時刻を返す。時計を書き換えるのは「clockd」というコンテナだけで、時刻を進めるときは、トリガーとバリアで予定の処理を走らせる。\n試験の筋書きはYAMLで書く。HTTPのプロキシで外部サービスの障害を起こしたり、結果をJSONやMarkdownの報告にまとめたりできる。GitHub ActionとMCPサーバーも付く。READMEによると、時計を1回読むときの上乗せはCで約12〜16ナノ秒、PythonとNodeで約10〜26ナノ秒だ。不具合の報告先には、Saleor、Twenty、Chatwoot、Formbricks、tududi、Worklenzが並ぶ。\n本体はRustで書かれ、Cの差し込み部品とNodeのSDKが付く。curlかPowerShellのインストーラー、またはHomebrewで入れられる。最新は試験版のv0.1.0-alpha.7だ。\n\n【ポイント・注意点】\nREADMEはアルファ版だと明記している。時間は先へ進めるだけで、戻せない。アプリ自身のタイマーは前倒しで発火しないため、トリガーを用意する必要がある。Postgresのnow()は1つのトランザクションの中では変わらない。Goなどの静的リンクの実行ファイルには効かず、Apple SiliconのMacでコンテナを動かす場合は試されていない。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50575235"],["Agent Guard：だまされたAIエージェントの道具の呼び出しを縛る","AIエージェントが外部の文書などにだまされても、決められた範囲の外の操作をさせないための部品「Agent Guard」がShow HNに投稿された。アプリが使う道具を登録し、作業ごとに触ってよい資源を許可して、呼び出しを1か所の門番に通す。消す操作のような重い呼び出しは、その中身のまま人の承認を待たせられる。TypeScript製でNode.js 22以上が必要。ライセンスはApache-2.0。","\n【概要】\n「Agent Guard」は、AIエージェントが呼び出す道具（ツール）を許可の範囲で縛るTypeScriptの部品だ。Show HNには「だまされたときにAIエージェントができることを制限する」という題で投稿された。プロンプトインジェクションを見抜くのではなく、だまされても被害が広がらない作りを目指している。\n\n【背景】\nエージェントは、読み込んだWebページやメールに仕込まれた指示に従ってしまうことがある。仕込みを見抜く方法は完全ではない。そこで「何を読んでも、許された操作しかできない」ように外側で縛る、という考え方が出てくる。\n\n【詳細】\nアプリはまず使う道具を登録し、作業ごとに触ってよい資源を割り当てる。すべての呼び出しは1つのガードを通り、許可の外の呼び出しは実行されない。拒否されると「GRANT_DENIED」のような理由の符号が返る。削除のような破壊的な呼び出しは、引数まで固定した1回きりの承認を人に求めるようにできる。\nほかに、テナントの確認、宛先の数の制限、機微なデータの追跡がある。呼び出し回数、同時実行数、費用、期限の予算も設けられ、判断ごとに監査用のイベントを出せる。Anthropic、OpenAI、Gemini、Bedrock、Vercel AI SDK、LangChain、MCPなどに向けた変換部品も用意され、OWASPの「Agentic Top 10」の項目との対応表も載っている。\n導入は「npm install @shieldaai/agent-guard」。本体は第三者の実行時依存を持たない。動かすにはNode.js 22以上が必要で、現在の版は1.3.1。ライセンスはApache-2.0。\n\n【ポイント・注意点】\nREADMEは、プロンプトインジェクションや不審な振る舞いを検知しないこと、ガードを通らない操作は防げないこと、許可した処理そのものは隔離しないことをはっきり書いている。乗っ取られたホストも止められない。複数のプロセスで制限を共有する使い方には対応しておらず、「Agent Map」の機能は試験段階だ。導入では、道具を登録して許可を設計する手間がかかる。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50575068"],["StripeWorld：エージェント評価用の模擬Stripe API","Stripeの課金・決済APIの動きを、状態ごと手元で再現する模擬環境「StripeWorld」がShow HNに投稿された。1つのプロセスで多くの架空のStripeアカウントを動かし、変わったデータの行をすべて記録する。AIエージェントの評価、強化学習、試験に使うことを想定している。25の表にまたがる155の操作を再現し、公式のSDKやMCPの道具からも使える。Python製で、ライセンスはMIT。","\n【概要】\n「StripeWorld」は、Stripeの「Billing」と「Payments」のAPIを、状態を持つ形で再現した模擬環境だ。READMEは「エージェントの評価、強化学習、試験のための、状態を持つStripeのサンドボックス」と説明している。Show HNには「強化学習と試験のための合成のStripe API」という題で投稿された。\n\n【背景】\n決済を扱うエージェントを本物のStripeで試すと、手間がかかり、毎回同じ条件を作るのも難しい。既存の「stripe-mock」は状態を持たないため、顧客や請求書が積み重なっていく流れは試せない。StripeWorldは、出発点の状態を決めて、何度でも同じ条件から始められるようにした。\n\n【詳細】\n再現するのは、25の表にまたがる155のAPI操作で、APIの版は「2026-08-26.dahlia」に固定されている。1つのプロセスで多くの独立したアカウントを動かせて、HTTPサーバーは既定で100アカウントを保持する。アカウントごとに出発点の状態を選べ、変わった行はすべて記録される。\nつなぎ方は3つある。Stripe公式のMCPサーバーの10個の道具のうち8個、公式SDKの接続先を向けられるHTTPのAPI、強化学習の仕組みに向けたOpenEnvだ。出発点の状態は固めて再生でき、顧客45人の「small_co」と、18か月分で約380人の「big_co」が用意されている。\nPythonで書かれ、インスタンスごとにSQLiteを使う。git cloneのあと「uv sync」で導入でき、Hugging Face Spacesに公開版もある。ライセンスはMITで、Stripeとは関係がない。\n\n【ポイント・注意点】\nREADMEは、StripeのAPIすべてではなく、課金と決済の中心部分だけを扱うと明記している。Webhookの配信には対応しておらず、イベントは問い合わせて取り出す。再現していない部分では、本物のStripeと同じ動きは保証されない。項目の名前は、MITライセンスで公開されたStripeのOpenAPI仕様から借りている。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50574834"],["zancudo：Zigで手書きした趣味のMQTTブローカー","プログラミング言語Zigで書かれたMQTT 3.1.1のブローカー「zancudo」がShow HNに投稿された。作者は、AIを多用する仕事と離れて、手でコードを書く楽しさを取り戻したかったと書いている。コードの98%は手書きだという。ワイルドカード付きのトピック、保持メッセージ、QoS 1と2などの機能を挙げ、EclipseのPahoの試験を通ると説明する。今のところLinux専用だ。","\n【概要】\n「zancudo」は、Zigで書かれたMQTT 3.1.1のブローカーだ。Show HNには「Zigで書いた趣味のMQTT 3.1.1ブローカー」という素直な題で投稿された。READMEによると、コードの98%は作者が手で書いた。\n\n【背景】\n作者はHacker Newsの投稿で、手でコードを書くことが恋しくなり、AIを多用する仕事よりもその方が楽しいと述べている。自分の農場の作業を自動化している最中で、以前から触りたかったZigをこのブローカーとSTM32の素のマイコンの作業に使い、楽しかったという。MQTTは、センサーや家電のような小さな機器がメッセージをやり取りするための軽い通信の約束事だ。\n\n【詳細】\nREADMEに並ぶ機能は、接続とその応答、生存確認（間隔の1.5倍で切断）、切断時に送る遺言メッセージ、「+」と「#」のワイルドカードを扱うトピックの木、保持メッセージ、QoS 1とQoS 2、使い捨てと持続のセッション、オフラインの相手に向けたメッセージの待ち行列だ。EclipseのPahoのMQTT 3.1.1のクライアント向け試験を通ると書かれ、CIでも試験を回している。\n作りは単一のスレッドで、Linuxのepollを使い、多くの接続を1本のスレッドでさばく。リポジトリには180のコミットがあり、ビルドの設定はZig標準のbuild.zigで書かれている。小さな機器が集まる農場の自動化という作者自身の用途から生まれた点が、この作品の出発点になっている。\n\n【ポイント・注意点】\nREADMEには「今のところLinuxでしか動かない」とある。今後ほしいものとして、MQTT 5、macOS向けのkqueue、再起動をまたいだセッションと待ち行列の保存、Bitcask風のキーバリュー保存、認証が挙がっている。取得したページからは、どの項目が済んでいるかまでは読み取れなかった。ライセンスのファイルは見当たらず、導入の手順もまだ書かれていない。名前のとおり趣味の作品で、本番用ではない。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50574626"],["DynoCap：MacでAIエージェント用の使い捨てLinux仮想機械","Appleの仮想化の仕組みの上で、隔離したLinuxを立ち上げてコマンドを実行し、終わったら片付けるCLI「DynoCap」がShow HNに投稿された。標準ではネットワークもホストのファイルも見えない。リポジトリを複製して作業させ、確かめた差分だけを取り出す使い方ができる。作者の計測では起動から実行までが中央値299ミリ秒だった。動くのはApple Silicon搭載のMacだけ。","\n【概要】\n「DynoCap」は、macOSでAIエージェントのための使い捨てLinux仮想機械を作るコマンドラインツールだ。Show HNには「Apple Virtualization.frameworkの上の、速く安全でオフラインのVM」と紹介されて投稿された。1つの「dynocap」コマンドで、起動、実行、片付けまでを済ませる。\n\n【背景】\nコーディングエージェントに任意のコマンドを打たせると、手元のファイルを壊したり秘密を外へ送ったりするおそれがある。コンテナより強い隔離がほしい一方で、重い仮想機械を毎回立ち上げるのは遅い。DynoCapは、Mac標準の仮想化の仕組みでこの両方を満たそうとしている。\n\n【詳細】\n標準のゲストには仮想のネットワークカードがなく、ホストのファイルもつながっていない。外とつなぐ場合だけ「--network nat」や「--network filtered」を指定する。サンドボックスには寿命があり、既定は1800秒、上限は86400秒。プロジェクト用のサンドボックスはディレクトリやリポジトリを複製してコマンドを実行し、「finish」で差分のパッチと記録を書き出してから自分を消す。結果は7日間残る。SDK、MCPサーバー、エージェント用のスキルも付く。\n作者が2026年11月13日に計った中央値では、「dynocap run」が299ミリ秒、387ファイルのこのリポジトリの複製が989ミリ秒、差分の取り出しが882ミリ秒だった。本体はSwift、ゲスト側の部品はGoで書かれている。Homebrewかインストール用スクリプトで入れられる。ライセンスはApache-2.0。\n\n【ポイント・注意点】\nこの版はApple Silicon専用で、Intel Macでは動かない。実行ファイルはDeveloper IDで署名されていない。NATのモードは行き先を絞らない。スリープからの復帰には対応しておらず、寿命の時刻もぴったりには守られない。ホストとゲストをつなぐ通信路には認証がなく、READMEは「1人の利用者が1台で使う」前提だと説明している。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50573883"],["Depth Pro 2のONNX・TensorRT版とROS 2部品","Appleの単眼深度推定モデル「Depth Pro 2」を、ONNXとTensorRTに書き出し、ROS 2のノードも付けた非公式の移植がShow HNに投稿された。カメラの焦点距離を推定する部分を外した版も用意している。作者の計測では、RTX 3090上でTensorRTのFP16を使い、480×640の画像を278FPS（3.6ミリ秒）で処理できた。重みはAppleのライセンスで、商用には使えない。","\n【概要】\n「depthpro2-onnx」は、Appleの深度推定モデル「Depth Pro 2」のSとBの大きさを、ONNXとTensorRTの形式に移したものだ。ROS 2のノードも付いている。Show HNには「RTX 3090で278FPS」という題で投稿された。READMEは非公式の移植だと明記している。\n\n【背景】\n作者は、SO-101というロボットでAppleの深度モデルを使いたかったが、焦点距離を推定する部分は要らなかったと書いている。カメラの焦点距離が分かっているロボットでは、その部分を省けば軽く速くなる。そこで、焦点距離を入力として受け取る版と、写真から推定する版の2つを用意した。\n\n【詳細】\n焦点距離なしの版は、画像と焦点距離（f_px）を受け取り、メートル単位の深度を返す。焦点距離ありの版には、2350万パラメータの焦点推定ネットワークが加わる。その推定のずれは、部屋の大きさを撮るロボットのカメラで3.4%、グリッパーの接写で17%だった。\nRTX 3090で480×640の画像を処理した結果は、焦点距離なしのSがTensorRTのFP16で3.6ミリ秒（278FPS）、使うVRAMは480MB、ファイルは56MBだった。Bは7.1ミリ秒（140FPS）、比較用のPyTorchのBF16ではSが10.3ミリ秒（97FPS）だった。Jetson向けのTensorRTの構築手順と、Hugging Faceに置いた重みも用意されている。リポジトリはuvで管理するPythonのプロジェクトだ。\n\n【ポイント・注意点】\nTensorRTに「--fp16」を付けて変換すると深度がすべてNaNになるため、READMEは「--stronglyTyped」で作ったエンジンを使うよう求めている。動的なINT8量子化では深度が崩れる。重みだけのINT8はFP32の38%の大きさで精度を保てるが、速くはならない。コードはApache-2.0だが、重みはAppleのモデルライセンスに従い、使えるのは非商用の研究目的に限られる。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50573575"],["Eccles-WASM：マイコンでWebAssemblyを動かすC99実行系","ESP32、STM32、RP2040などのマイコンで、同じWebAssemblyの実行ファイルを動かすための実行系「Eccles-WASM」がShow HNに投稿された。ヒープを使わず1つの領域だけで動くC99の解釈系で、許可されるまでハードウェアに触れない作りだ。作者がESP32で43の処理を比べた結果では、ネイティブ比の遅さが10.4倍で、wasm3の20.5倍より速かった。依存なしで、ライセンスはMIT。","\n【概要】\n「Eccles-WASM」は、マイコン向けのWebAssembly実行系だ。READMEは「同じ.wasmをESP32、STM32、RP2040、Zephyr、Arduinoで動かす」とうたう。Show HNには「ヒープを使わないマイコン向けのC99のWebAssembly実行系」という題で投稿された。\n\n【背景】\nマイコンのプログラムは、チップごとに書き直したり組み立て直したりする手間が多い。WebAssemblyを使えば、1つのバイナリを複数のチップで動かせる見込みがある。ただし、メモリが数十KBしかない機器では、実行系そのものの軽さと安全性が問われる。\n\n【詳細】\n本体は「eccles_wasm.h」と「eccles_wasm.c」の2ファイルで、依存のない素のC99で書かれている。メモリは最初に確保した1つの領域だけを使い、固定の上乗せは約1.4KBだ。19KBのモジュールは、ESP32の96KBの領域に収まる。ハードウェアへの操作は、許可を与えるまですべて拒否される。メモリの範囲検査と、実行量の上限（燃料）もある。読み込みは少しずつ流し込む方式で、ハードウェアを扱うAPIはチップをまたいで共通になっている。\n作者がESP32（160MHz）で43の処理を比べた結果は、ネイティブに比べた遅さが10.4倍で、wasm3は20.5倍だった。43の処理すべてで速かったという。ESP32での4186項目の適合試験はすべて通り、Nodeとの差分を突き合わせる試験では912のモジュール、17,465回の呼び出しで食い違いは0件だった。導入はgit cloneのあと「make examples」で、ライセンスはMIT。\n\n【ポイント・注意点】\nパソコン上ではwasm3の方が1.4倍速く、READMEは自分のチップで測るよう勧めている。SIMD、例外処理、GC、複数のメモリ、64ビットのメモリには対応していない。Pico、STM32、Zephyr向けの部品は、組み立てが通ることを確かめただけだ。リポジトリはまだ始まったばかりで、コミットは6つにとどまる。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50573241"],["MacVisor TPM：Macの仮想機械に仮想TPMを足す部品","macOSの仮想機械に、TPM 2.0を仮想で用意するSwiftのパッケージ「MacVisor TPM」がShow HNに投稿された。Appleの仮想化の仕組みで動くWindows 11やLinuxのゲストに、仮想のTPMを渡すために作られた。中身はlibtpmsとOpenSSLを静的に組み込み、小さなSwiftのAPIで包んだものだ。対象はApple Siliconで、macOS 15以降に限られる。パッケージのコードはMITライセンス。","\n【概要】\n「MacVisor TPM」は、macOS上の仮想機械にTPM 2.0の機能を与えるSwiftのパッケージだ。Show HNには「AppleのVirtualization.frameworkの下で動く仮想TPM」という題で投稿された。仮想化ソフト「MacVisor」が、ゲストに仮想のTPMを渡すために使っている。\n\n【背景】\nTPMは、鍵の保管や起動の検証に使われるセキュリティ用の部品だ。Windows 11はTPM 2.0を求めるため、仮想機械で動かすにも仮想のTPMが必要になる。AppleのVirtualization.frameworkは、そのままではこれを用意しない。\n\n【詳細】\n中身は、TPMの実装であるlibtpmsと、OpenSSLのlibcryptoだ。どちらも公開版の元のコードから静的に組み立て、小さなSwiftのAPIの裏に置いている。APIは「TPMEngine.shared」「start」「process」「volatileState」「stop」などで、呼び出す側は起動のたびにTPM2_Startupの命令を送る必要がある。\n新しく作るTPMにはlibtpmsの「default-v1」の設定を使う。この設定を固定しておくことで、libtpmsが新しくなっても振る舞いが変わらない。MacVisor本体は、TPMの状態をSecure Enclaveの鍵で暗号化して保存している。使う版は、OpenSSLが長期サポートの3.5、libtpmsが0.10だ。\n組み立てには、同梱のスクリプトでxcframeworkを作る。XcodeのコマンドラインツールとautoconfやautomakeなどのGNUの道具が要る。\n\n【ポイント・注意点】\n対応はTPM 2.0、arm64、macOS 15以降に限られる。libtpmsが全体で1つの状態を持つため、1つのプロセスで動かせるTPMは1つだけだ。パッケージのコードはMITだが、組み立てたライブラリにはlibtpms（BSDなど）やOpenSSL（Apache-2.0）の条件も付く。リポジトリはコミットが6つと始まったばかりで、速さの計測は載っていない。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50572172"],["MCP-CrashTest：MCPサーバーの約束破りを探す試験道具","MCPサーバーに、道具の呼び出しを何段もつなげた無作為の試験を浴びせ、約束違反を探す道具「MCP-CrashTest」がShow HNに投稿された。道具の一覧から依存関係を読み取り、サンドボックスの中で試し、見つけた問題は最小の再現手順として出力する。作者が公式のSQLite用サーバーを試したところ、重大なプロトコル違反が3件見つかった。Python製で、ライセンスはMIT。","\n【概要】\n「MCP-CrashTest」は、AIエージェントが道具を使うための約束事「MCP」のサーバーを試験する道具だ。Show HNには「MCPサーバー向けの、複数段で状態を持つ契約のファジング」という題で投稿された。1回の呼び出しではなく、続けて呼び出したときの食い違いを狙う。\n\n【背景】\nMCPサーバーは、エージェントに道具を渡す入り口として急速に増えている。ただ、1つずつの呼び出しは正しくても、続けて使うと状態が崩れたり、失敗を成功と返したりすることがある。こうした問題は、手で書いた試験では見落とされやすい。\n\n【詳細】\n道具は、サーバーの道具の一覧から依存の図を作り、それに沿って呼び出しを無作為につなげる。試験はサンドボックスの中で行い、失敗すると状態を巻き戻す。問題が見つかると、それを再現できる最小のJSON-RPCの手順を出力する。探すのは、SQLのエラーなのに「isError: false」を返すようなプロトコル違反や、道具をまたいだ約束の破れだ。\n公式のsqlite、git、filesystem、memoryのサーバー向けの設定が用意され、汎用のモードもある。報告はMarkdownで、CI向けに、壊れたら失敗を返すフラグも付く。\n作者が2026年11月20日に0.2.1版で行った監査では、mcp-server-sqliteで重大なプロトコル違反が3件、mcp-server-gitで重い型の破れが4件見つかった。server-filesystemでは中程度の問題が4件、server-memoryでは軽い問題が3件だった。導入はuvxで直接起動する方法と、元のコードから入れる方法がある。\n\n【ポイント・注意点】\n対応する通信方式は標準入出力だけで、HTTPやSSEはこれからだ。巻き戻せるのはディスク上の状態だけで、プロセスの中のメモリは戻らない。sqlite用の設定は、上流のサーバーがmcp 2.xで起動しないため、2未満に固定している。コミットは2つと始まったばかりのプロジェクトだ。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50571498"],["Xinproof：DBのバックアップを実際に戻して署名付き証明","データベースのバックアップを使い捨てのDockerコンテナへ実際に戻し、本当に復元できるかを確かめる道具「Xinproof」がShow HNに投稿された。確かめた結果は、Ed25519で署名し、前の結果と鎖でつないだ「受領書」として残す。PostgreSQL、MySQL、MariaDB、MongoDBに対応し、作者の計測では8.8GBのデータベースを2分24秒で検証できた。Go製で、ライセンスはApache-2.0。","\n【概要】\n「Xinproof」は、データベースのバックアップを復元して試し、その結果を署名付きの受領書として残す道具だ。Show HNには「データベースのバックアップを復元して試し、署名付きの受領書を得る」という題で投稿された。\n\n【背景】\nバックアップは取っていても、いざ戻そうとしたら壊れていた、というのはよくある失敗だ。本当に戻せるかは、実際に戻してみないと分からない。Xinproofはこの確認を自動にし、確認した事実を後から検証できる形で残す。\n\n【詳細】\nバックアップを使い捨てのDockerコンテナへ戻し、整合性の検査、復元、表ごとの行数の監査、索引の検査を行う。索引の検査には、PostgresではamcheckをMySQLではCHECK TABLEを使う。スキーマのハッシュを取り、独自のSQLの検査を足すこともできる。受領書はEd25519で署名され、前の受領書とハッシュの鎖でつながる。中身は表の名前と行数だけで、行のデータは入らない。\n対応する形式は、PostgreSQL 13〜18のダンプ、MySQL 8.0/8.4とMariaDB 10.11/11.4のダンプ、MongoDBのアーカイブだ。保存先は手元のほか、S3、R2、Azure、GCSに対応する。READMEによると、5700万行、8.8GBのPostgreSQL 16（ダンプは690MB）の検証は、メモリ4GBとCPU4つの指定で2分24秒、既定の設定で3分9秒だった。CLI自体のメモリは約45MB。Goで書かれ、実行ファイルとDockerイメージで配られている。\n\n【ポイント・注意点】\nREADMEは、0.2.0の公開前の版だと明記している。Dockerが必要で、コンテナにはホストのDockerソケットを渡す。Windowsでは、WSL2を使うDocker Desktopが要る。復元はネットワークなしで行うため、サンドボックスのイメージにない拡張を使うダンプは、失敗ではなくエラーとして報告される。MongoDBでは索引の検査を省く。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50571398"],["BSWorld：Bluetoothの機器なしでコードを試すシャオミの環境","シャオミ（Xiaomi）が、Bluetoothの実機を使わずにホスト側のコードやアプリを試せるシミュレーション環境「BSWorld」を公開し、Show HNに投稿された。Zephyr、NuttX、BlueZなど6種類のBluetoothスタックを同時に動かし、同じ模擬の電波空間でつなげる。AIエージェントやCIからpytestで試験を回す使い方を想定している。Linux専用で、ライセンスはApache-2.0。","\n【概要】\n「BSWorld」は、Bluetoothのホストやアプリを、実機なしでLinux上で試験するためのシミュレーション環境だ。シャオミのGitHubから公開され、Show HNには「AIエージェントが機器なしでBluetoothのコードを試せる」という題で投稿された。試験はpytestで書く。\n\n【背景】\nBluetoothの開発では、相手の機器を手元にそろえ、電波の状態に左右されながら試験することが多い。同じ失敗を2度起こすのも難しい。AIエージェントにコードを直させるときも、実機がないと動作を確かめられない。BSWorldは、模擬の電波と共通の時計を使い、毎回同じ結果になる試験を目指している。\n\n【詳細】\n各ホストはH4 HCIでBSControllerにつながり、BabbleSimの模擬の電波空間を共有する。Zephyr、NuttX、NimBLE、BlueZ、Bumble、Troubleを同時に動かせて、複数の機器が1つのシミュレーションの時計に合わせて動く。pytest-xdistで複数の試験を並べて回せる。経路の減衰を設定したり、混信やWLANの通信を加えたり、記録した電波を再生したりもできる。結果として、ログ、BTSnoopの記録、コントローラーごとの電波の記録、Ellisys形式の記録が残る。\n動作にはPython 3.12以上が要る。Dockerの公開イメージを使う方法と、Linux上でBabbleSimなどを組み立てる方法が用意されている。ライセンスはApache-2.0。リポジトリの紹介文は「実時間の数百倍まで速くなる」としている。\n\n【ポイント・注意点】\nREADMEが動作環境に挙げるのはLinux（x86_64）だけだ。毎回同じ結果になるのは、同じ実行ファイル、同じ入力、制御された乱数がそろったときに限られる。外部のネットワークや実時間に頼るサービスがあると、結果がぶれることがある。試験の時間切れは実時間ではなくシミュレーションの時間で数える。「数百倍速い」の具体的な計測値は、READMEには載っていない。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50570766"],["citeparse：参考文献を読み取り作り話の引用に印を付ける","論文の参考文献の文字列を、手元のCPUで動く小さなモデルで構造化データに変え、実在しない引用に印を付ける道具「citeparse」がShow HNに投稿された。AIが作り話の文献を混ぜる問題を意識した機能だ。作者の試験では、偽の文献83件のうち80件を「見つからない」と判定した。1件あたりの処理はCPUで約118件/秒と速い。Python製で、コードとモデルはApache-2.0。","\n【概要】\n「citeparse」は、参考文献の一覧を読み取って、著者、題名、掲載誌、DOI、ページなどの項目に分ける道具だ。結果はCSL-JSONかBibTeXで出す。別の「citeparse check」コマンドは、実在する著作を指していない引用に印を付ける。Show HNには「参考文献を解析し、作り話の引用をCPUで見つける」という題で投稿された。\n\n【背景】\n生成AIが書いた文章には、もっともらしい架空の文献が紛れ込むことがある。参考文献を項目に分ける作業は、従来はGROBIDのような道具が担ってきた。citeparseは、小さなモデルで手元で速く処理しつつ、実在の確認までを1つの道具で行う。\n\n【詳細】\n既定のモデルは3200万パラメータの「citeparse-32m」で、より大きな「citeparse-150m」もある。どちらもHugging Faceで公開されている。Crossrefの700件の文献での評価では、項目が正しく取れた割合が0.939と0.952、文献全体が完全に正しかった割合が80.3%と83.4%だった。比較したGROBID 0.8.1は0.911と71.1%だった。CPUの8スレッドで、32mは毎秒約118件、150mは毎秒約20件を処理する。\n実在の確認の試験では、DOIを除いた本物の文献100件のうち89件が確認でき、11件が見つからず、誤って偽物扱いしたものは0件だった。偽の文献83件では、80件が見つからないと判定された。CLI、PythonのAPI、MCPで使え、導入は「pip install citeparse」だ。\n\n【ポイント・注意点】\nREADMEは、「見つからない」は手で調べるきっかけであって、偽物の証明ではないと注意している。GROBID自身の評価用データでは、まだGROBIDの方が高い点を取る。OpenAlexの鍵がないと、無料で確認できる量は少ない。公開されているMCPサーバーは、数回の無料の確認のあとは有料になる。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50569470"],["SSH OS：1987年のMacintosh SEをSSH専用機にするOS","1987年のMacintosh SEのために一から書かれた、SSHの端末として使うだけのOS「SSH OS」がShow HNに投稿された。System 6は使わず、BlueSCSIから起動してWi-Fiにつなぎ、SSHでログインする。8MHzの68000では暗号の計算が重く、ログインに約1分かかったため、計算をBlueSCSIのファームウェアに任せる工夫を加えた。C製で、ライセンスはMIT。","\n【概要】\n「SSH OS」は、Macintosh SEで動く、SSHの端末になることだけを目的にした自作のOSだ。READMEは「一から書いた単一目的のOS」と説明している。Show HNには「1987年のMacintosh SE向けのSSH専用OS」という題で投稿された。\n\n【背景】\n作者の説明では、System 6の上で動くアプリではなく、AppleのROMがディスクからこのOSのカーネルを直接読み込む。昔のMacで今のサーバーにつなぐには、今の暗号を古いCPUで計算しなければならない。8MHzの68000には、これが大きな負担になる。\n\n【詳細】\n起動はSDカードの機器であるBlueSCSIから行い、Wi-Fiにつないで、鍵かパスワードでSSHにログインする。暗号はCurve25519、Ed25519、ChaCha20-Poly1305を素のCで実装している。端末はxterm風で、85×32文字を表示する。ARP、IP、UDP、DHCP、DNS、TCPのネットワークの層も自前で持ち、設定はFAT16のディスクに置く。\n作者によると、8MHzの68000では暗号の計算1回に12〜20秒、ログイン全体で約1分かかり、通信も毎秒約7KBにとどまった。そこで、SCSIの独自命令で計算をBlueSCSIのファームウェアに任せる仕組みを加え、使えない場合は元の計算に戻すようにした。画面全体の描き直しも遅かったため、スクロールを見分けて画素をずらす方式に変えた。導入は、配布の3つのディスク像をSDカードに写してBlueSCSIに差す。ハードウェアの試験画面も備え、READMEによるとエミュレーターと実機の両方で試されている。\n\n【ポイント・注意点】\n対象はFDHD ROMと4MBのメモリを積んだMacintosh SEの1機種だけだ。色は出ず、キーボードは米国配列のみ。乱数は入力や通信のタイミングから集めるため、強さは劣る。速くするファームウェアは、Pico Wを積んだBlueSCSI v2向けで、Pico 2 Wでは使えない。","2026-11-20","Hacker News（Show HN）","https://news.ycombinator.com/item?id=50569129"],["Bot-inator：自分で道具を書いて隔離して動かすMacの助手","Macの上での出来事を見守り、手伝えることを見つけると、操作や小さな道具を自分で書いて提案するエージェント「Bot-inator」がShow HNに投稿された。ダウンロードやメール、会議、アプリの切り替えなどをきっかけに、メニューバーにカードで提案を出す。承認なしには何も実行せず、作った道具はmacOSのサンドボックスの中で動かす。手元のモデルで動き、ライセンスはMIT。","\n【概要】\n「Bot-inator」は、手元で動くことを重んじたmacOS向けのAIエージェントだ。Show HNには「自分で道具を書き、サンドボックスで動かすMacのエージェント」という題で投稿された。気づいたことを、メニューバーのカードで提案してくる。\n\n【背景】\nAIの助手は、頼まれたことに答えるだけでなく、自分から手伝えることを見つける方向へ広がっている。ただ、勝手に動く仕組みや、自分でコードを書いて実行する仕組みは、安全の心配が大きい。Bot-inatorは、提案と承認を分け、実行を隔離する作りでこれに応えようとしている。\n\n【詳細】\n見守る対象は、ダウンロードフォルダーの新しいファイル、メール、iMessage、会議、アプリの切り替えなどだ。出来事があると、LLMにどう手伝えるかを尋ね、その場の操作や、自分で書いた小さな道具を提案する。\n作った道具は、入れる
